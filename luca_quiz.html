<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="quiz.luca.title">Quanto conosci Luca Gandolfi?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-900: #0a1628;
            --bg-800: #1a2940;
            --accent: #00d4ff;
            --text-main: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-900), var(--bg-800));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            color: var(--accent);
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-number {
            text-align: center;
            margin-bottom: 15px;
            color: #a0c0e0;
            font-size: 0.9rem;
        }
        .question {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
        }
        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .answer-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            text-align: left;
            font-family: inherit;
        }
        .answer-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            transform: translateX(5px);
        }
        .answer-btn.correct {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4caf50;
        }
        .answer-btn.wrong {
            background: rgba(244, 67, 54, 0.3);
            border-color: #f44336;
        }
        
        .result-view {
            text-align: center;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
            color: var(--accent);
            background: rgba(0, 212, 255, 0.1);
        }
        .level-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
        }
        .level-desc {
            font-size: 1.1rem;
            color: #a0c0e0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-restart {
            background: var(--accent);
            color: #0a1628;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-restart:hover {
            transform: scale(1.05);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="quiz.html" class="back-btn" data-i18n="page.back">← Back to Quizzes</a>
            <h1 data-i18n="quiz.luca.title">Quanto conosci Luca?</h1>
        </div>

        <div id="quizArea">
            <div class="question-number" id="qNum">Question 1 of 10</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="question" id="qText">Loading...</div>
            <div class="answers" id="answers"></div>
        </div>

        <div id="resultArea" class="result-view hidden">
            <div class="score-circle" id="finalScore">0/10</div>
            <div class="level-title" id="levelTitle">Title</div>
            <div class="level-desc" id="levelDesc">Description</div>
            <button class="btn-restart" id="restartBtn" data-i18n="quiz.restart">Play Again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: "job",
                correct: 1 // Index of correct answer
            },
            {
                id: "company",
                correct: 0
            },
            {
                id: "instrument",
                correct: 2
            },
            {
                id: "university",
                correct: 1
            },
            {
                id: "achievement",
                correct: 3
            },
            {
                id: "language",
                correct: 0
            },
            {
                id: "location",
                correct: 1
            },
            {
                id: "comic",
                correct: 0
            },
            {
                id: "games",
                correct: 2
            },
            {
                id: "passion",
                correct: 3
            }
        ];

        // We will load text from translations
        let currentQ = 0;
        let score = 0;
        let translations = {};

        const qNumEl = document.getElementById('qNum');
        const progressEl = document.getElementById('progress');
        const qTextEl = document.getElementById('qText');
        const answersEl = document.getElementById('answers');
        const quizArea = document.getElementById('quizArea');
        const resultArea = document.getElementById('resultArea');
        const finalScoreEl = document.getElementById('finalScore');
        const levelTitleEl = document.getElementById('levelTitle');
        const levelDescEl = document.getElementById('levelDesc');
        const restartBtn = document.getElementById('restartBtn');

        function initGame() {
            currentQ = 0;
            score = 0;
            quizArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQ];
            const qData = translations.questions[q.id];
            
            qNumEl.textContent = `${translations.ui.question} ${currentQ + 1} / ${questions.length}`;
            progressEl.style.width = `${((currentQ + 1) / questions.length) * 100}%`;
            qTextEl.textContent = qData.text;
            
            answersEl.innerHTML = '';
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(idx, btn);
                answersEl.appendChild(btn);
            });
        }

        function handleAnswer(idx, btn) {
            // Disable all buttons
            const btns = answersEl.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);

            const correctIdx = questions[currentQ].correct;
            if (idx === correctIdx) {
                score++;
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                // Highlight correct one
                btns[correctIdx].classList.add('correct');
            }

            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    renderQuestion();
                } else {
                    showResults();
                }
            }, 1000);
        }

        function showResults() {
            quizArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            finalScoreEl.textContent = `${score}/${questions.length}`;
            
            let levelKey = 'stranger';
            if (score >= 4) levelKey = 'acquaintance';
            if (score >= 7) levelKey = 'friend';
            if (score === 10) levelKey = 'bestie';

            const level = translations.results[levelKey];
            levelTitleEl.textContent = level.title;
            levelDescEl.textContent = level.desc;
        }

        restartBtn.addEventListener('click', initGame);

        // Translation Logic
        async function loadTranslations(lang) {
            try {
                const res = await fetch(`./i18n/${lang}.json`);
                if (res.ok) return await res.json();
            } catch (e) {}
            return null;
        }

        function getNested(obj, path) {
            return path.split('.').reduce((o, k) => (o && o[k] !== undefined) ? o[k] : undefined, obj);
        }

        async function init() {
            const lang = localStorage.getItem('lang') || 'en';
            const allTrans = await loadTranslations(lang);
            
            if (allTrans && allTrans.quiz && allTrans.quiz.luca) {
                translations = allTrans.quiz.luca;
                // Also set page title
                document.title = translations.title;
                document.querySelector('h1').textContent = translations.title;
                document.querySelector('.back-btn').textContent = allTrans.page ? allTrans.page.back : "Back";
                restartBtn.textContent = translations.ui.restart;
                
                initGame();
            } else {
                qTextEl.textContent = "Error loading translations. Please try refreshing.";
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
