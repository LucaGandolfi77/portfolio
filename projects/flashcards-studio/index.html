<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#18122a"><meta name="description" content="Flashcards Studio — ripetizione spaziata SM-2 offline, zero server."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Flashcards Studio</title></head>
<body><div id="app"><header id="topbar"><h1>Flashcards Studio</h1><nav id="tabs"><button class="tab active" data-tab="study">Studia</button><button class="tab" data-tab="deck">Deck</button><button class="tab" data-tab="editor">Crea</button><button class="tab" data-tab="stats">Stats</button></nav></header><main id="content">
<section id="tab-study" class="tab-content active"><div id="card-display"><h2 id="card-front">Carica un deck</h2><button id="btn-flip" aria-label="Capovolgi">Capovolgi</button><button id="btn-audio" aria-label="Ascolta">🔊</button></div><div class="sm2-buttons"><button id="btn-again" aria-label="Ancora">Ancora</button><button id="btn-good" aria-label="Buono">Buono</button><button id="btn-easy" aria-label="Facile">Facile</button></div><div id="sm2-info"></div></section>
<section id="tab-deck" class="tab-content"><h2>Deck locali</h2><div id="deck-list"></div></section>
<section id="tab-editor" class="tab-content"><h2>Nuova card</h2><input type="text" id="card-q" placeholder="Domanda..." aria-label="Domanda"><textarea id="card-a" placeholder="Risposta..." aria-label="Risposta"></textarea><button id="btn-add-card">Aggiungi</button></section>
<section id="tab-stats" class="tab-content"><h2>Progressi SM-2</h2><div id="stats-grid"></div></section>
</main></div>
<script src="sm2.js"></script><script src="deck-manager.js"></script><script src="card-editor.js"></script><script src="audio.js"></script><script src="app.js"></script>
</body></html>
