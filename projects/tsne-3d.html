<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070f">
<meta name="description" content="T-SNE 3D — carica un CSV e guarda i tuoi dati dispiegarsi nello spazio: proiezione 3D ottimizzata in-browser, coerenza del clustering live, k-means. Three.js + t-SNE leggero.">
<title>T-SNE 3D — Dispiegamento dei Dati</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center}
#title{font-size:clamp(26px,9vw,64px);font-weight:800;letter-spacing:clamp(3px,1.6vw,12px);
  background:linear-gradient(90deg,#3ee6ff,#b28dff,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:fadeIn 2s ease 0.5s forwards;text-shadow:0 0 40px rgba(62,230,255,.25)}
#sub{color:#7d94b8;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px;max-width:520px;line-height:1.8}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #3ee6ff;background:rgba(62,230,255,.08);color:#eaf6ff;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:10px}
#apri:hover{background:rgba(62,230,255,.2);box-shadow:0 0 26px rgba(62,230,255,.3)}
#credit{position:fixed;bottom:16px;color:#5f7d9f;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">T-SNE 3D</div>
  <div id="sub">I tuoi dati si dispiegano nello spazio 🌌<br>porta lo slider da <b>casuale</b> a <b>t-SNE ottimizzato</b> e guarda i gruppi emergere</div>
  <button id="apri" onclick="window.location.href='tsne-3d/index.html'">APRI</button>
</div>
<div id="credit">Three.js + t-SNE leggero in Web Worker — punti simili si raggruppano, la coerenza sale in tempo reale</div>

<script>
const c=document.createElement('canvas');document.body.prepend(c);
const x=c.getContext('2d');
let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
window.addEventListener('resize',()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;});
/* campo di stelle + nebulose */
const N=110,p=[];
for(let i=0;i<N;i++)p.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.8,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,hue:190+Math.random()*70,ph:Math.random()*6.28});
const neb=[];
const cols=['rgba(62,230,255,','rgba(178,141,255,','rgba(255,95,158,'];
for(let i=0;i<3;i++)neb.push({x:Math.random()*W,y:Math.random()*H,s:120+Math.random()*180,c:cols[i],ph:Math.random()*6.28});
function draw(t){
  x.fillStyle='#05070f';x.fillRect(0,0,W,H);
  for(const n of neb){
    const r=n.s*(1+Math.sin(t*.0004+n.ph)*.08);
    const g=x.createRadialGradient(n.x,n.y,0,n.x,n.y,r);
    g.addColorStop(0,n.c+'.10)');g.addColorStop(1,n.c+'0)');
    x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,r,0,6.283);x.fill();
  }
  for(const q of p){
    q.x+=q.vx;q.y+=q.vy;
    if(q.x<0||q.x>W)q.vx*=-1;if(q.y<0||q.y>H)q.vy*=-1;
    x.globalAlpha=.3+Math.sin(t*.002+q.ph)*.25;
    x.fillStyle='hsl('+q.hue+',90%,70%)';
    x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill();
  }
  x.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
