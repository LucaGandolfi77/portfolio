<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Assistant — Luca Gandolfi</title>
    <meta name="description" content="Client-side AI chatbot powered by Pollinations.ai — free, no API key required. Built with vanilla JavaScript." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/ai_chat.html" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        .chat-wrap { max-width: 760px; margin: 0 auto; padding: 90px 16px 40px; }
        .chat-card { background: rgba(20,36,60,0.7); border:1px solid rgba(0,212,255,0.15); border-radius:14px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,0.4); }
        .chat-head { background:linear-gradient(135deg, rgba(0,212,255,0.18), rgba(0,153,255,0.08)); padding:14px 18px; display:flex; align-items:center; gap:10px; }
        .chat-head h1 { margin:0; font-size:1.1rem; color:#fff; font-weight:700; }
        .chat-head .badge { margin-left:auto; font-size:0.7rem; color:#00d4ff; border:1px solid rgba(0,212,255,0.4); padding:3px 8px; border-radius:20px; }
        #messages { height: 52vh; min-height:320px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#0a1628; }
        .msg { padding:10px 14px; border-radius:14px; max-width:85%; line-height:1.5; font-size:0.95rem; white-space:pre-wrap; word-wrap:break-word; }
        .msg.user { align-self:flex-end; background:linear-gradient(135deg,#00d4ff,#0099ff); color:#001018; border-bottom-right-radius:4px; }
        .msg.bot { align-self:flex-start; background:rgba(255,255,255,0.06); color:#fff; border-bottom-left-radius:4px; }
        .msg.sys { align-self:center; background:transparent; color:#7fa8c8; font-size:0.85rem; font-style:italic; }
        .msg.err { align-self:center; color:#ff8a8a; font-size:0.85rem; }
        .typing { color:#00d4ff; font-size:0.85rem; padding:0 4px; }
        .typing span { display:inline-block; width:6px; height:6px; margin:0 1px; background:#00d4ff; border-radius:50%; animation:blink 1.2s infinite both; }
        .typing span:nth-child(2){ animation-delay:0.2s; } .typing span:nth-child(3){ animation-delay:0.4s; }
        @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
        .chat-input { display:flex; gap:8px; padding:12px; border-top:1px solid rgba(255,255,255,0.08); background:rgba(10,22,40,0.6); }
        #input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04); color:#fff; font-size:0.95rem; }
        #input:focus { outline:none; border-color:#00d4ff; }
        #send { background:linear-gradient(135deg,#00d4ff,#0099ff); color:#001018; border:none; padding:0 18px; border-radius:10px; font-weight:700; cursor:pointer; font-size:0.9rem; }
        #send:disabled { opacity:0.5; cursor:not-allowed; }
        .chat-controls { display:flex; gap:8px; padding:8px 12px 0; flex-wrap:wrap; align-items:center; }
        .chat-controls select, .chat-controls button { padding:6px 10px; border-radius:8px; background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.1); font-size:0.8rem; cursor:pointer; }
        .chat-controls label { font-size:0.8rem; color:#7fa8c8; }
        .info { color:#7fa8c8; font-size:0.8rem; text-align:center; padding:10px; }
        a { color:#00d4ff; }
    </style>
</head>
<body>
    <div class="chat-wrap">
        <div class="chat-card">
            <div class="chat-head">
                <i class="fas fa-robot" style="color:#00d4ff;font-size:1.4rem;"></i>
                <h1>AI Chat Assistant</h1>
                <span class="badge">Pollinations.ai · No API key</span>
            </div>
            <div id="messages"></div>
            <div class="chat-controls">
                <label for="lang">Model language:</label>
                <select id="lang">
                    <option value="en">English</option>
                    <option value="it">Italiano</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                </select>
                <button id="clear" title="Clear conversation"><i class="fas fa-trash"></i> Clear</button>
                <span class="info" style="margin-left:auto;">Powered by <a href="https://pollinations.ai" target="_blank" rel="noopener">pollinations.ai</a></span>
            </div>
            <div class="chat-input">
                <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
                <button id="send"><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        </div>
        <p class="info">Demo client-side. I messaggi sono inviati all'API pubblica Pollinations — non inserire dati sensibili.</p>
    </div>

    <script src="../top_buttons.js"></script>
    <script>
    (function () {
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const clearBtn = document.getElementById('clear');
        const langSel = document.getElementById('lang');

        let history = [];
        let busy = false;

        const SYSTEM_BY_LANG = {
            en: "You are a helpful, concise assistant on Luca Gandolfi's portfolio. Be friendly.",
            it: "Sei un assistente utile e conciso sul portfolio di Luca Gandolfi. Sii amichevole.",
            fr: "Tu es un assistant utile et concis sur le portfolio de Luca Gandolfi. Sois amical.",
            es: "Eres un asistente útil y conciso en el portfolio de Luca Gandolfi. Sé amable.",
            de: "Du bist ein hilfreicher, knapper Assistent auf Lucas Portfolio. Sei freundlich."
        };

        function addMsg(text, role) {
            const d = document.createElement('div');
            d.className = 'msg ' + role;
            d.textContent = text;
            messagesEl.appendChild(d);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return d;
        }

        function setLang() { history = [{ role: 'system', content: SYSTEM_BY_LANG[langSel.value] || SYSTEM_BY_LANG.en }]; }
        langSel.addEventListener('change', () => {
            setLang();
            messagesEl.innerHTML = '';
            addMsg(langSel.value === 'it' ? 'Conversazione reimpostata.' : 'Conversation reset.', 'sys');
        });
        clearBtn.addEventListener('click', () => {
            setLang(); messagesEl.innerHTML = '';
            addMsg(langSel.value === 'it' ? 'Conversazione cancellata.' : 'Conversation cleared.', 'sys');
            inputEl.focus();
        });

        async function send() {
            const text = inputEl.value.trim();
            if (!text || busy) return;
            busy = true; sendBtn.disabled = true;
            addMsg(text, 'user');
            inputEl.value = '';
            history.push({ role: 'user', content: text });

            const typing = document.createElement('div');
            typing.className = 'msg bot typing';
            typing.innerHTML = '<span></span><span></span><span></span>';
            messagesEl.appendChild(typing);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            try {
                const res = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ messages: history, seed: Math.floor(Date.now() / 1000) % 2147483647, model: 'openai' })
                });
                typing.remove();
                if (!res.ok) {
                    addMsg('⚠️ Errore ' + res.status + ' — riprova tra qualche secondo.', 'err');
                    history.pop();
                } else {
                    const reply = (await res.text()).trim() || '…';
                    history.push({ role: 'assistant', content: reply });
                    addMsg(reply, 'bot');
                }
            } catch (e) {
                typing.remove();
                addMsg('⚠️ Connessione fallita. Controlla la rete.', 'err');
                history.pop();
            } finally {
                busy = false; sendBtn.disabled = false; inputEl.focus();
            }
        }

        sendBtn.addEventListener('click', send);
        inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

        setLang();
        addMsg("Ciao! Sono un assistente AI gratuito (Pollinations). Chiedimi qualcosa sul portfolio di Luca o qualsiasi altra cosa.", 'bot');
    })();
    </script>
</body>
</html>
