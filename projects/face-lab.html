<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070812">
<meta name="description" content="FACE LAB — a live facial-landmark AI mirror: 68 glowing points track your face in 3D, real-time metrics and playful distortion modes. MediaPipe + Three.js, on-device.">
<title>FACE LAB — Distortion Mirror</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#070812;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center}
#title{font-size:clamp(30px,10vw,72px);font-weight:800;letter-spacing:clamp(3px,1.8vw,12px);
  background:linear-gradient(90deg,#3ee6ff,#b28dff,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:fadeIn 2s ease 0.5s forwards;text-shadow:0 0 44px rgba(178,141,255,.3)}
#sub{color:#8a92c8;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:12px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px;max-width:540px;line-height:1.9}
#apri{pointer-events:all;margin-top:36px;padding:13px 44px;border:1px solid #3ee6ff;background:rgba(62,230,255,.08);color:#eef0ff;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:12px;font-weight:700}
#apri:hover{background:rgba(62,230,255,.2);box-shadow:0 0 30px rgba(62,230,255,.35)}
#credit{position:fixed;bottom:16px;color:#5f6890;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 34px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">FACE//LAB</div>
  <div id="sub">68 AI points trace your face in 3D · live telemetry · then bend reality<br>giant eyes · funhouse · fish-eye · swirl · chromatic · pixelate · neon · emoji · cartoon<br>👓👑🥸🎩😊🧔😇</div>
  <button id="apri" onclick="window.location.href='face-lab/index.html'">OPEN MIRROR</button>
</div>
<div id="credit">MediaPipe FaceLandmarker + Three.js — all on-device, nothing leaves your device 🔒</div>

<script>
const c=document.createElement('canvas');document.body.prepend(c);
const x=c.getContext('2d');
let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
window.addEventListener('resize',()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;});
/* nebulose olografiche */
const neb=[['rgba(62,230,255,',0],['rgba(178,141,255,',1],['rgba(255,95,158,',2]];
const blobs=neb.map(([col],i)=>({x:Math.random()*W,y:Math.random()*H,s:130+Math.random()*200,c:col,ph:Math.random()*6.28,i}));
const pts=[];
for(let i=0;i<110;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.8,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,hue:185+Math.random()*90,ph:Math.random()*6.28});
function draw(t){
  x.fillStyle='#070812';x.fillRect(0,0,W,H);
  for(const n of blobs){
    const r=n.s*(1+Math.sin(t*.0005+n.ph)*.1);
    const g=x.createRadialGradient(n.x,n.y,0,n.x,n.y,r);
    g.addColorStop(0,n.c+'.12)');g.addColorStop(1,n.c+'0)');
    x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,r,0,6.283);x.fill();
  }
  for(const q of pts){
    q.x+=q.vx;q.y+=q.vy;
    if(q.x<0||q.x>W)q.vx*=-1;if(q.y<0||q.y>H)q.vy*=-1;
    x.globalAlpha=.3+Math.sin(t*.002+q.ph)*.25;
    x.fillStyle='hsl('+q.hue+',90%,70%)';
    x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill();
  }
  x.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
