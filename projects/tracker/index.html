<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Camera Tracker">
  <meta name="description" content="A creative camera with 19 live filters, AI vision, voice subtitles and an offline photo gallery.">
  <title>Camera Tracker — Luca Gandolfi</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./css/liquid.css">
</head>
<body>
  <div class="app">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="flash"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">📷</span>
        <span>CAMERA<b>TRACKER</b></span>
      </div>
      <nav class="top-actions">
        <a class="icon-btn" href="../../index.html" aria-label="Projects" title="Projects">←</a>
        <button class="icon-btn" id="diagBtn" type="button" title="Diagnostics">📊</button>
        <button class="icon-btn" id="settingsBtn" type="button" title="Settings">⚙️</button>
        <button class="icon-btn" id="galleryBtn" type="button" title="Gallery">🖼️</button>
        <button class="install-btn hidden" id="installBtn" type="button">Installa</button>
      </nav>
    </header>

    <div class="statusbar">
      <span class="status-chip" id="statusChip">● Pronto</span>
      <span class="status-chip offline hidden" id="offlineChip">⚡ Offline</span>
    </div>

    <div class="side-controls">
      <button class="round-btn" id="switchBtn" type="button" title="Switch camera">🔄</button>
      <button class="round-btn" id="torchBtn" type="button" title="Torch">🔦</button>
      <button class="round-btn" id="timerBtn" type="button" title="Timer">⏱</button>
      <button class="round-btn" id="btnRecord" type="button" title="Record">🎥</button>
      <button class="round-btn" id="btnGrid" type="button" title="Grid">⊞</button>
      <button class="round-btn" id="btnLevel" type="button" title="Level">⌁</button>
      <button class="round-btn" id="btnHistogram" type="button" title="Histogram">📈</button>
      <button class="round-btn" id="btnVoice" type="button" title="Voice">🎤</button>
      <div class="zoom-control">
        <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" aria-label="Zoom">
        <span id="zoomLabel">1×</span>
      </div>
    </div>

    <div id="countdown" class="countdown hidden"></div>

    <footer class="bottom">
      <div class="slider-container hidden" id="sliderContainer">
        <span>−</span>
        <input type="range" id="filterSlider" min="0" max="100" value="50" aria-label="Filter intensity">
        <span>+</span>
      </div>
      <div class="shutter-row">
        <button class="mini-shutter" id="galleryShortcut" type="button" title="Gallery">🖼️</button>
        <button class="shutter" id="shutterBtn" type="button" title="Take photo" aria-label="Take photo"></button>
        <button class="mini-shutter" id="settingsShortcut" type="button" title="Settings">⚙️</button>
      </div>
      <div class="filter-rail" id="filterRail"></div>
    </footer>

    <!-- PERMESSO / ERRORE -->
    <div class="overlay" id="permissionOverlay">
      <div class="dialog">
        <div class="dialog-icon">📷</div>
        <h1 data-i18n="app.title">Camera Tracker</h1>
        <p data-i18n="app.subtitle"></p>
        <p class="error-text hidden" id="permissionError"></p>
        <button class="primary-btn" id="startBtn" type="button" data-i18n="action.start">Avvia fotocamera</button>
      </div>
    </div>

    <!-- IMPOSTAZIONI -->
    <div class="overlay hidden" id="settingsOverlay">
      <div class="sheet">
        <div class="sheet-head"><h2 data-i18n="panel.settings">IMPOSTAZIONI</h2><button class="close-btn" data-close="settingsOverlay">✕</button></div>
        <label class="setting-row"><span data-i18n="setting.resolution">Risoluzione</span><select id="resolutionSelect"></select></label>
        <label class="setting-row"><span data-i18n="setting.language">Lingua riconoscimento</span><select id="speechLangSelect"><option value="it-IT">Italiano</option><option value="en-US">English</option></select></label>
        <label class="setting-row"><span data-i18n="setting.detectionFps">FPS rilevamento AI</span><select id="fpsSelect"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="24">24</option></select></label>
        <label class="setting-row"><span data-i18n="setting.timer">Self-timer</span><select id="timerSelect"><option value="0">Off</option><option value="3">3s</option><option value="5">5s</option><option value="10">10s</option></select></label>
        <label class="setting-row"><span data-i18n="setting.mirror">Specchia immagine</span><input type="checkbox" id="mirrorToggle"></label>
        <label class="setting-row"><span data-i18n="setting.sound">Suoni</span><input type="checkbox" id="soundToggle" checked></label>
        <label class="setting-row"><span>Runtime AI</span><select id="aiRuntimeSelect"><option value="mediapipe">MediaPipe Tasks</option><option value="legacy">TF.js legacy</option></select></label>
        <label class="setting-row"><span>Time-lapse</span><select id="timelapseSelect"><option value="0">Off</option><option value="2">2s</option><option value="5">5s</option><option value="10">10s</option></select></label>
        <div class="setting-row"><span>Sticker AR</span><div class="sticker-tray" id="stickerTray"></div></div>
      </div>
    </div>

    <!-- GALLERIA -->
    <div class="overlay hidden" id="galleryOverlay">
      <div class="sheet">
        <div class="sheet-head"><h2 data-i18n="panel.gallery">GALLERIA</h2><button class="close-btn" data-close="galleryOverlay">✕</button></div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <p class="empty-note hidden" id="galleryEmpty"></p>
        <button class="ghost-btn danger" id="clearGalleryBtn" type="button" data-i18n="action.clear">Svuota galleria</button>
      </div>
    </div>

    <!-- DIAGNOSTICA -->
    <div class="overlay hidden" id="diagOverlay">
      <div class="sheet">
        <div class="sheet-head"><h2 data-i18n="panel.diagnostics">DIAGNOSTICA</h2><button class="close-btn" data-close="diagOverlay">✕</button></div>
        <div class="diag-grid" id="diagContent"></div>
      </div>
    </div>

    <div class="update-bar hidden" id="updateBar">
      <span data-i18n="msg.update">Nuova versione disponibile</span>
      <button type="button" id="updateBtn">Aggiorna</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="../_shared/top_buttons.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
