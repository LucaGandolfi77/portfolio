<!doctype html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="tiny_ai.page.title">Tiny Local AI Demo</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #0d6efd;
      --border-color: #333;
      --input-bg: #2d2d2d;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    header {
      padding: 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    main {
      flex: 1;
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .panel {
      flex: 1;
      min-width: 300px;
      background: var(--panel-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    h2 { margin-top: 0; font-size: 1.25rem; color: #fff; margin-bottom: 16px; }
    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      font-size: 1rem;
      background: var(--input-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus, input:focus, select:focus {
      outline: 2px solid var(--accent-color);
      border-color: transparent;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    label { font-size: 0.9rem; color: #aaa; white-space: nowrap; }
    select, input {
      padding: 10px;
      border-radius: 6px;
      background: var(--input-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #0b5ed7; }
    button#clearCache { background: #dc3545; margin-left: auto; }
    button#clearCache:hover { background: #bb2d3b; }
    
    #output {
      white-space: pre-wrap;
      background: #111;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      min-height: 300px;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      line-height: 1.6;
      color: #eee;
    }
    .hint {
      color: #888;
      font-size: 0.85rem;
      margin-top: 16px;
      line-height: 1.5;
    }
    code { background: #333; padding: 2px 6px; border-radius: 4px; color: #ff7b72; }
    
    @media (max-width: 768px) {
      main { flex-direction: column; padding: 16px; gap: 16px; }
      .panel { width: 100%; min-width: 0; padding: 16px; }
      .controls { flex-direction: column; align-items: stretch; gap: 10px; }
      .controls > * { width: 100%; }
      .controls label { margin-bottom: -5px; }
      button#clearCache { margin-left: 0; margin-top: 10px; }
      select#model { max-width: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <span style="font-weight:700">Tiny Local AI Demo</span>
    <nav>
      <span style="font-weight:700" data-i18n="tiny_ai.header.title">Tiny Local AI Demo</span>
    </nav>
      <h2 data-i18n="tiny_ai.page.title">Prompt</h2>
      <textarea id="prompt" data-i18n="tiny_ai.prompt.placeholder" placeholder="Write a short prompt (e.g. 'Write a friendly 2-line haiku about coffee')."></textarea>
      <div class="controls">
        <label for="backend" data-i18n="tiny_ai.controls.backend">Backend</label>
        <select id="backend">
          <option value="server" data-i18n="tiny_ai.controls.backend.server">Flask Server (/generate)</option>
          <option value="webllm" data-i18n="tiny_ai.controls.backend.webllm">WebLLM (WebSocket ws://127.0.0.1:11434)</option>
          <option value="webgpu" data-i18n="tiny_ai.controls.backend.webgpu">In-Browser WebLLM (WebGPU)</option>
        </select>
        <select id="model" style="display:none;max-width:200px">
          <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (Default)</option>
          <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen 2.5 0.5B (Tiny)</option>
          <option value="TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC">TinyLlama 1.1B</option>
          <option value="SmolLM2-135M-Instruct-q4f16_1-MLC">SmolLM2 135M (Smallest - 135M)</option>
          <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M (Very Tiny)</option>        </select>
        <label for="maxlen" data-i18n="tiny_ai.controls.max_tokens">Max tokens</label>
        <input id="maxlen" type="number" value="128" style="width:80px">
        <button id="gen" data-i18n="tiny_ai.controls.generate">Generate</button>
        <button id="clearCache" title="Free up space if you get QuotaExceededError" data-i18n="tiny_ai.controls.clear_cache">Clear Cache</button>
      </div>
      <div class="hint" data-i18n="tiny_ai.hint">This page expects a local server to run a small model. See the included <code>server.py</code> and <code>README.md</code> for setup instructions.</div>
    </div>
    <div class="panel">
      <h2 data-i18n="tiny_ai.page.title">Output</h2>
      <div id="output" data-i18n="tiny_ai.output.placeholder">Results will appear here.</div>
    </div>
  </main>

  <script>
    async function generate(){
      const prompt = document.getElementById('prompt').value.trim();
      const maxlen = parseInt(document.getElementById('maxlen').value) || 128;
      const out = document.getElementById('output');
      if(!prompt){ out.textContent = 'Please enter a prompt.'; return; }

      const backend = document.getElementById('backend').value;
      const modelId = document.getElementById('model').value;
      
      if (backend === 'webgpu') {
        out.textContent = 'Initializing WebLLM (WebGPU)...';
      } else {
        out.textContent = backend === 'webllm' ? 'Connecting to WebLLM (ws://127.0.0.1:11434)...' : 'Contacting local model server...';
      }

      try{
        if(backend === 'webgpu'){
          const text = await runWebGPU(prompt, maxlen, (msg) => out.textContent = msg, modelId);
          out.textContent = text || 'No output';
        } else if(backend === 'webllm'){
          const text = await webllmGenerate(prompt, maxlen);
          out.textContent = text || 'No output';
        } else {
          const res = await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({prompt,max_length: maxlen})});
          if(!res.ok){ const text = await res.text(); out.textContent = 'Server error: '+text; return; }
          const data = await res.json();
          out.textContent = data.generated || data.error || 'No output';
        }
      }catch(e){ 
        console.error(e);
        if (e.name === 'QuotaExceededError' || e.message.includes('QuotaExceededError')) {
            out.textContent = 'Error: Browser storage quota exceeded. Please click "Clear Cache" to free up space, then try again.\n\n' + e.message;
        } else {
            out.textContent = 'Error: ' + e.message + '\n\nCheck console for details.'; 
        }
      }
    }
    document.getElementById('gen').addEventListener('click', generate);
    
    document.getElementById('clearCache').addEventListener('click', async () => {
      if(!confirm('This will delete all downloaded models from your browser cache to free up space. Are you sure?')) return;
      const out = document.getElementById('output');
      out.textContent = 'Clearing cache...';
      try {
        // Clear Cache API
        const keys = await caches.keys();
        let count = 0;
        for(const key of keys) {
           // WebLLM uses specific cache names, but we can be safe and clear ones that look like model caches
           if(key.startsWith('webllm/') || key.includes('mlc')) {
             await caches.delete(key);
             count++;
           }
        }
        
        // Also try to clear IndexedDB if used by WebLLM
        try {
            const dbs = await window.indexedDB.databases();
            for (const db of dbs) {
                if (db.name && (db.name.includes('webllm') || db.name.includes('mlc'))) {
                    window.indexedDB.deleteDatabase(db.name);
                    count++;
                }
            }
        } catch(e) { console.warn("Could not list/delete IndexedDB:", e); }

        out.textContent = `Cache cleared (${count} items removed). You can now reload the page and try downloading a model again.`;
        webllmEngine = null; 
        currentModelId = null;
      } catch(e) {
        out.textContent = 'Error clearing cache: ' + e;
      }
    });

    // Allow Ctrl+Enter to generate
    document.getElementById('prompt').addEventListener('keydown', (e)=>{ if(e.ctrlKey && e.key === 'Enter') generate(); });

    // Toggle model selector visibility
    const backendSelect = document.getElementById('backend');
    const modelSelect = document.getElementById('model');
    function updateModelVisibility() {
        modelSelect.style.display = backendSelect.value === 'webgpu' ? 'block' : 'none';
    }
    backendSelect.addEventListener('change', updateModelVisibility);
    updateModelVisibility();

    let webllmEngine = null;
    let currentModelId = null;

    async function runWebGPU(prompt, maxTokens, onProgress, modelId) {
        // Dynamic import from CDN
        const { CreateMLCEngine, prebuiltAppConfig } = await import('https://esm.run/@mlc-ai/web-llm');
        
        const selectedModel = modelId || "Llama-3.2-1B-Instruct-q4f16_1-MLC"; 
        
        // Custom config for models not in prebuilt list
        const appConfig = {
            model_list: [
                ...prebuiltAppConfig.model_list,
                {
                    "model": "https://huggingface.co/mlc-ai/SmolLM2-135M-Instruct-q4f16_1-MLC",
                    "model_id": "SmolLM2-135M-Instruct-q4f16_1-MLC",
                    "model_lib": "https://raw.githubusercontent.com/mlc-ai/binary-mlc-llm-libs/main/web-llm-models/v0_2_80/SmolLM2-135M-Instruct-q4f16_1-ctx4k_cs1k-webgpu.wasm",
                    "vram_required_MB": 128,
                    "low_resource_required": true,
                    "overrides": { "context_window_size": 4096 }
                },
                {
                    "model": "https://huggingface.co/mlc-ai/SmolLM2-360M-Instruct-q4f16_1-MLC",
                    "model_id": "SmolLM2-360M-Instruct-q4f16_1-MLC",
                    "model_lib": "https://raw.githubusercontent.com/mlc-ai/binary-mlc-llm-libs/main/web-llm-models/v0_2_80/SmolLM2-360M-Instruct-q4f16_1-ctx4k_cs1k-webgpu.wasm",
                    "vram_required_MB": 256,
                    "low_resource_required": true,
                    "overrides": { "context_window_size": 4096 }
                }
            ]
        };

        if (!webllmEngine) {
            onProgress("Loading WebLLM engine and model " + selectedModel + " (this may take a while)...");
            webllmEngine = await CreateMLCEngine(
                selectedModel,
                { 
                    appConfig: appConfig,
                    initProgressCallback: (report) => onProgress(report.text) 
                }
            );
            currentModelId = selectedModel;
        } else if (currentModelId !== selectedModel) {
            onProgress("Switching to model " + selectedModel + "...");
            await webllmEngine.reload(selectedModel, { 
                appConfig: appConfig,
                initProgressCallback: (report) => onProgress(report.text) 
            });
            currentModelId = selectedModel;
        }

        onProgress("Generating...");
        const messages = [
            { role: "user", content: prompt }
        ];

        const reply = await webllmEngine.chat.completions.create({
            messages,
            max_tokens: maxTokens,
        });
        
        return reply.choices[0].message.content;
    }

    // WebLLM WebSocket client (best-effort). Many WebLLM setups expose a WebSocket at ws://127.0.0.1:11434
    function webllmGenerate(prompt, maxTokens){
      return new Promise((resolve, reject) => {
        try{
          const url = 'ws://127.0.0.1:11434/';
          const ws = new WebSocket(url);
          const timeout = setTimeout(()=>{ try{ ws.close(); }catch{}; reject('WebLLM connection timeout'); }, 20000);

          ws.onopen = () => {
            // Generic request format. Different WebLLM versions may expect different JSON; adjust if needed.
            const msg = {
              type: 'generate',
              input: prompt,
              parameters: { max_new_tokens: maxTokens }
            };
            ws.send(JSON.stringify(msg));
          };

          ws.onmessage = (evt) => {
            try{
              const data = JSON.parse(evt.data);
              // Try common response fields
              if(data.result || data.text || data.output){
                clearTimeout(timeout);
                try{ ws.close(); }catch{};
                resolve(data.result || data.text || data.output);
              } else if(data.type === 'generation_chunk' && data.text){
                // chunked streaming -- resolve final on 'finished' flag
                if(data.finished){ clearTimeout(timeout); try{ ws.close(); }catch{}; resolve(data.text); }
              } else {
                // fallback: return the raw message
                clearTimeout(timeout);
                try{ ws.close(); }catch{};
                resolve(JSON.stringify(data));
              }
            }catch(err){ clearTimeout(timeout); try{ ws.close(); }catch{}; resolve(evt.data); }
          };

          ws.onerror = (err) => { clearTimeout(timeout); try{ ws.close(); }catch{}; reject('WebSocket error'); };
          ws.onclose = ()=>{};
        }catch(e){ reject(e); }
      });
    }
  </script>
</body>
<script src="top_buttons.js"></script>
</html>
