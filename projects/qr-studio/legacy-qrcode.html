<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Code Reader → QR Studio</title>
  <meta name="description" content="The QR Code Reader has moved to QR Studio: camera scanning, local decoding and no tracking.">
  <link rel="canonical" href="./index.html">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="2; url=./index.html">
  <meta name="theme-color" content="#0a0d16">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      background: radial-gradient(80% 80% at 50% 0%, #12203a, #070a12 70%);
      color: #eef3ff;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: min(100%, 460px);
      padding: 28px 24px;
      border: 1px solid rgba(0, 229, 255, 0.24);
      border-radius: 22px;
      background: rgba(12, 18, 32, 0.82);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 16px #00e5ff; }
    .kicker { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; color: #00e5ff; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.1; letter-spacing: -0.03em; }
    p { margin: 12px 0 0; color: #aab4c8; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #00e5ff;
      color: #041018;
      font-weight: 800;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #ff7ab8; outline-offset: 3px; }
    small { display: block; margin-top: 16px; color: #7f8aa0; font-size: 12px; }
  </style>
  <script>
    (function () {
      var target = './index.html' + location.search + '#scan';
      location.replace(target);
    })();
  </script>
    <link rel="manifest" href="./legacy-qrcode.webmanifest">
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <p class="kicker"><span class="dot" aria-hidden="true"></span> Moved</p>
    <h1>QR Code Reader is now QR Studio</h1>
    <p>Scanning, creating and history in one local-first app. No uploads, no accounts.</p>
    <p lang="it">Il lettore QR è diventato QR Studio: scansione, creazione e cronologia in un’unica app locale.</p>
    <a href="./index.html#scan">Open QR Studio →</a>
    <small>If you are not redirected automatically, use the link above.</small>
  </main>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./legacy-qrcode-sw.js',{scope:'./legacy-qrcode.html'}).catch(()=>{})</script>
</body>
</html>
