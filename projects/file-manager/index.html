<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>File Manager &amp; Reader — Luca Gandolfi</title>
<meta name="description" content="Modern offline file manager with code viewer, PDF reader and image preview — optimized for iPhone and desktop.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#070d18; --bg2:#0c1525; --panel:rgba(15,25,42,.82); --panel-solid:#101b2e;
  --card:rgba(22,35,56,.72); --card-hover:rgba(30,46,72,.85);
  --line:rgba(150,190,255,.12); --line2:rgba(150,190,255,.24);
  --txt:#eaf2ff; --dim:#8b9cbb; --accent:#4de8ff; --accent2:#a98bff;
  --danger:#ff6b7d; --success:#5ef0a8; --gold:#ffd27a; --orange:#ff9f68;
  --mono:'JetBrains Mono',Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(800px 420px at 8% -10%,rgba(77,232,255,.10),transparent 60%),
    radial-gradient(700px 400px at 100% 0%,rgba(169,139,255,.09),transparent 60%),
    radial-gradient(700px 500px at 50% 110%,rgba(94,240,168,.05),transparent 60%),
    var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.ico{width:20px;height:20px;flex:none;display:block}
.hidden{display:none!important}

/* ===== layout ===== */
.app{display:flex;max-width:1440px;margin:0 auto;min-height:100vh;min-height:100dvh}
.sidebar{width:262px;flex:none;display:flex;flex-direction:column;gap:8px;padding:14px 12px;
  background:linear-gradient(180deg,rgba(10,18,32,.92),rgba(8,14,26,.92));border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;height:100dvh;z-index:30}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}

/* sidebar */
.side-head{display:flex;align-items:center;gap:10px;padding:4px 4px 10px}
.logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,rgba(77,232,255,.2),rgba(169,139,255,.18));border:1px solid var(--line2);color:var(--accent)}
.side-title b{display:block;font-size:.9rem;font-weight:800;letter-spacing:-.01em}
.side-title small{display:block;font-size:.62rem;color:var(--dim);margin-top:1px}
.usage-ring{margin-left:auto;width:38px;height:38px;flex:none}
.usage-ring circle{fill:none;stroke-width:3.5}
.usage-ring .bg{stroke:rgba(255,255,255,.09)}
.usage-ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:18px 18px;transition:stroke-dashoffset .4s}
.usage-txt{font-size:.55rem;fill:var(--dim);font-weight:700;text-anchor:middle}

.side-search{display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
.side-search .ico{width:16px;height:16px;color:var(--dim)}
.side-search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:.78rem}
.side-search input::placeholder{color:var(--dim)}

.side-tree{flex:1;overflow-y:auto;padding:4px 0;scrollbar-width:thin}
.tree-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:10px;font-size:.76rem;
  color:var(--dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.tree-row:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.tree-row.on{background:rgba(77,232,255,.12);color:var(--accent);font-weight:700}
.tree-row .ico{width:16px;height:16px}
.tree-row .caret{width:12px;font-size:.6rem;opacity:.6}

.side-stats{border-top:1px solid var(--line);padding-top:12px;font-size:.66rem;color:var(--dim)}
.side-stats h4{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:var(--dim)}
.stat-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.stat-row .dot{width:7px;height:7px;border-radius:50%}
.stat-row .bar{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.stat-row .bar i{display:block;height:100%}
.stat-row b{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--txt)}

/* topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:9px 14px;
  padding-top:calc(9px + var(--safe-t));background:rgba(8,14,26,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:20}
.menu-btn{display:none}
.topbar .grow{flex:1;min-width:0}
.crumbs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumb{font-size:.78rem;color:var(--dim);padding:6px 8px;border-radius:9px;background:none;border:none;min-height:34px}
.crumb:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.crumb.on{color:var(--accent);font-weight:700}
.crumb-sep{color:var(--dim);opacity:.45;font-size:.8rem}
.tb-btn{min-width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;color:var(--dim);transition:.15s}
.tb-btn:hover,.tb-btn.on{color:var(--accent);border-color:rgba(77,232,255,.4);background:rgba(77,232,255,.1)}
.tb-btn .ico{width:18px;height:18px}

/* search + sort */
.searchbar{display:none;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line)}
.searchbar.on{display:flex}
.searchbar .ico{width:16px;height:16px;color:var(--dim)}
.searchbar input{flex:1;background:none;border:none;outline:none;font-size:.82rem;min-width:0}
.sortbar{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.025);font-size:.7rem;color:var(--dim);flex-wrap:wrap}
.sortbar select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.7rem;outline:none}
.sortbar .cnt{margin-left:auto}
.selbar{display:none;align-items:center;gap:6px;padding:8px 12px;background:rgba(77,232,255,.1);border-bottom:1px solid rgba(77,232,255,.25);flex-wrap:wrap}
.selbar.on{display:flex}
.selbar .n{font-weight:800;color:var(--accent);font-size:.76rem;margin-right:auto}
.sbtn{padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-size:.7rem;font-weight:700}
.sbtn.danger{color:var(--danger);border-color:rgba(255,107,125,.3)}

/* file list */
.fileview{flex:1;display:flex;flex-direction:column;min-height:0}
.list,.grid{flex:1;overflow-y:auto;padding:8px 10px 16px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;min-height:60px;border-radius:14px;
  border:1px solid transparent;margin-bottom:4px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;
  animation:itemIn .28s ease both}
@keyframes itemIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.item:hover{background:var(--card);border-color:var(--line)}
.item.sel{background:rgba(77,232,255,.12);border-color:rgba(77,232,255,.35)}
.item:active{transform:scale(.995)}
.tile{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--tile-bg,rgba(255,255,255,.07));color:var(--tile-fg,var(--dim));border:1px solid rgba(255,255,255,.07)}
.tile .ico{width:22px;height:22px}
.meta{flex:1;min-width:0}
.name{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{font-size:.7rem;color:var(--dim);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.kind{font-size:.6rem;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.06)}
.item .actions{display:flex;gap:4px;flex:none}
.mini{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;color:var(--dim)}
.mini:hover{color:var(--accent);border-color:var(--line2)}
.mini.danger:hover{color:var(--danger)}
.mini .ico{width:16px;height:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:10px;align-content:start}
.gcard{border-radius:16px;border:1px solid var(--line);background:var(--card);padding:14px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:.18s;animation:itemIn .28s ease both}
.gcard:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--card-hover)}
.gcard.sel{border-color:var(--accent);background:rgba(77,232,255,.1)}
.gcard .tile{width:56px;height:56px;border-radius:16px}
.gcard .tile .ico{width:28px;height:28px}
.gcard .name{max-width:100%;font-size:.8rem}
.gcard .detail{justify-content:center}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  color:var(--dim);padding:40px 20px;text-align:center}
.empty .big{font-size:2.6rem;opacity:.5}
.empty p{font-size:.86rem;max-width:300px;line-height:1.6}
.empty small{font-size:.72rem;opacity:.7}
.drop-hint{border:2px dashed rgba(77,232,255,.45)!important;background:rgba(77,232,255,.06)!important;border-radius:18px}

/* action bar */
.actionbar{display:flex;align-items:center;justify-content:space-around;gap:4px;padding:8px 10px;
  padding-bottom:calc(8px + var(--safe-b));background:rgba(8,14,26,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.act{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  border-radius:11px;background:none;border:none;color:var(--dim);font-size:.64rem;font-weight:700;min-height:48px;transition:.15s}
.act:hover,.act:active{color:var(--accent);background:rgba(77,232,255,.08)}
.act .ico{width:20px;height:20px}

/* reader */
.reader{flex:1;display:flex;flex-direction:column;min-height:0}
.reader-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
.rfname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:.78rem;color:#fff}
.rhead-btn{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;color:var(--dim)}
.rhead-btn:hover{color:var(--accent)}
.rhead-btn.pri{color:#04121c;background:var(--accent);border-color:transparent;font-weight:800;font-size:.68rem;padding:0 12px}
.rhead-btn .ico{width:16px;height:16px}
.toggle-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.03);font-size:.72rem;color:var(--dim);flex-wrap:wrap}
.switch{position:relative;width:38px;height:21px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--card-hover);border-radius:20px;transition:.2s;cursor:pointer}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(17px)}
.reader-body{flex:1;overflow:auto;min-height:0;position:relative;background:#0a1220;-webkit-overflow-scrolling:touch}
.reader-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;padding-bottom:calc(7px + var(--safe-b));
  background:rgba(255,255,255,.03);border-top:1px solid var(--line)}
.reader-bar .info{flex:1;text-align:center;font-size:.74rem;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:700}

/* code */
.code-wrap{padding:10px 0;line-height:1.6;min-width:max-content}
.code-wrap.wrap{min-width:0}
.code-line{display:flex;font-family:var(--mono);font-size:.78rem;white-space:pre;padding-right:16px}
.code-wrap.wrap .code-line{white-space:pre-wrap;word-break:break-word}
.code-line:hover{background:rgba(77,232,255,.06)}
.code-line.cur{background:rgba(77,232,255,.09);box-shadow:inset 2px 0 var(--accent)}
.code-line .ln{flex:none;width:3.6em;padding-right:1.2em;text-align:right;color:#3c4d68;user-select:none}
.code-line .src{white-space:inherit}
.tok-kw{color:#ff7b9c}.tok-str{color:#a5d6ff}.tok-com{color:#64748b;font-style:italic}
.tok-num{color:#79c0ff}.tok-fn{color:#d2a8ff}.tok-type{color:#7ee787}.tok-op{color:#ffb27a}.tok-def{color:#ffa657}
.edit-area{width:100%;height:100%;min-height:300px;background:#0a1220;color:#dce8ff;border:none;outline:none;resize:none;
  padding:14px;font-family:var(--mono);font-size:.78rem;line-height:1.6;tab-size:2}

/* pdf / image / binary */
.pdf-scroll{padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;min-width:100%;margin:0 auto;transform-origin:top center}
.pdf-scroll canvas{height:auto;background:#fff;border-radius:6px;box-shadow:0 6px 26px rgba(0,0,0,.5);touch-action:pan-x pan-y}
.img-view{display:flex;align-items:center;justify-content:center;min-height:100%;padding:14px;
  background-image:linear-gradient(45deg,#0e1727 25%,transparent 25%),linear-gradient(-45deg,#0e1727 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#0e1727 75%),linear-gradient(-45deg,transparent 75%,#0e1727 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.img-view img{max-width:100%;height:auto;border-radius:8px;transform-origin:center;touch-action:manipulation;box-shadow:0 10px 36px rgba(0,0,0,.5)}
.bin-view{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100%;
  padding:30px;text-align:center;color:var(--dim)}
.bin-view .big{font-size:3rem;opacity:.6}
.skeleton{padding:24px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));
  background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* modal / toast */
.modal-back{position:fixed;inset:0;background:rgba(2,7,14,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal-back.center{align-items:center;padding:16px}
.modal{width:100%;max-width:430px;padding:20px 18px calc(20px + var(--safe-b));border-radius:20px 20px 0 0;
  background:linear-gradient(160deg,#15233c,#0d1728);border:1px solid var(--line2);box-shadow:0 -10px 40px rgba(0,0,0,.5);
  animation:slideUp .22s ease}
.modal-back.center .modal{border-radius:18px;animation:popIn .18s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
@keyframes popIn{from{transform:scale(.96);opacity:0}}
.modal h3{margin:0 0 5px;font-size:1.02rem;color:#fff}
.modal .hint{margin:0 0 14px;font-size:.76rem;color:var(--dim);line-height:1.5}
.modal input[type=text]{width:100%;padding:12px;font-size:.95rem;background:rgba(255,255,255,.05);
  border:1px solid var(--line2);border-radius:11px;margin-bottom:14px;outline:none}
.modal input[type=text]:focus{border-color:var(--accent)}
.modal .row{display:flex;gap:9px}
.btn{min-height:46px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);
  font-weight:700;font-size:.86rem;flex:1}
.btn.pri{background:linear-gradient(120deg,var(--accent),#28a8c9);color:#04121c;border:none}
.btn.danger{color:var(--danger);border-color:rgba(255,107,125,.3)}
.folder-list{max-height:220px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:12px}
.folder-opt{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:.8rem;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.folder-opt:hover{background:rgba(77,232,255,.08)}
.folder-opt.on{background:rgba(77,232,255,.14);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(12px);z-index:300;
  display:flex;align-items:center;gap:10px;background:rgba(14,24,40,.96);border:1px solid var(--line2);color:var(--txt);
  padding:11px 16px;border-radius:30px;font-size:.8rem;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;
  transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast .undo{color:var(--accent);font-weight:800;border:none;background:none;font-size:.76rem;padding:4px 8px}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid rgba(77,232,255,.25);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== responsive ===== */
@media(max-width:900px){
  .sidebar{display:none;position:fixed;inset:0 auto 0 0;width:272px;transform:translateX(-100%);transition:transform .22s;box-shadow:20px 0 50px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  .menu-btn{display:flex}
  .main{height:100dvh}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media(min-width:901px){.app{padding:14px;gap:14px}.sidebar,.main{height:calc(100dvh - 28px);border-radius:20px;border:1px solid var(--line)}
  .main{overflow:hidden}.topbar{padding-top:9px;border-radius:20px 20px 0 0}}
</style>

</head>

<script>
(function(){
'use strict';
/* ==========================================================================
   Storage: OPFS preferito, IndexedDB fallback. Metadati in localStorage.
   ========================================================================== */
var META_KEY='fm_tree_v3', USE_OPFS=!!(navigator.storage&&navigator.storage.getDirectory);
var fsHandle=null, dbPromise=null, tree=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtBytes(b){if(b==null)return '';if(b<1024)return b+' B';var u=['KB','MB','GB','TB'],i=-1;
  do{b/=1024;i++}while(b>=1024&&i<u.length-1);return b.toFixed(1)+' '+u[i]}
function fmtDate(ts){if(!ts)return '';var d=new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function toast(msg,undo){
  $('toastMsg').textContent=msg;var u=$('toastUndo');
  if(undo){u.classList.remove('hidden');u.onclick=function(){undo();hideToast()}}else u.classList.add('hidden');
  $('toast').classList.add('show');clearTimeout(toast._t);
  toast._t=setTimeout(hideToast,undo?6000:2200)}
function hideToast(){$('toast').classList.remove('show')}
function ico(name,cls){return '<svg class="ico '+(cls||'')+'"><use href="#i-'+name+'"/></svg>'}

function getDB(){if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB unavailable'));
  if(dbPromise)return dbPromise;
  dbPromise=new Promise(function(res,rej){var r=indexedDB.open('fm_store',1);
    r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files')};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}});return dbPromise}
function idbWrite(k,d){return getDB().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction('files','readwrite');tx.objectStore('files').put(d,k);
  tx.oncomplete=res;tx.onerror=function(){rej(tx.error)}})})}
function idbRead(k){return getDB().then(function(db){return new Promise(function(res,rej){
  var r=db.transaction('files','readonly').objectStore('files').get(k);
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})})}
function idbDelete(k){return getDB().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction('files','readwrite');tx.objectStore('files').delete(k);
  tx.oncomplete=res;tx.onerror=function(){rej(tx.error)}})})}
function getOPFS(){if(!USE_OPFS)return Promise.reject(new Error('OPFS unavailable'));
  if(fsHandle)return Promise.resolve(fsHandle);
  return navigator.storage.getDirectory().then(function(r){fsHandle=r;return r})}
async function opfsFile(path,create){var root=await getOPFS(),parts=path.split('/').filter(Boolean),dir=root;
  for(var i=0;i<parts.length-1;i++)dir=await dir.getDirectoryHandle(parts[i],{create:!!create});
  return dir.getFileHandle(parts[parts.length-1],{create:!!create})}
function storeWrite(path,data){
  if(USE_OPFS)return getOPFS().then(function(){return opfsFile(path,true).then(function(h){
    return h.createWritable().then(function(w){return w.write(data).then(function(){return w.close()})})})})
    .catch(function(){return idbWrite('f:'+path,data)});
  return idbWrite('f:'+path,data)}
function storeRead(path){
  if(USE_OPFS)return getOPFS().then(function(){return opfsFile(path,false).then(function(h){return h.getFile()})})
    .catch(function(){return idbRead('f:'+path)});
  return idbRead('f:'+path)}
function removeHandle(dir,parts,i){
  if(i===parts.length-1)return dir.removeEntry(parts[i],{recursive:true});
  return dir.getDirectoryHandle(parts[i]).then(function(d){return removeHandle(d,parts,i+1)})}
function storeDelete(path){
  if(USE_OPFS)return getOPFS().then(function(){return removeHandle(fsHandle,path.split('/').filter(Boolean),0)})
    .catch(function(){return idbDelete('f:'+path)});
  return idbDelete('f:'+path)}

function loadTree(){try{var r=localStorage.getItem(META_KEY);if(r){var t=JSON.parse(r);if(t&&t.children)return t}}catch(e){}
  // migrazione dal vecchio formato
  try{var old=localStorage.getItem('fm_tree_v2');if(old){var o=JSON.parse(old);if(o&&o.children)return o}}catch(e){}
  return {children:{}}}
tree=loadTree();
function saveTree(){try{localStorage.setItem(META_KEY,JSON.stringify(tree))}catch(e){}}
function getNode(path){if(!path)return tree;var n=tree;
  path.split('/').filter(Boolean).forEach(function(p){n=n&&n.children&&n.children[p]});return n||null}
function getParent(path){var p=path.split('/').filter(Boolean);p.pop();return getNode(p.join('/'))}
function syncTree(){saveTree();renderAll();updateUsage();return Promise.resolve()}
function createFolder(path,name){var par=getNode(path);if(!par)return Promise.reject(new Error('Missing parent'));
  par.children=par.children||{};if(par.children[name])return Promise.reject(new Error('Already exists'));
  par.children[name]={type:'dir',mtime:Date.now(),children:{}};return syncTree()}
function createFile(path,name,data,mtime){var par=getNode(path);if(!par)return Promise.reject(new Error('Missing parent'));
  par.children=par.children||{};if(par.children[name])return Promise.reject(new Error('Already exists'));
  par.children[name]={type:'file',size:(data&&data.size)||(data&&data.byteLength)||(data&&data.length)||0,mtime:mtime||Date.now()};
  saveTree();return storeWrite(path?path+'/'+name:name,data||new Blob([])).then(syncTree)}
function collectBlobs(path,node,acc){acc=acc||[];
  if(node.type==='file')acc.push({path:path,node:node});
  else Object.keys(node.children||{}).forEach(function(n){collectBlobs(path+'/'+n,node.children[n],acc)});
  return acc}
function removeEntry(path){var par=getParent(path),name=path.split('/').filter(Boolean).pop();
  if(par&&par.children)delete par.children[name];saveTree();
  return storeDelete(path).then(syncTree).catch(function(){syncTree()})}
function renameEntry(path,newName){if(!newName||newName.indexOf('/')>=0)return Promise.reject(new Error('Invalid name'));
  var par=getParent(path),old=path.split('/').filter(Boolean).pop();
  if(!par||!par.children[old])return Promise.reject(new Error('Missing'));
  if(par.children[newName])return Promise.reject(new Error('Already exists'));
  var node=par.children[old];delete par.children[old];node.mtime=Date.now();par.children[newName]=node;
  var np=path.split('/').filter(Boolean).slice(0,-1).concat(newName).join('/');
  var chain=Promise.resolve();
  collectBlobs(path,node).forEach(function(it){var rel=it.path.slice(path.length);
    chain=chain.then(function(){return storeRead(it.path).then(function(b){
      return storeWrite(np+rel,b).then(function(){return storeDelete(it.path)})})})});
  saveTree();return chain.then(syncTree).catch(function(){syncTree()})}
function copyEntry(src,dest){var name=src.split('/').filter(Boolean).pop();var node=getNode(src);
  if(!node)return Promise.reject(new Error('Missing source'));
  var par=getNode(dest);if(!par)return Promise.reject(new Error('Missing destination'));
  par.children=par.children||{};
  var finalName=name,c=1;while(par.children[finalName]){finalName=name+' ('+c+++')'}
  var clone=JSON.parse(JSON.stringify(node));clone.mtime=Date.now();par.children[finalName]=clone;
  var base=dest?dest+'/'+finalName:finalName,chain=Promise.resolve();
  collectBlobs(src,node).forEach(function(it){var rel=it.path.slice(src.length);
    chain=chain.then(function(){return storeRead(it.path).then(function(b){return storeWrite(base+rel,b)})})});
  saveTree();return chain.then(syncTree).catch(function(){syncTree()})}
function moveEntry(src,dest){var name=src.split('/').filter(Boolean).pop(),node=getNode(src);
  if(!node)return Promise.reject(new Error('Missing source'));
  var par=getNode(dest);if(!par)return Promise.reject(new Error('Missing destination'));
  if(src===dest||dest.indexOf(src+'/')===0)return Promise.reject(new Error('Cannot move into itself'));
  par.children=par.children||{};if(par.children[name])return Promise.reject(new Error('Already exists'));
  var oldPar=getParent(src);delete oldPar.children[name];node.mtime=Date.now();par.children[name]=node;
  var base=dest?dest+'/'+name:name,chain=Promise.resolve();
  collectBlobs(src,node).forEach(function(it){var rel=it.path.slice(src.length);
    chain=chain.then(function(){return storeRead(it.path).then(function(b){
      return storeWrite(base+rel,b).then(function(){return storeDelete(it.path)})})})});
  saveTree();return chain.then(syncTree).catch(function(){syncTree()})}
function snapshotEntry(path){var node=getNode(path);if(!node)return Promise.resolve(null);
  var snap={path:path,node:JSON.parse(JSON.stringify(node)),blobs:[]};
  var chain=Promise.resolve();
  collectBlobs(path,node).forEach(function(it){chain=chain.then(function(){
    return storeRead(it.path).then(function(b){snap.blobs.push({path:it.path,blob:b})}).catch(function(){})})});
  return chain.then(function(){return snap})}
function restoreSnapshot(s){if(!s)return Promise.resolve();
  var par=getParent(s.path),name=s.path.split('/').filter(Boolean).pop();
  par.children=par.children||{};par.children[name]=s.node;
  var chain=Promise.resolve();s.blobs.forEach(function(b){chain=chain.then(function(){return storeWrite(b.path,b.blob)})});
  saveTree();return chain.then(syncTree)}

function uploadFiles(list,path){var files=Array.prototype.slice.call(list||[]);if(!files.length)return;
  var done=0,chain=Promise.resolve();
  files.forEach(function(f){chain=chain.then(function(){return new Promise(function(res){
    var r=new FileReader();r.onload=function(){var b=new Blob([r.result],{type:f.type||'application/octet-stream'});
      createFile(path,f.name,b,f.lastModified).then(function(){done++;toast('Uploaded '+done+'/'+files.length);res()})
      .catch(function(){res()})};r.onerror=function(){res()};r.readAsArrayBuffer(f)})})});
  chain.then(function(){toast(done?done+' file caricati ✓':'Nothing uploaded')})}
function uploadDir(list,path){var files=Array.prototype.slice.call(list||[]);if(!files.length)return;
  var first=files[0].webkitRelativePath||'',base=first.split('/')[0],done=0,chain=Promise.resolve();
  files.forEach(function(f){chain=chain.then(function(){return new Promise(function(res){
    var rel=(f.webkitRelativePath||f.name);if(base&&rel.indexOf(base+'/')===0)rel=rel.slice(base.length+1);
    var full=path?path+'/'+rel:rel,dirPath=full.split('/').slice(0,-1).join('/');
    var parts=dirPath.split('/').filter(Boolean),acc=path;
    parts.forEach(function(p){var n=getNode(acc);if(n){n.children=n.children||{};if(!n.children[p])n.children[p]={type:'dir',mtime:Date.now(),children:{}}}
      acc=acc?acc+'/'+p:p});
    var r=new FileReader();r.onload=function(){var b=new Blob([r.result],{type:f.type||'application/octet-stream'});
      var par=getNode(dirPath),name=rel.split('/').pop();
      if(par&&par.children&&!par.children[name]){par.children[name]={type:'file',size:b.size,mtime:f.lastModified};saveTree()}
      storeWrite(full,b).then(function(){done++;res()}).catch(res)};r.onerror=res;r.readAsArrayBuffer(f)})})});
  chain.then(function(){toast('Folder uploaded ('+done+' files)');syncTree()})}

/* ==========================================================================
   State & UI
   ========================================================================== */
var S={path:'',view:'list',query:'',sort:'name',dir:1,sel:new Set(),reader:null,clipboard:null,clipCut:false};
var EXT_ICON={pdf:'pdf',py:'code',cpp:'code',cc:'code',c:'code',h:'code',hpp:'code',java:'code',js:'code',ts:'code',jsx:'code',
  tsx:'code',html:'code',css:'code',json:'code',xml:'code',md:'file',txt:'file',csv:'file',sh:'code',sql:'code',go:'code',rs:'code',
  png:'image',jpg:'image',jpeg:'image',gif:'image',webp:'image',svg:'image',bmp:'image',ico:'image',avif:'image',
  mp3:'audio',wav:'audio',m4a:'audio',ogg:'audio',mp4:'video',webm:'video',mov:'video',zip:'archive',gz:'archive',rar:'archive','7z':'archive'};
var TYPE_COLOR={folder:'#ffd27a',code:'#4de8ff',image:'#a98bff',pdf:'#ff6b7d',audio:'#5ef0a8',video:'#ff9f68',archive:'#8fa3c4',file:'#8b9cbb'};
function extOf(n){var i=n.lastIndexOf('.');return i>0?n.slice(i+1).toLowerCase():''}
function kindOf(n,isDir){return isDir?'folder':(EXT_ICON[extOf(n)]||'file')}
function iconFor(k){return k==='folder'?'folder':k}

function visibleEntries(){var node=getNode(S.path);if(!node||!node.children)return [];
  var arr=Object.keys(node.children).map(function(n){return Object.assign({name:n},node.children[n])});
  if(S.query){var q=S.query.toLowerCase();arr=arr.filter(function(e){return e.name.toLowerCase().indexOf(q)>=0})}
  arr.sort(function(a,b){
    if(a.type!==b.type)return a.type==='dir'?-1:1;
    var r=0;
    if(S.sort==='date')r=(a.mtime||0)-(b.mtime||0);
    else if(S.sort==='size')r=(a.size||0)-(b.size||0);
    else if(S.sort==='type')r=extOf(a.name).localeCompare(extOf(b.name));
    else r=a.name.localeCompare(b.name);
    return r*S.dir});
  return arr}

function renderCrumbs(){var c=$('crumbs');c.innerHTML='';
  function add(label,path,current){var b=document.createElement('button');b.className='crumb'+(current?' on':'');
    b.textContent=label;b.onclick=function(){navigate(path)};c.appendChild(b)}
  add('Home','',S.path==='');
  var acc='';S.path.split('/').filter(Boolean).forEach(function(p,i,arr){acc=acc?acc+'/'+p:p;
    var sep=document.createElement('span');sep.className='crumb-sep';sep.textContent='›';c.appendChild(sep);
    add(p,acc,i===arr.length-1)})}

function renderTree(){var t=$('tree'),filter=$('treeSearch').value.toLowerCase();t.innerHTML='';
  function row(label,path,depth,on){var d=document.createElement('div');
    d.className='tree-row'+(path===S.path?' on':'');d.style.paddingLeft=(9+depth*13)+'px';
    d.innerHTML='<span class="caret">'+(on?'▾':depth?'›':'')+'</span>'+ico('folder')+'<span>'+esc(label)+'</span>';
    d.onclick=function(){navigate(path)};t.appendChild(d)}

   Events
   ========================================================================== */
$('viewBtn').onclick=function(){S.view=S.view==='list'?'grid':'list';
  $('viewBtn').innerHTML=ico(S.view==='grid'?'grid':'list');renderList()};
$('searchBtn').onclick=function(){$('searchBar').classList.toggle('on');if($('searchBar').classList.contains('on'))$('searchInput').focus();else{
  S.query='';$('searchInput').value='';renderAll()}};
$('searchClose').onclick=function(){$('searchBar').classList.remove('on');S.query='';$('searchInput').value='';renderAll()};
$('searchInput').addEventListener('input',function(){var t=this;clearTimeout($('searchInput')._t);
  $('searchInput')._t=setTimeout(function(){S.query=t.value;renderList();$('countLbl').textContent=visibleEntries().length+' items'},160)});
$('treeSearch').addEventListener('input',renderTree);
$('sortSel').onchange=function(){S.sort=this.value;renderList()};
$('sortDir').onclick=function(){S.dir*=-1;this.textContent=S.dir>0?'↑':'↓';renderList()};
$('menuBtn').onclick=function(){$('sidebar').classList.toggle('open')};
$('readerBack').onclick=function(){if(S.reader&&S.reader.editing)setEdit(false);closeReader()};
$('editBtn').onclick=function(){if(S.reader&&S.reader.editing)setEdit(false);else setEdit(true)};
$('copyBtn').onclick=function(){var r=S.reader;if(!r||r.text==null)return;
  if(navigator.clipboard)navigator.clipboard.writeText(r.text).then(function(){toast('Copied')});else toast('Clipboard unavailable')};
$('wrapToggle').onchange=function(){wrapOn=this.checked;document.querySelectorAll('.code-wrap').forEach(function(w){w.classList.toggle('wrap',wrapOn)});
  $('codeWrap')&&$('codeWrap').classList.toggle('wrap',wrapOn)};
$('fontPlus').onclick=function(){codeFont=Math.min(22,codeFont+1);var b=$('readerBody');b.style.fontSize=codeFont+'px';
  var e=$('editArea');if(e)e.style.fontSize=codeFont+'px'};
$('fontMinus').onclick=function(){codeFont=Math.max(9,codeFont-1);var b=$('readerBody');b.style.fontSize=codeFont+'px';
  var e=$('editArea');if(e)e.style.fontSize=codeFont+'px'};
$('pdfPrev').onclick=function(){if(pdfDoc&&pdfPage>1){pdfPage--;renderPDF()}};
$('pdfNext').onclick=function(){if(pdfDoc&&pdfPage<pdfDoc.numPages){pdfPage++;renderPDF()}};
$('pdfIn').onclick=function(){if(pdfDoc){pdfScale=Math.min(4,pdfScale+.25);renderPDF()}};
$('pdfOut').onclick=function(){if(pdfDoc){pdfScale=Math.max(.5,pdfScale-.25);renderPDF()}};

document.querySelector('.actionbar').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='home')navigate('');
  else if(a==='newfolder')promptName('New folder','Folder name','',function(v){
    createFolder(S.path,v).then(function(){toast('Folder created')}).catch(function(e){toast(e.message)})});
  else if(a==='newfile')promptName('New file','File name','untitled.txt',function(v){
    createFile(S.path,v,new Blob([''])).then(function(){toast('File created')}).catch(function(e){toast(e.message)})});
  else if(a==='upload')$('fileInput').click();
  else if(a==='backup')modal('<h3>Backup & restore</h3><p class="hint">Export the whole workspace to JSON or import a previous backup.</p>'+
    '<div class="row"><button class="btn pri" data-e>Export JSON</button><button class="btn" data-i>Import JSON</button></div>'+
    '<button class="btn" style="margin-top:10px" data-c>Close</button>',true)});
// backup modal handlers (delegated)
document.addEventListener('click',function(e){var b=e.target.closest('[data-e],[data-i],[data-c]');if(!b)return;
  if(b.hasAttribute('data-e'))exportWorkspace();if(b.hasAttribute('data-i'))importWorkspace();if(b.hasAttribute('data-c'))closeModal()});
$('fileInput').onchange=function(){uploadFiles(this.files,S.path);this.value=''};
$('dirInput').onchange=function(){uploadDir(this.files,S.path);this.value=''};

$('selBar').addEventListener('click',function(e){var b=e.target.closest('[data-bulk]');if(!b)return;var a=b.dataset.bulk,paths=Array.from(S.sel);
  if(a==='clear')clearSel();
  else if(a==='delete')confirmDelete(paths);
  else if(a==='copy'||a==='move')folderPicker(a==='copy'?'Copy to…':'Move to…',function(dest){
    var chain=Promise.resolve();var op=a==='copy'?copyEntry:moveEntry;
    paths.forEach(function(p){chain=chain.then(function(){return op(p,dest)})});
    chain.then(function(){clearSel();toast(paths.length+' item(s) '+(a==='copy'?'copied':'moved'))}).catch(function(e){toast(e.message)})});
  else if(a==='download'){paths.forEach(function(p){storeRead(p).then(function(b){download(p.split('/').pop(),b)})})}});

// drag & drop upload
['dragenter','dragover'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();
  if(e.target.closest('#fileView'))$('fileView').classList.add('drop-hint')})});
['dragleave','drop'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();
  $('fileView').classList.remove('drop-hint')})});
document.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files;if(f&&f.length)uploadFiles(f,S.path)});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();if(S.reader)closeReader();return}
  var typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('searchBar').classList.add('on');$('searchInput').focus();return}
  if(typing)return;
  if(e.key==='Backspace'&&!S.reader){e.preventDefault();var p=S.path.split('/').filter(Boolean);p.pop();navigate(p.join('/'))}
  if(e.key==='Enter'&&!S.reader){var arr=visibleEntries();if(arr.length)openEntry(S.path?S.path+'/'+arr[0].name:arr[0].name,arr[0].name,arr[0].type)}
  if(e.key==='Delete'&&S.sel.size){confirmDelete(Array.from(S.sel))}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&S.sel.size){S.clipboard=Array.from(S.sel);S.clipCut=false;toast(S.sel.size+' copied')}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'&&S.sel.size){S.clipboard=Array.from(S.sel);S.clipCut=true;toast(S.sel.size+' cut')}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&S.clipboard){var list=S.clipboard,cut=S.clipCut;
    var chain=Promise.resolve();list.forEach(function(p){chain=chain.then(function(){return (cut?moveEntry:copyEntry)(p,S.path)})});
    chain.then(function(){S.clipboard=null;toast('Pasted')});}
});

/* init */
renderAll();updateUsage();
window.__fm={S:S,tree:tree,navigate:navigate,visibleEntries:visibleEntries,copyEntry:copyEntry,moveEntry:moveEntry,
  bulkDelete:bulkDelete,snapshotEntry:snapshotEntry,restoreSnapshot:restoreSnapshot,openText:openText};
})();
</script>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})</script>
</body>
