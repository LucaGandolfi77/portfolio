<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Radio Player — Luca Gandolfi</title>
  <link href="./assets/css/main.css" rel="stylesheet">
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial;background:#071023;color:#e6f7ff;padding:24px}
    .wrap{max-width:980px;margin:0 auto}
    h1{margin:0 0 12px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    input[type=search],input[type=text]{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;flex:1}
    button{background:#00d4ff;color:#002;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
    .stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
    .station{background:rgba(255,255,255,0.03);padding:12px;border-radius:10px;display:flex;gap:10px;align-items:center}
    .meta{flex:1}
    .station img{width:56px;height:56px;border-radius:8px;object-fit:cover}
    .now{margin-top:14px;display:flex;align-items:center;gap:12px}
    .now .title{font-weight:700}
    canvas{width:100%;height:60px;border-radius:8px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01))}
    .small{font-size:0.9rem;color:#9fcfff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Radio Player</h1>
    <p class="small">Ascolta stazioni Internet usando la Radio Browser API. Usa il campo per cercare o incolla l'URL diretto di uno stream.</p>

    <div class="controls">
      <input id="q" type="search" placeholder="Cerca stazioni (es. jazz, rock, milano)" />
      <button id="searchBtn">Cerca</button>
      <button id="topBtn">Top 20</button>
      <input id="urlInput" type="text" placeholder="Incolla stream URL (es. http://...)" style="max-width:360px" />
      <button id="playUrlBtn">Play URL</button>
    </div>

    <div id="stations" class="stations" aria-live="polite"></div>

    <div class="now" id="nowPlaying" style="display:none">
      <img id="nowFavicon" src="" alt="" style="width:72px;height:72px;border-radius:8px;object-fit:cover" />
      <div>
        <div class="title" id="nowTitle">-</div>
        <div class="small" id="nowMeta">-</div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
          <button id="playPause">Play</button>
          <label class="small">Volume</label>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
        </div>
      </div>
    </div>

    <canvas id="vis" width="800" height="60" style="margin-top:12px"></canvas>

    <audio id="player" crossorigin="anonymous"></audio>
  </div>

  <script>
    const apiBase = 'https://de1.api.radio-browser.info/json';
    const stationsEl = document.getElementById('stations');
    const qEl = document.getElementById('q');
    const searchBtn = document.getElementById('searchBtn');
    const topBtn = document.getElementById('topBtn');
    const player = document.getElementById('player');
    const now = document.getElementById('nowPlaying');
    const nowTitle = document.getElementById('nowTitle');
    const nowMeta = document.getElementById('nowMeta');
    const nowFavicon = document.getElementById('nowFavicon');
    const playPause = document.getElementById('playPause');
    const volume = document.getElementById('volume');
    const urlInput = document.getElementById('urlInput');
    const playUrlBtn = document.getElementById('playUrlBtn');

    // Web Audio visualizer
    let audioCtx, sourceNode, analyser, dataArray;
    const canvas = document.getElementById('vis');
    const ctx = canvas.getContext('2d');

    function ensureAudioContext(){
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sourceNode = audioCtx.createMediaElementSource(player);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        draw();
      }
    }

    function draw(){
      if(!analyser) return;
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const w = canvas.width / dataArray.length;
      for(let i=0;i<dataArray.length;i++){
        const v = dataArray[i]/255;
        const h = v * canvas.height;
        ctx.fillStyle = 'rgba(0,212,255,'+(0.25+v*0.75)+')';
        ctx.fillRect(i*w, canvas.height - h, w*0.9, h);
      }
    }

    function renderStations(list){
      stationsEl.innerHTML = '';
      if(!list || !list.length){ stationsEl.innerHTML = '<div class="small">Nessuna stazione trovata.</div>'; return; }
      list.forEach(s => {
        const a = document.createElement('div');
        a.className = 'station';
        const img = document.createElement('img');
        img.src = s.favicon || 'https://icons.duckduckgo.com/ip3/' + (new URL(s.url_resolved)).hostname + '.ico';
        img.onerror = ()=>{ img.src = './assets/favicon.svg'; }
        const meta = document.createElement('div'); meta.className='meta';
        meta.innerHTML = `<div style="font-weight:700">${escapeHtml(s.name)}</div><div class="small">${escapeHtml(s.country)} · ${escapeHtml(s.language || '')} · ${escapeHtml(s.tags || '')}</div>`;
        const btn = document.createElement('button'); btn.textContent = 'Play';
        btn.onclick = ()=> playStation(s.url_resolved, s.name, s.favicon);
        a.appendChild(img); a.appendChild(meta); a.appendChild(btn);
        stationsEl.appendChild(a);
      });
    }

    function escapeHtml(t){ if(!t) return ''; return String(t).replace(/[&<>\"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

    async function search(q){
      stationsEl.innerHTML = '<div class="small">Caricamento…</div>';
      try{
        const resp = await fetch(`${apiBase}/stations/search?name=${encodeURIComponent(q)}&limit=30`);
        const data = await resp.json();
        renderStations(data);
      }catch(e){ stationsEl.innerHTML = '<div class="small">Errore nella ricerca.</div>'; console.error(e); }
    }

    async function top(){
      stationsEl.innerHTML = '<div class="small">Caricamento Top 20…</div>';
      try{
        const resp = await fetch(`${apiBase}/stations/topvote/20`);
        const data = await resp.json();
        renderStations(data);
      }catch(e){ stationsEl.innerHTML = '<div class="small">Errore nel caricamento Top.</div>'; console.error(e); }
    }

    function playStation(url, name, favicon){
      ensureAudioContext();
      player.src = url;
      player.play().then(()=>{
        now.style.display='flex';
        nowTitle.textContent = name;
        nowMeta.textContent = url;
        nowFavicon.src = favicon || './assets/favicon.svg';
        playPause.textContent = 'Pause';
        navigator.mediaSession && (navigator.mediaSession.metadata = new MediaMetadata({ title: name, artist: 'Internet Radio' }));
      }).catch(err=>{
        alert('Impossibile riprodurre la stazione. URL potrebbe non permettere il CORS o essere offline.');
        console.error(err);
      });
    }

    playPause.onclick = ()=>{
      if(player.paused){ player.play(); playPause.textContent='Pause'; } else { player.pause(); playPause.textContent='Play'; }
    }

    volume.oninput = ()=>{ player.volume = volume.value; }

    searchBtn.onclick = ()=>{ const q = qEl.value.trim(); if(q) search(q); }
    topBtn.onclick = ()=> top();
    playUrlBtn.onclick = ()=>{ const u = urlInput.value.trim(); if(!u) return alert('Inserisci uno stream URL'); playStation(u, u, ''); }

    // Media Session handlers for improved UX on mobile and desktop
    if('mediaSession' in navigator){
      navigator.mediaSession.setActionHandler('play', ()=> player.play());
      navigator.mediaSession.setActionHandler('pause', ()=> player.pause());
    }

    // Auto-load top list on open
    top();

    // Resume AudioContext on first user gesture to avoid autoplay restrictions
    document.addEventListener('click', ()=>{
      if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
    }, { once:true });
  </script>
</body>
<script src="top_buttons.js"></script>
</html>
