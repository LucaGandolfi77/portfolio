<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sierpinski Triangle Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1724;
            --card: #1a2a3a;
            --accent: #00d4ff;
            --text: #e6f1ff;
            --text-dim: #a0c0e0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .app-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .app-layout { grid-template-columns: 1fr; }
        }

        .canvas-container {
            background: #000;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            aspect-ratio: 4/3;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        h2 { margin-top: 0; color: var(--accent); font-size: 1.2rem; }
        
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }
        
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        
        .mode-tabs {
            display: flex;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: 8px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .tab.active {
            background: rgba(255,255,255,0.1);
            color: white;
            font-weight: 600;
        }

        .stats {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <a href="technology.html" class="back-btn">← Back to Technology</a>
            <h1 style="margin:0; font-size:20px;">Sierpinski Triangle Explorer 📐</h1>
        </header>

        <div class="app-layout">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="fractalCanvas"></canvas>
            </div>

            <div class="controls">
                <div class="mode-tabs">
                    <div class="tab active" onclick="setMode('recursive')">Recursive</div>
                    <div class="tab" onclick="setMode('chaos')">Chaos Game</div>
                </div>

                <div id="recursiveControls">
                    <h2>Recursive Settings</h2>
                    <div class="control-group">
                        <label>Recursion Depth: <span id="depthVal">5</span></label>
                        <input type="range" id="depthSlider" min="0" max="9" value="5" oninput="updateRecursive()">
                    </div>
                </div>

                <div id="chaosControls" style="display:none;">
                    <h2>Chaos Game Settings</h2>
                    <div class="control-group">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="1" max="100" value="50">
                    </div>
                    <button class="btn btn-primary" id="btnStartChaos" onclick="toggleChaos()">Start</button>
                    <button class="btn btn-secondary" onclick="resetChaos()">Reset</button>
                </div>

                <div class="control-group">
                    <label>Triangle Color</label>
                    <input type="color" id="colorPicker" value="#00d4ff" onchange="updateColor()">
                </div>

                <div class="stats" id="statsDisplay">
                    Triangles: 243
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fractalCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        
        let width, height;
        let mode = 'recursive';
        let depth = 5;
        let color = '#00d4ff';
        
        // Chaos Game State
        let chaosRunning = false;
        let chaosPoint = {x: 0, y: 0};
        let chaosVertices = [];
        let chaosPointsCount = 0;
        let animationId;

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            if (mode === 'recursive') drawRecursive();
            else if (!chaosRunning && chaosPointsCount === 0) resetChaos();
        }
        window.addEventListener('resize', resize);

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('recursiveControls').style.display = m === 'recursive' ? 'block' : 'none';
            document.getElementById('chaosControls').style.display = m === 'chaos' ? 'block' : 'none';
            
            if (m === 'recursive') {
                stopChaos();
                drawRecursive();
            } else {
                resetChaos();
            }
        }

        function updateColor() {
            color = document.getElementById('colorPicker').value;
            if (mode === 'recursive') drawRecursive();
        }

        // --- Recursive Mode ---

        function updateRecursive() {
            depth = parseInt(document.getElementById('depthSlider').value);
            document.getElementById('depthVal').textContent = depth;
            drawRecursive();
        }

        function drawRecursive() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = color;
            
            const pad = 20;
            const h = height - pad * 2;
            const w = h * (2 / Math.sqrt(3)); // Equilateral triangle ratio
            
            const p1 = { x: width / 2, y: pad };
            const p2 = { x: (width - w) / 2, y: height - pad };
            const p3 = { x: (width + w) / 2, y: height - pad };

            let count = 0;

            function drawTri(a, b, c, d) {
                if (d === 0) {
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.lineTo(c.x, c.y);
                    ctx.fill();
                    count++;
                } else {
                    const ab = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                    const bc = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2 };
                    const ca = { x: (c.x + a.x) / 2, y: (c.y + a.y) / 2 };
                    
                    drawTri(a, ab, ca, d - 1);
                    drawTri(ab, b, bc, d - 1);
                    drawTri(ca, bc, c, d - 1);
                }
            }

            drawTri(p1, p2, p3, depth);
            document.getElementById('statsDisplay').textContent = `Triangles: ${count}`;
        }

        // --- Chaos Game Mode ---

        function resetChaos() {
            stopChaos();
            ctx.clearRect(0, 0, width, height);
            chaosPointsCount = 0;
            document.getElementById('statsDisplay').textContent = `Points: 0`;
            
            const pad = 20;
            const h = height - pad * 2;
            const w = h * (2 / Math.sqrt(3));
            
            chaosVertices = [
                { x: width / 2, y: pad },
                { x: (width - w) / 2, y: height - pad },
                { x: (width + w) / 2, y: height - pad }
            ];

            // Draw vertices
            ctx.fillStyle = '#fff';
            chaosVertices.forEach(v => {
                ctx.beginPath();
                ctx.arc(v.x, v.y, 4, 0, Math.PI*2);
                ctx.fill();
            });

            // Random start point
            chaosPoint = {
                x: Math.random() * width,
                y: Math.random() * height
            };
        }

        function toggleChaos() {
            if (chaosRunning) stopChaos();
            else startChaos();
        }

        function startChaos() {
            chaosRunning = true;
            document.getElementById('btnStartChaos').textContent = "Pause";
            loopChaos();
        }

        function stopChaos() {
            chaosRunning = false;
            document.getElementById('btnStartChaos').textContent = "Start";
            cancelAnimationFrame(animationId);
        }

        function loopChaos() {
            if (!chaosRunning) return;

            const speed = parseInt(document.getElementById('speedSlider').value);
            const pointsPerFrame = Math.floor(Math.pow(speed, 1.5)); // Non-linear speed

            ctx.fillStyle = color;
            
            for (let i = 0; i < pointsPerFrame; i++) {
                const target = chaosVertices[Math.floor(Math.random() * 3)];
                chaosPoint.x = (chaosPoint.x + target.x) / 2;
                chaosPoint.y = (chaosPoint.y + target.y) / 2;
                
                // Skip first few points to converge to triangle
                if (chaosPointsCount > 20) {
                    ctx.fillRect(chaosPoint.x, chaosPoint.y, 1, 1);
                }
                chaosPointsCount++;
            }
            
            document.getElementById('statsDisplay').textContent = `Points: ${chaosPointsCount}`;
            animationId = requestAnimationFrame(loopChaos);
        }

        // Init
        resize();
        drawRecursive();

    </script>
</body>
<script src="top_buttons.js"></script>
</html>
