<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Croquet — physics sandbox</title>
	<style> body{ margin:0; font-family:Inter,system-ui; background:#0b1220; color:#eef } canvas{ display:block; width:100vw; height:100vh }</style>
	<script>
		// Simple physics playground with draggable circles
	</script>
</head>
<body>
	<canvas id="c"></canvas>
	<script>
		const cvs=document.getElementById('c'); const ctx=cvs.getContext('2d'); function fit(){ cvs.width=innerWidth; cvs.height=innerHeight; } addEventListener('resize',fit); fit();
		class Ball{ constructor(x,y){ this.x=x; this.y=y; this.vx=0; this.vy=0; this.r=30; } update(){ this.vy+=0.4; this.x+=this.vx; this.y+=this.vy; if(this.y>cvs.height-this.r){ this.y=cvs.height-this.r; this.vy*=-0.6; } if(this.x< this.r){ this.x=this.r; this.vx*=-0.6 } if(this.x>cvs.width-this.r){ this.x=cvs.width-this.r; this.vx*=-0.6 } } draw(){ ctx.beginPath(); ctx.fillStyle='#7de0ff'; ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); }}
		const balls=[]; for(let i=0;i<8;i++) balls.push(new Ball(100+i*80,80));
		let drag=null, ox=0, oy=0; cvs.addEventListener('pointerdown', e=>{ const x=e.clientX, y=e.clientY; for(const b of balls){ if(Math.hypot(b.x-x,b.y-y)<b.r){ drag=b; ox=x-b.x; oy=y-b.y; b.vx=b.vy=0; break } } });
		addEventListener('pointermove', e=>{ if(drag){ drag.x=e.clientX-ox; drag.y=e.clientY-oy } }); addEventListener('pointerup', ()=>{ drag=null });
		function loop(){ ctx.fillStyle='rgba(10,16,32,0.24)'; ctx.fillRect(0,0,cvs.width,cvs.height); for(const b of balls){ if(!drag||b!==drag) b.update(); b.draw(); } requestAnimationFrame(loop);} loop();
	</script>
</body>
<script src="top_buttons.js"></script>
</html>
