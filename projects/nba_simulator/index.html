<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="30-team NBA simulator with tactics, franchise mode, advanced analytics and an offline PWA.">
  <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/nba_simulator/index.html">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="../_shared/tokens.css">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="../_shared/shell.css">
  <link rel="stylesheet" href="./style.css">
  <title>NBA Broadcast Simulator — Luca Gandolfi</title>
</head>
<body>
  <header data-project-shell data-title="NBA Simulator" data-id="nba-simulator"
          data-back="../../projects.html" data-home="../../index.html" data-languages="en,it" data-heading="div"></header>

  <main class="app">
    <h1 class="sr-only" data-i18n="title">NBA Broadcast Simulator</h1>

    <section id="view-match" class="view">
      <div class="setup card">
        <label><span data-i18n="home">Home</span><select id="selHome"></select></label>
        <label><span data-i18n="away">Away</span><select id="selAway"></select></label>
        <label><span data-i18n="prediction">Prediction</span><select id="selPred">
          <option value="home" data-i18n="home">Home</option>
          <option value="away" data-i18n="away">Away</option>
          <option value="tie">Tie</option>
        </select></label>
        <button class="btn primary" id="btnTipoff" data-i18n="tipoff">TIP OFF</button>
        <button class="btn" id="btnRandom" data-i18n="random">Random</button>
      </div>

      <div class="scorebug card">
        <div class="team home"><b id="homeAbbr">—</b><strong id="scoreHome">0</strong></div>
        <div class="clock"><span id="quarter">Q1</span><b id="clock">12:00</b><small id="poss"></small></div>
        <div class="team away"><b id="awayAbbr">—</b><strong id="scoreAway">0</strong></div>
      </div>
      <div class="badges"><span id="momentum">Momentum ·</span><span id="clutch" hidden data-i18n="clutch">CLUTCH</span></div>

      <div class="match-grid">
        <div class="court-wrap" id="courtWrap"><canvas id="court" aria-label="Basketball court"></canvas></div>
        <div class="feed card"><div id="feed" aria-live="polite"></div></div>
      </div>

      <div class="controls">
        <button class="btn" id="btnPause" data-i18n="pause">Pause</button>
        <button class="btn" id="btnSpeed" data-i18n="speed">Speed ×1</button>
        <button class="btn" id="btnSound" data-i18n="sound">Sound</button>
        <button class="btn" id="btnReplay" data-i18n="replay">Replay</button>
        <button class="btn" id="btnShare" data-i18n="share">Share</button>
        <button class="btn" id="btnSimEnd" data-i18n="simToEnd">Sim to end</button>
      </div>
      <div id="resultCard" class="card result" hidden><h2 id="finalText" data-i18n="final">Final</h2></div>
      <div class="box-wrap card"><div id="boxBody"></div></div>
    </section>

    <section id="view-season" class="view" hidden>
      <div class="card">
        <h2 data-i18n="season">Season</h2>
        <p id="seasonWeek"></p>
        <button class="btn primary" id="btnPlayWeek" data-i18n="playWeek">Simulate week</button>
        <button class="btn" id="btnSimSeason" data-i18n="simToEnd">Sim to end</button>
        <button class="btn" id="btnNewSeason" data-i18n="newSeason">New season</button>
      </div>
      <div class="card"><h3 data-i18n="standings">Standings</h3><div id="standingsBody"></div></div>
      <div class="card"><h3 data-i18n="history">Results</h3><div id="seasonResults"></div></div>
    </section>

    <section id="view-playoffs" class="view" hidden>
      <div class="card">
        <h2 data-i18n="playoffs">Playoffs</h2>
        <button class="btn primary" id="btnCreateBracket" data-i18n="createBracket">Create bracket</button>
        <button class="btn" id="btnPlayRound" data-i18n="playWeek">Play round</button>
        <p id="champion"></p>
      </div>
      <div id="bracket" class="card"></div>
    </section>

    <section id="view-teams" class="view" hidden>
      <div class="card">
        <select id="teamSelect"></select>
        <div id="rosterBody"></div>
        <div class="strategy">
          <label data-i18n="pace">Pace</label><input type="range" id="stratPace" min="0" max="100" value="50">
          <label data-i18n="threeRate">3PT rate</label><input type="range" id="stratThree" min="0" max="100" value="50">
          <label data-i18n="defense">Defense</label><input type="range" id="stratDef" min="0" max="100" value="50">
          <label data-i18n="rotation">Rotation</label><input type="range" id="stratRot" min="0" max="100" value="50">
        </div>
        <button class="btn primary" id="btnSaveTeam" data-i18n="save">Save team</button>
        <button class="btn" id="btnCreateTeam" data-i18n="createTeam">Create team</button>
      </div>
      <div class="card"><h3 data-i18n="freeAgents">Free agents</h3><div id="faList"></div>
        <button class="btn" id="btnTrade" data-i18n="trade">Trade</button>
        <button class="btn" id="btnDraft" data-i18n="draft">Draft</button>
      </div>
    </section>

    <section id="view-stats" class="view" hidden>
      <div class="card"><h2 data-i18n="advanced">Advanced metrics</h2><div id="statLeaders"></div></div>
      <div class="charts">
        <canvas id="chartPoints"></canvas><canvas id="chartWin"></canvas>
        <canvas id="chartShots"></canvas><canvas id="chartCompare"></canvas>
      </div>
      <div class="card">
        <button class="btn primary" id="btnQuickSim" data-i18n="quickSim">Quick sim</button>
        <span id="quickSimResult"></span>
      </div>
    </section>

    <section id="view-career" class="view" hidden>
      <div class="card">
        <h2 data-i18n="career">Career</h2>
        <p data-i18n="year">Year</p><b id="careerYear">2026</b>
        <p data-i18n="level">Level</p><b id="careerLevel">1</b> · <span data-i18n="xp">XP</span> <b id="careerXp">0</b>
        <div id="careerBadges"></div>
        <button class="btn primary" id="btnAdvance" data-i18n="advance">Advance season</button>
      </div>
      <div class="card"><h3 data-i18n="daily">Daily challenge</h3><p id="dailyText"></p></div>
      <div class="card"><label data-i18n="quality">Graphics</label><select id="quality"><option value="high" data-i18n="high">High</option><option value="low" data-i18n="low">Low</option></select></div>
    </section>

    <nav class="tabbar">
      <button data-view="match" class="active" data-i18n="match">Game</button>
      <button data-view="season" data-i18n="season">Season</button>
      <button data-view="playoffs" data-i18n="playoffs">Playoffs</button>
      <button data-view="teams" data-i18n="teams">Teams</button>
      <button data-view="stats" data-i18n="stats">Analytics</button>
      <button data-view="career" data-i18n="career">Career</button>
    </nav>
  </main>

  <div id="infoModal" class="modal" hidden><div class="card">
    <h2 data-i18n="howTitle">How it works</h2><p data-i18n="howText"></p>
    <button class="btn primary" id="btnInfoClose" data-i18n="close">Close</button>
  </div></div>
  <button id="btnInfo" class="info-fab" aria-label="Info">ℹ️</button>
  <div id="toast" aria-live="polite"></div>

  <script src="../_shared/shell.js" defer></script>
  <script type="module" src="js/app.js"></script>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})</script>
</body>
</html>
