<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080912">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="RAVE — Real-Time Artistic Vision Engine: trasforma la webcam in arte con 11 filtri shader in tempo reale, scatti, registrazione e comandi vocali.">
  <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/rave/">
  <title>RAVE — Real-Time Artistic Vision Engine</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <button class="icon-btn" id="btnExit" data-i18n-title="action.exit" title="Exit" aria-label="Exit">✕</button>
    <div class="brand">
      <span class="brand-mark">🎨</span>
      <div><strong>RAVE</strong><small data-i18n="app.tagline">REALTIME ARTISTIC VISION ENGINE</small></div>
    </div>
    <div class="pills">
      <span class="pill" id="cameraPill">● Camera</span>
      <span class="pill" id="fpsPill">— FPS</span>
      <span class="pill accent" id="stylePill">📷 Original</span>
    </div>
    <button class="icon-btn" id="btnLang" title="Language" aria-label="Language">🇮🇹 IT</button>
    <button class="icon-btn" id="btnFullscreen" data-i18n-title="action.fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  </header>

  <div class="workspace">
    <nav id="styleRail" aria-label="Art styles"></nav>

    <main id="viewport">
      <video id="video" playsinline webkit-playsinline muted autoplay></video>
      <canvas id="glCanvas" aria-label="Filtered camera preview"></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div id="loading">Starting camera…</div>

      <div class="viewport-actions">
        <button class="round-btn" id="btnSplit" title="Before / After" aria-label="Before / After">◐</button>
        <button class="round-btn primary" id="btnCapture" title="Capture" aria-label="Capture">●</button>
        <button class="round-btn" id="btnGallery" title="Gallery" aria-label="Gallery">▦</button>
      </div>
    </main>
  </div>

  <div id="controls">
    <div class="control-group" id="splitRow">
      <span class="control-label" data-i18n="label.beforeAfter">Before / After</span>
      <input type="range" id="splitRange" min="0" max="1" step="0.01" value="1" aria-label="Before after divider">
      <span class="control-value">↔</span>
    </div>
    <div class="control-group">
      <span class="control-label" data-i18n="label.intensity">Intensity</span>
      <input type="range" id="intensity" min="0" max="1" step="0.01" value="1" aria-label="Filter intensity">
      <span class="control-value" id="intensityVal">100%</span>
    </div>
    <div class="control-buttons">
      <button class="ctrl-btn" id="btnVoice" data-i18n-title="action.voice" title="Voice commands" aria-label="Voice commands">🎤</button>
      <button class="ctrl-btn" id="btnCamera" data-i18n-title="action.cameraSwitch" title="Switch camera" aria-label="Switch camera">🔄</button>
      <button class="ctrl-btn" id="btnRecord" data-i18n-title="action.record" title="Record" aria-label="Record">⏺</button>
    </div>
  </div>

  <section id="gallerySheet" aria-label="Snapshot gallery">
    <div class="sheet-head">
      <h2 data-i18n="label.gallery">Gallery</h2>
      <div class="row">
        <button class="ghost-btn" id="btnGalleryClear" data-i18n="action.clear">Clear gallery</button>
        <button class="ghost-btn" id="btnGalleryClose" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="sheet-grid" id="galleryList"></div>
    <p class="muted" id="galleryEmpty">No snapshots yet.</p>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="./js/main.js"></script>
<script src="../../top_buttons.js" defer></script>
</body>
</html>
