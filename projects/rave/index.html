<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="RAVE – Real-Time Artistic Vision Engine. Trasforma la webcam in arte.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <title>RAVE – Real-Time Artistic Vision Engine</title>
</head>
<body>
<div id="app">

  <!-- top bar -->
  <header id="topbar">
    <button class="btn-icon" id="btn-exit" title="Exit">✕</button>
    <span class="title">RAVE</span>
    <button class="btn-icon" id="btn-fullscreen" title="Fullscreen">⛶</button>
  </header>

  <!-- style selector -->
  <nav id="style-bar">
    <button class="style-btn active" data-style="none">Originale</button>
    <button class="style-btn" data-style="vangogh">Van Gogh</button>
    <button class="style-btn" data-style="picasso">Picasso</button>
    <button class="style-btn" data-style="monet">Monet</button>
    <button class="style-btn" data-style="hokusai">Hokusai</button>
  </nav>

  <!-- viewport: video + webgl canvas -->
  <div id="viewport">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="glCanvas"></canvas>
    <div id="loading">Avvio camera...</div>
  </div>

  <!-- bottom controls -->
  <div id="controls">
    <!-- intensity slider -->
    <div id="intensity-row">
      <label>⚙</label>
      <input type="range" id="intensity" min="0" max="1" step="0.01" value="1">
      <span id="intensity-val">100%</span>
    </div>
    <!-- buttons -->
    <div id="btn-row">
      <button class="ctrl-btn" id="btn-voice" title="Voice Commands">🎤</button>
      <button class="ctrl-btn" id="btn-camera" title="Switch Camera">🔄</button>
      <button class="ctrl-btn" id="btn-capture" title="Capture"></button>
      <button class="ctrl-btn" id="btn-record" title="Record Video">⏺</button>
    </div>
  </div>

</div>

<!-- scripts -->
<script src="shaders.js"></script>
<script src="camera.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
