<!doctype html>
<html lang="it" data-skin="play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140a1e">
<meta name="color-scheme" content="dark">
<meta name="description" content="Cockpit Arena — allena un gallo, scommetti con crediti virtuali e vinci il campionato. Simulazioni AI e combattimenti abilità.">
<title>Cockpit Arena — Championship Simulator</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/cock-fight/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app">Skip to content</a>
<header data-project-shell data-title="Cockpit Arena" data-id="cock-fight"
  data-back="../../projects.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<main id="app">
  <section class="hero">
    <div class="hero-icon">🐓</div>
    <div><h1 data-i18n="title">COCKPIT ARENA</h1>
      <p data-i18n="tagline">Allena il tuo gallo. Scommetti. Vinci il campionato.</p></div>
    <div class="wallet">💰 <b id="walletAmt">€500</b></div>
  </section>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="arena" class="on">⚔ <span data-i18n="fight">Combatti</span></button>
    <button data-tab="train">🏋 <span data-i18n="training">Allenamento</span></button>
    <button data-tab="championship">🏆 <span data-i18n="championship">Campionato</span></button>
    <button data-tab="betting">🎰 <span data-i18n="betting">Scommesse</span></button>
    <button data-tab="simulator">🔬 <span data-i18n="simulator">Simulatore AI</span></button>
  </nav>

  <section class="panel" id="tab-arena">
    <div class="arena-wrap">
      <canvas id="arena" aria-label="Arena"></canvas>
      <div class="arena-tip" data-i18n="tip">Scegli un’azione: il tempismo conta!</div>
    </div>
    <div class="actions" id="actionRow">
      <button class="btn attack" id="act-attack">⚔ <span data-i18n="attack">Attacco</span><kbd>1</kbd></button>
      <button class="btn" id="act-defend">🛡 <span data-i18n="defend">Difesa</span><kbd>2</kbd></button>
      <button class="btn" id="act-wait">⏳ <span data-i18n="wait">Attesa</span><kbd>3</kbd></button>
      <button class="btn special" id="act-special">✨ <span data-i18n="special">Speciale</span><kbd>4</kbd></button>
    </div>
    <div class="log" id="fightLog" aria-live="polite"></div>
    <button class="btn primary wide" id="nextRoundBtn" data-i18n="nextRound">Prossimo round</button>
  </section>

  <section class="panel hidden" id="tab-train">
    <div id="roosterCard"></div>
    <h2 data-i18n="stats">Statistiche</h2>
    <div id="statList" class="stats"></div>
    <h2 data-i18n="equipment">Equipaggiamento</h2>
    <div id="equipList" class="equip-list"></div>
  </section>

  <section class="panel hidden" id="tab-championship">
    <div id="championBadge" class="champion hidden">🏆 <span data-i18n="champion">CAMPIONE!</span></div>
    <div id="champStats" class="champ-stats"></div>
    <div id="roundList" class="round-list"></div>
  </section>

  <section class="panel hidden" id="tab-betting">
    <h2 data-i18n="betting">Scommesse</h2>
    <p class="note" id="houseNote"></p>
    <div class="odds" id="betOdds">—</div>
    <div class="stakes" id="stakeBtns">
      <button data-stake="10">10</button><button data-stake="25">25</button>
      <button data-stake="50">50</button><button data-stake="100">100</button>
    </div>
    <div class="bet-market">
      <button class="btn primary" id="betWinBtn" data-i18n="betWin">Vince il tuo gallo</button>
      <button class="btn" id="betLoseBtn" data-i18n="betLose">Vince l’avversario</button>
      <button class="btn" id="betRoundsBtn" data-i18n="betRounds">Finito al round</button>
    </div>
    <h3 data-i18n="bankroll">Storico scommesse</h3>
    <div id="betHistory" class="bet-history"></div>
  </section>

  <section class="panel hidden" id="tab-simulator">
    <h2 data-i18n="simulator">Simulatore AI</h2>
    <div class="sim-row">
      <select id="simASelect" aria-label="Rooster A"></select>
      <span>VS</span>
      <select id="simBSelect" aria-label="Rooster B"></select>
    </div>
    <div class="sim-actions">
      <button class="btn primary" id="simBtn" data-i18n="simulate">Simula</button>
      <button class="btn" id="simBetBtn" data-i18n="placeBet">Piazza scommessa</button>
    </div>
    <div id="simResult"></div>
  </section>

  <footer>🎮 <span data-i18n="tagline">Simulazione · solo crediti virtuali</span></footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../_shared/shell.js" defer></script>
</body>
</html>
