<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>I Due Lumi — Gioca</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="tx"></canvas>
  </div>
  <div id="hud">
    <div id="lbar"><div id="lfill"></div><div id="ltxt">20/20</div></div>
    <div id="nbar"><div id="nfill"></div></div>
  </div>
  <div id="dlg"><div id="dlgname"></div><div id="dlgtxt"></div><div id="dlgopt"></div></div>
  <div id="menu"><div id="menuinner"></div></div>
  <div id="info"></div>
  <div id="touch">
    <div class="dpad">
      <button class="dbtn up" data-dir="up" aria-label="Su">▲</button>
      <button class="dbtn left" data-dir="left" aria-label="Sinistra">◀</button>
      <button class="dbtn right" data-dir="right" aria-label="Destra">▶</button>
      <button class="dbtn down" data-dir="down" aria-label="Giù">▼</button>
    </div>
    <div class="abtns">
      <button class="abtn" data-key="b" aria-label="B">B</button>
      <button class="abtn" data-key="a" aria-label="A">A</button>
      <button class="abtn start" data-key="start" aria-label="Start">START</button>
    </div>
  </div>
</div>
<script src="js/palette.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/engine.js"></script>
<script src="js/textlayer.js"></script>
<script src="js/world.js"></script>
<script src="js/textui.js"></script>
<script src="js/items.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/ui.js"></script>
<script src="js/overworld.js"></script>
<script src="js/battle.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
