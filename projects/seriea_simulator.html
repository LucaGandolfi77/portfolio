<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serie A Match Simulator</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-color: #16213e;
            --accent-color: #0fb9b1;
            --text-color: #ffffff;
            --pitch-color: #20bf6b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #a0c0e0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Setup Screen */
        #setup-screen {
            background: var(--card-color);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .team-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 20px;
            font-size: 1.2rem;
            background: #0f3460;
            color: white;
            border: 2px solid #533483;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(15, 185, 177, 0.4);
        }

        .btn:hover { transform: scale(1.05); }

        /* Game Screen */
        #game-screen {
            display: none;
            width: 100%;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #333;
            background: linear-gradient(to bottom, #333, #111);
        }

        .team-score-box {
            text-align: center;
            width: 150px;
        }

        .team-name { font-size: 1.2rem; color: #fff; margin-bottom: 5px; font-weight:bold; }
        .score-display { font-size: 3rem; font-weight: bold; font-family: 'Courier New', monospace; color: #0fb9b1; }
        
        .game-info {
            text-align: center;
            color: #e0e0e0;
        }
        .half-indicator { font-size: 1rem; font-weight: bold; color: #ffeb3b; }
        .time { font-size: 2rem; font-family: 'Courier New', monospace; }

        .game-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Feed */
        .feed-container {
            width: 100%;
            height: 300px;
            background: var(--card-color);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: 'Courier New', monospace;
        }

        .feed-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease-out;
            line-height: 1.4;
            flex-shrink: 0;
            display: flex;
        }
        .feed-timestamp { color: #888; margin-right: 10px; min-width: 40px; }
        .feed-text { flex: 1; }
        
        .feed-item.goal { color: #2ecc71; font-weight: bold; background: rgba(46, 204, 113, 0.1); border-left: 4px solid #2ecc71; }
        .feed-item.chance { color: #f1c40f; }
        .feed-item.card { color: #e74c3c; }
        .feed-item.intro { color: #3498db; font-style: italic; border-bottom: 1px dashed #555; }
        
        /* Stats Panel */
        .stats-panel {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            font-size: 0.85rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 2px;}

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            header h1 {
                font-size: 1.8rem !important;
            }
            
            .scoreboard {
                padding: 10px 15px;
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .team-score-box {
                width: 120px;
            }
            
            .team-name {
                font-size: 1rem;
            }
            
            .score-display {
                font-size: 2.5rem;
            }
            
            .time {
                font-size: 1.5rem;
            }
            
            .stats-panel { 
                grid-template-columns: 1fr;
                padding: 10px;
                font-size: 0.8rem;
            }
            
            .feed-container { 
                height: 350px;
                padding: 10px;
                font-size: 0.85rem;
            }
            
            select {
                font-size: 1rem;
                padding: 8px 15px;
            }
            
            .btn {
                font-size: 1.2rem;
                padding: 12px 30px;
            }
            
            #setup-screen {
                padding: 20px;
            }
        }
    </style>
</head>

    <div class="container" style="margin-top: 40px;">
        <header>
            <h1 style="font-size: 2.5rem; margin-bottom: 5px;">SERIE A SIMULATOR</h1>
            <p style="color: #888;">Live Text Commentary • Official Teams • Player Stats</p>
        </header>

        <!-- SETUP -->
        <div id="setup-screen">
            <h2>Imposta Partita</h2>
            <div class="team-selector">
                <div>
                    <label style="display:block; margin-bottom:10px; color:#aaa">CASA</label>
                    <select id="home-select"></select>
                </div>
                <div style="display:flex; align-items:center; font-size:1.5rem; font-weight:bold; color:#555">VS</div>
                <div>
                    <label style="display:block; margin-bottom:10px; color:#aaa">TRASFERTA</label>
                    <select id="away-select"></select>
                </div>
            </div>
            
            <button class="btn" onclick="startMatch()">FISCHIO D'INIZIO</button>
        </div>

        <!-- GAME -->
        <div id="game-screen">
            <div class="scoreboard">
                <div class="team-score-box">
                    <div class="team-name" id="board-home-name">INTER</div>
                    <div class="score-display" id="board-home-score">0</div>
                </div>
                <div class="game-info">
                    <div class="half-indicator" id="board-half">1° TEMPO</div>
                    <div class="time" id="board-time">00:00</div>
                </div>
                <div class="team-score-box">
                    <div class="team-name" id="board-away-name">MILAN</div>
                    <div class="score-display" id="board-away-score">0</div>
                </div>
            </div>

            <div class="game-layout">
                <div class="stats-panel">
                    <div>
                        <h3 style="margin-top:0; color:#2ecc71; font-size:1rem">Marcatori</h3>
                        <div id="scorers-list"></div>
                    </div>
                    <div>
                        <h3 style="margin-top:0; color:#3498db; font-size:1rem">Statistiche</h3>
                        <div id="game-stats-list">
                        <div class="stat-row"><span>Possesso</span> <span id="stat-possession">50% - 50%</span></div>
                        <div class="stat-row"><span>Tiri</span> <span id="stat-shots">0 - 0</span></div>
                        <div class="stat-row"><span>In porta</span> <span id="stat-target">0 - 0</span></div>
                        <div class="stat-row"><span>Corner</span> <span id="stat-corners">0 - 0</span></div>
                        <div class="stat-row"><span>Falli</span> <span id="stat-fouls">0 - 0</span></div>
                        <div class="stat-row"><span>Passaggi</span> <span id="stat-passes">0 - 0</span></div>
                        <div class="stat-row"><span>Rigori</span> <span id="stat-penalties">0 - 0</span></div>
                        <div class="stat-row"><span>🟨 Ammon.</span> <span id="stat-yellow">0 - 0</span></div>
                        <div class="stat-row"><span>🟥 Espuls.</span> <span id="stat-red">0 - 0</span></div>
                        </div>
                    </div>
                    <div style="text-align: center; grid-column: 1 / -1; margin-top: 10px;">
                        <button onclick="toggleSpeed()" id="speed-btn" style="padding: 5px 10px; background:#444; border:none; color:white; border-radius:4px; cursor:pointer;">Velocità: 1x</button>
                    </div>
                </div>
                
                <div class="feed-container" id="game-feed">
                    <!-- Text logs go here -->
                </div>
            </div>
            
            <div style="margin-top: 20px; text-align: center;">
                <button onclick="location.reload()" style="background:transparent; border:1px solid #555; color:#888; padding:10px 20px; border-radius:30px; cursor:pointer;">Nuova Partita</button>
            </div>
        </div>
    </div>

            "SAS": { name: "Sassuolo", color: "#00a652", players: [

                { name: "A. Consigli", att: 10, def: 78, pos: "GK" },
                { name: "K. Volpato", att: 75, def: 54, pos: "MF" }
            ]},
            "FRO": { name: "Frosinone", color: "#ffcc00", players: [
                { name: "M. Soule", att: 83, def: 48, pos: "FW" },
                { name: "W. Cheddira", att: 79, def: 42, pos: "FW" },
                { name: "M. Brescianini", att: 76, def: 70, pos: "MF" },
                { name: "L. Mazzitelli", att: 74, def: 72, pos: "MF" },
                { name: "E. Barrenechea", att: 72, def: 74, pos: "MF" },
                { name: "C. Lirola", att: 66, def: 75, pos: "DF" },
                { name: "S. Romagnoli", att: 52, def: 77, pos: "DF" },
                { name: "I. Monterisi", att: 54, def: 76, pos: "DF" },
                { name: "S. Turati", att: 10, def: 74, pos: "GK" },
                { name: "K. Oyono", att: 70, def: 71, pos: "DF" }
            ]}
        };

        const EVENTS = {
            goal: [
                "GOL! {player} insacca all'angolino!",
                "GOL! Splendida conclusione di {player}!",
                "GOL! {player} mette dentro dopo un cross perfetto.",
                "CHE BOMBA! {player} segna da fuori area!",
                "GOL! {player} trasforma il rigore con freddezza!",
                "GOL! Colpo di testa vincente di {player}!"
            ],
            miss: [
                "{player} calcia... di poco a lato!",
                "{player} colpisce il palo! Che occasione!",
                "{player} trova spazio ma calcia alto.",
                "Grande parata del portiere su {player}.",
                "Il tiro di {player} viene murato dalla difesa.",
                "{player} scivola nel momento decisivo."
            ],
            corner: [
                "Calcio d'angolo per il {team}. Occasione pericolosa!",
                "La palla esce per un corner battuto da {player}.",
                "Rinvio difensivo, sarà corner."
            ],
            chance: [
                "{player} salta l'uomo con una finta...",
                "Filtrante perfetto per {player} che scatta in posizione regolare...",
                "{player} è in posizione pericolosa fuori area...",
                "Contropiede fulmineo guidato da {player}...",
                "{player} crossa in area, situazione pericolosa..."
            ],
            yellowCard: [
                "Cartellino giallo per {player} dopo un intervento falloso.",
                "L'arbitro ammonisce {player} per proteste.",
                "Fallo tattico di {player}, cartellino giallo."
            ],
            redCard: [
                "ROSSO DIRETTO! {player} viene espulso!",
                "Secondo giallo per {player}, espulso!",
                "Intervento durissimo, {player} viene espulso!"
            ],
            foul: [
                "Fallo di {player}, punizione per il {team}.",
                "{player} commette fallo a centrocampo.",
                "L'arbitro fischia fallo di {player}."
            ],
            pass: [
                "Buon possesso palla del {team}...",
                "Giro palla di {player}, la squadra costruisce...",
                "Passaggio lungo di {player} verso l'attacco..."
            ]
        };

        function randArr(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        // --- GAME STATE ---
        let homeTeam, awayTeam;
        let homeScore = 0, awayScore = 0;
        let matchTime = 0; // minutes
        let gameActive = false;
        let speedMult = 1;
        let stats = { 
            hShots:0, aShots:0, 
            hTarget:0, aTarget:0, 
            hPoss:50, 
            hCorners:0, aCorners:0,
            hFouls:0, aFouls:0,
            hPasses:0, aPasses:0,
            hPenalties:0, aPenalties:0,
            hYellowCards:0, aYellowCards:0,
            hRedCards:0, aRedCards:0
        };
        let scorers = [];

        window.onload = function() {
            console.log("Database teams loaded:", TEAMS);
            const hSel = document.getElementById('home-select');
            const aSel = document.getElementById('away-select');
            for(let k in TEAMS) {
                hSel.innerHTML += `<option value="${k}">${TEAMS[k].name}</option>`;
                aSel.innerHTML += `<option value="${k}">${TEAMS[k].name}</option>`;
            }
            aSel.selectedIndex = 1;
            console.log("Team selection lists populated.");
        };

        function toggleSpeed() {
            if (speedMult === 1) { speedMult = 5; document.getElementById('speed-btn').innerText = "Velocità: 5x"; }
            else if (speedMult === 5) { speedMult = 20; document.getElementById('speed-btn').innerText = "Velocità: 20x"; }
            else { speedMult = 1; document.getElementById('speed-btn').innerText = "Velocità: 1x"; }
        }

        function startMatch() {
            const hVal = document.getElementById('home-select').value;
            const aVal = document.getElementById('away-select').value;
            if(hVal === aVal) { alert("Seleziona squadre diverse"); return; }

            homeTeam = TEAMS[hVal];
            awayTeam = TEAMS[aVal];

            document.getElementById('board-home-name').textContent = homeTeam.name.toUpperCase();
            document.getElementById('board-away-name').textContent = awayTeam.name.toUpperCase();
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            // Reset Stats
            homeScore = 0; awayScore = 0; matchTime = 0; scorers = [];
            stats = { 
                hShots:0, aShots:0, 
                hTarget:0, aTarget:0, 
                hPoss:50, 
                hCorners:0, aCorners:0,
                hFouls:0, aFouls:0,
                hPasses:0, aPasses:0,
                hPenalties:0, aPenalties:0,
                hYellowCards:0, aYellowCards:0,
                hRedCards:0, aRedCards:0
            };
            document.getElementById('game-feed').innerHTML = ''; // Clear feed

            log("Calcio d'inizio!", "intro");
            log(`${homeTeam.name} vs ${awayTeam.name}`, "intro");

            gameActive = true;
            matchLoop();
        }

        async function matchLoop() {
            while(gameActive && matchTime <= 90) {
                // Wait basic tick
                await new Promise(r => setTimeout(r, 500 / speedMult));
                matchTime++;
                
                updateUI();
                simulateMinute();

                if(matchTime === 45) {
                    log("--- FINE PRIMO TEMPO ---", "intro");
                    document.getElementById('board-half').textContent = "INTERVALLO";
                    await new Promise(r => setTimeout(r, 2000 / speedMult));
                    document.getElementById('board-half').textContent = "2° TEMPO";
                }
            }
            
            log("--- FINE PARTITA ---", "intro");
            log(`Risultato Finale: ${homeTeam.name} ${homeScore} - ${awayScore} ${awayTeam.name}`, "intro");
            gameActive = false;
        }

        function simulateMinute() {
            // Passaggi costanti (aumentano sempre)
            let isHome = Math.random() < (stats.hPoss / 100);
            if(isHome) stats.hPasses += Math.floor(Math.random() * 3) + 2;
            else stats.aPasses += Math.floor(Math.random() * 3) + 2;
            
            // Chance calculation
            if(Math.random() > 0.25) return; 

            // Who gets the chance?
            isHome = Math.random() < (stats.hPoss / 100); 
            let attTeam = isHome ? homeTeam : awayTeam;
            let defTeam = isHome ? awayTeam : homeTeam;

            // Pick a player
            let p = randArr(attTeam.players.filter(x => x.pos !== 'GK'));
            
            // Random Event Roll (0-100)
            let roll = Math.random() * 100;
            
            // Generate probabilities based on stats
            let attFactor = (p.att / 10) - 4;
            
            // Logic tree
            if (roll < 2 + attFactor) { 
                // GOAL
                let isPenalty = Math.random() < 0.2;
                if(isPenalty) {
                    if(isHome) stats.hPenalties++; else stats.aPenalties++;
                }
                
                if(isHome) { homeScore++; stats.hShots++; stats.hTarget++; }
                else { awayScore++; stats.aShots++; stats.aTarget++; }
                
                scorers.push({name: p.name, time: matchTime, team: attTeam.color});
                updateScorers();
                log(randArr(EVENTS.goal).replace("{player}", p.name), "goal");
                
            } else if (roll < 18) {
                // SHOT ON TARGET SAVED
                if(isHome) { stats.hShots++; stats.hTarget++; } else { stats.aShots++; stats.aTarget++; }
                
                if (Math.random() < 0.4) {
                    if(isHome) stats.hCorners++; else stats.aCorners++;
                    log(randArr(EVENTS.miss).replace("{player}", p.name) + " Calcio d'angolo.", "default");
                } else {
                    log(randArr(EVENTS.miss).replace("{player}", p.name), "default");
                }

            } else if (roll < 32) {
                // SHOT OFF TARGET
                if(isHome) stats.hShots++; else stats.aShots++;
                log(randArr(EVENTS.miss).replace("{player}", p.name), "default");

            } else if (roll < 45) {
                // CORNER
                if(isHome) stats.hCorners++; else stats.aCorners++;
                log(randArr(EVENTS.corner).replace("{team}", attTeam.name).replace("{player}", p.name), "default");

            } else if (roll < 65) {
                // FOUL
                let defPlayer = randArr(defTeam.players.filter(x => x.pos !== 'GK'));
                if(!isHome) stats.hFouls++; else stats.aFouls++;
                log(randArr(EVENTS.foul).replace("{player}", defPlayer.name).replace("{team}", attTeam.name), "default");
                
            } else if (roll > 92 && roll < 98) {
                // YELLOW CARD
                if(isHome) stats.hYellowCards++; else stats.aYellowCards++;
                log(randArr(EVENTS.yellowCard).replace("{player}", p.name), "card");
                
            } else if (roll >= 98) {
                // RED CARD
                if(isHome) stats.hRedCards++; else stats.aRedCards++;
                log(randArr(EVENTS.redCard).replace("{player}", p.name), "card");
                
            } else if (roll < 80) {
                // PASS/BUILD UP
                log(randArr(EVENTS.pass).replace("{player}", p.name).replace("{team}", attTeam.name), "chance");
            } else {
                // GENERIC CHANCE
                log(randArr(EVENTS.chance).replace("{player}", p.name), "chance");
            }
            
            // Fluctuate possession
            if(matchTime % 5 === 0) {
                let shift = Math.floor(Math.random() * 5) - 2;
                stats.hPoss = Math.max(30, Math.min(70, stats.hPoss + shift));
            }
        }

        function updateUI() {
            document.getElementById('board-time').textContent = matchTime + "'";
            document.getElementById('board-home-score').textContent = homeScore;
            document.getElementById('board-away-score').textContent = awayScore;

            // Stats
            document.getElementById('stat-possession').textContent = `${stats.hPoss}% - ${100-stats.hPoss}%`;
            document.getElementById('stat-shots').textContent = `${stats.hShots} - ${stats.aShots}`;
            document.getElementById('stat-target').textContent = `${stats.hTarget} - ${stats.aTarget}`;
            document.getElementById('stat-corners').textContent = `${stats.hCorners} - ${stats.aCorners}`;
            document.getElementById('stat-fouls').textContent = `${stats.hFouls} - ${stats.aFouls}`;
            document.getElementById('stat-passes').textContent = `${stats.hPasses} - ${stats.aPasses}`;
            document.getElementById('stat-penalties').textContent = `${stats.hPenalties} - ${stats.aPenalties}`;
            document.getElementById('stat-yellow').textContent = `${stats.hYellowCards} - ${stats.aYellowCards}`;
            document.getElementById('stat-red').textContent = `${stats.hRedCards} - ${stats.aRedCards}`;
        }

        function updateScorers() {
            let html = scorers.map(s => 
                `<div class="stat-row" style="border:none">
                    <span style="color:${s.team}">⚽ ${s.name}</span> <span>${s.time}'</span>
                 </div>`
            ).join('');
            document.getElementById('scorers-list').innerHTML = html;
        }

        function log(msg, type) {
            const div = document.createElement('div');
            div.className = `feed-item ${type}`;
            div.innerHTML = `
                <div class="feed-timestamp">${matchTime}'</div>
                <div class="feed-text">${msg}</div>
            `;
            const feed = document.getElementById('game-feed');
            feed.prepend(div);
        }

    </script>
