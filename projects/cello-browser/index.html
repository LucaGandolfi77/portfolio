<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Cello 1.94 — il primo browser grafico per Windows 3.x, ricreato nel browser.">
  <meta name="theme-color" content="#000080">
  <title>Cello 1.94</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cello" class="cello-window">
    <div class="title-bar">
      <span class="title-bar-icon" aria-hidden="true">🖥️</span>
      <span class="title-bar-text">CELLO — <span id="title-text">Welcome</span></span>
      <button class="title-bar-btn" id="btn-close" aria-label="Chiudi">✕</button>
    </div>
    <div class="menu-bar">
      <span class="menu-item">File</span>
      <span class="menu-item">Modifica</span>
      <span class="menu-item">Naviga</span>
      <span class="menu-item">Preferiti</span>
      <span class="menu-item">Aiuto</span>
    </div>
    <div class="toolbar">
      <button class="toolbar-btn" id="btn-home" aria-label="Home">🏠</button>
      <button class="toolbar-btn" id="btn-back" aria-label="Indietro">◀</button>
      <button class="toolbar-btn" id="btn-fwd" aria-label="Avanti">▶</button>
      <button class="toolbar-btn" id="btn-reload" aria-label="Ricarica">⟳</button>
      <button class="toolbar-btn" id="btn-live" aria-label="Modem Live">📡</button>
      <div class="location-wrap">
        <span class="location-label">Location:</span>
        <input class="location-input" id="location-input" type="text" spellcheck="false" autocomplete="off">
        <button class="toolbar-btn toolbar-go" id="btn-go">Go</button>
      </div>
      <button class="toolbar-btn" id="btn-fav" aria-label="Preferiti">☆</button>
    </div>
    <div class="content-area" id="content-area">
      <div class="page" id="page"></div>
    </div>
    <div class="status-bar">
      <span id="status-addr">http://cello.94/</span>
      <span id="status-state">Pronto</span>
      <span id="status-progress-wrap" class="hidden"><span id="status-progress"></span></span>
      <span id="status-pagecount"></span>
    </div>
    <div class="mobile-bar">
      <button class="mob-btn" id="mob-back" aria-label="Indietro">◀</button>
      <button class="mob-btn" id="mob-fwd" aria-label="Avanti">▶</button>
      <button class="mob-btn" id="mob-home" aria-label="Home">🏠</button>
      <button class="mob-btn" id="mob-live" aria-label="Live">📡</button>
    </div>
  </div>

  <div class="modal hidden" id="modal-live">
    <div class="modal-box">
      <div class="modal-title">📡 Modalità Modem Live</div>
      <p class="modal-desc">Prova a caricare una pagina reale via modem digitale (r.jina.ai reader). CORS: solo siti con lettore pubblico.</p>
      <div class="modal-row">
        <input class="modal-input" id="live-url" type="url" placeholder="https://esempio.com" spellcheck="false">
        <button class="modal-btn" id="live-go">Connetti</button>
      </div>
      <label class="modal-check"><input type="checkbox" id="live-sound"> Suono modem</label>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-sec" id="live-close">Chiudi</button>
      </div>
      <div class="modal-result" id="live-result"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
