<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CelloOS — un desktop del 1994 nel browser, con il browser Cello, file system virtuale e app native.">
  <meta name="theme-color" content="#000080">
  <title>CelloOS — 1994 Desktop</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <div class="boot" id="boot">
    <div class="boot-logo">CELLO<span>OS</span></div>
    <div>Copyright (C) 1994 Cornell Law School</div>
    <div>Memory Test: 640K OK</div>
    <div>Starting CelloOS...</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <div class="desktop hidden" id="desktop">
    <div class="desktop-icons" id="desktop-icons"></div>
    <div class="windows-layer" id="windows"></div>
  </div>

  <div class="taskbar hidden" id="taskbar">
    <button class="start-btn" id="start-btn" aria-expanded="false"><span class="start-flag">▮</span><span>Start</span></button>
    <div class="task-divider"></div>
    <div class="task-buttons" id="task-buttons"></div>
    <div class="tray">
      <button class="tray-btn" id="tray-sound" title="Suoni">♪</button>
      <button class="tray-btn" id="tray-notify" title="Notifiche">🔔<i class="badge hidden" id="notify-badge">0</i></button>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>

  <div class="start-menu hidden" id="start-menu">
    <div class="start-banner"><span>Cello<span>OS</span> <small>1994</small></span></div>
    <div class="start-cols">
      <div><h3>Programmi</h3><div class="start-apps" id="start-apps"></div></div>
      <div><h3>Documenti</h3><div class="start-docs" id="start-docs"></div></div>
    </div>
    <div class="start-footer">
      <button data-cmd="settings">⚙ Impostazioni</button>
      <button data-cmd="about">ℹ Informazioni</button>
      <button data-cmd="shutdown">⏻ Spegni...</button>
    </div>
  </div>

  <div class="notify-panel hidden" id="notify-panel">
    <div class="notify-head"><span>Notifiche di sistema</span><button class="os-btn small" id="notify-clear">Cancella</button></div>
    <div class="notify-list" id="notify-list"></div>
  </div>

  <div class="os-modal hidden" id="os-modal">
    <div class="os-dialog">
      <div class="os-dialog-title" id="os-modal-title"></div>
      <div class="os-dialog-body" id="os-modal-text"></div>
      <div class="os-dialog-actions" id="os-modal-actions"></div>
    </div>
  </div>

  <div class="os-toast hidden" id="os-toast"></div>

  <div class="lock-screen hidden" id="lock-screen">
    <div>
      <b>CelloOS</b>
      <p>Il sistema è stato spento.<br>È ora sicuro spegnere il computer.</p>
      <button class="os-btn primary" id="lock-on">Riavvia</button>
    </div>
  </div>

  <script src="../_shared/top_buttons.js"></script>
  <script src="./pages.js"></script>
  <script src="./js/core/bus.js"></script>
  <script src="./js/core/state.js"></script>
  <script src="./js/core/vfs.js"></script>
  <script src="./js/core/html.js"></script>
  <script src="./js/wm.js"></script>
  <script src="./js/apps/browser.js"></script>
  <script src="./js/apps/files.js"></script>
  <script src="./js/apps/notepad.js"></script>
  <script src="./js/apps/settings.js"></script>
  <script src="./js/apps/about.js"></script>
  <script src="./js/apps/terminal.js"></script>
  <script src="./js/apps/calculator.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/main.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(() => {});</script>
</body>
</html>
