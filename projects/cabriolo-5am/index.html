<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#e8963c"/>
  <meta name="description" content="Fidenza, estate 2021. Luca, Thomas e Valentina salgono sulla collina di Cabriolo alle 5 di mattina per vedere l'alba, ascoltare musica e sentirsi immortali."/>
  <title>Cabriolo, 5:00</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>.screen{padding-top:var(--site-top-bar-height,36px)}</style>
</head>
<body>

  <!-- ===== SKY CANVAS (background) ===== -->
  <canvas id="sky-canvas" aria-hidden="true"></canvas>

  <!-- ===== SCREEN: TITLE ===== -->
  <section id="title-screen" class="screen active" aria-label="Schermata iniziale">
    <div class="title-content">
      <div class="title-glow" aria-hidden="true"></div>
      <h1 class="title-main">Cabriolo, <span class="title-time">5:00</span></h1>
      <p class="title-sub">Fidenza, estate 2021</p>
      <p class="title-tagline">L'alba è nostra.</p>
      <div class="title-actions">
        <button id="btn-start" class="btn-primary">Inizia la prima alba</button>
        <button id="btn-continue" class="btn-secondary" style="display:none">Continua</button>
        <button id="btn-gallery" class="btn-secondary">Finali sbloccati</button>
      </div>
      <div class="title-footer">
        <span>LUCA · THOMAS · VALENTINA</span>
      </div>
    </div>
  </section>

  <!-- ===== SCREEN: CHAPTER INTRO ===== -->
  <section id="chapter-screen" class="screen" aria-label="Introduzione capitolo">
    <div class="chapter-content">
      <div class="chapter-number" id="chapter-number"></div>
      <h2 class="chapter-title" id="chapter-title"></h2>
      <p class="chapter-subtitle" id="chapter-subtitle"></p>
      <p class="chapter-song" id="chapter-song"></p>
    </div>
  </section>

  <!-- ===== SCREEN: DIALOGUE ===== -->
  <section id="dialogue-screen" class="screen" aria-label="Dialogo">
    <div class="dialogue-box">
      <div class="dialogue-speaker" id="dialogue-speaker"></div>
      <div class="dialogue-text" id="dialogue-text"></div>
      <div class="dialogue-choices" id="dialogue-choices"></div>
      <button id="dialogue-next" class="btn-next" style="display:none">Continua ▸</button>
    </div>
    <div class="stat-bar" aria-label="Stato emotivo">
      <span class="stat" id="stat-luce" title="Luce">☀️</span>
      <span class="stat" id="stat-malinconia" title="Malinconia">🌧️</span>
      <span class="stat" id="stat-legame" title="Legame">🧵</span>
    </div>
  </section>

  <!-- ===== SCREEN: MINIGAME ===== -->
  <section id="minigame-screen" class="screen" aria-label="Minigioco">
    <div class="minigame-hud">
      <div class="minigame-title" id="minigame-title"></div>
      <div class="minigame-score" id="minigame-score">0</div>
      <button id="minigame-skip" class="btn-skip">Salta ▸</button>
    </div>
    <canvas id="minigame-canvas"></canvas>
    <div class="minigame-instruction" id="minigame-instruction"></div>
  </section>

  <!-- ===== SCREEN: ENDING ===== -->
  <section id="ending-screen" class="screen" aria-label="Finale">
    <div class="ending-content">
      <div class="ending-glow" aria-hidden="true"></div>
      <div class="ending-label" id="ending-label"></div>
      <h2 class="ending-title" id="ending-title"></h2>
      <p class="ending-text" id="ending-text"></p>
      <div class="ending-footer">
        <button id="btn-replay" class="btn-primary">Ricomincia</button>
        <button id="btn-home" class="btn-secondary">Torna all'inizio</button>
      </div>
    </div>
  </section>

  <!-- ===== SCREEN: GALLERY ===== -->
  <section id="gallery-screen" class="screen" aria-label="Gallery finali">
    <div class="gallery-content">
      <h2 class="gallery-title">Le 5:00 che hai vissuto</h2>
      <div class="gallery-grid" id="gallery-grid"></div>
      <button id="btn-gallery-back" class="btn-secondary">Indietro</button>
    </div>
  </section>

  <!-- ===== AUDIO TOGGLE ===== -->
  <button id="audio-toggle" class="audio-toggle" aria-label="Mute/Unmute music" title="Musica">♪</button>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/audio.js"></script>
  <script src="js/story.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/game.js"></script>
  <script src="../../top_buttons.js"></script>
</body>
</html>
