<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodyweight Workout Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1724;
            --card: #1a2a3a;
            --accent: #00d4ff;
            --text: #e6f1ff;
            --text-dim: #a0c0e0;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .cat-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .cat-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
        }

        /* Exercise List */
        .exercise-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }
        .exercise-card {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .exercise-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }
        .ex-name { font-weight: bold; margin-bottom: 5px; }
        .ex-muscle { font-size: 0.8rem; color: var(--text-dim); }

        /* Timer Section */
        .timer-section {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            display: none; /* Hidden by default */
        }
        .timer-section.active { display: block; }
        
        .timer-display {
            font-size: 80px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            color: var(--accent);
        }
        .timer-state {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .state-work { color: var(--success); }
        .state-rest { color: var(--warning); }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-skip { background: var(--warning); color: #000; }
        
        .settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            color: var(--text-dim);
        }
        .setting-group { display: flex; align-items: center; gap: 10px; }
        input[type="number"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px;
            border-radius: 5px;
            width: 60px;
            text-align: center;
        }

        /* Progress Bar (linear) */
        .progress-ring {
            position: relative;
            width: 320px;
            height: 24px;
            margin: 0 auto;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 12px;
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background: var(--accent);
            transform-origin: left center;
            transition: width 0.2s linear;
        }
        .timer-overlay {
            position: absolute;
            top: -86px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 style="margin:0; font-size:20px;">Bodyweight Timer ⏱️</h1>
        </header>

        <div class="categories" id="categoryList">
            <button class="cat-btn active" onclick="filterExercises('all')">All</button>
            <button class="cat-btn" onclick="filterExercises('chest')">Chest</button>
            <button class="cat-btn" onclick="filterExercises('legs')">Legs</button>
            <button class="cat-btn" onclick="filterExercises('abs')">Abs</button>
            <button class="cat-btn" onclick="filterExercises('back')">Back</button>
            <button class="cat-btn" onclick="filterExercises('cardio')">Cardio</button>
        </div>

        <div class="exercise-list" id="exerciseList">
            <!-- Injected via JS -->
        </div>

        <div class="timer-section" id="timerSection">
            <h2 id="currentExerciseName">Select an Exercise</h2>
            
            <div class="settings">
                <div class="setting-group">
                    <label>Work (s)</label>
                    <input type="number" id="workTimeInput" value="45">
                </div>
                <div class="setting-group">
                    <label>Rest (s)</label>
                    <input type="number" id="restTimeInput" value="15">
                </div>
            </div>

            <div class="progress-ring">
                <div class="timer-overlay">
                    <div class="timer-state" id="timerState">READY</div>
                    <div class="timer-display" id="timerDisplay">00:00</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="btnStart" onclick="toggleTimer()">START</button>
                <button class="btn btn-secondary" onclick="resetTimer()">RESET</button>
                <button class="btn btn-skip" id="btnSkip" onclick="skipRest()" style="display:none;">SKIP REST</button>
            </div>
        </div>
    </div>

    <script>
        const exercises = [
            { name: "Push-ups", category: "chest" },
            { name: "Wide Push-ups", category: "chest" },
            { name: "Diamond Push-ups", category: "chest" },
            { name: "Squats", category: "legs" },
            { name: "Lunges", category: "legs" },
            { name: "Calf Raises", category: "legs" },
            { name: "Wall Sit", category: "legs" },
            { name: "Plank", category: "abs" },
            { name: "Crunches", category: "abs" },
            { name: "Leg Raises", category: "abs" },
            { name: "Russian Twist", category: "abs" },
            { name: "Superman", category: "back" },
            { name: "Glute Bridge", category: "back" },
            { name: "Jumping Jacks", category: "cardio" },
            { name: "Burpees", category: "cardio" },
            { name: "Mountain Climbers", category: "cardio" }
        ];

        const exerciseList = document.getElementById('exerciseList');
        const timerSection = document.getElementById('timerSection');
        const currentExerciseName = document.getElementById('currentExerciseName');
        const timerDisplay = document.getElementById('timerDisplay');
        const timerState = document.getElementById('timerState');
        const progressFill = document.getElementById('progressFill');
        const btnStart = document.getElementById('btnStart');
        const btnSkip = document.getElementById('btnSkip');
        
        let timerInterval;
        let timeLeft;
        let totalTime;
        let isRunning = false;
        let isResting = false;

        // visible exercises (current filtered list) and index
        let visibleExercises = [];
        let currentIndex = null;

        function filterExercises(category) {
            // Update buttons
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === category || (category === 'all' && btn.textContent === 'All')) {
                    btn.classList.add('active');
                }
            });

            exerciseList.innerHTML = '';
            const filtered = category === 'all' ? exercises : exercises.filter(e => e.category === category);
            visibleExercises = filtered;
            
            filtered.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div class="ex-name">${ex.name}</div>
                    <div class="ex-muscle">${ex.category.toUpperCase()}</div>
                `;
                card.onclick = () => selectExercise(ex.name);
                exerciseList.appendChild(card);
            });
        }

        function selectExercise(name) {
            currentExerciseName.textContent = name;
            timerSection.classList.add('active');
            timerSection.scrollIntoView({ behavior: 'smooth' });
            // set currentIndex based on visibleExercises
            const idx = visibleExercises.findIndex(e => e.name === name);
            currentIndex = idx >= 0 ? idx : null;
            resetTimer();
        }

        function setProgress(percent) {
            percent = Math.max(0, Math.min(100, percent));
            progressFill.style.width = percent + '%';
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!timeLeft) {
                // Initial start
                startWorkPhase();
            }
            
            isRunning = true;
            btnStart.textContent = "PAUSE";
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    if (isResting) {
                        // after rest, move to next exercise
                        advanceToNextExercise();
                    } else {
                        startRestPhase();
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            btnStart.textContent = "RESUME";
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = null;
            isResting = false;
            timerState.textContent = "READY";
            timerState.className = "timer-state";
            timerDisplay.textContent = "00:00";
            btnStart.textContent = "START";
            btnSkip.style.display = "none";
            setProgress(100);
            progressFill.style.background = "var(--accent)";
        }

        function startWorkPhase() {
            isResting = false;
            totalTime = parseInt(document.getElementById('workTimeInput').value);
            timeLeft = totalTime;
            
            timerState.textContent = "WORK";
            timerState.className = "timer-state state-work";
            progressFill.style.background = "var(--success)";
            btnSkip.style.display = "none";
            
            // Play sound?
            updateDisplay();
        }

        function startRestPhase() {
            isResting = true;
            totalTime = parseInt(document.getElementById('restTimeInput').value);
            timeLeft = totalTime;
            
            timerState.textContent = "REST";
            timerState.className = "timer-state state-rest";
            progressFill.style.background = "var(--warning)";
            btnSkip.style.display = "inline-block";
            
            updateDisplay();
        }

        function skipRest() {
            if (isResting) {
                startWorkPhase();
            }
        }

        function advanceToNextExercise() {
            if (!visibleExercises || visibleExercises.length === 0) return;
            const nextIndex = (currentIndex === null) ? 0 : (currentIndex + 1);
            // If we've reached the end, stop instead of wrapping
            if (nextIndex >= visibleExercises.length) {
                pauseTimer();
                timerState.textContent = "COMPLETE";
                timerState.className = "timer-state";
                setProgress(0);
                return;
            }
            const nextName = visibleExercises[nextIndex].name;
            const wasRunning = isRunning;
            // selectExercise resets timer and sets currentIndex
            selectExercise(nextName);
            // if timer was running, restart it for next exercise
            if (wasRunning) {
                startTimer();
            }
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            const percent = (timeLeft / totalTime) * 100;
            setProgress(percent);
        }

        // Init
        filterExercises('all');
        setProgress(100);

    </script>
</body>
<script src="top_buttons.js"></script>
</html>
