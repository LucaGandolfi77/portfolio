<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02100c">
<meta name="description" content="Genetic Art — disegna creature bioluminescenti e falli evolvere: crossover, mutazioni, fitness che impara il tuo gusto, albero genealogico 3D. Three.js + algoritmi genetici puri.">
<title>GENETIC ART — Evoluzione Artistica Interattiva</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02100c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#00ffd0;font-size:clamp(26px,9vw,64px);text-align:center;text-shadow:0 0 30px rgba(0,255,208,.5),0 0 60px rgba(0,255,208,.2);letter-spacing:clamp(3px,1.6vw,12px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#title b{color:#fff;text-shadow:0 0 30px rgba(255,255,255,.6)}
#sub{color:#8fd8c2;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #00ffd0;background:rgba(0,255,208,.08);color:#eafff7;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(0,255,208,.2);box-shadow:0 0 24px rgba(0,255,208,.25)}
#credit{position:fixed;bottom:16px;color:#5f9f8a;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">GENETIC <b>ART</b></div>
  <div id="sub">Disegna · seleziona · fai evolvere la luce 🧬</div>
  <button id="apri" onclick="window.location.href='genetic-art/index.html'">APRI</button>
</div>
<div id="credit">Three.js + algoritmi genetici puri — ogni segmento è un neurone, il colore è un gene ✨</div>

<script>
const c=document.createElement('canvas');document.body.prepend(c);
const x=c.getContext('2d');
let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
window.addEventListener('resize',()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;});

/* plancton bioluminescente */
const N=90,p=[];
for(let i=0;i<N;i++)p.push({x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*2.5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,hue:140+Math.random()*120,ph:Math.random()*6.28});

/* creature di sfondo: figure organiche che pulsano */
const orgs=[];
for(let i=0;i<6;i++)orgs.push({x:Math.random()*W,y:Math.random()*H,s:30+Math.random()*80,hue:140+Math.random()*140,ph:Math.random()*6.28,v:(Math.random()*.5+.3)});

function draw(t){
  x.fillStyle='#02100c';x.fillRect(0,0,W,H);
  for(const q of p){
    q.x+=q.vx;q.y+=q.vy;
    if(q.x<0||q.x>W)q.vx*=-1;if(q.y<0||q.y>H)q.vy*=-1;
    const a=.35+Math.sin(t*.002+q.ph)*.3;
    x.globalAlpha=a;
    x.fillStyle='hsl('+q.hue+',100%,70%)';
    x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill();
  }
  x.globalAlpha=1;
  for(const o of orgs){
    const pulse=1+Math.sin(t*.0015+o.ph)*.18;
    const r=o.s*pulse;
    const g=x.createRadialGradient(o.x,o.y,0,o.x,o.y,r);
    g.addColorStop(0,'hsla('+o.hue+',100%,60%,.10)');
    g.addColorStop(1,'hsla('+o.hue+',100%,60%,0)');
    x.fillStyle=g;
    x.beginPath();x.arc(o.x,o.y,r,0,6.283);x.fill();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
