<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070d1a">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Tiny AI — verified small language models running in your browser with WebGPU and WASM, liquid-glass interface.">
<title>Tiny AI — local models, real chat</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/tiny-ai/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="Tiny AI" data-id="tiny-ai"
  data-back="../../projects.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<div id="app">
  <header class="topbar glass">
    <div class="brand"><div class="logo">🤖</div><div><b data-i18n="title">TINY AI</b><small data-i18n="tagline">Real models, in your browser</small></div></div>
    <div class="top-actions">
      <button class="btn ghost" id="newChatBtn">＋ <span data-i18n="newChat">New chat</span></button>
      <button class="btn ghost" id="langBtn" data-i18n="lang">IT / EN</button>
      <button class="btn ghost" id="themeBtn" data-i18n="theme">Theme</button>
      <button class="btn primary" id="settingsBtn">⚙ <span data-i18n="settings">Settings</span></button>
    </div>
  </header>

  <div class="model-bar glass">
    <div class="model-bar-left">
      <span class="label" data-i18n="backend">Backend</span>
      <div class="chips" id="backendList"></div>
    </div>
    <div class="model-bar-right">
      <span class="label" data-i18n="model">Model</span>
      <div class="model-list" id="modelList"></div>
    </div>
  </div>

  <main class="main">
    <aside class="sidebar glass" id="sidebar">
      <h3 data-i18n="conversations">Conversations</h3>
      <div id="convList"></div>
    </aside>

    <section class="chat">
      <div class="chat-area" id="chatArea"></div>
      <div class="typing-row hidden" id="typingRow"><span class="typing" id="typing"></span></div>
      <div class="input-bar glass">
        <textarea id="prompt" rows="1" data-i18n-placeholder="typeMessage" placeholder="Type a message…"></textarea>
        <button class="send-btn" id="sendBtn" data-i18n="send">Send</button>
      </div>
      <button class="btn ghost clear-chat" id="clearChatBtn" data-i18n="clearChat">Clear chat</button>
    </section>
  </main>
</div>

<div class="sheet-backdrop" id="settingsSheet">
  <aside class="settings-sheet glass" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="sheet-head"><h2 data-i18n="settings">Settings</h2><button class="btn ico" id="sheetClose">✕</button></div>
    <div class="sheet-body">
      <section>
        <h3 data-i18n="preset">Preset</h3><div class="chips" id="presetBtns"></div>
      </section>
      <section>
        <h3 data-i18n="system">System prompt</h3>
        <textarea id="systemPrompt" rows="3" placeholder="You are a helpful assistant."></textarea>
      </section>
      <section>
        <h3 data-i18n="temperature">Temperature</h3>
        <div class="range-row"><input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.7"><b id="temperatureVal">0.70</b></div>
        <h3 data-i18n="tokens">Tokens</h3>
        <input type="number" id="maxTokens" value="256" min="16" max="4096">
      </section>
      <section>
        <h3 data-i18n="device">Device</h3>
        <select id="device"><option value="auto">Auto</option><option value="webgpu">WebGPU</option><option value="wasm">WASM</option></select>
      </section>
      <section>
        <h3 data-i18n="capabilities">Device capabilities</h3><div class="cap-list" id="capList"></div>
      </section>
      <section>
        <h3 data-i18n="apiKey">API key (OpenRouter)</h3>
        <div class="key-row"><input type="password" id="apiKey" placeholder="sk-or-v1-…"><button class="btn ico" id="keyToggle" title="Show">👁</button></div>
      </section>
      <section>
        <label class="check"><input type="checkbox" id="showAdvanced"> <span data-i18n="advanced">Advanced</span></label>
        <div class="btn-row">
          <button class="btn ghost" id="verifyBtn">✓ <span data-i18n="verify">Verify models</span></button>
          <button class="btn ghost danger" id="clearCacheBtn" data-i18n="clearCache">Clear model cache</button>
        </div>
      </section>
    </div>
  </aside>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div class="modal hidden" id="dlg" role="dialog" aria-modal="true">
  <div class="glass modal-box"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><div class="modal-actions" id="dlgActions"></div></div>
</div>
<script type="module" src="js/main.js"></script>
<script src="../_shared/shell.js" defer></script>
</body>
</html>
