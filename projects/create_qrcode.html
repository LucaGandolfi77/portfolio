<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Create QR Code</title>
	<style>
		body{ font-family:Inter, system-ui; padding:18px; background:#f6f8fb }
		.card{ max-width:640px; margin:0 auto; background:#fff; padding:18px; border-radius:10px }
		input, button { padding:10px; border-radius:8px; border:1px solid #ddd }
		#q{ display:block; margin-top:12px }
	</style>
	<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
	<div class="card">
		<h1>QR Code Generator</h1>
		<p>Enter text or URL to generate a QR code.</p>
		<input id="text" placeholder="https://example.com" style="width:100%" />
		<div style="margin-top:12px; display:flex; gap:8px"><button id="gen">Generate</button><button id="download">Download PNG</button></div>
		<div id="q"></div>
	</div>
	<script>
		const t=document.getElementById('text'); const q=document.getElementById('q'); document.getElementById('gen').addEventListener('click', ()=>{
			q.innerHTML=''; QRCode.toCanvas(t.value || 'Hello', { width: 300 }, function (err, canvas) { if (err) return console.error(err); q.appendChild(canvas); });
		});
		document.getElementById('download').addEventListener('click', ()=>{ const c=q.querySelector('canvas'); if(!c) return alert('Generate first'); const a=document.createElement('a'); a.href=c.toDataURL(); a.download='qrcode.png'; a.click(); });
	</script>
</body>
<script src="top_buttons.js"></script>
</html>
