<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060f">
<meta name="description" content="NEURAL FLOCK — a hypnotic 3D swarm of boids steered by a tiny neural network trained live in your browser. Draw a target shape and watch the flock learn to form it.">
<title>NEURAL FLOCK — Smart Swarm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04060f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center}
#title{font-size:clamp(28px,9vw,64px);font-weight:800;letter-spacing:clamp(3px,1.8vw,12px);
  background:linear-gradient(90deg,#3ee6ff,#b28dff,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:fadeIn 2s ease 0.5s forwards;text-shadow:0 0 44px rgba(178,141,255,.3)}
#sub{color:#8a92c8;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:12px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px;max-width:540px;line-height:1.9}
#apri{pointer-events:all;margin-top:36px;padding:13px 44px;border:1px solid #ff5f9e;background:rgba(255,95,158,.08);color:#eef0ff;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:12px;font-weight:700}
#apri:hover{background:rgba(255,95,158,.2);box-shadow:0 0 30px rgba(255,95,158,.35)}
#credit{position:fixed;bottom:16px;color:#5f6890;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 34px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">NEURAL FLOCK</div>
  <div id="sub">A swarm whose every turn is decided by a tiny neural network —<br>trained live in your browser · heart · spiral · arrow · your own drawing</div>
  <button id="apri" onclick="window.location.href='neural-flock/index.html'">RELEASE THE FLOCK</button>
</div>
<div id="credit">pure-JS neural net (19→28→3) + Three.js — the flock learns to fly in front of you</div>

<script>
const c=document.createElement('canvas');document.body.prepend(c);
const x=c.getContext('2d');
let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
window.addEventListener('resize',()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;});
/* stormo di particelle con trail, in formazione a cuore che respira */
const N=70,boids=[];
for(let i=0;i<N;i++)boids.push({a:i/N*6.283,ph:Math.random()*6.28,r:0.8+Math.random()*0.8,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4,hue:180+Math.random()*120});
function draw(t){
  x.fillStyle='rgba(4,6,15,0.28)';x.fillRect(0,0,W,H);
  const cx0=W/2,cy0=H/2,s=Math.min(W,H)/16;
  for(const b of boids){
    /* cuore parametrico che respira */
    const sc=s*(1+Math.sin(t*.001+b.ph)*0.06);
    const hx=16*Math.pow(Math.sin(b.a),3)*sc;
    const hy=(13*Math.cos(b.a)-5*Math.cos(2*b.a)-2*Math.cos(3*b.a)-Math.cos(4*b.a))*sc;
    const tx=cx0+hx,ty=cy0-hy*0.85;
    b.x=tx;b.y=ty;
    const alpha=.5+Math.sin(t*.003+b.ph)*.3;
    x.globalAlpha=alpha;
    x.strokeStyle='hsl('+b.hue+',90%,65%)';
    x.lineWidth=2.2;
    x.beginPath();x.moveTo(tx-b.vx*10,ty-b.vy*10);x.lineTo(tx,ty);x.stroke();
    x.fillStyle='#fff';
    x.beginPath();x.arc(tx,ty,2,0,6.283);x.fill();
  }
  x.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
