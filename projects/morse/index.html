<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="color-scheme" content="dark">
<meta name="description" content="Morse Studio — convert text to Morse and back, listen to transmissions, export WAV and learn the code with flashcards and dictation.">
<title>Morse Studio — transmit, decode, learn</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/morse/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="Morse Studio" data-id="morse"
  data-back="../../projects.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<main id="app">
  <section class="hero">
    <div class="hero-icon" aria-hidden="true">⌁</div>
    <div><h1 data-i18n="title">MORSE STUDIO</h1><p data-i18n="tagline">Trasmetti, decodifica, ascolta.</p></div>
  </section>

  <div class="workspace">
    <section class="card" aria-label="Input">
      <div class="card-head"><h2 data-i18n="input">Testo</h2><span class="badge" id="inputCount">0 chars</span></div>
      <textarea id="inputText" class="editor" spellcheck="false" data-i18n-placeholder="input" placeholder="Testo"></textarea>
      <div class="btn-row">
        <button class="btn primary" id="toMorse" data-i18n="toMorse">→ Morse</button>
        <button class="btn" id="toText" data-i18n="toText">→ Testo</button>
        <button class="btn ghost" id="swapBtn" data-i18n="swap">Inverti</button>
        <button class="btn ghost" id="clearBtn" data-i18n="clear">Pulisci</button>
        <button class="btn ghost" id="copyInput" data-i18n="copy">Copia</button>
        <button class="btn ghost" id="importBtn" data-i18n="import">Importa</button>
      </div>
      <input type="file" id="importFile" accept=".txt,text/plain" hidden>
      <div class="drop" id="dropZone" data-i18n="drop">Trascina un file .txt qui</div>
      <p class="warn hidden" id="unknownNote"></p>
    </section>

    <section class="card" aria-label="Output">
      <div class="card-head"><h2 data-i18n="output">Morse</h2><span class="badge" id="outputCount">0 chars</span></div>
      <textarea id="outputText" class="editor mono" spellcheck="false" data-i18n-placeholder="output" placeholder="Morse"></textarea>
      <div class="btn-row">
        <button class="btn ghost" id="copyOutput" data-i18n="copy">Copia</button>
        <button class="btn ghost" id="favBtn" data-i18n="favorites">Preferiti</button>
        <button class="btn ghost" id="exportTxt" data-i18n="exportTxt">Esporta testo</button>
        <button class="btn ghost" id="exportWav" data-i18n="exportWav">Esporta WAV</button>
        <button class="btn ghost" id="shareBtn" data-i18n="share">Condividi</button>
      </div>
      <div class="transport">
        <button class="btn play" id="playBtn">▶ <span data-i18n="play">Riproduci</span></button>
        <button class="btn" id="pauseBtn" data-i18n="pause">Pausa</button>
        <button class="btn ghost" id="stopBtn" data-i18n="stop">Ferma</button>
        <span class="badge" id="durationLabel">0s</span>
      </div>
    </section>
  </div>

  <section class="card signal-card">
    <div class="card-head"><h2 data-i18n="signal">Segnale</h2><span class="badge" id="statusLabel" data-i18n="ready">Pronto</span></div>
    <canvas id="scope" class="scope" aria-label="Signal oscilloscope"></canvas>
    <div class="sliders">
      <label><span data-i18n="wpm">WPM</span><input type="range" id="wpm" min="5" max="40" value="14"><b id="wpmVal">14</b></label>
      <label><span data-i18n="freq">Frequenza</span><input type="range" id="freq" min="300" max="1200" step="10" value="700"><b id="freqVal">700</b></label>
      <label><span data-i18n="volume">Volume</span><input type="range" id="volume" min="0" max="100" value="60"><b id="volumeVal">60</b></label>
    </div>
    <label class="check"><input type="checkbox" id="strict"> <span data-i18n="strict">Decodifica rigorosa</span></label>
    <p class="hint" data-i18n="decoding">Decodifica automatica</p>
  </section>

  <section class="card">
    <button class="section-toggle" id="refToggle">📖 <span data-i18n="reference">Tabella Morse</span> ▾</button>
    <div class="ref-tools hidden" id="refTools">
      <input type="search" id="refSearch" data-i18n-placeholder="search" placeholder="Cerca…">
      <span class="badge" id="refCount"></span>
    </div>
    <div class="ref-grid hidden" id="refGrid"></div>
  </section>

  <section class="card">
    <button class="section-toggle" id="trainToggle">🎓 <span data-i18n="train">Allenamento</span> ▾</button>
    <div class="train hidden" id="trainPanel">
      <div class="train-tabs">
        <button data-train="flashcards" class="on" data-i18n="flashcards">Flashcard</button>
        <button data-train="dictation" data-i18n="dictation">Dettato</button>
        <button data-train="speed" data-i18n="speed">Velocità</button>
      </div>
      <div id="trainBody"></div>
    </div>
  </section>

  <section class="card">
    <button class="section-toggle" id="histToggle">🕘 <span data-i18n="history">Cronologia</span> ▾</button>
    <div class="history hidden" id="historyPanel"></div>
  </section>

  <footer>⌁ EN/IT · offline-first · crediti: nessun dato lasciato tranne le conversioni locali</footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div></div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../_shared/shell.js" defer></script>
</body>
</html>
