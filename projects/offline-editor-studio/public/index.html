<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141824"><meta name="description" content="Offline Editor Studio — codice locale, zero server."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Offline Editor Studio</title></head>
