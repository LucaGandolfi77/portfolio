<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Smile Detection — analisi del sorriso on-device con MediaPipe e ViT FER, in stile liquid glass per iPhone.">
  <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/smile_detection/">
  <title>Smile Detection — on-device smile analysis</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">

  <div id="viewfinder">
    <video id="video" playsinline webkit-playsinline muted autoplay aria-label="Camera preview"></video>
    <canvas id="overlayCanvas" aria-hidden="true"></canvas>
    <div class="halo" aria-hidden="true"></div>
    <div id="loading" class="on">Avvia la camera</div>

    <header class="glass-header">
      <div class="brand"><span class="brand-mark">😊</span><div><h1 data-i18n="app.title">SMILE DETECTION</h1><small data-i18n="app.tagline">On-device smile analysis</small></div></div>
      <button class="glass-icon" id="btnLang" aria-label="Language">🇮🇹 IT</button>
    </header>

    <div class="status-row">
      <span class="glass-pill" id="cameraPill">Camera</span>
      <span class="glass-pill" id="facePill">Looking for a face</span>
      <span class="glass-pill" id="modelPill">Model not loaded</span>
    </div>

    <div class="camera-actions">
      <button class="glass-round" id="btnSwitch" aria-label="Switch camera" title="Switch camera">🔄</button>
      <button class="glass-round shutter" id="btnSnapshot" aria-label="Snapshot" title="Snapshot">●</button>
      <button class="glass-round primary" id="startBtn">Start camera</button>
    </div>
  </div>

  <section class="glass-sheet" id="scoreCard">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="score-top">
      <div class="gauge">
        <svg viewBox="0 0 180 180" aria-hidden="true">
          <circle class="gauge-track" cx="90" cy="90" r="74"></circle>
          <circle class="gauge-value" id="scoreRing" cx="90" cy="90" r="74"
                  stroke-dasharray="464.96" stroke-dashoffset="464.96"></circle>
        </svg>
        <div class="gauge-center"><strong id="scoreValue">0</strong><small>%</small></div>
      </div>
      <div class="score-info">
        <span class="label" data-i18n="section.score">Smile score</span>
        <strong class="confidence" id="confidenceValue">0%</strong>
        <span class="hint" id="confidenceText">Smile!</span>
        <div class="best"><span data-i18n="section.best">Personal best</span><b id="bestValue">—</b></div>
      </div>
    </div>

    <div class="metric-grid">
      <div class="metric"><span data-i18n="section.whiteness">Whiteness</span><b id="whitenessValue">0%</b><div class="track"><i id="whitenessBar"></i></div></div>
      <div class="metric"><span data-i18n="section.alignment">Alignment</span><b id="alignmentValue">0%</b><div class="track"><i id="alignmentBar"></i></div></div>
    </div>
    <p class="hint" id="teethHint">Open your mouth to measure teeth.</p>
    <h2 data-i18n="section.emotions">Emotions</h2>
    <div id="emotionBars"></div>
    <p class="disclaimer" data-i18n="section.disclaimer">Playful estimate, not a dental diagnosis.</p>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="./js/main.js"></script>
<script src="../_shared/top_buttons.js" defer></script>
</body>
</html>
