<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Smile Detection — Analizza il tuo sorriso con AI. Bianchezza, allineamento, voto.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E😁%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <title>Smile Detection</title>
</head>
<body>
<div id="app">

  <!-- top bar -->
  <header id="topbar">
    <button class="btn-icon" id="btn-exit" title="Exit">✕</button>
    <span class="title">SMILE DETECTION</span>
    <button class="btn-icon" id="btn-camera" title="Switch Camera">🔄</button>
  </header>

  <!-- scores panel -->
  <aside id="scores-panel">
    <div class="score-row">
      <span class="score-label">😊</span>
      <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-smile"></div></div>
      <span class="score-val" id="val-smile">0%</span>
    </div>
    <div class="score-row">
      <span class="score-label">🦷</span>
      <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-whiteness"></div></div>
      <span class="score-val" id="val-whiteness">0%</span>
    </div>
    <div class="score-row">
      <span class="score-label">📐</span>
      <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-alignment"></div></div>
      <span class="score-val" id="val-alignment">0%</span>
    </div>
    <div id="overall-row">
      <div id="val-overall">0</div>
      <div id="stars-overall">
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
      </div>
    </div>
  </aside>

  <!-- viewport: video + overlay canvas -->
  <div id="viewport">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="overlayCanvas"></canvas>
    <div id="loading">Caricamento modello AI...</div>
  </div>

  <!-- bottom controls -->
  <div id="controls">
    <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
    <button class="ctrl-btn" id="btn-capture" title="Snapshot"></button>
    <button class="ctrl-btn" id="btn-record" title="Record Video">⏺</button>
  </div>

</div>

<script src="face_tracker.js"></script>
<script src="smile_analyzer.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
