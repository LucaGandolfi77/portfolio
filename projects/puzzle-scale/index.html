<!doctype html>
<html lang="it" data-skin="play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0718">
<meta name="color-scheme" content="dark">
<meta name="description" content="Scale Puzzle — rebuild glowing patterns, train memory and climb 200 scalable levels. Offline PWA, EN/IT.">
<title>Scale Puzzle — Neon Pattern Game</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/puzzle-scale/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="Scale Puzzle" data-id="puzzle-scale"
  data-back="../../projects.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<main id="app">
  <section class="hero">
    <div class="hero-icon" aria-hidden="true">🧩</div>
    <div><h1 data-i18n="title">SCALE PUZZLE</h1><p data-i18n="tagline">Ricostruisci il pattern.</p></div>
    <div class="hero-actions">
      <button class="btn ghost" id="howBtn" data-i18n="how">Come giocare</button>
      <button class="btn ghost" id="soundBtn" title="Sound">♪</button>
      <button class="btn ghost" id="langBtn">IT / EN</button>
      <button class="btn ghost" id="resetBtn" data-i18n="reset">Azzera progressi</button>
    </div>
  </section>

  <section class="hud">
    <div class="hud-left">
      <span class="pill accent" id="levelLabel">Livello 1</span>
      <span class="pill" id="modeChip">Classica</span>
      <span class="pill" id="movesCount">Mosse: 0</span>
      <span class="pill" id="timer">00:00</span>
    </div>
    <div class="hud-right">
      <span class="pill gold">★ <b id="scoreVal">0</b></span>
      <span class="pill purple"><span data-i18n="combo">Combo</span> <b id="comboVal">×0</b></span>
      <span class="pill red" id="livesVal">♥♥♥</span>
    </div>
  </section>

  <div class="progress-track"><i id="progressFill"></i></div>

  <section class="board-wrap">
    <canvas id="board" aria-label="Puzzle board"></canvas>
    <div id="boardMessage" class="board-message hidden"></div>
  </section>

  <section class="sequence-bar">
    <span id="sequenceOk">Sequenza: 0 / 0</span>
    <span>💡 <b id="hintCount">2</b></span>
  </section>

  <nav class="toolbar">
    <button class="btn" id="undoBtn" data-i18n="undo">↶ Annulla</button>
    <button class="btn" id="hintBtn" data-i18n="hint">💡 Suggerimento</button>
    <button class="btn primary" id="nextBtn" data-i18n="next">→ Prossimo</button>
  </nav>

  <section class="card">
    <h2 data-i18n="mode">Modalità</h2>
    <div class="mode-picker" id="modePicker"></div>
    <h2 data-i18n="difficulty">Difficoltà</h2>
    <div class="diff-picker" id="diffPicker"></div>
  </section>

  <section class="card">
    <h2 data-i18n="levels">Livelli</h2>
    <div class="level-grid" id="levelGrid"></div>
    <h2 data-i18n="stats">Statistiche</h2>
    <div class="stats-grid" id="statsGrid"></div>
  </section>

  <footer>🧩 <span data-i18n="tagline">Ricostruisci il pattern. Allena la memoria.</span></footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div></div>
</div>
<script type="module" src="js/main.js"></script>
<script src="../_shared/shell.js" defer></script>
</body>
</html>
