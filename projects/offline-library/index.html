<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141024">
<meta name="description" content="Offline Library — a local .txt/.md reader with bookmarks and reading progress. Nothing is uploaded.">
<meta name="mobile-web-app-capable" content="yes">
<title>Offline Library</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <a class="back" href="../../index.html#projects">← <span data-i18n="back">Portfolio</span></a>
    <div class="brand">
      <span class="logo" aria-hidden="true">📚</span>
      <div class="brand-text"><h1>Offline Library</h1><small data-i18n="tagline">Your books stay on this device</small></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="lang-btn" type="button" aria-label="Language">🇬🇧 EN</button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Theme">☀️</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab active" type="button" role="tab" data-tab="library" data-i18n="tabLibrary" aria-selected="true">Library</button>
    <button class="tab" type="button" role="tab" data-tab="read" data-i18n="tabRead" aria-selected="false">Read</button>
    <button class="tab" type="button" role="tab" data-tab="bookmarks" data-i18n="tabBookmarks" aria-selected="false">Bookmarks</button>
  </nav>

  <main class="workspace">
    <section class="pane active" id="tab-library" role="tabpanel">
      <div class="library-head">
        <label class="search"><span aria-hidden="true">🔎</span><input type="search" id="search" autocomplete="off"></label>
        <button class="primary-btn" id="btn-file" type="button">＋ <span data-i18n="addBook">Add book</span></button>
        <input type="file" id="file-picker" accept=".txt,.md,.markdown,.html" multiple hidden>
      </div>

      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <div class="drop-ico" aria-hidden="true">📂</div>
        <p data-i18n="dropTitle">Drop .txt or .md files here</p>
        <small data-i18n="dropHint">or click to browse · nothing is uploaded</small>
      </div>

      <div class="book-list" id="book-list"></div>
    </section>

    <section class="pane" id="tab-read" role="tabpanel">
      <div class="reader-head">
        <div class="reader-title"><h2 id="read-title">—</h2><small id="read-meta"></small></div>
        <div class="reader-controls">
          <button class="ghost-btn icon-only" id="font-down" type="button" aria-label="Smaller font">A−</button>
          <button class="ghost-btn icon-only" id="font-up" type="button" aria-label="Larger font">A＋</button>
          <button class="ghost-btn" id="btn-bm" type="button">★ <span data-i18n="bookmark">Bookmark</span></button>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="read-progress"></div></div>
      <article class="reader-body" id="read-body"></article>
    </section>

    <section class="pane" id="tab-bookmarks" role="tabpanel">
      <h2 class="pane-title" data-i18n="bookmarksTitle">Bookmarks</h2>
      <div class="bm-list" id="bm-list"></div>
    </section>
  </main>

  <div class="side-foot" id="offline-state"><span class="offline-dot"></span><span data-i18n="offlineReady">Offline ready</span></div>
</div>

<dialog class="dialog" id="rename-dialog">
  <form method="dialog">
    <h3 data-i18n="renameTitle">Rename book</h3>
    <input type="text" id="rename-input" aria-label="New name" spellcheck="false">
    <div class="dialog-actions">
      <button value="cancel" class="ghost-btn" type="submit" data-i18n="cancel">Cancel</button>
      <button value="ok" class="primary-btn" type="submit" data-i18n="rename">Rename</button>
    </div>
  </form>
</dialog>

<dialog class="dialog" id="bookmark-dialog">
  <form method="dialog">
    <h3 data-i18n="bookmarkDialogTitle">Add bookmark</h3>
    <label class="field"><span data-i18n="bookmarkLabel">Label</span><input type="text" id="bookmark-input"></label>
    <div class="dialog-actions">
      <button value="cancel" class="ghost-btn" type="submit" data-i18n="cancel">Cancel</button>
      <button value="ok" class="primary-btn" type="submit" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
<script src="../../top_buttons.js"></script>
</body>
</html>
