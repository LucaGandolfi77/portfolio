<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b14"><meta name="description" content="Soundscape Studio — generatore ambientale con mixer, offline, zero server.">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>Soundscape Studio</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<header id="topbar"><h1>Soundscape Studio</h1><nav id="tabs"><button class="tab active" data-tab="mixer">Mixer</button><button class="tab" data-tab="timer">Timer</button><button class="tab" data-tab="presets">Ambienti</button></nav></header>
<main id="content">
<section id="tab-mixer" class="tab-content active">
  <canvas id="visual" aria-label="Visualizzazione audio"></canvas>
  <div class="mixer-grid">
    <div class="channel"><label>Volume</label><input type="range" min="0" max="1" step="0.05" value="0.8" id="vol-master"></div>
    <div class="channel"><label>Basso</label><input type="range" min="-12" max="12" step="1" value="0" id="eq-bass"></div>
    <div class="channel"><label>Treble</label><input type="range" min="-12" max="12" step="1" value="0" id="eq-treble"></div>
    <div class="channel"><label>Pan</label><input type="range" min="-1" max="1" step="0.1" value="0" id="pan-master"></div>
  </div>
  <div class="toolbar"><button id="btn-play" aria-label="Avvia">▶ Avvia</button><span id="status">Offline — nessun server</span></div>
</section>
<section id="tab-timer" class="tab-content">
  <h2>Timer sessione</h2>
  <div id="timer-display">25:00</div>
  <button id="btn-timer">Avvia Pomodoro</button>
</section>
<section id="tab-presets" class="tab-content">
  <h2>Ambienti (offline)</h2>
  <div class="preset-grid" id="preset-grid"></div>
</section>
</main>
</div>
<script src="js/mixer.js"></script><script src="canvas-visual.js"></script><script src="presets/rain.js"></script><script src="presets/forest.js"></script><script src="presets/ocean.js"></script><script src="presets/fire.js"></script><script src="app.js"></script>
</body>
</html>
