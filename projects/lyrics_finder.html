<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Lyrics Finder</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e94560;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #a0c0e0;
            font-size: 1.1rem;
        }

        .search-box {
            background: var(--card-color);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--text-color);
        }

        .btn {
            background: var(--text-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #ff5e78;
        }

        .btn-secondary {
            background: var(--accent-color);
        }

        .results {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-card {
            background: var(--card-color);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
            border: 1px solid transparent;
        }

        .result-card:hover {
            transform: translateX(5px);
            border-color: var(--text-color);
        }

        .album-art {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            background: #333;
            object-fit: cover;
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .artist {
            color: #a0c0e0;
        }

        .snippet {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #a0c0e0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info-note {
            background: rgba(255, 193, 7, 0.1);
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← Back to Portfolio</a>
    
    <div class="container">
        <header>
            <h1>Reverse Lyrics Finder</h1>
            <div class="subtitle">Find a song using just a few words from key lyrics</div>
        </header>

        <div class="search-box">
            <input type="text" id="lyricsInput" placeholder="e.g. 'is this the real life is this just fantasy'" onkeypress="handleEnter(event)">
            
            <div style="display:flex; gap:10px; flex-wrap:wrap">
                <button class="btn" onclick="searchLyrics()">Search Songs</button>
                <button class="btn btn-secondary" onclick="googleSearch()">Search on Google</button>
            </div>

            <div class="info-note">
                <strong>How it works:</strong> We use public APIs to find songs matching your text. 
                <br>If no direct match is found via API, use the "Search on Google" button for a "site:genius.com" smart search.
            </div>
        </div>

        <div id="resultsArea" class="results"></div>
    </div>

    <script>
        function handleEnter(e) {
            if(e.key === 'Enter') searchLyrics();
        }

        async function searchLyrics() {
            const query = document.getElementById('lyricsInput').value.trim();
            if (!query) return;

            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = '<div style="text-align:center; padding:20px;">Searching...</div>';

            // Mix of strategies. Since we don't have a backend to hide keys,
            // we will use the iTunes Search API which is free and often finds matching songs by text 
            // even if it's not strictly "lyrics" search, it's keyword search.
            // AND we can try to use a specialized free API if available.
            // 'https://api.lyrics.ovh/suggest/' works well for titles/artists but sometimes catches lyrics.

            try {
                // Strategy: Use iTunes Search API
                // Searching for music tracks matching the query terms
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=10`);
                
                if (!response.ok) {
                    throw new Error("iTunes API Response not OK");
                }
                
                const data = await response.json();

                resultsArea.innerHTML = '';

                if (data.resultCount === 0) {
                    resultsArea.innerHTML = `
                        <div style="text-align:center; padding:20px; color:#aaa">
                            No direct matches found in iTunes.<br>
                            Try the <strong>Google Search</strong> button for a deeper lyrics search.
                        </div>
                    `;
                    return;
                }

                // Iterate over iTunes results
                data.results.forEach(song => {
                    const card = document.createElement('a');
                    card.className = 'result-card';
                    // Use trackViewUrl to link to the song on Apple Music
                    card.href = song.trackViewUrl;
                    card.target = '_blank';
                    
                    // Artwork is usually 100x100
                    const art = song.artworkUrl100 || '';

                    card.innerHTML = `
                        <img src="${art}" class="album-art" alt="Cover">
                        <div class="song-info">
                            <div class="song-title">${song.trackName}</div>
                            <div class="artist">${song.artistName} • ${song.collectionName}</div>
                            <div class="snippet">Click to view on Apple Music</div>
                        </div>
                    `;
                    resultsArea.appendChild(card);
                });

            } catch (e) {
                console.error(e);
                resultsArea.innerHTML = '<div style="text-align:center; color:#ff5e78">Error fetching results. Try Google Search button.</div>';
            }
        }

        function googleSearch() {
            const query = document.getElementById('lyricsInput').value.trim();
            if (!query) return;
            
            // Smart search restricted to lyrics sites
            const searchUrl = `https://www.google.com/search?q=site:genius.com+OR+site:azlyrics.com+OR+site:lyrics.com+"${encodeURIComponent(query)}"`;
            window.open(searchUrl, '_blank');
        }
    </script>
</body>
</html>
