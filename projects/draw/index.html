<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d18">
<meta name="description" content="Pixel Studio — a full offline photo and pixel editor with layers, filters, text, stickers and multi-format export.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Pixel Studio — Draw</title>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <header id="topbar" class="glass">
    <div class="brand"><span class="brand-mark">✦</span><b>Pixel Studio</b></div>
    <input id="doc-name" class="doc-name" aria-label="Document name">
    <span id="save-status" class="save-status">●</span>
    <div class="top-actions">
      <button id="btn-undo" class="icon-btn" title="Undo" aria-label="Undo">↶</button>
      <button id="btn-redo" class="icon-btn" title="Redo" aria-label="Redo">↷</button>
      <span class="sep"></span>
      <button id="btn-new" class="icon-btn" title="New" aria-label="New">＋</button>
      <button id="btn-import" class="icon-btn" title="Import" aria-label="Import">🖼</button>
      <button id="btn-camera" class="icon-btn" title="Camera" aria-label="Camera">📷</button>
      <button id="btn-project" class="icon-btn" title="Project" aria-label="Project">💾</button>
      <button id="btn-share" class="icon-btn" title="Share" aria-label="Share">↗</button>
      <button id="btn-export" class="btn primary">Export</button>
      <button id="btn-lang" class="icon-btn small" title="Language">IT</button>
    </div>
  </header>

  <!-- TOOL RAIL -->
  <nav id="tool-rail" class="glass" aria-label="Tools"></nav>

  <!-- STAGE -->
  <main id="stage">
    <canvas id="canvas" aria-label="Editing canvas"></canvas>
    <div id="hud" class="glass"><span id="hud-zoom">100%</span><i></i><span id="hud-size">512 × 512</span><i></i><span id="hud-tool">Brush</span></div>
    <div id="zoom-tools" class="glass">
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <button id="zoom-fit" aria-label="Fit">Fit</button>
      <button id="zoom-in" aria-label="Zoom in">＋</button>
    </div>
    <div id="mini-wrap" class="glass"><canvas id="mini" width="120" height="120"></canvas></div>
  </main>

  <!-- INSPECTOR -->
  <aside id="inspector" class="glass">
    <div class="inspector-head"><b id="inspector-title">Properties</b><button id="inspector-close" aria-label="Close">✕</button></div>
    <div id="inspector-body"></div>
  </aside>

  <!-- BOTTOM DOCK -->
  <section id="dock" class="glass">
    <div class="dock-tabs">
      <button data-tab="layers" class="on">Layers</button>
      <button data-tab="history">History</button>
      <button data-tab="stickers">Stickers</button>
      <button data-tab="adjust">Adjust</button>
      <button data-tab="effects">Effects</button>
      <span class="dock-spacer"></span>
      <button id="dock-toggle" title="Collapse">⌄</button>
    </div>
    <div id="dock-body"></div>
  </section>

  <button id="props-fab" class="fab glass" aria-label="Properties">⚙</button>
</div>

<div id="dialog" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog-box glass">
    <div class="dialog-title" id="dialog-title"></div>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-actions" id="dialog-actions"></div>
  </div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<input id="file-input" type="file" accept="image/*" hidden>
<input id="project-input" type="file" accept="application/json,.json" hidden>
<video id="camera-video" playsinline autoplay muted hidden></video>

<script type="module" src="js/main.js"></script>
<script src="../../top_buttons.js"></script>
</body>
</html>
