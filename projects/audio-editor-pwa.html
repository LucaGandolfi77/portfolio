<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14141f">
<title>AUDIO EDITOR — Multi-track mixer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#14141f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#4dc3ff;font-size:clamp(28px,10vw,72px);text-align:center;text-shadow:0 0 30px rgba(77,195,255,.5),0 0 60px rgba(77,195,255,.2);letter-spacing:clamp(4px,2vw,16px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#888;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #4dc3ff;background:rgba(77,195,255,.08);color:#d0d0d0;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(77,195,255,.2);box-shadow:0 0 24px rgba(77,195,255,.2)}
#credit{position:fixed;bottom:16px;color:#444;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">AUDIO EDITOR</div>
  <div id="sub">Multi-track mixer</div>
  <button id="apri" onclick="window.location.href='audio-editor-pwa/index.html'">APRI</button>
</div>
<div id="credit">Taglia, mescola, applica effetti ed esporta WAV/MP3</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14141f);
scene.fog = new THREE.FogExp2(0x14141f, 0.018);

const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
camera.position.set(0, 2, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.75;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;

const amb = new THREE.AmbientLight(0x1a1a2e, 0.4);
scene.add(amb);

const cyanLight = new THREE.PointLight(0x4dc3ff, 3, 20, 1.5);
cyanLight.position.set(0, 3, 0);
scene.add(cyanLight);

const goldLight = new THREE.PointLight(0xf6c63f, 2, 16, 1.5);
goldLight.position.set(-3, 1, 2);
scene.add(goldLight);

const greenLight = new THREE.PointLight(0x35d0ba, 1.5, 14, 1.5);
greenLight.position.set(3, 2, -2);
scene.add(greenLight);

const waveformGroup = new THREE.Group();
scene.add(waveformGroup);

const waveMat = new THREE.MeshStandardMaterial({
  color: 0x4dc3ff, emissive: 0x4dc3ff, emissiveIntensity: 0.6,
  roughness: 0.3, metalness: 0.2
});
const waveCount = 60;
const wavePositions = new Float32Array(waveCount * 3);
for (let i = 0; i < waveCount; i++) {
  const x = (i - waveCount / 2) * 0.22;
  wavePositions[i * 3] = x;
  wavePositions[i * 3 + 1] = 0;
  wavePositions[i * 3 + 2] = 0;
}
const waveGeo = new THREE.BufferGeometry();
waveGeo.setAttribute('position', new THREE.BufferAttribute(wavePositions, 3));
const waveLine = new THREE.Line(waveGeo, new THREE.LineBasicMaterial({ color: 0x4dc3ff, linewidth: 2 }));
waveformGroup.add(waveLine);

for (let i = 0; i < waveCount; i++) {
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.1, 0.08),
    waveMat.clone()
  );
  bar.position.x = (i - waveCount / 2) * 0.22;
  waveformGroup.add(bar);
}

const barMat = new THREE.MeshStandardMaterial({
  color: 0xf6c63f, emissive: 0xf6c63f, emissiveIntensity: 0.5,
  roughness: 0.4, metalness: 0.1
});
const bars = [];
for (let i = 0; i < 24; i++) {
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.3, 0.12),
    barMat.clone()
  );
  const angle = (i / 24) * Math.PI * 2;
  const r = 4.2 + Math.random() * 1.2;
  bar.position.set(Math.cos(angle) * r, 0.15, Math.sin(angle) * r);
  bar.material.emissiveIntensity = 0.3 + Math.random() * 0.4;
  waveformGroup.add(bar);
  bars.push({ mesh: bar, angle, radius: r, phase: Math.random() * Math.PI * 2 });
}

const emojis = ['🎚','🎵','🎛','🔊','🎶','🎧','🎤','✨'];
const emojiSprites = [];
for (let i = 0; i < emojis.length; i++) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '80px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emojis[i], 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.6 });
  const sprite = new THREE.Sprite(mat);
  const angle = (i / emojis.length) * Math.PI * 2;
  const radius = 4.5 + Math.random() * 1.5;
  sprite.position.set(Math.cos(angle) * radius, 1.5 + Math.sin(i * 1.3) * 1.2, Math.sin(angle) * radius);
  sprite.scale.set(0.8, 0.8, 1);
  scene.add(sprite);
  emojiSprites.push({ sprite, angle, radius, baseY: sprite.position.y, speed: 0.15 + Math.random() * 0.1 });
}

function createGlowTexture(r, g, b) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, `rgba(255,255,255,1)`);
  grad.addColorStop(0.2, `rgba(${r},${g},${b},0.5)`);
  grad.addColorStop(0.5, `rgba(${r},${g},${b},0.12)`);
  grad.addColorStop(1, `rgba(255,255,255,0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowCyan = new THREE.Sprite(new THREE.SpriteMaterial({
  map: createGlowTexture(77, 195, 255), transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending
}));
glowCyan.scale.set(6, 6, 1);
waveformGroup.add(glowCyan);

const PARTICLES = 500;
const pGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLES * 3);
const colors = new Float32Array(PARTICLES * 3);
const pVelocities = new Float32Array(PARTICLES * 3);
const pColors = [
  [0.30, 0.76, 1.0],
  [0.96, 0.78, 0.25],
  [0.21, 0.82, 0.73],
  [1.0, 0.36, 0.42],
  [0.55, 0.55, 1.0],
  [0.6, 0.9, 0.6],
];
for (let i = 0; i < PARTICLES; i++) {
  positions[i*3] = (Math.random()-0.5) * 30;
  positions[i*3+1] = (Math.random()-0.5) * 15;
  positions[i*3+2] = (Math.random()-0.5) * 30;
  const c = pColors[Math.floor(Math.random()*pColors.length)];
  colors[i*3] = c[0];
  colors[i*3+1] = c[1];
  colors[i*3+2] = c[2];
  pVelocities[i*3] = (Math.random()-0.5) * 0.003;
  pVelocities[i*3+1] = (Math.random()-0.5) * 0.002;
  pVelocities[i*3+2] = (Math.random()-0.5) * 0.003;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const pMat = new THREE.PointsMaterial({
  size: 0.1, vertexColors: true, transparent: true, opacity: 0.65,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

const mouse = new THREE.Vector2(9999, 9999);
let touchActive = false;
function onPointerMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function onPointerDown() { touchActive = true; }
function onPointerUp() { touchActive = false; mouse.set(9999, 9999); }
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointerend', onPointerUp);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.3, 0.5, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  composer.setSize(w, h);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  waveformGroup.position.y = Math.sin(t * 0.6) * 0.2;
  waveformGroup.rotation.y = Math.sin(t * 0.15) * 0.12;

  const posAttr = waveLine.geometry.attributes.position;
  for (let i = 0; i < waveCount; i++) {
    const x = (i - waveCount / 2) * 0.22;
    const y = Math.sin(t * 2.5 + i * 0.3) * 0.6 * Math.sin(i / waveCount * Math.PI);
    posAttr.setY(i, y);
    const child = waveformGroup.children[i + 1];
    if (child && child.isMesh) {
      child.scale.y = Math.max(0.1, Math.abs(y) * 3 + 0.1);
      child.position.y = y * 0.5;
    }
  }
  posAttr.needsUpdate = true;

  for (const b of bars) {
    const h = 0.3 + Math.abs(Math.sin(t * 1.8 + b.phase)) * 0.8;
    b.mesh.scale.y = h;
    b.mesh.position.y = h * 0.15;
    b.mesh.material.emissiveIntensity = 0.3 + Math.sin(t * 1.5 + b.phase) * 0.3;
  }

  cyanLight.intensity = 3 + Math.sin(t * 1.8) * 0.5;
  goldLight.position.x = -3 + Math.sin(t * 0.7) * 1.5;
  greenLight.position.z = -2 + Math.cos(t * 0.5) * 2;

  for (const e of emojiSprites) {
    e.angle += e.speed * 0.008;
    e.sprite.position.x = Math.cos(e.angle) * e.radius;
    e.sprite.position.z = Math.sin(e.angle) * e.radius;
    e.sprite.position.y = e.baseY + Math.sin(t * 0.8 + e.angle * 2) * 0.4;
  }

  const ppos = particles.geometry.attributes.position.array;
  for (let i = 0; i < PARTICLES; i++) {
    ppos[i*3] += pVelocities[i*3];
    ppos[i*3+1] += pVelocities[i*3+1];
    ppos[i*3+2] += pVelocities[i*3+2];
    if (ppos[i*3] > 15) ppos[i*3] = -15;
    if (ppos[i*3] < -15) ppos[i*3] = 15;
    if (ppos[i*3+1] > 7.5) ppos[i*3+1] = -7.5;
    if (ppos[i*3+1] < -7.5) ppos[i*3+1] = 7.5;
    if (ppos[i*3+2] > 15) ppos[i*3+2] = -15;
    if (ppos[i*3+2] < -15) ppos[i*3+2] = 15;
    if (touchActive) {
      const dx = (mouse.x * 8) - ppos[i*3];
      const dy = (mouse.y * 6) - ppos[i*3+1];
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 5) {
        const force = 0.0002 / (dist + 0.5);
        pVelocities[i*3] += dx * force;
        pVelocities[i*3+1] += dy * force;
      }
    }
    pVelocities[i*3] *= 0.999;
    pVelocities[i*3+1] *= 0.999;
    pVelocities[i*3+2] *= 0.999;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
