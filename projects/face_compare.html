<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Face Compare</title>
	<style>
		body{ font-family:Inter,system-ui; background:#0b1220; color:#eaf6ff; margin:0; padding:20px }
		.card{ max-width:900px; margin:0 auto; background:rgba(255,255,255,0.03); padding:20px; border-radius:12px }
		img{ max-width:45%; }
		.row{ display:flex; gap:12px; align-items:center }
	</style>
</head>
<body>
	<div class="card">
		<h1>Face Compare</h1>
		<div class="row">
			<div>
				<input id="a" type="file" accept="image/*"><br>
				<img id="ia">
			</div>
			<div>
				<input id="b" type="file" accept="image/*"><br>
				<img id="ib">
			</div>
		</div>
		<div style="margin-top:12px"><button id="compare">Compare</button> <span id="res"></span></div>
	</div>
	<script>
		function load(file, img){ if(!file) return; img.src = URL.createObjectURL(file); }
		document.getElementById('a').addEventListener('change', e=> load(e.target.files[0], document.getElementById('ia')));
		document.getElementById('b').addEventListener('change', e=> load(e.target.files[0], document.getElementById('ib')));
		document.getElementById('compare').addEventListener('click', async ()=>{
			const ia = document.getElementById('ia'); const ib = document.getElementById('ib'); if(!ia.src||!ib.src) return alert('Select both images');
			document.getElementById('res').textContent = 'Comparing...';
			await new Promise(r=>setTimeout(r,900));
			const fake = Math.random()*0.6 + 0.2; document.getElementById('res').textContent = `Similarity: ${ (fake*100).toFixed(1) }%`;
		});
	</script>
</body>
<script src="top_buttons.js"></script>
</html>
