<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Birds — generative flock</title>
	<style>
		body { margin:0; background:#0b1220; color:#eaf6ff; font-family: Inter, system-ui, -apple-system, Roboto, Arial; overflow:hidden; }
		canvas { display:block; width:100vw; height:100vh; }
		.overlay { position:absolute; left:12px; top:12px; background:rgba(0,0,0,0.35); padding:8px 10px; border-radius:8px; }
		.overlay input { width:80px }
		.controls { position:absolute; right:12px; top:12px; background:rgba(0,0,0,0.35); padding:8px 10px; border-radius:8px; display:flex; flex-direction:column; gap:6px; }
		.ctrl-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#eaf6ff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:0.8rem; }
		.ctrl-btn:hover { background:rgba(255,255,255,0.2); }
		.camera-info { font-size:0.7rem; color:#94a3b8; }
		.flock-info { font-size:0.7rem; color:#94a3b8; margin-top:4px; }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div class="overlay">
		<label>Boids: <input id="count" type="range" min="10" max="800" value="200"></label>
		<button id="reset">Reset</button>
	</div>
	<div class="controls">
		<button class="ctrl-btn" id="camCenter">🎯 Center</button>
		<button class="ctrl-btn" id="camZoomIn">🔍+</button>
		<button class="ctrl-btn" id="camZoomOut">🔍-</button>
		<button class="ctrl-btn" id="camToggle3D">🔄 3D</button>
		<div class="camera-info" id="camInfo">Cam: 0,0</div>
		<div class="flock-info" id="flockInfo">Flock: 200</div>
	</div>
	<script>
		const canvas = document.getElementById('c');
		const ctx = canvas.getContext('2d');
		let camX = 0, camY = 0, camZoom = 1;
		let is3D = false;
		let boids = [];
		
		function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
		addEventListener('resize', resize); resize();

		class Boid {
			constructor(x, y, vx, vy, color){
				this.x = x ?? Math.random()*canvas.width;
				this.y = y ?? Math.random()*canvas.height;
				this.vx = vx ?? (Math.random()-0.5)*2;
				this.vy = vy ?? (Math.random()-0.5)*2;
				this.color = color ?? `hsl(${Math.random()*360}, 70%, 60%)`;
				this.size = 4 + Math.random()*2;
			}
			
			update(boids){
				let ax=0, ay=0; let neigh=0;
				for(const b of boids){
					const dx=b.x-this.x;
					const dy=b.y-this.y;
					const d=Math.hypot(dx,dy);
					if(d>0 && d<80){
						ax += dx/d * 0.02;
						ay += dy/d * 0.02;
						neigh++;
					}
				}
				if(neigh>0){
					ax/=neigh; ay/=neigh;
					this.vx += ax; this.vy += ay;
				}
				// limit speed
				const speed = Math.hypot(this.vx,this.vy);
				if(speed>3){ this.vx = (this.vx/speed)*3; this.vy = (this.vy/speed)*3; }
				this.x+=this.vx; this.y+=this.vy;
				// wrap
				if(this.x<0) this.x+=canvas.width; if(this.x>canvas.width) this.x-=canvas.width;
				if(this.y<0) this.y+=canvas.height; if(this.y>canvas.height) this.y-=canvas.height;
			}
			
			draw(){
				const angle = Math.atan2(this.vy,this.vx);
				const scale = camZoom;
				
				if(is3D){
					// 3D bird model with perspective
					ctx.save();
					ctx.translate((this.x - camX) * scale, (this.y - camY) * scale);
					ctx.rotate(angle);
					
					// Body
					ctx.fillStyle = this.color;
					ctx.globalAlpha = 0.9;
					ctx.beginPath();
					ctx.ellipse(0, 0, this.size*1.5, this.size, 0, 0, Math.PI*2);
					ctx.fill();
					
					// Wing (3D effect)
					ctx.fillStyle = this.color;
					ctx.globalAlpha = 0.7;
					ctx.beginPath();
					ctx.moveTo(0, 0);
					ctx.bezierCurveTo(this.size*2, -this.size*1.5, this.size*2, this.size*1.5, 0, 0);
					ctx.fill();
					
					// Head
					ctx.fillStyle = '#fff';
					ctx.beginPath();
					ctx.arc(this.size*1.8, -this.size*0.3, this.size*0.5, 0, Math.PI*2);
					ctx.fill();
					
					// Eye
					ctx.fillStyle = '#000';
					ctx.beginPath();
					ctx.arc(this.size*2, -this.size*0.5, this.size*0.15, 0, Math.PI*2);
					ctx.fill();
					
					ctx.restore();
				}else{
					// 2D bird
					ctx.save();
					ctx.translate((this.x - camX) * scale, (this.y - camY) * scale);
					ctx.rotate(angle);
					ctx.fillStyle = this.color;
					ctx.globalAlpha = 0.9;
					ctx.beginPath();
					ctx.moveTo(0, 0);
					ctx.lineTo(-this.size*1.5, -this.size);
					ctx.lineTo(-this.size*1.5, this.size);
					ctx.closePath();
					ctx.fill();
					ctx.restore();
				}
			}
		}

		function make(n){
			boids = [];
			for(let i=0;i<n;i++){
				boids.push(new Boid());
			}
			updateInfo();
		}
		
		function updateInfo(){
			document.getElementById('flockInfo').textContent = `Flock: ${boids.length}`;
			document.getElementById('camInfo').textContent = `Cam: ${Math.round(camX)},${Math.round(camY)}`;
		}
		
		function frame(){
			// Dark gradient background
			const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
			grad.addColorStop(0, '#0b1220');
			grad.addColorStop(1, '#1a2639');
			ctx.fillStyle = grad;
			ctx.fillRect(0,0,canvas.width,canvas.height);
			
			// Stars effect
			ctx.fillStyle = 'rgba(255,255,255,0.1)';
			for(let i=0;i<20;i++){
				const x = (Math.random()*canvas.width) % canvas.width;
				const y = (Math.random()*canvas.height) % canvas.height;
				ctx.fillRect(x, y, 1, 1);
			}
			
			for(const b of boids){
				b.update(boids);
				b.draw();
			}
			
			requestAnimationFrame(frame);
		}
		
		// Controls
		document.getElementById('count').addEventListener('input', (e)=> make(+e.target.value));
		document.getElementById('reset').addEventListener('click', ()=> make(+document.getElementById('count').value));
		
		document.getElementById('camCenter').addEventListener('click', ()=>{
			camX = canvas.width/2;
			camY = canvas.height/2;
		});
		
		document.getElementById('camZoomIn').addEventListener('click', ()=>{
			camZoom = Math.min(3, camZoom + 0.2);
		});
		
		document.getElementById('camZoomOut').addEventListener('click', ()=>{
			camZoom = Math.max(0.3, camZoom - 0.2);
		});
		
		document.getElementById('camToggle3D').addEventListener('click', ()=>{
			is3D = !is3D;
		});
		
		// Mouse drag for camera
		let isDragging = false;
		let dragStartX = 0, dragStartY = 0;
		let camStartX = 0, camStartY = 0;
		
		canvas.addEventListener('mousedown', (e)=>{
			isDragging = true;
			dragStartX = e.clientX;
			dragStartY = e.clientY;
			camStartX = camX;
			camStartY = camY;
		});
		
		canvas.addEventListener('mousemove', (e)=>{
			if(!isDragging) return;
			const dx = e.clientX - dragStartX;
			const dy = e.clientY - dragStartY;
			camX = camStartX - dx;
			camY = camStartY - dy;
			updateInfo();
		});
		
		canvas.addEventListener('mouseup', ()=>{ isDragging = false; });
		canvas.addEventListener('mouseleave', ()=>{ isDragging = false; });
		
		// Touch support
		canvas.addEventListener('touchstart', (e)=>{
			if(e.touches.length === 1){
				isDragging = true;
				dragStartX = e.touches[0].clientX;
				dragStartY = e.touches[0].clientY;
				camStartX = camX;
				camStartY = camY;
			}
		});
		
		canvas.addEventListener('touchmove', (e)=>{
			if(!isDragging || e.touches.length !== 1) return;
			e.preventDefault();
			const dx = e.touches[0].clientX - dragStartX;
			const dy = e.touches[0].clientY - dragStartY;
			camX = camStartX - dx;
			camY = camStartY - dy;
			updateInfo();
		});
		
		canvas.addEventListener('touchend', ()=>{ isDragging = false; });
		
		make(200);
		frame();
	</script>
</body>
<script src="top_buttons.js"></script>
</html>
