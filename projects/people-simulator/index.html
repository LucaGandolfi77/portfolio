<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark light">
<meta name="description" content="People Simulator — a living cohort model of a day in the United States, with events, scenarios and offline maps.">
<title>People Simulator — a living model of the USA</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/people-simulator/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/d3.min.js" defer></script>
<script src="vendor/topojson.min.js" defer></script>
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="People Simulator" data-id="people-simulator"
  data-back="../../projects.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<main id="app">
  <section class="hero">
    <div class="hero-icon" aria-hidden="true">👥</div>
    <div><h1 data-i18n="title">PEOPLE SIMULATOR</h1><p data-i18n="tagline">A living model of a day in the United States</p></div>
    <div class="hero-actions">
      <button class="btn ghost" id="tutorialBtn" data-i18n="tutorial">How it works</button>
      <button class="btn ghost" id="langBtn" data-i18n="lang">IT / EN</button>
    </div>
  </section>

  <section class="map-card">
    <div id="map-wrap" aria-label="USA map"><div id="loading" data-i18n="loading">Loading model…</div></div>
    <div class="map-hud">
      <div class="pill clock"><span class="live-dot"></span><b id="clock-time">--:--</b><small id="clock-day">—</small></div>
      <div class="pill"><span data-i18n="state">State</span>
        <select id="stateSelect" aria-label="State"></select></div>
      <div class="pill"><span data-i18n="eventsLabel">Active event</span>
        <select id="eventSelect" aria-label="Event"></select></div>
    </div>
    <div class="map-tools">
      <button class="btn" id="playBtn">⏸ <span data-i18n="pause">Pause</span></button>
      <button class="btn" id="speedBtn">4×</button>
      <button class="btn ghost" id="stepHour" data-i18n="stepHour">+1 hour</button>
      <button class="btn ghost" id="stepDay" data-i18n="stepDay">+1 day</button>
      <button class="btn ghost" id="resetView" data-i18n="reset">Reset view</button>
      <button class="btn ghost" id="favBtn" data-i18n="favorites">Favorites</button>
      <button class="btn ghost" id="compareBtn" data-i18n="compare">Compare</button>
      <button class="btn ghost" id="scenarioBtn" data-i18n="scenario">Scenario</button>
    </div>
    <div class="favorites" id="favorites"></div>
  </section>

  <section class="grid">
    <article class="card hero-metric">
      <div class="card-head"><h2 data-i18n="dominant">Right now, most people are</h2><span class="badge" id="st-pop">—</span></div>
      <div class="dominant"><span id="dominant-icon">•</span><p id="dominant-text">—</p><b id="dominant-pct">—</b></div>
      <div class="state-line"><b id="st-name">United States</b><small id="st-nick"></small></div>
      <div class="donut" id="activityDonut"></div>
    </article>

    <article class="card">
      <div class="card-head"><h2 data-i18n="activity">Activity</h2><span class="badge">%</span></div>
      <div class="activity-bars" id="activityBars"></div>
    </article>

    <article class="card">
      <div class="card-head"><h2 data-i18n="metrics">Metrics</h2><span class="badge" id="eventLabel">—</span></div>
      <div class="metrics" id="metrics"></div>
      <div class="spark-wrap"><span data-i18n="sparkline">Last 24 hours</span><div id="sparkline"></div></div>
    </article>

    <article class="card">
      <div class="card-head"><h2 data-i18n="timeline">Timeline</h2><span class="badge">24h</span></div>
      <div class="day-strip" id="dayStrip"></div>
      <p class="hint">⌁ <span data-i18n="offline">Vendored map & data — works offline</span></p>
    </article>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div></div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../_shared/shell.js" defer></script>
</body>
</html>
