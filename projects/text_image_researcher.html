<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Web Content Researcher</title>
  <style>
    /* === RESET & VARIABLES === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #22d3ee;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --border: rgba(255,255,255,0.08);
      --highlight: rgba(99,102,241,0.3);
      --glow: 0 0 20px rgba(99,102,241,0.4);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: rgba(0,0,0,0.08);
      --highlight: rgba(99,102,241,0.15);
      --glow: 0 0 20px rgba(99,102,241,0.2);
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
      line-height: 1.6;
    }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* === LAYOUT === */
    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    /* === HEADER === */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: grid;
      place-items: center;
      transition: all var(--transition);
    }
    .theme-toggle:hover { border-color: var(--primary); background: var(--surface-2); }

    .history-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all var(--transition);
    }
    .history-toggle:hover { border-color: var(--primary); color: var(--text); }

    /* === SEARCH PANEL === */
    .search-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-row label {
      font-size: 1.2rem;
      flex-shrink: 0;
      width: 30px;
      text-align: center;
    }

    .input-row input[type="text"],
    .input-row input[type="url"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition);
    }

    .input-row input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--highlight);
    }

    .btn {
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all var(--transition);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary); }

    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-icon { padding: 8px; font-size: 1rem; line-height: 1; }

    /* Keyword chips */
    .keywords-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 20px;
    }

    .keyword-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--highlight);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      animation: chipIn 0.2s ease;
    }

    @keyframes chipIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .keyword-chip button {
      background: none; border: none; color: inherit;
      cursor: pointer; font-size: 1rem; line-height: 1;
      opacity: 0.7;
    }
    .keyword-chip button:hover { opacity: 1; }

    /* Filter tags */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-row span {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .filter-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all var(--transition);
    }
    .filter-btn:hover { border-color: var(--primary); color: var(--text); }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Options row */
    .options-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .option-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px; height: 16px;
      cursor: pointer;
    }

    /* === STATUS BAR === */
    .status-bar {
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
    }

    .status-bar .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    .status-bar .dot.success { background: var(--success); }
    .status-bar .dot.error { background: var(--error); }
    .status-bar .dot.loading { background: var(--warning); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Progress bar */
    .progress-container {
      width: 100%;
      height: 3px;
      background: var(--surface);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }
    .progress-container.active { display: block; }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 99px;
      animation: progress 2s ease-in-out infinite;
      width: 0%;
    }

    @keyframes progress {
      0% { width: 5%; }
      50% { width: 80%; }
      100% { width: 100%; }
    }

    /* === TAB BAR === */
    .tab-bar {
      display: flex;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      position: relative;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn:hover { background: var(--surface-2); color: var(--text); }
    .tab-btn.active { color: var(--primary); background: var(--surface-2); }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 2px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    .tab-count {
      background: var(--surface-2);
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .tab-btn.active .tab-count { background: var(--highlight); color: var(--primary); }

    /* === RESULT CARDS === */
    #results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100px;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }
    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow);
      border-color: var(--primary);
    }

    .result-card .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-type-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      background: var(--highlight);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
      flex: 1;
    }

    .card-title a {
      color: var(--accent);
      text-decoration: none;
    }
    .card-title a:hover { text-decoration: underline; }

    .card-context {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 6px 0;
      line-height: 1.5;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* === IMAGE GRID === */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .image-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition);
      cursor: pointer;
    }
    .image-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--glow);
    }

    .image-card .img-wrapper {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--bg);
      display: grid;
      place-items: center;
    }

    .image-card .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .image-card:hover .img-wrapper img { transform: scale(1.05); }

    .image-card .img-info {
      padding: 10px 12px;
    }

    .image-card .img-info .img-alt {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 500;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .image-card .img-info .img-src {
      font-size: 0.72rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .img-placeholder {
      color: var(--text-muted);
      font-size: 2rem;
    }

    /* === MODAL === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 24px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      position: relative;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { transform: scale(0.95) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      display: grid;
      place-items: center;
      z-index: 10;
      transition: all var(--transition);
    }
    .modal-close:hover { background: var(--error); color: #fff; }

    .modal-img {
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      background: var(--bg);
      display: block;
    }

    .modal-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .modal-info strong { color: var(--text); flex-shrink: 0; }

    .modal-info code {
      background: var(--bg);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.82rem;
      word-break: break-all;
      flex: 1;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      padding: 0 20px 20px;
    }

    /* === HISTORY PANEL === */
    .history-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 900;
      animation: fadeIn 0.2s ease;
    }

    .history-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      max-width: 90vw;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 901;
      overflow-y: auto;
      padding: 24px;
      animation: slideInRight 0.3s ease;
    }

    .history-panel h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .history-item:hover { border-color: var(--primary); }

    .history-item .hist-url {
      font-size: 0.82rem;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 4px;
    }

    .history-item .hist-keywords {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .history-item .hist-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.6;
      margin-top: 4px;
    }

    .history-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 40px 0;
    }

    /* === LOADING STATES === */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
      min-height: 80px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* === TOAST === */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      max-width: 360px;
      animation: slideInRight 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--error); }
    .toast.warning { border-left-color: var(--warning); }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateX(30px); }
    }

    /* === ERROR CARD === */
    .error-card {
      background: var(--surface);
      border: 1px solid var(--error);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }

    .error-card pre {
      font-family: inherit;
      white-space: pre-wrap;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .error-card .error-details {
      display: block;
      background: var(--bg);
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      color: var(--error);
      margin-bottom: 12px;
      word-break: break-all;
    }

    .error-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* === EMPTY STATE === */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 0.95rem;
      max-width: 400px;
      margin: 0 auto;
    }

    /* Keyword highlight */
    mark {
      background: rgba(99, 102, 241, 0.4);
      color: var(--accent);
      padding: 0 3px;
      border-radius: 3px;
      font-weight: 600;
    }

    [data-theme="light"] mark {
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary-dark);
    }

    /* Export dropdown */
    .export-dropdown {
      position: relative;
      display: inline-block;
    }

    .export-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px;
      min-width: 160px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 100;
      display: none;
    }
    .export-menu.open { display: block; animation: fadeIn 0.15s ease; }

    .export-menu button {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 8px 12px;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background var(--transition);
    }
    .export-menu button:hover { background: var(--surface-2); }

    /* === VIRTUAL SCROLL === */
    .virtual-scroll-container {
      position: relative;
    }

    .load-more-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all var(--transition);
      margin-top: 12px;
    }
    .load-more-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* === RESPONSIVE === */
    @media (max-width: 640px) {
      .app-container { padding: 0 12px 24px; }

      header { padding: 14px 0; margin-bottom: 16px; }
      .logo { font-size: 1.1rem; }

      .search-panel { padding: 16px; gap: 12px; }

      .input-row { flex-wrap: wrap; }
      .input-row label { width: auto; }
      .input-row input[type="text"],
      .input-row input[type="url"] { min-width: 0; }

      .filter-row { gap: 6px; }
      .filter-btn { padding: 4px 10px; font-size: 0.75rem; }

      .tab-bar { flex-wrap: wrap; }
      .tab-btn { padding: 10px 8px; font-size: 0.78rem; }

      .image-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }

      .modal-content { margin: 10px; }

      .history-panel { width: 100%; }
    }

    /* === FOCUS VISIBLE === */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    button:focus:not(:focus-visible),
    input:focus:not(:focus-visible) {
      outline: none;
    }

    /* === VISUALLY HIDDEN === */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .hidden { display: none !important; }

    /* === DEEP SCAN PROGRESS === */
    .deep-scan-progress {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-top: 12px;
    }

    .deep-scan-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .deep-scan-bar-bg {
      height: 6px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .deep-scan-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .deep-scan-pages {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 80px;
      overflow-y: auto;
    }

    .page-chip {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-chip.done { border-color: var(--success); color: var(--success); }
    .page-chip.fail { border-color: var(--error); color: var(--error); }
    .page-chip.scanning { border-color: var(--warning); color: var(--warning); animation: pulse 1s infinite; }

    /* === SOURCE BADGE === */
    .source-badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 1px 8px;
      border-radius: 10px;
      background: var(--highlight);

      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 4px;
      vertical-align: middle;
    }
    .source-badge::before { content: '📄 '; }
  </style>
</head>
<body>

    <!-- RESULTS -->
    <div id="results-container" role="region" aria-label="Risultati della ricerca" aria-live="polite">

      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" aria-live="polite"></div>

  <script>
    // === CONSTANTS ===
    const HISTORY_KEY = 'researcher_history';
    const THEME_KEY = 'researcher_theme';
    const PAGE_SIZE = 50;

    // === STATE ===
    let currentKeywords = [];
    let currentResults = null;
    let currentUrl = '';
    let currentTab = 'links';
    let currentFilter = 'all';
    let renderedCount = 0;
    let isLoading = false;
    let deepScanAbort = null; // AbortController for deep scan

    // === DOM REFS ===
    const $urlInput = document.getElementById('urlInput');
    const $keywordInput = document.getElementById('keywordInput');
    const $keywordsContainer = document.getElementById('keywordsContainer');
    const $fetchBtn = document.getElementById('fetchBtn');
    const $fetchBtnText = document.getElementById('fetchBtnText');
    const $statusBar = document.getElementById('statusBar');
    const $statusDot = document.getElementById('statusDot');
    const $statusText = document.getElementById('statusText');
    const $progressBar = document.getElementById('progressBar');
    const $tabBar = document.getElementById('tabBar');
    const $results = document.getElementById('results-container');
    const $emptyState = document.getElementById('emptyState');
    const $exportBtn = document.getElementById('exportBtn');
    const $exportMenu = document.getElementById('exportMenu');

    // === CORS PROXY CHAIN ===
    const CORS_PROXIES = [
      (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
      (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
      (url) => `https://cors-anywhere.herokuapp.com/${url}`
    ];

    async function fetchWithFallback(url) {
      for (const proxyFn of CORS_PROXIES) {
        try {
          const proxyUrl = proxyFn(url);
          setStatus('loading', `Tentativo proxy: ${new URL(proxyUrl).hostname}...`);
          const response = await fetch(proxyUrl, {
            signal: AbortSignal.timeout(10000)
          });
          if (!response.ok) continue;

          const contentType = response.headers.get('content-type') || '';

          // allorigins returns JSON
          if (contentType.includes('application/json') || proxyUrl.includes('allorigins')) {
            try {
              const data = await response.json();
              if (data?.contents) return data.contents;
              if (data?.body) return data.body;
              // might be raw text that JSON parsed
              return typeof data === 'string' ? data : JSON.stringify(data);
            } catch {
              // Not JSON, try text
            }
          }

          return await response.text();
        } catch (err) {
          console.warn(`Proxy fallito: ${proxyFn(url)}`, err.message);
          continue;
        }
      }
      throw new Error('CORS_FAILED');
    }

    // === URL VALIDATION ===
    function isValidUrl(str) {
      try {
        const url = new URL(str);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch {
        return false;
      }
    }

    // === KEYWORD PARSER ===
    function parseKeywords(input) {
      const result = [];
      // Extract exact phrases in quotes
      const exact = [...input.matchAll(/"([^"]+)"/g)];
      exact.forEach(m => result.push(m[1]));
      // Rest: split by spaces/commas
      const rest = input.replace(/"[^"]+"/g, '').trim();
      if (rest) {
        rest.split(/[\s,]+/).filter(Boolean).forEach(w => result.push(w));
      }
      return result;
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // === KEYWORD CHIPS ===
    function addKeyword(kw) {
      const trimmed = kw.trim();
      if (!trimmed || currentKeywords.includes(trimmed)) return;
      currentKeywords.push(trimmed);
      renderKeywords();
    }

    function removeKeyword(kw) {
      currentKeywords = currentKeywords.filter(k => k !== kw);
      renderKeywords();
    }

    function renderKeywords() {
      $keywordsContainer.innerHTML = currentKeywords.map(kw => `
        <span class="keyword-chip" role="listitem">
          ${escapeHtml(kw)}
          <button aria-label="Rimuovi ${escapeHtml(kw)}" data-remove-kw="${escapeHtml(kw)}">×</button>
        </span>
      `).join('');
    }

    // === FETCH & PARSE ===
    async function analyzeWebsite(url, keywords) {
      const html = await fetchWithFallback(url);
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      // Store raw HTML for source search
      doc._rawHtml = html;

      // Fix relative URLs
      const base = new URL(url);
      doc.querySelectorAll('[href]').forEach(el => {
        try {
          const raw = el.getAttribute('href');
          if (raw && !raw.startsWith('javascript:') && !raw.startsWith('#') && !raw.startsWith('data:')) {
            el.setAttribute('href', new URL(raw, base).href);
          }
        } catch {}
      });
      doc.querySelectorAll('[src]').forEach(el => {
        try {
          const raw = el.getAttribute('src');
          if (raw && !raw.startsWith('data:')) {
            el.setAttribute('src', new URL(raw, base).href);
          }
        } catch {}
      });
      doc.querySelectorAll('[data-src]').forEach(el => {
        try {
          const raw = el.getAttribute('data-src');
          if (raw && !raw.startsWith('data:')) {
            el.setAttribute('data-src', new URL(raw, base).href);
          }
        } catch {}
      });

      return doc;
    }

    // === DEEP SCAN: Collect same-domain links ===
    function collectSameDomainLinks(doc, baseUrl) {
      const base = new URL(baseUrl);
      const links = new Set();
      doc.querySelectorAll('a[href]').forEach(el => {
        try {
          const href = el.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
          const resolved = new URL(href, base).href;
          const parsed = new URL(resolved);
          // Same origin only, no fragment, clean
          if (parsed.origin === base.origin) {
            parsed.hash = '';
            const clean = parsed.href;
            // Skip non-html resources
            if (/\.(jpg|jpeg|png|gif|svg|webp|pdf|zip|mp3|mp4|css|js|ico|woff|woff2|ttf|eot)(\?.*)?$/i.test(parsed.pathname)) return;
            if (clean !== base.href && clean !== base.href + '/') {
              links.add(clean);
            }
          }
        } catch {}
      });
      return [...links];
    }

    // === DEEP SCAN: Merge results ===
    function mergeResults(target, source) {
      for (const key of ['links', 'images', 'text', 'headings', 'meta', 'source']) {
        if (source[key]?.length) {
          target[key].push(...source[key]);
        }
      }
    }

    // === DEEP SCAN: Tag results with source URL ===
    function tagResults(results, sourceUrl) {
      for (const key of ['links', 'images', 'text', 'headings', 'meta', 'source']) {
        results[key]?.forEach(item => { item.sourceUrl = sourceUrl; });
      }
    }

    // === DEEP SCAN: Dedupe merged results ===
    function dedupeResults(results) {
      const seenLinks = new Set();
      results.links = results.links.filter(l => {
        const k = l.url + '|' + l.text;
        if (seenLinks.has(k)) return false;
        seenLinks.add(k);
        return true;
      });
      const seenImgs = new Set();
      results.images = results.images.filter(i => {
        if (seenImgs.has(i.src)) return false;
        seenImgs.add(i.src);
        return true;
      });
      const seenText = new Set();
      results.text = results.text.filter(t => {
        const k = t.text;
        if (seenText.has(k)) return false;
        seenText.add(k);
        return true;
      });
      const seenH = new Set();
      results.headings = results.headings.filter(h => {
        if (seenH.has(h.text)) return false;
        seenH.add(h.text);
        return true;
      });
      const seenM = new Set();
      results.meta = results.meta.filter(m => {
        const k = m.name + '|' + m.content;
        if (seenM.has(k)) return false;
        seenM.add(k);
        return true;
      });
      const seenSrc = new Set();
      results.source = (results.source || []).filter(s => {
        const k = s.raw;
        if (seenSrc.has(k)) return false;
        seenSrc.add(k);
        return true;
      });
    }

    // === SEARCH ENGINE ===
    function searchDocument(doc, keywords, options = {}) {
      const results = {
        links: [],
        images: [],
        text: [],
        meta: [],
        headings: [],
        source: []
      };

      const isMatch = (str) => {
        if (!str) return false;
        if (options.regexMode) {
          return keywords.every(kw => {
            try {
              return new RegExp(kw, options.caseSensitive ? '' : 'i').test(str);
            } catch {
              return str.toLowerCase().includes(kw.toLowerCase());
            }
          });
        }
        if (options.caseSensitive) {
          return keywords.every(kw => str.includes(kw));
        }
        return keywords.every(kw => str.toLowerCase().includes(kw.toLowerCase()));
      };

      // Dedupe sets
      const seenLinks = new Set();
      const seenImages = new Set();
      const seenTexts = new Set();

      // 1. LINKS — search href, text, title AND all attributes
      doc.querySelectorAll('a[href]').forEach(el => {
        const href = el.getAttribute('href') || '';
        const text = el.textContent.trim();
        const title = el.title || '';
        const allAttrs = getAllAttrText(el);

        if (isMatch(href) || isMatch(text) || isMatch(title) || isMatch(allAttrs)) {
          const key = href + '|' + text;
          if (seenLinks.has(key)) return;
          seenLinks.add(key);

          let matchType = 'text';
          if (isMatch(href)) matchType = 'url';
          else if (isMatch(title)) matchType = 'title';
          else if (isMatch(allAttrs)) matchType = 'attribute';

          results.links.push({
            url: href,
            text: text || href,
            title,
            context: getContext(el),
            matchType
          });
        }
      });

      // 2. IMAGES — search src, alt, title, data-src AND all attributes
      doc.querySelectorAll('img').forEach(el => {
        const src = el.getAttribute('src') || el.getAttribute('data-src') || '';
        const alt = el.alt || '';
        const title = el.title || '';
        const allAttrs = getAllAttrText(el);

        if (isMatch(src) || isMatch(alt) || isMatch(title) || isMatch(allAttrs)) {
          if (seenImages.has(src)) return;
          seenImages.add(src);

          let matchField = 'src';
          if (isMatch(alt)) matchField = 'alt';
          else if (isMatch(title)) matchField = 'title';
          else if (isMatch(allAttrs)) matchField = 'attribute';

          results.images.push({
            src,
            alt,
            title,
            matchField
          });
        }
      });

      // 3. TEXT — Walk ALL visible text nodes like Ctrl+F does
      //    Use TreeWalker to find every text node, group by nearest block parent
      const BLOCK_TAGS = new Set(['P','DIV','LI','TD','TH','BLOCKQUOTE','FIGCAPTION',
        'DD','DT','ARTICLE','SECTION','MAIN','ASIDE','HEADER','FOOTER','NAV',
        'DETAILS','SUMMARY','CAPTION','PRE','ADDRESS','FORM','FIELDSET',
        'TR','TBODY','THEAD','TFOOT','DIALOG','FIGURE','HR','UL','OL','DL',
        'TABLE','LABEL','LEGEND','OUTPUT','SPAN','A','BUTTON','STRONG','EM',
        'B','I','U','S','MARK','SMALL','SUB','SUP','CODE','KBD','SAMP','VAR',
        'ABBR','CITE','DFN','TIME','DATA','Q','RUBY','BDI','BDO','WBR']);
      const SKIP_TAGS = new Set(['SCRIPT','STYLE','NOSCRIPT','TEMPLATE','SVG','MATH']);

      // Gather text by block-level ancestor
      const blockTextMap = new Map();
      const walker = doc.createTreeWalker(doc.body || doc.documentElement, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.textContent.trim()) return NodeFilter.FILTER_REJECT;
          let el = node.parentElement;
          while (el) {
            if (SKIP_TAGS.has(el.tagName)) return NodeFilter.FILTER_REJECT;
            el = el.parentElement;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      while (walker.nextNode()) {
        const node = walker.currentNode;
        // Find nearest block-level parent
        let block = node.parentElement;
        while (block && !isBlockElement(block)) {
          block = block.parentElement;
        }
        if (!block) block = doc.body || doc.documentElement;

        if (!blockTextMap.has(block)) {
          blockTextMap.set(block, { el: block, parts: [] });
        }
        blockTextMap.get(block).parts.push(node.textContent);
      }

      for (const [block, { parts }] of blockTextMap) {
        const fullText = parts.join(' ').replace(/\s+/g, ' ').trim();
        if (fullText.length < 3) continue;
        if (!isMatch(fullText)) continue;

        const snippet = fullText.substring(0, 400);
        if (seenTexts.has(snippet)) continue;
        seenTexts.add(snippet);

        results.text.push({
          tag: block.tagName?.toLowerCase() || 'body',
          text: snippet,
          highlighted: highlightKeyword(snippet, keywords, options),
          context: block.closest?.('section, article, main')?.className || ''
        });
      }

      // 4. META TAGS — also search all attributes
      doc.querySelectorAll('meta').forEach(el => {
        const content = el.getAttribute('content') || '';
        const name = el.getAttribute('name') || el.getAttribute('property') || '';
        const allAttrs = getAllAttrText(el);

        if (isMatch(content) || isMatch(name) || isMatch(allAttrs)) {
          results.meta.push({ name, content });
        }
      });

      // 5. HEADINGS
      doc.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(el => {
        const text = el.textContent.trim();
        if (isMatch(text)) {
          results.headings.push({
            level: parseInt(el.tagName.substring(1)),
            text,
            highlighted: highlightKeyword(text, keywords, options)
          });
        }
      });

      // 6. RAW HTML SOURCE — search line by line in the original HTML
      if (doc._rawHtml) {
        const lines = doc._rawHtml.split('\n');
        const seenSource = new Set();
        lines.forEach((line, idx) => {
          if (isMatch(line)) {
            const trimmed = line.trim();
            if (!trimmed || seenSource.has(trimmed)) return;
            seenSource.add(trimmed);
            results.source.push({
              lineNum: idx + 1,
              raw: trimmed.substring(0, 500),
              highlighted: highlightKeyword(trimmed.substring(0, 500), keywords, options)
            });
          }
        });
      }

      // 7. ALL ELEMENTS — search every attribute value (class, id, data-*, aria-*, etc.)
      //    This catches matches Ctrl+F finds in rendered attributes
      doc.querySelectorAll('*').forEach(el => {
        if (SKIP_TAGS.has(el.tagName)) return;
        for (const attr of el.attributes) {
          if (isMatch(attr.value)) {
            const snippet = `<${el.tagName.toLowerCase()} ${attr.name}="${attr.value.substring(0, 200)}">`;
            if (seenTexts.has(snippet)) continue;
            seenTexts.add(snippet);
            results.source.push({
              lineNum: 0,
              raw: snippet,
              highlighted: highlightKeyword(snippet, keywords, options),
              matchType: 'attribute'
            });
          }
        }
      });

      return results;
    }

    // Helper: get all attribute values of an element as one string
    function getAllAttrText(el) {
      return Array.from(el.attributes).map(a => a.value).join(' ');
    }

    // Helper: check if element is block-level
    function isBlockElement(el) {
      const BLOCKS = new Set(['P','DIV','LI','TD','TH','BLOCKQUOTE','FIGCAPTION',
        'DD','DT','ARTICLE','SECTION','MAIN','ASIDE','HEADER','FOOTER','NAV',
        'DETAILS','SUMMARY','CAPTION','PRE','ADDRESS','FORM','FIELDSET',
        'TR','TABLE','LABEL','LEGEND','UL','OL','DL','DIALOG','FIGURE','BODY','HTML']);
      return BLOCKS.has(el.tagName);
    }

    // === CONTEXT EXTRACTOR ===
    function getContext(element) {
      const parent = element.closest('p, div, li, td, section, article') || element.parentElement;
      if (!parent) return '';
      return parent.textContent.trim().replace(/\s+/g, ' ').substring(0, 200);
    }

    // === HIGHLIGHT ENGINE ===
    function highlightKeyword(text, keywords, options = {}) {
      let highlighted = escapeHtml(text);
      keywords.forEach(kw => {
        try {
          const pattern = options.regexMode ? kw : escapeRegex(kw);
          const flags = options.caseSensitive ? 'g' : 'gi';
          const regex = new RegExp(`(${pattern})`, flags);
          highlighted = highlighted.replace(regex, '<mark>$1</mark>');
        } catch {}
      });
      return highlighted;
    }

    // === HTML ESCAPE ===
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // === STATUS ===
    function setStatus(type, text) {
      $statusDot.className = 'dot ' + (type || '');
      $statusText.textContent = text;
    }

    // === TOAST ===
    function showToast(message, type = '') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3200);
    }

    // === LOADING ===
    function setLoading(loading) {
      isLoading = loading;
      $fetchBtn.disabled = loading;
      $fetchBtnText.textContent = loading ? 'Searching...' : 'Search';
      $progressBar.classList.toggle('active', loading);
    }

    // === RENDER RESULTS ===
    function renderResults(filter) {
      if (!currentResults) return;

      $emptyState.classList.add('hidden');
      $tabBar.style.display = '';

      // Update counts
      document.getElementById('countLinks').textContent = currentResults.links.length;
      document.getElementById('countImages').textContent = currentResults.images.length;
      document.getElementById('countText').textContent = currentResults.text.length;
      document.getElementById('countHeadings').textContent = currentResults.headings.length;
      document.getElementById('countMeta').textContent = currentResults.meta.length;
      document.getElementById('countSource').textContent = (currentResults.source || []).length;

      let items = [];

      if (filter === 'all' || !filter) {
        // Show current tab
        items = getTabItems(currentTab);
      } else {
        items = getFilterItems(filter);
        currentTab = filter;
        updateTabActive(filter);
      }

      renderedCount = 0;
      $results.innerHTML = '';

      if (items.length === 0) {
        $results.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>Nessun risultato trovato in questa categoria.</p>
          </div>
        `;
        return;
      }

      renderBatch(items);
    }

    function getTabItems(tab) {
      if (!currentResults) return [];
      return currentResults[tab] || [];
    }

    function getFilterItems(filter) {
      return getTabItems(filter);
    }

    function renderBatch(items) {
      const end = Math.min(renderedCount + PAGE_SIZE, items.length);
      const html = [];

      for (let i = renderedCount; i < end; i++) {
        html.push(renderItem(items[i], currentTab, i));
      }

      // Remove old load-more
      const oldBtn = $results.querySelector('.load-more-btn');
      if (oldBtn) oldBtn.remove();

      const fragment = document.createDocumentFragment();
      const wrapper = document.createElement('div');
      wrapper.innerHTML = html.join('');
      while (wrapper.firstChild) fragment.appendChild(wrapper.firstChild);

      $results.appendChild(fragment);
      renderedCount = end;

      if (renderedCount < items.length) {
        const btn = document.createElement('button');
        btn.className = 'load-more-btn';
        btn.textContent = `Mostra altri (${items.length - renderedCount} rimanenti)`;
        btn.addEventListener('click', () => renderBatch(items));
        $results.appendChild(btn);
      }
    }

    function renderItem(item, type, idx) {
      switch (type) {
        case 'links': return renderLinkCard(item, idx);
        case 'images': return renderImageCard(item, idx);
        case 'text': return renderTextCard(item, idx);
        case 'headings': return renderHeadingCard(item, idx);
        case 'meta': return renderMetaCard(item, idx);
        case 'source': return renderSourceCard(item, idx);
        default: return '';
      }
    }

    function renderSourceBadge(item) {
      if (!item.sourceUrl || item.sourceUrl === currentUrl) return '';
      try {
        const path = new URL(item.sourceUrl).pathname;
        return `<span class="source-badge" title="${escapeHtml(item.sourceUrl)}">${escapeHtml(path)}</span>`;
      } catch {
        return `<span class="source-badge">${escapeHtml(item.sourceUrl)}</span>`;
      }
    }

    function renderLinkCard(item, idx) {
      return `
        <div class="result-card" data-idx="${idx}">
          <div class="card-header">
            <div class="card-type-icon">🔗</div>
            <div style="flex:1;min-width:0">
              <div class="card-title">
                <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.text)}</a>
              </div>
              <div class="card-meta">${escapeHtml(item.url)}</div>
            </div>
          </div>
          ${item.context ? `<div class="card-context">${highlightKeyword(item.context.substring(0, 200), currentKeywords, getOptions())}</div>` : ''}
          <div class="card-meta">Match: <strong>${item.matchType}</strong>${item.title ? ' | Title: ' + escapeHtml(item.title) : ''} ${renderSourceBadge(item)}</div>
          <div class="card-actions">
            <button class="btn btn-secondary btn-sm" onclick="window.open('${escapeHtml(item.url)}','_blank')">🔗 Open</button>
            <button class="btn btn-secondary btn-sm" onclick="copyToClipboard('${escapeHtml(item.url)}')">📋 Copy</button>
          </div>
        </div>
      `;
    }

    function renderImageCard(item, idx) {
      return `
        <div class="image-card" data-idx="${idx}" onclick="showImageModal(${idx})" role="button" tabindex="0" aria-label="Anteprima immagine: ${escapeHtml(item.alt || 'nessun alt')}">
          <div class="img-wrapper">
            <img src="${escapeHtml(item.src)}" alt="${escapeHtml(item.alt)}" loading="lazy"
                 onerror="this.style.display='none';this.parentElement.innerHTML='<div class=img-placeholder>🖼️</div>'">
          </div>
          <div class="img-info">
            <div class="img-alt">${escapeHtml(item.alt || 'No alt text')}</div>
            <div class="img-src">${escapeHtml(item.src)}</div>
            <div class="card-meta" style="margin-top:4px">Match: <strong>${item.matchField}</strong> ${renderSourceBadge(item)}</div>
          </div>
        </div>
      `;
    }

    function renderTextCard(item, idx) {
      return `
        <div class="result-card" data-idx="${idx}">
          <div class="card-header">
            <div class="card-type-icon">📝</div>
            <div style="flex:1;min-width:0">
              <div class="card-meta">&lt;${item.tag}&gt;${item.context ? ' — ' + escapeHtml(item.context) : ''} ${renderSourceBadge(item)}</div>
            </div>
          </div>
          <div class="card-context">${item.highlighted}</div>
        </div>
      `;
    }

    function renderHeadingCard(item, idx) {
      const sizes = { 1: '1.4rem', 2: '1.2rem', 3: '1.05rem', 4: '0.95rem', 5: '0.88rem', 6: '0.82rem' };
      return `
        <div class="result-card" data-idx="${idx}">
          <div class="card-header">
            <div class="card-type-icon">📑</div>
            <div style="flex:1;min-width:0">
              <div class="card-title" style="font-size:${sizes[item.level] || '1rem'}">
                <span style="color:var(--text-muted);font-weight:400">H${item.level}</span>
                ${item.highlighted}
              </div>
              ${renderSourceBadge(item)}
            </div>
          </div>
        </div>
      `;
    }

    function renderMetaCard(item, idx) {
      return `
        <div class="result-card" data-idx="${idx}">
          <div class="card-header">
            <div class="card-type-icon">🏷️</div>
            <div style="flex:1;min-width:0">
              <div class="card-title">${escapeHtml(item.name || '(unnamed)')} ${renderSourceBadge(item)}</div>
              <div class="card-context">${highlightKeyword(item.content, currentKeywords, getOptions())}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSourceCard(item, idx) {
      const lineLabel = item.lineNum > 0 ? `Line ${item.lineNum}` : (item.matchType === 'attribute' ? 'Attribute' : 'Source');
      return `
        <div class="result-card" data-idx="${idx}">
          <div class="card-header">
            <div class="card-type-icon">🧾</div>
            <div style="flex:1;min-width:0">
              <div class="card-meta">${escapeHtml(lineLabel)} ${renderSourceBadge(item)}</div>
            </div>
          </div>
          <div class="card-context"><code style="font-size:0.82rem;word-break:break-all;line-height:1.7">${item.highlighted}</code></div>
          <div class="card-actions">
            <button class="btn btn-secondary btn-sm" onclick="copyToClipboard(${JSON.stringify(item.raw).replace(/'/g, '\\&#39;')})">📋 Copy</button>
          </div>
        </div>
      `;
    }

    function renderImagesGrid() {
      if (currentTab !== 'images') return;
      const items = getTabItems('images');
      renderedCount = 0;
      $results.innerHTML = '';

      if (items.length === 0) {
        $results.innerHTML = `<div class="empty-state"><div class="empty-icon">🖼️</div><p>Nessuna immagine trovata.</p></div>`;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'image-grid';

      const end = Math.min(PAGE_SIZE, items.length);
      for (let i = 0; i < end; i++) {
        grid.innerHTML += renderImageCard(items[i], i);
      }
      $results.appendChild(grid);
      renderedCount = end;

      if (renderedCount < items.length) {
        const btn = document.createElement('button');
        btn.className = 'load-more-btn';
        btn.textContent = `Mostra altre (${items.length - renderedCount} rimanenti)`;
        btn.addEventListener('click', () => {
          const nEnd = Math.min(renderedCount + PAGE_SIZE, items.length);
          for (let i = renderedCount; i < nEnd; i++) {
            grid.innerHTML += renderImageCard(items[i], i);
          }
          renderedCount = nEnd;
          if (renderedCount >= items.length) btn.remove();
          else btn.textContent = `Mostra altre (${items.length - renderedCount} rimanenti)`;
        });
        $results.appendChild(btn);
      }
    }

    // === TAB SWITCHING ===
    function updateTabActive(tab) {
      document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
        const isActive = btn.dataset.tab === tab;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive);
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      updateTabActive(tab);
      renderedCount = 0;
      $results.innerHTML = '';

      if (tab === 'images') {
        renderImagesGrid();
      } else {
        const items = getTabItems(tab);
        if (items.length === 0) {
          $results.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>Nessun risultato in questa categoria.</p></div>`;
          return;
        }
        renderBatch(items);
      }
    }

    // === IMAGE MODAL ===
    function showImageModal(idx) {
      const imgData = currentResults.images[idx];
      if (!imgData) return;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-label', 'Anteprima immagine');
      overlay.innerHTML = `
        <div class="modal-content">
          <button class="modal-close" aria-label="Chiudi">✕</button>
          <img class="modal-img" src="${escapeHtml(imgData.src)}" alt="${escapeHtml(imgData.alt)}"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22><rect fill=%22%231e293b%22 width=%22400%22 height=%22300%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%2394a3b8%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2220%22>Image not available</text></svg>'">
          <div class="modal-info">
            <p><strong>Alt:</strong> <span>${escapeHtml(imgData.alt || 'N/A')}</span></p>
            ${imgData.title ? `<p><strong>Title:</strong> <span>${escapeHtml(imgData.title)}</span></p>` : ''}
            <p><strong>URL:</strong> <code>${escapeHtml(imgData.src)}</code></p>
            <p><strong>Match:</strong> <span>${imgData.matchField}</span></p>
          </div>
          <div class="modal-actions">
            <button class="btn btn-primary btn-sm" id="modalCopyBtn">📋 Copy URL</button>
            <a class="btn btn-secondary btn-sm" href="${escapeHtml(imgData.src)}" download target="_blank" rel="noopener">⬇️ Download</a>
            <a class="btn btn-secondary btn-sm" href="${escapeHtml(imgData.src)}" target="_blank" rel="noopener">🔗 Open Original</a>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      // Close handlers
      overlay.querySelector('.modal-close').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      overlay.querySelector('#modalCopyBtn').addEventListener('click', () => {
        copyToClipboard(imgData.src);
      });

      // Trap focus
      const firstFocusable = overlay.querySelector('.modal-close');
      firstFocusable.focus();

      // Escape key
      const escHandler = (e) => {
        if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escHandler); }
      };
      document.addEventListener('keydown', escHandler);
    }

    // === COPY TO CLIPBOARD ===
    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('Copiato negli appunti!', 'success');
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('Copiato negli appunti!', 'success');
      }
    }

    // === EXPORT ENGINE ===
    function exportResults(format) {
      if (!currentResults) return;

      if (format === 'json') {
        const data = {
          url: currentUrl,
          keywords: currentKeywords,
          timestamp: new Date().toISOString(),
          results: currentResults
        };
        downloadBlob(
          new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }),
          'web-research-results.json'
        );
        showToast('Esportato come JSON', 'success');
      }

      if (format === 'csv') {
        const rows = [
          ['Type', 'URL/Content', 'Alt/Text', 'Match Field'].join(',')
        ];
        currentResults.links.forEach(l => {
          rows.push(['"link"', `"${csvEscape(l.url)}"`, `"${csvEscape(l.text)}"`, `"${l.matchType}"`].join(','));
        });
        currentResults.images.forEach(i => {
          rows.push(['"image"', `"${csvEscape(i.src)}"`, `"${csvEscape(i.alt)}"`, `"${i.matchField}"`].join(','));
        });
        currentResults.text.forEach(t => {
          rows.push(['"text"', `"${csvEscape(t.text)}"`, `"<${t.tag}>"`, '""'].join(','));
        });
        currentResults.headings.forEach(h => {
          rows.push(['"heading"', `"${csvEscape(h.text)}"`, `"H${h.level}"`, '""'].join(','));
        });
        currentResults.meta.forEach(m => {
          rows.push(['"meta"', `"${csvEscape(m.content)}"`, `"${csvEscape(m.name)}"`, '""'].join(','));
        });
        (currentResults.source || []).forEach(s => {
          rows.push(['"source"', `"${csvEscape(s.raw)}"`, `"Line ${s.lineNum}"`, `"${s.matchType || 'source'}"`].join(','));
        });

        downloadBlob(
          new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8' }),
          'web-research-results.csv'
        );
        showToast('Esportato come CSV', 'success');
      }

      if (format === 'markdown') {
        let md = `# Web Research Results\n\n`;
        md += `**URL:** ${currentUrl}\n`;
        md += `**Keywords:** ${currentKeywords.join(', ')}\n`;
        md += `**Date:** ${new Date().toLocaleString()}\n\n`;

        if (currentResults.links.length) {
          md += `## Links (${currentResults.links.length})\n\n`;
          currentResults.links.forEach(l => {
            md += `- [${l.text}](${l.url}) — match: ${l.matchType}\n`;
          });
          md += '\n';
        }

        if (currentResults.images.length) {
          md += `## Images (${currentResults.images.length})\n\n`;
          currentResults.images.forEach(i => {
            md += `- ![${i.alt || 'image'}](${i.src}) — match: ${i.matchField}\n`;
          });
          md += '\n';
        }

        if (currentResults.headings.length) {
          md += `## Headings (${currentResults.headings.length})\n\n`;
          currentResults.headings.forEach(h => {
            md += `- **H${h.level}:** ${h.text}\n`;
          });
          md += '\n';
        }

        if (currentResults.text.length) {
          md += `## Text Matches (${currentResults.text.length})\n\n`;
          currentResults.text.forEach(t => {
            md += `- \`<${t.tag}>\` ${t.text.substring(0, 150)}…\n`;
          });
          md += '\n';
        }

        if (currentResults.meta.length) {
          md += `## Meta Tags (${currentResults.meta.length})\n\n`;
          currentResults.meta.forEach(m => {
            md += `- **${m.name}:** ${m.content}\n`;
          });
          md += '\n';
        }

        if (currentResults.source?.length) {
          md += `## Source Matches (${currentResults.source.length})\n\n`;
          currentResults.source.forEach(s => {
            md += `- Line ${s.lineNum}: \`${s.raw.substring(0, 120)}\`\n`;
          });
        }

        downloadBlob(
          new Blob([md], { type: 'text/markdown;charset=utf-8' }),
          'web-research-results.md'
        );
        showToast('Esportato come Markdown', 'success');
      }
    }

    function csvEscape(str) {
      return (str || '').replace(/"/g, '""');
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // === HISTORY MANAGER ===
    function saveToHistory(url, keywords, resultsCount) {
      const history = getHistory();
      history.unshift({
        url,
        keywords: [...keywords],
        resultsCount,
        timestamp: new Date().toISOString()
      });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 10)));
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      } catch { return []; }
    }

    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      showToast('Cronologia cancellata', 'success');
    }

    function showHistoryPanel() {
      // Remove existing
      document.querySelectorAll('.history-overlay, .history-panel').forEach(el => el.remove());

      const overlay = document.createElement('div');
      overlay.className = 'history-overlay';

      const panel = document.createElement('aside');
      panel.className = 'history-panel';
      panel.setAttribute('role', 'complementary');
      panel.setAttribute('aria-label', 'Cronologia ricerche');

      const history = getHistory();

      panel.innerHTML = `
        <h3>📜 Search History
          <button class="btn btn-secondary btn-sm" style="margin-left:auto" onclick="clearHistory();document.querySelectorAll('.history-overlay,.history-panel').forEach(el=>el.remove());showHistoryPanel();">🗑️ Clear</button>
        </h3>
        ${history.length === 0 ? '<div class="history-empty">Nessuna ricerca recente</div>' :
          history.map((h, i) => `
            <div class="history-item" data-hist-idx="${i}" role="button" tabindex="0">
              <div class="hist-url">${escapeHtml(h.url)}</div>
              <div class="hist-keywords">🔑 ${h.keywords.map(k => escapeHtml(k)).join(', ')}</div>
              <div class="hist-time">${new Date(h.timestamp).toLocaleString()} — ${h.resultsCount} risultati</div>
            </div>
          `).join('')
        }
      `;

      document.body.appendChild(overlay);
      document.body.appendChild(panel);

      // Close
      overlay.addEventListener('click', () => {
        overlay.remove();
        panel.remove();
      });

      // Load from history
      panel.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.histIdx);
          const h = history[idx];
          if (!h) return;
          $urlInput.value = h.url;
          currentKeywords = [...h.keywords];
          renderKeywords();
          overlay.remove();
          panel.remove();
          startSearch();
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            el.click();
          }
        });
      });

      // Escape
      const escHandler = (e) => {
        if (e.key === 'Escape') {
          overlay.remove();
          panel.remove();
          document.removeEventListener('keydown', escHandler);
        }
      };
      document.addEventListener('keydown', escHandler);
    }

    // === THEME TOGGLE ===
    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) {
        document.documentElement.dataset.theme = saved;
      }
      updateThemeButton();
    }

    function toggleTheme() {
      const current = document.documentElement.dataset.theme;
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem(THEME_KEY, next);
      updateThemeButton();
    }

    function updateThemeButton() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      document.getElementById('themeToggleBtn').textContent = isDark ? '🌙' : '☀️';
    }

    // === GET OPTIONS ===
    function getOptions() {
      return {
        caseSensitive: document.getElementById('caseSensitiveOpt').checked,
        regexMode: document.getElementById('regexOpt').checked
      };
    }

    // === ERROR DISPLAY ===
    const ERROR_MESSAGES = {
      CORS_FAILED: `⚠️ Tutti i proxy CORS hanno fallito per questo sito.\n\nPossibili soluzioni:\n1. Installa l'estensione "CORS Unblock" su Chrome\n2. Prova con un altro URL dello stesso sito\n3. Alcuni siti bloccano attivamente il fetching esterno`,
      INVALID_URL: '❌ URL non valido. Assicurati di includere https://',
      TIMEOUT: '⏱️ Timeout — il sito ha impiegato troppo tempo a rispondere',
      PARSE_ERROR: '❌ Impossibile analizzare la risposta del sito',
      NO_RESULTS: '🔍 Nessun risultato trovato per queste keyword',
      NO_KEYWORDS: '❌ Inserisci almeno una keyword prima di cercare'
    };

    function showError(type, details = '') {
      $emptyState.classList.add('hidden');
      $tabBar.style.display = 'none';
      $results.innerHTML = `
        <div class="error-card">
          <pre>${ERROR_MESSAGES[type] || escapeHtml(type)}</pre>
          ${details ? `<code class="error-details">${escapeHtml(details)}</code>` : ''}
          <div class="error-actions">
            <button class="btn btn-primary btn-sm" onclick="startSearch()">🔄 Riprova</button>
          </div>
        </div>
      `;
    }

    // === DEEP SCAN UI HELPERS ===
    const $deepProgress = document.getElementById('deepScanProgress');
    const $deepText = document.getElementById('deepScanText');
    const $deepBar = document.getElementById('deepScanBar');
    const $deepPages = document.getElementById('deepScanPages');
    const $stopBtn = document.getElementById('stopScanBtn');

    function showDeepProgress() { $deepProgress.classList.remove('hidden'); }
    function hideDeepProgress() { $deepProgress.classList.add('hidden'); }

    function updateDeepProgress(scanned, total, currentPageUrl, status) {
      const pct = total > 0 ? Math.round((scanned / total) * 100) : 0;
      $deepBar.style.width = pct + '%';
      $deepText.textContent = `Scanning sublinks: ${scanned}/${total} pages (${pct}%)`;
    }

    function addPageChip(url, status) {
      // Update existing or add new
      let chip = $deepPages.querySelector(`[data-page-url="${CSS.escape(url)}"]`);
      if (!chip) {
        chip = document.createElement('span');
        chip.className = 'page-chip';
        chip.dataset.pageUrl = url;
        try { chip.textContent = new URL(url).pathname || url; } catch { chip.textContent = url; }
        chip.title = url;
        $deepPages.appendChild(chip);
      }
      chip.className = 'page-chip ' + status;
    }

    function clearDeepUI() {
      $deepBar.style.width = '0%';
      $deepPages.innerHTML = '';
      $deepText.textContent = 'Scanning sublinks...';
    }

    // === MAIN SEARCH ===
    async function startSearch() {
      // Cancel any ongoing deep scan
      if (deepScanAbort) {
        deepScanAbort.abort();
        deepScanAbort = null;
      }

      const url = $urlInput.value.trim();

      // Auto-add keyword from input if chips are empty
      const kwInput = $keywordInput.value.trim();
      if (kwInput) {
        parseKeywords(kwInput).forEach(k => addKeyword(k));
        $keywordInput.value = '';
      }

      if (!url) {
        showToast('Inserisci un URL', 'warning');
        $urlInput.focus();
        return;
      }

      // Auto-prepend https://
      let normalizedUrl = url;
      if (!/^https?:\/\//i.test(normalizedUrl)) {
        normalizedUrl = 'https://' + normalizedUrl;
        $urlInput.value = normalizedUrl;
      }

      if (!isValidUrl(normalizedUrl)) {
        showError('INVALID_URL');
        setStatus('error', 'URL non valido');
        return;
      }

      if (currentKeywords.length === 0) {
        showError('NO_KEYWORDS');
        setStatus('error', 'Nessuna keyword');
        return;
      }

      currentUrl = normalizedUrl;
      setLoading(true);
      hideDeepProgress();
      clearDeepUI();
      setStatus('loading', `Fetching ${normalizedUrl}...`);
      $results.innerHTML = `
        <div class="skeleton-row">
          <div class="skeleton" style="height:80px"></div>
          <div class="skeleton" style="height:80px"></div>
          <div class="skeleton" style="height:80px"></div>
        </div>
      `;
      $emptyState.classList.add('hidden');
      $tabBar.style.display = 'none';

      const startTime = performance.now();
      const options = getOptions();
      const deepScan = document.getElementById('deepScanOpt').checked;
      const maxPages = Math.max(1, Math.min(200, parseInt(document.getElementById('maxPagesOpt').value) || 10));

      try {
        // === PHASE 1: Main page ===
        const doc = await analyzeWebsite(normalizedUrl, currentKeywords);
        setStatus('loading', 'Analizzando contenuti della pagina principale...');

        currentResults = searchDocument(doc, currentKeywords, options);
        tagResults(currentResults, normalizedUrl);

        // === PHASE 2: Deep scan sublinks ===
        if (deepScan) {
          const sublinks = collectSameDomainLinks(doc, normalizedUrl);
          const toScan = sublinks.slice(0, maxPages);

          if (toScan.length > 0) {
            showDeepProgress();
            deepScanAbort = new AbortController();
            const signal = deepScanAbort.signal;

            let scanned = 0;
            const CONCURRENCY = 3;

            // Show initial results while deep scanning
            const mainTotal = countResults(currentResults);
            if (mainTotal > 0) {
              showIntermediateResults(startTime);
            }

            // Process in concurrent batches
            const queue = [...toScan];
            const activePromises = new Set();

            const processPage = async (pageUrl) => {
              if (signal.aborted) return;
              addPageChip(pageUrl, 'scanning');
              try {
                const subDoc = await analyzeWebsite(pageUrl, currentKeywords);
                if (signal.aborted) return;
                const subResults = searchDocument(subDoc, currentKeywords, options);
                tagResults(subResults, pageUrl);
                mergeResults(currentResults, subResults);
                addPageChip(pageUrl, 'done');
              } catch (err) {
                console.warn(`Deep scan failed for ${pageUrl}:`, err.message);
                addPageChip(pageUrl, 'fail');
              }
              scanned++;
              updateDeepProgress(scanned, toScan.length, pageUrl);

              // Live-update results every 3 pages
              if (scanned % 3 === 0 || scanned === toScan.length) {
                dedupeResults(currentResults);
                showIntermediateResults(startTime);
              }
            };

            // Concurrent execution with limited parallelism
            let i = 0;
            while (i < queue.length && !signal.aborted) {
              const batch = queue.slice(i, i + CONCURRENCY);
              await Promise.allSettled(batch.map(url => processPage(url)));
              i += CONCURRENCY;
            }

            dedupeResults(currentResults);
            deepScanAbort = null;

            if (signal.aborted) {
              showToast('Deep scan fermato dall\'utente', 'warning');
            }
          }
        }

        // === PHASE 3: Final render ===
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
        const total = countResults(currentResults);

        if (total === 0) {
          setLoading(false);
          hideDeepProgress();
          setStatus('', 'Nessun risultato');
          showError('NO_RESULTS');
          saveToHistory(normalizedUrl, currentKeywords, 0);
          return;
        }

        setStatus('success', `Trovati ${total} risultati in ${elapsed}s` + (deepScan ? ` (deep scan)` : ''));
        saveToHistory(normalizedUrl, currentKeywords, total);

        pickDefaultTab();
        renderResults(null);
        switchTab(currentTab);

      } catch (err) {
        console.error(err);
        const errType = err.message === 'CORS_FAILED' ? 'CORS_FAILED' :
                        err.name === 'TimeoutError' ? 'TIMEOUT' : 'PARSE_ERROR';
        setStatus('error', ERROR_MESSAGES[errType]?.split('\n')[0] || err.message);
        showError(errType, err.message !== errType ? err.message : '');
      } finally {
        setLoading(false);
        // Keep deep progress visible briefly then hide
        setTimeout(hideDeepProgress, 2000);
      }
    }

    function countResults(r) {
      return (r.links?.length || 0) + (r.images?.length || 0) +
             (r.text?.length || 0) + (r.headings?.length || 0) +
             (r.meta?.length || 0) + (r.source?.length || 0);
    }

    function pickDefaultTab() {
      if (currentResults.links.length) currentTab = 'links';
      else if (currentResults.images.length) currentTab = 'images';
      else if (currentResults.text.length) currentTab = 'text';
      else if (currentResults.headings.length) currentTab = 'headings';
      else if (currentResults.source?.length) currentTab = 'source';
      else currentTab = 'meta';
    }

    function showIntermediateResults(startTime) {
      const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
      const total = countResults(currentResults);
      setStatus('loading', `Trovati ${total} risultati fin qui (${elapsed}s) — scansione in corso...`);
      pickDefaultTab();
      renderResults(null);
      switchTab(currentTab);
    }

    // === DEBOUNCE ===
    function debounce(fn, ms) {
      let id;
      return (...args) => { clearTimeout(id); id = setTimeout(() => fn(...args), ms); };
    }

    // === EVENT LISTENERS ===
    // Fetch
    $fetchBtn.addEventListener('click', startSearch);
    $urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') startSearch(); });

    // Stop deep scan
    document.getElementById('stopScanBtn').addEventListener('click', () => {
      if (deepScanAbort) {
        deepScanAbort.abort();
        deepScanAbort = null;
      }
    });

    // Add keyword
    document.getElementById('addKeywordBtn').addEventListener('click', () => {
      const val = $keywordInput.value.trim();
      if (val) {
        parseKeywords(val).forEach(k => addKeyword(k));
        $keywordInput.value = '';
        $keywordInput.focus();
      }
    });

    $keywordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = $keywordInput.value.trim();
        if (val) {
          parseKeywords(val).forEach(k => addKeyword(k));
          $keywordInput.value = '';
        }
      }
    });

    // Remove keyword chip
    $keywordsContainer.addEventListener('click', e => {
      const btn = e.target.closest('[data-remove-kw]');
      if (btn) removeKeyword(btn.dataset.removeKw);
    });

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        if (currentResults) {
          if (currentFilter === 'all') {
            switchTab(currentTab);
          } else {
            switchTab(currentFilter);
          }
        }
      });
    });

    // Tab bar
    $tabBar.addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn[data-tab]');
      if (btn && currentResults) {
        switchTab(btn.dataset.tab);
        // Also update filter buttons
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        const filterBtn = document.querySelector(`.filter-btn[data-filter="${btn.dataset.tab}"]`);
        if (filterBtn) filterBtn.classList.add('active');
        else document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
      }
    });

    // Export
    $exportBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      $exportMenu.classList.toggle('open');
      $exportBtn.setAttribute('aria-expanded', $exportMenu.classList.contains('open'));
    });

    $exportMenu.addEventListener('click', e => {
      const btn = e.target.closest('[data-format]');
      if (btn) {
        exportResults(btn.dataset.format);
        $exportMenu.classList.remove('open');
        $exportBtn.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.export-dropdown')) {
        $exportMenu.classList.remove('open');
        $exportBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Theme
    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

    // History
    document.getElementById('historyToggleBtn').addEventListener('click', showHistoryPanel);

    // Image card keyboard
    $results.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('image-card')) {
        e.preventDefault();
        e.target.click();
      }
    });

    // === INIT ===
    initTheme();
    $urlInput.focus();
  </script>
</body>
</html>
