<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1020">
    <meta name="description" content="FantaPanchina — Il fantacalcio che gioca da solo. Idle game dove la tua squadra segna anche mentre dormi.">
    <title>FantaPanchina — Il fantacalcio idle</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-title">🛋️⚽ FANTAPANCHINA</div>
        <div class="topbar-currencies">
            <span class="currency" id="fc-display">0 FC</span>
            <span class="currency sep">·</span>
            <span class="currency fp" id="fp-display">0 FP</span>
            <span class="currency sep">·</span>
            <span class="currency ips" id="ips-display">0/s</span>
        </div>
        <div class="timer-bar">
            <div class="timer-fill" id="timer-fill"></div>
            <span class="timer-text" id="timer-text">Giornata tra 3:00</span>
        </div>
    </header>

    <section class="tap-area" id="tap-mister">
        <div class="tap-inner">
            <div class="mister-emoji">🗣️</div>
            <div class="tap-label">TAP IL MISTER!</div>
            <div class="tap-combo" id="combo-counter"></div>
        </div>
        <div class="tap-popup" id="tap-popup"></div>
    </section>

    <nav class="tab-bar">
        <button class="tab-btn on" data-tab="squadra">⚽ Squadra</button>
        <button class="tab-btn" data-tab="mercato">🏷️ Mercato</button>
        <button class="tab-btn" data-tab="strutture">🏗️ Strutture</button>
        <button class="tab-btn" data-tab="classifica">🏆 Classifica</button>
    </nav>

    <main class="panel" id="panel-content"></main>

    <section class="feed-section">
        <div class="feed-header" id="feed-toggle">
            <span class="feed-title">📰 Live Feed</span>
            <span class="feed-arrow">▼</span>
        </div>
        <div class="feed-body" id="feed-list"></div>
    </section>

    <footer class="bottom-bar">
        <button class="btn-reset" id="reset-btn">🔄 Reset</button>
    </footer>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(function () {});
        }
    </script>
</body>
</html>
