<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="L'ufficio è una giungla. Tu quale predatore (o vittima) sei?">
    <title>Che collega d'ufficio sei? — Quiz condivisibile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--accent:#a78bfa}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
        .container{width:100%;max-width:600px;padding:28px}
        .header{text-align:center;margin-bottom:24px}
        .back-btn{display:inline-block;margin-bottom:15px;color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem}
        h1{font-size:1.7rem;margin:0 0 8px 0;line-height:1.25}
        .sub{color:#9fb8d8;font-size:.95rem;margin:0;line-height:1.5}
        .progress-bar{width:100%;height:12px;background:rgba(255,255,255,.07);border-radius:99px;margin-bottom:20px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#7c5cff);width:0%;border-radius:99px;transition:width .35s ease}
        .question-number{display:inline-block;margin-bottom:15px;color:#cdeeff;font-size:.85rem;font-weight:700;letter-spacing:.06em;padding:6px 14px;border-radius:99px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.35)}
        .question{font-size:1.25rem;font-weight:700;margin-bottom:24px;text-align:center;line-height:1.4}
        .answers{display:flex;flex-direction:column;gap:12px}
        .answer-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:white;padding:16px;border-radius:14px;cursor:pointer;transition:all .18s ease;font-size:1rem;text-align:left;font-family:inherit;backdrop-filter:blur(6px)}
        .answer-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
        .answer-btn:active{transform:scale(.98)}
        .answer-btn.sel{background:color-mix(in srgb, var(--accent) 18%, transparent);border-color:var(--accent)}
        .hidden{display:none !important}
        .result-view{text-align:center}
        .result-emoji{font-size:4.5rem;display:block;margin-bottom:12px;animation:bounce 1.4s ease-in-out infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .result-title{font-size:1.9rem;font-weight:800;margin:0 0 10px;color:#fff}
        .result-desc{font-size:1.05rem;color:#9fb8d8;line-height:1.6;margin:0 0 24px}
        .btn-restart{background:linear-gradient(92deg,var(--accent),#7c5cff);color:#04122b;border:none;padding:15px 30px;border-radius:99px;font-weight:800;font-size:1.05rem;cursor:pointer;font-family:inherit;box-shadow:0 10px 26px rgba(0,0,0,.35)}
        .btn-restart:active{transform:scale(.97)}
    </style>
    <link rel="stylesheet" href="../../assets/css/quiz-theme.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../quiz.html" class="back-btn">← Torna ai quiz</a>
            <h1>💼 Che collega d'ufficio sei?</h1>
            <p class="sub">L'ufficio è una giungla. Tu quale predatore (o vittima) sei?</p>
        </div>

        <div id="quizArea">
            <div class="question-number" id="qNum">Domanda 1 di 6</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <div class="question" id="qText"></div>
            <div class="answers" id="answers"></div>
        </div>

        <div id="resultArea" class="result-view hidden">
            <span class="result-emoji" id="resultEmoji">💼</span>
            <h2 class="result-title" id="resultTitle"></h2>
            <p class="result-desc" id="resultDesc"></p>
            <button class="btn-restart" id="restartBtn">Ricomincia il quiz</button>
            <div id="quizShare"></div>
        </div>
    </div>

    <script src="../../assets/js/quiz-share.js"></script>
    <script src="../../assets/js/quiz-enhance.js"></script>
    <script>
const questions = [
  { q: "La mattina in ufficio:", opts: ["Porto il caffè a tutti", "Arrivo e parlo subito in riunione", "Mando la prima email delle 23:57 (di ieri)", "Spengo il monitor e sparisco"] },
  { q: "In riunione tu:", opts: ["Prendi appunti", "Parli molto, dici poco", "Annuisci con autorità", "Non ci sei. Sei in call."] },
  { q: "Il progetto è in ritardo:", opts: ["Trovo una soluzione", "Riunisco una riunione per parlarne", "Mando un'email lunga 4 pagine", "È colpa del Wi-Fi"] },
  { q: "Il tuo contributo:", opts: ["Il caffè giusto al momento giusto", "Le idee (vaghe ma entusiasmanti)", "Le scadenze rispettate", "La presenza (a volte)"] },
  { q: "I colleghi dicono di te:", opts: ["È il cuore dell'ufficio", "Parla tanto, ma è simpatico", "Risponde sempre", "Non l'ho mai visto, ma c'è"] },
  { q: "Venerdì alle 17:", opts: ["Riordino la scrivania", "Mi lancio in un'altra riunione", "Rispondo alle email", "Sono già a casa (ma online)"] }
];
const results = [
  { key: "caffe", title: "Il Collega del Caffè", emoji: "☕", desc: "Sei il collante dell'ufficio. Senza di te nessuno si parlerebbe e il progetto crollerebbe. Il tuo vero superpotere è la macchinetta." },
  { key: "riunione", title: "Il Riunionista", emoji: "🗣️", desc: "Parli, parli, parli. Non sempre dici qualcosa, ma lo dici con grande sicurezza. Le riunioni sono il tuo palcoscenico." },
  { key: "email", title: "L'Email delle 23:57", emoji: "📧", desc: "Rispondi a tutto, a tutte le ore. Il tuo orario di lavoro è sempre. I colleghi ti temono e ti rispettano. Spegni il telefono, ogni tanto." },
  { key: "fantasma", title: "Il Fantasma dell'Ufficio", emoji: "👻", desc: "Sei in call da 3 anni. Nessuno ti ha mai visto, ma i tuoi task sono sempre fatti. Sei la leggenda dell'ufficio." }
];

        const weights = [0,0,0,0];
        let current = 0;
        const quizArea = document.getElementById('quizArea');
        const resultArea = document.getElementById('resultArea');
        const qNumEl = document.getElementById('qNum');
        const progressEl = document.getElementById('progress');
        const qTextEl = document.getElementById('qText');
        const answersEl = document.getElementById('answers');

        function renderQuestion() {
            const q = questions[current];
            qNumEl.textContent = `Domanda ${current+1} di ${questions.length}`;
            progressEl.style.width = `${((current+1)/questions.length)*100}%`;
            qTextEl.textContent = q.q;
            answersEl.innerHTML = '';
            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = opt;
                btn.onclick = () => pick(idx, btn);
                answersEl.appendChild(btn);
            });
        }

        function pick(idx, btn) {
            Array.from(answersEl.children).forEach(b => b.classList.remove('sel'));
            btn.classList.add('sel');
            weights[idx]++;
            setTimeout(() => {
                current++;
                if (current < questions.length) renderQuestion();
                else showResult();
            }, 240);
        }

        function showResult() {
            let winner = 0;
            for (let i = 1; i < weights.length; i++) if (weights[i] > weights[winner]) winner = i;
            const res = results[winner];
            quizArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            document.getElementById('resultEmoji').textContent = res.emoji;
            document.getElementById('resultTitle').textContent = res.title;
            document.getElementById('resultDesc').textContent = res.desc;
            if (window.QuizShare) {
                QuizShare.attach('quizShare', {
                    emoji: res.emoji,
                    title: res.title,
                    sub: res.desc,
                    page: "Che collega d'ufficio sei?"
                });
            }
        }

        document.getElementById('restartBtn').addEventListener('click', () => {
            current = 0;
            for (let i = 0; i < weights.length; i++) weights[i] = 0;
            resultArea.classList.add('hidden');
            quizArea.classList.remove('hidden');
            renderQuestion();
        });

        renderQuestion();

    </script>
</body>
</html>
