<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Che tipo di milanese sei? Scoprilo con questo quiz e condividi il risultato come card.">
    <title>Che tipo di milanese sei? — Quiz condivisibile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg-900:#0a1628;--bg-800:#1a2940;--accent:#00d4ff;--text-main:#ffffff}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,var(--bg-900),var(--bg-800));color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
        .container{width:100%;max-width:600px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:20px;padding:28px;box-shadow:0 8px 32px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1)}
        .header{text-align:center;margin-bottom:24px}
        .back-btn{display:inline-block;margin-bottom:15px;color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem}
        h1{font-size:1.7rem;margin:0 0 8px 0;color:var(--accent);line-height:1.25}
        .sub{color:#a0c0e0;font-size:.95rem;margin:0;line-height:1.5}
        .progress-bar{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin-bottom:20px;overflow:hidden}
        .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s ease}
        .question-number{text-align:center;margin-bottom:15px;color:#a0c0e0;font-size:.9rem}
        .question{font-size:1.25rem;font-weight:700;margin-bottom:24px;text-align:center;line-height:1.4}
        .answers{display:flex;flex-direction:column;gap:12px}
        .answer-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:white;padding:16px;border-radius:14px;cursor:pointer;transition:all .18s ease;font-size:1rem;text-align:left;font-family:inherit}
        .answer-btn:hover{border-color:var(--accent)}
        .answer-btn:active{transform:scale(.98)}
        .answer-btn.sel{background:rgba(0,212,255,.18);border-color:var(--accent)}
        .hidden{display:none}
        .result-view{text-align:center}
        .result-emoji{font-size:4.5rem;display:block;margin-bottom:12px;animation:bounce 1.4s ease-in-out infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .result-title{font-size:1.9rem;font-weight:800;margin:0 0 10px;color:#fff}
        .result-desc{font-size:1.05rem;color:#a0c0e0;line-height:1.6;margin:0 0 24px}
        .btn-restart{background:var(--accent);color:#0a1628;border:none;padding:15px 30px;border-radius:30px;font-weight:700;font-size:1.05rem;cursor:pointer;font-family:inherit}
        .btn-restart:active{transform:scale(.97)}
    </style>
    <link rel="stylesheet" href="../../assets/css/quiz-theme.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../quiz.html" class="back-btn">← Torna ai quiz</a>
            <h1>Che tipo di milanese sei? 🍝</h1>
            <p class="sub">6 domande, 4 destini. Alla fine, condividi la tua card e dimostralo a tutti.</p>
        </div>

        <div id="quizArea">
            <div class="question-number" id="qNum">Domanda 1 di 6</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <div class="question" id="qText"></div>
            <div class="answers" id="answers"></div>
        </div>

        <div id="resultArea" class="result-view hidden">
            <span class="result-emoji" id="resultEmoji">🕶️</span>
            <h2 class="result-title" id="resultTitle">Il Meneghino DOC</h2>
            <p class="result-desc" id="resultDesc"></p>
            <button class="btn-restart" id="restartBtn">Ricomincia il quiz</button>
            <div id="quizShare"></div>
        </div>
    </div>

    <script src="../../assets/js/quiz-share.js"></script>
    <script src="../../assets/js/quiz-enhance.js"></script>
    <script>
        const questions = [
            { q: "Il tram è in ritardo di 7 minuti. Tu:", opts: [
                "Sistemo gli occhiali da sole e aspetto con stile",
                "Chiamo un taxi: il tempo è denaro e io sono Area C",
                "Faccio una foto all'orologio e la pubblico",
                "Saluto il tram: anche lui ha i suoi impegni" ] },
            { q: "Aperitivo perfetto?", opts: [
                "Negroni Sbagliato al Bar Basso",
                "Spritz ai Navigli con vista sul canale",
                "Analcolico: il vero lusso è la lucidità",
                "Tutto, purché sia gratis e a Milano" ] },
            { q: "Il Duomo per te è:", opts: [
                "Un amico: ci vado a meditare",
                "Il punto di incontro per gli appuntamenti",
                "Un nemico: troppi turisti",
                "Casa. Semplicemente casa" ] },
            { q: "Un collega ti chiede un favore. Tu:", opts: [
                "Certo, ma ti ricorderò che me lo devi",
                "Dipende: hai portato il panettone?",
                "No, ma ti consiglio chi può",
                "L'ho già fatto. Non ricordartelo. Mai." ] },
            { q: "Sabato sera?", opts: [
                "Aperitivo, cena, concerto, after: calendario pieno",
                "Passeggiata ai Navigli con un gelato",
                "Casa, Netflix e una coperta. Con orgoglio.",
                "Qualsiasi cosa, purché si svolga a Milano" ] },
            { q: "Un gabbiano ti ruba il panino. Tu:", opts: [
                "Lo perdono: è un milanese come me",
                "Gli faccio causa. Con testimoni.",
                "Lo fotografo e pubblico #gabbianodimilano",
                "Riprogrammo il mio volo: era il suo panino, tecnicamente" ] }
        ];

        const results = [
            { key: "meneghino", title: "Il Meneghino DOC", emoji: "🍝",
              desc: "Sei fatto di buon senso, caffè e una punta di ironia. I turisti ti chiedono indicazioni, tu rispondi in italiano ma pensi in dialetto. La città ti ringrazia." },
            { key: "imbruttito", title: "L'Imbruttito", emoji: "😤",
              desc: "Area C non ti spaventa, i tram ti hanno tradito una volta e non perdoni. Sei il meme della città che cammina: arrabbiato, ma con stile." },
            { key: "turista", title: "Il Turista Felice", emoji: "📸",
              desc: "Sei qui per i selfie, i panettoni e i Navigli. Non importa: Milano ti adotta, come adotta tutti. Basta che non chiedi dove sia il Naviglio (c'è, giuralo)." },
            { key: "leggenda", title: "La Leggenda del Duomo", emoji: "🕶️",
              desc: "Conosci ogni portico, ogni via, ogni segreto. Sei nato milanese in un'altra vita. Orazio Caino ti saluta con gli occhiali da sole. Sempre." }
        ];

        const weights = { meneghino: 0, imbruttito: 0, turista: 0, leggenda: 0 };
        const map = [["meneghino","imbruttito","turista","leggenda"],["meneghino","imbruttito","turista","leggenda"],
                     ["meneghino","imbruttito","turista","leggenda"],["meneghino","imbruttito","turista","leggenda"],
                     ["meneghino","imbruttito","turista","leggenda"],["meneghino","imbruttito","turista","leggenda"]];

        let current = 0;
        const quizArea = document.getElementById('quizArea');
        const resultArea = document.getElementById('resultArea');
        const qNumEl = document.getElementById('qNum');
        const progressEl = document.getElementById('progress');
        const qTextEl = document.getElementById('qText');
        const answersEl = document.getElementById('answers');

        function renderQuestion() {
            const q = questions[current];
            qNumEl.textContent = `Domanda ${current+1} di ${questions.length}`;
            progressEl.style.width = `${((current+1)/questions.length)*100}%`;
            qTextEl.textContent = q.q;
            answersEl.innerHTML = '';
            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = opt;
                btn.onclick = () => pick(idx, btn);
                answersEl.appendChild(btn);
            });
        }

        function pick(idx, btn) {
            Array.from(answersEl.children).forEach(b => b.classList.remove('sel'));
            btn.classList.add('sel');
            weights[map[current][idx]]++;
            setTimeout(() => {
                current++;
                if (current < questions.length) renderQuestion();
                else showResult();
            }, 260);
        }

        function showResult() {
            const winner = Object.keys(weights).reduce((a, b) => weights[a] > weights[b] ? a : b);
            const res = results.find(r => r.key === winner);
            quizArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            document.getElementById('resultEmoji').textContent = res.emoji;
            document.getElementById('resultTitle').textContent = res.title;
            document.getElementById('resultDesc').textContent = res.desc;
            // Card condivisibile
            if (window.QuizShare) {
                QuizShare.attach('quizShare', {
                    emoji: res.emoji,
                    title: res.title,
                    sub: res.desc,
                    page: 'Che tipo di milanese sei?'
                });
            }
        }

        document.getElementById('restartBtn').addEventListener('click', () => {
            current = 0;
            for (const k in weights) weights[k] = 0;
            resultArea.classList.add('hidden');
            quizArea.classList.remove('hidden');
            renderQuestion();
        });

        renderQuestion();
    </script>
</body>
</html>
