<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Che tipo di Fast Food sei?</title>
    <style>
        /* styles unchanged */
        * {margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial, sans-serif;background:linear-gradient(135deg,#ff9900 0%,#ff0000 100%);min-height:100vh;padding:20px;color:white}
        .container{max-width:500px;margin:0 auto;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:30px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
        .header{text-align:center;margin-bottom:30px}
        .header h1{font-size:2.5rem;margin-bottom:10px;background:linear-gradient(45deg,#ffffff,#ffe0e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}
        .header p{font-size:1.1rem;opacity:0.9}
        .question-container{margin-bottom:30px}
        .question{font-size:1.2rem;font-weight:bold;margin-bottom:20px;text-align:center;line-height:1.4}
        .answers{display:flex;flex-direction:column;gap:12px}
        .answer-btn{background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.3);color:white;padding:15px;border-radius:15px;cursor:pointer;transition:all 0.3s ease;font-size:1rem;text-align:center;backdrop-filter:blur(5px)}
        .answer-btn:hover{background:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.5);transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,0.2)}
        .progress-bar{width:100%;height:8px;background:rgba(255,255,255,0.2);border-radius:4px;margin-bottom:20px;overflow:hidden}
        .progress-fill{height:100%;background:#ffcc00;width:0%;transition:width 0.3s ease}
        .hidden{display:none}.result-container{text-align:center}.result-emoji{font-size:5rem;margin-bottom:20px;display:block;animation:bounce 1s infinite}
        @keyframes bounce {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        .result-title{font-size:2rem;margin-bottom:15px;color:#ffcc00}.result-description{font-size:1.1rem;line-height:1.6;margin-bottom:30px}.restart-btn{background:#ffcc00;color:#d32f2f;border:none;padding:15px 30px;font-size:1.2rem;font-weight:bold;border-radius:30px;cursor:pointer}.back-link{display:block;margin-top:20px;color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.9rem}
        .back-link:hover{color:white;text-decoration:underline}
    </style>
    <link rel="stylesheet" href="../../assets/css/quiz-theme.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Che Fast Food Sei?</h1>
            <p>Rispondi a 10 domande e scopri la tua vera natura culinaria!</p>
        </div>

        <div id="quiz-container">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="question-number" style="text-align: center; margin-bottom: 10px; opacity: 0.8;">Domanda 1 di 10</p>
            
            <div class="question-container">
                <p id="question-text" class="question">Caricamento...</p>
                <div id="answers-container" class="answers"></div>
            </div>
        </div>

        <div id="result-container" class="result-container hidden">
            <span id="result-emoji" class="result-emoji">🍔</span>
            <h2 id="result-title" class="result-title">Tu sei un Hamburger!</h2>
            <p id="result-description" class="result-description">Descrizione...</p>
            <button onclick="restartQuiz()" class="restart-btn">Ricomincia il Quiz</button>
            <a href="../quiz.html" class="back-link">Torna alla lista dei quiz</a>
            <div id="quizShare"></div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "È venerdì sera. Cosa fai?",
                answers: [
                    { text: "Esco con gli amici al pub", type: "burger" },
                    { text: "Festa in casa con tutti!", type: "pizza" },
                    { text: "Serata piccante e avventurosa", type: "taco" },
                    { text: "Film sul divano e relax", type: "chicken" },
                    { text: "Palestra o corsa notturna", type: "salad" }
                ]
            },
            {
                question: "Qual è la tua qualità migliore?",
                answers: [
                    { text: "Affidabilità", type: "burger" },
                    { text: "Socievolezza", type: "pizza" },
                    { text: "Originalità", type: "taco" },
                    { text: "Dolcezza", type: "chicken" },
                    { text: "Disciplina", type: "salad" }
                ]
            },
            {
                question: "Scegli una bevanda:",
                answers: [
                    { text: "Coca Cola classica", type: "burger" },
                    { text: "Birra ghiacciata", type: "pizza" },
                    { text: "Margarita", type: "taco" },
                    { text: "Tè freddo dolce", type: "chicken" },
                    { text: "Acqua naturale", type: "salad" }
                ]
            },
            {
                question: "Come ti vesti di solito?",
                answers: [
                    { text: "Jeans e maglietta", type: "burger" },
                    { text: "Casual e comodo", type: "pizza" },
                    { text: "Colorato e stravagante", type: "taco" },
                    { text: "Tuta o pigiama", type: "chicken" },
                    { text: "Sportivo e tecnico", type: "salad" }
                ]
            },
            {
                question: "Qual è il tuo genere di film preferito?",
                answers: [
                    { text: "Azione / Blockbuster", type: "burger" },
                    { text: "Commedia per tutti", type: "pizza" },
                    { text: "Thriller psicologico", type: "taco" },
                    { text: "Drammatico / Romantico", type: "chicken" },
                    { text: "Documentario", type: "salad" }
                ]
            },
            {
                question: "Se vincessi alla lotteria, cosa faresti?",
                answers: [
                    { text: "Compro una bella macchina", type: "burger" },
                    { text: "Offro una cena a tutti i miei amici", type: "pizza" },
                    { text: "Parto per un viaggio esotico", type: "taco" },
                    { text: "Compro una casa enorme", type: "chicken" },
                    { text: "Investo in beneficenza", type: "salad" }
                ]
            },
            {
                question: "Qual è il tuo animale guida?",
                answers: [
                    { text: "Cane (fedele)", type: "burger" },
                    { text: "Gatto (indipendente ma amato)", type: "pizza" },
                    { text: "Pappagallo (colorato)", type: "taco" },
                    { text: "Orso (protettivo)", type: "chicken" },
                    { text: "Gazzella (veloce)", type: "salad" }
                ]
            },
            {
                question: "Come reagisci ai problemi?",
                answers: [
                    { text: "Li affronto di petto", type: "burger" },
                    { text: "Chiedo aiuto agli amici", type: "pizza" },
                    { text: "Cerco una soluzione creativa", type: "taco" },
                    { text: "Mi prendo un momento per me", type: "chicken" },
                    { text: "Analizzo la situazione con calma", type: "salad" }
                ]
            },
            {
                question: "Qual è il tuo colore preferito?",
                answers: [
                    { text: "Rosso", type: "burger" },
                    { text: "Giallo", type: "pizza" },
                    { text: "Verde acido", type: "taco" },
                    { text: "Arancione", type: "chicken" },
                    { text: "Verde natura", type: "salad" }
                ]
            },
            {
                question: "Una parola per descriverti:",
                answers: [
                    { text: "Classico", type: "burger" },
                    { text: "Popolare", type: "pizza" },
                    { text: "Pazzo", type: "taco" },
                    { text: "Confortevole", type: "chicken" },
                    { text: "Sano", type: "salad" }
                ]
            }
        ];
        const results = {
            burger: {
                title: "Sei un Hamburger!",
                emoji: "🍔",
                desc: "Sei un classico intramontabile. Affidabile, solido e amato da (quasi) tutti. Non hai bisogno di fronzoli per essere apprezzato, la tua sostanza è ciò che conta. Sei il punto di riferimento del gruppo, quello su cui si può sempre contare."
            },
            pizza: {
                title: "Sei una Pizza!",
                emoji: "🍕",
                desc: "Sei l'anima della festa! Versatile, socievole e capace di adattarti a ogni situazione. La gente ti ama perché porti allegria e condivisione ovunque vai. Sei completo e sai soddisfare i gusti di tutti."
            },
            taco: {
                title: "Sei un Taco!",
                emoji: "🌮",
                desc: "Sei piccante, imprevedibile e pieno di sorprese! La vita con te non è mai noiosa. Hai un guscio croccante ma un cuore morbido e ricco di sapore. Ti piace osare e distinguerti dalla massa."
            },
            chicken: {
                title: "Sei Pollo Fritto!",
                emoji: "🍗",
                desc: "Sei il comfort food per eccellenza. Caldo, accogliente e capace di far sentire meglio chiunque. Magari non sei la scelta più salutare, ma sei quella che tutti cercano quando hanno bisogno di una coccola o di sentirsi a casa."
            },
            salad: {
                title: "Sei un'Insalata!",
                emoji: "🥗",
                desc: "Sei disciplinato, fresco e attento al benessere. Magari alcuni ti trovano 'noioso', ma in realtà sei pieno di risorse e fai bene a chi ti sta intorno. Sei l'equilibrio necessario in un mondo di eccessi!"
            }
        };
        let currentQuestion = 0;
        let scores = { burger: 0, pizza: 0, taco: 0, chicken: 0, salad: 0 };

        function displayQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-number').textContent = `Domanda ${currentQuestion + 1} di ${questions.length}`;
            document.getElementById('question-text').textContent = q.question;
            document.getElementById('progress-fill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            const container = document.getElementById('answers-container');
            container.innerHTML = '';
            
            q.answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans.text;
                btn.onclick = () => selectAnswer(ans.type);
                container.appendChild(btn);
            });
        }

        function selectAnswer(type) {
            scores[type]++;
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                displayQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            // Find max score
            let maxScore = -1;
            let winner = 'burger';
            
            for (const [type, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    winner = type;
                }
            }
            
            const res = results[winner];
            document.getElementById('result-emoji').textContent = res.emoji;
            document.getElementById('result-title').textContent = res.title;
            document.getElementById('result-description').textContent = res.desc; if(window.QuizShare){ QuizShare.attach('quizShare',{ emoji:res.emoji, title:res.title, sub:res.desc, page:'Che fast food sei?' }); }
            
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
        }

        function restartQuiz() {
            currentQuestion = 0;
            scores = { burger: 0, pizza: 0, taco: 0, chicken: 0, salad: 0 };
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            displayQuestion();
        }

        // Init
        displayQuestion();
    </script>

    <script src="../../assets/js/quiz-share.js"></script>
    <script src="../../assets/js/quiz-enhance.js"></script>
</body>
</html>
