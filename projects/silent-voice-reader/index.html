<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f0f0f">
<meta name="description" content="Silent Voice Reader — lettura vocale silenziosa, privacy-first">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Silent Voice Reader</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>Silent Voice Reader</h1>
    <nav id="tabs">
      <button class="tab active" data-tab="read">Lettura</button>
      <button class="tab" data-tab="library">Libreria</button>
      <button class="tab" data-tab="settings">Impostazioni</button>
    </nav>
  </header>
  <main id="content">
    <section id="tab-read" class="tab-content active">
      <div class="read-area">
        <h2 id="book-title">Carica un libro</h2>
        <p id="text-preview">Nessun testo disponibile — trascina un file o apri dalla libreria.</p>
        <div class="voice-controls">
          <button id="btn-play" aria-label="Leggi">▶</button>
          <button id="btn-pause" aria-label="Pausa">⏸</button>
          <span id="voice-status">Microfono: attivo (solo locale)</span>
        </div>
      </div>
    </section>
    <section id="tab-library" class="tab-content">
      <h2>Libreria</h2>
      <ul id="book-list"></ul>
    </section>
    <section id="tab-settings" class="tab-content">
      <h2>Impostazioni</h2>
      <div class="setting">
        <label>Qualità voce: alta</label>
        <label>Volume: 80%</label>
        <label>Lingua: italiano</label>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
