<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Smile Detection – AI Smile Analyzer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas#bg{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#2ecc71;font-size:clamp(22px,8vw,64px);text-align:center;text-shadow:0 0 30px rgba(46,204,113,.5),0 0 60px rgba(46,204,113,.2);letter-spacing:clamp(3px,1.5vw,12px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#666;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #2ecc71;background:rgba(46,204,113,.08);color:#d0d0d0;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(46,204,113,.2);box-shadow:0 0 24px rgba(46,204,113,.2)}
#credit{position:fixed;bottom:16px;color:#333;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="overlay">
  <div id="title">SMILE DETECTION</div>
  <div id="sub">Analisi sorriso con AI — Bianchezza · Allineamento · Voto</div>
  <button id="apri" onclick="window.location.href='smile_detection/index.html'">APRI</button>
</div>
<div id="credit">AI-powered smile analysis</div>

<script>
const c = document.getElementById('bg');
const ctx = c.getContext('2d');
let W, H;

function resize() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* floating smile particles */
const PARTICLES = 40;
const parts = [];
const colors = ['#2ecc71','#27ae60','#f1c40f','#f39c12','#e74c3c'];

for (let i = 0; i < PARTICLES; i++) {
  parts.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 4 + Math.random() * 12,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.25,
    color: colors[i % colors.length],
    phase: Math.random() * Math.PI * 2,
    type: Math.random() > 0.5 ? 'circle' : 'star',
  });
}

function drawStar(cx, cy, r, pts) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const angle = (i * Math.PI) / pts - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const x = cx + Math.cos(angle) * rad;
    const y = cy + Math.sin(angle) * rad;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function draw(t) {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  parts.forEach((p) => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -p.r) p.x = W + p.r;
    if (p.x > W + p.r) p.x = -p.r;
    if (p.y < -p.r) p.y = H + p.r;
    if (p.y > H + p.r) p.y = -p.r;

    const pulse = 1 + Math.sin(t / 800 + p.phase) * 0.3;
    const r = p.r * pulse;

    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    grad.addColorStop(0, p.color + '50');
    grad.addColorStop(0.5, p.color + '20');
    grad.addColorStop(1, p.color + '00');
    ctx.fillStyle = grad;

    if (p.type === 'star') {
      drawStar(p.x, p.y, r, 5);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
