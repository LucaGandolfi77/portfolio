<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070d1a">
<meta name="description" content="Phonetic Transcriber — trascrivi suoni sconosciuti in chiavi fonetiche, IPA approssimato e guess della lingua.">
<title>PHONETIC TRANSCRIBER — Suoni senza alfabeto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#070d1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#00d4ff;font-size:clamp(26px,9vw,64px);text-align:center;text-shadow:0 0 30px rgba(0,212,255,.5),0 0 60px rgba(0,212,255,.2);letter-spacing:clamp(3px,1.6vw,12px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#8fb4d6;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #00d4ff;background:rgba(0,212,255,.08);color:#eaf6ff;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(0,212,255,.2);box-shadow:0 0 24px rgba(0,212,255,.2)}
#credit{position:fixed;bottom:16px;color:#5f7f9f;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">PHONETIC TRANSCRIBER</div>
  <div id="sub">Trascrivi suoni senza alfabeto</div>
  <button id="apri" onclick="window.location.href='phonetic-transcriber/index.html'">APRI</button>
</div>
<div id="credit">Cattura, trascrivi in chiave fonetica, indovina la lingua 🔤🔉🌍</div>

<script>
const canvas=document.createElement('canvas');
document.body.prepend(canvas);
const ctx=canvas.getContext('2d');
let W=canvas.width=window.innerWidth, H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});

const bars=[];
const N=Math.max(40,Math.floor(W/18));
for(let i=0;i<N;i++) bars.push({x:0,y:0,h:1});

const particles=[];
for(let i=0;i<70;i++) particles.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.2,a:.3+Math.random()*.6,hue:185+Math.random()*45});

const emojis=['🔤','🔉','🗣','🌍','🔠','🎙','✨'];
const floaters=emojis.map((e,i)=>({e,x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1,sp:.3+Math.random()*.5,ph:Math.random()*6.28}));

function draw(t){
  requestAnimationFrame(draw);
  ctx.fillStyle='#070d1a';
  ctx.fillRect(0,0,W,H);

  const cw=6, gap=W/N, amp=H*.18;
  for(let i=0;i<N;i++){
    const y=Math.sin(t*.003+i*.4)*amp;
    bars[i].h=Math.max(2, (Math.abs(y)+12));
    const hue=185+(i/N)*30;
    const grad=ctx.createLinearGradient(0,H/2+bars[i].h,0,H/2-bars[i].h);
    grad.addColorStop(0,'rgba(124,92,255,.12)');
    grad.addColorStop(1,'rgba(0,212,255,.05)');
    ctx.fillStyle=grad;
    ctx.fillRect((i*gap)+gap*.2, H/2-bars[i].h, cw, bars[i].h*2);
    ctx.fillStyle='hsl('+hue+',100%,62%)';
    ctx.globalAlpha=.16;
    ctx.fillRect((i*gap)+gap*.2, H/2-1, cw, 2);
    ctx.globalAlpha=1;
  }

  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.globalAlpha=.5;
    ctx.fillStyle='hsla('+p.hue+',100%,70%,.6)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const f of floaters){
    f.ph+=.008*f.sp;
    f.y+=Math.sin(f.ph)*.3;
    ctx.globalAlpha=.8;
    ctx.font=(18+f.r*10)+'px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.e,f.x,f.y+Math.sin(t*.002*f.r+f.ph)*14);
  }
  ctx.globalAlpha=1;
}
requestAnimationFrame(draw);
</script>
</body>
</html>
