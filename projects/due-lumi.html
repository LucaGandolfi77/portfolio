<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>I Due Lumi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0b09;font-family:'Courier New',monospace}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10}
#title{color:#f2c14e;font-size:clamp(18px,5vw,32px);text-align:center;text-shadow:0 0 20px rgba(242,193,78,.6),0 0 40px rgba(242,193,78,.3);letter-spacing:4px;opacity:0;animation:fadeIn 2s ease 1s forwards}
#subtitle{color:#e8a55a;font-size:clamp(10px,2.5vw,14px);text-align:center;margin-top:12px;opacity:0;animation:fadeIn 2s ease 2s forwards;letter-spacing:2px}
#play{pointer-events:all;margin-top:40px;padding:12px 40px;border:1px solid #e8a55a;background:rgba(232,165,90,.1);color:#f7e8c9;font-size:clamp(12px,3vw,16px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 3s forwards;font-family:inherit;letter-spacing:2px}
#play:hover{background:rgba(232,165,90,.25);box-shadow:0 0 20px rgba(232,165,90,.3)}
#credit{position:fixed;bottom:16px;color:#483d3b;font-size:10px;opacity:0;animation:fadeIn 2s ease 3.5s forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#play{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">I DUE LUMI</div>
  <div id="subtitle">Un'avventura tra luce e oscurità</div>
  <button id="play" onclick="window.location.href='due-lumi/index.html'">GIOCA</button>
</div>
<div id="credit">Creato con amore pixel per pixel</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b09);
scene.fog = new THREE.FogExp2(0x0d0b09, 0.015);

const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 200);
camera.position.set(0, 2, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.7;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

/* lights */
const amb = new THREE.AmbientLight(0x1a120a, 0.3);
scene.add(amb);

const miloLight = new THREE.PointLight(0xf2c14e, 3, 20, 1.5);
miloLight.position.set(-3, 1.5, 0);
scene.add(miloLight);

const titoLight = new THREE.PointLight(0xcf6a3a, 3, 20, 1.5);
titoLight.position.set(3, 1.5, 0);
scene.add(titoLight);

/* orbs */
const orbGeo = new THREE.SphereGeometry(0.4, 24, 24);
const miloMat = new THREE.MeshStandardMaterial({
  color: 0xf2c14e, emissive: 0xf2c14e, emissiveIntensity: 2,
  roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.9
});
const titoMat = new THREE.MeshStandardMaterial({
  color: 0xcf6a3a, emissive: 0xcf6a3a, emissiveIntensity: 2,
  roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.9
});
const miloOrb = new THREE.Mesh(orbGeo, miloMat);
const titoOrb = new THREE.Mesh(orbGeo, titoMat);
scene.add(miloOrb);
scene.add(titoOrb);

/* glow sprites */
const glowTex = createGlowTexture();
const glowMat1 = new THREE.SpriteMaterial({ map: glowTex, color: 0xf2c14e, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
const glowMat2 = new THREE.SpriteMaterial({ map: glowTex, color: 0xcf6a3a, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
const glow1 = new THREE.Sprite(glowMat1);
glow1.scale.set(4, 4, 1);
miloOrb.add(glow1);
const glow2 = new THREE.Sprite(glowMat2);
glow2.scale.set(4, 4, 1);
titoOrb.add(glow2);

function createGlowTexture(){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.3, 'rgba(255,255,255,0.4)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* fog particles */
const PARTICLES = 800;
const pGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLES * 3);
const colors = new Float32Array(PARTICLES * 3);
const sizes = new Float32Array(PARTICLES);
const pVelocities = new Float32Array(PARTICLES * 3);
const warmColors = [
  [0.95, 0.85, 0.72],
  [0.91, 0.65, 0.35],
  [0.81, 0.42, 0.24],
  [0.74, 0.59, 0.45],
  [0.88, 0.78, 0.66],
];
for(let i=0; i<PARTICLES; i++){
  positions[i*3] = (Math.random()-0.5) * 30;
  positions[i*3+1] = (Math.random()-0.5) * 15;
  positions[i*3+2] = (Math.random()-0.5) * 30;
  const c = warmColors[Math.floor(Math.random()*warmColors.length)];
  colors[i*3] = c[0];
  colors[i*3+1] = c[1];
  colors[i*3+2] = c[2];
  sizes[i] = Math.random() * 0.15 + 0.05;
  pVelocities[i*3] = (Math.random()-0.5) * 0.003;
  pVelocities[i*3+1] = (Math.random()-0.5) * 0.002;
  pVelocities[i*3+2] = (Math.random()-0.5) * 0.003;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
pGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const pMat = new THREE.PointsMaterial({
  size: 0.12, vertexColors: true, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false,
  sizeAttenuation: true
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

/* ground reference ring */
const ringGeo = new THREE.RingGeometry(4, 4.05, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x483d3b, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI/2;
ring.position.y = -1;
scene.add(ring);

/* touch attractor */
const mouse = new THREE.Vector2(9999, 9999);
let touchActive = false;

function onPointerMove(e){
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function onPointerDown(){ touchActive = true; }
function onPointerUp(){ touchActive = false; mouse.set(9999, 9999); }
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointerend', onPointerUp);

/* post processing */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.5, 0.4, 0.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* resize */
window.addEventListener('resize', ()=>{
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  composer.setSize(w, h);
});

/* animate */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  /* orb sway */
  miloOrb.position.x = -3 + Math.sin(t * 0.5) * 1.5;
  miloOrb.position.y = 1.5 + Math.sin(t * 0.7) * 0.4;
  titoOrb.position.x = 3 + Math.sin(t * 0.5 + Math.PI) * 1.5;
  titoOrb.position.y = 1.5 + Math.cos(t * 0.6) * 0.4;

  /* pulse */
  const pulse = 0.9 + Math.sin(t * 2) * 0.1;
  miloOrb.scale.setScalar(pulse);
  titoOrb.scale.setScalar(pulse);

  /* light flicker */
  miloLight.intensity = 3 + Math.sin(t * 3) * 0.5;
  titoLight.intensity = 3 + Math.cos(t * 2.5) * 0.5;

  /* particle drift */
  const pos = particles.geometry.attributes.position.array;
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  for(let i=0; i<PARTICLES; i++){
    pos[i*3] += pVelocities[i*3];
    pos[i*3+1] += pVelocities[i*3+1];
    pos[i*3+2] += pVelocities[i*3+2];
    /* wrap */
    if(pos[i*3] > 15) pos[i*3] = -15;
    if(pos[i*3] < -15) pos[i*3] = 15;
    if(pos[i*3+1] > 7.5) pos[i*3+1] = -7.5;
    if(pos[i*3+1] < -7.5) pos[i*3+1] = 7.5;
    if(pos[i*3+2] > 15) pos[i*3+2] = -15;
    if(pos[i*3+2] < -15) pos[i*3+2] = 15;
    /* attract to mouse */
    if(touchActive){
      const dx = (mouse.x * 10) - pos[i*3];
      const dy = (mouse.y * 8) - pos[i*3+1];
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 6){
        const force = 0.0003 / (dist + 0.5);
        pVelocities[i*3] += dx * force;
        pVelocities[i*3+1] += dy * force;
      }
    }
    /* dampen */
    pVelocities[i*3] *= 0.998;
    pVelocities[i*3+1] *= 0.998;
    pVelocities[i*3+2] *= 0.998;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
