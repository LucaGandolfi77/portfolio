<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Countdown to San Dunén — 9 ottobre a Fidenza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4e8" />
      <stop offset="100%" stop-color="#f0b96a" />
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0b878" />
      <stop offset="100%" stop-color="#c98a2e" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <circle cx="256" cy="256" r="215" fill="#fffdf8" stroke="#e0b878" stroke-width="10" />

  <!-- gomma -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="#a8324a" stroke-width="24" />
  <!-- cerchione -->
  <circle cx="256" cy="256" r="123" fill="none" stroke="url(#spoke)" stroke-width="9" />

  <!-- raggi -->
  <g stroke="url(#spoke)" stroke-width="7" stroke-linecap="round">
    <path d="M256 148 V364" />
    <path d="M148 256 H364" />
    <path d="M180 180 L332 332" />
    <path d="M332 180 L180 332" />
    <path d="M199.9 160.1 L312.1 351.9" transform="rotate(-22.5 256 256)" />
    <path d="M312.1 160.1 L199.9 351.9" transform="rotate(22.5 256 256)" />
  </g>

  <!-- mozzo -->
  <circle cx="256" cy="256" r="26" fill="#a8324a" />
  <circle cx="249" cy="249" r="8" fill="#ffffff" opacity="0.45" />

  <!-- scintille -->
  <path d="M78 116 c5 16 11 22 27 27 c-16 5 -22 11 -27 27 c-5 -16 -11 -22 -27 -27 c16 -5 22 -11 27 -27 z" fill="#c98a2e" opacity="0.85" />
  <path d="M432 372 c4 13 9 18 22 22 c-13 4 -18 9 -22 22 c-4 -13 -9 -18 -22 -22 c13 -4 18 -9 22 -22 z" fill="#c98a2e" opacity="0.75" />
