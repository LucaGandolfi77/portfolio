<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#4CAF50"/>
  <meta name="description" content="Daisy Field — a mindfulness timer that fills your screen with daisies while you stay away from your phone."/>
  <title>Daisy Field</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet"/>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css"/>

  <!-- Site top bar (top_buttons.js) glue -->
  <style>
    /* Keep screen content clear of the fixed 36px site bar */
    .screen { padding-top: var(--site-top-bar-height, 36px); }
    /* Drop the timer pill below the site bar */
    .timer-pill {
      top: calc(var(--site-top-bar-height, 36px) + env(safe-area-inset-top, 16px) + 8px);
    }
  </style>
</head>
<body>

  <!-- ========================================================
       Screen 1 — Timer Setup
       ======================================================== -->
  <section id="setup-screen" class="screen active" aria-label="Timer setup">
    <div class="setup-card">
      <h1>Daisy Field</h1>
      <p class="subtitle">Put your phone down and let the flowers grow</p>

      <div class="flower-picker" role="radiogroup" aria-label="Choose flower type">
        <button class="flower-option selected" data-flower="daisy" aria-pressed="true" title="Daisy">
          <span class="flower-emoji">🌼</span>
          <span class="flower-label">Daisy</span>
        </button>
        <button class="flower-option" data-flower="rose" aria-pressed="false" title="Rose">
          <span class="flower-emoji">🌹</span>
          <span class="flower-label">Rose</span>
        </button>
        <button class="flower-option" data-flower="sunflower" aria-pressed="false" title="Sunflower">
          <span class="flower-emoji">🌻</span>
          <span class="flower-label">Sunflower</span>
        </button>
        <button class="flower-option" data-flower="tulip" aria-pressed="false" title="Tulip">
          <span class="flower-emoji">🌷</span>
          <span class="flower-label">Tulip</span>
        </button>
        <button class="flower-option" data-flower="cherry" aria-pressed="false" title="Cherry Blossom">
          <span class="flower-emoji">🌸</span>
          <span class="flower-label">Cherry</span>
        </button>
        <button class="flower-option" data-flower="rosette" aria-pressed="false" title="Rosette">
          <span class="flower-emoji">🏵️</span>
          <span class="flower-label">Rosette</span>
        </button>
        <button class="flower-option" data-flower="hyacinth" aria-pressed="false" title="Hyacinth">
          <span class="flower-emoji">🪻</span>
          <span class="flower-label">Hyacinth</span>
        </button>
        <button class="flower-option" data-flower="hibiscus" aria-pressed="false" title="Hibiscus">
          <span class="flower-emoji">🌺</span>
          <span class="flower-label">Hibiscus</span>
        </button>
        <button class="flower-option" data-flower="mushroom" aria-pressed="false" title="Mushroom">
          <span class="flower-emoji">🍄</span>
          <span class="flower-label">Mushroom</span>
        </button>
        <button class="flower-option" data-flower="custom" aria-pressed="false" title="Custom text">
          <span class="flower-emoji">✏️</span>
          <span class="flower-label">Custom</span>
        </button>
      </div>

      <div class="dial-wrapper">
        <div class="dial-ring">
          <div id="time-display" class="dial-value" aria-live="polite">5<span>minutes</span></div>
        </div>
      </div>

      <input
        id="time-slider"
        type="range"
        min="1" max="60" value="5"
        aria-label="Select timer duration in minutes"
      />

      <br/>
      <button id="btn-start" class="btn-start" aria-label="Start timer and put down your phone">
        Start &amp; Put Down
      </button>
    </div>
  </section>

  <!-- ========================================================
       Screen 2 — Growing Meadow
       ======================================================== -->
  <section id="meadow-screen" class="screen" aria-label="Growing meadow timer">
    <div id="meadow"></div>
    <div id="timer-pill" class="timer-pill" aria-live="polite" aria-label="Time remaining">
      <span id="timer-text">00:00</span>
      <button id="btn-end" class="btn-end" aria-label="End timer early">End</button>
    </div>
    <div id="picked-pill" class="picked-pill" aria-live="polite" aria-label="Flowers picked">💐 0</div>
  </section>

  <!-- ========================================================
       Screen 3 — Bouquet Reward
       ======================================================== -->
  <section id="reward-screen" class="screen" aria-label="Timer complete reward">
    <div id="bouquet-container" aria-hidden="true"></div>
    <p id="reward-message" class="reward-message" aria-live="polite"></p>
    <p class="reward-submessage">Your meadow is in full bloom!</p>
    <button id="btn-collect" class="btn-collect" aria-label="Collect bouquet and start a new timer">
      Collect Bouquet 💐
    </button>
  </section>

  <!-- Custom text modal -->
  <div id="custom-modal" class="custom-modal" aria-hidden="true">
    <div class="custom-modal-card">
      <h2>Custom Text</h2>
      <p>Type a word or short phrase to scatter across the meadow</p>
      <input id="custom-text-input" type="text" maxlength="30" placeholder="e.g. Peace" class="custom-text-input" />
      <div class="custom-modal-actions">
        <button id="btn-custom-cancel" class="btn-custom-cancel">Cancel</button>
        <button id="btn-custom-ok" class="btn-custom-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Confetti overlay -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>

  <!-- App modules (order matters: factories before app logic) -->
  <script src="daisy.js" defer></script>
  <script src="confetti.js" defer></script>
  <script src="app.js" defer></script>

  <!-- Site top bar: Home + language selector -->
  <script src="../../top_buttons.js"></script>
</body>
</html>
