<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Audio Transcriber — Local Whisper</title>
		<style>
			body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#0b1020; color:#e6eef9; margin:0; padding:20px; }
			.card { background: rgba(255,255,255,0.03); border-radius:12px; padding:20px; max-width:900px; margin:20px auto; }
			h1 { margin:0 0 10px 0; color:#7de0ff }
			.controls { display:flex; gap:12px; align-items:center; margin:10px 0 20px 0; }
			button { background:#0b6b9a; color:#fff; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; }
			input[type=file] { color:#ddd }
			audio { width:100%; margin-top:10px; }
			pre { background: rgba(0,0,0,0.3); padding:12px; border-radius:8px; white-space:pre-wrap; }
			.small { font-size:0.9rem; color:#bcd }
		</style>
	</head>
	<body>
		<div class="card">
			<h1>Audio Transcriber</h1>
			<div class="small">Use a local or browser-based transcription model (Whisper style) to transcribe audio files. This UI lets you pick a file or record live.</div>

			<div class="controls">
				<input id="file" type="file" accept="audio/*" />
				<button id="recordBtn">Record</button>
				<button id="transcribeBtn" disabled>Transcribe</button>
			</div>

			<audio id="player" controls></audio>
			<div style="margin-top:12px">
				<label class="small">Transcription output</label>
				<pre id="output">Select or record audio, then press Transcribe.</pre>
			</div>
		</div>

		<script>
			const fileInput = document.getElementById('file');
			const recordBtn = document.getElementById('recordBtn');
			const transcribeBtn = document.getElementById('transcribeBtn');
			const player = document.getElementById('player');
			const output = document.getElementById('output');

			let currentBlob = null;
			let recorder = null;

			fileInput.addEventListener('change', e => {
				const f = e.target.files[0];
				if (!f) return;
				player.src = URL.createObjectURL(f);
				currentBlob = f;
				transcribeBtn.disabled = false;
			});

			recordBtn.addEventListener('click', async () => {
				if (!recorder) {
					const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
					recorder = new MediaRecorder(stream);
					const chunks = [];
					recorder.ondataavailable = e => chunks.push(e.data);
					recorder.onstop = () => {
						const blob = new Blob(chunks, { type: 'audio/webm' });
						currentBlob = blob;
						player.src = URL.createObjectURL(blob);
						transcribeBtn.disabled = false;
						recorder = null;
						recordBtn.textContent = 'Record';
					};
					recorder.start();
					recordBtn.textContent = 'Stop';
				} else {
					recorder.stop();
				}
			});

			transcribeBtn.addEventListener('click', async () => {
				if (!currentBlob) return;
				output.textContent = 'Transcribing... (this demo uses a remote API placeholder)';
				transcribeBtn.disabled = true;
				try {
					// Placeholder: in a real deployment, send to a local model/whisper backend
					// For demo, we simulate an async transcription
					await new Promise(r => setTimeout(r, 1200));
					const fake = 'This is a simulated transcription of the provided audio.';
					output.textContent = fake;
				} finally {
					transcribeBtn.disabled = false;
				}
			});
		</script>
	</body>
</html>
