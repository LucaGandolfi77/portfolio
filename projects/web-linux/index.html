<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!--
  VIEWPORT: viewport-fit=cover abilita le env(safe-area-inset-*) su iPhone
  (notch / home indicator). maximum-scale evita zoom involontari durante
  lo sviluppo da telefono.
-->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WebLinux · Terminale Linux nel browser</title>
<link rel="stylesheet" href="styles.css">

<!-- ══════════════ LIBRERIE DA CDN (nessun download locale necessario) ══════════════

     xterm.js 5.5.0  → terminale emulato nel browser (pacchetto scoped @xterm/xterm)
     addon-fit       → adatta automaticamente il terminale allo spazio disponibile
     v86 0.5.441     → emulatore x86 in WebAssembly (libv86.js espone window.V86)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/v86@0.5.441/build/libv86.js"></script>
</head>
<body>

<!-- ══════════ NAVBAR MINIMALE ══════════ -->
<header id="appbar">
  <span id="logo">&gt;_</span>
  <span id="title">WebLinux</span>

  <!-- Badge di stato della macchina virtuale (grigio=attesa, giallo=download, verde=pronta) -->
  <span id="vm-badge"><i id="vm-dot"></i><em id="vm-label">avvio</em></span>

  <!-- Fallback: mostra la console VGA testuale/grafica se la seriale fosse muta -->
  <button id="btn-vga" title="Mostra console VGA">VGA</button>
</header>

<!-- ══════════ AREA TERMINALE ══════════ -->
<main id="stage">
  <div id="terminal"></div>
</main>

<!-- ══════════ SOFT-KEYS PER SCHERMI TOUCH ══════════
     Tasti speciali che la tastiera del telefono non ha.
     "Ctrl" è a serratura: attivalo, poi premi una lettera (es. C → Ctrl+C).
-->
<nav id="softkeys" aria-label="Tasti speciali">
  <button class="key toggle" data-key="ctrl">Ctrl</button>
  <button class="key" data-key="\x1b">Esc</button>
  <button class="key" data-key="\t">Tab</button>
  <button class="key" data-key="\x1b[A">↑</button>
  <button class="key" data-key="\x1b[B">↓</button>
  <button class="key" data-key="\x1b[C">→</button>
  <button class="key" data-key="\x1b[D">←</button>
  <button class="key" data-key="|">|</button>
  <button class="key" data-key="-">-</button>
  <button class="key" data-key="/">/</button>
  <button class="key" data-key="~">~</button>
  <button class="key accent" id="btn-kbd">⌨︎ Tastiera</button>
</nav>

<!-- ══════════ OVERLAY DI CARICAMENTO ══════════ -->
<div id="loader">
  <div class="card">
    <div class="spinner"></div>
    <p id="load-msg">Inizializzazione…</p>
    <div id="bar-wrap"><div id="bar"></div></div>
    <code id="load-file"></code>
    <pre id="load-error" hidden></pre>
  </div>
</div>

<!-- ══════════ FALLBACK VGA ══════════
     Contenitore richiesto da v86: il primo figlio è la modalità testo,
     il secondo la canvas grafica. Normalmente nascosto; si apre col tasto VGA.
-->
<div id="vga-overlay" class="hidden">
  <button id="vga-close" title="Chiudi">×</button>
  <div id="screen-container">
    <div id="screen-text"></div>
    <canvas id="screen-canvas"></canvas>
  </div>
</div>

<!-- Barra standard del portfolio (Home / Lingua) -->
<script src="../top_buttons.js"></script>
<script src="app.js"></script>
</body>
</html>
