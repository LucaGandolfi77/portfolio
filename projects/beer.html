<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍺 iBeer - Virtual Beer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Arial', sans-serif;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
    }

    #beerCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #3d2817 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }

    #startScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #startScreen h1 {
      font-size: 64px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
    }

    #startScreen p {
      color: #fff;
      font-size: 18px;
      text-align: center;
      margin-bottom: 30px;
      padding: 0 20px;
    }

    #startBtn {
      padding: 20px 50px;
      font-size: 24px;
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 152, 0, 0.4);
      transition: all 0.3s;
      font-weight: bold;
    }

    #startBtn:active {
      transform: scale(0.95);
    }

    #fillBtn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 40px;
      font-size: 18px;
      background: linear-gradient(135deg, #4caf50, #388e3c);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
      transition: all 0.3s;
      z-index: 100;
      font-weight: bold;
    }

    #fillBtn:active {
      transform: translateX(-50%) scale(0.95);
    }

    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      text-align: center;
      z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .glass-shine {
      position: absolute;
      top: 0;
      left: 10%;
      width: 20%;
      height: 100%;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.1) 50%, 
        transparent 100%);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="beerCanvas"></canvas>
    <div class="glass-shine"></div>
  </div>

  <div id="startScreen">
    <h1>🍺</h1>
    <p>Inclina il telefono per far muovere la birra!<br>La birra cadrà se inclini troppo!</p>
    <button id="startBtn">Inizia</button>
  </div>

  <button id="fillBtn">🍺 Riempi</button>
  <div id="instructions">Inclina il telefono per bere!</div>

  <script>
    // ==================== SETUP ====================
    const canvas = document.getElementById('beerCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let animationId;
    let permissionGranted = false;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ==================== BEER STATE ====================
    const beer = {
      level: 0.8, // 0 to 1 (0 = empty, 1 = full)
      targetLevel: 0.8,
      tilt: { x: 0, y: 0 }, // Device tilt
      liquidOffset: { x: 0, y: 0 }, // Liquid movement offset
      velocity: { x: 0, y: 0 },
      pouring: false,
      drainRate: 0,
      color: {
        beer: 'rgba(255, 180, 20, 0.85)',
        beerDark: 'rgba(220, 140, 10, 0.9)',
        foam: 'rgba(255, 248, 220, 0.95)',
        foamDark: 'rgba(240, 230, 200, 0.85)'
      }
    };

    // ==================== BUBBLES ====================
    const bubbles = [];
    
    class Bubble {
      constructor() {
        this.reset();
      }

      reset() {
        const beerTop = height * (1 - beer.level);
        const beerBottom = height;
        
        this.x = width * 0.2 + Math.random() * width * 0.6;
        this.y = beerBottom - Math.random() * 50;
        this.radius = 1 + Math.random() * 3;
        this.speed = 0.5 + Math.random() * 1.5;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.03 + Math.random() * 0.05;
        this.opacity = 0.3 + Math.random() * 0.4;
        this.alive = true;
      }

      update() {
        const beerTop = height * (1 - beer.level);
        
        // Move up
        this.y -= this.speed;
        
        // Wobble
        this.wobble += this.wobbleSpeed;
        this.x += Math.sin(this.wobble) * 0.5;
        
        // Add tilt influence
        this.x += beer.tilt.x * 0.3;
        this.y += beer.tilt.y * 0.3;
        
        // Check if reached foam or out of beer
        if (this.y < beerTop || this.x < 0 || this.x > width || this.y > height) {
          this.alive = false;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        
        // Bubble
        const gradient = ctx.createRadialGradient(
          this.x - this.radius * 0.3, 
          this.y - this.radius * 0.3, 
          0,
          this.x, 
          this.y, 
          this.radius
        );
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0.1)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.4, this.y - this.radius * 0.4, this.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
    }

    // Initialize bubbles
    for (let i = 0; i < 50; i++) {
      bubbles.push(new Bubble());
    }

    // ==================== FOAM ====================
    const foamParticles = [];

    class FoamParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 5 + Math.random() * 15;
        this.opacity = 0.6 + Math.random() * 0.4;
        this.life = 1.0;
        this.decay = 0.002 + Math.random() * 0.003;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = -0.2 - Math.random() * 0.5;
      }

      update() {
        this.x += this.vx + beer.tilt.x * 0.5;
        this.y += this.vy + beer.tilt.y * 0.3;
        this.life -= this.decay;
        this.vy += 0.01; // Slight gravity
        
        // Boundary check
        if (this.x < 0 || this.x > width || this.y > height) {
          this.life = 0;
        }
      }

      draw() {
        if (this.life <= 0) return;
        
        ctx.save();
        ctx.globalAlpha = this.opacity * this.life;
        
        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.radius
        );
        gradient.addColorStop(0, beer.color.foam);
        gradient.addColorStop(0.7, beer.color.foamDark);
        gradient.addColorStop(1, 'rgba(255, 248, 220, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }

      isDead() {
        return this.life <= 0;
      }
    }

    // ==================== DEVICE ORIENTATION ====================
    let lastTilt = { x: 0, y: 0 };

    function handleOrientation(event) {
      if (!permissionGranted) return;

      // beta: front-to-back tilt (-180 to 180)
      // gamma: left-to-right tilt (-90 to 90)
      let beta = event.beta || 0;
      let gamma = event.gamma || 0;

      // Normalize values
      // When phone is upright: beta ≈ 90, gamma ≈ 0
      // Adjust so 0 is upright
      beta = beta - 90;

      // Map to our coordinate system
      // gamma: negative = tilt right, positive = tilt left
      // beta: negative = tilt toward user, positive = tilt away
      
      beer.tilt.x = gamma * 0.5; // Horizontal tilt
      beer.tilt.y = beta * 0.3; // Forward/backward tilt

      // Clamp values
      beer.tilt.x = Math.max(-30, Math.min(30, beer.tilt.x));
      beer.tilt.y = Math.max(-20, Math.min(20, beer.tilt.y));

      // Calculate drain rate based on tilt
      const tiltAmount = Math.abs(beta);
      
      // Start pouring at 45 degrees
      if (tiltAmount > 45) {
        beer.pouring = true;
        beer.drainRate = (tiltAmount - 45) * 0.0003;
      } else {
        beer.pouring = false;
        beer.drainRate = 0;
      }
    }

    async function requestPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            permissionGranted = true;
            window.addEventListener('deviceorientation', handleOrientation);
            return true;
          }
        } catch (error) {
          console.error('Permission denied:', error);
          alert('È necessario il permesso per usare l\'accelerometro!');
          return false;
        }
      } else {
        // Not iOS, just add listener
        permissionGranted = true;
        window.addEventListener('deviceorientation', handleOrientation);
        return true;
      }
      return false;
    }

    // ==================== RENDERING ====================
    function drawBeer() {
      // Calculate beer height
      const beerHeight = height * beer.level;
      const beerTop = height - beerHeight;
      
      // Liquid offset for tilting effect
      const maxOffset = 40;
      beer.liquidOffset.x += (beer.tilt.x - beer.liquidOffset.x) * 0.1;
      beer.liquidOffset.y += (beer.tilt.y - beer.liquidOffset.y) * 0.1;
      
      const offsetX = Math.max(-maxOffset, Math.min(maxOffset, beer.liquidOffset.x));
      const offsetY = Math.max(-maxOffset, Math.min(maxOffset, beer.liquidOffset.y));

      if (beerHeight > 0) {
        ctx.save();
        
        // Beer surface curve (affected by tilt)
        const surfaceCurve = 20 + Math.abs(offsetX) * 0.5;
        
        // Draw beer liquid
        const beerGradient = ctx.createLinearGradient(0, beerTop, 0, height);
        beerGradient.addColorStop(0, beer.color.beer);
        beerGradient.addColorStop(0.5, beer.color.beerDark);
        beerGradient.addColorStop(1, 'rgba(200, 120, 10, 0.95)');
        
        ctx.fillStyle = beerGradient;
        ctx.beginPath();
        
        // Top curve (beer surface)
        ctx.moveTo(0, beerTop + offsetY);
        ctx.bezierCurveTo(
          width * 0.3, beerTop + offsetY - surfaceCurve + offsetX,
          width * 0.7, beerTop + offsetY - surfaceCurve - offsetX,
          width, beerTop + offsetY
        );
        
        // Right side
        ctx.lineTo(width, height);
        
        // Bottom
        ctx.lineTo(0, height);
        
        // Left side
        ctx.closePath();
        ctx.fill();
        
        // Add shine/reflection on beer
        const shineGradient = ctx.createLinearGradient(width * 0.1, 0, width * 0.3, 0);
        shineGradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
        shineGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.15)');
        shineGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        
        ctx.fillStyle = shineGradient;
        ctx.fillRect(width * 0.1, beerTop, width * 0.2, beerHeight);
        
        ctx.restore();
      }
    }

    function drawFoam() {
      const beerHeight = height * beer.level;
      const beerTop = height - beerHeight;
      const foamHeight = Math.min(beerHeight * 0.15, 80);
      
      if (foamHeight > 0 && beer.level > 0.05) {
        ctx.save();
        
        const offsetX = beer.liquidOffset.x;
        const offsetY = beer.liquidOffset.y;
        
        // Draw foam layer
        const foamGradient = ctx.createLinearGradient(0, beerTop - foamHeight, 0, beerTop);
        foamGradient.addColorStop(0, beer.color.foam);
        foamGradient.addColorStop(0.7, beer.color.foamDark);
        foamGradient.addColorStop(1, 'rgba(255, 240, 200, 0.7)');
        
        ctx.fillStyle = foamGradient;
        ctx.beginPath();
        
        // Foamy top edge
        ctx.moveTo(0, beerTop - foamHeight + offsetY);
        
        const foamBubbles = 12;
        for (let i = 0; i <= foamBubbles; i++) {
          const x = (width / foamBubbles) * i;
          const y = beerTop - foamHeight + offsetY + 
                   Math.sin(Date.now() * 0.003 + i) * 5 +
                   (Math.random() - 0.5) * 3;
          
          if (i === 0) {
            ctx.lineTo(x, y);
          } else {
            const prevX = (width / foamBubbles) * (i - 1);
            const prevY = beerTop - foamHeight + offsetY + 
                         Math.sin(Date.now() * 0.003 + (i - 1)) * 5;
            const cpX = (prevX + x) / 2;
            const cpY = (prevY + y) / 2 - 10;
            ctx.quadraticCurveTo(cpX, cpY, x, y);
          }
        }
        
        // Bottom curve matching beer surface
        ctx.bezierCurveTo(
          width * 0.9, beerTop + offsetY - 20 - offsetX * 0.5,
          width * 0.1, beerTop + offsetY - 20 + offsetX * 0.5,
          0, beerTop + offsetY
        );
        
        ctx.closePath();
        ctx.fill();
        
        // Foam highlights
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        for (let i = 0; i < foamBubbles * 2; i++) {
          const x = Math.random() * width;
          const y = beerTop - Math.random() * foamHeight;
          const radius = 2 + Math.random() * 4;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
        
        ctx.restore();
      }
    }

    function updateBubbles() {
      const beerHeight = height * beer.level;
      
      if (beerHeight > 50) {
        // Update existing bubbles
        for (let i = bubbles.length - 1; i >= 0; i--) {
          bubbles[i].update();
          
          if (!bubbles[i].alive) {
            bubbles[i].reset();
          }
        }
        
        // Spawn new bubbles randomly
        if (Math.random() < 0.3 && bubbles.length < 80) {
          bubbles.push(new Bubble());
        }
      }
    }

    function drawBubbles() {
      bubbles.forEach(bubble => {
        if (bubble.alive) {
          bubble.draw();
        }
      });
    }

    function updateFoam() {
      // Update existing foam particles
      for (let i = foamParticles.length - 1; i >= 0; i--) {
        foamParticles[i].update();
        
        if (foamParticles[i].isDead()) {
          foamParticles.splice(i, 1);
        }
      }
      
      // Create new foam when pouring
      if (beer.pouring && Math.random() < 0.3) {
        const beerHeight = height * beer.level;
        const beerTop = height - beerHeight;
        
        // Foam drips from the tilted edge
        const spawnX = beer.tilt.x > 0 ? width * 0.8 : width * 0.2;
        const spawnY = beerTop + Math.random() * 20;
        
        foamParticles.push(new FoamParticle(spawnX, spawnY));
      }
      
      // Random foam bubbles on top
      if (beer.level > 0.1 && Math.random() < 0.05 && foamParticles.length < 100) {
        const beerHeight = height * beer.level;
        const beerTop = height - beerHeight;
        const foamZone = 40;
        
        const x = width * 0.2 + Math.random() * width * 0.6;
        const y = beerTop - Math.random() * foamZone;
        
        foamParticles.push(new FoamParticle(x, y));
      }
    }

    function drawFoamParticles() {
      foamParticles.forEach(particle => particle.draw());
    }

    // ==================== GAME LOOP ====================
    function animate() {
      // Clear canvas
      ctx.clearRect(0, 0, width, height);
      
      // Update beer level (drain when pouring)
      if (beer.pouring && beer.level > 0) {
        beer.level = Math.max(0, beer.level - beer.drainRate);
      }
      
      // Smooth level changes
      beer.level += (beer.targetLevel - beer.level) * 0.02;
      
      // Draw everything
      drawBeer();
      updateBubbles();
      drawBubbles();
      drawFoam();
      updateFoam();
      drawFoamParticles();
      
      // Visual feedback when pouring
      if (beer.pouring && beer.level > 0) {
        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }
      
      animationId = requestAnimationFrame(animate);
    }

    // ==================== CONTROLS ====================
    document.getElementById('startBtn').addEventListener('click', async () => {
      const success = await requestPermission();
      
      if (success) {
        document.getElementById('startScreen').classList.add('hidden');
        animate();
      }
    });

    document.getElementById('fillBtn').addEventListener('click', () => {
      beer.targetLevel = 0.85;
      
      // Add filling animation
      const fillInterval = setInterval(() => {
        if (beer.level >= beer.targetLevel - 0.05) {
          clearInterval(fillInterval);
        }
        
        // Add foam particles during fill
        const beerHeight = height * beer.level;
        const beerTop = height - beerHeight;
        
        for (let i = 0; i < 3; i++) {
          const x = width * 0.3 + Math.random() * width * 0.4;
          const y = beerTop - 20 + Math.random() * 30;
          foamParticles.push(new FoamParticle(x, y));
        }
      }, 50);
      
      // Haptic feedback if available
      if (navigator.vibrate) {
        navigator.vibrate(200);
      }
    });

    // Desktop testing with mouse
    if (window.innerWidth > 768) {
      let mouseDown = false;
      let lastMouseX = width / 2;
      let lastMouseY = height / 2;
      
      canvas.addEventListener('mousedown', () => mouseDown = true);
      canvas.addEventListener('mouseup', () => mouseDown = false);
      
      canvas.addEventListener('mousemove', (e) => {
        if (mouseDown) {
          const dx = e.clientX - lastMouseX;
          const dy = e.clientY - lastMouseY;
          
          beer.tilt.x = (e.clientX - width / 2) / 10;
          beer.tilt.y = (e.clientY - height / 2) / 10;
          
          // Simulate pouring on large movements
          if (Math.abs(beer.tilt.x) > 15 || Math.abs(beer.tilt.y) > 10) {
            beer.pouring = true;
            beer.drainRate = 0.001;
          } else {
            beer.pouring = false;
            beer.drainRate = 0;
          }
        }
        
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });
      
      // Auto-start on desktop
      document.getElementById('instructions').textContent = 'Clicca e trascina per inclinare!';
      setTimeout(() => {
        document.getElementById('startBtn').click();
      }, 100);
    }

    // Prevent default touch behavior
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
