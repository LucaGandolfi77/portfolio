<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<meta name="description" content="Fractal Observatory — 11 fractals, creative parameters, neon rendering, export and offline PWA.">
<title>Fractal Observatory — Sierpinski &amp; Friends</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/sierpinski/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="Fractal Observatory" data-id="sierpinski"
  data-back="../../projects.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<main id="app">
  <div id="stage"><canvas id="cv" aria-label="Fractal canvas"></canvas></div>
  <div id="hud" role="status" aria-live="polite">FPS 60 · 0 elems</div>
  <div class="top-actions">
    <button class="btn ghost" id="howBtn" data-i18n="how">How to use</button>
    <button class="btn ghost" id="langBtn">IT / EN</button>
  </div>

  <section id="sheet">
    <button id="sheetHandle" aria-label="Toggle controls"><span class="grip"></span><span data-i18n="params">Parameters</span></button>
    <div class="sheet-body">
      <div class="stab-row">
        <button class="stab on" data-stab="forms" data-i18n="forms">Forms</button>
        <button class="stab" data-stab="params" data-i18n="params">Parameters</button>
        <button class="stab" data-stab="style" data-i18n="style">Style</button>
        <button class="stab" data-stab="actions" data-i18n="actions">Actions</button>
      </div>

      <div class="stab-panel" id="panel-forms">
        <div class="form-tabs" id="formTabs"></div>
        <h3 data-i18n="presets">Presets</h3>
        <div class="chip-row" id="presetChips"></div>
        <div class="chip-row" id="favChips"></div>
      </div>

      <div class="stab-panel hidden" id="panel-params"><div id="paramsBox"></div></div>

      <div class="stab-panel hidden" id="panel-style">
        <h3 data-i18n="palette">Palette</h3><div class="pal-row" id="palRow"></div>
        <div class="prow"><label data-i18n="glow">Glow</label><input id="glowRange" type="range" min="0" max="40" value="12"><span class="pv" id="glowVal">12</span></div>
        <div class="prow"><label data-i18n="symmetry">Symmetry</label><input id="symRange" type="range" min="1" max="12" value="1"><span class="pv" id="symVal">×1</span></div>
        <div class="prow"><label data-i18n="blend">Blend mode</label><select id="blendSel"><option value="lighter">Add</option><option value="screen">Screen</option><option value="source-over">Normal</option></select></div>
        <div class="prow"><label data-i18n="background">Background</label><select id="bgSel"><option value="stars" data-i18n="stars">Stars</option><option value="grid" data-i18n="grid">Grid</option><option value="plain" data-i18n="plain">Plain</option></select></div>
        <div class="tgl-row">
          <button class="tgl" id="spinBtn"><span class="led"></span><span data-i18n="spin">Auto-spin</span></button>
          <button class="tgl on" id="revealBtn"><span class="led"></span><span data-i18n="reveal">Animated reveal</span></button>
        </div>
      </div>

      <div class="stab-panel hidden" id="panel-actions">
        <div class="action-grid">
          <button class="btn primary" id="randomBtn" data-i18n="random">Randomize</button>
          <button class="btn" id="saveBtn" data-i18n="save">Save preset</button>
          <button class="btn" id="favBtn" data-i18n="favorite">Favorites</button>
          <button class="btn" id="resetCamBtn" data-i18n="reset">Reset camera</button>
          <button class="btn" id="pngBtn" data-i18n="exportPng">Export PNG</button>
          <button class="btn" id="svgBtn" data-i18n="exportSvg">Export SVG</button>
          <button class="btn" id="copyBtn" data-i18n="copy">Copy link</button>
        </div>
        <p class="hint">🖐 <span data-i18n="drag">Drag</span> · 🤏 <span data-i18n="pinch">pinch</span> · 🔄 <span data-i18n="twist">two-finger twist</span> · <span data-i18n="resetHint">double-tap = reset</span></p>
      </div>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div></div>
</div>
<script type="module" src="js/main.js"></script>
<script src="../_shared/shell.js" defer></script>
</body>
</html>
