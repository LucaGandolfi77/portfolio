<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0f22" />
<title>Offline — Radio</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(circle at 50% 0%,#14224a,#070b1a 70%);color:#eaf2ff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:20px}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:32px;max-width:380px}
  h1{color:#00e0ff;font-size:1.6rem;margin-bottom:8px}
  p{color:#93a7c6;font-size:.9rem;line-height:1.5;margin-bottom:20px}
  button{padding:11px 22px;border:none;border-radius:99px;background:linear-gradient(135deg,#00e0ff,#8b6cff);color:#031018;font-weight:800;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <h1>📻 Sei offline</h1>
    <p>La pagina non è in cache. Torna online una volta per scaricare Radio, poi potrai ascoltare le 50 stazioni del catalogo locale senza connessione.</p>
    <button type="button" onclick="location.replace('./index.html')">Riprova</button>
  </div>
</body>
</html>
