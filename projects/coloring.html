<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Coloring Book</title>
	<style>
		body{ margin:0; font-family:Inter, system-ui; background:#fafafa }
		#wrap{ display:flex; gap:12px; padding:12px }
		canvas{ background:#fff; border:1px solid #ddd }
		.palette{ display:flex; gap:8px; flex-wrap:wrap }
		.sw{ width:32px; height:32px; border-radius:4px; cursor:pointer; border:2px solid #eee }
	</style>
</head>
<body>
	<div id="wrap">
		<div>
			<div class="palette" id="palette"></div>
			<button id="fill">Fill Bucket</button>
		</div>
		<canvas id="c" width="600" height="600"></canvas>
	</div>
	<script>
		const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
		function drawOutline(){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(300,300,180,0,Math.PI*2); ctx.moveTo(220,260); ctx.arc(260,260,40,0,Math.PI*2); ctx.moveTo(340,260); ctx.arc(340,260,40,0,Math.PI*2); ctx.moveTo(220,370); ctx.quadraticCurveTo(300,430,380,370); ctx.stroke(); }
		drawOutline();
		const colors = ['#ff3b30','#ff9500','#ffcc00','#34c759','#5ac8fa','#5856d6','#ff2d55','#000000'];
		const pal = document.getElementById('palette'); colors.forEach(c=>{ const d = document.createElement('div'); d.className='sw'; d.style.background=c; d.addEventListener('click', ()=> selected=c); pal.appendChild(d); });
		let selected = colors[0];
		canvas.addEventListener('click', e=>{ const r=canvas.getBoundingClientRect(); const x=e.clientX-r.left; const y=e.clientY-r.top; // simple flood fill
			const img = ctx.getImageData(0,0,canvas.width,canvas.height); const start=((y|0)*canvas.width+(x|0))*4; const target = img.data.slice(start,start+4); const fill = hexToRgb(selected);
			if(compareColor(target, fill)) return; const stack=[start]; while(stack.length){ const idx=stack.pop(); const sx = idx/4 % canvas.width|0; const sy = idx/4 / canvas.width|0; if(sy<0||sy>=canvas.height) continue; const di = idx; const cur = [img.data[di],img.data[di+1],img.data[di+2],img.data[di+3]]; if(!compareColor(cur,target)) continue; img.data[di]=fill[0]; img.data[di+1]=fill[1]; img.data[di+2]=fill[2]; img.data[di+3]=255; stack.push(((sy+1)*canvas.width+sx)*4); stack.push(((sy-1)*canvas.width+sx)*4); stack.push((sy*canvas.width+(sx+1))*4); stack.push((sy*canvas.width+(sx-1))*4); }
			ctx.putImageData(img,0,0);
		});
		function hexToRgb(hex){ hex=hex.replace('#',''); return [parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)]; }
		function compareColor(a,b){ return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]&&a[3]===255; }
	</script>
</body>
</html>
