<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
	<title>Coloring Studio</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
	<style>
		*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
		html,body{height:100%}
		body{
			margin:0;font-family:'Inter',system-ui,sans-serif;color:#eaf2ff;
			background:radial-gradient(1200px 600px at 80% -10%,#16324f 0%,transparent 60%),
			           radial-gradient(900px 500px at -10% 110%,#2b1b4d 0%,transparent 55%),
			           #0b0f17;
			display:flex;flex-direction:column;overflow:hidden;user-select:none
		}
		header{
			display:flex;align-items:center;gap:14px;padding:12px 18px 8px;
			padding-left:110px;flex-wrap:wrap
		}
		header h1{
			margin:0;font-size:clamp(18px,3.4vw,26px);font-weight:800;letter-spacing:.5px;
			background:linear-gradient(90deg,#00d4ff,#7c4dff,#ff5d8f,#ffb703);
			background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
			animation:hue 8s linear infinite
		}
		@keyframes hue{to{background-position:300% 0}}
		header .spacer{flex:1}
		.hbtn{
			border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#eaf2ff;
			font-family:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:12px;
			cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s
		}
		.hbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.13)}
		.hbtn.accent{
			background:linear-gradient(135deg,#00d4ff,#7c4dff);border:none;color:#00131f;
			box-shadow:0 4px 18px rgba(0,212,255,.35)
		}
		/* template chips */
		#tplBar{
			display:flex;gap:8px;padding:6px 18px 10px;overflow-x:auto;scrollbar-width:none
		}
		#tplBar::-webkit-scrollbar{display:none}
		.chip{
			flex-shrink:0;display:flex;align-items:center;gap:6px;cursor:pointer;
			border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#cfe0f5;
			font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;
			transition:all .15s
		}
		.chip:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
		.chip.active{
			background:linear-gradient(135deg,rgba(0,212,255,.25),rgba(124,77,255,.25));
			border-color:#00d4ff;color:#fff;box-shadow:0 0 14px rgba(0,212,255,.35)
		}
		/* layout */
		#stage{flex:1;display:flex;gap:14px;padding:0 18px 16px;min-height:0}
		#toolbar{
			width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;
			background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
			border-radius:18px;padding:12px;overflow-y:auto;scrollbar-width:thin
		}
		.tlabel{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#7fa3c8;margin:2px 0 -4px}
		.tools{display:flex;flex-wrap:wrap;gap:8px}
		.tool{
			width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
			background:rgba(255,255,255,.06);font-size:20px;cursor:pointer;line-height:1;
			display:flex;align-items:center;justify-content:center;transition:all .15s;color:#eaf2ff
		}
		.tool:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
		.tool.active{
			background:linear-gradient(135deg,#00d4ff,#7c4dff);border-color:transparent;
			box-shadow:0 4px 16px rgba(0,212,255,.45)
		}
		.sliderRow{display:flex;align-items:center;gap:8px;font-size:12px;color:#bcd3ea}
		.sliderRow b{min-width:24px;text-align:right;color:#fff;font-weight:600}
		input[type=range]{flex:1;accent-color:#00d4ff;height:20px}
		.hidden{display:none!important}
		.photoGroup{display:flex;gap:6px}
		.pbtn{
			flex:1;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#cfe0f5;
			font-family:inherit;font-size:11.5px;font-weight:600;padding:7px 4px;border-radius:9px;cursor:pointer;transition:all .15s
		}
		.pbtn:hover{background:rgba(255,255,255,.12)}
		.pbtn.active{background:linear-gradient(135deg,rgba(0,212,255,.3),rgba(124,77,255,.3));border-color:#00d4ff;color:#fff}
		.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
		.sw{
			aspect-ratio:1;border-radius:9px;cursor:pointer;border:2px solid rgba(255,255,255,.15);
			transition:transform .12s,border-color .12s
		}
		.sw:hover{transform:scale(1.12)}
		.sw.active{border-color:#fff;transform:scale(1.12);box-shadow:0 0 10px rgba(255,255,255,.4)}
		.customWrap{position:relative;display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#bcd3ea}
		input[type=color]{
			width:34px;height:34px;border:none;border-radius:9px;background:none;cursor:pointer;padding:0
		}
		input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
		input[type=color]::-webkit-color-swatch{border-radius:7px;border:2px solid rgba(255,255,255,.3)}
		.actions{display:flex;gap:8px}
		.abtn{
			flex:1;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#eaf2ff;
			font-family:inherit;font-size:12px;font-weight:600;padding:9px 2px;border-radius:10px;cursor:pointer;transition:all .15s
		}
		.abtn:hover:not(:disabled){background:rgba(255,255,255,.13);transform:translateY(-1px)}
		.abtn:disabled{opacity:.35;cursor:default}
		.abtn.danger:hover{background:rgba(230,57,70,.25);border-color:#e63946}
		/* canvas */
		#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
		#c{
			background:#fff;border-radius:16px;touch-action:none;cursor:crosshair;
			box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12)
		}
		#ring{
			position:absolute;border:2px solid rgba(255,255,255,.9);border-radius:50%;
			pointer-events:none;box-shadow:0 0 8px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.3);
			transform:translate(-50%,-50%);display:none;z-index:5
		}
		/* toast */
		#toast{
			position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
			background:rgba(10,16,28,.92);border:1px solid rgba(0,212,255,.4);color:#fff;
			padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;
			transition:all .25s;pointer-events:none;z-index:100;white-space:nowrap
		}
		#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
		/* mobile */
		@media (max-width:760px){
			header{padding-left:96px;padding-top:54px}
			#stage{flex-direction:column-reverse;padding:0 10px 10px;gap:8px}
			#toolbar{
				width:100%;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;
				padding:8px;border-radius:14px;scrollbar-width:none;gap:10px
			}
			#toolbar::-webkit-scrollbar{display:none}
			.tools{flex-wrap:nowrap}
			.palette{grid-template-columns:repeat(6,26px);gap:5px}
			.sw{border-radius:7px}
			.customWrap input[type=color]{width:26px;height:26px}
			.actions{flex-wrap:nowrap}
			.sliderRow{min-width:130px}
			.tlabel{display:none}
		}
	</style>
</head>
<body>
	<header>
		<h1>&#127912; COLORING STUDIO</h1>
		<div class="spacer"></div>
		<button class="hbtn" id="uploadBtn" title="Draw on your own photo">&#128247; Upload Photo</button>
		<button class="hbtn accent" id="saveBtn" title="Download as PNG">&#128190; Save</button>
	</header>

	<div id="tplBar"></div>

	<div id="stage">
		<aside id="toolbar">
			<div class="tlabel">Tools</div>
			<div class="tools">
				<button class="tool active" data-tool="fill"    title="Fill bucket">&#129703;</button>
				<button class="tool"        data-tool="brush"   title="Brush">&#128396;&#65039;</button>
				<button class="tool"        data-tool="rainbow" title="Rainbow brush">&#127752;</button>
				<button class="tool"        data-tool="spray"   title="Spray">&#128168;</button>
				<button class="tool"        data-tool="eraser"  title="Eraser">&#129523;</button>
			</div>
			<div class="sliderRow">&#128396;&#65039; <input type="range" id="sizeR" min="4" max="80" value="28"><b id="sizeV">28</b></div>
			<div class="sliderRow" id="tolRow">&#127919; <input type="range" id="tolR" min="4" max="96" value="32"><b id="tolV">32</b></div>

			<div id="photoGroup" class="hidden">
				<div class="tlabel">Photo Mode</div>
				<div class="photoGroup">
					<button class="pbtn active" data-pmode="original">Color</button>
					<button class="pbtn" data-pmode="gray">B&amp;W</button>
					<button class="pbtn" data-pmode="edges">Outlines</button>
				</div>
			</div>

			<div class="tlabel">Colors</div>
			<div class="palette" id="palette"></div>
			<label class="customWrap"><input type="color" id="customColor" value="#00d4ff"> Custom color</label>

			<div class="tlabel">Actions</div>
			<div class="actions">
				<button class="abtn" id="undoBtn" title="Ctrl+Z">&#8630; Undo</button>
				<button class="abtn" id="redoBtn" title="Ctrl+Y">&#8631; Redo</button>
			</div>
			<div class="actions">
				<button class="abtn danger" id="clearBtn">&#128465;&#65039; Clear</button>
			</div>
		</aside>

		<div id="canvasWrap">
			<canvas id="c" width="1000" height="1000"></canvas>
			<div id="ring"></div>
		</div>
	</div>

	<input type="file" id="fileInput" accept="image/*" class="hidden">
	<div id="toast"></div>

	<script>
	"use strict";
	const $ = (id) => document.getElementById(id);
	const canvas = $('c');
	const ctx = canvas.getContext('2d', { willReadFrequently: true });
	const W = canvas.width, H = canvas.height;

	let tool = 'fill', color = '#e63946', size = 28, tol = 32;
	let drawing = false, last = null, rbHue = 0;
	let photoImg = null, photoMode = 'original', currentTpl = 'smiley';

	/* ---------------- toast ---------------- */
	let toastT = 0;
	function toast(msg, ms) {
		const el = $('toast');
		el.textContent = msg;
		el.classList.add('show');
		clearTimeout(toastT);
		toastT = setTimeout(() => el.classList.remove('show'), ms || 1600);
	}

	/* ---------------- undo / redo ---------------- */
	const MAXH = 25;
	let hist = [], hi = -1;
	function snapshot() {
		hist = hist.slice(0, hi + 1);
		hist.push(canvas.toDataURL('image/png'));
		if (hist.length > MAXH) hist.shift();
		hi = hist.length - 1;
		updateHistBtns();
	}
	function restore(i) {
		const im = new Image();
		im.onload = () => ctx.drawImage(im, 0, 0);
		im.src = hist[i];
	}
	function undo() { if (hi > 0) { hi--; restore(hi); updateHistBtns(); } }
	function redo() { if (hi < hist.length - 1) { hi++; restore(hi); updateHistBtns(); } }
	function updateHistBtns() {
		$('undoBtn').disabled = hi <= 0;
		$('redoBtn').disabled = hi >= hist.length - 1;
	}

	/* ---------------- base rendering ---------------- */
	function pen(s) {
		ctx.strokeStyle = '#000';
		ctx.fillStyle = '#000';
		ctx.lineWidth = s * 0.0075;
		ctx.lineCap = 'round';
		ctx.lineJoin = 'round';
	}
	function renderBase() {
		ctx.globalAlpha = 1;
		ctx.fillStyle = '#fff';
		ctx.fillRect(0, 0, W, H);
		if (photoImg) {
			drawPhoto();
		} else {
			TEMPLATES[currentTpl].draw(W);
		}
	}

	function drawPhoto() {
		const i = photoImg;
		const s = Math.min(W / i.width, H / i.height);
		const dw = Math.round(i.width * s), dh = Math.round(i.height * s);
		const dx = (W - dw) / 2, dy = (H - dh) / 2;
		if (photoMode === 'original') { ctx.drawImage(i, dx, dy, dw, dh); return; }
		const t = document.createElement('canvas');
		t.width = dw; t.height = dh;
		const tc = t.getContext('2d', { willReadFrequently: true });
		tc.drawImage(i, 0, 0, dw, dh);
		const id = tc.getImageData(0, 0, dw, dh);
		if (photoMode === 'gray') toGray(id.data);
		else sobel(id.data, dw, dh);
		tc.putImageData(id, 0, 0);
		ctx.drawImage(t, dx, dy, dw, dh);
	}
	function toGray(d) {
		for (let p = 0; p < d.length; p += 4) {
			const g = d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;
			d[p] = d[p + 1] = d[p + 2] = g;
		}
	}
	function sobel(d, w, h) {
		const g = new Float32Array(w * h);
		for (let i = 0, p = 0; i < g.length; i++, p += 4)
			g[i] = d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;
		d.fill(255);
		for (let y = 1; y < h - 1; y++) {
			for (let x = 1; x < w - 1; x++) {
				const i = y * w + x;
				const gx = -g[i - w - 1] - 2 * g[i - 1] - g[i + w - 1] + g[i - w + 1] + 2 * g[i + 1] + g[i + w + 1];
				const gy = -g[i - w - 1] - 2 * g[i - w] - g[i - w + 1] + g[i + w - 1] + 2 * g[i + w] + g[i + w + 1];
				const m = Math.sqrt(gx * gx + gy * gy) * 1.1;
				if (m > 8) {
					const v = Math.max(0, 255 - m);
					const p = i * 4;
					d[p] = d[p + 1] = d[p + 2] = v;
				}
			}
		}
	}

	/* ---------------- templates ---------------- */
	function ell(c, x, y, rx, ry, rot) {
		c.save(); c.translate(x, y); c.rotate(rot || 0);
		c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.restore();
	}
	const TEMPLATES = {
		smiley: { icon: '\u{1F60A}', name: 'Smiley', draw(s) {
			const c = ctx; pen(s); const cx = s / 2, cy = s / 2;
			c.beginPath(); c.arc(cx, cy, s * .34, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.arc(cx - s * .12, cy - s * .09, s * .045, 0, Math.PI * 2);
			c.arc(cx + s * .12, cy - s * .09, s * .045, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.arc(cx, cy + s * .02, s * .18, Math.PI * .2, Math.PI * .8); c.stroke();
		}},
		cat: { icon: '\u{1F431}', name: 'Cat', draw(s) {
			const c = ctx; pen(s); const cx = s / 2, cy = s * .52;
			c.beginPath();
			c.moveTo(cx - s * .26, cy - s * .12); c.lineTo(cx - s * .2, cy - s * .34); c.lineTo(cx - s * .06, cy - s * .24);
			c.moveTo(cx + s * .26, cy - s * .12); c.lineTo(cx + s * .2, cy - s * .34); c.lineTo(cx + s * .06, cy - s * .24);
			c.stroke();
			c.beginPath(); c.arc(cx, cy, s * .28, 0, Math.PI * 2); c.stroke();
			c.beginPath();
			c.arc(cx - s * .1, cy - s * .04, s * .04, 0, Math.PI * 2);
			c.arc(cx + s * .1, cy - s * .04, s * .04, 0, Math.PI * 2); c.stroke();
			c.beginPath();
			c.moveTo(cx, cy + s * .04); c.lineTo(cx - s * .03, cy + s * .09); c.lineTo(cx + s * .03, cy + s * .09); c.closePath();
			c.stroke();
			c.beginPath();
			c.arc(cx - s * .05, cy + s * .12, s * .045, 0, Math.PI);
			c.arc(cx + s * .05, cy + s * .12, s * .045, 0, Math.PI); c.stroke();
			for (const sd of [-1, 1]) for (let k = 0; k < 3; k++) {
				c.beginPath();
				c.moveTo(cx + sd * s * .16, cy + s * (.02 + k * .05));
				c.lineTo(cx + sd * s * .42, cy + s * (-.04 + k * .07)); c.stroke();
			}
		}},
		butterfly: { icon: '\u{1F98B}', name: 'Butterfly', draw(s) {
			const c = ctx; pen(s); const cx = s / 2, cy = s / 2;
			ell(c, cx, cy, s * .035, s * .17); c.fill();
			c.beginPath(); c.arc(cx, cy - s * .21, s * .045, 0, Math.PI * 2); c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .01, cy - s * .24); c.quadraticCurveTo(cx - s * .1, cy - s * .38, cx - s * .16, cy - s * .36);
			c.moveTo(cx + s * .01, cy - s * .24); c.quadraticCurveTo(cx + s * .1, cy - s * .38, cx + s * .16, cy - s * .36);
			c.stroke();
			for (const sd of [-1, 1]) {
				ell(c, cx + sd * s * .2, cy - s * .1, s * .17, s * .125, sd * -0.45); c.stroke();
				ell(c, cx + sd * s * .165, cy + s * .11, s * .125, s * .095, sd * 0.45); c.stroke();
				c.beginPath(); c.arc(cx + sd * s * .2, cy - s * .11, s * .05, 0, Math.PI * 2); c.stroke();
				c.beginPath(); c.arc(cx + sd * s * .17, cy + s * .1, s * .035, 0, Math.PI * 2); c.stroke();
			}
		}},
		flower: { icon: '\u{1F338}', name: 'Flower', draw(s) {
			const c = ctx; pen(s); const cx = s / 2, cy = s * .38;
			for (let i = 0; i < 8; i++) { ell(c, cx, cy, s * .07, s * .185, i * Math.PI / 4); c.stroke(); }
			c.beginPath(); c.arc(cx, cy, s * .1, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.moveTo(cx, cy + s * .17);
			c.quadraticCurveTo(cx - s * .04, cy + s * .34, cx, cy + s * .5); c.stroke();
			ell(c, cx - s * .1, cy + s * .32, s * .085, s * .04, -0.6); c.stroke();
			ell(c, cx + s * .1, cy + s * .4, s * .085, s * .04, 0.6); c.stroke();
		}},
		heart: { icon: '\u2764\uFE0F', name: 'Heart', draw(s) {
			const c = ctx; pen(s); const cx = s / 2, cy = s * .47;
			c.beginPath();
			c.moveTo(cx, cy + s * .27);
			c.bezierCurveTo(cx - s * .5, cy - s * .08, cx - s * .23, cy - s * .46, cx, cy - s * .13);
			c.bezierCurveTo(cx + s * .23, cy - s * .46, cx + s * .5, cy - s * .08, cx, cy + s * .27);
			c.closePath(); c.stroke();
		}},
		star: { icon: '\u2B50', name: 'Star', draw(s) {
			const c = ctx; pen(s); const cx = s / 2, cy = s / 2;
			c.beginPath();
			for (let i = 0; i < 10; i++) {
				const r = i % 2 ? s * .155 : s * .37;
				const a = -Math.PI / 2 + i * Math.PI / 5;
				const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
				i ? c.lineTo(x, y) : c.moveTo(x, y);
			}
			c.closePath(); c.stroke();
			c.beginPath(); c.arc(cx, cy + s * .02, s * .06, 0, Math.PI * 2); c.stroke();
		}},
		fish: { icon: '\u{1F41F}', name: 'Fish', draw(s) {
			const c = ctx; pen(s); const cx = s * .52, cy = s / 2;
			ell(c, cx, cy, s * .28, s * .17); c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .26, cy);
			c.quadraticCurveTo(cx - s * .4, cy - s * .17, cx - s * .44, cy - s * .16);
			c.quadraticCurveTo(cx - s * .38, cy, cx - s * .44, cy + s * .16);
			c.quadraticCurveTo(cx - s * .4, cy + s * .17, cx - s * .26, cy);
			c.stroke();
			c.beginPath(); c.arc(cx + s * .15, cy - s * .04, s * .035, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.arc(cx + s * .04, cy, s * .1, -Math.PI * .35, Math.PI * .35); c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .02, cy - s * .16); c.quadraticCurveTo(cx + s * .04, cy - s * .28, cx + s * .1, cy - s * .15);
			c.stroke();
			for (let k = 0; k < 3; k++) {
				c.beginPath(); c.arc(cx + s * (.42 + k * .015), cy - s * (.1 + k * .09), s * (.025 + k * .012), 0, Math.PI * 2); c.stroke();
			}
		}},
		house: { icon: '\u{1F3E0}', name: 'House', draw(s) {
			const c = ctx; pen(s); const cx = s / 2;
			c.beginPath(); c.moveTo(cx - s * .42, s * .78); c.lineTo(cx + s * .42, s * .78); c.stroke();
			c.strokeRect(cx - s * .24, s * .44, s * .48, s * .34);
			c.beginPath();
			c.moveTo(cx - s * .3, s * .44); c.lineTo(cx, s * .18); c.lineTo(cx + s * .3, s * .44);
			c.closePath(); c.stroke();
			c.strokeRect(cx - s * .07, s * .56, s * .14, s * .22);
			c.strokeRect(cx - s * .18, s * .49, s * .1, s * .1);
			c.strokeRect(cx + s * .08, s * .49, s * .1, s * .1);
			c.strokeRect(cx + s * .1, s * .24, s * .08, s * .12);
			c.beginPath(); c.arc(cx + s * .34, s * .28, s * .07, 0, Math.PI * 2); c.stroke();
			for (let k = 0; k < 8; k++) {
				const a = k * Math.PI / 4;
				c.beginPath();
				c.moveTo(cx + s * .34 + Math.cos(a) * s * .1, s * .28 + Math.sin(a) * s * .1);
				c.lineTo(cx + s * .34 + Math.cos(a) * s * .13, s * .28 + Math.sin(a) * s * .13);
				c.stroke();
			}
		}},
		rocket: { icon: '\u{1F680}', name: 'Rocket', draw(s) {
			const c = ctx; pen(s); const cx = s / 2;
			c.beginPath();
			c.moveTo(cx, s * .12);
			c.bezierCurveTo(cx + s * .16, s * .26, cx + s * .15, s * .5, cx + s * .13, s * .68);
			c.lineTo(cx - s * .13, s * .68);
			c.bezierCurveTo(cx - s * .15, s * .5, cx - s * .16, s * .26, cx, s * .12);
			c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .13, s * .52); c.lineTo(cx - s * .28, s * .72); c.lineTo(cx - s * .13, s * .68);
			c.moveTo(cx + s * .13, s * .52); c.lineTo(cx + s * .28, s * .72); c.lineTo(cx + s * .13, s * .68);
			c.stroke();
			c.beginPath(); c.arc(cx, s * .36, s * .06, 0, Math.PI * 2); c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .07, s * .7);
			c.quadraticCurveTo(cx, s * .82, cx + s * .07, s * .7);
			c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .035, s * .71);
			c.quadraticCurveTo(cx, s * .88, cx + s * .035, s * .71);
			c.stroke();
		}},
		icecream: { icon: '\u{1F366}', name: 'Ice Cream', draw(s) {
			const c = ctx; pen(s); const cx = s / 2;
			c.beginPath();
			c.moveTo(cx - s * .15, s * .42); c.lineTo(cx, s * .84); c.lineTo(cx + s * .15, s * .42);
			c.closePath(); c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .1, s * .52); c.lineTo(cx + s * .06, s * .62);
			c.moveTo(cx - s * .05, s * .62); c.lineTo(cx + s * .1, s * .51);
			c.stroke();
			c.beginPath(); c.arc(cx - s * .09, s * .33, s * .105, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.arc(cx + s * .09, s * .33, s * .105, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.arc(cx, s * .2, s * .105, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.arc(cx, s * .05, s * .035, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.moveTo(cx, s * .015); c.quadraticCurveTo(cx + s * .04, s * -.04, cx + s * .07, s * -.02); c.stroke();
		}},
		car: { icon: '\u{1F697}', name: 'Car', draw(s) {
			const c = ctx; pen(s); const cx = s / 2;
			c.beginPath();
			c.moveTo(cx - s * .36, s * .6);
			c.lineTo(cx - s * .36, s * .48);
			c.quadraticCurveTo(cx - s * .34, s * .4, cx - s * .22, s * .38);
			c.lineTo(cx - s * .12, s * .26);
			c.quadraticCurveTo(cx - s * .1, s * .24, cx - s * .06, s * .24);
			c.lineTo(cx + s * .1, s * .24);
			c.quadraticCurveTo(cx + s * .14, s * .24, cx + s * .17, s * .27);
			c.lineTo(cx + s * .26, s * .38);
			c.quadraticCurveTo(cx + s * .36, s * .4, cx + s * .36, s * .48);
			c.lineTo(cx + s * .36, s * .6);
			c.closePath(); c.stroke();
			c.beginPath();
			c.moveTo(cx - s * .1, s * .38); c.lineTo(cx - s * .1, s * .27);
			c.moveTo(cx + s * .04, s * .38); c.lineTo(cx + s * .04, s * .27);
			c.moveTo(cx - s * .1, s * .38); c.lineTo(cx + s * .17, s * .38);
			c.stroke();
			for (const xd of [-.2, .2]) {
				c.beginPath(); c.arc(cx + s * xd, s * .6, s * .085, 0, Math.PI * 2); c.stroke();
				c.beginPath(); c.arc(cx + s * xd, s * .6, s * .035, 0, Math.PI * 2); c.stroke();
			}
			c.beginPath(); c.moveTo(cx - s * .44, s * .72); c.lineTo(cx + s * .44, s * .72); c.stroke();
		}},
		mandala: { icon: '\u{1F3B4}', name: 'Mandala', draw(s) {
			const c = ctx; pen(s); c.lineWidth = s * 0.0045;
			const cx = s / 2, cy = s / 2;
			let seed = (Math.random() * 1e9) | 0;
			const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
			const rings = 3 + ((rnd() * 2) | 0);
			c.beginPath(); c.arc(cx, cy, s * .06, 0, Math.PI * 2); c.stroke();
			c.beginPath(); c.arc(cx, cy, s * .12, 0, Math.PI * 2); c.stroke();
			for (let r = 0; r < rings; r++) {
				const rad = s * (.2 + r * (.26 / rings));
				const n = 6 + ((rnd() * 9) | 0);
				const prx = rad * (.5 + rnd() * .3), pry = rad * (.85 + rnd() * .5);
				for (let i = 0; i < n; i++) {
					const a = i * 2 * Math.PI / n;
					ell(c, cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, prx, pry, a + Math.PI / 2);
					c.stroke();
				}
			}
			const bumps = 12 + ((rnd() * 12) | 0);
			const br = s * (.44 + rnd() * .04);
			c.beginPath();
			for (let i = 0; i <= bumps * 8; i++) {
				const a = i / (bumps * 8) * 2 * Math.PI;
				const rr = br * (1 + 0.045 * Math.sin(a * bumps));
				const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
				i ? c.lineTo(x, y) : c.moveTo(x, y);
			}
			c.stroke();
		}}
	};

	/* ---------------- flood fill (scanline + tolerance) ---------------- */
	function hexToRgb(hex) {
		const h = hex.replace('#', '');
		return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
	}
	function floodFill(sx, sy) {
		sx |= 0; sy |= 0;
		if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
		const img = ctx.getImageData(0, 0, W, H), d = img.data;
		const sp = (sy * W + sx) * 4;
		const tr = d[sp], tg = d[sp + 1], tb = d[sp + 2];
		const fc = hexToRgb(tool === 'eraser' ? '#ffffff' : color);
		const t2 = tol * tol;
		const dr0 = fc[0] - tr, dg0 = fc[1] - tg, db0 = fc[2] - tb;
		if (dr0 * dr0 + dg0 * dg0 + db0 * db0 <= t2) return;
		const seen = new Uint8Array(W * H);
		const stack = [[sx, sy]];
		while (stack.length) {
			const [x, y] = stack.pop();
			let x0 = x;
			while (x0 >= 0 && !seen[y * W + x0] && match(y * W + x0)) x0--;
			x0++;
			let x1 = x;
			while (x1 < W && !seen[y * W + x1] && match(y * W + x1)) x1++;
			x1--;
			let up = false, dn = false;
			for (let xi = x0; xi <= x1; xi++) {
				seen[y * W + xi] = 1;
				const p = (y * W + xi) * 4;
				d[p] = fc[0]; d[p + 1] = fc[1]; d[p + 2] = fc[2]; d[p + 3] = 255;
				if (y > 0) {
					const okUp = !seen[(y - 1) * W + xi] && match((y - 1) * W + xi);
					if (okUp && !up) { stack.push([xi, y - 1]); up = true; }
					else if (!okUp) up = false;
				}
				if (y < H - 1) {
					const okDn = !seen[(y + 1) * W + xi] && match((y + 1) * W + xi);
					if (okDn && !dn) { stack.push([xi, y + 1]); dn = true; }
					else if (!okDn) dn = false;
				}
			}
		}
		function match(pi) {
			const q = pi * 4;
			const a = d[q] - tr, b = d[q + 1] - tg, e = d[q + 2] - tb;
			return a * a + b * b + e * e <= t2;
		}
		ctx.putImageData(img, 0, 0);
	}

	/* ---------------- drawing tools ---------------- */
	function pos(e) {
		const r = canvas.getBoundingClientRect();
		return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
	}
	function strokeSeg(a, b, first) {
		if (tool === 'spray') { sprayAt(b); return; }
		if (tool === 'rainbow') {
			rbHue = (rbHue + 2.2) % 360;
			ctx.strokeStyle = 'hsl(' + rbHue + ',95%,55%)';
		} else if (tool === 'eraser') {
			ctx.strokeStyle = '#ffffff';
		} else {
			ctx.strokeStyle = color;
		}
		ctx.lineWidth = size;
		ctx.lineCap = 'round';
		ctx.lineJoin = 'round';
		if (first) {
			ctx.beginPath();
			ctx.arc(b.x, b.y, size / 2, 0, Math.PI * 2);
			ctx.fillStyle = ctx.strokeStyle;
			ctx.fill();
		} else {
			ctx.beginPath();
			ctx.moveTo(a.x, a.y);
			ctx.lineTo(b.x, b.y);
			ctx.stroke();
		}
	}
	function sprayAt(p) {
		const n = Math.round(size * 1.4);
		ctx.fillStyle = color;
		for (let i = 0; i < n; i++) {
			const a = Math.random() * Math.PI * 2;
			const r = Math.random() * size;
			ctx.globalAlpha = 0.2 + Math.random() * 0.4;
			ctx.beginPath();
			ctx.arc(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 0.7 + Math.random() * 1.4, 0, Math.PI * 2);
			ctx.fill();
		}
		ctx.globalAlpha = 1;
	}

	canvas.addEventListener('pointerdown', (e) => {
		e.preventDefault();
		canvas.setPointerCapture(e.pointerId);
		const p = pos(e);
		if (tool === 'fill') {
			snapshot();
			floodFill(p.x, p.y);
		} else {
			snapshot();
			drawing = true;
			last = p;
			if (tool === 'rainbow') rbHue = Math.random() * 360;
			strokeSeg(p, p, true);
		}
	});
	canvas.addEventListener('pointermove', (e) => {
		moveRing(e);
		if (!drawing) return;
		const p = pos(e);
		strokeSeg(last, p, false);
		last = p;
	});
	const endStroke = () => { drawing = false; };
	canvas.addEventListener('pointerup', endStroke);
	canvas.addEventListener('pointercancel', endStroke);
	canvas.addEventListener('pointerleave', () => { $('ring').style.display = 'none'; });
	canvas.addEventListener('contextmenu', (e) => e.preventDefault());

	/* ---------------- brush cursor ring ---------------- */
	function moveRing(e) {
		if (tool === 'fill') { $('ring').style.display = 'none'; return; }
		const wrap = $('canvasWrap'), ring = $('ring');
		const r = canvas.getBoundingClientRect();
		const wr = wrap.getBoundingClientRect();
		const d = size * r.width / W;
		ring.style.width = ring.style.height = d + 'px';
		ring.style.left = (e.clientX - wr.left) + 'px';
		ring.style.top = (e.clientY - wr.top) + 'px';
		ring.style.display = 'block';
	}

	/* ---------------- toolbar wiring ---------------- */
	document.querySelectorAll('.tool').forEach(btn => {
		btn.addEventListener('click', () => {
			document.querySelectorAll('.tool').forEach(b => b.classList.remove('active'));
			btn.classList.add('active');
			tool = btn.dataset.tool;
			$('tolRow').classList.toggle('hidden', tool !== 'fill');
			$('ring').style.display = 'none';
		});
	});
	$('sizeR').addEventListener('input', (e) => {
		size = +e.target.value;
		$('sizeV').textContent = size;
	});
	$('tolR').addEventListener('input', (e) => {
		tol = +e.target.value;
		$('tolV').textContent = tol;
	});

	const PALETTE = [
		'#e63946','#ff7b00','#ffb703','#ffd166','#90be6d','#38b000',
		'#06d6a0','#00d4ff','#4895ef','#3a86ff','#5e60ce','#7209b7',
		'#b5179e','#f72585','#ff5d8f','#ff8fab','#f4cbaa','#8b5e34',
		'#9ef01a','#caf7cf','#7ec8e3','#8d99ae','#343a40','#111111'
	];
	const palEl = $('palette');
	PALETTE.forEach((cval, i) => {
		const d = document.createElement('div');
		d.className = 'sw' + (i === 0 ? ' active' : '');
		d.style.background = cval;
		d.title = cval;
		d.addEventListener('click', () => setColor(cval, d));
		palEl.appendChild(d);
	});
	function setColor(cval, el) {
		color = cval;
		document.querySelectorAll('.sw').forEach(x => x.classList.remove('active'));
		if (el) el.classList.add('active');
	}
	$('customColor').addEventListener('input', (e) => setColor(e.target.value, null));

	/* ---------------- templates bar ---------------- */
	const barEl = $('tplBar');
	Object.keys(TEMPLATES).forEach(key => {
		const b = document.createElement('button');
		b.className = 'chip' + (key === currentTpl ? ' active' : '');
		b.innerHTML = TEMPLATES[key].icon + ' ' + TEMPLATES[key].name;
		b.addEventListener('click', () => {
			currentTpl = key;
			photoImg = null;
			$('photoGroup').classList.add('hidden');
			document.querySelectorAll('.pbtn').forEach(p => p.classList.remove('active'));
			barEl.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
			b.classList.add('active');
			snapshot();
			renderBase();
			if (key === 'mandala') toast('\u{1F3B4} New mandala generated!');
		});
		barEl.appendChild(b);
	});

	/* ---------------- photo upload ---------------- */
	$('uploadBtn').addEventListener('click', () => $('fileInput').click());
	$('fileInput').addEventListener('change', (e) => {
		const f = e.target.files[0];
		if (!f) return;
		const url = URL.createObjectURL(f);
		const img = new Image();
		img.onload = () => {
			photoImg = img;
			photoMode = 'original';
			document.querySelectorAll('.pbtn').forEach(p => p.classList.toggle('active', p.dataset.pmode === 'original'));
			barEl.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
			$('photoGroup').classList.remove('hidden');
			snapshot();
			renderBase();
			toast('\u{1F4F7} Photo loaded \u2014 draw away!');
			URL.revokeObjectURL(url);
		};
		img.onerror = () => toast('\u26A0\uFE0F Could not load that image');
		img.src = url;
		e.target.value = '';
	});
	document.querySelectorAll('.pbtn').forEach(btn => {
		btn.addEventListener('click', () => {
			if (!photoImg) return;
			photoMode = btn.dataset.pmode;
			document.querySelectorAll('.pbtn').forEach(p => p.classList.remove('active'));
			btn.classList.add('active');
			snapshot();
			renderBase();
		});
	});

	/* ---------------- actions ---------------- */
	$('undoBtn').addEventListener('click', undo);
	$('redoBtn').addEventListener('click', redo);
	$('clearBtn').addEventListener('click', () => { snapshot(); renderBase(); toast('\u{1F5D1}\uFE0F Cleared'); });
	$('saveBtn').addEventListener('click', () => {
		const a = document.createElement('a');
		a.download = 'coloring-studio-' + Date.now() + '.png';
		a.href = canvas.toDataURL('image/png');
		a.click();
		toast('\U0001F4BE Saved!');
	});
	window.addEventListener('keydown', (e) => {
		if (!(e.ctrlKey || e.metaKey)) return;
		const k = e.key.toLowerCase();
		if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
		else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
	});

	/* ---------------- responsive canvas display ---------------- */
	function fitCanvas() {
		const wrap = $('canvasWrap');
		const pad = 8;
		const s = Math.min(wrap.clientWidth - pad, wrap.clientHeight - pad);
		if (s > 0) {
			canvas.style.width = s + 'px';
			canvas.style.height = s + 'px';
		}
	}
	window.addEventListener('resize', fitCanvas);

	/* ---------------- boot ---------------- */
	renderBase();
	snapshot();
	fitCanvas();
	</script>
</body>
<script src="top_buttons.js"></script>
</html>
