<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070d1a">
<meta name="description" content="Neural Vision: scrivi un numero, la rete neurale lo calcola davvero (TensorFlow.js) e lo vedi pensare in 3D (Three.js).">
<title>NEURAL VISION — Guarda la rete pensare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#070d1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#7c5cff;font-size:clamp(26px,9vw,64px);text-align:center;text-shadow:0 0 30px rgba(124,92,255,.5),0 0 60px rgba(124,92,255,.2);letter-spacing:clamp(3px,1.6vw,12px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#title b{color:#00d4ff;text-shadow:0 0 30px rgba(0,212,255,.6)}
#sub{color:#8fb4d6;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #7c5cff;background:rgba(124,92,255,.08);color:#eaf6ff;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(124,92,255,.2);box-shadow:0 0 24px rgba(124,92,255,.2)}
#credit{position:fixed;bottom:16px;color:#5f7f9f;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">NEURAL <b>VISION</b></div>
  <div id="sub">Scrivi un numero · guarda la rete pensare</div>
  <button id="apri" onclick="window.location.href='neural-vision/index.html'">APRI</button>
</div>
<div id="credit">TensorFlow.js + Three.js — la rete calcola davvero, tu la vedi pensare 🧠</div>

<script>
const c=document.createElement('canvas');document.body.prepend(c);
const x=c.getContext('2d');
let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
window.addEventListener('resize',()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;});

const N=60,p=[];
for(let i=0;i<N;i++)p.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,hue:185+Math.random()*120});

const n1=[],n2=[];
for(let i=0;i<16;i++)for(let j=0;j<16;j++){n1.push({x:j*40+20,y:i*40+20});n2.push({x:j*40+20,y:H-i*40-20});}

function net(t){
  x.fillStyle='#070d1a';x.fillRect(0,0,W,H);
  for(const q of n1){const ph=t*.002+(q.x+q.y)*.05;const r=4+Math.sin(ph)*2.5;x.fillStyle='rgba(0,212,255,'+(0.15+Math.sin(ph)*0.1)+')';x.beginPath();x.arc(q.x,q.y,r,0,6.283);x.fill();}
  for(const q of n2){const ph=t*.002+(q.x+q.y)*.05;x.fillStyle='rgba(124,92,255,'+(0.2+Math.sin(ph+1)*0.12)+')';x.beginPath();x.arc(q.x,q.y,5+Math.sin(ph)*3,0,6.283);x.fill();}
  for(const q of p){q.x+=q.vx;q.y+=q.vy;if(q.x<0||q.x>W)q.vx*=-1;if(q.y<0||q.y>H)q.vy*=-1;x.globalAlpha=.5;x.fillStyle='hsla('+q.hue+',100%,70%,.6)';x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill();}
  x.globalAlpha=1;
  x.strokeStyle='rgba(124,92,255,.12)';
  for(let i=0;i<n1.length;i++){const a2=Math.floor(Math.random()*n2.length);x.beginPath();x.moveTo(n1[i].x,n1[i].y);x.lineTo(n2[a2].x,n2[a2].y);x.stroke();}
  requestAnimationFrame(net);
}
requestAnimationFrame(net);
</script>
</body>
</html>
