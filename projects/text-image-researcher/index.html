<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d1a">
  <meta name="description" content="Web Content Researcher — ricerca parole chiave su siti e sottopagine con ranking, export e interfaccia liquid glass.">
  <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/text-image-researcher/">
  <title>Web Content Researcher</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="app">

  <header class="glass-top">
    <div class="brand">
      <span class="brand-mark">🔍</span>
      <div><h1 data-i18n="app.title">WEB CONTENT RESEARCHER</h1><small data-i18n="app.subtitle">Keyword search across sites</small></div>
    </div>
    <div class="top-actions">
      <button class="glass-btn" id="btnHistory" data-i18n="action.history" title="History">Cronologia</button>
      <div class="export-wrap">
        <button class="glass-btn" id="exportBtn" aria-haspopup="true" aria-expanded="false" data-i18n="action.export">Export</button>
        <div class="export-menu glass-sheet" id="exportMenu">
          <button data-format="json">📄 JSON</button>
          <button data-format="csv">📊 CSV</button>
          <button data-format="md">📝 Markdown</button>
          <button data-format="html">🌐 HTML</button>
        </div>
      </div>
      <button class="glass-icon" id="btnTheme" title="Theme" aria-label="Theme">☀️</button>
      <button class="glass-icon" id="btnLang" title="Language" aria-label="Language">🇮🇹 IT</button>
    </div>
  </header>

  <section class="glass-card search-panel">
    <label class="field-label" for="urlInput" data-i18n="label.url">Website URL</label>
    <div class="search-row">
      <input type="url" id="urlInput" placeholder="https://example.com" aria-label="Website URL" autocomplete="url">
      <button class="glass-btn primary" id="fetchBtn"><span id="fetchBtnText">Search</span></button>
    </div>

    <label class="field-label" for="keywordInput" data-i18n="label.keywords">Keywords</label>
    <div class="search-row">
      <input type="text" id="keywordInput" data-i18n-placeholder="label.keywords" placeholder="Keywords" aria-label="Keywords">
      <button class="glass-btn" id="addKeywordBtn" data-i18n="action.add">Add</button>
    </div>
    <div class="keywords" id="keywordsContainer" role="list"></div>

    <div class="options">
      <label><input type="checkbox" id="caseOpt"> <span data-i18n="label.case">Case sensitive</span></label>
      <label><input type="checkbox" id="regexOpt"> <span data-i18n="label.regex">Regex mode</span></label>
      <label><input type="checkbox" id="deepOpt" checked> <span data-i18n="label.deep">Deep scan subpages</span></label>
      <label><input type="checkbox" id="proxyOpt" checked> Proxies</label>
      <label><span data-i18n="label.maxPages">Max pages</span> <input type="number" id="maxPagesOpt" value="10" min="1" max="200"></label>
      <label><select id="modeSelect">
        <option value="or" data-i18n="label.or">Any word (OR)</option>
        <option value="and" data-i18n="label.and">All words (AND)</option>
      </select></label>
    </div>

    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status-bar" id="statusBar"><span class="dot"></span><span id="statusText">Enter a URL and a keyword to start</span><span class="source-pill" id="sourcePill"></span></div>

    <div class="deep-progress" id="deepProgress">
      <div class="deep-head"><span id="deepText">Scanning 0/0</span><button class="glass-btn small" id="stopBtn" data-i18n="action.stop">Stop</button></div>
      <div class="deep-track"><div class="deep-fill" id="deepBar"></div></div>
      <div id="deepPages" class="deep-pages"></div>
    </div>
  </section>

  <section class="results-panel glass-card" id="tabBar">
    <div class="tabs">
      <button class="tab-btn on" data-tab="links">🔗 <span data-i18n="tab.links">Links</span> <b class="tab-count">0</b></button>
      <button class="tab-btn" data-tab="images">🖼️ <span data-i18n="tab.images">Images</span> <b class="tab-count">0</b></button>
      <button class="tab-btn" data-tab="text">📝 <span data-i18n="tab.text">Text</span> <b class="tab-count">0</b></button>
      <button class="tab-btn" data-tab="headings">📑 <span data-i18n="tab.headings">Headings</span> <b class="tab-count">0</b></button>
      <button class="tab-btn" data-tab="meta">🏷️ <span data-i18n="tab.meta">Meta</span> <b class="tab-count">0</b></button>
      <button class="tab-btn" data-tab="source">🧾 <span data-i18n="tab.source">Source</span> <b class="tab-count">0</b></button>
    </div>
    <div class="filters">
      <input type="text" id="filterInput" data-i18n-placeholder="filter.results" placeholder="Filter results…">
      <input type="text" id="domainInput" data-i18n-placeholder="filter.domain" placeholder="Domain…">
    </div>
    <div id="results-container"><div class="empty-state" id="emptyState">🔎</div><div id="resultsList"></div></div>
  </section>

  <p class="disclaimer" data-i18n="footer.note">Pages are fetched through public sources: do not enter sensitive data.</p>
</div>

<div class="overlay" id="historySheet">
  <div class="glass-sheet history-sheet">
    <div class="sheet-head"><h2 data-i18n="action.history">History</h2><div><button class="glass-btn small" id="historyClear" data-i18n="action.clear">Clear</button><button class="glass-icon" id="historyClose">✕</button></div></div>
    <div id="historyList"></div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>
<script type="module" src="./js/main.js"></script>
<script src="../../top_buttons.js" defer></script>
</body>
</html>
