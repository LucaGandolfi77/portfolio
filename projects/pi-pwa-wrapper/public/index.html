<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1a" />
  <meta name="description" content="Pi Agent PWA — run the Pi coding agent from any browser or as an installed app." />
  <title>Pi Agent PWA</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ======================= Top bar ======================= -->
    <header id="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true">
          <path d="M6 7l2.2 2.2L6 11.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11.5 12.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Pi&nbsp;Agent</span>
      </div>
      <div class="topbar-right">
        <span id="conn-pill" class="pill" title="Server connection">
          <span class="dot" id="conn-dot"></span><span id="conn-label">connecting…</span>
        </span>
        <span id="phase-pill" class="pill" title="Agent process status">
          <span class="dot" id="phase-dot"></span><span id="phase-label">agent…</span>
        </span>
        <span id="model-chip" class="pill hidden" title="Active model"></span>
      </div>
    </header>

    <!-- ======================= Toolbar ======================= -->
    <section id="toolbar" aria-label="Session controls">
      <label class="field workspace-field">
        <span class="field-label">Workspace</span>
        <select id="ws-select" title="Working directory for the agent (read/bash/edit/write run here)"></select>
      </label>
      <label class="field">
        <span class="field-label">Model</span>
        <select id="model-select" disabled><option>loading models…</option></select>
      </label>
      <label class="field">
        <span class="field-label">Thinking</span>
        <select id="think-select" disabled><option>—</option></select>
      </label>
      <div class="toolbar-actions">
        <button id="btn-stats" class="btn ghost" title="Session stats (tokens / cost)">Stats</button>
        <button id="btn-new" class="btn ghost" title="Restart the agent with a fresh session in this workspace">New session</button>
        <button id="btn-clear" class="btn ghost" title="Clear the on-screen transcript (local only)">Clear</button>
        <button id="btn-logs" class="btn ghost" title="Open the diagnostic log (client + server)">Logs</button>
        <button id="btn-settings" class="btn ghost" title="Server connection, token, reconnect">Server</button>
        <button id="btn-help" class="btn ghost" title="About this wrapper & keyboard shortcuts">?</button>
      </div>
    </section>

    <!-- ======================= Transcript ======================= -->
    <main id="transcript" aria-live="polite"></main>

    <!-- extension widgets (setWidget) appear above the composer -->
    <div id="widget-bar"></div>

    <div id="empty-state">
      <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
        <path d="M6 7l2.2 2.2L6 11.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
        <path d="M11.5 12.5h6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h2>Pi Agent PWA</h2>
      <p class="muted">The Pi coding agent in your browser. Pick a workspace and start chatting — the agent can read, run bash, and edit files there.</p>
      <p class="muted small">Try: <em>“List the files in this project and explain the structure”</em></p>
    </div>

    <!-- ======================= Composer ======================= -->
    <footer id="composer-wrap">
      <!-- slash-command suggestions pop above the composer -->
      <div id="cmd-suggest" class="hidden"></div>
      <div id="attachments" class="hidden"></div>
      <div id="composer">
        <button id="attach-btn" class="icon-btn" title="Attach images">🖼️</button>
        <textarea id="composer-text" rows="1" placeholder="Message the agent…  (Enter to send, Shift+Enter for newline, Esc to stop)"></textarea>
        <button id="send-btn" class="btn primary hidden" title="Send (Enter)">Send</button>
        <div id="live-actions" class="hidden">
          <button id="steer-btn" class="btn" title="Queue a steering message delivered as soon as the current turn ends">Steer</button>
          <button id="stop-btn" class="btn danger" title="Stop the agent (Esc)">Stop</button>
        </div>
      </div>
      <div id="composer-sub">
        <span id="queue-info" class="muted small"></span>
        <span id="usage-info" class="muted small"></span>
        <span id="cwd-label" class="muted small"></span>
      </div>
    </footer>
  </div>

  <!-- ======================= Toasts ======================= -->
  <div id="toasts" aria-live="polite"></div>

  <!-- ======================= Modal host (extension UI & dialogs) ======================= -->
  <div id="dlg-host" class="hidden"></div>

  <!-- ======================= Hidden inputs ======================= -->
  <input type="file" id="file-input" accept="image/*" multiple hidden />

  <script src="js/ws-client.js"></script>
  <script src="js/render.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
