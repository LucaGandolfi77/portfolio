<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 2532" role="img" aria-label="Verso il 17 ottobre">
  <!-- Splash iOS: sfondo crema con la traiettoria delle ruote e il titolo -->
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fdf6f0" />
      <stop offset="55%" stop-color="#fbeef0" />
      <stop offset="100%" stop-color="#eee6fa" />
    </linearGradient>
    <linearGradient id="sdisc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdfa" />
      <stop offset="100%" stop-color="#eef3fb" />
    </linearGradient>
  </defs>

  <rect width="1170" height="2532" fill="url(#sbg)" />

  <!-- traiettoria -->
  <path
    d="M-40 1780 C 220 1620, 400 1850, 640 1660 S 1060 1420, 1210 1540"
    fill="none"
    stroke="#e3c795"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="8 16"
    opacity="0.7"
  />

  <g transform="translate(585 1210)">
    <!-- Anello tricolore -->
    <g fill="none" stroke-width="10">
      <path d="M0 -250 A250 250 0 0 1 216.5 -125" stroke="#0e8a52" />
      <path d="M216.5 -125 A250 250 0 0 1 216.5 125" stroke="#f6f2ec" />
      <path d="M216.5 125 A250 250 0 0 1 0 -250" stroke="#d0455a" />
    </g>
    <circle r="236" fill="none" stroke="#e3c795" stroke-width="4" opacity="0.7" />
    <circle r="220" fill="url(#sdisc)" />
    <circle r="170" fill="none" stroke="#e3c795" stroke-width="3" opacity="0.6" />

    <!-- Le otto ruote, a corona sollevata -->
    <g>
      <g transform="translate(0 -160)"><circle r="30" fill="#e79fb4" /><circle r="10" fill="#fffdfa" /></g>
      <g transform="translate(112 -112)"><circle r="30" fill="#d9cdf2" /><circle r="10" fill="#fffdfa" /></g>
      <g transform="translate(158 0)"><circle r="30" fill="#e7bccd" /><circle r="10" fill="#fffdfa" /></g>
      <g transform="translate(112 100)"><circle r="30" fill="#d6ebf6" /><circle r="10" fill="#fffdfa" /></g>
      <g transform="translate(-112 -112)"><circle r="30" fill="#d6ebf6" /><circle r="10" fill="#fffdfa" /></g>
      <g transform="translate(-158 0)"><circle r="30" fill="#e7bccd" /><circle r="10" fill="#fffdfa" /></g>
      <g transform="translate(-112 100)"><circle r="30" fill="#d9cdf2" /><circle r="10" fill="#fffdfa" /></g>
      <g transform="translate(0 118)"><circle r="30" fill="#e79fb4" /><circle r="10" fill="#fffdfa" /></g>
    </g>

    <path d="M0 -62 c10 34 26 50 60 60 c-34 10 -50 26 -60 60 c-10 -34 -26 -50 -60 -60 c34 -10 50 -26 60 -60 z" fill="#e3c795" />

    <text
      x="0"
      y="196"
      text-anchor="middle"
      font-family="ui-rounded, 'SF Pro Rounded', Arial, sans-serif"
      font-size="54"
      font-weight="700"
      letter-spacing="4"
      fill="#8c6f3f"
    >
      MPT
    </text>
  </g>

  <text
    x="585"
    y="1650"
    text-anchor="middle"
    font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif"
    font-size="76"
    font-weight="700"
    fill="#8c6f3f"
    letter-spacing="6"
  >
    VERSO IL 17 OTTOBRE
  </text>
  <text
    x="585"
    y="1730"
    text-anchor="middle"
    font-family="'Iowan Old Style', Palatino, Georgia, serif"
    font-style="italic"
    font-size="44"
    fill="#9b7a8b"
  >
    otto ruote, un solo cuore
  </text>
  <text
    x="585"
    y="1810"
    text-anchor="middle"
    font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif"
    font-size="34"
    fill="#8c6f3f"
    letter-spacing="2"
  >
    MONZA PRECISION TEAM · ITALIA
  </text>
  <text
    x="585"
    y="1866"
    text-anchor="middle"
    font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif"
    font-size="30"
    fill="#9b7a8b"
    letter-spacing="1"
  >
    Campionati del Mondo · Paraguay 2026
  </text>
</svg>
