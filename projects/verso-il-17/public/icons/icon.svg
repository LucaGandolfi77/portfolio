<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Monza Precision Team — Verso il 17 ottobre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6f0" />
      <stop offset="100%" stop-color="#f4d0dd" />
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdfa" />
      <stop offset="60%" stop-color="#f0ecfb" />
      <stop offset="100%" stop-color="#e6f3fa" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Anello tricolore: la nazione che la squadra rappresenta -->
  <g fill="none" stroke-width="9" stroke-linecap="butt">
    <!-- verde: da -90° a +30° -->
    <path d="M256 31 A225 225 0 0 1 451 368.5" stroke="#0e8a52" />
    <!-- bianco: da +30° a +150° -->
    <path d="M451 368.5 A225 225 0 0 1 61 368.5" stroke="#f6f2ec" />
    <!-- rosso: da +150° a +270° -->
    <path d="M61 368.5 A225 225 0 0 1 256 31" stroke="#d0455a" />
  </g>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#e3c795" stroke-width="4" opacity="0.75" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="#e3c795" stroke-width="3" opacity="0.55" />
  <circle cx="256" cy="256" r="203" fill="url(#disc)" />
  <circle cx="256" cy="256" r="158" fill="none" stroke="#e3c795" stroke-width="3" opacity="0.6" />

  <!-- Le otto ruote della squadra, a corona -->
  <g>
    <g transform="translate(256 79)"><circle r="25" fill="#e79fb4" /><circle r="9" fill="#fffdfa" /></g>
    <g transform="translate(344 105)"><circle r="25" fill="#d9cdf2" /><circle r="9" fill="#fffdfa" /></g>
    <g transform="translate(414 179)"><circle r="25" fill="#e7bccd" /><circle r="9" fill="#fffdfa" /></g>
    <g transform="translate(433 269)"><circle r="25" fill="#d6ebf6" /><circle r="9" fill="#fffdfa" /></g>
    <g transform="translate(256 334)"><circle r="25" fill="#e79fb4" /><circle r="9" fill="#fffdfa" /></g>
    <g transform="translate(79 269)"><circle r="25" fill="#d9cdf2" /><circle r="9" fill="#fffdfa" /></g>
    <g transform="translate(98 179)"><circle r="25" fill="#e7bccd" /><circle r="9" fill="#fffdfa" /></g>
    <g transform="translate(168 105)"><circle r="25" fill="#d6ebf6" /><circle r="9" fill="#fffdfa" /></g>
  </g>

  <!-- Stellina champagne al centro della corona -->
  <path
    d="M256 181 c9 30 23 44 53 53 c-30 9 -44 23 -53 53 c-9 -30 -23 -44 -53 -53 c30 -9 44 -23 53 -53 z"
    fill="#e3c795"
  />

  <!-- Sigla della squadra -->
  <text
    x="256"
    y="398"
    text-anchor="middle"
    font-family="ui-rounded, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif"
    font-size="62"
    font-weight="700"
    letter-spacing="2"
    fill="#8c6f3f"
  >
    MPT
  </text>

  <!-- Scintille -->
  <path d="M62 132 c4 14 10 20 24 24 c-14 4 -20 10 -24 24 c-4 -14 -10 -20 -24 -24 c14 -4 20 -10 24 -24 z" fill="#e3c795" opacity="0.9" />
  <path d="M452 356 c3 11 8 16 19 19 c-11 3 -16 8 -19 19 c-3 -11 -8 -16 -19 -19 c11 -3 16 -8 19 -19 z" fill="#e3c795" opacity="0.8" />
</svg>
