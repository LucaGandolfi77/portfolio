<!doctype html>
<html lang="it" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />

    <title>Verso il 17 ottobre ✨ | Monza Precision Team · Mondiali di pattinaggio</title>
    <meta
      name="description"
      content="Il diario segreto del Monza Precision Team verso i Campionati del Mondo di pattinaggio artistico a rotelle sincronizzato in Paraguay: countdown e una casella al giorno fino al 17 ottobre."
    />
    <meta name="author" content="Monza Precision Team" />
    <meta name="keywords" content="Monza Precision Team, MPT, pattinaggio artistico a rotelle sincronizzato, Campionati del Mondo, Paraguay 2026, Italia" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdf6f0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Verso il 17 · MPT" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/icon.svg" color="#e8a2b8" />
    <!-- Sostituisci con il tuo dominio quando pubblichi:
         <link rel="canonical" href="https://esempio.it/verso-il-17/" /> -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Verso il 17 ottobre ✨ | Monza Precision Team · Italia" />
    <meta
      property="og:description"
      content="Il diario segreto del Monza Precision Team verso i Campionati del Mondo in Paraguay: un countdown e una casella al giorno fino al 17 ottobre."
    />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Il tema viene applicato prima del primo paint: nessun lampo bianco in dark mode. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('verso17.theme.v1');
          var mode = stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#171226' : '#fdf6f0');
        } catch (e) {
          /* storage non disponibile: si resta sul tema chiaro */
        }
      })();
    </script>

    <style>
      /* Shell minima: evita il flash di pagina bianca prima che il CSS arrivi. */
      html,
      body {
        margin: 0;
        background: #fdf6f0;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #171226;
      }
      body {
        min-height: 100dvh;
      }
      #boot {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
        color: #b0768c;
        font-size: 15px;
        letter-spacing: 0.04em;
      }
      html[data-theme='dark'] #boot {
        color: #e6c8d6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">Sto allacciando le ruote… 🛼</div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; text-align: center">
        Questo diario ha bisogno di JavaScript per mostrarti il countdown e le caselle. Attivalo e
        ricarica la pagina. 🛼
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
