<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>RAVE – Real-Time Artistic Vision Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas#bg{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#e94560;font-size:clamp(28px,10vw,72px);text-align:center;text-shadow:0 0 30px rgba(233,69,96,.5),0 0 60px rgba(233,69,96,.2);letter-spacing:clamp(6px,2vw,16px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#666;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #e94560;background:rgba(233,69,96,.08);color:#d0d0d0;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(233,69,96,.2);box-shadow:0 0 24px rgba(233,69,96,.2)}
#credit{position:fixed;bottom:16px;color:#333;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="overlay">
  <div id="title">RAVE</div>
  <div id="sub">Real-Time Artistic Vision Engine</div>
  <button id="apri" onclick="window.location.href='rave/index.html'">APRI</button>
</div>
<div id="credit">Arte in tempo reale, pixel per pixel</div>

<script>
const c = document.getElementById('bg');
const ctx = c.getContext('2d');
let W, H;

function resize() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* floating paint blobs */
const BLOBS = 12;
const blobs = [];
const palette = ['#e94560','#ff6b6b','#ffa502','#2ecc71','#3498db','#9b59b6','#e94560','#ff4757','#ff6348','#1e90ff','#00d2d3','#ff9ff3'];

for (let i = 0; i < BLOBS; i++) {
  blobs.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 30 + Math.random() * 60,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.3,
    color: palette[i % palette.length],
    phase: Math.random() * Math.PI * 2,
  });
}

function draw(t) {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  blobs.forEach((b) => {
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < -b.r) b.x = W + b.r;
    if (b.x > W + b.r) b.x = -b.r;
    if (b.y < -b.r) b.y = H + b.r;
    if (b.y > H + b.r) b.y = -b.r;

    const pulse = 1 + Math.sin(t / 1000 + b.phase) * 0.2;
    const r = b.r * pulse;

    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    grad.addColorStop(0, b.color + '40');
    grad.addColorStop(0.5, b.color + '15');
    grad.addColorStop(1, b.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
