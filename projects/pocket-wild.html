<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="POCKET WILD — a minimalist 2D top-down creature-capture survival game. Catch geometric Pals, build a base, splice genes, evolve, fuse.">
<title>POCKET WILD — Catch. Build. Mutate.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center}
#title{font-size:clamp(30px,10vw,72px);font-weight:800;letter-spacing:clamp(3px,2vw,12px);
  background:linear-gradient(90deg,#3ee6ff,#52ff9e,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#8a92c8;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:12px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px;max-width:540px;line-height:1.9}
#apri{pointer-events:all;margin-top:36px;padding:13px 44px;border:1px solid #52ff9e;background:rgba(82,255,158,.08);color:#eef0ff;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:12px;font-weight:700}
#apri:hover{background:rgba(82,255,158,.2);box-shadow:0 0 30px rgba(82,255,158,.35)}
#credit{position:fixed;bottom:16px;color:#5f6890;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 34px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">POCKET WILD</div>
  <div id="sub">Catch geometric creatures · build a base · splice their genes<br>top-down survival in a procedural world</div>
  <button id="apri" onclick="window.location.href='pocket-wild/index.html'">PLAY</button>
</div>
<div id="credit">vanilla JS · zero assets · works on iPhone & desktop 💾 autosaves</div>

<script>
const c=document.createElement('canvas');document.body.prepend(c);
const x=c.getContext('2d');
let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
window.addEventListener('resize',()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;});
/* stormo di creature geometriche che si rincorrono */
const shapes=[0,1,2,3,4,5];
const cols=['#3ee6ff','#52ff9e','#ffd166','#ff5f9e','#a06bf0','#ff8a4c'];
const pals=[];
for(let i=0;i<26;i++)pals.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6,s:shapes[i%6],c:cols[i%6],r:5+Math.random()*9,a:Math.random()*6.28});
function drawPal(px,py,r,s,col,a){
  x.save();x.translate(px,py);x.rotate(a);x.fillStyle=col;
  if(s===0){x.beginPath();x.arc(0,0,r,0,6.283);x.fill();}
  else if(s===1){x.beginPath();for(let i=0;i<10;i++){const an=i/10*6.283,rr=r*(0.7+0.3*Math.sin(an*3));i?x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):x.moveTo(Math.cos(an)*rr,Math.sin(an)*rr);}x.closePath();x.fill();}
  else if(s===2){x.beginPath();x.moveTo(0,-r);x.lineTo(r*.9,r*.7);x.lineTo(-r*.9,r*.7);x.closePath();x.fill();}
  else if(s===3){x.fillRect(-r*.8,-r*.8,r*1.6,r*1.6);}
  else if(s===4){x.beginPath();x.moveTo(0,-r);x.lineTo(r*.8,0);x.lineTo(0,r);x.lineTo(-r*.8,0);x.closePath();x.fill();}
  else{x.beginPath();for(let i=0;i<5;i++){const an=-Math.PI/2+i*1.2566,rr=i%2?r*.45:r;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}x.closePath();x.fill();}
  x.fillStyle='#fff';x.beginPath();x.arc(-r*.3,-r*.15,r*.2,0,6.283);x.fill();x.beginPath();x.arc(r*.3,-r*.15,r*.2,0,6.283);x.fill();
  x.restore();
}
function draw(t){
  x.fillStyle='rgba(11,16,32,.25)';x.fillRect(0,0,W,H);
  for(const p of pals){
    p.x+=p.vx;p.y+=p.vy;p.a+=0.02;
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
    drawPal(p.x,p.y,p.r,p.s,p.c,p.a);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
