<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VITE">
    <meta name="theme-color" content="#f7f2e7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
    <meta name="description" content="VITE — Le molte vite di Emmanuel Carrère. Un viaggio interattivo attraverso 8 opere e 8 minigiochi unici. Contemplativo, senza pressione.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Portfolio">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="VITE — Le molte vite di Emmanuel Carrère">
    <meta property="og:description" content="Un viaggio interattivo attraverso 8 opere e 8 minigiochi unici. Contemplativo, senza pressione.">
    <meta property="og:image" content="icons/icon-512.png">
    <meta property="og:url" content="https://vite-carrere.app/">
    <meta property="og:locale" content="it_IT">
    <meta property="og:site_name" content="VITE">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="VITE — Le molte vite di Emmanuel Carrère">
    <meta name="twitter:description" content="Un viaggio interattivo attraverso 8 opere e 8 minigiochi unici.">
    <meta name="twitter:image" content="icons/icon-512.png">

    <title>VITE — Emmanuel Carrère</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "VITE — Le molte vite di Emmanuel Carrère",
      "operatingSystem": "Any",
      "applicationCategory": "GameApplication",
      "description": "Un viaggio interattivo attraverso 8 opere di Emmanuel Carrère con 8 minigiochi unici.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
    }
    </script>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div class="splash-screen" id="splash-screen">
        <div class="splash-content">
            <div class="splash-ornament">❧</div>
            <div class="splash-title">VITE</div>
            <div class="splash-sub">Le molte vite di Emmanuel Carrère</div>
            <div class="splash-loading">Caricamento</div>
        </div>
    </div>

    <!-- THEME TOGGLE -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambia tema">☽</button>

    <!-- LANGUAGE TOGGLE -->
    <button class="lang-toggle" id="lang-toggle" aria-label="Change language">EN</button>

    <!-- INSTALL BANNER -->
    <div class="install-banner" id="install-banner">
        <div class="install-text">
            <strong>Installa VITE</strong>
            Gioca offline, sempre con te.
        </div>
        <button class="install-btn" id="install-btn">Installa</button>
        <button class="install-close" id="install-close">✕</button>
    </div>

    <div class="quote-popup" id="quote-popup"></div>
    <div class="achievement-popup" id="achievement-popup"></div>

    <!-- TITLE SCREEN -->
    <section class="screen title-screen" id="title-screen">
        <div class="title-frame">
            <div class="title-ornament">❧</div>
            <h1 class="title-main">VITE</h1>
            <div class="title-sub">Le molte vite di Emmanuel Carrère</div>
            <div class="title-line"></div>
            <div class="title-desc">Un viaggio attraverso le sue opere,<br>le sue citazioni e una storia strappalacrime.</div>
            <button class="title-start" id="title-start">Apri il libro</button>
            <div class="title-ornament bottom">❧</div>
        </div>
    </section>

    <!-- MAP SCREEN -->
    <section class="screen map-screen hidden" id="map-screen"></section>

    <!-- CHAPTER SCREEN -->
    <section class="screen chapter-screen hidden" id="chapter-screen"></section>

    <!-- QUADERNO SCREEN -->
    <section class="screen quaderno-screen hidden" id="quaderno-screen"></section>

    <!-- FINALE SCREEN -->
    <section class="screen finale-screen hidden" id="finale-screen"></section>

    <!-- ACHIEVEMENTS SCREEN -->
    <section class="screen achievements-screen hidden" id="achievements-screen"></section>

    <script src="js/data.js"></script>
    <script src="js/data.en.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/minigames.js"></script>
    <script src="js/ui.js"></script>
    <script>
        // Splash screen
        window.addEventListener("load", function () {
            setTimeout(function () {
                var splash = document.getElementById("splash-screen");
                if (splash) splash.classList.add("fade-out");
                setTimeout(function () {
                    if (splash) splash.style.display = "none";
                    var themeToggle = document.getElementById("theme-toggle");
                    var langToggle = document.getElementById("lang-toggle");
                    if (themeToggle) themeToggle.classList.add("visible");
                    if (langToggle) langToggle.classList.add("visible");
                }, 600);
            }, 1200);
        });

        // Dark mode
        (function () {
            var saved = localStorage.getItem("vite-theme");
            var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();

        // Language init
        (function () {
            var lang = I18n.get();
            document.documentElement.setAttribute("lang", lang);
            document.getElementById("lang-toggle").textContent = I18n.t("langLabel");
        })();

        document.getElementById("theme-toggle").addEventListener("click", function () {
            var isDark = document.documentElement.getAttribute("data-theme") === "dark";
            document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
            localStorage.setItem("vite-theme", isDark ? "light" : "dark");
            this.textContent = isDark ? "☽" : "☀";
            Engine.earnAchievement("dark_mode");
        });

        document.getElementById("lang-toggle").addEventListener("click", function () {
            var current = I18n.get();
            var next = current === "it" ? "en" : "it";
            I18n.set(next);
            this.textContent = I18n.t("langLabel");
            document.documentElement.setAttribute("lang", next);
            Engine.earnAchievement("multilingual");
            UI.init();
        });

        // Service Worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(function () {});
        }

        // Install prompt
        var deferredPrompt = null;
        window.addEventListener("beforeinstallprompt", function (e) {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(function () {
                var banner = document.getElementById("install-banner");
                if (banner) banner.classList.add("show");
            }, 5000);
        });

        document.getElementById("install-btn").addEventListener("click", function () {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function () {
                deferredPrompt = null;
                document.getElementById("install-banner").classList.remove("show");
            });
        });

        document.getElementById("install-close").addEventListener("click", function () {
            document.getElementById("install-banner").classList.remove("show");
        });

        // Start game
        document.getElementById("title-start").addEventListener("click", function () {
            document.querySelector(".title-frame").classList.add("leaving");
            setTimeout(function () { Engine.setScreen("map"); }, 600);
        });
    </script>
</body>
</html>
