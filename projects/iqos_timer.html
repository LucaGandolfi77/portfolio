<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="IQOS Timer moderno: countdown, notifiche, storico e statistiche.">
<title>IQOS Timer — Mindful Timing</title>
<link rel="manifest" href="iqos_timer_manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080e1a;--bg2:#0c1626;--card:rgba(16,27,45,.72);--card-solid:#101b2e;
  --line:rgba(150,190,255,.12);--line2:rgba(150,190,255,.24);
  --text:#eaf2ff;--dim:#8b9cbb;--accent:#4de8ff;--accent2:#a98bff;
  --gold:#ffd166;--green:#5ef0a8;--red:#ff6b7d;--orange:#ff9f68;
  --top:var(--site-top-bar-height,0px);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
body[data-theme="light"]{
  --bg:#f2f5fa;--bg2:#e8eef6;--card:rgba(255,255,255,.82);--card-solid:#ffffff;
  --line:rgba(30,60,100,.12);--line2:rgba(30,60,100,.22);
  --text:#1b2a3f;--dim:#697d96;--accent:#0aa6c4;--accent2:#7c5cd6;
  --gold:#c98a13;--green:#179b63;--red:#d94b60;--orange:#d9752c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);
  background:
    radial-gradient(760px 420px at 10% -10%,rgba(77,232,255,.11),transparent 60%),
    radial-gradient(680px 400px at 96% 4%,rgba(169,139,255,.10),transparent 60%),
    radial-gradient(640px 400px at 50% 110%,rgba(94,240,168,.05),transparent 60%),
    var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
  padding-top:calc(var(--top) + var(--safe-t));padding-bottom:var(--safe-b);
  overflow-x:hidden;
}
.app{max-width:520px;margin:0 auto;padding:16px 14px calc(30px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  background:linear-gradient(140deg,rgba(77,232,255,.2),rgba(169,139,255,.16));border:1px solid var(--line2)}
.brand b{display:block;font-size:1rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:.64rem;color:var(--dim);margin-top:1px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.95rem;transition:.15s}
.icon-btn:hover,.icon-btn.on{color:var(--accent);border-color:var(--line2);background:rgba(77,232,255,.1)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 40px rgba(0,0,0,.24)}
.card h3{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}

/* hero / ring */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center}
.ring-holder{position:relative;width:248px;height:248px;margin:4px auto 6px}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .track{fill:none;stroke:rgba(150,190,255,.1);stroke-width:9}
.ring .fill{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;
  stroke-dasharray:690;stroke-dashoffset:690;transition:stroke-dashoffset .8s ease;filter:drop-shadow(0 0 8px rgba(77,232,255,.4))}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring-time{font-family:'JetBrains Mono',monospace;font-size:2.5rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring-label{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.ring-count{margin-top:6px;font-size:.86rem;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.ring-state{margin-top:2px;font-size:.66rem;color:var(--dim)}
.hero.urgent .ring-time{color:var(--gold)}
.hero.due .ring-time{color:var(--green)}
.mark-btn{width:100%;margin-top:16px;min-height:54px;border-radius:14px;border:none;font-weight:800;font-size:.95rem;
  background:linear-gradient(120deg,var(--accent),#28b8d4);color:#04141d;box-shadow:0 10px 26px rgba(77,232,255,.24);
  transition:transform .12s,filter .15s}
.mark-btn:active{transform:scale(.97)}
.mark-btn.flash{animation:flash .5s ease}
@keyframes flash{0%{filter:brightness(1)}40%{filter:brightness(1.7)}100%{filter:brightness(1)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px}
.conf i{position:absolute;width:7px;height:7px;border-radius:2px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:13px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-top:3px}
.stat.good b{color:var(--green)}.stat.warn b{color:var(--gold)}.stat.acc b{color:var(--accent)}

/* settings */
.field-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:88px}
.field label{font-size:.62rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
input[type=time],input[type=number],select{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;color:var(--text);font-size:.82rem;outline:none;min-height:40px;font-family:inherit}
body[data-theme=light] input[type=time],body[data-theme=light] input[type=number],body[data-theme=light] select{background:rgba(30,60,100,.05)}
input:focus,select:focus{border-color:var(--accent)}
.small-btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  font-size:.74rem;font-weight:700;color:var(--dim);min-height:40px}
.small-btn:hover{color:var(--accent)}
.switches{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sw{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);font-size:.72rem;color:var(--dim);cursor:pointer}
.sw input{accent-color:var(--accent);width:16px;height:16px}
.sw.on{color:var(--text);border-color:var(--line2)}

/* slots */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.slot{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;
  font-size:.66rem;color:var(--dim);transition:.2s}
.slot small{font-size:.55rem;opacity:.7}
.slot.done{background:rgba(94,240,168,.12);border-color:rgba(94,240,168,.3);color:var(--green)}
.slot.now{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.18);animation:pulseNow 2s infinite}
@keyframes pulseNow{50%{box-shadow:0 0 22px rgba(255,209,102,.4)}}
.slot.late{background:rgba(255,107,125,.1);border-color:rgba(255,107,125,.3);color:var(--red)}

/* history */
.hist{max-height:230px;overflow-y:auto;scrollbar-width:thin}
.hrow{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;background:rgba(255,255,255,.035);
  border:1px solid var(--line);margin-bottom:6px;font-size:.78rem;cursor:pointer;transition:.15s;animation:slideIn .22s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}}
.hrow:hover{border-color:var(--line2)}
.hrow .num{font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:.7rem;width:30px}
.hrow .tm{font-family:'JetBrains Mono',monospace;font-weight:700}
.hrow .tag{margin-left:auto;font-size:.6rem;font-weight:800;padding:3px 7px;border-radius:20px;text-transform:uppercase}
.tag.ok{background:rgba(94,240,168,.13);color:var(--green)}
.tag.early{background:rgba(77,232,255,.13);color:var(--accent)}
.tag.late{background:rgba(255,155,104,.13);color:var(--orange)}
.hrow .del{margin-left:4px;color:var(--dim);padding:3px 6px;border-radius:7px}
.hrow .del:hover{color:var(--red)}
.empty{text-align:center;color:var(--dim);font-size:.82rem;padding:22px 8px;opacity:.75}

/* week chart */
.chart{display:flex;align-items:flex-end;gap:7px;height:98px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent),rgba(77,232,255,.18));
  min-height:3px;transition:height .4s ease}
.bar.today{background:linear-gradient(180deg,var(--gold),rgba(255,209,102,.2))}
.bar-col span{font-size:.58rem;color:var(--dim)}
.bar-col b{font-size:.6rem;color:var(--text);font-variant-numeric:tabular-nums}

/* modal / toast */
.modal-back{position:fixed;inset:0;background:rgba(2,7,14,.74);backdrop-filter:blur(8px);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:200}
.modal-back[hidden]{display:none}
.modal{width:100%;max-width:380px;padding:20px;border-radius:18px;background:var(--card-solid);border:1px solid var(--line2);
  box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h4{font-size:1rem;margin-bottom:8px}
.modal p{font-size:.78rem;color:var(--dim);line-height:1.5;margin-bottom:14px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap}
.modal .btn{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700;font-size:.8rem}
.modal .btn.pri{background:linear-gradient(120deg,var(--accent),#28b8d4);color:#04141d;border:none}
.modal .btn.dan{color:var(--red);border-color:rgba(255,107,125,.35)}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%) translateY(12px);z-index:300;
  display:flex;align-items:center;gap:10px;background:var(--card-solid);border:1px solid var(--line2);border-radius:30px;
  padding:11px 17px;font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:none;background:none;color:var(--accent);font-weight:800;font-size:.76rem}
.foot{text-align:center;font-size:.64rem;color:var(--dim);opacity:.7;padding:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){.ring-holder{width:214px;height:214px}.ring-time{font-size:2.1rem}.slots{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <div class="head">
    <div class="brand"><div class="logo">⏱️</div><div><b>IQOS Timer</b><small>mindful timing · offline</small></div></div>
    <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Cambia tema">🌙</button>
    <button class="icon-btn" id="settingsBtn" title="Impostazioni" aria-label="Impostazioni">⚙️</button>
  </div>

  <section class="card hero" id="hero">
    <div class="ring-holder">
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4de8ff"/><stop offset="100%" stop-color="#ffd166"/>
        </linearGradient></defs>
        <circle class="track" cx="110" cy="110" r="110"/>
        <circle class="fill" id="ringFill" cx="110" cy="110" r="110"/>
      </svg>
      <div class="ring-center">
        <div class="ring-time" id="nextTime">--:--</div>
        <div class="ring-label">prossimo slot</div>
        <div class="ring-count" id="countdown">—</div>
        <div class="ring-state" id="ringState">caricamento…</div>
      </div>
      <div class="confetti" id="confetti"></div>
    </div>
    <button class="mark-btn" id="markBtn">✓ Ho fumato ora</button>
  </section>

  <div class="stats">
    <div class="stat good"><b id="sToday">0</b><span>Oggi</span></div>
    <div class="stat acc"><b id="sLeft">0</b><span>Rimaste</span></div>
    <div class="stat warn"><b id="sSlot">1</b><span>Slot</span></div>
  </div>

  <section class="card" id="slotsCard">
    <h3>Slot di oggi <span id="slotRange" style="color:var(--dim);font-weight:600;letter-spacing:0;text-transform:none">—</span></h3>
    <div class="slots" id="slots"></div>
  </section>

  <section class="card">
    <h3>Ultimi 7 giorni <span id="weekAvg" style="color:var(--gold);font-weight:700;letter-spacing:0;text-transform:none">media —</span></h3>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card">
    <h3>Storico di oggi <button class="small-btn" id="undoBtn" disabled>Undo</button></h3>
    <div class="hist" id="history"></div>
    <button class="small-btn" id="clearBtn" style="width:100%;margin-top:10px;color:var(--red)">Cancella storico di oggi</button>
  </section>

  <div class="foot">Space = segna · dati salvati solo su questo dispositivo</div>
</div>

<div class="modal-back" id="modalBack" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden>UNDO</button></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='iqos_v2', OLD='iqosHistory';
const DEF={start:'08:00',end:'00:00',slots:20,theme:'dark',sound:true,notify:false,tolerance:10};
const S={settings:Object.assign({},DEF),entries:[],slots:[],last:null,notified:new Set(),timer:null};

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function parseHM(s){const p=(s||'08:00').split(':').map(Number);return {h:p[0]||0,m:p[1]||0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({settings:S.settings,entries:S.entries}))}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);S.settings=Object.assign({},DEF,d.settings||{});S.entries=d.entries||[];return}}
  catch(e){}
  // migrazione vecchio formato
  try{const old=localStorage.getItem(OLD);if(old){const a=JSON.parse(old);
    S.entries=a.map(e=>({id:Math.random().toString(36).slice(2),ts:e.timestamp,slotTs:e.scheduledTime,time:e.actualTime,status:'ok'}))}}
  catch(e){}
}
function toast(msg,undo){const t=$('toast');$('toastMsg').textContent=msg;const b=$('toastBtn');
  if(undo){b.hidden=false;b.onclick=()=>{undo();hideToast()}}else b.hidden=true;
  t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(hideToast,undo?5000:2200)}
function hideToast(){$('toast').classList.remove('on')}
function modal(html){$('modal').innerHTML=html;$('modalBack').hidden=false}
function closeModal(){$('modalBack').hidden=true}

/* ---------- slots ---------- */
function buildSlots(){
  const base=new Date(), st=parseHM(S.settings.start), en=parseHM(S.settings.end);
  const start=new Date(base.getFullYear(),base.getMonth(),base.getDate(),st.h,st.m,0,0);
  const end=new Date(base.getFullYear(),base.getMonth(),base.getDate(),en.h,en.m,0,0);
  if(end<=start)end.setDate(end.getDate()+1);
  const n=Math.max(1,Math.min(60,S.settings.slots|0||20));
  const step=(end.getTime()-start.getTime())/n;
  S.slots=Array.from({length:n},(_,i)=>new Date(start.getTime()+Math.round(i*step)));
  $('slotRange').textContent=hm(start)+' – '+hm(end)+' · '+n+' slot';
}
function slotDone(slot){
  const tol=S.settings.tolerance*60000;
  return S.entries.some(e=>Math.abs(new Date(e.slotTs).getTime()-slot.getTime())<=tol);
}
function todayEntries(){return S.entries.filter(e=>dayKey(new Date(e.ts))===dayKey(new Date()))}
function nextSlot(){
  const now=new Date();
  for(let i=0;i<S.slots.length;i++)if(!slotDone(S.slots[i])&&S.slots[i]>=now)return {i,time:S.slots[i]};
  for(let i=0;i<S.slots.length;i++)if(!slotDone(S.slots[i]))return {i,time:S.slots[i]};
  const st=parseHM(S.settings.start),tm=new Date();
  tm.setDate(tm.getDate()+1);tm.setHours(st.h,st.m,0,0);
  return {i:0,time:tm};
}
function nearestSlot(){
  const now=Date.now();let best=0,bestD=Infinity;
  S.slots.forEach((s,i)=>{if(slotDone(s))return;const d=Math.abs(s.getTime()-now);if(d<bestD){bestD=d;best=i}});
  return {i:best,time:S.slots[best],diffMin:(now-S.slots[best].getTime())/60000};
}

/* ---------- render ---------- */
function renderRing(){
  const ns=nextSlot(),now=new Date(),diff=ns.time.getTime()-now.getTime();
  $('nextTime').textContent=hm(ns.time);
  const h=Math.floor(Math.max(0,diff)/3600000),m=Math.floor(Math.max(0,diff)%3600000/60000),s=Math.floor(Math.max(0,diff)%60000/1000);
  $('countdown').textContent=diff>0?(h?h+'h ':'')+pad(m)+':'+pad(s):'È il momento!';
  // progresso: dal precedente slot al prossimo
  const prev=ns.i>0?S.slots[ns.i-1]:null;
  const span=prev?Math.max(60000,ns.time.getTime()-prev.getTime()):3600000;
  const elapsed=prev?Math.min(span,now.getTime()-prev.getTime()):Math.max(0,span-diff);
  const pct=Math.max(0,Math.min(100,elapsed/span*100));
  $('ringFill').style.strokeDashoffset=(690-690*pct/100).toFixed(1);
  const hero=$('hero');hero.classList.toggle('urgent',diff>0&&diff<10*60000);
  hero.classList.toggle('due',diff<=0);
  $('ringState').textContent=diff<=0?'slot in corso':(pct>80?'ci siamo quasi':'in attesa');
  const te=todayEntries();
  $('sToday').textContent=te.length;
  $('sLeft').textContent=Math.max(0,S.settings.slots-te.length);
  $('sSlot').textContent=ns.i+1;
  $('undoBtn').disabled=!S.last;
}
function renderSlots(){
  const now=new Date(),ns=nextSlot();
  $('slots').innerHTML=S.slots.map((s,i)=>{
    let cls='slot';const e=S.entries.find(x=>Math.abs(new Date(x.slotTs).getTime()-s.getTime())<=S.settings.tolerance*60000);
    if(e)cls+=' '+(e.status==='late'?'late':'done');
    else if(i===ns.i)cls+=' now';
    return '<div class="'+cls+'" title="Slot '+(i+1)+'">'+hm(s)+'<small>'+(i+1)+'</small></div>'}).join('');
}
function renderHistory(){
  const list=todayEntries().slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  if(!list.length){$('history').innerHTML='<div class="empty">Nessun IQOS registrato oggi</div>';return}
  $('history').innerHTML=list.map((e,i)=>{
    const lbl=e.status==='early'?'antico':e.status==='late'?'in ritardo':'ok';
    const cls=e.status==='early'?'early':e.status==='late'?'late':'ok';
    return '<div class="hrow" data-id="'+e.id+'"><span class="num">#'+(list.length-i)+'</span>'+
      '<span class="tm">'+(e.time||hm(new Date(e.ts)))+'</span><span class="tag '+cls+'">'+lbl+'</span>'+
      '<button class="del" data-del="'+e.id+'" aria-label="Elimina">✕</button></div>'}).join('');
}
function renderChart(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const counts=days.map(d=>S.entries.filter(e=>dayKey(new Date(e.ts))===dayKey(d)).length);
  const max=Math.max(1,...counts);
  const names=['D','L','M','G','V','S','D'];
  $('chart').innerHTML=days.map((d,i)=>'<div class="bar-col"><b>'+(counts[i]||'')+'</b>'+
    '<div class="bar'+(i===6?' today':'')+'" style="height:'+(counts[i]/max*72)+'px"></div>'+
    '<span>'+names[d.getDay()]+'</span></div>').join('');
  const avg=counts.reduce((a,b)=>a+b,0)/7;
  $('weekAvg').textContent='media '+avg.toFixed(1);
}
function renderAll(){renderRing();renderSlots();renderHistory();renderChart();save()}

/* ---------- actions ---------- */
function beep(type){
  if(!S.settings.sound)return;
  try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=type==='done'?880:520;
    g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.14);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}catch(e){}
}
function confetti(){const box=$('confetti');const cols=['var(--accent)','var(--gold)','var(--green)','var(--accent2)'];
  box.innerHTML='';for(let i=0;i<18;i++){const el=document.createElement('i');
    el.style.background=cols[i%cols.length];el.style.left=(40+Math.random()*20)+'%';el.style.top='55%';
    el.style.setProperty('--dx',(Math.random()*240-120)+'px');el.style.setProperty('--dy',(Math.random()*-160-40)+'px');
    box.appendChild(el)}setTimeout(()=>box.innerHTML='',1000)}
function mark(){
  const ns=nearestSlot(),now=new Date(),d=ns.diffMin;
  const status=Math.abs(d)<=5?'ok':(d<0?'early':'late');
  const e={id:Math.random().toString(36).slice(2),ts:now.toISOString(),slotTs:ns.time.toISOString(),
    time:hm(now),status:status};
  S.entries.push(e);S.last=e;
  beep('done');try{if(navigator.vibrate)navigator.vibrate(70)}catch(err){}
  confetti();const b=$('markBtn');b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');
  renderAll();toast(status==='ok'?'Registrato!':status==='early'?'Registrato in anticipo':'Registrato in ritardo',()=>undo());
}
function undo(){if(!S.last)return;S.entries=S.entries.filter(e=>e.id!==S.last.id);S.last=null;renderAll();toast('Undo effettuato')}
function editEntry(id){
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  modal('<h4>Modifica registrazione</h4><p>Slot '+(e.slotTs?hm(new Date(e.slotTs)):'—')+
    ' · registrata alle '+hm(new Date(e.ts))+'</p>'+
    '<div class="field"><label>Ora effettiva</label><input type="time" id="edTime" value="'+(e.time||hm(new Date(e.ts)))+'"></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn dan" data-del>Sposta a domani</button>'+
    '<button class="btn" data-cancel>Annulla</button><button class="btn pri" data-save>Salva</button></div>');
  $('modal').querySelector('[data-cancel]').onclick=closeModal;
  $('modal').querySelector('[data-del]').onclick=function(){closeModal();S.entries=S.entries.filter(x=>x.id!==id);renderAll();toast('Voce eliminata')};
  $('modal').querySelector('[data-save]').onclick=function(){e.time=$('edTime').value||e.time;
    e.status=Math.abs(nearestSlot().diffMin)<=5?'ok':'late';closeModal();renderAll();toast('Aggiornata')};
}
function settingsModal(){
  const s=S.settings;
  modal('<h4>Impostazioni</h4><p>Personalizza il tuo ritmo e le notifiche.</p>'+
    '<div class="field-row"><div class="field"><label>Inizio</label><input type="time" id="setStart" value="'+s.start+'"></div>'+
    '<div class="field"><label>Fine</label><input type="time" id="setEnd" value="'+s.end+'"></div>'+
    '<div class="field"><label>Slot</label><input type="number" id="setSlots" min="1" max="60" value="'+s.slots+'"></div></div>'+
    '<div class="field-row" style="margin-top:10px"><div class="field"><label>Tolleranza (min)</label>'+
    '<input type="number" id="setTol" min="0" max="60" value="'+s.tolerance+'"></div></div>'+
    '<div class="switches"><label class="sw"><input type="checkbox" id="setSound" '+(s.sound?'checked':'')+'> Suono</label>'+
    '<label class="sw"><input type="checkbox" id="setNotify" '+(s.notify?'checked':'')+'> Notifiche</label></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" data-exp>Esporta JSON</button>'+
    '<button class="btn" data-imp>Importa</button></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn" data-cancel>Chiudi</button>'+
    '<button class="btn pri" data-save>Salva</button></div>');
  const m=$('modal');
  m.querySelector('[data-cancel]').onclick=closeModal;
  m.querySelector('[data-exp]').onclick=exportData;
  m.querySelector('[data-imp]').onclick=importData;
  m.querySelector('[data-save]').onclick=function(){
    s.start=$('setStart').value||s.start;s.end=$('setEnd').value||s.end;
    s.slots=Math.max(1,Math.min(60,+$('setSlots').value||20));s.tolerance=Math.max(0,Math.min(60,+$('setTol').value||0));
    s.sound=$('setSound').checked;s.notify=$('setNotify').checked;
    if(s.notify&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission();
    closeModal();buildSlots();renderAll();toast('Impostazioni salvate')};
}
function exportData(){const blob=new Blob([JSON.stringify({settings:S.settings,entries:S.entries},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='iqos-timer-backup.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup esportato')}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=function(){try{const d=JSON.parse(r.result);S.settings=Object.assign({},DEF,d.settings||{});
      S.entries=d.entries||[];closeModal();buildSlots();renderAll();toast('Backup importato')}
      catch(e){toast('File non valido')}};r.readAsText(f)};inp.click()}
function theme(){const light=S.settings.theme==='light';S.settings.theme=light?'dark':'light';
  document.body.dataset.theme=S.settings.theme;$('themeBtn').textContent=light?'🌙':'☀️';save()}

/* ---------- notifications ---------- */
function checkNotify(){
  if(!S.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  const ns=nextSlot();if(ns.time.getTime()-Date.now()>0)return;
  const key=dayKey(new Date())+'-'+ns.i;
  if(S.notified.has(key))return;S.notified.add(key);
  try{new Notification('IQOS Timer',{body:'È il momento del tuo slot!',icon:'icons/icon.svg',tag:'iqos-slot'})}catch(e){}
  beep('done');
}

/* ---------- events ---------- */
$('markBtn').onclick=mark;
$('undoBtn').onclick=undo;
$('themeBtn').onclick=theme;
$('settingsBtn').onclick=settingsModal;
$('clearBtn').onclick=function(){modal('<h4>Cancellare lo storico?</h4><p>Rimuove tutte le registrazioni di oggi. Puoi usare Undo subito dopo.</p>'+
  '<div class="row"><button class="btn" data-cancel>Annulla</button><button class="btn dan" data-ok>Cancella</button></div>');
  $('modal').querySelector('[data-cancel]').onclick=closeModal;
  $('modal').querySelector('[data-ok]').onclick=function(){S.last=null;S.entries=S.entries.filter(e=>dayKey(new Date(e.ts))!==dayKey(new Date()));
    closeModal();renderAll();toast('Storico pulito')}};
$('modalBack').onclick=function(e){if(e.target===$('modalBack'))closeModal()};
$('history').addEventListener('click',function(e){const d=e.target.closest('[data-del]');
  if(d){e.stopPropagation();const id=d.dataset.del;S.last=S.entries.find(x=>x.id===id)||null;
    S.entries=S.entries.filter(x=>x.id!==id);renderAll();toast('Voce eliminata',()=>{if(S.last){S.entries.push(S.last);S.last=null;renderAll()}});return}
  const r=e.target.closest('[data-id]');if(r)editEntry(r.dataset.id)});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
  e.preventDefault();mark()}if(e.key==='Escape')closeModal()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){buildSlots();renderAll()}});

/* init */
load();document.body.dataset.theme=S.settings.theme;$('themeBtn').textContent=S.settings.theme==='light'?'☀️':'🌙';
buildSlots();renderAll();
setInterval(()=>{renderRing();checkNotify()},1000);
setInterval(()=>{buildSlots();renderAll()},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('iqos_timer_sw.js').catch(function(){});
window.__iqos={S:S,buildSlots:buildSlots,mark:mark,nextSlot:nextSlot,nearestSlot:nearestSlot,undo:undo,renderAll:renderAll};
})();
</script>
</body>
</html>
