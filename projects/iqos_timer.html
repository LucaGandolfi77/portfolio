<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IQOS Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #00d4ff;
            --text-main: #ffffff;
            --text-muted: #a0c0e0;
            --success: #4dff4d;
            --warning: #ffd700;
            --danger: #ff4d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #07101b, #0f1724);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .header h1 {
            font-size: 2em;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1em;
            margin-top: 5px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .timer-section {
            text-align: center;
        }

        .next-time {
            font-size: 3.5em;
            font-weight: 800;
            margin: 15px 0;
            color: var(--warning);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            font-variant-numeric: tabular-nums;
        }

        .countdown {
            font-size: 1.2em;
            margin: 15px 0;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 6px;
            margin: 25px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--warning), #FFA500);
            height: 100%;
            border-radius: 10px;
            transition: width 1s linear;
        }

        .mark-button {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-family: inherit;
        }

        .mark-button:hover {
            background: var(--accent);
            color: #0f1724;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .mark-button:active {
            transform: scale(0.98);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px 10px;
            flex: 1;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--text-main);
        }

        .stat-label {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h3 {
            margin-bottom: 15px;
            font-size: 1.1em;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
        }
        
        .history-item span:first-child {
            color: var(--text-muted);
        }

        .times-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .time-slot {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85em;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .time-slot.completed {
            background: rgba(77, 255, 77, 0.1);
            color: var(--success);
            border: 1px solid rgba(77, 255, 77, 0.2);
        }

        .time-slot.current {
            background: rgba(255, 215, 0, 0.1);
            color: var(--warning);
            border: 1px solid rgba(255, 215, 0, 0.2);
            font-weight: bold;
        }

        .clear-button {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 0.9em;
            width: 100%;
            transition: all 0.2s;
        }

        .clear-button:hover {
            background: var(--danger);
            color: white;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="technology.html" class="back-link">← Back</a>
            <h1>IQOS Timer</h1>
            <p>Il tuo assistente per il timing perfetto</p>
        </div>

        <div class="card timer-section">
            <div style="color: var(--text-muted); font-size: 0.9em;">Prossima IQOS alle:</div>
            <div class="next-time" id="nextTime">--:--</div>
            <div class="countdown" id="countdown">Caricamento...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <button class="mark-button" onclick="markIQOS()">✓ Ho fumato ora</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="todayCount">0</div>
                <div class="stat-label">Oggi</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="remainingCount">20</div>
                <div class="stat-label">Rimaste</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="nextSlot">1</div>
                <div class="stat-label">Slot</div>
            </div>
        </div>

        <div class="card scheduled-times">
            <h3 id="scheduledTitle">Orari programmati (8:00 - 24:00)</h3>
            <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
                <label style="color:var(--text-muted);font-size:0.9rem">Start</label>
                <input type="time" id="startTime" value="08:00" style="padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit">
                <label style="color:var(--text-muted);font-size:0.9rem">End</label>
                <input type="time" id="endTime" value="00:00" style="padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit">
                <button class="btn" id="applyTimes" style="padding:6px 10px;font-size:0.9rem">Applica</button>
            </div>
            <div class="times-grid" id="timesGrid"></div>
        </div>

        <div class="card history">
            <h3>Storico di oggi</h3>
            <div class="history-list" id="historyList">
                <div style="text-align: center; opacity: 0.6; padding: 20px;">
                    Nessuna IQOS registrata oggi
                </div>
            </div>
            <button class="clear-button" onclick="clearHistory()">Cancella storico</button>
        </div>
    </div>

    <script>
        // Configurazione
        const DAILY_TOTAL = 20;
        const START_HOUR = 8; // 8:00 AM
        const END_HOUR = 24; // Mezzanotte
        const INTERVAL_MINUTES = 48; // 48 minuti tra ogni IQOS

        // Stato dell'applicazione
        let todayHistory = [];
        let scheduledTimes = [];

        // Genera gli orari programmati per la giornata
        function generateScheduledTimes() {
            // Read start/end from inputs (type=time). If end <= start, treat end as next day.
            const startVal = document.getElementById('startTime').value || '08:00';
            const endVal = document.getElementById('endTime').value || '00:00';
            const [sh, sm] = startVal.split(':').map(n => parseInt(n,10));
            const [eh, em] = endVal.split(':').map(n => parseInt(n,10));

            const now = new Date();
            let startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0, 0);
            let endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eh, em, 0, 0);
            if (endDate <= startDate) {
                // if end is same or before start, advance end to next day
                endDate.setDate(endDate.getDate() + 1);
            }

            scheduledTimes = [];
            const totalMs = endDate.getTime() - startDate.getTime();
            const intervalMs = totalMs / DAILY_TOTAL;
            for (let i = 0; i < DAILY_TOTAL; i++) {
                scheduledTimes.push(new Date(startDate.getTime() + Math.round(i * intervalMs)));
            }

            // Update title to reflect chosen range
            const displayStart = formatTime(startDate);
            const displayEnd = formatTime(endDate);
            document.getElementById('scheduledTitle').textContent = `Orari programmati (${displayStart} - ${displayEnd})`;
        }

        // Formatta il tempo in HH:MM
        function formatTime(date) {
            return date.toLocaleTimeString('it-IT', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false 
            });
        }

        // Trova il prossimo slot disponibile
        function getNextSlot() {
            const now = new Date();
            const today = now.toDateString();
            
            // Filtra gli orari già completati oggi
            const completedTimes = todayHistory
                .filter(entry => new Date(entry.timestamp).toDateString() === today)
                .map(entry => new Date(entry.scheduledTime));

            // Trova il primo slot non completato che non è ancora passato
            for (let i = 0; i < scheduledTimes.length; i++) {
                const slotTime = scheduledTimes[i];
                const isCompleted = completedTimes.some(completed => 
                    Math.abs(completed.getTime() - slotTime.getTime()) < 30000 // 30 secondi di tolleranza
                );
                
                if (!isCompleted && slotTime >= now) {
                    return { index: i, time: slotTime };
                }
            }

            // Se non ci sono slot futuri oggi, restituisci il primo slot di domani
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(START_HOUR, 0, 0, 0);
            return { index: 0, time: tomorrow };
        }

        // Aggiorna il display del timer
        function updateTimer() {
            const nextSlot = getNextSlot();
            const now = new Date();
            
            document.getElementById('nextTime').textContent = formatTime(nextSlot.time);
            
            const timeDiff = nextSlot.time.getTime() - now.getTime();
            
            if (timeDiff > 0) {
                const hours = Math.floor(timeDiff / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);
                
                let countdownText = '';
                if (hours > 0) {
                    countdownText += `${hours}h `;
                }
                countdownText += `${minutes}m ${seconds}s`;
                
                document.getElementById('countdown').textContent = countdownText;
                
                // Aggiorna la barra di progresso (basata sull'intervallo di 48 minuti)
                const totalInterval = 48 * 60 * 1000; // 48 minuti in millisecondi
                const elapsed = totalInterval - timeDiff;
                const progress = Math.max(0, Math.min(100, (elapsed / totalInterval) * 100));
                document.getElementById('progressFill').style.width = progress + '%';
            } else {
                document.getElementById('countdown').textContent = '⚡ È il momento!';
                document.getElementById('progressFill').style.width = '100%';
            }

            // Aggiorna le statistiche
            const today = now.toDateString();
            const todayCount = todayHistory.filter(entry => 
                new Date(entry.timestamp).toDateString() === today
            ).length;
            
            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('remainingCount').textContent = Math.max(0, DAILY_TOTAL - todayCount);
            document.getElementById('nextSlot').textContent = nextSlot.index + 1;
        }

        // Segna una IQOS come consumata
        function markIQOS() {
            const now = new Date();
            const nextSlot = getNextSlot();
            
            const entry = {
                timestamp: now.toISOString(),
                scheduledTime: nextSlot.time.toISOString(),
                actualTime: formatTime(now)
            };

            todayHistory.push(entry);
            saveToStorage();
            updateHistory();
            updateTimesGrid();
            updateTimer();

            // Feedback visivo
            const button = document.querySelector('.mark-button');
            const originalText = button.textContent;
            button.textContent = '✓ Registrato!';
            button.style.background = 'var(--success)';
            button.style.color = '#0f1724';
            button.style.borderColor = 'var(--success)';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = 'rgba(0, 212, 255, 0.1)';
                button.style.color = 'var(--accent)';
                button.style.borderColor = 'var(--accent)';
            }, 2000);
        }

        // Aggiorna la visualizzazione dello storico
        function updateHistory() {
            const historyContainer = document.getElementById('historyList');
            const today = new Date().toDateString();
            const todayEntries = todayHistory.filter(entry => 
                new Date(entry.timestamp).toDateString() === today
            );

            if (todayEntries.length === 0) {
                historyContainer.innerHTML = `
                    <div style="text-align: center; opacity: 0.6; padding: 20px;">
                        Nessuna IQOS registrata oggi
                    </div>
                `;
                return;
            }

            historyContainer.innerHTML = todayEntries
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                .map((entry, index) => `
                    <div class="history-item">
                        <span>#${todayEntries.length - index}</span>
                        <span>${entry.actualTime}</span>
                    </div>
                `).join('');
        }

        // Aggiorna la griglia degli orari programmati
        function updateTimesGrid() {
            const grid = document.getElementById('timesGrid');
            const now = new Date();
            const today = now.toDateString();
            
            const completedTimes = todayHistory
                .filter(entry => new Date(entry.timestamp).toDateString() === today)
                .map(entry => new Date(entry.scheduledTime));

            const nextSlot = getNextSlot();

            grid.innerHTML = scheduledTimes.map((time, index) => {
                const isCompleted = completedTimes.some(completed => 
                    Math.abs(completed.getTime() - time.getTime()) < 30000
                );
                const isCurrent = index === nextSlot.index && time.toDateString() === today;
                
                let className = 'time-slot';
                if (isCompleted) className += ' completed';
                else if (isCurrent) className += ' current';

                return `<div class="${className}">${formatTime(time)}</div>`;
            }).join('');
        }

        // Cancella lo storico
        function clearHistory() {
            if (confirm('Sei sicuro di voler cancellare tutto lo storico?')) {
                todayHistory = [];
                saveToStorage();
                updateHistory();
                updateTimesGrid();
                updateTimer();
            }
        }

        // Salva i dati nel localStorage
        function saveToStorage() {
            localStorage.setItem('iqosHistory', JSON.stringify(todayHistory));
        }

        // Carica i dati dal localStorage
        function loadFromStorage() {
            const saved = localStorage.getItem('iqosHistory');
            if (saved) {
                todayHistory = JSON.parse(saved);
            }
        }

        // Save/load start/end time settings
        function saveTimeSettings() {
            const s = document.getElementById('startTime')?.value || '';
            const e = document.getElementById('endTime')?.value || '';
            localStorage.setItem('iqosStartTime', s);
            localStorage.setItem('iqosEndTime', e);
        }

        function loadTimeSettings() {
            const s = localStorage.getItem('iqosStartTime');
            const e = localStorage.getItem('iqosEndTime');
            if (s) document.getElementById('startTime').value = s;
            if (e) document.getElementById('endTime').value = e;
        }

        // Inizializzazione
        function init() {
            loadFromStorage();
            // ensure inputs exist before generating
            const startInput = document.getElementById('startTime');
            const endInput = document.getElementById('endTime');
            if (startInput && endInput) {
                // load saved settings and regenerate when user changes values
                loadTimeSettings();
                document.getElementById('applyTimes').addEventListener('click', () => {
                    generateScheduledTimes();
                    updateTimer();
                    updateTimesGrid();
                    updateHistory();
                    saveToStorage();
                    saveTimeSettings();
                });
                // Auto-save when inputs change and refresh UI
                startInput.addEventListener('change', () => { saveTimeSettings(); generateScheduledTimes(); updateTimer(); updateTimesGrid(); });
                endInput.addEventListener('change', () => { saveTimeSettings(); generateScheduledTimes(); updateTimer(); updateTimesGrid(); });
            }
            generateScheduledTimes();
            updateTimer();
            updateHistory();
            updateTimesGrid();

            // Aggiorna ogni secondo
            setInterval(updateTimer, 1000);
        }

        // Avvia l'applicazione quando la pagina è caricata
        document.addEventListener('DOMContentLoaded', init);

        // Impedisce il refresh accidentale su mobile
        let startY;
        document.addEventListener('touchstart', function(e) {
            startY = e.touches[0].pageY;
        });

        document.addEventListener('touchmove', function(e) {
            let y = e.touches[0].pageY;
            if(startY < y && document.body.scrollTop === 0) {
                e.preventDefault();
            }
        }, {passive: false});
    </script>
</body>
<script src="top_buttons.js"></script>
</html>
