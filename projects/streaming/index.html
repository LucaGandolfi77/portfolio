<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Streaming — browse and play free films and public archives from the Internet Archive with a liquid-glass interface.">
<title>Streaming — free films &amp; public archives</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/streaming/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="Streaming" data-id="streaming"
  data-back="../../projects.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<main id="app">
  <section class="hero">
    <div class="hero-orb" aria-hidden="true"></div>
    <div><h1 data-i18n="title">STREAMING</h1><p data-i18n="tagline">Free films and public archives.</p></div>
    <div class="hero-actions">
      <button class="btn ghost" id="langBtn" data-i18n="lang">IT / EN</button>
      <button class="btn ghost" id="themeBtn" data-i18n="theme">Theme</button>
    </div>
  </section>

  <section class="glass search-card">
    <form class="search-row" id="searchForm">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
        data-i18n-placeholder="search" placeholder="Search videos…">
      <button class="btn primary" type="submit">🔍 <span data-i18n="find">Search</span></button>
    </form>
    <div class="chips" id="catChips"></div>
    <div class="filters">
      <label class="mini-field"><span data-i18n="sort">Sort</span><select id="sortSel"></select></label>
      <label class="mini-field"><span data-i18n="yearFrom">Year from</span><input id="yearFrom" type="number" min="1900" max="2026" placeholder="1930"></label>
      <label class="mini-field"><span data-i18n="yearTo">Year to</span><input id="yearTo" type="number" min="1900" max="2026" placeholder="1960"></label>
      <label class="check"><input type="checkbox" id="pdToggle"> <span id="pdLabel">Public domain</span></label>
    </div>
    <p class="hint" id="licenseHint"></p>
  </section>

  <section class="glass" id="player" aria-label="Player">
    <div class="player-head">
      <b id="playerTitle"></b>
      <div class="player-actions">
        <button class="btn ico" id="prevBtn" title="Previous">⏮</button>
        <button class="btn ico" id="nextBtn" title="Next">⏭</button>
        <button class="btn ico" id="pipBtn" title="Picture-in-Picture">🗗</button>
        <button class="btn ico" id="fsBtn" title="Fullscreen">⛶</button>
        <button class="btn ico" id="shareBtn" title="Share">↗</button>
        <button class="btn ico" id="closePlayer" title="Close">✕</button>
      </div>
    </div>
    <div id="playerArea"></div>
  </section>

  <div class="side-panels">
    <aside class="side-panel glass" id="panel-queue">
      <div class="panel-head"><b>📋 <span data-i18n="queue">Queue</span></b><button class="btn ico" id="clearQueue">✕</button><span class="badge hidden" id="queueBadge">0</span></div>
      <div id="queueList"></div>
    </aside>
    <aside class="side-panel glass" id="panel-favorites">
      <div class="panel-head"><b>♥ <span data-i18n="favorites">Favorites</span></b><button class="btn ico" id="clearFav">✕</button></div>
      <div id="favList"></div>
    </aside>
    <aside class="side-panel glass" id="panel-history">
      <div class="panel-head"><b>🕘 <span data-i18n="history">History</span></b><button class="btn ico" id="clearHistory">✕</button></div>
      <div id="historyList"></div>
    </aside>
  </div>

  <div class="tabs-bar glass">
    <button class="stab on" data-panel="results" data-i18n="results">Results</button>
    <button class="stab" data-panel="queue" data-i18n="queue">Queue</button>
    <button class="stab" data-panel="favorites" data-i18n="favorites">Favorites</button>
    <button class="stab" data-panel="history" data-i18n="history">History</button>
    <button class="stab" data-panel="url">🔗 URL</button>
  </div>

  <section id="panel-results" class="glass results-card">
    <h2><span data-i18n="results">Results</span> <small id="resCount"></small></h2>
    <div id="results" aria-live="polite"></div>
    <button class="btn ghost wide hidden" id="loadMore" data-i18n="loadMore">Load more</button>
  </section>

  <section id="panel-url" class="glass">
    <form class="search-row" id="urlForm">
      <input id="urlInput" type="text" inputmode="url" autocapitalize="none" spellcheck="false" autocomplete="off"
        data-i18n-placeholder="urlPlaceholder" placeholder="Paste URL…">
      <button class="btn primary" type="submit">▶ <span data-i18n="play">Play</span></button>
    </form>
    <p class="hint" data-i18n="hint">Direct streaming — no upload, no tracking.</p>
  </section>

  <footer>🎬 Internet Archive · <span data-i18n="tagline">Free films and public archives.</span></footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="glass modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div></div>
</div>
<script type="module" src="js/main.js"></script>
<script src="../_shared/shell.js" defer></script>
</body>
</html>
