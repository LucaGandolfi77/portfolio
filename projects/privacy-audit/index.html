<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141824"><meta name="description" content="Privacy Audit — trasparenza dati locali, zero server."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Privacy Audit</title></head>
<body>
<div id="app"><header id="topbar"><h1>Privacy Audit</h1><nav id="tabs"><button class="tab active" data-tab="overview">Panoramica</button><button class="tab" data-tab="controls">Controlli</button><button class="tab" data-tab="export">Esporta</button></nav></header>
<main id="content">
<section id="tab-overview" class="tab-content active"><h2>Dati locali rilevati</h2><div class="audit-row"><span>Cookie attivi</span><span id="audit-cookies">0</span></div><div class="audit-row"><span>Voci IndexedDB</span><span id="audit-idb">0</span></div><div class="audit-row"><span>LocalStorage chiavi</span><span id="audit-ls">0</span></div><div class="audit-row"><span>Notifiche autorizzate</span><span id="audit-notif">No</span></div></section>
<section id="tab-controls" class="tab-content"><h2>Controlli granulari</h2><button id="btn-clear-cookies">Cancella cookie</button><button id="btn-clear-idb">Cancella IndexedDB</button><button id="btn-clear-ls">Cancella localStorage</button><button id="btn-revoke-notif">Revoca notifiche</button><p id="audit-msg"></p></section>
<section id="tab-export" class="tab-content"><h2>Esporta audit</h2><p>Scarica report locale come file testo.</p><button id="btn-export">Esporta .txt</button></section>
</main></div>
<script src="app.js"></script>
</body></html>
