<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Draw</title>
	<style>
		body{ margin:0; font-family:Inter,system-ui }
		.tools{ position:fixed; left:12px; top:12px; background:#fff;padding:8px;border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.12)}
		canvas{ display:block }
	</style>
</head>
<body>
	<div class="tools">
		<button id="clear">Clear</button>
		<input id="color" type="color" value="#000000">
		<input id="size" type="range" min="1" max="48" value="4">
	</div>
	<canvas id="c"></canvas>
	<script>
		const c=document.getElementById('c'); const ctx=c.getContext('2d'); function fit(){ c.width=innerWidth; c.height=innerHeight; } addEventListener('resize',fit); fit();
		let drawing=false; let last=null; document.addEventListener('pointerdown',e=>{ drawing=true; last=[e.clientX,e.clientY]; }); document.addEventListener('pointerup',()=>{ drawing=false; last=null }); document.addEventListener('pointermove',e=>{ if(!drawing) return; const [x,y]=[e.clientX,e.clientY]; ctx.strokeStyle=document.getElementById('color').value; ctx.lineWidth=document.getElementById('size').value; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(x,y); ctx.stroke(); last=[x,y]; }); document.getElementById('clear').addEventListener('click',()=>ctx.clearRect(0,0,c.width,c.height));
	</script>
</body>
</html>
