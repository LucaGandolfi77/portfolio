<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Seconds between two moments — minutes, hours, days, weeks, Mars years and more. Live, on your device.">
<title>Seconds Distance — time between moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d16;--panel:rgba(15,19,32,.92);--line:rgba(140,180,255,.14);
  --txt:#eef2ff;--dim:#93a3c4;--acc:#00e5ff;--acc2:#ff7ab8;--gold:#ffd166;--ok:#4de3c0;--bad:#ff6b7a;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  background:
    radial-gradient(90% 55% at 12% -6%, rgba(0,229,255,.10) 0%,transparent 55%),
    radial-gradient(80% 50% at 95% 2%, rgba(255,122,184,.09) 0%, transparent 55%),
    var(--bg);
  color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;min-height:100dvh;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#site-top-bar{top:env(safe-area-inset-top)}
button{font-family:inherit;color:inherit;touch-action:manipulation}
input,select,textarea{font-size:16px} /* ≥16px stops iOS auto-zoom */

/* fixed header */
.back-btn{
  position:fixed;top:calc(env(safe-area-inset-top) + var(--site-top-bar-height,36px) + 8px);
  left:calc(env(safe-area-inset-left) + 12px);z-index:60;
  color:var(--dim);text-decoration:none;font-weight:600;font-size:.82rem;
  padding:10px 14px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  min-height:44px;display:inline-flex;align-items:center;
}
.back-btn:active{color:#fff;border-color:var(--acc)}
.brand{position:fixed;top:calc(env(safe-area-inset-top) + var(--site-top-bar-height,36px) + 10px);
  left:50%;transform:translateX(-50%);z-index:59;text-align:center;pointer-events:none;width:min(86vw,560px)}
.brand h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(1rem,4vw,1.3rem);
  background:linear-gradient(92deg,var(--acc),var(--acc2) 60%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand p{font-size:.6rem;color:var(--dim);letter-spacing:2.5px;text-transform:uppercase}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--site-top-bar-height,36px) + 62px)
  14px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h2{font-size:.72rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .sub{color:var(--dim);opacity:.75;text-transform:none;letter-spacing:0;font-weight:500;font-size:.68rem}
.hint{color:var(--dim);font-size:.7rem;line-height:1.5;margin-top:8px;opacity:.85}

/* segmented control */
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
  padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;color:var(--dim);font-weight:700;font-size:.85rem;
  min-height:44px;border-radius:11px;cursor:pointer;padding:5px 2px;line-height:1.2;transition:.15s}
.seg button small{display:block;font-size:.58rem;font-weight:600;opacity:.7;letter-spacing:.3px}
.seg button[aria-pressed="true"]{background:linear-gradient(140deg,var(--acc),#00a8c8);color:#04222b}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.8}

/* date/time fields */
.dt-row{display:flex;align-items:center;gap:8px}
.dt{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;
  color:var(--txt);padding:11px 10px;outline:none;transition:border-color .15s;font-weight:600;
  font-variant-numeric:tabular-nums;width:100%}
.dt:focus{border-color:var(--acc)}
.dt::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
.swap{flex:none;width:46px;height:46px;border-radius:13px;border:1px solid var(--line);cursor:pointer;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.swap:active{transform:scale(.94)}
.swap svg{width:19px;height:19px;stroke:var(--dim)}
.when-txt{font-size:.68rem;color:var(--dim);margin-top:8px;min-height:1em;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--dim);font-weight:700;font-size:.78rem;padding:7px 13px;cursor:pointer;transition:.15s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:linear-gradient(140deg,var(--acc),#00a8c8);color:#04222b;border-color:transparent}
.chip.live[aria-pressed="true"]{background:linear-gradient(140deg,#ff7ab8,#c84b8a);color:#2b0418}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;
  vertical-align:1px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* hero result */
.hero{text-align:center;padding:10px 4px 4px}
.hero .sign{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:800;min-height:1.4em}
.hero .big{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(2rem,11vw,3.4rem);line-height:1.15;
  background:linear-gradient(120deg,#fff,#9fd9ff 55%,var(--acc));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  font-variant-numeric:tabular-nums;word-break:break-word;margin:4px 0 2px}
.hero .unit{font-size:.9rem;color:var(--dim);font-weight:700;letter-spacing:.5px;min-height:1.3em}
.hero .equiv{font-size:.8rem;color:var(--dim);margin-top:6px;min-height:1.3em}
.seg.units{margin:14px 0 4px}

/* breakdown + lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;
  border-bottom:1px solid rgba(140,180,255,.07);min-height:44px}
.row:last-child{border-bottom:none}
.row .l{display:flex;align-items:center;gap:9px;font-size:.82rem;color:var(--dim);min-width:0}
.row .v{font-weight:800;font-size:.98rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v small{font-weight:600;color:var(--dim);font-size:.68rem;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.06);flex:1;max-width:90px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:300;background:var(--panel);
  border:1px solid var(--line);color:var(--txt);font-size:.83rem;font-weight:600;
  padding:12px 20px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;
  text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:380px){.brand p{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main class="wrap">

  <!-- WHEN -->
  <section class="card" aria-label="Choose the two moments">
    <h2>Two moments</h2>

    <div class="dt-row">
      <div style="flex:1;min-width:0">
        <label class="hint" for="startDt" style="margin-top:0;margin-bottom:5px;display:block">Start</label>
        <input class="dt" type="datetime-local" id="startDt">
      </div>
      <button class="swap" id="swapBtn" aria-label="Swap dates" title="Swap dates">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
      </button>
      <div style="flex:1;min-width:0">
        <label class="hint" for="endDt" style="margin-top:0;margin-bottom:5px;display:block">End</label>
        <input class="dt" type="datetime-local" id="endDt">
      </div>
    </div>

    <p class="when-txt" id="whenTxt"></p>

    <div class="chips" style="margin-top:12px" role="group" aria-label="Start presets">
      <button class="chip live" id="liveBtn" aria-pressed="true"><span class="live-dot"></span>Live from now</button>
      <button class="chip" data-start="-1h">− 1 hour</button>
      <button class="chip" data-start="-1d">− 1 day</button>
      <button class="chip" data-start="-1w">− 1 week</button>
      <button class="chip" data-start="-1y">− 1 year</button>
      <button class="chip" data-start="-10y">− 10 years</button>
    </div>
    <div class="chips" style="margin-top:8px" role="group" aria-label="End presets">
      <button class="chip" data-end="10">+ 10 s</button>
      <button class="chip" data-end="60">+ 1 min</button>
      <button class="chip" data-end="3600">+ 1 h</button>
      <button class="chip" data-end="86400">+ 1 d</button>
      <button class="chip" data-end="604800">+ 1 week</button>
      <button class="chip" data-end="ny">New Year</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="card" aria-label="Result">
    <div class="seg units" id="unitSeg" role="group" aria-label="Result unit">
      <button data-unit="seconds" aria-pressed="true">Seconds<small>s</small></button>
      <button data-unit="minutes" aria-pressed="false">Minutes<small>min</small></button>
      <button data-unit="hours" aria-pressed="false">Hours<small>h</small></button>
      <button data-unit="days" aria-pressed="false">Days<small>d</small></button>
      <button data-unit="weeks" aria-pressed="false">Weeks<small>wk</small></button>
    </div>
    <div class="hero">
      <div class="sign" id="signTxt">TIME BETWEEN</div>
      <div class="big" id="bigVal">—</div>
      <div class="unit" id="unitTxt"></div>
      <div class="equiv" id="equivTxt"></div>
    </div>
  </section>

  <!-- BREAKDOWN -->
  <section class="card" aria-label="Time breakdown">
    <h2>In full <span class="sub" id="brkNote"></span></h2>
    <div class="rows" id="brkRows"></div>
  </section>

  <!-- PLANETS -->
  <section class="card" aria-label="Planetary years">
    <h2>Around the Sun <span class="sub">your seconds in other planets’ years</span></h2>
    <div class="rows" id="planetRows"></div>
    <p class="hint" id="planetNote"></p>
  </section>

  <!-- FUN -->
  <section class="card" aria-label="Fun units">
    <h2>Made of <span class="sub">a few ways to feel it</span></h2>
    <div class="rows" id="funRows"></div>
  </section>

</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
function fmt(n,dec){ // grouped number; decimals when small; scientific for tiny
  if(!isFinite(n))return '\u2014';
  var abs=Math.abs(n);
  if(abs>0&&abs<0.01)return n.toExponential(1);
  var d;
  if(abs>=1000)d=0;
  else if(abs>=100)d=1;
  else if(abs>=1)d=Math.min(dec,3);
  else d=Math.min(dec,4);
  return n.toLocaleString('en-US',{maximumFractionDigits:d});
}

/* ---------- state ---------- */
var state={
  unit:'seconds',
  live:true,
  endFixed:null      // fixed end date while live (countdown target)
};
var DAY=86400, MONTH=30.436875*DAY, YEAR=365.2425*DAY;

/* ---------- pickers ---------- */
function fmtInput(d){
  var p=function(x){return String(x).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function setStart(d){$('startDt').value=fmtInput(d);}
function setEnd(d){$('endDt').value=fmtInput(d);}

/* ---------- live / presets ---------- */
$('liveBtn').addEventListener('click',function(){
  state.live=!state.live;
  this.setAttribute('aria-pressed',String(state.live));
  if(state.live){
    var e=$('endDt').value;
    state.endFixed=e?new Date(e).getTime():Date.now()+3600*1000;
    if(!e)setEnd(new Date(state.endFixed));
    setStart(new Date());
    toast('Live countdown from now');
  }else{
    toast('Live off — editing the start moment');
  }
  refresh(true);
});
Array.prototype.forEach.call(document.querySelectorAll('.chip[data-start]'),function(b){
  b.addEventListener('click',function(){
    state.live=false;$('liveBtn').setAttribute('aria-pressed','false');
    var s=b.dataset.start,n=new Date();
    setStart(new Date(n.getTime()+parseInt(s,10)*3600*1000));
    refresh(true);
  });
});
Array.prototype.forEach.call(document.querySelectorAll('.chip[data-end]'),function(b){
  b.addEventListener('click',function(){
    var secs=b.dataset.end,base=currentStart();
    var end;
    if(secs==='ny'){
      end=new Date(base.getFullYear()+1,0,1);
      toast('Countdown to '+ (base.getFullYear()+1));
    }else{
      end=new Date(base.getTime()+parseInt(secs,10)*1000);
    }
    setEnd(end);
    if(state.live)state.endFixed=end.getTime();
    refresh(true);
  });
});
$('swapBtn').addEventListener('click',function(){
  var s=$('startDt').value,e=$('endDt').value;
  if(state.live){state.live=false;$('liveBtn').setAttribute('aria-pressed','false');}
  $('startDt').value=e;$('endDt').value=s;
  toast('Moments swapped');
  refresh(true);
});

/* ---------- units segmented ---------- */
var UNITS={seconds:1,minutes:60,hours:3600,days:DAY,weeks:7*DAY};
(function(){
  var seg=$('unitSeg');
  Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(seg.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x===b));});
      state.unit=b.dataset.unit;
      refresh(false);
    });
  });
})();

/* ---------- computation ---------- */
function currentStart(){
  if(state.live)return new Date();
  var v=$('startDt').value;return v?new Date(v):null;
}
function currentEnd(){
  if(state.live&&state.endFixed)return new Date(state.endFixed);
  var v=$('endDt').value;return v?new Date(v):null;
}
function diffSeconds(){
  var a=currentStart(),b=currentEnd();
  if(!a||!b)return null;
  return (b.getTime()-a.getTime())/1000;
}

/* planetary year lengths (sidereal, days) */
var PLANETS=[
  {n:'Mercury',d:87.969,c:'#b8b2a6',emoji:'\u2600'},
  {n:'Venus',d:224.701,c:'#e8c58a',emoji:'\u2601'},
  {n:'Earth',d:365.256,c:'#4de3c0',emoji:'\uD83C\uDF0D'},
  {n:'Mars',d:686.980,c:'#ff7a7a',emoji:'\uD83D\uDE80'},
  {n:'Jupiter',d:4332.59,c:'#e0a25c',emoji:'\uD83E\uDE90'},
  {n:'Saturn',d:10759.22,c:'#e8d79a',emoji:'\uD83D\uDE80'},
  {n:'Uranus',d:30688.5,c:'#8ad9e8',emoji:'\uD83D\uDE80'},
  {n:'Neptune',d:60182,c:'#5c7ae0',emoji:'\uD83D\uDE80'},
  {n:'Pluto',d:90560,c:'#c9b8e0',emoji:'\uD83D\uDE80'}
];
var FUN=[
  {n:'Sunrises & sunsets',k:function(s){return s/DAY;},u:'',d:DAY},
  {n:'Full moons',k:function(s){return s/(29.5306*DAY);},u:'',d:29.5306*DAY},
  {n:'Heartbeats',k:function(s){return s*1.2;},u:'',d:0.83},
  {n:'Breaths',k:function(s){return s/5;},u:'',d:5},
  {n:'Light travels',k:function(s){return s*299792.458;},u:'km',d:1/299792.458}
];
function plural(n,one,many){n=Math.round(n);return n===1?one:many;}

/* ---------- render ---------- */
function heroValue(sec){
  var abs=Math.abs(sec);
  if(state.unit==='seconds')return Math.floor(abs);
  return abs/UNITS[state.unit];
}
function unitLabel(v){
  var labels={seconds:'second',minutes:'minute',hours:'hour',days:'day',weeks:'week'};
  var one=labels[state.unit];
  return (Math.abs(v-one)<0.005||v===1)?one:one+'s';
}
function equivText(sec){
  var abs=Math.abs(sec);
  var days=abs/DAY, yrs=abs/YEAR;
  var parts=[];
  if(days<1)parts.push(fmt(abs,0)+' '+plural(abs,'second','seconds'));
  else if(yrs<1)parts.push(fmt(days,2)+' '+plural(days,'day','days'));
  else parts.push(fmt(yrs,2)+' '+plural(yrs,'year','years'));
  if(state.unit!=='seconds')parts.push(fmt(abs,0)+' seconds');
  return parts.join(' \u00b7 ');
}
function splitTime(sec){
  sec=Math.floor(Math.abs(sec));
  var y=Math.floor(sec/YEAR),rem=sec-y*YEAR;
  var mo=Math.floor(rem/MONTH);rem=rem-mo*MONTH;
  var d=Math.floor(rem/DAY);rem=rem-d*DAY;
  var h=Math.floor(rem/3600);rem=rem-h*3600;
  var m=Math.floor(rem/60),s=rem-m*60;
  return {y:y,mo:mo,d:d,h:h,m:m,s:s};
}
function maxOfParts(p){return Math.max(p.y,p.mo,p.d,p.h,p.m,p.s,1);}
function renderBreakdown(sec){
  var p=splitTime(sec),mx=maxOfParts(p);
  var items=[
    {k:'y',l:'Years',v:p.y,c:'#ffd166'},
    {k:'mo',l:'Months',v:p.mo,c:'#ff9f68'},
    {k:'d',l:'Days',v:p.d,c:'#4de3c0'},
    {k:'h',l:'Hours',v:p.h,c:'#00e5ff'},
    {k:'m',l:'Minutes',v:p.m,c:'#7aa2ff'},
    {k:'s',l:'Seconds',v:p.s,c:'#ff7ab8'}
  ];
  var box=$('brkRows');box.innerHTML='';
  items.forEach(function(it){
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<span class="l"><span class="dot" style="background:'+it.c+'"></span>'+it.l+'</span>'+
      '<span class="bar"><i style="width:'+Math.max(2,it.v/mx*100)+'%;background:'+it.c+'"></i></span>'+
      '<span class="v">'+it.v.toLocaleString()+'<small>'+it.k+'</small></span>';
    box.appendChild(r);
  });
  $('brkNote').textContent='\u2248 calendar split';
}
function renderPlanets(sec){
  var abs=Math.abs(sec),box=$('planetRows');
  box.innerHTML='';
  var maxV=0;
  var vals=PLANETS.map(function(p){var v=abs/(p.d*DAY);if(v>maxV)maxV=v;return v;});
  PLANETS.forEach(function(p,i){
    var v=vals[i];
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<span class="l"><span class="dot" style="background:'+p.c+'"></span>'+p.n+'</span>'+
      '<span class="bar"><i style="width:'+Math.max(2,v/maxV*100)+'%;background:'+p.c+'"></i></span>'+
      '<span class="v">'+fmt(v,3)+'<small>yrs</small></span>';
    box.appendChild(r);
  });
  $('planetNote').textContent='One '+PLANETS[3].n+' year \u2248 '+PLANETS[3].d.toLocaleString()+' Earth days (and one Pluto year \u2248 '+PLANETS[8].d.toLocaleString()+').';
}
function renderFun(sec){
  var abs=Math.abs(sec),box=$('funRows');
  box.innerHTML='';
  FUN.forEach(function(f){
    var v=f.k(abs);
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<span class="l">'+f.n+'</span><span class="v" style="font-size:.9rem">'+fmt(v,2)+
      (f.u?' <small>'+f.u+'</small>':'')+'</span>';
    box.appendChild(r);
  });
}

/* ---------- main render ---------- */
function refresh(full){
  var sec=diffSeconds();
  var sign=$('signTxt'),big=$('bigVal'),unit=$('unitTxt'),eq=$('equivTxt');
  if(sec===null||!isFinite(sec)){
    sign.textContent='';big.textContent='\u2014';unit.textContent='Pick two moments';eq.textContent='';
    return;
  }
  var abs=Math.abs(sec);
  var past=sec<0;
  sign.textContent=state.live?(past?'TARGET PASSED':'COUNTDOWN'):(past?'ENDED · GOING BACK':'TIME BETWEEN');
  var disp=heroValue(abs);
  big.textContent=fmt(disp,state.unit==='seconds'?0:2);
  unit.textContent=unitLabel(disp)+(past?' (in the past)':'');
  eq.textContent=equivText(abs);
  if(full){
    var a=currentStart(),b=currentEnd();
    $('whenTxt').textContent=state.live
      ?'Now \u2192 '+weekday(b)+', '+niceDate(b)
      :weekday(a)+' '+niceDate(a)+'  \u2192  '+weekday(b)+', '+niceDate(b);
    renderBreakdown(abs);
    renderPlanets(abs);
    renderFun(abs);
  }
}
function weekday(d){return d.toLocaleDateString('en-US',{weekday:'short'});}
function niceDate(d){
  return d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'})+
    ' \u00b7 '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  var el=$('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show');},1800);
}

/* ---------- events ---------- */
$('startDt').addEventListener('change',function(){
  if(state.live){state.live=false;$('liveBtn').setAttribute('aria-pressed','false');}
  refresh(true);
});
$('endDt').addEventListener('change',function(){
  var e=$('endDt').value;
  if(e)state.endFixed=new Date(e).getTime();
  refresh(true);
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh(true);});

/* ---------- init ---------- */
function init(){
  var now=new Date();
  state.endFixed=now.getTime()+3*DAY*1000;
  setStart(now);
  setEnd(new Date(state.endFixed));
  refresh(true);
  setInterval(function(){refresh(false);},250);
}
init();
})();
