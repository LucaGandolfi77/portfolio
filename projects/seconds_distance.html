<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seconds Distance Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="datetime-local"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #27ae60;
            min-height: 1.5em;
        }
        .description {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .nav-back {
            display: inline-block;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .nav-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Seconds Distance</h1>
    <p class="description">Calculate the exact number of seconds between two dates.</p>

    <div class="input-group">
        <label for="startDate">Start Date & Time:</label>
        <input type="datetime-local" id="startDate">
    </div>

    <div class="input-group">
        <label for="endDate">End Date & Time:</label>
        <input type="datetime-local" id="endDate">
    </div>

    <button onclick="calculateSeconds()">Calculate Difference</button>

    <div id="result"></div>
    
    <a href="index.html" class="nav-back">← Back to Portfolio</a>
</div>

<script>
    // Set default values to current time and 1 hour from now for convenience
    window.onload = function() {
        const now = new Date();
        const oneHourLater = new Date(now.getTime() + 60 * 60 * 1000);
        
        // Format for datetime-local input (YYYY-MM-DDTHH:MM)
        const formatDateTime = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        };

        document.getElementById('startDate').value = formatDateTime(now);
        document.getElementById('endDate').value = formatDateTime(oneHourLater);
    };

    function calculateSeconds() {
        const startDateStr = document.getElementById('startDate').value;
        const endDateStr = document.getElementById('endDate').value;
        const resultDiv = document.getElementById('result');

        if (!startDateStr || !endDateStr) {
            resultDiv.style.color = '#e74c3c';
            resultDiv.textContent = "Please select both dates.";
            return;
        }

        const startDate = new Date(startDateStr);
        const endDate = new Date(endDateStr);

        // Get timestamps in milliseconds
        const startMillis = startDate.getTime();
        const endMillis = endDate.getTime();

        // Calculate difference in seconds
        const diffSeconds = (endMillis - startMillis) / 1000;

        let message = "";
        if (diffSeconds >= 0) {
            message = `${Math.floor(diffSeconds).toLocaleString()} seconds`;
        } else {
            // If end date is before start date
            message = `${Math.floor(Math.abs(diffSeconds)).toLocaleString()} seconds (in the past)`;
        }

        resultDiv.style.color = '#27ae60';
        resultDiv.textContent = message;
    }
</script>

</body>
</html>
