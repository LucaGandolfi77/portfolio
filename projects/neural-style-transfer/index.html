<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d1a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Real-time GPU style transfer studio with optional on-device neural rendering, camera mode, style mixing and offline PWA.">
  <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/projects/neural-style-transfer/index.html">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="../_shared/tokens.css">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="../_shared/shell.css">
  <link rel="stylesheet" href="./styles.css">
  <title>Neural Style Studio — Luca Gandolfi</title>
</head>
<body>
  <header data-project-shell data-title="Neural Style Studio" data-id="neural-style-transfer"
          data-back="../../projects.html" data-home="../../index.html" data-languages="en,it"></header>

  <main class="studio">
    <section class="stage-wrap">
      <div id="stage">
        <canvas id="canvas" aria-label="Stylized image preview"></canvas>
        <canvas id="resultCanvas" hidden aria-label="Neural render result"></canvas>
        <canvas id="maskCanvas" hidden aria-hidden="true"></canvas>
        <video id="video" playsinline autoplay muted hidden aria-hidden="true"></video>
        <div class="split-labels"><span data-i18n="beforeAfter">Before / after</span><b id="splitLabel">—</b></div>
      </div>
      <div class="status-row">
        <span id="status" role="status" aria-live="polite" data-i18n="statusReady">Ready</span>
        <div class="progress"><i id="progressBar"></i></div>
        <span id="progressText"></span>
      </div>
    </section>

    <aside class="panel">
      <h1 data-i18n="title">Neural Style Studio</h1>
      <p class="lede" data-i18n="subtitle">Real-time GPU previews. Optional neural renders.</p>

      <div class="group">
        <span class="label" data-i18n="content">Photo</span>
        <div class="thumbs" id="contentStrip">
          <button class="thumb active" type="button" data-content="examples/content-0.svg" aria-label="Landscape"><img src="examples/content-0.svg" alt="Landscape"></button>
          <button class="thumb" type="button" data-content="examples/content-1.svg" aria-label="Portrait"><img src="examples/content-1.svg" alt="Portrait"></button>
          <button class="thumb" type="button" data-content="examples/content-2.svg" aria-label="City"><img src="examples/content-2.svg" alt="City"></button>
          <button class="thumb upload" type="button" id="btnUploadPhoto" aria-label="Upload photo">📁</button>
        </div>
      </div>

      <div class="group">
        <span class="label" data-i18n="styles">Style</span>
        <div class="segmented">
          <button class="seg active" type="button" data-mode="gpu" data-i18n="gpuMode">GPU preview</button>
          <button class="seg" type="button" data-mode="neural" data-i18n="neuralMode">Neural render</button>
        </div>
        <div class="thumbs" id="styleStripGpu">
          <button class="thumb active" type="button" data-gpu-style="starry" aria-label="Starry Night"><img src="examples/style-0.svg" alt="Starry Night"></button>
          <button class="thumb" type="button" data-gpu-style="cubismo" aria-label="Cubismo"><img src="examples/style-1.svg" alt="Cubismo"></button>
          <button class="thumb" type="button" data-gpu-style="pixel" aria-label="Pixel Art"><img src="examples/style-2.svg" alt="Pixel Art"></button>
          <button class="thumb" type="button" data-gpu-style="abstract" aria-label="Abstract"><img src="examples/style-3.svg" alt="Abstract"></button>
          <button class="thumb" type="button" data-gpu-style="ukiyoe" aria-label="Ukiyo-e"><img src="examples/style-4.svg" alt="Ukiyo-e"></button>
        </div>
        <div class="thumbs" id="styleStripNeural" hidden>
          <button class="thumb active" type="button" data-neural-style="candy" aria-label="Candy">🍬</button>
          <button class="thumb" type="button" data-neural-style="mosaic" aria-label="Mosaic">🧩</button>
          <button class="thumb" type="button" data-neural-style="rain-princess" aria-label="Rain Princess">🌧️</button>
          <button class="thumb" type="button" data-neural-style="udnie" aria-label="Udnie">🎨</button>
          <button class="thumb" type="button" data-neural-style="pointilism" aria-label="Pointilism">🔵</button>
        </div>
        <button class="ghost wide" type="button" id="btnUploadStyle" data-i18n="customStyle">Custom style</button>
      </div>

      <div class="group sliders">
        <label><span data-i18n="strength">Strength</span><input type="range" id="strength" min="0" max="100" value="70"><b id="strengthVal">70%</b></label>
        <label><span data-i18n="mix">Style mix</span><input type="range" id="mix" min="0" max="100" value="30"><b id="mixVal">30%</b></label>
        <label><span data-i18n="brush">Brush size</span><input type="range" id="brush" min="10" max="120" value="45"><b id="brushVal">45</b></label>
        <label><span data-i18n="beforeAfter">Before / after</span><input type="range" id="split" min="0" max="100" value="100"><b id="splitVal">100%</b></label>
      </div>

      <div class="actions">
        <button class="btn primary" type="button" id="btnEnhance" data-i18n="enhance">Enhance with AI</button>
        <button class="btn" type="button" id="btnCamera" data-i18n="camera">Camera</button>
        <button class="btn" type="button" id="btnSnapshot" data-i18n="snapshot">Snapshot</button>
        <button class="btn" type="button" id="btnTimelapse" data-i18n="timelapse">Timelapse</button>
        <button class="btn" type="button" id="btnDownload" data-i18n="download">Download</button>
        <button class="btn" type="button" id="btnRandom" data-i18n="randomize">Randomize</button>
        <button class="btn ghost" type="button" id="btnClearMask" data-i18n="clearMask">Clear mask</button>
      </div>

      <p class="hint" data-i18n="neuralHint">The neural render downloads a 6.6 MB model on first use and is then cached.</p>
      <select id="quality" aria-label="Quality"><option value="high" data-i18n="high">High</option><option value="low" data-i18n="low">Low</option></select>
    </aside>
  </main>

  <div id="timeline" class="timeline" hidden>
    <button class="icon-btn" type="button" id="tlPlay" aria-label="Play">▶</button>
    <input type="range" id="tlScrub" min="0" max="100" value="0">
    <span id="tlLabel">0 <span data-i18n="frames">frames</span></span>
    <button class="icon-btn" type="button" id="tlClose" aria-label="Close">×</button>
  </div>

  <div id="infoModal" class="modal" hidden>
    <div class="modal-card">
      <h2 data-i18n="howTitle">How it works</h2>
      <p data-i18n="howText">GPU shaders stylize your photo instantly…</p>
      <button class="btn primary" type="button" id="btnInfoClose" data-i18n="close">Close</button>
    </div>
  </div>
  <button class="info-fab" type="button" id="btnInfo" aria-label="Info">ℹ️</button>
  <input type="file" id="filePhoto" accept="image/*" hidden>
  <input type="file" id="fileStyle" accept="image/*" hidden>
  <div id="toasts" aria-live="polite"></div>

  <script src="../_shared/shell.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
