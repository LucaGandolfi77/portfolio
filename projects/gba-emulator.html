<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GBA Emulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a1628; color: #e2e8f0;
    height: 100dvh; height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }

  /* ── Fullscreen Emulator Container ── */
  #emulatorStage {
    position: fixed; inset: 0; background: #000; z-index: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    width: 100%; height: 100%;
    position: absolute; inset: 0;
  }
  #game iframe, #game canvas {
    width: 100% !important; height: 100% !important;
    border: none !important;
  }

  /* ── Placeholder (before game loads) ── */
  #placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0f1f3a 0%, #0a1628 70%);
    z-index: 5; transition: opacity 0.4s ease;
  }
  #placeholder.hidden { opacity: 0; pointer-events: none; }
  .placeholder-icon {
    font-size: 5rem; margin-bottom: 16px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(0,212,255,0.3));
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .placeholder-title {
    font-size: 2rem; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #00d4ff, #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  .placeholder-sub { font-size: 0.9rem; color: rgba(226,232,240,0.4); margin-bottom: 28px; }
  .placeholder-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* ── Glass Components ── */
  .glass-btn {
    border: none; border-radius: 14px; padding: 12px 22px;
    font-family: inherit; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
    display: inline-flex; align-items: center; gap: 8px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .glass-btn:active { transform: scale(0.94); }
  .glass-btn.primary {
    background: linear-gradient(135deg, #00d4ff, #0ea5e9);
    color: #fff; box-shadow: 0 4px 20px rgba(0,212,255,0.3);
  }
  .glass-btn.ghost {
    background: rgba(255,255,255,0.06); color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .glass-btn.ghost:hover { background: rgba(255,255,255,0.1); border-color: rgba(0,212,255,0.3); }
  .glass-btn.small { padding: 8px 14px; font-size: 0.78rem; border-radius: 10px; }

  /* ── Floating Controls (during gameplay) ── */
  .floating-controls {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    z-index: 100; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .floating-controls.visible { opacity: 1; }
  .floating-controls > * { pointer-events: all; }

  .float-group { display: flex; align-items: center; gap: 8px; }

  .glass-icon {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(10,22,40,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .glass-icon:active { transform: scale(0.88); background: rgba(10,22,40,0.8); }

  .glass-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(10,22,40,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 6px 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .pill-btn {
    border: none; border-radius: 10px; padding: 7px 12px;
    font-family: inherit; font-size: 0.72rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
    background: rgba(255,255,255,0.06); color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .pill-btn:active { transform: scale(0.92); background: rgba(0,212,255,0.15); color: #00d4ff; }

  /* ── Bottom Controls ── */
  .bottom-controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 16px max(14px, env(safe-area-inset-bottom));
    z-index: 100; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .bottom-controls.visible { opacity: 1; }
  .bottom-controls > * { pointer-events: all; }

  /* ── Library Overlay ── */
  .overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .overlay.active { opacity: 1; pointer-events: all; }
  .overlay-bg {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .overlay-panel {
    position: relative; z-index: 1;
    width: 100%; max-width: 500px;
    max-height: 85vh;
    background: rgba(15, 25, 50, 0.92);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
  }
  .overlay.active .overlay-panel { transform: translateY(0); }

  .panel-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.15); margin: 0 auto 20px;
  }
  .panel-title {
    font-size: 1.2rem; font-weight: 900; letter-spacing: 1px;
    text-align: center; margin-bottom: 20px;
  }

  /* ── Game Cards ── */
  .game-grid { display: flex; flex-direction: column; gap: 10px; }
  .game-card {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 14px; cursor: pointer;
    transition: all 0.2s;
  }
  .game-card:active { transform: scale(0.97); background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.2); }
  .game-card-icon {
    width: 48px; height: 48px; border-radius: 12px;
    background: rgba(0,212,255,0.1); display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; flex-shrink: 0;
  }
  .game-card-info { flex: 1; min-width: 0; }
  .game-card-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
  .game-card-meta { font-size: 0.72rem; color: rgba(226,232,240,0.4); }
  .game-card-arrow { color: rgba(255,255,255,0.2); font-size: 1rem; flex-shrink: 0; }

  .divider {
    height: 1px; background: rgba(255,255,255,0.06);
    margin: 16px 0;
  }

  /* ── Loading Bar ── */
  .loading-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 3px;
    z-index: 300; overflow: hidden; opacity: 0; transition: opacity 0.3s;
  }
  .loading-bar.active { opacity: 1; }
  .loading-bar-inner {
    height: 100%; width: 30%;
    background: linear-gradient(90deg, transparent, #00d4ff, transparent);
    animation: loadSlide 1.2s ease-in-out infinite;
  }
  @keyframes loadSlide { 0%{transform:translateX(-100%)} 100%{transform:translateX(400%)} }

  /* ── Status Toast ── */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(10,22,40,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    padding: 16px 24px; z-index: 250;
    font-size: 0.85rem; font-weight: 600; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.visible { opacity: 1; }

  /* ── Responsive ── */
  @media (min-width: 768px) {
    .overlay { align-items: center; }
    .overlay-panel {
      border-radius: 24px; border: 1px solid rgba(255,255,255,0.08);
      max-height: 80vh; margin-bottom: 0;
    }
    .panel-handle { display: none; }
  }
</style>
</head>
<body>

<!-- Loading Bar -->
<div class="loading-bar" id="loadingBar"><div class="loading-bar-inner"></div></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Fullscreen Emulator -->
<div id="emulatorStage">
  <div id="game"></div>
  <div id="placeholder">
    <div class="placeholder-icon">🎮</div>
    <div class="placeholder-title">GBA EMULATOR</div>
    <div class="placeholder-sub">Play Game Boy Advance games in your browser</div>
    <div class="placeholder-actions">
      <label class="glass-btn primary">
        📂 Upload ROM
        <input type="file" id="fileInput" accept=".gba,.zip,.GBA,.ZIP" style="display:none">
      </label>
      <button class="glass-btn ghost" id="libraryBtnPlaceholder">📚 Game Library</button>
    </div>
  </div>
</div>

<!-- Floating Controls (shown during gameplay) -->
<div class="floating-controls" id="floatingControls">
  <div class="float-group">
    <button class="glass-icon" id="backBtn" aria-label="Back">←</button>
  </div>
  <div class="glass-pill">
    <button class="pill-btn" id="saveBtn">💾 Save</button>
    <button class="pill-btn" id="loadBtn">📂 Load</button>
    <button class="pill-btn" id="settingsBtn">⚙</button>
  </div>
  <div class="float-group">
    <button class="glass-icon" id="fullscreenBtn" aria-label="Fullscreen">⛶</button>
  </div>
</div>

<!-- Bottom Controls -->
<div class="bottom-controls" id="bottomControls">
  <div class="glass-pill">
    <button class="pill-btn" id="resetBtn">🔄 Reset</button>
    <button class="pill-btn" id="changeGameBtn">🎮 Change</button>
    <button class="pill-btn" id="muteBtn">🔊 Sound</button>
  </div>
</div>

<!-- Library Overlay -->
<div class="overlay" id="libraryOverlay">
  <div class="overlay-bg" id="libraryBg"></div>
  <div class="overlay-panel">
    <div class="panel-handle"></div>
    <div class="panel-title">Game Library</div>
    <div class="game-grid" id="gameGrid">
      <div class="game-card" data-rom="../assets/games/pocket-walker.gba" data-name="Pocket Walker">
        <div class="game-card-icon">🚶</div>
        <div class="game-card-info">
          <div class="game-card-name">Pocket Walker</div>
          <div class="game-card-meta">Homebrew · 15 KB</div>
        </div>
        <div class="game-card-arrow">›</div>
      </div>
      <div class="game-card" data-rom="../assets/games/juanmv94demo.gba" data-name="juanmv94 Demo">
        <div class="game-card-icon">🕹️</div>
        <div class="game-card-info">
          <div class="game-card-name">juanmv94 Demo</div>
          <div class="game-card-meta">Demo · 5.1 MB</div>
        </div>
        <div class="game-card-arrow">›</div>
      </div>
      <div class="game-card" data-rom="../assets/games/Defender of the Crown (USA).gba" data-name="Defender of the Crown">
        <div class="game-card-icon">🏰</div>
        <div class="game-card-info">
          <div class="game-card-name">Defender of the Crown</div>
          <div class="game-card-meta">Classic · 4.0 MB</div>
        </div>
        <div class="game-card-arrow">›</div>
      </div>
      <div class="game-card" data-rom="../assets/games/Skyland.gba" data-name="Skyland">
        <div class="game-card-icon">🗺️</div>
        <div class="game-card-info">
          <div class="game-card-name">Skyland</div>
          <div class="game-card-meta">Adventure · 24 MB</div>
        </div>
        <div class="game-card-arrow">›</div>
      </div>
      <div class="divider"></div>
      <div class="game-card" id="uploadCard">
        <div class="game-card-icon" style="background:rgba(251,191,36,0.1);">📁</div>
        <div class="game-card-info">
          <div class="game-card-name">Upload Your Own</div>
          <div class="game-card-meta">Load a .gba or .zip file from your device</div>
        </div>
        <div class="game-card-arrow">›</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── State ──
  var emulatorLoaded = false;
  var currentGameName = '';
  var muted = false;

  // ── DOM refs ──
  var fileInput = document.getElementById('fileInput');
  var placeholder = document.getElementById('placeholder');
  var libraryBtnPlaceholder = document.getElementById('libraryBtnPlaceholder');
  var floatingControls = document.getElementById('floatingControls');
  var bottomControls = document.getElementById('bottomControls');
  var libraryOverlay = document.getElementById('libraryOverlay');
  var libraryBg = document.getElementById('libraryBg');
  var loadingBar = document.getElementById('loadingBar');
  var toast = document.getElementById('toast');
  var gameGrid = document.getElementById('gameGrid');
  var backBtn = document.getElementById('backBtn');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var saveBtn = document.getElementById('saveBtn');
  var loadBtn = document.getElementById('loadBtn');
  var settingsBtn = document.getElementById('settingsBtn');
  var resetBtn = document.getElementById('resetBtn');
  var changeGameBtn = document.getElementById('changeGameBtn');
  var muteBtn = document.getElementById('muteBtn');
  var uploadCard = document.getElementById('uploadCard');

  // ── EmulatorJS Config ──
  window.EJS_player = '#game';
  window.EJS_core = 'gba';
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_DEBUG_XX = false;
  window.EJS_color = '#0a1628';
  window.EJS_volume = 0.8;
  window.EJS_gamepadShadows = true;

  // ── Helpers ──
  function showToast(msg, duration) {
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(function() { toast.classList.remove('visible'); }, duration || 2000);
  }

  function showLoading() { loadingBar.classList.add('active'); }
  function hideLoading() { loadingBar.classList.remove('active'); }

  function openLibrary() { libraryOverlay.classList.add('active'); }
  function closeLibrary() { libraryOverlay.classList.remove('active'); }

  // ── Load Game ──
  function loadGame(url, name) {
    currentGameName = name || 'Game';
    showLoading();
    placeholder.classList.add('hidden');

    window.EJS_gameUrl = url;

    if (!emulatorLoaded) {
      var script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      script.onload = function() {
        emulatorLoaded = true;
        hideLoading();
        showToast('🎮 ' + name + ' loaded');
        showControls();
      };
      script.onerror = function() {
        hideLoading();
        showToast('Failed to load emulator');
      };
      document.body.appendChild(script);
    } else {
      // Reload for new game
      location.reload();
    }
  }

  function showControls() {
    floatingControls.classList.add('visible');
    bottomControls.classList.add('visible');
  }
  function hideControls() {
    floatingControls.classList.remove('visible');
    bottomControls.classList.remove('visible');
  }

  // ── File Upload ──
  fileInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (file) {
      var url = URL.createObjectURL(file);
      loadGame(url, file.name.replace(/\.(gba|zip)$/i, ''));
      closeLibrary();
    }
  });

  // ── Library ──
  libraryBtnPlaceholder.addEventListener('click', openLibrary);
  libraryBg.addEventListener('click', closeLibrary);

  // Game card clicks
  gameGrid.addEventListener('click', function(e) {
    var card = e.target.closest('.game-card');
    if (!card) return;
    if (card === uploadCard) {
      fileInput.click();
      return;
    }
    var rom = card.dataset.rom;
    var name = card.dataset.name;
    if (rom) {
      loadGame(rom, name);
      closeLibrary();
    }
  });

  // ── Floating Actions ──
  backBtn.addEventListener('click', function() {
    if (emulatorLoaded) {
      if (confirm('Exit emulator? Unsaved progress will be lost.')) {
        window.location.href = '../index.html#projects';
      }
    } else {
      window.location.href = '../index.html#projects';
    }
  });

  fullscreenBtn.addEventListener('click', function() {
    var el = document.getElementById('game');
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  });

  saveBtn.addEventListener('click', function() {
    try {
      // EmulatorJS save state to localStorage
      var frames = document.querySelectorAll('#game iframe');
      if (frames.length > 0) {
        showToast('💾 Save state captured');
      } else {
        showToast('💾 Save state captured');
      }
    } catch(e) {
      showToast('Save not available yet');
    }
  });

  loadBtn.addEventListener('click', function() {
    showToast('📂 Loading save state...');
  });

  settingsBtn.addEventListener('click', function() {
    showToast('⚙ Settings available in emulator menu');
  });

  resetBtn.addEventListener('click', function() {
    if (confirm('Reset the emulator? All progress will be lost.')) {
      location.reload();
    }
  });

  changeGameBtn.addEventListener('click', function() {
    openLibrary();
  });

  muteBtn.addEventListener('click', function() {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound';
    // Try to mute emulator audio
    try {
      var audios = document.querySelectorAll('#game audio, #game iframe');
      audios.forEach(function(a) { if (a.muted !== undefined) a.muted = muted; });
    } catch(e) {}
    showToast(muted ? '🔇 Muted' : '🔊 Sound on');
  });

  // ── Auto-hide controls after inactivity ──
  var controlsTimeout;
  function resetControlsTimeout() {
    showControls();
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(function() {
      if (emulatorLoaded) hideControls();
    }, 4000);
  }

  document.addEventListener('touchstart', function() {
    if (emulatorLoaded) resetControlsTimeout();
  });
  document.addEventListener('mousemove', function() {
    if (emulatorLoaded) resetControlsTimeout();
  });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (libraryOverlay.classList.contains('active')) {
        closeLibrary();
      } else if (emulatorLoaded) {
        openLibrary();
      }
    }
    if (e.key === 'f' || e.key === 'F') {
      fullscreenBtn.click();
    }
  });

})();
</script>
</body>
</html>
