<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0d1a">
<meta name="description" content="Audio Neural Analysis — Visualizza lo spettro audio e la predizione del genere musicale con una rete neurale.">
<title>AUDIO NEURAL ANALYSIS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#00d4ff;font-size:clamp(28px,8vw,64px);text-align:center;text-shadow:0 0 30px rgba(0,212,255,.5),0 0 60px rgba(0,212,255,.2);letter-spacing:clamp(4px,2vw,16px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#8892b0;font-size:clamp(9px,2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #00d4ff;background:rgba(0,212,255,.08);color:#d0d0d0;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(0,212,255,.2);box-shadow:0 0 24px #00d4ff}
#credit{position:fixed;bottom:16px;color:#5a6b8b;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;text-align:center;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">AUDIO<br>NEURAL</div>
  <div id="sub">Analisi dello spettro + Genere Musicale</div>
  <button id="apri" onclick="window.location.href='audio-neural-analysis/index.html'">INIZIA</button>
</div>
<div id="credit">Web Audio API + TensorFlow.js • Tutto nel browser 🎧🧠</div>

<script>
const canvas=document.createElement('canvas');document.body.prepend(canvas);
const ctx=canvas.getContext('2d');
let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});

// Simple background particles
const particles=[];
for(let i=0;i<50;i++) particles.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2,vy:(Math.random()-.5)*.4, hue:200+Math.random()*50});
function drawBg(){
  ctx.fillStyle='#0a0d1a';
  ctx.fillRect(0,0,W,H);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.globalAlpha=.7;
    ctx.fillStyle='hsla('+p.hue+',80%,65%,.7)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(drawBg);
}
requestAnimationFrame(drawBg);
</script>
</body>
</html>
