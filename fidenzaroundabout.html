<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidenza's Roundabout — Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #2d3436;
            overflow: hidden;
        }

        /* Background Layer */
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        /* Character Layer */
        #characters {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .character {
            height: 80%;
            max-width: 40%;
            object-fit: contain;
            transition: transform 0.3s ease, opacity 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Dialogue Box */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        #name-label {
            font-size: 1.5rem;
            font-weight: 700;
            color: #feca57;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #000;
        }

        #dialogue-text {
            font-size: 1.2rem;
            color: #fff;
            line-height: 1.6;
        }

        /* Choices Menu */
        #choices-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; /* Flex when active */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            z-index: 20;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: 700;
            color: #2d3436;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            min-width: 300px;
            text-align: center;
        }

        .choice-btn:hover {
            transform: scale(1.05);
            background: #fff;
            color: #00d4ff;
        }

        /* Quick Menu */
        #quick-menu {
            position: absolute;
            bottom: 5px;
            right: 20px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 15;
        }

        .quick-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .quick-btn:hover {
            color: #fff;
        }

        /* Placeholder for characters (Emoji based for now) */
        .char-placeholder {
            font-size: 20rem;
            line-height: 1;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="background"></div>
    <div id="characters"></div>
    
    <div id="ui-layer">
        <div id="dialogue-box">
            <div id="name-label"></div>
            <div id="dialogue-text"></div>
            <div id="quick-menu">
                <button class="quick-btn" onclick="saveGame()">Save</button>
                <button class="quick-btn" onclick="loadGame()">Load</button>
                <button class="quick-btn" onclick="location.href='visualnovels.html'">Exit</button>
            </div>
        </div>
    </div>

    <div id="choices-menu"></div>
</div>

<script>
    // --- Engine Core ---
    const bgLayer = document.getElementById('background');
    const charLayer = document.getElementById('characters');
    const nameLabel = document.getElementById('name-label');
    const dialogueText = document.getElementById('dialogue-text');
    const dialogueBox = document.getElementById('dialogue-box');
    const choicesMenu = document.getElementById('choices-menu');

    let script = {}; // To be defined
    let currentLabel = 'start';
    let currentIndex = 0;
    let state = {
        bg: '#000',
        characters: {},
        history: []
    };

    // --- Script Definition (The Game) ---
    script = {
        'start': [
            { type: 'scene', color: '#2d3436', text: "Fidenza, Italy. A quiet afternoon." },
            { type: 'say', name: '', text: "The engine hums quietly as I approach the dreaded intersection." },
            { type: 'scene', color: '#636e72' }, // Grey road
            { type: 'say', name: 'Me', text: "Another roundabout. They say Fidenza has more roundabouts than people." },
            { type: 'show', char: 'old_man', emoji: '👴', pos: 'center' },
            { type: 'say', name: '???', text: "Hey! You there! In the Fiat Panda!" },
            { type: 'say', name: 'Me', text: "Is he talking to me?" },
            { type: 'say', name: 'Old Man', text: "Do you know the way to the Outlet Village? I've been circling this roundabout for 3 days." },
            { type: 'menu', choices: [
                { text: "Point to the right", jump: 'right_way' },
                { text: "Point to the left", jump: 'wrong_way' },
                { text: "Ignore him and drift", jump: 'drift' }
            ]}
        ],
        'right_way': [
            { type: 'say', name: 'Me', text: "It's just over there, take the first exit!" },
            { type: 'say', name: 'Old Man', text: "Grazie! You saved me!" },
            { type: 'hide', char: 'old_man' },
            { type: 'say', name: '', text: "He drives off safely." },
            { type: 'say', name: 'Me', text: "Good deed done. Now, where was I going?" },
            { type: 'scene', color: '#00b894' }, // Green success
            { type: 'say', name: '', text: "ENDING 1: The Good Samaritan" },
            { type: 'menu', choices: [
                { text: "Play Again", jump: 'start' },
                { text: "Exit", action: 'exit' }
            ]}
        ],
        'wrong_way': [
            { type: 'say', name: 'Me', text: "I think it's that way... *points left*" },
            { type: 'say', name: 'Old Man', text: "Are you sure? That looks like a corn field." },
            { type: 'say', name: 'Me', text: "Trust me, it's a shortcut." },
            { type: 'hide', char: 'old_man' },
            { type: 'say', name: '', text: "He drives into the corn field." },
            { type: 'scene', color: '#d63031' }, // Red fail
            { type: 'say', name: '', text: "ENDING 2: Lost in the Maize" },
            { type: 'menu', choices: [
                { text: "Play Again", jump: 'start' },
                { text: "Exit", action: 'exit' }
            ]}
        ],
        'drift': [
            { type: 'say', name: 'Me', text: "I don't have time for this. VROOM!" },
            { type: 'scene', color: '#a29bfe' }, // Purple drift
            { type: 'say', name: '', text: "I pull the handbrake and drift around the roundabout perfectly." },
            { type: 'show', char: 'cop', emoji: '👮', pos: 'right' },
            { type: 'say', name: 'Police', text: "License and registration, please." },
            { type: 'say', name: 'Me', text: "Uh oh." },
            { type: 'say', name: '', text: "ENDING 3: Busted" },
            { type: 'menu', choices: [
                { text: "Play Again", jump: 'start' },
                { text: "Exit", action: 'exit' }
            ]}
        ]
    };

    // --- Engine Logic ---

    function startGame() {
        currentLabel = 'start';
        currentIndex = 0;
        processLine();
    }

    function processLine() {
        if (!script[currentLabel] || currentIndex >= script[currentLabel].length) {
            return; // End of script
        }

        const line = script[currentLabel][currentIndex];

        if (line.type === 'scene') {
            if (line.color) bgLayer.style.background = line.color;
            // if (line.image) bgLayer.style.backgroundImage = `url(${line.image})`;
            if (line.text) {
                // Scene description as narration
                nameLabel.textContent = '';
                dialogueText.textContent = line.text;
            } else {
                // Just change bg and move next
                currentIndex++;
                processLine();
                return;
            }
        }
        else if (line.type === 'say') {
            nameLabel.textContent = line.name;
            dialogueText.textContent = line.text;
        }
        else if (line.type === 'show') {
            showCharacter(line.char, line.emoji, line.pos);
            currentIndex++;
            processLine();
            return;
        }
        else if (line.type === 'hide') {
            hideCharacter(line.char);
            currentIndex++;
            processLine();
            return;
        }
        else if (line.type === 'menu') {
            showChoices(line.choices);
            return; // Wait for input
        }
    }

    function next() {
        // If menu is open, ignore click
        if (choicesMenu.style.display === 'flex') return;

        currentIndex++;
        processLine();
    }

    dialogueBox.addEventListener('click', next);

    function showCharacter(id, emoji, pos) {
        // Remove if exists
        hideCharacter(id);

        const el = document.createElement('div');
        el.id = `char-${id}`;
        el.className = 'character char-placeholder';
        el.textContent = emoji;
        el.style.position = 'absolute';
        el.style.bottom = '0';
        
        if (pos === 'center') el.style.left = '50%';
        if (pos === 'left') el.style.left = '20%';
        if (pos === 'right') el.style.left = '80%';
        el.style.transform = 'translateX(-50%)';

        charLayer.appendChild(el);
    }

    function hideCharacter(id) {
        const el = document.getElementById(`char-${id}`);
        if (el) el.remove();
    }

    function showChoices(choices) {
        choicesMenu.innerHTML = '';
        choicesMenu.style.display = 'flex';

        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = c.text;
            btn.onclick = () => {
                choicesMenu.style.display = 'none';
                if (c.action === 'exit') {
                    location.href = 'visualnovels.html';
                } else if (c.jump) {
                    currentLabel = c.jump;
                    currentIndex = 0;
                    processLine();
                }
            };
            choicesMenu.appendChild(btn);
        });
    }

    function saveGame() {
        const save = {
            label: currentLabel,
            index: currentIndex
        };
        localStorage.setItem('vn_save', JSON.stringify(save));
        alert('Game Saved!');
    }

    function loadGame() {
        const save = localStorage.getItem('vn_save');
        if (save) {
            const data = JSON.parse(save);
            currentLabel = data.label;
            currentIndex = data.index;
            // Reset visual state (simplified)
            charLayer.innerHTML = ''; 
            processLine();
        } else {
            alert('No save found.');
        }
    }

    // Init
    startGame();

</script>
</body>
</html>
