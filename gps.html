<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Distance Calculator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f1724; color: white; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 36, 0.9);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            min-width: 300px;
            backdrop-filter: blur(10px);
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #00d4ff; }
        .distance-display { font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        .instructions { font-size: 0.9rem; color: #a0c0e0; margin-bottom: 10px; }
        .btn {
            background: #00d4ff;
            color: #0f1724;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .btn:hover { background: #66e0ff; }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 36, 0.9);
            color: #00d4ff;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>

    <a href="technology.html" class="back-btn">← Back</a>

    <div id="info-panel">
        <h1>GPS Distance Calculator</h1>
        <div class="instructions" id="instructions">Click on the map to set the first point.</div>
        <div class="distance-display" id="distance">0.00 km</div>
        <div style="font-size: 0.9rem; color: #a0c0e0;" id="distance-miles">0.00 miles</div>
        <button class="btn" onclick="resetMap()">Reset</button>
    </div>

    <div id="map"></div>

    <script>
        // Initialize map centered on Italy (or user location if possible)
        const map = L.map('map').setView([41.8719, 12.5674], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // Add Search Control
        L.Control.geocoder({
            defaultMarkGeocode: false
        })
        .on('markgeocode', function(e) {
            var bbox = e.geocode.bbox;
            var poly = L.polygon([
                bbox.getSouthEast(),
                bbox.getNorthEast(),
                bbox.getNorthWest(),
                bbox.getSouthWest()
            ]);
            map.fitBounds(poly.getBounds());
        })
        .addTo(map);

        // Try to get user location
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(position => {
                map.setView([position.coords.latitude, position.coords.longitude], 13);
            });
        }

        let markers = [];
        let polyline = null;

        map.on('click', function(e) {
            if (markers.length >= 2) {
                // If we already have 2 points, reset first
                resetMap();
                // Then add the new first point
                addMarker(e.latlng);
            } else {
                addMarker(e.latlng);
            }
        });

        function addMarker(latlng) {
            const marker = L.marker(latlng).addTo(map);
            markers.push(marker);

            if (markers.length === 1) {
                document.getElementById('instructions').textContent = "Click to set the second point.";
            } else if (markers.length === 2) {
                document.getElementById('instructions').textContent = "Distance calculated!";
                calculateDistance();
            }
        }

        function calculateDistance() {
            if (markers.length !== 2) return;

            const p1 = markers[0].getLatLng();
            const p2 = markers[1].getLatLng();

            // Draw line
            polyline = L.polyline([p1, p2], {color: '#00d4ff', weight: 4}).addTo(map);
            map.fitBounds(polyline.getBounds(), {padding: [50, 50]});

            // Calculate distance
            const distanceMeters = p1.distanceTo(p2);
            const distanceKm = (distanceMeters / 1000).toFixed(2);
            const distanceMiles = (distanceMeters * 0.000621371).toFixed(2);

            document.getElementById('distance').textContent = `${distanceKm} km`;
            document.getElementById('distance-miles').textContent = `${distanceMiles} miles`;
        }

        function resetMap() {
            markers.forEach(m => map.removeLayer(m));
            if (polyline) map.removeLayer(polyline);
            markers = [];
            polyline = null;
            document.getElementById('distance').textContent = "0.00 km";
            document.getElementById('distance-miles').textContent = "0.00 miles";
            document.getElementById('instructions').textContent = "Click on the map to set the first point.";
        }
    </script>
</body>
</html>
