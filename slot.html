<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Slot Machine — Spin to win and test your luck — Luca Gandolfi's Portfolio">
    <meta name="keywords" content="slot, machine, game, luck, casino">
    <meta name="author" content="Luca Gandolfi">
    <title>Slot Machine — Luca Gandolfi</title>
    
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .slot-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .slot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .slot-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .slot-subtitle {
            color: #a0c0e0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .slot-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #a0c0e0;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .machine-panel {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), rgba(255, 237, 78, 0.05));
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
        }

        .reels-container {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .reel {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(0, 0, 0, 0.3));
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1);
        }

        .reel-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .reel.spinning {
            animation: spinReel 0.1s linear infinite;
        }

        @keyframes spinReel {
            0%, 100% { transform: rotateX(0deg); }
            50% { transform: rotateX(180deg); }
        }

        .reel.win {
            animation: winGlow 0.5s ease;
            box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.5), 0 0 20px rgba(0, 255, 136, 0.3);
        }

        @keyframes winGlow {
            0%, 100% { box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1), 0 0 0px rgba(0, 255, 136, 0); }
            50% { box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.3), 0 0 20px rgba(0, 255, 136, 0.5); }
        }

        .message-area {
            text-align: center;
            padding: 15px;
            background: rgba(255, 215, 0, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .message-area.win {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .message-area.lose {
            background: rgba(255, 100, 100, 0.1);
            border-color: rgba(255, 100, 100, 0.3);
            color: #ff6464;
        }

        .bet-controls {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .bet-label {
            color: #a0c0e0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .bet-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .bet-btn {
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 6px;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-color: #ffd700;
            color: #0a1428;
        }

        .bet-btn:hover {
            border-color: rgba(255, 215, 0, 0.5);
        }

        .spin-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 8px;
            color: #0a1428;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-game {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-game-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-game-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0c0e0;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            color: #ffd700;
            transform: translateX(-4px);
        }

        .payout-table {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #a0c0e0;
        }

        .payout-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }

        .payout-row:last-child {
            border-bottom: none;
        }

        @media (max-width: 600px) {
            .slot-container {
                padding: 20px 15px;
            }

            .slot-title {
                font-size: 1.8rem;
            }

            .slot-stats {
                gap: 20px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .reel {
                width: 80px;
                height: 100px;
                font-size: 2.8rem;
            }

            .machine-panel {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="lang-top-left" aria-hidden="false">
        <label for="langSelect" class="visually-hidden">Select language</label>
        <select id="langSelect" aria-label="Select language" title="Change language">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 中</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 日本</option>
            <option value="sv">🇸🇪 SV</option>
            <option value="ar">🇸🇦 AR</option>
            <option value="he">🇮🇱 HE</option>
        </select>
    </div>

    <div class="particles" id="particles"></div>

    <div class="slot-container">
        <a href="index.html#games" class="back-button">← <span data-i18n="games.slot.back">Back to Games</span></a>

        <div class="slot-header">
            <h1 class="slot-title">🎰 <span data-i18n="games.slot.gameTitle">Slot Machine</span></h1>
            <p class="slot-subtitle" data-i18n="games.slot.gameSubtitle">Spin to win big!</p>
        </div>

        <div class="slot-stats">
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.slot.balance">Balance</div>
                <div class="stat-value">$<span id="balance">1000</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.slot.bet">Current Bet</div>
                <div class="stat-value">$<span id="bet">10</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.slot.wins">Wins</div>
                <div class="stat-value" id="wins">0</div>
            </div>
        </div>

        <div class="machine-panel">
            <div class="message-area" id="gameMessage" data-i18n="games.slot.startMessage">Place your bet and spin!</div>

            <div class="reels-container" id="reelsContainer">
                <!-- Generated by JS -->
            </div>

            <div class="bet-controls">
                <div class="bet-label" data-i18n="games.slot.selectBet">Select Bet Amount</div>
                <div class="bet-buttons">
                    <button class="bet-btn" data-bet="5">$5</button>
                    <button class="bet-btn active" data-bet="10">$10</button>
                    <button class="bet-btn" data-bet="25">$25</button>
                    <button class="bet-btn" data-bet="50">$50</button>
                    <button class="bet-btn" data-bet="100">$100</button>
                </div>
            </div>

            <button class="spin-btn" id="spinBtn" data-i18n="games.slot.spin">SPIN!</button>

            <div class="game-buttons">
                <button class="btn-game btn-game-secondary" id="newGameBtn" data-i18n="games.slot.newGame">New Game</button>
                <button class="btn-game btn-game-secondary" id="resetBtn" data-i18n="games.slot.reset">Reset Balance</button>
            </div>

            <div class="payout-table">
                <div class="payout-row">
                    <span data-i18n="games.slot.three">🍎🍎🍎</span>
                    <span>10x <span data-i18n="games.slot.bet">Bet</span></span>
                </div>
                <div class="payout-row">
                    <span data-i18n="games.slot.two">🍎🍎 🍌</span>
                    <span>3x <span data-i18n="games.slot.bet">Bet</span></span>
                </div>
                <div class="payout-row">
                    <span data-i18n="games.slot.all">All 🍌</span>
                    <span>5x <span data-i18n="games.slot.bet">Bet</span></span>
                </div>
                <div class="payout-row">
                    <span data-i18n="games.slot.jackpot">🌟🌟🌟</span>
                    <span data-i18n="games.slot.jackpotPayout">100x Bet!</span>
                </div>
            </div>
        </div>
    </div>

    <div id="bonusModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; flex-direction:column; align-items:center; justify-content:center;">
        <h1 style="color:#ffd700; font-size:3rem; text-shadow:0 0 20px #ff0000;">BONUS GAME!</h1>
        <div id="bonusContent" style="font-size:5rem; margin:20px;">🎁</div>
        <p id="bonusResult" style="color:#fff; font-size:2rem;"></p>
        <button id="closeBonusBtn" style="padding:10px 30px; font-size:1.5rem; background:#ffd700; border:none; border-radius:10px; cursor:pointer; display:none;">COLLECT</button>
    </div>

    <script>
        const SYMBOLS = ['🍎', '🍌', '🍊', '🍓', '🍉', '🍇', '🍒', '🍋', '💎', '7️⃣', '🔔', '🎁'];
        const PAYOUTS = {
            '🍎': 0.5, '🍌': 0.5, '🍊': 0.5, 
            '🍓': 1, '🍉': 1, '🍇': 1, 
            '🍒': 2, '🍋': 2, 
            '💎': 5, '7️⃣': 10, '🔔': 15, '🎁': 0 // Bonus triggers special
        };
        
        let balance = localStorage.getItem('slot_balance') ? parseInt(localStorage.getItem('slot_balance')) : 1000;
        let bet = 10;
        let wins = parseInt(localStorage.getItem('slot_wins')) || 0;
        let isSpinning = false;
        const ROWS = 5;
        const COLS = 5;

        // Initialize Grid
        function initGrid() {
            const container = document.getElementById('reelsContainer');
            container.innerHTML = '';
            for (let c = 0; c < COLS; c++) {
                const col = document.createElement('div');
                col.className = 'reel-col';
                for (let r = 0; r < ROWS; r++) {
                    const reel = document.createElement('div');
                    reel.className = 'reel';
                    reel.id = `reel-${c}-${r}`;
                    reel.textContent = getRandomSymbol();
                    col.appendChild(reel);
                }
                container.appendChild(col);
            }
        }

        function updateStats() {
            document.getElementById('balance').textContent = Math.floor(balance);
            document.getElementById('bet').textContent = bet;
            document.getElementById('wins').textContent = wins;
            localStorage.setItem('slot_balance', balance);
            localStorage.setItem('slot_wins', wins);
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = balance < bet;
        }

        function updateMessage(key, className = '') {
            const msgEl = document.getElementById('gameMessage');
            msgEl.textContent = getTranslation(key);
            msgEl.className = 'message-area ' + className;
        }

        function getRandomSymbol() {
            // Weighted random for RTP control
            const rand = Math.random();
            if (rand < 0.45) return SYMBOLS[Math.floor(Math.random() * 3)]; // Common fruits
            if (rand < 0.75) return SYMBOLS[Math.floor(Math.random() * 3) + 3]; // Medium fruits
            if (rand < 0.90) return SYMBOLS[Math.floor(Math.random() * 2) + 6]; // High fruits
            if (rand < 0.96) return SYMBOLS[Math.floor(Math.random() * 3) + 8]; // Rares
            return '🎁'; // Bonus (4% chance per cell)
        }

        function spinReels() {
            if (isSpinning || balance < bet) return;

            isSpinning = true;
            balance -= bet;
            updateStats();

            document.getElementById('spinBtn').disabled = true;
            document.querySelectorAll('.bet-btn').forEach(btn => btn.disabled = true);

            const spinDuration = 1000;
            
            // Animate
            const interval = setInterval(() => {
                for (let c = 0; c < COLS; c++) {
                    for (let r = 0; r < ROWS; r++) {
                        const el = document.getElementById(`reel-${c}-${r}`);
                        el.textContent = getRandomSymbol();
                        el.classList.add('spinning');
                    }
                }
            }, 100);

            setTimeout(() => {
                clearInterval(interval);
                const finalGrid = [];
                
                for (let c = 0; c < COLS; c++) {
                    const colData = [];
                    for (let r = 0; r < ROWS; r++) {
                        const symbol = getRandomSymbol();
                        colData.push(symbol);
                        const el = document.getElementById(`reel-${c}-${r}`);
                        el.textContent = symbol;
                        el.classList.remove('spinning');
                        el.classList.remove('win');
                    }
                    finalGrid.push(colData);
                }

                checkResults(finalGrid);
                
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                document.querySelectorAll('.bet-btn').forEach(btn => btn.disabled = false);
            }, spinDuration);
        }

        function checkResults(grid) {
            let totalWin = 0;
            let bonusCount = 0;
            let winCells = new Set();

            // Count Bonus Symbols
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    if (grid[c][r] === '🎁') bonusCount++;
                }
            }

            // Check Lines (Horizontal)
            for (let r = 0; r < ROWS; r++) {
                let matchCount = 1;
                let currentSym = grid[0][r];
                for (let c = 1; c < COLS; c++) {
                    if (grid[c][r] === currentSym && currentSym !== '🎁') {
                        matchCount++;
                    } else {
                        if (matchCount >= 3) {
                            totalWin += bet * PAYOUTS[currentSym] * (matchCount - 2);
                            for(let k=1; k<=matchCount; k++) winCells.add(`${c-k}-${r}`);
                        }
                        matchCount = 1;
                        currentSym = grid[c][r];
                    }
                }
                if (matchCount >= 3) {
                    totalWin += bet * PAYOUTS[currentSym] * (matchCount - 2);
                    for(let k=1; k<=matchCount; k++) winCells.add(`${COLS-k}-${r}`);
                }
            }

            // Highlight wins
            winCells.forEach(id => {
                document.getElementById(`reel-${id}`).classList.add('win');
            });

            if (bonusCount >= 3) {
                setTimeout(() => triggerBonus(), 500);
            } else if (totalWin > 0) {
                balance += totalWin;
                wins++;
                updateMessage('games.slot.win', 'win');
                document.getElementById('gameMessage').textContent = `WIN: $${Math.floor(totalWin)}!`;
            } else {
                updateMessage('games.slot.lose', 'lose');
            }
            updateStats();
        }

        function triggerBonus() {
            const modal = document.getElementById('bonusModal');
            const content = document.getElementById('bonusContent');
            const result = document.getElementById('bonusResult');
            const btn = document.getElementById('closeBonusBtn');
            
            modal.style.display = 'flex';
            content.innerHTML = '🎁';
            result.textContent = 'Opening...';
            btn.style.display = 'none';

            setTimeout(() => {
                const bonusWin = bet * (Math.floor(Math.random() * 50) + 10);
                content.innerHTML = '💰';
                result.textContent = `YOU WON $${bonusWin}!`;
                balance += bonusWin;
                wins++;
                updateStats();
                btn.style.display = 'block';
                
                // Confetti or animation could go here
            }, 2000);
        }

        document.getElementById('closeBonusBtn').addEventListener('click', () => {
            document.getElementById('bonusModal').style.display = 'none';
        });

        function newGame() {
            initGrid();
            updateMessage('games.slot.startMessage', '');
            updateStats();
        }

        function resetBalance() {
            if (confirm(getTranslation('games.slot.confirmReset'))) {
                balance = 1000;
                wins = 0;
                newGame();
                updateStats();
            }
        }

        function getTranslation(key) {
            const lang = localStorage.getItem('language') || 'en';
            const translations = window.i18nData?.[lang] || window.i18nData?.en || {};

            const keys = key.split('.');
            let value = translations;
            for (const k of keys) {
                value = value?.[k];
            }
            return value || key;
        }

        // i18n initialization
        let currentLang = localStorage.getItem('language') || 'en';

        async function loadI18n() {
            try {
                const response = await fetch(`./i18n/${currentLang}.json`);
                window.i18nData = await response.json();
                applyTranslations();
            } catch (error) {
                console.error('Failed to load i18n:', error);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                const text = getTranslation(key);
                if (text && text !== key) {
                    el.textContent = text;
                }
            });
        }

        // Event listeners
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('language', currentLang);
            loadI18n();
        });

        document.getElementById('spinBtn').addEventListener('click', spinReels);
        document.getElementById('newGameBtn').addEventListener('click', newGame);
        document.getElementById('resetBtn').addEventListener('click', resetBalance);

        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                bet = parseInt(btn.dataset.bet);
                updateStats();
            });
        });

        // Initialize
        document.getElementById('langSelect').value = currentLang;
        loadI18n();
        initGrid();
        updateStats();
    </script>
</body>
</html>
