<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Management Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div class="resource-panel">
        <span class="resource-label">Gold:</span> <span class="resource-value" id="gold">0</span>
      </div>
      <div class="resource-panel">
        <span class="resource-label">Wood:</span> <span class="resource-value" id="wood">0</span>
      </div>
      <div class="resource-panel">
        <span class="resource-label">Food:</span> <span class="resource-value" id="food">0</span>
      </div>
      <div class="resource-panel">
        <span class="resource-label">Stone:</span> <span class="resource-value" id="stone">0</span>
      </div>
      <div class="resource-panel">
        <span class="resource-label">Pop:</span> <span class="resource-value" id="population">1</span> / <span id="max-pop">5</span>
      </div>
    </div>
    <div class="build-btn-panel">
      <button class="build-btn" data-type="gold_mine">Gold Mine (50g)</button>
      <button class="build-btn" data-type="lumber_camp">Lumber Camp (30w)</button>
      <button class="build-btn" data-type="farm">Farm (40f)</button>
      <button class="build-btn" data-type="quarry">Quarry (60s)</button>
    </div>
    <div id="building-panel">
      <h3>My Buildings</h3>
      <div id="building-list"></div>
    </div>
    <div id="game-area"></div>
  </div>
  <button id="save-btn" style="position: fixed; top: 10px; right: 10px; padding: 8px 16px; background: #0f3460; border: 1px solid #1a1a2e; color: #c8ff00; cursor: pointer;">Save</button>
  <button id="load-btn" style="position: fixed; top: 10px; right: 100px; padding: 8px 16px; background: #0f3460; border: 1px solid #1a1a2e; color: #c8ff00; cursor: pointer;">Load</button>
  <script src="main.js"></script>
</body>
</html>
