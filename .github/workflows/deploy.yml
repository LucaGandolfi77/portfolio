name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      # Storia completa ma senza blob: serve a `git log` per il <lastmod> della
      # sitemap, senza scaricare i contenuti delle versioni passate.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # Node 22: Vite 8 richiede ^20.19 || >=22.12 e i test di verso-il-17
      # usano `node --experimental-strip-types` (Node 22.6+).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            projects/verso-il-17/package-lock.json
            games/coverage-galaxy/package-lock.json

      # Costruisce _site/: solo i file del sito tracciati in git, le app Vite
      # compilate (test inclusi), i service worker versionati con lo SHA del
      # commit e la sitemap completa. labs/, docs/, tooling e segreti restano
      # fuori. Il nome della repo arriva da GITHUB_REPOSITORY, quindi i base
      # path seguono un eventuale rename.
      - name: Build site
        env:
          BUILD_ID: ${{ github.sha }}
        run: node scripts/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
