name: Quality gate

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Syntax, unit tests, audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nessuna lista di file da mantenere a mano: gli script scoprono da soli
      # ogni JS tracciato e ogni test(s)/ delle app in projects/ e games/.
      - name: Syntax check (all tracked JS)
        run: node scripts/check-syntax.mjs

      - name: Unit / logic tests (every app)
        run: node scripts/run-tests.mjs

      - name: Projects audit (no new issues vs baseline)
        run: node scripts/audit-projects.mjs --baseline=tools/quality/audit-baseline.json

      - name: GitHub Pages audit (catalog, manifests, service workers)
        run: node scripts/audit-pages.mjs --json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projects-health
          path: |
            reports/projects-health.*
            reports/pages-health.json
          retention-days: 7

  browser-e2e:
    name: Playwright (Chromium, fake camera)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/quality/package-lock.json

      - name: Install quality dependencies
        working-directory: tools/quality
        run: npm ci

      - name: Install Chromium + system dependencies
        working-directory: tools/quality
        run: npx playwright install --with-deps chromium

      - name: Build the Vite games tested end-to-end
        working-directory: games/borgo-notte-stagioni
        run: npm ci && npm run build

      - name: Build the animated film tested end-to-end
        working-directory: projects/les-miserables-film
        run: npm ci && npm run build

      - name: Build the second animated film tested end-to-end
        working-directory: projects/la-corona-e-la-testa
        run: npm ci && npm run build

      - name: Run E2E
        working-directory: tools/quality
        env:
          CI: 'true'
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tools/quality/playwright-report
            tools/quality/test-results
          retention-days: 7
