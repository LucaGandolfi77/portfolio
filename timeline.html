<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Luca Gandolfi - Timeline della mia vita. Un viaggio attraverso i momenti più significativi della mia vita.">
    <meta name="keywords" content="timeline, vita, storia personale, Luca Gandolfi">
    <meta name="author" content="Luca Gandolfi">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lucagandolfi.dev/timeline.html">
    <meta property="og:title" content="Timeline - Luca Gandolfi">
    <meta property="og:description" content="Scopri la timeline della mia vita e i momenti più significativi">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    
    <!-- Fonts & Stylesheets -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <title>Timeline - Luca Gandolfi | La Mia Vita</title>
    
    <style>
        .timeline-page-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease;
        }

        .timeline-page-header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #0099ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .timeline-page-header p {
            font-size: 1.1rem;
            color: #a0c0e0;
            max-width: 600px;
            margin: 0 auto;
        }

        .timeline-full-container {
            position: relative;
            padding: 60px 0;
            max-width: 900px;
            margin: 0 auto;
        }

        .timeline-full-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 50%, var(--accent) 100%);
            transform: translateX(-50%);
        }

        .timeline-full-events {
            display: flex;
            flex-direction: column;
            gap: 60px;
            position: relative;
            z-index: 1;
        }

        .timeline-full-event {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .timeline-full-event:nth-child(odd) {
            grid-template-columns: 1fr 1fr;
        }

        .timeline-full-event:nth-child(even) {
            direction: rtl;
        }

        .timeline-full-event:nth-child(even) > * {
            direction: ltr;
        }

        .timeline-full-event-content {
            padding: 30px;
            background: rgba(26, 41, 64, 0.4);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .timeline-full-event-content:hover {
            background: rgba(26, 41, 64, 0.7);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
            transform: translateY(-8px);
        }

        .timeline-full-event-dot {
            position: absolute;
            left: 50%;
            top: 30px;
            width: 28px;
            height: 28px;
            background: var(--accent);
            border: 4px solid var(--bg-900);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
            z-index: 2;
        }

        .timeline-full-year {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .timeline-full-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .timeline-full-description {
            font-size: 1rem;
            color: #a0c0e0;
            line-height: 1.6;
        }

        .timeline-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 80px;
        }

        .stat-card {
            background: rgba(26, 41, 64, 0.4);
            border: 2px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all var(--transition);
        }

        .stat-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            background: rgba(26, 41, 64, 0.6);
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            color: #a0c0e0;
            font-size: 0.95rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
            padding: 12px 24px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: all var(--transition);
        }

        .back-button:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.6);
            transform: translateX(-5px);
        }

        [data-theme="light"] .timeline-full-line {
            background: linear-gradient(180deg, #0052a3, #003d7a, #0052a3);
        }

        [data-theme="light"] .timeline-full-event-dot {
            background: #0052a3;
            border-color: #e8f2f8;
            box-shadow: 0 0 30px rgba(0, 82, 163, 0.6);
        }

        [data-theme="light"] .timeline-full-event-content {
            background: rgba(248, 252, 255, 0.5);
            border-color: rgba(0, 82, 163, 0.2);
            color: #0a2f5c;
        }

        [data-theme="light"] .timeline-full-event-content:hover {
            background: rgba(248, 252, 255, 0.8);
            border-color: rgba(0, 82, 163, 0.5);
            box-shadow: 0 12px 40px rgba(0, 82, 163, 0.15);
        }

        [data-theme="light"] .timeline-full-year {
            color: #0052a3;
        }

        [data-theme="light"] .timeline-full-title {
            color: #0a2f5c;
        }

        [data-theme="light"] .timeline-full-description {
            color: #4a7a9f;
        }

        [data-theme="light"] .timeline-page-header h1 {
            background: linear-gradient(90deg, #0052a3, #003d7a, #0052a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="light"] .stat-card {
            background: rgba(248, 252, 255, 0.5);
            border-color: rgba(0, 82, 163, 0.15);
        }

        [data-theme="light"] .stat-card:hover {
            background: rgba(248, 252, 255, 0.8);
            border-color: rgba(0, 82, 163, 0.4);
        }

        @media (max-width: 768px) {
            .timeline-page-header h1 {
                font-size: 2rem;
            }

            .timeline-full-line {
                left: 20px;
            }

            .timeline-full-event {
                grid-template-columns: 1fr;
                direction: ltr !important;
            }

            .timeline-full-event > * {
                direction: ltr !important;
            }

            .timeline-full-event-content {
                margin-left: 60px;
            }

            .timeline-full-event-dot {
                left: 20px;
            }

            .timeline-stats {
                grid-template-columns: 1fr;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lang-top-left {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1003;
        }

        .lang-top-left select {
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(26, 41, 64, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
        }

        .lang-top-left select:hover {
            border-color: rgba(0, 212, 255, 0.6);
            background: rgba(26, 41, 64, 0.95);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1002;
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
            min-height: 100vh;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #a0c0e0;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            margin-top: 80px;
        }
    </style>
</head>
<body>
    <!-- Language Selector -->
    <div class="lang-top-left">
        <label for="langSelect" class="visually-hidden">Select language</label>
        <select id="langSelect" aria-label="Select language" title="Change language">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 中</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 日本</option>
            <option value="sv">🇸🇪 SV</option>
            <option value="ar">🇸🇦 AR</option>
            <option value="he">🇮🇱 HE</option>
        </select>
    </div>

    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" title="Hold to select theme">🌙</button>

    <!-- Animated particles -->
    <div class="particles" id="particles"></div>

    <div class="page-container">
        <!-- Back Button -->
        <a href="index.html#timeline" class="back-button">
            <span>←</span>
            <span>Back to Portfolio</span>
        </a>

        <!-- Page Header -->
        <div class="timeline-page-header">
            <h1 data-i18n="timeline.heading">Timeline of My Life</h1>
            <p>A journey through the most significant moments of my life, from birth to the present day.</p>
        </div>

        <!-- Statistics -->
        <div class="timeline-stats">
            <div class="stat-card">
                <div class="stat-number">31</div>
                <div class="stat-label">Years Old</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">10</div>
                <div class="stat-label">Life Milestones</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">1994</div>
                <div class="stat-label">Born Year</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">2026</div>
                <div class="stat-label">Current Year</div>
            </div>
        </div>

        <!-- Full Timeline -->
        <div class="timeline-full-container">
            <div class="timeline-full-line"></div>
            <div class="timeline-full-events" id="timelineFullEvents">
                <!-- Timeline events will be added dynamically -->
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p data-i18n="footer.text">© 2026 Luca Gandolfi. Built with passion and technology.</p>
        </div>
    </div>

    <script>
        // --- Theme toggle with seasonal themes ---
        const seasonalThemes = [
            { id: 'default', name: 'Default', emoji: '🌙', data: null },
            { id: 'easter', name: 'Easter', emoji: '🐰', data: 'easter' },
            { id: 'summer', name: 'Summer', emoji: '☀️', data: 'summer' },
            { id: 'autumn', name: 'Autumn', emoji: '🍂', data: 'autumn' },
            { id: 'christmas', name: 'Christmas', emoji: '🎄', data: 'christmas' },
            { id: 'halloween', name: 'Halloween', emoji: '👻', data: 'halloween' },
            { id: 'cyberpunk', name: 'Cyberpunk', emoji: '⚡', data: 'cyberpunk' }
        ];

        function applySeasonalTheme(themeId) {
            const theme = seasonalThemes.find(t => t.id === themeId);
            if (!theme) return;
            
            document.documentElement.removeAttribute('data-seasonal-theme');
            if (theme.data) {
                document.documentElement.setAttribute('data-seasonal-theme', theme.data);
            }
            
            localStorage.setItem('seasonal-theme', themeId);
            closeThemeMenu();
            updateThemeButton();
        }

        function updateThemeButton() {
            const currentSeasonalTheme = localStorage.getItem('seasonal-theme') || 'default';
            const theme = seasonalThemes.find(t => t.id === currentSeasonalTheme);
            if (theme) {
                document.getElementById('themeToggle').textContent = theme.emoji;
            }
        }

        function createThemeMenu() {
            const container = document.createElement('div');
            container.className = 'theme-menu-container';
            
            const button = document.getElementById('themeToggle');
            button.className = 'theme-toggle-button';
            
            const menu = document.createElement('div');
            menu.className = 'theme-dropdown';
            
            seasonalThemes.forEach(theme => {
                const option = document.createElement('div');
                option.className = 'theme-option';
                option.innerHTML = `
                    <span class="theme-option-emoji">${theme.emoji}</span>
                    <span class="theme-option-name">${theme.name}</span>
                    <span class="theme-option-check">✓</span>
                `;
                
                option.addEventListener('click', () => {
                    applySeasonalTheme(theme.id);
                });
                
                menu.appendChild(option);
            });
            
            button.parentElement.appendChild(menu);
            return { button, menu };
        }

        let themeMenu = null;
        let holdTimer = null;
        let isTouching = false;

        function initThemeMenu() {
            if (!themeMenu) {
                themeMenu = createThemeMenu();
                const button = themeMenu.button;
                const menu = themeMenu.menu;
                
                // Mouse events
                button.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    isTouching = false;
                    holdTimer = setTimeout(() => openThemeMenu(), 500);
                });
                
                button.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    if (holdTimer) clearTimeout(holdTimer);
                });
                
                button.addEventListener('mouseleave', (e) => {
                    e.preventDefault();
                    if (holdTimer) clearTimeout(holdTimer);
                });
                
                // Touch events per mobile
                button.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    isTouching = true;
                    holdTimer = setTimeout(() => {
                        if (isTouching) {
                            openThemeMenu();
                            if (navigator.vibrate) {
                                navigator.vibrate(50);
                            }
                        }
                    }, 500);
                }, { passive: false });
                
                button.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    isTouching = false;
                    if (holdTimer) clearTimeout(holdTimer);
                }, { passive: false });
                
                button.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    isTouching = false;
                    if (holdTimer) clearTimeout(holdTimer);
                }, { passive: false });
                
                button.addEventListener('touchmove', (e) => {
                    if (holdTimer && e.target === button) {
                        const touch = e.touches[0];
                        const rect = button.getBoundingClientRect();
                        
                        if (touch.clientX < rect.left || touch.clientX > rect.right ||
                            touch.clientY < rect.top || touch.clientY > rect.bottom) {
                            isTouching = false;
                            clearTimeout(holdTimer);
                            holdTimer = null;
                        }
                    }
                }, { passive: true });
                
                // Close menu on outside click/touch
                document.addEventListener('click', (e) => {
                    if (!button.contains(e.target) && !menu.contains(e.target)) {
                        closeThemeMenu();
                    }
                });

                document.addEventListener('touchend', (e) => {
                    if (!button.contains(e.target) && !menu.contains(e.target)) {
                        closeThemeMenu();
                    }
                });
            }
            
            updateThemeButton();
        }

        function openThemeMenu() {
            if (!themeMenu) initThemeMenu();
            themeMenu.menu.classList.add('active');
            themeMenu.button.classList.add('active');
            updateActiveThemeOption();
        }

        function closeThemeMenu() {
            if (themeMenu) {
                themeMenu.menu.classList.remove('active');
                themeMenu.button.classList.remove('active');
            }
        }

        function updateActiveThemeOption() {
            if (!themeMenu) return;
            
            const currentTheme = localStorage.getItem('seasonal-theme') || 'default';
            const options = themeMenu.menu.querySelectorAll('.theme-option');
            
            options.forEach((option, idx) => {
                if (seasonalThemes[idx].id === currentTheme) {
                    option.classList.add('active');
                } else {
                    option.classList.remove('active');
                }
            });
        }

        // Load saved theme
        const savedSeasonalTheme = localStorage.getItem('seasonal-theme');
        if (savedSeasonalTheme) {
            applySeasonalTheme(savedSeasonalTheme);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initThemeMenu);
        } else {
            initThemeMenu();
        }


        // --- Load translations from i18n files ---
        const langSelect = document.getElementById('langSelect');
        let currentLang = localStorage.getItem('lang') || 'en';
        langSelect.value = currentLang;

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`./i18n/${lang}.json`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const translations = await response.json();
                window.translations = translations;

                // set document language and direction (support RTL langs)
                document.documentElement.lang = lang;
                const rtlLangs = ['ar', 'he', 'fa', 'ur'];
                document.documentElement.dir = rtlLangs.includes(lang) ? 'rtl' : 'ltr';

                applyTranslations();
            } catch (err) {
                console.warn(`Failed to load ${lang}.json, falling back to en.json`, err);
                // fallback to English if available
                if (lang !== 'en') {
                    try {
                        const fb = await fetch(`./i18n/en.json`);
                        if (fb.ok) {
                            window.translations = await fb.json();
                            document.documentElement.lang = 'en';
                            document.documentElement.dir = 'ltr';
                            applyTranslations();
                            return;
                        }
                    } catch (e) {
                        console.error('Failed to load fallback en.json', e);
                    }
                }
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const keys = key.split('.');
                let value = window.translations;
                
                for (let k of keys) {
                    if (value && typeof value === 'object') {
                        value = value[k];
                    } else {
                        value = null;
                        break;
                    }
                }
                
                if (value) {
                    const tag = el.tagName && el.tagName.toUpperCase();
                    if (tag === 'INPUT' || tag === 'TEXTAREA') {
                        el.placeholder = value;
                    } else if (tag === 'OPTION') {
                        el.textContent = value;
                    } else {
                        el.textContent = value;
                    }
                }
            });

            // Render timeline after translations are loaded
            renderTimelineEvents();
        }

        function renderTimelineEvents() {
            const container = document.getElementById('timelineFullEvents');
            if (!container || !window.translations || !window.translations.timeline) return;

            const timelineData = window.translations.timeline.events || [];
            container.innerHTML = '';

            timelineData.forEach((event, idx) => {
                const div = document.createElement('div');
                div.className = 'timeline-full-event';
                div.style.animationDelay = `${idx * 0.15}s`;

                const content = document.createElement('div');
                content.className = 'timeline-full-event-content';
                content.innerHTML = `
                    <div class="timeline-full-year">${event.year}</div>
                    <div class="timeline-full-title">${event.title}</div>
                    <div class="timeline-full-description">${event.description}</div>
                `;

                const dot = document.createElement('div');
                dot.className = 'timeline-full-event-dot';

                div.appendChild(content);
                div.appendChild(dot);
                container.appendChild(div);
            });
        }

        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('lang', currentLang);
            loadTranslations(currentLang);
        });

        // Load initial translations
        loadTranslations(currentLang);

        // Particle animation (simple)
        function createParticles() {
            const particles = document.getElementById('particles');
            if (!particles) return;

            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.width = Math.random() * 4 + 1 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = Math.random() > 0.5 ? '#00d4ff' : '#0099ff';
                particle.style.borderRadius = '50%';
                particle.style.opacity = Math.random() * 0.5 + 0.3;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.pointerEvents = 'none';
                particle.style.animation = `float ${Math.random() * 20 + 10}s infinite`;
                particles.appendChild(particle);
            }
        }

        createParticles();

        // Add float animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0%, 100% { transform: translateY(0px) translateX(0px); }
                50% { transform: translateY(-100px) translateX(50px); }
            }
        `;
        document.head.appendChild(style);

        // --- Service Worker Registration for Offline Support ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('✓ Service Worker registrato:', registration);
                    })
                    .catch(error => {
                        console.log('✗ Registrazione Service Worker fallita:', error);
                    });
            });
        }
    </script>
</body>
</html>
