<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Simulatore Pokémon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            padding: 10px;
        }

        #game-screen {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
        }

        #canvas-wrapper {
            position: relative;
            width: 100%;
            background: #0f3460;
            border: 4px solid #16213e;
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 5px;
            margin-top: 10px;
        }

        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            aspect-ratio: 1;
            touch-action: none; /* Prevent scrolling while sliding */
        }

        .btn {
            background: linear-gradient(145deg, #2d3561, #1f2749);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            user-select: none;
            touch-action: none;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #1f2749, #2d3561);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        
        .btn-action {
            grid-column: 1 / span 3;
            grid-row: 1 / span 3;
            background: linear-gradient(145deg, #e056fd, #be2edd);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .action-btn {
            padding: 15px;
            font-size: 14px;
            background: linear-gradient(145deg, #4834d4, #686de0);
        }

        #dialogue-box {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #fff;
            display: none;
            font-size: 14px;
            line-height: 1.4;
            z-index: 100;
        }

        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 200;
        }

        #debug-info {
            position: absolute;
            top: 5px;
            left: 5px;
            color: lime;
            font-family: monospace;
            font-size: 10px;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
            z-index: 300;
        }
        
        /* Pokedex Modal */
        #pokedex-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .pokedex-content {
            background: #c0392b;
            width: 90%;
            max-width: 400px;
            height: 80%;
            border-radius: 20px;
            border: 5px solid #8e44ad;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .pokedex-entry {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .pokedex-img {
            width: 50px;
            height: 50px;
            background: #bdc3c7;
            border-radius: 50%;
        }
        
        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #fff;
            color: #c0392b;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>
<body>

<div id="game-container">
    <div id="game-screen">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="320" height="320"></canvas>
            <div id="dialogue-box"></div>
            <div id="transition-overlay"></div>
            <div id="debug-info"></div>
        </div>
    </div>

    <div id="controls">
        <div id="dpad">
            <button class="btn btn-up" id="btn-up">▲</button>
            <button class="btn btn-left" id="btn-left">◀</button>
            <button class="btn btn-right" id="btn-right">▶</button>
            <button class="btn btn-down" id="btn-down">▼</button>
        </div>
        <div id="actions">
            <button class="btn action-btn" id="btn-interact">A (Interagisci)</button>
            <button class="btn action-btn" id="btn-pokedex">Pokédex</button>
            <button class="btn action-btn" id="btn-save">Salva</button>
        </div>
    </div>
</div>

<div id="pokedex-modal">
    <div class="pokedex-content" id="pokedex-list">
        <!-- Entries will be injected here -->
    </div>
    <button class="close-btn" onclick="closePokedex()">Chiudi</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const dialogueBox = document.getElementById('dialogue-box');
    const transitionOverlay = document.getElementById('transition-overlay');
    const debugInfo = document.getElementById('debug-info');

    // Configurazione
    const TILE_SIZE = 32;
    const VISIBLE_TILES = 10;
    const MAP_SIZE = 64; // Dimensione chunk
    
    // Stato Globale
    let worldX = 100;
    let worldY = 100;
    let isIndoors = false;
    let isTransitioning = false;
    let isDialogueOpen = false;
    let isPokedexOpen = false;
    let gameTime = { day: 0, hour: 8, minute: 0 };
    
    // Player
    const player = {
        x: Math.floor(MAP_SIZE / 2),
        y: Math.floor(MAP_SIZE / 2),
        pixelX: Math.floor(MAP_SIZE / 2) * TILE_SIZE,
        pixelY: Math.floor(MAP_SIZE / 2) * TILE_SIZE,
        direction: 'down',
        moving: false,
        inventory: [],
        pokedex: [],
        isSurfing: false,
        turnTimer: 0
    };

    // Camera
    const camera = { x: 0, y: 0 };

    // World Cache
    const world = {};

    // Colori Palette "Indie Cozy" + Biomi
    const colors = {
        // Forest (Default)
        terrain: '#7ec850',
        grass: '#67b040',
        grassDetail: '#5a9e35',
        treeTrunk: '#8b5a2b',
        treeLeaves: '#4a8f3c',
        treeShadow: 'rgba(0,0,0,0.2)',
        flower: '#ff9d9d',
        flowerCenter: '#ffe082',
        
        // Desert
        sand: '#e1c699',
        sandDetail: '#d4b483',
        cactus: '#2ecc71',
        cactusSpike: '#27ae60',
        
        // Ice
        snow: '#dfe6e9',
        snowDetail: '#b2bec3',
        ice: '#81ecec',
        pine: '#2d3436', // Dark trunk
        pineLeaves: '#74b9ff', // Icy leaves
        
        // Tropical
        jungleGrass: '#00b894',
        jungleWater: '#0984e3',
        palmTrunk: '#e17055',
        palmLeaves: '#badc58',

        // Common
        water: '#5dade2',
        waterDeep: '#4a9ccf',
        waterHighlight: 'rgba(255,255,255,0.4)',
        bridge: '#d4a373',
        bridgeDark: '#b08055',
        road: '#95a5a6',
        roadDetail: '#7f8c8d',
        
        // Interiors
        houseWall: '#f3a683',
        houseRoof: '#e77f67',
        houseDoor: '#596275',
        houseFloor: '#f7d794',
        houseMat: '#303952',
        barCounter: '#8e44ad',
        barTable: '#d35400',
        barChair: '#c0392b',
        barFloor: '#34495e',

        // City
        cityRoad: '#57606f',
        citySidewalk: '#a4b0be',
        cityBuilding: '#747d8c',

        // Cave
        caveFloor: '#3d3d3d',
        caveWall: '#2d2d2d',
        caveEntrance: '#000000',
        
        // Rain
        rainGrass: '#2d3436',
        puddle: '#74b9ff',
        
        // Entities
        playerBody: '#ff6b6b',
        playerHat: '#ff4757',
        playerSkin: '#ffeaa7',
        npcBody: '#a29bfe',
        npcHat: '#6c5ce7',
        shadow: 'rgba(0,0,0,0.15)',
        
        // Boat
        boatBody: '#d35400',
        boatFloor: '#e67e22',
        boatSeat: '#a04000'
    };

    // Biome Helper
    function getBiome(wx, wy) {
        // Simple noise for biome
        const noise = Math.sin(wx * 0.3) + Math.cos(wy * 0.3);
        if (noise < -1.3) return 'frozen_lake';
        if (noise < -1) return 'ice';
        if (noise < -0.5) return 'city';
        if (noise < -0.2) return 'forest';
        if (noise < 0.2) return 'lake';
        if (noise < 0.5) return 'mountain';
        if (noise < 0.8) return 'tropical';
        if (noise < 1.2) return 'rain';
        return 'desert';
    }

    // Dialoghi NPC
    const dialogues = [
        "Che bella giornata!",
        "Hai visto qualche Pokémon raro?",
        "Attento all'erba alta!",
        "Mi piace passeggiare qui.",
        "Il tempo è strano ultimamente.",
        "Vorrei avere una bicicletta.",
        "Hai sentito parlare della grotta segreta?",
        "Il mio Pokémon preferito è Snorlax. Dorme sempre!",
        "Ho perso le mie chiavi... o forse non le ho mai avute.",
        "Se corri veloce puoi correre... ah no, aspetta, non è vero.",
        "Questo posto è molto rilassante, vero?",
        "Sono qui da ore e non ho ancora catturato nulla..."
    ];

    const houseQuizzes = [
        {
            question: "Qual è il tipo di Charmander?",
            options: ["Fuoco", "Acqua", "Erba"],
            answer: 0,
            reward: "Pozione"
        },
        {
            question: "Cosa usa Pikachu per attaccare?",
            options: ["Fuoco", "Acqua", "Elettricità"],
            answer: 2,
            reward: "Poké Ball"
        }
    ];

    // Generazione Mappa Procedurale
    function generateMap(wx, wy) {
        const newMap = [];
        const newNPCs = [];
        let boat = null;
        const biome = getBiome(wx, wy);
        
        // Inizializza mappa vuota
        for (let y = 0; y < MAP_SIZE; y++) {
            newMap[y] = [];
            for (let x = 0; x < MAP_SIZE; x++) {
                newMap[y][x] = 0;
            }
        }

        for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
                // Bordi (Acqua/Ponti)
                if (x === 0 || x === MAP_SIZE - 1 || y === 0 || y === MAP_SIZE - 1) {
                    const isBridgeX = (y === Math.floor(MAP_SIZE/2) || y === Math.floor(MAP_SIZE/2)-1);
                    const isBridgeY = (x === Math.floor(MAP_SIZE/2) || x === Math.floor(MAP_SIZE/2)-1);
                    
                    if ((x === 0 || x === MAP_SIZE - 1) && isBridgeX) newMap[y][x] = 5; 
                    else if ((y === 0 || y === MAP_SIZE - 1) && isBridgeY) newMap[y][x] = 5; 
                    else newMap[y][x] = 4; 
                } else {
                    // Noise
                    const globalX = wx * MAP_SIZE + x;
                    const globalY = wy * MAP_SIZE + y;
                    const noise = Math.sin(globalX * 0.5) * Math.cos(globalY * 0.5);
                    const rand = Math.abs(Math.sin(globalX * 12.9898 + globalY * 78.233) * 43758.5453) % 1;

                    // Biome Specific Generation
                    if (biome === 'desert') {
                        if (rand < 0.05) newMap[y][x] = 20; // Cactus
                        else if (rand < 0.1) newMap[y][x] = 11; // Rock
                        else newMap[y][x] = 0; // Sand
                    } else if (biome === 'lake') {
                        const centerX = MAP_SIZE / 2;
                        const centerY = MAP_SIZE / 2;
                        const dist = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                        if (dist < 7) newMap[y][x] = 4; // Water
                        else if (dist < 8 && rand < 0.5) newMap[y][x] = 4;
                        else {
                            if (rand < 0.1) newMap[y][x] = 3;
                            else if (rand < 0.2) newMap[y][x] = 1;
                            else newMap[y][x] = 0;
                        }
                    } else if (biome === 'frozen_lake') {
                        const centerX = MAP_SIZE / 2;
                        const centerY = MAP_SIZE / 2;
                        const dist = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                        if (dist < 7) newMap[y][x] = 22; // Ice
                        else if (dist < 8 && rand < 0.5) newMap[y][x] = 22;
                        else {
                            if (rand < 0.1) newMap[y][x] = 11;
                            else if (rand < 0.2) newMap[y][x] = 21;
                            else newMap[y][x] = 0;
                        }
                    } else if (biome === 'city') {
                        // City Pattern
                        if (x % 6 === 0 || y % 6 === 0) newMap[y][x] = 25; // Road
                        else newMap[y][x] = 26; // Sidewalk
                        if (rand < 0.02 && newMap[y][x] === 26) newMap[y][x] = 3; // Flower pot
                    } else if (biome === 'ice') {
                        if (rand < 0.1) newMap[y][x] = 21; // Pine
                        else if (rand < 0.15) newMap[y][x] = 11; // Rock
                        else if (noise > 0.3) newMap[y][x] = 22; // Ice Patch
                        else newMap[y][x] = 0; // Snow
                    } else if (biome === 'tropical') {
                        if (rand < 0.15) newMap[y][x] = 23; // Palm
                        else if (rand < 0.25) newMap[y][x] = 3; // Flower
                        else if (noise > 0.1) newMap[y][x] = 1; // Grass
                        else newMap[y][x] = 0; // Jungle Grass
                    } else if (biome === 'mountain') {
                        if (rand < 0.02) newMap[y][x] = 30; // Cave Entrance
                        else if (rand < 0.3) newMap[y][x] = 11; // Rocks
                        else if (rand < 0.35) newMap[y][x] = 12; // Stump
                        else if (rand < 0.4) newMap[y][x] = 21; // Pine
                        else newMap[y][x] = 0; // Ground
                    } else if (biome === 'rain') {
                        if (rand < 0.1) newMap[y][x] = 24; // Puddle
                        else if (rand < 0.15) newMap[y][x] = 3; // Flower
                        else if (rand < 0.2) newMap[y][x] = 2; // Tree
                        else if (noise > 0.1) newMap[y][x] = 1; // Grass
                        else newMap[y][x] = 0; // Wet Ground
                    } else {
                        // Forest
                        if (rand < 0.08) newMap[y][x] = 2; // Tree
                        else if (rand < 0.12) newMap[y][x] = 11; // Rock
                        else if (rand < 0.18) newMap[y][x] = 3; // Flower
                        else if (noise > 0.2) newMap[y][x] = 1; // Grass
                        else newMap[y][x] = 0; // Terrain
                    }
                }
            }
        }

        // Generazione Edifici (Nuovo Sistema Sicuro)
        // Solo in certi biomi
        if (biome === 'city' || biome === 'forest' || biome === 'desert' || biome === 'tropical') {
            const numBuildings = biome === 'city' ? 4 : 1;
            
            for(let i=0; i<numBuildings; i++) {
                // Trova posto libero
                let bx = Math.floor(Math.random() * (MAP_SIZE - 6)) + 3;
                let by = Math.floor(Math.random() * (MAP_SIZE - 6)) + 3;
                
                // Allinea alla griglia città
                if (biome === 'city') {
                    bx = Math.floor(bx / 6) * 6 + 1;
                    by = Math.floor(by / 6) * 6 + 1;
                }

                // Check collision
                let clear = true;
                for(let dy=0; dy<4; dy++) {
                    for(let dx=0; dx<4; dx++) {
                        if (newMap[by+dy][bx+dx] === 4 || newMap[by+dy][bx+dx] === 5) clear = false;
                    }
                }

                if (clear) {
                    const isShop = Math.random() > 0.7;
                    const isCenter = Math.random() > 0.8;
                    const buildingType = isCenter ? 'center' : (isShop ? 'shop' : 'house');
                    
                    // Disegna edificio (3x3 o 4x3)
                    for(let dy=0; dy<3; dy++) {
                        for(let dx=0; dx<4; dx++) {
                            newMap[by+dy][bx+dx] = 27; // Building Wall/Roof
                        }
                    }
                    // Porta
                    newMap[by+2][bx+1] = 28; // Door
                    
                    // Salva info edificio nella mappa (per teleport)
                    if (!newMap.buildings) newMap.buildings = [];
                    newMap.buildings.push({
                        x: bx+1,
                        y: by+2,
                        type: buildingType
                    });
                    
                    // Path to door
                    newMap[by+3][bx+1] = 14; 
                }
            }
        }

        // Spawn NPCs
        const isLand = (t) => t === 0 || t === 1 || t === 14 || t === 26;
        for (let y = 1; y < MAP_SIZE-1; y++) {
            for (let x = 1; x < MAP_SIZE-1; x++) {
                const t = newMap[y][x];
                if (isLand(t)) {
                    if (Math.random() > 0.99) {
                        newNPCs.push({
                            x: x,
                            y: y,
                            pixelX: x * TILE_SIZE,
                            pixelY: y * TILE_SIZE,
                            direction: 'down',
                            moving: false,
                            moveTimer: Math.random() * 100,
                            text: dialogues[Math.floor(Math.random() * dialogues.length)],
                            color: `hsl(${Math.random() * 360}, 70%, 60%)`
                        });
                    }
                }
            }
        }

        return { tiles: newMap, npcs: newNPCs, activeTiles: [], footprints: [], fireflies: [], boat: boat, type: 'outdoor' };
    }

    // Gestione Mappe
    function getCurrentData() {
        const key = `${worldX},${worldY}`;
        if (!world[key]) {
            world[key] = generateMap(worldX, worldY);
        }
        return world[key];
    }

    let currentData = getCurrentData();
    let currentMap = currentData.tiles;
    let currentNPCs = currentData.npcs;

    // Nuovo Sistema Teletrasporto Sicuro
    function teleportTo(mapType, targetX, targetY) {
        isTransitioning = true;
        transitionOverlay.style.opacity = 1;
        
        setTimeout(() => {
            try {
                if (mapType === 'outdoor') {
                    isIndoors = false;
                    // Restore outdoor map
                    currentData = getCurrentData();
                    currentMap = currentData.tiles;
                    currentNPCs = currentData.npcs;
                } else {
                    isIndoors = true;
                    // Generate simple safe interior
                    currentData = generateSimpleInterior(mapType);
                    currentMap = currentData.tiles;
                    currentNPCs = currentData.npcs;
                }

                player.x = targetX;
                player.y = targetY;
                player.pixelX = player.x * TILE_SIZE;
                player.pixelY = player.y * TILE_SIZE;
                player.moving = false;
                player.isSurfing = false;
                player.turnTimer = 0;
                
                // Reset keys
                keys.up = false;
                keys.down = false;
                keys.left = false;
                keys.right = false;
                
                updateCamera();
            } catch (e) {
                console.error("Teleport error:", e);
                isIndoors = false; // Fallback to outdoor
            } finally {
                setTimeout(() => {
                    transitionOverlay.style.opacity = 0;
                    isTransitioning = false;
                }, 100);
            }
        }, 300);
    }

    function generateSimpleInterior(type) {
        // Safe, simple interior generator
        const width = 12;
        const height = 10;
        const tiles = [];
        
        // Fill with floor
        for (let y = 0; y < height; y++) {
            tiles[y] = [];
            for (let x = 0; x < width; x++) {
                if (x === 0 || x === width - 1 || y === 0 || y === height - 1) {
                    tiles[y][x] = 7; // Wall
                } else {
                    tiles[y][x] = 9; // Floor
                }
            }
        }

        // Add Exit
        const exitX = Math.floor(width / 2);
        tiles[height - 1][exitX] = 10; // Mat (Exit)

        const npcs = [];

        if (type === 'center') {
            // Pokemon Center style
            for(let x=2; x<width-2; x++) tiles[2][x] = 15; // Counter
            npcs.push({
                x: Math.floor(width/2), y: 1,
                pixelX: Math.floor(width/2)*TILE_SIZE, pixelY: 1*TILE_SIZE,
                direction: 'down', moving: false,
                text: "Benvenuto al Centro Pokémon! Qui curiamo i tuoi amici.",
                color: '#ff9ff3'
            });
        } else if (type === 'shop') {
            // Shop style
            for(let x=2; x<width-2; x++) tiles[2][x] = 15; // Counter
            npcs.push({
                x: Math.floor(width/2), y: 1,
                pixelX: Math.floor(width/2)*TILE_SIZE, pixelY: 1*TILE_SIZE,
                direction: 'down', moving: false,
                role: 'merchant',
                text: "Vuoi comprare qualcosa?",
                color: '#54a0ff'
            });
        } else if (type === 'cave') {
            // Cave style
            for(let y=0; y<height; y++) {
                for(let x=0; x<width; x++) {
                    if (x===0 || x===width-1 || y===0 || y===height-1) tiles[y][x] = 32; // Cave Wall
                    else tiles[y][x] = 31; // Cave Floor
                }
            }
            tiles[height-1][exitX] = 10; // Exit
            
            // Random rocks
            for(let i=0; i<5; i++) {
                const rx = Math.floor(Math.random()*(width-2))+1;
                const ry = Math.floor(Math.random()*(height-2))+1;
                if (tiles[ry][rx] === 31) tiles[ry][rx] = 11; // Rock
            }
            
            npcs.push({
                x: Math.floor(width/2), y: Math.floor(height/2),
                pixelX: Math.floor(width/2)*TILE_SIZE, pixelY: Math.floor(height/2)*TILE_SIZE,
                direction: 'down', moving: false,
                text: "È buio qui dentro...",
                color: '#bdc3c7'
            });
        } else {
            // Generic House
            tiles[height/2][width/2] = 16; // Table
            npcs.push({
                x: 2, y: 4,
                pixelX: 2*TILE_SIZE, pixelY: 4*TILE_SIZE,
                direction: 'right', moving: false,
                text: "Mi piace questa casa!",
                color: '#fab1a0'
            });
        }

        return { tiles, npcs, activeTiles: [], footprints: [], fireflies: [], type: 'indoor', width, height };
    }

    // Disegna tile (Ground Layer)
    function drawGround(x, y, type) {
        const screenX = x * TILE_SIZE;
        const screenY = y * TILE_SIZE;
        
        // Default Ground
        if (currentData.biome === 'desert') ctx.fillStyle = colors.sand;
        else if (currentData.biome === 'ice') ctx.fillStyle = colors.snow;
        else if (currentData.biome === 'tropical') ctx.fillStyle = colors.jungleGrass;
        else if (currentData.biome === 'mountain') ctx.fillStyle = '#95a5a6';
        else if (currentData.biome === 'rain') ctx.fillStyle = colors.rainGrass;
        else ctx.fillStyle = colors.terrain;
        
        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);

        // Detail
        if ((x + y) % 2 === 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.02)';
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        }

        // Specific Ground Types
        if (type === 4) { // Water
            ctx.fillStyle = currentData.biome === 'tropical' ? colors.jungleWater : colors.water;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            const time = Date.now() / 500;
            const waveOffset = Math.sin(time + x + y) * 2;
            ctx.fillStyle = colors.waterHighlight;
            ctx.fillRect(screenX + 4 + waveOffset, screenY + 8, 6, 2);
            ctx.fillRect(screenX + 18 - waveOffset, screenY + 20, 8, 2);
        } else if (type === 9) { // Floor
            ctx.fillStyle = colors.houseFloor;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        } else if (type === 10) { // Mat
            ctx.fillStyle = colors.houseFloor;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = colors.houseMat;
            ctx.fillRect(screenX + 4, screenY + 8, 24, 16);
        } else if (type === 14) { // Road
            ctx.fillStyle = colors.road;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = colors.roadDetail;
            for(let i=0; i<4; i++) {
                const rx = (x * 13 + i * 7) % 24;
                const ry = (y * 17 + i * 11) % 24;
                ctx.fillRect(screenX + rx + 2, screenY + ry + 2, 2, 2);
            }
        } else if (type === 25) { // City Road
            ctx.fillStyle = colors.cityRoad;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            if (x % 6 === 0 && y % 2 !== 0) ctx.fillRect(screenX + 14, screenY, 4, 32);
            if (y % 6 === 0 && x % 2 !== 0) ctx.fillRect(screenX, screenY + 14, 32, 4);
        } else if (type === 26) { // City Sidewalk
            ctx.fillStyle = colors.citySidewalk;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(screenX, screenY, TILE_SIZE - 2, TILE_SIZE - 2);
        } else if (type === 27) { // Building Wall
            ctx.fillStyle = colors.cityBuilding;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#57606f';
            ctx.fillRect(screenX + 4, screenY + 4, 24, 24); // Window/Detail
        } else if (type === 28) { // Building Door
            ctx.fillStyle = colors.cityBuilding;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#2f3542';
            ctx.fillRect(screenX + 6, screenY + 8, 20, 24); // Door
        } else if (type === 30) { // Cave Entrance
            ctx.fillStyle = colors.rock;
            ctx.beginPath();
            ctx.arc(screenX + 16, screenY + 16, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = colors.caveEntrance;
            ctx.beginPath();
            ctx.arc(screenX + 16, screenY + 18, 8, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === 31) { // Cave Floor
            ctx.fillStyle = colors.caveFloor;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        } else if (type === 32) { // Cave Wall
            ctx.fillStyle = colors.caveWall;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(screenX + 4, screenY + 4, 24, 24);
        } else if (type === 7) { // Wall
            ctx.fillStyle = colors.houseWall;
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        }
    }
    // Disegna NPC
    function drawNPC(npc) {
        const screenX = (npc.pixelX !== undefined ? npc.pixelX : npc.x * TILE_SIZE);
        const screenY = (npc.pixelY !== undefined ? npc.pixelY : npc.y * TILE_SIZE);
        
        // Animazione camminata (se si muove)
        const bounce = npc.moving ? Math.abs(Math.sin(Date.now() / 100)) * 3 : 0;
        const drawY = screenY - bounce;

        // Ombra
        ctx.fillStyle = colors.shadow;
        ctx.beginPath();
        ctx.ellipse(screenX + 16, screenY + 28, 8, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Draw based on species or role
        if (npc.species === 'bulbasaur') drawBulbasaur(screenX, drawY, npc.direction);
        else if (npc.species === 'lapras') drawLapras(screenX, drawY, npc.direction);
        else {
            // Generic NPC
            ctx.fillStyle = npc.color || colors.npcBody;
            ctx.beginPath();
            ctx.roundRect(screenX + 8, drawY + 14, 16, 14, 4);
            ctx.fill();

            // Testa
            ctx.fillStyle = colors.playerSkin;
            ctx.beginPath();
            ctx.roundRect(screenX + 6, drawY + 2, 20, 18, 6);
            ctx.fill();
            ctx.fillStyle = npc.hatColor || colors.npcHat;
            ctx.fillRect(screenX + 6, drawY + 2, 20, 4);

            // Occhi
            ctx.fillStyle = '#333';
            if (npc.direction === 'left') {
                ctx.fillRect(screenX + 8, drawY + 10, 2, 4);
            } else if (npc.direction === 'right') {
                ctx.fillRect(screenX + 22, drawY + 10, 2, 4);
            } else if (npc.direction === 'up') {
                // No eyes
            } else {
                ctx.fillRect(screenX + 10, drawY + 10, 2, 4);
                ctx.fillRect(screenX + 20, drawY + 10, 2, 4);
            }
        }
    }

    function drawBulbasaur(x, y, dir) {
        ctx.fillStyle = '#48d0b0'; // Teal Body
        ctx.beginPath();
        ctx.roundRect(x + 4, y + 12, 24, 18, 6);
        ctx.fill();
        
        ctx.fillStyle = '#2ecc71'; // Bulb
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 10, 8, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Head
        ctx.fillStyle = '#48d0b0';
        ctx.beginPath();
        ctx.roundRect(x + 6, y + 6, 20, 16, 5);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        if (dir === 'left') ctx.fillRect(x + 6, y + 10, 4, 4);
        else if (dir === 'right') ctx.fillRect(x + 22, y + 10, 4, 4);
        else if (dir === 'down' || !dir) {
            ctx.fillRect(x + 8, y + 10, 4, 4);
            ctx.fillRect(x + 20, y + 10, 4, 4);
            ctx.fillStyle = '#c0392b'; // Red eyes
            ctx.fillRect(x + 9, y + 11, 2, 2);
            ctx.fillRect(x + 21, y + 11, 2, 2);
        }
    }

    function drawLapras(x, y, dir) {
        ctx.fillStyle = '#3498db'; // Blue Body
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 24, 14, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#95a5a6'; // Shell
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 20, 10, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Neck & Head
        ctx.fillStyle = '#3498db';
        ctx.beginPath();
        ctx.moveTo(x + 16, y + 24);
        ctx.quadraticCurveTo(x + 16, y + 16, x + 16, y + 8);
        ctx.stroke(); // Simplified neck
        ctx.fillRect(x + 14, y + 10, 4, 14);
        ctx.ellipse(x + 16, y + 6, 6, 5, 0, 0, Math.PI*2); // Head
        ctx.fill();
    }

    function drawBoat(x, y, dir) {
        ctx.fillStyle = colors.boatBody;
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 24, 14, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = colors.boatFloor;
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 24, 10, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = colors.boatSeat;
        ctx.fillRect(x + 10, y + 22, 12, 4);
    }

    function drawPlayer() {
        const screenX = player.pixelX;
        const screenY = player.pixelY;
        
        if (player.isSurfing) {
            drawBoat(screenX, screenY + 4, player.direction);
        };

        if (!player.isSurfing) {
            ctx.fillStyle = colors.shadow;
            ctx.beginPath();
            ctx.ellipse(screenX + 16, screenY + 28, 8, 3, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        const bounce = player.moving ? Math.abs(Math.sin(Date.now() / 100)) * 3 : 0;
        const drawY = screenY - bounce;

        // Body
        ctx.fillStyle = colors.playerBody;
        ctx.beginPath();
        ctx.roundRect(screenX + 8, drawY + 14, 16, 14, 4);
        ctx.fill();

        // Head
        ctx.fillStyle = colors.playerSkin;
        ctx.beginPath();
        ctx.roundRect(screenX + 6, drawY + 2, 20, 18, 6);
        ctx.fill();
        ctx.fillStyle = colors.playerHat;
        ctx.fillRect(screenX + 6, drawY + 2, 20, 6); // Hat

        // Eyes
        ctx.fillStyle = '#333';
        if (player.direction === 'left') {
            ctx.fillRect(screenX + 8, drawY + 10, 2, 4);
        } else if (player.direction === 'right') {
            ctx.fillRect(screenX + 22, drawY + 10, 2, 4);
        } else if (player.direction === 'up') {
            // Back
        } else {
            ctx.fillRect(screenX + 10, drawY + 10, 2, 4);
            ctx.fillRect(screenX + 20, drawY + 10, 2, 4);
        }
    }

    function updateCamera() {
        const mapWidth = currentMap[0].length;
        const mapHeight = currentMap.length;
        const targetCamX = (player.pixelX / TILE_SIZE) - (VISIBLE_TILES / 2);
        const targetCamY = (player.pixelY / TILE_SIZE) - (VISIBLE_TILES / 2);
        
        if (mapWidth <= VISIBLE_TILES) {
            camera.x = -(VISIBLE_TILES - mapWidth) / 2;
            camera.y = -(VISIBLE_TILES - mapHeight) / 2;
        } else {
            camera.x = Math.max(0, Math.min(targetCamX, mapWidth - VISIBLE_TILES));
            camera.y = Math.max(0, Math.min(targetCamY, mapHeight - VISIBLE_TILES));
        }
    }

    function saveGame() {
        const saveData = {
            player: {
                x: player.x,
                y: player.y,
                direction: player.direction,
                moving: player.moving,
                inventory: player.inventory,
                isSurfing: player.isSurfing,
                turnTimer: player.turnTimer,
                pixelX: player.pixelX,
                pixelY: player.pixelY
            },
            worldX: worldX,
            worldY: worldY,
            gameTime: gameTime,
            indoorData: isIndoors ? currentData : null
        };
        localStorage.setItem('pokemonSave', JSON.stringify(saveData));
        showDialogue("Gioco salvato con successo!");
        setTimeout(() => { if(isDialogueOpen) closeDialogue(); }, 2000);
    }

    function loadGame() {
        try {
            const saveData = JSON.parse(localStorage.getItem('pokemonSave'));
            if (!saveData) return false;
            Object.assign(player, saveData.player);
            Object.assign(gameTime, saveData.gameTime);
            worldX = saveData.worldX;
            worldY = saveData.worldY;
            if (saveData.indoorData) {
                isIndoors = true;
                currentData = saveData.indoorData;
                currentMap = currentData.tiles;
                currentNPCs = currentData.npcs;
            } else {
                isIndoors = false;
                currentData = getCurrentData();
                currentMap = currentData.tiles;
                currentNPCs = currentData.npcs;
            }
            updateCamera();
            return true;
        } catch (e) {
            console.error("Save load failed", e);
            return false;
        }
    }

    function spawnNPCs(npcs, wx, wy) {
        // Already handled in generateMap
    }

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function update() {
        if (!player.moving && !isTransitioning && !isDialogueOpen && !isPokedexOpen) {
            let dx = 0;
            let dy = 0;
            if (keys['ArrowUp'] || keys['w']) dy = -1;
            else if (keys['ArrowDown'] || keys['s']) dy = 1;
            else if (keys['ArrowLeft'] || keys['a']) dx = -1;
            else if (keys['ArrowRight'] || keys['d']) dx = 1;

            if (dx !== 0 || dy !== 0) {
                player.direction = dx === -1 ? 'left' : dx === 1 ? 'right' : dy === -1 ? 'up' : 'down';
                const targetX = player.x + dx;
                const targetY = player.y + dy;
                
                // Collision check
                let collision = false;
                if (targetX < 0 || targetX >= currentMap[0].length || targetY < 0 || targetY >= currentMap.length) {
                    if (!isIndoors) {
                        // Map transition
                        worldX += dx;
                        worldY += dy;
                        player.x = dx === 1 ? 0 : dx === -1 ? MAP_SIZE - 1 : player.x;
                        player.y = dy === 1 ? 0 : dy === -1 ? MAP_SIZE - 1 : player.y;
                        loadWorld(worldX, worldY);
                        return;
                    } else {
                        collision = true; // Wall
                    }
                }
                
                if (!collision) {
                    const tile = currentMap[targetY][targetX];
                    const solidTiles = [2, 7, 11, 12, 20, 21, 23, 27]; // Added 27 (Building Wall)
                    if (solidTiles.includes(tile)) collision = true;
                    if (tile === 4 && !player.isSurfing) collision = true;
                    
                    // Check NPCs
                    if (currentNPCs.some(npc => npc.x === targetX && npc.y === targetY)) collision = true;
                    
                    // Check Doors (Teleport)
                    if (tile === 30) { // Cave Entrance
                        teleportTo('cave', 6, 8);
                        return;
                    } else if (tile === 28) { // City Door
                        // Find building info
                        const building = currentData.buildings ? currentData.buildings.find(b => b.x === targetX && b.y === targetY) : null;
                        if (building) {
                            teleportTo(building.type, 6, 8); // Center of room
                            return;
                        }
                    } else if (tile === 10 && isIndoors) { // Exit Mat
                        teleportTo('outdoor', savedOutdoorPos.x, savedOutdoorPos.y + 1);
                        return;
                    }
                }
                
                if (!collision) {
                    player.moving = true;
                    player.x = targetX;
                    player.y = targetY;
                    const startPixelX = player.pixelX;
                    const startPixelY = player.pixelY;
                    const endPixelX = targetX * TILE_SIZE;
                    const endPixelY = targetY * TILE_SIZE;
                    let progress = 0;
                    
                    function animateMove() {
                        progress += 0.1;
                        if (progress >= 1) {
                            player.moving = false;
                            player.pixelX = endPixelX;
                            player.pixelY = endPixelY;
                            updateCamera();
                        } else {
                            player.pixelX = startPixelX + (endPixelX - startPixelX) * progress;
                            player.pixelY = startPixelY + (endPixelY - startPixelY) * progress;
                            updateCamera();
                            requestAnimationFrame(animateMove);
                        }
                    }
                    animateMove();
                }
            }
        }
    }

    function loadWorld(wx, wy) {
        currentData = getCurrentData();
        currentMap = currentData.tiles;
        currentNPCs = currentData.npcs;
        player.pixelX = player.x * TILE_SIZE;
        player.pixelY = player.y * TILE_SIZE;
        updateCamera();
    }

    let savedOutdoorPos = { x: 0, y: 0 }; // Track outdoor pos

    // Override teleportTo to save pos
    const originalTeleport = teleportTo;
    teleportTo = function(mapType, targetX, targetY) {
        if (mapType !== 'outdoor') {
            savedOutdoorPos = { x: player.x, y: player.y };
        }
        originalTeleport(mapType, targetX, targetY);
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        if (isIndoors) {
            // Center camera on room
            const roomW = currentMap[0].length * TILE_SIZE;
            const roomH = currentMap.length * TILE_SIZE;
            const offsetX = (canvas.width - roomW) / 2;
            const offsetY = (canvas.height - roomH) / 2;
            ctx.translate(offsetX, offsetY);
        } else {
            ctx.translate(-(camera.x * TILE_SIZE), -(camera.y * TILE_SIZE));
        }

        // Draw Map
        const startX = Math.floor(camera.x);
        const startY = Math.floor(camera.y);
        const endX = startX + VISIBLE_TILES + 1;
        const endY = startY + VISIBLE_TILES + 1;

        const mapH = currentMap.length;
        const mapW = currentMap[0].length;

        for (let y = 0; y < mapH; y++) {
            for (let x = 0; x < mapW; x++) {
                // Optimization: only draw visible if outdoor
                if (!isIndoors && (x < startX || x > endX || y < startY || y > endY)) continue;
                drawGround(x, y, currentMap[y][x]);
            }
        }

        // Sort entities
        const entities = [];
        entities.push({ type: 'player', y: player.y, pixelY: player.pixelY });
        currentNPCs.forEach(npc => {
            entities.push({ type: 'npc', y: npc.y, pixelY: npc.pixelY !== undefined ? npc.pixelY : npc.y * TILE_SIZE, data: npc });
        });

        entities.sort((a, b) => a.pixelY - b.pixelY);

        entities.forEach(e => {
            if (e.type === 'player') drawPlayer();
            else if (e.type === 'npc') drawNPC(e.data);
        });

        ctx.restore();
        
        // UI
        // ... (UI drawing if needed, but HTML handles most)
        
        requestAnimationFrame(loop);
    }

    function loop() {
        update();
        draw();
    }

    // Start
    updateCamera();
    loop();

    // UI Handlers
    document.getElementById('btn-save').addEventListener('click', saveGame);
    
    function showDialogue(text) {
        dialogueBox.innerText = text;
        dialogueBox.style.display = 'block';
        isDialogueOpen = true;
        setTimeout(() => {
            dialogueBox.style.display = 'none';
            isDialogueOpen = false;
        }, 3000);
    }
    
    function closeDialogue() {
        dialogueBox.style.display = 'none';
        isDialogueOpen = false;
    }

    // D-Pad
    const dpadButtons = ['up', 'down', 'left', 'right'];
    dpadButtons.forEach(dir => {
        const btn = document.getElementById('btn-' + dir);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = false; });
        btn.addEventListener('mousedown', (e) => { keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = true; });
        btn.addEventListener('mouseup', (e) => { keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = false; });
    });

</script>
