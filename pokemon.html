<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Simulatore Pokémon</title>
    <link rel="stylesheet" href="assets/css/pokemon.css">
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>

    <div id="game-container">
        <div id="game-screen">
            <div id="canvas-wrapper">
                <div id="transition-overlay"></div>
                <div id="clock-hud">
                    <span id="clock-icon">☀️</span>
                    <span id="clock-time">12:00</span>
                    <button id="save-btn" onclick="saveGame()" style="pointer-events:auto; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4); color:white; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:0.75rem; font-weight:bold; margin-left:8px;">SAVE</button>
                    <button id="pokedex-btn" onclick="togglePokedex()" style="pointer-events:auto; background:rgba(255,50,50,0.6); border:1px solid rgba(255,100,100,0.4); color:white; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:0.75rem; font-weight:bold; margin-left:4px;">DEX</button>
                </div>
                <div id="tool-hud">
                    <span id="tool-icon">🪓</span>
                    <span id="tool-name">Ascia</span>
                </div>
                <div id="inventory-hud">
                    <div class="inv-item">💰 <span id="inv-money">0</span></div>
                    <div class="inv-item">🪵 <span id="inv-wood">0</span></div>
                    <div class="inv-item">🪨 <span id="inv-stone">0</span></div>
                    <div class="inv-item">🌿 <span id="inv-grass">0</span></div>
                </div>        
                <div id="dialogue-box">
                    <div id="dialogue-text"></div>
                    <div id="dialogue-options"></div>
                    <div id="dialogue-next">▼ (A)</div>
                </div>
                <canvas id="gameCanvas" width="320" height="320"></canvas>
            </div>
        </div>
        
        <div id="controls">
            <div id="dpad">
                <button class="btn btn-up" data-dir="up">▲</button>
                <button class="btn btn-left" data-dir="left">◄</button>
                <button class="btn btn-right" data-dir="right">►</button>
                <button class="btn btn-down" data-dir="down">▼</button>
            </div>
            
            <div id="action-buttons">
                <button class="btn btn-action btn-y" data-action="y">Y</button>
                <button class="btn btn-action btn-x" data-action="x">X</button>
                <button class="btn btn-action btn-b" data-action="b">B</button>
                <button class="btn btn-action btn-a" data-action="a">A</button>
            </div>
        </div>
        
        <div id="info">Usa i pulsanti per muoverti! X: Cambia Utensile, Y: Usa Utensile</div>
    </div>

    <div id="debug-info" style="position:fixed; top:5px; right:5px; color:lime; font-family:monospace; font-size:10px; z-index:9999; pointer-events:none; text-align:right; background:rgba(0,0,0,0.5); padding:2px;">
        v: ec0585e
    </div>

    <!-- Pokedex Modal -->
    <div id="pokedex-modal">
        <div id="pokedex-grid"></div>
        <button onclick="togglePokedex()" style="margin-top: 10px; padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">Chiudi</button>
    </div>

    <script src="assets/js/pokemon/constants.js"></script>
    <script src="assets/js/pokemon/state.js"></script>
    <script src="assets/js/pokemon/utils.js"></script>
    <script src="assets/js/pokemon/map.js"></script>
    <script src="assets/js/pokemon/render.js"></script>
    <script src="assets/js/pokemon/gameplay.js"></script>
    <script src="assets/js/pokemon/main.js"></script>
</body>
</html>
