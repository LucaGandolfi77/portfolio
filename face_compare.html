<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Compare AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a1628;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #00d4ff; margin-bottom: 20px; text-align: center; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            position: relative;
        }
        .panel h2 { margin-top: 0; font-size: 1.2rem; color: #a0c0e0; }
        .view-area {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video, canvas, img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Mirror the video for natural feel */
        #inputVideo, #outputCanvas {
            transform: scaleX(-1);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, .file-upload {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
        }
        button:hover, .file-upload:hover {
            background: #00d4ff;
            color: #0a1628;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input[type="file"] { display: none; }
        #result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            min-height: 1.5em;
            color: #00d4ff;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            max-width: 800px;
        }
        .back-link {
            margin-top: 30px;
            color: #a0c0e0;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
        }
        .progress-container {
            width: 100%;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 10px 0;
            height: 6px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00d4ff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>Face Compare & Transform</h1>
    
    <div class="container">
        <!-- Reference Panel -->
        <div class="panel">
            <h2>1. Reference Face</h2>
            <div class="view-area">
                <img id="refImage" style="display:none;">
                <canvas id="refCanvas"></canvas>
                <div id="refPlaceholder" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;">Upload an image</div>
            </div>
            <div class="controls">
                <label class="file-upload">
                    Upload Photo
                    <input type="file" id="uploadInput" accept="image/*">
                </label>
            </div>
            <div id="refProgress" class="progress-container">
                <div id="refProgressBar" class="progress-bar"></div>
            </div>
        </div>

        <!-- Live Panel -->
        <div class="panel">
            <h2>2. Your Face</h2>
            <div class="view-area">
                <video id="inputVideo" playsinline webkit-playsinline muted autoplay></video>
                <canvas id="outputCanvas"></canvas>
                <div id="cameraLoading" class="loading-overlay">Loading Model...</div>
            </div>
            <div class="controls">
                <button id="compareBtn" disabled>Capture & Compare</button>
            </div>
        </div>
    </div>

    <div id="result">Upload a reference image to start comparison</div>

    <a href="index.html#projects" class="back-link">← Back to Portfolio</a>

    <script>
        const videoElement = document.getElementById('inputVideo');
        const outputCanvas = document.getElementById('outputCanvas');
        const outputCtx = outputCanvas.getContext('2d');
        
        const refCanvas = document.getElementById('refCanvas');
        const refCtx = refCanvas.getContext('2d');
        const refImage = document.getElementById('refImage');
        const refPlaceholder = document.getElementById('refPlaceholder');
        
        const uploadInput = document.getElementById('uploadInput');
        const compareBtn = document.getElementById('compareBtn');
        const resultDiv = document.getElementById('result');
        const cameraLoading = document.getElementById('cameraLoading');
        const refProgress = document.getElementById('refProgress');
        const refProgressBar = document.getElementById('refProgressBar');

        let faceMesh;
        let camera;
        let refLandmarks = null;
        let liveLandmarks = null;
        let isComparing = false;
        let isProcessingReference = false;

        // Initialize FaceMesh
        async function setupFaceMesh() {
            faceMesh = new FaceMesh({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
            }});
            
            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            faceMesh.onResults(onResults);
            
            // Start camera after model is ready
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    if (!isComparing && !isProcessingReference) {
                        await faceMesh.send({image: videoElement});
                    }
                },
                width: 640,
                height: 480
            });
            
            await camera.start();
            cameraLoading.style.display = 'none';
        }

        function onResults(results) {
            // Resize canvas to match video
            outputCanvas.width = videoElement.videoWidth;
            outputCanvas.height = videoElement.videoHeight;

            outputCtx.save();
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
            
            // Draw the video frame
            outputCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                liveLandmarks = landmarks;

                // Draw current face mesh
                drawConnectors(outputCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C070', lineWidth: 1});
                
                // If we are in comparison mode and have reference landmarks
                if (isComparing && refLandmarks) {
                    drawComparison(landmarks);
                }
            }
            outputCtx.restore();
        }

        function onReferenceResults(results) {
            // Check if this result matches our reference image dimensions
            // This prevents processing leftover video frames
            const img = document.getElementById('refImage'); // We need to store the current img somewhere or use closure
            // Actually, we can just check if the result image size matches the canvas size we just set
            
            if (results.image.width !== refCanvas.width || results.image.height !== refCanvas.height) {
                console.log("Ignoring result with mismatching dimensions (likely video frame)");
                return; // Ignore this result, wait for the next one (which should be our image)
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                refLandmarks = results.multiFaceLandmarks[0];
                
                // Draw mesh on ref canvas
                refCtx.save();
                refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
                refCtx.drawImage(results.image, 0, 0);
                // Draw with higher visibility (bright green, thicker lines)
                drawConnectors(refCtx, refLandmarks, FACEMESH_TESSELATION, {color: '#30FF30', lineWidth: 2});
                refCtx.restore();
                
                resultDiv.textContent = "Reference processed! Now capture your face.";
                compareBtn.disabled = false;
            } else {
                resultDiv.textContent = "No face detected in reference image. Try another.";
                refLandmarks = null;
                compareBtn.disabled = true;
            }
            
            // Restore original handler
            faceMesh.onResults(onResults);
            isProcessingReference = false;
            refProgressBar.style.width = '100%';
            setTimeout(() => {
                refProgress.style.display = 'none';
            }, 500);
        }

        function drawComparison(currentLandmarks) {
            // Draw reference mesh (ghost) on camera feed for visual alignment
            drawConnectors(outputCtx, refLandmarks, FACEMESH_TESSELATION, {color: '#00d4ff30', lineWidth: 1});

            // Calculate difference and draw lines
            let totalDist = 0;
            
            // Draw reference landmarks (projected onto current view)
            // Note: This is a naive comparison. Ideally we would align the faces first.
            // Here we just overlay them.
            
            for (let i = 0; i < currentLandmarks.length; i+=10) { // Skip some points for performance/clarity
                const curr = currentLandmarks[i];
                const ref = refLandmarks[i];
                
                const x1 = curr.x * outputCanvas.width;
                const y1 = curr.y * outputCanvas.height;
                const x2 = ref.x * outputCanvas.width;
                const y2 = ref.y * outputCanvas.height;
                
                // Draw line from current to reference
                outputCtx.beginPath();
                outputCtx.moveTo(x1, y1);
                outputCtx.lineTo(x2, y2);
                outputCtx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                outputCtx.lineWidth = 2;
                outputCtx.stroke();
                
                // Calculate distance
                const dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                totalDist += dist;
            }
            
            const avgDist = totalDist / (currentLandmarks.length / 10);
            resultDiv.innerHTML = `Difference Score: ${avgDist.toFixed(2)}<br><span style="font-size:0.9rem;color:#aaa;">(Red lines show deviation from reference)</span>`;
        }

        // Handle File Upload
        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = async () => {
                    refPlaceholder.style.display = 'none';
                    refCanvas.width = img.width;
                    refCanvas.height = img.height;
                    refCtx.drawImage(img, 0, 0);
                    
                    // Process reference image to get landmarks
                    isProcessingReference = true;
                    resultDiv.textContent = "Processing reference image...";
                    refProgress.style.display = 'block';
                    refProgressBar.style.width = '10%';
                    
                    // Reset FaceMesh to clear history and prevent temporal smoothing issues
                    // and wait a bit for any pending video frames to clear
                    faceMesh.reset();
                    
                    setTimeout(async () => {
                        // Switch to reference handler
                        faceMesh.onResults(onReferenceResults);
                        
                        // Simulate progress
                        refProgressBar.style.width = '50%';
                        
                        await faceMesh.send({image: img});
                    }, 100);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Handle Compare Button
        compareBtn.addEventListener('click', () => {
            isComparing = !isComparing;
            if (isComparing) {
                compareBtn.textContent = "Stop Comparison";
                compareBtn.style.background = "rgba(255, 0, 0, 0.2)";
                compareBtn.style.borderColor = "red";
                compareBtn.style.color = "red";
            } else {
                compareBtn.textContent = "Capture & Compare";
                compareBtn.style.background = "";
                compareBtn.style.borderColor = "";
                compareBtn.style.color = "";
                resultDiv.textContent = "Comparison stopped.";
            }
        });

        // Start
        setupFaceMesh();

    </script>
</body>
</html>
