<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Streaming — Luca Gandolfi</title>
  <link href="./assets/css/main.css" rel="stylesheet">
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial;background:#071023;color:#e6f7ff;padding:24px}
    .wrap{max-width:1100px;margin:0 auto}
    h1{margin:0 0 8px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    input[type=search],input[type=text]{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;flex:1}
    button{background:#00d4ff;color:#002;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
    .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
    .item{background:rgba(255,255,255,0.03);padding:12px;border-radius:10px;display:flex;gap:10px;align-items:flex-start}
    .thumb{width:140px;height:80px;border-radius:6px;object-fit:cover;background:#0a2030}
    .meta{flex:1}
    .small{font-size:0.9rem;color:#9fcfff}
    video{width:100%;max-height:520px;border-radius:8px;background:black}
    iframe{width:100%;height:520px;border:0;border-radius:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Streaming Video</h1>
    <p class="small">Cerca video pubblici e archivi TV (Internet Archive). Incolla anche URL diretti (mp4/webm) o iframe embed (YouTube embed) per riprodurli.</p>

    <div class="controls">
      <input id="q" type="search" placeholder="Cerca (es. news, documentary, bbc, italy)" />
      <button id="searchBtn">Cerca</button>
      <button id="topBtn">Popolari</button>
      <input id="urlInput" type="text" placeholder="Incolla video URL diretto (mp4) o YouTube embed URL" style="max-width:520px" />
      <button id="playUrlBtn">Play URL</button>
    </div>

    <div id="playerArea"></div>

    <h3 style="margin-top:18px">Risultati</h3>
    <div id="results" class="results" aria-live="polite"></div>
  </div>

  <script>
    const api = 'https://archive.org/advancedsearch.php';
    const resultsEl = document.getElementById('results');
    const qEl = document.getElementById('q');
    const searchBtn = document.getElementById('searchBtn');
    const topBtn = document.getElementById('topBtn');
    const playerArea = document.getElementById('playerArea');
    const urlInput = document.getElementById('urlInput');
    const playUrlBtn = document.getElementById('playUrlBtn');

    function escapeHtml(t){ if(!t) return ''; return String(t).replace(/[&<>\"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

    async function search(q){
      resultsEl.innerHTML = '<div class="small">Caricamento…</div>';
      const query = `((mediatype:(movies) OR mediatype:(audio_video)) AND (${q}))`;
      const url = `${api}?q=${encodeURIComponent(query)}&fl[]=identifier,created,title,description,scanner,mediatype&rows=24&page=1&output=json`;
      try{
        const r = await fetch(url);
        const j = await r.json();
        renderResults(j.response.docs || []);
      }catch(e){ resultsEl.innerHTML = '<div class="small">Errore nella ricerca.</div>'; console.error(e); }
    }

    async function top(){
      resultsEl.innerHTML = '<div class="small">Caricamento popolari…</div>';
      const url = `${api}?q=mediatype:(movies)&sort[]=downloads+desc&fl[]=identifier,created,title,description,mediatype&rows=24&page=1&output=json`;
      try{
        const r = await fetch(url);
        const j = await r.json();
        renderResults(j.response.docs || []);
      }catch(e){ resultsEl.innerHTML = '<div class="small">Errore nel caricamento.</div>'; console.error(e); }
    }

    function renderResults(items){
      resultsEl.innerHTML = '';
      if(!items.length){ resultsEl.innerHTML = '<div class="small">Nessun risultato.</div>'; return; }
      items.forEach(it=>{
        const div = document.createElement('div'); div.className='item';
        const thumb = document.createElement('img'); thumb.className='thumb'; thumb.alt='thumb';
        // Use archive thumbnail if available
        thumb.src = `https://archive.org/services/img/${it.identifier}`;
        thumb.onerror = ()=>{ thumb.src = './assets/favicon.svg'; }
        const meta = document.createElement('div'); meta.className='meta';
        meta.innerHTML = `<div style="font-weight:700">${escapeHtml(it.title||it.identifier)}</div><div class="small">${escapeHtml(it.created||'')} · ${escapeHtml(it.mediatype||'')}</div><div style="margin-top:6px;color:#a0c0e0">${escapeHtml((it.description||'').substring(0,200))}...</div>`;
        const btnBox = document.createElement('div'); btnBox.style.display='flex'; btnBox.style.flexDirection='column'; btnBox.style.gap='8px';
        const playBtn = document.createElement('button'); playBtn.textContent='Play';
        playBtn.onclick = ()=> playArchiveItem(it.identifier);
        const infoBtn = document.createElement('button'); infoBtn.textContent='Apri su Archive'; infoBtn.onclick = ()=> window.open('https://archive.org/details/'+it.identifier, '_blank');
        btnBox.appendChild(playBtn); btnBox.appendChild(infoBtn);
        div.appendChild(thumb); div.appendChild(meta); div.appendChild(btnBox);
        resultsEl.appendChild(div);
      });
    }

    async function playArchiveItem(id){
      playerArea.innerHTML = '<div class="small">Caricamento metadati…</div>';
      try{
        const r = await fetch(`https://archive.org/metadata/${id}`);
        const j = await r.json();
        const files = j.files || [];
        // Prefer mp4, webm, ogv
        const prefer = ['mp4','webm','ogg','ogv'];
        let fileEntry = files.find(f=> prefer.includes((f.name||'').split('.').pop().toLowerCase()));
        if(!fileEntry){ // try first file with a name
          fileEntry = files.find(f=> f.name && f.size && f.format && /video|mp4|webm|ogg/i.test(f.format));
        }
        if(!fileEntry){ playerArea.innerHTML = '<div class="small">Nessun file video disponibile per questo item.</div>'; return; }
        const fileName = fileEntry.name;
        const src = `https://archive.org/download/${id}/${encodeURIComponent(fileName)}`;
        // create video element
        playerArea.innerHTML = `<video id="videoPlayer" controls crossorigin="anonymous" playsinline></video>`;
        const v = document.getElementById('videoPlayer');
        v.src = src;
        v.play().catch(e=>console.warn('Autoplay prevented',e));
        // Media session
        if('mediaSession' in navigator){
          navigator.mediaSession.metadata = new MediaMetadata({ title: j.metadata && (j.metadata.title||id) || id, artist: j.metadata && j.metadata.creator || 'Internet Archive' });
        }
      }catch(e){ playerArea.innerHTML = '<div class="small">Errore caricamento item.</div>'; console.error(e); }
    }

    function isYouTubeUrl(u){ return /youtube\.com|youtu\.be/.test(u); }

    function playCustomUrl(u){
      // If YouTube embed URL, insert iframe
      if(isYouTubeUrl(u)){
        // transform to embed if needed
        let embed = u;
        if(/watch\?v=/.test(u)){
          const id = new URLSearchParams(new URL(u).search).get('v'); embed = `https://www.youtube.com/embed/${id}`;
        } else if(/youtu\.be\//.test(u)){
          const id = u.split('/').pop(); embed = `https://www.youtube.com/embed/${id}`;
        }
        playerArea.innerHTML = `<iframe src="${embed}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        return;
      }
      // otherwise try to treat as direct video URL
      playerArea.innerHTML = `<video id="videoPlayer" controls crossorigin="anonymous" playsinline src="${u}"></video>`;
      const v = document.getElementById('videoPlayer');
      v.play().catch(e=>console.warn('Autoplay prevented',e));
    }

    searchBtn.onclick = ()=>{ const q = qEl.value.trim(); if(q) search(q); }
    topBtn.onclick = ()=> top();
    playUrlBtn.onclick = ()=>{ const u = urlInput.value.trim(); if(!u) return alert('Inserisci un URL'); playCustomUrl(u); }

    // Autoload popular on open
    top();
  </script>
</body>
</html>
