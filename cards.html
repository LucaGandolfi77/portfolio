<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Collector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(45deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .currency-display {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .currency {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        .currency.gold { color: #ffd700; }
        .currency.gems { color: #e066ff; }

        .currency span.icon {
            font-size: 1.5rem;
        }

        .add-currency {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .add-currency:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.1);
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .nav-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        /* Sections */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        /* Card */
        .card {
            position: relative;
            aspect-ratio: 2/3;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card.common { background: linear-gradient(145deg, #4a5568, #2d3748); border: 3px solid #718096; }
        .card.rare { background: linear-gradient(145deg, #2b6cb0, #1a365d); border: 3px solid #4299e1; }
        .card.epic { background: linear-gradient(145deg, #6b46c1, #44337a); border: 3px solid #9f7aea; }
        .card.legendary { 
            background: linear-gradient(145deg, #d69e2e, #744210); 
            border: 3px solid #f6e05e;
            animation: legendaryGlow 2s infinite;
        }

        @keyframes legendaryGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(246, 224, 94, 0.5); }
            50% { box-shadow: 0 0 40px rgba(246, 224, 94, 0.8); }
        }

        .card.locked {
            filter: grayscale(100%) brightness(0.5);
        }

        .card-inner {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .card-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .card-name {
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .card-level {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card-count {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .upgrade-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(0,0,0,0.5);
        }

        .upgrade-progress {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169);
            transition: width 0.3s;
        }

        /* Shop */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .box {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .box:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.3);
        }

        .box.small { border-color: #718096; }
        .box.medium { border-color: #4299e1; }
        .box.large { border-color: #9f7aea; }
        .box.mega { border-color: #f6e05e; animation: legendaryGlow 2s infinite; }

        .box-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .box-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .box-info {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 15px;
        }

        .box-price {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .price-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .price-tag.gold { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
        .price-tag.gems { background: rgba(224, 102, 255, 0.2); color: #e066ff; }

        /* Battle */
        .battle-arena {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .battle-cards {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .battle-card {
            width: 200px;
        }

        .vs-text {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
        }

        .battle-btn {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: linear-gradient(45deg, #48bb78, #38a169);
            color: #fff;
            transition: all 0.3s;
        }

        .battle-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(72, 187, 120, 0.4);
        }

        .battle-result {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            min-height: 50px;
        }

        .battle-result.win { color: #48bb78; }
        .battle-result.lose { color: #fc8181; }

        /* Box Opening Animation */
        .box-opening-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
        }

        .box-opening-overlay.active {
            display: flex;
        }

        .opening-box {
            font-size: 8rem;
            animation: boxShake 0.5s infinite;
        }

        @keyframes boxShake {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .revealed-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .revealed-card {
            animation: cardReveal 0.5s ease-out forwards;
            opacity: 0;
            transform: scale(0) rotateY(180deg);
        }

        @keyframes cardReveal {
            to {
                opacity: 1;
                transform: scale(1) rotateY(0);
            }
        }

        .close-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        /* Card Detail Modal */
        .card-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .card-modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
        }

        .modal-card {
            width: 200px;
            margin: 0 auto 20px;
        }

        .upgrade-btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: linear-gradient(45deg, #48bb78, #38a169);
            color: #fff;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .upgrade-btn:disabled {
            background: #4a5568;
            cursor: not-allowed;
        }

        .upgrade-btn:not(:disabled):hover {
            transform: scale(1.05);
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #a0aec0;
            margin-top: 5px;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            z-index: 100;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(0,0,0,0.7);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            .battle-cards { gap: 20px; }
            .vs-text { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>

    <div class="container">
        <div class="header">
            <h1>🎴 Card Collector</h1>
            <div class="currency-display">
                <div class="currency gold">
                    <span class="icon">💰</span>
                    <span id="goldAmount">1000</span>
                    <button class="add-currency" onclick="addGold()">+</button>
                </div>
                <div class="currency gems">
                    <span class="icon">💎</span>
                    <span id="gemsAmount">100</span>
                    <button class="add-currency" onclick="addGems()">+</button>
                </div>
            </div>
        </div>

        <div class="nav">
            <button class="nav-btn active" onclick="showSection('collection')">📚 Collection</button>
            <button class="nav-btn" onclick="showSection('shop')">🛒 Shop</button>
            <button class="nav-btn" onclick="showSection('battle')">⚔️ Battle</button>
            <button class="nav-btn" onclick="showSection('stats')">📊 Stats</button>
        </div>

        <!-- Collection Section -->
        <div class="section active" id="collection">
            <h2 style="margin-bottom: 20px;">Your Collection</h2>
            <div class="cards-grid" id="collectionGrid"></div>
        </div>

        <!-- Shop Section -->
        <div class="section" id="shop">
            <h2 style="margin-bottom: 20px;">Card Shop</h2>
            <div class="shop-grid" id="shopGrid"></div>
        </div>

        <!-- Battle Section -->
        <div class="section" id="battle">
            <div class="battle-arena">
                <h2>Battle Arena</h2>
                <p style="color: #a0aec0; margin-top: 10px;">Select a card and fight to earn rewards!</p>
                
                <div class="battle-cards">
                    <div class="battle-card">
                        <h3 style="margin-bottom: 10px;">Your Card</h3>
                        <div id="playerCard"></div>
                        <select id="cardSelect" style="width: 100%; padding: 10px; margin-top: 10px; border-radius: 10px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
                            <option value="">Select a card...</option>
                        </select>
                    </div>
                    <div class="vs-text">VS</div>
                    <div class="battle-card">
                        <h3 style="margin-bottom: 10px;">Opponent</h3>
                        <div id="enemyCard"></div>
                    </div>
                </div>

                <div class="battle-result" id="battleResult"></div>
                <button class="battle-btn" onclick="startBattle()">⚔️ Fight!</button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="section" id="stats">
            <h2 style="margin-bottom: 20px;">Your Stats</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalCards">0</div>
                    <div class="stat-label">Cards Owned</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="legendaryCount">0</div>
                    <div class="stat-label">Legendary Cards</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="battlesWon">0</div>
                    <div class="stat-label">Battles Won</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="boxesOpened">0</div>
                    <div class="stat-label">Boxes Opened</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Box Opening Overlay -->
    <div class="box-opening-overlay" id="boxOverlay">
        <button class="close-overlay" onclick="closeBoxOverlay()">✕</button>
        <div class="opening-box" id="openingBox">📦</div>
        <div class="revealed-cards" id="revealedCards"></div>
    </div>

    <!-- Card Detail Modal -->
    <div class="card-modal" id="cardModal">
        <div class="modal-content">
            <div class="modal-card" id="modalCard"></div>
            <h2 id="modalCardName"></h2>
            <p id="modalCardStats" style="color: #a0aec0; margin: 10px 0;"></p>
            <p id="modalCardCount" style="color: #a0aec0;"></p>
            <button class="upgrade-btn" id="upgradeBtn" onclick="upgradeCard()">⬆️ Upgrade</button>
            <button class="upgrade-btn" style="background: #4a5568; margin-left: 10px;" onclick="closeCardModal()">Close</button>
        </div>
    </div>

    <script>
        // Game Data
        const allCards = [
            // Common
            { id: 1, name: "Fire Sprite", emoji: "🔥", rarity: "common", attack: 10, defense: 8 },
            { id: 2, name: "Water Drop", emoji: "💧", rarity: "common", attack: 8, defense: 10 },
            { id: 3, name: "Leaf Spirit", emoji: "🍃", rarity: "common", attack: 9, defense: 9 },
            { id: 4, name: "Stone Golem", emoji: "🪨", rarity: "common", attack: 7, defense: 12 },
            { id: 5, name: "Wind Wisp", emoji: "💨", rarity: "common", attack: 11, defense: 7 },
            { id: 6, name: "Snow Flake", emoji: "❄️", rarity: "common", attack: 8, defense: 9 },
            { id: 7, name: "Spark", emoji: "⚡", rarity: "common", attack: 12, defense: 6 },
            { id: 8, name: "Mushroom", emoji: "🍄", rarity: "common", attack: 6, defense: 11 },
            // Rare
            { id: 9, name: "Phoenix Jr", emoji: "🐦‍🔥", rarity: "rare", attack: 18, defense: 14 },
            { id: 10, name: "Sea Serpent", emoji: "🐍", rarity: "rare", attack: 16, defense: 16 },
            { id: 11, name: "Forest Guardian", emoji: "🌲", rarity: "rare", attack: 14, defense: 18 },
            { id: 12, name: "Crystal Mage", emoji: "🔮", rarity: "rare", attack: 20, defense: 12 },
            { id: 13, name: "Shadow Cat", emoji: "🐈‍⬛", rarity: "rare", attack: 17, defense: 15 },
            { id: 14, name: "Star Dancer", emoji: "⭐", rarity: "rare", attack: 15, defense: 17 },
            // Epic
            { id: 15, name: "Dragon Whelp", emoji: "🐉", rarity: "epic", attack: 28, defense: 22 },
            { id: 16, name: "Unicorn", emoji: "🦄", rarity: "epic", attack: 24, defense: 26 },
            { id: 17, name: "Demon Lord", emoji: "👿", rarity: "epic", attack: 30, defense: 20 },
            { id: 18, name: "Angel", emoji: "😇", rarity: "epic", attack: 22, defense: 28 },
            { id: 19, name: "Kraken", emoji: "🦑", rarity: "epic", attack: 26, defense: 24 },
            // Legendary
            { id: 20, name: "Ancient Dragon", emoji: "🐲", rarity: "legendary", attack: 45, defense: 40 },
            { id: 21, name: "God of Thunder", emoji: "⚡", rarity: "legendary", attack: 50, defense: 35 },
            { id: 22, name: "World Tree", emoji: "🌳", rarity: "legendary", attack: 35, defense: 50 },
            { id: 23, name: "Cosmic Entity", emoji: "🌌", rarity: "legendary", attack: 42, defense: 43 },
            { id: 24, name: "Time Keeper", emoji: "⏳", rarity: "legendary", attack: 40, defense: 45 },
        ];

        const boxes = [
            { id: "small", name: "Small Box", emoji: "📦", cards: 3, goldPrice: 100, gemsPrice: 10, guaranteedRare: false },
            { id: "medium", name: "Medium Box", emoji: "🎁", cards: 5, goldPrice: 250, gemsPrice: 25, guaranteedRare: true },
            { id: "large", name: "Large Box", emoji: "🎀", cards: 8, goldPrice: 500, gemsPrice: 50, guaranteedRare: true, guaranteedEpic: true },
            { id: "mega", name: "Mega Box", emoji: "👑", cards: 12, goldPrice: 1000, gemsPrice: 100, guaranteedRare: true, guaranteedEpic: true, guaranteedLegendary: true },
        ];

        // Player Data
        let playerData = {
            gold: 999999999,
            gems: 999999999,
            collection: {}, // { cardId: { count: X, level: Y } }
            battlesWon: 0,
            boxesOpened: 0
        };

        // Load/Save
        function loadGame() {
            const saved = localStorage.getItem('cardCollector');
            if (saved) {
                playerData = JSON.parse(saved);
            }
            updateUI();
        }

        function saveGame() {
            localStorage.setItem('cardCollector', JSON.stringify(playerData));
        }

        // UI Updates
        function updateUI() {
            document.getElementById('goldAmount').textContent = formatNumber(playerData.gold);
            document.getElementById('gemsAmount').textContent = formatNumber(playerData.gems);
            updateCollection();
            updateShop();
            updateBattleSelect();
            updateStats();
        }

        function formatNumber(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Currency
        function addGold() {
            playerData.gold += 10000;
            saveGame();
            updateUI();
        }

        function addGems() {
            playerData.gems += 1000;
            saveGame();
            updateUI();
        }

        // Collection
        function updateCollection() {
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = '';

            allCards.forEach(card => {
                const owned = playerData.collection[card.id];
                const cardEl = createCardElement(card, owned);
                cardEl.onclick = () => showCardModal(card);
                grid.appendChild(cardEl);
            });
        }

        function createCardElement(card, owned, size = 'normal') {
            const div = document.createElement('div');
            div.className = `card ${card.rarity} ${!owned ? 'locked' : ''}`;
            
            const level = owned ? owned.level : 1;
            const count = owned ? owned.count : 0;
            const neededForUpgrade = getUpgradeRequirement(level);
            const progress = owned ? (count / neededForUpgrade) * 100 : 0;

            const attack = Math.floor(card.attack * (1 + (level - 1) * 0.2));
            const defense = Math.floor(card.defense * (1 + (level - 1) * 0.2));

            div.innerHTML = `
                <div class="card-inner">
                    <div class="card-image">${card.emoji}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-stats">
                        <span>⚔️ ${attack}</span>
                        <span>🛡️ ${defense}</span>
                    </div>
                </div>
                ${owned ? `<div class="card-level">Lv.${level}</div>` : ''}
                ${owned ? `<div class="card-count">x${count}</div>` : ''}
                ${owned ? `<div class="upgrade-bar"><div class="upgrade-progress" style="width: ${Math.min(progress, 100)}%"></div></div>` : ''}
            `;

            return div;
        }

        function getUpgradeRequirement(level) {
            return level * 5;
        }

        // Shop
        function updateShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';

            boxes.forEach(box => {
                const div = document.createElement('div');
                div.className = `box ${box.id}`;
                div.onclick = () => openBox(box);

                let guarantee = '';
                if (box.guaranteedLegendary) guarantee = '✨ Guaranteed Legendary!';
                else if (box.guaranteedEpic) guarantee = '💜 Guaranteed Epic!';
                else if (box.guaranteedRare) guarantee = '💙 Guaranteed Rare!';

                div.innerHTML = `
                    <div class="box-icon">${box.emoji}</div>
                    <div class="box-name">${box.name}</div>
                    <div class="box-info">${box.cards} cards ${guarantee ? '<br>' + guarantee : ''}</div>
                    <div class="box-price">
                        <span class="price-tag gold">💰 ${box.goldPrice}</span>
                        <span class="price-tag gems">💎 ${box.gemsPrice}</span>
                    </div>
                `;

                grid.appendChild(div);
            });
        }

        function openBox(box) {
            if (playerData.gold < box.goldPrice && playerData.gems < box.gemsPrice) {
                alert('Not enough currency!');
                return;
            }

            // Use gold first
            if (playerData.gold >= box.goldPrice) {
                playerData.gold -= box.goldPrice;
            } else {
                playerData.gems -= box.gemsPrice;
            }

            playerData.boxesOpened++;

            // Generate cards
            const cards = generateBoxCards(box);
            
            // Show opening animation
            showBoxOpening(cards);

            // Add cards to collection
            cards.forEach(card => {
                if (!playerData.collection[card.id]) {
                    playerData.collection[card.id] = { count: 0, level: 1 };
                }
                playerData.collection[card.id].count++;
            });

            saveGame();
            updateUI();
        }

        function generateBoxCards(box) {
            const cards = [];
            const rarityChances = {
                common: 0.6,
                rare: 0.25,
                epic: 0.12,
                legendary: 0.03
            };

            for (let i = 0; i < box.cards; i++) {
                let rarity;
                
                // Check guarantees
                if (i === 0 && box.guaranteedLegendary) {
                    rarity = 'legendary';
                } else if (i === (box.guaranteedLegendary ? 1 : 0) && box.guaranteedEpic) {
                    rarity = 'epic';
                } else if (i === (box.guaranteedLegendary ? 2 : box.guaranteedEpic ? 1 : 0) && box.guaranteedRare) {
                    rarity = 'rare';
                } else {
                    const rand = Math.random();
                    if (rand < rarityChances.legendary) rarity = 'legendary';
                    else if (rand < rarityChances.legendary + rarityChances.epic) rarity = 'epic';
                    else if (rand < rarityChances.legendary + rarityChances.epic + rarityChances.rare) rarity = 'rare';
                    else rarity = 'common';
                }

                const possibleCards = allCards.filter(c => c.rarity === rarity);
                const card = possibleCards[Math.floor(Math.random() * possibleCards.length)];
                cards.push(card);
            }

            return cards;
        }

        function showBoxOpening(cards) {
            const overlay = document.getElementById('boxOverlay');
            const openingBox = document.getElementById('openingBox');
            const revealedCards = document.getElementById('revealedCards');

            overlay.classList.add('active');
            openingBox.style.display = 'block';
            revealedCards.innerHTML = '';

            setTimeout(() => {
                openingBox.style.display = 'none';
                
                cards.forEach((card, i) => {
                    setTimeout(() => {
                        const cardEl = createCardElement(card, { count: 1, level: 1 });
                        cardEl.classList.add('revealed-card');
                        cardEl.style.animationDelay = `${i * 0.1}s`;
                        cardEl.style.width = '150px';
                        revealedCards.appendChild(cardEl);
                    }, i * 200);
                });
            }, 1500);
        }

        function closeBoxOverlay() {
            document.getElementById('boxOverlay').classList.remove('active');
        }

        // Battle
        function updateBattleSelect() {
            const select = document.getElementById('cardSelect');
            select.innerHTML = '<option value="">Select a card...</option>';

            Object.keys(playerData.collection).forEach(cardId => {
                const card = allCards.find(c => c.id == cardId);
                if (card) {
                    const level = playerData.collection[cardId].level;
                    const option = document.createElement('option');
                    option.value = cardId;
                    option.textContent = `${card.emoji} ${card.name} (Lv.${level})`;
                    select.appendChild(option);
                }
            });

            select.onchange = () => {
                const cardId = select.value;
                const playerCardDiv = document.getElementById('playerCard');
                
                if (cardId) {
                    const card = allCards.find(c => c.id == cardId);
                    const owned = playerData.collection[cardId];
                    playerCardDiv.innerHTML = '';
                    const cardEl = createCardElement(card, owned);
                    cardEl.style.width = '150px';
                    playerCardDiv.appendChild(cardEl);
                } else {
                    playerCardDiv.innerHTML = '';
                }

                // Generate random enemy
                generateEnemy();
            };
        }

        function generateEnemy() {
            const rarities = ['common', 'common', 'common', 'rare', 'rare', 'epic'];
            const rarity = rarities[Math.floor(Math.random() * rarities.length)];
            const possibleCards = allCards.filter(c => c.rarity === rarity);
            const enemy = possibleCards[Math.floor(Math.random() * possibleCards.length)];
            
            const level = Math.floor(Math.random() * 5) + 1;
            
            const enemyCardDiv = document.getElementById('enemyCard');
            enemyCardDiv.innerHTML = '';
            const cardEl = createCardElement(enemy, { count: 1, level: level });
            cardEl.style.width = '150px';
            cardEl.dataset.cardId = enemy.id;
            cardEl.dataset.level = level;
            enemyCardDiv.appendChild(cardEl);
        }

        function startBattle() {
            const select = document.getElementById('cardSelect');
            const cardId = select.value;
            
            if (!cardId) {
                alert('Select a card first!');
                return;
            }

            const playerCard = allCards.find(c => c.id == cardId);
            const playerLevel = playerData.collection[cardId].level;
            const playerAttack = Math.floor(playerCard.attack * (1 + (playerLevel - 1) * 0.2));
            const playerDefense = Math.floor(playerCard.defense * (1 + (playerLevel - 1) * 0.2));
            const playerPower = playerAttack + playerDefense;

            const enemyCardDiv = document.getElementById('enemyCard').querySelector('.card');
            const enemyId = enemyCardDiv.dataset.cardId;
            const enemyLevel = parseInt(enemyCardDiv.dataset.level);
            const enemyCard = allCards.find(c => c.id == enemyId);
            const enemyAttack = Math.floor(enemyCard.attack * (1 + (enemyLevel - 1) * 0.2));
            const enemyDefense = Math.floor(enemyCard.defense * (1 + (enemyLevel - 1) * 0.2));
            const enemyPower = enemyAttack + enemyDefense;

            const result = document.getElementById('battleResult');
            
            // Add some randomness
            const playerRoll = playerPower + Math.random() * 20;
            const enemyRoll = enemyPower + Math.random() * 20;

            if (playerRoll > enemyRoll) {
                const goldReward = Math.floor(50 + Math.random() * 100);
                const gemsReward = Math.floor(5 + Math.random() * 10);
                
                playerData.gold += goldReward;
                playerData.gems += gemsReward;
                playerData.battlesWon++;
                
                result.className = 'battle-result win';
                result.textContent = `🎉 Victory! +${goldReward} 💰 +${gemsReward} 💎`;
            } else {
                result.className = 'battle-result lose';
                result.textContent = '💔 Defeat! Try again!';
            }

            saveGame();
            updateUI();
            
            // Generate new enemy
            setTimeout(generateEnemy, 1500);
        }

        // Card Modal
        let selectedCard = null;

        function showCardModal(card) {
            selectedCard = card;
            const modal = document.getElementById('cardModal');
            const modalCardDiv = document.getElementById('modalCard');
            const owned = playerData.collection[card.id];

            modalCardDiv.innerHTML = '';
            const cardEl = createCardElement(card, owned);
            cardEl.style.width = '200px';
            modalCardDiv.appendChild(cardEl);

            document.getElementById('modalCardName').textContent = card.name;
            
            const level = owned ? owned.level : 1;
            const attack = Math.floor(card.attack * (1 + (level - 1) * 0.2));
            const defense = Math.floor(card.defense * (1 + (level - 1) * 0.2));
            document.getElementById('modalCardStats').textContent = `⚔️ Attack: ${attack} | 🛡️ Defense: ${defense}`;

            const count = owned ? owned.count : 0;
            const needed = getUpgradeRequirement(level);
            document.getElementById('modalCardCount').textContent = owned ? `Cards: ${count}/${needed} for upgrade` : 'Not owned yet';

            const upgradeBtn = document.getElementById('upgradeBtn');
            upgradeBtn.disabled = !owned || count < needed;

            modal.classList.add('active');
        }

        function closeCardModal() {
            document.getElementById('cardModal').classList.remove('active');
            selectedCard = null;
        }

        function upgradeCard() {
            if (!selectedCard) return;
            
            const owned = playerData.collection[selectedCard.id];
            const needed = getUpgradeRequirement(owned.level);

            if (owned.count >= needed) {
                owned.count -= needed;
                owned.level++;
                saveGame();
                updateUI();
                showCardModal(selectedCard);
            }
        }

        // Stats
        function updateStats() {
            const totalCards = Object.keys(playerData.collection).length;
            const legendaryCount = Object.keys(playerData.collection).filter(id => {
                const card = allCards.find(c => c.id == id);
                return card && card.rarity === 'legendary';
            }).length;

            document.getElementById('totalCards').textContent = totalCards;
            document.getElementById('legendaryCount').textContent = legendaryCount;
            document.getElementById('battlesWon').textContent = playerData.battlesWon;
            document.getElementById('boxesOpened').textContent = playerData.boxesOpened;
        }

        // Navigation
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');

            if (sectionId === 'battle') {
                generateEnemy();
            }
        }

        // Initialize
        loadGame();
    </script>
</body>
</html>
