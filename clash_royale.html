<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Royale Clone - Portfolio</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .navbar {
            width: 100%;
            padding: 1rem 2rem;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            z-index: 1000;
            height: 60px;
        }

        .nav-brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-container {
            margin-top: 60px;
            position: relative;
            width: 100%;
            height: calc(100% - 60px);
            display: flex;
            justify-content: center;
            background: #2c3e50;
        }

        canvas {
            background-color: #4caf50; /* Grass */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .elixir-bar-container {
            width: 100%;
            max-width: 500px;
            height: 20px;
            background: #333;
            margin: 0 auto;
            border: 2px solid #000;
            position: relative;
            pointer-events: auto;
        }

        .elixir-fill {
            height: 100%;
            background: #d0f;
            width: 0%;
            transition: width 0.1s linear;
        }

        .elixir-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .card-hand {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            pointer-events: auto;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .card {
            width: 70px;
            height: 90px;
            background: #fff;
            border-radius: 5px;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            user-select: none;
            color: #000;
        }

        .card.selected {
            transform: translateY(-15px);
            border-color: #ffeb3b;
            box-shadow: 0 0 10px #ffeb3b;
        }

        .card.disabled {
            filter: grayscale(1);
            opacity: 0.7;
        }

        .card-cost {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 20px;
            height: 20px;
            background: #d0f;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #fff;
        }

        .card-img {
            font-size: 30px;
        }

        .card-name {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 2px solid #f1c40f;
            text-align: center;
            border-radius: 10px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            min-width: 280px;
        }

        .btn {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #1a5276;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .message-overlay {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        @media (min-width: 600px) {
            .game-container {
                align-items: center;
            }
            canvas {
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <i class="fas fa-arrow-left"></i> <span data-i18n="backToHome">Back</span>
        </a>
        <div style="font-weight: bold; color: #f1c40f;">CLASH ROYALE CLONE</div>
    </nav>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="message-overlay" id="messageOverlay"></div>
            
            <div style="width: 100%; max-width: 500px; margin: 0 auto;">
                <div class="elixir-bar-container">
                    <div class="elixir-fill" id="elixirFill"></div>
                    <div class="elixir-text"><span id="elixirValue">0</span>/10</div>
                </div>
                <div class="card-hand" id="cardHand">
                    <!-- Cards generated by JS -->
                </div>
            </div>
        </div>

        <div id="startScreen">
            <h1 style="color: #f1c40f; margin: 0 0 10px 0;">ROYALE BATTLE</h1>
            <p>Destroy the enemy King Tower!</p>
            <button class="btn" id="startBtn">BATTLE!</button>
        </div>

        <div id="gameOverScreen" style="display: none;">
            <h1 id="winnerText" style="color: #f1c40f;">VICTORY!</h1>
            <button class="btn" id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // --- Game Constants ---
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 700;
        const FPS = 60;
        const ELIXIR_RATE = 0.35; // Elixir per second (approx 2.8s for 1 elixir)
        
        // Teams
        const TEAM_PLAYER = 0;
        const TEAM_ENEMY = 1;

        // Colors
        const COLOR_PLAYER = '#3498db';
        const COLOR_ENEMY = '#e74c3c';

        // Unit Types
        const UNIT_TYPES = {
            KNIGHT: { name: 'Knight', cost: 3, hp: 600, dmg: 75, speed: 1.5, range: 30, attackSpeed: 60, icon: '⚔️', type: 'ground', count: 1 },
            ARCHER: { name: 'Archers', cost: 3, hp: 150, dmg: 40, speed: 1.5, range: 150, attackSpeed: 50, icon: '🏹', type: 'ground', count: 2 },
            GIANT: { name: 'Giant', cost: 5, hp: 2000, dmg: 120, speed: 1.0, range: 30, attackSpeed: 90, icon: '🦍', type: 'building_target', count: 1 },
            SKELETONS: { name: 'Skeletons', cost: 1, hp: 40, dmg: 30, speed: 2.0, range: 20, attackSpeed: 40, icon: '💀', type: 'ground', count: 3 },
            FIREBALL: { name: 'Fireball', cost: 4, type: 'spell', dmg: 300, radius: 80, icon: '🔥' }
        };

        // --- Game State ---
        let canvas, ctx;
        let scale = 1;
        let gameLoopId;
        let lastTime = 0;
        let isGameOver = false;
        
        let entities = [];
        let projectiles = [];
        let particles = [];
        
        let playerElixir = 5;
        let enemyElixir = 5;
        
        let playerHand = [];
        let nextCard = null;
        let selectedCardIdx = -1;

        let towers = [];

        // --- Initialization ---
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Input
            canvas.addEventListener('mousedown', handleInputStart);
            canvas.addEventListener('touchstart', handleInputStart, {passive: false});

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);

            initCards();
        };

        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            let w = container.clientWidth;
            let h = container.clientHeight;
            
            // Maintain aspect ratio
            if (w / h > GAME_WIDTH / GAME_HEIGHT) {
                w = h * (GAME_WIDTH / GAME_HEIGHT);
            } else {
                h = w * (GAME_HEIGHT / GAME_WIDTH);
            }
            
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            
            scale = w / GAME_WIDTH;
        }

        function initCards() {
            const deck = ['KNIGHT', 'ARCHER', 'GIANT', 'SKELETONS', 'FIREBALL'];
            playerHand = deck.slice(0, 4);
            nextCard = deck[4];
            renderHand();
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            
            entities = [];
            projectiles = [];
            particles = [];
            towers = [];
            
            playerElixir = 5;
            enemyElixir = 5;
            isGameOver = false;
            selectedCardIdx = -1;

            // Create Towers
            // Player Towers (Bottom)
            towers.push(createTower(GAME_WIDTH/2, GAME_HEIGHT - 60, TEAM_PLAYER, 'KING'));
            towers.push(createTower(60, GAME_HEIGHT - 120, TEAM_PLAYER, 'PRINCESS'));
            towers.push(createTower(GAME_WIDTH - 60, GAME_HEIGHT - 120, TEAM_PLAYER, 'PRINCESS'));

            // Enemy Towers (Top)
            towers.push(createTower(GAME_WIDTH/2, 60, TEAM_ENEMY, 'KING'));
            towers.push(createTower(60, 120, TEAM_ENEMY, 'PRINCESS'));
            towers.push(createTower(GAME_WIDTH - 60, 120, TEAM_ENEMY, 'PRINCESS'));

            lastTime = performance.now();
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoop(lastTime);
        }

        function createTower(x, y, team, type) {
            return {
                x: x, y: y, team: team, type: type,
                hp: type === 'KING' ? 2400 : 1400,
                maxHp: type === 'KING' ? 2400 : 1400,
                range: 180,
                dmg: 50,
                attackSpeed: 45, // frames
                cooldown: 0,
                radius: 25,
                isBuilding: true
            };
        }

        function createUnit(typeKey, x, y, team) {
            const stats = UNIT_TYPES[typeKey];
            return {
                x: x, y: y, team: team,
                hp: stats.hp, maxHp: stats.hp,
                dmg: stats.dmg,
                speed: stats.speed,
                range: stats.range,
                attackSpeed: stats.attackSpeed,
                cooldown: 0,
                radius: 10,
                targetType: stats.type, // 'ground' or 'building_target'
                icon: stats.icon,
                state: 'move', // move, attack
                target: null,
                pushX: 0, pushY: 0 // collision push
            };
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if (isGameOver) return;
            
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            draw();

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // Elixir
            if (playerElixir < 10) playerElixir += ELIXIR_RATE * dt * 2; // Speed up a bit
            if (enemyElixir < 10) enemyElixir += ELIXIR_RATE * dt * 2;
            
            updateUI();

            // AI Logic
            updateAI();

            // Update Towers
            towers.forEach(t => {
                if (t.hp <= 0) return;
                if (t.cooldown > 0) t.cooldown--;
                
                // Find target
                let target = findTarget(t, entities.filter(e => e.team !== t.team));
                if (target && t.cooldown <= 0) {
                    // Shoot
                    projectiles.push({
                        x: t.x, y: t.y,
                        target: target,
                        speed: 5,
                        dmg: t.dmg,
                        team: t.team,
                        type: 'arrow'
                    });
                    t.cooldown = t.attackSpeed;
                }
            });

            // Update Units
            entities.forEach(u => {
                if (u.hp <= 0) return;
                
                // Collision Push
                u.x += u.pushX;
                u.y += u.pushY;
                u.pushX *= 0.8;
                u.pushY *= 0.8;

                // Keep in bounds
                if (u.x < 10) u.x = 10;
                if (u.x > GAME_WIDTH - 10) u.x = GAME_WIDTH - 10;

                // Logic
                if (u.cooldown > 0) u.cooldown--;

                // Find targets (Units + Towers)
                let enemies = entities.filter(e => e.team !== u.team && e.hp > 0);
                let enemyTowers = towers.filter(t => t.team !== u.team && t.hp > 0);
                let allTargets = [...enemies, ...enemyTowers];

                // Filter for building targeters
                if (u.targetType === 'building_target') {
                    allTargets = enemyTowers;
                    // If no buildings, attack units? Usually Giants ignore units.
                    // Let's keep it simple: Giants only attack buildings.
                }

                let target = findTarget(u, allTargets);
                
                if (target) {
                    let dist = Math.hypot(target.x - u.x, target.y - u.y);
                    if (dist <= u.range + target.radius) {
                        // Attack
                        if (u.cooldown <= 0) {
                            if (u.range > 40) {
                                // Ranged projectile
                                projectiles.push({
                                    x: u.x, y: u.y,
                                    target: target,
                                    speed: 5,
                                    dmg: u.dmg,
                                    team: u.team,
                                    type: 'arrow'
                                });
                            } else {
                                // Melee hit
                                target.hp -= u.dmg;
                                createHitEffect(target.x, target.y);
                            }
                            u.cooldown = u.attackSpeed;
                        }
                    } else {
                        // Move towards target
                        let angle = Math.atan2(target.y - u.y, target.x - u.x);
                        u.x += Math.cos(angle) * u.speed;
                        u.y += Math.sin(angle) * u.speed;
                    }
                } else {
                    // Move towards enemy king tower default
                    let defaultTargetY = u.team === TEAM_PLAYER ? 60 : GAME_HEIGHT - 60;
                    let defaultTargetX = u.x < GAME_WIDTH/2 ? 60 : GAME_WIDTH - 60; // Go via bridge
                    
                    // If past bridge, go to king
                    if (u.team === TEAM_PLAYER && u.y < GAME_HEIGHT/2) defaultTargetX = GAME_WIDTH/2;
                    if (u.team === TEAM_ENEMY && u.y > GAME_HEIGHT/2) defaultTargetX = GAME_WIDTH/2;

                    let angle = Math.atan2(defaultTargetY - u.y, defaultTargetX - u.x);
                    u.x += Math.cos(angle) * u.speed;
                    u.y += Math.sin(angle) * u.speed;
                }

                // Unit Collision (Separation)
                entities.forEach(other => {
                    if (u === other || other.hp <= 0) return;
                    let dx = u.x - other.x;
                    let dy = u.y - other.y;
                    let d = Math.hypot(dx, dy);
                    let minDist = u.radius + other.radius;
                    if (d < minDist) {
                        let force = (minDist - d) / 2;
                        let angle = Math.atan2(dy, dx);
                        u.pushX += Math.cos(angle) * force * 0.1;
                        u.pushY += Math.sin(angle) * force * 0.1;
                    }
                });
            });

            // Update Projectiles
            projectiles.forEach(p => {
                if (!p.active && p.active !== undefined) return; // inactive
                
                let dx = p.target.x - p.x;
                let dy = p.target.y - p.y;
                let dist = Math.hypot(dx, dy);
                
                if (dist < p.speed) {
                    // Hit
                    p.target.hp -= p.dmg;
                    createHitEffect(p.target.x, p.target.y);
                    p.active = false;
                } else {
                    let angle = Math.atan2(dy, dx);
                    p.x += Math.cos(angle) * p.speed;
                    p.y += Math.sin(angle) * p.speed;
                }
            });
            projectiles = projectiles.filter(p => p.active !== false && p.target.hp > 0);

            // Cleanup Dead
            entities = entities.filter(e => e.hp > 0);
            
            // Check Win
            let playerKing = towers.find(t => t.team === TEAM_PLAYER && t.type === 'KING');
            let enemyKing = towers.find(t => t.team === TEAM_ENEMY && t.type === 'KING');
            
            if (!playerKing || playerKing.hp <= 0) endGame(TEAM_ENEMY);
            else if (!enemyKing || enemyKing.hp <= 0) endGame(TEAM_PLAYER);
        }

        function findTarget(source, targets) {
            let closest = null;
            let minD = Infinity;
            targets.forEach(t => {
                let d = Math.hypot(t.x - source.x, t.y - source.y);
                if (d < minD) {
                    minD = d;
                    closest = t;
                }
            });
            // Only target if within aggro range (or infinite for towers)
            if (source.isBuilding) {
                if (minD <= source.range) return closest;
            } else {
                if (minD <= 200) return closest; // Unit aggro range
            }
            return closest; // Or return closest anyway for movement?
        }

        function updateAI() {
            // Simple AI: Wait for elixir, spawn random unit at random bridge
            if (enemyElixir > 4) {
                if (Math.random() < 0.02) {
                    const units = ['KNIGHT', 'ARCHER', 'GIANT', 'SKELETONS'];
                    const unitKey = units[Math.floor(Math.random() * units.length)];
                    const cost = UNIT_TYPES[unitKey].cost;
                    
                    if (enemyElixir >= cost) {
                        enemyElixir -= cost;
                        // Spawn near bridge
                        let x = Math.random() < 0.5 ? 80 : GAME_WIDTH - 80;
                        let y = 250; // Enemy side
                        spawnUnit(unitKey, x, y, TEAM_ENEMY);
                    }
                }
            }
        }

        function spawnUnit(key, x, y, team) {
            const type = UNIT_TYPES[key];
            if (type.type === 'spell') {
                // Fireball logic
                createExplosion(x, y, 80);
                // Damage area
                [...entities, ...towers].forEach(e => {
                    if (e.team !== team) {
                        let d = Math.hypot(e.x - x, e.y - y);
                        if (d < type.radius) {
                            e.hp -= type.dmg;
                        }
                    }
                });
            } else {
                // Spawn units
                for(let i=0; i<type.count; i++) {
                    let ox = (Math.random() - 0.5) * 20;
                    let oy = (Math.random() - 0.5) * 20;
                    entities.push(createUnit(key, x + ox, y + oy, team));
                }
            }
        }

        function createHitEffect(x, y) {
            // Simple particle
        }

        function createExplosion(x, y, radius) {
            // Visual only
        }

        function endGame(winner) {
            isGameOver = true;
            const text = winner === TEAM_PLAYER ? "VICTORY!" : "DEFEAT!";
            document.getElementById('winnerText').textContent = text;
            document.getElementById('winnerText').style.color = winner === TEAM_PLAYER ? "#f1c40f" : "#e74c3c";
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        // --- Rendering ---
        function draw() {
            // Background (Grass)
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // River
            ctx.fillStyle = '#3498db';
            ctx.fillRect(0, GAME_HEIGHT/2 - 20, GAME_WIDTH, 40);

            // Bridges
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(40, GAME_HEIGHT/2 - 25, 60, 50);
            ctx.fillRect(GAME_WIDTH - 100, GAME_HEIGHT/2 - 25, 60, 50);

            // Towers
            towers.forEach(t => {
                if (t.hp <= 0) return;
                ctx.fillStyle = t.team === TEAM_PLAYER ? COLOR_PLAYER : COLOR_ENEMY;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // HP Bar
                drawHealthBar(t.x, t.y - 35, t.hp, t.maxHp, 40);
            });

            // Units
            entities.forEach(u => {
                ctx.fillStyle = u.team === TEAM_PLAYER ? COLOR_PLAYER : COLOR_ENEMY;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(u.x, u.y + 5, u.radius, u.radius * 0.6, 0, 0, Math.PI*2);
                ctx.fill();

                // Body
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(u.icon, u.x, u.y);

                // HP Bar
                drawHealthBar(u.x, u.y - 15, u.hp, u.maxHp, 20);
            });

            // Projectiles
            projectiles.forEach(p => {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function drawHealthBar(x, y, hp, maxHp, width) {
            const pct = Math.max(0, hp / maxHp);
            ctx.fillStyle = '#333';
            ctx.fillRect(x - width/2, y, width, 4);
            ctx.fillStyle = pct > 0.5 ? '#2ecc71' : '#e74c3c';
            ctx.fillRect(x - width/2, y, width * pct, 4);
        }

        // --- UI & Input ---
        function updateUI() {
            document.getElementById('elixirValue').textContent = Math.floor(playerElixir);
            document.getElementById('elixirFill').style.width = (playerElixir * 10) + '%';
            
            // Update card availability
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, idx) => {
                const key = playerHand[idx];
                const cost = UNIT_TYPES[key].cost;
                if (playerElixir < cost) {
                    card.classList.add('disabled');
                } else {
                    card.classList.remove('disabled');
                }
            });
        }

        function renderHand() {
            const container = document.getElementById('cardHand');
            container.innerHTML = '';
            playerHand.forEach((key, idx) => {
                const type = UNIT_TYPES[key];
                const el = document.createElement('div');
                el.className = 'card';
                if (idx === selectedCardIdx) el.classList.add('selected');
                el.innerHTML = `
                    <div class="card-cost">${type.cost}</div>
                    <div class="card-img">${type.icon}</div>
                    <div class="card-name">${type.name}</div>
                `;
                el.onclick = () => selectCard(idx);
                container.appendChild(el);
            });
        }

        function selectCard(idx) {
            if (selectedCardIdx === idx) {
                selectedCardIdx = -1; // Deselect
            } else {
                selectedCardIdx = idx;
            }
            renderHand();
        }

        function handleInputStart(e) {
            if (isGameOver) return;
            if (selectedCardIdx === -1) return;

            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Scale coordinates
            let x = (clientX - rect.left) * (GAME_WIDTH / rect.width);
            let y = (clientY - rect.top) * (GAME_HEIGHT / rect.height);

            const cardKey = playerHand[selectedCardIdx];
            const typeDef = UNIT_TYPES[cardKey];

            // Check valid placement (Player side only, unless spell)
            if (y < GAME_HEIGHT / 2 && typeDef.type !== 'spell') {
                showMessage("Cannot deploy on enemy side!");
                return;
            }

            const cost = typeDef.cost;

            if (playerElixir >= cost) {
                playerElixir -= cost;
                spawnUnit(cardKey, x, y, TEAM_PLAYER);
                
                // Cycle card
                playerHand[selectedCardIdx] = nextCard;
                // Simple random next card
                const deck = ['KNIGHT', 'ARCHER', 'GIANT', 'SKELETONS', 'FIREBALL'];
                nextCard = deck[Math.floor(Math.random() * deck.length)];
                
                selectedCardIdx = -1;
                renderHand();
            } else {
                showMessage("Not enough Elixir!");
            }
        }

        function showMessage(msg) {
            const el = document.getElementById('messageOverlay');
            el.textContent = msg;
            el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 1000);
        }
    </script>
</body>
</html>
