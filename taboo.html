<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Taboo — Word Guessing Game — Luca Gandolfi's Portfolio">
    <meta name="keywords" content="taboo, game, word guessing, party game">
    <meta name="author" content="Luca Gandolfi">
    <title>Taboo — Luca Gandolfi</title>
    
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff0088, #aa00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-subtitle {
            color: #a0c0e0;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .card-display {
            background: white;
            color: #333;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .target-word {
            font-size: 2.5rem;
            font-weight: 800;
            color: #aa00ff;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .taboo-words {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .taboo-word {
            font-size: 1.5rem;
            color: #555;
            margin: 10px 0;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn-game {
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
            font-size: 1.1rem;
        }

        .btn-skip {
            background: #444;
            color: white;
        }

        .btn-correct {
            background: #00ff88;
            color: #004422;
        }

        .timer {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 20px;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        
        .team-score {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .game-select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00d4ff;
            background: rgba(0, 20, 40, 0.8);
            color: white;
            font-size: 1rem;
            margin: 0 10px;
            cursor: pointer;
        }
        
        .settings-panel {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="side-nav" id="sideNav">
        <!-- ... (Standard Nav) ... -->
    </nav>

    <div class="container">
        <div class="game-container">
            <h1 class="game-title">Taboo</h1>
            <p class="game-subtitle">Don't say the forbidden words!</p>

            <div class="settings-panel">
                <select id="languageSelect" class="game-select">
                    <option value="en">English</option>
                    <option value="it">Italiano</option>
                </select>
                <select id="difficultySelect" class="game-select">
                    <option value="easy">Easy / Facile</option>
                    <option value="medium" selected>Medium / Medio</option>
                    <option value="hard">Hard / Difficile</option>
                </select>
            </div>

            <div class="score-board">
                <div class="team-score">Team A: <span id="scoreA">0</span></div>
                <div class="timer" id="timer">60</div>
                <div class="team-score">Team B: <span id="scoreB">0</span></div>
            </div>

            <div class="card-display" id="cardDisplay">
                <div class="target-word">APPLE</div>
                <ul class="taboo-words">
                    <li class="taboo-word">FRUIT</li>
                    <li class="taboo-word">RED</li>
                    <li class="taboo-word">PIE</li>
                    <li class="taboo-word">CIDER</li>
                    <li class="taboo-word">TREE</li>
                </ul>
            </div>

            <div class="controls">
                <button class="btn-game btn-skip" onclick="skipCard()">SKIP</button>
                <button class="btn-game btn-correct" onclick="correctGuess()">CORRECT</button>
            </div>
            
            <div style="margin-top: 30px;">
                <button class="btn btn-primary" onclick="startGame()">Start Game</button>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2025 Luca Gandolfi. Built with passion and technology.</p>
        </div>
    </div>

    <script>
        let allCardsData = {};
        let currentDeck = [];
        let scoreA = 0;
        let scoreB = 0;
        let currentTeam = 'A';
        let timeLeft = 60;
        let timerInterval;
        let gameActive = false;

        // Load cards on startup
        async function loadCardsData() {
            try {
                const response = await fetch('./assets/games/taboo_cards.json');
                allCardsData = await response.json();
                console.log("Cards loaded successfully");
            } catch (error) {
                console.error("Failed to load cards", error);
                document.querySelector('.target-word').innerText = "ERROR";
                document.querySelector('.taboo-words').innerHTML = "<li class='taboo-word'>Failed to load cards</li>";
            }
        }
        
        loadCardsData();

        function startGame() {
            if (gameActive) return;
            
            const lang = document.getElementById('languageSelect').value;
            const diff = document.getElementById('difficultySelect').value;
            
            if (!allCardsData[lang] || !allCardsData[lang][diff]) {
                alert("No cards available for this selection! / Nessuna carta disponibile per questa selezione!");
                return;
            }
            
            // Initialize deck for this session
            // We clone it so we can remove cards as they are played
            currentDeck = [...allCardsData[lang][diff]];
            
            if (currentDeck.length === 0) {
                alert("Deck is empty!");
                return;
            }

            // Reset for new turn if needed, or just start timer
            if (timeLeft <= 0) timeLeft = 60;
            
            gameActive = true;
            document.getElementById('timer').innerText = timeLeft;
            
            loadNewCard();
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endTurn();
                }
            }, 1000);
        }

        function endTurn() {
            clearInterval(timerInterval);
            gameActive = false;
            alert(`Time's up! Team ${currentTeam} scored. Next team get ready!`);
            currentTeam = currentTeam === 'A' ? 'B' : 'A';
            timeLeft = 60;
            document.getElementById('timer').innerText = timeLeft;
            document.querySelector('.target-word').innerText = "NEXT TEAM";
            document.querySelector('.taboo-words').innerHTML = "<li class='taboo-word'>Press Start</li>";
        }

        function loadNewCard() {
            if (currentDeck.length === 0) {
                alert("No more cards in this deck! Reshuffling...");
                const lang = document.getElementById('languageSelect').value;
                const diff = document.getElementById('difficultySelect').value;
                currentDeck = [...allCardsData[lang][diff]];
            }
            
            const randomIndex = Math.floor(Math.random() * currentDeck.length);
            const card = currentDeck[randomIndex];
            
            // Remove card from deck to avoid repetition in this session
            currentDeck.splice(randomIndex, 1);
            
            const cardDisplay = document.getElementById('cardDisplay');
            cardDisplay.innerHTML = `
                <div class="target-word">${card.word}</div>
                <ul class="taboo-words">
                    ${card.taboo.map(word => `<li class="taboo-word">${word}</li>`).join('')}
                </ul>
            `;
        }

        function skipCard() {
            if (!gameActive) return;
            // Penalty logic could be added here (e.g. scoreA--)
            loadNewCard();
        }

        function correctGuess() {
            if (!gameActive) return;
            
            if(currentTeam === 'A') scoreA++;
            else scoreB++;
            
            updateScores();
            loadNewCard();
        }

        function updateScores() {
            document.getElementById('scoreA').innerText = scoreA;
            document.getElementById('scoreB').innerText = scoreB;
        }
    </script>
</body>
</html>
