<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondo del Tè - Cozy Tea Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Palatino', serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f5e6d3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(139, 115, 85, 0.15);
            padding: 60px 40px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #8b7355;
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a89080;
            font-size: 1.2em;
            margin-bottom: 50px;
            font-style: italic;
        }

        .tea-emoji {
            font-size: 5em;
            margin-bottom: 30px;
            animation: steam 2s ease-in-out infinite;
        }

        @keyframes steam {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .menu-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .menu-btn {
            background: linear-gradient(135deg, #d4c5b9 0%, #b8a08d 100%);
            color: white;
            border: none;
            padding: 30px 50px;
            font-size: 1.3em;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(139, 115, 85, 0.2);
            font-family: 'Georgia', serif;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(139, 115, 85, 0.3);
        }

        .menu-btn .icon {
            display: block;
            font-size: 2em;
            margin-bottom: 10px;
        }

        /* Quiz Styles */
        .quiz-container,
        .game-container {
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question {
            margin: 40px 0;
        }

        .question h2 {
            color: #8b7355;
            font-size: 2em;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .option-btn {
            background: #f5e6d3;
            border: 3px solid transparent;
            padding: 25px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            color: #8b7355;
        }

        .option-btn:hover {
            background: #e6d7c3;
            border-color: #b8a08d;
            transform: scale(1.05);
        }

        .option-btn.selected {
            background: #d4c5b9;
            border-color: #8b7355;
            transform: scale(1.05);
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #f5e6d3;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #b8a08d, #8b7355);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .result-card {
            background: linear-gradient(135deg, #f5e6d3 0%, #e6d7c3 100%);
            padding: 40px;
            border-radius: 20px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(139, 115, 85, 0.2);
        }

        .result-card h2 {
            color: #8b7355;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .result-card .tea-icon {
            font-size: 5em;
            margin: 20px 0;
        }

        .result-card p {
            color: #a89080;
            font-size: 1.2em;
            line-height: 1.8;
            margin: 15px 0;
        }

        /* Game Styles */
        .game-stage {
            margin: 40px 0;
        }

        .thermometer {
            width: 60px;
            height: 300px;
            background: #f5e6d3;
            border-radius: 30px;
            margin: 30px auto;
            position: relative;
            border: 3px solid #b8a08d;
            overflow: hidden;
        }

        .mercury {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #ff6b6b, #ffa500);
            border-radius: 30px;
            transition: height 0.1s linear;
        }

        .temperature-display {
            font-size: 3em;
            color: #8b7355;
            margin: 20px 0;
            font-weight: bold;
        }

        .teacup {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            position: relative;
        }

        .cup {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 30%, #d4c5b9 30%);
            border-radius: 0 0 50px 50px;
            border: 5px solid #8b7355;
            border-top: none;
            position: relative;
            overflow: hidden;
        }

        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(139, 115, 85, 0.3);
            transition: all 0.3s ease;
        }

        .teabag {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 60px;
            background: #8b7355;
            border-radius: 10px;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .teabag.brewing {
            top: 50px;
            opacity: 1;
        }

        .teabag::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: #654321;
        }

        .score-display {
            font-size: 2em;
            color: #8b7355;
            margin: 20px 0;
            padding: 20px;
            background: #f5e6d3;
            border-radius: 15px;
        }

        .back-btn,
        .next-btn,
        .action-btn,
        .share-btn {
            background: #8b7355;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }

        .back-btn:hover,
        .next-btn:hover,
        .action-btn:hover,
        .share-btn:hover {
            background: #6d5d4a;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(139, 115, 85, 0.3);
        }

        .next-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .tea-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .tea-type {
            background: #f5e6d3;
            padding: 30px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .tea-type:hover {
            background: #e6d7c3;
            transform: scale(1.05);
        }

        .tea-type.selected {
            border-color: #8b7355;
            background: #d4c5b9;
        }

        .tea-type .emoji {
            font-size: 3em;
            display: block;
            margin-bottom: 10px;
        }

        .timer-bar {
            width: 100%;
            height: 30px;
            background: #f5e6d3;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid #b8a08d;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b7355, #b8a08d);
            transition: width 0.1s linear;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .menu-btn {
                padding: 25px 35px;
                font-size: 1.1em;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Menu -->
        <div id="mainMenu" class="main-menu">
            <div class="tea-emoji">🍵</div>
            <h1>Mondo del Tè</h1>
            <p class="subtitle">Un'esperienza cozy e rilassante</p>
            
            <div class="menu-buttons">
                <button class="menu-btn" onclick="startQuiz()">
                    <span class="icon">🎭</span>
                    Che Tè sei oggi?
                </button>
                <button class="menu-btn" onclick="startGame()">
                    <span class="icon">🎮</span>
                    Perfect Steep
                </button>
            </div>
        </div>

        <!-- Quiz Section -->
        <div id="quizContainer" class="quiz-container">
            <button class="back-btn" onclick="backToMenu()">← Menu</button>
            <h1>Che Tè sei oggi?</h1>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="quizContent"></div>
        </div>

        <!-- Game Section -->
        <div id="gameContainer" class="game-container">
            <button class="back-btn" onclick="backToMenu()">← Menu</button>
            <h1>Perfect Steep</h1>
            <div id="gameContent"></div>
        </div>
    </div>

    <script>
        // Quiz Data
        const quizQuestions = [
            {
                question: "Com'è il tuo risveglio?",
                emoji: "🌅",
                options: [
                    { text: "Energico e pronto", value: "energetic" },
                    { text: "Calmo e graduale", value: "calm" },
                    { text: "Creativo e ispirato", value: "creative" },
                    { text: "Riflessivo e contemplativo", value: "thoughtful" }
                ]
            },
            {
                question: "Qual è il tuo clima ideale?",
                emoji: "🌤️",
                options: [
                    { text: "Soleggiato e caldo", value: "warm" },
                    { text: "Fresco e ventilato", value: "fresh" },
                    { text: "Piovoso e accogliente", value: "cozy" },
                    { text: "Nevoso e sereno", value: "serene" }
                ]
            },
            {
                question: "Come passi il tempo libero?",
                emoji: "⏰",
                options: [
                    { text: "Sport e movimento", value: "active" },
                    { text: "Lettura e studio", value: "intellectual" },
                    { text: "Arte e musica", value: "artistic" },
                    { text: "Meditazione e relax", value: "peaceful" }
                ]
            },
            {
                question: "Qual è il tuo ambiente preferito?",
                emoji: "🏡",
                options: [
                    { text: "Città vivace", value: "urban" },
                    { text: "Giardino fiorito", value: "natural" },
                    { text: "Biblioteca silenziosa", value: "quiet" },
                    { text: "Caffè accogliente", value: "social" }
                ]
            },
            {
                question: "Cosa cerchi in un momento di pausa?",
                emoji: "☕",
                options: [
                    { text: "Energia immediata", value: "boost" },
                    { text: "Relax profondo", value: "relaxation" },
                    { text: "Ispirazione", value: "inspiration" },
                    { text: "Equilibrio interiore", value: "balance" }
                ]
            }
        ];

        const teaResults = {
            matcha: {
                name: "Matcha",
                emoji: "🍵",
                description: "Sei energico, vibrante e sempre pronto per nuove avventure. Come il matcha, porti energia positiva ovunque vai.",
                traits: ["Energetico", "Ottimista", "Attivo"]
            },
            earl_grey: {
                name: "Earl Grey",
                emoji: "🫖",
                description: "Sei sofisticato, riflessivo e ami le cose raffinate. Come l'Earl Grey, hai un carattere distinto e memorabile.",
                traits: ["Sofisticato", "Intellettuale", "Elegante"]
            },
            chamomile: {
                name: "Camomilla",
                emoji: "🌼",
                description: "Sei calmo, pacifico e porti serenità a chi ti circonda. Come la camomilla, hai un effetto rilassante naturale.",
                traits: ["Pacifico", "Empatico", "Rassicurante"]
            },
            mint: {
                name: "Tè alla Menta",
                emoji: "🌿",
                description: "Sei fresco, vivace e rinfrescante. Come il tè alla menta, porti una ventata d'aria fresca nella vita degli altri.",
                traits: ["Fresco", "Vivace", "Rinfrescante"]
            },
            jasmine: {
                name: "Tè al Gelsomino",
                emoji: "🌸",
                description: "Sei creativo, delicato e pieno di grazia. Come il tè al gelsomino, hai un'anima artistica e un tocco gentile.",
                traits: ["Creativo", "Artistico", "Delicato"]
            },
            oolong: {
                name: "Oolong",
                emoji: "🍂",
                description: "Sei equilibrato, versatile e profondo. Come l'oolong, hai molte sfaccettature che si rivelano gradualmente.",
                traits: ["Equilibrato", "Complesso", "Armonioso"]
            }
        };

        // Quiz State
        let currentQuestion = 0;
        let answers = [];

        function startQuiz() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'block';
            currentQuestion = 0;
            answers = [];
            showQuestion();
        }

        function showQuestion() {
            const question = quizQuestions[currentQuestion];
            const progress = ((currentQuestion + 1) / quizQuestions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            const content = `
                <div class="question">
                    <div style="font-size: 4em; margin-bottom: 20px;">${question.emoji}</div>
                    <h2>${question.question}</h2>
                    <div class="options">
                        ${question.options.map((opt, idx) => `
                            <button class="option-btn" onclick="selectAnswer('${opt.value}', ${idx})">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>
                    ${currentQuestion < quizQuestions.length - 1 ? 'Prossima →' : 'Vedi Risultato 🎉'}
                </button>
            `;
            document.getElementById('quizContent').innerHTML = content;
        }

        function selectAnswer(value, idx) {
            answers[currentQuestion] = value;
            
            // Visual feedback
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, i) => {
                btn.classList.remove('selected');
                if (i === idx) btn.classList.add('selected');
            });
            
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < quizQuestions.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                showResult();
            }
        }

        function calculateResult() {
            const valueCount = {};
            answers.forEach(answer => {
                valueCount[answer] = (valueCount[answer] || 0) + 1;
            });

            // Mapping logic
            if (valueCount.energetic >= 2 || valueCount.boost >= 1) return teaResults.matcha;
            if (valueCount.intellectual >= 2 || valueCount.thoughtful >= 2) return teaResults.earl_grey;
            if (valueCount.peaceful >= 2 || valueCount.relaxation >= 1) return teaResults.chamomile;
            if (valueCount.fresh >= 2 || valueCount.active >= 1) return teaResults.mint;
            if (valueCount.artistic >= 2 || valueCount.creative >= 2) return teaResults.jasmine;
            return teaResults.oolong;
        }

        function showResult() {
            const result = calculateResult();
            const content = `
                <div class="result-card" id="resultCard">
                    <h2>Sei un</h2>
                    <div class="tea-icon">${result.emoji}</div>
                    <h2>${result.name}</h2>
                    <p>${result.description}</p>
                    <div style="margin-top: 30px;">
                        <strong style="color: #8b7355;">Le tue caratteristiche:</strong><br>
                        ${result.traits.map(trait => `<span style="display: inline-block; background: #f5e6d3; padding: 8px 15px; margin: 5px; border-radius: 20px;">${trait}</span>`).join('')}
                    </div>
                </div>
                <button class="share-btn" onclick="shareResult('${result.name}', '${result.emoji}')">
                    📤 Condividi il risultato
                </button>
                <button class="back-btn" onclick="backToMenu()">← Torna al Menu</button>
            `;
            document.getElementById('quizContent').innerHTML = content;
        }

        function shareResult(teaName, emoji) {
            const text = `Ho scoperto che sono un ${teaName} ${emoji}! Scopri che tè sei su Mondo del Tè!`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Il mio risultato - Mondo del Tè',
                    text: text
                }).catch(err => console.log('Sharing canceled'));
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(text).then(() => {
                    alert('Risultato copiato! Incollalo dove preferisci 📋');
                });
            }
        }

        // Game Logic
        const teaTypes = [
            { name: "Tè Verde", emoji: "🍵", temp: 80, time: 3000, color: "#90c878" },
            { name: "Tè Nero", emoji: "🫖", temp: 95, time: 5000, color: "#654321" },
            { name: "Tè Bianco", emoji: "☕", temp: 70, time: 4000, color: "#f5deb3" },
            { name: "Oolong", emoji: "🍂", temp: 85, time: 4500, color: "#d2691e" }
        ];

        let selectedTea = null;
        let gameStage = 'select'; // select, heat, steep, result
        let currentTemp = 20;
        let heating = false;
        let steepStartTime = 0;
        let steepTimer = null;

        function startGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
            gameStage = 'select';
            showTeaSelection();
        }

        function showTeaSelection() {
            const content = `
                <div class="game-stage">
                    <h2 style="color: #8b7355; margin-bottom: 30px;">Scegli il tuo tè</h2>
                    <div class="tea-selection">
                        ${teaTypes.map((tea, idx) => `
                            <div class="tea-type" onclick="selectTea(${idx})">
                                <span class="emoji">${tea.emoji}</span>
                                <strong>${tea.name}</strong><br>
                                <small>${tea.temp}°C</small>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('gameContent').innerHTML = content;
        }

        function selectTea(idx) {
            selectedTea = teaTypes[idx];
            document.querySelectorAll('.tea-type').forEach((el, i) => {
                el.classList.remove('selected');
                if (i === idx) el.classList.add('selected');
            });
            
            setTimeout(() => {
                gameStage = 'heat';
                showHeatingStage();
            }, 500);
        }

        function showHeatingStage() {
            const content = `
                <div class="game-stage">
                    <h2 style="color: #8b7355;">Fase 1: Riscalda l'acqua</h2>
                    <p style="color: #a89080; margin: 20px 0;">
                        Temperatura obiettivo: <strong>${selectedTea.temp}°C</strong><br>
                        Clicca ripetutamente per riscaldare!
                    </p>
                    <div class="thermometer">
                        <div class="mercury" id="mercury"></div>
                    </div>
                    <div class="temperature-display" id="tempDisplay">20°C</div>
                    <button class="action-btn" id="heatBtn" onclick="heat()">
                        🔥 Riscalda
                    </button>
                    <button class="action-btn" id="stopBtn" onclick="stopHeating()" style="display: none;">
                        🛑 Stop! Temperatura Giusta
                    </button>
                </div>
            `;
            document.getElementById('gameContent').innerHTML = content;
            currentTemp = 20;
            heating = false;
        }

        function heat() {
            heating = true;
            document.getElementById('stopBtn').style.display = 'inline-block';
            
            const interval = setInterval(() => {
                if (!heating) {
                    clearInterval(interval);
                    return;
                }
                
                currentTemp += Math.random() * 3 + 1;
                if (currentTemp > 100) currentTemp = 100;
                
                const mercuryHeight = (currentTemp / 100) * 100;
                document.getElementById('mercury').style.height = mercuryHeight + '%';
                document.getElementById('tempDisplay').textContent = Math.round(currentTemp) + '°C';
                
                if (currentTemp >= 100) {
                    clearInterval(interval);
                    heating = false;
                }
            }, 100);
        }

        function stopHeating() {
            heating = false;
            
            const diff = Math.abs(currentTemp - selectedTea.temp);
            let feedback = '';
            let canContinue = true;
            
            if (diff <= 3) {
                feedback = '🎯 Perfetto! Temperatura ideale!';
            } else if (diff <= 8) {
                feedback = '👍 Bene! Temperatura accettabile.';
            } else {
                feedback = '😅 Temperatura non ottimale, ma proviamo lo stesso!';
                canContinue = true; // Let them continue anyway
            }
            
            setTimeout(() => {
                alert(feedback);
                if (canContinue) {
                    gameStage = 'steep';
                    showSteepingStage();
                }
            }, 300);
        }

        function showSteepingStage() {
            const content = `
                <div class="game-stage">
                    <h2 style="color: #8b7355;">Fase 2: Infusione</h2>
                    <p style="color: #a89080; margin: 20px 0;">
                        Tempo ideale: <strong>${selectedTea.time / 1000}s</strong><br>
                        Clicca per iniziare l'infusione!
                    </p>
                    <div class="teacup">
                        <div class="cup">
                            <div class="water" id="water"></div>
                        </div>
                        <div class="teabag" id="teabag"></div>
                    </div>
                    <div class="timer-bar">
                        <div class="timer-fill" id="timerFill"></div>
                    </div>
                    <button class="action-btn" id="startSteepBtn" onclick="startSteep()">
                        🫖 Inizia Infusione
                    </button>
                    <button class="action-btn" id="extractBtn" onclick="extractTeabag()" style="display: none;">
                        ✋ Estrai Bustina
                    </button>
                </div>
            `;
            document.getElementById('gameContent').innerHTML = content;
        }

        function startSteep() {
            document.getElementById('startSteepBtn').style.display = 'none';
            document.getElementById('extractBtn').style.display = 'inline-block';
            document.getElementById('teabag').classList.add('brewing');
            
            steepStartTime = Date.now();
            let duration = 0;
            
            steepTimer = setInterval(() => {
                duration = Date.now() - steepStartTime;
                const percentage = Math.min((duration / (selectedTea.time * 1.5)) * 100, 100);
                
                // Update timer bar
                document.getElementById('timerFill').style.width = percentage + '%';
                
                // Update water color
                const waterOpacity = Math.min(duration / selectedTea.time, 1);
                document.getElementById('water').style.height = '70%';
                document.getElementById('water').style.background = selectedTea.color;
                document.getElementById('water').style.opacity = waterOpacity;
            }, 50);
        }

        function extractTeabag() {
            clearInterval(steepTimer);
            const steepDuration = Date.now() - steepStartTime;
            const diff = Math.abs(steepDuration - selectedTea.time);
            
            let score = 100;
            let rating = '';
            
            if (diff <= 500) {
                rating = '🌟 Gran Maestro del Tè!';
                score = 100;
            } else if (diff <= 1000) {
                rating = '🎯 Eccellente!';
                score = 90;
            } else if (diff <= 2000) {
                rating = '👍 Molto Bene!';
                score = 75;
            } else if (diff <= 3000) {
                rating = '😊 Buono!';
                score = 60;
            } else {
                rating = '😅 Ci vuole pratica!';
                score = 40;
            }
            
            showGameResult(rating, score, steepDuration);
        }

        function showGameResult(rating, score, duration) {
            const content = `
                <div class="game-stage">
                    <div class="result-card">
                        <h2>${rating}</h2>
                        <div class="tea-icon">${selectedTea.emoji}</div>
                        <div class="score-display">
                            Punteggio: ${score}/100
                        </div>
                        <p style="color: #a89080; font-size: 1.1em;">
                            <strong>Tempo di infusione:</strong> ${(duration / 1000).toFixed(1)}s<br>
                            <strong>Tempo ideale:</strong> ${selectedTea.time / 1000}s<br>
                            <strong>Temperatura:</strong> ${Math.round(currentTemp)}°C (ideale: ${selectedTea.temp}°C)
                        </p>
                    </div>
                    <button class="action-btn" onclick="startGame()">
                        🔄 Gioca Ancora
                    </button>
                    <button class="back-btn" onclick="backToMenu()">
                        ← Torna al Menu
                    </button>
                </div>
            `;
            document.getElementById('gameContent').innerHTML = content;
        }

        function backToMenu() {
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'none';
            
            // Reset states
            currentQuestion = 0;
            answers = [];
            selectedTea = null;
            gameStage = 'select';
            if (steepTimer) clearInterval(steepTimer);
        }
    </script>
</body>
</html>
