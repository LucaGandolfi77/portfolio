<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mobile Air Hockey</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1724;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.5);
            --opponent: #ff4d4d;
            --opponent-glow: rgba(255, 77, 77, 0.5);
            --text-main: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            color: var(--text-main);
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #1a2940 0%, #07101b 100%);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .back-btn {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            z-index: 1000;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .center-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-50%);
            pointer-events: none;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .goal {
            position: absolute;
            width: 140px;
            height: 8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .goal.top {
            top: 0;
            background: var(--opponent);
        }

        .goal.bottom {
            bottom: 0;
            background: var(--accent);
        }

        .score {
            position: absolute;
            font-size: 4rem;
            font-weight: 800;
            color: rgba(255,255,255,0.1);
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .score.top {
            top: 25%;
            transform: translate(-50%, -50%) rotate(180deg);
        }

        .score.bottom {
            bottom: 25%;
            transform: translate(-50%, 50%);
        }

        .instructions {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <a href="index.html#games" class="back-btn">← Back</a>
        <canvas id="gameCanvas"></canvas>
        <div class="center-line"></div>
        <div class="center-circle"></div>
        <div class="goal top"></div>
        <div class="goal bottom"></div>
        <div class="score top" id="topScore">0</div>
        <div class="score bottom" id="bottomScore">0</div>
        <div class="instructions">Touch & Drag to play</div>
        <div style="position: absolute; top: 20px; right: 20px; z-index: 1000;">
            <select id="gameMode" style="padding: 5px; border-radius: 5px; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2);">
                <option value="pvp">PvP (2 Players)</option>
                <option value="pvc">PvC (vs Computer)</option>
            </select>
        </div>
    </div>

    <script>
        class AirHockeyGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.topScoreEl = document.getElementById('topScore');
                this.bottomScoreEl = document.getElementById('bottomScore');
                this.modeSelect = document.getElementById('gameMode');
                
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                this.modeSelect.addEventListener('change', () => this.setMode());

                this.initGame();
                this.setupControls();
                this.gameLoop();
            }

            setMode() {
                this.gameMode = this.modeSelect.value;
                this.initGame();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.width = this.canvas.width;
                this.height = this.canvas.height;
            }

            initGame() {
                this.topScore = 0;
                this.bottomScore = 0;
                this.topScoreEl.textContent = '0';
                this.bottomScoreEl.textContent = '0';
                this.gameMode = this.modeSelect.value;
                
                // Players
                this.playerRadius = 30;
                this.topPlayer = {
                    x: this.width / 2,
                    y: this.height / 4,
                    radius: this.playerRadius,
                    color: '#ff4d4d', // Red
                    glowColor: 'rgba(255, 77, 77, 0.5)',
                    vx: 0, vy: 0
                };
                
                this.bottomPlayer = {
                    x: this.width / 2,
                    y: (this.height * 3) / 4,
                    radius: this.playerRadius,
                    color: '#00d4ff', // Cyan
                    glowColor: 'rgba(0, 212, 255, 0.5)',
                    vx: 0, vy: 0
                };

                // Puck
                this.ball = {
                    x: this.width / 2,
                    y: this.height / 2,
                    vx: 0,
                    vy: 0,
                    radius: 15,
                    maxSpeed: 15,
                    friction: 0.99,
                    color: '#ffffff',
                    trail: []
                };

                // Touch tracking
                this.touches = new Map();
            }

            setupControls() {
                // Touch events
                this.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e));
                this.canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e));

                // Mouse events
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));

                this.isDragging = null;
            }

            handleTouchStart(e) {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;
                    
                    const player = this.getPlayerAt(x, y);
                    if (player) {
                        if (this.gameMode === 'pvc' && player === this.topPlayer) continue;
                        this.touches.set(touch.identifier, player);
                    }
                }
            }

            handleTouchMove(e) {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    if (this.touches.has(touch.identifier)) {
                        const rect = this.canvas.getBoundingClientRect();
                        const x = touch.clientX - rect.left;
                        const y = touch.clientY - rect.top;
                        
                        const player = this.touches.get(touch.identifier);
                        this.movePlayer(player, x, y);
                    }
                }
            }

            handleTouchEnd(e) {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    this.touches.delete(touch.identifier);
                }
            }

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const player = this.getPlayerAt(x, y);
                if (player) {
                    if (this.gameMode === 'pvc' && player === this.topPlayer) return;
                    this.isDragging = player;
                }
            }

            handleMouseMove(e) {
                if (this.isDragging) {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    this.movePlayer(this.isDragging, x, y);
                }
            }

            handleMouseUp(e) {
                this.isDragging = null;
            }

            getPlayerAt(x, y) {
                // Increase hit area slightly for better touch response
                const hitBuffer = 20;
                const distTop = Math.sqrt((x - this.topPlayer.x) ** 2 + (y - this.topPlayer.y) ** 2);
                const distBottom = Math.sqrt((x - this.bottomPlayer.x) ** 2 + (y - this.bottomPlayer.y) ** 2);
                
                if (distTop < this.topPlayer.radius + hitBuffer) {
                    return this.topPlayer;
                }
                if (distBottom < this.bottomPlayer.radius + hitBuffer) {
                    return this.bottomPlayer;
                }
                return null;
            }

            movePlayer(player, x, y) {
                // Limit movement to own half
                if (player === this.topPlayer) {
                    y = Math.max(player.radius, Math.min(y, this.height / 2 - player.radius));
                } else {
                    y = Math.max(this.height / 2 + player.radius, Math.min(y, this.height - player.radius));
                }
                
                x = Math.max(player.radius, Math.min(x, this.width - player.radius));
                
                // Calculate velocity for impact
                const dx = x - player.x;
                const dy = y - player.y;
                
                player.x = x;
                player.y = y;
                
                // Store velocity for collision physics
                player.vx = dx;
                player.vy = dy;
            }

            update() {
                if (this.gameMode === 'pvc') {
                    this.updateAI();
                }
                this.updateBall();
                this.checkCollisions();
                this.checkGoals();
            }

            updateAI() {
                const ai = this.topPlayer;
                const ball = this.ball;
                
                // Target position
                let targetX = ball.x;
                let targetY = this.height / 4; // Default defense line

                // If ball is in top half, attack
                if (ball.y < this.height / 2) {
                    targetY = ball.y;
                    // Don't go behind the ball if it's moving towards goal
                    if (ball.y < ai.y && ball.vy < 0) {
                        // Ball is behind AI moving up? Move aside or try to hit?
                        // Simple: just track x
                    }
                } else {
                    // Ball in bottom half, stay defensive
                    targetX = this.width / 2;
                    targetY = this.height / 6;
                }

                // Smooth movement
                const speed = 8; // AI Speed
                const dx = targetX - ai.x;
                const dy = targetY - ai.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) {
                    const moveX = (dx / dist) * Math.min(dist, speed);
                    const moveY = (dy / dist) * Math.min(dist, speed);
                    
                    this.movePlayer(ai, ai.x + moveX, ai.y + moveY);
                }
            }

            updateBall() {
                // Dynamic physics: Decrease friction and increase speed over time
                if (this.ball.friction < 1.0) this.ball.friction += 0.00002;
                this.ball.maxSpeed += 0.005;

                this.ball.vx *= this.ball.friction;
                this.ball.vy *= this.ball.friction;
                
                // Gradual acceleration
                if (Math.abs(this.ball.vx) > 0.1 || Math.abs(this.ball.vy) > 0.1) {
                    this.ball.vx *= 1.0005;
                    this.ball.vy *= 1.0005;
                }

                // Cap speed
                const speed = Math.sqrt(this.ball.vx**2 + this.ball.vy**2);
                if (speed > this.ball.maxSpeed) {
                    const scale = this.ball.maxSpeed / speed;
                    this.ball.vx *= scale;
                    this.ball.vy *= scale;
                }

                this.ball.x += this.ball.vx;
                this.ball.y += this.ball.vy;
                
                // Trail
                this.ball.trail.push({x: this.ball.x, y: this.ball.y});
                if (this.ball.trail.length > 15) {
                    this.ball.trail.shift();
                }
                
                // Wall bounce
                if (this.ball.x - this.ball.radius < 0 || this.ball.x + this.ball.radius > this.width) {
                    this.ball.vx *= -0.8;
                    this.ball.x = Math.max(this.ball.radius, Math.min(this.ball.x, this.width - this.ball.radius));
                }
            }

            checkCollisions() {
                [this.topPlayer, this.bottomPlayer].forEach(player => {
                    const dx = this.ball.x - player.x;
                    const dy = this.ball.y - player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < this.ball.radius + player.radius) {
                        const angle = Math.atan2(dy, dx);
                        
                        // Add player velocity to impact
                        const playerSpeed = Math.sqrt((player.vx || 0)**2 + (player.vy || 0)**2);
                        const impactForce = Math.min(playerSpeed * 0.5, 10);
                        
                        const speed = Math.min(Math.sqrt(this.ball.vx ** 2 + this.ball.vy ** 2) + 2 + impactForce, this.ball.maxSpeed);
                        
                        this.ball.vx = Math.cos(angle) * speed;
                        this.ball.vy = Math.sin(angle) * speed;
                        
                        // Push out
                        const overlap = this.ball.radius + player.radius - distance;
                        this.ball.x += Math.cos(angle) * overlap;
                        this.ball.y += Math.sin(angle) * overlap;
                    }
                });
            }

            checkGoals() {
                const goalWidth = 140;
                const goalX = this.width / 2 - goalWidth / 2;
                
                // Top Goal
                if (this.ball.y - this.ball.radius < 0 && 
                    this.ball.x > goalX && this.ball.x < goalX + goalWidth) {
                    this.bottomScore++;
                    this.bottomScoreEl.textContent = this.bottomScore;
                    this.resetBall();
                }
                
                // Bottom Goal
                if (this.ball.y + this.ball.radius > this.height && 
                    this.ball.x > goalX && this.ball.x < goalX + goalWidth) {
                    this.topScore++;
                    this.topScoreEl.textContent = this.topScore;
                    this.resetBall();
                }
                
                // Non-goal wall bounce
                if (this.ball.y - this.ball.radius < 0 || this.ball.y + this.ball.radius > this.height) {
                    this.ball.vy *= -0.8;
                    this.ball.y = Math.max(this.ball.radius, Math.min(this.ball.y, this.height - this.ball.radius));
                }
            }

            resetBall() {
                this.ball.x = this.width / 2;
                this.ball.y = this.height / 2;
                this.ball.vx = 0;
                this.ball.vy = 0;
                this.ball.trail = [];
                this.ball.friction = 0.99; // Reset friction
                this.ball.maxSpeed = 15;   // Reset max speed
                
                // Flash effect
                const flash = document.createElement('div');
                flash.style.position = 'absolute';
                flash.style.top = '0';
                flash.style.left = '0';
                flash.style.width = '100%';
                flash.style.height = '100%';
                flash.style.background = 'white';
                flash.style.opacity = '0.5';
                flash.style.pointerEvents = 'none';
                document.getElementById('gameContainer').appendChild(flash);
                
                let op = 0.5;
                const timer = setInterval(() => {
                    op -= 0.05;
                    flash.style.opacity = op;
                    if (op <= 0) {
                        clearInterval(timer);
                        flash.remove();
                    }
                }, 30);
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // Trail
                this.ctx.globalAlpha = 0.3;
                for (let i = 0; i < this.ball.trail.length; i++) {
                    const point = this.ball.trail[i];
                    const alpha = i / this.ball.trail.length;
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
                    this.ctx.beginPath();
                    this.ctx.arc(point.x, point.y, this.ball.radius * alpha, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = 1;
                
                this.drawPlayer(this.topPlayer);
                this.drawPlayer(this.bottomPlayer);
                this.drawBall();
            }

            drawPlayer(player) {
                this.ctx.save();
                this.ctx.shadowColor = player.glowColor;
                this.ctx.shadowBlur = 20;
                
                // Glow
                const gradient = this.ctx.createRadialGradient(
                    player.x, player.y, 0,
                    player.x, player.y, player.radius * 2
                );
                gradient.addColorStop(0, player.glowColor);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(player.x, player.y, player.radius * 2, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Core
                this.ctx.fillStyle = player.color;
                this.ctx.beginPath();
                this.ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Ring
                this.ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                this.ctx.lineWidth = 3;
                this.ctx.stroke();
                
                this.ctx.restore();
            }

            drawBall() {
                this.ctx.save();
                this.ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                this.ctx.shadowBlur = 15;
                
                this.ctx.fillStyle = this.ball.color;
                this.ctx.beginPath();
                this.ctx.arc(this.ball.x, this.ball.y, this.ball.radius, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.restore();
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        window.addEventListener('load', () => {
            new AirHockeyGame();
        });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
