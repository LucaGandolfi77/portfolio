<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: 'Inter', sans-serif;
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #00d4ff; font-family: 'Inter', sans-serif;
            transition: opacity 0.5s;
        }
        .progress-container {
            width: 80%; max-width: 300px; height: 4px;
            background: rgba(255,255,255,0.2);
            margin-top: 20px; border-radius: 2px; overflow: hidden;
        }
        #progress-bar {
            width: 0%; height: 100%; background: #00d4ff; transition: width 0.2s;
        }
        #controls-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            z-index: 10; padding-bottom: max(30px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex; flex-direction: column; gap: 20px;
            align-items: center;
        }
        #filters-scroll {
            display: flex; gap: 20px; overflow-x: auto; 
            padding: 10px 50%; /* Center the active item */
            width: 100%;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: x mandatory;
            align-items: center;
        }
        #filters-scroll::-webkit-scrollbar { display: none; }
        .filter-btn {
            flex-shrink: 0;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2); 
            border: 2px solid rgba(255,255,255,0.5);
            color: white; 
            font-size: 10px; 
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            scroll-snap-align: center;
            text-align: center;
            overflow: hidden;
            white-space: normal;
            line-height: 1.1;
        }
        .filter-btn.active { 
            width: 70px; height: 70px;
            background: rgba(255, 255, 255, 0.9);
            color: black; 
            border: 4px solid white; 
            font-weight: 700; 
            font-size: 12px;
            transform: translateY(-10px);
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        /* Hide the old actions bar */
        #actions-bar { display: none; }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            font-size: 14px;
        }
        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.1s;
        }
        #slider-container {
            width: 80%;
            max-width: 300px;
            margin: 0 auto 10px auto;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        #filter-slider {
            width: 100%;
            accent-color: #00d4ff;
            cursor: pointer;
        }
        .slider-label {
            color: white;
            font-size: 12px;
            min-width: 30px;
            text-align: center;
        }
        #language-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            margin: 0;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            z-index: 20;
        }
        #lang-select {
            background: transparent;
            color: white;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="loader-overlay">
        <div class="loader-text">Loading AI Libraries... <span id="time-left"></span></div>
        <div class="progress-container"><div id="progress-bar"></div></div>
    </div>

    <a href="technology.html" class="back-btn">← Back</a>
    <div id="flash"></div>
    <video id="video" playsinline style="display:none" autoplay muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="controls-container">
        <div id="slider-container">
            <span class="slider-label">-</span>
            <input type="range" id="filter-slider" min="0" max="100" value="50">
            <span class="slider-label">+</span>
        </div>
        <div id="language-container">
            <span style="color:white;font-size:12px">Language:</span>
            <select id="lang-select" onchange="updateLanguage()">
                <option value="en-US">English</option>
                <option value="it-IT">Italiano</option>
            </select>
        </div>
        <div id="filters-scroll">
            <button onclick="setFilter('normal')" id="btn-normal" class="filter-btn active">Normal</button>
            <button onclick="setFilter('bw')" id="btn-bw" class="filter-btn">B&W</button>
            <button onclick="setFilter('contrast')" id="btn-contrast" class="filter-btn">Contrast</button>
            <button onclick="setFilter('edges')" id="btn-edges" class="filter-btn">Edges</button>
            <button onclick="setFilter('objects')" id="btn-objects" class="filter-btn">Objects</button>
            <button onclick="setFilter('face')" id="btn-face" class="filter-btn">Face</button>
            <button onclick="setFilter('hands')" id="btn-hands" class="filter-btn">Hands</button>
            <button onclick="setFilter('tracker')" id="btn-tracker" class="filter-btn">AI Tracker</button>
            <button onclick="setFilter('segment')" id="btn-segment" class="filter-btn">Segment</button>
            <button onclick="setFilter('blur')" id="btn-blur" class="filter-btn">Blur</button>
            <button onclick="setFilter('pixelate')" id="btn-pixelate" class="filter-btn">Pixelate</button>
            <button onclick="setFilter('invert')" id="btn-invert" class="filter-btn">Invert</button>
            <button onclick="setFilter('sepia')" id="btn-sepia" class="filter-btn">Sepia</button>
            <button onclick="setFilter('subtitles')" id="btn-subtitles" class="filter-btn">Subtitles</button>
        </div>
        <div id="actions-bar">
            <button class="icon-btn" onclick="switchCamera()">🔄</button>
            <button id="shutter" onclick="takePhoto()" aria-label="Take Photo"></button>
            <div style="width:44px"></div> <!-- Spacer -->
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let currentFilter = 'normal';
        let animationId;
        let model = null;
        let predictions = [];
        let isModelLoading = false;
        let facingMode = 'environment';
        let trackedObject = null;
        let bodyPixNet = null;
        let currentSegmentation = null;
        const sliderContainer = document.getElementById('slider-container');
        const slider = document.getElementById('filter-slider');
        
        // Subtitles variables
        let recognition = null;
        let currentSubtitle = "";
        let subtitleStatus = "";
        let subtitleTimeout;
        const languageContainer = document.getElementById('language-container');
        const langSelect = document.getElementById('lang-select');
        
        // Gestures variables
        let lastTap = 0;
        let initialPinchDistance = null;
        let currentZoom = 1;
        let lastFilterActivationTime = 0;

        // Load Scripts with Progress
        async function loadScripts() {
            const scripts = [
                'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs', 
                'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd',
                'https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface',
                'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet',
                'https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix',
                'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js',
                'assets/js/face_tracker.js',
                'assets/js/ai_tracker.js',
                'assets/js/hand_tracker.js'
            ];
            
            const progressBar = document.getElementById('progress-bar');
            const timeLeft = document.getElementById('time-left');
            let loaded = 0;
            
            for (let i = 0; i < scripts.length; i++) {
                await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', scripts[i]);
                    xhr.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const percent = ((loaded + (e.loaded / e.total)) / scripts.length) * 100;
                            progressBar.style.width = percent + '%';
                            timeLeft.textContent = Math.round(100 - percent) + '% left';
                        }
                    };
                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            const script = document.createElement('script');
                            script.text = xhr.responseText;
                            document.body.appendChild(script);
                            loaded++;
                            progressBar.style.width = (loaded / scripts.length * 100) + '%';
                            resolve();
                        } else {
                            reject();
                        }
                    };
                    xhr.onerror = reject;
                    xhr.send();
                });
            }
            
            // Wait a bit for evaluation
            setTimeout(() => {
                document.getElementById('loader-overlay').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('loader-overlay').style.display = 'none';
                }, 500);
                // Initialize global cocoSsd variable from window
                cocoSsd = window.cocoSsd;
            }, 500);
        }

        // Initialize Camera
        async function initCamera() {
            if (animationId) cancelAnimationFrame(animationId);
            
            try {
                // Stop existing tracks
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }

                const constraints = { 
                    video: { 
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        zoom: true // Request zoom capability
                    }, 
                    audio: false 
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Check zoom capabilities
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                
                // Reset zoom
                currentZoom = 1;
                if (capabilities.zoom) {
                    // Use native zoom if available
                    try {
                        await track.applyConstraints({ advanced: [{ zoom: 1 }] });
                    } catch(e) {}
                }

                video.play();
                requestAnimationFrame(draw);
            } catch (err) {
                console.error("Error accessing camera:", err);
                // Fallback for PC if environment fails
                if (facingMode === 'environment') {
                    console.log("Retrying with default camera...");
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        video.srcObject = stream;
                        video.play();
                        requestAnimationFrame(draw);
                    } catch (e) {
                        alert("Could not access camera.");
                    }
                } else {
                    alert("Could not access camera.");
                }
            }
        }

        // Gestures
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            } else if (e.touches.length === 1) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    switchCamera();
                    e.preventDefault();
                }
                lastTap = currentTime;
            }
        });

        canvas.addEventListener('touchmove', async (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                
                const delta = dist - initialPinchDistance;
                // Sensitivity
                const zoomChange = delta * 0.01; 
                
                let newZoom = currentZoom + zoomChange;
                newZoom = Math.max(1, Math.min(newZoom, 5)); // Clamp 1x to 5x
                
                // Apply Zoom
                if (video.srcObject) {
                    const track = video.srcObject.getVideoTracks()[0];
                    const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                    
                    if (capabilities.zoom) {
                        // Native Zoom
                        const min = capabilities.zoom.min;
                        const max = capabilities.zoom.max;
                        // Map 1-5 to min-max
                        const nativeZoom = min + ((newZoom - 1) / 4) * (max - min);
                        try {
                            await track.applyConstraints({ advanced: [{ zoom: nativeZoom }] });
                            currentZoom = newZoom;
                        } catch(err) {}
                    } else {
                        // CSS/Canvas Scale Fallback (Visual only)
                        currentZoom = newZoom;
                    }
                }
                
                initialPinchDistance = dist;
            }
        });

        canvas.addEventListener('touchend', () => {
            initialPinchDistance = null;
        });

        async function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            await initCamera();
        }

        function startSubtitles() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                subtitleStatus = "Not Supported";
                alert("Speech Recognition not supported in this browser (Try Chrome on Android or Desktop).");
                return;
            }
            
            // Check for HTTPS
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                 console.warn("Speech Recognition usually requires HTTPS.");
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                
                recognition.onstart = () => {
                    subtitleStatus = "Listening...";
                };

                recognition.onresult = (event) => {
                    subtitleStatus = "Listening...";
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            currentSubtitle = event.results[i][0].transcript;
                            // Clear after 5 seconds
                            clearTimeout(subtitleTimeout);
                            subtitleTimeout = setTimeout(() => { currentSubtitle = ""; }, 5000);
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                            currentSubtitle = interimTranscript;
                        }
                    }
                };

                recognition.onerror = (event) => {
                    console.error("Speech recognition error", event.error);
                    if (event.error === 'not-allowed') {
                        subtitleStatus = "Mic Blocked";
                        alert("Microphone access denied. Please allow microphone access.");
                    } else if (event.error === 'no-speech') {
                        // ignore
                    } else {
                        subtitleStatus = "Error: " + event.error;
                    }
                };
                
                recognition.onend = () => {
                    if (currentFilter === 'subtitles') {
                        try { recognition.start(); } catch(e){ subtitleStatus = "Stopped"; }
                    } else {
                        subtitleStatus = "";
                    }
                };
            }
            
            recognition.lang = langSelect.value;
            try { 
                recognition.start(); 
                subtitleStatus = "Starting...";
            } catch(e) { 
                console.log("Already started"); 
            }
        }

        function stopSubtitles() {
            if (recognition) {
                recognition.stop();
                currentSubtitle = "";
            }
        }

        function updateLanguage() {
            if (recognition && currentFilter === 'subtitles') {
                recognition.stop(); // onend will restart it with new lang
                recognition.lang = langSelect.value;
            }
        }

        async function setFilter(filter) {
            // If clicking the already active filter, do nothing here (handled by click listener for photo)
            if (currentFilter === filter) return;

            currentFilter = filter;
            lastFilterActivationTime = Date.now();

            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${filter}`).classList.add('active');
            
            // Scroll active into view
            document.getElementById(`btn-${filter}`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            // Slider Logic
            if (['contrast', 'edges', 'blur', 'pixelate'].includes(filter)) {
                sliderContainer.style.display = 'flex';
                if (filter === 'contrast') slider.value = 50;
                if (filter === 'edges') slider.value = 50;
                if (filter === 'blur') slider.value = 20; // Default blur
                if (filter === 'pixelate') slider.value = 20; // Default pixel size
            } else {
                sliderContainer.style.display = 'none';
            }

            // Subtitles Logic
            if (filter === 'subtitles') {
                languageContainer.style.display = 'flex';
                startSubtitles();
            } else {
                languageContainer.style.display = 'none';
                stopSubtitles();
            }

            if (filter === 'objects') {
                if (!model && !isModelLoading) {
                    const btn = document.getElementById('btn-objects');
                    const originalText = btn.innerText;
                    btn.innerText = 'Loading Model...';
                    isModelLoading = true;
                    try {
                        if (!cocoSsd) cocoSsd = window.cocoSsd; // Ensure it's available
                        model = await cocoSsd.load();
                        btn.innerText = 'Objects';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else if (model) {
                    detectLoop();
                }
            } else if (filter === 'face') {
                if (!isModelLoading) {
                    const btn = document.getElementById('btn-face');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        await window.FaceTracker.load();
                        btn.innerText = 'Face';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            } else if (filter === 'hands') {
                if (!isModelLoading) {
                    const btn = document.getElementById('btn-hands');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        await window.HandTracker.load();
                        btn.innerText = 'Hands';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            } else if (filter === 'tracker') {
                if (!model && !isModelLoading) {
                    const btn = document.getElementById('btn-tracker');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        if (!cocoSsd) cocoSsd = window.cocoSsd;
                        model = await cocoSsd.load();
                        await window.AITracker.load();
                        btn.innerText = 'Click Object';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            } else if (filter === 'segment') {
                if (!bodyPixNet && !isModelLoading) {
                    const btn = document.getElementById('btn-segment');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        if (window.bodyPix) {
                            bodyPixNet = await window.bodyPix.load();
                            btn.innerText = 'Segment';
                            detectLoop();
                        } else {
                            throw new Error("BodyPix not found");
                        }
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            }
        }

        // Handle clicks for tracking
        canvas.addEventListener('click', async (e) => {
            if (currentFilter !== 'tracker' || !model) return;

            const rect = canvas.getBoundingClientRect();
            // Calculate click coordinates relative to canvas
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Handle mirroring
            if (facingMode === 'user') {
                clickX = canvas.width - clickX;
            }

            // Find object under click
            // We need fresh predictions
            const preds = await model.detect(video);
            
            const clickedObj = preds.find(p => {
                const [x, y, w, h] = p.bbox;
                return clickX >= x && clickX <= x + w &&
                       clickY >= y && clickY <= y + h;
            });

            if (clickedObj) {
                document.getElementById('btn-tracker').innerText = 'Tracking ' + clickedObj.class;
                await window.AITracker.setTarget(video, clickedObj.bbox);
            } else {
                document.getElementById('btn-tracker').innerText = 'No Object Found';
                setTimeout(() => {
                     if (window.AITracker.targetEmbedding) {
                         document.getElementById('btn-tracker').innerText = 'Tracking';
                     } else {
                         document.getElementById('btn-tracker').innerText = 'Click Object';
                     }
                }, 1000);
            }
        });

        async function detectLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if (currentFilter === 'objects' && model) {
                    try {
                        predictions = await model.detect(video);
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'objects') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'face' && window.FaceTracker) {
                    try {
                        predictions = await window.FaceTracker.detect(video);
                        if (!predictions) predictions = [];
                    } catch (e) {
                        console.error(e);
                        predictions = [];
                    }
                    if (currentFilter === 'face') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'hands' && window.HandTracker) {
                    try {
                        await window.HandTracker.detect(video);
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'hands') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'tracker' && model && window.AITracker) {
                    try {
                        // 1. Detect all objects
                        const allObjects = await model.detect(video);
                        
                        // 2. If we have a target, find it among detections
                        if (window.AITracker.targetEmbedding) {
                            trackedObject = await window.AITracker.track(video, allObjects);
                        } else {
                            // Just show all candidates so user knows what to click
                            predictions = allObjects;
                        }
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'tracker') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'segment' && bodyPixNet) {
                    try {
                        currentSegmentation = await bodyPixNet.segmentPerson(video, {
                            internalResolution: 'medium',
                            segmentationThreshold: 0.7,
                            maxDetections: 1
                        });
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'segment') {
                        requestAnimationFrame(detectLoop);
                    }
                }
            }
        }

        function draw() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Mirror if user facing
                ctx.save();
                
                // Apply Digital Zoom if native not supported
                const track = video.srcObject.getVideoTracks()[0];
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                if (!capabilities.zoom && currentZoom > 1) {
                    ctx.translate(canvas.width/2, canvas.height/2);
                    ctx.scale(currentZoom, currentZoom);
                    ctx.translate(-canvas.width/2, -canvas.height/2);
                }

                if (facingMode === 'user') {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                // Special drawing for Pixelate and Blur to avoid double draw
                if (currentFilter === 'pixelate') {
                    const val = parseInt(slider.value);
                    const size = Math.max(0.01, val / 100); // 0.01 to 1.0
                    const w = canvas.width * size;
                    const h = canvas.height * size;
                    
                    ctx.imageSmoothingEnabled = false;
                    
                    // Draw small video
                    ctx.drawImage(video, 0, 0, w, h);
                    
                    // Draw back to full canvas
                    // If mirrored, the small video is drawn at the top-right (physical coords)
                    // because of the scale(-1, 1) transform.
                    // We need to read from there.
                    let sx = 0;
                    if (facingMode === 'user') {
                        sx = canvas.width - w;
                    }
                    
                    ctx.drawImage(canvas, sx, 0, w, h, 0, 0, canvas.width, canvas.height);
                    ctx.imageSmoothingEnabled = true;
                } else if (currentFilter === 'blur') {
                    const val = parseInt(slider.value);
                    const blurPx = (val / 100) * 20; // 0 to 20px
                    ctx.filter = `blur(${blurPx}px)`;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    ctx.filter = 'none';
                } else if (currentFilter === 'segment' && currentSegmentation) {
                    // Draw video first
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Apply mask
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixelData = imageData.data;
                    const mask = currentSegmentation.data; // 0 or 1
                    
                    for (let i = 0; i < mask.length; i++) {
                        // If mask is 0 (background), make it black
                        if (mask[i] === 0) {
                            pixelData[i * 4] = 0;     // R
                            pixelData[i * 4 + 1] = 0; // G
                            pixelData[i * 4 + 2] = 0; // B
                            // Alpha remains 255
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                } else {
                    // Default draw
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                ctx.restore();
                
                if (currentFilter === 'subtitles') {
                    ctx.save();
                    // Scale font based on width
                    const fontSize = Math.max(24, Math.floor(canvas.width / 25));
                    ctx.font = `bold ${fontSize}px Inter`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    
                    const text = currentSubtitle || subtitleStatus;
                    
                    if (text) {
                        const x = canvas.width / 2;
                        const y = canvas.height - (canvas.height * 0.1);
                        const padding = fontSize / 2;
                        
                        const metrics = ctx.measureText(text);
                        const textWidth = metrics.width;
                        const textHeight = fontSize * 1.2;
                        
                        // Background
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(x - textWidth/2 - padding, y - textHeight - padding + (fontSize*0.2), textWidth + padding*2, textHeight + padding);
                        
                        // Text
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(text, x, y);
                    }
                    ctx.restore();
                }

                if (currentFilter === 'objects') {
                    ctx.font = 'bold 16px Inter';
                    ctx.lineWidth = 4;
                    predictions.forEach(prediction => {
                        let [x, y, width, height] = prediction.bbox;
                        
                        // Adjust bbox for mirrored user camera
                        if (facingMode === 'user') {
                            x = canvas.width - x - width;
                        }

                        // Box
                        ctx.strokeStyle = '#00d4ff';
                        ctx.strokeRect(x, y, width, height);
                        
                        // Label background
                        ctx.fillStyle = '#00d4ff';
                        const text = `${prediction.class} ${Math.round(prediction.score * 100)}%`;
                        const textWidth = ctx.measureText(text).width;
                        ctx.fillRect(x, y > 25 ? y - 25 : 0, textWidth + 10, 25);
                        
                        // Label text
                        ctx.fillStyle = '#000000';
                        ctx.fillText(text, x + 5, y > 25 ? y - 7 : 18);
                    });
                } else if (currentFilter === 'face') {
                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    if (window.FaceTracker) {
                        window.FaceTracker.draw(ctx, predictions);
                    }
                    ctx.restore();
                } else if (currentFilter === 'hands') {
                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    if (window.HandTracker) {
                        window.HandTracker.draw(ctx, canvas.width, canvas.height);
                    }
                    ctx.restore();
                } else if (currentFilter === 'tracker') {
                    ctx.font = 'bold 16px Inter';
                    ctx.lineWidth = 4;

                    // If tracking a specific object
                    if (window.AITracker && window.AITracker.targetEmbedding && trackedObject) {
                        let [x, y, width, height] = trackedObject.bbox;
                        
                        if (facingMode === 'user') x = canvas.width - x - width;

                        // Red Box for Tracked Object
                        ctx.strokeStyle = '#ff0000';
                        ctx.strokeRect(x, y, width, height);
                        
                        ctx.fillStyle = '#ff0000';
                        const text = `TRACKING: ${trackedObject.class}`;
                        const textWidth = ctx.measureText(text).width;
                        ctx.fillRect(x, y > 25 ? y - 25 : 0, textWidth + 10, 25);
                        
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(text, x + 5, y > 25 ? y - 7 : 18);
                    } 
                    // If waiting for selection, show candidates faintly
                    else if (!window.AITracker.targetEmbedding) {
                        predictions.forEach(prediction => {
                            let [x, y, width, height] = prediction.bbox;
                            if (facingMode === 'user') x = canvas.width - x - width;

                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.strokeRect(x, y, width, height);
                        });
                        
                        // Instruction text
                        ctx.fillStyle = 'white';
                        ctx.font = '20px Inter';
                        ctx.textAlign = 'center';
                        ctx.fillText("Tap an object to track it", canvas.width/2, canvas.height - 100);
                        ctx.textAlign = 'left';
                    }
                } else if (currentFilter !== 'normal') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    if (currentFilter === 'bw') {
                        for (let i = 0; i < data.length; i += 4) {
                            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                            data[i] = avg;     // R
                            data[i + 1] = avg; // G
                            data[i + 2] = avg; // B
                        }
                    } else if (currentFilter === 'contrast') {
                        // Map 0-100 to 0.0-5.0 (default 2.5)
                        const val = parseInt(slider.value);
                        const factor = (val / 20); 
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = factor * (data[i] - 128) + 128;
                            data[i + 1] = factor * (data[i + 1] - 128) + 128;
                            data[i + 2] = factor * (data[i + 2] - 128) + 128;
                        }
                    } else if (currentFilter === 'edges') {
                        // Simple edge detection (Sobel-like approximation for performance)
                        const width = canvas.width;
                        const height = canvas.height;
                        const input = new Uint8ClampedArray(data); // Copy input
                        
                        // Map 0-100 to threshold 100-10 (inverted)
                        const val = parseInt(slider.value);
                        const threshold = Math.max(5, 100 - val);

                        for (let y = 1; y < height - 1; y++) {
                            for (let x = 1; x < width - 1; x++) {
                                const i = (y * width + x) * 4;
                                
                                // Compare with right and bottom neighbors
                                const right = ((y * width + (x + 1)) * 4);
                                const bottom = (((y + 1) * width + x) * 4);
                                
                                const diffH = Math.abs(input[i] - input[right]);
                                const diffV = Math.abs(input[i] - input[bottom]);
                                const val = (diffH + diffV) * 2; // Amplify edges
                                
                                // Invert for black lines on white or keep white lines on black
                                // Let's do green matrix style lines
                                data[i] = 0;
                                data[i + 1] = val > threshold ? 255 : 0;
                                data[i + 2] = 0;
                            }
                        }
                    } else if (currentFilter === 'invert') {
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = 255 - data[i];
                            data[i + 1] = 255 - data[i + 1];
                            data[i + 2] = 255 - data[i + 2];
                        }
                    } else if (currentFilter === 'sepia') {
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            data[i] = (r * 0.393) + (g * 0.769) + (b * 0.189);
                            data[i + 1] = (r * 0.349) + (g * 0.686) + (b * 0.168);
                            data[i + 2] = (r * 0.272) + (g * 0.534) + (b * 0.131);
                        }
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                }
            }
            animationId = requestAnimationFrame(draw);
        }

        function takePhoto() {
            // Flash effect
            const flash = document.getElementById('flash');
            flash.style.opacity = 1;
            setTimeout(() => flash.style.opacity = 0, 100);

            // If current filter is active button, it acts as shutter
            // Save image
            const link = document.createElement('a');
            link.download = `tracker-photo-${Date.now()}.jpg`;
            // Use JPEG with 80% quality for better compression
            link.href = canvas.toDataURL('image/jpeg', 0.8);
            link.click();
        }

        // Add click listener to active filter to take photo
        document.getElementById('filters-scroll').addEventListener('click', (e) => {
            // Check if target is the active button
            const target = e.target.classList.contains('filter-btn') ? e.target : e.target.parentElement;
            
            if (target && target.classList.contains('active')) {
                // Only take photo if filter has been active for > 300ms
                if (Date.now() - lastFilterActivationTime > 300) {
                    takePhoto();
                }
            }
        });

        // Start
        loadScripts();
        initCamera();
    </script>
</body>
</html>
