<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: 'Inter', sans-serif;
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }
        #controls {
            position: absolute; 
            bottom: 30px; 
            left: 0; 
            width: 100%;
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 15px;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 10;
        }
        .filter-btn {
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255,255,255,0.3);
            color: white; 
            padding: 8px 16px; 
            border-radius: 20px;
            font-size: 14px; 
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active { 
            background: #00d4ff; 
            color: #000; 
            border-color: #00d4ff; 
            font-weight: 600;
        }
        #shutter {
            width: 70px; 
            height: 70px; 
            border-radius: 50%;
            background: white; 
            border: 4px solid rgba(255,255,255,0.3);
            padding: 0;
            cursor: pointer;
            transition: transform 0.1s;
            margin: 0 10px;
        }
        #shutter:active { 
            transform: scale(0.9); 
            background: #ddd;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            font-size: 14px;
        }
        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>
    <a href="technology.html" class="back-btn">← Back</a>
    <div id="flash"></div>
    <video id="video" playsinline style="display:none" autoplay muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="controls">
        <button onclick="setFilter('normal')" id="btn-normal" class="filter-btn active">Normal</button>
        <button onclick="setFilter('bw')" id="btn-bw" class="filter-btn">B&W</button>
        <button id="shutter" onclick="takePhoto()" aria-label="Take Photo"></button>
        <button onclick="setFilter('contrast')" id="btn-contrast" class="filter-btn">Contrast</button>
        <button onclick="setFilter('edges')" id="btn-edges" class="filter-btn">Edges</button>
        <button onclick="setFilter('objects')" id="btn-objects" class="filter-btn">Objects</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let currentFilter = 'normal';
        let animationId;
        let model = null;
        let predictions = [];
        let isModelLoading = false;

        // Initialize Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(draw);
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Could not access camera. Please ensure you have granted permission.");
            }
        }

        async function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${filter}`).classList.add('active');

            if (filter === 'objects') {
                if (!model && !isModelLoading) {
                    const btn = document.getElementById('btn-objects');
                    const originalText = btn.innerText;
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        model = await cocoSsd.load();
                        btn.innerText = 'Objects';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else if (model) {
                    detectLoop();
                }
            }
        }

        async function detectLoop() {
            if (currentFilter === 'objects' && model && video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    predictions = await model.detect(video);
                } catch (e) {
                    console.error(e);
                }
                if (currentFilter === 'objects') {
                    requestAnimationFrame(detectLoop);
                }
            }
        }

        function draw() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                if (currentFilter === 'objects') {
                    ctx.font = 'bold 16px Inter';
                    ctx.lineWidth = 4;
                    predictions.forEach(prediction => {
                        const [x, y, width, height] = prediction.bbox;
                        
                        // Box
                        ctx.strokeStyle = '#00d4ff';
                        ctx.strokeRect(x, y, width, height);
                        
                        // Label background
                        ctx.fillStyle = '#00d4ff';
                        const text = `${prediction.class} ${Math.round(prediction.score * 100)}%`;
                        const textWidth = ctx.measureText(text).width;
                        ctx.fillRect(x, y > 25 ? y - 25 : 0, textWidth + 10, 25);
                        
                        // Label text
                        ctx.fillStyle = '#000000';
                        ctx.fillText(text, x + 5, y > 25 ? y - 7 : 18);
                    });
                } else if (currentFilter !== 'normal') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    if (currentFilter === 'bw') {
                        for (let i = 0; i < data.length; i += 4) {
                            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                            data[i] = avg;     // R
                            data[i + 1] = avg; // G
                            data[i + 2] = avg; // B
                        }
                    } else if (currentFilter === 'contrast') {
                        const factor = 2.0; // Contrast factor
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = factor * (data[i] - 128) + 128;
                            data[i + 1] = factor * (data[i + 1] - 128) + 128;
                            data[i + 2] = factor * (data[i + 2] - 128) + 128;
                        }
                    } else if (currentFilter === 'edges') {
                        // Simple edge detection (Sobel-like approximation for performance)
                        const width = canvas.width;
                        const height = canvas.height;
                        const input = new Uint8ClampedArray(data); // Copy input
                        
                        for (let y = 1; y < height - 1; y++) {
                            for (let x = 1; x < width - 1; x++) {
                                const i = (y * width + x) * 4;
                                
                                // Compare with right and bottom neighbors
                                const right = ((y * width + (x + 1)) * 4);
                                const bottom = (((y + 1) * width + x) * 4);
                                
                                const diffH = Math.abs(input[i] - input[right]);
                                const diffV = Math.abs(input[i] - input[bottom]);
                                const val = (diffH + diffV) * 2; // Amplify edges
                                
                                // Invert for black lines on white or keep white lines on black
                                // Let's do green matrix style lines
                                data[i] = 0;
                                data[i + 1] = val > 50 ? 255 : 0;
                                data[i + 2] = 0;
                            }
                        }
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                }
            }
            animationId = requestAnimationFrame(draw);
        }

        function takePhoto() {
            // Flash effect
            const flash = document.getElementById('flash');
            flash.style.opacity = 1;
            setTimeout(() => flash.style.opacity = 0, 100);

            // Save image
            const link = document.createElement('a');
            link.download = `tracker-photo-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // Start
        initCamera();
    </script>
</body>
</html>
