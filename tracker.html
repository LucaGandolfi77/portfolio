<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: 'Inter', sans-serif;
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }
        #controls-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            z-index: 10; padding-bottom: max(20px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex; flex-direction: column; gap: 15px;
        }
        #filters-scroll {
            display: flex; gap: 10px; overflow-x: auto; 
            padding: 10px 20px;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE 10+ */
            justify-content: flex-start;
        }
        #filters-scroll::-webkit-scrollbar { display: none; }
        .filter-btn {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 16px; border-radius: 20px;
            font-size: 13px; backdrop-filter: blur(5px);
            white-space: nowrap; cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active { background: #00d4ff; color: #000; border-color: #00d4ff; font-weight: 600; }
        #actions-bar {
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 20px;
        }
        #shutter {
            width: 70px; height: 70px; border-radius: 50%;
            background: white; border: 4px solid rgba(255,255,255,0.3);
            cursor: pointer; transition: transform 0.1s;
        }
        #shutter:active { transform: scale(0.9); background: #ddd; }
        .icon-btn {
            background: rgba(255,255,255,0.1); border: none;
            color: white; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; backdrop-filter: blur(4px);
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            font-size: 14px;
        }
        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.1s;
        }
        #slider-container {
            width: 80%;
            max-width: 300px;
            margin: 0 auto 10px auto;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        #filter-slider {
            width: 100%;
            accent-color: #00d4ff;
            cursor: pointer;
        }
        .slider-label {
            color: white;
            font-size: 12px;
            min-width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <a href="technology.html" class="back-btn">← Back</a>
    <div id="flash"></div>
    <video id="video" playsinline style="display:none" autoplay muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="controls-container">
        <div id="slider-container">
            <span class="slider-label">-</span>
            <input type="range" id="filter-slider" min="0" max="100" value="50">
            <span class="slider-label">+</span>
        </div>
        <div id="filters-scroll">
            <button onclick="setFilter('normal')" id="btn-normal" class="filter-btn active">Normal</button>
            <button onclick="setFilter('bw')" id="btn-bw" class="filter-btn">B&W</button>
            <button onclick="setFilter('contrast')" id="btn-contrast" class="filter-btn">Contrast</button>
            <button onclick="setFilter('edges')" id="btn-edges" class="filter-btn">Edges</button>
            <button onclick="setFilter('objects')" id="btn-objects" class="filter-btn">Objects</button>
            <button onclick="setFilter('face')" id="btn-face" class="filter-btn">Face</button>
            <button onclick="setFilter('hands')" id="btn-hands" class="filter-btn">Hands</button>
            <button onclick="setFilter('tracker')" id="btn-tracker" class="filter-btn">AI Tracker</button>
            <button onclick="setFilter('segment')" id="btn-segment" class="filter-btn">Segment</button>
            <button onclick="setFilter('blur')" id="btn-blur" class="filter-btn">Blur</button>
            <button onclick="setFilter('pixelate')" id="btn-pixelate" class="filter-btn">Pixelate</button>
            <button onclick="setFilter('invert')" id="btn-invert" class="filter-btn">Invert</button>
            <button onclick="setFilter('sepia')" id="btn-sepia" class="filter-btn">Sepia</button>
        </div>
        <div id="actions-bar">
            <button class="icon-btn" onclick="switchCamera()">🔄</button>
            <button id="shutter" onclick="takePhoto()" aria-label="Take Photo"></button>
            <div style="width:44px"></div> <!-- Spacer -->
        </div>
    </div>

    <script>
        // Global Error Handler for Mobile Debugging
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = 'rgba(255,0,0,0.8)';
            div.style.color = 'white';
            div.style.padding = '10px';
            div.style.zIndex = '9999';
            div.innerText = `Error: ${msg} at line ${lineNo}`;
            document.body.appendChild(div);
            return false;
        };

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let currentFilter = 'normal';
        let animationId;
        let model = null;
        let predictions = [];
        let isModelLoading = false;
        let facingMode = 'environment';
        let trackedObject = null;
        let bodyPixNet = null;
        let currentSegmentation = null;
        let cocoSsd = null; // Explicitly declare
        const sliderContainer = document.getElementById('slider-container');
        const slider = document.getElementById('filter-slider');

        const SCRIPTS = {
            tfjs: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs',
            cocoSsd: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd',
            blazeface: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface',
            mobilenet: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet',
            bodyPix: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix',
            hands: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js',
            faceTracker: 'assets/js/face_tracker.js',
            aiTracker: 'assets/js/ai_tracker.js',
            handTracker: 'assets/js/hand_tracker.js'
        };

        const loadedScripts = new Set();

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if (loadedScripts.has(src)) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    loadedScripts.add(src);
                    resolve();
                };
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                document.body.appendChild(script);
            });
        }

        // Initialize Camera
        async function initCamera() {
            if (animationId) cancelAnimationFrame(animationId);
            
            try {
                // Stop existing tracks
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }

                const constraints = { 
                    video: { 
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: false 
                };

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Camera API not available (HTTPS required?)");
                }

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                // Ensure video plays (iOS requirement)
                video.onloadedmetadata = () => {
                    video.play().catch(e => console.error("Play error:", e));
                    requestAnimationFrame(draw);
                };
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert(`Camera Error: ${err.message}`);
                
                // Fallback for PC if environment fails
                if (facingMode === 'environment') {
                    console.log("Retrying with default camera...");
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play().catch(e => console.error("Play error:", e));
                            requestAnimationFrame(draw);
                        };
                    } catch (e) {
                        alert(`Fallback Error: ${e.message}`);
                    }
                }
            }
        }

        async function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            await initCamera();
        }

        async function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${filter}`).classList.add('active');

            // Slider Logic
            if (['contrast', 'edges', 'blur', 'pixelate'].includes(filter)) {
                sliderContainer.style.display = 'flex';
                if (filter === 'contrast') slider.value = 50;
                if (filter === 'edges') slider.value = 50;
                if (filter === 'blur') slider.value = 20; // Default blur
                if (filter === 'pixelate') slider.value = 20; // Default pixel size
            } else {
                sliderContainer.style.display = 'none';
            }

            if (filter === 'objects') {
                if (!model && !isModelLoading) {
                    const btn = document.getElementById('btn-objects');
                    const originalText = btn.innerText;
                    btn.innerText = 'Loading Model...';
                    isModelLoading = true;
                    try {
                        await loadScript(SCRIPTS.tfjs);
                        await loadScript(SCRIPTS.cocoSsd);
                        if (!cocoSsd) cocoSsd = window.cocoSsd; // Ensure it's available
                        model = await cocoSsd.load();
                        btn.innerText = 'Objects';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else if (model) {
                    detectLoop();
                }
            } else if (filter === 'face') {
                if (!isModelLoading) {
                    const btn = document.getElementById('btn-face');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        await loadScript(SCRIPTS.tfjs);
                        await loadScript(SCRIPTS.blazeface);
                        await loadScript(SCRIPTS.faceTracker);
                        await window.FaceTracker.load();
                        btn.innerText = 'Face';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            } else if (filter === 'hands') {
                if (!isModelLoading) {
                    const btn = document.getElementById('btn-hands');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        await loadScript(SCRIPTS.hands);
                        await loadScript(SCRIPTS.handTracker);
                        await window.HandTracker.load();
                        btn.innerText = 'Hands';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            } else if (filter === 'tracker') {
                if (!model && !isModelLoading) {
                    const btn = document.getElementById('btn-tracker');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        await loadScript(SCRIPTS.tfjs);
                        await loadScript(SCRIPTS.cocoSsd);
                        await loadScript(SCRIPTS.mobilenet);
                        await loadScript(SCRIPTS.aiTracker);
                        if (!cocoSsd) cocoSsd = window.cocoSsd;
                        model = await cocoSsd.load();
                        await window.AITracker.load();
                        btn.innerText = 'Click Object';
                        detectLoop();
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            } else if (filter === 'segment') {
                if (!bodyPixNet && !isModelLoading) {
                    const btn = document.getElementById('btn-segment');
                    btn.innerText = 'Loading...';
                    isModelLoading = true;
                    try {
                        await loadScript(SCRIPTS.tfjs);
                        await loadScript(SCRIPTS.bodyPix);
                        if (window.bodyPix) {
                            bodyPixNet = await window.bodyPix.load();
                            btn.innerText = 'Segment';
                            detectLoop();
                        } else {
                            throw new Error("BodyPix not found");
                        }
                    } catch (err) {
                        console.error(err);
                        btn.innerText = 'Error';
                    } finally {
                        isModelLoading = false;
                    }
                } else {
                    detectLoop();
                }
            }
        }

        // Handle clicks for tracking
        canvas.addEventListener('click', async (e) => {
            if (currentFilter !== 'tracker' || !model) return;

            const rect = canvas.getBoundingClientRect();
            // Calculate click coordinates relative to canvas
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Handle mirroring
            if (facingMode === 'user') {
                clickX = canvas.width - clickX;
            }

            // Find object under click
            // We need fresh predictions
            const preds = await model.detect(video);
            
            const clickedObj = preds.find(p => {
                const [x, y, w, h] = p.bbox;
                return clickX >= x && clickX <= x + w &&
                       clickY >= y && clickY <= y + h;
            });

            if (clickedObj) {
                document.getElementById('btn-tracker').innerText = 'Tracking ' + clickedObj.class;
                await window.AITracker.setTarget(video, clickedObj.bbox);
            } else {
                document.getElementById('btn-tracker').innerText = 'No Object Found';
                setTimeout(() => {
                     if (window.AITracker.targetEmbedding) {
                         document.getElementById('btn-tracker').innerText = 'Tracking';
                     } else {
                         document.getElementById('btn-tracker').innerText = 'Click Object';
                     }
                }, 1000);
            }
        });

        async function detectLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if (currentFilter === 'objects' && model) {
                    try {
                        predictions = await model.detect(video);
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'objects') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'face' && window.FaceTracker) {
                    try {
                        predictions = await window.FaceTracker.detect(video);
                    } catch (e) {
                        console.error(e);
                        predictions = [];
                    }
                    if (currentFilter === 'face') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'hands' && window.HandTracker) {
                    try {
                        await window.HandTracker.detect(video);
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'hands') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'tracker' && model && window.AITracker) {
                    try {
                        // 1. Detect all objects
                        const allObjects = await model.detect(video);
                        
                        // 2. If we have a target, find it among detections
                        if (window.AITracker.targetEmbedding) {
                            trackedObject = await window.AITracker.track(video, allObjects);
                        } else {
                            // Just show all candidates so user knows what to click
                            predictions = allObjects;
                        }
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'tracker') {
                        requestAnimationFrame(detectLoop);
                    }
                } else if (currentFilter === 'segment' && bodyPixNet) {
                    try {
                        currentSegmentation = await bodyPixNet.segmentPerson(video, {
                            internalResolution: 'medium',
                            segmentationThreshold: 0.7,
                            maxDetections: 1
                        });
                    } catch (e) {
                        console.error(e);
                    }
                    if (currentFilter === 'segment') {
                        requestAnimationFrame(detectLoop);
                    }
                }
            }
        }

        function draw() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Mirror if user facing
                ctx.save();
                if (facingMode === 'user') {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                // Special drawing for Pixelate and Blur to avoid double draw
                if (currentFilter === 'pixelate') {
                    const val = parseInt(slider.value);
                    const size = Math.max(0.01, val / 100); // 0.01 to 1.0
                    const w = canvas.width * size;
                    const h = canvas.height * size;
                    
                    // Temporarily disable the global transform to handle pixelation manually
                    ctx.restore();
                    ctx.save();

                    // Draw small version
                    if (facingMode === 'user') {
                        ctx.save();
                        ctx.translate(w, 0);
                        ctx.scale(-1, 1);
                        ctx.drawImage(video, 0, 0, w, h);
                        ctx.restore();
                    } else {
                        ctx.drawImage(video, 0, 0, w, h);
                    }
                    
                    // Scale up
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(canvas, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
                    ctx.imageSmoothingEnabled = true;

                    // Re-apply global transform for consistency if needed later (though we overwrote canvas)
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }

                } else if (currentFilter === 'blur') {
                    const val = parseInt(slider.value);
                    const blurPx = (val / 100) * 20; // 0 to 20px
                    ctx.filter = `blur(${blurPx}px)`;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    ctx.filter = 'none';
                } else if (currentFilter === 'segment' && currentSegmentation) {
                    // Draw video first
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Apply mask
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixelData = imageData.data;
                    const mask = currentSegmentation.data; // 0 or 1
                    const width = canvas.width;
                    
                    for (let i = 0; i < mask.length; i++) {
                        let maskIndex = i;
                        // Flip mask index if user facing
                        if (facingMode === 'user') {
                            const x = i % width;
                            const y = Math.floor(i / width);
                            maskIndex = y * width + (width - 1 - x);
                        }

                        // If mask is 0 (background), make it black
                        if (mask[maskIndex] === 0) {
                            pixelData[i * 4] = 0;     // R
                            pixelData[i * 4 + 1] = 0; // G
                            pixelData[i * 4 + 2] = 0; // B
                            // Alpha remains 255
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                } else {
                    // Default draw
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                ctx.restore();
                
                if (currentFilter === 'objects') {
                    ctx.font = 'bold 16px Inter';
                    ctx.lineWidth = 4;
                    predictions.forEach(prediction => {
                        let [x, y, width, height] = prediction.bbox;
                        
                        // Adjust bbox for mirrored user camera
                        if (facingMode === 'user') {
                            x = canvas.width - x - width;
                        }

                        // Box
                        ctx.strokeStyle = '#00d4ff';
                        ctx.strokeRect(x, y, width, height);
                        
                        // Label background
                        ctx.fillStyle = '#00d4ff';
                        const text = `${prediction.class} ${Math.round(prediction.score * 100)}%`;
                        const textWidth = ctx.measureText(text).width;
                        ctx.fillRect(x, y > 25 ? y - 25 : 0, textWidth + 10, 25);
                        
                        // Label text
                        ctx.fillStyle = '#000000';
                        ctx.fillText(text, x + 5, y > 25 ? y - 7 : 18);
                    });
                } else if (currentFilter === 'face') {
                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    if (window.FaceTracker && predictions.length > 0) {
                        window.FaceTracker.draw(ctx, predictions);
                    }
                    ctx.restore();
                } else if (currentFilter === 'hands') {
                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    if (window.HandTracker) {
                        window.HandTracker.draw(ctx, canvas.width, canvas.height);
                    }
                    ctx.restore();
                } else if (currentFilter === 'tracker') {
                    ctx.font = 'bold 16px Inter';
                    ctx.lineWidth = 4;

                    // If tracking a specific object
                    if (window.AITracker && window.AITracker.targetEmbedding && trackedObject) {
                        let [x, y, width, height] = trackedObject.bbox;
                        
                        if (facingMode === 'user') x = canvas.width - x - width;

                        // Red Box for Tracked Object
                        ctx.strokeStyle = '#ff0000';
                        ctx.strokeRect(x, y, width, height);
                        
                        ctx.fillStyle = '#ff0000';
                        const text = `TRACKING: ${trackedObject.class}`;
                        const textWidth = ctx.measureText(text).width;
                        ctx.fillRect(x, y > 25 ? y - 25 : 0, textWidth + 10, 25);
                        
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(text, x + 5, y > 25 ? y - 7 : 18);
                    } 
                    // If waiting for selection, show candidates faintly
                    else if (!window.AITracker.targetEmbedding) {
                        predictions.forEach(prediction => {
                            let [x, y, width, height] = prediction.bbox;
                            if (facingMode === 'user') x = canvas.width - x - width;

                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.strokeRect(x, y, width, height);
                        });
                        
                        // Instruction text
                        ctx.fillStyle = 'white';
                        ctx.font = '20px Inter';
                        ctx.textAlign = 'center';
                        ctx.fillText("Tap an object to track it", canvas.width/2, canvas.height - 100);
                        ctx.textAlign = 'left';
                    }
                } else if (currentFilter !== 'normal') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    if (currentFilter === 'bw') {
                        for (let i = 0; i < data.length; i += 4) {
                            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                            data[i] = avg;     // R
                            data[i + 1] = avg; // G
                            data[i + 2] = avg; // B
                        }
                    } else if (currentFilter === 'contrast') {
                        // Map 0-100 to 0.0-5.0 (default 2.5)
                        const val = parseInt(slider.value);
                        const factor = (val / 20); 
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = factor * (data[i] - 128) + 128;
                            data[i + 1] = factor * (data[i + 1] - 128) + 128;
                            data[i + 2] = factor * (data[i + 2] - 128) + 128;
                        }
                    } else if (currentFilter === 'edges') {
                        // Simple edge detection (Sobel-like approximation for performance)
                        const width = canvas.width;
                        const height = canvas.height;
                        const input = new Uint8ClampedArray(data); // Copy input
                        
                        // Map 0-100 to threshold 100-10 (inverted)
                        const val = parseInt(slider.value);
                        const threshold = Math.max(5, 100 - val);

                        for (let y = 1; y < height - 1; y++) {
                            for (let x = 1; x < width - 1; x++) {
                                const i = (y * width + x) * 4;
                                
                                // Compare with right and bottom neighbors
                                const right = ((y * width + (x + 1)) * 4);
                                const bottom = (((y + 1) * width + x) * 4);
                                
                                const diffH = Math.abs(input[i] - input[right]);
                                const diffV = Math.abs(input[i] - input[bottom]);
                                const val = (diffH + diffV) * 2; // Amplify edges
                                
                                // Invert for black lines on white or keep white lines on black
                                // Let's do green matrix style lines
                                data[i] = 0;
                                data[i + 1] = val > threshold ? 255 : 0;
                                data[i + 2] = 0;
                            }
                        }
                    } else if (currentFilter === 'invert') {
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = 255 - data[i];
                            data[i + 1] = 255 - data[i + 1];
                            data[i + 2] = 255 - data[i + 2];
                        }
                    } else if (currentFilter === 'sepia') {
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            data[i] = (r * 0.393) + (g * 0.769) + (b * 0.189);
                            data[i + 1] = (r * 0.349) + (g * 0.686) + (b * 0.168);
                            data[i + 2] = (r * 0.272) + (g * 0.534) + (b * 0.131);
                        }
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                }
            }
            animationId = requestAnimationFrame(draw);
        }

                ctx.restore();
                
                if (currentFilter === 'objects') {
                    ctx.font = 'bold 16px Inter';
                    ctx.lineWidth = 4;
                    predictions.forEach(prediction => {
                        let [x, y, width, height] = prediction.bbox;
                        
                        // Adjust bbox for mirrored user camera
                        if (facingMode === 'user') {
                            x = canvas.width - x - width;
                        }

                        // Box
                        ctx.strokeStyle = '#00d4ff';
                        ctx.strokeRect(x, y, width, height);
                        
                        // Label background
                        ctx.fillStyle = '#00d4ff';
                        const text = `${prediction.class} ${Math.round(prediction.score * 100)}%`;
                        const textWidth = ctx.measureText(text).width;
                        ctx.fillRect(x, y > 25 ? y - 25 : 0, textWidth + 10, 25);
                        
                        // Label text
                        ctx.fillStyle = '#000000';
                        ctx.fillText(text, x + 5, y > 25 ? y - 7 : 18);
                    });
                } else if (currentFilter === 'face') {
                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    if (window.FaceTracker) {
                        window.FaceTracker.draw(ctx, predictions);
                    }
                    ctx.restore();
                } else if (currentFilter === 'hands') {
                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    if (window.HandTracker) {
                        window.HandTracker.draw(ctx, canvas.width, canvas.height);
                    }
                    ctx.restore();
                } else if (currentFilter === 'tracker') {
                    ctx.font = 'bold 16px Inter';
                    ctx.lineWidth = 4;

                    // If tracking a specific object
                    if (window.AITracker && window.AITracker.targetEmbedding && trackedObject) {
                        let [x, y, width, height] = trackedObject.bbox;
                        
                        if (facingMode === 'user') x = canvas.width - x - width;

                        // Red Box for Tracked Object
                        ctx.strokeStyle = '#ff0000';
                        ctx.strokeRect(x, y, width, height);
                        
                        ctx.fillStyle = '#ff0000';
                        const text = `TRACKING: ${trackedObject.class}`;
                        const textWidth = ctx.measureText(text).width;
                        ctx.fillRect(x, y > 25 ? y - 25 : 0, textWidth + 10, 25);
                        
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(text, x + 5, y > 25 ? y - 7 : 18);
                    } 
                    // If waiting for selection, show candidates faintly
                    else if (!window.AITracker.targetEmbedding) {
                        predictions.forEach(prediction => {
                            let [x, y, width, height] = prediction.bbox;
                            if (facingMode === 'user') x = canvas.width - x - width;

                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.strokeRect(x, y, width, height);
                        });
                        
                        // Instruction text
                        ctx.fillStyle = 'white';
                        ctx.font = '20px Inter';
                        ctx.textAlign = 'center';
                        ctx.fillText("Tap an object to track it", canvas.width/2, canvas.height - 100);
                        ctx.textAlign = 'left';
                    }
                } else if (currentFilter !== 'normal') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    if (currentFilter === 'bw') {
                        for (let i = 0; i < data.length; i += 4) {
                            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                            data[i] = avg;     // R
                            data[i + 1] = avg; // G
                            data[i + 2] = avg; // B
                        }
                    } else if (currentFilter === 'contrast') {
                        // Map 0-100 to 0.0-5.0 (default 2.5)
                        const val = parseInt(slider.value);
                        const factor = (val / 20); 
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = factor * (data[i] - 128) + 128;
                            data[i + 1] = factor * (data[i + 1] - 128) + 128;
                            data[i + 2] = factor * (data[i + 2] - 128) + 128;
                        }
                    } else if (currentFilter === 'edges') {
                        // Simple edge detection (Sobel-like approximation for performance)
                        const width = canvas.width;
                        const height = canvas.height;
                        const input = new Uint8ClampedArray(data); // Copy input
                        
                        // Map 0-100 to threshold 100-10 (inverted)
                        const val = parseInt(slider.value);
                        const threshold = Math.max(5, 100 - val);

                        for (let y = 1; y < height - 1; y++) {
                            for (let x = 1; x < width - 1; x++) {
                                const i = (y * width + x) * 4;
                                
                                // Compare with right and bottom neighbors
                                const right = ((y * width + (x + 1)) * 4);
                                const bottom = (((y + 1) * width + x) * 4);
                                
                                const diffH = Math.abs(input[i] - input[right]);
                                const diffV = Math.abs(input[i] - input[bottom]);
                                const val = (diffH + diffV) * 2; // Amplify edges
                                
                                // Invert for black lines on white or keep white lines on black
                                // Let's do green matrix style lines
                                data[i] = 0;
                                data[i + 1] = val > threshold ? 255 : 0;
                                data[i + 2] = 0;
                            }
                        }
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                } else if (currentFilter === 'invert') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = 255 - data[i];
                        data[i + 1] = 255 - data[i + 1];
                        data[i + 2] = 255 - data[i + 2];
                    }
                    ctx.putImageData(imageData, 0, 0);
                } else if (currentFilter === 'sepia') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        data[i] = (r * 0.393) + (g * 0.769) + (b * 0.189);
                        data[i + 1] = (r * 0.349) + (g * 0.686) + (b * 0.168);
                        data[i + 2] = (r * 0.272) + (g * 0.534) + (b * 0.131);
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
            }
            animationId = requestAnimationFrame(draw);
        }

        function takePhoto() {
            // Flash effect
            const flash = document.getElementById('flash');
            flash.style.opacity = 1;
            setTimeout(() => flash.style.opacity = 0, 100);

            // Save image
            const link = document.createElement('a');
            link.download = `tracker-photo-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // Start
        // loadScripts(); // Removed initial loading
        initCamera();
    </script>
</body>
</html>
