<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faro Studio — Agent Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Title bar (desktop-app chrome) -->
  <header class="titlebar">
    <div class="tb-left">
      <span class="logo">⚓</span>
      <span class="tb-title">Faro Studio <span class="tb-sub">— agent dashboard</span></span>
    </div>
    <div class="tb-center">
      <nav id="tabs" class="tabs">
        <button class="tab is-active" data-view="overview">Overview</button>
        <button class="tab" data-view="projects">Projects</button>
        <button class="tab" data-view="runs">Runs</button>
        <button class="tab" data-view="models">Models</button>
        <button class="tab" data-view="agents">Agents</button>
        <button class="tab" data-view="timeline">Timeline</button>
      </nav>
    </div>
    <div class="tb-right">
      <span id="dataBadge" class="badge badge-muted" title="Data source">loading…</span>
      <span id="genAt" class="muted mono small"></span>
    </div>
  </header>

  <div class="app">
    <!-- Left: catalog rail (static nav shortcuts + mini stats) -->
    <aside class="sidebar">
      <section class="side-section">
        <h4>Studio</h4>
        <div id="kpiMini" class="kpi-mini"></div>
      </section>
      <section class="side-section">
        <h4>Shortcuts</h4>
        <div class="shortcuts" id="shortcuts"></div>
      </section>
      <section class="side-section">
        <h4>Sources</h4>
        <ul class="src-list">
          <li><a href="../tracker/index.json" target="_blank">tracker/index.json</a></li>
          <li><a href="../TRACEABILITY.md" target="_blank">TRACEABILITY.md</a></li>
          <li><a href="../tracker/README.md" target="_blank">tracker/README.md</a></li>
          <li><a href="../README.md" target="_blank">pi-agents/README.md</a></li>
        </ul>
      </section>
    </aside>

    <!-- Center: active view -->
    <main id="view" class="view"></main>

    <!-- Right: inspector (detail of selected item) -->
    <aside id="inspector" class="inspector">
      <div class="inspector-empty">
        <div class="empty-glyph">◈</div>
        <p>Select a project, run, model or agent to inspect it here.</p>
      </div>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="data/snapshot.js"></script>
  <script src="app.js"></script>
</body>
</html>
