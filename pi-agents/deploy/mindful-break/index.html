<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7b6e8c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Mindful Break — Pause. Breathe. Reset.</title>
  <link rel="icon" type="image/svg+xml" sizes="192x192" href="icons/icon-192.svg">
</head>
<body>
  <main id="app">
    <section id="welcome" aria-label="Welcome screen">
      <h1>Mindful Break</h1>
      <p>A 60-second pause. Zero data. Zero backend. Zero account.</p>
      <button id="start-btn">Start Break</button>
    </section>
    <section id="break" aria-label="Breathing screen" hidden>
      <div class="circle"></div>
      <p>Breathe in… hold… out…</p>
      <p class="timer">60s</p>
      <p class="hint">This stays on your device.</p>
    </section>
    <section id="stats" aria-label="Daily stats" hidden>
      <h2>Today's Breaks</h2>
      <p class="streak"><span id="streak">0</span> breaks</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
