<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Silent Canvas — Create in silence</title>
  <link rel="icon" type="image/svg+xml" sizes="192x192" href="icons/icon-192.svg">
</head>
<body>
  <main id="app">
    <section id="welcome" aria-label="Welcome">
      <h1>Silent Canvas</h1>
      <p>Draw only when it's quiet.</p>
      <p class="hint">Ambient noise below your threshold unlocks the canvas.</p>
      <button id="allow-mic">Allow Microphone</button>
      <button id="demo-mode">Demo Mode</button>
    </section>
    <section id="studio" aria-label="Creation studio" hidden>
      <div id="noise-bar"><div id="noise-fill"></div></div>
      <canvas id="canvas"></canvas>
      <div id="toolbar">
        <button data-color="#d4a843" class="active"></button>
        <button data-color="#e07070"></button>
        <button data-color="#6ab0d4"></button>
        <button data-color="#a0c060"></button>
        <input type="range" id="brush-size" min="2" max="20" value="6">
        <button id="clear">Clear</button>
        <button id="export">Export</button>
      </div>
    </section>
    <section id="stats" aria-label="Daily stats" hidden>
      <h2>Today's Quiet Minutes</h2>
      <p class="streak"><span id="streak">0</span> min</p>
      <button id="back">Back to Studio</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
