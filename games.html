<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Browse Luca Gandolfi's browser games, multiplayer experiments, board games, simulations, and arcade projects.">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/catalog.css">
  <style>
    :root { color-scheme: dark; --bg: #0b1220; --panel: #121e2f; --line: #29415a; --ink: #f4f7fb; --muted: #9fb3c7; --accent: #e9c46a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; }
    .shell { width: min(1120px, 100%); margin: 0 auto; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 56px; }
    .back { color: var(--muted); font-size: 14px; text-decoration: none; }
    .back:hover { color: var(--accent); }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(44px, 9vw, 82px); font-weight: 400; letter-spacing: -.045em; line-height: .9; }
    .lede { max-width: 540px; margin: 20px 0 0; color: var(--muted); line-height: 1.6; }
    .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
    .hero-actions a { padding: 10px 13px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; }
    .hero-actions a:hover { border-color: var(--accent); }
    .catalog-page section { padding: 0; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .catalog-page .catalog-card { background: rgba(18,30,47,.9); }
    @media (max-width: 600px) { body { padding: 16px; } .top { margin-bottom: 40px; } }
  </style>
  <title>Games Archive | Luca Gandolfi</title>
</head>
<body class="catalog-page">
  <main class="shell">
    <header class="top"><div><p class="eyebrow">Browser arcade / complete index</p><h1>Games</h1><p class="lede">Find a quick solo game, a local multiplayer experiment, a board game, a simulation, or a strange prototype.</p><div class="hero-actions"></div></div></header>
    <section data-catalog="games" data-site-root="" aria-labelledby="games-title">
      <h2 id="games-title" class="visually-hidden">Browse games</h2>
      <div class="catalog-toolbar">
        <div class="catalog-field"><label for="game-search">Search games</label><input class="catalog-input" id="game-search" data-catalog-search type="search" placeholder="Try cards, puzzle, multiplayer..." autocomplete="off"></div>
        <div class="catalog-field"><label for="game-sort">Sort</label><select class="catalog-select" id="game-sort" data-catalog-sort><option value="featured">Featured first</option><option value="alpha">Alphabetical</option></select></div>
        <div class="catalog-actions"><button class="catalog-action" data-catalog-favorites aria-pressed="false" type="button">Favorites only</button><button class="catalog-action" data-catalog-clear type="button">Clear filters</button></div>
      </div>
      <div class="catalog-filters" data-catalog-filters aria-label="Game categories"></div>
      <div class="catalog-status" data-catalog-status role="status" aria-live="polite"></div>
      <div class="catalog-grid" data-catalog-grid></div>
    </section>
  </main>
  <script src="assets/js/catalog-data.js"></script>
  <script src="assets/js/catalog.js"></script>
</body>
</html>
