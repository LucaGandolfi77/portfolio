<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Transcriber AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: #0a0a0a; 
            color: white; 
            font-family: 'Inter', system-ui, sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        h1 { margin: 0; font-size: 1.5rem; background: linear-gradient(45deg, #00d4ff, #00ff9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn-primary { background: #00d4ff; color: #000; border: none; font-weight: 600; }
        .btn-primary:hover { background: #33ddff; transform: translateY(-1px); }
        .btn-primary:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
        }
        .upload-area:hover { border-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .upload-area.dragover { border-color: #00ff9d; background: rgba(0, 255, 157, 0.05); }

        .file-info { margin-top: 10px; color: #00d4ff; font-size: 0.9rem; display: none; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            outline: none;
            flex: 1;
            min-width: 150px;
        }

        .result-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 300px;
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .status-bar {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #aaa;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-container {
            width: 100%;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00d4ff;
            transition: width 0.1s linear;
        }
        
        .progress-info {
            display: none;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
            width: 100%;
        }
        
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .result-area:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { background: #00d4ff; color: black; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Audio Transcriber AI</h1>
            <a href="index.html#projects" class="btn">Exit</a>
        </div>

        <div class="upload-area" id="drop-zone">
            <div style="font-size: 3rem; margin-bottom: 10px;">📁</div>
            <p>Click or Drag & Drop audio/video file here</p>
            <p style="font-size: 0.8rem; color: #666;">Supports .mp3, .wav, .ogg, .mp4, .m4a</p>
            <input type="file" id="file-input" accept="audio/*,video/*" style="display: none;">
            <div class="file-info" id="file-info"></div>
        </div>

        <div class="controls">
            <select id="model-select">
                <optgroup label="Local Models (Free, No Key Required, Runs in Browser)">
                    <option value="Xenova/whisper-tiny" selected>Whisper Tiny (Fastest, ~40MB)</option>
                    <option value="Xenova/whisper-base">Whisper Base (Balanced, ~75MB)</option>
                    <option value="Xenova/whisper-small">Whisper Small (High Quality, ~250MB)</option>
                    <option value="Xenova/whisper-medium">Whisper Medium (Very High Quality, ~1.5GB)</option>
                    <option value="Xenova/whisper-large-v3">Whisper Large v3 (Best Quality, ~3GB)</option>
                </optgroup>
                <optgroup label="Cloud Models (API Key Required, Advanced Analysis)">
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (Multimodal, Fast)</option>
                </optgroup>
            </select>
            
            <div id="api-key-section" style="display:none; width: 100%; margin-bottom: 10px;">
                <input type="password" id="api-key-input" placeholder="Enter Gemini API Key" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; box-sizing: border-box;">
                <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">Get a key at <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:#00d4ff">Google AI Studio</a></div>
            </div>

            <select id="language-select">
                <option value="italian">Italiano (Italian)</option>
                <option value="english">English</option>
                <option value="multilingual">Auto Detect / Other</option>
            </select>
            <button id="transcribe-btn" class="btn btn-primary" disabled>Start Transcription</button>
        </div>

        <div class="status-bar" id="status-bar">
            <div class="status-row">
                <div class="spinner" id="spinner"></div>
                <span id="status-text">Initializing AI model...</span>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-info" id="progress-info">
                <span id="progress-percent">0%</span>
                <span id="progress-size">0 / 0 MB</span>
            </div>
        </div>

        <div class="result-area">
            <button class="copy-btn" onclick="copyText()">Copy</button>
            <textarea id="result-text" placeholder="Transcription will appear here..." readonly></textarea>
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // Configure environment
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileInfo = document.getElementById('file-info');
        const transcribeBtn = document.getElementById('transcribe-btn');
        const statusBar = document.getElementById('status-bar');
        const statusText = document.getElementById('status-text');
        const resultText = document.getElementById('result-text');
        const spinner = document.getElementById('spinner');
        const langSelect = document.getElementById('language-select');
        const modelSelect = document.getElementById('model-select');
        const apiKeySection = document.getElementById('api-key-section');
        const apiKeyInput = document.getElementById('api-key-input');

        let transcriber = null;
        let currentModelId = null;
        let selectedFile = null;

        // Toggle API Key input
        modelSelect.addEventListener('change', () => {
            if (modelSelect.value.startsWith('gemini')) {
                apiKeySection.style.display = 'block';
                langSelect.style.display = 'none'; // Gemini handles language automatically
            } else {
                apiKeySection.style.display = 'none';
                langSelect.style.display = 'block';
            }
        });

        // Drag & Drop handlers
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            fileInfo.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            fileInfo.style.display = 'block';
            transcribeBtn.disabled = false;
        }

        // Initialize Model
        async function initModel() {
            const modelId = modelSelect.value;
            if (!transcriber || currentModelId !== modelId) {
                updateStatus(`Loading AI Model (${modelId})... this may take a moment.`, true);
                
                // Reset progress UI
                const pContainer = document.getElementById('progress-container');
                const pBar = document.getElementById('progress-bar');
                const pInfo = document.getElementById('progress-info');
                const pPercent = document.getElementById('progress-percent');
                const pSize = document.getElementById('progress-size');
                
                let lastUpdate = 0;

                try {
                    // Use quantized whisper model
                    transcriber = await pipeline('automatic-speech-recognition', modelId, {
                        progress_callback: (data) => {
                            if (data.status === 'initiate') {
                                updateStatus(`Downloading ${data.file}...`, true);
                                pContainer.style.display = 'block';
                                pInfo.style.display = 'flex';
                                lastUpdate = 0;
                            } else if (data.status === 'progress') {
                                const now = Date.now();
                                if (now - lastUpdate >= 1000) {
                                    const percent = data.progress.toFixed(1);
                                    const loaded = (data.loaded / 1024 / 1024).toFixed(2);
                                    const total = (data.total / 1024 / 1024).toFixed(2);
                                    
                                    pBar.style.width = percent + '%';
                                    pPercent.textContent = percent + '%';
                                    pSize.textContent = `${loaded} / ${total} MB`;
                                    lastUpdate = now;
                                }
                            } else if (data.status === 'done') {
                                pBar.style.width = '100%';
                                pPercent.textContent = '100%';
                            }
                        }
                    });
                    
                    currentModelId = modelId;
                    updateStatus('Model loaded!', false);
                    
                    // Hide progress bar after a short delay
                    setTimeout(() => {
                        pContainer.style.display = 'none';
                        pInfo.style.display = 'none';
                        statusBar.style.display = 'none';
                    }, 2000);
                    
                } catch (err) {
                    console.error(err);
                    updateStatus('Error loading model: ' + err.message + '. Try a smaller model or check console.', false);
                    return false;
                }
            }
            return true;
        }

        function updateStatus(text, isLoading) {
            statusBar.style.display = 'flex';
            statusText.textContent = text;
            spinner.style.display = isLoading ? 'block' : 'none';
        }

        transcribeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            transcribeBtn.disabled = true;
            resultText.value = '';
            
            const modelId = modelSelect.value;

            // Handle Gemini Model
            if (modelId.startsWith('gemini')) {
                const apiKey = apiKeyInput.value.trim();
                if (!apiKey) {
                    alert('Please enter a valid Gemini API Key.');
                    transcribeBtn.disabled = false;
                    return;
                }

                updateStatus('Uploading and processing with Gemini... (This may take a moment)', true);

                try {
                    // Convert file to Base64
                    const reader = new FileReader();
                    reader.readAsDataURL(selectedFile);
                    reader.onload = async () => {
                        const base64Data = reader.result.split(',')[1];
                        const mimeType = selectedFile.type || 'audio/mp3'; // Default fallback

                        const prompt = `
                            Process the audio file and generate a detailed transcription.
                            Requirements:
                            1. Identify distinct speakers (e.g., Speaker 1, Speaker 2, or names if context allows).
                            2. Provide accurate timestamps for each segment (Format: MM:SS).
                            3. Detect the primary language of each segment.
                            4. If the segment is in a language different than English, also provide the English translation.
                            5. Identify the primary emotion of the speaker in this segment. You MUST choose exactly one of the following: Happy, Sad, Angry, Neutral.
                            6. Provide a brief summary of the entire audio at the beginning.
                            
                            Format the output as a readable text report.
                        `;

                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                        
                        const payload = {
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: mimeType, data: base64Data } }
                                ]
                            }]
                        };

                        try {
                            const response = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            const data = await response.json();
                            
                            if (data.error) {
                                throw new Error(data.error.message);
                            }

                            const text = data.candidates[0].content.parts[0].text;
                            resultText.value = text;
                            updateStatus('Gemini processing complete!', false);
                        } catch (err) {
                            console.error(err);
                            updateStatus('Gemini Error: ' + err.message, false);
                            resultText.value = "Error: " + err.message;
                        } finally {
                            transcribeBtn.disabled = false;
                        }
                    };
                    reader.onerror = (err) => {
                        updateStatus('Error reading file: ' + err, false);
                        transcribeBtn.disabled = false;
                    };
                    return; // Exit function, waiting for FileReader callback
                } catch (err) {
                    updateStatus('Error preparing file: ' + err.message, false);
                    transcribeBtn.disabled = false;
                    return;
                }
            }

            // Handle Local Whisper Models
            const ready = await initModel();
            if (!ready) {
                transcribeBtn.disabled = false;
                return;
            }

            updateStatus('Processing audio... (this can take a while for large files)', true);

            try {
                // Read file as ArrayBuffer then convert to AudioBuffer
                const arrayBuffer = await selectedFile.arrayBuffer();
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                // Resample to 16000Hz if necessary (Whisper expects 16k)
                let audioData;
                if (audioBuffer.sampleRate !== 16000) {
                    const offlineCtx = new OfflineAudioContext(1, audioBuffer.duration * 16000, 16000);
                    const source = offlineCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(offlineCtx.destination);
                    source.start(0);
                    const resampled = await offlineCtx.startRendering();
                    audioData = resampled.getChannelData(0);
                } else {
                    audioData = audioBuffer.getChannelData(0);
                }
                
                // Run transcription
                // Determine language code
                let lang = langSelect.value;
                let generateOptions = {
                    task: 'transcribe',
                    chunk_length_s: 30,
                    stride_length_s: 5
                };

                if (lang === 'italian') generateOptions.language = 'italian';
                if (lang === 'english') generateOptions.language = 'english';
                // if multilingual, let it auto-detect

                const output = await transcriber(audioData, generateOptions);

                resultText.value = output.text;
                updateStatus('Transcription complete!', false);
            } catch (err) {
                console.error(err);
                updateStatus('Error during transcription: ' + err.message, false);
                resultText.value = "Error: " + err.message;
            } finally {
                transcribeBtn.disabled = false;
            }
        });

        window.copyText = () => {
            resultText.select();
            document.execCommand('copy');
            const btn = document.querySelector('.copy-btn');
            const original = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = original, 2000);
        };
    </script>
</body>
</html>
