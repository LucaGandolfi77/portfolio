<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 - Chaos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a1628;
            color: #00d4ff;
            font-family: 'Inter', sans-serif;
        }
        #chaosCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        .btn-back {
            background: rgba(10, 22, 40, 0.8);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: #00d4ff;
            color: #0a1628;
        }
    </style>
</head>
<body>

    <canvas id="chaosCanvas"></canvas>

    <div class="overlay-ui">
        <a href="index.html" class="btn-back">← Back to Portfolio</a>
    </div>

    <script>
        const canvas = document.getElementById('chaosCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 100; // Number of 8s

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Eight {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                this.x = Math.random() * width;
                this.y = randomY ? Math.random() * height : -100;
                this.size = Math.random() * 50 + 20; // Base size
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.scale = 1;
                this.scaleSpeed = Math.random() * 0.05 + 0.01;
                this.scaleDir = 1;
                this.color = `hsl(${190 + Math.random() * 40}, 100%, ${50 + Math.random() * 30}%)`;
                this.font = Math.random() > 0.5 ? 'Arial' : 'Times New Roman';
                this.bold = Math.random() > 0.5 ? 'bold' : '';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;

                // Bounce off walls
                if (this.x < -50 || this.x > width + 50) this.vx *= -1;
                if (this.y < -50 || this.y > height + 50) this.vy *= -1;

                // Pulse scale
                this.scale += this.scaleSpeed * this.scaleDir;
                if (this.scale > 1.5 || this.scale < 0.5) {
                    this.scaleDir *= -1;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale);
                
                ctx.font = `${this.bold} ${this.size}px ${this.font}`;
                ctx.fillStyle = this.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('8', 0, 0);
                
                ctx.restore();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Eight());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 22, 40, 0.2)'; // Trail effect
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        init();
        animate();

        // Add more 8s on click
        canvas.addEventListener('click', (e) => {
            for(let i=0; i<5; i++) {
                const p = new Eight();
                p.x = e.clientX;
                p.y = e.clientY;
                particles.push(p);
            }
        });

    </script>
</body>
</html>
