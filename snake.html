<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Snake — Classic arcade game — Luca Gandolfi's Portfolio">
    <meta name="keywords" content="snake, game, arcade, classic">
    <meta name="author" content="Luca Gandolfi">
    <title>Snake — Luca Gandolfi</title>
    
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .snake-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .snake-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .snake-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .snake-subtitle {
            color: #a0c0e0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #a0c0e0;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-board {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.08), rgba(0, 212, 255, 0.08));
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            touch-action: none;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 1px;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px;
            border-radius: 8px;
            margin-bottom: 15px;
            aspect-ratio: 1;
        }

        .board-cell {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 255, 136, 0.1);
            aspect-ratio: 1;
            position: relative;
        }

        .snake-segment {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #00ff88, #00dd77);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
        }

        .snake-segment.head {
            background: linear-gradient(135deg, #00ff88, #00ffaa);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.8), inset 0 0 6px rgba(255, 255, 255, 0.3);
        }

        .food-segment {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #ff4757);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.8);
            animation: foodPulse 0.6s ease-in-out infinite;
        }

        @keyframes foodPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .game-message {
            text-align: center;
            padding: 20px;
            background: rgba(0, 255, 136, 0.08);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0c0e0;
            font-weight: 600;
        }

        .game-message.game-over {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .game-message.playing {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .difficulty-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .difficulty-label {
            color: #a0c0e0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #a0c0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            border-color: #00ff88;
            color: #0a1428;
        }

        .difficulty-btn:hover {
            border-color: rgba(0, 255, 136, 0.5);
        }

        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-game {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-game-primary {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #0a1428;
        }

        .btn-game-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-game-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-game-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .controls-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #a0c0e0;
            line-height: 1.6;
        }

        .controls-info strong {
            color: #00ff88;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0c0e0;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            color: #00ff88;
            transform: translateX(-4px);
        }

        @media (max-width: 600px) {
            .snake-container {
                padding: 20px 15px;
            }

            .snake-title {
                font-size: 1.8rem;
            }

            .game-stats {
                gap: 20px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .board-grid {
                grid-template-columns: repeat(16, 1fr);
            }

            .controls-info {
                font-size: 0.85rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="lang-top-left" aria-hidden="false">
        <label for="langSelect" class="visually-hidden">Select language</label>
        <select id="langSelect" aria-label="Select language" title="Change language">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 中</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 日本</option>
            <option value="sv">🇸🇪 SV</option>
            <option value="ar">🇸🇦 AR</option>
            <option value="he">🇮🇱 HE</option>
        </select>
    </div>

    <div class="particles" id="particles"></div>

    <div class="snake-container">
        <a href="index.html#games" class="back-button">← <span data-i18n="games.snake.back">Back to Games</span></a>

        <div class="snake-header">
            <h1 class="snake-title">🐍 <span data-i18n="games.snake.gameTitle">Snake</span></h1>
            <p class="snake-subtitle" data-i18n="games.snake.gameSubtitle">Eat food, avoid walls and yourself</p>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.snake.score">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.snake.highScore">High Score</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.snake.length">Length</div>
                <div class="stat-value" id="length">1</div>
            </div>
        </div>

        <div class="difficulty-selector">
            <div class="difficulty-label" data-i18n="games.snake.speed">Speed</div>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-speed="150" data-i18n="games.snake.slow">Slow</button>
                <button class="difficulty-btn active" data-speed="100" data-i18n="games.snake.normal">Normal</button>
                <button class="difficulty-btn" data-speed="60" data-i18n="games.snake.fast">Fast</button>
                <button class="difficulty-btn" data-speed="30" data-i18n="games.snake.insane">Insane</button>
            </div>
        </div>

        <div class="controls-info" data-i18n="games.snake.controlsHint">
            <strong>Controls:</strong><br>
            ⬆️ ⬇️ ⬅️ ➡️ Arrow keys or WASD<br>
            <strong>Click or tap</strong> to play on mobile
        </div>

        <div class="game-board">
            <div class="game-message playing" id="gameMessage" data-i18n="games.snake.pressStart">Press START or press arrow keys to begin</div>
            <div class="board-grid" id="board">
                <!-- Game board cells generated by JS -->
            </div>
        </div>

        <div class="game-controls">
            <button class="btn-game btn-game-primary" id="startBtn" data-i18n="games.snake.start">Start Game</button>
            <button class="btn-game btn-game-secondary" id="resetBtn" data-i18n="games.snake.resetHighScore">Reset High Score</button>
        </div>
    </div>

    <script>
        // Game constants
        const GRID_WIDTH = 20;
        const GRID_HEIGHT = 20;
        const DIRECTIONS = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        // Game state
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let direction = DIRECTIONS.RIGHT;
        let nextDirection = DIRECTIONS.RIGHT;
        let gameRunning = false;
        let gameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('snake_highScore') || 0;
        let gameSpeed = 100;
        let gameLoop = null;

        // Initialize board
        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            for (let i = 0; i < GRID_WIDTH * GRID_HEIGHT; i++) {
                const cell = document.createElement('div');
                cell.className = 'board-cell';
                cell.id = `cell-${i}`;
                board.appendChild(cell);
            }
        }

        function getCellIndex(x, y) {
            return y * GRID_WIDTH + x;
        }

        function getPositionFromIndex(index) {
            return {
                x: index % GRID_WIDTH,
                y: Math.floor(index / GRID_WIDTH)
            };
        }

        function renderGame() {
            // Clear board
            document.querySelectorAll('.board-cell').forEach(cell => {
                cell.innerHTML = '';
            });

            // Draw snake
            snake.forEach((segment, index) => {
                const cellIndex = getCellIndex(segment.x, segment.y);
                const cell = document.getElementById(`cell-${cellIndex}`);
                if (cell) {
                    const div = document.createElement('div');
                    div.className = index === 0 ? 'snake-segment head' : 'snake-segment';
                    cell.appendChild(div);
                }
            });

            // Draw food
            const foodCellIndex = getCellIndex(food.x, food.y);
            const foodCell = document.getElementById(`cell-${foodCellIndex}`);
            if (foodCell) {
                const div = document.createElement('div');
                div.className = 'food-segment';
                foodCell.appendChild(div);
            }
        }

        function generateFood() {
            let newFood;
            let isOnSnake = true;

            while (isOnSnake) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_WIDTH),
                    y: Math.floor(Math.random() * GRID_HEIGHT)
                };

                isOnSnake = snake.some(segment => 
                    segment.x === newFood.x && segment.y === newFood.y
                );
            }

            food = newFood;
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('length').textContent = snake.length;
        }

        function update() {
            if (!gameRunning || gameOver) return;

            // Update direction
            direction = nextDirection;

            // Calculate new head position
            const head = snake[0];
            const newHead = {
                x: (head.x + direction.x + GRID_WIDTH) % GRID_WIDTH,
                y: (head.y + direction.y + GRID_HEIGHT) % GRID_HEIGHT
            };

            // Check collision with self
            if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                endGame();
                return;
            }

            // Add new head
            snake.unshift(newHead);

            // Check food collision
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                generateFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }

            updateScore();
            renderGame();
        }

        function startGame() {
            // Allow restart
            // if (gameRunning && !gameOver) return;

            snake = [{ x: 10, y: 10 }];
            direction = DIRECTIONS.RIGHT;
            nextDirection = DIRECTIONS.RIGHT;
            score = 0;
            gameOver = false;
            gameRunning = true;

            generateFood();
            updateScore();
            renderGame();
            updateMessage('games.snake.playing');

            // Clear old loop if exists
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
        }

        function endGame() {
            gameRunning = false;
            gameOver = true;
            clearInterval(gameLoop);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highScore', highScore);
            }

            updateScore();
            updateMessage('games.snake.gameOver');
        }

        function resetHighScore() {
            if (confirm(getTranslation('games.snake.confirmReset'))) {
                highScore = 0;
                localStorage.removeItem('snake_highScore');
                updateScore();
            }
        }

        function updateMessage(key) {
            const msgEl = document.getElementById('gameMessage');
            msgEl.textContent = getTranslation(key);
            msgEl.className = 'game-message';
            
            if (key.includes('gameOver')) msgEl.classList.add('game-over');
            else if (key.includes('playing')) msgEl.classList.add('playing');
        }

        function setSpeed(speed) {
            gameSpeed = speed;
            if (gameRunning && !gameOver) {
                clearInterval(gameLoop);
                gameLoop = setInterval(update, gameSpeed);
            }
        }

        function getTranslation(key) {
            const lang = localStorage.getItem('language') || 'en';
            const translations = window.i18nData?.[lang] || window.i18nData?.en || {};
            
            const keys = key.split('.');
            let value = translations;
            for (const k of keys) {
                value = value?.[k];
            }
            return value || key;
        }

        // i18n initialization
        let currentLang = localStorage.getItem('language') || 'en';

        async function loadI18n() {
            try {
                const response = await fetch(`./i18n/${currentLang}.json`);
                window.i18nData = await response.json();
                applyTranslations();
            } catch (error) {
                console.error('Failed to load i18n:', error);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                const text = getTranslation(key);
                if (text && text !== key) {
                    el.textContent = text;
                    el.setAttribute('data-i18n', key);
                }
            });
        }

        // Event listeners
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('language', currentLang);
            loadI18n();
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resetBtn').addEventListener('click', resetHighScore);

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setSpeed(parseInt(btn.dataset.speed));
            });
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && !gameOver && (e.key.startsWith('Arrow') || ['w', 'a', 's', 'd'].includes(e.key.toLowerCase()))) {
                startGame();
                return;
            }

            const key = e.key.toLowerCase();
            
            if (e.key === 'ArrowUp' || key === 'w') {
                if (direction.y === 0) nextDirection = DIRECTIONS.UP;
                e.preventDefault();
            } else if (e.key === 'ArrowDown' || key === 's') {
                if (direction.y === 0) nextDirection = DIRECTIONS.DOWN;
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' || key === 'a') {
                if (direction.x === 0) nextDirection = DIRECTIONS.LEFT;
                e.preventDefault();
            } else if (e.key === 'ArrowRight' || key === 'd') {
                if (direction.x === 0) nextDirection = DIRECTIONS.RIGHT;
                e.preventDefault();
            }
        });

        // Touch controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            // Removed auto-start to prevent accidental starts while scrolling
            
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);

        document.addEventListener('touchend', (e) => {
            if (!gameRunning || gameOver) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            const threshold = 50;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > threshold && direction.x === 0) nextDirection = DIRECTIONS.RIGHT;
                else if (diffX < -threshold && direction.x === 0) nextDirection = DIRECTIONS.LEFT;
            } else {
                if (diffY > threshold && direction.y === 0) nextDirection = DIRECTIONS.DOWN;
                else if (diffY < -threshold && direction.y === 0) nextDirection = DIRECTIONS.UP;
            }
        }, false);

        // Initialize
        document.getElementById('langSelect').value = currentLang;
        loadI18n();
        initBoard();
        generateFood();
        renderGame();
        updateScore();
    </script>
</body>
</html>
