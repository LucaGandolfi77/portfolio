<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Lab - Luca Gandolfi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a1628;
            color: #fff;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            z-index: 10;
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            color: #a0c0e0;
        }
        #spawner {
            top: 20px;
            left: 20px;
            width: 220px;
            max-height: 80vh;
            overflow-y: auto;
        }
        #achievements {
            top: 20px;
            right: 20px;
            width: 250px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .spawner-section {
            margin-bottom: 15px;
        }
        .spawner-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .spawner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .spawner-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            color: #fff;
            font-size: 0.85rem;
        }
        .spawner-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
        }
        .particle-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }
        .achievement-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            border-left: 3px solid #444;
            opacity: 0.6;
        }
        .achievement-item.unlocked {
            border-left-color: #00d4ff;
            opacity: 1;
            background: rgba(0, 212, 255, 0.05);
        }
        .achievement-title {
            font-weight: bold;
            color: #fff;
            font-size: 0.9rem;
        }
        .achievement-desc {
            font-size: 0.8rem;
        }
        .back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 212, 255, 0.9);
            color: #000;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }
        .recipe-hint {
            font-size: 0.8rem;
            margin-top: 10px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-panel" id="spawner">
        <h3 style="margin-top:0;color:#00d4ff">Quantum Spawner</h3>
        
        <div class="spawner-section">
            <div class="spawner-title">Quarks</div>
            <div class="spawner-grid">
                <div class="spawner-btn" onclick="spawn('u')"><div class="particle-icon" style="background:#ff4444">u</div>Up</div>
                <div class="spawner-btn" onclick="spawn('d')"><div class="particle-icon" style="background:#4444ff">d</div>Down</div>
                <div class="spawner-btn" onclick="spawn('c')"><div class="particle-icon" style="background:#ff88ff">c</div>Charm</div>
                <div class="spawner-btn" onclick="spawn('s')"><div class="particle-icon" style="background:#44ff44">s</div>Strange</div>
                <div class="spawner-btn" onclick="spawn('t')"><div class="particle-icon" style="background:#ffaa44">t</div>Top</div>
                <div class="spawner-btn" onclick="spawn('b')"><div class="particle-icon" style="background:#aa44ff">b</div>Bottom</div>
            </div>
        </div>

        <div class="spawner-section">
            <div class="spawner-title">Leptons</div>
            <div class="spawner-grid">
                <div class="spawner-btn" onclick="spawn('e')"><div class="particle-icon" style="background:#ffff44">e</div>Electron</div>
                <div class="spawner-btn" onclick="spawn('mu')"><div class="particle-icon" style="background:#ffff88">μ</div>Muon</div>
                <div class="spawner-btn" onclick="spawn('tau')"><div class="particle-icon" style="background:#ffffcc">τ</div>Tau</div>
            </div>
        </div>

        <div class="spawner-section">
            <div class="spawner-title">Bosons</div>
            <div class="spawner-grid">
                <div class="spawner-btn" onclick="spawn('g')"><div class="particle-icon" style="background:#888888">g</div>Gluon</div>
                <div class="spawner-btn" onclick="spawn('y')"><div class="particle-icon" style="background:#ffffff">γ</div>Photon</div>
                <div class="spawner-btn" onclick="spawn('Z')"><div class="particle-icon" style="background:#cccccc">Z</div>Z Boson</div>
                <div class="spawner-btn" onclick="spawn('W')"><div class="particle-icon" style="background:#bbbbbb">W</div>W Boson</div>
                <div class="spawner-btn" onclick="spawn('H0')"><div class="particle-icon" style="background:#ffd700">H</div>Higgs</div>
            </div>
        </div>

        <div style="margin-top:15px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;">
            <button class="spawner-btn" onclick="clearCanvas()" style="justify-content:center;background:rgba(255,50,50,0.2)">Clear All</button>
        </div>
        <div class="recipe-hint">
            Hint: Combine quarks to form Baryons. Combine Baryons to form Nuclei.
        </div>
    </div>

    <div class="ui-panel" id="achievements">
        <h3 style="margin-top:0;color:#00d4ff">Achievements</h3>
        <div id="achievementsList"></div>
    </div>

    <a href="index.html" class="back-btn">← Back to Portfolio</a>
    
    <div id="notification" class="notification">New Element Discovered!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let draggedParticle = null;
        
        // Game State
        const unlocked = new Set();
        
        // Definitions
        const TYPES = {
            // Quarks
            'u': { color: '#ff4444', radius: 10, label: 'u', mass: 1 },
            'd': { color: '#4444ff', radius: 10, label: 'd', mass: 1 },
            'c': { color: '#ff88ff', radius: 12, label: 'c', mass: 2 },
            's': { color: '#44ff44', radius: 12, label: 's', mass: 2 },
            't': { color: '#ffaa44', radius: 14, label: 't', mass: 3 },
            'b': { color: '#aa44ff', radius: 14, label: 'b', mass: 3 },
            
            // Leptons
            'e': { color: '#ffff44', radius: 6, label: 'e-', mass: 0.5 },
            'mu': { color: '#ffff88', radius: 8, label: 'μ', mass: 1 },
            'tau': { color: '#ffffcc', radius: 10, label: 'τ', mass: 1.5 },

            // Bosons
            'g': { color: '#888888', radius: 8, label: 'g', mass: 0 },
            'y': { color: '#ffffff', radius: 8, label: 'γ', mass: 0, glow: true },
            'Z': { color: '#cccccc', radius: 15, label: 'Z', mass: 4 },
            'W': { color: '#bbbbbb', radius: 15, label: 'W', mass: 4 },
            'H0': { color: '#ffd700', radius: 18, label: 'H', mass: 5, glow: true },

            // Baryons
            'p': { color: '#ff8800', radius: 20, label: 'p+', mass: 5, glow: true },
            'n': { color: '#8888ff', radius: 20, label: 'n', mass: 5 },
            'L': { color: '#00ffaa', radius: 22, label: 'Λ', mass: 6 }, // Lambda (uds)
            'Om': { color: '#aa00ff', radius: 24, label: 'Ω', mass: 7 }, // Omega (sss)
            'D++': { color: '#ff0000', radius: 22, label: 'Δ++', mass: 6 }, // Delta++ (uuu)
            'D-': { color: '#0000ff', radius: 22, label: 'Δ-', mass: 6 }, // Delta- (ddd)
            
            // Mesons (Simplified)
            'J': { color: '#ff00ff', radius: 18, label: 'J/ψ', mass: 4, glow: true }, // J/Psi (cc)
            'Up': { color: '#aa00aa', radius: 20, label: 'Υ', mass: 6, glow: true }, // Upsilon (bb)

            // Nuclei / Atoms
            'H': { color: '#ffffff', radius: 30, label: 'H', mass: 10, glow: true },
            'He': { color: '#ffccff', radius: 35, label: 'He', mass: 15, glow: true },
            'C': { color: '#aaaaaa', radius: 40, label: 'C', mass: 20 },
            'O': { color: '#88ccff', radius: 40, label: 'O', mass: 20 },
            'H2O': { color: '#00d4ff', radius: 50, label: 'H₂O', mass: 30, glow: true }
        };

        const ACHIEVEMENTS = [
            { id: 'p', title: 'Proton', desc: 'Created a Proton (u+u+d)' },
            { id: 'n', title: 'Neutron', desc: 'Created a Neutron (u+d+d)' },
            { id: 'L', title: 'Lambda Baryon', desc: 'Strange matter! (u+d+s)' },
            { id: 'Om', title: 'Omega Baryon', desc: 'Triple Strange! (s+s+s)' },
            { id: 'D++', title: 'Delta++', desc: 'Highly charged! (u+u+u)' },
            { id: 'J', title: 'J/Psi', desc: 'Charmonium (c+c)' },
            { id: 'Up', title: 'Upsilon', desc: 'Bottomonium (b+b)' },
            { id: 'H', title: 'Hydrogen', desc: 'Created Hydrogen (p+e)' },
            { id: 'He', title: 'Helium', desc: 'Fusion! (H+H)' },
            { id: 'C', title: 'Carbon', desc: 'Triple Alpha (He+He+He)' },
            { id: 'O', title: 'Oxygen', desc: 'Stellar Nucleosynthesis (C+He)' },
            { id: 'H2O', title: 'Water', desc: 'Life Source (H+H+O)' }
        ];

        // Recipes: Array of inputs (sorted) -> Output
        const RECIPES = [
            // Baryons
            { inputs: ['d', 'u', 'u'], output: 'p' },
            { inputs: ['d', 'd', 'u'], output: 'n' },
            { inputs: ['d', 's', 'u'], output: 'L' }, // Lambda
            { inputs: ['s', 's', 's'], output: 'Om' }, // Omega
            { inputs: ['u', 'u', 'u'], output: 'D++' }, // Delta++
            { inputs: ['d', 'd', 'd'], output: 'D-' }, // Delta-
            
            // Mesons (Simplified 2-body for game purposes)
            { inputs: ['c', 'c'], output: 'J' }, // J/Psi
            { inputs: ['b', 'b'], output: 'Up' }, // Upsilon

            // Atoms
            { inputs: ['e', 'p'], output: 'H' },
            { inputs: ['H', 'H'], output: 'He' }, // Simplified Fusion
            { inputs: ['He', 'He', 'He'], output: 'C' },
            { inputs: ['C', 'He'], output: 'O' },
            { inputs: ['H', 'H', 'O'], output: 'H2O' },
            
            // Boson Interactions (Fun extras)
            { inputs: ['e', 'e'], output: 'y' }, // Annihilation simulation (e+e -> photon) - simplified
            { inputs: ['W', 'Z'], output: 'H0' } // Higgs production simulation
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.props = TYPES[type];
                this.id = Math.random();
            }

            update() {
                if (this === draggedParticle) return;

                this.x += this.vx;
                this.y += this.vy;

                // Bounce
                if (this.x < this.props.radius || this.x > width - this.props.radius) this.vx *= -1;
                if (this.y < this.props.radius || this.y > height - this.props.radius) this.vy *= -1;

                // Friction
                this.vx *= 0.99;
                this.vy *= 0.99;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.props.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.props.color;
                
                if (this.props.glow) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.props.color;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.props.label, this.x, this.y);
            }
        }

        function spawn(type) {
            const p = new Particle(type, width/2 + (Math.random()-0.5)*50, height/2 + (Math.random()-0.5)*50);
            particles.push(p);
        }

        function clearCanvas() {
            particles = [];
        }

        function checkCollisions() {
            const MERGE_DIST = 40;
            let used = new Set();

            for (let i = 0; i < particles.length; i++) {
                if (used.has(i)) continue;
                if (particles[i] === draggedParticle) continue;

                let group = [i];
                let groupTypes = [particles[i].type];
                let cx = particles[i].x;
                let cy = particles[i].y;

                // Find neighbors
                for (let j = i + 1; j < particles.length; j++) {
                    if (used.has(j)) continue;
                    if (particles[j] === draggedParticle) continue;

                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < MERGE_DIST + particles[i].props.radius + particles[j].props.radius) {
                        group.push(j);
                        groupTypes.push(particles[j].type);
                        cx += particles[j].x;
                        cy += particles[j].y;
                    }
                }

                if (group.length > 1) {
                    // Check recipes
                    groupTypes.sort();
                    const recipe = RECIPES.find(r => {
                        const rInputs = [...r.inputs].sort();
                        return JSON.stringify(rInputs) === JSON.stringify(groupTypes);
                    });

                    if (recipe) {
                        // Merge!
                        cx /= group.length;
                        cy /= group.length;
                        
                        // Remove old particles
                        group.forEach(idx => used.add(idx));
                        
                        // Create new particle
                        const newP = new Particle(recipe.output, cx, cy);
                        particles.push(newP);
                        
                        // Effects
                        createExplosion(cx, cy, TYPES[recipe.output].color);
                        unlockAchievement(recipe.output);
                    }
                }
            }

            // Remove used particles
            if (used.size > 0) {
                particles = particles.filter((_, idx) => !used.has(idx));
            }
        }

        let explosions = [];
        function createExplosion(x, y, color) {
            for(let i=0; i<20; i++) {
                explosions.push({
                    x, y,
                    vx: (Math.random()-0.5)*10,
                    vy: (Math.random()-0.5)*10,
                    life: 1.0,
                    color
                });
            }
        }

        function unlockAchievement(id) {
            // Only unlock if it's in the achievements list
            const ach = ACHIEVEMENTS.find(a => a.id === id);
            if (ach && !unlocked.has(id)) {
                unlocked.add(id);
                renderAchievements();
                showNotification(`Discovered: ${TYPES[id].label}`);
            }
        }

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.textContent = text;
            el.style.opacity = 1;
            el.style.top = '40%';
            setTimeout(() => {
                el.style.opacity = 0;
                el.style.top = '50%';
            }, 2000);
        }

        function renderAchievements() {
            const list = document.getElementById('achievementsList');
            list.innerHTML = '';
            ACHIEVEMENTS.forEach(ach => {
                const isUnlocked = unlocked.has(ach.id);
                const div = document.createElement('div');
                div.className = `achievement-item ${isUnlocked ? 'unlocked' : ''}`;
                div.innerHTML = `
                    <div class="achievement-title">${ach.title} ${isUnlocked ? '✓' : '🔒'}</div>
                    <div class="achievement-desc">${ach.desc}</div>
                `;
                list.appendChild(div);
            });
        }

        // Input Handling
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Find clicked particle (reverse order for top-most)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                const dx = x - p.x;
                const dy = y - p.y;
                if (dx*dx + dy*dy < p.props.radius * p.props.radius * 2) { // Generous hit area
                    draggedParticle = p;
                    break;
                }
            }
        });

        window.addEventListener('mousemove', e => {
            if (draggedParticle) {
                draggedParticle.x = e.clientX;
                draggedParticle.y = e.clientY;
                draggedParticle.vx = 0;
                draggedParticle.vy = 0;
            }
        });

        window.addEventListener('mouseup', () => {
            draggedParticle = null;
        });

        function loop() {
            ctx.fillStyle = '#0a1628';
            ctx.fillRect(0, 0, width, height);

            // Draw Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,height); ctx.stroke(); }
            for(let i=0; i<height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(width,i); ctx.stroke(); }

            checkCollisions();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Draw Explosions
            for(let i=explosions.length-1; i>=0; i--) {
                const e = explosions[i];
                e.x += e.vx;
                e.y += e.vy;
                e.life -= 0.05;
                ctx.globalAlpha = e.life;
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
                if(e.life <= 0) explosions.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }

        renderAchievements();
        loop();

    </script>
</body>
</html>
