<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Air Hockey — Fast-paced table game — Luca Gandolfi's Portfolio">
    <meta name="keywords" content="air hockey, game, puck, table">
    <meta name="author" content="Luca Gandolfi">
    <title>Air Hockey — Luca Gandolfi</title>
    
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .airhockey-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .airhockey-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .airhockey-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .airhockey-subtitle {
            color: #a0c0e0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 100px;
        }

        .stat-label {
            color: #a0c0e0;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-board {
            background: linear-gradient(135deg, #1a472a, #0f2818);
            border: 3px solid #ff6b9d;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 20px;
            position: relative;
            aspect-ratio: 1.4;
            max-width: 100%;
            cursor: none;
            overflow: hidden;
        }

        .table-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-message {
            text-align: center;
            padding: 20px;
            background: rgba(255, 107, 157, 0.08);
            border: 2px solid rgba(255, 107, 157, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0c0e0;
            font-weight: 600;
        }

        .game-message.ai-scored {
            background: rgba(255, 107, 157, 0.1);
            border-color: rgba(255, 107, 157, 0.3);
            color: #ff6b9d;
        }

        .game-message.player-scored {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .game-message.playing {
            background: rgba(255, 107, 157, 0.05);
            border-color: rgba(255, 107, 157, 0.15);
            color: #a0c0e0;
        }

        .difficulty-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 107, 157, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .difficulty-label {
            color: #a0c0e0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #a0c0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            border-color: #ff6b9d;
            color: #0a1428;
        }

        .difficulty-btn:hover {
            border-color: rgba(255, 107, 157, 0.5);
        }

        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-game {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-game-primary {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: #0a1428;
        }

        .btn-game-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3);
        }

        .btn-game-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-game-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .controls-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #a0c0e0;
            line-height: 1.6;
        }

        .controls-info strong {
            color: #ff6b9d;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0c0e0;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            color: #ff6b9d;
            transform: translateX(-4px);
        }

        @media (max-width: 600px) {
            .airhockey-container {
                padding: 20px 15px;
            }

            .airhockey-title {
                font-size: 1.8rem;
            }

            .game-stats {
                gap: 10px;
            }

            .stat-value {
                font-size: 1.4rem;
            }

            .controls-info {
                font-size: 0.85rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="lang-top-left" aria-hidden="false">
        <label for="langSelect" class="visually-hidden">Select language</label>
        <select id="langSelect" aria-label="Select language" title="Change language">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 中</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 日本</option>
            <option value="sv">🇸🇪 SV</option>
            <option value="ar">🇸🇦 AR</option>
            <option value="he">🇮🇱 HE</option>
        </select>
    </div>

    <div class="particles" id="particles"></div>

    <div class="airhockey-container">
        <a href="index.html#games" class="back-button">← <span data-i18n="games.airhockey.back">Back to Games</span></a>

        <div class="airhockey-header">
            <h1 class="airhockey-title">🏏 <span data-i18n="games.airhockey.gameTitle">Air Hockey</span></h1>
            <p class="airhockey-subtitle" data-i18n="games.airhockey.gameSubtitle">Hit the puck, score goals</p>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.airhockey.yourScore">Your Score</div>
                <div class="stat-value" id="playerScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.airhockey.aiScore">AI Score</div>
                <div class="stat-value" id="aiScore">0</div>
            </div>
        </div>

        <div class="difficulty-selector">
            <div class="difficulty-label" data-i18n="games.airhockey.difficulty">Difficulty</div>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="easy" data-i18n="games.airhockey.easy">Easy</button>
                <button class="difficulty-btn active" data-difficulty="medium" data-i18n="games.airhockey.medium">Medium</button>
                <button class="difficulty-btn" data-difficulty="hard" data-i18n="games.airhockey.hard">Hard</button>
            </div>
        </div>

        <div class="controls-info" data-i18n="games.airhockey.controlsHint">
            <strong>Controls:</strong><br>
            Move your paddle with <strong>Mouse</strong> or <strong>Touch</strong><br>
            Your paddle is at the <strong>bottom</strong>
        </div>

        <div class="game-message playing" id="gameMessage" data-i18n="games.airhockey.movePlayground">Move your paddle to start</div>
        
        <div class="game-board">
            <canvas id="gameCanvas" class="table-canvas"></canvas>
        </div>

        <div class="game-controls">
            <button class="btn-game btn-game-primary" id="resetBtn" data-i18n="games.airhockey.newGame">New Game</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game constants
        const TABLE_WIDTH = canvas.width;
        const TABLE_HEIGHT = canvas.height;
        const PADDLE_WIDTH = TABLE_WIDTH * 0.15;
        const PADDLE_HEIGHT = TABLE_HEIGHT * 0.08;
        const PUCK_RADIUS = Math.min(TABLE_WIDTH, TABLE_HEIGHT) * 0.02;
        const GOAL_WIDTH = TABLE_WIDTH * 0.3;

        // Game state
        let playerPaddle = {
            x: TABLE_WIDTH / 2 - PADDLE_WIDTH / 2,
            y: TABLE_HEIGHT - PADDLE_HEIGHT - 20,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            vx: 0
        };

        let aiPaddle = {
            x: TABLE_WIDTH / 2 - PADDLE_WIDTH / 2,
            y: 20,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            speed: 0
        };

        let puck = {
            x: TABLE_WIDTH / 2,
            y: TABLE_HEIGHT / 2,
            vx: 0,
            vy: 0,
            radius: PUCK_RADIUS
        };

        let playerScore = 0;
        let aiScore = 0;
        let difficulty = 'medium';
        let gameActive = true;
        let mouseX = TABLE_WIDTH / 2;
        let gameLoop = null;

        // Load scores from localStorage
        function loadScores() {
            const saved = localStorage.getItem('airhockey_scores');
            if (saved) {
                const scores = JSON.parse(saved);
                playerScore = scores.player || 0;
                aiScore = scores.ai || 0;
                difficulty = scores.difficulty || 'medium';
            }
            updateScoreDisplay();
            setDifficulty(difficulty);
        }

        function saveScores() {
            localStorage.setItem('airhockey_scores', JSON.stringify({
                player: playerScore,
                ai: aiScore,
                difficulty: difficulty
            }));
        }

        function updateScoreDisplay() {
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('aiScore').textContent = aiScore;
        }

        function resetPuck() {
            puck.x = TABLE_WIDTH / 2;
            puck.y = TABLE_HEIGHT / 2;
            puck.vx = (Math.random() - 0.5) * 8;
            puck.vy = (Math.random() - 0.5) * 8;
        }

        function resetGame() {
            playerScore = 0;
            aiScore = 0;
            resetPuck();
            updateScoreDisplay();
            saveScores();
        }

        function setDifficulty(level) {
            difficulty = level;
            saveScores();
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.difficulty === level) {
                    btn.classList.add('active');
                }
            });
        }

        function update() {
            if (!gameActive) return;

            // Update puck physics
            puck.x += puck.vx;
            puck.y += puck.vy;
            puck.vx *= 0.99; // Friction
            puck.vy *= 0.99;

            // Wall collisions (left/right)
            if (puck.x - puck.radius < 0 || puck.x + puck.radius > TABLE_WIDTH) {
                puck.vx *= -1;
                puck.x = Math.max(puck.radius, Math.min(TABLE_WIDTH - puck.radius, puck.x));
            }

            // Goal detection
            const goalX = Math.abs(puck.x - TABLE_WIDTH / 2) < GOAL_WIDTH / 2;
            
            if (puck.y - puck.radius < 0 && goalX) {
                // Player scores
                playerScore++;
                updateScoreDisplay();
                saveScores();
                updateMessage('games.airhockey.playerScored');
                resetPuck();
                return;
            }

            if (puck.y + puck.radius > TABLE_HEIGHT && goalX) {
                // AI scores
                aiScore++;
                updateScoreDisplay();
                saveScores();
                updateMessage('games.airhockey.aiScored');
                resetPuck();
                return;
            }

            // Player paddle collision
            if (puck.vy > 0 &&
                puck.y + puck.radius > playerPaddle.y &&
                puck.y < playerPaddle.y + playerPaddle.height &&
                puck.x > playerPaddle.x &&
                puck.x < playerPaddle.x + playerPaddle.width) {
                
                puck.vy *= -1.05;
                puck.y = playerPaddle.y - puck.radius;
                
                // Add horizontal momentum from paddle
                const hitPos = (puck.x - playerPaddle.x) / playerPaddle.width;
                puck.vx += (hitPos - 0.5) * 8;
            }

            // AI paddle collision
            if (puck.vy < 0 &&
                puck.y - puck.radius < aiPaddle.y + aiPaddle.height &&
                puck.y > aiPaddle.y &&
                puck.x > aiPaddle.x &&
                puck.x < aiPaddle.x + aiPaddle.width) {
                
                puck.vy *= -1.05;
                puck.y = aiPaddle.y + aiPaddle.height + puck.radius;
                
                // Add horizontal momentum from paddle
                const hitPos = (puck.x - aiPaddle.x) / aiPaddle.width;
                puck.vx += (hitPos - 0.5) * 8;
            }

            // AI paddle movement
            const aiDifficulties = {
                easy: 0.04,
                medium: 0.07,
                hard: 0.11
            };
            
            const targetX = puck.x - aiPaddle.width / 2;
            const diff = targetX - aiPaddle.x;
            aiPaddle.x += diff * aiDifficulties[difficulty];
            
            // Keep AI paddle in bounds
            aiPaddle.x = Math.max(0, Math.min(TABLE_WIDTH - aiPaddle.width, aiPaddle.x));

            // Update player paddle
            playerPaddle.x = mouseX - playerPaddle.width / 2;
            playerPaddle.x = Math.max(0, Math.min(TABLE_WIDTH - playerPaddle.width, playerPaddle.x));

            // Puck boundary check (safety)
            if (Math.abs(puck.vx) > 15) puck.vx *= 0.8;
            if (Math.abs(puck.vy) > 15) puck.vy *= 0.8;
        }

        function draw() {
            // Clear canvas with table gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, TABLE_HEIGHT);
            gradient.addColorStop(0, '#0f2818');
            gradient.addColorStop(1, '#1a472a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            // Draw center line
            ctx.strokeStyle = 'rgba(255, 107, 157, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, TABLE_HEIGHT / 2);
            ctx.lineTo(TABLE_WIDTH, TABLE_HEIGHT / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw goal areas
            ctx.fillStyle = 'rgba(255, 107, 157, 0.1)';
            ctx.fillRect((TABLE_WIDTH - GOAL_WIDTH) / 2, 0, GOAL_WIDTH, TABLE_HEIGHT * 0.15);
            ctx.fillRect((TABLE_WIDTH - GOAL_WIDTH) / 2, TABLE_HEIGHT * 0.85, GOAL_WIDTH, TABLE_HEIGHT * 0.15);

            // Draw paddles
            // Player paddle
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = 'rgba(0, 255, 136, 0.6)';
            ctx.shadowBlur = 10;
            ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height);
            ctx.shadowBlur = 0;

            // AI paddle
            ctx.fillStyle = '#ff6b9d';
            ctx.shadowColor = 'rgba(255, 107, 157, 0.6)';
            ctx.shadowBlur = 10;
            ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.width, aiPaddle.height);
            ctx.shadowBlur = 0;

            // Draw puck
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = 'rgba(255, 255, 0, 0.8)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function gameUpdate() {
            update();
            draw();
        }

        function updateMessage(key) {
            const msgEl = document.getElementById('gameMessage');
            msgEl.textContent = getTranslation(key);
            msgEl.className = 'game-message';
            
            if (key.includes('playerScored')) msgEl.classList.add('player-scored');
            else if (key.includes('aiScored')) msgEl.classList.add('ai-scored');
            else msgEl.classList.add('playing');
        }

        function getTranslation(key) {
            const lang = localStorage.getItem('language') || 'en';
            const translations = window.i18nData?.[lang] || window.i18nData?.en || {};
            
            const keys = key.split('.');
            let value = translations;
            for (const k of keys) {
                value = value?.[k];
            }
            return value || key;
        }

        // i18n initialization
        let currentLang = localStorage.getItem('language') || 'en';

        async function loadI18n() {
            try {
                const response = await fetch(`./i18n/${currentLang}.json`);
                window.i18nData = await response.json();
                applyTranslations();
            } catch (error) {
                console.error('Failed to load i18n:', error);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                const text = getTranslation(key);
                if (text && text !== key) {
                    el.textContent = text;
                }
            });
        }

        // Event listeners
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('language', currentLang);
            loadI18n();
        });

        document.getElementById('resetBtn').addEventListener('click', resetGame);

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => setDifficulty(btn.dataset.difficulty));
        });

        // Mouse tracking
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        // Touch tracking
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            e.preventDefault();
        }, { passive: false });

        // Start game
        loadScores();
        loadI18n();
        resetPuck();
        gameLoop = setInterval(gameUpdate, 1000 / 60); // 60 FPS
    </script>
</body>
</html>
