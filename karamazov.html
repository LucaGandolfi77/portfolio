<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Fratelli Karamazov - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: 'Merriweather', serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #111; }
        .renpy-dialogue-box { font-family: 'Merriweather', serif !important; background: rgba(10, 10, 10, 0.95) !important; border-top: 2px solid #8b0000 !important; box-shadow: 0 -5px 20px rgba(0,0,0,0.8) !important; }
        .renpy-name-label { font-family: 'Merriweather', serif !important; font-weight: bold !important; text-transform: uppercase !important; letter-spacing: 1px !important; }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Import the RenPy-Lite Library -->
<script src="assets/js/renpy-lite.js"></script>

<script>
    // Inizializzazione
    RenPy.init({ container: 'game-container' });

    // Definizione Assets
    RenPy.image('bg_monastery', '#2c3e50');
    RenPy.image('bg_house', '#3e2723');
    RenPy.image('bg_tavern', '#d35400');
    RenPy.image('bg_night', '#000000');
    RenPy.image('bg_stone', '#7f8c8d');

    // Definizione Personaggi (emoji per "sconfo")
    RenPy.define('n', '📜 Narratore', '#bdc3c7');
    RenPy.define('f', 'Fëdor P. ⚔️', '#e74c3c');
    RenPy.define('d', 'Dmitri 🔥', '#c0392b');
    RenPy.define('i', 'Ivan 🧠', '#2980b9');
    RenPy.define('a', 'Alëša ✨', '#f1c40f');
    RenPy.define('z', 'Zosima 🙏', '#ecf0f1');

    // Script arricchito con scene e emoji per azioni
    RenPy.script({
        start: [
            "scene bg_house",
            "n 'Alexèj Fëdorovic Karamazov era il terzo figlio di un proprietario terriero del nostro distretto...'",
            "n 'Ma questa è la storia dei suoi figli. E della battaglia fra Dio e il Diavolo nei loro cuori.'",
            "show f",
            "f 'Sono un buffone, signori! Un vecchio buffone, lo ammetto! Ma c\'è voluttà anche nella degradazione. ⚔️'",
            {
                choice: "Chi risponderà?",
                options: {
                    "Ivan 🧠 (L'intellettuale)": "ivan_intro",
                    "Alëša ✨ (Il novizio)": "alyosha_intro"
                }
            }
        ],

        ivan_intro: [
            "show i",
            "i 'No, non esiste Dio. 🧠'",
            "i 'Se Dio non esiste, tutto è permesso.'",
            "n 'Questa frase risuonerà come una condanna per l'anima di Ivan.'",
            "jump monastery_scene"
        ],

        alyosha_intro: [
            "show a",
            "a 'Dio esiste. ✨'",
            "a 'Pregherò per voi, padre. 🙏'",
            "jump monastery_scene"
        ],

        monastery_scene: [
            "scene bg_monastery",
            "n 'La famiglia si riunisce nella cella dello Starets Zosima.'",
            "show z",
            "z 'L'amore in azione è cosa dura.'",
            "show d",
            "d 'Perché vive un uomo simile?! 🔥'",
            {
                choice: "Dopo la discussione",
                options: {
                    "Segui Dmitri nella notte 🌙": "dmitri_confession",
                    "Rimani e parla con Grushenka ❤️": "grushenka_path",
                    "Cercare consiglio dallo Starets 🙏": "zosima_dialogue"
                }
            }
        ],

        // Dialoghi e riflessioni con lo Starets Zosima
        zosima_dialogue: [
            "scene bg_monastery",
            "show z",
            "z 'L'amore in azione è una cosa terribile e dura, paragonata all'amore nei sogni.'",
            "n 'Lo Starets parla di carità, responsabilità e della natura del perdono.'",
            "z 'Bisogna amare tutto il creato; ogni granello di sabbia e la creatura più piccola.'",
            "n 'È una voce che cerca di sanare ferite, non di giudicare.'",
            { choice: "Ascoltare o partire?", options: { "Rimanere e ascoltare 🙏": "zosima_death_reflection", "Partire per gli affari della casa": "dmitri_confession" } }
        ],

        zosima_death_reflection: [
            "scene bg_monastery",
            "show z",
            "n 'Le parole dello Starets rimangono: la sua morte e le circostanze che la circondano segneranno molti destini.'",
            "z 'La sofferenza è il miglior insegnante; accettala e non giudicarla.'",
            "n 'Citazione (trad. da Constance Garnett): "L'amore in azione è una cosa dura e terribile, confrontata con l'amore nei sogni. Chi ama davvero sopporta e soffre; egli lavora e si immola per gli altri.'",
            "n 'Lo Starets parla della misericordia come pratica quotidiana: amare gli altri, anche quando è faticoso.'",
            "n 'Lo Starets morirà poco dopo, e la comunità discuterà le sue ultime parole.'",
            { choice: "Reagire alla morte dello Starets", options: { "Partecipare al funerale": "zosima_funeral", "Ritornare alla casa": "the_tragedy" } }
        ],

        zosima_funeral: [
            "scene bg_stone",
            "n 'Il funerale dello Starets riunisce poveri e nobili; la sua figura semplice incute rispetto.'",
            "n 'Alëša parla ai presenti della misericordia e dell'unità della comunità.'",
            "a 'Ricordiamo che il perdono e la compassione sono ciò che salva gli uomini.'",
            "n 'Lo spirito della sua dottrina rimane tra la gente, anche se alcuni contestano il suo potere morale.'",
            "jump the_tragedy"
        ],

        grushenka_path: [
            "scene bg_tavern",
            "n 'Grushenka passa la notte in ozio; la sua storia si incrocia con il destino della famiglia.'",
            { choice: "Come gestire Grushenka?", options: { "Cercare di conquistarla 💘": "grushenka_conquest", "Difenderla dalle calunnie 🛡️": "katerina_path" } }
        ],

        grushenka_conquest: [
            "show f",
            "f 'Oh, Grushenka... tu accendi il cuore degli uomini. 🔥'",
            "jump the_tragedy"
        ],

        katerina_path: [
            "scene bg_house",
            "show i",
            "i 'La legge è cieca. ⚖️'",
            "jump trial_scene"
        ],

        dmitri_confession: [
            "scene bg_night",
            "show d",
            "d 'La bellezza è una cosa terribile. 🔥'",
            {
                choice: "Il destino di Dmitri",
                options: { "Cedere alla passione 💥": "passion_path", "Cercare redenzione 🙏": "redemption_path" }
            }
        ],

        passion_path: [
            "d 'Ho bisogno di tremila rubli. Per lei. 💸'",
            "jump grand_inquisitor"
        ],

        redemption_path: [
            "d 'Se solo potessi restituire quei soldi... sarei libero.'",
            "jump grand_inquisitor"
        ],

        grand_inquisitor: [
            "scene bg_tavern",
            "show i",
            "i 'Ascolta il mio poema: Il Grande Inquisitore.'",
            "n 'Ivan racconta la parabola: Cristo ritorna nella Siviglia del XVI secolo e viene arrestato dall'Inquisitore.'",
            "n 'Estratto (trad. libera da Constance Garnett): \"L'Inquisitore disse: 'Tu hai dato loro la libertà; ma loro non la vogliono. Hanno preferito il pane, i miracoli e l'autorità che toglie la responsabilità.'\'\"",
            "a 'La parabola mette in luce la contraddizione tra verità spirituale e bisogni umani.'",
            {
                choice: "Cosa fare dopo aver ascoltato",
                options: {
                    "Leggi tutto il poema (estratto)": "grand_inquisitor_long",
                    "Torna alla realtà del caso": "the_tragedy"
                }
            }
        ],

        // Versione estesa del Grande Inquisitore (estratti)
        grand_inquisitor_long: [
            "scene bg_tavern",
            "n 'Ivan recita passaggi più lunghi del suo poema.'",
            "n 'Estratto (trad. libera da Constance Garnett): "Egli (l'Inquisitore) parlò della libertà come di un fardello per l'uomo; disse che il popolo vuole sicurezza e miracoli, non la responsabilità della scelta.'",
            "n 'Estratto (trad. libera da Constance Garnett): "Noi abbiamo tolto agli uomini il peso della decisione e l'abbiamo rimpiazzato con l'autorità e il pane.'",
            "n 'Le parole dell'Inquisitore scuotono gli ascoltatori: la libertà e la dignità umana vengono messe in discussione.'",
            { choice: "Dopo la lettura", options: { "Riflettere con Alëša": "witness_alesha", "Tornare alla corte": "the_tragedy" } }
        ],
        ],

        the_tragedy: [
            "scene bg_house",
            "n 'La tragedia si compie. Fëdor Pavlovic viene trovato morto.'",
            "show i",
            "i 'Smerdyakov... mi ha detto: \"Voi avete desiderato la sua morte\". 🧠'",
            {
                choice: "Azione successiva",
                options: { "Prepararsi al processo ⚖️": "trial_scene", "Indagare Smerdyakov 🔍": "smerdyakov_investigation" }
            }
        ],

        smerdyakov_investigation: [
            "scene bg_stone",
            "n 'I sospetti si spostano su Smerdyakov.'",
            "jump smerdyakov_confession"
        ],

        smerdyakov_confession: [
            "scene bg_night",
            "n 'Smerdyakov, sotto pressione, cede e confessa.'",
            "n 'La rivelazione scuote la città.'",
            "jump smerdyakov_reveal"
        ],

        smerdyakov_reveal: [
            "scene bg_night",
            "n 'Smerdyakov confessa dettagli inaspettati. 😶‍🌫️'",
            { choice: "Reazione", options: { "Portare le prove in tribunale 🏛️": "trial_scene", "Confrontare Smerdyakov direttamente 🔍": "confront_smerdyakov" } }
        ],

        confront_smerdyakov: [
            "scene bg_house",
            "show i",
            "i 'Perché hai fatto questo? 🧠'",
            "n 'Le parole come frecce.'",
            "jump trial_scene"
        ],

        // Nuova scena: la follia di Ivan
        ivan_madness: [
            "scene bg_night",
            "show i",
            "i 'Vedo ombre che ridono e mi sussurrano: tutto è permesso. 🧠😵'",
            "jump the_tragedy"
        ],

        // Nuova scena: scelta di Grushenka
        grushenka_choice: [
            "scene bg_tavern",
            "n 'Grushenka riflette sul proprio destino.'",
            { choice: "Chi sceglierà?", options: { "Seguire il cuore ❤️": "follow_heart", "Ritrovare dignità e partire 🕊️": "leave_town" } }
        ],

        follow_heart: [
            "n 'Grushenka sceglie la passione.'",
            "jump the_tragedy"
        ],

        leave_town: [
            "n 'Grushenka parte in cerca di una vita diversa.'",
            "jump epilogue"
        ],

        brothers_reconcile: [
            "scene bg_stone",
            "show d",
            "d 'Forse il perdono non è debolezza.'",
            "show a",
            "a 'Camminiamo insieme, fratello. ✨'",
            "jump epilogue"
        ],

        trial_scene: [
            "scene bg_house",
            "n 'Il processo di Dmitri si apre fra clamore e commozione.'",
            "show d",
            "d 'Io ho amato. Ho sofferto. Ma non ho ucciso.'",
            "show i",
            "i 'Se Dio non esiste, tutto è permesso.'",
            "n 'La corte ascolta una serie di testimonianze che metteranno a nudo passioni e rancori.'",
            {
                choice: "Chiamare il primo testimone",
                options: {
                    "Katerina Ivanovna": "witness_katerina",
                    "Grushenka": "witness_grushenka",
                    "Alëša": "witness_alesha"
                }
            }
        ],

        // Testimonianze dettagliate
        witness_katerina: [
            "scene bg_house",
            "n 'Katerina Ivanovna si alza, pallida ma fiera.'",
            "n 'Katerina: "Io non cerco vendetta; voglio la verità, e non posso mentire per amore.'",
            "n 'Estratto (trad. da Constance Garnett): "Non posso accusare un uomo senza prove; non coprirò un delitto per orgoglio o per apparenza. Preferisco la verità alla reputazione.'",
            "n 'La sua testimonianza è tagliente: parla del matrimonio, dell'onore e dell'umiliazione.'",
            "jump witness_after"
        ],

        witness_grushenka: [
            "scene bg_tavern",
            "n 'Grushenka entra in aula; il suo sguardo è incerto.'",
            "n 'Grushenka: "Ho amato, ho giocato, ho sbagliato. Ma non sono un'assassina.'",
            "n 'Estratto (trad. da Constance Garnett): "La passione è un fuoco che consuma e che non chiede il permesso; io ho cercato la mia vita in mezzo alle fiamme e ho pagato il conto dei miei errori.'",
            "n 'Le sue parole toccano chi ascolta, mescolando rimorso e orgoglio.'",
            "jump witness_after"
        ],

        witness_alesha: [
            "scene bg_stone",
            "n 'Alëša si alza, calmo e misurato.'",
            "n 'Alëša: "La misericordia è più necessaria della giustizia in certi cuori.'",
            "n 'La sua voce porta un messaggio di pace e perdono.'",
            "jump witness_after"
        ],

        witness_after: [
            "n 'Dopo le prime testimonianze la tensione aumenta; l'accusa chiede di chiamare altri testimoni.'",
            {
                choice: "Proseguire",
                options: {
                    "Chiamare l'accusa e i testimoni restanti": "trial_witnesses",
                    "Confrontare Smerdyakov in aula": "confront_smerdyakov"
                }
            }
        ],

        trial_witnesses: [
            "n 'I testimoni successivi descrivono ricatti, debiti e gelosie.'",
            "n 'Vengono letti documenti e ricordati debiti: la tensione pubblica è palpabile.'",
            {
                choice: "Procedura",
                options: {
                    "Presentare le prove fisiche 🏛️": "present_evidence",
                    "Richiedere la deposizione di Smerdyakov 🔍": "smerdyakov_confession"
                }
            }
        ],

        present_evidence: [
            "scene bg_house",
            "n 'L'accusa presenta prove: lettere, ricevute, testimoni oculari.'",
            "n 'La difesa tenta di screditare alcune deposizioni.'",
            "jump dmitri_prison"
        ],

        dmitri_prison: [
            "scene bg_stone",
            "show d",
            { choice: "Cosa farà Dmitri?", options: { "Accettare la pena e cercare la pace": "redemption_end", "Continuare a ribellarsi": "final_revolt" } }
        ],

        final_revolt: [
            "n 'La rabbia di Dmitri lo porta a un ultimo atto.'",
            "jump epilogue"
        ],

        redemption_end: [
            "scene bg_monastery",
            "show a",
            "a 'La preghiera rende possibile un domani diverso.'",
            "jump brothers_reconcile"
        ],

        epilogue: [
            "scene bg_stone",
            "n 'Il funerale del piccolo Iljuša. Alëša parla ai ragazzi.'",
            "show a",
            "a 'Se un uomo porta con sé un solo buon ricordo, può salvarsi.'",
            { choice: "Fine", options: { "Ricomincia 🔁": "start", "Torna al Portfolio 🏠": "exit" } }
        ],

        exit: [
            "n 'Addio.'",
            function() { window.location.href = 'visualnovels.html'; }
        ]
    });

    RenPy.run();

</script>
</body>
</html>
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Fratelli Karamazov - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: 'Merriweather', serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #111; }
        
        /* Stile Dostoevskiano */
        .renpy-dialogue-box {
            font-family: 'Merriweather', serif !important;
            background: rgba(10, 10, 10, 0.95) !important;
            border-top: 2px solid #8b0000 !important; /* Rosso scuro */
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8) !important;
        }
        .renpy-name-label {
            font-family: 'Merriweather', serif !important;
            font-weight: bold !important;
            text-transform: uppercase !important;

    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Import the RenPy-Lite Library -->
<script src="assets/js/renpy-lite.js"></script>

<script>
    // 1. Inizializzazione
    RenPy.init({ container: 'game-container' });

    // 2. Definizione Assets (Colori per atmosfera)
    RenPy.image('bg_monastery', '#2c3e50'); // Grigio scuro/blu austero
    RenPy.image('bg_house', '#3e2723'); // Marrone scuro, opprimente
    RenPy.image('bg_tavern', '#d35400'); // Arancione scuro, caotico
    RenPy.image('bg_night', '#000000'); // Notte profonda
    RenPy.image('bg_stone', '#7f8c8d'); // Grigio pietra, malinconico

    // 3. Definizione Personaggi
    RenPy.define('n', '📜 Narratore', '#bdc3c7');
    RenPy.define('f', 'Fëdor P. ⚔️', '#e74c3c'); // Rosso, passione sregolata
    RenPy.define('d', 'Dmitri 🔥', '#c0392b'); // Rosso scuro, impulsivo
    RenPy.define('i', 'Ivan 🧠', '#2980b9'); // Blu freddo, intellettuale
    RenPy.define('a', 'Alëša ✨', '#f1c40f'); // Oro, spirituale
    RenPy.define('z', 'Zosima 🙏', '#ecf0f1'); // Bianco, santo

    // 4. Lo Script
    RenPy.script({
        start: [
            "scene bg_house",
            "n 'Alexèj Fëdorovic Karamazov era il terzo figlio di un proprietario terriero del nostro distretto, Fëdor Pavlovic Karamazov...'",
            "n 'Un uomo noto per la sua fine tragica e oscura, avvenuta tredici anni fa, e che tutti ricordano ancora.'",
            "n 'Ma questa è la storia dei suoi figli. E della la battaglia tra Dio e il Diavolo nei loro cuori.'",
            "show f",
            "f 'Sono un buffone, signori! Un vecchio buffone, lo ammetto! Ma c\'è voluttà anche nella degradazione.'",
            "f 'Ditemi, figli miei, esiste Dio o no?'",
            {
                choice: "Chi risponderà?",
                options: {
                    "Ivan (L'intellettuale)": "ivan_intro",
                    "Alëša (Il novizio)": "alyosha_intro"
                }
            }
        ],

        ivan_intro: [
            "show i",
            "i 'No, non esiste Dio.'",
            "f 'E l'immortalità? Esiste?'",
            "i 'Non esiste neppure l'immortalità.'",
            "f 'Allora tutto è permesso?'",
            "i 'Se Dio non esiste, tutto è permesso.'",
            "n 'Questa frase risuonerà come una condanna per l'anima di Ivan.'",
            "jump monastery_scene"
        ],

        alyosha_intro: [
            "show a",
            "a 'Dio esiste. E l'immortalità esiste.'",
            "f 'Ah, Alëša! Tu sei un angelo. Ma anche gli angeli possono cadere.'",
            "a 'Pregherò per voi, padre.'",
            "jump monastery_scene"
        ],

        monastery_scene: [
            "scene bg_monastery",
            "n 'La famiglia si riunisce nella cella dello Starets Zosima, sperando di risolvere una disputa ereditaria tra Fëdor e Dmitri.'",
            "show z",
            "z 'L'amore in azione è una cosa terribile e dura, paragonato all'amore nei sogni.'",
            "show d",
            "d 'Perché vive un uomo simile?!'",
            "n 'Dmitri esplode contro suo padre. La tensione è palpabile.'",
            "f 'Mi sfida! Vuole uccidermi per quella donna, Grushenka!'",
            "d 'State attento, vecchio! Non vi garantisco nulla!'",
            "n 'Improvvisamente, lo Starets si alza e si inchina fino a terra davanti a Dmitri.'",
            "z 'Mi inchino davanti alla grande sofferenza che ti attende.'",
            { choice: "Dopo la discussione", options: { "Segui Dmitri nella notte": "dmitri_confession", "Rimanere e parlare con Grushenka": "grushenka_path" } }
        ],

        grushenka_path: [
            "scene bg_tavern",
            "n 'Grushenka passa la notte in ozio; la sua storia si incrocia con il destino della famiglia.'",
            "show f",
            "f 'Oh, Grushenka... tu accendi il cuore degli uomini come un fuoco.'",
            "n 'Una scelta presenta due possibili sviluppi.'",
            { choice: "Come gestire Grushenka?", options: { "Cercare di conquistarla": "grushenka_conquest", "Difenderla dalle calunnie": "katerina_path" } }
        ],

        grushenka_conquest: [
            "n 'Fëdor si avvicina a Grushenka con falsa tenerezza.'",
            "f 'Tu sei la domanda e la risposta, mia cara.'",
            "n 'Ma i pettegolezzi e i sospetti si intensificano.'",
            "jump the_tragedy"
        ],

        katerina_path: [
            "scene bg_house",
            "n 'Katerina Ivanovna, offesa e desolata, cerca la verità e la reputazione.'",
            "show i",
            "i 'Non posso condannare chi ama, ma la legge è cieca.'",
            "n 'Katerina si trova intrappolata tra orgoglio e dignità.'",
            "jump trial_scene"
        ],

        dmitri_confession: [
            "scene bg_night",
            "n 'Dmitri vaga nella notte, tormentato.'",
            "show d",
            "d 'La bellezza è una cosa terribile. È lì che il Diavolo lotta con Dio, e il campo di battaglia è il cuore degli uomini.'",
            "d 'Io sono un insetto, Alëša. Un insetto sensuale. Ma amo la vita!'",
            "d 'Posso cadere nell'abisso, ma anche dal fondo dell'abisso canterò un inno a Dio.'",
            {
                choice: "Il destino di Dmitri",
                options: {
                    "Cedere alla passione": "passion_path",
                    "Cercare redenzione": "redemption_path"
                }
            }
        ],

        passion_path: [
            "d 'Ho bisogno di tremila rubli. Per lei. Per Grushenka. Se non li trovo...'",
            "n 'Il pensiero oscuro si fa strada. Il pestello di ottone nella tasca.'",
            "jump grand_inquisitor"
        ],

        redemption_path: [
            "d 'Se solo potessi restituire quei soldi a Katerina Ivanovna... sarei libero.'",
            "d 'Ma sono debole. Prega per me, fratello.'",
            "jump grand_inquisitor"
        ],

        grand_inquisitor: [
            "scene bg_tavern",
            "n 'Ivan e Alëša si incontrano in una taverna. Ivan espone la sua ribellione.'",
            "show i",
            "i 'Non è che non accetti Dio, Alëša. È che gli restituisco rispettosamente il biglietto d'ingresso.'",
            "i 'Ascolta il mio poema: Il Grande Inquisitore.'",
            "n 'Nella Siviglia del XVI secolo, Cristo ritorna. L'Inquisitore lo fa arrestare.'",
            "i 'Perché sei venuto a disturbarci? Tu hai dato all'uomo la libertà, ma l'uomo non vuole la libertà. Vuole il pane.'",

            "i 'È questa la sua tragedia. Soffrire per l'umanità senza credere.'",
            "n 'Cristo non risponde. Si avvicina al vecchio e lo bacia dolcemente sulle labbra esangui.'",

        smerdyakov_investigation: [
            "scene bg_stone",
            "n 'I sospetti si spostano su Smerdyakov, il servo enigmatico.'",

            "jump smerdyakov_confession"

            "show d",

            "n 'La rivelazione scuote la città e mette in moto il processo.'",
            "jump trial_scene"
        ],

        trial_scene: [
            "scene bg_house",
            "n 'Il processo di Dmitri si apre fra clamore e commozione.'",

        trial_witnesses: [
            "n 'I testimoni parlano: Katerina, Grushenka, amici e nemici.'",
            "show a",
            "a 'La verità è spesso più complicata del desiderio.'",
            "n 'Il verdetto sembra già scritto, ma la pietà compare dove meno te lo aspetti.'",
            "jump dmitri_prison"
        ],

        dmitri_prison: [
            "scene bg_stone",
            "n 'Dmitri è in prigione, ma la sua anima cerca redenzione.'",
            "show d",
            "d 'Se soffro per l'amore che ho dato, allora non potrò mai rimpiangere di aver amato.'",
            { choice: "Cosa farà Dmitri?", options: { "Accettare la pena e cercare la pace": "redemption_end", "Continuare a ribellarsi": "final_revolt" } }
        ],

        final_revolt: [
            "n 'La rabbia di Dmitri lo porta a un ultimo atto di disperazione.'",
            "d 'Meglio morire libero che vivere come un prigioniero dell'anima.'",
            "jump epilogue"
        ],

        redemption_end: [
            "scene bg_monastery",
            "n 'Con l'aiuto di Alëša e della comunità, Dmitri trova un raro sentiero di pace.'",
            "show a",
            "a 'La preghiera non cancella il passato, ma rende possibile un domani diverso.'",
            "n 'Il perdono non è scontato, ma la possibilità di rinsavire è un dono.'",
            "jump epilogue"

        the_tragedy_end: [
            "scene bg_house",
            "n 'Le conseguenze delle passioni umane si dispiegano, e la verità trova molte facce.'",
            "jump epilogue"

        epilogue: [
            "scene bg_stone",
            "n 'Il funerale del piccolo Iljuša. Alëša parla ai ragazzi presso la grande pietra.'",
            "show a",
            "a 'Non dimenticate mai quanto siamo stati buoni qui, tutti insieme, uniti da un buon sentimento.'",
            "a 'Un ricordo sacro, conservato fin dall'infanzia, è forse la migliore educazione.'",
            "a 'Se un uomo porta con sé un solo buon ricordo, può salvarsi.'",
            "n 'E così, mano nella mano, andiamo avanti. Sempre così, per tutta la vita.'",
            "n 'Urrà per Karamazov!'",
            { choice: "Fine", options: { "Ricomincia": "start", "Torna al Portfolio": "exit" } }
        ],

        exit: [
            "n 'Addio.'",
