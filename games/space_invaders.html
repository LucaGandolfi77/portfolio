<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Portfolio</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            touch-action: none; /* Prevent zoom/scroll on mobile */
        }

        .navbar {
            width: 100%;
            padding: 1rem 2rem;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-container {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        canvas {
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            max-width: 100%;
            image-rendering: pixelated; /* Retro look */
        }

        .controls-info {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
        }

        .mobile-controls {
            display: none;
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .d-pad {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .shoot-btn {
            background-color: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
            width: 70px;
            height: 70px;
        }

        .shoot-btn:active {
            background-color: rgba(255, 0, 0, 0.4);
        }

        @media (max-width: 800px) {
            .mobile-controls {
                display: flex;
            }
            .controls-info {
                display: none;
            }
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 2px solid #0f0;
            text-align: center;
            border-radius: 10px;
            z-index: 10;
            display: none;
        }

        .btn {
            background-color: #0f0;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #00cc00;
        }

        h1 {
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <script src="top_buttons.js"></script>
    
    <div class="game-container">
        <div class="game-header">
            <div><span data-i18n="games.space_invaders.score">Score</span>: <span id="score">0</span></div>
            <div><span data-i18n="games.space_invaders.lives">Lives</span>: <span id="lives">3</span></div>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div id="startScreen" style="display: block;">
                <h1 data-i18n="games.space_invaders.title">SPACE INVADERS</h1>
                <p data-i18n="games.space_invaders.description">Defend Earth from the alien invasion!</p>
                <button class="btn" id="startBtn" data-i18n="games.space_invaders.start">START GAME</button>
            </div>

            <div id="gameOverScreen">
                <h1 data-i18n="games.space_invaders.gameOver">GAME OVER</h1>
                <p><span data-i18n="games.space_invaders.finalScore">Final Score</span>: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn" data-i18n="games.space_invaders.playAgain">PLAY AGAIN</button>
            </div>
        </div>

        <div style="margin-top: 10px; text-align: center;">
            <button id="autoFireBtn" class="btn" style="font-size: 0.9rem; padding: 8px 16px; background-color: #333; border: 1px solid #666; margin-top: 0;">AUTO FIRE: OFF</button>
        </div>

        <div class="controls-info">
            <span data-i18n="games.space_invaders.controls">Controls: Arrow Keys to Move, SPACE to Shoot</span>
        </div>

        <div class="mobile-controls">
            <div class="d-pad">
                <div class="control-btn" id="leftBtn"><i class="fas fa-arrow-left"></i></div>
                <div class="control-btn" id="rightBtn"><i class="fas fa-arrow-right"></i></div>
            </div>
            <div class="control-btn shoot-btn" id="shootBtn"><i class="fas fa-crosshairs"></i></div>
        </div>
    </div>

    <script>
        // Game Constants
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const PLAYER_WIDTH = 40;
        const PLAYER_HEIGHT = 20;
        const PLAYER_SPEED = 5;
        const BULLET_SPEED = 7;
        const ALIEN_ROWS = 5;
        const ALIEN_COLS = 11;
        const ALIEN_WIDTH = 30;
        const ALIEN_HEIGHT = 20;
        const ALIEN_PADDING = 15;
        const ALIEN_OFFSET_TOP = 50;
        const ALIEN_OFFSET_LEFT = 50;

        // Game State
        let canvas, ctx;
        let gameLoopId;
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isPaused = true;
        let isAutoFire = false;
        
        // Entities
        let player = {
            x: CANVAS_WIDTH / 2 - PLAYER_WIDTH / 2,
            y: CANVAS_HEIGHT - PLAYER_HEIGHT - 10,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            dx: 0,
            bullets: [],
            cooldown: 0,
            powerups: {
                rapidFire: false,
                multiShot: false,
                shield: false
            },
            powerupTimer: 0
        };

        let aliens = [];
        let alienBullets = [];
        let particles = [];
        let powerups = [];
        let alienDirection = 1; // 1 right, -1 left
        let alienSpeed = 1;
        let alienDropDistance = 20;

        // Input State
        let keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        // Initialization
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Resize handling
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Event Listeners
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');

            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startGame();
            }, { passive: false });

            restartBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startGame();
            }, { passive: false });
            
            const autoFireBtn = document.getElementById('autoFireBtn');
            autoFireBtn.addEventListener('click', () => {
                isAutoFire = !isAutoFire;
                autoFireBtn.textContent = `AUTO FIRE: ${isAutoFire ? 'ON' : 'OFF'}`;
                autoFireBtn.style.backgroundColor = isAutoFire ? '#0f0' : '#333';
                autoFireBtn.style.color = isAutoFire ? '#000' : '#fff';
            });

            // Mobile Controls
            setupMobileControls();

            // Load translations
            loadTranslations();
        };

        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            const maxWidth = container.clientWidth - 40; // padding
            const scale = Math.min(1, maxWidth / CANVAS_WIDTH);
            
            canvas.style.width = (CANVAS_WIDTH * scale) + 'px';
            canvas.style.height = (CANVAS_HEIGHT * scale) + 'px';
        }

        function setupMobileControls() {
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const shootBtn = document.getElementById('shootBtn');

            const handleTouch = (key, pressed) => (e) => {
                e.preventDefault();
                // Use same hold-to-fire mechanism for touch: set key state
                keys[key] = pressed;
            };

            leftBtn.addEventListener('touchstart', handleTouch('ArrowLeft', true));
            leftBtn.addEventListener('touchend', handleTouch('ArrowLeft', false));
            
            rightBtn.addEventListener('touchstart', handleTouch('ArrowRight', true));
            rightBtn.addEventListener('touchend', handleTouch('ArrowRight', false));
            
            shootBtn.addEventListener('touchstart', handleTouch('Space', true));
            shootBtn.addEventListener('touchend', handleTouch('Space', false));
        }

        function initAliens() {
            aliens = [];
            for (let c = 0; c < ALIEN_COLS; c++) {
                for (let r = 0; r < ALIEN_ROWS; r++) {
                    aliens.push({
                        x: (c * (ALIEN_WIDTH + ALIEN_PADDING)) + ALIEN_OFFSET_LEFT,
                        y: (r * (ALIEN_HEIGHT + ALIEN_PADDING)) + ALIEN_OFFSET_TOP,
                        width: ALIEN_WIDTH,
                        height: ALIEN_HEIGHT,
                        status: 1, // 1 = alive, 0 = dead
                        row: r
                    });
                }
            }
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            
            score = 0;
            lives = 3;
            alienSpeed = 1;
            updateUI();
            
            player.x = CANVAS_WIDTH / 2 - PLAYER_WIDTH / 2;
            player.bullets = [];
            player.powerups = { rapidFire: false, multiShot: false, shield: false };
            player.powerupTimer = 0;
            alienBullets = [];
            particles = [];
            powerups = [];
            
            initAliens();
            
            isGameOver = false;
            isPaused = false;
            
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoop();
        }

        function handleKeyDown(e) {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space') {
                // Hold-to-fire: mark Space as pressed; shooting occurs in update()
                keys.Space = true;
                if (e.cancelable) e.preventDefault();
            }
        }

        function handleKeyUp(e) {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'Space') {
                keys.Space = false;
                if (e.cancelable) e.preventDefault();
            }
        }

        function shootBullet() {
            const x = player.x + player.width / 2 - 2;
            const y = player.y;
            
            // Center bullet
            player.bullets.push({
                x: x,
                y: y,
                width: 4,
                height: 10,
                active: true,
                vx: 0
            });

            if (player.powerups.multiShot) {
                player.bullets.push({ x: x - 10, y: y + 5, width: 4, height: 10, active: true, vx: -1 });
                player.bullets.push({ x: x + 10, y: y + 5, width: 4, height: 10, active: true, vx: 1 });
            }

            player.cooldown = player.powerups.rapidFire ? 10 : 20;
        }

        function spawnPowerup(x, y) {
            const types = ['rapidFire', 'multiShot', 'shield'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: x,
                y: y,
                width: 20,
                height: 20,
                type: type,
                active: true
            });
        }

        function activatePowerup(type) {
            if (type === 'shield') {
                player.powerups.shield = true;
            } else {
                player.powerups[type] = true;
                player.powerupTimer = 600; // 10 seconds at 60fps
            }
            // Visual feedback
            createExplosion(player.x, player.y, '#0ff');
        }

        function update() {
            if (isPaused || isGameOver) return;

            // Auto Fire and hold-to-fire (Space key / touch)
            if ((isAutoFire || keys.Space) && player.cooldown <= 0) {
                shootBullet();
            }

            // Player Movement
            if (keys.ArrowLeft && player.x > 0) {
                player.x -= PLAYER_SPEED;
            }
            if (keys.ArrowRight && player.x < CANVAS_WIDTH - player.width) {
                player.x += PLAYER_SPEED;
            }

            // Cooldown
            if (player.cooldown > 0) player.cooldown--;

            // Player Bullets
            player.bullets.forEach(bullet => {
                bullet.y -= BULLET_SPEED;
                if (bullet.vx) bullet.x += bullet.vx;
                if (bullet.y < 0) bullet.active = false;
            });
            player.bullets = player.bullets.filter(b => b.active);

            // Powerups
            powerups.forEach(p => {
                p.y += 2;
                if (p.y > CANVAS_HEIGHT) p.active = false;
                
                if (rectIntersect(p.x, p.y, p.width, p.height, player.x, player.y, player.width, player.height)) {
                    activatePowerup(p.type);
                    p.active = false;
                    score += 50;
                }
            });
            powerups = powerups.filter(p => p.active);

            if (player.powerupTimer > 0) {
                player.powerupTimer--;
                if (player.powerupTimer <= 0) {
                    player.powerups.rapidFire = false;
                    player.powerups.multiShot = false;
                }
            }

            // Alien Movement
            let hitEdge = false;
            let activeAliens = aliens.filter(a => a.status === 1);
            
            if (activeAliens.length === 0) {
                // Level cleared - respawn faster
                alienSpeed += 0.5;
                initAliens();
                return;
            }

            activeAliens.forEach(alien => {
                alien.x += alienSpeed * alienDirection;
                if (alien.x + alien.width > CANVAS_WIDTH - 10 || alien.x < 10) {
                    hitEdge = true;
                }
            });

            if (hitEdge) {
                alienDirection *= -1;
                activeAliens.forEach(alien => {
                    alien.y += alienDropDistance;
                    // Check game over if aliens reach bottom
                    if (alien.y + alien.height >= player.y) {
                        gameOver();
                    }
                });
            }

            // Alien Shooting
            if (Math.random() < 0.02 + (score * 0.00001)) { // Chance increases with score
                const shooter = activeAliens[Math.floor(Math.random() * activeAliens.length)];
                alienBullets.push({
                    x: shooter.x + shooter.width / 2,
                    y: shooter.y + shooter.height,
                    width: 4,
                    height: 10,
                    active: true
                });
            }

            // Alien Bullets
            alienBullets.forEach(bullet => {
                bullet.y += BULLET_SPEED;
                if (bullet.y > CANVAS_HEIGHT) bullet.active = false;
                
                if (rectIntersect(bullet.x, bullet.y, bullet.width, bullet.height,
                                player.x, player.y, player.width, player.height)) {
                    bullet.active = false;
                    hitPlayer();
                }
            });
            alienBullets = alienBullets.filter(b => b.active);

            // Collisions: Player Bullets vs Aliens
            player.bullets.forEach(bullet => {
                activeAliens.forEach(alien => {
                    if (bullet.active && rectIntersect(bullet.x, bullet.y, bullet.width, bullet.height,
                                                     alien.x, alien.y, alien.width, alien.height)) {
                        bullet.active = false;
                        alien.status = 0;
                        score += 10 * (alienSpeed);
                        createExplosion(alien.x + alien.width/2, alien.y + alien.height/2, '#0f0');
                        
                        // Drop Powerup
                        if (Math.random() < 0.1) {
                            spawnPowerup(alien.x, alien.y);
                        }
                        updateUI();
                    }
                });
            });

            // Particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function hitPlayer() {
            if (player.powerups.shield) {
                player.powerups.shield = false;
                createExplosion(player.x + player.width/2, player.y + player.height/2, '#00f');
                return;
            }

            createExplosion(player.x + player.width/2, player.y + player.height/2, '#fff');
            lives--;
            updateUI();
            if (lives <= 0) {
                gameOver();
            } else {
                player.x = CANVAS_WIDTH / 2 - PLAYER_WIDTH / 2;
                player.powerups.rapidFire = false;
                player.powerups.multiShot = false;
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 20,
                    color: color
                });
            }
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('finalScore').textContent = Math.floor(score);
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        function updateUI() {
            document.getElementById('score').textContent = Math.floor(score);
            document.getElementById('lives').textContent = lives;
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Stars (Background)
            ctx.fillStyle = '#fff';
            for(let i=0; i<50; i++) {
                if(Math.random() > 0.9) {
                    ctx.fillRect(Math.random() * CANVAS_WIDTH, Math.random() * CANVAS_HEIGHT, 1, 1);
                }
            }

            // Draw Player
            ctx.fillStyle = player.powerups.shield ? '#00f' : '#0f0'; // Blue if shielded
            // Simple ship shape
            ctx.fillRect(player.x, player.y + 10, player.width, 10);
            ctx.fillRect(player.x + 15, player.y, 10, 10);

            // Draw Powerups
            powerups.forEach(p => {
                if (p.type === 'rapidFire') ctx.fillStyle = '#ff0'; // Yellow
                else if (p.type === 'multiShot') ctx.fillStyle = '#0ff'; // Cyan
                else if (p.type === 'shield') ctx.fillStyle = '#00f'; // Blue
                
                ctx.beginPath();
                ctx.arc(p.x + p.width/2, p.y + p.height/2, p.width/2, 0, Math.PI * 2);
                ctx.fill();
                
                // Icon/Text
                ctx.fillStyle = '#000';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let icon = 'P';
                if (p.type === 'rapidFire') icon = '⚡';
                else if (p.type === 'multiShot') icon = '⫚';
                else if (p.type === 'shield') icon = '🛡️';
                ctx.fillText(icon, p.x + p.width/2, p.y + p.height/2);
            });

            // Draw Aliens
            aliens.forEach(alien => {
                if (alien.status === 1) {
                    ctx.fillStyle = '#fff';
                    // Simple alien shape
                    const x = alien.x;
                    const y = alien.y;
                    const w = alien.width;
                    const h = alien.height;
                    
                    // Body
                    ctx.fillRect(x + 5, y + 5, w - 10, h - 10);
                    // Arms
                    ctx.fillRect(x, y + 8, 5, 8);
                    ctx.fillRect(x + w - 5, y + 8, 5, 8);
                    // Eyes (black)
                    ctx.fillStyle = '#000';
                    ctx.fillRect(x + 8, y + 8, 4, 4);
                    ctx.fillRect(x + w - 12, y + 8, 4, 4);
                }
            });

            // Draw Bullets
            ctx.fillStyle = '#0f0';
            player.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            ctx.fillStyle = '#f00';
            alienBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 20;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1;
            });
        }

        function gameLoop() {
            update();
            draw();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
        }

        // Simple translation loader (copied from other games)
        async function loadTranslations() {
            const userLang = navigator.language || navigator.userLanguage;
            const lang = userLang.startsWith('it') ? 'it' : 
                         userLang.startsWith('es') ? 'es' : 
                         userLang.startsWith('fr') ? 'fr' : 
                         userLang.startsWith('de') ? 'de' : 
                         userLang.startsWith('ru') ? 'ru' : 
                         userLang.startsWith('ja') ? 'ja' : 
                         userLang.startsWith('zh') ? 'zh' : 
                         userLang.startsWith('ar') ? 'ar' : 'en';
            
            try {
                const response = await fetch(`i18n/${lang}.json`);
                const translations = await response.json();
                applyTranslations(translations);
            } catch (e) {
                console.error('Could not load translations', e);
                // Fallback to English if needed
                if (lang !== 'en') {
                    const response = await fetch(`i18n/en.json`);
                    const translations = await response.json();
                    applyTranslations(translations);
                }
            }
        }

        function applyTranslations(translations) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const keys = key.split('.');
                let value = translations;
                for (const k of keys) {
                    value = value[k];
                }
                if (value) {
                    element.textContent = value;
                }
            });
        }
    </script>
</body>
</html>
