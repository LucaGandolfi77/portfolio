<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b2b22">
    <meta name="description" content="Yatzee Solo — sfida la CPU a tre livelli di difficoltà: lancia, blocca i dadi e compila il punteggio.">
    <title>Yatzee Solo — Dark Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --felt-1: #0d3227;
            --felt-2: #114636;
            --felt-3: #071f18;
            --gold: #f5c451;
            --gold-soft: #ffe3a3;
            --p1: #34d399;
            --p1-soft: rgba(52, 211, 153, 0.14);
            --p2: #fbbf24;
            --p2-soft: rgba(251, 191, 36, 0.14);
            --text: #e9f4ee;
            --muted: rgba(233, 244, 238, 0.58);
            --panel: rgba(6, 27, 21, 0.55);
            --line: rgba(255, 255, 255, 0.09);
            --line-strong: rgba(255, 255, 255, 0.18);
            --shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button { font: inherit; color: inherit; appearance: none; }

        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(165deg, var(--felt-1) 0%, var(--felt-2) 55%, var(--felt-3) 100%);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 38%, transparent 45%, rgba(0, 0, 0, 0.42) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Topbar */
        .topbar {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
            background: rgba(5, 28, 21, 0.72);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .back-btn {
            width: 38px; height: 38px; min-width: 38px;
            display: grid; place-items: center;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255,255,255,.05);
            color: var(--gold-soft);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .back-btn:active { background: rgba(255,255,255,.14); }
        .title {
            flex: 1;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-soft);
            text-align: center;
        }
        .top-actions { display: flex; align-items: center; gap: 6px; }
        .icon-btn, .text-btn {
            border: 1px solid var(--line);
            background: rgba(255,255,255,.05);
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .icon-btn {
            width: 38px; height: 38px; min-width: 38px;
            display: grid; place-items: center;
            color: var(--gold-soft);
        }
        .icon-btn svg { width: 19px; height: 19px; fill: currentColor; }
        .icon-btn .slash { display: none; }
        .icon-btn.muted .wave { display: none; }
        .icon-btn.muted .slash { display: block; }
        .text-btn {
            padding: 9px 12px;
            font-size: .78rem;
            font-weight: 800;
            color: var(--text);
        }
        .icon-btn:active, .text-btn:active { background: rgba(255,255,255,.15); transform: scale(.96); }

        /* Game layout */
        .game {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .panel {
            background: var(--panel);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        /* Players */
        .players { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; flex-shrink: 0; }
        .player-card {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 11px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--panel);
            position: relative;
            overflow: hidden;
            transition: border-color .25s, box-shadow .25s, background .25s, transform .25s;
        }
        .player-card.active { transform: translateY(-1px); }
        .player-card.p1.active {
            border-color: var(--p1);
            background: var(--p1-soft);
            box-shadow: 0 0 0 1px var(--p1), 0 8px 26px rgba(52,211,153,.18);
        }
        .player-card.p2.active {
            border-color: var(--p2);
            background: var(--p2-soft);
            box-shadow: 0 0 0 1px var(--p2), 0 8px 26px rgba(251,113,133,.18);
        }
        .avatar {
            width: 36px; height: 36px; min-width: 36px;
            border-radius: 50%;
            display: grid; place-items: center;
            font-weight: 800; font-size: .95rem;
            background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
            border: 1px solid var(--line-strong);
        }
        .p1 .avatar { color: var(--p1); }
        .p2 .avatar { color: var(--p2); }
        .player-meta { flex: 1; min-width: 0; }
        .player-name {
            font-size: .74rem; font-weight: 700; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .player-card.active .player-name { color: var(--text); }
        .diff-tag {
            display: inline-block;
            font-size: .56rem; font-weight: 800; letter-spacing: .8px;
            color: var(--p2); border: 1px solid rgba(251,191,36,.45);
            border-radius: 5px; padding: 1px 4px; margin-left: 4px;
        }
        .diff-badge { color: var(--p2); border-color: rgba(251,191,36,.4); font-size: .74rem; }
        .diff-badge:active { background: rgba(251,191,36,.14); }
        .player-score { font-size: 1.45rem; font-weight: 800; line-height: 1.1; }
        .p1 .player-score { color: var(--p1); }
        .p2 .player-score { color: var(--p2); }

        /* Status strip */
        .status-strip {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-size: .68rem; color: var(--muted);
            min-height: 16px;
            padding: 0 4px;
        }
        .turn-badge {
            font-weight: 800; letter-spacing: .6px;
            padding: 3px 9px; border-radius: 99px;
            border: 1px solid var(--line); opacity: 0;
            transition: opacity .3s, transform .3s;
            transform: translateY(-4px);
        }
        .turn-badge.show { opacity: 1; transform: translateY(0); }
        .turn-badge.p1 { color: var(--p1); border-color: var(--p1); background: var(--p1-soft); }
        .turn-badge.p2 { color: var(--p2); border-color: var(--p2); background: var(--p2-soft); }

        /* Dice */
        .dice-panel { flex-shrink: 0; padding: 12px 12px 11px; }
        .dice-row {
            display: flex; justify-content: center; gap: clamp(6px, 2.2vw, 12px);
            flex-wrap: wrap; margin-bottom: 11px;
        }
        .die {
            width: clamp(46px, 13.5vw, 60px);
            aspect-ratio: 1;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.75);
            background: linear-gradient(145deg, #fffdf5, #e6e0cd);
            box-shadow: 0 5px 0 #a39b84, 0 10px 18px rgba(0,0,0,.34), inset 0 2px 2px rgba(255,255,255,.9);
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform .16s, box-shadow .16s, opacity .2s;
            overflow: hidden;
        }
        .die:disabled { opacity: 1; cursor: default; }
        .die.idle { opacity: .32; }
        .die.idle::after {
            content: '?'; position: absolute; inset: 0;
            display: grid; place-items: center;
            font-size: 1.5rem; font-weight: 800; color: rgba(255,255,255,.45);
        }
        .die.idle .die-face { display: none !important; }
        .die.held {
            transform: translateY(3px) scale(.97);
            box-shadow: 0 2px 0 var(--gold), 0 0 0 2px var(--gold), 0 8px 20px rgba(245,196,81,.3), inset 0 2px 2px rgba(255,255,255,.9);
        }
        .die.held::before {
            content: '🔒'; position: absolute; right: 2px; top: 0;
            font-size: .6rem; z-index: 3;
        }
        .die.rolling {
            animation: tumble .5s cubic-bezier(.32,.08,.2,1) infinite;
        }
        @keyframes tumble {
            0%   { transform: translateY(0) rotate(0deg) scale(1); }
            25%  { transform: translateY(-11px) rotate(88deg) scale(1.06); }
            50%  { transform: translateY(-3px) rotate(176deg) scale(.95); }
            75%  { transform: translateY(-12px) rotate(268deg) scale(1.04); }
            100% { transform: translateY(0) rotate(360deg) scale(1); }
        }
        .die-face {
            position: absolute; inset: 0;
            display: none;
            padding: 17%;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            place-items: center;
        }
        .die.face-1 .die-face[data-face='1'],
        .die.face-2 .die-face[data-face='2'],
        .die.face-3 .die-face[data-face='3'],
        .die.face-4 .die-face[data-face='4'],
        .die.face-5 .die-face[data-face='5'],
        .die.face-6 .die-face[data-face='6'] { display: grid; }
        .pip {
            width: 78%; height: 78%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #4b5563, #0f172a 75%);
            box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.55);
        }

        /* Controls */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 7px; }
        .roll-btn {
            width: 100%; max-width: 280px;
            padding: 12px 20px;
            border: none; border-radius: 99px;
            font-size: 1rem; font-weight: 800; letter-spacing: .5px;
            color: #2a1a00;
            background: linear-gradient(145deg, #ffe08a, var(--gold));
            box-shadow: 0 5px 0 #a9791b, 0 10px 20px rgba(245,196,81,.24);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform .1s, box-shadow .1s, filter .2s;
        }
        .roll-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #a9791b; }
        .roll-btn:disabled { filter: grayscale(.7) brightness(.7); cursor: not-allowed; box-shadow: none; }
        .rolls { display: flex; align-items: center; gap: 8px; font-size: .72rem; color: var(--muted); font-weight: 600; }
        .roll-dots { display: flex; gap: 4px; }
        .roll-dots i {
            width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,255,255,.18);
            transition: background .2s, box-shadow .2s;
        }
        .roll-dots i.on { background: var(--gold); box-shadow: 0 0 8px rgba(245,196,81,.6); }

        /* Scorecard */
        .card-panel { flex: 1; min-height: 0; display: flex; }
        .scorecard { flex: 1; min-height: 0; overflow-y: auto; border-radius: 16px; }
        .scorecard::-webkit-scrollbar { width: 5px; }
        .scorecard::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 99px; }
        .score-row {
            display: grid;
            grid-template-columns: minmax(108px, 1.7fr) 1fr 1fr;
            border-bottom: 1px solid var(--line);
            font-size: .82rem;
        }
        .score-row:last-child { border-bottom: none; }
        .score-header {
            position: sticky; top: 0; z-index: 5;
            background: rgba(8, 38, 29, .94);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            font-weight: 800; font-size: .7rem; letter-spacing: 1px;
            text-transform: uppercase; color: var(--muted);
        }
        .score-header > div { padding: 9px 8px; text-align: center; }
        .score-header > div:first-child { text-align: left; padding-left: 12px; }
        .score-header > div:nth-child(2) { color: var(--p1); }
        .score-header > div:nth-child(3) { color: var(--p2); }
        .cat-name {
            padding: 9px 10px 9px 12px;
            display: flex; align-items: center; gap: 6px;
            color: rgba(233,244,238,.82);
        }
        .score-cell {
            min-height: 39px;
            border: none; border-left: 1px solid var(--line);
            background: transparent;
            display: grid; place-items: center;
            font-weight: 800; font-size: .86rem;
            cursor: pointer;
            position: relative;
            transition: background .18s, color .18s;
        }
        .score-cell:disabled { cursor: default; }
        .score-cell.p1.potential { color: rgba(52,211,153,.42); }
        .score-cell.p2.potential { color: rgba(251,113,133,.42); }
        .score-cell.p1:not(:disabled):hover { background: var(--p1-soft); }
        .score-cell.p2:not(:disabled):hover { background: var(--p2-soft); }
        .score-cell.potential.suggest, .score-cell.suggest.p1, .score-cell.suggest.p2 { color: var(--gold); background: rgba(245,196,81,.12); }
        .score-cell.suggest::after {
            content: '★'; position: absolute; top: 2px; right: 4px;
            font-size: .5rem; color: var(--gold);
        }
        .score-cell.filled { cursor: default; }
        .score-cell.filled.p1 { color: var(--p1); background: rgba(52,211,153,.07); }
        .score-cell.filled.p2 { color: var(--p2); background: rgba(251,113,133,.07); }
        .score-cell.bonus-value.earned { color: var(--gold); }
        .bonus-row, .total-row { background: rgba(255,255,255,.045); }
        .bonus-row .cat-name { flex-wrap: wrap; gap: 4px 6px; }
        .mini-bar {
            width: 62px; height: 5px; border-radius: 99px;
            background: rgba(255,255,255,.12); overflow: hidden;
        }
        .mini-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--p1), var(--gold)); transition: width .4s; }
        .bonus-hint { font-size: .6rem; color: var(--muted); width: 100%; }
        .total-row { font-weight: 800; font-size: .95rem; border-top: 1px solid var(--line-strong); }
        .total-row .player-score-cell.p1 { color: var(--p1); }
        .total-row .player-score-cell.p2 { color: var(--p2); }

        /* Toast, pops, confetti */
        .toast {
            position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 14px);
            background: rgba(4, 24, 18, .95);
            border: 1px solid var(--line-strong);
            color: var(--gold-soft);
            padding: 9px 18px; border-radius: 99px;
            font-size: .8rem; font-weight: 700;
            z-index: 200; opacity: 0; pointer-events: none;
            transition: opacity .25s, transform .25s;
            max-width: 90vw; text-align: center;
        }
        .toast.on { opacity: 1; transform: translate(-50%, 0); }
        .pop-layer, .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 250; overflow: hidden; }
        .score-pop {
            position: absolute; transform: translate(-50%, -50%);
            font-size: 1.15rem; font-weight: 800;
            color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,.6);
            animation: popUp .95s ease-out forwards;
        }
        .score-pop.zero { color: var(--muted); }
        @keyframes popUp {
            0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
            25% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
        }
        .confetti-bit {
            position: absolute; top: -20px;
            width: 8px; height: 13px; border-radius: 2px;
            opacity: .95;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translate(var(--drift, 0), 105vh) rotate(680deg); opacity: .2; }
        }

        /* Modals */
        .overlay {
            position: fixed; inset: 0; z-index: 300;
            display: grid; place-items: center;
            padding: 16px;
            background: rgba(2, 14, 10, .72);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }
        .overlay.hidden { display: none; }
        .modal {
            width: 100%; max-width: 360px;
            padding: 24px 22px;
            border-radius: 20px;
            background: linear-gradient(160deg, #103d2f, #0a261e);
            border: 1px solid var(--line-strong);
            box-shadow: 0 24px 60px rgba(0,0,0,.5);
            text-align: center;
            animation: popIn .28s cubic-bezier(.175,.885,.32,1.275);
        }
        @keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { font-size: 1.35rem; margin-bottom: 6px; color: var(--gold-soft); }
        .modal .sub { font-size: .78rem; color: var(--muted); margin-bottom: 16px; }
        .winner-text { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
        .final-scores { font-size: .9rem; color: var(--muted); margin-bottom: 14px; }
        .stats-table { width: 100%; border-collapse: collapse; font-size: .74rem; margin-bottom: 18px; }
        .stats-table th, .stats-table td { padding: 6px 5px; border-bottom: 1px solid var(--line); text-align: center; }
        .stats-table th { color: var(--muted); font-weight: 700; font-size: .66rem; text-transform: uppercase; letter-spacing: .5px; }
        .stats-table th:first-child, .stats-table td:first-child { text-align: left; }
        .stats-table td:nth-child(2) { color: var(--p1); font-weight: 700; }
        .stats-table td:nth-child(3) { color: var(--p2); font-weight: 700; }
        .modal-actions { display: flex; gap: 8px; justify-content: center; }
        .btn-primary, .btn-ghost {
            border: none; border-radius: 99px; cursor: pointer;
            padding: 10px 18px; font-size: .85rem; font-weight: 800;
            touch-action: manipulation;
        }
        .btn-primary { color: #2a1a00; background: linear-gradient(145deg, #ffe08a, var(--gold)); }
        .btn-ghost { background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--text); }
        .btn-primary:active, .btn-ghost:active { transform: scale(.96); }
        .difficulty-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .difficulty-btn {
            display: flex; align-items: center; gap: 11px;
            width: 100%; padding: 11px 13px;
            border: 1px solid var(--line); border-radius: 12px;
            background: rgba(255,255,255,.05);
            cursor: pointer; text-align: left;
            touch-action: manipulation;
        }
        .difficulty-btn:active { transform: scale(.98); }
        .difficulty-btn.selected { border-color: var(--p2); background: var(--p2-soft); }
        .diff-icon { font-size: 1.35rem; }
        .diff-copy { flex: 1; }
        .diff-name { display: block; font-size: .88rem; font-weight: 800; }
        .diff-desc { display: block; font-size: .66rem; color: var(--muted); margin-top: 2px; }
        .difficulty-btn.selected .diff-name { color: var(--p2); }
        .settings-list { text-align: left; margin: 6px 0 18px; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 11px 2px; border-bottom: 1px solid var(--line);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: .82rem; font-weight: 600; }
        .setting-label small { display: block; font-size: .64rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
        .switch { position: relative; width: 44px; height: 25px; min-width: 44px; }
        .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; inset: 0; border-radius: 99px;
            background: rgba(255,255,255,.16); cursor: pointer;
            transition: background .2s;
        }
        .slider::before {
            content: ''; position: absolute; width: 19px; height: 19px;
            left: 3px; top: 3px; border-radius: 50%;
            background: #fff; transition: transform .2s;
        }
        .switch input:checked + .slider { background: var(--p1); }
        .switch input:checked + .slider::before { transform: translateX(19px); }
        .switch input:focus-visible + .slider { outline: 2px solid var(--gold); outline-offset: 2px; }

        :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
        @media (min-width: 600px) {
            .dice-row { gap: 14px; }
            .score-row { font-size: .88rem; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <a href="../index.html" class="back-btn" aria-label="Torna al portfolio">←</a>
        <h1 class="title">Yatzee Solo</h1>
        <div class="top-actions">
            <button type="button" id="sound-btn" class="icon-btn" aria-label="Disattiva audio">
                <svg class="wave" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
                <svg class="slash" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.6 3 2.1-2.1-1.4-1.4L20.2 10.5 18.1 8.4 16.7 9.8l2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1z"/></svg>
            </button>
            <button type="button" id="difficulty-btn" class="text-btn diff-badge" aria-label="Cambia difficoltà">MEDIO</button>
            <button type="button" id="settings-btn" class="icon-btn" aria-label="Impostazioni">

    <script>
    (function () {
        'use strict';

        /* ============================================================
           CONFIGURAZIONE
           ============================================================ */
        const SAVE_KEY = 'yatzee.solo.save.v1';
        const SETTINGS_KEY = 'yatzee.solo.settings.v1';

        const UPPER = ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes'];
        const PLAYABLE = [
            { id: 'ones',          name: 'Uni (1)',            short: 'Uni',     type: 'upper' },
            { id: 'twos',          name: 'Due (2)',            short: 'Due',     type: 'upper' },
            { id: 'threes',        name: 'Tre (3)',            short: 'Tre',     type: 'upper' },
            { id: 'fours',         name: 'Quattro (4)',        short: 'Quattro', type: 'upper' },
            { id: 'fives',         name: 'Cinque (5)',         short: 'Cinque',  type: 'upper' },
            { id: 'sixes',         name: 'Sei (6)',            short: 'Sei',     type: 'upper' },
            { id: 'threeKind',     name: 'Tris',               short: 'Tris',    type: 'lower' },
            { id: 'fourKind',      name: 'Poker',              short: 'Poker',   type: 'lower' },
            { id: 'fullHouse',     name: 'Full (25)',          short: 'Full',    type: 'lower' },
            { id: 'smallStraight', name: 'Scala piccola (30)', short: 'S. piccola', type: 'lower' },
            { id: 'largeStraight', name: 'Scala grande (40)',  short: 'S. grande', type: 'lower' },
            { id: 'yahtzee',       name: 'Yatzee (50)',        short: 'Yatzee',  type: 'lower' },
            { id: 'chance',        name: 'Chance',             short: 'Chance',  type: 'lower' }
        ];
        const ALL_ROWS = [
            ...PLAYABLE.slice(0, 6),
            { id: 'bonus', name: 'Bonus (63+)', virtual: true },
            ...PLAYABLE.slice(6),
            { id: 'total', name: 'TOTALE', virtual: true }
        ];

        const PIP_POS = {
            1: [[2, 2]],
            2: [[1, 1], [3, 3]],
            3: [[1, 1], [2, 2], [3, 3]],
            4: [[1, 1], [1, 3], [3, 1], [3, 3]],
            5: [[1, 1], [1, 3], [2, 2], [3, 1], [3, 3]],
            6: [[1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]]
        };

        const DIFFICULTIES = {
            easy:   { name: 'Facile',    samples: 6,  mistake: 0.30, bonusAware: false, jokerAware: false, noise: 0.35 },
            medium: { name: 'Medio',     samples: 14, mistake: 0.08, bonusAware: true,  jokerAware: false, noise: 0.10 },
            hard:   { name: 'Difficile', samples: 32, mistake: 0,    bonusAware: true,  jokerAware: true,  noise: 0 }
        };

        function defaultSettings() {
            return { sound: true, hint: true, joker: false, extraYahtzee: false };
        }

        function makePlayer(name) {
            return {
                name: name,
                scores: {},
                stats: { turns: 0, yahtzees: 0, bestScore: 0, bestCat: '', yahtzeeBonuses: 0 }
            };
        }

        function initialState() {
            return {
                version: 1,
                difficulty: 'medium',
                players: [makePlayer('Tu'), makePlayer('CPU')],
                current: 0,
                rollsLeft: 3,
                dice: [1, 1, 1, 1, 1],
                held: [false, false, false, false, false],
                phase: 'idle', // idle | rolling | choose | transition | gameover
                lastRoll: null,
                turn: 1,
                settings: defaultSettings()
            };
        }

        let state = initialState();

        /* Riferimenti DOM e timer */
        let diceEls = [];
        let cellRefs = [{}, {}];
        let rollTimer = null, rollInterval = null, aiTimer = null, turnTimer = null, toastTimer = null, bannerTimer = null;

        /* ============================================================
           REGOLE (funzioni pure)
           ============================================================ */
        function randDie() { return Math.floor(Math.random() * 6) + 1; }

        function analyzeDice(dice) {
            const counts = [0, 0, 0, 0, 0, 0, 0];
            let sum = 0;
            for (const d of dice) { counts[d]++; sum += d; }
            const values = counts.filter(c => c > 0);
            const unique = [];
            for (let i = 1; i <= 6; i++) if (counts[i] > 0) unique.push(i);
            return { counts: counts, sum: sum, values: values, unique: unique };
        }

        function longestStraight(unique) {
            if (!unique.length) return 0;
            let best = 1, run = 1;
            for (let i = 1; i < unique.length; i++) {
                run = (unique[i] === unique[i - 1] + 1) ? run + 1 : 1;
                if (run > best) best = run;
            }
            return best;
        }

        function scoreCategory(dice, id, ctx) {
            ctx = ctx || {};
            const a = analyzeDice(dice);
            switch (id) {
                case 'ones':   return a.counts[1] * 1;
                case 'twos':   return a.counts[2] * 2;
                case 'threes': return a.counts[3] * 3;
                case 'fours':  return a.counts[4] * 4;
                case 'fives':  return a.counts[5] * 5;
                case 'sixes':  return a.counts[6] * 6;
                case 'threeKind': return a.values.some(v => v >= 3) ? a.sum : 0;
                case 'fourKind':  return a.values.some(v => v >= 4) ? a.sum : 0;
                case 'fullHouse':
                    return ((a.values.includes(3) && a.values.includes(2)) || a.values.includes(5) || ctx.joker) ? 25 : 0;
                case 'smallStraight': return (longestStraight(a.unique) >= 4 || ctx.joker) ? 30 : 0;
                case 'largeStraight': return (longestStraight(a.unique) >= 5 || ctx.joker) ? 40 : 0;
                case 'yahtzee': return a.values.includes(5) ? 50 : 0;
                case 'chance': return a.sum;
                default: return 0;
            }
        }

        function upperSum(p) {
            return UPPER.reduce((s, k) => s + (p.scores[k] || 0), 0);
        }
        function upperBonus(p) { return upperSum(p) >= 63 ? 35 : 0; }
        function totalScore(p) {
            let t = 0;
            for (const c of PLAYABLE) t += (p.scores[c.id] || 0);
            return t + upperBonus(p) + (p.scores.yahtzeeBonus || 0);
        }
        function gameOver() {
            return state.players.every(p => PLAYABLE.every(c => p.scores[c.id] !== undefined));
        }
        function isAiTurn() { return state.current === 1; }

        function ctxFor(p, dice) {
            const a = analyzeDice(dice);
            const extra = a.values.includes(5) && p.scores.yahtzee === 50;
            return { joker: extra && state.settings.joker };
        }
        function potentialCtx(p) { return ctxFor(p, state.dice); }

        /* ============================================================
           AUDIO (WebAudio sintetizzato)
           ============================================================ */
        const AudioFX = {
            ctx: null,
            init: function () {
                if (!state.settings.sound) return;
                try {
                    if (!this.ctx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (AC) this.ctx = new AC();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                } catch (e) { /* audio non disponibile */ }
            },
            tone: function (freq, dur, type, gain, delay) {
                if (!state.settings.sound) return;
                this.init();
                if (!this.ctx) return;
                delay = delay || 0;
                const t = this.ctx.currentTime + delay;
                const o = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                o.type = type || 'sine';
                o.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(g); g.connect(this.ctx.destination);
                o.start(t); o.stop(t + dur + 0.03);
            },
            noise: function (dur, gain, delay) {
                if (!state.settings.sound) return;
                this.init();
                if (!this.ctx) return;
                delay = delay || 0;
                const t = this.ctx.currentTime + delay;
                const len = Math.floor(this.ctx.sampleRate * dur);
                const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 1500;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(gain, t);
                src.connect(filter); filter.connect(g); g.connect(this.ctx.destination);
                src.start(t);
            },
            roll: function () { for (let i = 0; i < 3; i++) this.noise(0.07, 0.06, i * 0.085); },
            click: function () { this.tone(540, 0.06, 'square', 0.04); },
            score: function (v) {
                if (v <= 0) { this.tone(180, 0.12, 'sine', 0.03); return; }
                this.tone(660, 0.09, 'sine', 0.055);
                this.tone(880, 0.13, 'sine', 0.045, 0.07);
            },
            fanfare: function () { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.055, i * 0.1)); },
            win: function () { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.32, 'triangle', 0.06, i * 0.12)); }
        };

        /* ============================================================
           PERSISTENZA
           ============================================================ */
        function loadRaw(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
        }
        function saveSettings() {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign({}, state.settings, { difficulty: state.difficulty }))); } catch (e) {}
        }
        function save() {
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
        }
        function normalizeState(data) {
            data.settings = Object.assign(defaultSettings(), data.settings || {});
            if (!DIFFICULTIES[data.difficulty]) data.difficulty = 'medium';
            const players = Array.isArray(data.players) ? data.players.slice(0, 2) : [];
            while (players.length < 2) players.push(makePlayer(players.length === 0 ? 'Tu' : 'CPU'));
            data.players = players.map((p, i) => ({
                name: p.name || (i === 0 ? 'Tu' : 'CPU'),
                scores: (p.scores && typeof p.scores === 'object') ? p.scores : {},
                stats: Object.assign({ turns: 0, yahtzees: 0, bestScore: 0, bestCat: '', yahtzeeBonuses: 0 }, p.stats || {})
            }));
            if (!Array.isArray(data.dice) || data.dice.length !== 5) data.dice = [1, 1, 1, 1, 1];
            data.dice = data.dice.map(v => ((v | 0) >= 1 && (v | 0) <= 6) ? (v | 0) : 1);
            if (!Array.isArray(data.held) || data.held.length !== 5) data.held = [false, false, false, false, false];
            data.held = data.held.map(Boolean);
            if (typeof data.current !== 'number' || data.current < 0 || data.current > 1) data.current = 0;
            if (typeof data.rollsLeft !== 'number' || data.rollsLeft < 0 || data.rollsLeft > 3) data.rollsLeft = 3;
            if (typeof data.turn !== 'number' || data.turn < 1) data.turn = 1;
            if (!['idle', 'rolling', 'choose', 'transition', 'gameover'].includes(data.phase)) data.phase = 'idle';
            if (data.phase === 'rolling' || data.phase === 'transition') data.phase = 'idle';
            return data;
        }

        /* ============================================================
           COSTRUZIONE DOM
           ============================================================ */
        function buildDice() {
            const container = document.getElementById('dice-container');
            container.innerHTML = '';
            diceEls = [];
            for (let i = 0; i < 5; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'die face-1';
                btn.dataset.index = String(i);
                for (let f = 1; f <= 6; f++) {
                    const face = document.createElement('div');
                    face.className = 'die-face';
                    face.dataset.face = String(f);
                    PIP_POS[f].forEach(function (pos) {
                        const pip = document.createElement('i');
                        pip.className = 'pip';
                        pip.style.gridArea = pos[0] + '/' + pos[1];
                        face.appendChild(pip);
                    });
                    btn.appendChild(face);
                }
                container.appendChild(btn);
                diceEls.push(btn);
            }
        }

        function buildScorecard() {
            const card = document.getElementById('scorecard');
            card.innerHTML = '';
            cellRefs = [{}, {}];

            const header = document.createElement('div');
            header.className = 'score-row score-header';
            header.innerHTML = '<div>Categoria</div><div>Tu</div><div>CPU</div>';
            card.appendChild(header);

            ALL_ROWS.forEach(function (row) {
                const r = document.createElement('div');
                r.className = 'score-row' + (row.id === 'bonus' ? ' bonus-row' : '') + (row.id === 'total' ? ' total-row' : '');

                const label = document.createElement('div');
                label.className = 'cat-name';
                if (row.id === 'bonus') {
                    label.innerHTML = '<span>Bonus (63+)</span><div class="mini-bar"><i></i></div><small class="bonus-hint">0/63</small>';
                } else {
                    label.textContent = row.name;
                }
                r.appendChild(label);

                for (let pi = 0; pi < 2; pi++) {
                    const cell = document.createElement('button');
                    cell.type = 'button';
                    cell.className = 'score-cell ' + (pi === 0 ? 'p1' : 'p2');
                    if (row.id === 'bonus') cell.classList.add('bonus-value');
                    if (row.id === 'total') cell.classList.add('player-score-cell');
                    if (!row.virtual) {
                        cell.dataset.player = String(pi);
                        cell.dataset.cat = row.id;
                        cell.setAttribute('aria-label', state.players[pi].name + ', ' + row.name);
                    } else {
                        cell.disabled = true;
                    }
                    cellRefs[pi][row.id] = cell;
                    r.appendChild(cell);
                }
                card.appendChild(r);
            });
        }

        /* ============================================================
           RENDER
           ============================================================ */
        function animateNumber(el, to) {
            const from = parseInt(el.textContent, 10) || 0;
            if (from === to) return;
            const token = (el.__anim || 0) + 1;
            el.__anim = token;
            const start = performance.now();
            function step(now) {
                if (el.__anim !== token) return;
                const k = Math.min(1, (now - start) / 380);
                el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
                if (k < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function renderDice() {
            const canHold = state.phase === 'choose' && state.rollsLeft < 3 && !isAiTurn();
            diceEls.forEach(function (el, i) {
                const rolling = state.phase === 'rolling' && !state.held[i];
                el.className = 'die face-' + state.dice[i]
                    + (state.held[i] ? ' held' : '')
                    + (rolling ? ' rolling' : '')
                    + (state.phase === 'idle' ? ' idle' : '');
                el.disabled = !canHold;
                el.setAttribute('aria-pressed', String(!!state.held[i]));
                el.setAttribute('aria-label', 'Dado ' + (i + 1) + ', valore ' + state.dice[i] + (state.held[i] ? ', bloccato' : ''));
            });
        }

        function renderScores() {
            state.players.forEach(function (p, pi) {
                PLAYABLE.forEach(function (cat) {
                    const cell = cellRefs[pi][cat.id];
                    const val = p.scores[cat.id];
                    const isCurrent = pi === state.current && state.phase === 'choose';
                    cell.classList.remove('potential', 'suggest', 'filled');
                    if (val !== undefined) {
                        cell.textContent = String(val);
                        cell.classList.add('filled');
                        cell.disabled = true;
                    } else if (isCurrent) {
                        cell.textContent = String(scoreCategory(state.dice, cat.id, potentialCtx(p)));
                        cell.classList.add('potential');
                        cell.disabled = false;
                    } else {
                        cell.textContent = '';
                        cell.disabled = true;
                    }
                });

                const bonusCell = cellRefs[pi].bonus;
                const bonus = upperBonus(p);
                bonusCell.textContent = String(bonus);
                bonusCell.classList.toggle('earned', bonus > 0);

                cellRefs[pi].total.textContent = String(totalScore(p));

                const row = bonusCell.parentElement;
                const fill = row.querySelector('.mini-bar i');
                const hint = row.querySelector('.bonus-hint');
                const us = upperSum(p);
                if (fill) fill.style.width = Math.min(100, us / 63 * 100) + '%';
                if (hint) hint.textContent = us + '/63 · ' + (us >= 63 ? 'Bonus!' : (63 - us) + ' mancanti');
            });
            applySuggestion();
        }

        function applySuggestion() {
            document.querySelectorAll('.score-cell.suggest').forEach(function (c) { c.classList.remove('suggest'); });
            if (!state.settings.hint || state.phase !== 'choose' || isAiTurn()) return;
            const p = state.players[state.current];
            let best = null, bestVal = -1;
            PLAYABLE.forEach(function (cat) {
                if (p.scores[cat.id] === undefined) {
                    const sc = scoreCategory(state.dice, cat.id, potentialCtx(p));
                    if (sc > bestVal) { bestVal = sc; best = cat; }
                }
            });
            if (best && bestVal > 0) cellRefs[state.current][best.id].classList.add('suggest');
        }

        function renderPlayers() {
            state.players.forEach(function (p, pi) {
                const card = document.getElementById('player-' + (pi + 1));
                card.classList.toggle('active', pi === state.current && state.phase !== 'gameover');
                
                card.querySelector('.avatar').textContent = (p.name.trim()[0] || '?').toUpperCase();
                card.querySelector('.player-name').innerHTML = p.name + (pi === 1 ? ' <span class="diff-tag">' + DIFFICULTIES[state.difficulty].name + '</span>' : '');
                animateNumber(card.querySelector('.player-score'), totalScore(p));
            });
        }

        function renderControls() {
            const ai = isAiTurn();
            const blocked = ai || state.phase === 'rolling' || state.phase === 'transition' || state.phase === 'gameover' || state.rollsLeft <= 0;
            const rollBtn = document.getElementById('roll-btn');
            rollBtn.disabled = blocked;
            rollBtn.textContent = ai ? 'Turno CPU…' : (state.phase === 'gameover' ? 'Partita finita' : 'Lancia i dadi');
            document.getElementById('rolls-label').textContent = ai
                ? 'La CPU sta pensando…'
                : (state.rollsLeft > 0 ? 'Lanci rimasti: ' + state.rollsLeft : 'Nessun lancio rimasto');
            document.querySelectorAll('#roll-dots i').forEach(function (dot, i) {
                dot.classList.toggle('on', i < state.rollsLeft);
            });
        }

        function renderStatus() {
            document.getElementById('last-roll').textContent = state.lastRoll
                ? 'Ultimo lancio: ' + state.lastRoll.join(' · ')
                : 'Ultimo lancio: —';
        }

        function renderSettingsInputs() {
            const map = { 'set-sound': 'sound', 'set-hint': 'hint', 'set-joker': 'joker', 'set-extra': 'extraYahtzee' };
            Object.keys(map).forEach(function (id) {
                document.getElementById(id).checked = !!state.settings[map[id]];
            });
            const soundBtn = document.getElementById('sound-btn');
            soundBtn.classList.toggle('muted', !state.settings.sound);
            soundBtn.setAttribute('aria-label', state.settings.sound ? 'Disattiva audio' : 'Attiva audio');
        }

        function renderAll() {
            renderDice();
            renderScores();
            renderPlayers();
            renderControls();
            renderStatus();
            renderSettingsInputs();
            renderDifficulty();
        }

        function renderDifficulty() {
            const cfg = DIFFICULTIES[state.difficulty] || DIFFICULTIES.medium;
            document.getElementById('difficulty-btn').textContent = cfg.name.toUpperCase();
            document.querySelectorAll('.difficulty-btn').forEach(function (b) {
                b.classList.toggle('selected', b.dataset.difficulty === state.difficulty);
            });
        }

        function selectDifficulty(diff) {
            if (!DIFFICULTIES[diff]) return;
            state.difficulty = diff;
            saveSettings();
            save();
            renderDifficulty();
            renderPlayers();
            closeModal('difficulty-modal');
            showToast('Difficoltà: ' + DIFFICULTIES[diff].name);
        }

        /* ============================================================
           FEEDBACK VISIVO
           ============================================================ */
        function showToast(msg, ms) {
            const el = document.getElementById('toast');
            clearTimeout(toastTimer);
            el.textContent = msg;
            el.classList.add('on');
            toastTimer = setTimeout(function () { el.classList.remove('on'); }, ms || 2200);
        }

        function showTurnBanner() {
            const badge = document.getElementById('turn-badge');
            clearTimeout(bannerTimer);
            const pi = state.current;
            badge.className = 'turn-badge ' + (pi === 0 ? 'p1' : 'p2');
            badge.textContent = isAiTurn()
                ? 'Turno CPU · ' + DIFFICULTIES[state.difficulty].name
                : 'Tuo turno';
            requestAnimationFrame(function () { badge.classList.add('show'); });
            bannerTimer = setTimeout(function () { badge.classList.remove('show'); }, 1500);
        }

        function showScorePop(pi, catId, value) {
            const cell = cellRefs[pi][catId];
            if (!cell) return;
            const r = cell.getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'score-pop' + (value > 0 ? '' : ' zero');
            el.textContent = value > 0 ? '+' + value : '0';
            el.style.left = (r.left + r.width / 2) + 'px';
            el.style.top = (r.top + r.height / 2) + 'px';
            document.getElementById('pop-layer').appendChild(el);
            setTimeout(function () { el.remove(); }, 1000);
        }

        function confetti() {
            const colors = ['#f5c451', '#34d399', '#fb7185', '#60a5fa', '#ffffff'];
            const layer = document.getElementById('confetti-layer');
            for (let i = 0; i < 44; i++) {
                const bit = document.createElement('i');
                bit.className = 'confetti-bit';
                bit.style.left = (Math.random() * 100) + 'vw';
                bit.style.background = colors[i % colors.length];
                bit.style.animationDelay = (Math.random() * 0.25) + 's';
                bit.style.animationDuration = (0.9 + Math.random() * 0.7) + 's';
                bit.style.setProperty('--drift', (Math.random() * 220 - 110) + 'px');
                layer.appendChild(bit);
                (function (b) { setTimeout(function () { b.remove(); }, 2100); })(bit);
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function closeAllModals() {
            document.querySelectorAll('.overlay').forEach(function (o) { o.classList.add('hidden'); });
        }

        /* ============================================================
           AZIONI DI GIOCO
           ============================================================ */
        function doRoll(fromAi) {
            if (!fromAi && isAiTurn()) return;
            if (state.phase !== 'idle' && !(state.phase === 'choose' && state.rollsLeft > 0)) return;
            if (state.rollsLeft <= 0) return;

            clearInterval(rollInterval);
            clearTimeout(rollTimer);
            AudioFX.init();
            state.phase = 'rolling';
            renderDice();
            renderControls();

            const toRoll = state.held.map(function (h) { return !h; });
            let ticks = 0;
            rollInterval = setInterval(function () {
                ticks++;
                diceEls.forEach(function (el, i) {
                    if (toRoll[i]) {
                        el.className = 'die face-' + randDie() + ' rolling';
                    }
                });
            }, 70);

            rollTimer = setTimeout(function () {
                clearInterval(rollInterval); rollInterval = null;
                for (let i = 0; i < 5; i++) if (toRoll[i]) state.dice[i] = randDie();
                state.rollsLeft--;
                state.lastRoll = state.dice.slice();
                state.phase = 'choose';
                save();
                renderAll();
                AudioFX.roll();
            }, 620);
        }

        function toggleHold(i, fromAi) {
            if (!fromAi && isAiTurn()) return;
            if (state.phase !== 'choose' || state.rollsLeft === 3) return;
            state.held[i] = !state.held[i];
            renderDice();
            AudioFX.click();
            save();
        }

        function selectCategory(pi, id, fromAi) {
            if (!fromAi && isAiTurn()) return;
            if (pi !== state.current || state.phase !== 'choose') return;
            const player = state.players[pi];
            if (player.scores[id] !== undefined) return;
            const cat = PLAYABLE.find(function (c) { return c.id === id; });
            if (!cat) return;

            const a = analyzeDice(state.dice);
            const extra = a.values.includes(5) && player.scores.yahtzee === 50 && id !== 'yahtzee';
            const joker = extra && state.settings.joker;
            const score = scoreCategory(state.dice, id, { joker: joker });
            const upperBefore = upperSum(player);

            player.scores[id] = score;
            player.stats.turns++;

            if (id === 'yahtzee' && score === 50) {
                player.stats.yahtzees++;
                AudioFX.fanfare();
                confetti();
            }
            if (extra && state.settings.extraYahtzee) {
                player.scores.yahtzeeBonus = (player.scores.yahtzeeBonus || 0) + 50;
                player.stats.yahtzeeBonuses = (player.stats.yahtzeeBonuses || 0) + 1;
                showToast(player.name + ': Yatzee extra! +50');
                AudioFX.fanfare();
                confetti();
            }
            if (score > player.stats.bestScore) {
                player.stats.bestScore = score;
                player.stats.bestCat = cat.short;
            }
            if (upperBefore < 63 && upperSum(player) >= 63) {
                showToast(player.name + ': bonus +35!');
                confetti();
                AudioFX.fanfare();
            }

            state.phase = 'transition';
            save();
            renderAll();
            showScorePop(pi, id, score);
            AudioFX.score(score);
            clearTimeout(turnTimer);
            turnTimer = setTimeout(nextTurn, 520);
        }

        function nextTurn() {
            if (state.phase !== 'transition') return;
            if (gameOver()) { endGame(); return; }
            state.current = state.current === 0 ? 1 : 0;
            state.rollsLeft = 3;
            state.dice = [1, 1, 1, 1, 1];
            state.held = [false, false, false, false, false];
            state.lastRoll = null;
            state.turn++;
            state.phase = 'idle';
            save();
            renderAll();
            showTurnBanner();
            checkAi();
        }

        function newGame() {
            clearTimeout(aiTimer); clearTimeout(turnTimer); clearTimeout(rollTimer); clearInterval(rollInterval);
            const settings = Object.assign({}, state.settings);
            const difficulty = state.difficulty;
            state = initialState();
            state.settings = settings;
            state.difficulty = difficulty;
            save();
            saveSettings();
            closeAllModals();
            renderAll();
            showTurnBanner();
            showToast('Nuova partita');
            checkAi();
        }

        function endGame() {
            state.phase = 'gameover';
            save();
            renderAll();

            const totals = state.players.map(totalScore);
            let title;
            if (totals[0] === totals[1]) title = 'Pareggio! 🤝';
            else if (totals[0] > totals[1]) title = 'Hai vinto! 🏆';
            else title = 'La CPU ha vinto! 🤖';
            document.getElementById('winner-text').textContent = title;
            document.getElementById('final-scores').textContent = 'Tu: ' + totals[0] + ' — CPU: ' + totals[1];

            const rows = [
                ['Punteggio', totals[0], totals[1]],
                ['Sezione alta', upperSum(state.players[0]), upperSum(state.players[1])],
                ['Bonus 63+', upperBonus(state.players[0]), upperBonus(state.players[1])],
                ['Yahtzee', state.players[0].stats.yahtzees, state.players[1].stats.yahtzees],
                ['Yahtzee extra', state.players[0].stats.yahtzeeBonuses || 0, state.players[1].stats.yahtzeeBonuses || 0],
                ['Miglior categoria',
                    state.players[0].stats.bestCat + ' (' + state.players[0].stats.bestScore + ')',
                    state.players[1].stats.bestCat + ' (' + state.players[1].stats.bestScore + ')']
            ];
            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = '';
            rows.forEach(function (r) {
                const tr = document.createElement('tr');
                r.forEach(function (v) {
                    const td = document.createElement('td');
                    td.textContent = String(v);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            openModal('over-modal');
            confetti();
            AudioFX.win();
        }

        function toggleSound() {
            state.settings.sound = !state.settings.sound;
            saveSettings();
            renderSettingsInputs();
            if (state.settings.sound) { AudioFX.init(); AudioFX.click(); }
        }

        /* ============================================================
           AVVERSARIO CPU
           ============================================================ */
        function straightIndices(dice) {
            const seen = {}, uniq = [];
            dice.forEach(function (d, i) { if (seen[d] === undefined) { seen[d] = i; uniq.push(d); } });
            uniq.sort(function (x, y) { return x - y; });
            let best = [], cur = [];
            uniq.forEach(function (v) {
                if (cur.length && v !== cur[cur.length - 1] + 1) cur = [];
                cur.push(v);
                if (cur.length > best.length) best = cur.slice();
            });
            return best.length >= 3 ? best.map(function (v) { return seen[v]; }) : null;
        }

        function aiChooseKeep() {
            const p = state.players[state.current];
            const cfg = DIFFICULTIES[state.difficulty] || DIFFICULTIES.medium;
            const open = PLAYABLE.filter(function (c) { return p.scores[c.id] === undefined; });
            if (!open.length) return state.held.map(function () { return false; });

            const masks = [], seen = {};
            function add(m) { const k = m.join(''); if (!seen[k]) { seen[k] = true; masks.push(m); } }
            add([false, false, false, false, false]);
            for (let f = 1; f <= 6; f++) add(state.dice.map(function (d) { return d === f; }));
            const si = straightIndices(state.dice);
            if (si) { const m = [false, false, false, false, false]; si.forEach(function (i) { m[i] = true; }); add(m); }

            let best = masks[0], bestAvg = -1;
            const N = cfg.samples;
            masks.forEach(function (mask) {
                let total = 0;
                for (let s = 0; s < N; s++) {
                    const sim = state.dice.map(function (v, i) { return mask[i] ? v : randDie(); });
                    for (let r = 1; r < state.rollsLeft; r++) {
                        for (let i = 0; i < 5; i++) if (!mask[i]) sim[i] = randDie();
                    }
                    let bestScore = 0;
                    open.forEach(function (c) {
                        let sc = scoreCategory(sim, c.id, cfg.jokerAware ? ctxFor(p, sim) : {});
                        if (c.type === 'upper' && cfg.bonusAware) {
                            const face = UPPER.indexOf(c.id) + 1;
                            const contrib = sim.filter(function (d) { return d === face; }).length * face;
                            if (upperSum(p) + contrib >= 63) sc += 4;
                        }
                        if (sc > bestScore) bestScore = sc;
                    });
                    total += bestScore;
                }
                const avg = total / N;
                if (avg > bestAvg) { bestAvg = avg; best = mask; }
            });
            if (cfg.noise) best = best.map(function (v) { return Math.random() < cfg.noise ? !v : v; });
            return best;
        }

        function aiChooseCategory() {
            const p = state.players[state.current];
            const cfg = DIFFICULTIES[state.difficulty] || DIFFICULTIES.medium;
            const open = PLAYABLE.filter(function (c) { return p.scores[c.id] === undefined; });
            if (!open.length) return null;
            if (Math.random() < cfg.mistake) return open[Math.floor(Math.random() * open.length)];
            let best = null, bestVal = -1;
            open.forEach(function (c) {
                let sc = scoreCategory(state.dice, c.id, cfg.jokerAware ? potentialCtx(p) : {});
                if (c.type === 'upper' && cfg.bonusAware) {
                    const face = UPPER.indexOf(c.id) + 1;
                    const contrib = state.dice.filter(function (d) { return d === face; }).length * face;
                    const us = upperSum(p) + contrib;
                    if (us >= 63) sc += 6;
                    else if (us >= 50) sc += 2;
                }
                if (sc > bestVal) { bestVal = sc; best = c; }
            });
            return best;
        }

        function checkAi() {
            clearTimeout(aiTimer);
            if (isAiTurn() && (state.phase === 'idle' || state.phase === 'choose')) {
                aiTimer = setTimeout(aiStep, 750);
            }
        }

        function aiStep() {
            if (!isAiTurn()) return;
            if (state.phase === 'idle') {
                doRoll(true);
                aiTimer = setTimeout(aiStep, 780);
                return;
            }
            if (state.phase !== 'choose') return;
            if (state.rollsLeft > 0) {
                state.held = aiChooseKeep();
                renderDice();
                aiTimer = setTimeout(function () {
                    doRoll(true);
                    aiTimer = setTimeout(aiStep, 780);
                }, 420);
            } else {
                const cat = aiChooseCategory();
                if (cat) selectCategory(state.current, cat.id, true);
            }
        }

        /* ============================================================
           EVENTI
           ============================================================ */
        function bindEvents() {
            document.getElementById('dice-container').addEventListener('click', function (e) {
                const btn = e.target.closest('.die');
                if (btn) toggleHold(Number(btn.dataset.index));
            });
            document.getElementById('scorecard').addEventListener('click', function (e) {
                const cell = e.target.closest('.score-cell[data-cat]');
                if (cell) selectCategory(Number(cell.dataset.player), cell.dataset.cat);
            });
            document.getElementById('roll-btn').addEventListener('click', function () { doRoll(); });
            document.getElementById('sound-btn').addEventListener('click', toggleSound);
            document.getElementById('difficulty-btn').addEventListener('click', function () { openModal('difficulty-modal'); });
            document.getElementById('difficulty-close').addEventListener('click', function () { closeModal('difficulty-modal'); });
            document.getElementById('difficulty-modal').addEventListener('click', function (e) {
                const btn = e.target.closest('.difficulty-btn');
                if (btn) selectDifficulty(btn.dataset.difficulty);
            });
            document.getElementById('settings-btn').addEventListener('click', function () { openModal('settings-modal'); });
            document.getElementById('new-btn').addEventListener('click', function () { openModal('new-modal'); });
            document.getElementById('new-cancel').addEventListener('click', function () { closeModal('new-modal'); });
            document.getElementById('new-confirm').addEventListener('click', function () { closeModal('new-modal'); newGame(); });
            document.getElementById('settings-close').addEventListener('click', function () { closeModal('settings-modal'); });
            document.getElementById('over-close').addEventListener('click', function () { closeModal('over-modal'); });
            document.getElementById('over-replay').addEventListener('click', function () { closeModal('over-modal'); newGame(); });

            const settingMap = { 'set-sound': 'sound', 'set-hint': 'hint', 'set-joker': 'joker', 'set-extra': 'extraYahtzee' };
            Object.keys(settingMap).forEach(function (id) {
                document.getElementById(id).addEventListener('change', function (e) {
                    const key = settingMap[id];
                    state.settings[key] = e.target.checked;
                    saveSettings();
                    renderAll();
                    checkAi();
                    if (key === 'sound' && e.target.checked) AudioFX.click();
                });
            });

            document.addEventListener('keydown', function (e) {
                if (document.querySelector('.overlay:not(.hidden)')) {
                    if (e.key === 'Escape') closeAllModals();
                    return;
                }
                if (e.key === 'Enter' && (state.phase === 'idle' || state.phase === 'choose')) {
                    e.preventDefault(); doRoll();
                }
                if (/^[1-5]$/.test(e.key)) toggleHold(Number(e.key) - 1);
            });

            document.querySelectorAll('.overlay').forEach(function (o) {
                o.addEventListener('click', function (e) {
                    if (e.target === o && o.id !== 'over-modal') closeModal(o.id);
                });
            });
        }

        /* ============================================================
           SELF-TEST (apri con #test)
           ============================================================ */
        function runSelfTests() {
            const t = function (name, cond) {
                if (cond) console.log('✓', name);
                else console.error('✗ FALLITO:', name);
            };
            t('Uni', scoreCategory([1, 1, 3, 1, 5], 'ones') === 3);
            t('Full house', scoreCategory([2, 2, 5, 5, 5], 'fullHouse') === 25);
            t('Cinque uguali come full', scoreCategory([4, 4, 4, 4, 4], 'fullHouse') === 25);
            t('Scala piccola', scoreCategory([1, 2, 3, 4, 4], 'smallStraight') === 30);
            t('Scala grande', scoreCategory([1, 2, 3, 4, 5], 'largeStraight') === 40);
            t('Nessuna scala', scoreCategory([1, 2, 4, 5, 6], 'smallStraight') === 0);
            t('Yatzee', scoreCategory([6, 6, 6, 6, 6], 'yahtzee') === 50);
            t('Poker', scoreCategory([3, 3, 3, 3, 2], 'fourKind') === 14);
            t('Chance', scoreCategory([6, 5, 4, 3, 2], 'chance') === 20);
            t('Joker scala grande', scoreCategory([4, 4, 4, 4, 4], 'largeStraight', { joker: true }) === 40);
            t('Bonus 63', upperBonus({ scores: { ones: 3, twos: 6, threes: 9, fours: 12, fives: 15, sixes: 18 } }) === 35);
            console.log('Self-test Yatzee completati.');
        }

        /* ============================================================
           INIT
           ============================================================ */
        function init() {
            const prefs = loadRaw(SETTINGS_KEY) || {};
            state.settings = Object.assign(defaultSettings(), prefs);
            if (DIFFICULTIES[prefs.difficulty]) state.difficulty = prefs.difficulty;
            const saved = loadRaw(SAVE_KEY);
            let restored = false;
            if (saved) {
                const settings = state.settings;
                state = normalizeState(saved);
                state.settings = settings;
                restored = true;
            }
            buildDice();
            buildScorecard();
            bindEvents();
            renderAll();
            if (restored) showToast('Partita ripristinata');
            else openModal('difficulty-modal');
            showTurnBanner();
            checkAi();
            if (location.hash === '#test') runSelfTests();
        }

        init();
    })();
    </script>
