<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e17">
<title>L'ULTIMO RINTOCCO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#d4af5a;font-size:clamp(28px,10vw,72px);text-align:center;text-shadow:0 0 30px rgba(212,175,90,.5),0 0 60px rgba(212,175,90,.2);letter-spacing:clamp(4px,2vw,16px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#888;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #d4af5a;background:rgba(212,175,90,.08);color:#d0d0d0;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(212,175,90,.2);box-shadow:0 0 24px rgba(212,175,90,.2)}
#credit{position:fixed;bottom:16px;color:#444;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">L'ULTIMO RINTOCCO</div>
  <div id="sub">un rintocco · una scelta · una memoria</div>
  <button id="apri" onclick="window.location.href='echoes-of-the-last-dawn/index.html'">GIOCA</button>
</div>
<div id="credit">Un JRPG su amore, memoria e paura della morte</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e17);
scene.fog = new THREE.FogExp2(0x0b0e17, 0.018);

const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
camera.position.set(0, 3, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.75;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.12;

const amb = new THREE.AmbientLight(0x1a1a2e, 0.4);
scene.add(amb);

const goldLight = new THREE.PointLight(0xd4af5a, 3, 20, 1.5);
goldLight.position.set(0, 4, 0);
scene.add(goldLight);

const blueLight = new THREE.PointLight(0x6d8fd1, 2, 16, 1.5);
blueLight.position.set(-3, 2, 2);
scene.add(blueLight);

const redLight = new THREE.PointLight(0xc14b3f, 1.5, 14, 1.5);
redLight.position.set(3, 1, -2);
scene.add(redLight);

const towerGroup = new THREE.Group();
scene.add(towerGroup);

const stoneMat = new THREE.MeshStandardMaterial({
  color: 0x171a26, emissive: 0x171a26, emissiveIntensity: 0.3,
  roughness: 0.95, flatShading: true
});
const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.6, 7, 10), stoneMat);
tower.position.y = 3.5;
tower.castShadow = true;
towerGroup.add(tower);

const spireGeo = new THREE.ConeGeometry(0.8, 2.4, 8);
const spire = new THREE.Mesh(spireGeo, stoneMat);
spire.position.y = 8.2;
towerGroup.add(spire);

const winMat = new THREE.MeshStandardMaterial({
  color: 0xffd98a, emissive: 0xffb24d, emissiveIntensity: 1.6,
  roughness: 0.2, metalness: 0, transparent: true, opacity: 0.85
});
const win = new THREE.Mesh(new THREE.CircleGeometry(0.32, 12), winMat);
win.position.set(0, 4.6, 1.11);
towerGroup.add(win);
const win2 = new THREE.Mesh(new THREE.CircleGeometry(0.22, 12), winMat);
win2.position.set(0, 6.1, 1.03);
towerGroup.add(win2);

const bellMat = new THREE.MeshStandardMaterial({
  color: 0xd4af5a, emissive: 0xd4af5a, emissiveIntensity: 0.8,
  roughness: 0.3, metalness: 0.6
});
const bell = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.6, 10), bellMat);
bell.rotation.x = Math.PI;
bell.position.set(0, 2.4, -1.6);
towerGroup.add(bell);

const ringGeo = new THREE.RingGeometry(0.8, 1.1, 32);
const ringMat = new THREE.MeshStandardMaterial({
  color: 0xf2d389, emissive: 0xf2d389, emissiveIntensity: 1.2,
  roughness: 0.3, metalness: 0.4, side: THREE.DoubleSide, transparent: true, opacity: 0.7
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.position.set(0, 5.5, 0);
ring.rotation.x = Math.PI / 2;
towerGroup.add(ring);

const emojis = ['🔔','⚔️','🎵','🕯️','📜','💀','✨','🌙'];
const emojiSprites = [];
for (let i = 0; i < emojis.length; i++) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '80px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emojis[i], 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.6 });
  const sprite = new THREE.Sprite(mat);
  const angle = (i / emojis.length) * Math.PI * 2;
  const radius = 5.0 + Math.random() * 1.5;
  sprite.position.set(Math.cos(angle) * radius, 2.0 + Math.sin(i * 1.3) * 1.5, Math.sin(angle) * radius);
  sprite.scale.set(0.8, 0.8, 1);
  scene.add(sprite);
  emojiSprites.push({ sprite, angle, radius, baseY: sprite.position.y, speed: 0.12 + Math.random() * 0.08 });
}

function createGlowTexture(r, g, b) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, `rgba(255,255,255,1)`);
  grad.addColorStop(0.2, `rgba(${r},${g},${b},0.5)`);
  grad.addColorStop(0.5, `rgba(${r},${g},${b},0.12)`);
  grad.addColorStop(1, `rgba(255,255,255,0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowGold = new THREE.Sprite(new THREE.SpriteMaterial({
  map: createGlowTexture(212, 175, 90), transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending
}));
glowGold.scale.set(7, 7, 1);
towerGroup.add(glowGold);

const PARTICLES = 500;
const pGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLES * 3);
const colors = new Float32Array(PARTICLES * 3);
const pVelocities = new Float32Array(PARTICLES * 3);
const pColors = [
  [0.83, 0.69, 0.35],
  [0.76, 0.29, 0.25],
  [0.43, 0.56, 0.82],
  [0.44, 0.73, 0.55],
  [0.95, 0.83, 0.54],
  [0.30, 0.76, 1.0],
];
for (let i = 0; i < PARTICLES; i++) {
  positions[i*3] = (Math.random()-0.5) * 30;
  positions[i*3+1] = (Math.random()-0.5) * 15;
  positions[i*3+2] = (Math.random()-0.5) * 30;
  const c = pColors[Math.floor(Math.random()*pColors.length)];
  colors[i*3] = c[0];
  colors[i*3+1] = c[1];
  colors[i*3+2] = c[2];
  pVelocities[i*3] = (Math.random()-0.5) * 0.003;
  pVelocities[i*3+1] = (Math.random()-0.5) * 0.002;
  pVelocities[i*3+2] = (Math.random()-0.5) * 0.003;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const pMat = new THREE.PointsMaterial({
  size: 0.1, vertexColors: true, transparent: true, opacity: 0.65,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

const mouse = new THREE.Vector2(9999, 9999);
let touchActive = false;
function onPointerMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function onPointerDown() { touchActive = true; }
function onPointerUp() { touchActive = false; mouse.set(9999, 9999); }
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointerend', onPointerUp);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.3, 0.5, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  composer.setSize(w, h);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  towerGroup.position.y = Math.sin(t * 0.4) * 0.15;
  towerGroup.rotation.y = Math.sin(t * 0.12) * 0.1;

  winMat.emissiveIntensity = 1.2 + Math.sin(t * 2.2) * 0.4;

  ring.rotation.z = t * 0.3;
  const ringPulse = 1 + Math.sin(t * 2.5) * 0.1;
  ring.scale.set(ringPulse, ringPulse, 1);
  ringMat.opacity = 0.5 + Math.sin(t * 1.8) * 0.2;

  goldLight.intensity = 3 + Math.sin(t * 1.5) * 0.5;
  blueLight.position.x = -3 + Math.sin(t * 0.6) * 1.5;
  redLight.position.z = -2 + Math.cos(t * 0.5) * 2;

  for (const e of emojiSprites) {
    e.angle += e.speed * 0.008;
    e.sprite.position.x = Math.cos(e.angle) * e.radius;
    e.sprite.position.z = Math.sin(e.angle) * e.radius;
    e.sprite.position.y = e.baseY + Math.sin(t * 0.7 + e.angle * 2) * 0.4;
  }

  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < PARTICLES; i++) {
    pos[i*3] += pVelocities[i*3];
    pos[i*3+1] += pVelocities[i*3+1];
    pos[i*3+2] += pVelocities[i*3+2];
    if (pos[i*3] > 15) pos[i*3] = -15;
    if (pos[i*3] < -15) pos[i*3] = 15;
    if (pos[i*3+1] > 7.5) pos[i*3+1] = -7.5;
    if (pos[i*3+1] < -7.5) pos[i*3+1] = 7.5;
    if (pos[i*3+2] > 15) pos[i*3+2] = -15;
    if (pos[i*3+2] < -15) pos[i*3+2] = 15;
    if (touchActive) {
      const dx = (mouse.x * 8) - pos[i*3];
      const dy = (mouse.y * 6) - pos[i*3+1];
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 5) {
        const force = 0.0002 / (dist + 0.5);
        pVelocities[i*3] += dx * force;
        pVelocities[i*3+1] += dy * force;
      }
    }
    pVelocities[i*3] *= 0.999;
    pVelocities[i*3+1] *= 0.999;
    pVelocities[i*3+2] *= 0.999;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
