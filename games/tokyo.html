<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tokyo">
    <title>TOKYO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #00d4ff;
            --text-main: #ffffff;
            --text-muted: #a0c0e0;
            --dice-bg: #ffffff;
            --dice-text: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #07101b, #0f1724);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            margin: 0;
            text-align: center;
            flex-grow: 1;
        }

        .game-area {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 40px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .dice {
            width: 100px;
            height: 100px;
            background: var(--dice-bg);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--dice-text);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            position: relative;
        }

        .dice.spinning {
            animation: spin 0.6s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .spin-button {
            background: var(--accent);
            border: none;
            color: #0f1724;
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .spin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            background: #33e0ff;
        }

        .spin-button:active {
            transform: translateY(1px);
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-text {
            margin-top: 30px;
            font-size: 1.5rem;
            text-align: center;
            min-height: 2rem;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .result-highlight {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html#games" class="back-btn">← Back</a>
        </div>
        
        <h1>TOKYO</h1>

        <div class="game-area">
            <div class="dice-container">
                <div class="dice" id="dice1">
                    <span id="value1">?</span>
                </div>
                
                <div class="dice" id="dice2">
                    <span id="value2">?</span>
                </div>
            </div>
            
            <button class="spin-button" id="spinButton">LANCIA</button>
            
            <div class="result-text" id="resultText">Premi LANCIA per giocare!</div>
        </div>
    </div>

    <script>
        class DiceGame {
            constructor() {
                this.dice1 = document.getElementById('dice1');
                this.dice2 = document.getElementById('dice2');
                this.value1 = document.getElementById('value1');
                this.value2 = document.getElementById('value2');
                this.spinButton = document.getElementById('spinButton');
                this.resultText = document.getElementById('resultText'); 
                
                this.spinButton.addEventListener('click', () => this.spin());
            }
            
            getRandomDiceValue() {
                return Math.floor(Math.random() * 6) + 1;
            }
            
            spin() {
                this.spinButton.disabled = true;
                this.resultText.textContent = "Lancio...";
                this.resultText.className = "result-text";
                
                this.dice1.classList.add('spinning');
                this.dice2.classList.add('spinning');
                
                // Randomize values during spin for effect
                let interval = setInterval(() => {
                    this.value1.textContent = this.getRandomDiceValue();
                    this.value2.textContent = this.getRandomDiceValue();
                }, 100);

                setTimeout(() => {
                    clearInterval(interval);
                    this.dice1.classList.remove('spinning');
                    this.dice2.classList.remove('spinning');
                    
                    const finalValue1 = this.getRandomDiceValue();
                    const finalValue2 = this.getRandomDiceValue();
                    
                    this.value1.textContent = finalValue1;
                    this.value2.textContent = finalValue2;

                    this.displayResults(finalValue1, finalValue2);
                    
                    this.spinButton.disabled = false;
                }, 1000);
            }
            
            displayResults(value1, value2) {
                const sortedValues = [value1, value2].sort((a, b) => b - a); // Descending
                const v1 = sortedValues[0]; // Higher
                const v2 = sortedValues[1]; // Lower

                let text = "";
                let highlight = false;

                // User provided specific text for combinations, let's map them exactly as requested
                const s = [value1, value2].sort(); // Ascending for user logic check
                
                if (value1 === value2) {
                    text = `Coppia di ${value1}!`;
                    highlight = true;
                } else if ((value1 === 2 && value2 === 1) || (value1 === 1 && value2 === 2)) {
                    text = `TOKYO! 🗼`;
                    highlight = true;
                } else if (s[1] === 3 && s[0] === 1) {
                    text = `Trokio!`;
                } else if (s[1] === 4 && s[0] === 2) {
                    text = `Lasen!`;
                } else {
                    // Fallback for numbers like 65, 64 etc.
                    // User listed them explicitly, but the pattern is just HighLow
                    text = `${s[1]}${s[0]}!`;
                }

                this.resultText.textContent = text;
                if (highlight) {
                    this.resultText.classList.add('result-highlight');
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new DiceGame();
        });
    </script>
</body>
</html>
