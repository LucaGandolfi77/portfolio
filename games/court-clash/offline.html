<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081426">
  <title>Court Clash — Offline</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; background: radial-gradient(700px 400px at 50% 0, rgba(77,232,255,.12), transparent 60%), #071120;
      color: #eef4ff; font-family: Inter, -apple-system, sans-serif; text-align: center;
    }
    .card {
      max-width: 440px; padding: 28px; border: 1px solid rgba(150,200,255,.18);
      border-radius: 20px; background: linear-gradient(160deg, #12233e, #081426);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .ball { font-size: 42px; margin-bottom: 8px; }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.03em; }
    p { margin: 0 0 18px; color: #93a8c8; font-size: 13px; line-height: 1.6; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 18px;
      border-radius: 12px; background: linear-gradient(120deg, #4de8ff, #a78bfa); color: #04121b;
      font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ball" aria-hidden="true">🏀</div>
    <h1>Court Clash is offline</h1>
    <p>The app needs one online visit to cache the latest files. Check your connection, then reload.</p>
    <a href="./index.html">Reload Court Clash</a>
  </div>
</body>
</html>
