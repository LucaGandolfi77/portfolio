<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffcb05;
            --secondary: #3b4cca;
            --bg: #f0f0f0;
            --card-bg: #ffffff;
            --type-normal: #A8A77A;
            --type-fire: #EE8130;
            --type-water: #6390F0;
            --type-electric: #F7D02C;
            --type-grass: #7AC74C;
            --type-ice: #96D9D6;
            --type-fighting: #C22E28;
            --type-poison: #A33EA1;
            --type-ground: #E2BF65;
            --type-flying: #A98FF3;
            --type-psychic: #F95587;
            --type-bug: #A6B91A;
            --type-rock: #B6A136;
            --type-ghost: #735797;
            --type-dragon: #6F35FC;
            --type-steel: #B7B7CE;
            --type-fairy: #D685AD;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #dc0a2d; /* Pokedex Red */
            margin: 0;
            padding: 0;
            color: #333;
            min-height: 100vh;
        }

        .navbar {
            background-color: #cc0000;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 4px solid #8b0000;
        }

        .nav-brand {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        .pokedex-header {
            text-align: center;
            padding: 2rem 1rem;
            color: white;
        }

        .pokedex-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            text-shadow: 4px 4px 0 #3b4cca;
            margin: 0;
            letter-spacing: 2px;
        }

        .search-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            outline: none;
            transition: transform 0.2s;
        }

        #searchInput:focus {
            transform: scale(1.02);
        }

        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .pokemon-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .pokemon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .pokemon-id {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #888;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .pokemon-img-container {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pokemon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .pokemon-name {
            text-transform: capitalize;
            font-size: 1.4rem;
            margin: 15px 0 10px;
            font-weight: 700;
            color: #333;
        }

        .types {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .type-badge {
            padding: 4px 12px;
            border-radius: 12px;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            color: #666;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 20px;
            display: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #666;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-img {
            width: 200px;
            height: 200px;
            image-rendering: pixelated;
        }

        .modal-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .progress-bar {
            background: #eee;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            background: #4caf50;
            border-radius: 4px;
        }

        .load-more-btn {
            display: block;
            margin: 20px auto 40px;
            padding: 12px 30px;
            background: #3b4cca;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #2a3690;
            transition: transform 0.1s;
        }

        .load-more-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="../index.html" class="nav-brand">
            <span>← Back</span>
        </a>
    </nav>

    <div class="pokedex-header">
        <h1 class="pokedex-title">POKÉDEX</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Pokémon by name or ID...">
        </div>
    </div>

    <div class="pokemon-grid" id="pokemonGrid">
        <!-- Cards will be injected here -->
    </div>

    <div class="loading" id="loading">Loading Pokémon...</div>
    <button class="load-more-btn" id="loadMoreBtn">Load More</button>

    <!-- Modal -->
    <div class="modal" id="pokemonModal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-header">
                <h2 id="modalName" style="text-transform: capitalize; margin: 0;"></h2>
                <span id="modalId" style="color: #888; font-weight: bold;"></span>
                <div class="pokemon-img-container" style="margin-top: 10px;">
                    <img id="modalImg" class="modal-img" src="" alt="">
                </div>
                <div id="modalTypes" class="types" style="margin-top: 15px;"></div>
            </div>
            
            <div style="display: flex; justify-content: space-around; margin-bottom: 20px; text-align: center;">
                <div>
                    <div style="font-size: 0.8rem; color: #666;">Height</div>
                    <div id="modalHeight" style="font-weight: bold;"></div>
                </div>
                <div>
                    <div style="font-size: 0.8rem; color: #666;">Weight</div>
                    <div id="modalWeight" style="font-weight: bold;"></div>
                </div>
            </div>

            <h3 style="margin-bottom: 10px;">Base Stats</h3>
            <div id="modalStats">
                <!-- Stats bars -->
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('pokemonGrid');
        const loading = document.getElementById('loading');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('pokemonModal');
        const closeBtn = document.querySelector('.close-btn');

        let offset = 0;
        const limit = 20;
        let allPokemons = []; // Cache for search
        let isSearching = false;

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const typeColors = {
            normal: 'var(--type-normal)',
            fire: 'var(--type-fire)',
            water: 'var(--type-water)',
            electric: 'var(--type-electric)',
            grass: 'var(--type-grass)',
            ice: 'var(--type-ice)',
            fighting: 'var(--type-fighting)',
            poison: 'var(--type-poison)',
            ground: 'var(--type-ground)',
            flying: 'var(--type-flying)',
            psychic: 'var(--type-psychic)',
            bug: 'var(--type-bug)',
            rock: 'var(--type-rock)',
            ghost: 'var(--type-ghost)',
            dragon: 'var(--type-dragon)',
            steel: 'var(--type-steel)',
            fairy: 'var(--type-fairy)',
        };

        async function fetchPokemons() {
            loading.style.display = 'block';
            loadMoreBtn.style.display = 'none';
            
            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${limit}&offset=${offset}`);
                const data = await response.json();
                
                const promises = data.results.map(p => fetch(p.url).then(res => res.json()));
                const pokemons = await Promise.all(promises);
                
                pokemons.forEach(createPokemonCard);
                offset += limit;
                
                loading.style.display = 'none';
                if (!isSearching) loadMoreBtn.style.display = 'block';
            } catch (error) {
                console.error('Error fetching Pokemon:', error);
                loading.textContent = 'Error loading Pokémon. Please try again.';
            }
        }

        function createPokemonCard(pokemon) {
            const card = document.createElement('div');
            card.className = 'pokemon-card';
            
            const typesHtml = pokemon.types.map(t => 
                `<span class="type-badge" style="background-color: ${typeColors[t.type.name] || '#777'}">${escapeHtml(t.type.name)}</span>`
            ).join('');

            const id = pokemon.id.toString().padStart(3, '0');
            const imgUrl = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;

            card.innerHTML = `
                <span class="pokemon-id">#${id}</span>
                <div class="pokemon-img-container">
                    <img class="pokemon-img" src="${escapeHtml(imgUrl)}" alt="${escapeHtml(pokemon.name)}" loading="lazy">
                </div>
                <h2 class="pokemon-name">${escapeHtml(pokemon.name)}</h2>
                <div class="types">${typesHtml}</div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Height</span>
                        <span class="stat-value">${pokemon.height / 10}m</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Weight</span>
                        <span class="stat-value">${pokemon.weight / 10}kg</span>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => openModal(pokemon));
            grid.appendChild(card);
        }

        function openModal(pokemon) {
            document.getElementById('modalName').textContent = pokemon.name;
            document.getElementById('modalId').textContent = '#' + pokemon.id.toString().padStart(3, '0');
            document.getElementById('modalImg').src = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;
            document.getElementById('modalHeight').textContent = (pokemon.height / 10) + 'm';
            document.getElementById('modalWeight').textContent = (pokemon.weight / 10) + 'kg';

            const typesContainer = document.getElementById('modalTypes');
            typesContainer.innerHTML = pokemon.types.map(t => 
                `<span class="type-badge" style="background-color: ${typeColors[t.type.name] || '#777'}">${escapeHtml(t.type.name)}</span>`
            ).join('');

            const statsContainer = document.getElementById('modalStats');
            statsContainer.innerHTML = pokemon.stats.map(s => `
                <div style="margin-bottom: 8px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
                        <span style="text-transform:uppercase; color:#666; font-size:0.75rem;">${escapeHtml(s.stat.name.replace('-', ' '))}</span>
                        <span style="font-weight:bold;">${s.base_stat}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${(s.base_stat / 255) * 100}%; background-color: ${getStatColor(s.base_stat)}"></div>
                    </div>
                </div>
            `).join('');

            modal.style.display = 'flex';
        }

        function getStatColor(val) {
            if (val < 50) return '#ff4d4d';
            if (val < 100) return '#ffa600';
            return '#4caf50';
        }

        // Search functionality
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            clearTimeout(searchTimeout);
            
            if (term.length === 0) {
                isSearching = false;
                grid.innerHTML = '';
                offset = 0;
                fetchPokemons();
                return;
            }

            isSearching = true;
            loadMoreBtn.style.display = 'none';
            
            searchTimeout = setTimeout(async () => {
                loading.style.display = 'block';
                grid.innerHTML = '';
                
                try {
                    // If searching by ID
                    if (!isNaN(term)) {
                        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${term}`);
                        if (res.ok) {
                            const data = await res.json();
                            createPokemonCard(data);
                        }
                    } else {
                        // Search by name (requires fetching list first if not cached, but for simplicity we'll use the endpoint directly if exact match, or filter a larger list)
                        // PokeAPI doesn't support partial search on the server side easily without fetching all names.
                        // Let's try to fetch a specific pokemon first
                        try {
                            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${term}`);
                            if (res.ok) {
                                const data = await res.json();
                                createPokemonCard(data);
                            } else {
                                // If not exact match, maybe we can't do much without fetching ALL names.
                                // For this demo, let's just support exact name or ID, 
                                // OR we can fetch the first 1000 names and filter locally (better UX).
                                if (allPokemons.length === 0) {
                                    const allRes = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1000');
                                    const allData = await allRes.json();
                                    allPokemons = allData.results;
                                }
                                
                                const matches = allPokemons.filter(p => p.name.includes(term)).slice(0, 20);
                                const promises = matches.map(p => fetch(p.url).then(r => r.json()));
                                const results = await Promise.all(promises);
                                results.forEach(createPokemonCard);
                            }
                        } catch (e) {}
                    }
                } catch (e) {
                    console.log(e);
                }
                loading.style.display = 'none';
            }, 500);
        });

        loadMoreBtn.addEventListener('click', fetchPokemons);
        
        closeBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });

        // Initial load
        fetchPokemons();

    </script>
</body>
</html>
