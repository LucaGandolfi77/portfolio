<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title data-i18n="games.dama.title">Checkers — Luca Gandolfi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d18;--panel:rgba(14,22,40,.8);--panel2:rgba(20,30,52,.96);
  --line:rgba(150,195,255,.13);--line2:rgba(150,195,255,.25);
  --txt:#eaf3ff;--dim:#8b9fbe;--cyan:#4de8ff;--violet:#a98bff;--gold:#ffd166;--red:#ff5f6d;--green:#5ef0a8;
  --light:#e8d3ac;--dark:#31516b;--top:var(--site-top-bar-height,0px);
}
body[data-theme="wood"]{--bg:#1a1109;--panel:rgba(40,26,16,.8);--panel2:#2a1b10;--line:rgba(255,210,160,.15);
  --line2:rgba(255,210,160,.3);--txt:#fff3e2;--dim:#c2a98c;--cyan:#ffd08a;--violet:#ffb37a;--dark:#8a5a34;--light:#e8c393}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--txt);
  background:radial-gradient(800px 440px at 10% -10%,rgba(77,232,255,.12),transparent 60%),
    radial-gradient(700px 420px at 95% 5%,rgba(169,139,255,.12),transparent 60%),var(--bg);
  background-attachment:fixed;min-height:100vh;padding-top:calc(var(--top) + env(safe-area-inset-top,0px));
  -webkit-font-smoothing:antialiased;
}
.orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:-1;opacity:.4;pointer-events:none;animation:drift 13s ease-in-out infinite}
.orb.a{width:300px;height:300px;background:rgba(77,232,255,.13);top:-90px;left:-60px}
.orb.b{width:280px;height:280px;background:rgba(169,139,255,.12);bottom:-80px;right:-50px;animation-delay:-6s}
@keyframes drift{50%{transform:translate(25px,-20px) scale(1.12)}}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 40px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.back{color:var(--cyan);text-decoration:none;font-size:.8rem;font-weight:700}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:900}
h1 span{background:linear-gradient(92deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.8rem;color:var(--dim);margin-top:2px}
.spacer{flex:1}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 12px;
  border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);
  font:inherit;font-size:.75rem;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap}
.tb:hover,.tb.on{color:var(--cyan);border-color:rgba(77,232,255,.4);background:rgba(77,232,255,.1)}
.tb:disabled{opacity:.35;cursor:not-allowed}
select,input{background:rgba(4,10,20,.42);border:1px solid var(--line2);border-radius:10px;color:var(--txt);
  font:inherit;font-size:.76rem;padding:8px 10px;outline:none;min-height:38px}
body[data-theme="wood"] select,body[data-theme="wood"] input{background:rgba(70,45,25,.4)}
select:focus,input:focus{border-color:var(--cyan)}
.layout{display:grid;grid-template-columns:minmax(280px,1fr) 290px;gap:16px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.3)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border-radius:13px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:10px;font-size:.78rem}
.player{display:flex;align-items:center;gap:8px}
.pdot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9c1cd);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pdot.b{background:radial-gradient(circle at 35% 30%,#555,#0a0a0c)}
.clock{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;color:var(--gold)}
.player.active .clock{color:var(--cyan);text-shadow:0 0 12px rgba(77,232,255,.5)}
.status{text-align:center;font-size:.9rem;font-weight:800;color:var(--cyan);min-height:1.3em;margin-bottom:9px}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;
  border-radius:10px;overflow:hidden;border:6px solid #2a2119;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1}
.sq.light{background:var(--light)}.sq.dark{background:var(--dark)}
.sq::before{content:attr(data-coord);position:absolute;top:3px;left:4px;font-family:'JetBrains Mono',monospace;
  font-size:clamp(7px,1.1vw,11px);font-weight:700;opacity:.5}
.sq.light::before{color:#7a5638}.sq.dark::before{color:rgba(255,255,255,.7)}
.sq.sel{box-shadow:inset 0 0 0 5px rgba(255,209,102,.85)}
.sq.last{background-image:linear-gradient(rgba(255,235,120,.22),rgba(255,235,120,.22))}
.sq.legal::after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:rgba(20,30,50,.25)}
.sq.cap::after{content:'';position:absolute;inset:5%;border-radius:50%;border:5px solid rgba(30,40,60,.35)}
.sq.hintmove{box-shadow:inset 0 0 0 4px rgba(94,240,168,.8)}
.piece{width:84%;height:84%;border-radius:50%;position:relative;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45));
  display:block;pointer-events:none}
.piece.w{background:radial-gradient(circle at 35% 28%,#fff,#c3c9d4 65%,#8f9aa9);border:2px solid rgba(255,255,255,.8)}
.piece.b{background:radial-gradient(circle at 35% 28%,#5a5a66,#1c2029 65%,#080b12);border:2px solid rgba(255,255,255,.22)}
.piece::after{content:'';position:absolute;inset:12%;border-radius:50%;border:2px solid rgba(255,255,255,.22)}
.piece.king::before{content:'♛';position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(15px,4vw,34px);color:var(--gold);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.piece.pop{animation:pop .3s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{transform:scale(.3) rotate(-25deg);opacity:.4}to{transform:none;opacity:1}}
.piece.jump{animation:jump .32s ease}
@keyframes jump{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-28%) scale(1.16)}100%{transform:none}}
.capture-flash{position:absolute;inset:0;border-radius:50%;background:rgba(255,95,109,.6);animation:flash .4s ease forwards}
@keyframes flash{to{opacity:0;transform:scale(1.7)}}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.side h3{font-size:.66rem;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);font-weight:800;margin:0 0 9px}
.side h3:not(:first-child){margin-top:15px}
.captured{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}
.cap{width:20px;height:20px;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.cap.w{background:linear-gradient(140deg,#fff,#9aa5b5)}.cap.b{background:linear-gradient(140deg,#555,#111)}
.cap.k::after{content:'♛';font-size:12px;color:var(--gold);display:grid;place-items:center;height:100%}
.moves{height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px;
  font-family:'JetBrains Mono',monospace;font-size:.74rem;line-height:1.7;scrollbar-width:thin}
.mv{display:flex;gap:8px;padding:2px 4px;border-radius:6px}
.mv:nth-child(odd){background:rgba(255,255,255,.03)}
.mv .n{color:var(--dim);width:22px}.mv .w{color:var(--cyan)}.mv .b{color:var(--violet)}
.confetti{position:fixed;width:9px;height:13px;top:-20px;z-index:200;pointer-events:none;animation:cf 1.3s ease-in forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.modal{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(3,7,15,.78);backdrop-filter:blur(8px)}
.modal.on{display:flex}
.mcard{width:min(480px,100%);background:var(--panel2);border:1px solid var(--line2);border-radius:20px;
  padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.mcard h2{font-size:1.4rem;margin-bottom:10px}.mcard p{color:var(--dim);font-size:.86rem;line-height:1.6}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(10px);
  background:var(--panel2);border:1px solid var(--line2);border-radius:22px;padding:10px 17px;font-size:.8rem;
  font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:180;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="wrap">
  <div class="head">
    <a class="back" href="../index.html#games">← Portfolio</a>
    <div><h1><span>▣ DAMA</span></h1><div class="sub" data-i18n="games.dama.lead">La dama inglese: salta e cattura le pedine avversarie.</div></div>
    <div class="spacer"></div><button class="tb" id="themeBtn">🌙</button>
  </div>
  <div class="layout">
    <div class="card">
      <div class="bar">
        <div class="player active" id="pB"><span class="pdot b"></span><span class="clock" id="clockB">05:00</span></div>
        <div class="status" id="status">Bianco muove</div>
        <div class="player" id="pW"><span class="clock" id="clockW">05:00</span><span class="pdot"></span></div>
      </div>
      <div class="board" id="board"></div>
      <div class="controls">
        <select id="mode"><option value="pvp">PvP</option><option value="pvc">PvC</option></select>
        <select id="level"><option value="1">Facile</option><option value="2" selected>Medio</option><option value="3">Difficile</option></select>
        <select id="timeSel"><option value="0">No clock</option><option value="3">3 min</option><option value="5" selected>5 min</option><option value="10">10 min</option></select>
        <button class="tb" id="newBtn">Nuova</button><button class="tb" id="undoBtn">↶</button>
        <button class="tb" id="redoBtn">↷</button><button class="tb" id="flipBtn">↻</button>
        <button class="tb" id="hintBtn">💡</button><button class="tb" id="soundBtn">🔊</button>
      </div>
    </div>
    <div class="card side">
      <h3>Nere catturate</h3><div class="captured" id="capB"></div>
      <h3>Bianche catturate</h3><div class="captured" id="capW"></div>
      <h3>Mosse</h3><div class="moves" id="moves"></div>
      <h3>Partita</h3>
      <div class="bar"><span>Pedine bianche</span><b id="cntW">12</b></div>
      <div class="bar"><span>Pedine nere</span><b id="cntB">12</b></div>
      <div class="bar"><span>Senza cattura</span><b id="drawCnt">0</b></div>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="mcard"><h2 id="modalTitle">Fine partita</h2><p id="modalBody"></p>
  <button class="tb" id="modalBtn">Gioca ancora</button></div></div>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const idx=(r,c)=>r*8+c,rowOf=i=>i>>3,colOf=i=>i&7,inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const opposite=c=>c==='w'?'b':'w';
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ===== stato ===== */
const S={board:[],turn:'w',selected:-1,legal:[],history:[],future:[],movesLog:[],captured:{w:[],b:[]},
  mode:'pvp',level:2,over:false,result:'',last:null,hintSq:-1,multi:-1,flipped:false,sound:true,
  theme:'dark',time:{w:300,b:300},clockOn:false,lang:'en',quiet:0};
const KEY='dama-v1';

/* ===== regole ===== */
function initBoard(){
  S.board=new Array(64).fill(null);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if((r+c)%2===1){
      if(r<3)S.board[idx(r,c)]={c:'b',k:false};
      else if(r>4)S.board[idx(r,c)]={c:'w',k:false};
    }
  }
  S.turn='w';S.selected=-1;S.legal=[];S.history=[];S.future=[];S.movesLog=[];
  S.captured={w:[],b:[]};S.over=false;S.result='';S.last=null;S.multi=-1;S.quiet=0;
}
function dirsFor(p){
  const d=[];
  if(!p.k)d.push(p.c==='w'?[-1,-1]:[1,-1],p.c==='w'?[-1,1]:[1,1]);
  else d.push([-1,-1],[-1,1],[1,-1],[1,1]);
  return d;
}
function movesAt(b,i,multi){
  const p=b[i];if(!p)return[];
  const out=[],r=rowOf(i),c=colOf(i),dirs=dirsFor(p);
  if(multi){
    for(const[dr,dc]of dirs){const mr=r+dr,mc=c+dc,jr=r+2*dr,jc=c+2*dc;
      if(!inB(jr,jc))continue;
      const mid=b[idx(mr,mc)],dest=b[idx(jr,jc)];
      if(mid&&mid.c!==p.c&&!dest)out.push({from:i,to:idx(jr,jc),cap:idx(mr,mc),jump:true});
    }
    return out;
  }
  let hasJump=false;
  const jumps=[];
  for(const[dr,dc]of dirs){const mr=r+dr,mc=c+dc,jr=r+2*dr,jc=c+2*dc;
    if(!inB(jr,jc))continue;
    const mid=b[idx(mr,mc)],dest=b[idx(jr,jc)];
    if(mid&&mid.c!==p.c&&!dest){jumps.push({from:i,to:idx(jr,jc),cap:idx(mr,mc),jump:true});hasJump=true}
  }
  if(hasJump)return jumps;
  for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;
    if(inB(nr,nc)&&!b[idx(nr,nc)])out.push({from:i,to:idx(nr,nc),jump:false});
  }
  return out;
}
function allMoves(b,color){
  let all=[];
  for(let i=0;i<64;i++)if(b[i]&&b[i].c===color)all=all.concat(movesAt(b,i,false));
  const j=all.filter(m=>m.jump);
  return j.length?j:all;
}
function countPieces(b,color){let n=0;for(let i=0;i<64;i++)if(b[i]&&b[i].c===color)n++;return n}
function pieceName(p){return p?(p.k?'♛':'●'):''}

/* ===== snapshot ===== */
function snap(){return {board:S.board.map(p=>p?{c:p.c,k:p.k}:null),turn:S.turn,
  captured:{w:S.captured.w.slice(),b:S.captured.b.slice()},movesLog:S.movesLog.slice(),
  quiet:S.quiet,last:S.last?Object.assign({},S.last):null,result:S.result,over:S.over}}
function restore(p){S.board=p.board.map(x=>x?{c:x.c,k:x.k}:null);S.turn=p.turn;
  S.captured={w:p.captured.w.slice(),b:p.captured.b.slice()};S.movesLog=p.movesLog.slice();
  S.quiet=p.quiet;S.last=p.last?Object.assign({},p.last):null;S.result=p.result;S.over=p.over;
  S.selected=-1;S.legal=[];S.multi=-1}

/* ===== applicazione ===== */
function applyMove(m,kingOverride){
  S.history.push(snap());S.future.length=0;
  const p=S.board[m.from],color=S.turn;
  S.board[m.to]=p;S.board[m.from]=null;
  let capColor=null;
  if(m.jump){const cap=S.board[m.cap];capColor=cap.c;S.captured[color].push(cap);S.board[m.cap]=null;S.quiet=0}
  else S.quiet++;
  let promoted=false;
  if(!p.k&&((p.c==='w'&&rowOf(m.to)===0)||(p.c==='b'&&rowOf(m.to)===7))){p.k=true;promoted=true}
  S.last={from:m.from,to:m.to,cap:m.jump?m.cap:-1};
  const notation=(m.jump?'×':'-')+sqName(m.to)+(promoted?'=D':'');
  if(S.turn==='w')S.movesLog.push({n:S.movesLog.length+1,w:notation,b:''});
  else if(S.movesLog.length)S.movesLog[S.movesLog.length-1].b=notation;
  else S.movesLog.push({n:1,w:'',b:notation});
  beep(m.jump?260:520,capColor?true:false);
  if(capColor)flash(m.cap);
  // multi-salto
  if(m.jump&&!promoted){
    const follow=movesAt(S.board,m.to,true);
    if(follow.length){S.multi=m.to;S.selected=m.to;S.legal=follow;renderAll();return}
  }
  S.multi=-1;S.selected=-1;S.legal=[];
  S.turn=opposite(color);
  checkEnd();
  renderAll();
  if(S.over)showResult();
  else if(S.mode==='pvc'&&S.turn==='b')aiMove();
}
function checkEnd(){
  const bCount=countPieces(S.board,'b'),wCount=countPieces(S.board,'w');
  if(!bCount){S.over=true;S.result='1-0';return}
  if(!wCount){S.over=true;S.result='0-1';return}
  if(!allMoves(S.board,S.turn).length){S.over=true;S.result=S.turn==='w'?'0-1':'1-0';return}
  if(S.quiet>=80){S.over=true;S.result='½-½'}
}
function sqName(i){return 'abcdefgh'[colOf(i)]+(8-rowOf(i))}
function undo(){if(!S.history.length)return;S.future.push(snap());restore(S.history.pop());closeModals();renderAll()}
function redo(){if(!S.future.length)return;S.history.push(snap());restore(S.future.pop());renderAll()}

/* ===== AI ===== */
function evaluate(b,color){
  let s=0;
  for(let i=0;i<64;i++){const p=b[i];if(!p)continue;
    let v=p.k?180:100;
    const r=rowOf(i);
    v+=p.c==='w'?(7-r)*4:r*4; // avanzamento
    v+=3.5-Math.abs(3.5-colOf(i)); // centralità
    s+=p.c===color?v:-v}
  return s;
}
function outcomes(b,m,color){
  const nb=b.map(p=>p?{c:p.c,k:p.k}:null),p=nb[m.from];
  nb[m.to]=p;nb[m.from]=null;
  if(m.jump)nb[m.cap]=null;
  if(!p.k&&((p.c==='w'&&rowOf(m.to)===0)||(p.c==='b'&&rowOf(m.to)===7)))p.k=true;
  const res=[nb];
  if(m.jump){
    const follow=movesAt(nb,m.to,true);
    if(follow.length&&!p.k){for(const fm of follow)res.push(...outcomes(nb,fm,color))}
  }
  return res;
}
function minimax(b,color,depth,alpha,beta,root){
  const moves=allMoves(b,color);
  if(depth<=0||!moves.length||!countPieces(b,'w')||!countPieces(b,'b'))return evaluate(b,root);
  moves.sort((a,b2)=>(b2.jump?1:0)-(a.jump?1:0));
  if(color===root){
    let best=-Infinity;
    for(const m of moves)for(const nb of outcomes(b,m,color)){
      best=Math.max(best,minimax(nb,opposite(color),depth-1,alpha,beta,root));
      alpha=Math.max(alpha,best);if(beta<=alpha)break;
    }
    return best;
  }else{
    let best=Infinity;
    for(const m of moves)for(const nb of outcomes(b,m,color)){
      best=Math.min(best,minimax(nb,opposite(color),depth-1,alpha,beta,root));
      beta=Math.min(beta,best);if(beta<=alpha)break;
    }
    return best;
  }
}
function aiMove(){
  S.thinking=true;renderAll();
  setTimeout(()=>{
    const moves=allMoves(S.board,'b');
    if(!moves.length){S.thinking=false;return}
    const depth=[0,1,3,5][S.level]||3;
    let best=-Infinity,bestM=moves[0];
    for(const m of moves){
      let score=0;
      for(const nb of outcomes(S.board,m,'b'))score=Math.max(score,minimax(nb,'w',depth-1,-Infinity,Infinity,'b'));
      score+=Math.random()*.1;
      if(score>best){best=score;bestM=m}
    }
    S.thinking=false;applyMove(bestM);
  },140);
}
function hint(){
  const moves=allMoves(S.board,S.turn);if(!moves.length)return toast('Nessuna mossa');
  const m=pick(moves);S.hintSq=m.to;renderAll();
  setTimeout(()=>{S.hintSq=-1;renderAll()},1500);
  toast('Suggerimento: '+sqName(m.from)+' → '+sqName(m.to));
}

/* ===== rendering ===== */
function renderBoard(){
  const b=$('board');b.innerHTML='';
  for(let i=0;i<64;i++){
    const r=rowOf(i),c=colOf(i),sq=document.createElement('div');
    sq.className='sq '+((r+c)%2===0?'light':'dark');
    sq.dataset.coord='abcdefgh'[c]+(8-r);
    if(S.last&&(S.last.from===i||S.last.to===i||S.last.cap===i))sq.classList.add('last');
    if(S.selected===i)sq.classList.add('sel');
    if(S.hintSq===i)sq.classList.add('hintmove');
    if(S.legal.some(m=>m.to===i))sq.classList.add(S.board[i]?'cap':'legal');
    const p=S.board[i];
    if(p){const el=document.createElement('div');
      el.className='piece '+p.c+(p.k?' king':'')+(S.last&&S.last.to===i?(S.last.cap>=0?' jump':' pop'):'');
      sq.appendChild(el)}
    sq.onclick=()=>tap(i);b.appendChild(sq)
  }
  b.style.transform=S.flipped?'rotate(180deg)':'';
  b.querySelectorAll('.sq').forEach(s=>s.style.transform=S.flipped?'rotate(180deg)':'');
}
function flash(i){const sq=$('board').children[i];if(!sq)return;
  const d=document.createElement('div');d.className='capture-flash';sq.appendChild(d);setTimeout(()=>d.remove(),420)}
function renderSide(){
  const draw=el=>el.map(p=>'<span class="cap '+p.c+(p.k?' k':'')+'"></span>').join('');
  $('capB').innerHTML=draw(S.captured.w);$('capW').innerHTML=draw(S.captured.b);
  const ml=$('moves');ml.innerHTML='';
  S.movesLog.forEach(m=>{const d=document.createElement('div');d.className='mv';
    d.innerHTML='<span class="n">'+(m.n||'')+'.</span><span class="w">'+(m.w||'')+'</span><span class="b">'+(m.b||'')+'</span>';
    ml.appendChild(d)});
  ml.scrollTop=ml.scrollHeight;
  $('cntW').textContent=countPieces(S.board,'w');$('cntB').textContent=countPieces(S.board,'b');
  $('drawCnt').textContent=S.quiet;
}
function renderStatus(){
  const el=$('status');
  if(S.over)el.textContent=S.result==='1-0'?'🏆 Vince il Bianco':S.result==='0-1'?'🏆 Vince il Nero':'🤝 Patta';
  else el.textContent=(S.turn==='w'?'Bianco':'Nero')+' muove'+(S.multi>=0?' · salta ancora!':'')+(S.thinking?' · AI pensa…':'');
  $('pW').classList.toggle('active',S.turn==='w');$('pB').classList.toggle('active',S.turn==='b');
  $('clockW').textContent=fmt(S.time.w);$('clockB').textContent=fmt(S.time.b);
  $('undoBtn').disabled=!S.history.length;$('redoBtn').disabled=!S.future.length;
}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderAll(){renderBoard();renderSide();renderStatus()}
function beep(f,capture){if(!S.sound)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)(),
  o=ac.createOscillator(),g=ac.createGain();o.type=capture?'sawtooth':'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.14)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('on'),1900)}
function confetti(){const cols=['#4de8ff','#a98bff','#ffd166','#5ef0a8'];
  for(let i=0;i<35;i++){const d=document.createElement('div');d.className='confetti';
    d.style.background=cols[i%4];d.style.left=Math.random()*100+'vw';
    d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}}
function showResult(){confetti();$('modalTitle').textContent=S.result==='1-0'?'🏆 Vince il Bianco':S.result==='0-1'?'🏆 Vince il Nero':'🤝 Patta';
  $('modalBody').textContent='Partita finita in '+S.movesLog.length+' mosse.';$('modal').classList.add('on')}
function closeModals(){$('modal').classList.remove('on')}

/* ===== input ===== */
function tap(i){
  if(S.over||S.thinking||(S.mode==='pvc'&&S.turn==='b'))return;
  const p=S.board[i];
  if(S.selected>=0){
    const m=S.legal.find(x=>x.to===i);
    if(m){applyMove(m);return}
  }
  if(p&&p.c===S.turn){
    const moves=movesAt(S.board,i,S.multi===i);
    if(moves.length){S.selected=i;S.legal=moves}
    else{S.selected=-1;S.legal=[]}
  }else{S.selected=-1;S.legal=[]}
  S.hintSq=-1;renderAll();
}
$('newBtn').onclick=()=>{
  initBoard();S.multi=-1;S.hintSq=-1;
  const min=+$('timeSel').value;S.time={w:min*60,b:min*60};S.clockOn=min>0;
  closeModals();renderAll()};
$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
$('flipBtn').onclick=()=>{S.flipped=!S.flipped;renderBoard()};
$('hintBtn').onclick=hint;
$('soundBtn').onclick=()=>{S.sound=!S.sound;$('soundBtn').textContent=S.sound?'🔊':'🔇';savePrefs()};
$('themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'wood':'dark';document.body.dataset.theme=S.theme;
  $('themeBtn').textContent=S.theme==='dark'?'🌙':'🪵';savePrefs()};
$('mode').onchange=e=>{S.mode=e.target.value;$('level').disabled=S.mode==='pvp';$('newBtn').click()};
$('level').onchange=e=>{S.level=+e.target.value;savePrefs()};
$('timeSel').onchange=()=>$('newBtn').click();
$('modalBtn').onclick=()=>$('newBtn').click();
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k=e.key.toLowerCase();
  if(k==='u')undo();if(k==='r')redo();if(k==='f')$('flipBtn').click();
  if(k==='h')hint();if(k==='n')$('newBtn').click();if(e.key==='Escape')closeModals();
});
function savePrefs(){try{localStorage.setItem('dama-prefs',JSON.stringify({sound:S.sound,theme:S.theme,level:S.level}))}catch(e){}}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('dama-prefs')||'{}');
  if(p.sound!==undefined)S.sound=p.sound;if(p.theme)S.theme=p.theme;if(p.level)S.level=p.level}catch(e){}}

/* ===== i18n + clock ===== */
const EMB={en:{'games.dama.lead':'English draughts: jump and capture your opponent’s pieces.'},
 it:{'games.dama.lead':'Dama inglese: salta e cattura le pedine avversarie.'}};
async function i18n(){const lang=S.lang||'en';let t=EMB[lang]||EMB.en;
  try{const r=await fetch('../i18n/'+lang+'.json');if(r.ok)t=Object.assign({},t,await r.json())}catch(e){}
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');
    const v=k.split('.').reduce((o,x)=>o&&o[x]!==undefined?o[x]:undefined,t);if(v)el.textContent=v});
}
setInterval(()=>{if(!S.clockOn||S.over||S.thinking)return;
  S.time[S.turn]=Math.max(0,S.time[S.turn]-1);
  if(S.time[S.turn]<=0){S.result=S.turn==='w'?'0-1':'1-0';S.over=true;showResult()}renderStatus()},1000);

/* ===== init ===== */
loadPrefs();document.body.dataset.theme=S.theme;
$('themeBtn').textContent=S.theme==='dark'?'🌙':'🪵';
$('soundBtn').textContent=S.sound?'🔊':'🔇';
$('mode').value=S.mode;$('level').value=S.level;$('level').disabled=S.mode==='pvp';
initBoard();const min=+$('timeSel').value;S.time={w:min*60,b:min*60};S.clockOn=min>0;
renderAll();i18n();
window.__dama={S:S,initBoard:initBoard,allMoves:allMoves,movesAt:movesAt,applyMove:applyMove,
  undo:undo,redo:redo,countPieces:countPieces,aiMove:aiMove,newGame:()=>$('newBtn').click()};
})();
</script>
</body>
</html>
