<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b6b9a">
    <title>Taboo — Word Game</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --bg2: #131a33;
            --accent: #ff3d8b;
            --accent2: #00e0ff;
            --good: #1fd97a;
            --bad: #ff5b5b;
            --card: #ffffff;
            --ink: #1a2238;
            --muted: #6b7390;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: radial-gradient(1200px 800px at 50% -10%, #1b2550 0%, var(--bg) 55%) fixed;
            color: #eaf0ff;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #app {
            max-width: 520px;
            margin: 0 auto;
            padding: calc(8px + var(--safe-t)) calc(14px + var(--safe-r)) calc(14px + var(--safe-b)) calc(14px + var(--safe-l));
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .brand {
            text-align: center;
            margin: 6px 0 10px;
        }
        .brand h1 {
            font-size: clamp(2.2rem, 11vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(120deg, var(--accent), #ffd166 40%, var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 6px 30px rgba(255,61,139,0.25);
        }
        .brand p { margin: 2px 0 0; color: #9fb0d8; font-size: 0.85rem; letter-spacing: 1px; }
        .panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(8px);
        }
        .seg {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0 4px;
        }
        .seg button {
            flex: 1 1 auto;
            min-width: 84px;
            padding: 12px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #cdd8f5;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform .12s, background .2s, border-color .2s;
        }
        .seg button:active { transform: scale(0.97); }
        .seg button.on {
            background: linear-gradient(120deg, var(--accent), #ff7eb3);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 22px rgba(255,61,139,0.35);
        }
        .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.4px; color: #8aa0d0; margin: 12px 0 0; }
        .bigbtn {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #08101f;
            background: linear-gradient(120deg, #ffd166, var(--accent2));
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,224,255,0.25);
        }
        .bigbtn:active { transform: translateY(1px); }
        .hide { display: none !important; }

        /* GAME */
        .hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .ring { position: relative; width: 76px; height: 76px; flex: 0 0 auto; }
        .ring svg { transform: rotate(-90deg); display: block; }
        .ring .num {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 1.45rem; font-weight: 900; color: #fff;
        }
        .scorebox { text-align: right; flex: 1; }
        .scorebox .s { font-size: 2rem; font-weight: 900; color: var(--accent2); }
        .scorebox .t { font-size: 0.75rem; color: #9fb0d8; letter-spacing: 1px; }
        .teamtag {
            text-align: center; font-weight: 800; letter-spacing: 2px; color: #ffd166;
            margin: 2px 0 8px; font-size: 0.9rem;
        }
        .card {
            background: var(--card);
            color: var(--ink);
            border-radius: 22px;
            padding: 22px 18px 18px;
            min-height: 320px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            touch-action: none;
            transition: transform .18s ease;
        }
        .card.do-correct { animation: pop .3s ease; }
        .card.do-skip { animation: shake .3s ease; }
        @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
        .card .kicker {
            position: absolute; top: 0; left: 0; right: 0; height: 10px;
            background: linear-gradient(90deg, var(--accent), #ffd166, var(--accent2));
        }
        .word {
            font-size: clamp(2.4rem, 13vw, 3.4rem);
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            margin: 14px 0 8px;
            color: #141a2e;
            word-break: break-word;
        }
        .taboos { list-style: none; padding: 0; margin: 6px 0 0; flex: 1; }
        .taboos li {
            text-align: center;
            font-size: clamp(1.1rem, 5.6vw, 1.5rem);
            font-weight: 700;
            color: #54607e;
            padding: 9px 0;
            border-bottom: 1px dashed #e3e8f3;
        }
        .taboos li:last-child { border-bottom: none; }
        .hint { text-align: center; color: #aab4d4; font-size: 0.72rem; margin-top: 8px; letter-spacing: 1px; }
        .actions { display: flex; gap: 12px; margin-top: 14px; }
        .actions button {
            flex: 1; padding: 20px 8px; border: none; border-radius: 16px; font-weight: 900;
            font-size: 1.05rem; letter-spacing: 1px; cursor: pointer; color: #fff;
        }
        .btn-correct { background: linear-gradient(120deg, var(--good), #19b86a); box-shadow: 0 10px 26px rgba(31,217,122,0.35); }
        .btn-skip { background: linear-gradient(120deg, #6b7390, #4a5270); }
        .actions button:active { transform: translateY(1px); }
        .mute {
            position: fixed; right: calc(10px + var(--safe-r)); bottom: calc(10px + var(--safe-b));
            width: 46px; height: 46px; border-radius: 50%; border: none; font-size: 1.2rem;
            background: rgba(255,255,255,0.1); color: #fff; z-index: 50; cursor: pointer;
        }

        /* OVERLAY */
        .overlay {
            position: fixed; inset: 0; background: rgba(6,10,22,0.82); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
        }
        .overlay .box {
            background: linear-gradient(180deg, #1a2244, #111733);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px; padding: 26px 22px; max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .overlay h2 { margin: 0 0 6px; font-size: 1.8rem; font-weight: 900; color: #ffd166; }
        .overlay .big { font-size: 3rem; font-weight: 900; color: var(--accent2); margin: 6px 0; }
        .overlay p { color: #cdd8f5; margin: 6px 0 14px; }
        .toast {
            position: fixed; left: 50%; top: calc(70px + var(--safe-t)); transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 20px;
            font-size: 0.85rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 120;
        }
        .toast.show { opacity: 1; }
        .footnote { text-align: center; font-size: 0.7rem; color: #6b7390; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="brand">
            <h1>TABOO</h1>
            <p>SAY THE WORD — NOT THE TABOOS</p>
        </div>

        <!-- SETUP -->
        <section id="setup">
            <div class="panel">
                <div class="label">Mode</div>
                <div class="seg" id="modeSeg">
                    <button data-mode="solo" class="on">🎯 Solo</button>
                    <button data-mode="teams">👥 2 Teams</button>
                </div>

                <div class="label">Language</div>
                <div class="seg" id="langSeg">
                    <button data-lang="en" class="on">🇬🇧 EN</button>
                    <button data-lang="it">🇮🇹 IT</button>
                    <button data-lang="es">🇪🇸 ES</button>
                    <button data-lang="fr">🇫🇷 FR</button>
                    <button data-lang="de">🇩🇪 DE</button>
                </div>

                <div class="label">Difficulty</div>
                <div class="seg" id="diffSeg">
                    <button data-diff="kids">👶 Kids</button>
                    <button data-diff="easy" class="on">🌱 Easy</button>
                    <button data-diff="medium">⚡ Medium</button>
                    <button data-diff="hard">🔥 Hard</button>
                    <button data-diff="insane">💀 Insane</button>
                </div>

                <div class="label">Timer</div>
                <div class="seg" id="timeSeg">
                    <button data-time="30">30s</button>
                    <button data-time="60" class="on">60s</button>
                    <button data-time="90">90s</button>
                </div>

                <button class="bigbtn" id="startBtn">START</button>
            </div>
            <div class="footnote">Swipe ↑ = correct · Swipe ↓ = skip</div>
        </section>

        <!-- GAME -->
        <section id="game" class="hide">
            <div class="hud">
                <div class="ring">
                    <svg width="76" height="76" viewBox="0 0 76 76">
                        <circle cx="38" cy="38" r="32" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="7"/>
                        <circle id="ringFg" cx="38" cy="38" r="32" fill="none" stroke="var(--accent2)" stroke-width="7"
                                stroke-linecap="round" stroke-dasharray="201.06" stroke-dashoffset="0"/>
                    </svg>
                    <div class="num" id="timerNum">60</div>
                </div>
                <div class="scorebox">
                    <div class="t" id="scoreLabel">SCORE</div>
                    <div class="s" id="scoreVal">0</div>
                </div>
            </div>
            <div class="teamtag hide" id="teamTag">TEAM A</div>

            <div class="card" id="card">
                <div class="kicker"></div>
                <div class="word" id="word">—</div>
                <ul class="taboos" id="taboos"></ul>
                <div class="hint">Swipe up = correct · swipe down = skip</div>
            </div>

            <div class="actions">
                <button class="btn-skip" id="skipBtn">SKIP</button>
                <button class="btn-correct" id="correctBtn">CORRECT</button>
            </div>
        </section>
    </div>

    <button class="mute" id="muteBtn" aria-label="Toggle sound">🔊</button>
    <div class="toast" id="toast"></div>

    <!-- BETWEEN / FINAL overlay -->
    <div class="overlay hide" id="overlay">
        <div class="box">
            <h2 id="ovTitle">Time!</h2>
            <div class="big" id="ovBig">0</div>
            <p id="ovText"></p>
            <button class="bigbtn" id="ovBtn">Continue</button>
        </div>
    </div>

    <script src="top_buttons.js"></script>
    <script>
    (function () {
        "use strict";

        var FALLBACK = {
            en: { easy: [
                {word:"PIZZA",taboo:["CHEESE","DOUGH","ITALY","SLICE","OVEN"]},
                {word:"CAT",taboo:["DOG","MEOW","PET","ANIMAL","WHISKERS"]},
                {word:"RAINBOW",taboo:["COLORS","RAIN","SKY","ARC","PRIDE"]},
                {word:"ROBOT",taboo:["METAL","MACHINE","WIRES","FUTURE","AUTOMATON"]},
                {word:"VOLCANO",taboo:["LAVA","ERUPT","MOUNTAIN","HOT","ASH"]},
                {word:"CAMERA",taboo:["PHOTO","LENS","PICTURE","CLICK","MEMORY"]}
            ], medium: [
                {word:"WIZARD",taboo:["MAGIC","WAND","SPELL","HAT","POTTER"]},
                {word:"OCTOPUS",taboo:["EIGHT","TENTACLES","OCEAN","INK","SUCKER"]},
                {word:"CASTLE",taboo:["KING","STONE","MOAT","KNIGHT","TOWER"]},
                {word:"SUBMARINE",taboo:["UNDERWATER","NAVY","DIVE","BOAT","WAR"]},
                {word:"SAXOPHONE",taboo:["JAZZ","BRASS","BLOW","MUSIC","GOLD"]},
                {word:"DRAGON",taboo:["FIRE","MYTH","FLY","SCALES","KNIGHT"]}
            ]},
            it: { easy: [
                {word:"PIZZA",taboo:["FORMAGGIO","IMPASTO","ITALIA","FETTA","FORNO"]},
                {word:"GATTO",taboo:["CANE","MIA","ANIMALE","ZAMPA","PELO"]},
                {word:"ARCOBALENO",taboo:["COLORI","PIOGGIA","CIELO","ARCO","ORGOGLIO"]},
                {word:"ROBOT",taboo:["METALLO","MACCHINA","FILI","FUTURO","ANDROIDE"]},
                {word:"VOLCANO",taboo:["LAVA","ERUZIONE","MONTAGNA","CALDO","CENERE"]},
                {word:"FOTOCAMERA",taboo:["FOTO","OBBIETTIVO","SCATTA","CLICK","RICORDO"]}
            ], medium: [
                {word:"MAGO",taboo:["MAGIA","BACCHETTA","INCANTO","CAPPELLO","POTTER"]},
                {word:"POLPO",            taboo:["OTTO","TENTACOLI","MARE","INCHIOSTRO","VENTOSA"]},
                {word:"CASTELLO",            taboo:["RE","PIETRA","FOSSATO","CAVALIERE","TORRE"]},
                {word:"SOMMERGIBILE",            taboo:["SOTTOACQUA","MARINA","IMMERGI","BARCA","GUERRA"]},
                {word:"SASSOFONO",            taboo:["JAZZ","OTTONE","SOFFIA","MUSICA","ORO"]},
                {word:"DRAGO",            taboo:["FUOCO","MITO","VOLA","SCAGLIE","CAVALIERE"]}
            ]},
            es: { easy: [
                {word:"PIZZA",taboo:["QUESO","MASA","ITALIA","REBANADA","HORNO"]},
                {word:"GATO",taboo:["PERRO","MAULLA","ANIMAL","PATA","PELO"]},
                {word:"ARCOIRIS",taboo:["COLORES","LLUVIA","CIELO","ARCO","ORGULLO"]},
                {word:"ROBOT",taboo:["METAL","MAQUINA","CABLES","FUTURO","ANDROIDE"]},
                {word:"VOLCAN",taboo:["LAVA","ERUPCION","MONTAÑA","CALIENTE","CENIZA"]},
                {word:"CAMARA",taboo:["FOTO","LENTE","RETRANCA","CLICK","RECUERDO"]}
            ], medium: [
                {word:"MAGO",taboo:["MAGIA","VARITA","HECHIZO","SOMBRERO","POTTER"]},
                {word:"PULPO",taboo:["OCHO","TENTACULOS","MAR","TINTA","VENTOSA"]},
                {word:"CASTILLO",taboo:["REY","PIEDRA","FOSO","CABALLERO","TORRE"]},
                {word:"SUBMARINO",taboo:["SUBACUATICO","MARINA","SUMERGE","BARCO","GUERRA"]},
                {word:"SAXOFON",taboo:["JAZZ","VIENTO","SOPLA","MUSICA","ORO"]},
                {word:"DRAGON",taboo:["FUEGO","MITO","VUELA","ESCAMA","CABALLERO"]}
            ]},
            fr: { easy: [
                {word:"PIZZA",taboo:["FROMAGE","PATE","ITALIE","PART","FOUR"]},
                {word:"CHAT",taboo:["CHIEN","MIAULE","ANIMAL","PATTE","POIL"]},
                {word:"ARCENCIEL",taboo:["COULEURS","PLUIE","CIELO","MULTI","ORGUEIL"]},
                {word:"ROBOT",taboo:["METAL","MACHINE","FILS","FUTUR","ANDROIDE"]},
                {word:"VOLCAN",taboo:["LAVE","ERUPTION","MONTAGNE","CHAUD","CENDRE"]},
                {word:"APPAREIL",taboo:["PHOTO","OBJECTIF","CLIC","MEMOIRE","PREND"]}
            ], medium: [
                {word:"SORCIER",taboo:["MAGIE","BAGUETTE","SORT","CHAPEAU","POTTER"]},
                {word:"PIEUVRE",taboo:["HUIT","TENTACULES","MER","ENCRE","VENTOUSE"]},
                {word:"CHATEAU",taboo:["ROI","PIERRE","FOSSÉ","CHEVALIER","TOUR"]},
                {word:"SOUSMARIN",taboo:["SOUS","EAU","MARINE","PLONGE","GUERRE"]},
                {word:"SAXOPHONE",taboo:["JAZZ","LAITON","SOUFFLE","MUSIQUE","OR"]},
                {word:"DRAGON",taboo:["FEU","MYTHE","VOLE","ECAILLES","CHEVALIER"]}
            ]},
            de: { easy: [
                {word:"PIZZA",taboo:["KASE","TEIG","ITALIEN","STUCK","OFEN"]},
                {word:"KATZE",taboo:["HUND","MIAUT","TIER","PFOTE","HAAR"]},
                {word:"REGENBOGEN",taboo:["FARBEN","REGEN","HIMMEL","BOGEN","STOLZ"]},
                {word:"ROBOTER",            taboo:["METALL","MASCHINE","KABEL","ZUKUNFT","ANDROIDE"]},
                {word:"VULKAN",            taboo:["LAVA","AUSBRUCH","BERG","HEISS","ASCHE"]},
                {word:"KAMERA",            taboo:["FOTO","LINSE","KNIPST","KLICK","ERINNERUNG"]}
            ], medium: [
                {word:"ZAUBERER",            taboo:["MAGIE","STAB","ZAUBER","HUT","POTTER"]},
                {word:"OKTOPUS",            taboo:["ACHT","TENTAKEL","MEER","TINTE","SAUGER"]},
                {word:"SCHLOSS",            taboo:["KONIG","STEIN","GRABEN","RITTER","TURM"]},
                {word:"UBOOT",            taboo:["UNTERWASSER","MARINE","TAUCHT","SCHIFF","KRIEG"]},
                {word:"SAXOPHON",            taboo:["JAZZ","MESSING","BLAS","MUSIK","GOLD"]},
                {word:"DRACHE",            taboo:["FEUER","MYTHOS","FLIEGT","SCHUPPEN","RITTER"]}
            ]}
        };

        var DATA = null;
        var cfg = { mode: "solo", lang: "en", diff: "easy", time: 60 };
        var deck = [], current = null;
        var scoreA = 0, scoreB = 0, team = "A";
        var timeLeft = 60, timer = null, running = false;

        var $ = function (id) { return document.getElementById(id); };

        function shuffle(a) {
            a = a.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }

        function bestKey() { return "taboo_best_" + cfg.lang + "_" + cfg.diff; }
        function getBest() { try { return parseInt(localStorage.getItem(bestKey()) || "0", 10) || 0; } catch (e) { return 0; } }
        function setBest(v) { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} }

        function loadData(cb) {
            if (DATA) return cb();
            fetch("../assets/games/taboo_cards.json")
                .then(function (r) { if (!r.ok) throw 0; return r.json(); })
                .then(function (j) { DATA = j; cb(); })
                .catch(function () { DATA = FALLBACK; showToast("Offline mode (sample cards)"); cb(); });
        }

        function seg(id, key, cast) {
            var el = $(id);
            el.addEventListener("click", function (e) {
                var b = e.target.closest("button"); if (!b) return;
                el.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
                b.classList.add("on");
                cfg[key] = cast ? cast(b.getAttribute("data-" + key)) : b.getAttribute("data-" + key);
            });
        }
        seg("modeSeg", "mode");
        seg("langSeg", "lang");
        seg("diffSeg", "diff");
        seg("timeSeg", "time", function (v) { return parseInt(v, 10); });

        function startGame() {
            loadData(function () {
                var pool = (DATA[cfg.lang] && DATA[cfg.lang][cfg.diff]) || (FALLBACK[cfg.lang] && FALLBACK[cfg.lang][cfg.diff]) || [];
                if (!pool.length) { showToast("No cards for this choice"); return; }
                deck = shuffle(pool);
                scoreA = 0; scoreB = 0; team = "A";
                $("setup").classList.add("hide");
                $("game").classList.remove("hide");
                $("teamTag").classList.toggle("hide", cfg.mode !== "teams");
                if (cfg.mode === "teams") { $("scoreLabel").textContent = "TEAM A"; }
                else { $("scoreLabel").textContent = "SCORE"; }
                updateScore();
                nextCard();
                startTimer();
            });
        }

        function nextCard() {
            if (!deck.length) {
                var pool = (DATA[cfg.lang] && DATA[cfg.lang][cfg.diff]) || (FALLBACK[cfg.lang] && FALLBACK[cfg.lang][cfg.diff]) || [];
                deck = shuffle(pool);
            }
            var idx = Math.floor(Math.random() * deck.length);
            current = deck.splice(idx, 1)[0];
            $("word").textContent = current.word;
            var ul = $("taboos"); ul.innerHTML = "";
            current.taboo.forEach(function (w) {
                var li = document.createElement("li"); li.textContent = w; ul.appendChild(li);
            });
        }

        function updateScore() {
            if (cfg.mode === "teams") { $("scoreVal").textContent = (team === "A" ? scoreA : scoreB); }
            else { $("scoreVal").textContent = scoreA; }
        }

        function correct() {
            if (!running) return;
            if (cfg.mode === "teams") { if (team === "A") scoreA++; else scoreB++; }
            else {
                scoreA++;
                var best = getBest();
                if (scoreA > best) { setBest(scoreA); }
            }
            beep(660, 0.08); vibrate(20);
            flash("do-correct");
            updateScore();
            nextCard();
        }

        function skip() {
            if (!running) return;
            beep(220, 0.08); vibrate(10);
            flash("do-skip");
            nextCard();
        }

        function flash(cls) {
            var c = $("card");
            c.classList.remove("do-correct", "do-skip");
            void c.offsetWidth;
            c.classList.add(cls);
        }

        function startTimer() {
            timeLeft = cfg.time;
            running = true;
            renderTimer();
            if (timer) clearInterval(timer);
            timer = setInterval(function () {
                timeLeft--;
                renderTimer();
                if (timeLeft <= 0) endTurn();
            }, 1000);
        }

        function renderTimer() {
            $("timerNum").textContent = Math.max(0, timeLeft);
            var R = 32, C = 2 * Math.PI * R;
            var frac = Math.max(0, Math.min(1, timeLeft / cfg.time));
            var fg = $("ringFg");
            fg.style.strokeDashoffset = String(C * (1 - frac));
            fg.setAttribute("stroke", timeLeft <= 10 ? "var(--bad)" : "var(--accent2)");
        }

        function endTurn() {
            running = false;
            if (timer) clearInterval(timer);
            if (cfg.mode === "solo") {
                var best = getBest();
                showOverlay("Time!", String(scoreA),
                    (scoreA >= best && scoreA > 0 ? "🏆 New best: " + best : "Best: " + best),
                    "Play Again", function () { hideOverlay(); $("game").classList.add("hide"); $("setup").classList.remove("hide"); });
            } else {
                if (team === "A") {
                    team = "B";
                    showOverlay("Team A done", String(scoreA), "Team A scored " + scoreA + " points", "Start Team B →", function () {
                        hideOverlay();
                        $("teamTag").textContent = "TEAM B";
                        $("scoreLabel").textContent = "TEAM B";
                        updateScore();
                        nextCard();
                        startTimer();
                    });
                } else {
                    var winner = scoreA === scoreB ? "It's a tie!" : (scoreA > scoreB ? "Team A wins!" : "Team B wins!");
                    showOverlay(winner, scoreA + " – " + scoreB, "Team A: " + scoreA + " · Team B: " + scoreB, "Play Again", function () {
                        hideOverlay(); $("game").classList.add("hide"); $("setup").classList.remove("hide");
                    });
                }
            }
            beep(330, 0.2);
        }

        function showOverlay(title, big, text, btn, fn) {
            $("ovTitle").textContent = title;
            $("ovBig").textContent = big;
            $("ovText").textContent = text;
            $("ovBtn").textContent = btn;
            $("ovBtn").onclick = fn;
            $("overlay").classList.remove("hide");
        }
        function hideOverlay() { $("overlay").classList.add("hide"); }

        var toastT = null;
        function showToast(msg) {
            var t = $("toast"); t.textContent = msg; t.classList.add("show");
            if (toastT) clearTimeout(toastT);
            toastT = setTimeout(function () { t.classList.remove("show"); }, 1800);
        }

        // Audio
        var muted = false;
        try { muted = localStorage.getItem("taboo_muted") === "1"; } catch (e) {}
        function refreshMute() { $("muteBtn").textContent = muted ? "🔇" : "🔊"; }
        refreshMute();
        $("muteBtn").addEventListener("click", function () {
            muted = !muted; try { localStorage.setItem("taboo_muted", muted ? "1" : "0"); } catch (e) {} refreshMute();
        });
        function beep(freq, dur) {
            if (muted) return;
            try {
                var Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                var ctx = new Ctx();
                var o = ctx.createOscillator(), g = ctx.createGain();
                o.type = "sine"; o.frequency.value = freq;
                g.gain.value = 0.06;
                o.connect(g); g.connect(ctx.destination);
                o.start();
                o.stop(ctx.currentTime + dur);
                setTimeout(function () { try { ctx.close(); } catch (e) {} }, (dur + 0.05) * 1000);
            } catch (e) {}
        }
        function vibrate(ms) { if (muted) return; if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

        // Swipe gestures
        var sx = 0, sy = 0, st = 0;
        var card = $("card");
        card.addEventListener("touchstart", function (e) {
            var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
        }, { passive: true });
        card.addEventListener("touchend", function (e) {
            var t = e.changedTouches[0];
            var dx = t.clientX - sx, dy = t.clientY - sy;
            if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) {
                if (dy < 0) correct(); else skip();
            }
        }, { passive: true });

        $("startBtn").addEventListener("click", startGame);
        $("correctBtn").addEventListener("click", correct);
        $("skipBtn").addEventListener("click", skip);

        if (window.__tabooDebug) {
            window.__taboo = {
                start: startGame, correct: correct, skip: skip,
                setCards: function (d) { DATA = d; }, cfg: cfg,
                state: function () { return { scoreA: scoreA, scoreB: scoreB, team: team, timeLeft: timeLeft, deck: deck.length, current: current }; }
            };
        }
    })();
    </script>
</body>
</html>
