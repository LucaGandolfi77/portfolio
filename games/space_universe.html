<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Universe — Gioco</title>
  <style>
    html,body{height:100%;margin:0;background:#060814;color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}
    #gameWrap{position:fixed;inset:0;display:flex;flex-direction:column}
    canvas{flex:1;display:block;background:radial-gradient(ellipse at center,#071026 0%, #000 60%);touch-action:none}
    .hud{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:30}
    #fireBtn{background:#ff3b30;color:#fff;border:none;padding:14px 18px;border-radius:10px;font-weight:700;box-shadow:0 6px 18px rgba(255,59,48,0.24);cursor:pointer}
    #score{position:absolute;left:16px;top:16px;background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:8px;color:#cfefff}
    .info{position:absolute;left:16px;bottom:16px;color:#9fcfff;font-size:13px}
    @media (max-width:600px){#fireBtn,#jumpBtn{padding:16px 20px;border-radius:12px;font-size:16px}}
    .ammoBtn{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid rgba(255,255,255,0.06)}
    .ammoBtn.selected{outline:2px solid rgba(255,255,255,0.06);box-shadow:0 6px 18px rgba(0,0,0,0.35);transform:translateY(-1px)}
    .ammoBtn .dot{width:18px;height:18px;border-radius:4px}
  </style>
</head>
<body>
  <div id="gameWrap">
    <div id="ammoBar" style="position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:40;display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,0.22);backdrop-filter:blur(6px);">
      <!-- ammo buttons inserted here by DOM init -->
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="score">Score: 0</div>
    <div id="creditsDisplay" style="position:absolute;right:16px;top:16px;background:rgba(255,255,255,0.03);padding:6px 10px;border-radius:8px;color:#ffd76b;font-weight:700">Credits: 1000000</div>
    <div id="levelDisplay" style="position:absolute;right:16px;top:56px;background:rgba(255,255,255,0.03);padding:6px 10px;border-radius:8px;color:#9ff7ff;font-weight:700">Level: 1 — XP: 0/10</div>
    <div id="speedDisplay" style="position:absolute;right:16px;top:96px;background:rgba(255,255,255,0.03);padding:6px 10px;border-radius:8px;color:#b7ffb3;font-weight:700">Speed: 2</div>
    <div id="shieldDisplay" style="position:absolute;right:16px;top:136px;background:rgba(255,255,255,0.03);padding:6px 10px;border-radius:8px;color:#6bb3ff;font-weight:700">Shield: 0/0</div>
    <div id="laserAmmoDisplay" style="position:absolute;left:16px;top:56px;background:rgba(255,255,255,0.03);padding:6px 10px;border-radius:8px;color:#ffd76b;font-weight:700">Laser Ammo: 0</div>
    <canvas id="minimap" width="160" height="160" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);border-radius:8px;background:rgba(0,0,0,0.25);z-index:32;border:1px solid rgba(255,255,255,0.04);"></canvas>
    <div class="info">Tocca un nemico per selezionarlo. Trascina l'astronave per muoverti.</div>
      <div class="hud">
      <button id="fireBtn">SPARA</button>
      <button id="jumpBtn" style="margin-left:8px;padding:14px 18px;border-radius:10px;font-weight:700;border:none;background:rgba(255,255,255,0.1);color:#fff;backdrop-filter:blur(4px);box-shadow:0 6px 18px rgba(0,0,0,0.2);cursor:pointer;">SALTO <span style="font-size:11px;opacity:0.8">(J)</span></button>
      <button id="hangarBtn" class="hangarBtn" title="Hangar (H)" style="margin-left:8px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);color:#cfefff;border:1px solid rgba(255,255,255,0.03);">Hangar <span style="font-size:11px;margin-left:6px;opacity:0.9">(H)</span></button>
      <button id="storageBtn" class="storageBtn" title="Shop (I)" style="margin-left:8px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);color:#cfefff;border:1px solid rgba(255,255,255,0.03);">Shop <span style="font-size:11px;margin-left:6px;opacity:0.9">(I)</span></button>
    </div>
    <!-- Joystick (sticker) per muovere in tutte le direzioni -->
    <div id="joyWrap" style="position:absolute;left:16px;bottom:86px;width:120px;height:120px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));display:flex;align-items:center;justify-content:center;z-index:31;touch-action:none;">
      <div id="joyBase" style="width:86px;height:86px;border-radius:50%;background:rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;">
        <div id="joyKnob" style="width:40px;height:40px;border-radius:50%;background:rgba(0,212,255,0.9);box-shadow:0 6px 16px rgba(0,212,255,0.12);touch-action:none;"></div>
      </div>
    </div>
  </div>
  <script>
    (()=>{
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const mini = document.getElementById('minimap');
      const minictx = mini.getContext && mini.getContext('2d');
        // Debug / global error handlers
        console.log('Space Universe initializing');
        window.addEventListener('error', (ev)=>{
          console.error('Global error:', ev.message, ev.filename+':'+ev.lineno, ev.error);
        });

        window.addEventListener('unhandledrejection', (ev)=>{
          console.error('Unhandled rejection:', ev.reason);
        });

        // Try to load sample PNGs for player and enemy. Use fallback shapes when load fails.
        const playerImg = new Image();
        const playerTilesetImg = new Image();
        const enemyImg = new Image();
        let playerImgLoaded = false; let enemyImgLoaded = false; let tilesetLoaded = false;
        let mapsData = [];

        // Load maps from JSON
        fetch('space_universe_maps.json')
          .then(r=>r.json())
          .then(data=>{ 
             mapsData = data; 
             console.log('Maps loaded:', mapsData.length);
             if(mapsData.length > 0) setMap(0);
          })
          .catch(err=>{ console.warn('Failed to load maps json, using fallback:', err); });
        
        playerImg.onload = ()=>{ playerImgLoaded = true; console.log('player image loaded:', playerImg.src); };
        playerTilesetImg.onload = ()=>{ tilesetLoaded = true; console.log('tileset loaded'); };
        playerTilesetImg.onerror = ()=>{ console.warn('Tileset failed to load'); tilesetLoaded = false; };
        // Tileset matches ship_03.png style (UP facing at index 0)
        playerTilesetImg.src = '../assets/img/space_universe/spaceship_tileset.svg';

        playerImg.onerror = ()=>{
          console.warn('player image failed to load, generating fallback:', playerImg.src);
          // generate a small dataURL with a simple ship-like shape
          try{
            const c = document.createElement('canvas'); c.width = 96; c.height = 96;
            const cctx = c.getContext('2d');
            cctx.fillStyle = 'rgba(15,40,60,0.0)'; cctx.fillRect(0,0,c.width,c.height);
            cctx.translate(c.width/2, c.height/2);
            cctx.rotate(-Math.PI/2);
            cctx.fillStyle = '#9fe8ff';
            cctx.beginPath(); cctx.moveTo(0,-28); cctx.lineTo(18,16); cctx.lineTo(0,6); cctx.lineTo(-18,16); cctx.closePath(); cctx.fill();
            cctx.strokeStyle = 'rgba(0,80,120,0.8)'; cctx.lineWidth = 3; cctx.stroke();
            playerImg.src = c.toDataURL('image/png');
          }catch(err){ console.error('fallback player image generation failed', err); playerImgLoaded = false; }
        };
        enemyImg.onload = ()=>{ enemyImgLoaded = true; console.log('enemy image loaded:', enemyImg.src); };
        enemyImg.onerror = ()=>{
          console.warn('enemy image failed to load, generating fallback:', enemyImg.src);
          try{
            const c = document.createElement('canvas'); c.width = 64; c.height = 64;
            const cctx = c.getContext('2d');
            cctx.fillStyle = 'rgba(0,0,0,0)'; cctx.fillRect(0,0,c.width,c.height);
            cctx.translate(c.width/2, c.height/2);
            cctx.fillStyle = '#ff6b6b'; cctx.beginPath(); cctx.arc(0,0,18,0,Math.PI*2); cctx.fill();
            cctx.fillStyle = '#ffb3b3'; cctx.beginPath(); cctx.arc(0,0,10,0,Math.PI*2); cctx.fill();
            enemyImg.src = c.toDataURL('image/png');
          }catch(err){ console.error('fallback enemy image generation failed', err); enemyImgLoaded = false; }
        };
        // Prefer PNG assets if present; fall back to SVG then to runtime-generated fallback
        playerImg._tried = {png:false,svg:false};
        enemyImg._tried = {png:false,svg:false};
        function tryLoadPlayerPNG(){ if(!playerImg._tried.png){ playerImg._tried.png = true; playerImg.src = '../assets/img/space_universe/ship_03.png'; }}
        function tryLoadPlayerSVG(){ if(!playerImg._tried.svg){ playerImg._tried.svg = true; playerImg.src = 'assets/img/space_universe/player.svg'; }}
        function tryLoadEnemyPNG(){ if(!enemyImg._tried.png){ enemyImg._tried.png = true; enemyImg.src = 'assets/img/space_universe/enemy.png'; }}
        function tryLoadEnemySVG(){ if(!enemyImg._tried.svg){ enemyImg._tried.svg = true; enemyImg.src = 'assets/img/space_universe/enemy.svg'; }}
        playerImg.onerror = ()=>{
          if(!playerImg._tried.svg) { console.warn('player.png not found, trying SVG'); tryLoadPlayerSVG(); return; }
          console.warn('player image failed to load, generating fallback:', playerImg.src);
          // generate a small dataURL with a simple ship-like shape
          try{
            const c = document.createElement('canvas'); c.width = 96; c.height = 96;
            const cctx = c.getContext('2d');
            cctx.fillStyle = 'rgba(15,40,60,0.0)'; cctx.fillRect(0,0,c.width,c.height);
            cctx.translate(c.width/2, c.height/2);
            cctx.rotate(-Math.PI/2);
            cctx.fillStyle = '#9fe8ff';
            cctx.beginPath(); cctx.moveTo(0,-28); cctx.lineTo(18,16); cctx.lineTo(0,6); cctx.lineTo(-18,16); cctx.closePath(); cctx.fill();
            cctx.strokeStyle = 'rgba(0,80,120,0.8)'; cctx.lineWidth = 3; cctx.stroke();
            playerImg.src = c.toDataURL('image/png');
          }catch(err){ console.error('fallback player image generation failed', err); playerImgLoaded = false; }
        };
        enemyImg.onerror = ()=>{
          if(!enemyImg._tried.svg) { console.warn('enemy.png not found, trying SVG'); tryLoadEnemySVG(); return; }
          console.warn('enemy image failed to load, generating fallback:', enemyImg.src);
          try{
            const c = document.createElement('canvas'); c.width = 64; c.height = 64;
            const cctx = c.getContext('2d');
            cctx.fillStyle = 'rgba(0,0,0,0)'; cctx.fillRect(0,0,c.width,c.height);
            cctx.translate(c.width/2, c.height/2);
            cctx.fillStyle = '#ff6b6b'; cctx.beginPath(); cctx.arc(0,0,18,0,Math.PI*2); cctx.fill();
            cctx.fillStyle = '#ffb3b3'; cctx.beginPath(); cctx.arc(0,0,10,0,Math.PI*2); cctx.fill();
            enemyImg.src = c.toDataURL('image/png');
          }catch(err){ console.error('fallback enemy image generation failed', err); enemyImgLoaded = false; }
        };
        // try PNG first
        tryLoadPlayerPNG(); tryLoadEnemyPNG();
      let W = 0, H = 0;
      // make the world much larger for extended exploration
      const world = {w: 12000, h: 8000};
      // declare ship before resize to avoid TDZ errors when resize runs early
      let ship = {worldX: world.w/2, worldY: world.h*0.8, r:18, angle: -Math.PI/2, drag:false, autoFireTargetId: null, nextAutoFire: 0, lastOrangeFire: 0, maxHp:100, hp:100, shieldCurrent:0, shieldMax:0};
      function resize(){
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        // keep world significantly larger than the viewport for long-range maps
        world.w = Math.max(6000, W*6);
        world.h = Math.max(4000, H*6);
        // clamp ship to world if exists
        if(typeof ship !== 'undefined'){
          ship.worldX = Math.max(0, Math.min(world.w, ship.worldX));
          ship.worldY = Math.max(0, Math.min(world.h, ship.worldY));
        }
      }
      window.addEventListener('resize',resize);
      resize();

      // Diagnostic logging to help debug visibility issues (prints every 2s)
      setInterval(()=>{
        try{
          console.log('DIAG space_universe', {
            time: Date.now(),
            playerImgLoaded: !!playerImgLoaded,
            playerImgSrc: playerImg && playerImg.src,
            enemyImgLoaded: !!enemyImgLoaded,
            enemyImgSrc: enemyImg && enemyImg.src,
            ship: {x: ship.worldX, y: ship.worldY, hp: ship.hp, shieldCurrent: ship.shieldCurrent, shieldMax: ship.shieldMax},
            enemiesCount: enemies.length,
            enemiesSample: enemies.slice(0,3).map(e=>({id:e.id,x:Math.round(e.x),y:Math.round(e.y),hp: Math.floor(e.hp||0), shield: Math.floor(e.shield||0)}))
          });
        }catch(err){ console.warn('DIAG log failed', err); }
      }, 2000);

      // ship already declared above to avoid initialization timing issues

      // Enemies (world coords)
      const enemies = [];
      let enemyIdCounter = 1;
      // Portals: places that change the map when the ship enters them
      const portals = [];
      // current map index and background color (null -> default space gradient)
      let mapIndex = 0;
      let mapBackgroundColor = null; // when set, draw solid background color for that map

      // Configure portal positions and background for a given map index
      function setMap(mi){
        mapIndex = mi || 0;
        portals.length = 0;
        
        let m = null;
        if(mapsData && mapsData.length > 0){
          m = mapsData.find(x => x.id === mapIndex);
        }

        if(m){
          if(m.width) world.w = m.width;
          if(m.height) world.h = m.height;
          mapBackgroundColor = m.backgroundColor || null;
          if(m.portals && Array.isArray(m.portals)){
            m.portals.forEach(p => {
              portals.push({
                x: p.x, 
                y: p.y, 
                r: p.r || 48, 
                label: p.label || 'Warp', 
                targetMapIndex: p.targetMapIndex
              });
            });
          }
        } else {
          // Fallback logic if JSON not loaded or map ID not found
          if(mapIndex % 2 === 1){
            mapBackgroundColor = '#02240f';
            portals.push({x: Math.max(150, world.w * 0.25), y: Math.max(150, world.h * 0.25), r: 48, label: 'Warp', targetMapIndex: mapIndex+1});
          } else {
            mapBackgroundColor = null;
            portals.push({x: Math.max(200, world.w - 280), y: Math.max(200, world.h - 220), r: 48, label: 'Warp', targetMapIndex: mapIndex+1});
          }
        }
        
        // Ensure ship is within new world bounds
        ship.worldX = Math.max(0, Math.min(world.w, ship.worldX));
        ship.worldY = Math.max(0, Math.min(world.h, ship.worldY));
      }

      // Enemy definitions
      const ENEMY_TYPES = [
        {name: "Streuner", hp: 800, shield: 400, credits: 400, uridium: 1},
        {name: "Recruit Streuner", hp: 600, shield: 800, credits: 500, uridium: 2},
        {name: "Aider Streuner", hp: 1500, shield: 1000, credits: 700, uridium: 2},
        {name: "Boss Streuner", hp: 3200, shield: 1600, credits: 1600, uridium: 4},
        {name: "Uber Streuner", hp: 6400, shield: 3200, credits: 3200, uridium: 4},
        {name: "Lordakia", hp: 2000, shield: 2000, credits: 800, uridium: 2},
        {name: "Lordakium Spore", hp: 4000, shield: 4000, credits: 800, uridium: 3},
        {name: "Boss Lordakia", hp: 8000, shield: 8000, credits: 3200, uridium: 8},
        {name: "Uber Lordakia", hp: 16000, shield: 16000, credits: 6400, uridium: 16},
        {name: "Saimon", hp: 6000, shield: 6000, credits: 1600, uridium: 4},
        {name: "Boss Saimon", hp: 24000, shield: 12000, credits: 6400, uridium: 16},
        {name: "Uber Saimon", hp: 48000, shield: 24000, credits: 12800, uridium: 16},
        {name: "Mordon", hp: 20000, shield: 10000, credits: 6400, uridium: 8},
        {name: "Boss Mordon", hp: 80000, shield: 40000, credits: 25600, uridium: 32},
        {name: "Uber Mordon", hp: 160000, shield: 80000, credits: 51200, uridium: 64},
        {name: "Devolarium", hp: 100000, shield: 100000, credits: 51200, uridium: 16},
        {name: "Boss Devolarium", hp: 400000, shield: 400000, credits: 204800, uridium: 64},
        {name: "Uber Devolarium", hp: 800000, shield: 800000, credits: 409600, uridium: 128},
        {name: "Sibelon", hp: 200000, shield: 200000, credits: 102400, uridium: 32},
        {name: "Boss Sibelon", hp: 800000, shield: 800000, credits: 409600, uridium: 128},
        {name: "Uber Sibelon", hp: 1600000, shield: 1600000, credits: 819200, uridium: 256},
        {name: "Sibelonit", hp: 40000, shield: 40000, credits: 12800, uridium: 12},
        {name: "Boss Sibelonit", hp: 160000, shield: 160000, credits: 102400, uridium: 48},
        {name: "Uber Sibelonit", hp: 320000, shield: 320000, credits: 204800, uridium: 96},
        {name: "Lordakium", hp: 300000, shield: 200000, credits: 204800, uridium: 64},
        {name: "Boss Lordakium", hp: 1200000, shield: 800000, credits: 819200, uridium: 256},
        {name: "Uber Lordakium", hp: 2400000, shield: 1600000, credits: 1638400, uridium: 512},
        {name: "Kristallin", hp: 50000, shield: 40000, credits: 12800, uridium: 16},
        {name: "Boss Kristallin", hp: 200000, shield: 160000, credits: 51200, uridium: 64},
        {name: "Uber Kristallin", hp: 400000, shield: 320000, credits: 102400, uridium: 128},
        {name: "Kristallon", hp: 400000, shield: 300000, credits: 409600, uridium: 128},
        {name: "Boss Kristallon", hp: 1600000, shield: 1200000, credits: 1638400, uridium: 512},
        {name: "Uber Kristallon", hp: 3200000, shield: 2400000, credits: 3276800, uridium: 1024},
        {name: "StreuneR", hp: 40000, shield: 30000, credits: 12000, uridium: 15},
        {name: "Boss StreuneR", hp: 80000, shield: 40000, credits: 25600, uridium: 32},
        {name: "Uber StreuneR", hp: 320000, shield: 240000, credits: 96000, uridium: 120},
        {name: "Protegit", hp: 50000, shield: 40000, credits: 12800, uridium: 16},
        {name: "Uber Protegit", hp: 400000, shield: 320000, credits: 102400, uridium: 128},
        {name: "Cubikon", hp: 1600000, shield: 1200000, credits: 1638400, uridium: 1024}
      ];

      // helper to trigger portal behavior (reused by collision and keypress)
      function usePortal(p){
        const now = Date.now();
        if(!p || (p._lastUsed && (now - p._lastUsed) <= (p.cooldown || 2000))) return false;
        p._lastUsed = now;
        
        // determine next map index
        let next = 0;
        if(typeof p.targetMapIndex !== 'undefined') next = p.targetMapIndex;
        else next = (mapIndex || 0) + 1;

        const prevMap = mapIndex;
        setMap(next);

        // Try to place ship near the portal in the destination map that points back to the origin map
        let placed = false;
        try{
          const dest = portals.find(pl => typeof pl.targetMapIndex !== 'undefined' && pl.targetMapIndex === prevMap);
          if(dest){
            const ang = Math.random() * Math.PI * 2;
            const dist = (dest.r || 48) + (ship.r || 18) + 40;
            ship.worldX = Math.max(0, Math.min(world.w, dest.x + Math.cos(ang) * dist));
            ship.worldY = Math.max(0, Math.min(world.h, dest.y + Math.sin(ang) * dist));
            placed = true;
          }
        }catch(err){ console.warn('Failed to place at matching portal', err); }

        // fallback: move the ship to a safe random location on the new map (avoiding edges)
        if(!placed){
          ship.worldX = Math.max(300, Math.min(world.w-300, Math.random()*(world.w-100)));
          ship.worldY = Math.max(300, Math.min(world.h-300, Math.random()*(world.h-100)));
        }
        
        enemies.length = 0;
        for(let i=0;i<6;i++) spawnEnemy();
        damagePopups.push({x: ship.worldX, y: ship.worldY - ship.r - 18, text: `Warped to Sector ${mapIndex}`, ttl: 90, vy: -0.6, alpha:1});
        return true;
      }
      const bullets = [];
      const damagePopups = [];
      const laserBeams = [];
      let selected = -1;
      let score = 0;
      const laserRange = 360; // gittata massima del laser in pixel (world coords)
      let lastUpdate = Date.now();

      // Player progression
      let playerLevel = 1;
      let playerXP = 0;
      let xpToNext = 10;
      function updateLevelDisplay(){ const el = document.getElementById('levelDisplay'); if(!el) return; el.textContent = `Level: ${playerLevel} — XP: ${playerXP}/${xpToNext}`; }
      function awardXP(amount){ playerXP += amount; damagePopups.push({x: ship.worldX, y: ship.worldY - ship.r - 18, text: `+${amount} XP`, ttl: 48, vy: -0.6, alpha:1});
        while(playerXP >= xpToNext){ playerXP -= xpToNext; playerLevel++; xpToNext = Math.max(5, Math.floor(xpToNext * 1.5)); // increase next threshold
          credits += playerLevel * 1000; updateCreditsDisplay(); damagePopups.push({x: ship.worldX, y: ship.worldY - ship.r - 36, text: `Level Up! ${playerLevel}`, ttl: 80, vy: -0.6, alpha:1}); }
        updateLevelDisplay(); }
      // Speed / engines
      let baseSpeed = 2; // reduced base speed without engines
      function computeEngineBonus(){ return generatorSlots.reduce((acc,s)=> acc + ((s && s.kind==='engine') ? (s.speed||0) : 0), 0); }
      function updateSpeedDisplay(){ const el = document.getElementById('speedDisplay'); if(!el) return; const total = (baseSpeed + computeEngineBonus()); el.textContent = 'Speed: '+total.toFixed(1); }

      // equipment/shield helper: compute total shield capacity from equipped items (now checking generatorSlots too)
      function computeShipShieldBonus(){ 
         const equipBonus = equipSlots.reduce((acc,s)=> acc + ((s && s.kind==='shield') ? (s.capacity||0) : 0), 0);
         const genBonus = generatorSlots.reduce((acc,s)=> acc + ((s && s.kind==='shield') ? (s.capacity||0) : 0), 0);
         return equipBonus + genBonus;
      }
      function updateShipShieldDisplay(){ const el = document.getElementById('shieldDisplay'); if(!el) return; const cap = computeShipShieldBonus(); // recalc ship shield max/current when equipment changes
        ship.shieldMax = cap;
        if(typeof ship.shieldCurrent === 'undefined' || ship.shieldCurrent === null) ship.shieldCurrent = ship.shieldMax;
        // clamp current shield to max
        ship.shieldCurrent = Math.max(0, Math.min(ship.shieldMax, ship.shieldCurrent || 0));
        el.textContent = `Shield: ${Math.floor(ship.shieldCurrent)}/${Math.floor(ship.shieldMax)}`; }

      // apply damage to ship: shields absorb 80% rounded down, shields are consumed first
      function applyDamageToShip(damage){ if(!damage || damage <= 0) return; const now = Date.now();
        // calculate shield absorption (80% rounded down)
        const shieldAbsorbDesired = Math.floor(damage * 0.8);
        const shieldAvailable = Math.floor(ship.shieldCurrent || 0);
        const shieldUsed = Math.min(shieldAbsorbDesired, shieldAvailable);
        ship.shieldCurrent = Math.max(0, (ship.shieldCurrent||0) - shieldUsed);
        const remaining = damage - shieldUsed;
        ship.hp = (ship.hp || ship.maxHp) - remaining;
        // record last damaged time and reset regen accumulator
        ship._lastDamaged = now;

      function spawnEnemy(){
        // pick random enemy type based on mapIndex difficulty scaling
        // Map 0: Low tier. Map 1: Med. Map 2: High. etc.
        // Or just pick from ENEMY_TYPES safely
        
        // Let's filter available enemies by "tier" roughly estimated by HP
        // mapIndex 0 -> max HP ~5000
        // mapIndex 1 -> max HP ~20000
        // mapIndex 2 -> max HP ~100000
        // mapIndex > 3 -> All
        // Prefer map-defined maxEnemyHP if available
        let maxHP = 5000;
        try{
          const m = (mapsData && mapsData.length) ? mapsData.find(x => x.id === mapIndex) : null;
          if(m && typeof m.maxEnemyHP === 'number'){
            maxHP = m.maxEnemyHP;
          } else {
            if(mapIndex === 1) maxHP = 20000;
            else if(mapIndex === 2) maxHP = 100000;
            else if(mapIndex > 2) maxHP = 999999999;
          }
        }catch(e){ /* fallback */ }

        const candidates = ENEMY_TYPES.filter(t => t.hp <= maxHP);
        const choice = candidates.length > 0 ? candidates[Math.floor(Math.random()*candidates.length)] : ENEMY_TYPES[0];
        
        const r = 24 + Math.sqrt(choice.hp) * 0.15; // larger enemies are bigger
        // limit size
        const radius = Math.min(80, Math.max(20, r));

        // optionally spawn near the ship or anywhere in the world
        let x, y;
        if(spawnEnemy.nearShipCount && spawnEnemy.nearShipCount-- > 0){
          x = Math.max(radius, Math.min(world.w - radius, ship.worldX + (Math.random()-0.5)*400));
          y = Math.max(radius, Math.min(world.h - radius, ship.worldY + (Math.random()-0.5)*300));
        } else {
          x = radius + Math.random()*(world.w - 2*radius);
          y = 40 + Math.random()*(world.h*0.45);
        }
        
        // enemy types: name determines behavior logic simply
        let type = 'chaser';
        const nameLc = choice.name.toLowerCase();
        if(nameLc.includes('streuner')) type = 'fleer';
        else if(nameLc.includes('mordon')) type = 'chaser';
        else if(nameLc.includes('sibelon') || nameLc.includes('devolarium')) type = 'shield';
        else if(nameLc.includes('lordak')) type = 'chaser';
        else if(nameLc.includes('kristall')) type = 'shield';
        else if(Math.random() > 0.5) type = 'chaser'; else type = 'fleer';

        // Speed adjustment: High HP -> Slower
        let speed = 2000 / (choice.hp + 500); 
        if(speed < 0.2) speed = 0.2;
        if(speed > 1.2) speed = 1.2;
        if(type === 'fleer') speed *= 1.3;

        // assign unique ID
        const suffix = Math.floor(Math.random()*999);
        
        enemies.push({
          id: enemyIdCounter++, 
          x,y,r: radius, 
          type, 
          hp: choice.hp, 
          maxHp: choice.hp, 
          shield: choice.shield || 0,
          shieldMax: choice.shield || 0,

          spawn: Date.now(),
          speed: speed, 
          name: choice.name, // display name
          creditsReward: choice.credits,

      // storageBtn repurposed as Shop (I) button — toggle shop modal

      // keyboard: H toggles hangar; I toggles shop

      // Storage and drag-drop logic (storage holds objects: {kind:'ammo',type:'red'} or {kind:'laser',type:'red',ammo:0})
      const storage = [];

      function update(){
        const now = Date.now();
        const dt = now - (lastUpdate || now);

        for(let i=bullets.length-1;i>=0;i--){

// Enemy Update: when enemy dies appy rewards

                    // award XP based on HP

                    enemies.splice(ti,1); if(selected===ti) selected=-1; score++; document.getElementById('score').textContent = 'Score: '+score;

                e.lastDamaged = now;

                bullets.splice(i,1);
                    if(e.hp <= 0){

                    });
                    bullets.push({x: ship.worldX, y: ship.worldY, vx: Math.cos(angle)*10, vy: Math.sin(angle)*10, ttl: 200, targetId: te.id, damage: totalDamage, ammo: 'multi'});

                    ship.nextAutoFire = (ship.nextAutoFire && ship.nextAutoFire > now) ? ship.nextAutoFire + inc : now + inc;
                  }
                } else {
                  // default single-shot behavior when no lasers equipped -> use basic damage
                  const dmg = (ammoInfo.mult || 1) * 50; // default weak shot 50dmg * mul
                  bullets.push({x: ship.worldX, y: ship.worldY, vx: Math.cos(angle)*10, vy: Math.sin(angle)*10, ttl: 200, targetId: te.id, damage: dmg, ammo: currentAmmo});
                  laserBeams.push({targetId: te.id, ttl: 36, progress:0, speed:0.04, color: ammoInfo.color});
                  if(currentAmmo === 'orange') ship.lastOrangeFire = now;
                  const inc = (currentAmmo==='orange') ? (ammoInfo.cooldown||2000) : 500;
                  ship.nextAutoFire = (ship.nextAutoFire && ship.nextAutoFire > now) ? ship.nextAutoFire + inc : now + inc;
                }
              }
            }
          }
        }

        // enemy behaviors: chaser, fleer, shield
        enemies.forEach((e,idx)=>{
          const dx = ship.worldX - e.x; const dy = ship.worldY - e.y; const dist = Math.hypot(dx,dy) || 1;
          if(e.type === 'chaser'){
            const s = e.speed || 0.8;
            e.x += (dx/dist) * s * 0.9;
            e.y += (dy/dist) * s * 0.9;
          } else if(e.type === 'fleer'){
            const s = e.speed || 1.0;
            if(dist < 220){
              e.x -= (dx/dist) * s * 1.4;
              e.y -= (dy/dist) * s * 1.4;
            } else {
              e.x += Math.sin((Date.now()+idx*123)/1300)*0.25;
              e.y += Math.cos((Date.now()+idx*97)/1500)*0.18;
            }
          } else if(e.type === 'shield'){
            const s = e.speed || 0.4;
            const desired = 180;
            if(dist > desired){ e.x += (dx/dist) * s * 0.45; e.y += (dy/dist) * s * 0.45; }
            else if(dist < desired - 30){ e.x -= (dx/dist) * s * 0.6; e.y -= (dy/dist) * s * 0.6; }
            // gentle wobble
            e.x += Math.sin((Date.now()+idx*77)/1400)*0.18;
            e.y += Math.cos((Date.now()+idx*61)/1600)*0.12;
          } else {
            // fallback gentle wander
            e.x += Math.sin((Date.now()+idx*100)/1200)*0.3;
            e.y += Math.cos((Date.now()+idx*100)/1500)*0.2;
          }
          // keep enemies inside world
          e.x = Math.max(0, Math.min(world.w, e.x));
          e.y = Math.max(0, Math.min(world.h, e.y));
          
          // Repel enemies from portals (Safe Zone)
          for(const p of portals){
             const pdx = e.x - p.x; const pdy = e.y - p.y; const pdist = Math.hypot(pdx,pdy);
             const safeR = (p.r||48) + 200; // 200px buffer around portal
             if(pdist < safeR){
               // push away
               const force = (safeR - pdist) / safeR;
               e.x += (pdx/pdist) * force * 3.0;
               e.y += (pdy/pdist) * force * 3.0;
             }
          }

            // collide with ship: if close enough and not recently collided, apply damage to ship
            const now = Date.now();
            const dxs = ship.worldX - e.x; const dys = ship.worldY - e.y; const dship = Math.hypot(dxs,dys);
            if(dship < e.r + ship.r + 2){
              if(!e._lastHitAt || (now - e._lastHitAt) > 800){
                e._lastHitAt = now;
                let dmg = 5;
                if(e.type === 'chaser') dmg = 8;
                else if(e.type === 'fleer') dmg = 6;
                else if(e.type === 'shield') dmg = 10;
                applyDamageToShip(dmg);
              }
            }
        });

        // shield regeneration: after 5s without taking damage, regen gradually
        enemies.forEach((e)=>{
          if(!e.shieldMax || e.shieldMax <= 0) return;
          const last = e.lastDamaged || 0;
          if((now - last) >= 5000 && (e.shield || 0) < e.shieldMax){
            e._shieldRegenAcc = (e._shieldRegenAcc || 0) + dt;
            const regenInterval = 400; // ms per 1 shield point
            if(e._shieldRegenAcc >= regenInterval){
              const add = Math.floor(e._shieldRegenAcc / regenInterval);
              e.shield = Math.min(e.shield + add, e.shieldMax);
              e._shieldRegenAcc -= add * regenInterval;
            }
          } else {
            // reset accumulator if recently damaged
            if((now - last) < 5000) e._shieldRegenAcc = 0;
          }
        });

        // joystick movement influences ship world position
        if(joy && joy.active && !ship.drag){
          const speed = baseSpeed + computeEngineBonus();
          ship.worldX += joy.dx * speed;
          ship.worldY += joy.dy * speed;
          if(Math.abs(joy.dx) > 0.05 || Math.abs(joy.dy) > 0.05) ship.angle = Math.atan2(joy.dy, joy.dx);
        } else if(!ship.drag){
          // keyboard (WASD + arrows)
          const kx = (keys.d||keys.ArrowRight?1:0) - (keys.a||keys.ArrowLeft?1:0);
          const ky = (keys.s||keys.ArrowDown?1:0) - (keys.w||keys.ArrowUp?1:0);
          if(kx !== 0 || ky !== 0){
            const mag = Math.hypot(kx,ky) || 1;
            const speed = baseSpeed + computeEngineBonus();
            ship.worldX += (kx/mag) * speed;
            ship.worldY += (ky/mag) * speed;
            ship.angle = Math.atan2(ky, kx);
          }
        }
        // keep ship inside world bounds
        ship.worldX = Math.max(0, Math.min(world.w, ship.worldX));
        ship.worldY = Math.max(0, Math.min(world.h, ship.worldY));
        // portal collision: teleport removed, must use J or Jump button
        /*
        portals.forEach(p=>{
          const dx = ship.worldX - p.x; const dy = ship.worldY - p.y; const d = Math.hypot(dx,dy);
          if(d < (p.r || 48) + ship.r){ usePortal(p); }
        });
        */
      }

      function draw(){
        // draw background — either a solid map color or the default space radial gradient
        if(mapBackgroundColor){
          ctx.fillStyle = mapBackgroundColor; ctx.fillRect(0,0,W,H);
        } else {
          // default deep-space radial gradient
          const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.05, W/2, H/2, Math.max(W,H)*0.7);
          g.addColorStop(0, '#071026'); g.addColorStop(0.6, '#000000');
          ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
        }

        // stars (simple background pattern tied to world)
        ctx.fillStyle='rgba(255,255,255,0.04)';
        for(let i=0;i<120;i++){
          const sx = ((i*37) % world.w) - ship.worldX + W/2;
          const sy = ((i*73) % world.h) - ship.worldY + H/2;
          if(sx>=0 && sx<=W && sy>=0 && sy<=H) ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
        }

        // enemies (draw relative to ship center)
        enemies.forEach((e,i)=>{
          const sx = e.x - ship.worldX + W/2;
          const sy = e.y - ship.worldY + H/2;
          // only draw if visible
          if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) return;
          if(enemyImgLoaded){
            try{
              const size = e.r*2.2;
              ctx.drawImage(enemyImg, sx - size/2, sy - size/2, size, size);
            }catch(err){ console.error('drawImage enemy failed', err); enemyImgLoaded = false; }
          }
          if(!enemyImgLoaded){
            ctx.beginPath(); ctx.arc(sx,sy,e.r,0,Math.PI*2); ctx.fillStyle='rgba(255,80,80,0.28)'; ctx.fill();
            ctx.beginPath(); ctx.arc(sx,sy,e.r-6,0,Math.PI*2); ctx.fillStyle='rgba(255,80,80,0.5)'; ctx.fill();
          }
          // hit flash overlay
          if(e.flashUntil && e.flashUntil > Date.now()){
            const alpha = (e.flashUntil - Date.now()) / 160;
            ctx.save(); ctx.globalAlpha = Math.min(0.9, alpha); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(sx,sy,e.r+2,0,Math.PI*2); ctx.fill(); ctx.restore();
          }
          // shield bar (if present) and health bar above enemy
          if(e.hp != null){
            const barW = e.r*2; const barH = 6;
            const bx = sx - barW/2; let by = sy - e.r - 12;
            // draw shield bar above health if present
            if(e.shield && e.shieldMax && e.shieldMax > 0){
              const sBarH = 5;
              const sBy = by - sBarH - 6;
              ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx-1, sBy-1, barW+2, sBarH+2);
              const shieldRatio = Math.max(0, e.shield / e.shieldMax);
              ctx.fillStyle = '#6bb3ff'; ctx.fillRect(bx, sBy, barW * shieldRatio, sBarH);
              ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.strokeRect(bx, sBy, barW, sBarH);
              // shield glow ring
              ctx.save(); ctx.globalAlpha = 0.6; ctx.strokeStyle = hexToRgba('#6bb3ff',0.85); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(sx,sy,e.r+6,0,Math.PI*2); ctx.stroke(); ctx.restore();
              // shield numbers
              try{
                ctx.font = '700 10px Inter, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.fillStyle = '#ffffff';
                const sText = `${Math.floor(e.shield)}/${Math.floor(e.shieldMax)}`;
                ctx.strokeText(sText, bx + barW/2, sBy + sBarH/2);
                ctx.fillText(sText, bx + barW/2, sBy + sBarH/2);
              }catch(err){}
              by = sBy - 8;
            }
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx-1, by-1, barW+2, barH+2);
            const ratio = Math.max(0, (e.hp / e.maxHp));
            ctx.fillStyle = '#ff6b6b'; ctx.fillRect(bx, by, barW * ratio, barH);
            ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, barW, barH);
            // health numbers
            try{
              ctx.font = '700 11px Inter, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.fillStyle = '#ffffff';
              const hText = `${Math.floor(e.hp)}/${Math.floor(e.maxHp)}`;
              ctx.strokeText(hText, bx + barW/2, by + barH/2);
              ctx.fillText(hText, bx + barW/2, by + barH/2);
            }catch(err){}
          }
          if(i===selected){
            const now = Date.now();
            if(enemies[i].outOfRangeUntil && enemies[i].outOfRangeUntil > now){ ctx.strokeStyle='rgba(255,80,80,0.95)'; }
            else ctx.strokeStyle='rgba(0,212,255,0.9)';
            ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,sy,e.r+6,0,Math.PI*2); ctx.stroke();
          }
          // draw enemy name in red under the enemy
          try{
            const name = e.name || (e.type ? (e.type.charAt(0).toUpperCase() + e.type.slice(1)) : 'Enemy');
            ctx.font = '600 12px Inter, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.fillStyle = '#ff4d4d';
            ctx.strokeText(name, sx, sy + e.r + 6);
            ctx.fillText(name, sx, sy + e.r + 6);
          }catch(err){}
        });

        // ship (always centered on screen)
        const shipScreenX = W/2; const shipScreenY = H/2;
        // draw portals (world coords -> screen)
        portals.forEach((p,i)=>{
          const psx = p.x - ship.worldX + W/2;
          const psy = p.y - ship.worldY + H/2;
          if(psx < -100 || psx > W+100 || psy < -100 || psy > H+100) return;
          // outer rotating ring
          ctx.save();
          ctx.translate(psx, psy);
          ctx.rotate((Date.now()/900) + i);
          const grad = ctx.createRadialGradient(0,0,p.r*0.3,0,0,p.r);
          grad.addColorStop(0,'rgba(160,220,255,0.95)');
          grad.addColorStop(0.6,'rgba(100,160,255,0.25)');
          grad.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(100,180,255,0.9)'; ctx.beginPath(); ctx.arc(0,0,p.r+6,0,Math.PI*2); ctx.stroke();
          ctx.restore();
          // label
          try{ ctx.font = '600 12px Inter, Arial, sans-serif'; ctx.fillStyle = '#9fe8ff'; ctx.textAlign='center'; ctx.fillText(p.label || 'Portal', psx, psy + p.r + 6); }catch(err){}
        });

      // allow pressing 'J' near a portal to jump (map change)
      window.addEventListener('keydown', (e)=>{
        if((e.key === 'j' || e.key === 'J')){
          for(const p of portals){
            const d = Math.hypot(ship.worldX - p.x, ship.worldY - p.y);
            if(d < (p.r || 48) + ship.r + 12){ // small margin
              if(usePortal(p)) break;
            }
          }
        }
      });
        // draw laser range circle (faint)
        ctx.beginPath(); ctx.arc(shipScreenX, shipScreenY, laserRange, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(0,200,255,0.08)'; ctx.lineWidth = 2; ctx.stroke();
        // draw player image if available
        if(tilesetLoaded){
          // Draw using 8-direction tileset
          try{
            // ship.angle is radians math angle (0=Right, PI/2=Down, -PI/2=Up)
            // Tileset was generated from UP facing image rotated clockwise
            // Frame 0: Up (0 deg relative to image source)
            // Frame 1: Up-Right (45 deg)
            // Frame 2: Right (90 deg)
            // ...
            
            // Compute rotation from Up (-PI/2)
            // angle - (-PI/2) = angle + PI/2.
            let deg = (ship.angle + Math.PI/2) * (180/Math.PI);
            // normalize 0-360
            deg = (deg % 360 + 360) % 360;
            // index 0..7
            const tileIdx = Math.round(deg / 45) % 8;
            
            const size = ship.r*3.2;
            const sx = tileIdx * 96;
            ctx.drawImage(playerTilesetImg, sx, 0, 96, 96, shipScreenX - size/2, shipScreenY - size/2, size, size);
          } catch(err){ tilesetLoaded = false; }
        } else if(playerImgLoaded){
          try{
            const size = ship.r*3.2;
            ctx.save();
            ctx.translate(shipScreenX, shipScreenY);
            // rotate valid PNG source (if it is UP facing)
            ctx.rotate(ship.angle + Math.PI/2);
            ctx.drawImage(playerImg, -size/2, -size/2, size, size);
            ctx.restore();
          }catch(err){ console.error('drawImage player failed', err); playerImgLoaded = false; }
        }
        if(!playerImgLoaded){
          ctx.save(); ctx.translate(shipScreenX, shipScreenY);
          ctx.rotate(ship.angle);
          ctx.fillStyle='#9fe8ff';
          ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(14,12); ctx.lineTo(0,6); ctx.lineTo(-14,12); ctx.closePath(); ctx.fill();
          ctx.strokeStyle='rgba(0,80,120,0.8)'; ctx.lineWidth=2; ctx.stroke();
          ctx.restore();
        }

        // draw ship shield visuals: current shield arc and regen pulse
        if((ship.shieldMax || 0) > 0){
          const ratio = ((ship.shieldCurrent||0) / (ship.shieldMax||1));
          // background ring for max
          ctx.save(); ctx.globalAlpha = 0.12; ctx.strokeStyle = '#6bb3ff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(shipScreenX, shipScreenY, ship.r+14, 0, Math.PI*2); ctx.stroke(); ctx.restore();
          // filled arc for current shield
          if(ratio > 0){
            ctx.save(); ctx.globalAlpha = 0.9; ctx.strokeStyle = '#6bb3ff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(shipScreenX, shipScreenY, ship.r+14, -Math.PI/2, (-Math.PI/2) + (Math.PI*2)*ratio); ctx.stroke(); ctx.restore();
          }
          // regen pulsing glow when active
          if(ship._regenActive){
            const pulse = 0.35 + Math.abs(Math.sin(Date.now()/320)) * 0.65; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = pulse*0.6; ctx.strokeStyle = hexToRgba('#6bb3ff', 0.95); ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(shipScreenX, shipScreenY, ship.r+22, 0, Math.PI*2); ctx.stroke(); ctx.restore();
          }
        }

        // draw ship health and shield bars above the ship (similar style to enemies)
        (function(){
          const barW = ship.r * 4; const barH = 8;
          const bx = shipScreenX - barW/2; let by = shipScreenY - ship.r - 18;
          // shield bar above health if exists
          if((ship.shieldMax || 0) > 0){
            const sBarH = 6; const sBy = by - sBarH - 6;
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx-1, sBy-1, barW+2, sBarH+2);
            const shieldRatio = Math.max(0, (ship.shieldCurrent||0) / (ship.shieldMax||1));
            ctx.fillStyle = '#6bb3ff'; ctx.fillRect(bx, sBy, barW * shieldRatio, sBarH);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.strokeRect(bx, sBy, barW, sBarH);
            by = sBy - 8;
            // shield numbers on ship
            try{
              ctx.font = '700 12px Inter, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.fillStyle = '#ffffff';
              const sText = `${Math.floor(ship.shieldCurrent)}/${Math.floor(ship.shieldMax)}`;
              ctx.strokeText(sText, bx + barW/2, sBy + sBarH/2);
              ctx.fillText(sText, bx + barW/2, sBy + sBarH/2);
            }catch(err){}
          }
          // health bar
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx-1, by-1, barW+2, barH+2);
          const hpRatio = Math.max(0, (ship.hp || ship.maxHp) / (ship.maxHp || 1));
          ctx.fillStyle = '#ff6b6b'; ctx.fillRect(bx, by, barW * hpRatio, barH);
          ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, barW, barH);
          // health numbers on ship
          try{
            ctx.font = '700 12px Inter, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.fillStyle = '#ffffff';
            const hText = `${Math.floor(ship.hp)}/${Math.floor(ship.maxHp)}`;
            ctx.strokeText(hText, bx + barW/2, by + barH/2);
            ctx.fillText(hText, bx + barW/2, by + barH/2);
          }catch(err){}
        })();

        // bullets (world coords -> screen)
        bullets.forEach(b=>{
          const sx = b.x - ship.worldX + W/2;
          const sy = b.y - ship.worldY + H/2;
          if(sx < -20 || sx > W+20 || sy < -20 || sy > H+20) return;
          const color = (b.ammo && AMMO[b.ammo] && AMMO[b.ammo].color) ? AMMO[b.ammo].color : '#ff6b6b';
          ctx.beginPath(); ctx.fillStyle = color; ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fill();
        });

        // draw laser beams (visuals) - color depends on ammo
        laserBeams.forEach(L=>{
          const sx = W/2, sy = H/2;
          if(L.targetId != null){
            const ti = enemies.findIndex(e=>e.id===L.targetId);
            if(ti === -1) return;
            const e = enemies[ti];
            const ex = e.x - ship.worldX + W/2; const ey = e.y - ship.worldY + H/2;
            // progress indicates how far the visible beam has reached (0..1)
            const p = L.progress != null ? L.progress : 1;
            const ix = sx + (ex - sx) * p;
            const iy = sy + (ey - sy) * p;
            // glow (wide, soft)
            const base = L.color || '#ff6b6b';
            ctx.save(); ctx.lineCap = 'round'; ctx.shadowBlur = 20; ctx.shadowColor = hexToRgba(base,0.35);
            const grad = ctx.createLinearGradient(sx,sy,ix,iy);
            grad.addColorStop(0, hexToRgba(base,0.0));
            grad.addColorStop(0.6, hexToRgba(base,0.25));
            grad.addColorStop(1, hexToRgba(base,0.7));
            ctx.strokeStyle = grad; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ix,iy); ctx.stroke();
            // core (thinner)
            const grad2 = ctx.createLinearGradient(sx,sy,ix,iy);
            grad2.addColorStop(0, hexToRgba(base,0.0));
            grad2.addColorStop(1, hexToRgba(base,0.95));
            ctx.strokeStyle = grad2; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ix,iy); ctx.stroke();
            ctx.restore();
          } else {
            // untargeted short red flash forward
            const ex = sx + (L.vx||0)*12; const ey = sy + (L.vy||0)*12;
            const base = L.color || '#ff6b6b';
            ctx.save(); ctx.lineCap='round'; ctx.shadowBlur = 8; ctx.shadowColor = hexToRgba(base,0.35); ctx.strokeStyle = hexToRgba(base,0.95); ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke(); ctx.restore();
          }
        });

        // draw damage popups
        damagePopups.forEach(p=>{
          const sx = p.x - ship.worldX + W/2; const sy = p.y - ship.worldY + H/2;
          ctx.save(); ctx.globalAlpha = p.alpha; ctx.font = '700 16px Inter, Arial, sans-serif'; ctx.fillStyle = 'rgba(255,80,80,1)'; ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=3;
          ctx.strokeText(p.text, sx, sy);
          ctx.fillText(p.text, sx, sy);
          ctx.restore();
        });

        // Draw joystick visual feedback (move knob)
        if(joy){
          const knob = document.getElementById('joyKnob');
          if(knob){ knob.style.transform = `translate(${joy.dx*joy.max}px, ${joy.dy*joy.max}px)`; }
        }

        // draw minimap
        if(minictx){
          const mw = mini.width; const mh = mini.height;
          minictx.clearRect(0,0,mw,mh);
          minictx.fillStyle = 'rgba(2,8,18,0.9)'; minictx.fillRect(0,0,mw,mh);
          const pad = 6; const mapW = mw - pad*2; const mapH = mh - pad*2;
          const scaleX = mapW / world.w; const scaleY = mapH / world.h;
          // enemies
          enemies.forEach(e=>{
            const mx = pad + e.x * scaleX; const my = pad + e.y * scaleY;
            minictx.fillStyle = '#ff6b6b'; minictx.beginPath(); minictx.arc(mx,my,3,0,Math.PI*2); minictx.fill();
          });
          // ship
          const sxm = pad + ship.worldX * scaleX; const sym = pad + ship.worldY * scaleY;
          minictx.fillStyle = '#9fe8ff'; minictx.beginPath(); minictx.arc(sxm,sym,4,0,Math.PI*2); minictx.fill();
          // portals on minimap
          portals.forEach(p=>{
            const px = pad + p.x * scaleX; const py = pad + p.y * scaleY;
            minictx.save();
            minictx.beginPath(); minictx.arc(px,py,6,0,Math.PI*2);
            minictx.strokeStyle = '#9fe8ff'; minictx.lineWidth = 2; minictx.stroke();
            minictx.fillStyle = 'rgba(159,232,255,0.12)'; minictx.fill();
            // small P label
            minictx.font = '600 10px Inter, Arial, sans-serif'; minictx.fillStyle = '#9fe8ff'; minictx.textAlign = 'center'; minictx.textBaseline = 'middle';
            minictx.fillText('P', px, py);
            minictx.restore();
          });
          // viewport rect
          minictx.strokeStyle = 'rgba(159,232,255,0.6)'; minictx.lineWidth = 1;
          minictx.strokeRect(pad + (ship.worldX - W/2)*scaleX, pad + (ship.worldY - H/2)*scaleY, W*scaleX, H*scaleY);
        }
      }

      function loop(){
        try{
          if(!paused) update();
          draw();
        }catch(err){
          console.error('Error in game loop:', err);
        }
        requestAnimationFrame(loop);
      }
      // joystick state
      const joy = {active:false,dx:0,dy:0,max:28};

      // joystick event handling
      (function setupJoy(){
        const wrap = document.getElementById('joyWrap');
        const knob = document.getElementById('joyKnob');
        if(!wrap||!knob) return;

        let rect = wrap.getBoundingClientRect();
        function refreshRect(){ rect = wrap.getBoundingClientRect(); }
        window.addEventListener('resize', refreshRect);

        function pointerDown(e){
          e.preventDefault();
          joy.active = true;
          wrap.setPointerCapture && wrap.setPointerCapture(e.pointerId);
        }
        function pointerMove(e){
          if(!joy.active) return;
          const cx = rect.left + rect.width/2;
          const cy = rect.top + rect.height/2;
          const x = e.clientX - cx;
          const y = e.clientY - cy;
          const max = joy.max;
          const dist = Math.hypot(x,y);
          const nx = dist>max ? x/dist*max : x;
          const ny = dist>max ? y/dist*max : y;
          // normalize [-1,1]
          joy.dx = nx / max;
          joy.dy = ny / max;
        }
        function pointerUp(e){
          joy.active = false; joy.dx = 0; joy.dy = 0;
        }

        wrap.addEventListener('pointerdown', pointerDown);
        window.addEventListener('pointermove', pointerMove);
        window.addEventListener('pointerup', pointerUp);
        window.addEventListener('pointercancel', pointerUp);
      })();

      // create ammo bar now
      try{ buildAmmoBar(); }catch(e){ console.error('ammo bar build failed', e); }
      try{ updateLaserAmmoDisplay(); updateCreditsDisplay(); updateShipShieldDisplay(); }catch(e){}

      // input keys map for WASD + arrows; press `L` to toggle auto-fire on selected/nearest target
      const keys = {w:false,a:false,s:false,d:false,ArrowLeft:false,ArrowRight:false,ArrowUp:false,ArrowDown:false};
      function startAutoFireOnSelected(){
        if(selected<0){ let nearest=-1, nd=Infinity; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; const d=Math.hypot(e.x-ship.worldX,e.y-ship.worldY); if(d<nd){ nd=d; nearest=i;} } if(nearest!==-1) selected=nearest; }
        if(selected>=0 && enemies[selected]){
          ship.autoFireTargetId = enemies[selected].id;
          const now = Date.now();
          const ammoInfo = AMMO[currentAmmo] || AMMO.red;
          if(currentAmmo === 'orange' && now < (ship.lastOrangeFire || 0) + (ammoInfo.cooldown||2000)){
            ship.nextAutoFire = (ship.lastOrangeFire || 0) + (ammoInfo.cooldown||2000);
          } else {
            ship.nextAutoFire = now;
          }
        }
      }
      function stopAutoFire(){ ship.autoFireTargetId = null; }
      window.addEventListener('keydown', e=>{
        const k = e.key;
        if(k==='w' || k==='W') keys.w = true;
        if(k==='a' || k==='A') keys.a = true;
        if(k==='s' || k==='S') keys.s = true;
        if(k==='d' || k==='D') keys.d = true;
        if(k==='ArrowLeft' || k==='ArrowRight' || k==='ArrowUp' || k==='ArrowDown') keys[k] = true;
        // toggle auto-fire on L key press
        if(k==='l' || k==='L'){
          if(ship.autoFireTargetId) stopAutoFire(); else startAutoFireOnSelected();
        }
        // numeric keys 1..5 select ammo types in the ammo bar
        if(k>='1' && k<='5'){
          const idx = parseInt(k,10)-1; const key = Object.keys(AMMO)[idx]; if(key){ currentAmmo = key; document.querySelectorAll('#ammoBar .ammoBtn').forEach(n=>n.classList.remove('selected')); const b = document.querySelector(`#ammoBar .ammoBtn[data-ammo="${key}"]`); if(b) b.classList.add('selected'); updateAmmoCounts(); }
        }
      });
      window.addEventListener('keyup', e=>{
        const k = e.key;
        if(k==='w' || k==='W') keys.w = false;
        if(k==='a' || k==='A') keys.a = false;
        if(k==='s' || k==='S') keys.s = false;
        if(k==='d' || k==='D') keys.d = false;
        if(k==='ArrowLeft' || k==='ArrowRight' || k==='ArrowUp' || k==='ArrowDown') keys[k] = false;
      });

      // start loop
      loop();
      

    })();
  </script>
</body>
</html>
