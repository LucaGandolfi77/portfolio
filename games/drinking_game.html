    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* SCHERMATA CATEGORIE */
        .categories-screen {
            display: none;
        }
        .categories-screen.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 30px 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .category-btn:hover::before {
            left: 100%;
        }

        .category-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .category-btn:active {
            transform: translateY(-2px);
        }

        .btn-party {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            grid-column: 1;
        }

        .btn-bar {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            grid-column: 2;
        }

        .btn-hot {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            grid-column: 1;
        }

        .btn-sexy {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            grid-column: 2;
        }

        .btn-madness {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            grid-column: 1 / -1;
        }

        /* SCHERMATA SFIDE */
        .challenges-screen {
            display: none;
        }

        .challenges-screen.active {
            display: flex;
            flex-direction: column;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            align-self: flex-start;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .category-title {
            color: white;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* CAROUSEL */
        .carousel-container {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .carousel-wrapper {
            display: flex;
            position: relative;
            width: 100%;
            height: 400px;
            touch-action: pan-y;
        }

        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease-out;
            will-change: transform;
        }

        .card {
            flex: 0 0 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            cursor: grab;
            user-select: none;
        }

        .card:active {
            cursor: grabbing;
        }

        .card-content {
            color: white;
            font-size: 1.4em;
            font-weight: bold;
            line-height: 1.6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* INDICATORE PROGRESSO */
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: white;
            font-size: 0.9em;
        }

        .dots {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: white;
            width: 20px;
            border-radius: 4px;
        }

        /* COMANDI */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 2em;
            }

            .category-btn {
                font-size: 1.1em;
                padding: 20px 15px;
            }

            .card {
                padding: 20px;
            }

            .card-content {
                font-size: 1.2em;
            }
        }

        /* ANIMAZIONE SWIPE */
        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
        }

        /* Effetti per swipe: la card attiva si inclina e svanisce mentre la pista si sposta */
        .carousel-track {
            transition: transform 0.32s cubic-bezier(0.22, 0.8, 0.36, 1);
        }

        .carousel-track.anim-left .card.active {
            transform: translateX(-30%) rotate(-6deg);
            opacity: 0;
            transition: transform 0.32s ease, opacity 0.32s ease;
        }

        .carousel-track.anim-right .card.active {
            transform: translateX(30%) rotate(6deg);
            opacity: 0;
            transition: transform 0.32s ease, opacity 0.32s ease;
        }

        .card {
            will-change: transform, opacity;
        }

        .card.active {
            transform: none;
            transition: transform 0.32s ease;
        }

        .card.swipe-left, .card.swipe-right {
            pointer-events: none;
        }
    </style>

        // SELETTORI DOM
        const categoriesScreen = document.querySelector('.categories-screen');
        const challengesScreen = document.querySelector('.challenges-screen');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const backBtn = document.querySelector('.back-btn');
        const categoryTitle = document.getElementById('categoryTitle');
        const carouselTrack = document.getElementById('carouselTrack');
        const currentChallengeSpan = document.getElementById('currentChallenge');
        const totalChallengesSpan = document.getElementById('totalChallenges');
        const dotsContainer = document.getElementById('dotsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // VARIABILI GLOBALI
        let currentCategory = null;
        let currentIndex = 0;
        let startX = 0;
        let isDragging = false;
        let isAnimating = false;

        // EVENTI CATEGORIA
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.dataset.category;
                loadChallenges(currentCategory);
                showChallengesScreen();
            });
        });

        // BACK BUTTON
        backBtn.addEventListener('click', () => {
            currentIndex = 0;
            currentCategory = null;
            categoryTitle.textContent = '';
            carouselTrack.innerHTML = '';
            dotsContainer.innerHTML = '';
            totalChallengesSpan.textContent = 0;
            currentChallengeSpan.textContent = 1;
            showCategoriesScreen();
        });

        // NAVIGAZIONE
        prevBtn.addEventListener('click', () => {
            animateSwipe('right');
        });

        nextBtn.addEventListener('click', () => {
            animateSwipe('left');
        });

        // CARICA SFIDE
        function loadChallenges(category) {
            // Imposta titolo e azzera indice
            categoryTitle.textContent = category.charAt(0).toUpperCase() + category.slice(1);
            currentIndex = 0;
            const challenges = challengesDatabase[category];
            carouselTrack.innerHTML = '';
            
            challenges.forEach((challenge) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-content">${challenge}</div>`;
                carouselTrack.appendChild(card);
            });

            // AGGIORNA DOTS
            dotsContainer.innerHTML = '';
            challenges.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = 'dot' + (index === 0 ? ' active' : '');
                dotsContainer.appendChild(dot);
            });

            totalChallengesSpan.textContent = challenges.length;
            // assicura che la prima card sia marcata come active
            document.querySelectorAll('.card').forEach((card, idx) => card.classList.toggle('active', idx === currentIndex));
            updateCarousel();

            // AGGIUNGI TOUCH EVENTS (rimuove prima eventuali listener duplicati)
            const wrapper = document.querySelector('.carousel-wrapper');
            wrapper.removeEventListener('touchstart', handleTouchStart, false);
            wrapper.removeEventListener('touchmove', handleTouchMove, false);
            wrapper.removeEventListener('touchend', handleTouchEnd, false);
            wrapper.removeEventListener('mousedown', handleMouseDown, false);
            wrapper.removeEventListener('mousemove', handleMouseMove, false);
            wrapper.removeEventListener('mouseup', handleMouseUp, false);
            wrapper.removeEventListener('mouseleave', handleMouseUp, false);
            wrapper.addEventListener('touchstart', handleTouchStart, false);
            wrapper.addEventListener('touchmove', handleTouchMove, false);
            wrapper.addEventListener('touchend', handleTouchEnd, false);
            wrapper.addEventListener('mousedown', handleMouseDown, false);
            wrapper.addEventListener('mousemove', handleMouseMove, false);
            wrapper.addEventListener('mouseup', handleMouseUp, false);
            wrapper.addEventListener('mouseleave', handleMouseUp, false);
        }

        // AGGIORNA CAROUSEL
        function updateCarousel() {
            const offset = -currentIndex * 100;
            carouselTrack.style.transform = `translateX(${offset}%)`;
            currentChallengeSpan.textContent = currentIndex + 1;

            // AGGIORNA DOTS
            document.querySelectorAll('.dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });

            // AGGIORNA CLASSE ACTIVE SULLE CARD
            document.querySelectorAll('.card').forEach((card, idx) => {
                card.classList.toggle('active', idx === currentIndex);
            });
        }

        // ANIMAZIONE SWIPE
        function animateSwipe(direction) {
            if (isAnimating || !currentCategory) return;
            isAnimating = true;

            const total = challengesDatabase[currentCategory].length;
            let newIndex = currentIndex + (direction === 'left' ? 1 : -1);
            newIndex = (newIndex + total) % total;

            // aggiunge classe per tilt mentre la pista si sposta
            carouselTrack.classList.add(direction === 'left' ? 'anim-left' : 'anim-right');

            const cards = carouselTrack.querySelectorAll('.card');
            const outgoing = cards[currentIndex];
            if (outgoing) outgoing.classList.add(direction === 'left' ? 'swipe-left' : 'swipe-right');

            // sposta la pista verso la nuova card
            const offset = -newIndex * 100;
            carouselTrack.style.transform = `translateX(${offset}%)`;

            // pulizia dopo l'animazione
            setTimeout(() => {
                if (outgoing) outgoing.classList.remove('swipe-left', 'swipe-right');
                carouselTrack.classList.remove('anim-left', 'anim-right');
                currentIndex = newIndex;
                updateCarousel();
                isAnimating = false;
            }, 350);
        }

        // TOUCH EVENTS
        function handleTouchStart(e) {
            startX = e.touches[0].clientX;
            isDragging = true;
        }

        function handleTouchMove(e) {
            if (!isDragging) return;
        }

        function handleTouchEnd(e) {
            if (!isDragging) return;
            isDragging = false;

            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    animateSwipe('left');
                } else {
                    animateSwipe('right');
                }
            }
        }

        // MOUSE EVENTS (per desktop)
        function handleMouseDown(e) {
            startX = e.clientX;
            isDragging = true;
            e.preventDefault();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
        }

        function handleMouseUp(e) {
            if (!isDragging) return;
            isDragging = false;

            const endX = e.clientX;
            const diff = startX - endX;

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    animateSwipe('left');
                } else {
                    animateSwipe('right');
                }
            }
        }

        // MOSTRA/NASCONDI SCHERMATE
        function showChallengesScreen() {
            categoriesScreen.classList.remove('active');
            challengesScreen.classList.add('active');
        }

        function showCategoriesScreen() {
            challengesScreen.classList.remove('active');
            categoriesScreen.classList.add('active');
        }
    </script>
