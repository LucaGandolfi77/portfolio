<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0c0716" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Scarlius — Free Beer Party: avventura grafica punta-e-clicca notturna (Monkey Island style). Aiuta Thomas, Luca, Davide ed Ercole e attiva il leggendario Free Beer Party alla Playa. PWA ottimizzata per iPhone." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Scarlius — Free Beer Party</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#0c0716;position:fixed;inset:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  }
  #game{position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center;background:#0c0716}
  #game canvas{max-width:100%;max-height:100%;margin:auto}
</style>
</head>
<body>
<div id="game"></div>
<script src="js/phaser.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/minigames.js"></script>
<script src="js/rooms.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
