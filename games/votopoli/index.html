<title>Votopoli 🗳️ La Democrazia è un Gioco</title>
<style>
:root{
  --bg:#FFF8E7;--card:#FFFFFF;--card2:#FFF3D6;--line:#E8DCC8;
  --txt:#2D2013;--dim:#9E8E78;--gold:#FF9500;--gold-light:#FFE0A0;
  --green:#4CAF50;--green-dark:#2E7D32;--green-light:#E8F5E9;
  --red:#E53935;--red-light:#FFCDD2;
  --blue:#2196F3;--purple:#9C27B0;--cyan:#00BCD4;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);user-select:none;-webkit-user-select:none}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1207;--card:#2d2013;--card2:#3d2e1a;--line:#5a4a35;--txt:#f0e6d2;--dim:#8a7a62;--gold:#FFB340;--gold-light:#4a3520;--green:#66BB6A;--green-dark:#A5D6A7;--green-light:#1a2e1a;--red:#EF9A9A;--red-light:#4a1a1a;--blue:#64B5F6;--purple:#CE93D8;--cyan:#4DD0E1}
}
body.dark-mode{--bg:#1a1207;--card:#2d2013;--card2:#3d2e1a;--line:#5a4a35;--txt:#f0e6d2;--dim:#8a7a62;--gold:#FFB340;--gold-light:#4a3520;--green:#66BB6A;--green-dark:#A5D6A7;--green-light:#1a2e1a;--red:#EF9A9A;--red-light:#4a1a1a;--blue:#64B5F6;--purple:#CE93D8;--cyan:#4DD0E1}

#app{width:100%;max-width:420px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
#menu-view{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow-y:auto}
#game-view{flex:1;display:none;flex-direction:column}
#game-area{flex:1;overflow-y:auto}

.btn{display:block;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn:active{transform:scale(0.97);opacity:0.8}
.btn.primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--dim);font-weight:400}
.btn.small{padding:8px 12px;font-size:12px;width:auto;display:inline-block}
.btn:disabled{opacity:0.35;pointer-events:none}

.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.stat-val{font-weight:700}

.city-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.city-card{display:flex;align-items:center;gap:10px;padding:10px;margin:4px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.city-card:active{transform:scale(0.98)}
.city-card.locked{opacity:0.4}

.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.nav-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 8px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:13px;font-weight:700;cursor:pointer}
.nav-btn:active{transform:scale(0.97);background:var(--gold-light)}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--gold);color:#fff;margin:6px 0}
.badge.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

.election-card{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 0;background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.election-card:active{transform:scale(0.98)}
.election-card.disabled{opacity:0.4;pointer-events:none}

.candidate-card{display:flex;align-items:center;gap:10px;padding:10px;margin:6px 0;background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.candidate-card:active{transform:scale(0.98)}
.candidate-card.selected{border-color:var(--gold);background:var(--gold-light)}

.bld-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.citizen-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}

.mg-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0}
.mg-title{font-size:16px;font-weight:800;text-align:center}
.mg-sub{font-size:11px;color:var(--dim);text-align:center;margin:4px 0}
.mg-btn{display:block;width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;margin:4px 0}
.mg-btn:active{transform:scale(0.97)}
.mg-btn.correct{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
.mg-btn.wrong{border-color:var(--red);background:var(--red-light);color:var(--red)}

.mg-select-card{display:flex;align-items:center;gap:10px;padding:12px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.mg-select-card:active{transform:scale(0.98)}
.mg-select-card.locked{opacity:0.4}

.store-panel{padding:4px}
.store-item{display:flex;align-items:center;gap:10px;padding:10px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.store-item:active{transform:scale(0.98)}

.event-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:12px 16px;z-index:100;text-align:center;animation:slideUp 0.3s;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

.map-dot{transition:r 0.2s}
.map-dot:hover{r:4}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

/* Toggle switch */
.toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:24px;transition:0.3s}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.3s}
.toggle input:checked + .toggle-slider{background:var(--gold)}
.toggle input:checked + .toggle-slider::before{transform:translateX(20px)}

/* Achievement toast */
.achievement-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:10px 16px;z-index:300;display:flex;align-items:center;gap:10px;max-width:320px;box-shadow:0 4px 20px rgba(255,149,0,0.3);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1),opacity 0.4s;opacity:0}
.achievement-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.ach-icon{font-size:28px}
.ach-info{flex:1}
.ach-title{font-size:13px;font-weight:800;color:var(--gold)}
.ach-desc{font-size:10px;color:var(--dim)}
</style>
</head>

<div id="app">
  <div id="menu-view"></div>

  </div>
