<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seba</title>
<meta name="description" content="Seba, il barista da taschino: un mostriciattolo da accudire che fa i turni al bancone, gira 14 città tra rave e after, beve, fuma e combina figuracce. Sei minigiochi, guardaroba, cartoline. Satira per adulti, PWA offline.">
<meta name="theme-color" content="#1b0f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seba">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_kit/a11y.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <div id="scene"></div>

  <header id="hud">
    <div class="hud-row">
      <div class="level"><span id="lvl"></span><span id="xp" class="bar"><i></i></span></div>
      <span id="tips" aria-live="polite"></span>
      <button id="btn-settings" type="button">⚙︎</button>
    </div>
    <div id="needs"></div>
    <div id="chips"></div>
  </header>

  <section id="stage">
    <p id="bubble" role="status" hidden></p>
    <button id="seba" type="button" aria-label="Seba"></button>
  </section>

  <div id="actions"></div>
  <div id="tray"></div>
  <nav id="nav"></nav>

  <div id="toasts" aria-live="polite"></div>

  <div id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header><h2 id="sheet-title"></h2><button class="sheet-close" type="button">✕</button></header>
      <div class="sheet-body"></div>
    </div>
  </div>

  <div id="flight" hidden><span>✈️</span><b></b></div>
  <div id="games"></div>
  <div id="gate" hidden><div></div></div>
  <p id="sign"></p>
</main>
<noscript><p style="color:#fff;text-align:center">Seba ha bisogno di JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
