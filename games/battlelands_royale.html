<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Battlelands Royale 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      :root {
        --ui-size: 130px;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #1a3a5c;
        touch-action: none; -webkit-user-select: none; user-select: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game { position: fixed; inset: 0; }
      .hud {
        position: fixed; inset: 0; pointer-events: none;
        display: grid; grid-template-columns: 1fr 1fr;
        align-items: end; padding: 20px; gap: 20px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      }
      .stick {
        width: var(--ui-size); height: var(--ui-size);
        border-radius: 50%; background: rgba(255,255,255,0.08);
        border: 2px solid rgba(255,255,255,0.15);
        position: relative; pointer-events: auto; touch-action: none;
      }
      .knob {
        width: 55%; height: 55%; border-radius: 50%;
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.25);
        border: 2px solid rgba(255,255,255,0.4);
      }
      .status-bar {
        position: fixed; top: env(safe-area-inset-top, 10px);
        left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px; pointer-events: none;
      }
      .chip {
        padding: 8px 14px; border-radius: 20px;
        background: rgba(0,0,0,0.5); color: #fff;
        font-size: 13px; font-weight: 600;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .chip.hp { background: linear-gradient(135deg, rgba(220,50,50,0.7), rgba(180,30,30,0.7)); }
      .chip.shield { background: linear-gradient(135deg, rgba(50,150,220,0.7), rgba(30,100,180,0.7)); }
      .chip.zone { background: linear-gradient(135deg, rgba(255,100,0,0.7), rgba(200,50,0,0.7)); }
      .pickup-indicator {
        position: fixed; left: 50%; top: 60%;
        transform: translate(-50%, -50%);
        pointer-events: none; opacity: 0;
        transition: opacity 0.2s;
      }
      .pickup-indicator.active { opacity: 1; }
      .pickup-ring {
        width: 80px; height: 80px; border-radius: 50%;
        border: 4px solid #fff; position: relative;
      }
      .pickup-progress {
        position: absolute; inset: -4px;
        border-radius: 50%;
      }
      .pickup-label {
        text-align: center; color: #fff; font-size: 12px;
        margin-top: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      .pickup-label small { opacity: 0.7; font-size: 10px; }
      .pickup-label .rarity-common { color: #b0b0b0; }
      .pickup-label .rarity-rare { color: #4fc3f7; }
      .pickup-label .rarity-epic { color: #ba68c8; }
      .pickup-label .rarity-legendary { color: #ffd54f; }
      .minimap {
        position: fixed; top: calc(env(safe-area-inset-top, 10px) + 50px);
        right: 10px; width: 100px; height: 100px;
        background: rgba(0,0,0,0.4); border-radius: 8px;
        border: 2px solid rgba(255,255,255,0.2);
        overflow: hidden; pointer-events: none;
      }
      .minimap canvas { width: 100%; height: 100%; }
      .weapon-slot {
        position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; pointer-events: none;
      }
      .weapon-box {
        width: 50px; height: 50px; border-radius: 8px;
        background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px;
      }
      .weapon-box.active { border-color: #ffcc00; background: rgba(255,200,0,0.2); }
      .weapon-info {
        position: fixed; bottom: calc(80px + env(safe-area-inset-bottom, 0px));
        left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.6); padding: 6px 14px;
        border-radius: 12px; color: #fff; font-size: 11px;
        pointer-events: none; text-align: center;
        backdrop-filter: blur(8px);
      }
      .weapon-info .name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
      .weapon-info .stats { opacity: 0.8; }
      .rarity-common { color: #b0b0b0; }
      .rarity-rare { color: #4fc3f7; }
      .rarity-epic { color: #ba68c8; }
      .rarity-legendary { color: #ffd54f; }
      @media (max-width: 420px) {
        :root { --ui-size: 100px; }
        .hud { padding: 12px; }
        .minimap { width: 70px; height: 70px; }
      }
      .debug-panel {
        position: fixed; top: calc(env(safe-area-inset-top, 10px) + 160px);
        left: 10px; background: rgba(0,0,0,0.8); color: #0f0;
        font-family: monospace; font-size: 11px; padding: 8px;
        border-radius: 6px; pointer-events: none; z-index: 1000;
        max-width: 200px;
      }
      .debug-panel div { margin: 2px 0; }
      
      /* Game Over / Victory Screens */
      .game-overlay {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        pointer-events: none; opacity: 0;
        transition: opacity 0.5s ease;
        z-index: 9999;
      }
      .game-overlay.active { opacity: 1; pointer-events: auto; }
      
      .game-over-screen { background: rgba(30, 0, 0, 0.9); }
      .victory-screen { background: rgba(0, 30, 0, 0.85); }
      
      .game-overlay h1 {
        font-size: clamp(48px, 12vw, 96px);
        font-weight: 900; margin: 0;
        text-shadow: 0 0 40px currentColor, 0 4px 8px rgba(0,0,0,0.5);
        animation: titlePulse 1s ease-in-out infinite alternate;
      }
      .game-over-screen h1 { color: #ff3333; }
      .victory-screen h1 { color: #ffd700; }
      
      @keyframes titlePulse {
        from { transform: scale(1); opacity: 0.9; }
        to { transform: scale(1.05); opacity: 1; }
      }
      
      .game-overlay .subtitle {
        font-size: clamp(16px, 4vw, 24px);
        color: rgba(255,255,255,0.8); margin: 20px 0 40px;
      }
      
      .retry-btn {
        padding: 16px 48px; font-size: 20px;
        font-weight: 700; border: none; border-radius: 12px;
        cursor: pointer; transition: all 0.2s ease;
        text-transform: uppercase; letter-spacing: 2px;
      }
      .game-over-screen .retry-btn {
        background: linear-gradient(135deg, #ff4444, #cc0000);
        color: #fff; box-shadow: 0 4px 20px rgba(255,0,0,0.4);
      }
      .victory-screen .retry-btn {
        background: linear-gradient(135deg, #ffd700, #ff9500);
        color: #000; box-shadow: 0 4px 20px rgba(255,215,0,0.4);
      }
      .retry-btn:hover { transform: scale(1.05); }
      .retry-btn:active { transform: scale(0.98); }
      
      /* Confetti animation for victory */
      .confetti {
        position: fixed; width: 10px; height: 20px;
        top: -20px; animation: confettiFall 3s ease-in-out forwards;
        z-index: 10000; pointer-events: none;
      }
      @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
      }
      
      /* Screen shake for game over */
      @keyframes screenShake {
        0%, 100% { transform: translate(0, 0); }
        10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 2px); }
        20%, 40%, 60%, 80% { transform: translate(5px, -2px); }
      }
      .shaking { animation: screenShake 0.5s ease; }
      
      /* Death vignette */
      .death-vignette {
        position: fixed; inset: 0;
        pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(100,0,0,0.6) 100%);
        transition: opacity 0.3s ease;
        z-index: 100;
      }
      .death-vignette.active { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    
    <div class="debug-panel" id="debugPanel">
      <div>🔧 DEBUG MODE</div>
      <div id="debugPlayer">Player: (0, 0)</div>
      <div id="debugCamera">Camera: (0, 0, 0)</div>
      <div id="debugMove">Move: inactive</div>
      <div id="debugAim">Aim: inactive</div>
      <div id="debugScene">Scene: loading...</div>
    </div>
    
    <div class="status-bar">
      <div class="chip hp" id="hp">❤️ 100</div>
      <div class="chip shield" id="shield">🛡️ 0</div>
      <div class="chip zone" id="zone">🔥 90s</div>
      <div class="chip" id="alive">👥 13</div>
    </div>
    
    <div class="minimap"><canvas id="minimap"></canvas></div>
    
    <div class="weapon-info" id="weaponInfo">
      <div class="name">Fists</div>
      <div class="stats">DMG: 15 | Range: 4</div>
    </div>
    <div class="weapon-slot">
      <div class="weapon-box active" id="weapon">👊</div>
    </div>
    
    <div class="pickup-indicator" id="pickupIndicator">
      <svg class="pickup-ring" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>
        <circle class="pickup-progress" id="pickupProgress" cx="50" cy="50" r="45" 
          fill="none" stroke="#00ff88" stroke-width="6"
          stroke-dasharray="283" stroke-dashoffset="283"
          stroke-linecap="round" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="pickup-label" id="pickupLabel">Raccogliendo...</div>
    </div>
    
    <div class="hud">
      <div class="stick" id="moveStick"><div class="knob" id="moveKnob"></div></div>
      <div style="display:flex; justify-content:flex-end;">
        <div class="stick" id="aimStick"><div class="knob" id="aimKnob"></div></div>
      </div>
    </div>
    
    <!-- Death Vignette Effect -->
    <div class="death-vignette" id="deathVignette"></div>
    
    <!-- Game Over Screen -->
    <div class="game-overlay game-over-screen" id="gameOverScreen">
      <h1>💀 GAME OVER</h1>
      <div class="subtitle" id="gameOverSubtitle">Sei stato eliminato!</div>
      <button class="retry-btn" onclick="location.reload()">🔄 RIPROVA</button>
    </div>
    
    <!-- Victory Screen -->
    <div class="game-overlay victory-screen" id="victoryScreen">
      <h1>🏆 HAI VINTO!</h1>
      <div class="subtitle">Sei l'ultimo sopravvissuto!</div>
      <button class="retry-btn" onclick="location.reload()">🎮 GIOCA ANCORA</button>
    </div>

    <script>
    (function() {
      // ===== DEBUG HELPER =====
      const debugLog = (msg, isError = false) => {
        console.log(msg);
        const debugScene = document.getElementById('debugScene');
        if (debugScene) {
          debugScene.textContent = msg;
          if (isError) debugScene.style.color = '#f44';
        }
      };
      
      debugLog('Step 1: Script starting...');
      
      // Check if Three.js loaded
      if (typeof THREE === 'undefined') {
        debugLog('ERROR: Three.js not loaded!', true);
        return;
      }
      debugLog('Step 2: Three.js loaded ✓');
      
      // ===== SETUP =====
      const container = document.getElementById('game');
      if (!container) {
        debugLog('ERROR: #game container not found!', true);
        return;
      }
      debugLog('Step 3: Container found ✓');
      
      const hpEl = document.getElementById('hp');
      const shieldEl = document.getElementById('shield');
      const zoneEl = document.getElementById('zone');
      const aliveEl = document.getElementById('alive');
      const pickupIndicator = document.getElementById('pickupIndicator');
      const pickupProgress = document.getElementById('pickupProgress');
      const pickupLabel = document.getElementById('pickupLabel');
      const weaponEl = document.getElementById('weapon');
      const minimapCanvas = document.getElementById('minimap');
      const minimapCtx = minimapCanvas.getContext('2d');
      
      // Debug elements
      const debugPlayer = document.getElementById('debugPlayer');
      const debugCamera = document.getElementById('debugCamera');
      const debugMove = document.getElementById('debugMove');
      const debugAim = document.getElementById('debugAim');
      const debugScene = document.getElementById('debugScene');
      
      debugLog('Step 4: DOM elements ready ✓');
      
      try {
      
      minimapCanvas.width = 100;
      minimapCanvas.height = 100;
      debugLog('Step 5: Minimap canvas ready ✓');

      // Three.js setup
      debugLog('Step 6: Creating Three.js scene...');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 80, 200);
      debugLog('Step 7: Scene created ✓');

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
      // ZOOM OUT: Increased Y from 35->45, Z from 25->32
      camera.position.set(0, 45, 32);
      camera.lookAt(0, 0, 0);
      debugLog('Step 8: Camera created ✓');

      debugLog('Step 9: Creating WebGL renderer...');
      // Mobile optimization: detect low-end devices
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const isLowEnd = isMobile && (navigator.hardwareConcurrency <= 4 || window.innerWidth < 500);
      
      const renderer = new THREE.WebGLRenderer({ 
        antialias: !isLowEnd, // Disable antialiasing on low-end
        powerPreference: 'high-performance',
        stencil: false,
        depth: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      // Lower pixel ratio on mobile for performance
      renderer.setPixelRatio(isLowEnd ? 1 : Math.min(window.devicePixelRatio, 1.5));
      renderer.shadowMap.enabled = !isLowEnd; // Disable shadows on low-end
      if (!isLowEnd) {
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      container.appendChild(renderer.domElement);
      console.log(`Device: ${isLowEnd ? 'LOW-END' : 'NORMAL'} | Mobile: ${isMobile} | PixelRatio: ${renderer.getPixelRatio()}`);
      debugLog('Step 10: Renderer ready ✓');

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfff5e0, 1);
      sunLight.position.set(50, 80, 30);
      sunLight.castShadow = !isLowEnd;
      // Smaller shadow maps for better performance
      sunLight.shadow.mapSize.width = isLowEnd ? 512 : 1024;
      sunLight.shadow.mapSize.height = isLowEnd ? 512 : 1024;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 200;
      sunLight.shadow.camera.left = -80;
      sunLight.shadow.camera.right = 80;
      sunLight.shadow.camera.top = 80;
      sunLight.shadow.camera.bottom = -80;
      scene.add(sunLight);

      // ===== WORLD CONFIG =====
      const WORLD_SIZE = 150;  // Mappa più grande!
      const WATER_SIZE = 200;

      // ===== MATERIALS =====
      const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x7cb342 });
      const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
      const waterMaterial = new THREE.MeshLambertMaterial({ color: 0x29b6f6, transparent: true, opacity: 0.8 });
      const buildingMaterial = new THREE.MeshLambertMaterial({ color: 0x9e9e9e });
      const roofMaterial = new THREE.MeshLambertMaterial({ color: 0x795548 });
      const treeTrunkMaterial = new THREE.MeshLambertMaterial({ color: 0x5d4037 });
      const treeLeavesMaterial = new THREE.MeshLambertMaterial({ color: 0x388e3c });
      const bushMaterial = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });

      // ===== CREATE WORLD =====
      // Water
      const waterGeo = new THREE.PlaneGeometry(WATER_SIZE * 2, WATER_SIZE * 2);
      const water = new THREE.Mesh(waterGeo, waterMaterial);
      water.rotation.x = -Math.PI / 2;
      water.position.y = -0.5;
      scene.add(water);

      debugLog('Step 11: Creating island...');
      // Island (grass)
      const islandGeo = new THREE.CylinderGeometry(WORLD_SIZE / 2, WORLD_SIZE / 2 + 5, 2, 32);
      const island = new THREE.Mesh(islandGeo, grassMaterial);
      island.position.y = 0;
      island.receiveShadow = true;
      scene.add(island);
      debugLog('Step 12: Island created ✓');

      // Beach ring
      const beachGeo = new THREE.RingGeometry(WORLD_SIZE / 2 - 3, WORLD_SIZE / 2 + 2, 32);
      const beach = new THREE.Mesh(beachGeo, dirtMaterial);
      beach.rotation.x = -Math.PI / 2;
      beach.position.y = 1.01;
      scene.add(beach);

      // Buildings
      const buildings = [];
      function createBuilding(x, z, w, d, h) {
        const group = new THREE.Group();
        
        const wallGeo = new THREE.BoxGeometry(w, h, d);
        const walls = new THREE.Mesh(wallGeo, buildingMaterial);
        walls.position.y = h / 2;
        walls.castShadow = true;
        walls.receiveShadow = true;
        group.add(walls);

        const roofGeo = new THREE.ConeGeometry(Math.max(w, d) * 0.7, 3, 4);
        const roof = new THREE.Mesh(roofGeo, roofMaterial);
        roof.position.y = h + 1.5;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);

        group.position.set(x, 1, z);
        scene.add(group);
        buildings.push({ x, z, w: w + 2, d: d + 2, h });
        return group;
      }

      // Create various buildings - MAPPA PIÙ GRANDE con più edifici!
      // Centro città
      createBuilding(-20, -15, 8, 6, 5);
      createBuilding(15, 10, 10, 8, 6);
      createBuilding(-10, 20, 6, 6, 4);
      createBuilding(25, -20, 7, 7, 5);
      createBuilding(0, -25, 12, 8, 7);
      createBuilding(-25, 5, 5, 5, 4);
      createBuilding(30, 15, 6, 8, 5);
      // Nuovi edifici per mappa più grande
      createBuilding(-40, -35, 9, 7, 6);
      createBuilding(45, 30, 8, 8, 5);
      createBuilding(-35, 40, 7, 6, 5);
      createBuilding(50, -25, 10, 6, 7);
      createBuilding(-50, 10, 6, 9, 4);
      createBuilding(35, -45, 8, 5, 6);
      createBuilding(-15, -50, 7, 7, 5);
      createBuilding(40, 50, 6, 6, 4);
      // Edifici ai bordi
      createBuilding(-55, -20, 5, 5, 4);
      createBuilding(55, 5, 6, 4, 5);
      createBuilding(0, 55, 8, 6, 6);
      createBuilding(20, -55, 7, 5, 5);

      // Rocce decorative
      const rockMaterial = new THREE.MeshLambertMaterial({ color: 0x757575 });
      const sharedRockGeo = new THREE.DodecahedronGeometry(2, 0);
      
      function createRock(x, z, scale = 1) {
        const rock = new THREE.Mesh(sharedRockGeo, rockMaterial);
        rock.position.set(x, 1 + scale, z);
        rock.scale.set(scale, scale * 0.6, scale);
        rock.rotation.y = Math.random() * Math.PI;
        rock.castShadow = !isLowEnd;
        scene.add(rock);
      }
      
      // Aggiungi rocce sparse
      const rockCount = isLowEnd ? 8 : 20;
      for (let i = 0; i < rockCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 15 + Math.random() * 55;
        createRock(Math.cos(angle) * dist, Math.sin(angle) * dist, 0.5 + Math.random() * 1.5);
      }

      // Trees (optimized geometry) - PIÙ ALBERI!
      const sharedTrunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 6);
      const sharedLeavesGeo = new THREE.SphereGeometry(2.5, 6, 4);
      
      function createTree(x, z) {
        const group = new THREE.Group();
        
        const trunk = new THREE.Mesh(sharedTrunkGeo, treeTrunkMaterial);
        trunk.position.y = 1.5;
        trunk.castShadow = !isLowEnd;
        group.add(trunk);

        const leaves = new THREE.Mesh(sharedLeavesGeo, treeLeavesMaterial);
        leaves.position.y = 4.5;
        leaves.castShadow = !isLowEnd;
        group.add(leaves);

        group.position.set(x, 1, z);
        scene.add(group);
        return { x, z, radius: 1.5 };
      }

      const trees = [];
      const treeCount = isLowEnd ? 20 : 50;  // Più alberi per mappa grande
      for (let i = 0; i < treeCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 10 + Math.random() * 60;  // Distanza maggiore
        const x = Math.cos(angle) * dist;
        const z = Math.sin(angle) * dist;
        trees.push(createTree(x, z));
      }

      // Bushes (optimized with shared geometry) - PIÙ CESPUGLI!
      const sharedBushGeo = new THREE.SphereGeometry(1.2, 4, 3);
      
      function createBush(x, z) {
        const bush = new THREE.Mesh(sharedBushGeo, bushMaterial);
        bush.position.set(x, 1.6, z);
        bush.scale.y = 0.6;
        bush.castShadow = !isLowEnd;
        scene.add(bush);
      }

      const bushCount = isLowEnd ? 25 : 60;  // Più cespugli
      for (let i = 0; i < bushCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 8 + Math.random() * 65;  // Distanza maggiore
        createBush(Math.cos(angle) * dist, Math.sin(angle) * dist);
      }

      // ===== ZONE (Fire Circle) =====
      const zone = {
        currentRadius: WORLD_SIZE / 2 + 10,
        targetRadius: 5,
        targetX: (Math.random() - 0.5) * 50,  // Centro zona più variabile
        targetZ: (Math.random() - 0.5) * 50,
        currentX: 0,
        currentZ: 0,
        shrinkSpeed: 0.012,  // Leggermente più lento per mappa più grande
        damage: 5,
        timeToShrink: 90,  // Più tempo per mappa più grande
      };

      // Zone visual (fire ring)
      const zoneSegments = 64;
      const zoneGeo = new THREE.BufferGeometry();
      const zonePositions = new Float32Array(zoneSegments * 2 * 3);
      zoneGeo.setAttribute('position', new THREE.BufferAttribute(zonePositions, 3));
      const zoneMaterial = new THREE.LineBasicMaterial({ color: 0xff2200, linewidth: 3 });
      const zoneLine = new THREE.Line(zoneGeo, zoneMaterial);
      zoneLine.position.y = 2;
      scene.add(zoneLine);

      // Fire particles at zone border
      const fireParticles = [];
      const fireGeo = new THREE.SphereGeometry(0.4, 4, 3);
      const fireMaterials = [
        new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.9 }),
        new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 }),
        new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.7 }),
        new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.85 })
      ];
      
      // Create fire particles around zone
      const FIRE_PARTICLE_COUNT = isLowEnd ? 30 : 60;
      for (let i = 0; i < FIRE_PARTICLE_COUNT; i++) {
        const angle = (i / FIRE_PARTICLE_COUNT) * Math.PI * 2;
        const mat = fireMaterials[Math.floor(Math.random() * fireMaterials.length)].clone();
        const particle = new THREE.Mesh(fireGeo, mat);

      function setupStick(stick, knob, input) {
        let pointerId = null;
        const rectCache = { left: 0, top: 0, size: 0 };

        function updateRect() {
          const rect = stick.getBoundingClientRect();
          rectCache.left = rect.left;
          rectCache.top = rect.top;
          rectCache.size = rect.width;
        }

        updateRect();
        window.addEventListener('resize', updateRect);

        stick.addEventListener('pointerdown', (e) => {
          if (pointerId !== null) return;
          pointerId = e.pointerId;
          stick.setPointerCapture(pointerId);
          input.active = true;
          updateStick(e);
        });

        stick.addEventListener('pointermove', (e) => {
          if (e.pointerId !== pointerId) return;
          updateStick(e);
        });

        const endHandler = (e) => {
          if (e.pointerId !== pointerId) return;
          pointerId = null;
          input.active = false;
          input.x = 0;
          input.y = 0;
          knob.style.transform = 'translate(-50%, -50%)';
        };

        stick.addEventListener('pointerup', endHandler);
        stick.addEventListener('pointercancel', endHandler);

        function updateStick(e) {
          const size = rectCache.size;
          const centerX = rectCache.left + size / 2;
          const centerY = rectCache.top + size / 2;
          const dx = e.clientX - centerX;
          const dy = e.clientY - centerY;
          const max = size / 2;
          const dist = Math.hypot(dx, dy);
          const clamped = Math.min(dist, max);
          const angle = Math.atan2(dy, dx);
          input.x = Math.cos(angle) * (clamped / max);
          input.y = Math.sin(angle) * (clamped / max);
          knob.style.transform = `translate(calc(-50% + ${input.x * max}px), calc(-50% + ${input.y * max}px))`;
        }
      }

      debugLog('Step 17: Setting up joysticks...');
      setupStick(document.getElementById('moveStick'), document.getElementById('moveKnob'), moveInput);
      setupStick(document.getElementById('aimStick'), document.getElementById('aimKnob'), aimInput);
      debugLog('Step 18: Joysticks ready ✓');

      // ===== UTILITY =====
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      function checkCollision(x, z, radius) {
        // Buildings
        for (const b of buildings) {
          if (x > b.x - b.w/2 - radius && x < b.x + b.w/2 + radius &&
              z > b.z - b.d/2 - radius && z < b.z + b.d/2 + radius) {
            return true;
          }
        }
        // Trees
        for (const t of trees) {
          if (Math.hypot(x - t.x, z - t.z) < t.radius + radius) return true;
        }
        return false;
      }

      // ===== GAME LOOP =====
      let lastTime = performance.now();
      let gameTime = 0;

      function update(dt) {
        gameTime += dt;

        // Update zone
        if (zone.timeToShrink > 0) {
          zone.timeToShrink -= dt;
        } else if (zone.currentRadius > zone.targetRadius) {
          zone.currentRadius -= zone.shrinkSpeed;
          zone.currentX += (zone.targetX - zone.currentX) * 0.001;
          zone.currentZ += (zone.targetZ - zone.currentZ) * 0.001;
        }
        updateZoneVisual();

        // Player movement
        const inputLen = Math.hypot(moveInput.x, moveInput.y);
        if (inputLen > 0.1) {
          // INVERTED Y axis for movement stick (removed negative sign)
          const moveAngle = Math.atan2(moveInput.x, moveInput.y);
          const newX = player.x + Math.sin(moveAngle) * player.speed;
          const newZ = player.z + Math.cos(moveAngle) * player.speed;

          // Check boundaries (island)
          const distFromCenter = Math.hypot(newX, newZ);
          if (distFromCenter < WORLD_SIZE / 2 - 2 && !checkCollision(newX, newZ, 0.5)) {
            player.x = newX;
            player.z = newZ;
          }
        }

        // Player aiming & shooting
        if (aimInput.active && Math.hypot(aimInput.x, aimInput.y) > 0.3) {
          // INVERTED Y axis for aim stick (same as movement)
          player.angle = Math.atan2(aimInput.x, aimInput.y);
          
          // Incrementa il timer di mira
          player.aimTimer += dt;
          
          // Spara solo dopo 0.5 secondi di mira
          const AIM_DELAY = 0.5;
          if (player.aimTimer >= AIM_DELAY) {
            const weapon = WEAPONS[player.weaponKey];
            if (player.shootCooldown <= 0 && player.ammo > 0) {
              if (player.weaponKey === 'fists') {
                // Punch animation instead of bullet
                doPunch();
              } else {
                shoot(player.x, player.z, player.angle, false, player.weaponKey);
                if (player.ammo !== Infinity) {
                  player.ammo--;
                  updateWeaponUI();
                }
              }
              player.shootCooldown = weapon.fireRate / 16; // Convert ms to frames
            }
          }
        } else {
          // Reset aim timer quando si smette di mirare
          player.aimTimer = 0;
        }
        if (player.shootCooldown > 0) player.shootCooldown--;

        // Update player mesh
        player.mesh.position.set(player.x, 1, player.z);
        player.mesh.rotation.y = player.angle;

        // Zone damage
        const playerDistFromZone = Math.hypot(player.x - zone.currentX, player.z - zone.currentZ);
        if (playerDistFromZone > zone.currentRadius) {
          if (player.shield > 0) {
            player.shield = Math.max(0, player.shield - zone.damage * dt);
          } else {
            player.hp = Math.max(0, player.hp - zone.damage * dt);
          }
        }

        // Pickup detection
        let nearPickup = null;
        for (const p of pickups) {
          const dist = Math.hypot(player.x - p.x, player.z - p.z);
          if (dist < 1.5) {
            nearPickup = p;
            break;
          }
          // Bobbing animation
          p.mesh.position.y = 1.2 + Math.sin(gameTime * 3 + p.bobPhase) * 0.15;
          p.mesh.rotation.y += dt * 2;
        }

        if (nearPickup) {
          if (currentPickup === nearPickup) {
            pickupTimer += dt;
            const progress = Math.min(pickupTimer / PICKUP_TIME, 1);
            pickupProgress.style.strokeDashoffset = 283 * (1 - progress);
            
            if (pickupTimer >= PICKUP_TIME) {
              // Collect pickup
              if (nearPickup.type === 'health') {
                player.hp = Math.min(100, player.hp + nearPickup.value);
              } else if (nearPickup.type === 'shield') {
                player.shield = Math.min(100, player.shield + nearPickup.value);
              } else if (nearPickup.type === 'weapon') {
                // Drop current weapon if not fists
                if (player.weaponKey !== 'fists') {
                  createPickup(player.x + (Math.random() - 0.5) * 2, player.z + (Math.random() - 0.5) * 2, 'weapon', player.weaponKey);
                }
                player.weaponKey = nearPickup.weaponKey;
                player.ammo = WEAPONS[player.weaponKey].ammo;
                updateWeaponUI();
              }
              scene.remove(nearPickup.mesh);
              pickups.splice(pickups.indexOf(nearPickup), 1);
              currentPickup = null;
              pickupTimer = 0;
              pickupIndicator.classList.remove('active');
            }
          } else {
            currentPickup = nearPickup;
            pickupTimer = 0;
            if (nearPickup.type === 'weapon') {
              const rarityText = nearPickup.rarity.toUpperCase();
              pickupLabel.innerHTML = `<span class="rarity-${nearPickup.rarity}">${nearPickup.weaponName}</span><br><small>${rarityText}</small>`;
            } else {
              pickupLabel.textContent = nearPickup.emoji + ' Raccogliendo...';
            }
            pickupIndicator.classList.add('active');
          }
        } else {
          currentPickup = null;
          pickupTimer = 0;
          pickupIndicator.classList.remove('active');
          pickupProgress.style.strokeDashoffset = 283;
        }

        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          const distToPlayer = Math.hypot(e.x - player.x, e.z - player.z);
          
          // Zone damage for enemies
          const enemyDistFromZone = Math.hypot(e.x - zone.currentX, e.z - zone.currentZ);
          if (enemyDistFromZone > zone.currentRadius) {
            e.hp -= zone.damage * dt * 2;
          }

          // Find nearest weapon pickup if unarmed
          let nearestWeaponDist = Infinity;
          let nearestWeapon = null;
          if (e.weaponKey === 'fists') {
            for (const p of pickups) {
              if (p.type === 'weapon') {
                const d = Math.hypot(e.x - p.x, e.z - p.z);
                if (d < nearestWeaponDist) {
                  nearestWeaponDist = d;
                  nearestWeapon = p;
                }
              }
            }
          }
          
          // Find nearest target (player or other enemy)
          let nearestTargetDist = distToPlayer;
          let targetX = player.x;
          let targetZ = player.z;
          let targetIsPlayer = true;
          
          // Check other enemies as potential targets
          for (let j = 0; j < enemies.length; j++) {
            if (i !== j) {
              const other = enemies[j];
              const d = Math.hypot(e.x - other.x, e.z - other.z);
              if (d < nearestTargetDist && d < 20) {
                // 30% chance to target another enemy instead of player
                if (Math.random() < 0.3 || distToPlayer > 25) {
                  nearestTargetDist = d;
                  targetX = other.x;
                  targetZ = other.z;
                  targetIsPlayer = false;
                }
              }
            }
          }

          // AI State Machine
          if (e.weaponKey === 'fists' && nearestWeapon) {
            // UNARMED: Search for weapons
            e.state = 'searchWeapon';
            const angleToWeapon = Math.atan2(nearestWeapon.x - e.x, nearestWeapon.z - e.z);
            e.angle = angleToWeapon;
            
            const newX = e.x + Math.sin(e.angle) * e.speed * 1.2; // Move faster when searching
            const newZ = e.z + Math.cos(e.angle) * e.speed * 1.2;
            if (!checkCollision(newX, newZ, 0.5)) {
              e.x = newX;
              e.z = newZ;
            }
            
            // Check if close enough to pick up weapon
            if (nearestWeaponDist < 1.5) {
              e.weaponKey = nearestWeapon.weaponKey;
              e.ammo = WEAPONS[e.weaponKey].ammo;
              scene.remove(nearestWeapon.mesh);
              pickups.splice(pickups.indexOf(nearestWeapon), 1);
              e.state = 'combat';
            }
          } else if (e.weaponKey !== 'fists' && nearestTargetDist < 25) {
            // ARMED: Combat mode - chase and shoot
            e.state = 'combat';
            const angleToTarget = Math.atan2(targetX - e.x, targetZ - e.z);
            e.angle = angleToTarget;
            
            if (nearestTargetDist > 8) {
              const newX = e.x + Math.sin(e.angle) * e.speed;
              const newZ = e.z + Math.cos(e.angle) * e.speed;
              if (!checkCollision(newX, newZ, 0.5)) {
                e.x = newX;
                e.z = newZ;
              }
            }
            
            // Shoot at target
            if (e.shootCooldown <= 0 && nearestTargetDist < 20 && e.ammo > 0) {
              shoot(e.x, e.z, e.angle, true, e.weaponKey);
              if (e.ammo !== Infinity) e.ammo--;
              const weapon = WEAPONS[e.weaponKey];
              e.shootCooldown = (weapon.fireRate / 16) + Math.random() * 10;
            }
          } else {
            // WANDER: No weapon nearby and no target in range
            e.state = 'wander';
            if (Math.random() < 0.01) {
              e.angle = Math.random() * Math.PI * 2;
            }
            const newX = e.x + Math.sin(e.angle) * e.speed * 0.5;
            const newZ = e.z + Math.cos(e.angle) * e.speed * 0.5;
            const distFromCenter = Math.hypot(newX, newZ);
            if (distFromCenter < WORLD_SIZE / 2 - 3 && !checkCollision(newX, newZ, 0.5)) {
              e.x = newX;
              e.z = newZ;
            } else {
              e.angle += Math.PI;
            }
          }

          if (e.shootCooldown > 0) e.shootCooldown--;
          e.mesh.position.set(e.x, 1, e.z);
          e.mesh.rotation.y = e.angle;

          // Check if dead
          if (e.hp <= 0) {
            scene.remove(e.mesh);
            enemies.splice(i, 1);
            // Drop weapon if armed
            if (e.weaponKey !== 'fists') {
              createPickup(e.x, e.z, 'weapon', e.weaponKey);
            }
            // Additional drops
            const dropRand = Math.random();
            if (dropRand < 0.3) {
              createPickup(e.x + 1, e.z, 'health');
            } else if (dropRand < 0.5) {
              createPickup(e.x - 1, e.z, 'shield');
            }
          }
        }

        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx;
          b.z += b.vz;
          b.life--;
          b.mesh.position.set(b.x, 1.5, b.z);

          let removed = false;

          // Check collisions with enemies (from player bullets)
          if (!b.isEnemy) {
            let hitAny = false;
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              const hitRadius = b.explosive ? 3 : 1;
              if (Math.hypot(b.x - e.x, b.z - e.z) < hitRadius) {
                e.hp -= b.damage;
                hitAny = true;
                if (!b.explosive) {
                  scene.remove(b.mesh);
                  bullets.splice(i, 1);
                  removed = true;
                  break;
                }
              }
            }
            if (!removed && b.explosive && hitAny) {
              scene.remove(b.mesh);
              bullets.splice(i, 1);
              removed = true;
            }
          } else {
            // Enemy bullets can hit player AND other enemies
            // Check player
            if (Math.hypot(b.x - player.x, b.z - player.z) < 1) {
              const dmg = b.damage || 10;
              if (player.shield > 0) {
                player.shield = Math.max(0, player.shield - dmg);
              } else {
                player.hp = Math.max(0, player.hp - dmg);
              }
              scene.remove(b.mesh);
              bullets.splice(i, 1);
              removed = true;
            }
            
            // Check other enemies (friendly fire)
            if (!removed) {
              for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (Math.hypot(b.x - e.x, b.z - e.z) < 1) {
                  e.hp -= b.damage || 10;
                  scene.remove(b.mesh);
                  bullets.splice(i, 1);
                  removed = true;
                  break;
                }
              }
            }
          }

          if (!removed && (b.life <= 0 || Math.hypot(b.x, b.z) > WORLD_SIZE)) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }

        // Update punch effects
        for (let i = punchEffects.length - 1; i >= 0; i--) {
          const p = punchEffects[i];
          p.life--;
          p.mesh.scale.multiplyScalar(1.15);
          p.mesh.material.opacity *= 0.85;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            punchEffects.splice(i, 1);
          }
        }

        // Update aim line (dotted trajectory)
        updateAimLine();

        // Camera follow (ZOOMED OUT)
        camera.position.x = player.x;
        camera.position.z = player.z + 32;
        camera.position.y = 45;
        camera.lookAt(player.x, 0, player.z);
        
        // Debug info update
        debugPlayer.textContent = `Player: (${player.x.toFixed(1)}, ${player.z.toFixed(1)})`;
        debugCamera.textContent = `Camera: (${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)})`;
        debugMove.textContent = `Move: ${moveInput.active ? `(${moveInput.x.toFixed(2)}, ${moveInput.y.toFixed(2)})` : 'inactive'}`;
        debugAim.textContent = `Aim: ${aimInput.active ? `(${aimInput.x.toFixed(2)}, ${aimInput.y.toFixed(2)})` : 'inactive'}`;
        debugScene.textContent = `Objects: ${scene.children.length} | Enemies: ${enemies.length}`;

        // Update HUD
        hpEl.textContent = `❤️ ${Math.round(player.hp)}`;
        shieldEl.textContent = `🛡️ ${Math.round(player.shield)}`;
        zoneEl.textContent = `🔥 ${Math.max(0, Math.round(zone.timeToShrink))}s`;
        aliveEl.textContent = `👥 ${enemies.length + 1}`;

        // Update minimap
        minimapCtx.fillStyle = '#1a3a5c';
        minimapCtx.fillRect(0, 0, 100, 100);
        
        // Draw island
        minimapCtx.fillStyle = '#7cb342';
        minimapCtx.beginPath();
        minimapCtx.arc(50, 50, 40, 0, Math.PI * 2);
        minimapCtx.fill();
        
        // Draw zone
        minimapCtx.strokeStyle = '#ff4400';
        minimapCtx.lineWidth = 2;
        minimapCtx.beginPath();
        const zoneScale = 40 / (WORLD_SIZE / 2);
        minimapCtx.arc(
          50 + zone.currentX * zoneScale,
          50 + zone.currentZ * zoneScale,
          zone.currentRadius * zoneScale,
          0, Math.PI * 2
        );
        minimapCtx.stroke();
        
        // Draw enemies
        minimapCtx.fillStyle = '#ff4444';
        for (const e of enemies) {
          const mx = 50 + (e.x / (WORLD_SIZE / 2)) * 40;
          const mz = 50 + (e.z / (WORLD_SIZE / 2)) * 40;
          minimapCtx.beginPath();
          minimapCtx.arc(mx, mz, 2, 0, Math.PI * 2);
          minimapCtx.fill();
        }
        
        // Draw player
        minimapCtx.fillStyle = '#2196f3';
        const px = 50 + (player.x / (WORLD_SIZE / 2)) * 40;
        const pz = 50 + (player.z / (WORLD_SIZE / 2)) * 40;
        minimapCtx.beginPath();
        minimapCtx.arc(px, pz, 4, 0, Math.PI * 2);
        minimapCtx.fill();
      }

      let frames = 0;
      let renderStats = { updateTime: 0, renderTime: 0, lastLog: 0 };
      let gameState = 'playing'; // 'playing', 'gameover', 'victory'
      
      // Game Over / Victory screen references
      const gameOverScreen = document.getElementById('gameOverScreen');
      const victoryScreen = document.getElementById('victoryScreen');
      const deathVignette = document.getElementById('deathVignette');
      const gameOverSubtitle = document.getElementById('gameOverSubtitle');
      
      // Create confetti for victory
      function createConfetti() {
        const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ff69b4'];
        for (let i = 0; i < 100; i++) {
          setTimeout(() => {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
            confetti.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4000);
          }, i * 30);
        }
      }
      
      function showGameOver(killedBy = null) {
        if (gameState !== 'playing') return;
        gameState = 'gameover';
        
        // Screen shake
        document.body.classList.add('shaking');
        setTimeout(() => document.body.classList.remove('shaking'), 500);
        
        // Death vignette
        deathVignette.classList.add('active');
        
        // Update subtitle
        if (killedBy) {
          gameOverSubtitle.textContent = `Eliminato da ${killedBy}!`;
        } else {
          gameOverSubtitle.textContent = 'Sei stato eliminato!';
        }
        
        // Show game over screen after short delay
        setTimeout(() => {
          gameOverScreen.classList.add('active');
        }, 500);
        
        console.log('💀 GAME OVER');
      }
      
      function showVictory() {
        if (gameState !== 'playing') return;
        gameState = 'victory';
        
        // Create confetti explosion
        createConfetti();
        
        // Show victory screen
        setTimeout(() => {
          victoryScreen.classList.add('active');
        }, 300);
        
        console.log('🏆 VICTORY!');
      }
      
      // Check game end conditions
      function checkGameEnd() {
        // Check for death
        if (player.hp <= 0 && gameState === 'playing') {
          showGameOver();
          return;
        }
        
        // Check for victory (all enemies dead)
        if (enemies.length === 0 && gameState === 'playing') {
          showVictory();
          return;
        }
      }
      
      function animate(time) {
        requestAnimationFrame(animate);
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;
        frames++;

        // Log every second with detailed stats
        if (frames % 60 === 0) {
          const memInfo = renderer.info.memory;
          const renderInfo = renderer.info.render;
          console.log(`[Frame ${frames}] Time: ${Math.round(time/1000)}s | ` +
            `Objects: ${scene.children.length} | ` + 
            `Bullets: ${bullets.length} | ` +
            `Enemies: ${enemies.length} | ` +
            `Pickups: ${pickups.length} | ` +
            `Punches: ${punchEffects.length} | ` +
            `Geometries: ${memInfo.geometries} | ` +
            `Textures: ${memInfo.textures} | ` +
            `DrawCalls: ${renderInfo.calls} | ` +
            `Triangles: ${renderInfo.triangles}`);
          debugLog(`Alive: ${Math.round(time/1000)}s | Obj:${scene.children.length}`);
        }

        try {
          const updateStart = performance.now();
          if (gameState === 'playing' && player.hp > 0) {
            update(dt);
            checkGameEnd(); // Controlla vittoria/sconfitta
          } else if (gameState === 'playing') {
            // Player just died
            checkGameEnd();
          }
          renderStats.updateTime = performance.now() - updateStart;
          
          const renderStart = performance.now();
          renderer.render(scene, camera);
          renderStats.renderTime = performance.now() - renderStart;
          
          // Warn if frame takes too long
          if (renderStats.updateTime + renderStats.renderTime > 32) {
            console.warn(`[SLOW FRAME ${frames}] Update: ${renderStats.updateTime.toFixed(1)}ms, Render: ${renderStats.renderTime.toFixed(1)}ms`);
          }
        } catch (e) {
          console.error('CRASH at frame', frames, e);
          console.error('Stack:', e.stack);
          debugLog(`CRASH: ${e.message}`, true);
        }
      }

      // Handle resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      debugLog('Step 19: Starting animation loop...');
      animate(performance.now());
      
      console.log('🎮 Game started!');
      console.log('🌍 Scene children:', scene.children.length);
      console.log('👤 Player initial pos:', player.x, player.z);
      console.log('📷 Camera pos:', camera.position);
      console.log('🏝️ Island at y=0, radius=', WORLD_SIZE/2);
      debugScene.textContent = `✅ RUNNING | ${scene.children.length} objects`;
      
      } catch (error) {
        console.error('❌ Game initialization error:', error);
        debugScene.textContent = `ERROR: ${error.message}`;
        debugScene.style.color = '#f44';
      }
    })();
    </script>
  </body>
