<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="battlelands_manifest.json" />
    <link rel="apple-touch-icon" href="../assets/images/games/battlelands_icon_192.png" />
    <meta name="apple-mobile-web-app-title" content="Battlelands" />
    <meta name="theme-color" content="#ffd700" />
    <title>Battlelands Royale 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      :root {
        --ui-size: 130px;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #1a3a5c;
        touch-action: none; -webkit-user-select: none; user-select: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game { position: fixed; inset: 0; }
      .hud {
        position: fixed; inset: 0; pointer-events: none;
        display: grid; grid-template-columns: 1fr 1fr;
        align-items: end; padding: 20px; gap: 20px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      }
      .stick {
        width: var(--ui-size); height: var(--ui-size);
        border-radius: 50%; background: rgba(255,255,255,0.08);
        border: 2px solid rgba(255,255,255,0.15);
        position: relative; pointer-events: auto; touch-action: none;
      }
      .knob {
        width: 55%; height: 55%; border-radius: 50%;
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.25);
        border: 2px solid rgba(255,255,255,0.4);
      }
      .status-bar {
        position: fixed; top: env(safe-area-inset-top, 10px);
        left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px; pointer-events: none;
      }
      .chip {
        padding: 8px 14px; border-radius: 20px;
        background: rgba(0,0,0,0.5); color: #fff;
        font-size: 13px; font-weight: 600;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .chip.hp { background: linear-gradient(135deg, rgba(220,50,50,0.7), rgba(180,30,30,0.7)); }
      .chip.shield { background: linear-gradient(135deg, rgba(50,150,220,0.7), rgba(30,100,180,0.7)); }
      .chip.zone { background: linear-gradient(135deg, rgba(255,100,0,0.7), rgba(200,50,0,0.7)); }
      .chip.weapon { background: linear-gradient(135deg, rgba(100,100,100,0.7), rgba(60,60,60,0.7)); }
      .pickup-indicator {
        position: fixed; left: 50%; top: 60%;
        transform: translate(-50%, -50%);
        pointer-events: none; opacity: 0;
        transition: opacity 0.2s;
      }
      .pickup-indicator.active { opacity: 1; }
      .pickup-ring {
        width: 80px; height: 80px; border-radius: 50%;
        border: 4px solid #fff; position: relative;
      }
      .pickup-progress {
        position: absolute; inset: -4px;
        border-radius: 50%;
      }
      .pickup-label {
        text-align: center; color: #fff; font-size: 12px;
        margin-top: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      .pickup-label small { opacity: 0.7; font-size: 10px; }
      .pickup-label .rarity-common { color: #b0b0b0; }
      .pickup-label .rarity-rare { color: #4fc3f7; }
      .pickup-label .rarity-epic { color: #ba68c8; }
      .pickup-label .rarity-legendary { color: #ffd54f; }
      .minimap {
        position: fixed; top: calc(env(safe-area-inset-top, 10px) + 50px);
        right: 10px; width: 100px; height: 100px;
        background: rgba(0,0,0,0.4); border-radius: 8px;
        border: 2px solid rgba(255,255,255,0.2);
        overflow: hidden; pointer-events: none;
      }
      .minimap canvas { width: 100%; height: 100%; }
      .weapon-slot {
        position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; pointer-events: none;
      }
      .weapon-box {
        width: 65px; height: 65px; border-radius: 10px;
        background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px;
      }
      .weapon-box.active { border-color: #ffcc00; background: rgba(255,200,0,0.2); }
      .weapon-info {
        position: fixed; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
        left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.6); padding: 6px 14px;
        border-radius: 12px; color: #fff; font-size: 11px;
        pointer-events: none; text-align: center;
        backdrop-filter: blur(8px);
        display: flex; align-items: center; gap: 8px;
        white-space: nowrap;
      }
      .weapon-info .name { font-weight: 700; font-size: 13px; }
      .weapon-info .stats { opacity: 0.8; }
      .rarity-common { color: #b0b0b0; }
      .rarity-rare { color: #4fc3f7; }
      .rarity-epic { color: #ba68c8; }
      .rarity-legendary { color: #ffd54f; }
      @media (max-width: 420px) {
        :root { --ui-size: 100px; }
        .hud { padding: 12px; }
        .minimap { width: 70px; height: 70px; }
      }
      
      /* Landscape mode adjustments */
      @media (orientation: landscape) {
        .minimap { 
          width: 60px; height: 60px;
          top: calc(env(safe-area-inset-top, 10px) + 10px);
          right: 10px;
        }
      }
      
      /* Game Over / Victory Screens */
      .game-overlay {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        pointer-events: none; opacity: 0;
        transition: opacity 0.5s ease;
        z-index: 9999;
      }
      .game-overlay.active { opacity: 1; pointer-events: auto; }
      
      .game-over-screen { background: rgba(30, 0, 0, 0.9); }
      .victory-screen { background: rgba(0, 30, 0, 0.85); }
      
      .game-overlay h1 {
        font-size: clamp(48px, 12vw, 96px);
        font-weight: 900; margin: 0;
        text-shadow: 0 0 40px currentColor, 0 4px 8px rgba(0,0,0,0.5);
        animation: titlePulse 1s ease-in-out infinite alternate;
      }
      .game-over-screen h1 { color: #ff3333; }
      .victory-screen h1 { color: #ffd700; }
      
      @keyframes titlePulse {
        from { transform: scale(1); opacity: 0.9; }
        to { transform: scale(1.05); opacity: 1; }
      }
      
      .game-overlay .subtitle {
        font-size: clamp(16px, 4vw, 24px);
        color: rgba(255,255,255,0.8); margin: 20px 0 40px;
      }
      
      .retry-btn {
        padding: 16px 48px; font-size: 20px;
        font-weight: 700; border: none; border-radius: 12px;
        cursor: pointer; transition: all 0.2s ease;
        text-transform: uppercase; letter-spacing: 2px;
      }
      .game-over-screen .retry-btn {
        background: linear-gradient(135deg, #ff4444, #cc0000);
        color: #fff; box-shadow: 0 4px 20px rgba(255,0,0,0.4);
      }
      .victory-screen .retry-btn {
        background: linear-gradient(135deg, #ffd700, #ff9500);
        color: #000; box-shadow: 0 4px 20px rgba(255,215,0,0.4);
      }
      .retry-btn:hover { transform: scale(1.05); }
      .retry-btn:active { transform: scale(0.98); }
      
      /* Confetti animation for victory */
      .confetti {
        position: fixed; width: 10px; height: 20px;
        top: -20px; animation: confettiFall 3s ease-in-out forwards;
        z-index: 10000; pointer-events: none;
      }
      @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
      }
      
      /* Screen shake for game over */
      @keyframes screenShake {
        0%, 100% { transform: translate(0, 0); }
        10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 2px); }
        20%, 40%, 60%, 80% { transform: translate(5px, -2px); }
      }
      .shaking { animation: screenShake 0.5s ease; }
      
      /* Death vignette */
      .death-vignette {
        position: fixed; inset: 0;
        pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(100,0,0,0.6) 100%);
        transition: opacity 0.3s ease;
        z-index: 100;
      }
      .death-vignette.active { opacity: 1; }
      
      /* Start Screen */
      .start-screen {
        position: fixed; inset: 0;
        background: linear-gradient(135deg, #1a3a5c 0%, #0d1f30 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 10000; padding: 20px;
      }
      .start-screen.hidden { display: none; }
      
      .start-screen h1 {
        font-size: clamp(20px, 5vw, 36px);
        color: #fff; margin: 0 0 5px;
        text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      .start-screen h1 span { color: #ffd700; }
      
      .start-section {
        background: rgba(255,255,255,0.1);
        border-radius: 12px; padding: 12px;
        margin: 8px 0; width: 100%;
        max-width: 400px; backdrop-filter: blur(10px);
      }
      .start-section h3 {
        color: #fff; margin: 0 0 8px;
        font-size: 13px; opacity: 0.9;
      }
      
      .skin-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }
      .skin-option {
        aspect-ratio: 1; border-radius: 6px;
        border: 1.5px solid transparent;
        cursor: pointer; transition: all 0.2s;
        display: flex; align-items: center;
        justify-content: center; position: relative;
      }
      .skin-option:hover { transform: scale(1.08); }
      .skin-option.selected { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.5); }
      .skin-option .shape {
        width: 50%; height: 50%;
        border-radius: 50%;
      }
      .skin-option .shape.square { border-radius: 20%; }
      .skin-option .shape.star {
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        border-radius: 0;
      }
      .skin-option .shape.diamond {
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        border-radius: 0;
      }
      
      .resolution-options {
        display: flex; gap: 6px; flex-wrap: wrap;
      }
      .resolution-btn {
        flex: 1; min-width: 60px;
        padding: 8px 6px; border: 2px solid rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.1); color: #fff;
        border-radius: 8px; cursor: pointer;
        font-size: 11px; font-weight: 600;
        transition: all 0.2s;
      }
      .resolution-btn:hover { background: rgba(255,255,255,0.2); }
      .resolution-btn.selected {
        border-color: #4fc3f7; background: rgba(79,195,247,0.3);
      }
      
      .start-btn {
        margin-top: 15px; padding: 12px 40px;
        font-size: 18px; font-weight: 700;
        background: linear-gradient(135deg, #ffd700, #ff9500);
        color: #000; border: none; border-radius: 12px;
        cursor: pointer; text-transform: uppercase;
        letter-spacing: 2px; transition: all 0.2s;
        box-shadow: 0 4px 25px rgba(255,215,0,0.4);
      }
      .start-btn:hover { transform: scale(1.05); }
      .start-btn:active { transform: scale(0.98); }
      
      /* Orientation options */
      .orientation-options {
        display: flex; gap: 8px; justify-content: center;
      }
      .orientation-btn {
        padding: 10px 16px; border: 2px solid rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.1); color: #fff;
        border-radius: 8px; cursor: pointer;
        font-size: 11px; font-weight: 600;
        transition: all 0.2s; display: flex;
        flex-direction: column; align-items: center; gap: 4px;
      }
      .orientation-btn:hover { background: rgba(255,255,255,0.2); }
      .orientation-btn.selected {
        border-color: #4fc3f7; background: rgba(79,195,247,0.3);
      }
      .orientation-btn .icon { font-size: 20px; }
      
      /* Special skin badges */
      .skin-option .badge {
        position: absolute; top: -2px; right: -2px;
        font-size: 8px; background: #ffd700;
        border-radius: 50%; width: 12px; height: 12px;
        display: flex; align-items: center; justify-content: center;
      }
      .skin-option .shape.angel {
        background: linear-gradient(135deg, #fff, #e3f2fd);
        position: relative;
      }
      .skin-option .shape.angel::before,
      .skin-option .shape.angel::after {
        content: ''; position: absolute;
        width: 40%; height: 60%;
        background: rgba(255,255,255,0.8);
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        top: 20%;
      }
      .skin-option .shape.angel::before { left: -30%; transform: rotate(-20deg); }
      .skin-option .shape.angel::after { right: -30%; transform: rotate(20deg); }
      
      .skin-option .shape.golden {
        background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
        box-shadow: 0 0 15px rgba(255,215,0,0.8);
        animation: goldenShine 2s ease-in-out infinite;
      }
      @keyframes goldenShine {
        0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.8); }
        50% { box-shadow: 0 0 25px rgba(255,215,0,1), 0 0 40px rgba(255,140,0,0.5); }
      }
      
      .skin-option .shape.basketball {
        background: linear-gradient(135deg, #ff6600, #cc4400);
        position: relative;
      }
      .skin-option .shape.basketball::before {
        content: '🏀'; position: absolute;
        top: -12px; left: 50%; transform: translateX(-50%);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
      <h1>🎮 <span>BATTLELANDS</span> ROYALE</h1>
      
      <div class="start-section">
        <h3>🎨 Scegli la tua Skin</h3>
        <div class="skin-grid" id="skinGrid">
          <!-- Skins will be generated by JS -->
        </div>
      </div>
      
      <div class="start-section">
        <h3>📱 Orientamento</h3>
        <div class="orientation-options" id="orientationOptions">
          <button class="orientation-btn selected" data-orient="auto">
            <span class="icon">📱</span>
            <span>Auto</span>
          </button>
          <button class="orientation-btn" data-orient="portrait">
            <span class="icon">📲</span>
            <span>Verticale</span>
          </button>
          <button class="orientation-btn" data-orient="landscape">
            <span class="icon">📺</span>
            <span>Orizzontale</span>
          </button>
        </div>
      </div>
      
      <div class="start-section">
        <h3>📺 Risoluzione</h3>
        <div class="resolution-options" id="resolutionOptions">
          <button class="resolution-btn" data-res="0.5">Bassa</button>
          <button class="resolution-btn selected" data-res="1">Media</button>
          <button class="resolution-btn" data-res="1.5">Alta</button>
          <button class="resolution-btn" data-res="2">Ultra</button>
          <button class="resolution-btn" data-res="3">✨ Ultra Ultra</button>
        </div>
      </div>
      
      <button class="start-btn" id="startBtn">▶ GIOCA</button>
    </div>
    
    <div id="game"></div>
    
    <div class="status-bar">
      <div class="chip weapon" id="weaponChip">👊 Fists | ∞</div>
      <div class="chip hp" id="hp">❤️ 100</div>
      <div class="chip shield" id="shield">🛡️ 0</div>
      <div class="chip zone" id="zone">🔥 90s</div>
      <div class="chip" id="alive">👥 19</div>
    </div>
    
    <div class="minimap"><canvas id="minimap"></canvas></div>
    
    <div class="weapon-info" id="weaponInfo">
      <div class="name">Fists</div>
      <div class="stats">DMG: 15 | Range: 4</div>
    </div>
    <div class="weapon-slot">
      <div class="weapon-box active" id="weapon">👊</div>
    </div>
    
    <div class="pickup-indicator" id="pickupIndicator">
      <svg class="pickup-ring" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>
        <circle class="pickup-progress" id="pickupProgress" cx="50" cy="50" r="45" 
          fill="none" stroke="#00ff88" stroke-width="6"
          stroke-dasharray="283" stroke-dashoffset="283"
          stroke-linecap="round" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="pickup-label" id="pickupLabel">Raccogliendo...</div>
    </div>
    
    <div class="hud">
      <div class="stick" id="moveStick"><div class="knob" id="moveKnob"></div></div>
      <div style="display:flex; justify-content:flex-end;">
        <div class="stick" id="aimStick"><div class="knob" id="aimKnob"></div></div>
      </div>
    </div>
    
    <!-- Death Vignette Effect -->
    <div class="death-vignette" id="deathVignette"></div>
    
    <!-- Game Over Screen -->
    <div class="game-overlay game-over-screen" id="gameOverScreen">
      <h1>💀 GAME OVER</h1>
      <div class="subtitle" id="gameOverSubtitle">Sei stato eliminato!</div>
      <button class="retry-btn" onclick="location.reload()">🔄 RIPROVA</button>
    </div>
    
    <!-- Victory Screen -->
    <div class="game-overlay victory-screen" id="victoryScreen">
      <h1>🏆 HAI VINTO!</h1>
      <div class="subtitle">Sei l'ultimo sopravvissuto!</div>
      <button class="retry-btn" onclick="location.reload()">🎮 GIOCA ANCORA</button>
    </div>

    <script>
    (function() {
      // ===== REGISTER SERVICE WORKER FOR PWA =====
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Force update service worker
          navigator.serviceWorker.register('./battlelands_sw.js', { updateViaCache: 'none' })
            .then((registration) => {
              console.log('ServiceWorker registered:', registration.scope);
              // Check for updates
              registration.update();
            })
            .catch((err) => {
              console.log('ServiceWorker registration failed:', err);
            });
        });
      }
      
      // Check if Three.js loaded
      if (typeof THREE === 'undefined') {
        console.error('ERROR: Three.js not loaded!');
        return;
      }
      
      // ===== SKIN & SETTINGS =====
      const SKIN_COLORS = [
        0x2196f3, // Blue (default)
        0xe53935, // Red
        0x43a047, // Green
        0xfb8c00, // Orange
        0x8e24aa, // Purple
        0xffeb3b, // Yellow
        0x00bcd4, // Cyan
        0xff4081, // Pink
        0x6d4c41, // Brown
        0x607d8b, // Gray
        0x00e676, // Neon Green
        0xd500f9, // Neon Purple
      ];
      const SKIN_SHAPES = ['circle', 'square', 'star', 'diamond'];
      
      // Special skins (appended after normal skins)
      const SPECIAL_SKINS = [
        { name: 'Angel', color: 0xffffff, shape: 'angel', hasWings: true, badge: '😇' },
        { name: 'Golden', color: 0xffd700, shape: 'golden', isGolden: true, badge: '✨' },
        { name: 'Basketball', color: 0xff6600, shape: 'basketball', hasBasketballHat: true, badge: '🏀' },
      ];
      
      let selectedSkin = { color: SKIN_COLORS[0], shape: 'circle', index: 0, special: null };
      let selectedResolution = 1;
      let selectedOrientation = 'auto';
      
      // Generate skin options
      const skinGrid = document.getElementById('skinGrid');
      
      // Normal skins
      SKIN_COLORS.forEach((color, i) => {
        const shape = SKIN_SHAPES[i % SKIN_SHAPES.length];
        const div = document.createElement('div');
        div.className = 'skin-option' + (i === 0 ? ' selected' : '');
        div.dataset.index = i;
        div.dataset.color = color;
        div.dataset.shape = shape;
        div.style.background = `rgba(0,0,0,0.3)`;
        div.innerHTML = `<div class="shape ${shape}" style="background:#${color.toString(16).padStart(6,'0')}"></div>`;
        div.onclick = () => {
          document.querySelectorAll('.skin-option').forEach(s => s.classList.remove('selected'));
          div.classList.add('selected');
          selectedSkin = { color, shape, index: i, special: null };
        };
        skinGrid.appendChild(div);
      });
      
      // Special skins
      SPECIAL_SKINS.forEach((skin, i) => {
        const div = document.createElement('div');
        div.className = 'skin-option';
        div.dataset.index = SKIN_COLORS.length + i;
        div.dataset.special = skin.name;
        div.style.background = `rgba(0,0,0,0.3)`;
        div.innerHTML = `
          <div class="shape ${skin.shape}"></div>
          <div class="badge">${skin.badge}</div>
        `;
        div.onclick = () => {
          document.querySelectorAll('.skin-option').forEach(s => s.classList.remove('selected'));
          div.classList.add('selected');
          selectedSkin = { color: skin.color, shape: skin.shape, index: SKIN_COLORS.length + i, special: skin };
        };
        skinGrid.appendChild(div);
      });
      
      // Orientation options
      document.querySelectorAll('.orientation-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.orientation-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOrientation = btn.dataset.orient;
        };
      });
      
      // Resolution options
      document.querySelectorAll('.resolution-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.resolution-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedResolution = parseFloat(btn.dataset.res);
        };
      });
      
      // Start button
      const startScreen = document.getElementById('startScreen');
      document.getElementById('startBtn').onclick = () => {
        // Apply orientation lock if supported
        if (selectedOrientation !== 'auto' && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock(selectedOrientation === 'landscape' ? 'landscape-primary' : 'portrait-primary')
            .catch(e => console.log('Orientation lock not supported:', e));
        }
        startScreen.classList.add('hidden');
        initGame();
      };
      
      function initGame() {
      // ===== SETUP =====
      const container = document.getElementById('game');
      if (!container) {
        console.error('ERROR: #game container not found!');
        return;
      }
      
      const hpEl = document.getElementById('hp');
      const shieldEl = document.getElementById('shield');
      const zoneEl = document.getElementById('zone');
      const aliveEl = document.getElementById('alive');
      const weaponChipEl = document.getElementById('weaponChip');

        // Weight towards common weapons
        const weights = SPAWNABLE_WEAPONS.map(k => {
          const w = WEAPONS[k];
          if (w.rarity === 'legendary') return 1;
          if (w.rarity === 'epic') return 2;
          if (w.rarity === 'rare') return 4;
          return 8;

        const total = weights.reduce((a, b) => a + b, 0);
        let rand = Math.random() * total;
        for (let i = 0; i < weights.length; i++) {
          rand -= weights[i];
          if (rand <= 0) return SPAWNABLE_WEAPONS[i];
        }
        return SPAWNABLE_WEAPONS[0];

      }

      // Use selected skin color for player
      player.mesh = createCharacter(selectedSkin.color, true, selectedSkin.special);
      player.mesh.position.set(0, 1, 0);
      scene.add(player.mesh);

      // ===== FOOTPRINTS SYSTEM =====
      const footprints = [];
      const footprintGeo = new THREE.PlaneGeometry(0.4, 0.6);
      const footprintMat = new THREE.MeshBasicMaterial({ 
        color: 0x3d2817, 
        transparent: true, 
        opacity: 0.5,
        side: THREE.DoubleSide
      });
      
      function createFootprint(x, z, angle, isLeft) {
        const footprint = new THREE.Mesh(footprintGeo, footprintMat.clone());
        // Offset left/right foot
        const offsetX = isLeft ? -0.3 : 0.3;
        footprint.position.set(
          x + Math.cos(angle) * offsetX,
          1.02, // Just above ground
          z + Math.sin(angle) * offsetX
        );
        footprint.rotation.x = -Math.PI / 2;
        footprint.rotation.z = -angle + Math.PI / 2;
        scene.add(footprint);
        footprints.push({
          mesh: footprint,
          createdAt: performance.now(),
          lifetime: 1000 // 1 second
        });
      }
      
      function updateFootprints() {
        const now = performance.now();
        for (let i = footprints.length - 1; i >= 0; i--) {
          const fp = footprints[i];
          const age = now - fp.createdAt;
          if (age >= fp.lifetime) {
            scene.remove(fp.mesh);
            footprints.splice(i, 1);
          } else {
            // Fade out
            fp.mesh.material.opacity = 0.5 * (1 - age / fp.lifetime);
          }
        }
      }
      
      // Track footstep timing
      let playerFootstepTimer = 0;
      let playerLeftFoot = true;
      const enemyFootsteps = new Map(); // Track per-enemy

      // ===== ENEMIES =====
      const enemies = [];
      const enemyColors = [0xe53935, 0x8e24aa, 0x43a047, 0xfb8c00, 0x6d4c41];

      function spawnEnemy() {
        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * 40;  // Spawn più lontano per mappa grande
        const enemy = {
          x: Math.cos(angle) * dist,

        };
        enemy.mesh.position.set(enemy.x, 1, enemy.z);
        scene.add(enemy.mesh);
        enemies.push(enemy);
      }

      for (let i = 0; i < 18; i++) spawnEnemy();  // Molti più nemici per mappa enorme

      // ===== BULLETS (bigger, optimized) =====
      const bullets = [];
      const bulletGeo = new THREE.SphereGeometry(0.35, 4, 3); // Bigger bullet, less polygons
      const rocketGeo = new THREE.CylinderGeometry(0.2, 0.4, 0.8, 4); // Bigger rocket
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
      const enemyBulletMat = new THREE.MeshBasicMaterial({ color: 0xff5722 });
      const rocketMat = new THREE.MeshBasicMaterial({ color: 0xff6600 });

      // ===== AIM LINE (dotted trajectory) =====
      const aimLineDots = [];
      const aimDotGeo = new THREE.SphereGeometry(0.15, 6, 4);  // Leggermente più grande
      const aimDotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
      const MAX_AIM_DOTS = 15;
      
      for (let i = 0; i < MAX_AIM_DOTS; i++) {
        const dot = new THREE.Mesh(aimDotGeo, aimDotMat.clone());  // Clone material per opacity individuale
        dot.visible = false;
        dot.position.y = 2.0;  // Più alto per essere visibile sopra il terreno
        dot.renderOrder = 999;  // Render sopra altri oggetti
        scene.add(dot);
        aimLineDots.push(dot);
      }
      
      function updateAimLine() {
        const weapon = WEAPONS[player.weaponKey];
        const range = weapon.range;
        const showAim = aimInput.active && Math.hypot(aimInput.x, aimInput.y) > 0.3;
        
        for (let i = 0; i < MAX_AIM_DOTS; i++) {
          if (showAim) {
            const dist = (i + 1) * (range / MAX_AIM_DOTS);
            aimLineDots[i].position.x = player.x + Math.sin(player.angle) * dist;
            aimLineDots[i].position.z = player.z + Math.cos(player.angle) * dist;
            aimLineDots[i].position.y = 2.0;  // Mantieni altezza costante
            aimLineDots[i].visible = true;
            // Fade out dots at distance
            aimLineDots[i].material.opacity = 0.9 * (1 - i / MAX_AIM_DOTS);
          } else {
            aimLineDots[i].visible = false;
          }
        }
      }

      // ===== PUNCH EFFECT =====
      const punchEffects = [];
      const punchGeo = new THREE.SphereGeometry(0.6, 4, 3);
      const punchMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.8 });

      function doPunch() {
        const punchX = player.x + Math.sin(player.angle) * 2;
        const punchZ = player.z + Math.cos(player.angle) * 2;
        
        // Create punch effect
        const punchMesh = new THREE.Mesh(punchGeo, punchMat.clone());
        punchMesh.position.set(punchX, 1.5, punchZ);
        punchMesh.scale.set(0.3, 0.3, 0.3);
        scene.add(punchMesh);
        punchEffects.push({ mesh: punchMesh, life: 10, x: punchX, z: punchZ });
        
        // Check if punch hits enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (Math.hypot(punchX - e.x, punchZ - e.z) < WEAPONS.fists.range) {
            e.hp -= WEAPONS.fists.damage;
          }
        }
      }

      function shoot(x, z, angle, isEnemy = false, weaponKey = 'assaultRifle') {
        const weapon = WEAPONS[weaponKey] || WEAPONS.assaultRifle;
        const bulletsToShoot = weapon.bulletsPerShot || 1;
        
        for (let i = 0; i < bulletsToShoot; i++) {
          const spreadAngle = angle + (Math.random() - 0.5) * (weapon.spread || 0) * 2;
          const speed = weapon.bulletSpeed || 0.8;
          const damage = weapon.damage + Math.floor(Math.random() * ((weapon.damageMax || weapon.damage) - weapon.damage + 1));
          
          const isRocket = weapon.explosive;
          const geo = isRocket ? rocketGeo : bulletGeo;
          const mat = isEnemy ? enemyBulletMat : (isRocket ? rocketMat : bulletMat);
          
          const bullet = {
            x: x + Math.sin(spreadAngle) * 1,
            z: z + Math.cos(spreadAngle) * 1,
            vx: Math.sin(spreadAngle) * speed,
            vz: Math.cos(spreadAngle) * speed,
            life: Math.floor(weapon.range * 5),
            damage,
            isEnemy,
            explosive: weapon.explosive,
            mesh: new THREE.Mesh(geo, mat),
          };
          if (isRocket) {
            bullet.mesh.rotation.x = Math.PI / 2;
            bullet.mesh.rotation.z = -spreadAngle;
          }
          bullet.mesh.position.set(bullet.x, 1.5, bullet.z);
          scene.add(bullet.mesh);
          bullets.push(bullet);
        }
      }

      // ===== PICKUPS =====
      const pickups = [];
      const RARITY_COLORS = {
        common: 0xb0b0b0,
        rare: 0x4fc3f7,
        epic: 0xba68c8,
        legendary: 0xffd54f
      };

      // Create canvas texture for emoji icons
      function createEmojiTexture(emoji) {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, 32, 32);
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
      }

      function createPickup(x, z, pickupType, weaponKey = null) {
        const group = new THREE.Group();
        let color, emoji, type, value;

        if (pickupType === 'health') {
          color = 0x4caf50; emoji = '💊'; type = 'health'; value = 25;
        } else if (pickupType === 'shield') {
          color = 0x2196f3; emoji = '🛡️'; type = 'shield'; value = 25;
        } else if (pickupType === 'weapon' || weaponKey) {
          const wKey = weaponKey || getRandomWeapon();
          const weapon = WEAPONS[wKey];
          color = RARITY_COLORS[weapon.rarity] || weapon.color;
          emoji = weapon.emoji;
          type = 'weapon';
          value = wKey;
        }

        const baseGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 8);
        const baseMat = new THREE.MeshLambertMaterial({ color });
        const base = new THREE.Mesh(baseGeo, baseMat);
        group.add(base);

        const glowGeo = new THREE.RingGeometry(0.6, 0.9, 16);
        const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.rotation.x = -Math.PI / 2;
        glow.position.y = 0.15;
        group.add(glow);

        // Add floating emoji icon sprite
        const iconTexture = createEmojiTexture(emoji);
        const spriteMat = new THREE.SpriteMaterial({ map: iconTexture, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(1.5, 1.5, 1);
        sprite.position.y = 1.5;
        group.add(sprite);

        group.position.set(x, 1.2, z);
        scene.add(group);

        const pickupData = {
          x, z, type, emoji, value,
          mesh: group,
          bobPhase: Math.random() * Math.PI * 2,
        };
        if (type === 'weapon') {
          pickupData.weaponKey = value;
          pickupData.weaponName = WEAPONS[value].name;
          pickupData.rarity = WEAPONS[value].rarity;
        }
        pickups.push(pickupData);
      }

      // Spawn initial pickups - Molti più pickup per mappa enorme
      for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 5 + Math.random() * 60;  // Distanza maggiore
        const x = Math.cos(angle) * dist;
        const z = Math.sin(angle) * dist;
        const rand = Math.random();
        if (rand < 0.5) {
          // 50% weapons
          createPickup(x, z, 'weapon');
        } else if (rand < 0.75) {
          // 25% health
          createPickup(x, z, 'health');
        } else {
          // 25% shield
          createPickup(x, z, 'shield');
        }
      }

      // ===== PICKUP COLLECTION =====
      let currentPickup = null;
      let pickupTimer = 0;
      const PICKUP_TIME = 2; // seconds (ridotto da 3 a 2)

      // ===== INPUT =====
      const moveInput = { x: 0, y: 0, active: false };
      const aimInput = { x: 0, y: 0, active: false };

      function setupStick(stick, knob, input) {
        let pointerId = null;
        const rectCache = { left: 0, top: 0, size: 0 };

        function updateRect() {
          const rect = stick.getBoundingClientRect();
          rectCache.left = rect.left;
          rectCache.top = rect.top;
          rectCache.size = rect.width;
        }

        updateRect();
        window.addEventListener('resize', updateRect);

        stick.addEventListener('pointerdown', (e) => {
          if (pointerId !== null) return;
          pointerId = e.pointerId;
          stick.setPointerCapture(pointerId);
          input.active = true;
          updateRect(); // Update rect on every touch to handle orientation changes
          updateStick(e);
        });

        stick.addEventListener('pointermove', (e) => {
          if (e.pointerId !== pointerId) return;
          updateRect(); // Continuous update for accuracy
          updateStick(e);
        });

        const endHandler = (e) => {
          if (e.pointerId !== pointerId) return;
          pointerId = null;
          input.active = false;
          input.x = 0;
          input.y = 0;
          knob.style.transform = 'translate(-50%, -50%)';
        };

        stick.addEventListener('pointerup', endHandler);
        stick.addEventListener('pointercancel', endHandler);

        function updateStick(e) {
          const size = rectCache.size;
          const centerX = rectCache.left + size / 2;
          const centerY = rectCache.top + size / 2;
          const dx = e.clientX - centerX;
          const dy = e.clientY - centerY;
          const max = size / 2;
          const dist = Math.hypot(dx, dy);
          const clamped = Math.min(dist, max);
          const angle = Math.atan2(dy, dx);
          input.x = Math.cos(angle) * (clamped / max);
          input.y = Math.sin(angle) * (clamped / max);
          knob.style.transform = `translate(calc(-50% + ${input.x * max}px), calc(-50% + ${input.y * max}px))`;
        }
      }

      setupStick(document.getElementById('moveStick'), document.getElementById('moveKnob'), moveInput);
      setupStick(document.getElementById('aimStick'), document.getElementById('aimKnob'), aimInput);

      // ===== UTILITY =====
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      // Returns collision info with push direction for smooth sliding
      function checkCollisionWithPush(x, z, radius) {
        let pushX = 0, pushZ = 0;
        let collided = false;
        
        // Building walls
        for (const b of buildings) {
          for (const wall of b.walls) {
            const minX = Math.min(wall.x1, wall.x2) - radius;
            const maxX = Math.max(wall.x1, wall.x2) + radius;
            const minZ = Math.min(wall.z1, wall.z2) - radius;
            const maxZ = Math.max(wall.z1, wall.z2) + radius;
            
            if (x > minX && x < maxX && z > minZ && z < maxZ) {
              collided = true;
              // Calculate push direction
              const wallCenterX = (wall.x1 + wall.x2) / 2;
              const wallCenterZ = (wall.z1 + wall.z2) / 2;
              const wallWidth = Math.abs(wall.x2 - wall.x1);
              const wallDepth = Math.abs(wall.z2 - wall.z1);
              
              // Push perpendicular to wall
              if (wallWidth > wallDepth) {
                // Horizontal wall - push in Z
                pushZ += (z > wallCenterZ) ? (maxZ - z + 0.1) : (minZ - z - 0.1);
              } else {
                // Vertical wall - push in X
                pushX += (x > wallCenterX) ? (maxX - x + 0.1) : (minX - x - 0.1);
              }
            }
          }
        }
        // Trees
        for (const t of trees) {
          const dist = Math.hypot(x - t.x, z - t.z);
          const minDist = t.radius + radius;
          if (dist < minDist) {
            collided = true;
            const pushDist = minDist - dist + 0.1;
            const angle = Math.atan2(z - t.z, x - t.x);
            pushX += Math.cos(angle) * pushDist;
            pushZ += Math.sin(angle) * pushDist;
          }
        }
        return { collided, pushX, pushZ };
      }

      function checkCollision(x, z, radius) {
        // Building walls
        if (checkWallCollision(x, z, radius)) return true;
        // Trees
        for (const t of trees) {
          if (Math.hypot(x - t.x, z - t.z) < t.radius + radius) return true;
        }
        return false;
      }
      
      // Check if a point collides with obstacles (for bullets)
      function checkBulletCollision(x, z) {
        // Building walls
        if (checkBulletWallCollision(x, z)) return true;
        // Trees (thinner hit for bullets)
        for (const t of trees) {
          if (Math.hypot(x - t.x, z - t.z) < t.radius * 0.5) return true;
        }
        return false;
      }

      // ===== GAME LOOP =====
      let lastTime = performance.now();
      let gameTime = 0;

      function update(dt) {
        gameTime += dt;

        // Update zone
        if (zone.timeToShrink > 0) {
          zone.timeToShrink -= dt;
        } else if (zone.currentRadius > zone.targetRadius) {
          zone.currentRadius -= zone.shrinkSpeed;
          zone.currentX += (zone.targetX - zone.currentX) * 0.001;
          zone.currentZ += (zone.targetZ - zone.currentZ) * 0.001;
        }
        updateZoneVisual();
        
        // Update footprints (fade and remove old ones)
        updateFootprints();

        // Player movement with smooth sliding
        const inputLen = Math.hypot(moveInput.x, moveInput.y);
        if (inputLen > 0.1) {
          // INVERTED Y axis for movement stick (removed negative sign)
          const moveAngle = Math.atan2(moveInput.x, moveInput.y);
          let newX = player.x + Math.sin(moveAngle) * player.speed;
          let newZ = player.z + Math.cos(moveAngle) * player.speed;

          // Check boundaries (island)
          const distFromCenter = Math.hypot(newX, newZ);
          if (distFromCenter < WORLD_SIZE / 2 - 2) {
            const collision = checkCollisionWithPush(newX, newZ, 0.6);
            if (collision.collided) {
              // Apply push to slide along obstacles
              newX += collision.pushX;
              newZ += collision.pushZ;
              // Verify new position is valid
              if (checkCollision(newX, newZ, 0.5)) {
                // Still colliding, try moving only on one axis
                const axisX = player.x + Math.sin(moveAngle) * player.speed;
                const axisZ = player.z + Math.cos(moveAngle) * player.speed;
                if (!checkCollision(axisX, player.z, 0.5)) {
                  newX = axisX;
                  newZ = player.z;
                } else if (!checkCollision(player.x, axisZ, 0.5)) {
                  newX = player.x;
                  newZ = axisZ;
                } else {
                  newX = player.x;
                  newZ = player.z;
                }
              }
            }
            player.x = newX;
            player.z = newZ;
            
            // Create player footprints
            playerFootstepTimer += dt;
            if (playerFootstepTimer >= 0.2) { // Every 0.2 seconds while moving
              createFootprint(player.x, player.z, player.angle, playerLeftFoot);
              playerLeftFoot = !playerLeftFoot;
              playerFootstepTimer = 0;
            }
          }
        }

        // Player aiming & shooting
        if (aimInput.active && Math.hypot(aimInput.x, aimInput.y) > 0.3) {
          // INVERTED Y axis for aim stick (same as movement)
          player.angle = Math.atan2(aimInput.x, aimInput.y);
          
          // Incrementa il timer di mira
          player.aimTimer += dt;
          
          // Spara solo dopo 0.5 secondi di mira
          const AIM_DELAY = 0.5;
          if (player.aimTimer >= AIM_DELAY) {
            const weapon = WEAPONS[player.weaponKey];
            if (player.shootCooldown <= 0 && player.ammo > 0) {
              if (player.weaponKey === 'fists') {
                // Punch animation instead of bullet
                doPunch();
              } else {
                shoot(player.x, player.z, player.angle, false, player.weaponKey);
                if (player.ammo !== Infinity) {
                  player.ammo--;
                  updateWeaponUI();
                }
              }
              player.shootCooldown = weapon.fireRate / 16; // Convert ms to frames
            }
          }
        } else {
          // Reset aim timer quando si smette di mirare
          player.aimTimer = 0;
        }
        if (player.shootCooldown > 0) player.shootCooldown--;

        // Update player mesh
        player.mesh.position.set(player.x, 1, player.z);
        player.mesh.rotation.y = player.angle;
        
        // Check if player is inside a building and toggle roof visibility
        const insideBuilding = isInsideBuilding(player.x, player.z);
        for (const b of buildings) {
          if (b.roof) {
            const playerInside = (insideBuilding === b);
            // Hide roof if player is inside this building
            b.roof.visible = !playerInside;
            // Track previous state to avoid unnecessary updates
            if (b.playerWasInside !== playerInside) {
              b.playerWasInside = playerInside;
              // Make walls semi-transparent when inside for better visibility
              b.group.children.forEach(child => {
                if (child !== b.roof && child.material && child !== b.group.children.find(c => c.geometry && c.geometry.type === 'PlaneGeometry')) {
                  if (playerInside) {
                    child.material = child.material.clone();
                    child.material.transparent = true;
                    child.material.opacity = 0.4;
                  } else {
                    child.material = buildingMaterial;
                  }
                }
              });
            }
          }
        }

        // Zone damage
        const playerDistFromZone = Math.hypot(player.x - zone.currentX, player.z - zone.currentZ);
        if (playerDistFromZone > zone.currentRadius) {
          if (player.shield > 0) {
            player.shield = Math.max(0, player.shield - zone.damage * dt);
          } else {
            player.hp = Math.max(0, player.hp - zone.damage * dt);
          }
        }

        // Pickup detection
        let nearPickup = null;
        for (const p of pickups) {
          const dist = Math.hypot(player.x - p.x, player.z - p.z);
          if (dist < 1.5) {
            nearPickup = p;
            break;
          }
          // Bobbing animation
          p.mesh.position.y = 1.2 + Math.sin(gameTime * 3 + p.bobPhase) * 0.15;
          p.mesh.rotation.y += dt * 2;
        }

        if (nearPickup) {
          if (currentPickup === nearPickup) {
            pickupTimer += dt;
            const progress = Math.min(pickupTimer / PICKUP_TIME, 1);
            pickupProgress.style.strokeDashoffset = 283 * (1 - progress);
            
            if (pickupTimer >= PICKUP_TIME) {
              // Collect pickup
              if (nearPickup.type === 'health') {
                player.hp = Math.min(100, player.hp + nearPickup.value);
              } else if (nearPickup.type === 'shield') {
                player.shield = Math.min(100, player.shield + nearPickup.value);
              } else if (nearPickup.type === 'weapon') {
                // Drop current weapon if not fists
                if (player.weaponKey !== 'fists') {
                  createPickup(player.x + (Math.random() - 0.5) * 2, player.z + (Math.random() - 0.5) * 2, 'weapon', player.weaponKey);
                }
                player.weaponKey = nearPickup.weaponKey;
                player.ammo = WEAPONS[player.weaponKey].ammo;
                updateWeaponUI();
              }
              scene.remove(nearPickup.mesh);
              pickups.splice(pickups.indexOf(nearPickup), 1);
              currentPickup = null;
              pickupTimer = 0;
              pickupIndicator.classList.remove('active');
            }
          } else {
            currentPickup = nearPickup;
            pickupTimer = 0;
            if (nearPickup.type === 'weapon') {
              const rarityText = nearPickup.rarity.toUpperCase();
              pickupLabel.innerHTML = `<span class="rarity-${nearPickup.rarity}">${nearPickup.weaponName}</span><br><small>${rarityText}</small>`;
            } else {
              pickupLabel.textContent = nearPickup.emoji + ' Raccogliendo...';
            }
            pickupIndicator.classList.add('active');
          }
        } else {
          currentPickup = null;
          pickupTimer = 0;
          pickupIndicator.classList.remove('active');
          pickupProgress.style.strokeDashoffset = 283;
        }

        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          const distToPlayer = Math.hypot(e.x - player.x, e.z - player.z);
          
          // Zone damage for enemies
          const enemyDistFromZone = Math.hypot(e.x - zone.currentX, e.z - zone.currentZ);
          if (enemyDistFromZone > zone.currentRadius) {
            e.hp -= zone.damage * dt * 2;
          }

          // Find nearest weapon pickup if unarmed
          let nearestWeaponDist = Infinity;
          let nearestWeapon = null;
          if (e.weaponKey === 'fists') {
            for (const p of pickups) {
              if (p.type === 'weapon') {
                const d = Math.hypot(e.x - p.x, e.z - p.z);
                if (d < nearestWeaponDist) {
                  nearestWeaponDist = d;
                  nearestWeapon = p;
                }
              }
            }
          }
          
          // Find nearest target (player or other enemy)
          let nearestTargetDist = distToPlayer;
          let targetX = player.x;
          let targetZ = player.z;
          let targetIsPlayer = true;
          
          // Check other enemies as potential targets
          for (let j = 0; j < enemies.length; j++) {
            if (i !== j) {
              const other = enemies[j];
              const d = Math.hypot(e.x - other.x, e.z - other.z);
              if (d < nearestTargetDist && d < 20) {
                // 30% chance to target another enemy instead of player
                if (Math.random() < 0.3 || distToPlayer > 25) {
                  nearestTargetDist = d;
                  targetX = other.x;
                  targetZ = other.z;
                  targetIsPlayer = false;
                }
              }
            }
          }

          // AI State Machine
          if (e.weaponKey === 'fists' && nearestWeapon) {
            // UNARMED: Search for weapons
            e.state = 'searchWeapon';
            const angleToWeapon = Math.atan2(nearestWeapon.x - e.x, nearestWeapon.z - e.z);
            e.angle = angleToWeapon;
            
            const newX = e.x + Math.sin(e.angle) * e.speed * 1.2; // Move faster when searching
            const newZ = e.z + Math.cos(e.angle) * e.speed * 1.2;
            if (!checkCollision(newX, newZ, 0.5)) {
              e.x = newX;
              e.z = newZ;
            }
            
            // Check if close enough to pick up weapon
            if (nearestWeaponDist < 1.5) {
              e.weaponKey = nearestWeapon.weaponKey;
              e.ammo = WEAPONS[e.weaponKey].ammo;
              scene.remove(nearestWeapon.mesh);
              pickups.splice(pickups.indexOf(nearestWeapon), 1);
              e.state = 'combat';
            }
          } else if (e.weaponKey !== 'fists' && nearestTargetDist < 25) {
            // ARMED: Combat mode - chase and shoot
            e.state = 'combat';
            const angleToTarget = Math.atan2(targetX - e.x, targetZ - e.z);
            e.angle = angleToTarget;
            
            if (nearestTargetDist > 8) {
              const newX = e.x + Math.sin(e.angle) * e.speed;
              const newZ = e.z + Math.cos(e.angle) * e.speed;
              if (!checkCollision(newX, newZ, 0.5)) {
                e.x = newX;
                e.z = newZ;
              }
            }
            
            // Shoot at target
            if (e.shootCooldown <= 0 && nearestTargetDist < 20 && e.ammo > 0) {
              shoot(e.x, e.z, e.angle, true, e.weaponKey);
              if (e.ammo !== Infinity) e.ammo--;
              const weapon = WEAPONS[e.weaponKey];
              e.shootCooldown = (weapon.fireRate / 16) + Math.random() * 10;
            }
          } else {
            // WANDER: No weapon nearby and no target in range
            e.state = 'wander';
            if (Math.random() < 0.01) {
              e.angle = Math.random() * Math.PI * 2;
            }
            const newX = e.x + Math.sin(e.angle) * e.speed * 0.5;
            const newZ = e.z + Math.cos(e.angle) * e.speed * 0.5;
            const distFromCenter = Math.hypot(newX, newZ);
            if (distFromCenter < WORLD_SIZE / 2 - 3 && !checkCollision(newX, newZ, 0.5)) {
              e.x = newX;
              e.z = newZ;
            } else {
              e.angle += Math.PI;
            }
          }

          if (e.shootCooldown > 0) e.shootCooldown--;
          e.mesh.position.set(e.x, 1, e.z);
          e.mesh.rotation.y = e.angle;
          
          // Create enemy footprints
          if (!enemyFootsteps.has(i)) {
            enemyFootsteps.set(i, { timer: 0, leftFoot: true, lastX: e.x, lastZ: e.z });
          }
          const efs = enemyFootsteps.get(i);
          const enemyMoved = Math.hypot(e.x - efs.lastX, e.z - efs.lastZ) > 0.1;
          if (enemyMoved) {
            efs.timer += dt;
            if (efs.timer >= 0.25) { // Every 0.25 seconds while moving
              createFootprint(e.x, e.z, e.angle, efs.leftFoot);
              efs.leftFoot = !efs.leftFoot;
              efs.timer = 0;
            }
            efs.lastX = e.x;
            efs.lastZ = e.z;
          }

          // Check if dead
          if (e.hp <= 0) {
            scene.remove(e.mesh);
            enemyFootsteps.delete(i); // Clean up footstep tracking
            enemies.splice(i, 1);
            // Drop weapon if armed
            if (e.weaponKey !== 'fists') {
              createPickup(e.x, e.z, 'weapon', e.weaponKey);
            }
            // Additional drops
            const dropRand = Math.random();
            if (dropRand < 0.3) {
              createPickup(e.x + 1, e.z, 'health');
            } else if (dropRand < 0.5) {
              createPickup(e.x - 1, e.z, 'shield');
            }
          }
        }

        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx;
          b.z += b.vz;
          b.life--;
          b.mesh.position.set(b.x, 1.5, b.z);

          let removed = false;
          
          // Check collision with walls and obstacles
          if (checkBulletCollision(b.x, b.z)) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            removed = true;
            continue;
          }

          // Check collisions with enemies (from player bullets)
          if (!b.isEnemy) {
            let hitAny = false;
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              const hitRadius = b.explosive ? 3 : 1;
              if (Math.hypot(b.x - e.x, b.z - e.z) < hitRadius) {
                e.hp -= b.damage;
                hitAny = true;
                if (!b.explosive) {
                  scene.remove(b.mesh);
                  bullets.splice(i, 1);
                  removed = true;
                  break;
                }
              }
            }
            if (!removed && b.explosive && hitAny) {
              scene.remove(b.mesh);
              bullets.splice(i, 1);
              removed = true;
            }
          } else {
            // Enemy bullets can hit player AND other enemies
            // Check player
            if (Math.hypot(b.x - player.x, b.z - player.z) < 1) {
              const dmg = b.damage || 10;
              if (player.shield > 0) {
                player.shield = Math.max(0, player.shield - dmg);
              } else {
                player.hp = Math.max(0, player.hp - dmg);
              }
              scene.remove(b.mesh);
              bullets.splice(i, 1);
              removed = true;
            }
            
            // Check other enemies (friendly fire)
            if (!removed) {
              for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (Math.hypot(b.x - e.x, b.z - e.z) < 1) {
                  e.hp -= b.damage || 10;
                  scene.remove(b.mesh);
                  bullets.splice(i, 1);
                  removed = true;
                  break;
                }
              }
            }
          }

          if (!removed && (b.life <= 0 || Math.hypot(b.x, b.z) > WORLD_SIZE)) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }

        // Update punch effects
        for (let i = punchEffects.length - 1; i >= 0; i--) {
          const p = punchEffects[i];
          p.life--;
          p.mesh.scale.multiplyScalar(1.15);
          p.mesh.material.opacity *= 0.85;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            punchEffects.splice(i, 1);
          }
        }

        // Update aim line (dotted trajectory)
        updateAimLine();

        // Camera follow (ZOOMED OUT)
        camera.position.x = player.x;
        camera.position.z = player.z + 32;
        camera.position.y = 45;
        camera.lookAt(player.x, 0, player.z);

        // Update HUD
        hpEl.textContent = `❤️ ${Math.round(player.hp)}`;
        shieldEl.textContent = `🛡️ ${Math.round(player.shield)}`;
        zoneEl.textContent = `🔥 ${Math.max(0, Math.round(zone.timeToShrink))}s`;
        aliveEl.textContent = `👥 ${enemies.length + 1}`;

        // Update minimap
        minimapCtx.fillStyle = '#1a3a5c';
        minimapCtx.fillRect(0, 0, 100, 100);
        
        // Draw island
        minimapCtx.fillStyle = '#7cb342';
        minimapCtx.beginPath();
        minimapCtx.arc(50, 50, 40, 0, Math.PI * 2);
        minimapCtx.fill();
        
        // Draw roads on minimap
        const mapScale = 40 / (WORLD_SIZE / 2);
        minimapCtx.strokeStyle = '#546e7a';
        minimapCtx.lineWidth = 1.5;
        // Horizontal roads
        [-60, -20, 20, 60].forEach(z => {
          minimapCtx.beginPath();
          minimapCtx.moveTo(50 - 38, 50 + z * mapScale);
          minimapCtx.lineTo(50 + 38, 50 + z * mapScale);
          minimapCtx.stroke();
        });
        // Vertical roads
        [-60, -20, 20, 60].forEach(x => {
          minimapCtx.beginPath();
          minimapCtx.moveTo(50 + x * mapScale, 50 - 38);
          minimapCtx.lineTo(50 + x * mapScale, 50 + 38);
          minimapCtx.stroke();
        });
        
        // Draw buildings on minimap
        minimapCtx.fillStyle = '#9e9e9e';
        for (const b of buildings) {
          const bx = 50 + b.x * mapScale;
          const bz = 50 + b.z * mapScale;
          const bw = Math.max(2, b.w * mapScale * 0.5);
          const bd = Math.max(2, b.d * mapScale * 0.5);
          minimapCtx.fillRect(bx - bw/2, bz - bd/2, bw, bd);
        }
        
        // Draw zone
        minimapCtx.strokeStyle = '#ff4400';
        minimapCtx.lineWidth = 2;
        minimapCtx.beginPath();
        const zoneScale = 40 / (WORLD_SIZE / 2);
        minimapCtx.arc(
          50 + zone.currentX * zoneScale,
          50 + zone.currentZ * zoneScale,
          zone.currentRadius * zoneScale,
          0, Math.PI * 2
        );
        minimapCtx.stroke();
        
        // Draw enemies
        minimapCtx.fillStyle = '#ff4444';
        for (const e of enemies) {
          const mx = 50 + (e.x / (WORLD_SIZE / 2)) * 40;
          const mz = 50 + (e.z / (WORLD_SIZE / 2)) * 40;
          minimapCtx.beginPath();
          minimapCtx.arc(mx, mz, 2, 0, Math.PI * 2);
          minimapCtx.fill();
        }
        
        // Draw player
        minimapCtx.fillStyle = '#2196f3';
        const px = 50 + (player.x / (WORLD_SIZE / 2)) * 40;
        const pz = 50 + (player.z / (WORLD_SIZE / 2)) * 40;
        minimapCtx.beginPath();
        minimapCtx.arc(px, pz, 4, 0, Math.PI * 2);
        minimapCtx.fill();
      }

      let frames = 0;
      let renderStats = { updateTime: 0, renderTime: 0, lastLog: 0 };
      let gameState = 'playing'; // 'playing', 'gameover', 'victory'
      
      // Game Over / Victory screen references
      const gameOverScreen = document.getElementById('gameOverScreen');
      const victoryScreen = document.getElementById('victoryScreen');
      const deathVignette = document.getElementById('deathVignette');
      const gameOverSubtitle = document.getElementById('gameOverSubtitle');
      
      // Create confetti for victory
      function createConfetti() {
        const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ff69b4'];
        for (let i = 0; i < 100; i++) {
          setTimeout(() => {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
            confetti.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4000);
          }, i * 30);
        }
      }
      
      function showGameOver(killedBy = null) {
        if (gameState !== 'playing') return;
        gameState = 'gameover';
        
        // Screen shake
        document.body.classList.add('shaking');
        setTimeout(() => document.body.classList.remove('shaking'), 500);
        
        // Death vignette
        deathVignette.classList.add('active');
        
        // Update subtitle
        if (killedBy) {
          gameOverSubtitle.textContent = `Eliminato da ${killedBy}!`;
        } else {
          gameOverSubtitle.textContent = 'Sei stato eliminato!';
        }
        
        // Show game over screen after short delay
        setTimeout(() => {
          gameOverScreen.classList.add('active');
        }, 500);
        
        console.log('💀 GAME OVER');
      }
      
      function showVictory() {
        if (gameState !== 'playing') return;
        gameState = 'victory';
        
        // Create confetti explosion
        createConfetti();
        
        // Show victory screen
        setTimeout(() => {
          victoryScreen.classList.add('active');
        }, 300);
        
        console.log('🏆 VICTORY!');
      }
      
      // Check game end conditions
      function checkGameEnd() {
        // Check for death
        if (player.hp <= 0 && gameState === 'playing') {
          showGameOver();
          return;
        }
        
        // Check for victory (all enemies dead)
        if (enemies.length === 0 && gameState === 'playing') {
          showVictory();
          return;
        }
      }
      
      function animate(time) {
        requestAnimationFrame(animate);
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;
        frames++;

        // Log every second with detailed stats
        if (frames % 60 === 0) {
          const memInfo = renderer.info.memory;
          const renderInfo = renderer.info.render;
          console.log(`[Frame ${frames}] Time: ${Math.round(time/1000)}s | ` +
            `Objects: ${scene.children.length} | ` + 
            `Bullets: ${bullets.length} | ` +
            `Enemies: ${enemies.length} | ` +
            `Pickups: ${pickups.length} | ` +
            `Punches: ${punchEffects.length} | ` +
            `Geometries: ${memInfo.geometries} | ` +
            `Textures: ${memInfo.textures} | ` +
            `DrawCalls: ${renderInfo.calls} | ` +
            `Triangles: ${renderInfo.triangles}`);
        }

        try {
          const updateStart = performance.now();
          if (gameState === 'playing' && player.hp > 0) {
            update(dt);
            checkGameEnd(); // Controlla vittoria/sconfitta
          } else if (gameState === 'playing') {
            // Player just died
            checkGameEnd();
          }
          renderStats.updateTime = performance.now() - updateStart;
          
          const renderStart = performance.now();
          renderer.render(scene, camera);
          renderStats.renderTime = performance.now() - renderStart;
          
          // Warn if frame takes too long
          if (renderStats.updateTime + renderStats.renderTime > 32) {
            console.warn(`[SLOW FRAME ${frames}] Update: ${renderStats.updateTime.toFixed(1)}ms, Render: ${renderStats.renderTime.toFixed(1)}ms`);
          }
        } catch (e) {
          console.error('CRASH at frame', frames, e);
          console.error('Stack:', e.stack);
        }
      }

      // Handle resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // Adjust camera position based on new orientation
        const isLandscape = window.innerWidth > window.innerHeight;
        if (isLandscape) {
          camera.position.set(0, 35, 22);
        } else {
          camera.position.set(0, 45, 32);
        }
        camera.lookAt(0, 0, 0);
      });

      animate(performance.now());
      
      console.log('🎮 Game started!');
      console.log('🌍 Scene children:', scene.children.length);
      console.log('👤 Player initial pos:', player.x, player.z);
      console.log('📷 Camera pos:', camera.position);
      console.log('🏝️ Island at y=0, radius=', WORLD_SIZE/2);
      
      } catch (error) {
        console.error('❌ Game initialization error:', error);
      }
      } // End of initGame function
    })();
    </script>
  </body>
</html>
