<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dittopia">
<meta name="theme-color" content="#f3e3c3">
<meta name="description" content="Dittopia — cozy pixel-art world building tributo a Pokémon Pokopia.">
<title>Dittopia — Cozy Edition</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <span id="clock" class="chip">08:00 ☀</span>
  <span id="objective" class="chip objective"></span>
  <span id="weatherTag" class="chip"></span>
  <div id="inv" class="inventory"></div>
</div>
<div id="hotbar"></div>
<div id="tip" data-i18n="controls">WASD/Frecce muovi · E interagisci · 1-9 mosse · C craft · T Pokédex · J diario · M mappa · P menu</div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="dialogue">
  <div class="dialog-box">
    <div id="dName"></div>
    <div id="dText"></div>
    <div id="dPrompt">▼</div>
  </div>
</div>

<div id="menu" class="screen"></div>
<div id="craft" class="screen"></div>
<div id="dex" class="screen"></div>
<div id="journal" class="screen"></div>
<div id="map" class="screen">
  <div class="panel"><div class="panel-title">🗺️ <span data-i18n="map">MAPPA</span></div>
    <canvas id="mapCanvas" width="320" height="320"></canvas></div>
</div>
<div id="photo" class="screen">
  <div class="panel"><div class="panel-title">📷 <span data-i18n="photo">FOTO</span></div>
    <img id="photoImg" alt="Dittopia snapshot"></div>
</div>

<div id="flute" class="screen">
  <div class="panel">
    <div class="panel-title">🎵 POKé FLAUTO</div>
    <p class="muted">Sequenza</p><div id="fluteSeq" class="note-box"></div>
    <p class="muted">Tuoi tasti</p><div id="fluteIn" class="note-box"></div>
    <div class="note-buttons">
      <button type="button" data-n="0">1 · Do</button><button type="button" data-n="1">2 · Re</button>
      <button type="button" data-n="2">3 · Mi</button><button type="button" data-n="3">4 · Fa</button>
      <button type="button" data-n="4">5 · Sol</button><button type="button" data-n="5">6 · La</button>
    </div>
    <p id="fluteMsg" class="muted"></p>
  </div>
</div>

<div id="touch">
  <div id="touchpad"></div>
  <div id="touchBtns">
    <button id="btnA" type="button" class="tbtn">A<small>E</small></button>
    <button id="btnB" type="button" class="tbtn alt">B<small>menu</small></button>
  </div>
</div>

<div id="title" class="overlay"></div>
<div id="customize" class="overlay"></div>

<script type="module" src="js/main.js"></script>
<script src="../../top_buttons.js"></script>
</body>
</html>
