<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#0a1628">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<title data-i18n="games.backgammon.title">Backgammon - Luca Gandolfi</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-900: #0a1628;
			--bg-800: #16263f;
			--accent: #00d4ff;
			--gold: #ffd54a;
			--wood1: #7a4a26;
			--wood2: #4a2a12;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
		body {
			font-family: 'Inter', sans-serif;
			background: linear-gradient(160deg, var(--bg-900), var(--bg-800));
			color: #fff;
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: var(--site-top-bar-height, 0px);
			padding-bottom: env(safe-area-inset-bottom, 0px);
			user-select: none;
			-webkit-user-select: none;
		}
		.header { padding: 14px 20px 4px; text-align: center; width: 100%; max-width: 620px; }
		h1 { margin: 0; color: var(--accent); font-size: clamp(20px, 6vw, 30px); letter-spacing: .04em; }
		.header p { color: #8fa6c3; font-size: 13px; margin-top: 4px; }

		.game-area {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
			width: 100%;
			max-width: 620px;
			padding: 10px 12px 20px;
		}

		.status-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			width: 100%;
			background: rgba(255,255,255,.06);
			border: 1px solid rgba(255,255,255,.1);
			padding: 10px 14px;
			border-radius: 14px;
			backdrop-filter: blur(8px);
		}
		#turn-chip {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			font-weight: 800;
			font-size: 14px;
			letter-spacing: .02em;
		}
		.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
		.dot.w { background: radial-gradient(circle at 35% 30%, #fff, #c3c9d4); }
		.dot.b { background: radial-gradient(circle at 35% 30%, #555, #0a0a0c); }

		.dice-box { display: flex; gap: 8px; align-items: center; }
		.die {
			width: 44px;
			height: 44px;
			background: linear-gradient(145deg, #ffffff, #e6e9ef);
			border-radius: 10px;
			box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 -2px 4px rgba(0,0,0,.12);
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			grid-template-rows: repeat(3, 1fr);
			padding: 7px;
			transition: transform .15s;
		}
		.die.rolling { animation: shake .12s infinite; }
		@keyframes shake { 0%,100% { transform: rotate(0); } 50% { transform: rotate(8deg) scale(1.06); } }
		.die .pip { background: #1a1a22; border-radius: 50%; align-self: center; justify-self: center; width: 78%; height: 78%; }

		.board-wrap { position: relative; width: 100%; }
		#board {
			display: block;
			width: 100%;
			aspect-ratio: 128 / 100;
			touch-action: none;
			cursor: pointer;
		}

		.controls {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			justify-content: center;
			align-items: center;
			width: 100%;
			margin-top: 2px;
		}
		.btn {
			min-height: 46px;
			padding: 12px 22px;
			border: none;
			border-radius: 12px;
			font-weight: 800;
			font-size: 15px;
			font-family: inherit;
			cursor: pointer;
			transition: transform .12s, filter .15s;
		}
		.btn:active { transform: scale(.95); }
		.btn:disabled { opacity: .45; cursor: not-allowed; }
		.btn-primary { background: linear-gradient(92deg, var(--accent), #38e0ff); color: #04121f; box-shadow: 0 6px 18px rgba(0,212,255,.3); }
		.btn-ghost { background: rgba(255,255,255,.1); color: #eaf3ff; border: 1px solid rgba(255,255,255,.18); }
		.btn-danger { background: rgba(255,90,110,.9); color: #fff; }
		select {
			min-height: 46px;
			padding: 10px 14px;
			border-radius: 12px;
			border: 1px solid rgba(255,255,255,.2);
			background: rgba(255,255,255,.08);
			color: #fff;
			font-family: inherit;
			font-weight: 700;
			font-size: 14px;
		}
		select option { background: var(--bg-800); color: #fff; }

		#toast {
			position: fixed;
			left: 50%;
			top: calc(var(--site-top-bar-height, 0px) + 70px);
			transform: translateX(-50%);
			background: rgba(8,16,30,.92);
			border: 1px solid rgba(0,212,255,.5);
			color: #fff;
			padding: 11px 20px;
			border-radius: 99px;
			font-size: 14px;
			font-weight: 700;
			z-index: 300;
			opacity: 0;
			transition: opacity .3s;
			pointer-events: none;
			white-space: nowrap;
			max-width: 92vw;
		}
		#toast.show { opacity: 1; }

		#win-overlay {
			position: fixed;
			inset: 0;
			z-index: 400;
			background: rgba(4,10,22,.78);
			backdrop-filter: blur(6px);
			display: none;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 24px;
		}
		#win-overlay.show { display: flex; }
		#win-card {
			background: linear-gradient(160deg, #12233f, #0a1628);
			border: 1px solid rgba(0,212,255,.4);
			border-radius: 22px;
			padding: 34px 30px;
			max-width: 380px;
			width: 100%;
			box-shadow: 0 24px 70px rgba(0,0,0,.6);
		}
		#win-card h2 { font-size: 30px; margin-bottom: 10px; color: var(--gold); }
		#win-card p { color: #a9c0de; font-size: 15px; margin-bottom: 22px; line-height: 1.5; }
		#win-card .btn { width: 100%; }

		@media (max-width: 480px) {
			.status-bar { padding: 8px 10px; }
			.die { width: 40px; height: 40px; padding: 6px; }
			#turn-chip { font-size: 13px; }
			.btn { min-height: 44px; font-size: 14px; padding: 10px 16px; }
		}
	</style>
</head>
<body>
	<div class="header">
		<script src="top_buttons.js"></script>
		<h1 data-i18n="games.backgammon.title">Backgammon</h1>
		<p data-i18n="games.backgammon.lead">Race your checkers to the finish line.</p>
	</div>

	<div class="game-area">
		<div class="status-bar">
			<div id="turn-chip"><span class="dot w" id="turn-dot"></span><span id="turn-text">White's Turn</span></div>
			<div class="dice-box" id="dice-display"></div>
		</div>

		<div class="board-wrap">
			<canvas id="board"></canvas>
		</div>

		<div class="controls">
			<button class="btn btn-primary" id="roll-btn">🎲 Roll</button>
			<button class="btn btn-ghost" id="reset-btn">🔄 New game</button>
			<select id="mode-select" aria-label="Mode">
				<option value="pvp">Player vs Player</option>
				<option value="pve">Player vs AI</option>
			</select>
		</div>
	</div>

	<div id="toast"></div>

	<div id="win-overlay">
		<div id="win-card">
			<h2 id="win-title">🏆 White wins!</h2>
			<p id="win-sub">All 15 checkers borne off. Perfect race!</p>
			<button class="btn btn-primary" id="win-btn">Play again</button>
		</div>
	</div>

	<script>
		'use strict';
		/* ============================================================
		   BACKGAMMON — regole complete + renderer Canvas 2D leggero.
		   Zero dipendenze: usa solo la Canvas API del browser
		   (nitida su iPhone grazie al devicePixelRatio).
		   ============================================================ */

		const canvas = document.getElementById('board');
		const ctx = canvas.getContext('2d');
		const els = {
			turnText: document.getElementById('turn-text'),
			turnDot: document.getElementById('turn-dot'),
			dice: document.getElementById('dice-display'),
			rollBtn: document.getElementById('roll-btn'),
			resetBtn: document.getElementById('reset-btn'),
			mode: document.getElementById('mode-select'),
			toast: document.getElementById('toast'),
			win: document.getElementById('win-overlay'),
			winTitle: document.getElementById('win-title'),
			winSub: document.getElementById('win-sub'),
			winBtn: document.getElementById('win-btn')
		};

		// ---------------- stato ----------------
		const state = {
			board: [],          // 24 celle {c:'w'|'b'|null, n}
			bar: { w: 0, b: 0 },
			off: { w: 0, b: 0 },
			turn: 'w',
			dice: [],
			movesLeft: [],      // valori rimasti (doppie → 4)
			selected: null,     // indice punto oppure -1 (bar)
			mode: 'pvp',
			over: false,
			winner: null,
			busy: false,
			rolled: false,
			ghost: null         // animazione: pedina in volo
		};

		// geometria calcolata a ogni resize
		let geo = null;
		const pointRects = []; // 24 celle {x,y,w,h,top}

		function resetGame() {
			state.board = Array.from({ length: 24 }, () => ({ c: null, n: 0 }));
			state.bar = { w: 0, b: 0 };
			state.off = { w: 0, b: 0 };
			state.turn = 'w';
			state.dice = [];
			state.movesLeft = [];
			state.selected = null;
			state.over = false;
			state.winner = null;
			state.busy = false;
			state.rolled = false;
			state.ghost = null;
			state.mode = els.mode.value;

			// disposizione standard
			const set = (i, c, n) => { state.board[i] = { c, n }; };
			set(23, 'w', 2); set(12, 'w', 5); set(7, 'w', 3); set(5, 'w', 5);
			set(0, 'b', 2); set(11, 'b', 5); set(16, 'b', 3); set(18, 'b', 5);

			els.win.classList.remove('show');
			renderDice();
			updateStatus();
			render();
		}

		// ---------------- regole ----------------
		const opp = c => c === 'w' ? 'b' : 'w';
		function canLand(c, to) {
			if (to < 0 || to > 23) return false;
			const s = state.board[to];
			return !(s.c && s.c !== c && s.n > 1);
		}
		function allInHome(c) {
			if (state.bar[c] > 0) return false;
			const lo = c === 'w' ? 0 : 18, hi = c === 'w' ? 5 : 23;
			for (let i = 0; i < 24; i++) {
				if (state.board[i].c === c && state.board[i].n > 0 && (i < lo || i > hi)) return false;
			}
			return true;
		}
		// mosse legali per un dado (from -1 = bar; to -2 = fuori per bianco, to 24 = fuori per nero)
		function movesForDie(c, die) {
			const out = [];
			if (state.bar[c] > 0) {
				const to = c === 'w' ? 24 - die : die - 1;
				if (canLand(c, to)) out.push({ from: -1, to });
				return out;
			}
			if (allInHome(c)) {
				// rimozione (bear off)
				if (c === 'w') {
					if (state.board[die - 1].c === 'w' && state.board[die - 1].n > 0) {
						out.push({ from: die - 1, to: -2 });
					} else {
						let beyond = false;
						for (let q = die; q < 6; q++) if (state.board[q].c === 'w' && state.board[q].n > 0) beyond = true;
						if (!beyond) {
							for (let q = 5; q >= 0; q--) {
								if (state.board[q].c === 'w' && state.board[q].n > 0) { out.push({ from: q, to: -2 }); break; }
							}
						}
					}
				} else {
					if (state.board[24 - die].c === 'b' && state.board[24 - die].n > 0) {
						out.push({ from: 24 - die, to: 24 });
					} else {
						let beyond = false;
						for (let q = 18; q < 24 - die; q++) if (state.board[q].c === 'b' && state.board[q].n > 0) beyond = true;
						if (!beyond) {
							for (let q = 18; q < 24; q++) {
								if (state.board[q].c === 'b' && state.board[q].n > 0) { out.push({ from: q, to: 24 }); break; }
							}
						}
					}
				}
			} else {
				for (let from = 0; from < 24; from++) {
					if (state.board[from].c === c && state.board[from].n > 0) {
						const to = c === 'w' ? from - die : from + die;
						if (canLand(c, to)) out.push({ from, to });
					}
				}
			}
			return out;
		}
		function allLegalMoves(c) {
			const seen = new Set(), out = [];
			for (const die of state.movesLeft) {
				for (const m of movesForDie(c, die)) {
					const k = m.from + ':' + m.to;
					if (!seen.has(k)) { seen.add(k); out.push({ from: m.from, to: m.to, die }); }
				}
			}
			return out;
		}
		function applyMove(m, c) {
			if (m.from === -1) state.bar[c]--;
			else {
				state.board[m.from].n--;
				if (state.board[m.from].n === 0) state.board[m.from].c = null;
			}
			if (m.to === -2 || m.to === 24) {
				state.off[c]++;
			} else {
				const s = state.board[m.to];
				if (s.c && s.c !== c) { state.bar[s.c]++; s.c = null; s.n = 0; }
				state.board[m.to].c = c;
				state.board[m.to].n++;
			}
			const idx = state.movesLeft.indexOf(m.die);
			if (idx >= 0) state.movesLeft.splice(idx, 1);
			if (state.off[c] >= 15) { state.over = true; state.winner = c; }
		}
		function destsForSelection() {
			const c = state.turn;
			const set = new Set();
			for (const die of state.movesLeft) {
				for (const m of movesForDie(c, die)) if (m.from === state.selected) set.add(m.to);
			}
			return [...set];
		}

		// ---------------- flusso turno ----------------
		function afterMove() {
			render();
			updateStatus();
			if (state.over) { showWin(); return; }
			if (state.movesLeft.length === 0) { setTimeout(endTurn, 250); return; }
			if (allLegalMoves(state.turn).length === 0) {
				toast(state.turn === 'w' ? 'No legal moves — turn passes' : 'Black has no moves — turn passes');
				setTimeout(endTurn, 1000);
			}
		}
		function endTurn() {
			state.selected = null;
			state.dice = [];
			state.movesLeft = [];
			state.rolled = false;
			state.turn = opp(state.turn);
			render();
			updateStatus();
			if (state.over) { showWin(); return; }
			if (state.mode === 'pve' && state.turn === 'b') {
				els.rollBtn.disabled = true;
				setTimeout(aiTurn, 500);
			}
		}
		function roll() {
			if (state.over || state.busy || state.rolled) return;
			state.rolled = true;
			const d1 = 1 + (Math.random() * 6 | 0);
			const d2 = 1 + (Math.random() * 6 | 0);
			state.dice = [d1, d2];
			state.movesLeft = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
			animateDice(d1, d2);
			sfx.roll();
			if (allLegalMoves(state.turn).length === 0) {
				toast('No legal moves — turn passes');
				setTimeout(endTurn, 1200);
			}
		}

		// ---------------- input (tocco + mouse) ----------------
		function onTap(e) {
			if (state.over || state.busy) return;
			const rect = canvas.getBoundingClientRect();
			const x = e.clientX - rect.left;
			const y = e.clientY - rect.top;
			const c = state.turn;

			if (state.mode === 'pve' && c === 'b') return; // turno AI
			if (!state.dice.length) { toast('Roll the dice first!'); return; }

			const pt = pointAt(x, y);

			if (state.selected === null) {
				// selezione: pedina propria oppure bar
				if (pt === 'bar' && state.bar[c] > 0) {
					state.selected = -1;
					sfx.tick();
					render();
					return;
				}
				if (typeof pt === 'number') {
					const s = state.board[pt];
					if (s.c === c && s.n > 0) {
						state.selected = pt;
						// se non ha mosse, niente selezione
						if (destsForSelection().length === 0) {
							state.selected = null;
							toast('No moves for this checker');
							sfx.err();
							return;
						}
						sfx.tick();
						render();
						return;
					}
				}
				return;
			}

			// deseleziona toccando lo stesso punto
			if (state.selected === pt) { state.selected = null; render(); return; }

			// destinazione legale?
			const dests = destsForSelection();
			const offSentinel = c === 'w' ? -2 : 24;
			let move = null;
			if (typeof pt === 'number' && dests.includes(pt)) move = { from: state.selected, to: pt };
			else if (pt === 'off' && dests.includes(offSentinel)) move = { from: state.selected, to: offSentinel };

			if (!move) { state.selected = null; render(); return; }

			// trova il dado da usare
			for (const die of state.movesLeft) {
				const m = movesForDie(c, die).find(x => x.from === state.selected && x.to === move.to);
				if (m) { move.die = die; break; }
			}
			if (move.die === undefined) { state.selected = null; render(); return; }

			const captured = (move.to >= 0 && move.to <= 23 && state.board[move.to].c === opp(c));
			state.selected = null;
			state.busy = true;
			const ghost = ghostMove(move, c);
			applyMove(move, c);
			if (captured) sfx.hit(); else sfx.move();
			render();
			updateStatus();
			setTimeout(() => { state.busy = false; state.ghost = null; render(); afterMove(); }, 260);
			// la "ghost" pedina volante viene disegnata da render()
			state.ghost = ghost;
		}
		function ghostMove(m, c) {
			const a = centerOf(m.from === -1 ? 'bar' : m.from, c);
			const b = centerOf(m.to === -2 || m.to === 24 ? 'off' : m.to, c);
			return { x0: a.x, y0: a.y, x1: b.x, y1: b.y, t0: performance.now(), dur: 240, c };
		}
		function centerOf(where, c) {
			if (typeof where === 'number') {
				const r = pointRects[where];
				return { x: r.x + r.w / 2, y: r.top ? r.y + r.h - 10 : r.y + 10 };
			}
			if (where === 'bar') return { x: geo.bar.cx, y: geo.bar.cy };
			// riquadro off: bianco a destra, nero a sinistra
			const offX = c === 'w' ? geo.off.cx : geo.P + geo.offW / 2;
			return { x: offX, y: geo.off.cy };
		}

		// ---------------- AI ----------------
		function aiTurn() {
			if (state.over) return;
			if (!state.dice.length) {
				const d1 = 1 + (Math.random() * 6 | 0);
				const d2 = 1 + (Math.random() * 6 | 0);
				state.dice = [d1, d2];
				state.movesLeft = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
				animateDice(d1, d2);
				sfx.roll();
			}
			aiStep();
		}
		function aiStep() {
			if (state.over) return;
			const legal = allLegalMoves('b');
			if (state.movesLeft.length === 0) { endTurn(); return; }
			if (legal.length === 0) { toast('Black has no moves — turn passes'); setTimeout(endTurn, 900); return; }

			let best = legal[0], bestScore = -Infinity;
			for (const m of legal) {
				const s = scoreMove(m);
				if (s > bestScore) { bestScore = s; best = m; }
			}
			const captured = best.to >= 0 && best.to <= 23 && state.board[best.to].c === 'w';
			state.busy = true;
			const ghost = ghostMove(best, 'b');
			applyMove(best, 'b');
			if (captured) sfx.hit(); else sfx.move();
			render();
			updateStatus();
			setTimeout(() => {
				state.busy = false;
				state.ghost = null;
				render();
				if (state.over) { showWin(); return; }
				setTimeout(aiStep, 420);
			}, 250);
			state.ghost = ghost;
		}
		function scoreMove(m) {
			let s = 0;
			const c = 'b';
			// colpire è ottimo
			if (m.to >= 0 && m.to <= 23 && state.board[m.to].c === 'w' && state.board[m.to].n === 1) s += 90;
			// rimozione
			if (m.to === 24) s += 70;
			// entrare dalla bar
			if (m.from === -1) s += 40;
			// avanzare pedine indietro (punti alti) è buono
			if (m.from >= 0 && m.to <= 23) s += (m.to - m.from);
			// sicurezza: evita di lasciare pedine singole colpibili
			const sim = state.board.map(x => ({ c: x.c, n: x.n }));
			const simBar = { w: state.bar.w, b: state.bar.b };
			if (m.from === -1) simBar.b--;
			else { sim[m.from].n--; if (sim[m.from].n === 0) sim[m.from].c = null; }
			if (m.to === 24) { /* fuori */ }
			else {
				if (sim[m.to].c && sim[m.to].c !== c) { simBar[sim[m.to].c]++; sim[m.to] = { c: null, n: 0 }; }
				sim[m.to].c = c;
				sim[m.to].n++;
			}
			for (let p = 0; p < 24; p++) {
				if (sim[p].c === c && sim[p].n === 1) {
					// un pedone bianco può colpire da un punto q tale che q - p in 1..6
					for (let q = p + 1; q <= p + 6 && q < 24; q++) {
						if (sim[q].c === 'w' && sim[q].n > 0) { s -= 35; break; }
					}
				}
			}
			return s;
		}

		// ---------------- UI ----------------
		let toastTimer = null;
		function toast(msg) {
			els.toast.textContent = msg;
			els.toast.classList.add('show');
			clearTimeout(toastTimer);
			toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1800);
		}
		function updateStatus() {
			const c = state.turn;
			els.turnText.textContent = state.over
				? (state.winner === 'w' ? 'White wins!' : 'Black wins!')
				: (c === 'w' ? "White's Turn" : "Black's Turn");
			els.turnDot.className = 'dot ' + c;
			renderDice();
			els.rollBtn.disabled = state.over || state.rolled || (state.mode === 'pve' && c === 'b');
			els.rollBtn.textContent = state.rolled ? '✓ Rolled' : '🎲 Roll';
		}
		function renderDice() {
			els.dice.innerHTML = '';
			const vals = state.dice.length ? state.dice : [0, 0];
			for (const v of vals) {
				const die = document.createElement('div');
				die.className = 'die';
				if (!v) die.style.opacity = '.25';
				const PIPS = {
					1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8],
					5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
				};
				for (let i = 0; i < 9; i++) {
					const cell = document.createElement('div');
					if ((PIPS[v] || []).includes(i)) {
						const pip = document.createElement('div');
						pip.className = 'pip';
						cell.appendChild(pip);
					}
					die.appendChild(cell);
				}
				els.dice.appendChild(die);
			}
		}
		function animateDice(d1, d2) {
			const dice = els.dice.querySelectorAll('.die');
			dice.forEach(d => d.classList.add('rolling'));
			const t0 = performance.now();
			const rollVals = () => {
				if (performance.now() - t0 < 600) {
					dice.forEach(d => { d.innerHTML = ''; const v = 1 + (Math.random() * 6 | 0); buildPips(d, v); });
					requestAnimationFrame(rollVals);
				} else {
					dice.forEach(d => d.classList.remove('rolling'));
					renderDice();
				}
			};
			requestAnimationFrame(rollVals);
		}
		function buildPips(die, v) {
			const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
			for (let i = 0; i < 9; i++) {
				const cell = document.createElement('div');
				if ((PIPS[v] || []).includes(i)) {
					const pip = document.createElement('div');
					pip.className = 'pip';
					cell.appendChild(pip);
				}
				die.appendChild(cell);
			}
		}
		function showWin() {
			const c = state.winner;
			els.winTitle.textContent = c === 'w' ? '🏆 White wins!' : '🏆 Black wins!';
			els.winSub.textContent = 'All 15 checkers borne off. Perfect race!';
			sfx.win();
			setTimeout(() => els.win.classList.add('show'), 500);
		}

		// ---------------- suoni (WebAudio leggero) ----------------
		const sfx = (() => {
			let ac = null;
			function ensure() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
			function tone(f0, f1, dur, type, vol, delay) {
				if (!ac) return;
				try {
					const t0 = ac.currentTime + (delay || 0);
					const o = ac.createOscillator(), g = ac.createGain();
					o.type = type || 'sine';
					o.frequency.setValueAtTime(f0, t0);
					o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
					g.gain.setValueAtTime(vol, t0);
					g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
					o.connect(g); g.connect(ac.destination);
					o.start(t0); o.stop(t0 + dur + 0.05);
				} catch (e) {}
			}
			return {
				ensure,
				roll() { ensure(); tone(900, 300, 0.18, 'triangle', 0.08); },
				tick() { ensure(); tone(700, 900, 0.06, 'square', 0.05); },
				move() { ensure(); tone(380, 240, 0.09, 'triangle', 0.1); },
				hit() { ensure(); tone(160, 60, 0.22, 'sawtooth', 0.14); },
				err() { ensure(); tone(200, 150, 0.12, 'square', 0.07); },
				win() { ensure(); [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.14, i * 0.12)); }
			};
		})();
		document.addEventListener('pointerdown', () => sfx.ensure(), { once: true, passive: true });

		// ---------------- renderer Canvas ----------------
		function resize() {
			const w = canvas.clientWidth;
			const h = canvas.clientHeight;
			const dpr = Math.min(window.devicePixelRatio || 1, 2);
			canvas.width = Math.round(w * dpr);
			canvas.height = Math.round(h * dpr);
			computeGeo(w, h);
			render();
		}
		function computeGeo(W, H) {
			const P = 10;
			const offW = Math.max(20, W * 0.06);
			const barW = Math.max(18, W * 0.055);
			const inner = W - 2 * P - 2 * offW - barW;
			const halfW = inner / 2;
			const pw = halfW / 6;
			const topH = (H - 2 * P) / 2;
			geo = { P, offW, barW, halfW, pw, topH, W, H, bar: {}, off: {} };
			geo.bar.cx = P + offW + halfW + barW / 2;
			geo.bar.cy = P + topH;
			geo.off.cx = W - P - offW / 2;
			geo.off.cy = P + topH;

			// indici punto → posizione visiva (0 = in basso a destra, senso antiorario)
			const orderTopL = [23, 22, 21, 20, 19, 18];
			const orderBotL = [17, 16, 15, 14, 13, 12];
			const orderTopR = [6, 7, 8, 9, 10, 11];
			const orderBotR = [5, 4, 3, 2, 1, 0];
			const leftX = P + offW;
			const rightX = P + offW + halfW + barW;
			function setPoint(idx, col, row, top) {
				pointRects[idx] = { x: col * pw + (row === 'L' ? leftX : rightX), y: top ? P : P + topH, w: pw, h: topH, top };
			}
			orderTopL.forEach((idx, col) => setPoint(idx, col, 'L', true));
			orderBotL.forEach((idx, col) => setPoint(idx, col, 'L', false));
			orderTopR.forEach((idx, col) => setPoint(idx, col, 'R', true));
			orderBotR.forEach((idx, col) => setPoint(idx, col, 'R', false));
		}
		function pointAt(x, y) {
			if (geo.off.x0 !== undefined && x >= geo.off.x0 && x <= geo.off.x1 && y >= geo.off.y0 && y <= geo.off.y1) return 'off';
			if (x >= geo.bar.x0 && x <= geo.bar.x1) return 'bar';
			for (let i = 0; i < 24; i++) {
				const r = pointRects[i];
				if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
			}
			return null;
		}

		function render() {
			if (!geo) return;
			const { W, H, P } = geo;
			ctx.setTransform(Math.min(window.devicePixelRatio || 1, 2), 0, 0, Math.min(window.devicePixelRatio || 1, 2), 0, 0);
			ctx.clearRect(0, 0, W, H);

			// legno esterno
			roundRect(P - 4, P - 4, W - 2 * (P - 4), H - 2 * (P - 4), 18);
			const g = ctx.createLinearGradient(0, 0, W, H);
			g.addColorStop(0, '#8a5a2e');
			g.addColorStop(1, '#5a3418');
			ctx.fillStyle = g;
			ctx.fill();
			ctx.strokeStyle = 'rgba(0,0,0,.45)';
			ctx.lineWidth = 2;
			ctx.stroke();

			// interno
			roundRect(P, P, W - 2 * P, H - 2 * P, 10);
			const g2 = ctx.createLinearGradient(0, 0, 0, H);
			g2.addColorStop(0, '#e8c393');
			g2.addColorStop(1, '#d6a86e');
			ctx.fillStyle = g2;
			ctx.fill();

			// barra centrale
			const barX = P + geo.offW + geo.halfW;
			ctx.fillStyle = '#5a3418';
			ctx.fillRect(barX, P, geo.barW, H - 2 * P);

			// riquadri "off" laterali
			geo.off.x0 = W - P - geo.offW;
			geo.off.x1 = W - P;
			geo.off.y0 = P + 8;
			geo.off.y1 = H - P - 8;
			ctx.fillStyle = 'rgba(90,52,24,.85)';
			roundRect(geo.off.x0, geo.off.y0, geo.offW, geo.off.y1 - geo.off.y0, 6);
			ctx.fill();
			ctx.fillStyle = 'rgba(90,52,24,.85)';
			roundRect(P, geo.off.y0, geo.offW, geo.off.y1 - geo.off.y0, 6);
			ctx.fill();
			geo.bar.x0 = barX;
			geo.bar.x1 = barX + geo.barW;

			// triangoli
			const selDests = (state.selected !== null && state.dice.length) ? destsForSelection() : null;
			for (let i = 0; i < 24; i++) {
				const r = pointRects[i];
				const dark = i % 2 === 0;
				ctx.beginPath();
				if (r.top) {
					ctx.moveTo(r.x, r.y);
					ctx.lineTo(r.x + r.w, r.y);
					ctx.lineTo(r.x + r.w / 2, r.y + r.h);
				} else {
					ctx.moveTo(r.x, r.y + r.h);
					ctx.lineTo(r.x + r.w, r.y + r.h);
					ctx.lineTo(r.x + r.w / 2, r.y);
				}
				ctx.closePath();
				const col = dark ? '#8b3a12' : '#f3d9ae';
				ctx.fillStyle = col;
				ctx.fill();
				ctx.strokeStyle = 'rgba(0,0,0,.18)';
				ctx.lineWidth = 1;
				ctx.stroke();

				// evidenziazione selezione / destinazioni
				if (state.selected === i) {
					ctx.strokeStyle = '#ffd54a';
					ctx.lineWidth = 3;
					ctx.stroke();
				}
				if (selDests && selDests.includes(i)) {
					ctx.beginPath();
					ctx.arc(r.x + r.w / 2, r.top ? r.y + 8 : r.y + r.h - 8, r.w * 0.32, 0, Math.PI * 2);
					ctx.fillStyle = 'rgba(0,212,255,.28)';
					ctx.fill();
					ctx.strokeStyle = '#00d4ff';
					ctx.lineWidth = 2;
					ctx.setLineDash([4, 3]);
					ctx.stroke();
					ctx.setLineDash([]);
				}
			}
			// destinazione "off" evidenziata
			if (selDests) {
				const sent = state.turn === 'w' ? -2 : 24;
				if (selDests.includes(sent)) {
					ctx.strokeStyle = '#00d4ff';
					ctx.lineWidth = 2.5;
					roundRect(geo.off.x0 + 2, geo.off.y0 + 2, geo.offW - 4, geo.off.y1 - geo.off.y0 - 4, 6);
					ctx.stroke();
				}
			}

			// pedine della barra
			drawBarCheckers();
			// pedine sui punti
			for (let i = 0; i < 24; i++) drawStack(i);
			// contatori "off"
			drawOffCount();

			// pedina fantasma (animazione)
			if (state.ghost) {
				const gho = state.ghost;
				const t = Math.min(1, (performance.now() - gho.t0) / gho.dur);
				const x = gho.x0 + (gho.x1 - gho.x0) * t;
				const y = gho.y0 + (gho.y1 - gho.y0) * t - Math.sin(t * Math.PI) * 14;
				drawChecker(x, y, gho.c, geo.pw * 0.72, 0.9);
			}
		}

		function drawChecker(x, y, c, d, alpha) {
			ctx.save();
			ctx.globalAlpha = alpha;
			const r = d / 2;
			// ombra
			ctx.beginPath();
			ctx.arc(x + 1.5, y + 2.5, r, 0, Math.PI * 2);
			ctx.fillStyle = 'rgba(0,0,0,.35)';
			ctx.fill();
			const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.2, x, y, r);
			if (c === 'w') {
				grad.addColorStop(0, '#ffffff');
				grad.addColorStop(1, '#b9c1cd');
			} else {
				grad.addColorStop(0, '#4d4d58');
				grad.addColorStop(1, '#0c0c10');
			}
			ctx.beginPath();
			ctx.arc(x, y, r, 0, Math.PI * 2);
			ctx.fillStyle = grad;
			ctx.fill();
			ctx.strokeStyle = c === 'w' ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.35)';
			ctx.lineWidth = 1.5;
			ctx.stroke();
			ctx.beginPath();
			ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
			ctx.strokeStyle = c === 'w' ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.12)';
			ctx.lineWidth = 1;
			ctx.stroke();
			ctx.restore();
		}

		function drawStack(i) {
			const s = state.board[i];
			if (!s || s.n === 0) return;
			const r = pointRects[i];
			const d = Math.min(geo.pw * 0.72, r.h * 0.18);
			const gap = 1.5;
			const max = Math.max(1, Math.floor((r.h - 12) / (d + gap)));
			const n = Math.min(s.n, max);
			for (let k = 0; k < n; k++) {
				const cx = r.x + r.w / 2;
				const cy = r.top ? (r.y + 6 + d / 2 + k * (d + gap)) : (r.y + r.h - 6 - d / 2 - k * (d + gap));
				drawChecker(cx, cy, s.c, d, 1);
			}
			if (s.n > max) {
				ctx.fillStyle = 'rgba(255,255,255,.85)';
				ctx.font = '700 ' + Math.max(10, r.w * 0.3) + 'px Inter, sans-serif';
				ctx.textAlign = 'center';
				ctx.fillText('+' + (s.n - max), r.x + r.w / 2, r.top ? r.y + r.h * 0.62 : r.y + r.h * 0.38);
			}
		}

		function drawBarCheckers() {
			const d = Math.min(geo.barW * 0.6, 22);
			const gap = 2;
			let y = geo.bar.cy - 30;
			for (let k = 0; k < Math.min(state.bar.w, 3); k++) {
				drawChecker(geo.bar.cx, y, 'w', d, 1);
				y += d + gap;
			}
			if (state.bar.w > 3) {
				ctx.fillStyle = '#fff';
				ctx.font = '800 11px Inter, sans-serif';
				ctx.textAlign = 'center';
				ctx.fillText('+' + (state.bar.w - 3), geo.bar.cx, y + 2);
			}
			y = geo.bar.cy + 30;
			for (let k = 0; k < Math.min(state.bar.b, 3); k++) {
				drawChecker(geo.bar.cx, y, 'b', d, 1);
				y -= d + gap;
			}
			if (state.bar.b > 3) {
				ctx.fillStyle = '#fff';
				ctx.font = '800 11px Inter, sans-serif';
				ctx.textAlign = 'center';
				ctx.fillText('+' + (state.bar.b - 3), geo.bar.cx, y - 4);
			}
		}

		function drawOffCount() {
			ctx.font = '800 15px Inter, sans-serif';
			ctx.textAlign = 'center';
			const bw = geo.offW;
			// sinistra = off black, destra = off white (nel nostro layout)
			let y = geo.off.y0 + 16;
			for (let k = 0; k < Math.min(state.off.b, 4); k++) {
				drawChecker(geo.P + geo.offW / 2, y, 'b', 12, 0.95);
				y += 15;
			}
			ctx.fillStyle = '#fff';
			ctx.fillText(state.off.b, geo.P + geo.offW / 2, y + 6);
			y = geo.off.y0 + 16;
			for (let k = 0; k < Math.min(state.off.w, 4); k++) {
				drawChecker(geo.off.cx, y, 'w', 12, 0.95);
				y += 15;
			}
			ctx.fillStyle = '#fff';
			ctx.fillText(state.off.w, geo.off.cx, y + 6);
		}

		function roundRect(x, y, w, h, r) {
			ctx.beginPath();
			ctx.moveTo(x + r, y);
			ctx.arcTo(x + w, y, x + w, y + h, r);
			ctx.arcTo(x + w, y + h, x, y + h, r);
			ctx.arcTo(x, y + h, x, y, r);
			ctx.arcTo(x, y, x + w, y, r);
			ctx.closePath();
		}

		// ---------------- eventi ----------------
		canvas.addEventListener('pointerdown', (e) => {
			e.preventDefault();
			onTap(e);
		});
		els.rollBtn.addEventListener('click', () => { sfx.ensure(); roll(); });
		els.resetBtn.addEventListener('click', () => { sfx.ensure(); resetGame(); });
		els.mode.addEventListener('change', () => resetGame());
		els.winBtn.addEventListener('click', () => resetGame());
		window.addEventListener('resize', resize);

		// ---------------- avvio ----------------
		resetGame();
		resize();
		window.__BG = { state, allLegalMoves, applyMove, movesForDie, resetGame, roll, onTap, scoreMove };
	</script>
</body>
</html>
