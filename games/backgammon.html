<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
	<title data-i18n="games.backgammon.title">Backgammon - Luca Gandolfi</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-900: #0a1628;
			--bg-800: #1a2940;
			--accent: #00d4ff;
			--board-bg: #5c4033;
			--board-inner: #e8c39e;
			--point-dark: #8b4513;
			--point-light: #f0d9b5;
			--piece-w: #e0e0e0;
			--piece-b: #333333;
			--highlight: rgba(0, 212, 255, 0.5);
		}
		body {
			margin: 0;
			font-family: 'Inter', sans-serif;
			background: linear-gradient(135deg, var(--bg-900), var(--bg-800));
			color: white;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		.header {
			padding: 20px;
			text-align: center;
			width: 100%;
			max-width: 800px;
		}
		.back-btn {
			display: inline-block;
			margin-bottom: 10px;
			color: var(--accent);
			text-decoration: none;
			font-weight: 600;
		}
		h1 { margin: 0 0 10px 0; color: var(--accent); }
        
		.game-area {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 20px;
			width: 100%;
			max-width: 700px;
			padding: 10px;
		}

		.status-bar {
			display: flex;
			justify-content: space-between;
			width: 100%;
			background: rgba(255,255,255,0.05);
			padding: 10px;
			border-radius: 8px;
			align-items: center;
		}

		.dice-container {
			display: flex;
			gap: 10px;
		}
		.die {
			width: 40px;
			height: 40px;
			background: white;
			color: black;
			border-radius: 6px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: bold;
			font-size: 1.2rem;
			box-shadow: 0 2px 5px rgba(0,0,0,0.2);
		}
		.die.used { opacity: 0.5; }

		.board-container {
			background-color: var(--board-bg);
			padding: 15px;
			border-radius: 4px;
			width: 100%;
			aspect-ratio: 1.3;
			display: flex;
			position: relative;
			box-sizing: border-box;
		}

		.board-side {
			flex: 1;
			display: flex;
			flex-direction: column;
			background-color: var(--board-inner);
			border: 2px solid #3e2b22;
		}

		.board-half {
			flex: 1;
			display: flex;
			position: relative;
		}
		.board-half.top { border-bottom: 1px solid rgba(0,0,0,0.1); align-items: flex-start; }
		.board-half.bottom { border-top: 1px solid rgba(0,0,0,0.1); align-items: flex-end; }

		.bar {
			width: 40px;
			background-color: #3e2b22;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 5px;
		}

		.point {
			flex: 1;
			height: 40%; /* Visual height of triangle */
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: flex-start; /* Stack from base */
			cursor: pointer;
		}
        
		.point:nth-child(odd) { background-color: var(--point-dark); }
		.point:nth-child(even) { background-color: var(--point-light); }
		.board-half.top .point { flex-direction: column; justify-content: flex-start; }
		.board-half.bottom .point { flex-direction: column-reverse; justify-content: flex-start; }

		.checker {
			width: 80%;
			aspect-ratio: 1;
			border-radius: 50%;
			margin: 1px 0;
			box-shadow: 0 2px 3px rgba(0,0,0,0.3);
			z-index: 2;
			border: 2px solid rgba(0,0,0,0.2);
		}
		.checker.white { background-color: var(--piece-w); }
		.checker.black { background-color: var(--piece-b); border-color: white; }
        
		.point.highlight { background-color: var(--highlight) !important; }
		.bar.highlight { box-shadow: inset 0 0 10px var(--accent); }

		.controls { margin-top: 10px; }
		.btn { padding: 12px 24px; background: var(--accent); color: var(--bg-900); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
		.btn:disabled { opacity: 0.5; cursor: not-allowed; }

		.board-layout { display: flex; width: 100%; height: 100%; }
		.quadrant { flex: 1; display: flex; }
		.off-board { width: 40px; border-left: 5px solid #3e2b22; background: var(--board-inner); display: flex; flex-direction: column; justify-content: space-between; padding: 10px 2px; box-sizing: border-box; }
		.off-box { height: 45%; border: 1px dashed rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; color: #333; }
	</style>
</head>
<body>
	<div class="header">
		<script src="top_buttons.js"></script>
		<h1 data-i18n="games.backgammon.title">Backgammon</h1>
		<p data-i18n="games.backgammon.lead">Race your checkers to the finish line.</p>
	</div>

	<div class="game-area">
		<div class="status-bar">
			<div id="turn-indicator">White's Turn</div>
			<div class="dice-container" id="dice-display"></div>
		</div>

		<div class="board-container">
			<div class="board-side" style="border-right: none;">
				<div class="board-half top" id="quad-tl"></div>
				<div class="board-half bottom" id="quad-bl"></div>
			</div>

			<div class="bar" id="bar"></div>

			<div class="board-side" style="border-left: none;">
				<div class="board-half top" id="quad-tr"></div>
				<div class="board-half bottom" id="quad-br"></div>
			</div>
            
			<div class="off-board">
				<div class="off-box" id="off-white">W: 0</div>
				<div class="off-box" id="off-black">B: 0</div>
			</div>
		</div>

		<div class="controls">
			<div style="margin-bottom: 10px;"><label style="margin-right: 10px;">Mode:</label><select id="gameMode" onchange="resetGame()" style="padding: 5px; border-radius: 5px;"></select></div>
			<button class="btn" id="roll-btn" onclick="rollDice()" data-i18n="games.backgammon.roll">Roll Dice</button>
			<button class="btn" onclick="resetGame()" style="background: #444;">Reset</button>
		</div>
	</div>

	<script>
		const els = { quadTL: document.getElementById('quad-tl'), quadTR: document.getElementById('quad-tr'), quadBL: document.getElementById('quad-bl'), quadBR: document.getElementById('quad-br'), bar: document.getElementById('bar'), dice: document.getElementById('dice-display'), turn: document.getElementById('turn-indicator'), rollBtn: document.getElementById('roll-btn'), offW: document.getElementById('off-white'), offB: document.getElementById('off-black'), mode: document.getElementById('gameMode') };

		let board = [];
		let bar = { w: 0, b: 0 };
		let off = { w: 0, b: 0 };
		let turn = 'w';
		let dice = [];
		let movesLeft = [];
		let selectedPoint = null;
		let gameMode = 'pvp';
		let isComputerThinking = false;

		function initGame() {
			board = Array(24).fill(null).map(() => ({ count: 0, color: null }));
			bar = { w: 0, b: 0 };
			off = { w: 0, b: 0 };
			turn = 'w';
			dice = [];
			movesLeft = [];
			selectedPoint = null;
			isComputerThinking = false;
			gameMode = els.mode.value;

			// Setup White
			board[23] = { count: 2, color: 'w' };
			board[12] = { count: 5, color: 'w' };
			board[7]  = { count: 3, color: 'w' };
			board[5]  = { count: 5, color: 'w' };

			// Setup Black
			board[0]  = { count: 2, color: 'b' };
			board[11] = { count: 5, color: 'b' };
			board[16] = { count: 3, color: 'b' };
			board[18] = { count: 5, color: 'b' };

			renderBoard();
			updateStatus();
			els.rollBtn.disabled = false;
		}


		function renderBoard() {
			els.quadTL.innerHTML = '';
			els.quadTR.innerHTML = '';
			els.quadBL.innerHTML = '';
			els.quadBR.innerHTML = '';

			for (let i = 0; i < 24; i++) {
				const p = document.createElement('div');
				p.className = 'point';
				p.dataset.index = i;

				const slot = board[i];
				if (slot && slot.count > 0) {
					for (let k = 0; k < slot.count; k++) {
						const ch = document.createElement('div');
						ch.className = 'checker ' + (slot.color === 'w' ? 'white' : 'black');
						p.appendChild(ch);
					}
				}

				// map points into quadrants (visual layout)
				if (i >= 12 && i <= 17) els.quadTL.appendChild(p);
				else if (i >= 18 && i <= 23) els.quadTR.appendChild(p);
				else if (i >= 6 && i <= 11) els.quadBL.appendChild(p);
				else els.quadBR.appendChild(p);
			}
		}

		function updateStatus() {
			els.turn.textContent = turn === 'w' ? "White's Turn" : "Black's Turn";
			// render dice
			els.dice.innerHTML = '';
			for (let d of dice) {
				const dieEl = document.createElement('div');
				dieEl.className = 'die';
				dieEl.textContent = d;
				els.dice.appendChild(dieEl);
			}
		}

		function rollDice() {
			if (isComputerThinking) return;
			dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
			movesLeft = [...dice];
			updateStatus();
			// small disable to avoid spamming
			els.rollBtn.disabled = true;
			setTimeout(() => { els.rollBtn.disabled = false; }, 700);
		}

		function resetGame() {
			initGame();
		}

		function populateModeSelect() {
			els.mode.innerHTML = '';
			const opts = [ { v: 'pvp', t: 'Player vs Player' }, { v: 'pve', t: 'Player vs AI' } ];
			for (const o of opts) {
				const opt = document.createElement('option');
				opt.value = o.v;
				opt.textContent = o.t;
				els.mode.appendChild(opt);
			}
			els.mode.value = gameMode;
		}

		// --- Move handling and simple AI ---

		function showMessage(text, timeout = 1200) {
			const prev = els.turn.textContent;
			els.turn.textContent = text;
			setTimeout(() => { updateStatus(); }, timeout);
		}

		function handlePointClick(index) {
			if (turn !== 'w') return; // player is always white in this simple UI
			// if player has pieces on bar, require entering first
			if (bar.w > 0) { showMessage('Enter from bar first'); return; }

			const slot = board[index];
			if (selectedPoint === null) {
				if (!slot || slot.count === 0 || slot.color !== 'w') return; // must select own checker
				selectedPoint = index;
				renderBoard();
				const el = document.querySelector(`.point[data-index="${index}"]`);
				if (el) el.classList.add('highlight');
				return;
			}

			if (selectedPoint === index) { selectedPoint = null; renderBoard(); return; }

			// attempt move from selectedPoint -> index
			const dist = getMoveDistance(selectedPoint, index, 'w');
			if (dist <= 0) { showMessage('Invalid move'); selectedPoint = null; renderBoard(); return; }
			const dieIdx = findDieIndexForMove(dist);
			if (dieIdx === -1) { showMessage('No matching die'); selectedPoint = null; renderBoard(); return; }

			applyMove(selectedPoint, index, dieIdx);
			selectedPoint = null;
			renderBoard();
			updateStatus();
			if (movesLeft.length === 0) switchTurn();
		}

		function getMoveDistance(from, to, playerColor) {
			if (playerColor === 'w') return from - to; // white moves to lower indices
			return to - from; // black moves to higher indices
		}

		function findDieIndexForMove(dist) {
			// consider both single die and, if available, combined move (not implemented)
			for (let i = 0; i < movesLeft.length; i++) {
				if (movesLeft[i] === dist) return i;
			}
			return -1;
		}

		function isBlocked(destIndex, playerColor) {
			if (destIndex < 0 || destIndex > 23) return true;
			const s = board[destIndex];
			if (!s || s.count === 0) return false;
			return s.color !== playerColor && s.count > 1;
		}

		function applyMove(from, to, dieIdx) {
			if (isBlocked(to, 'w')) { showMessage('Destination blocked'); return; }

			const fromSlot = board[from];
			const toSlot = board[to] || { count: 0, color: null };

			// handle hit
			if (toSlot.count === 1 && toSlot.color === 'b') {
				// send opponent to bar
				bar.b += 1;
				board[to] = { count: 0, color: null };
			}

			// move checker
			fromSlot.count -= 1;
			if (fromSlot.count === 0) fromSlot.color = null;
			if (!board[to]) board[to] = { count: 0, color: null };
			if (board[to].count === 0) board[to].color = 'w';
			board[to].count += 1;

			// consume die
			movesLeft.splice(dieIdx, 1);
			return true;
		}

		function switchTurn() {
			turn = (turn === 'w') ? 'b' : 'w';
			dice = [];
			movesLeft = [];
			selectedPoint = null;
			renderBoard();
			updateStatus();
			if (turn === 'b' && gameMode === 'pve') {
				setTimeout(() => { aiTakeTurn(); }, 600);
			}
		}

		function aiTakeTurn() {
			// simple AI: roll if no dice, then play greedy/random moves
			if (dice.length === 0) {
				dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
				if (dice[0] === dice[1]) movesLeft = [dice[0], dice[0], dice[0], dice[0]];
				else movesLeft = [...dice];
				updateStatus();
			}

			const makeNext = () => {
				if (movesLeft.length === 0) { switchTurn(); return; }
				// find all possible moves for AI (black)
				let moved = false;
				for (let from = 0; from < 24 && !moved; from++) {
					const s = board[from];
					if (!s || s.count === 0 || s.color !== 'b') continue;
					for (let i = 0; i < movesLeft.length && !moved; i++) {
						const dist = movesLeft[i];
						const to = from + dist; // black moves to higher indices
						if (to < 0 || to > 23) continue;
						if (isBlocked(to, 'b')) continue;
						// prefer hits
						if (board[to] && board[to].count === 1 && board[to].color === 'w') {
							applyMove(from, to, i);
							moved = true;
							break;
						}
						// otherwise take first legal
						applyMove(from, to, i);
						moved = true;
					}
				}
				if (!moved) { // no moves possible
					movesLeft = [];
					switchTurn();
					return;
				}
				renderBoard();
				updateStatus();
				setTimeout(makeNext, 400);
			};

			makeNext();
		}

		document.addEventListener('DOMContentLoaded', () => { populateModeSelect(); initGame(); });
	</script>
</body>
</html>
