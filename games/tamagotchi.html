<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3e6" />
    <meta name="description" content="Cozy Pod — a cute 3D virtual pet with mini-games, streaks and skins — Luca Gandolfi" />
    <title>Cozy Pod — Virtual Pet</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --cream: #fff7ee;
            --peach: #ffe8d6;
            --lav: #efe6ff;
            --mint: #e2f6ef;
            --ink: #4a4458;
            --muted: #9a93a8;
            --card: rgba(255, 255, 255, 0.82);
            --line: rgba(120, 100, 140, 0.12);
            --teal: #6fc7bd;
            --lav2: #b9a5f5;
            --amber: #f6b26b;
            --pink: #f7a8c0;
            --blue: #85b8f0;
            --shadow: 0 10px 34px rgba(150, 120, 160, 0.14);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(90% 60% at 15% 0%, var(--peach) 0%, transparent 55%),
                radial-gradient(80% 50% at 90% 10%, var(--lav) 0%, transparent 55%),
                radial-gradient(90% 70% at 50% 110%, var(--mint) 0%, transparent 60%),
                var(--cream);
            margin: 0;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .app-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            padding-top: max(10px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 40;
            background: linear-gradient(180deg, rgba(255,247,238,0.92), rgba(255,247,238,0.75));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .back-btn {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 10px;
            border-radius: 12px;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .back-btn:active { background: rgba(0,0,0,0.05); color: var(--ink); }
        .brand { flex: 1; min-width: 0; text-align: center; }
        .brand h1 {
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-size: clamp(1.1rem, 4.8vw, 1.5rem);
            font-weight: 600;
            margin: 0;
            background: linear-gradient(92deg, var(--teal), var(--lav2) 55%, var(--amber));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand p { margin: 0; font-size: 0.66rem; color: var(--muted); letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hdr-btns { display: flex; gap: 6px; }
        .icon-btn {
            width: 38px; height: 38px; min-width: 38px;
            border-radius: 13px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.7);
            color: var(--ink);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            font-size: 0.95rem;
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.off { opacity: 0.38; }
        .wrap {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 12px 12px 18px;
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .card {
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 14px;
        }
        .stage-card { padding: 10px; position: relative; overflow: visible; }
        .stage-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 6px 8px; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.82rem;
            background: rgba(255,255,255,0.75);
            border: 1px solid var(--line);
            padding: 5px 12px;
            border-radius: 20px;
        }
        .mood-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green-ok, var(--teal)); box-shadow: 0 0 8px currentColor; }
        .pet-frame {
            position: relative;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            aspect-ratio: 1 / 0.94;
            border-radius: 20px;
            overflow: visible;
            touch-action: pan-y;
        }
        @supports not (aspect-ratio: 1) { .pet-frame { height: 360px; } }
        #petCanvas {
            width: 100%; height: 100%;
            display: block;
            border-radius: 20px;
            background: radial-gradient(115% 90% at 50% 30%, #fff9f0 0%, #fdeede 42%, #eadcf3 78%, #dceef7 100%);
            box-shadow: inset 0 0 44px rgba(190, 160, 200, 0.16);
            cursor: grab;
            touch-action: pan-y;
        }
        #petCanvas:active { cursor: grabbing; }
        .speech {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%) translateY(-6px) scale(0.9);
            max-width: 84%;
            background: rgba(255,255,255,0.95);
            border: 1.5px solid var(--line);
            border-radius: 16px;
            padding: 8px 13px;
            font-size: 0.86rem;
            font-weight: 600;
            line-height: 1.35;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.35);
            z-index: 12;
            box-shadow: 0 6px 18px rgba(150,120,160,0.18);
        }
        .speech::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            border: 7px solid transparent;
            border-top-color: rgba(255,255,255,0.95);
            border-bottom: none;
        }
        .speech.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        .drag-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.64rem;
            letter-spacing: 0.6px;
            color: rgba(120,105,135,0.65);
            z-index: 11;
            pointer-events: none;
            white-space: nowrap;
        }
        .xp-strip { display: flex; align-items: center; gap: 10px; padding: 10px 6px 2px; }
        .xp-bar { flex: 1; height: 12px; border-radius: 10px; background: rgba(120,100,140,0.1); overflow: hidden; }
        .xp-fill { height: 100%; width: 0%; border-radius: 10px; background: linear-gradient(90deg, var(--teal), var(--lav2)); transition: width 0.45s ease; }
        .xp-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); min-width: 74px; text-align: right; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .stat-pill {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 8px 6px 9px;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .stat-pill .icn { font-size: 1rem; }
        .stat-pill .val { font-weight: 800; font-size: 0.92rem; margin-top: 1px; }
        .stat-pill .bar { height: 5px; border-radius: 5px; background: rgba(120,100,140,0.12); margin: 6px 4px 0; overflow: hidden; }
        .stat-pill .fill { height: 100%; border-radius: 5px; width: 50%; transition: width 0.4s ease; }
        .s-hunger .fill { background: linear-gradient(90deg, var(--amber), #f59e0b); }
        .s-happy .fill { background: linear-gradient(90deg, var(--pink), #e46fa4); }
        .s-clean .fill { background: linear-gradient(90deg, var(--teal), #2ea79a); }
        .s-energy .fill { background: linear-gradient(90deg, var(--blue), #4d7fe0); }
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .act-btn {
            border: none;
            border-radius: 20px;
            min-height: 58px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            color: var(--ink);
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-shadow: 0 6px 16px rgba(150,120,160,0.16), inset 0 1px 0 rgba(255,255,255,0.7);
            transition: transform 0.12s, filter 0.15s;
        }
        .act-btn i { font-size: 1.05rem; }
        .act-btn:active:not(:disabled) { transform: scale(0.96); filter: brightness(1.06); }
        .act-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .act-feed { background: linear-gradient(150deg, #ffe3bd, var(--amber)); color: #6b3f10; }
        .act-play { background: linear-gradient(150deg, #ffd7e6, var(--pink)); color: #8c2f56; }
        .act-clean { background: linear-gradient(150deg, #cdf3ec, var(--teal)); color: #14554d; }
        .act-sleep { background: linear-gradient(150deg, #dbe7ff, var(--blue)); color: #274a7c; }
        .panel-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 0.95rem; margin-bottom: 9px; display: flex; align-items: center; justify-content: space-between; }
        .panel-title small { font-weight: 400; color: var(--muted); font-family: 'Inter'; font-size: 0.72rem; }
        .inv-row, .skin-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .inv-row::-webkit-scrollbar, .skin-row::-webkit-scrollbar { display: none; }
        .item-chip {
            flex: none;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1.5px solid var(--line);
            background: rgba(255,255,255,0.8);
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 0.95rem;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.12s;
        }
        .item-chip:active { transform: scale(0.94); }
        .item-chip.zero { opacity: 0.4; }
        .item-chip .cnt { font-weight: 800; font-size: 0.8rem; color: var(--ink); }
        .gift-btn {
            flex: none;
            border: 1.5px dashed rgba(150,120,170,0.4);
            background: transparent;
            color: var(--ink);
            border-radius: 14px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }
        .gift-btn:active { background: rgba(150,120,170,0.08); }
        .skin-dot {
            flex: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2.5px solid transparent;
            cursor: pointer;
            touch-action: manipulation;
            position: relative;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.12), inset 0 2px 4px rgba(255,255,255,0.6), 0 3px 8px rgba(150,120,160,0.25);
            transition: transform 0.15s;
        }
        .skin-dot:active { transform: scale(0.9); }
        .skin-dot.sel { border-color: var(--ink); }
        .skin-dot.locked { filter: grayscale(0.9); opacity: 0.45; }
        .skin-dot .lk {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 0.62rem; font-weight: 800;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .foot-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .mini-btn {
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.75);
            color: var(--ink);
            border-radius: 14px;
            padding: 9px 14px;
            font-weight: 700;
            font-size: 0.83rem;
            font-family: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }
        .mini-btn:active { transform: scale(0.96); }
        .diag-link { font-size: 0.72rem; color: var(--muted); text-decoration: none; }
        .save-note { font-size: 0.68rem; color: var(--muted); }

        .mini-layer {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            z-index: 20;
            display: none;
            background: radial-gradient(120% 100% at 50% 0%, rgba(255,236,214,0.97), rgba(240,226,250,0.97));
            overflow: hidden;
        }
        .mini-layer.open { display: block; }
        .mini-hud {
            position: absolute;
            top: 8px; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 5;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.25) 28%, rgba(186,215,255,0.55) 65%, rgba(160,190,245,0.75) 100%);
            border: 1.5px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 12px rgba(130,160,230,0.25), inset -4px -6px 10px rgba(120,150,220,0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            will-change: transform;
        }
        .bubble.popped { animation: popAni 0.22s ease forwards; pointer-events: none; }
        @keyframes popAni { to { transform: scale(1.7); opacity: 0; } }
        .mini-end {
            position: absolute;
            inset: 0;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255,247,238,0.88);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            text-align: center;
            padding: 16px;
        }
        .mini-end h3 { font-family: 'Fredoka', sans-serif; font-size: 1.25rem; margin: 0; }
        .combo-float {
            position: fixed;
            z-index: 90;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            pointer-events: none;
            animation: comboUp 0.7s ease-out forwards;
            text-shadow: 0 2px 6px rgba(255,255,255,0.9);
        }
        @keyframes comboUp { from { transform: translate(-50%,0) scale(0.8); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-50%,-52px) scale(1.15); opacity: 0; } }

        .overlay-root { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(60,45,70,0.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .overlay-root.open { display: flex; }
        .modal {
            width: min(88vw, 340px);
            background: rgba(255,252,248,0.97);
            border-radius: 22px;
            border: 1px solid var(--line);
            box-shadow: 0 24px 60px rgba(90,60,110,0.3);
            padding: 20px;
            text-align: center;
            animation: modalIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.3);
        }
        @keyframes modalIn { from { transform: translateY(16px) scale(0.94); opacity: 0; } }
        .modal h3 { font-family: 'Fredoka', sans-serif; margin: 0 0 6px; font-size: 1.15rem; }
        .modal p { color: var(--muted); font-size: 0.9rem; line-height: 1.55; margin: 0 0 14px; }
        .modal-btns { display: flex; gap: 8px; }
        .modal-btns button {
            flex: 1;
            min-height: 48px;
            border-radius: 16px;
            border: none;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.92rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .mb-danger { background: linear-gradient(150deg, #ffb9b9, #f08a8a); color: #7c1d1d; }
        .mb-safe { background: linear-gradient(150deg, #cff2ea, var(--teal)); color: #0f5147; }
        .mb-calm { background: rgba(120,100,140,0.1); color: var(--ink); }
        .toast-pop {
            position: fixed;
            top: calc(max(10px, env(safe-area-inset-top)) + 56px);
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: rgba(74,68,88,0.94);
            color: #fff7ee;
            padding: 10px 18px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 110;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            max-width: 88vw;
            text-align: center;
        }
        .toast-pop.show { opacity: 1; transform: translateX(-50%); }
        @media (min-width: 900px) {
            .wrap { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
            .stage-card { flex: 1 1 380px; max-width: 520px; }
            .side-col { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 899px) { .side-col { display: contents; } }
    </style>
</head>
<body>
    <header class="app-header">
        <a class="back-btn" href="../index.html#games">&#8592; Back</a>
        <div class="brand">
            <h1>Cozy Pod</h1>
            <p>your pocket buddy &mdash; feed, play, glow up</p>
        </div>
        <div class="hdr-btns">
            <button id="musicBtn" class="icon-btn" aria-label="Toggle music"><i class="fa-solid fa-music"></i></button>
            <button id="sfxBtn" class="icon-btn" aria-label="Toggle sound effects"><i class="fa-solid fa-volume-high"></i></button>
        </div>
    </header>

    <main class="wrap">
        <section class="card stage-card">
            <div class="stage-meta">
                <span class="chip"><i class="fa-solid fa-star" style="color:var(--amber)"></i><span id="status-level">Lv 1</span></span>
                <span class="chip"><span class="mood-dot" id="moodDot"></span><span id="moodChip">Happy</span></span>
                <span class="chip" style="display:none" id="streakChip"><i class="fa-solid fa-fire" style="color:#f08a3c"></i><span id="streakVal">1</span></span>
            </div>
            <div class="pet-frame" id="petFrame">
                <canvas id="petCanvas"></canvas>
                <div class="speech" id="speech">Hi there!</div>
                <div class="drag-hint">drag to spin &middot; tap to pet</div>

                <div class="mini-layer" id="miniLayer">
                    <div class="mini-hud">
                        <span class="chip">Score <b id="mgScore">0</b></span>
                        <span class="chip">Time <b id="mgTime">15</b>s</span>
                        <span class="chip" id="mgComboChip" style="visibility:hidden;color:#e46fa4">Combo x<b id="mgCombo">2</b></span>
                    </div>
                    <div class="mini-end" id="miniEnd" style="display:none">
                        <h3>Pop complete!</h3>
                        <p id="miniResult" style="margin:0;color:var(--muted);font-size:0.9rem"></p>
                        <button class="mini-btn" id="miniDone" style="min-width:140px;margin-top:6px">Collect</button>
                    </div>
                </div>
            </div>
            <div class="xp-strip">
                <div class="xp-bar"><div class="xp-fill" id="xpfill"></div></div>
                <div class="xp-label" id="xp-text">0 / 100 XP</div>
            </div>
        </section>

        <div class="side-col">
            <section class="stats-row card" style="padding:10px;">
                <div class="stat-pill s-hunger"><div class="icn">&#127822;</div><div class="val" id="val-hunger">80%</div><div class="bar"><div class="fill" id="bar-hunger" style="width:80%"></div></div></div>
                <div class="stat-pill s-happy"><div class="icn">&#128522;</div><div class="val" id="val-happy">90%</div><div class="bar"><div class="fill" id="bar-happy" style="width:90%"></div></div></div>
                <div class="stat-pill s-clean"><div class="icn">&#129529;</div><div class="val" id="val-clean">95%</div><div class="bar"><div class="fill" id="bar-clean" style="width:95%"></div></div></div>
                <div class="stat-pill s-energy"><div class="icn">&#9889;</div><div class="val" id="val-energy">80%</div><div class="bar"><div class="fill" id="bar-energy" style="width:80%"></div></div></div>
            </section>

            <section class="actions-grid">
                <button class="act-btn act-feed" id="feed"><i class="fa-solid fa-apple-whole"></i> Feed</button>
                <button class="act-btn act-play" id="play"><i class="fa-solid fa-gamepad"></i> Play</button>
                <button class="act-btn act-clean" id="clean"><i class="fa-solid fa-soap"></i> Clean</button>
                <button class="act-btn act-sleep" id="sleep"><i class="fa-solid fa-moon"></i> Sleep</button>
            </section>

            <section class="card">
                <div class="panel-title">Backpack <small>tap an item to use it</small></div>
                <div class="inv-row" id="inventory"></div>
                <div style="margin-top:9px;display:flex;justify-content:center">
                    <button class="gift-btn" id="buy-item">Open Mystery Gift (15 XP)</button>
                </div>
            </section>

            <section class="card">
                <div class="panel-title">Wardrobe <small>unlocks by level</small></div>
                <div class="skin-row" id="skin-selector"></div>
            </section>

            <section class="card foot-row">
                <span class="save-note"><i class="fa-solid fa-cloud-arrow-down"></i> auto-saves</span>
                <span style="display:flex;gap:8px;align-items:center">
                    <a class="diag-link" href="webgl_diagnostics.html">WebGL check</a>
                    <button class="mini-btn" id="save">Save</button>
                    <button class="mini-btn" id="reset">Reset</button>
                </span>
            </section>
        </div>
    </main>

    <div class="overlay-root" id="modalRoot">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <p id="modalBody"></p>
            <div class="modal-btns" id="modalBtns"></div>
        </div>
    </div>
    <div class="toast-pop" id="toastPop"></div>

                x.translate(32, 32);
                x.beginPath();
                for (var i = 0; i < 8; i++) {
                    var r = i % 2 === 0 ? 26 : 10;
                    var a = (i / 8) * Math.PI * 2;
                    x.lineTo(Math.cos(a) * r, Math.sin(a) * r);

                x.fill();

            function texCircle(colorInner, colorOuter) {
                var c = document.createElement('canvas');

                var x = c.getContext('2d');
                var g = x.createRadialGradient(32, 32, 4, 32, 32, 30);
                g.addColorStop(0, colorInner);
                g.addColorStop(1, colorOuter);
                x.fillStyle = g;
                x.beginPath();
                x.arc(32, 32, 30, 0, Math.PI * 2);
                x.fill();
                return new THREE.CanvasTexture(c);
            }
            function texZZ() {
                var c = document.createElement('canvas');

            var heartTex = null, starTex = null, bubbleTex = null, zzTex = null;

            function spawnParticle(kind, pos) {
                if (!scene) return;

                    heartTex = texHeart('#f78fb0');
                    starTex = texStar('#ffe1a0');
                    bubbleTex = texCircle('rgba(255,255,255,0.95)', 'rgba(160,200,250,0.5)');
                    zzTex = texZZ();
                }
                var map = kind === 'heart' ? heartTex : kind === 'star' ? starTex : kind === 'zz' ? zzTex : bubbleTex;
                var mat = new THREE.SpriteMaterial({ map: map, transparent: true, opacity: 0.95, depthWrite: false });
                var sp = new THREE.Sprite(mat);
                sp.scale.setScalar(kind === 'zz' ? rnd(0.5, 0.8) : rnd(0.16, 0.3));
                sp.position.copy(pos);
                sp.position.x += rnd(-0.3, 0.3);
                sp.position.z += rnd(0.1, 0.5);
                scene.add(sp);
                particlePool.push({
                    sp: sp,
                    vy: kind === 'zz' ? rnd(0.25, 0.4) : rnd(0.7, 1.3),
                    vx: rnd(-0.25, 0.25),
                    life: kind === 'zz' ? 2.4 : rnd(0.7, 1.1),
                    spin: rnd(-1.5, 1.5)

            function updateParticles(dt) {
                for (var i = particlePool.length - 1; i >= 0; i--) {
                    var p = particlePool[i];
                    p.life -= dt;
                    p.sp.position.y += p.vy * dt;
                    p.sp.position.x += Math.sin(p.sp.position.y * 6 + p.spin * 4) * 0.15 * dt;
                    p.sp.material.rotation += p.spin * dt;
                    p.sp.material.opacity = clamp(p.life * 1.4, 0, 0.95);
                    if (p.life <= 0) {

                        p.sp.material.dispose();

            function animate3d(dt) {
                anim.t += dt;
                if (!petGroup) return;
                if (anim.jumping) {
                    petGroup.position.y += anim.jumpV;
                    anim.jumpV -= 0.02;
                    if (petGroup.position.y <= 0) { petGroup.position.y = 0; anim.jumping = false; anim.jumpV = 0; }
                }
                if (anim.wiggleT > 0) {
                    anim.wiggleT -= dt;
                    petGroup.rotation.z = Math.sin(anim.t * 22) * 0.14;
                    if (anim.wiggleT <= 0) petGroup.rotation.z = 0;
                }
                anim.rotVel *= 0.92;
                if (Math.abs(anim.rotVel) > 0.001) anim.targetRotY += anim.rotVel;
                if (!dragging && Math.random() < dt * 0.25) anim.targetRotY += rnd(-0.7, 0.7);
                anim.rotY += (anim.targetRotY - anim.rotY) * 0.08;
                petGroup.rotation.y = anim.rotY;

                var mood = moodOf(state);
                var breath = Math.sin(anim.t * (isSleeping ? 1.1 : 2.1)) * 0.035;
                var squishExtra = anim.squish > 0 ? Math.sin(anim.squish * Math.PI) * 0.12 : 0;
                if (anim.squish > 0) anim.squish -= dt * 3;
                if (bodyMesh) {
                    bodyMesh.scale.y = 0.92 + breath - squishExtra * 0.5;
                    bodyMesh.scale.x = 1 + squishExtra * 0.35;
                    bodyMesh.scale.z = 0.88 + squishExtra * 0.35;
                    bodyMesh.position.y = 0.42 + breath * 0.5 - (isSleeping ? 0.12 : 0) - (mood === 'sad' ? 0.05 : 0);
                }
                if (earL && earR) {
                    var flap = Math.sin(anim.t * 2.6) * 0.06;
                    earL.rotation.z = 0.32 + flap;
                    earR.rotation.z = -0.32 - flap;
                }
                anim.blinkNext -= dt;
                var lidScale = 1;
                if (anim.blinkNext <= 0) { anim.blinkT = 0.13; anim.blinkNext = rnd(2.2, 5.5); }
                if (anim.blinkT > 0) { anim.blinkT -= dt; lidScale = 0.12; }
                if (isSleeping) lidScale = 0.1;
                petGroup.traverse(function (o) {
                    if (o.geometry && o.geometry.parameters && o.geometry.parameters.radius === 0.185) o.scale.y = lidScale;
                });
                if (mouthMesh && mouthOpen) {
                    var eating = mouthOpen.visible;
                    mouthMesh.visible = !eating;
                    if (!eating) {
                        if (mood === 'sad') { mouthMesh.rotation.z = 0; mouthMesh.scale.setScalar(0.8); }
                        else { mouthMesh.rotation.z = Math.PI; mouthMesh.scale.setScalar(mood === 'happy' ? 1.15 : 1); }
                    }
                }
                if (accessoryGroup) accessoryGroup.children.forEach(function (c) { c.rotation.y = Math.sin(anim.t * 1.4) * 0.1; });
                updateParticles(dt);
                if (dustPts) {
                    dustPts.rotation.y = anim.t * 0.02;
                    dustPts.position.y = Math.sin(anim.t * 0.5) * 0.05;

                var dayTarget = isSleeping ? 1 : 0;

                var roll = Math.random() * weights.reduce(function (a, b) { return a + b; }, 0);
                var chosen = items[0];
                for (var i = 0; i < items.length; i++) { roll -= weights[i]; if (roll <= 0) { chosen = items[i]; break; } }

            }

            var MINI = { running: false, score: 0, combo: 0, lastPop: 0, endAt: 0, spawner: null, ticker: null, bubbles: [] };
            function openMiniGame() {
                MINI.running = true;
                MINI.score = 0; MINI.combo = 0; MINI.bubbles = [];
                MINI.endAt = Date.now() + 15000;
                $('mgScore').textContent = '0';
                $('mgTime').textContent = '15';
                $('mgComboChip').style.visibility = 'hidden';
                $('miniEnd').style.display = 'none';
                $('miniLayer').classList.add('open');
                sfxBoing();
                MINI.spawner = setInterval(spawnBubble, 420);
                spawnBubble(); spawnBubble();
                MINI.ticker = setInterval(miniTick, 200);
            }
            function miniTick() {
                var remainMs = MINI.endAt - Date.now();
                $('mgTime').textContent = Math.max(0, Math.ceil(remainMs / 1000));
                var layer = $('miniLayer');
                MINI.bubbles.forEach(function (b) {
                    if (b.dead) return;
                    b.y -= b.speed;
                    b.x += Math.sin((Date.now() / 700) + b.phase) * 0.35;
                    b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
                    if (b.y < -70) removeBubble(b, false);
                });
                if (remainMs <= 0) closeMiniGame(true);
            }
            function spawnBubble() {
                if (!MINI.running) return;
                var layer = $('miniLayer');
                var r = layer.getBoundingClientRect();
                var size = irnd(36, 64);
                var el = document.createElement('div');
                el.className = 'bubble';
                el.style.width = el.style.height = size + 'px';
                el.textContent = pick(['&#127822;', '&#11088;', '&#128142;', '&#129371;', '&#129529;', '']);
                var startX = rnd(6, Math.max(10, r.width - size - 6));
                var b = {
                    el: el, size: size,
                    x: startX, y: r.height + 10,
                    speed: rnd(1.1, 2.2) * (46 / size),
                    phase: rnd(0, 6.28),
                    dead: false
                };
                el.addEventListener('pointerdown', function (ev) {
                    ev.stopPropagation();
                    popBubble(b);
                });
                layer.appendChild(el);
                MINI.bubbles.push(b);
            }
            function popBubble(b) {
                if (b.dead || !MINI.running) return;
                b.dead = true;
                var now = Date.now();
                MINI.combo = (now - MINI.lastPop < 1200) ? MINI.combo + 1 : 1;
                MINI.lastPop = now;
                MINI.score += MINI.combo;
                $('mgScore').textContent = MINI.score;
                if (MINI.combo >= 2) {
                    $('mgComboChip').style.visibility = 'visible';
                    $('mgCombo').textContent = MINI.combo;
                    floatTextAt(b.el, 'x' + MINI.combo);
                }
                state.bestCombo = Math.max(state.bestCombo || 0, MINI.combo);
                sfxPop(MINI.combo);
                b.el.classList.add('popped');
                var self = b;
                setTimeout(function () { removeBubble(self, true); }, 230);
            }
            function floatTextAt(el, txt) {
                var r = el.getBoundingClientRect();
                var f = document.createElement('div');
                f.className = 'combo-float';
                f.textContent = txt;
                f.style.left = (r.left + r.width / 2) + 'px';
                f.style.top = r.top + 'px';
                f.style.color = '#e46fa4';
                f.style.fontSize = '1rem';
                document.body.appendChild(f);
                setTimeout(function () { if (f.parentElement) f.parentElement.removeChild(f); }, 720);
            }
            function removeBubble(b, wasPopped) {
                if (b.el.parentElement) b.el.parentElement.removeChild(b.el);
                var idx = MINI.bubbles.indexOf(b);
                if (idx >= 0) MINI.bubbles.splice(idx, 1);
            }
            function closeMiniGame(auto) {
                if (!MINI.running) return;
                MINI.running = false;
                clearInterval(MINI.spawner);
                clearInterval(MINI.ticker);
                MINI.bubbles.forEach(function (b) { if (b.el.parentElement) b.el.parentElement.removeChild(b.el); });
                MINI.bubbles = [];
                var rewards = computeRewards(MINI.score);
                state.bestBubble = Math.max(state.bestBubble || 0, MINI.score);
                var bestMark = MINI.score >= (state.bestBubble || 0) && MINI.score > 0;
                $('miniResult').textContent = 'Score ' + MINI.score +
                    (bestMark ? ' — new best!' : ' (best ' + state.bestBubble + ')') +
                    ' | +' + rewards.happy + '% happy, +' + rewards.xp + ' XP' +
                    (rewards.drop ? ', loot: ' + rewards.drop : '');
                $('miniEnd').style.display = 'flex';
                MINI.pendingRewards = rewards;
            }
            $('miniDone').addEventListener('click', function () {
                $('miniLayer').classList.remove('open');
                var rw = MINI.pendingRewards || { happy: 10, xp: 10, drop: null };
                MINI.pendingRewards = null;
                finishPlay(rw);
            });

            function renderStats() {
                var vals = {
                    hunger: Math.round(clamp(state.hunger, 0, 100)),
                    happy: Math.round(clamp(state.happy, 0, 100)),
                    clean: Math.round(clamp(state.clean, 0, 100)),
                    energy: Math.round(clamp(state.energy, 0, 100))
                };
                EL.hunger.textContent = vals.hunger + '%';
                EL.happy.textContent = vals.happy + '%';
                EL.clean.textContent = vals.clean + '%';
                EL.energy.textContent = vals.energy + '%';
                EL.barH.style.width = vals.hunger + '%';
                EL.barHa.style.width = vals.happy + '%';
                EL.barC.style.width = vals.clean + '%';
                EL.barE.style.width = vals.energy + '%';
                var cap = levelXp(state.level);
                EL.xpfill.style.width = clamp(Math.round(100 * state.xp / cap), 0, 100) + '%';
                EL.xptext.textContent = Math.floor(state.xp) + ' / ' + cap + ' XP';
                EL.level.textContent = 'Lv ' + state.level;
                var m = moodOf(state);
                var moodInfo = { happy: ['#57d98a', 'Happy'], ok: ['#f6b26b', 'Chill'], sad: ['#f08a8a', 'Glum'], sleepy: ['#85b8f0', 'Sleepy'] }[m];
                EL.moodDot.style.background = moodInfo[0];
                EL.moodDot.style.color = moodInfo[0];
                EL.moodChip.textContent = isSleeping ? 'Dreaming' : moodInfo[1];
                if ((state.streak || 0) > 1) {
                    EL.streakChip.style.display = 'inline-flex';
                    EL.streakVal.textContent = state.streak + 'd';
                } else EL.streakChip.style.display = 'none';
                renderInventory();
                renderSkins();
                applyLevelScale();
            }
            var ITEM_META = {
                apple: { icon: '&#127822;', label: 'apple' },
                toy: { icon: '&#129525;', label: 'toy' },
                soap: { icon: '&#129529;', label: 'soap' },
                cake: { icon: '&#127856;', label: 'cake' },
                gem: { icon: '&#128142;', label: 'gem' }
            };
            function renderInventory() {
                EL.invRow.innerHTML = '';
                Object.keys(ITEM_META).forEach(function (key) {
                    var count = state.items[key] || 0;
                    var chip = document.createElement('button');
                    chip.className = 'item-chip' + (count <= 0 ? ' zero' : '');
                    chip.innerHTML = '<span>' + ITEM_META[key].icon + '</span><span class="cnt">' + count + '</span>';
                    chip.title = 'Use ' + ITEM_META[key].label;
                    chip.addEventListener('click', function () { ensureAudio(); useItem(key); });
                    EL.invRow.appendChild(chip);
                });
                var gift = document.createElement('button');
                gift.className = 'gift-btn';
                gift.textContent = 'Mystery Gift (15 XP)';
                gift.addEventListener('click', function () { ensureAudio(); buyGift(); });
                EL.invRow.appendChild(gift);
            }
            function renderSkins() {
                EL.skinRow.innerHTML = '';
                SKINS.forEach(function (skin) {
                    var btn = document.createElement('button');
                    btn.className = 'skin-dot';
                    btn.style.background = 'radial-gradient(circle at 34% 30%, #ffffffcc, ' + hex(skin.color) + ' 55%)';
                    var unlocked = state.level >= skin.unlockLevel;
                    var active = state.skin === skin.id;
                    if (active) btn.classList.add('sel');
                    if (!unlocked) {
                        btn.classList.add('locked');
                        btn.innerHTML = '<span class="lk">Lv' + skin.unlockLevel + '</span>';
                    }
                    btn.title = skin.name + ' (Lv ' + skin.unlockLevel + ')';
                    btn.addEventListener('click', function () {
                        ensureAudio();
                        if (!unlocked) { toast('Reach Lv ' + skin.unlockLevel + ' to unlock ' + skin.name + '.'); sfxSad(); return; }
                        state.skin = skin.id;
                        buildPet(skin.id);
                        sfxGift();
                        say('New fur, who dis? ' + skin.name + ' mode!');
                        renderStats();
                        saveState();
                    });
                    EL.skinRow.appendChild(btn);
                });
            }

            function applyOfflineProgress(nowTs) {
                if (!state.lastSeen) { state.lastSeen = nowTs; return null; }
                var elapsed = clamp((nowTs - state.lastSeen) / 1000, 0, 86400);
                if (elapsed < 90) { state.lastSeen = nowTs; return null; }
                var hours = elapsed / 3600;
                var before = { hunger: state.hunger, happy: state.happy, clean: state.clean, energy: state.energy };
                state.hunger = clamp(state.hunger - hours * 5, 8, 100);
                state.happy = clamp(state.happy - hours * 3.4, 8, 100);
                state.clean = clamp(state.clean - hours * 2, 8, 100);
                state.energy = clamp(state.energy - hours * 2.2, 8, 100);
                state.lastSeen = nowTs;
                return {
                    seconds: elapsed,
                    hunger: Math.round(before.hunger - state.hunger),
                    happy: Math.round(before.happy - state.happy),
                    clean: Math.round(before.clean - state.clean),
                    energy: Math.round(before.energy - state.energy)
                };
            }
            function dayKey(ts) {
                var d = new Date(ts);
                return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
            }
            function grantStreak(nowTs) {
                var today = dayKey(nowTs);
                var yesterday = dayKey(nowTs - 86400000);
                if (state.lastDay === today) return null;
                if (state.lastDay === yesterday) {
                    state.streak = (state.streak || 0) + 1;
                } else {
                    state.streak = 1;
                }
                state.lastDay = today;
                var bonusMult = Math.min(state.streak, 7);
                state.items.apple++;
                state.items.soap++;
                var bonusXp = 15 * bonusMult;
                state.xp += bonusXp;
                giveXp(0);
                checkAch();
                return { streak: state.streak, xp: bonusXp };
            }

            decayTimer = setInterval(function () {
                if (document.hidden) return;
                if (isSleeping) {
                    state.energy = clamp(state.energy + 2.4, 0, 100);
                    if (state.energy >= 100) setSleep(false);
                } else {
                    state.hunger = clamp(state.hunger - 0.22 - state.level * 0.012, 0, 100);
                    state.happy = clamp(state.happy - 0.09, 0, 100);
                    state.clean = clamp(state.clean - 0.055, 0, 100);
                    state.energy = clamp(state.energy - 0.05, 0, 100);
                    if (state.hunger < 25) state.happy = clamp(state.happy - 0.14, 0, 100);
                    if (state.clean < 20) state.happy = clamp(state.happy - 0.1, 0, 100);
                }
                renderStats();
            }, 4000);

            setInterval(saveState, 20000);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) saveState();
                else { resizeRenderer(); lastFrame = performance.now(); }
            });

            $('feed').addEventListener('click', function () { ensureAudio(); startMusicIfOn(); actionFeed(); });
            $('play').addEventListener('click', function () { ensureAudio(); startMusicIfOn(); actionPlay(); });
            $('clean').addEventListener('click', function () { ensureAudio(); startMusicIfOn(); actionClean(); });
            $('sleep').addEventListener('click', function () { startMusicIfOn(); toggleSleep(); });
            $('save').addEventListener('click', function () { saveState(); toast('Saved!'); });
            $('reset').addEventListener('click', function () {
                showModal('Reset buddy?', 'This erases your pod, levels, items and streak forever. There are no take-backs, only snacks lost.',
                    [{ label: 'Keep', cls: 'mb-calm', cb: closeModal },
                     { label: 'Reset', cls: 'mb-danger', cb: function () {
                        try { localStorage.removeItem(KEY_V3); localStorage.removeItem(KEY_V2); } catch (e) {}
                        state = migrate(null);
                        isSleeping = false;
                        buildPet(state.skin);
                        renderStats();
                        closeModal();
                        toast('Fresh start! Say hi again.');
                        speak('Hi! I am new here. Feed me things.');
                     } }]);
            });
            $('musicBtn').addEventListener('click', function () {
                ensureAudio();
                mutedMusic = !mutedMusic;
                $('musicBtn').classList.toggle('off', mutedMusic);
                try { localStorage.setItem('tama_music_off', mutedMusic ? '1' : '0'); } catch (e) {}
                if (masterMusic) masterMusic.gain.value = mutedMusic ? 0 : 0.5;
                if (mutedMusic) stopMusic();
                else { startMusic(); toast('Lo-fi radio: on'); }
            });
            $('sfxBtn').addEventListener('click', function () {
                ensureAudio();
                mutedSfx = !mutedSfx;
                $('sfxBtn').classList.toggle('off', mutedSfx);
                try { localStorage.setItem('tama_sfx_off', mutedSfx ? '1' : '0'); } catch (e) {}
                if (masterSfx) masterSfx.gain.value = mutedSfx ? 0 : 0.9;
                if (!mutedSfx) sfxClick();
            });
            function sfxClick() { tone(430, 0.05, 'square', 0.05); }
            function startMusicIfOn() {
                if (!mutedMusic) startMusic();
            }

            var modalRoot = $('modalRoot');
            function showModal(title, body, buttons) {
                $('modalTitle').textContent = title;
                $('modalBody').textContent = body;
                var box = $('modalBtns');
                box.innerHTML = '';
                buttons.forEach(function (b) {
                    var btn = document.createElement('button');
                    btn.className = b.cls;
                    btn.textContent = b.label;
                    btn.addEventListener('click', function () { ensureAudio(); b.cb(); });
                    box.appendChild(btn);
                });
                modalRoot.classList.add('open');
            }
            function closeModal() { modalRoot.classList.remove('open'); }

            document.addEventListener('pointerdown', function () {
                ensureAudio();
                startMusicIfOn();
            }, { once: true });

            var lastFrame = performance.now();
            var rafRunning = true;
            function mainLoop(now) {
                requestAnimationFrame(mainLoop);
                if (!rafRunning) { lastFrame = now; return; }
                var dt = clamp((now - lastFrame) / 1000, 0.001, 0.06);
                lastFrame = now;
                if (webglAvailable && renderer) {
                    animate3d(dt);
                    renderer.render(scene, camera);
                }
            }
            requestAnimationFrame(mainLoop);

            window.addEventListener('resize', resizeRenderer);
            window.addEventListener('orientationchange', function () { setTimeout(resizeRenderer, 180); });
            if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeRenderer);

            var eventTimer = setInterval(function () {
                if (!document.hidden && Math.random() < 0.5) ambientChat();
            }, 60000);

            buildBoard2();
            function buildBoard2() {
                bindPointer();
                if (webglAvailable) initThree();
                else makeFallbackPet();
                buildPet(state.skin);
                var recap = applyOfflineProgress(nowMs());
                var gift = grantStreak(nowMs());
                if (recap) {
                    setTimeout(function () {
                        showModal('While you were away...', 'Your buddy kept cozy alone for about ' +
                            Math.max(1, Math.round(recap.seconds / 360)) / 10 + 'h.' +
                            (recap.hunger > 0 ? ' Hunger -' + recap.hunger + '%.' : '') +
                            (recap.happy > 0 ? ' Mood -' + recap.happy + '%.' : '') +
                            ' It napped a little and missed you.',
                            [{ label: 'Say hi', cls: 'mb-safe', cb: function () { closeModal(); speak(pick(['You are BACK! I counted every second.', 'Finally! The fridge was judging me.', 'I saved you so many hugs.'])); } }]);
                    }, 600);
                }
                if (gift && gift.streak > 1) {
                    setTimeout(function () {
                        toast('Daily streak ' + gift.streak + '! +' + gift.xp + ' XP & supplies');
                        sfxGift();
                    }, recap ? 3600 : 900);
                }
                $('musicBtn').classList.toggle('off', mutedMusic);
                $('sfxBtn').classList.toggle('off', mutedSfx);
                renderStats();
                checkAch();
                setTimeout(function () {
                    speak(pick(['Welcome back to the cozy zone.', 'Hi! I was practicing being adorable.', 'Feed me? Play with me? Both? Both.']), 3200);
                }, 400);
            }

            window.__tama = {
                get state() { return state; },
                migrate: migrate,
                applyOffline: applyOfflineProgress,
                grantStreak: grantStreak,
                dayKey: dayKey,
                computeRewards: computeRewards,
                QUIPS: QUIPS,
                fmtLine: fmtLine,
                moodOf: moodOf,
                checkAch: checkAch,
                levelXp: levelXp,
                ACH: ACH,
                useItem: useItem,
                buyGift: buyGift,
                actionFeed: actionFeed,
                isWebGL: function () { return webglAvailable; }
            };
        })();
    </script>
</body>
</html>
