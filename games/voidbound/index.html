<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a2e">
<meta name="description" content="MOBA arena 5v5 in un universo grimdark spaziale. Combatti la Fauci dell'Ætere!">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>VOIDBOUND — Rites of the Rift</title>
</head>
<body>
<canvas id="game"></canvas>

<div id="rotate-overlay">
  <div class="rotate-icon">⟲</div>
  Ruota il dispositivo in orizzontale per giocare
</div>

<div id="menu">
  <div class="menu-title">VOIDBOUND</div>
  <div class="menu-sub">Rites of the Rift</div>
  <div class="menu-label">Scegli il tuo campione</div>
  <div id="roster-picker"></div>
  <button id="start-btn" onclick="start_game()">INIZIA IL RITO</button>
  <div class="menu-label" style="margin-top:16px;color:#555;font-size:10px">
    WASD / Joystick: muovi &nbsp;|&nbsp; J / ⚔: attacco &nbsp;|&nbsp; K/L: abilità &nbsp;|&nbsp; U: ultimate &nbsp;|&nbsp; E: consacra
  </div>
</div>

<div id="controls-overlay" class="hidden">
  <div class="joystick-area"></div>
  <div id="joystick-base" class="hidden"></div>
  <div id="joystick-knob" class="hidden"></div>
  <button id="btn-atk" class="ability-btn"><span class="cd-ring" id="cd-atk"></span>⚔</button>
  <button id="btn-ab1" class="ability-btn"><span class="cd-ring" id="cd-ab1"></span>Q</button>
  <button id="btn-ab2" class="ability-btn"><span class="cd-ring" id="cd-ab2"></span>W</button>
  <button id="btn-ult" class="ability-btn"><span class="cd-ring" id="cd-ult"></span>R</button>
  <button id="btn-chan" class="ability-btn"><span class="cd-ring" id="cd-chan"></span>✦</button>
</div>

<div id="event-toast"></div>

<script src="./js/data.js"></script>
<script src="./js/sprites.js"></script>
<script src="./js/game.js"></script>
<script src="./js/ai.js"></script>
<script src="./js/render.js"></script>
<script src="./js/main.js"></script>
<script>
(function(){
  function checkOrientation(){
    var ov=document.getElementById('rotate-overlay');
    if(!ov)return;
    if(window.innerHeight>window.innerWidth*1.1){ov.classList.remove('hidden');}
    else{ov.classList.add('hidden');}
  }
  window.addEventListener('resize',checkOrientation);
  window.addEventListener('orientationchange',checkOrientation);
  checkOrientation();
})();
</script>
</body>
</html>
