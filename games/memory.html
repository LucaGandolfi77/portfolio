<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Memory — Match pairs and exercise your brain — Luca Gandolfi's Portfolio">
    <meta name="keywords" content="memory, game, brain, pairs">
    <meta name="author" content="Luca Gandolfi">
    <title>Memory — Luca Gandolfi</title>
    
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Default dark theme */
        body { background: #0b1220; color: #e6eef8; }

        .memory-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .memory-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .memory-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .memory-subtitle {
            color: #a0c0e0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #a0c0e0;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-board {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.08), rgba(124, 58, 237, 0.08));
            border: 2px solid rgba(167, 139, 250, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(124, 58, 237, 0.2));
            border: 2px solid rgba(167, 139, 250, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            position: relative;
            perspective: 1000px;
            user-select: none;
        }

        .card:hover:not(.matched):not(.flipped) {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.3), rgba(124, 58, 237, 0.3));
            border-color: rgba(167, 139, 250, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.2);
        }

        .card.flipped {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.4), rgba(124, 58, 237, 0.4));
            border-color: rgba(167, 139, 250, 0.6);
            box-shadow: inset 0 0 10px rgba(167, 139, 250, 0.3);
        }

        .card.matched {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 212, 255, 0.2));
            border-color: rgba(0, 255, 136, 0.4);
            cursor: default;
            animation: matchPulse 0.5s ease;
        }

        .card-inner {
            opacity: 0;
            font-size: 0;
            transition: all 0.3s ease;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            opacity: 1;
            font-size: 2rem;
        }

        .card-back {
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .card.flipped .card-back,
        .card.matched .card-back {
            opacity: 0;
            font-size: 0;
        }

        @keyframes matchPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .game-message {
            text-align: center;
            padding: 20px;
            background: rgba(167, 139, 250, 0.08);
            border: 2px solid rgba(167, 139, 250, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0c0e0;
            font-weight: 600;
        }

        .game-message.game-won {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .game-message.game-success {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .game-message.game-error {
            background: rgba(255, 77, 77, 0.1);
            border-color: rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
        }

        .game-message.playing {
            background: rgba(167, 139, 250, 0.1);
            border-color: rgba(167, 139, 250, 0.3);
            color: #a78bfa;
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0.8; }
            to { transform: scale(1); opacity: 1; }
        }

        .difficulty-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(167, 139, 250, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .difficulty-label {
            color: #a0c0e0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #a0c0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border-color: #a78bfa;
            color: #0a1428;
        }

        .difficulty-btn:hover {
            border-color: rgba(167, 139, 250, 0.5);
        }

        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-game {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-game-primary {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            color: #0a1428;
        }

        .btn-game-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(167, 139, 250, 0.3);
        }

        .btn-game-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-game-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0c0e0;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            color: #a78bfa;
            transform: translateX(-4px);
        }

        @media (max-width: 600px) {
            .memory-container {
                padding: 20px 15px;
            }

            .memory-title {
                font-size: 1.8rem;
            }

            .game-stats {
                gap: 20px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .card {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="lang-top-left" aria-hidden="false">
        <label for="langSelect" class="visually-hidden">Select language</label>
        <select id="langSelect" aria-label="Select language" title="Change language">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 中</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 日本</option>
            <option value="sv">🇸🇪 SV</option>
            <option value="ar">🇸🇦 AR</option>
            <option value="he">🇮🇱 HE</option>
        </select>
    </div>

    <div class="particles" id="particles"></div>

    <div class="memory-container">
        <a href="../index.html#games" class="back-button">← <span data-i18n="games.memory.back">Back to Games</span></a>

        <div class="memory-header">
            <h1 class="memory-title">🧠 <span data-i18n="games.memory.gameTitle">Memory</span></h1>
            <p class="memory-subtitle" data-i18n="games.memory.gameSubtitle">Find matching pairs</p>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.memory.pairs">Pairs Found</div>
                <div class="stat-value" id="pairsFound">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.memory.moves">Moves</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.memory.bestMoves">Best</div>
                <div class="stat-value" id="bestMoves">—</div>
            </div>
        </div>

        <div class="difficulty-selector">
            <div class="difficulty-label" data-i18n="games.memory.difficulty">Difficulty</div>
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" data-size="4" data-i18n="games.memory.easy">Easy 4x4</button>
                <button class="difficulty-btn" data-size="6" data-i18n="games.memory.medium">Medium 4x6</button>
                <button class="difficulty-btn" data-size="8" data-i18n="games.memory.hard">Hard 4x8</button>
            </div>
        </div>

        <div class="game-message playing" id="gameMessage" data-i18n="games.memory.startMessage">Click cards to find matching pairs</div>

        <div class="game-board">
            <div class="cards-grid" id="cardsGrid">
                <!-- Cards generated by JS -->
            </div>
        </div>

        <div class="game-controls">
            <button class="btn-game btn-game-primary" id="newGameBtn" data-i18n="games.memory.newGame">New Game</button>
            <button class="btn-game btn-game-secondary" id="resetStatsBtn" data-i18n="games.memory.resetStats">Reset Stats</button>
        </div>
    </div>

    <script>
        const EMOJIS = ['🎨', '🎭', '🎪', '🎬', '🎤', '🎸', '🎹', '🎺', '🎻', '🥁', '📚', '🎓', '⚽', '🏀', '🎾', '🏐'];

        let cards = [];
        let flipped = [];
        let matched = 0;
        let moves = 0;
        let bestMoves = localStorage.getItem('memory_bestMoves') || null;
        let gridSize = 4;
        let gameActive = true;

        function updateStats() {
            document.getElementById('pairsFound').textContent = matched;
            document.getElementById('moves').textContent = moves;
            document.getElementById('bestMoves').textContent = bestMoves || '—';
        }

        function getGridConfig(size) {
            if (size === 4) return { cols: 4, pairs: 8 };
            if (size === 6) return { cols: 4, pairs: 12 };
            if (size === 8) return { cols: 4, pairs: 16 };
        }

        function createGame(size) {
            const config = getGridConfig(size);
            gridSize = size;
            cards = [];
            flipped = [];
            matched = 0;
            moves = 0;
            gameActive = true;

            // Create pairs
            const gameEmojis = EMOJIS.slice(0, config.pairs);
            const cardList = [...gameEmojis, ...gameEmojis];

            // Shuffle
            for (let i = cardList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardList[i], cardList[j]] = [cardList[j], cardList[i]];
            }

            // Create card objects
            cards = cardList.map((emoji, index) => ({
                id: index,
                emoji: emoji,
                matched: false,
                flipped: false
            }));

            renderCards();
            updateStats();
            updateMessage('games.memory.startMessage');
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            cards.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                if (card.flipped) cardEl.classList.add('flipped');
                if (card.matched) cardEl.classList.add('matched');

                cardEl.innerHTML = `
                    <div class="card-inner">${card.emoji}</div>
                    <div class="card-back">?</div>
                `;

                cardEl.addEventListener('click', () => flipCard(card.id));
                grid.appendChild(cardEl);
            });
        }

        function flipCard(id) {
            if (!gameActive || flipped.length >= 2) return;

            const card = cards[id];
            if (card.flipped || card.matched) return;

            card.flipped = true;
            flipped.push(id);

            renderCards();

            if (flipped.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            gameActive = false;
            const [id1, id2] = flipped;
            const card1 = cards[id1];
            const card2 = cards[id2];

            moves++;

            setTimeout(() => {
                if (card1.emoji === card2.emoji) {
                    // Match!
                    card1.matched = true;
                    card2.matched = true;
                    matched++;
                    updateMessage('games.memory.matched', 'success');

                    if (matched === cards.length / 2) {
                        // Game won!
                        gameActive = false;
                        if (!bestMoves || moves < bestMoves) {
                            bestMoves = moves;
                            localStorage.setItem('memory_bestMoves', bestMoves);
                        }
                        updateMessage('games.memory.won', 'won');
                    } else {
                        gameActive = true;
                    }
                } else {
                    // No match
                    card1.flipped = false;
                    card2.flipped = false;
                    gameActive = true;
                    updateMessage('games.memory.tryAgain', 'error');
                }

                flipped = [];
                renderCards();
                updateStats();
            }, 1000);
        }

        function newGame() {
            createGame(gridSize);
        }

        function resetStats() {
            if (confirm(getTranslation('games.memory.confirmReset'))) {
                bestMoves = null;
                localStorage.removeItem('memory_bestMoves');
                updateStats();
            }
        }

        function updateMessage(key, type = 'neutral') {
            const msgEl = document.getElementById('gameMessage');
            let text = getTranslation(key);
            
            // Fallback for tryAgain if not in json
            if (key === 'games.memory.tryAgain' && text === key) {
                 const lang = localStorage.getItem('language') || 'en';
                 const fallbacks = {
                     'en': 'Try again!',
                     'it': 'Riprova!',
                     'es': '¡Inténtalo de nuevo!',
                     'fr': 'Réessayez !',
                     'de': 'Versuch es noch einmal!'
                 };
                 text = fallbacks[lang] || 'Try again!';
            }

            // Add emojis based on type
            if (type === 'success') text = "✨ " + text + " ✨";
            if (type === 'error') text = "❌ " + text;
            if (type === 'won') text = "🏆 " + text + " 🏆";

            msgEl.textContent = text;
            
            // Animation
            msgEl.style.animation = 'none';
            msgEl.offsetHeight; /* trigger reflow */
            msgEl.style.animation = 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            msgEl.className = 'game-message';
            if (type === 'won') msgEl.classList.add('game-won');
            else if (type === 'success') msgEl.classList.add('game-success');
            else if (type === 'error') msgEl.classList.add('game-error');
            else msgEl.classList.add('playing');
        }

        function getTranslation(key) {
            const lang = localStorage.getItem('language') || 'en';
            const translations = window.i18nData?.[lang] || window.i18nData?.en || {};

            const keys = key.split('.');
            let value = translations;
            for (const k of keys) {
                value = value?.[k];
            }
            return value || key;
        }

        // i18n initialization
        let currentLang = localStorage.getItem('language') || 'en';

        async function loadI18n() {
            try {
                const response = await fetch(`./i18n/${currentLang}.json`);
                window.i18nData = await response.json();
                applyTranslations();
            } catch (error) {
                console.error('Failed to load i18n:', error);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                const text = getTranslation(key);
                if (text && text !== key) {
                    el.textContent = text;
                }
            });
        }

        // Event listeners
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('language', currentLang);
            loadI18n();
        });

        document.getElementById('newGameBtn').addEventListener('click', newGame);
        document.getElementById('resetStatsBtn').addEventListener('click', resetStats);

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                createGame(parseInt(btn.dataset.size));
            });
        });

        // Initialize
        document.getElementById('langSelect').value = currentLang;
        loadI18n();
        createGame(gridSize);
    </script>
</body>
</html>
