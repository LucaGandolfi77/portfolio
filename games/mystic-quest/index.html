<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a0a2e">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Mystic Quest — guide Luma through five realms, collect stars and free spirits. An offline, mobile-first PWA with liquid glass UI.">
<title>Mystic Quest — Sky Herd Rescue</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/games/mystic-quest/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../../projects/_shared/tokens.css">
<link rel="stylesheet" href="../../projects/_shared/base.css">
<link rel="stylesheet" href="../../projects/_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="Mystic Quest" data-id="mystic-quest"
  data-back="../../games.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<div id="app">
  <canvas id="gameCanvas" aria-label="Game world"></canvas>

  <div class="hud hidden" id="hud">
    <div class="hud-top glass">
      <div class="stat"><span class="star">★</span><b id="starCount">0/15</b></div>
      <div class="stat"><span>👻</span><b id="spiritCount">0/5</b></div>
      <div class="realm" id="realmName">—</div>
      <button class="round" id="btnPause" type="button" aria-label="Pause">⏸</button>
    </div>
    <div class="charge-wrap hidden" id="chargeWrap">
      <span data-i18n="calm">Calma lo spirito</span>
      <div class="charge"><i id="chargeFill"></i></div>
    </div>
    <button class="lantern" id="lanternBtn" type="button" data-act="lantern">
      <span>🏮</span><small data-i18n="hold">Tieni premuto</small>
    </button>
    <div class="hint" data-i18n="tap">Tocca per muoverti</div>
  </div>

  <div class="dialogue glass" id="dialogue" role="status" aria-live="polite">
    <b id="dialogueName">Luma</b>
    <p id="dialogueText"></p>
    <span class="dialogue-next">▼</span>
  </div>

  <div class="menu" id="menu">
    <div class="menu-card glass">
      <div class="hero-icon">✨</div>
      <h1 data-i18n="title">MYSTIC QUEST</h1>
      <p data-i18n="tagline">Riporta la luce nel cielo</p>
      <div class="menu-buttons">
        <button class="tbtn primary big" id="btnContinue" type="button" data-i18n="continue">Continua</button>
        <button class="tbtn wide" id="btnNew" type="button" data-i18n="newGame">Nuova avventura</button>
        <div class="btn-row">
          <button class="tbtn" id="btnRealms" type="button">🗺 <span data-i18n="realms">Regni</span></button>
          <button class="tbtn" id="btnJournal" type="button">📖 <span data-i18n="journal">Diario</span></button>
          <button class="tbtn" id="btnSettings" type="button">⚙</button>
          <button class="tbtn" id="btnHelp" type="button">?</button>
          <button class="tbtn" id="btnLang" type="button" data-i18n="lang">IT / EN</button>
          <button class="tbtn" id="btnTheme" type="button" data-i18n="theme">Tema</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
</div>

<div class="modal" id="realmsModal" role="dialog" aria-modal="true">
  <div class="glass modal-box wide-box">
    <h2>🗺 <span data-i18n="realms">Regni</span></h2>
    <div id="realmsList"></div>
    <button class="tbtn big wide" type="button" data-close="realmsModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="journalModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>📖 <span data-i18n="journal">Diario</span></h2>
    <div id="objectives"></div>
    <div id="journalList"></div>
    <button class="tbtn big wide" type="button" data-close="journalModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>⚙ <span data-i18n="settings">Impostazioni</span></h2>
    <label class="check"><input type="checkbox" id="soundCheck" checked> <span data-i18n="sound">Suono</span></label>
    <label class="check"><input type="checkbox" id="vibrateCheck" checked> <span data-i18n="vibration">Vibrazione</span></label>
    <label class="check"><input type="checkbox" id="motionCheck"> <span data-i18n="motion">Effetti ridotti</span></label>
    <div class="fld"><span data-i18n="quality">Qualità</span>
      <div class="chips"><button class="chip" data-quality="low" data-i18n="low">Bassa</button><button class="chip on" data-quality="high" data-i18n="high">Alta</button></div>
    </div>
    <button class="tbtn danger wide" id="btnDeleteSave" type="button" data-i18n="reset">Cancella partita</button>
    <button class="tbtn big wide" type="button" data-close="settingsModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="helpModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>📖 <span data-i18n="help">Guida</span></h2>
    <p id="helpText"></p>
    <button class="tbtn big wide" type="button" data-close="helpModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="pauseModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>⏸ <span data-i18n="pause">Pausa</span></h2>
    <button class="tbtn big wide" id="btnResume" type="button" data-i18n="resume">Riprendi</button>
    <button class="tbtn wide" id="btnRestart" type="button" data-i18n="restart">Ricomincia</button>
    <button class="tbtn wide" id="btnQuit" type="button" data-i18n="menu">Menu</button>
  </div>
</div>

<div class="modal" id="endModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2 id="endTitle">—</h2>
    <p id="endBody"></p>
    <button class="tbtn big wide" id="btnEnd" type="button" data-i18n="menu">Menu</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../../projects/_shared/shell.js" defer></script>
</body>
</html>
