<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="2; url=./index.html">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Tower Defense: cinque modalità, sette torri e nemici sempre più pericolosi.">
  <title>Tower Defense — caricamento…</title>
  <link rel="icon" href="./tower-defense/icon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; min-height: 100%; background: #070d16; color: #e8f2ff; font-family: Inter, system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; }
    .box { padding: 40px; }
    .mark { font-size: 46px; animation: pulse 1.2s ease-in-out infinite; }
    h1 { margin: 14px 0 4px; font-size: 22px; letter-spacing: .06em; color: #38bdf8; }
    p { color: #8ea8c4; font-size: 13px; }
    a { color: #38bdf8; }
    @keyframes pulse { 50% { transform: scale(1.08); filter: brightness(1.3); } }
  </style>
    <link rel="manifest" href="./legacy-tower_defense.webmanifest">
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="box">
    <div class="mark">🛡️</div>
    <h1>TOWER DEFENSE</h1>
    <p>Caricamento del gioco…</p>
    <p>Se non parte, <a href="./index.html">clicca qui</a>.</p>
  </main>
  <script>
(function () {
  var target = './index.html' + location.search;
  function go() { location.replace(target); }
  if (!('serviceWorker' in navigator)) { go(); return; }
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    return Promise.all(regs.filter(function (r) { return /tower_defense(?:-sw|_sw)\.js$/.test(r.scriptURL); }).map(function (r) { return r.unregister(); }));
  }).catch(function () {}).then(function () {
    return navigator.serviceWorker.register('./legacy-tower_defense-sw.js', { scope: './legacy-tower_defense.html' });
  }).catch(function () {}).then(go);
})();
</script>
</body>
</html>
