<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2036"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="6"/>

  <!-- Scudo -->
  <path d="M256 78 L392 128 V258 C392 342 332 404 256 438 C180 404 120 342 120 258 V128 Z"
        fill="#0f2740" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Torre -->
  <g filter="url(#glow)">
    <rect x="222" y="214" width="68" height="112" rx="12" fill="#38bdf8"/>
    <rect x="212" y="198" width="88" height="30" rx="8" fill="#7dd3fc"/>
    <path d="M256 198 L256 138" stroke="#a78bfa" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Merli -->
  <rect x="222" y="182" width="16" height="22" rx="4" fill="#e0f2fe"/>
  <rect x="274" y="182" width="16" height="22" rx="4" fill="#e0f2fe"/>

  <!-- Base -->
  <path d="M196 326 H316 L332 356 H180 Z" fill="#1e4a6b"/>
</svg>
