<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tower Defense">
  <meta name="description" content="Tower Defense: cinque modalità, sette torri e nemici sempre più pericolosi. Un gioco installabile e completamente offline.">
  <title>Tower Defense — Luca Gandolfi</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../../games.html" aria-label="Torna ai giochi">
        <span class="brand-mark">🛡️</span>
        <span class="brand-text">TOWER<span>DEFENSE</span></span>
      </a>
      <div class="top-actions">
        <a class="tb" href="../../games.html" data-i18n="nav.games">🎮 Giochi</a>
        <a class="tb" href="../index.html" data-i18n="nav.home">← Home</a>
        <button class="tb" id="langBtn" type="button" aria-label="Lingua / Language">IT / EN</button>
        <button class="tb icon" id="soundBtn" type="button" aria-label="Audio">🔊</button>
      </div>
    </header>

    <main class="stage">
      <div class="board" id="board">
        <canvas id="gameCanvas" aria-label="Campo di gioco Tower Defense"></canvas>

        <div class="hud" id="hud">
          <div class="hud-group">
            <div class="chip"><span class="chip-label" data-i18n="hud.lives">Vite</span><strong id="hudLives" class="tone-life">20</strong></div>
            <div class="chip"><span class="chip-label" data-i18n="hud.money">Denaro</span><strong id="hudMoney" class="tone-money">0</strong></div>
            <div class="chip"><span class="chip-label" data-i18n="hud.wave">Onda</span><strong id="hudWave">0</strong></div>
            <div class="chip"><span class="chip-label" data-i18n="hud.score">Punteggio</span><strong id="hudScore">0</strong></div>
          </div>
          <div class="hud-group">
            <div class="chip"><span class="chip-label" data-i18n="hud.time">Tempo</span><strong id="hudTime">0s</strong></div>
            <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pausa" data-i18n-aria="hud.pause">⏸</button>
          </div>
        </div>

        <div class="wave-track"><div class="wave-fill" id="waveFill"></div></div>

        <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

        <div class="actionbar" id="actionbar">
          <div class="shop-wrap">
            <div class="shop-label" data-i18n="shop.title">ARSENALE</div>
            <div class="shop" id="shop"></div>
          </div>
          <div class="action-right">
            <button class="wave-btn" id="waveBtn" type="button">
              <span class="wave-icon">🌊</span>
              <span id="waveBtnText" data-i18n="hud.nextWave">Prossima onda</span>
            </button>
            <div class="speeds" id="speedBtns"></div>
          </div>
        </div>

        <div class="upgrade" id="upgradePanel" hidden></div>

        <div class="status-chip hidden" id="offlineChip">⚡ <span data-i18n="status.offline">Offline</span></div>
        <div class="update-bar hidden" id="updateBar">
          <span data-i18n="update.title">Nuova versione disponibile</span>
          <button type="button" id="updateBtn" data-i18n="update.button">Aggiorna</button>
        </div>

        <!-- MENU -->
        <div class="overlay" id="menuOverlay">
          <div class="modal menu-modal">
            <p class="eyebrow">LUCA GANDOLFI — ARCADE LAB</p>
            <h1 data-i18n="menu.title">TOWER DEFENSE</h1>
            <p class="tagline" data-i18n="menu.tagline">Costruisci. Potenzia. Resisti.</p>
            <p class="menu-sub" data-i18n="menu.subtitle"></p>
            <h2 class="section-title" data-i18n="menu.modes">MODALITÀ DI GIOCO</h2>
            <div class="mode-grid" id="modeGrid"></div>
            <div class="menu-bottom">
              <div class="records">
                <h3 data-i18n="menu.records">RECORD PERSONALI</h3>
                <div id="recordsList"></div>
              </div>
              <div class="menu-buttons">
                <button class="btn ghost" id="howtoBtn" type="button" data-i18n="menu.howto">COME SI GIOCA</button>
                <button class="btn ghost hidden" id="installBtn" type="button" data-i18n="menu.install">Installa app</button>
              </div>
            </div>
          </div>
        </div>

        <!-- PAUSA -->
        <div class="overlay hidden" id="pauseOverlay">
          <div class="modal small-modal">
            <div class="modal-icon">⏸</div>
            <h2 data-i18n="pause.title">IN PAUSA</h2>
            <button class="btn primary" id="resumeBtn" type="button" data-i18n="pause.resume">Riprendi</button>
            <button class="btn ghost" id="restartBtn" type="button" data-i18n="pause.restart">Riavvia</button>
            <button class="btn ghost" id="pauseMenuBtn" type="button" data-i18n="pause.menu">Menu principale</button>
          </div>
        </div>

        <!-- FINE PARTITA -->
        <div class="overlay hidden" id="endOverlay">
          <div class="modal small-modal end-modal">
            <div class="modal-icon" id="endIcon">🏆</div>
            <h2 id="endTitle" data-i18n="over.victory">VITTORIA!</h2>
            <p class="end-sub" id="endSub"></p>
            <div class="new-record hidden" id="newRecord" data-i18n="over.newRecord">NUOVO RECORD!</div>
            <div class="end-stats" id="endStats"></div>
            <button class="btn primary" id="retryBtn" type="button" data-i18n="over.retry">Riprova</button>
            <button class="btn ghost" id="endMenuBtn" type="button" data-i18n="over.menu">Menu principale</button>
          </div>
        </div>

        <!-- ISTRUZIONI -->
        <div class="overlay hidden" id="howtoOverlay">
          <div class="modal small-modal howto-modal">
            <h2 data-i18n="howto.title">Come si gioca</h2>
            <ol>
              <li data-i18n="howto.p1"></li>
              <li data-i18n="howto.p2"></li>
              <li data-i18n="howto.p3"></li>
            </ol>
            <p class="keys" data-i18n="howto.keys"></p>
            <button class="btn primary" id="howtoCloseBtn" type="button" data-i18n="howto.close">Ho capito</button>
          </div>
        </div>
      </div>

      <p class="hint">💡 <span data-i18n="howto.keys"></span></p>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
