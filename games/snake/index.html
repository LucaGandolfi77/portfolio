<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#06131d">
    <meta name="description" content="Snake Neon — 7 modalità, power-up, eventi live, sfida giornaliera e classifica. PWA giocabile offline.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snake Neon">
    <title>Snake Neon — PWA</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <a href="../../index.html#games" class="tb back" aria-label="Torna al portfolio">←</a>
            <div class="brand">🐍 <strong>SNAKE</strong><span class="brand-sub">NEON</span></div>
            <div class="top-actions">
                <button type="button" id="install-btn" class="tb install hidden">Installa</button>
                <button type="button" id="sound-btn" class="tb icon" aria-label="Audio">🔊</button>
                <button type="button" id="settings-btn" class="tb icon" aria-label="Impostazioni">⚙️</button>
            </div>
        </header>

        <main class="main">
            <section class="hud" aria-label="Punteggio">
                <div class="hud-item"><span class="hud-label" data-i18n="score">Punteggio</span><strong id="hud-score">0</strong></div>
                <div class="hud-item"><span class="hud-label" data-i18n="best">Record</span><strong id="hud-best">0</strong></div>
                <div class="hud-item"><span class="hud-label" data-i18n="length">Lunghezza</span><strong id="hud-length">3</strong></div>
                <div class="hud-item"><span class="hud-label" data-i18n="level">Livello</span><strong id="hud-level">1</strong></div>
            </section>

            <div class="mode-strip"><span id="hud-mode">—</span></div>
            <div class="timer-wrap hidden" id="timer-wrap"><div class="timer-bar"><i id="timer-fill"></i></div><span id="timer-text">60s</span></div>
            <div class="effects" id="effects"></div>
            <div class="banner" id="banner"></div>

            <section class="board-wrap" id="board-wrap">
                <canvas id="board" width="480" height="480" aria-label="Campo di gioco"></canvas>
            </section>

            <section class="dpad" id="dpad" aria-label="Controlli">
                <button type="button" class="dpad-btn up" data-dir="up" aria-label="Su">▲</button>
                <button type="button" class="dpad-btn left" data-dir="left" aria-label="Sinistra">◀</button>
                <button type="button" class="dpad-btn down" data-dir="down" aria-label="Giù">▼</button>
                <button type="button" class="dpad-btn right" data-dir="right" aria-label="Destra">▶</button>
                <span class="dpad-center">⌘</span>
            </section>

            <div class="quick-actions">
                <button type="button" id="pause-btn" class="tb" data-i18n="pause">Pausa</button>
                <button type="button" id="menu-btn" class="tb" data-i18n="menu">Menu</button>
            </div>
        </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Menu principale -->
    <div class="modal" id="menu-modal">
        <div class="modal-card wide">
            <h2>🐍 Snake Neon</h2>
            <p class="sub" data-i18n="tapStart">Scegli una modalità per iniziare</p>
            <div class="mode-grid" id="mode-grid"></div>
            <div class="menu-actions">
                <button type="button" id="daily-btn" class="tb primary">📅 <span data-i18n="daily">Sfida giornaliera</span></button>
                <button type="button" id="skins-btn" class="tb">🎨 <span data-i18n="skins">Skin</span></button>
                <button type="button" id="stats-btn" class="tb">📊 <span data-i18n="stats">Statistiche</span></button>
                <button type="button" id="records-btn" class="tb">🏆 <span data-i18n="records">Classifica</span></button>
                <button type="button" id="menu-install" class="tb primary hidden">⬇️ <span data-i18n="install">Installa app</span></button>
            </div>
        </div>
    </div>

    <!-- Pausa -->
    <div class="modal hidden" id="pause-modal">
        <div class="modal-card">
            <h2>⏸ <span data-i18n="pause">Pausa</span></h2>
            <div class="menu-actions">
                <button type="button" id="pause-resume" class="tb primary" data-i18n="resume">Riprendi</button>
                <button type="button" id="pause-menu" class="tb" data-i18n="menu">Menu</button>
            </div>
        </div>
    </div>

    <!-- Fine partita -->
    <div class="modal hidden" id="over-modal">
        <div class="modal-card">
            <h2 id="over-title" data-i18n="gameOver">Fine partita</h2>
            <p class="sub" id="over-sub"></p>
            <div class="over-score"><span id="over-score">0</span><small data-i18n="score">Punteggio</small></div>
            <div class="over-meta">
                <span>🏆 <b id="over-best">0</b></span>
                <span id="over-xp">+0 XP</span>
            </div>
            <div id="over-record" class="record-badge hidden">✨ Nuovo record!</div>
            <div id="over-achievements" class="ach-pop-list"></div>
            <div class="menu-actions">
                <button type="button" id="over-retry" class="tb primary" data-i18n="retry">Riprova</button>
                <button type="button" id="over-menu" class="tb" data-i18n="menu">Menu</button>
            </div>
        </div>
    </div>

    <!-- Pannello generico (impostazioni, skin, stats, classifica) -->
    <div class="modal hidden" id="panel-modal">
        <div class="modal-card wide">
            <h2 id="panel-title"></h2>
            <div id="panel-body" class="panel-body"></div>
            <div class="menu-actions"><button type="button" id="panel-close" class="tb primary">OK</button></div>
        </div>
    </div>

    <script src="./js/engine.js"></script>
    <script src="./js/modes.js"></script>
    <script src="./js/events.js"></script>
    <script src="./js/audio.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
