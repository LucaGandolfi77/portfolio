<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=./index.html">
    <title>Snake Neon — caricamento…</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06131d; color: #00ff88; font-family: 'Inter', sans-serif; text-align: center; }
        a { color: #38bdf8; }
    </style>
    <link rel="manifest" href="./legacy-snake.webmanifest">
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div>
        <h1>🐍 Snake Neon</h1>
        <p>Apro la versione PWA… <a href="./index.html">clicca qui</a></p>
    </div>
    
<script>
(function () {
  var target = './index.html' + location.search;
  function go() { location.replace(target); }
  if (!('serviceWorker' in navigator)) { go(); return; }
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    return Promise.all(regs.filter(function (r) {
      return /snake(?:-sw|_sw)\.js$/.test(r.scriptURL);
    }).map(function (r) { return r.unregister(); }));
  }).catch(function () {}).then(function () {
    return navigator.serviceWorker.register('./legacy-snake-sw.js', { scope: './legacy-snake.html' });
  }).catch(function () {}).then(go);
})();
</script>
</body>
</html>
