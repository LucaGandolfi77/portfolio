<link rel="canonical" href="./index.html">    <link rel="manifest" href="./legacy-pokemon.webmanifest">
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
</head>
<body style="margin:0;background:#080b1f;color:#f2f5ff;font:600 14px Inter,system-ui;display:grid;place-items:center;height:100vh">
<p>Loading Simulatore Pokémon… <a style="color:#4de8ff" href="./index.html">Open directly</a></p>

<script>
(function () {
  var target = './index.html' + location.search + location.hash;
  function go() { location.replace(target); }
  if (!('serviceWorker' in navigator)) { go(); return; }
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    return Promise.all(regs.filter(function (r) {
      return /pokemon(?:-sw|_sw)\.js$/.test(r.scriptURL);
    }).map(function (r) { return r.unregister(); }));
  }).catch(function () {}).then(function () {
    return navigator.serviceWorker.register('./legacy-pokemon-sw.js', { scope: './legacy-pokemon.html' });
  }).catch(function () {}).then(go);
})();
</script></body></html>
