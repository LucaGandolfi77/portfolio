<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0a1628"/>
  <g transform="translate(50,50)">
    <!-- Scalpel handle -->
    <rect x="-4" y="10" width="8" height="25" rx="2" fill="#bdc3c7"/>
    <!-- Scalpel blade -->
    <path d="M-3,10 L3,10 L0,-25 Z" fill="#ecf0f1"/>
    <!-- ECG line -->
    <polyline points="-35,0 -20,0 -15,-10 -10,15 0,-5 10,10 15,0 20,0 35,0" fill="none" stroke="#27ae60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
