<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a1628">
  <title>Scalpel-2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/surgery.css">
  <link rel="stylesheet" href="css/effects.css">
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</head>
<body>
  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- ECG Mini Display -->
  <canvas id="ecg-mini" width="100" height="40"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="hud-score">0</div>
      <div id="hud-combo">x1</div>
    </div>
    <div id="hud-right">
      <div id="hud-accuracy">100%</div>
    </div>
  </div>

  <!-- Timer Bar -->
  <div id="timer-bar" class="hidden">
    <div id="timer-fill"></div>
    <div id="timer-text">30s</div>
  </div>

  <!-- Accuracy Indicator -->
  <div id="accuracy-indicator"></div>

  <!-- Dialogue Box -->
  <div id="dialogue" class="hidden">
    <div id="dialogue-speaker"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-continue">tap to continue</div>
  </div>

  <!-- Instrument Bar -->
  <div id="instrument-bar" class="hidden"></div>

  <!-- Power-up Bar -->
  <div id="powerup-bar" class="hidden"></div>

  <!-- Overlay (Menus, Results, etc.) -->
  <div id="overlay">
    <div id="overlay-content"></div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container"></div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-icon">🔪</div>
    <div class="loading-text">Loading...</div>
    <div class="loading-bar">
      <div class="loading-fill"></div>
    </div>
  </div>

  <!-- Scripts (order matters) -->
  <script src="js/save.js"></script>
  <script src="js/data/instruments.js"></script>
  <script src="js/data/patients.js"></script>
  <script src="js/data/chapters.js"></script>
  <script src="js/data/procedures.js"></script>
  <script src="js/data/organs.js"></script>
  <script src="js/data/difficulty.js"></script>
  <script src="js/data/sounds.js"></script>
  <script src="js/engine/state.js"></script>
  <script src="js/engine/renderer.js"></script>
  <script src="js/engine/input.js"></script>
  <script src="js/engine/audio.js"></script>
  <script src="js/engine/timer.js"></script>
  <script src="js/engine/particles.js"></script>
  <script src="js/gameplay/steps.js"></script>
  <script src="js/gameplay/scoring.js"></script>
  <script src="js/gameplay/complications.js"></script>
  <script src="js/gameplay/powerups.js"></script>
  <script src="js/gameplay/progression.js"></script>
  <script src="js/ui/overlay.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/dialogue.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/modes/story.js"></script>
  <script src="js/modes/sandbox.js"></script>
  <script src="js/modes/daily.js"></script>
  <script src="js/modes/speed.js"></script>
  <script src="js/modes/bossrush.js"></script>
  <script src="js/modes/endless.js"></script>
  <script src="js/modes/veterinary.js"></script>
  <script src="js/modes/anatomy.js"></script>
  <script src="js/modes/tutorial.js"></script>
  <script src="js/modes/zombie.js"></script>
  <script src="js/modes/alien.js"></script>
  <script src="js/modes/pandemic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
