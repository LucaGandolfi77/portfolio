<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b1f">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Neon Kart — a fast, offline PWA racer with 12 karts, 9 tracks, 4 modes, drift, nitro and AI rivals. Made for iPhone and GitHub Pages.">
<title>Neon Kart — Race, drift, win</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/games/kart/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../../projects/_shared/tokens.css">
<link rel="stylesheet" href="../../projects/_shared/base.css">
<link rel="stylesheet" href="../../projects/_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="Neon Kart" data-id="neon-kart"
  data-back="../../games.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<div id="app">
  <canvas id="gameCanvas" aria-label="Race track"></canvas>

  <div class="hud hidden" id="hud">
    <div class="hud-top glass">
      <div class="hud-group"><span data-i18n="lap">Giro</span><b id="hudLap">1/3</b></div>
      <div class="hud-group"><span data-i18n="position">Pos</span><b id="hudPos">1/7</b></div>
      <div class="hud-group"><span data-i18n="time">Tempo</span><b id="hudTime">0:00.00</b></div>
      <div class="hud-group"><span data-i18n="speed">KM/H</span><b id="hudSpeed">0</b></div>
      <button class="round small" id="btnPauseRace" type="button" aria-label="Pause">⏸</button>
    </div>
    <div class="nitro-wrap"><div class="nitro"><i id="nitroFill"></i></div><span data-i18n="nitro">Nitro</span></div>
    <canvas id="mini" width="150" height="112" class="glass"></canvas>
    <div id="countdown" class="countdown hidden"></div>
    <div id="toastRace" class="toast-race"></div>
  </div>

  <div class="touch-controls hidden" id="touchControls">
    <div class="steer-group">
      <button class="pad" data-act="left" aria-label="Steer left">←</button>
      <button class="pad" data-act="right" aria-label="Steer right">→</button>
    </div>
    <div class="action-group">
      <button class="pad small" data-act="brake" aria-label="Brake">🛑</button>
      <button class="pad small" data-act="drift" aria-label="Drift">💨</button>
      <button class="pad boost" data-act="nitro" aria-label="Nitro">🔥</button>
    </div>
  </div>

  <div class="menu" id="menu">
    <div class="menu-card glass">
      <div class="menu-head">
        <h1>🏎 <span data-i18n="title">NEON KART</span></h1>
        <p data-i18n="tagline">Corri, deriva, vinci</p>
        <div class="stars">⭐ <b id="starCount">0</b></div>
      </div>
      <div class="tabs">
        <button class="tab on" data-tab="kart" data-i18n="garage">Garage</button>
        <button class="tab" data-tab="track" data-i18n="tracks">Piste</button>
        <button class="tab" data-tab="mode" data-i18n="modes">Modalità</button>
      </div>
      <div class="tab-body" id="tabBody"></div>
      <div class="menu-actions">
        <button class="tbtn primary big" id="btnStart" type="button" data-i18n="start">Parti!</button>
        <div class="btn-row">
          <button class="tbtn" id="btnSettings" type="button">⚙ <span data-i18n="settings">Impostazioni</span></button>
          <button class="tbtn" id="btnHelp" type="button">? <span data-i18n="help">Guida</span></button>
          <button class="tbtn" id="btnLang" type="button" data-i18n="lang">IT / EN</button>
          <button class="tbtn" id="btnTheme" type="button" data-i18n="theme">Tema</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
</div>

<div class="modal" id="pauseModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>⏸ <span data-i18n="pause">Pausa</span></h2>
    <button class="tbtn big wide" id="btnResume" type="button" data-i18n="resume">Riprendi</button>
    <button class="tbtn wide" id="btnRestart" type="button" data-i18n="restart">Riavvia</button>
    <button class="tbtn wide" id="btnQuit" type="button" data-i18n="menu">Menu</button>
  </div>
</div>

<div class="modal" id="resultModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2 id="resultTitle">—</h2>
    <div id="resultBody"></div>
    <div class="btn-row">
      <button class="tbtn big" id="btnAgain" type="button" data-i18n="tryAgain">Riprova</button>
      <button class="tbtn" id="btnResultMenu" type="button" data-i18n="menu">Menu</button>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>⚙ <span data-i18n="settingsTitle">Impostazioni</span></h2>
    <label class="check"><input type="checkbox" id="soundCheck" checked> <span data-i18n="sound">Suono</span></label>
    <label class="check"><input type="checkbox" id="vibrateCheck" checked> <span data-i18n="vibration">Vibrazione</span></label>
    <label class="check"><input type="checkbox" id="motionCheck"> <span data-i18n="motion">Effetti ridotti</span></label>
    <div class="fld"><span data-i18n="quality">Qualità</span>
      <div class="chips"><button class="chip" data-quality="low" data-i18n="low">Bassa</button><button class="chip on" data-quality="high" data-i18n="high">Alta</button></div>
    </div>
    <button class="tbtn big wide" type="button" data-close="settingsModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="helpModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>📖 <span data-i18n="help">Guida</span></h2>
    <p id="helpText"></p>
    <button class="tbtn big wide" type="button" data-close="helpModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../../projects/_shared/shell.js" defer></script>
</body>
</html>
