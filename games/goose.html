<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1226">
    <title data-i18n="games.goose.title">Game of the Goose - Luca Gandolfi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #070d1d;
            --bg1: #0e1e33;
            --bg2: #123240;
            --gold: #ffcf6e;
            --cyan: #59e3ff;
            --pink: #ff7ab8;
            --green: #57d98a;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-brd: rgba(255, 255, 255, 0.11);
            --txt-dim: #9db4c8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(120% 90% at 50% -10%, #1d3a5f 0%, transparent 55%),
                radial-gradient(90% 60% at 85% 110%, #143a2f 0%, transparent 60%),
                linear-gradient(165deg, var(--bg1) 0%, var(--bg0) 100%);
            color: white;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 12px;
            position: relative;
            z-index: 20;
            min-height: 44px;
        }
        .back-btn {
            color: var(--txt-dim);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            padding: 8px 10px;
            border-radius: 10px;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .back-btn:active { background: var(--glass); color: #fff; }
        .hdr-title {
            text-align: center;
            min-width: 0;
        }
        .hdr-title h1 {
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-size: clamp(1.05rem, 4.6vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(92deg, var(--gold), #ffe9b8 45%, var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hdr-title p {
            font-size: 0.62rem;
            color: var(--txt-dim);
            letter-spacing: 0.4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 12px;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            color: #dbe7f2;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .icon-btn:active { transform: scale(0.93); background: rgba(255,255,255,0.14); }
        .icon-btn svg { width: 19px; height: 19px; fill: currentColor; }
        .sound-btn .slash { display: none; }
        .sound-btn.muted .wave { display: none; }
        .sound-btn.muted .slash { display: block; }

        .status-bar {
            margin: 2px auto 4px;
            width: min(94vw, 560px);
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px 16px;
            background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
            border: 1px solid var(--glass-brd);
            border-radius: 16px;
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-weight: 600;
            font-size: clamp(0.82rem, 3.6vw, 1rem);
            line-height: 1.25;
            z-index: 20;
        }
        .status-bar.pop { animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.3); }
        @keyframes popIn { from { transform: scale(0.86); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }

        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            position: relative;
            z-index: 10;
            padding: 2px 8px;
        }
        .board-wrap {
            position: relative;
            height: 100%;
            max-height: 100%;
            aspect-ratio: 8 / 9;
            max-width: min(94vw, 520px);
        }
        @supports not (aspect-ratio: 1) { .board-wrap { width: min(94vw, 480px); height: auto; } }
        .board-wrap.shake { animation: shake 0.45s linear; }
        @keyframes shake {
            10% { transform: translate(-7px, 3px) rotate(-0.6deg); } 25% { transform: translate(6px, -4px) rotate(0.5deg); }
            45% { transform: translate(-5px, -3px); } 65% { transform: translate(4px, 3px) rotate(0.4deg); }
            85% { transform: translate(-2px, 1px); } 100% { transform: none; }
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 3.5px;
            width: 100%;
            height: 100%;
            padding: clamp(7px, 1.8vmin, 13px);
            border-radius: 24px;
            background: linear-gradient(165deg, rgba(22, 58, 48, 0.75), rgba(10, 26, 43, 0.85));
            border: 1px solid var(--glass-brd);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 46px rgba(0,0,0,0.5);
        }
        .tile {
            position: relative;
            border-radius: 14%;
            background: linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, box-shadow 0.3s;
        }
        .tile .num {
            position: absolute;
            top: 4%;
            left: 8%;
            font-size: clamp(6px, 1.6vmin, 11px);
            font-weight: 800;
            color: rgba(255,255,255,0.34);
            letter-spacing: -0.5px;
        }
        .tile svg.icon { width: 58%; height: 58%; pointer-events: none; }
        .tile.t-goose {
            background: linear-gradient(150deg, rgba(255,207,110,0.30), rgba(255,180,60,0.10));
            border-color: rgba(255,207,110,0.55);
            animation: gooseGlow 2.4s ease-in-out infinite;
        }
        @keyframes gooseGlow {
            0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 0 0px rgba(255,207,110,0); }
            50% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 14px rgba(255,207,110,0.35); }
        }
        .tile.t-goose .wing { animation: flap 1.6s ease-in-out infinite; transform-origin: 10px 13px; }
        @keyframes flap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-28deg); } }
        .tile.t-start { background: linear-gradient(150deg, rgba(87,217,138,0.30), rgba(87,217,138,0.08)); border-color: rgba(87,217,138,0.5); }
        .tile.t-end {
            background: linear-gradient(150deg, rgba(89,227,255,0.32), rgba(255,207,110,0.12));
            border: 1.5px solid rgba(89,227,255,0.7);
            animation: endPulse 1.8s ease-in-out infinite;
        }
        @keyframes endPulse {
            0%, 100% { box-shadow: 0 0 6px rgba(89,227,255,0.25); }
            50% { box-shadow: 0 0 20px rgba(89,227,255,0.55); }
        }
        .tile.t-inn { background: linear-gradient(150deg, rgba(255,170,80,0.26), rgba(255,170,80,0.07)); border-color: rgba(255,170,80,0.45); }
        .tile.t-well { background: linear-gradient(150deg, rgba(90,140,255,0.28), rgba(90,140,255,0.07)); border-color: rgba(90,140,255,0.5); }
        .tile.t-maze { background: linear-gradient(150deg, rgba(183,139,255,0.26), rgba(183,139,255,0.07)); border-color: rgba(183,139,255,0.45); }
        .tile.t-prison { background: linear-gradient(150deg, rgba(160,170,190,0.26), rgba(160,170,190,0.06)); border-color: rgba(160,170,190,0.42); }
        .tile.t-skull { background: linear-gradient(150deg, rgba(255,95,95,0.30), rgba(120,30,30,0.14)); border-color: rgba(255,95,95,0.55); }
        .tile.t-boost { background: linear-gradient(150deg, rgba(127,227,163,0.28), rgba(87,217,138,0.07)); border-color: rgba(127,227,163,0.5); }
        .tile.t-prize { background: linear-gradient(150deg, rgba(255,207,110,0.26), rgba(255,207,110,0.07)); border-color: rgba(255,207,110,0.5); }
        .tile.t-swap { background: linear-gradient(150deg, rgba(89,227,255,0.26), rgba(89,227,255,0.07)); border-color: rgba(89,227,255,0.5); }
        .tile.t-back { background: linear-gradient(150deg, rgba(255,156,110,0.28), rgba(160,60,30,0.12)); border-color: rgba(255,156,110,0.5); }
        .tile.t-skip2 { background: linear-gradient(150deg, rgba(255,180,87,0.26), rgba(255,180,87,0.06)); border-color: rgba(255,180,87,0.48); }
        .tile.landed { animation: landPop 0.4s ease; }
        @keyframes landPop { 40% { transform: scale(1.12); } }
        .tile.active-turn { border-color: rgba(255,255,255,0.55); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 0 10px rgba(255,255,255,0.18); }

        .token-layer { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
        .token {
            position: absolute;
            width: 8.5%;
            aspect-ratio: 1;
            transform: translate(-50%, -58%);
            transition: left 0.23s ease, top 0.23s ease;
            will-change: left, top;
        }
        .tok-inner { width: 100%; height: 100%; position: relative; }
        .tok-inner.hop { animation: hop 0.23s ease; }
        @keyframes hop { 45% { transform: translateY(-52%) scale(1.05, 0.95); } 80% { transform: translateY(4%) scale(0.94, 1.06); } }
        .tok-inner svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.45)); }
        .tok-inner::after {
            content: '';
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: -7%;
            height: 14%;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            filter: blur(1.5px);
        }
        .token.cur .tok-inner::before {
            content: '';
            position: absolute;
            inset: -14%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.75);
            animation: curSpin 3s linear infinite;
        }
        @keyframes curSpin { to { transform: rotate(360deg); } }
        .token.ghosted { opacity: 0.35; }
        .float-txt {
            position: fixed;
            z-index: 80;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 0.95s ease-out forwards;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            white-space: nowrap;
        }
        @keyframes floatUp {
            from { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
            25% { opacity: 1; transform: translate(-50%, -18px) scale(1.1); }
            to { transform: translate(-50%, -64px) scale(1); opacity: 0; }
        }
        #fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 55; }

        .dock {
            padding: 6px 14px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 20;
        }
        .dice-row { display: flex; gap: 14px; perspective: 700px; }
        .die { --sz: clamp(42px, 8.4vmin, 56px); width: var(--sz); height: var(--sz); position: relative; }
        .cube {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transition: transform 0.95s cubic-bezier(0.18, 0.7, 0.22, 1);
            transform: rotateX(-18deg) rotateY(24deg);
        }
        .face {
            position: absolute;
            inset: 0;
            border-radius: 22%;
            background: linear-gradient(150deg, #fdfefe, #ccd8e2);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: inset 0 0 10px rgba(90,120,150,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .face svg { width: 78%; height: 78%; }
        .roll-btn {
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-weight: 700;
            font-size: clamp(1rem, 4.6vw, 1.25rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #10233c;
            background: linear-gradient(160deg, #ffd98a, var(--gold) 55%, #eda93f);
            border: none;
            border-radius: 20px;
            min-width: clamp(130px, 38vw, 200px);
            min-height: 52px;
            padding: 10px 22px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 6px 16px rgba(255, 190, 80, 0.35), inset 0 1px 0 rgba(255,255,255,0.6);
            transition: transform 0.12s, filter 0.15s, opacity 0.3s;
        }
        .roll-btn:active:not(:disabled) { transform: scale(0.94); filter: brightness(1.1); }
        .roll-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .turn-chip {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--glass-brd);
            border-radius: 20px;
            padding: 3px 12px 3px 6px;
            font-size: 0.72rem;
            font-weight: 700;
            z-index: 31;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .turn-dot { width: 14px; height: 14px; border-radius: 50%; }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(4, 8, 18, 0.66);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }
        .panel {
            width: min(92vw, 400px);
            max-height: 84dvh;
            overflow-y: auto;
            background: linear-gradient(165deg, rgba(28, 48, 74, 0.92), rgba(12, 24, 42, 0.94));
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
            transform: translateY(14px) scale(0.97);
            transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }
        .overlay.open .panel { transform: none; }
        .panel h2 { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
        .panel .sub { font-size: 0.8rem; color: var(--txt-dim); text-align: center; margin-bottom: 14px; }
        .seat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            border-radius: 16px;
            padding: 9px 12px;
            margin-bottom: 8px;
        }
        .seat-swatch { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: 0 0 10px -2px currentColor; }
        .seat-name { flex: 1; min-width: 0; font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .seg { display: flex; background: rgba(0,0,0,0.35); border-radius: 12px; padding: 3px; gap: 2px; }
        .seg button {
            border: none;
            background: transparent;
            color: var(--txt-dim);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.72rem;
            padding: 6px 10px;
            border-radius: 9px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .seg button.on { background: rgba(255,255,255,0.18); color: #fff; }
        .seg button:active { transform: scale(0.94); }
        .shuffle-btn {
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            cursor: pointer;
            touch-action: manipulation;
            display: none;
            align-items: center;
            justify-content: center;
            flex: none;
        }
        .shuffle-btn.show { display: flex; }
        .shuffle-btn svg { width: 15px; height: 15px; fill: currentColor; }
        .stats-line {
            margin-top: 10px;
            font-size: 0.72rem;
            color: var(--txt-dim);
            text-align: center;
            line-height: 1.6;
        }
        .stats-line b { color: var(--gold); }
        .primary-btn {
            width: 100%;
            margin-top: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.02rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #10233c;
            background: linear-gradient(160deg, #9be8bd, var(--green) 60%, #2fae67);
            border: none;
            border-radius: 18px;
            min-height: 52px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 6px 16px rgba(70, 200, 130, 0.3), inset 0 1px 0 rgba(255,255,255,0.55);
        }
        .primary-btn:active { transform: scale(0.97); }
        .ghost-btn {
            width: 100%;
            margin-top: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-brd);
            color: #e6eff7;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.88rem;
            border-radius: 16px;
            min-height: 46px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .ghost-btn:active { background: rgba(255,255,255,0.2); }
        .trophy-wrap { display: flex; justify-content: center; margin: 6px 0 10px; }
        .trophy-wrap svg { width: 76px; height: 76px; filter: drop-shadow(0 6px 18px rgba(255,207,110,0.45)); animation: trophyBob 1.6s ease-in-out infinite; }
        @keyframes trophyBob { 50% { transform: translateY(-7px) rotate(3deg); } }
        .toast-msg {
            position: fixed;
            left: 50%;
            bottom: calc(max(10px, env(safe-area-inset-bottom)) + 96px);
            transform: translateX(-50%) translateY(8px);
            background: rgba(220, 60, 60, 0.95);
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            z-index: 95;
            white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%); }
        @media (max-height: 560px) {
            .hdr-title p { display: none; }
            .status-bar { min-height: 30px; font-size: 0.78rem; }
            .die { --sz: 36px; }
            .roll-btn { min-height: 44px; }
            .board { padding: 5px; gap: 2.5px; }
        }
    </style>
</head>
<body>
    <script src="top_buttons.js"></script>

    <header class="app-header">
        <a href="../index.html#games" class="back-btn" data-i18n="games.goose.back">&#8592; Back</a>
        <div class="hdr-title">
            <h1 data-i18n="games.goose.title">Game of the Goose</h1>
            <p data-i18n="games.goose.lead">Classic race game. Roll the dice and avoid the traps!</p>
        </div>
        <button id="soundBtn" class="icon-btn sound-btn" aria-label="Toggle sound">
            <svg viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3z"/>
                <path class="wave" d="M16 8a4.5 4.5 0 010 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line class="slash" x1="4" y1="4" x2="21" y2="21" stroke="#ff5d5d" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
        </button>
    </header>

    <div class="status-bar" id="status">Welcome to the meadow...</div>

    <main class="stage">
        <div class="board-wrap" id="boardWrap">
            <div class="turn-chip" id="turnChip" style="display:none;"><span class="turn-dot" id="turnDot"></span><span id="turnName"></span></div>
            <div class="board" id="board"></div>
            <div class="token-layer" id="tokenLayer"></div>
        </div>
    </main>

    <footer class="dock">
        <div class="dice-row">
            <div class="die"><div class="cube" id="cube1"></div></div>
            <div class="die"><div class="cube" id="cube2"></div></div>
        </div>
        <button class="roll-btn" id="rollBtn" data-i18n="games.goose.roll">Roll Dice</button>
    </footer>

    <canvas id="fxCanvas"></canvas>
    <div class="toast-msg" id="toastMsg"></div>

    <div class="overlay open" id="setupOverlay">
        <div class="panel">
            <h2>Midnight Meadow</h2>
            <p class="sub">Pick your waddlers. First to 71 wins!</p>
            <div id="seatsBox"></div>
            <p class="stats-line" id="statsLine"></p>
            <button class="primary-btn" id="startBtn">Start Game</button>
            <button class="ghost-btn" data-i18n="games.goose.reset" id="resetStatsBtn">Reset</button>
        </div>
    </div>

    <div class="overlay" id="winOverlay">
        <div class="panel" style="text-align:center;">
            <div class="trophy-wrap">
                <svg viewBox="0 0 24 24"><path fill="#ffd166" d="M7 4h10v2h3v2c0 2.5-2 4.5-4.5 4.9A5 5 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1a5 5 0 0 1-2.5-3A5 5 0 0 1 4 8V6h3zm-1 4c0 1.2.8 2.3 2 2.7V8zm12 0v2.7c1.2-.4 2-1.5 2-2.7z"/></svg>
            </div>
            <h2 id="winnerTitle">Someone wins!</h2>
            <p class="sub" id="winnerSub"></p>
            <button class="primary-btn" id="rematchBtn">Rematch</button>
            <button class="ghost-btn" id="changePlayersBtn">Change Players</button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            function floatText(txt, px, py, color, big) {
                var el = document.createElement('div');
                el.className = 'float-txt';
                el.textContent = txt;
                el.style.left = px + 'px';
                el.style.top = py + 'px';
                el.style.color = color || '#fff';
                el.style.fontSize = big ? 'clamp(1.3rem,6vw,2rem)' : 'clamp(0.9rem,4vw,1.25rem)';
                document.body.appendChild(el);
                setTimeout(function () { if (el.parentElement) el.parentElement.removeChild(el); }, 1000);
            }
            function fxLoop(now) {
                requestAnimationFrame(fxLoop);
                if (!fxOn) { lastFx = now; return; }
                var dt = Math.min((now - lastFx) / 1000, 0.05);
                lastFx = now;
                ctx.clearRect(0, 0, fw, fh);
                for (var i = 0; i < fireflies.length; i++) {
                    var f = fireflies[i];
                    f.x += f.vx * dt; f.y += f.vy * dt;
                    if (f.x < -10) f.x = fw + 10; if (f.x > fw + 10) f.x = -10;
                    if (f.y < fh * 0.15) f.y = fh - 10; if (f.y > fh + 10) f.y = fh * 0.2;
                    var tw = 0.35 + 0.4 * Math.sin(now / 420 + f.ph);
                    ctx.globalAlpha = tw;
                    ctx.fillStyle = '#d9f7c9';
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.s, 0, 6.29); ctx.fill();
                    ctx.globalAlpha = tw * 0.25;
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.s * 3.2, 0, 6.29); ctx.fill();
                }
                for (var j = particles.length - 1; j >= 0; j--) {
                    var p = particles[j];
                    p.life -= dt;
                    if (p.life <= 0) { particles.splice(j, 1); continue; }
                    p.vy += p.g * dt;
                    p.x += p.vx * dt; p.y += p.vy * dt;
                    p.ang += p.spin * dt;
                    ctx.globalAlpha = Math.min(1, p.life / p.m * 1.6);
                    ctx.fillStyle = p.color;
                    if (p.shape === 'circle') {
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 6.29); ctx.fill();
                    } else {
                        ctx.save();
                        ctx.translate(p.x, p.y); ctx.rotate(p.ang);
                        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                        ctx.restore();
                    }
                }
                ctx.globalAlpha = 1;
            }
            document.addEventListener('visibilitychange', function () { fxOn = !document.hidden; });
            window.addEventListener('resize', fxResize);

            function gooseSVG(color) {
                return '<svg viewBox="0 0 24 24"><path fill="' + color + '" d="M6.5 14c0-3.6 2.8-6.2 6.6-6.2 1.5 0 2.8.4 3.8 1.1l2-1.5c.5-.4 1.2.1 1 .7l-.6 2.7c.6.9.9 1.9.9 2.9 0 3.7-3.4 6.1-8.1 6.1-3.9 0-5.6-2.3-5.6-5.8z"/><circle cx="17.2" cy="9.8" r="0.95" fill="#101a2c"/></svg>';
            }

            var state = {
                phase: 'setup',
                players: [],
                turn: 0,
                occupant: { well: null, prison: null },
                gamesPlayed: 0
            };

            function loadJSON(key, fallback) {
                try {
                    var raw = localStorage.getItem(key);
                    if (raw) return JSON.parse(raw);
                } catch (e) {}
                return fallback;
            }
            function saveJSON(key, val) {
                try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
            }
            var stats = loadJSON('gg_stats', { games: 0, wins: {} });

            var seatModes = loadJSON('gg_setup', ['human', 'bot', null, null]);
            var botCursor = 0;
            function nextBot() { var b = BOTS[botCursor % BOTS.length]; botCursor++; return b.name; }
            if (!Array.isArray(seatModes) || seatModes.length !== 4) seatModes = ['human', 'bot', null, null];

            function renderSeats() {
                var box = $('seatsBox');
                box.innerHTML = '';
                COLORS.forEach(function (col, idx) {
                    var mode = seatModes[idx];
                    var row = document.createElement('div');
                    row.className = 'seat-row';
                    var sw = document.createElement('div');
                    sw.className = 'seat-swatch';
                    sw.style.background = col.css;
                    sw.style.color = col.css;
                    var nm = document.createElement('div');
                    nm.className = 'seat-name';
                    nm.id = 'seat-name-' + idx;
                    updateSeatName(nm, col, mode, idx);
                    var seg = document.createElement('div');
                    seg.className = 'seg';
                    [['off', 'Off'], ['human', 'Human'], ['bot', 'Bot']].forEach(function (opt) {
                        var b = document.createElement('button');
                        b.textContent = opt[1];
                        if (mode === opt[0]) b.classList.add('on');
                        b.addEventListener('click', function () {
                            ensureAudio(); sfxClick();
                            seatModes[idx] = opt[0] === 'off' ? null : opt[0];
                            saveJSON('gg_setup', seatModes);
                            renderSeats();
                        });
                        seg.appendChild(b);
                    });
                    row.appendChild(sw); row.appendChild(nm); row.appendChild(seg);
                    if (mode === 'bot') {
                        var sh = document.createElement('button');
                        sh.className = 'shuffle-btn show';
                        sh.title = 'Change bot';
                        sh.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17 4h4v4h-2V7.4l-4.3 4.3-1.4-1.4L17.6 6H17zM3 6h5.5l2.3 2.3-1.4 1.4L7.4 8H3zm13.7 8 2.3 2.6V16h2v4h-4v-2h.6l-2.3-2.6zM8.5 15.7l1.4 1.4L7.5 19.4H3v-2h3.7z"/></svg>';
                        sh.addEventListener('click', function () {
                            ensureAudio(); sfxClick();
                            var names = seatNames();
                            var b = pick(BOTS);
                            var guard = 0;
                            while (names.indexOf(b.name) >= 0 && guard++ < 12) b = pick(BOTS);
                            customBots[idx] = b.name;
                            saveJSON('gg_bots', customBots);
                            updateSeatName(nm, col, mode, idx);
                        });
                        row.appendChild(sh);
                    }
                    box.appendChild(row);
                });
                var activeCount = seatModes.filter(Boolean).length;
                var st = $('statsLine');
                var parts = ['Games played: <b>' + stats.games + '</b>'];
                Object.keys(stats.wins).forEach(function (k) {
                    parts.push(k + ': <b>' + stats.wins[k] + '</b> win' + (stats.wins[k] > 1 ? 's' : ''));
                });
                st.innerHTML = parts.join(' &nbsp;&bull;&nbsp; ');
                $('startBtn').disabled = false;
                if (activeCount < 2) st.innerHTML += '<br>Pick at least 2 players!';
            }
            var customBots = loadJSON('gg_bots', {});
            function botNameFor(idx) {
                if (customBots[idx]) return customBots[idx];
                var defIdx = Math.max(0, idx - 1);
                return BOTS[defIdx % BOTS.length].name;
            }
            function seatNames() {
                var names = [];
                COLORS.forEach(function (c, i) {
                    if (seatModes[i] === 'human') names.push(c.name);
                    else if (seatModes[i] === 'bot') names.push(botNameFor(i));
                });
                return names;
            }
            function updateSeatName(el, col, mode, idx) {
                if (mode === 'human') el.textContent = col.name + ' (you)';
                else if (mode === 'bot') el.textContent = botNameFor(idx);
                else el.textContent = 'Empty bench';
                el.style.opacity = mode ? 1 : 0.45;
            }

            function startGame() {
                var count = seatModes.filter(Boolean).length;
                if (count < 2) { showToast('Need at least 2 players!'); screenShake(); return; }
                state.players = [];
                COLORS.forEach(function (col, idx) {
                    var mode = seatModes[idx];
                    if (!mode) return;
                    var isBot = mode === 'bot';
                    state.players.push({
                        seat: idx, name: isBot ? botNameFor(idx) : col.name,
                        color: col.css, isBot: isBot,
                        pos: 0, skipTurns: 0, trappedIn: null, trapCount: 0, extraRoll: 0,
                        firstThrow: true, taunts: (BOTS.find(function (b) { return b.name === botNameFor(idx); }) || {}).taunts
                    });
                });
                state.turn = 0;
                state.occupant = { well: null, prison: null };
                state.phase = 'idle';
                tokenLayer.innerHTML = '';
                state.players.forEach(function (p) {
                    var tok = document.createElement('div');
                    tok.className = 'token';
                    tok.id = 'tok-' + p.seat;
                    tok.innerHTML = '<div class="tok-inner">' + gooseSVG(p.color) + '</div>';
                    tokenLayer.appendChild(tok);
                    p.el = tok;
                });
                layoutAllTokens(true);
                updateTurnUI();
                $('setupOverlay').classList.remove('open');
                $('winOverlay').classList.remove('open');
                rollBtn.disabled = false;
                setDiceIdle();
                promptRollFor(state.players[0]);
            }

            function layoutAllTokens(instant) {
                var byCell = {};
                state.players.forEach(function (p) {
                    (byCell[p.pos] = byCell[p.pos] || []).push(p);
                });
                state.players.forEach(function (p) {
                    var group = byCell[p.pos];
                    var k = group.indexOf(p);
                    var n = group.length;
                    var s = serp(p.pos);
                    var bx = (s.c + 0.5) / COLS * 100;
                    var by = (s.r + 0.5) / ROWS * 100;
                    var ox = 0, oy = 0;
                    if (n > 1) {
                        var spread = 3.0;
                        ox = (k % 2 === 0 ? -1 : 1) * spread * 1.4;
                        oy = (k < 2 ? -1 : 1) * spread;
                    }
                    if (instant) p.el.style.transition = 'none';
                    p.el.style.left = 'calc(' + bx + '% + ' + ox.toFixed(1) + '%)';
                    p.el.style.top = 'calc(' + by + '% + ' + oy.toFixed(1) + '%)';
                    if (instant) requestAnimationFrame(function () { p.el.style.transition = ''; });
                });
            }
            function refreshTileGlow() {
                tiles.forEach(function (t) { t.classList.remove('landed', 'active-turn'); });
                var cur = state.players[state.turn];
                if (cur) {
                    var t = tiles[cur.pos];
                    if (t) t.classList.add('active-turn');
                }
            }
            function updateTurnUI() {
                var cur = state.players[state.turn];
                if (!cur) return;
                var chip = $('turnChip');
                chip.style.display = 'flex';
                $('turnDot').style.background = cur.color;
                $('turnDot').style.boxShadow = '0 0 8px ' + cur.color;
                $('turnName').textContent = cur.name + (cur.isBot ? ' (bot)' : '');
                state.players.forEach(function (p) { p.el.classList.toggle('cur', p === cur); });
                refreshTileGlow();
            }
            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(showToast.t);
                showToast.t = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
            }

            async function travel(p, seq) {
                for (var i = 0; i < seq.length; i++) {
                    p.pos = seq[i];
                    sfxHop(i);
                    layoutAllTokens(false);
                    var inner = p.el.firstChild;
                    inner.classList.remove('hop');
                    void inner.offsetWidth;
                    inner.classList.add('hop');
                    await wait(245);
                }
                var t = tiles[p.pos];
                if (t) { t.classList.remove('landed'); void t.offsetWidth; t.classList.add('landed'); }
            }
            async function slideTo(p, target) {
                sfxWhoosh();
                p.pos = target;
                layoutAllTokens(false);
                await wait(560);
            }

            function bounceTarget(from, steps) {
                var raw = from + steps;
                return raw <= FINISH ? raw : FINISH * 2 - raw;
            }

            async function resolveLanding(p, roll, depth) {
                if (depth > 8) { say('exhausted', null, '#ffd166'); return; }
                var pos = p.pos;
                if (pos === FINISH) return;

                if (GOOSE_TILES.indexOf(pos) >= 0) {
                    burstAtToken(p, ['#ffcf6e', '#fff3d6']);
                    if (depth > 0) say('chain', { name: p.name, n: depth + 1 }, '#ffd166');
                    else say('goose', { name: p.name }, '#ffd166');
                    floatText('HONK!', eventX(p), eventY(p) - 20, '#ffcf6e', depth > 0);
                    sfxHonk(depth);
                    await wait(520);
                    var target = bounceTarget(pos, roll);
                    await travel(p, walkSequence(pos, Math.abs(target - pos)));
                    if (target < pos) say('bounce', { name: p.name }, '#ff9c9c');
                    await resolveLanding(p, roll, depth + 1);
                    return;
                }

                var rule = RULES[pos];
                if (!rule) return;
                switch (rule.kind) {
                    case 'jump':
                        say(rule.key, { name: p.name }, '#8fd0ff');
                        await wait(450);
                        await slideTo(p, rule.to);
                        await resolveLanding(p, roll, depth + 1);
                        break;
                    case 'boost':
                        say(rule.key, { name: p.name, to: rule.to }, '#7fe3a3');
                        burstAtToken(p, ['#7fe3a3', '#ffcf6e']);
                        sfxWhoosh();
                        floatText('BOOST!', eventX(p), eventY(p) - 18, '#7fe3a3');
                        await wait(450);
                        await slideTo(p, rule.to);
                        await resolveLanding(p, roll, depth + 1);
                        break;
                    case 'extraRoll':
                        p.extraRoll++;
                        say(rule.key, { name: p.name }, '#ffcf6e');
                        floatText('LUCKY!', eventX(p), eventY(p) - 16, '#ffcf6e');
                        tone(660, 0.12, 'sine', 0.12);
                        tone(880, 0.16, 'sine', 0.12, 0.12);
                        burstAtToken(p, ['#57d98a', '#ffcf6e']);
                        break;
                    case 'swap':
                        var candidates = state.players.filter(function (o) { return o !== p && !o.trappedIn; });
                        if (!candidates.length) {
                            say('noSwap', { name: p.name }, '#59e3ff');
                            sfxClick();
                        } else {
                            var victim = pick(candidates);
                            var tmpPos = p.pos;
                            p.pos = victim.pos;
                            victim.pos = tmpPos;
                            say('swap', { name: p.name, other: victim.name }, '#59e3ff');
                            sfxWhoosh();
                            burstAtToken(p, ['#59e3ff']);
                            burstAtToken(victim, ['#59e3ff']);
                            floatText('SWAP!', eventX(p), eventY(p) - 18, '#59e3ff');
                            layoutAllTokens(false);
                            await wait(650);
                        }
                        break;
                    case 'back': {
                        say(rule.key, { name: p.name, n: rule.n }, '#ff9c6e');
                        sfxTrap();
                        screenShake();
                        burstAtToken(p, ['#ff9c6e']);
                        await wait(520);
                        var backSeq = [];
                        for (var b = 0; b < rule.n && p.pos - b > 0; b++) backSeq.push(p.pos - b - 1);
                        await travel(p, backSeq);
                        await resolveLanding(p, roll, depth + 1);
                        break;
                    }
                    case 'skip':
                        p.skipTurns += rule.n;
                        say(rule.key, { name: p.name }, '#ffb457');
                        floatText('ZZZ...', eventX(p), eventY(p) - 16, '#ffb457');
                        sfxSnore();
                        break;
                    case 'trapHold':
                        handleTrapHold(p, rule.spot, rule.key);
                        break;
                    case 'death':
                        say(rule.key, { name: p.name }, '#ff8585');
                        sfxDeath();
                        screenShake();
                        burstAtToken(p, ['#ff8585', '#5a2030']);
                        p.el.classList.add('ghosted');
                        await wait(650);
                        p.pos = 0;
                        layoutAllTokens(false);
                        await wait(500);
                        p.el.classList.remove('ghosted');
                        break;
                }
            }

            function handleTrapHold(p, spot, key) {
                var other = state.occupant[spot];
                if (other && other !== p) {
                    other.trappedIn = null;
                    other.trapCount = 0;
                    state.occupant[spot] = p;
                    p.trappedIn = spot;
                    p.trapCount = 0;
                    say('steal' + spot.charAt(0).toUpperCase() + spot.slice(1), { name: p.name, other: other.name }, '#ff9c9c');
                    sfxWhoosh();
                    floatText('SWAP!', eventX(p), eventY(p) - 18, '#59e3ff');
                } else if (!other) {
                    state.occupant[spot] = p;
                    p.trappedIn = spot;
                    p.trapCount = 0;
                    say(key, { name: p.name }, '#ff9c9c');
                    sfxTrap();
                    screenShake();
                }
                burstAtToken(p, ['#8899bb']);
            }

            function tokenScreenPos(p) {
                var r = p.el.getBoundingClientRect();
                return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
            }
            function eventX(p) { return tokenScreenPos(p).x; }
            function eventY(p) { return tokenScreenPos(p).y; }
            function burstAtToken(p, colors) {
                var c = tokenScreenPos(p);
                burst(c.x, c.y, colors, 34);
            }

            async function playTurn() {
                if (state.phase !== 'idle') return;
                var p = state.players[state.turn];
                if (!p) return;
                if (p.isBot) rollBtn.disabled = true;

                if (p.skipTurns > 0) {
                    p.skipTurns--;
                    say('skipTurn', { name: p.name }, '#ffb457');
                    sfxSnore();
                    await wait(900);
                    return endTurn();
                }
                if (p.trappedIn) {
                    p.trapCount++;
                    if (p.trapCount >= 6) {
                        state.occupant[p.trappedIn] = null;
                        p.trappedIn = null;
                        p.trapCount = 0;
                        say('freed', { name: p.name }, '#7fe3a3');
                        sfxWhoosh();
                        burstAtToken(p, ['#7fe3a3']);
                    } else {
                        var spotName = p.trappedIn === 'well' ? 'stuck in the well' : 'behind bars';
                        statusEl.textContent = p.name + ' is ' + spotName + ' (' + (6 - p.trapCount) + ' turns left...)';
                        statusEl.style.color = '#9db4c8';
                        statusEl.classList.remove('pop'); void statusEl.offsetHeight; statusEl.classList.add('pop');
                        sfxSnore();
                        await wait(900);
                        return endTurn();
                    }
                }

                state.phase = 'rolling';
                rollBtn.disabled = true;
                say('roll', { name: p.name }, p.color);

                var rolled = await rollDiceAnim();
                var d1 = rolled[0], d2 = rolled[1], total = d1 + d2;

                if (p.firstThrow && ((d1 === 6 && d2 === 3) || (d1 === 6 && d2 === 4))) {
                    p.firstThrow = false;
                    var to = d1 === 6 && d2 === 3 ? 26 : 53;
                    say('bonus', { name: p.name, to: to }, '#ffd166');
                    sfxWhoosh();
                    burstAtToken(p, ['#ffcf6e', '#59e3ff']);
                    await wait(400);
                    await slideTo(p, to);
                    await resolveLanding(p, total, 0);
                    return finishMove(p);
                }
                p.firstThrow = false;

                var target = bounceTarget(p.pos, total);
                if (target < p.pos + total) {
                    say('bounce', { name: p.name }, '#ff9c9c');
                }
                await travel(p, walkSequence(p.pos, total));
                await resolveLanding(p, total, 0);
                finishMove(p);
            }

            async function finishMove(p) {
                if (p.pos === FINISH) return doWin(p);
                state.phase = 'idle';
                endTurn();
            }

            function endTurn() {
                var cur = state.players[state.turn];
                if (cur && cur.extraRoll > 0) {
                    cur.extraRoll--;
                    state.phase = 'idle';
                    updateTurnUI();
                    say('againNow', { name: cur.name }, cur.color);
                    rollBtn.disabled = false;
                    return;
                }
                state.turn = (state.turn + 1) % state.players.length;
                state.phase = 'idle';
                updateTurnUI();
                var nxt = state.players[state.turn];
                if (nxt.isBot && nxt.taunts && Math.random() < 0.3) sayRaw(pick(nxt.taunts), nxt.color);
                else promptRollFor(nxt);
                rollBtn.disabled = false;
            }
            function promptRollFor(p) {
                if (!p) return;
                if (p.isBot) say('tapForBot', { t: p.name }, p.color);
                else say('yourTurn', { name: p.name }, p.color);
            }
            function sayRaw(txt, color) {
                statusEl.textContent = txt;
                statusEl.style.color = color || '#eaf3fb';
                statusEl.classList.remove('pop'); void statusEl.offsetHeight; statusEl.classList.add('pop');
            }

            function doWin(p) {
                state.phase = 'over';
                rollBtn.disabled = true;
                stats.games++;
                stats.wins[p.name] = (stats.wins[p.name] || 0) + 1;
                saveJSON('gg_stats', stats);
                sfxWin();
                sayRaw(QUIPS.win[0].split('{name}').join(p.name), p.color);
                var c = tokenScreenPos(p);
                var storm = 0;
                var iv = setInterval(function () {
                    burst(rnd(fw * 0.15, fw * 0.85), rnd(fh * 0.2, fh * 0.55), ['#ffcf6e', '#59e3ff', '#ff7ab8', '#7fe3a3'], 46);
                    if (++storm >= 4) clearInterval(iv);
                }, 380);
                $('winnerTitle').textContent = p.name + ' wins!';
                var jokes = ['Flawless waddling.', 'The geese salute you.', 'Science will study this run.', 'Somebody call the pond. We have a champion.'];
                $('winnerSub').textContent = pick(jokes) + ' Total wins: ' + stats.wins[p.name] + '.';
                setTimeout(function () { $('winOverlay').classList.add('open'); }, 1100);
            }

            rollBtn.addEventListener('click', function () { ensureAudio(); playTurn(); });
            soundBtn.addEventListener('click', function () {
                muted = !muted;
                soundBtn.classList.toggle('muted', muted);
                try { localStorage.setItem('gg_muted', muted ? '1' : '0'); } catch (e) {}
                if (!muted) { ensureAudio(); sfxClick(); }
            });
            document.addEventListener('pointerdown', ensureAudio, { once: true });
            $('startBtn').addEventListener('click', function () { ensureAudio(); sfxClick(); startGame(); });
            $('rematchBtn').addEventListener('click', function () { sfxClick(); startGame(); });
            $('changePlayersBtn').addEventListener('click', function () {
                sfxClick();
                $('winOverlay').classList.remove('open');
                $('setupOverlay').classList.add('open');
                state.phase = 'setup';
            });
            $('resetStatsBtn').addEventListener('click', function () {
                sfxClick();
                stats = { games: 0, wins: {} };
                saveJSON('gg_stats', stats);
                renderSeats();
            });

            buildBoard();
            buildDie(cube1);
            buildDie(cube2);
            fxResize();
            requestAnimationFrame(fxLoop);
            renderSeats();

            window.__gooseDebug = {
                serp: serp,
                walkSequence: walkSequence,
                bounceTarget: bounceTarget,
                COLS: COLS,
                ROWS: ROWS,
                FINISH: FINISH,
                RULES: RULES,
                GOOSE_TILES: GOOSE_TILES,
                get state() { return state; },
                get stats() { return stats; }
            };
        })();
    </script>
</body>
</html>
