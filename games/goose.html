<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1226">
    <title data-i18n="games.goose.title">Game of the Goose - Luca Gandolfi</title>
    <style>
        :root {
            --bg0: #070d1d;
            --bg1: #0e1e33;
            --bg2: #123240;
            --gold: #ffcf6e;
            --cyan: #59e3ff;
            --pink: #ff7ab8;
            --green: #57d98a;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-brd: rgba(255, 255, 255, 0.11);
            --txt-dim: #9db4c8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(120% 90% at 50% -10%, #1d3a5f 0%, transparent 55%),
                radial-gradient(90% 60% at 85% 110%, #143a2f 0%, transparent 60%),
                linear-gradient(165deg, var(--bg1) 0%, var(--bg0) 100%);
            color: white;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 12px;
            position: relative;
            z-index: 20;
            min-height: 44px;
        }
        .back-btn {
            color: var(--txt-dim);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            padding: 8px 10px;
            border-radius: 10px;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .back-btn:active { background: var(--glass); color: #fff; }
        .hdr-title {
            text-align: center;
            min-width: 0;
        }
        .hdr-title h1 {
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-size: clamp(1.05rem, 4.6vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(92deg, var(--gold), #ffe9b8 45%, var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hdr-title p {
            font-size: 0.62rem;
            color: var(--txt-dim);
            letter-spacing: 0.4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 12px;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            color: #dbe7f2;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .icon-btn:active { transform: scale(0.93); background: rgba(255,255,255,0.14); }
        .icon-btn svg { width: 19px; height: 19px; fill: currentColor; }
        .sound-btn .slash { display: none; }
        .sound-btn.muted .wave { display: none; }
        .sound-btn.muted .slash { display: block; }

        .status-bar {
            margin: 2px auto 4px;
            width: min(94vw, 560px);
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px 16px;
            background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
            border: 1px solid var(--glass-brd);
            border-radius: 16px;
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-weight: 600;
            font-size: clamp(0.82rem, 3.6vw, 1rem);
            line-height: 1.25;
            z-index: 20;
        }
        .status-bar.pop { animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.3); }
        @keyframes popIn { from { transform: scale(0.86); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }

        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            position: relative;
            z-index: 10;
            padding: 2px 8px;
        }
        .board-wrap {
            position: relative;
            height: 100%;
            max-height: 100%;
            aspect-ratio: 8 / 9;
            max-width: min(94vw, 520px);
        }
        @supports not (aspect-ratio: 1) { .board-wrap { width: min(94vw, 480px); height: auto; } }
        .board-wrap.shake { animation: shake 0.45s linear; }
        @keyframes shake {
            10% { transform: translate(-7px, 3px) rotate(-0.6deg); } 25% { transform: translate(6px, -4px) rotate(0.5deg); }
            45% { transform: translate(-5px, -3px); } 65% { transform: translate(4px, 3px) rotate(0.4deg); }
            85% { transform: translate(-2px, 1px); } 100% { transform: none; }
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 3.5px;
            width: 100%;
            height: 100%;
            padding: clamp(7px, 1.8vmin, 13px);
            border-radius: 24px;
            background: linear-gradient(165deg, rgba(22, 58, 48, 0.75), rgba(10, 26, 43, 0.85));
            border: 1px solid var(--glass-brd);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 46px rgba(0,0,0,0.5);
        }
        .tile {
            position: relative;
            border-radius: 14%;
            background: linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, box-shadow 0.3s;
        }
        .tile .num {
            position: absolute;
            top: 4%;
            left: 8%;
            font-size: clamp(6px, 1.6vmin, 11px);
            font-weight: 800;
            color: rgba(255,255,255,0.34);
            letter-spacing: -0.5px;
        }
        .tile svg.icon { width: 58%; height: 58%; pointer-events: none; }
        .tile.t-goose {
            background: linear-gradient(150deg, rgba(255,207,110,0.30), rgba(255,180,60,0.10));
            border-color: rgba(255,207,110,0.55);
            animation: gooseGlow 2.4s ease-in-out infinite;
        }
        @keyframes gooseGlow {
            0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 0 0px rgba(255,207,110,0); }
            50% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 14px rgba(255,207,110,0.35); }
        }
        .tile.t-goose .wing { animation: flap 1.6s ease-in-out infinite; transform-origin: 10px 13px; }
        @keyframes flap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-28deg); } }
        .tile.t-start { background: linear-gradient(150deg, rgba(87,217,138,0.30), rgba(87,217,138,0.08)); border-color: rgba(87,217,138,0.5); }
        .tile.t-end {
            background: linear-gradient(150deg, rgba(89,227,255,0.32), rgba(255,207,110,0.12));
            border: 1.5px solid rgba(89,227,255,0.7);
            animation: endPulse 1.8s ease-in-out infinite;
        }
        @keyframes endPulse {
            0%, 100% { box-shadow: 0 0 6px rgba(89,227,255,0.25); }
            50% { box-shadow: 0 0 20px rgba(89,227,255,0.55); }
        }
        .tile.t-inn { background: linear-gradient(150deg, rgba(255,170,80,0.26), rgba(255,170,80,0.07)); border-color: rgba(255,170,80,0.45); }
        .tile.t-well { background: linear-gradient(150deg, rgba(90,140,255,0.28), rgba(90,140,255,0.07)); border-color: rgba(90,140,255,0.5); }
        .tile.t-maze { background: linear-gradient(150deg, rgba(183,139,255,0.26), rgba(183,139,255,0.07)); border-color: rgba(183,139,255,0.45); }
        .tile.t-prison { background: linear-gradient(150deg, rgba(160,170,190,0.26), rgba(160,170,190,0.06)); border-color: rgba(160,170,190,0.42); }
        .tile.t-skull { background: linear-gradient(150deg, rgba(255,95,95,0.30), rgba(120,30,30,0.14)); border-color: rgba(255,95,95,0.55); }
        .tile.t-boost { background: linear-gradient(150deg, rgba(127,227,163,0.28), rgba(87,217,138,0.07)); border-color: rgba(127,227,163,0.5); }
        .tile.t-prize { background: linear-gradient(150deg, rgba(255,207,110,0.26), rgba(255,207,110,0.07)); border-color: rgba(255,207,110,0.5); }
        .tile.t-swap { background: linear-gradient(150deg, rgba(89,227,255,0.26), rgba(89,227,255,0.07)); border-color: rgba(89,227,255,0.5); }
        .tile.t-back { background: linear-gradient(150deg, rgba(255,156,110,0.28), rgba(160,60,30,0.12)); border-color: rgba(255,156,110,0.5); }
        .tile.t-skip2 { background: linear-gradient(150deg, rgba(255,180,87,0.26), rgba(255,180,87,0.06)); border-color: rgba(255,180,87,0.48); }
        .tile.landed { animation: landPop 0.4s ease; }
        @keyframes landPop { 40% { transform: scale(1.12); } }
        .tile.active-turn { border-color: rgba(255,255,255,0.55); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 0 10px rgba(255,255,255,0.18); }

        .token-layer { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
        .token {
            position: absolute;
            width: 8.5%;
            aspect-ratio: 1;
            transform: translate(-50%, -58%);
            transition: left 0.23s ease, top 0.23s ease;
            will-change: left, top;
        }
        .tok-inner { width: 100%; height: 100%; position: relative; }
        .tok-inner.hop { animation: hop 0.23s ease; }
        @keyframes hop { 45% { transform: translateY(-52%) scale(1.05, 0.95); } 80% { transform: translateY(4%) scale(0.94, 1.06); } }
        .tok-inner svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.45)); }
        .tok-inner::after {
            content: '';
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: -7%;
            height: 14%;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            filter: blur(1.5px);
        }
        .token.cur .tok-inner::before {
            content: '';
            position: absolute;
            inset: -14%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.75);
            animation: curSpin 3s linear infinite;
        }
        @keyframes curSpin { to { transform: rotate(360deg); } }
        .token.ghosted { opacity: 0.35; }
        .float-txt {
            position: fixed;
            z-index: 80;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 0.95s ease-out forwards;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            white-space: nowrap;
        }
        @keyframes floatUp {
            from { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
            25% { opacity: 1; transform: translate(-50%, -18px) scale(1.1); }
            to { transform: translate(-50%, -64px) scale(1); opacity: 0; }
        }
        #fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 55; }

        .dock {
            padding: 6px 14px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 20;
        }
        .dice-row { display: flex; gap: 14px; perspective: 700px; }
        .die { --sz: clamp(42px, 8.4vmin, 56px); width: var(--sz); height: var(--sz); position: relative; }
        .cube {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transition: transform 0.95s cubic-bezier(0.18, 0.7, 0.22, 1);
            transform: rotateX(-18deg) rotateY(24deg);
        }
        .face {
            position: absolute;
            inset: 0;
            border-radius: 22%;
            background: linear-gradient(150deg, #fdfefe, #ccd8e2);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: inset 0 0 10px rgba(90,120,150,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .face svg { width: 78%; height: 78%; }
        .roll-btn {
            font-family: 'Fredoka', 'Inter', sans-serif;
            font-weight: 700;
            font-size: clamp(1rem, 4.6vw, 1.25rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #10233c;
            background: linear-gradient(160deg, #ffd98a, var(--gold) 55%, #eda93f);
            border: none;
            border-radius: 20px;
            min-width: clamp(130px, 38vw, 200px);
            min-height: 52px;
            padding: 10px 22px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 6px 16px rgba(255, 190, 80, 0.35), inset 0 1px 0 rgba(255,255,255,0.6);
            transition: transform 0.12s, filter 0.15s, opacity 0.3s;
        }
        .roll-btn:active:not(:disabled) { transform: scale(0.94); filter: brightness(1.1); }
        .roll-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .turn-chip {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--glass-brd);
            border-radius: 20px;
            padding: 3px 12px 3px 6px;
            font-size: 0.72rem;
            font-weight: 700;
            z-index: 31;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .turn-dot { width: 14px; height: 14px; border-radius: 50%; }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(4, 8, 18, 0.66);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }
        .panel {
            width: min(92vw, 400px);
            max-height: 84dvh;
            overflow-y: auto;
            background: linear-gradient(165deg, rgba(28, 48, 74, 0.92), rgba(12, 24, 42, 0.94));
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
            transform: translateY(14px) scale(0.97);
            transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }
        .overlay.open .panel { transform: none; }
        .panel h2 { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
        .panel .sub { font-size: 0.8rem; color: var(--txt-dim); text-align: center; margin-bottom: 14px; }
        .seat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            border-radius: 16px;
            padding: 9px 12px;
            margin-bottom: 8px;
        }
        .seat-swatch { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: 0 0 10px -2px currentColor; }
        .seat-name { flex: 1; min-width: 0; font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .seg { display: flex; background: rgba(0,0,0,0.35); border-radius: 12px; padding: 3px; gap: 2px; }
        .seg button {
            border: none;
            background: transparent;
            color: var(--txt-dim);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.72rem;
            padding: 6px 10px;
            border-radius: 9px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .seg button.on { background: rgba(255,255,255,0.18); color: #fff; }
        .seg button:active { transform: scale(0.94); }
        .shuffle-btn {
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            cursor: pointer;
            touch-action: manipulation;
            display: none;
            align-items: center;
            justify-content: center;
            flex: none;
        }
        .shuffle-btn.show { display: flex; }
        .shuffle-btn svg { width: 15px; height: 15px; fill: currentColor; }
        .stats-line {
            margin-top: 10px;
            font-size: 0.72rem;
            color: var(--txt-dim);
            text-align: center;
            line-height: 1.6;
        }
        .stats-line b { color: var(--gold); }
        .primary-btn {
            width: 100%;
            margin-top: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.02rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #10233c;
            background: linear-gradient(160deg, #9be8bd, var(--green) 60%, #2fae67);
            border: none;
            border-radius: 18px;
            min-height: 52px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 6px 16px rgba(70, 200, 130, 0.3), inset 0 1px 0 rgba(255,255,255,0.55);
        }
        .primary-btn:active { transform: scale(0.97); }
        .ghost-btn {
            width: 100%;
            margin-top: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-brd);
            color: #e6eff7;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.88rem;
            border-radius: 16px;
            min-height: 46px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .ghost-btn:active { background: rgba(255,255,255,0.2); }
        .trophy-wrap { display: flex; justify-content: center; margin: 6px 0 10px; }
        .trophy-wrap svg { width: 76px; height: 76px; filter: drop-shadow(0 6px 18px rgba(255,207,110,0.45)); animation: trophyBob 1.6s ease-in-out infinite; }
        @keyframes trophyBob { 50% { transform: translateY(-7px) rotate(3deg); } }
        .toast-msg {
            position: fixed;
            left: 50%;
            bottom: calc(max(10px, env(safe-area-inset-bottom)) + 96px);
            transform: translateX(-50%) translateY(8px);
            background: rgba(220, 60, 60, 0.95);
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            z-index: 95;
            white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%); }
        @media (max-height: 560px) {
            .hdr-title p { display: none; }
            .status-bar { min-height: 30px; font-size: 0.78rem; }
            .die { --sz: 36px; }
            .roll-btn { min-height: 44px; }
            .board { padding: 5px; gap: 2.5px; }
        }

        /* ================= MODERN MEADOW OVERHAUL ================= */
        :root{
            --glass2:rgba(255,255,255,.09);
            --glow:rgba(89,227,255,.35);
        }
        body.orchard{
            background:
              radial-gradient(900px 520px at 12% -8%, rgba(89,227,255,.16), transparent 60%),
              radial-gradient(800px 480px at 92% 4%, rgba(255,122,184,.13), transparent 60%),
              radial-gradient(700px 460px at 50% 112%, rgba(87,217,138,.12), transparent 60%),
              linear-gradient(165deg,#0d1c33 0%,#070d1d 100%);
        }
        .meadow-fx{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
        .meadow-fx i{position:absolute;display:block;border-radius:50%;filter:blur(1px);animation:driftFly linear infinite}
        @keyframes driftFly{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
          12%{opacity:.85}88%{opacity:.85}100%{transform:translate3d(60px,-100vh,0) rotate(360deg);opacity:0}}
        .app-header{position:relative;z-index:6}
        .status-bar{position:relative;z-index:6;display:flex;align-items:center;justify-content:center;
          gap:8px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1),rgba(255,255,255,.05));
          border:1px solid var(--glass-brd);border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.28)}
        .status-bar::before{content:'✦';color:var(--gold);font-size:.9rem}
        .board-wrap{border-radius:22px;box-shadow:0 22px 60px rgba(0,0,0,.5),0 0 40px rgba(89,227,255,.1)}
        .board{padding:8px;gap:3px;border-radius:18px;
          background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
          border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
        .board .tile{
          border-radius:9px !important;
          background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.035)) !important;
          border:1px solid rgba(255,255,255,.1) !important;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.18);
          transition:transform .18s,box-shadow .25s,background .25s;
        }
        .board .tile:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 18px rgba(0,0,0,.35),0 0 14px var(--glow)}
        .board .tile.t-goose{background:linear-gradient(150deg,rgba(255,207,110,.28),rgba(255,207,110,.06)) !important;
          border-color:rgba(255,207,110,.45) !important}
        .board .tile.t-end{background:linear-gradient(150deg,rgba(255,209,102,.4),rgba(255,122,184,.12)) !important;
          box-shadow:0 0 22px rgba(255,209,102,.3)}
        .board .tile.t-trap{background:linear-gradient(150deg,rgba(255,93,93,.25),rgba(255,93,93,.04)) !important}
        .board .tile.landed{box-shadow:0 0 22px var(--gold),inset 0 0 12px rgba(255,255,255,.25)}
        .board .tile.active-turn{border-color:var(--cyan) !important;box-shadow:0 0 16px var(--glow)}
        .board .tile .num{font-family:'JetBrains Mono',monospace;font-size:.62rem;opacity:.8}

                    case 'boost':

                        burstAtToken(p, ['#7fe3a3', '#ffcf6e']);

                        await slideTo(p, rule.to);

                        burstAtToken(p, ['#ff9c6e']);

                            miniCtx.fillStyle = '#10283a'; miniCtx.fillRect(0, 0, miniMC.width, miniMC.height);
                            var w = miniMC.width - 80, x0 = 40;
                            miniCtx.fillStyle = 'rgba(87,217,138,.35)'; miniCtx.fillRect(x0 + w * .38, 90, w * .24, 60);
                            miniCtx.fillStyle = '#fff'; miniCtx.fillRect(x0 + x * w - 3, 78, 6, 84);
                            miniDrawText('Tentativi ' + tries + '/3 · Riusciti ' + hits, 40, 19, '#ffd166');
                            if (!locked) { x += dir * .012; if (x > 1 || x < 0) dir *= -1; }
                            if ($('miniOverlay').classList.contains('open')) miniRAF = requestAnimationFrame(frame);
                        }
                        miniRAF = requestAnimationFrame(frame);
                    });
                });
            }
            function miniDuel() {
                return miniOpen('🎲 Dice Duel', 'Sfida il bot: chi fa il punteggio più alto guadagna passi.', {}).then(function () {
                    return new Promise(function (resolve) {
                        miniDrawText('Pronto a sfidare il bot?', 110, 22);
                        miniButton('🎲 Tira!', function () {
                            var me = 2 + Math.floor(Math.random() * 11), bot = 2 + Math.floor(Math.random() * 11);
                            miniCtx.fillStyle = '#10283a'; miniCtx.fillRect(0, 0, miniMC.width, miniMC.height);
                            miniDrawText('Tu: ' + me, 90, 30, '#59e3ff');
                            miniDrawText('Bot: ' + bot, 140, 30, '#ff7ab8');
                            miniDrawText(me > bot ? 'Vinci! +3 passi' : me === bot ? 'Pareggio +1' : 'Perdi… +0', 195, 20, '#ffd166');
                            tone(me > bot ? 900 : 300, .2);
                            setTimeout(function () { miniClose(); resolve(me > bot ? 3 : me === bot ? 1 : 0); }, 1300);
                        });
                    });
                });
            }
            var TRIVIA = [
                { q: 'Quante piume ha un’oca adulta?', a: ['~25.000', '~500', '~2'], ok: 0 },
                { q: 'Le oche sanno volare?', a: ['Sì, e molto in alto', 'No', 'Solo di notte'], ok: 0 },
                { q: 'Come si dice il verso dell’oca?', a: ['Honk', 'Miao', 'Cra'], ok: 0 },
                { q: 'Un’oca può essere vegetariana?', a: ['Sì, mangia erba', 'No, solo pane', 'Solo d’inverno'], ok: 0 },
                { q: 'Quanto dura un gioco di oca classico?', a: ['Dipende dai dadi', 'Esattamente 10 minuti', 'Mai'], ok: 0 }
            ];
            function miniTrivia() {
                return miniOpen('🧠 Goose Trivia', 'Rispondi alle domande: ogni risposta giusta vale 1 passo.', {}).then(function () {
                    return new Promise(function (resolve) {
                        var i = 0, good = 0;
                        function ask() {
                            if (i >= 3) { miniClose(); if (good >= 3) unlockAch('trivia'); resolve(good); return; }
                            var q = pick(TRIVIA); i++;
                            miniCtx.fillStyle = '#10283a'; miniCtx.fillRect(0, 0, miniMC.width, miniMC.height);
                            miniDrawText(q.q, 46, 18, '#fff');
                            $('miniBtns').innerHTML = '';
                            q.a.forEach(function (a, k) {
                                miniButton((k + 1) + '. ' + a, function () {
                                    if (k === q.ok) { good++; tone(820, .08); }
                                    else tone(200, .12, 'square');
                                    ask();
                                });
                            });
                        }
                        ask();
                    });
                });
            }
            function miniPond() {
                return miniOpen('🪷 Pond Skip', 'Tocca quando la pedina raggiunge la ninfea. 3 salti.', {}).then(function () {
                    return new Promise(function (resolve) {
                        var pos = 0, dir = 1, round = 0, got = 0, locked = false;
                        function attempt() { if (locked) return; locked = true;
                            var ok = Math.abs(pos - .5) < .09;
                            if (ok) { got++; tone(920, .1); } else tone(180, .14, 'square');
                            round++;
                            setTimeout(function () { locked = false; if (round >= 3) { miniClose(); resolve(got * 2); } }, 380);
                        }
                        miniOnTap(attempt); miniButton('Salta!', attempt);
                        function frame() {
                            miniCtx.fillStyle = '#10283a'; miniCtx.fillRect(0, 0, miniMC.width, miniMC.height);
                            var w = miniMC.width - 80, x0 = 40;
                            miniCtx.fillStyle = '#57d98a';
                            miniCtx.beginPath(); miniCtx.ellipse(x0 + w * .5, 140, 30, 14, 0, 0, 6.28); miniCtx.fill();
                            miniCtx.fillStyle = '#ffd166';
                            miniCtx.beginPath(); miniCtx.arc(x0 + pos * w, 110, 12, 0, 6.28); miniCtx.fill();
                            miniDrawText('Salto ' + round + '/3 · Riusciti ' + got, 36, 18, '#ffd166');
                            if (!locked) { pos += dir * .014; if (pos > 1 || pos < 0) dir *= -1; }
                            if ($('miniOverlay').classList.contains('open')) miniRAF = requestAnimationFrame(frame);
                        }
                        miniRAF = requestAnimationFrame(frame);
                    });
                });
            }
            function runMinigame(p, tile) {
                var kind = MINI_TILES[tile]; if (!kind) return Promise.resolve(0);
                if (p.isBot || MODES[ext.mode].bots) {
                    var bonus = Math.floor(Math.random() * 3);
                    showToast(p.name + ' gioca ' + kind + '… +' + bonus);
                    return Promise.resolve(bonus);
                }
                var runner = { feather: miniFeather, honk: miniHonk, duel: miniDuel, trivia: miniTrivia, pond: miniPond }[kind];
                return runner ? runner() : Promise.resolve(0);
            }

            /* -------- hook nel motore esistente -------- */
            var __origStart = startGame;
            startGame = function () {
                ext.round = 0; ext.fog = 0;
                if (MODES[ext.mode].bots) {
                    var modes = seatModes.slice();
                    modes.forEach(function (m, i) { if (m === 'human') modes[i] = 'bot'; });
                    seatModes = modes; renderSeats();
                }
                __origStart();
                decorateTokens(); updatePowerBar(); renderAchievements();
                if (ext.mode === 'royal') showToast('Battle Royale: eliminazione ogni 8 turni!');
            };
            var __origResolve = resolveLanding;
            resolveLanding = async function (p, roll, depth) {
                if (depth === 0 && !ext.fog && p.pos !== FINISH && p._miniDone !== p.pos) {
                    p._miniDone = p.pos;
                    var bonus = await runMinigame(p, p.pos);
                    if (bonus > 0 && !p.trappedIn) {
                        p.pos = Math.min(FINISH, p.pos + bonus);
                        layoutAllTokens(true);
                        showToast('+' + bonus + ' passi dal minigioco!');
                    }
                }
                return __origResolve(p, roll, depth);
            };
            var __origEndTurn = endTurn;
            endTurn = function () {
                ext.round++;
                ext.fog = 0;
                var m = MODES[ext.mode];
                if (m.eliminate && ext.round % m.eliminate === 0) {
                    var alive = state.players.filter(function (p) { return !p.eliminated; });
                    if (alive.length > 2) {
                        var last = alive.slice().sort(function (a, b) { return a.pos - b.pos; })[0];
                        if (last) { last.eliminated = true; last.trappedIn = 'prison'; last.trapCount = 0;
                            showEventBanner({ icon: '💀', name: 'Eliminazione!', text: last.name + ' è fuori gara' });
                            if (last.el) last.el.style.opacity = '.25';
                        }
                    }
                }
                maybeEvent(ext.mode === 'chaos');
                var r = __origEndTurn();
                updatePowerBar();
                return r;
            };
            var __origDoWin = doWin;
            doWin = function (p) {
                if (ext.mode === 'speedrun') unlockAch('speed');
                if (ext.mode === 'chaos') unlockAch('chaos');
                unlockAch('first');
                return __origDoWin(p);
            };

            /* -------- tema -------- */
            function applyTheme() {
                document.body.classList.toggle('orchard', ext.theme !== 'dark');
                $('themeToggle').textContent = ext.theme === 'dark' ? '🌙' : '🌿';
            }
            $('themeToggle').onclick = function () {
                ext.theme = ext.theme === 'dark' ? 'night' : 'dark';
                saveExt(); applyTheme();
            };

            /* -------- init estensione -------- */
            buildMeadow(); buildModePicker(); buildHats(); renderAchievements(); applyTheme();
            renderSeats();
            window.__gooseExt = { ext: ext, MODES: MODES, EVENTS: EVENTS, ACHIEVEMENTS: ACHIEVEMENTS,
                maybeEvent: maybeEvent, unlockAch: unlockAch, runMinigame: runMinigame };
        })();
    </script>
</body>
</html>
