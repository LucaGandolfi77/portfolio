<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d2a24">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Orto Magico — giardino idle con stagioni, spiriti, semi mutanti e PWA offline.">
  <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/games/orto-magico/">
  <title>Orto Magico — giardino idle</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="app">
  <header class="app-header glass">
    <div class="brand">
      <span class="brand-mark">🌿</span>
      <div><p class="eyebrow">GIARDINO IDLE</p><h1>Orto Magico</h1><p class="subtitle" id="hudMode">Coltiva · annaffia · raccogli</p></div>
    </div>
    <div class="header-actions">
      <div class="stats">
        <span class="stat">🪙 <b id="hudCoins">0</b></span>
        <span class="stat">💎 <b id="hudGems">0</b></span>
        <span class="stat">⭐ <b id="hudLevel">1</b></span>
        <span class="stat" id="hudSeason">🌸</span>
        <span class="stat" id="hudWeather">☀️</span>
      </div>
      <button class="icon-btn hidden" id="installBtn" title="Installa">⬇</button>
      <button class="icon-btn" id="soundToggle" title="Suoni">🔊</button>
      <button class="icon-btn" id="hapticsBtn" title="Vibrazione">📳</button>
      <a class="icon-btn" href="../../index.html" title="Portfolio">←</a>
    </div>
    <div class="xp-track"><i id="hudXpBar"></i></div>
  </header>

  <section class="selector glass">
    <div class="selector-row"><span class="lbl">Modalità</span><div class="pill-row" id="modeRow"></div></div>
    <div class="selector-row"><span class="lbl">Stagione</span><div class="pill-row" id="seasonRow"></div>
      <span class="lbl">Meteo</span><div class="pill-row" id="weatherRow"></div></div>
    <div class="selector-row"><span class="lbl">Spiriti</span><div class="pill-row" id="spiritRow"></div>
      <span class="stat" id="hudStreak">🔥 0</span></div>
  </section>

  <div class="timer glass hidden" id="timePanel"><span id="timeLabel">60s</span><div class="timer-track"><i id="timeBar"></i></div><button class="btn small" id="timeStartBtn">Avvia sfida</button></div>

  <main class="app-shell">
    <nav class="tabs" id="mainTabs" role="tablist">
      <button class="tab on" data-tab="garden">🌱 Orto</button>
      <button class="tab" data-tab="shop">🛒 Negozio</button>
      <button class="tab" data-tab="goals">🏅 Obiettivi</button>
      <button class="tab" data-tab="album">📖 Album</button>
    </nav>

    <section class="panel on" id="panel-garden">
      <div class="garden-head"><h2>Il tuo orto</h2><button class="btn" id="newPlotBtn">➕ Nuovo campo</button></div>
      <div class="garden-grid" id="gardenGrid"></div>
    </section>
    <section class="panel" id="panel-shop"><div id="shopSection"></div></section>
    <section class="panel" id="panel-goals"><div id="goalsSection"></div></section>
    <section class="panel" id="panel-album"><div id="albumSection"></div></section>
  </main>

  <footer class="app-footer glass">
    <button class="btn" id="shareBtn">📤 Condividi</button>
    <span>Orto Magico · PWA offline</span>
  </footer>
</div>

<div class="overlay hidden" id="welcomeOverlay"><div class="glass-sheet dialog">
  <div class="dialog-icon">🌤️</div><h2>Bentornato!</h2><p id="welcomeText"></p>
  <button class="btn primary" id="welcomeClose">Continua</button>
</div></div>

<div class="overlay hidden" id="endOverlay"><div class="glass-sheet dialog">
  <div class="dialog-icon">🏆</div><h2 id="endTitle">Sfida completata!</h2><p id="endText"></p>
  <button class="btn primary" id="endClose">Chiudi</button>
</div></div>

<div class="update-bar hidden" id="updateBar"><span>Nuova versione disponibile</span><button id="updateBtn">Aggiorna</button></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
