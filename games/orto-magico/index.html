<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orto Magico">
  <meta name="theme-color" content="#a87b4a">
  <title>Orto Magico</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-orbit orbit-a" aria-hidden="true"></div>
  <div class="background-orbit orbit-b" aria-hidden="true"></div>
  <div class="background-grid" aria-hidden="true"></div>

  <header class="app-header">
    <div>
      <p class="eyebrow">Gioca col pollice verde</p>
      <h1>Orto Magico</h1>
      <p class="subtitle">Coltiva, annaffia, raccogli</p>
    </div>
    <div class="header-actions">
      <button id="install-app" class="ghost-button" type="button" hidden>Installa</button>
      <button id="sound-toggle" class="ghost-button" type="button" aria-pressed="true">Suoni: ON</button>
      <button id="go-home" class="ghost-button" type="button">Menu</button>
    </div>
  </header>

  <main class="app-shell">
    <div id="loading" class="loading">Caricamento...</div>
    <div id="error" class="loading" style="display:none;"></div>
    <div id="app" style="display:none;"></div>
  </main>

  <footer class="app-footer">
    <p>Sviluppato con passione per i giardinieri digitali</p>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
