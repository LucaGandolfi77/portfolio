<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0a2e">
  <title>Mystic Quest - Sky Herd Rescue</title>
  <style>
    /* ===== MOBILE RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; touch-action: none; -webkit-tap-highlight-color: transparent; }
    body { background: #050512; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #d0c0e0; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* ===== SAFE AREA (iPhone) ===== */
    ::after { content: ""; position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: transparent; z-index: 9999; }

    /* ===== UI OVERLAY ===== */
    #ui-overlay { position: fixed; inset: 0; pointer-events: auto; z-index: 10; }
    #hud { position: absolute; top: 12px; left: 12px; display: flex; gap: 16px; align-items: center; font-size: 14px; }
    .star-icon { color: #ffd700; filter: drop-shadow(0 0 2px #fff); }
    #realm-indicator { margin-left: auto; font-size: 12px; opacity: 0.7; }
    #star-count { color: #ffd700; min-width: 22px; text-align: right; }

    /* ===== DIALOGUE BOX ===== */
    #dialogue { position: fixed; bottom: env(safe-area-inset-bottom) + 8px; left: 50%; transform: translateX(-50%) translateY(100px); transition: transform .3s ease, opacity .3s ease; background: rgba(10, 15, 30, 0.92); border: 1px solid #4a2c5a; border-radius: 18px; padding: 14px 18px; max-width: 90%; color: #ffd7a0; line-height: 1.5; font-size: 13px; z-index: 20; opacity: 0; }
    #dialogue.active { transform: translateX(-50%) translateY(0); opacity: 1; }
    #dialogue .name { font-weight: 600; color: #a8d4e6; margin-bottom: 4px; display: block; }
    #dialogue .text { color: #c0b0d0; }

    /* ===== BUTTONS (optional, for desktop WASD hint) ===== */
    .hint { position: fixed; bottom: env(safe-area-inset-bottom) + 60px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #605070; background: rgba(10,10,20,0.7); padding: 6px 10px; border-radius: 6px; z-index: 5; pointer-events: none; }
    .hint span { color: #a0d0ff; margin-right: 4px; }

    /* ===== KEYFRAMES ===== */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keymospheres { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <!-- HUD -->
    <div id="hud">
      <span class="star-icon" title="Stars collected">★</span>
      <span id="star-count">0/15</span>
      <div id="realm-indicator"></div>
    </div>

    <!-- Dialogue box -->
    <div id="dialogue">
      <div class="name" id="dialogue-name">?</div>
      <div class="text" id="dialogue-text">?</div>
    </div>

    <!-- Hint (desktop WASD) -->
    <div class="hint">Move: <span>⎋⎋ WASD</span> / <span>▄▅▶▷ Tap</span></div>
  </div>

  <script>
    // ============================================
    // ===== CORE SETUP & CONSTANTS =====
    // ============================================

    // Canvas & context
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: true });

    // iPhone safe-area insets
    const safeTop = window.visualViewport ? window.visualViewport.safeAreaInsets.top : 0;
    const safeBottom = window.visualViewport ? window.visualViewport.safeAreaInsets.bottom : 0;
    const safeLeft = window.visualViewport ? window.visualViewport.safeAreaInsets.left : 0;
    const safeRight = window.visualViewport ? window.visualViewport.safeAreaInsets.right : 0;

    // DPR & resolution cap
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let W, H; // logical canvas width/height (CSS pixels)

    // Resize canvas to match viewport
    function resize() {
      W = Math.min(window.innerWidth, 420); // keep world bounded for pixel-art
      H = Math.min(window.innerHeight, 640);
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.imageSmoothingEnabled = ctx.msImageSmoothingEnabled = false;
    }
    resize();
    window.addEventListener('resize', resize);

    // ============================================
    // ===== GAME STATE (PLAYER + REALMS) =====
    // ============================================

    // Player (Luma)
    const player = {
      x: W / 2,
      y: H / 2,
      vx: 0,
      vy: 0,
      radius: 12,
      speed: 120, // pixels per second
      targetX: null,
      targetY: null,
      animatedFrame: 0,
      frameTimer: 0,
      direction: 'down' // up/down/left/right/idle
    };

    // Click-to-move: set target when user taps
    function setTargetFromPoint(x, y) {
      // Convert client coords to canvas logical coords
      const rect = canvas.getBoundingClientRect();
      const cx = x - rect.left - safeLeft;
      const cy = y - rect.top - safeTop;
      // Clamp to play area
      const px = Math.max(player.radius, Math.min(W - player.radius, cx));
      const py = Math.max(player.radius, Math.min(H - player.radius, cy));
      player.targetX = px;
      player.targetY = py;
      player.direction = 'idle';
    }

    // Touch events → click-to-move (iPhone primary)
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (e.touches.length > 1) return;
      const touch = e.touches[0];
      setTargetFromPoint(touch.clientX, touch.clientY);
    }, { passive: false });

    // Keyboard fallback: WASD moves player toward +50px offsets
    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') { player.targetY = player.y - 50; player.direction = 'up'; }
      if (e.key === 's' || e.key === 'ArrowDown') { player.targetY = player.y + 50; player.direction = 'down'; }
      if (e.key === 'a' || e.key === 'ArrowLeft') { player.targetX = player.x - 50; player.direction = 'left'; }
      if (e.key === 'd' || e.key === 'ArrowRight') { player.targetX = player.x + 50; player.direction = 'right'; }
    });

    // ============================================
    // ===== REALM & STORY SYSTEM =====
    // ============================================

    // 5 realms, each with 3 stars + 1 spirit
    const REALMS = [
      {
        name: 'Whispering Meadows',
        color: '#4a90e2',
        gradientFrom: '#7eccf5',
        gradientTo: '#2c5aa0',
        stars: 0,
        totalStars: 3,
        spirit: null, // populated when stars collected
        unlocked: true,
        bgLayerYoff: 0
      },
      {
        name: 'Luminous Marshes',
        color: '#7ed321',
        gradientFrom: '#a8e65d',
        gradientTo: '#3a6b1a',
        stars: 0,
        totalStars: 3,
        spirit: null,
        unlocked: false,
        bgLayerYoff: 0
      },
      {
        name: 'Cinder Cliffs',
        color: '#e94a3c',
        gradientFrom: '#f3b5a7',
        gradientTo: '#a02a15',
        stars: 0,
        totalStars: 3,
        spirit: null,
        unlocked: false,
        bgLayerYoff: 0
      },
      {
        name: 'Frostbloom Vale',
        color: '#4a90e2', // will shift
        gradientFrom: '#89cff0',
        gradientTo: '#1e4d7a',
        stars: 0,
        totalStars: 3,
        spirit: null,
        unlocked: false,
        bgLayerYoff: 0
      },
      {
        name: 'Celestial Spire',
        color: '#ffd700',
        gradientFrom: '#fff8dc',
        gradientTo: '#e6c866',
        stars: 0,
        totalStars: 3,
        spirit: null,
        unlocked: false,
        bgLayerYoff: 0
      }
    ];

    let currentRealmIndex = 0;
    let starsCollectedThisRealm = 0;

    // Narrative dialogue lines (each realm has an intro + spirit + completion)
    const narrative = {
      intro: [
        'The Celestial Dawn arrived, and with it a great storm.',
        'Luma\'s stars were scattered across the realms.',
        'Without the stars, the sky grows dim and cold.',
        'You must journey across the realms and find the stars.',
        'Each star you recover restores a color to the sky.'
      ],
      realmIntro(realm) {
        return `The ${realm.name} lies ahead. Its spirit has been lonely for centuries. Calm it with your lantern, and it will guide you deeper.`;
      },
      spiritFreed(realm) {
        return `The ${realm.name} spirit awakens! It was not evil—only lost. It grants you passage to the next realm.`;
      },
      allRealmsComplete: 'All stars recovered. The sky is whole once more. You have become the new guardian of the Celestial Dawn.'
    };

    // Dialogue system
    let dialogueState = {
      active: false,
      lines: [],       // array of {text, duration?}
      lineIndex: 0,
      timer: 0,
      speedTyping: 0
    };

    function startDialogue(lines, onComplete) {
      dialogueState.active = true;
      dialogueState.lines = lines;
      dialogueState.lineIndex = 0;
      dialogueState.timer = 0;
      dialogueState.speedTyping = 0;
      document.getElementById('dialogue-name').textContent = 'Luma';
      document.getElementById('dialogue').classList.add('active');
    }

    function advanceDialogue() {
      if (!dialogueState.active) return;
      dialogueState.lineIndex++;
      if (dialogueState.lineIndex < dialogueState.lines.length) {
        dialogueState.timer = 0;
        dialogueState.speedTyping = 0;
        document.getElementById('dialogue-text').textContent = dialogueState.lines[dialogueState.lineIndex];
      } else {
        endDialogue();
        if (onComplete) onComplete();
      }
    }

    function endDialogue() {
      dialogueState.active = false;
      document.getElementById('dialogue').classList.remove('active');
    }

    // ============================================
    // ===== PARSIMONIOUS RENDERING FUNCTIONS =====
    // ============================================

    // Draw gradient background for current realm
    function drawRealmBackground(realm, t) {
      // t is 0-1 for animated gradient shift
      ctx.save();
      ctx.fillStyle = ctx.createLinearGradient(0, 0 + realm.bgLayerYoff, 0, H + realm.bgLayerYoff);
      ctx.fillStyle = t > 0.5 ? ctx.createLinearGradient(0, 0, 0, H) : ctx.createLinearGradient(0, 0, 0, H);
      // Interpolate between from/to based on t
      const fromC = realm.gradientFrom;
      const toC = realm.gradientTo;
      // Simple lerch by treating hex as RGB
      const lerp = (a, b, t) => Math.round(a + (b - a) * t);
      const r1 = parseInt(fromC.slice(1, 3), 16), g1 = parseInt(fromC.slice(3, 5), 16), b1 = parseInt(fromC.slice(5, 7), 16);
      const r2 = parseInt(toC.slice(1, 3), 16), g2 = parseInt(toC.slice(3, 5), 16), b2 = parseInt(toC.slice(5, 7), 16);
      const tr = lerp(r1, r2, t), tg = lerp(g1, g2, t), tb = lerp(b1, b2, t);
      ctx.fillStyle = `rgb(${tr},${tg},${tb})`;
      ctx.fillRect(0, 0, W, H);

      // Add a subtle radial highlight for ambience
      const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) * 0.6);
      const highlightT = Math.sin(t * Math.PI * 2) * 0.1 + 0.9;
      grad.addColorStop(0, `rgba(255,255,255,${0.04 * highlightT})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Draw a star at given world coords
    function drawStar(x, y, size = 6) {
      ctx.save();
      ctx.translate(x, y);
      // Pulsing size effect
      const pulse = Math.sin(timer * 3) * 0.1 + 0.9;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, size * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw spirit (elemental icon) at given coords
    function drawSpirit(x, y, type) {
      const r = 14;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = type === 'fire' ? '#ff6b6b' : type === 'water' ? '#4a90e2' : '#6ccata';
      ctx.beginPath();
      // Simple shape: a stylized spirit head
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      // Add eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      const eyeOffset = r * 0.3;
      ctx.arc(-eyeOffset, -eyeOffset * 0.5, 3, 0, Math.PI * 2);
      ctx.arc(eyeOffset, -eyeOffset * 0.5, 3, 0, Math.PI * 2);
      ctx.fill();
      // Smile
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, eyeOffset * 0.5, r * 0.4, 0, Math.PI);
      ctx.stroke();
      ctx.restore();
    }

    // Draw player (Luma) – simple pixel-art silhouette with lantern
    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);

      // Lantern glow (always faces up/forward based on direction)
      const glowRadius = 20;
      const glowColor = '#ffd700';
      ctx.fillStyle = glowColor;
      if (player.direction === 'up') {
        ctx.beginPath();
        ctx.arc(0, -player.radius - 4, glowRadius, Math.PI, 0); // half-circle above
        ctx.fill();
      } else if (player.direction === 'down') {
        ctx.beginPath();
        ctx.arc(0, player.radius + 4, glowRadius, 0, Math.PI); // half-circle below
        ctx.fill();
      } else if (player.direction === 'left') {
        ctx.beginPath();
        ctx.arc(-player.radius - 4, 0, glowRadius, Math.PI * 1.5, 0.5); // half-circle left
        ctx.fill();
      } else if (player.direction === 'right') {
        ctx.beginPath();
        ctx.arc(player.radius + 4, 0, glowRadius, Math.PI * 0.5, 1.5); // half-circle right
        ctx.fill();
      }

      // Player body – rounded silhouette
      ctx.fillStyle = '#ffe8c5';
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Add small details: eyes on the face
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(-player.radius * 0.3, -player.radius * 0.3, 3, 0, Math.PI * 2);
      ctx.arc(player.radius * 0.3, -player.radius * 0.3, 3, 0, Math.PI * 2);
      ctx.fill();

      // Footprints trail (simple: just draw a few trailing circles)
      // Not implemented for brevity – could add later

      ctx.restore();
    }

    // Eased movement toward target (click-to-move)
    function updatePlayer(dt) {
      if (player.targetX === null && player.targetY === null) {
        // No destination – idle; could add gentle wandering here
        return;
      }

      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const dist = Math.hypot(dx, dy);

      if (dist < 2) {
        // Arrived! Snap to target and clear.
        player.x = player.targetX;
        player.y = player.targetY;
        player.targetX = null;
        player.targetY = null;
        player.vx = 0;
        player.vy = 0;

        // Check for spirit interaction / star collection
        checkRealmInteraction();
        return;
      }

      // Normalized direction * speed * dt
      const moveX = (dx / dist) * player.speed * dt;
      const moveY = (dy / dist) * player.speed * dt;
      player.x += moveX;
      player.y += moveY;

      // Simple direction tracking for animation/lantern
      if (Math.abs(dx) > Math.abs(dy)) {
        player.direction = dx > 0 ? 'right' : 'left';
      } else {
        player.direction = dy > 0 ? 'down' : 'up';
      }
    }

    // Check if player is near a star or spirit in current realm
    function checkRealmInteraction() {
      const rx = player.x, ry = player.y;
      const realm = REALMS[currentRealmIndex];
      // Proximity check: if player is near the central collect zone,
      // and we still need stars for this realm, count one collection.
      const centerDist = Math.hypot(rx - W/2, ry - H/2);
      if (centerDist < 40 && starsCollectedThisRealm < realm.totalStars) {
        starsCollectedThisRealm++;
        document.getElementById('star-count').textContent = `${starsCollectedThisRealm}/${realm.totalStars}`;
        // Play collection sound (beep beep)
        // TODO: Web Audio chime
        // Check if realm complete
        if (starsCollectedThisRealm >= realm.totalStars) {
          // Free the spirit
          realm.spirit = {
            type: ['fire','water','leaf','leaf','leaf'][currentRealmIndex],
            x: W / 2 + (Math.random() - 0.5) * 80,
            y: H / 2 + (Math.random() - 0.5) * 80
          };
          // Advance dialogue
          startDialogue([narrative.spiritFreed(realm)], () => {
            // Unlock next realm
            unlockNextRealm();
            // Reset stars for next realm
            starsCollectedThisRealm = 0;
            document.getElementById('star-count').textContent = '0/15';
            currentRealmIndex++;
            if (currentRealmIndex >= REALMS.length) {
              // Game complete
              startDialogue([narrative.allRealmsComplete], () => {
                // Could restart or show end screen
                resetGame();
              });
            } else {
              // Show realm transition dialogue
              startDialogue([`The sky shifts... you approach the ${REALMS[currentRealmIndex].name}.`], () => {});
            }
          });
        }
      }
    }

    // Unlock the next realm (set its unlocked flag, reset state)
    function unlockNextRealm() {
      if (currentRealmIndex + 1 < REALMS.length) {
        REALMS[currentRealmIndex + 1].unlocked = true;
        // Reset player to start of new realm
        player.x = W / 2;
        player.y = H / 2;
        player.targetX = null;
        player.targetY = null;
      }
    }

    // Reset entire game (restart)
    function resetGame() {
      currentRealmIndex = 0;
      starsCollectedThisRealm = 0;
      REALMS.forEach(r => { r.stars = 0; r.unlocked = false; r.spirit = null; });
      REALMS[0].unlocked = true;
      REALMS[0].stars = 0;
      currentRealmIndex = 0;
      player.x = W / 2; player.y = H / 2;
      player.targetX = null; player.targetY = null;
      document.getElementById('star-count').textContent = '0/15';
      // Reset narrative/progression as needed
      // For now just reload-ish by resetting UI
      document.getElementById('star-count').textContent = '0/15';
    }

    // ============================================
    // ===== GAME LOOP =====
    // ============================================

    let lastTime = 0;
    let timer = 0; // for background pulsations

    function gameLoop(timestamp) {
      requestAnimationFrame(gameLoop);

      const dt = Math.min(0.04, (timestamp - lastTime) / 1000);  // clamp to 60fps
      lastTime = timestamp;
      timer += dt;

      // ---- Update ----
      updatePlayer(dt);

      // ---- Background realm shift (subtle color animation) ----
      // Each realm has a tiny hue animation; when transitioning to next realm, crossfade
      REALMS.forEach((r, i) => {
        // Very subtle rotation of gradient colors
        r.bgLayerYoff = Math.sin(timer * 0.2 + i) * 0.5;
      });

      // ---- Render ----
      // Clear
      ctx.clearRect(0, 0, W, H);

      // Draw realm background (current realm)
      drawRealmBackground(REALMS[currentRealmIndex], timer * 0.1);

      // Draw stars for current realm (simple: show how many collected out of total)
      // In a full impl each star would have positioned coords; here we just show count
      // But let's draw a few stars scattered as collectible icons:
      const realm = REALMS[currentRealmIndex];
      for (let i = 0; i < realm.totalStars; i++) {
        // Place stars in a rough arc across the top area
        const angle = (i / realm.totalStars) * Math.PI * 2 - Math.PI / 2;
        const dist = 60 + Math.random() * 40;
        const sx = W / 2 + Math.cos(angle) * dist;
        const sy = 40 + Math.sin(angle) * dist + 20;
        // Only draw if not yet collected (or always for demo)
        drawStar(sx, sy, 5);
      }

      // Draw spirit if this realm has one and stars are complete
      if (realm.spirit) {
        drawSpirit(realm.spirit.x, realm.spirit.y, realm.spirit.type);
        // If player gets close, show interaction prompt (already handled via checkRealmInteraction on click)
      }

      // Draw player (Luma with lantern)
      drawPlayer();

      // ---- HUD ----
      document.getElementById('star-count').textContent = `${starsCollectedThisRealm}/${realm.totalStars}`;
      document.getElementById('realm-indicator').textContent = `${REALMS[currentRealmIndex].name} • ${currentRealmIndex + 1}/5`;

      // ---- Dialogue timer (if active) ----
      if (dialogueState.active && dialogueState.lines.length > 0) {
        dialogueState.timer += dt;
        // Typing effect speed: advance line every ~0.03s
        if (dialogueState.speedTyping > 0.03) {
          dialogueState.speedTyping = 0;
          advanceDialogue();
        } else {
          dialogueState.speedTyping += dt;
        }
      }

      // ---- End loop ----
    }

    // ============================================
    // ===== START THE GAME =====
    // ============================================

    // Initialize first realm
    // (already done via REALMS array defaults)

    // Start game loop
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);

    // Console log for dev
    console.log('🌙 Mystic Quest loaded – click/tap to move Luma, rescue stars & free spirits!');
    console.log('Controls: Tap destination on screen / Use WASD on desktop');
  </script>
</body>
</html>
