<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0a1a">
    <title>Offline — Slot Neon</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 50% 0%, #1a1030, #0d0a1a 70%); color: #f5f0ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
        .card { background: rgba(20,14,40,.8); border: 1px solid rgba(251,191,36,.3); border-radius: 20px; padding: 32px 26px; max-width: 380px; }
        h1 { color: #fbbf24; font-size: 1.6rem; margin-bottom: 8px; }
        p { color: #a99fc4; font-size: .9rem; line-height: 1.5; margin-bottom: 20px; }
        button { padding: 11px 22px; border: none; border-radius: 99px; background: linear-gradient(135deg, #fde68a, #f59e0b); color: #1a1030; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📡 Sei offline</h1>
        <p>Torna online una volta per scaricare Slot Neon: poi potrai girare i rulli, pescare gli Echi e leggere la storia senza connessione.</p>
        <button type="button" onclick="location.replace('./index.html')">Riprova</button>
    </div>
</body>
</html>
