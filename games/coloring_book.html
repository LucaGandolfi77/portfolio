<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="games.coloring.title">Coloring Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-900: #0a1628;
            --bg-800: #1a2940;
            --accent: #00d4ff;
            --text-main: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-900), var(--bg-800));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
        }
        .canvas-wrapper {
            position: relative;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: crosshair;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .controls {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .tool-group {
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 12px;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .btn.active {
            background: var(--accent);
            color: #0a1628;
            border-color: var(--accent);
        }
        .palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 400px;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.active {
            border-color: white;
            box-shadow: 0 0 0 2px var(--accent);
            transform: scale(1.1);
        }
        
        /* Modal for figure selection */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: var(--bg-800);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .figure-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .figure-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }
        .figure-btn:hover {
            background: var(--accent);
            color: var(--bg-900);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <script src="top_buttons.js"></script>
            <h2 data-i18n="games.coloring.title">Coloring Book</h2>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="600" height="400"></canvas>
        </div>

        <div class="controls">
            <div class="tool-group">
                <button class="btn active" id="toolFill" title="Fill (Bucket)">🪣 Fill</button>
                <button class="btn" id="toolPen" title="Pen">✏️ Pen</button>
                <button class="btn" id="toolEraser" title="Eraser">🧹 Eraser</button>
            </div>
            
            <div class="tool-group">
                <button class="btn" id="undoBtn">↩️ Undo</button>
                <button class="btn" id="clearBtn" data-i18n="games.coloring.clear">Clear</button>
                <button class="btn" id="downloadBtn" data-i18n="games.coloring.download">💾 Save</button>
                <button class="btn" id="newBtn" data-i18n="games.coloring.new">New</button>
            </div>

            <div class="palette" id="palette">
                <!-- Colors generated by JS -->
            </div>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="games.coloring.select">Select a Figure</h2>
            <div class="figure-grid">
                <button class="figure-btn" onclick="loadFigure('house')">🏠 House</button>
                <button class="figure-btn" onclick="loadFigure('tree')">🌳 Tree</button>
                <button class="figure-btn" onclick="loadFigure('car')">🚗 Car</button>
                <button class="figure-btn" onclick="loadFigure('flower')">🌸 Flower</button>
                <button class="figure-btn" onclick="loadFigure('robot')">🤖 Robot</button>
                <button class="figure-btn" onclick="loadFigure('sun')">☀️ Sun</button>
                <button class="figure-btn" onclick="loadFigure('boat')">⛵ Boat</button>
                <button class="figure-btn" onclick="loadFigure('butterfly')">🦋 Butterfly</button>
                <button class="figure-btn" onclick="loadFigure('icecream')">🍦 Ice Cream</button>
                <button class="figure-btn" onclick="loadFigure('rocket')">🚀 Rocket</button>
                <button class="figure-btn" onclick="loadFigure('random')">🎲 Random</button>
            </div>
            <button class="btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let currentTool = 'fill'; // fill, pen, eraser
        let currentColor = '#ff0000';
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let history = [];
        const MAX_HISTORY = 10;

        // Colors
        const colors = [
            '#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#8b00ff', '#ff00ff',
            '#ffcccc', '#ffcc99', '#ffffcc', '#ccffcc', '#ccffff', '#ccccff', '#e5ccff', '#ffccff',
            '#000000', '#404040', '#808080', '#c0c0c0', '#ffffff', '#8b4513', '#d2691e', '#f4a460'
        ];

        // Init Palette
        const paletteEl = document.getElementById('palette');
        colors.forEach((c, i) => {
            const d = document.createElement('div');
            d.className = 'color-swatch' + (i===0 ? ' active' : '');
            d.style.backgroundColor = c;
            d.onclick = () => setColor(c, d);
            paletteEl.appendChild(d);
        });

        function setColor(c, el) {
            currentColor = c;
            document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
        }

        // Tools
        document.getElementById('toolFill').onclick = () => setTool('fill');
        document.getElementById('toolPen').onclick = () => setTool('pen');
        document.getElementById('toolEraser').onclick = () => setTool('eraser');

        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('.tool-group .btn').forEach(b => b.classList.remove('active'));
            if(t === 'fill') document.getElementById('toolFill').classList.add('active');
            if(t === 'pen') document.getElementById('toolPen').classList.add('active');
            if(t === 'eraser') document.getElementById('toolEraser').classList.add('active');
        }

        // Canvas Events
        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mousemove', moveAction);
        canvas.addEventListener('mouseup', endAction);
        canvas.addEventListener('mouseout', endAction);
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });
        canvas.addEventListener('touchend', (e) => {
            const mouseEvent = new MouseEvent('mouseup', {});
            canvas.dispatchEvent(mouseEvent);
        });

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor(e.clientX - rect.left),
                y: Math.floor(e.clientY - rect.top)
            };
        }

        function startAction(e) {
            const pos = getPos(e);
            if (currentTool === 'fill') {
                saveState();
                floodFill(pos.x, pos.y, hexToRgba(currentColor));
            } else {
                isDrawing = true;
                lastX = pos.x;
                lastY = pos.y;
                saveState();
                draw(pos.x, pos.y);
            }
        }

        function moveAction(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            draw(pos.x, pos.y);
            lastX = pos.x;
            lastY = pos.y;
        }

        function endAction() {
            isDrawing = false;
        }

        function draw(x, y) {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
            ctx.lineWidth = currentTool === 'eraser' ? 20 : 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        // Flood Fill Algorithm
        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const width = canvas.width;
            const height = canvas.height;

            const startPos = (startY * width + startX) * 4;
            const startR = data[startPos];
            const startG = data[startPos + 1];
            const startB = data[startPos + 2];
            const startA = data[startPos + 3];

            // Don't fill if color is same
            if (startR === fillColor.r && startG === fillColor.g && startB === fillColor.b && startA === fillColor.a) return;

            // Tolerance for anti-aliased lines
            const tolerance = 50; 

            function match(pos) {
                const r = data[pos];
                const g = data[pos + 1];
                const b = data[pos + 2];
                const a = data[pos + 3];
                return Math.abs(r - startR) < tolerance &&
                       Math.abs(g - startG) < tolerance &&
                       Math.abs(b - startB) < tolerance &&
                       Math.abs(a - startA) < tolerance;
            }

            function colorPixel(pos) {
                data[pos] = fillColor.r;
                data[pos + 1] = fillColor.g;
                data[pos + 2] = fillColor.b;
                data[pos + 3] = fillColor.a;
            }

            const stack = [[startX, startY]];

            while (stack.length) {
                const [x, y] = stack.pop();
                const pos = (y * width + x) * 4;

                if (x < 0 || x >= width || y < 0 || y >= height) continue;
                if (!match(pos)) continue;

                colorPixel(pos);

                stack.push([x + 1, y]);
                stack.push([x - 1, y]);
                stack.push([x, y + 1]);
                stack.push([x, y - 1]);
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function hexToRgba(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b, a: 255 };
        }

        // History
        function saveState() {
            if (history.length >= MAX_HISTORY) history.shift();
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        document.getElementById('undoBtn').onclick = () => {
            if (history.length > 0) {
                ctx.putImageData(history.pop(), 0, 0);
            }
        };

        document.getElementById('clearBtn').onclick = () => {
            saveState();
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Redraw current figure if any? No, clear means clear all.
            // But maybe user wants to clear colors but keep lines?
            // For now, simple clear.
            // Better: Reload current figure
            if (currentFigure) loadFigure(currentFigure);
            else {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        };

        document.getElementById('downloadBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = canvas.toDataURL();
            link.click();
        };

        // Figures
        let currentFigure = null;
        const modal = document.getElementById('modal');
        
        document.getElementById('newBtn').onclick = () => {
            modal.classList.remove('hidden');
        };

        function closeModal() {
            modal.classList.add('hidden');
        }

        function loadFigure(name) {
            if (name === 'random') {
                const figs = ['house', 'tree', 'car', 'flower', 'robot', 'sun', 'boat', 'butterfly', 'icecream', 'rocket'];
                name = figs[Math.floor(Math.random() * figs.length)];
            }
            
            currentFigure = name;
            closeModal();
            
            // Clear and set white bg
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            history = []; // Reset history on new figure

            ctx.strokeStyle = 'black';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();

            if (name === 'house') {
                // House body
                ctx.rect(150, 200, 300, 200);
                // Roof
                ctx.moveTo(130, 200);
                ctx.lineTo(300, 50);
                ctx.lineTo(470, 200);
                // Door
                ctx.rect(270, 300, 60, 100);
                // Window
                ctx.rect(180, 230, 60, 60);
                ctx.rect(360, 230, 60, 60);
            } else if (name === 'tree') {
                // Trunk
                ctx.rect(260, 250, 80, 150);
                // Leaves (Circles)
                ctx.moveTo(300, 250);
                ctx.arc(300, 180, 100, 0, Math.PI * 2);
                ctx.moveTo(220, 180);
                ctx.arc(220, 180, 60, 0, Math.PI * 2);
                ctx.moveTo(380, 180);
                ctx.arc(380, 180, 60, 0, Math.PI * 2);
            } else if (name === 'car') {
                // Body
                ctx.rect(100, 200, 400, 100);
                // Top
                ctx.rect(180, 120, 240, 80);
                // Wheels
                ctx.moveTo(180, 300);
                ctx.arc(160, 300, 40, 0, Math.PI * 2);
                ctx.moveTo(460, 300);
                ctx.arc(440, 300, 40, 0, Math.PI * 2);
            } else if (name === 'flower') {
                // Stem
                ctx.moveTo(300, 400);
                ctx.lineTo(300, 250);
                // Center
                ctx.moveTo(330, 220);
                ctx.arc(300, 220, 30, 0, Math.PI * 2);
                // Petals
                for(let i=0; i<8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const cx = 300 + Math.cos(angle) * 60;
                    const cy = 220 + Math.sin(angle) * 60;
                    ctx.moveTo(cx + 30, cy);
                    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
                }
            } else if (name === 'robot') {
                // Head
                ctx.rect(250, 50, 100, 80);
                // Eyes
                ctx.rect(270, 70, 20, 20);
                ctx.rect(310, 70, 20, 20);
                // Body
                ctx.rect(220, 140, 160, 140);
                // Arms
                ctx.rect(160, 140, 50, 100);
                ctx.rect(390, 140, 50, 100);
                // Legs
                ctx.rect(240, 280, 50, 100);
                ctx.rect(310, 280, 50, 100);
            } else if (name === 'sun') {
                // Center
                ctx.moveTo(350, 200);
                ctx.arc(300, 200, 60, 0, Math.PI * 2);
                // Rays
                for(let i=0; i<12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const x1 = 300 + Math.cos(angle) * 80;
                    const y1 = 200 + Math.sin(angle) * 80;
                    const x2 = 300 + Math.cos(angle) * 120;
                    const y2 = 200 + Math.sin(angle) * 120;
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                }
            } else if (name === 'boat') {
                // Hull
                ctx.moveTo(150, 250);
                ctx.lineTo(450, 250);
                ctx.lineTo(400, 350);
                ctx.lineTo(200, 350);
                ctx.closePath();
                // Mast
                ctx.rect(295, 100, 10, 150);
                // Sail
                ctx.moveTo(305, 110);
                ctx.lineTo(450, 230);
                ctx.lineTo(305, 230);
                ctx.closePath();
                // Flag
                ctx.moveTo(295, 100);
                ctx.lineTo(250, 120);
                ctx.lineTo(295, 140);
            } else if (name === 'butterfly') {
                // Body
                ctx.moveTo(310, 150);
                ctx.ellipse(300, 200, 15, 80, 0, 0, Math.PI * 2);
                // Wings Top Right
                ctx.moveTo(315, 180);
                ctx.ellipse(360, 150, 60, 60, -0.5, 0, Math.PI * 2);
                // Wings Bottom Right
                ctx.moveTo(315, 220);
                ctx.ellipse(350, 250, 50, 50, 0.5, 0, Math.PI * 2);
                // Wings Top Left
                ctx.moveTo(285, 180);
                ctx.ellipse(240, 150, 60, 60, 0.5, 0, Math.PI * 2);
                // Wings Bottom Left
                ctx.moveTo(285, 220);
                ctx.ellipse(250, 250, 50, 50, -0.5, 0, Math.PI * 2);
                // Antennae
                ctx.moveTo(290, 130);
                ctx.quadraticCurveTo(280, 100, 260, 110);
                ctx.moveTo(310, 130);
                ctx.quadraticCurveTo(320, 100, 340, 110);
            } else if (name === 'icecream') {
                // Cone
                ctx.moveTo(250, 250);
                ctx.lineTo(350, 250);
                ctx.lineTo(300, 380);
                ctx.closePath();
                // Scoops
                ctx.moveTo(350, 250);
                ctx.arc(300, 250, 50, 0, Math.PI, true);
                ctx.moveTo(350, 200);
                ctx.arc(300, 180, 50, 0, Math.PI * 2);
                // Cherry
                ctx.moveTo(310, 130);
                ctx.arc(300, 130, 10, 0, Math.PI * 2);
            } else if (name === 'rocket') {
                // Body
                ctx.rect(250, 150, 100, 150);
                // Nose
                ctx.moveTo(250, 150);
                ctx.lineTo(300, 50);
                ctx.lineTo(350, 150);
                ctx.closePath();
                // Fins
                ctx.moveTo(250, 300);
                ctx.lineTo(220, 350);
                ctx.lineTo(250, 330);
                
                ctx.moveTo(350, 300);
                ctx.lineTo(380, 350);
                ctx.lineTo(350, 330);
                // Window
                ctx.moveTo(330, 200);
                ctx.arc(300, 200, 30, 0, Math.PI * 2);
                // Flame
                ctx.moveTo(270, 300);
                ctx.lineTo(300, 380);
                ctx.lineTo(330, 300);
            }

            ctx.stroke();
        }

        // Initial load
        window.onload = () => {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            loadFigure('house');
            loadTranslations();
        };

        // Translations
        async function loadTranslations() {
            const lang = localStorage.getItem('lang') || 'en';
            try {
                const res = await fetch(`./i18n/${lang}.json`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.games && data.games.coloring) {
                        const t = data.games.coloring;
                        document.title = t.title;
                        document.querySelector('h1').textContent = t.title;
                        document.getElementById('newBtn').textContent = t.new;
                        document.getElementById('clearBtn').textContent = t.clear;
                        document.getElementById('downloadBtn').textContent = t.download;
                        document.querySelector('#modal h2').textContent = t.select;
                    }
                    if (data.games && data.games.back) {
                        document.querySelector('.back-btn').textContent = "← " + data.games.back;
                    }
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
