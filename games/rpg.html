<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zelda RPG</title>
    <meta name="description" content="Zelda RPG - a browser role-playing game with exploration and combat, built with React, Phaser and Colyseus." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/games/rpg.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zelda RPG" />
    <meta property="og:description" content="A browser role-playing game with exploration and combat." />
    <meta property="og:url" content="https://lucagandolfi77.github.io/portfolio/games/rpg.html" />
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      #root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
      #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      .ui-layer { pointer-events: auto; }
    </style>
  </head>
  <body>
    <h1 class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Zelda RPG</h1>
    <div id="game-container"></div>
    <div id="root"></div>
    <!--
      Wrapper static. Il bundle vive in ../rpg_game/dist/ ed e' buildato con
      `npm run build` dentro rpg_game/ (vedi .gitignore: dist/ non e' tracciato).
      La versione precedente puntava a index-DETqTwaS.js, un nome hashato che non
      esisteva piu' in nessun commit: il gioco non partiva.
    -->
    <script type="module" crossorigin src="../rpg_game/dist/assets/rpg.js"></script>
    <link rel="stylesheet" crossorigin href="../rpg_game/dist/assets/index.css">
  </body>
</html>
