<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
	<title>CDD RUN — Endless Runner</title>
	<style>
		:root{--top-bar:0px}
		html,body{height:100%;margin:0}
		body{font-family:Segoe UI,system-ui,Helvetica,Arial;background:#87CEEB;overflow:hidden;touch-action:none}
		canvas{display:block}
		/* UI */
		#top-ui{position:absolute;top:calc(var(--top-bar) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
		#score{pointer-events:auto;background:rgba(0,0,0,0.35);color:#fff;padding:8px 12px;border-radius:8px;font-weight:700}
		#back-btn{pointer-events:auto;background:rgba(0,0,0,0.35);color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;border:1px solid rgba(255,255,255,0.12)}
		#start-screen,#game-over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);color:#fff;pointer-events:auto}
		.panel{background:rgba(0,0,0,0.75);padding:28px;border-radius:14px;text-align:center}
		button{appearance:none;border:0;background:#2ed573;color:#fff;padding:12px 22px;border-radius:999px;font-size:16px;cursor:pointer}
		button.alt{background:#ff4757}
		/* Mobile controls */
		#mobile-controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:flex-end;gap:14px;pointer-events:none}
		.ctrl{width:68px;height:68px;border-radius:999px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;pointer-events:auto;border:2px solid rgba(255,255,255,0.12)}
		/* hide mobile controls on desktop */
		@media(min-width:720px){#mobile-controls{display:none}}
	</style>
</head>
<body>
	<a id="back-btn" href="../index.html#games">Exit</a>
	<div id="top-ui"><div id="score">Score: <span id="score-val">0</span></div><div></div></div>

	<canvas id="c"></canvas>

	<div id="start-screen"><div class="panel"><h1 style="margin:0 0 8px 0;color:#2ed573">CDD RUN</h1><p style="margin:0 0 18px 0">Sposta il corridore a sinistra/destra per evitare ostacoli e raccogliere monete.</p><div style="display:flex;gap:10px;justify-content:center"><button id="start">PLAY</button><button id="demo" style="background:#ffd700;color:#000">TUTORIAL</button></div><p style="margin-top:12px;color:#ccc;font-size:13px">Tastiere: ← → • Mobile: swipe o bottoni</p></div></div>

	<div id="game-over" style="display:none"><div class="panel"><h2 style="margin:0 0 8px 0;color:#ff4757">GAME OVER</h2><p style="margin:0 0 12px 0">Score: <strong id="final-score">0</strong></p><div style="display:flex;gap:8px;justify-content:center"><button id="restart">RESTART</button><button id="exit" class="alt">EXIT</button></div></div></div>

	<div id="mobile-controls"><div id="btn-left" class="ctrl">◀</div><div id="btn-right" class="ctrl">▶</div></div>

	<script>
	// Simple 3-lane endless runner
	const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
	const scoreEl = document.getElementById('score-val'); const startScreen = document.getElementById('start-screen');
	const gameOverPanel = document.getElementById('game-over'); const finalScoreEl = document.getElementById('final-score');
	const startBtn = document.getElementById('start'); const restartBtn = document.getElementById('restart');
	const backBtn = document.getElementById('back-btn');

	let W=0,H=0; function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; document.documentElement.style.setProperty('--top-bar', getComputedStyle(document.body).getPropertyValue('--site-top-bar-height') || '0px'); }
	addEventListener('resize', resize); resize();

	// World
	const LANES = 3; const LANE_W = 120; const LANE_GAP = 1; // visual spacing
	const player = { lane:1, target:1, x:0, y:0, width:40, height:60, color:'#ff4757' };
	let obstacles = [], coins = [], particles = [];
	let time = 0;
	let running = false, last=0, speed=400, distance=0, score=0, spawnTimer=0;

	function reset(){ obstacles = []; coins = []; running = false; last = 0; speed = 400; distance = 0; score = 0; spawnTimer = 0; player.lane = 1; player.target = 1; updateScore(); }

	function updateScore(){ scoreEl.textContent = Math.floor(score); }

	function worldToScreen(lane, depth){ // depth > 0 => farther
		const centerX = W/2 + (lane - 1) * LANE_W;
		const perspective = 1 / (1 + depth * 0.0035); // simple perspective
		const x = centerX;
		const y = H * (0.5 + 0.45 * (1 - perspective));
		const scale = perspective * 1.2;
		return { x, y, scale };
	}

	function spawn(){
		// spawn obstacles and coins ahead with random lanes
		const z = distance + 900 + Math.random()*400;
		const lane = Math.floor(Math.random()*LANES);
		const type = Math.random() < 0.7 ? 'box' : 'tall';
		obstacles.push({ lane, z, type });
		// sometimes place coins in other lanes
		for(let i=0;i<LANES;i++) if(i!==lane && Math.random()<0.4) coins.push({ lane:i, z:z - 80 + Math.random()*160 });
	}

	function update(dt){
		if(!running) return;
		time += dt;
		distance += speed * dt;
		score += dt * 10 + (distance/1000) * dt * 2;
		updateScore();

		// smooth lane interpolation using lerp for animation
		const laneDiff = player.target - player.lane;
		player.lane += laneDiff * Math.min(1, 8 * dt);

		// subtle bobbing effect driven by time/distance (for visual polish)
		player.bob = Math.sin(distance * 0.01 + time * 6) * 6;

		// spawn logic
		spawnTimer -= dt*1000;
		if(spawnTimer <= 0){ spawn(); spawnTimer = 500 + Math.random()*600; }

		// move obstacles/coins closer to player
		for(let i=obstacles.length-1;i>=0;i--){ obstacles[i].z -= speed*dt; if(obstacles[i].z < distance - 200) obstacles.splice(i,1); }
		for(let i=coins.length-1;i>=0;i--){ coins[i].z -= speed*dt; if(coins[i].z < distance - 200) coins.splice(i,1); }

		// update particles
		for(let i=particles.length-1;i>=0;i--){ const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.vy += 300 * dt; if(p.life <= 0) particles.splice(i,1); }

		// collisions: when z approximates distance
		for(let i=obstacles.length-1;i>=0;i--){ const ob = obstacles[i]; if(Math.abs(ob.z - distance) < 120){ if(Math.abs(ob.lane - Math.round(player.lane)) < 0.5){ // collision
					running = false; gameOver(); return;
				}
			}
		}
		for(let i=coins.length-1;i>=0;i--){ const c = coins[i]; if(Math.abs(c.z - distance) < 120){ if(Math.abs(c.lane - Math.round(player.lane)) < 0.5){ score += 100; // spawn collect particles
					const s = worldToScreen(c.lane, (c.z - distance));
					for(let k=0;k<10;k++) particles.push({ x: s.x + (Math.random()-0.5)*20, y: s.y - 10 + (Math.random()-0.5)*20, vx: (Math.random()-0.5)*200, vy: -200 + Math.random()*-40, life: 0.6 + Math.random()*0.6, color: '#ffd700' });
					coins.splice(i,1); updateScore(); }
			}
		}

		// gradually increase difficulty
		speed += dt * 6;
	}

	function draw(){
		// sky
		ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,W,H);

		// ground
		ctx.fillStyle = '#2ecc71'; ctx.fillRect(0,H*0.62,W,H*0.38);

		// lane lines and perspective
		for(let l=0;l<LANES;l++){
			const laneCenter = W/2 + (l - 1) * LANE_W;
			ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
			ctx.beginPath(); ctx.moveTo(laneCenter, H*0.62); ctx.lineTo(laneCenter, H); ctx.stroke();
		}

		// draw obstacles (from far to near) with subtle pulsing
		const sortObs = obstacles.slice().sort((a,b)=> (b.z - distance) - (a.z - distance));
		for(const ob of sortObs){ const rel = (ob.z - distance); if(rel < -200) continue; const s = worldToScreen(ob.lane, rel); const pulse = 1 + 0.06 * Math.sin((ob.z - distance) * 0.02 + time * 6); const size = 70 * s.scale * pulse; ctx.fillStyle = ob.type==='box' ? '#8B4513' : '#333'; ctx.fillRect(s.x - size/2, s.y - size, size, size); }

		// draw coins with rotation/float
		for(const c of coins){ const rel = (c.z - distance); if(rel < -200) continue; const s = worldToScreen(c.lane, rel); const r = 12 * s.scale; const float = Math.sin((c.z - distance) * 0.02 + time * 8) * 6 * s.scale; ctx.save(); ctx.translate(s.x, s.y - r + float); ctx.rotate(time * 6 + (c.z - distance) * 0.002); ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); ctx.restore(); }

		// draw player near bottom center with bob animation
		const playerScreen = { x: W/2 + (player.lane - 1) * LANE_W, y: H*0.78 + (player.bob || 0) };
		ctx.save(); ctx.translate(playerScreen.x, playerScreen.y);
		ctx.fillStyle = player.color; ctx.fillRect(-player.width/2, -player.height, player.width, player.height);
		ctx.fillStyle = '#fff'; ctx.fillRect(-10, -player.height+10, 20, 20);
		ctx.restore();

		// draw particles
		for(const p of particles){ ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); ctx.globalAlpha = 1; }
	}

	function loop(t){ const dt = last ? Math.min((t-last)/1000, 0.05) : 0; last = t; update(dt); draw(); requestAnimationFrame(loop); }

	function start(){ reset(); running = true; last = 0; startScreen.style.display = 'none'; gameOverPanel.style.display = 'none'; requestAnimationFrame(loop); }
	function gameOver(){ gameOverPanel.style.display = 'flex'; finalScoreEl.textContent = Math.floor(score); }

	// Input
	addEventListener('keydown', e=>{ if(e.key==='ArrowLeft' || e.key==='a'){ player.target = Math.max(0, player.target-1); } if(e.key==='ArrowRight' || e.key==='d'){ player.target = Math.min(LANES-1, player.target+1); } });
	// Mobile buttons
	document.getElementById('btn-left').addEventListener('touchstart', e=>{ e.preventDefault(); player.target = Math.max(0, player.target-1); });
	document.getElementById('btn-right').addEventListener('touchstart', e=>{ e.preventDefault(); player.target = Math.min(LANES-1, player.target+1); });
	document.getElementById('btn-left').addEventListener('click', ()=> player.target = Math.max(0, player.target-1));
	document.getElementById('btn-right').addEventListener('click', ()=> player.target = Math.min(LANES-1, player.target+1));

	// swipe
	let sx=0, sy=0; addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
	addEventListener('touchend', e=>{ const dx = e.changedTouches[0].clientX - sx; const dy = e.changedTouches[0].clientY - sy; if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){ if(dx > 0) player.target = Math.min(LANES-1, player.target+1); else player.target = Math.max(0, player.target-1); } });

	// Start / restart / exit handlers
	startBtn.addEventListener('click', start); restartBtn.addEventListener('click', ()=>{ start(); }); document.getElementById('exit').addEventListener('click', ()=>{ back(); });

	// Back button behavior (history.back with fallbacks)
	function back(){ try{ sessionStorage.setItem('index_scroll', String(window.scrollY || window.pageYOffset || 0)); }catch(e){}
		try{ if(window.history && window.history.length > 1) window.history.back(); else if(document.referrer) window.location.href = document.referrer; else window.location.href = '../index.html'; } catch(e){ window.location.href = '../index.html'; } }
	backBtn.addEventListener('click', e=>{ e.preventDefault(); back(); });

	// Initialize
	resize(); reset();
	// start loop only after player presses PLAY

	</script>
</body>
</html>
