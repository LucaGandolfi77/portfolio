<!doctype html>
<html lang="en" data-skin="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b1f">
<meta name="color-scheme" content="dark light">
<meta name="description" content="RPG Adventure — a mobile-first, offline PWA action RPG with three zones, quests, loot, skills and combos.">
<title>RPG Adventure ⚔</title>
<link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/games/rpg-game/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../../projects/_shared/tokens.css">
<link rel="stylesheet" href="../../projects/_shared/base.css">
<link rel="stylesheet" href="../../projects/_shared/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="pf-skip" href="#app" data-i18n="skip">Skip to content</a>
<header data-project-shell data-title="RPG Adventure" data-id="rpg-game"
  data-back="../../games.html" data-home="../../index.html"
  data-languages="en,it" data-heading="div"></header>

<div id="app">
  <header class="topbar glass">
    <div class="brand"><span class="brand-icon">⚔️</span><div><b data-i18n="title">RPG ADVENTURE</b><small data-i18n="tagline">Tre zone, quest e combattimento</small></div></div>
    <div class="top-actions">
      <button class="tbtn" id="btnQuests" type="button">📜 <span data-i18n="quests">Quest</span></button>
      <button class="tbtn" id="btnInventory" type="button">🎒 <span data-i18n="inventory">Inventario</span></button>
      <button class="tbtn" id="btnPause" type="button">⏸ <span data-i18n="pause">Pausa</span></button>
      <button class="tbtn" id="btnSettings" type="button">⚙</button>
      <button class="tbtn" id="btnHelp" type="button">?</button>
      <button class="tbtn" id="btnLang" type="button" data-i18n="lang">IT / EN</button>
      <button class="tbtn" id="btnTheme" type="button" data-i18n="theme">Tema</button>
    </div>
  </header>

  <main class="stage">
    <div class="game-frame glass">
      <canvas id="gameCanvas" aria-label="Game world"></canvas>
      <div class="hud">
        <div class="hud-top glass">
          <div class="bars">
            <div class="bar-row"><span data-i18n="health">Vita</span><div class="bar"><i id="hpFill" class="hp"></i></div><b id="hpText">100</b></div>
            <div class="bar-row"><span data-i18n="mana">Mana</span><div class="bar"><i id="manaFill" class="mana"></i></div><b id="manaText">60</b></div>
            <div class="bar-row"><span data-i18n="xp">ES</span><div class="bar"><i id="xpFill" class="xp"></i></div><b id="levelText">1</b></div>
          </div>
          <div class="stats">
            <span>🪙 <b id="goldText">0</b></span>
            <span id="zoneName">—</span>
            <span id="fpsText"></span>
          </div>
        </div>
        <div id="comboTag" class="combo-tag hidden">×1</div>
        <div id="enemyCount" class="enemy-count"></div>
      </div>
    </div>

    <div class="controls">
      <div class="joystick-wrap">
        <div id="joystick" class="joystick" aria-label="Joystick"><div id="joystickKnob" class="knob"></div></div>
      </div>
      <div class="skill-bar" id="skillBar"></div>
      <div class="action-buttons">
        <button class="act small" data-act="interact" aria-label="Interact">💬</button>
        <button class="act small" data-act="dodge" aria-label="Dodge">💨</button>
        <button class="act big" data-act="attack" aria-label="Attack">⚔️</button>
      </div>
    </div>
  </main>

  <div id="toasts" aria-live="polite"></div>
</div>

<div class="modal" id="inventoryModal" role="dialog" aria-modal="true">
  <div class="glass modal-box wide-box">
    <h2>🎒 <span data-i18n="inventory">Inventario</span></h2>
    <div class="equip-grid" id="invEquip"></div>
    <div class="inv-list" id="invList"></div>
    <button class="tbtn big wide" type="button" data-close="inventoryModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="questsModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>📜 <span data-i18n="quests">Quest</span></h2>
    <div id="questList"></div>
    <button class="tbtn big wide" type="button" data-close="questsModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="pauseModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>⏸ <span data-i18n="pauseTitle">In pausa</span></h2>
    <button class="tbtn big wide" id="btnResume" type="button" data-i18n="resume">Riprendi</button>
    <button class="tbtn wide" id="btnResetSave" type="button" data-i18n="reset">Nuova partita</button>
    <button class="tbtn wide" type="button" data-close="pauseModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>⚙ <span data-i18n="settingsTitle">Impostazioni</span></h2>
    <label class="check"><input type="checkbox" id="soundCheck" checked> <span data-i18n="sound">Suono</span></label>
    <label class="check"><input type="checkbox" id="vibrateCheck" checked> <span data-i18n="vibration">Vibrazione</span></label>
    <label class="check"><input type="checkbox" id="motionCheck"> <span data-i18n="motion">Effetti ridotti</span></label>
    <label class="check"><input type="checkbox" id="fpsCheck"> <span data-i18n="showFps">Mostra FPS</span></label>
    <button class="tbtn big wide" type="button" data-close="settingsModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="helpModal" role="dialog" aria-modal="true">
  <div class="glass modal-box wide-box">
    <h2>📖 <span data-i18n="help">Guida</span></h2>
    <p id="helpText"></p>
    <button class="tbtn big wide" type="button" data-close="helpModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="dialogModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2 id="dialogName">—</h2>
    <p id="dialogText"></p>
    <div id="shopList"></div>
    <button class="tbtn big wide" type="button" data-close="dialogModal" data-i18n="close">Chiudi</button>
  </div>
</div>

<div class="modal" id="deathModal" role="dialog" aria-modal="true">
  <div class="glass modal-box">
    <h2>💀 <span data-i18n="dead">Sei sconfitto</span></h2>
    <button class="tbtn big wide" id="btnRetry" type="button" data-i18n="retry">Riprova</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../../projects/_shared/shell.js" defer></script>
</body>
</html>
