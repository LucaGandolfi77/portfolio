      <a href="../../lab/index.html">Lab</a>
    </nav>
    <button class="lang-toggle" id="langToggle">IT</button>

  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Ten playable experiments</p>
        <h1>Games with a point.</h1>
        <p class="lede">Tiny systems for timing, memory, strategy, physics, sound, pass-and-play and local-first game design.</p>
      </div>
      <div class="score-note"><span>best score</span><strong id="global-best">0</strong></div>

    <div class="arcade-layout">

      <section id="game-stage" class="game-stage" aria-live="polite"></section>
    </div>
  </main>

  <div id="game-info-overlay" class="game-info-overlay"></div>

  <div id="install-banner" class="install-banner"></div>

  <footer class="footer">Static games. Local scores. No account and no server required.</footer>
