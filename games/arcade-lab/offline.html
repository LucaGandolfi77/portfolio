<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Lab — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #11151b;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { padding: 2rem; }
    h1 {
      color: #f4b860;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #68c2b1;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    a {
      color: #f4b860;
      text-decoration: none;
      border: 1px solid #f4b860;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(244, 184, 96, 0.15); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Arcade Lab</h1>
    <p>You're offline</p>
    <a href=".">Retry</a>
  </div>
</body>
</html>
