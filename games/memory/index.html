<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0d1e">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Memory Garden — 11 modalità, 20 quest, collezione di carte rare e UI liquid glass. Gioco offline su GitHub Pages.">
  <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/games/memory/">
  <title>Memory Garden</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body data-theme="candy">
<div class="aurora" aria-hidden="true"></div>
<div class="garden" id="garden" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🌸</span><div><strong>MEMORY <b>GARDEN</b></strong><small>make your mind bloom</small></div></div>
    <div class="top-actions">
      <select id="langSel" aria-label="Language"><option value="it">🇮🇹</option><option value="en">🇬🇧</option><option value="es">🇪🇸</option><option value="fr">🇫🇷</option><option value="de">🇩🇪</option></select>
      <select id="themeSel" aria-label="Theme"></select>
      <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
      <button class="icon-btn" id="hapticsBtn" aria-label="Haptics">📳</button>
      <a class="icon-btn" href="../../index.html" aria-label="Portfolio">←</a>
    </div>
  </header>

  <section class="hud">
    <div class="hcard"><b id="hPairs">0</b><span data-i18n="games.memory.pairs">Pairs</span></div>
    <div class="hcard"><b id="hMoves">0</b><span data-i18n="games.memory.moves">Moves</span></div>
    <div class="hcard hot"><b id="hScore">0</b><span>Score</span></div>
    <div class="hcard"><b id="hCombo">×1</b><span>Combo</span></div>
    <div class="hcard"><b id="hTime">∞</b><span>Time</span></div>
    <div class="hcard"><b id="hLevel">1</b><span>Level</span></div>
  </section>

  <div class="controls">
    <div class="control-row"><span class="lbl">Mode</span><div class="pill-row" id="modePills"></div></div>
    <div class="control-row"><span class="lbl">Board</span><div class="pill-row" id="diffPills"></div>
      <span class="lbl">Deck</span><select id="deckSel"></select></div>
    <div class="msg" id="msg">Tap a card to begin 🌸</div>
  </div>

  <main class="board"><div class="grid" id="grid"></div></main>
  <div class="powers" id="powers"></div>

  <nav class="dock">
    <button class="dock-btn pri" id="newBtn">🌱 New game</button>
    <button class="dock-btn" id="questBtn">🗺️ Quests</button>
    <button class="dock-btn" id="collectionBtn">📖 Collection</button>
    <button class="dock-btn" id="achBtn">🏅 Awards</button>
    <button class="dock-btn" id="lbBtn">🏆 Best</button>
    <button class="dock-btn" id="shareBtn">📤 Share</button>
  </nav>
</div>

<div class="overlay" id="winOverlay"><div class="glass-sheet dialog">
  <h2 id="winTitle">🎉 Garden in bloom!</h2>
  <p id="winBody"></p>
  <div class="sheet-actions"><button class="dock-btn pri" id="winNext">Next</button><button class="dock-btn" id="winAgain">Again</button><button class="dock-btn" id="winClose">Close</button></div>
</div></div>

<div class="overlay hidden" id="questOverlay"><div class="glass-sheet">
  <div class="sheet-head"><h2>🗺️ Quests</h2><button class="icon-btn" id="questClose">✕</button></div>
  <div class="sheet-list" id="questList"></div>
</div></div>

<div class="overlay hidden" id="collectionOverlay"><div class="glass-sheet">
  <div class="sheet-head"><h2>📖 Collection</h2><button class="icon-btn" id="collectionClose">✕</button></div>
  <div class="sheet-list" id="collectionList"></div>
</div></div>

<div class="overlay hidden" id="achOverlay"><div class="glass-sheet">
  <div class="sheet-head"><h2>🏅 Awards</h2><button class="icon-btn" id="achClose">✕</button></div>
  <div class="sheet-list" id="achList"></div>
</div></div>

<div class="overlay hidden" id="lbOverlay"><div class="glass-sheet">
  <div class="sheet-head"><h2>🏆 Best scores</h2><button class="icon-btn" id="lbClose">✕</button></div>
  <div class="sheet-list" id="lbList"></div>
</div></div>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./js/main.js"></script>
<script src="../../top_buttons.js" defer></script>
</body>
</html>
