<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A Wikipedia quiz where difficulty grows with the fame of the articles. Five difficulty presets, two modes and a weighted score.">
  <title>Wikipedia Game — Luca Gandolfi</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../../games.html" aria-label="Games">
        <span class="brand-mark">W</span>
        <span class="brand-text">WIKIPEDIA<span>GAME</span></span>
      </a>
      <div class="top-actions">
        <a class="tb" href="../../games.html" data-i18n="nav.games">🎮 Giochi</a>
        <a class="tb" href="../index.html" data-i18n="nav.home">← Home</a>
        <button class="tb" id="langBtn" type="button" aria-label="Lingua / Language">IT / EN</button>
      </div>
    </header>

    <main class="stage">
      <div class="shell">
        <!-- MENU -->
        <section class="view" id="menuView">
          <p class="eyebrow">LUCA GANDOLFI — ARCADE LAB</p>
          <h1 data-i18n="menu.title">WIKIPEDIA GAME</h1>
          <p class="tagline" data-i18n="menu.tagline"></p>
          <p class="subtitle" data-i18n="menu.subtitle"></p>

          <h2 class="section-title" data-i18n="menu.mode">SCEGLI LA MODALITÀ</h2>
          <div class="mode-grid" id="modeGrid"></div>

          <h2 class="section-title" data-i18n="menu.preset">LIVELLO DI DIFFICOLTÀ</h2>
          <div class="preset-grid" id="presetGrid"></div>

          <div class="menu-foot">
            <div class="best-label" id="bestLabel"></div>
            <button class="btn primary" id="startBtn" type="button" data-i18n="menu.start">INIZIA LA PARTITA</button>
          </div>
          <div class="notice hidden" id="offlineNotice"></div>
        </section>

        <!-- GIOCO -->
        <section class="view hidden" id="gameView">
          <div class="hud">
            <div class="hud-chip"><span data-i18n="hud.score">Punteggio</span><strong id="hudScore">0</strong></div>
            <div class="hud-chip"><span data-i18n="hud.streak">Serie</span><strong id="hudStreak">0</strong></div>
            <div class="hud-chip"><span data-i18n="hud.lives">Vite</span><strong id="hudLives" class="lives">♥ ♥ ♥</strong></div>
            <div class="hud-chip"><span data-i18n="hud.round">Round</span><strong id="hudRound">1/12</strong></div>
            <div class="timer" id="timer" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <circle class="timer-bg" cx="32" cy="32" r="26"></circle>
                <circle class="timer-ring" id="timerRing" cx="32" cy="32" r="26"></circle>
              </svg>
              <span id="timerText">0s</span>
            </div>
          </div>
          <div class="round-track"><div class="round-fill" id="roundFill"></div></div>

          <div class="card" id="card">
            <div class="card-head">
              <span class="tier-badge" id="tierBadge">—</span>
              <div class="fame">
                <span class="fame-label" data-i18n="hud.fame">Indice di fama</span>
                <span class="fame-track"><i id="fameFill"></i></span>
              </div>
            </div>

            <div class="image-wrap" id="imageWrap">
              <img id="wikiImage" alt="">
              <div class="image-placeholder" id="imagePlaceholder">W</div>
            </div>

            <p class="prompt" id="promptText"></p>
            <h2 class="article-title hidden" id="articleTitle"></h2>
            <p class="extract" id="extract"></p>
            <div class="hint-reveal hidden" id="hintReveal"></div>

            <div class="answer-grid" id="answerGrid"></div>
            <div class="binary-grid hidden" id="binaryGrid">
              <button class="btn binary no" id="btnDontKnow" type="button"></button>
              <button class="btn binary yes" id="btnKnow" type="button"></button>
            </div>

            <div class="hint-bar" id="hintBar">
              <span class="hint-title" data-i18n="hint.title">INDIZI</span>
              <button class="hint-btn" id="hintFirst" type="button"></button>
              <button class="hint-btn" id="hintEliminate" type="button"></button>
            </div>
          </div>

          <div class="feedback hidden" id="feedback"></div>
        </section>

        <!-- RISULTATI -->
        <section class="view hidden" id="resultsView">
          <div class="results-card">
            <h2 data-i18n="results.title">RISULTATI</h2>
            <div class="score-ring"><span id="finalScore">0</span></div>
            <div class="new-best hidden" id="newBest"></div>
            <div class="rank" id="rankLabel"></div>
            <div class="result-stats" id="resultStats"></div>
            <h3 class="results-sub" data-i18n="results.byTier">dettaglio per fascia</h3>
            <ul class="result-list" id="resultList"></ul>
            <div class="result-actions">
              <button class="btn primary" id="againBtn" type="button" data-i18n="results.playAgain">RIGIOCA</button>
              <button class="btn ghost" id="menuBtn" type="button" data-i18n="results.menu">MENU</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
