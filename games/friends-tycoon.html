<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a14">
<title>FRIENDS TYCOON — Impero del Divertimento</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#title{color:#ff5d8f;font-size:clamp(28px,10vw,72px);text-align:center;text-shadow:0 0 30px rgba(255,93,143,.5),0 0 60px rgba(255,93,143,.2);letter-spacing:clamp(4px,2vw,16px);font-weight:800;opacity:0;animation:fadeIn 2s ease 0.5s forwards}
#sub{color:#888;font-size:clamp(9px,2.2vw,13px);text-align:center;margin-top:10px;opacity:0;animation:fadeIn 2s ease 1.5s forwards;letter-spacing:2px}
#apri{pointer-events:all;margin-top:36px;padding:12px 40px;border:1px solid #ff5d8f;background:rgba(255,93,143,.08);color:#d0d0d0;font-size:clamp(11px,2.8vw,15px);cursor:pointer;transition:all .3s;opacity:0;animation:fadeIn 2s ease 2.5s forwards;font-family:inherit;letter-spacing:2px;border-radius:8px}
#apri:hover{background:rgba(255,93,143,.2);box-shadow:0 0 24px rgba(255,93,143,.2)}
#credit{position:fixed;bottom:16px;color:#444;font-size:10px;opacity:0;animation:fadeIn 2s ease 3s forwards;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#apri{padding:14px 32px}}
</style>
</head>
<body>
<div id="overlay">
  <div id="title">FRIENDS TYCOON</div>
  <div id="sub">Impero del Divertimento</div>
  <button id="apri" onclick="window.location.href='friends-tycoon/index.html'">GIOCA</button>
</div>
<div id="credit">Un gruppo di amici, una casa mezza distrutta e €1.000</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0a14);
scene.fog = new THREE.FogExp2(0x1a0a14, 0.018);

const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
camera.position.set(0, 2, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.75;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;

/* lights */
const amb = new THREE.AmbientLight(0x2a1018, 0.4);
scene.add(amb);

const pinkLight = new THREE.PointLight(0xff5d8f, 3, 20, 1.5);
pinkLight.position.set(0, 3, 0);
scene.add(pinkLight);

const goldLight = new THREE.PointLight(0xffb400, 2, 16, 1.5);
goldLight.position.set(-3, 1, 2);
scene.add(goldLight);

const blueLight = new THREE.PointLight(0x6ee7ff, 1.5, 14, 1.5);
blueLight.position.set(3, 2, -2);
scene.add(blueLight);

/* ---- house: dollhouse silhouette ---- */
const houseGroup = new THREE.Group();
scene.add(houseGroup);

/* base box */
const baseMat = new THREE.MeshStandardMaterial({
  color: 0xff5d8f, emissive: 0xff5d8f, emissiveIntensity: 0.4,
  roughness: 0.5, metalness: 0.1
});
const base = new THREE.Mesh(new THREE.BoxGeometry(3, 1.8, 2.2), baseMat);
base.position.y = 0.9;
houseGroup.add(base);

/* roof */
const roofMat = new THREE.MeshStandardMaterial({
  color: 0xffb400, emissive: 0xffb400, emissiveIntensity: 0.5,
  roughness: 0.4, metalness: 0.1
});
const roofGeo = new THREE.ConeGeometry(2.4, 1.2, 4);
const roof = new THREE.Mesh(roofGeo, roofMat);
roof.position.y = 2.4;
roof.rotation.y = Math.PI / 4;
houseGroup.add(roof);

/* windows glow */
const winMat = new THREE.MeshStandardMaterial({
  color: 0xffe066, emissive: 0xffe066, emissiveIntensity: 1.2,
  roughness: 0.2, metalness: 0, transparent: true, opacity: 0.85
});
const winPositions = [
  [-0.7, 1.1, 1.11], [0.7, 1.1, 1.11],
  [-0.7, 1.1, -1.11], [0.7, 1.1, -1.11]
];
for (const [x, y, z] of winPositions) {
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.05), winMat);
  w.position.set(x, y, z);
  houseGroup.add(w);
}

/* door */
const doorMat = new THREE.MeshStandardMaterial({
  color: 0xc98a4b, emissive: 0xc98a4b, emissiveIntensity: 0.3,
  roughness: 0.6, metalness: 0
});
const door = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.06), doorMat);
door.position.set(0, 0.4, 1.11);
houseGroup.add(door);

/* chimney */
const chimMat = new THREE.MeshStandardMaterial({
  color: 0x9a7fa8, emissive: 0x9a7fa8, emissiveIntensity: 0.2,
  roughness: 0.7
});
const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.35), chimMat);
chimney.position.set(0.8, 2.8, 0);
houseGroup.add(chimney);

/* ---- emoji labels: floating icons ---- */
const emojis = ['💰','❤️','⭐','🎉','🏠','🚗','👥','🛒'];
const emojiSprites = [];
for (let i = 0; i < emojis.length; i++) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '80px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emojis[i], 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.6 });
  const sprite = new THREE.Sprite(mat);
  const angle = (i / emojis.length) * Math.PI * 2;
  const radius = 4.5 + Math.random() * 1.5;
  sprite.position.set(Math.cos(angle) * radius, 1.5 + Math.sin(i * 1.3) * 1.2, Math.sin(angle) * radius);
  sprite.scale.set(0.8, 0.8, 1);
  scene.add(sprite);
  emojiSprites.push({ sprite, angle, radius, baseY: sprite.position.y, speed: 0.15 + Math.random() * 0.1 });
}

/* ---- glow sprite ---- */
function createGlowTexture(r, g, b) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, `rgba(255,255,255,1)`);
  grad.addColorStop(0.2, `rgba(${r},${g},${b},0.5)`);
  grad.addColorStop(0.5, `rgba(${r},${g},${b},0.12)`);
  grad.addColorStop(1, `rgba(255,255,255,0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowPink = new THREE.Sprite(new THREE.SpriteMaterial({
  map: createGlowTexture(255, 93, 143), transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending
}));
glowPink.scale.set(6, 6, 1);
houseGroup.add(glowPink);

/* ---- floating particles ---- */
const PARTICLES = 500;
const pGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLES * 3);
const colors = new Float32Array(PARTICLES * 3);
const pVelocities = new Float32Array(PARTICLES * 3);
const pColors = [
  [1.0, 0.36, 0.56],   /* #ff5d8f pink */
  [1.0, 0.71, 0.0],    /* #ffb400 gold */
  [0.43, 0.91, 1.0],   /* #6ee7ff blue */
  [0.25, 0.81, 0.42],  /* #3ecf6b green */
  [1.0, 0.56, 0.69],   /* #ff8fb0 light pink */
  [1.0, 0.85, 0.4],    /* #ffd866 light gold */
];
for (let i = 0; i < PARTICLES; i++) {
  positions[i*3] = (Math.random()-0.5) * 30;
  positions[i*3+1] = (Math.random()-0.5) * 15;
  positions[i*3+2] = (Math.random()-0.5) * 30;
  const c = pColors[Math.floor(Math.random()*pColors.length)];
  colors[i*3] = c[0];
  colors[i*3+1] = c[1];
  colors[i*3+2] = c[2];
  pVelocities[i*3] = (Math.random()-0.5) * 0.003;
  pVelocities[i*3+1] = (Math.random()-0.5) * 0.002;
  pVelocities[i*3+2] = (Math.random()-0.5) * 0.003;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const pMat = new THREE.PointsMaterial({
  size: 0.1, vertexColors: true, transparent: true, opacity: 0.65,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

/* ---- touch attractor ---- */
const mouse = new THREE.Vector2(9999, 9999);
let touchActive = false;
function onPointerMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function onPointerDown() { touchActive = true; }
function onPointerUp() { touchActive = false; mouse.set(9999, 9999); }
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointerend', onPointerUp);

/* ---- post processing ---- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.3, 0.5, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---- resize ---- */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  composer.setSize(w, h);
});

/* ---- animate ---- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  /* house float */
  houseGroup.position.y = Math.sin(t * 0.6) * 0.25;
  houseGroup.rotation.y = Math.sin(t * 0.15) * 0.15;

  /* roof pulse */
  const roofPulse = 1 + Math.sin(t * 1.2) * 0.03;
  roof.scale.set(roofPulse, 1, roofPulse);

  /* window flicker */
  winMat.emissiveIntensity = 0.9 + Math.sin(t * 2.5) * 0.3;

  /* light dance */
  pinkLight.intensity = 3 + Math.sin(t * 1.8) * 0.5;
  goldLight.position.x = -3 + Math.sin(t * 0.7) * 1.5;
  blueLight.position.z = -2 + Math.cos(t * 0.5) * 2;

  /* emoji orbits */
  for (const e of emojiSprites) {
    e.angle += e.speed * 0.008;
    e.sprite.position.x = Math.cos(e.angle) * e.radius;
    e.sprite.position.z = Math.sin(e.angle) * e.radius;
    e.sprite.position.y = e.baseY + Math.sin(t * 0.8 + e.angle * 2) * 0.4;
  }

  /* particle drift */
  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < PARTICLES; i++) {
    pos[i*3] += pVelocities[i*3];
    pos[i*3+1] += pVelocities[i*3+1];
    pos[i*3+2] += pVelocities[i*3+2];
    if (pos[i*3] > 15) pos[i*3] = -15;
    if (pos[i*3] < -15) pos[i*3] = 15;
    if (pos[i*3+1] > 7.5) pos[i*3+1] = -7.5;
    if (pos[i*3+1] < -7.5) pos[i*3+1] = 7.5;
    if (pos[i*3+2] > 15) pos[i*3+2] = -15;
    if (pos[i*3+2] < -15) pos[i*3+2] = 15;
    if (touchActive) {
      const dx = (mouse.x * 8) - pos[i*3];
      const dy = (mouse.y * 6) - pos[i*3+1];
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 5) {
        const force = 0.0002 / (dist + 0.5);
        pVelocities[i*3] += dx * force;
        pVelocities[i*3+1] += dy * force;
      }
    }
    pVelocities[i*3] *= 0.999;
    pVelocities[i*3+1] *= 0.999;
    pVelocities[i*3+2] *= 0.999;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
