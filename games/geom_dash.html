<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geometry Dash — Fast-paced platformer game — Luca Gandolfi's Portfolio">
    <meta name="keywords" content="geometry, dash, platformer, game">
    <meta name="author" content="Luca Gandolfi">
    <title>Geometry Dash — Luca Gandolfi</title>
    
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Default dark theme with modern cyberpunk aesthetic */
        body {
            background: linear-gradient(135deg, #0b1220 0%, #1a2332 100%);
            color: #e6eef8;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 191, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(0, 255, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        .geom-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 30px;
            position: relative;
        }

        .geom-container::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: 20px;
            bottom: 20px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 191, 255, 0.05));
            border-radius: 20px;
            z-index: -1;
            filter: blur(20px);
        }

        .geom-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .geom-header::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            border-radius: 2px;
        }

        .geom-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #00ffff, #00bfff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5)); }
            to { filter: drop-shadow(0 0 40px rgba(0, 255, 255, 0.8)); }
        }

        .geom-subtitle {
            color: #a0c0e0;
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .geom-subtitle {
            color: #a0c0e0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            position: relative;
        }

        .game-stats::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            transform: translateY(-50%);
            z-index: -1;
        }

        .stat-item {
            text-align: center;
            position: relative;
            padding: 20px 30px;
            background: rgba(0, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .stat-item:hover {
            background: rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            border-radius: 12px 12px 0 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-item:hover::before {
            opacity: 1;
        }

        .stat-label {
            color: #a0c0e0;
            font-size: 1rem;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #00bfff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .game-panel {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.08), rgba(0, 191, 255, 0.08));
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .game-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: panelGlow 3s ease-in-out infinite alternate;
        }

        @keyframes panelGlow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        .game-panel::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.5), transparent);
        }

        #gameCanvas {
            width: 100%;
            height: auto;
            background: linear-gradient(180deg, #0a1428 0%, #1a2940 100%);
            border: 3px solid rgba(0, 255, 255, 0.5);
            border-radius: 15px;
            display: block;
            margin-bottom: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2), inset 0 0 30px rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        #gameCanvas:hover {
            border-color: rgba(0, 255, 255, 0.8);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.4), inset 0 0 40px rgba(0, 255, 255, 0.2);
        }

        .game-message {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 191, 255, 0.1));
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 12px;
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffff;
            font-weight: 600;
            font-size: 1.2rem;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .game-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: messageShine 3s ease-in-out infinite;
        }

        @keyframes messageShine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .game-message.game-over {
            background: linear-gradient(135deg, rgba(255, 100, 100, 0.15), rgba(255, 80, 80, 0.15));
            border-color: rgba(255, 100, 100, 0.5);
            color: #ff6464;
            box-shadow: 0 0 30px rgba(255, 100, 100, 0.3);
        }

        .game-message.game-over::before {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .difficulty-selector {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(0, 191, 255, 0.05));
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .difficulty-selector::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            border-radius: 12px 12px 0 0;
        }

        .difficulty-label {
            color: #a0c0e0;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 600;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }

        .difficulty-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .difficulty-btn:hover::before {
            left: 100%;
        }

        .difficulty-btn:hover {
            border-color: rgba(0, 255, 255, 0.6);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 255, 255, 0.3);
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ffff, #00bfff);
            border-color: #00ffff;
            color: #0a1428;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .difficulty-btn.active:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow: 0 15px 35px rgba(0, 255, 255, 0.6);
        }

        .controls-info {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.08), rgba(0, 191, 255, 0.08));
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            color: #a0c0e0;
            font-size: 1.1rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .controls-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 255, 255, 0.03);
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .control-item:hover {
            background: rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .control-item:last-child {
            margin-bottom: 0;
        }

        .control-item strong {
            color: #00ffff;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .game-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-game {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 1.1rem;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-game::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn-game:hover::before {
            left: 100%;
        }

        .btn-game-primary {
            background: linear-gradient(135deg, #00ffff, #00bfff);
            color: #0a1428;
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.4);
        }

        .btn-game-primary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 255, 255, 0.6);
        }

        .btn-game-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            backdrop-filter: blur(10px);
        }

        .btn-game-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0c0e0;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            color: #00ffff;
            transform: translateX(-4px);
        }

        @media (max-width: 600px) {
            .geom-container {
                padding: 20px 15px;
            }

            .geom-title {
                font-size: 1.8rem;
            }

            .game-stats {
                gap: 20px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .controls-info {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="lang-top-left" aria-hidden="false">
        <label for="langSelect" class="visually-hidden">Select language</label>
        <select id="langSelect" aria-label="Select language" title="Change language">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 中</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 日本</option>
            <option value="sv">🇸🇪 SV</option>
            <option value="ar">🇸🇦 AR</option>
            <option value="he">🇮🇱 HE</option>
        </select>
    </div>

    <div class="particles" id="particles"></div>

    <div class="geom-container">
        <a href="../index.html#games" class="back-button">← <span data-i18n="games.geom_dash.back">Back to Games</span></a>

        <div class="geom-header">
            <h1 class="geom-title">📐 <span data-i18n="games.geom_dash.gameTitle">Geometry Dash</span></h1>
            <p class="geom-subtitle" data-i18n="games.geom_dash.gameSubtitle">Jump through obstacles and reach the end!</p>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.geom_dash.score">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.geom_dash.best">Best Score</div>
                <div class="stat-value" id="bestScore">—</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.geom_dash.deaths">Deaths</div>
                <div class="stat-value" id="deaths">0</div>
            </div>
        </div>

        <div class="game-panel">
            <div class="difficulty-selector">
                <div class="difficulty-label" data-i18n="games.geom_dash.difficulty">Difficulty</div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn active" data-difficulty="easy" data-i18n="games.geom_dash.easy">Easy</button>
                    <button class="difficulty-btn" data-difficulty="medium" data-i18n="games.geom_dash.medium">Medium</button>
                    <button class="difficulty-btn" data-difficulty="hard" data-i18n="games.geom_dash.hard">Hard</button>
                </div>
            </div>

            <div class="game-message" id="gameMessage" data-i18n="games.geom_dash.startMessage">Click or press SPACE/UP ARROW to jump!</div>

            <canvas id="gameCanvas" width="800" height="400"></canvas>

            <div class="controls-info">
                <div class="control-item">
                    <strong data-i18n="games.geom_dash.controls">Controls:</strong>
                </div>
                <div class="control-item">
                    <span>🖱️</span>
                    <span data-i18n="games.geom_dash.clickControl">Click or press SPACE / ⬆️ to jump</span>
                </div>
                <div class="control-item">
                    <span>📱</span>
                    <span data-i18n="games.geom_dash.touchControl">Tap screen on mobile</span>
                </div>
            </div>

            <div class="game-buttons">
                <button class="btn-game btn-game-primary" id="startBtn" data-i18n="games.geom_dash.play">Play</button>
                <button class="btn-game btn-game-secondary" id="resetStatsBtn" data-i18n="games.geom_dash.resetStats">Reset Stats</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            isRunning: false,
            isPaused: false,
            score: 0,
            bestScore: parseInt(localStorage.getItem('geom_dash_bestScore')) || 0,
            deaths: parseInt(localStorage.getItem('geom_dash_deaths')) || 0,
            difficulty: 'easy',
            gameSpeed: 5,
            obstacleGap: 120,
            lastObstacleTime: 0,
            spawnRate: 1500
        };

        const player = {
            x: 80,
            y: 0,
            width: 30,
            height: 30,
            velocity: 0,
            jumping: false,
            color: '#00ffff'
        };

        let obstacles = [];
        let platforms = [];
        let particles = [];
        let mouseX = canvas.width / 2;
        let animationId = null;

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = Math.min(800, rect.width - 40);
            canvas.height = 400;
        }

        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('bestScore').textContent = gameState.bestScore || '—';
            document.getElementById('deaths').textContent = gameState.deaths;
        }

        function updateMessage(key) {
            const msgEl = document.getElementById('gameMessage');
            msgEl.textContent = getTranslation(key);
            if (key.includes('gameOver')) {
                msgEl.classList.add('game-over');
            } else {
                msgEl.classList.remove('game-over');
            }
        }

        function setDifficulty(difficulty) {
            gameState.difficulty = difficulty;
            
            if (difficulty === 'easy') {
                gameState.gameSpeed = 4;
                gameState.obstacleGap = 250; // Increased gap
            } else if (difficulty === 'medium') {
                gameState.gameSpeed = 6;
                gameState.obstacleGap = 200; // Increased gap
            } else if (difficulty === 'hard') {
                gameState.gameSpeed = 8;
                gameState.obstacleGap = 180; // Increased gap
            }
        }

        function generateObstacle() {
            const obstacleHeight = 40 + Math.random() * 60;
            const obstacleWidth = 30 + Math.random() * 40; // Random width
            const spawnX = canvas.width + 20;
            
            // Randomly decide if obstacle is on floor or ceiling
            const isCeiling = Math.random() > 0.5;
            const y = isCeiling ? 0 : canvas.height - obstacleHeight - 50;
            
            obstacles.push({
                x: spawnX,
                y: y,
                width: obstacleWidth,
                height: obstacleHeight,
                color: '#ff6b6b',
                rotation: Math.random() * 360,
                pulse: Math.random() > 0.5
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    particles.push({
                        x: x + Math.random() * 30 - 15,
                        y: y + Math.random() * 30 - 15,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        life: 1,
                        color: color,
                        size: Math.random() * 3 + 1
                    });
                }, i * 50);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // gravity
                p.life -= 0.02;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawPlayer() {
            ctx.save();
            
            // Add glow effect to player
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            // Draw player with gradient for more depth
            const gradient = ctx.createLinearGradient(player.x, player.y, player.x + player.width, player.y + player.height);
            gradient.addColorStop(0, player.color);
            gradient.addColorStop(0.3, '#00bfff');
            gradient.addColorStop(0.7, '#0099ff');
            gradient.addColorStop(1, player.color);
            ctx.fillStyle = gradient;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Add animated border
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(player.x, player.y, player.width, player.height);
            ctx.setLineDash([]);
            
            // Add highlight effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(player.x + 3, player.y + 3, player.width - 6, player.height / 2);
            
            // Player eyes with glow
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#0a1428';
            ctx.fillRect(player.x + 8, player.y + 8, 5, 5);
            ctx.fillRect(player.x + 17, player.y + 8, 5, 5);
            
            // Add pupils that follow mouse
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(player.x + 10, player.y + 10, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 19, player.y + 10, 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Add energy aura when jumping
            if (player.jumping) {
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 35;
                ctx.globalAlpha = 0.8;
                ctx.fillRect(player.x - 8, player.y - 8, player.width + 16, player.height + 16);
                ctx.globalAlpha = 1.0;
            }
            
            // Add running effect when moving
            if (gameState.isRunning && !player.jumping) {
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(player.x + player.width - 10, player.y + 5, 5, 5);
                ctx.globalAlpha = 1.0;
            }
            
            ctx.restore();
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.save();
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                // Add pulsing effect for special obstacles
                if (obs.pulse) {
                    ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 200) * 0.3;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                }
                
                // Add pattern
                ctx.strokeStyle = 'rgba(255, 107, 107, 0.5)';
                ctx.lineWidth = 2;
                for (let i = 0; i < obs.height; i += 10) {
                    ctx.strokeRect(obs.x, obs.y + i, obs.width, 5);
                }
                
                // Add glow effect
                ctx.shadowColor = obs.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                ctx.restore();
            });
        }

        function drawGround() {
            // Create gradient ground effect
            const gradient = ctx.createLinearGradient(0, canvas.height - 50, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.1)');
            gradient.addColorStop(0.5, 'rgba(0, 191, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 255, 255, 0.1)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // Animated ground pattern
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width; i += 60) {
                const pulse = Math.sin(Date.now() / 300 + i / 20) * 0.3 + 0.7;
                ctx.globalAlpha = pulse;
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - 50);
                ctx.lineTo(i + 30, canvas.height - 20);
                ctx.lineTo(i + 60, canvas.height - 50);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
            
            // Add ground glow
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.fillRect(0, canvas.height - 55, canvas.width, 55);
            ctx.shadowBlur = 0;
        }

        function drawScore() {
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 20px Inter';
            ctx.fillText(`Score: ${gameState.score}`, 20, 30);
        }

        function checkCollisions() {
            const groundY = canvas.height - 50;
            
            // Ground collision with bounce effect
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.jumping = false;
                player.velocity = 0;
                
                // Add ground impact particles
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: player.x + player.width / 2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 3,
                        vy: -Math.random() * 5 - 2,
                        life: 1,
                        color: '#00ffff',
                        size: Math.random() * 3 + 1
                    });
                }
            }

            // Obstacle collision with visual feedback
            obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    
                    // Create impact effect
                    createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, '#ff6b6b');
                    endGame();
                }
            });
        }

        function update() {
            if (!gameState.isRunning) return;

            // Gravity (Increased for faster fall)
            player.velocity += 0.9;
            player.y += player.velocity;

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameState.gameSpeed;
                
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    gameState.score += 1;
                }
            }

            // Generate new obstacles
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - gameState.obstacleGap) {
                generateObstacle();
            }

            checkCollisions();

            // Ceiling check
            if (player.y < 0) {
                player.y = 0;
                player.velocity = 0;
            }

            updateParticles();
            updateStats();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawGround();
            drawObstacles();
            drawPlayer();
            drawScore();
            drawParticles();
        }

        function gameLoop() {
            update();
            draw();
            
            if (gameState.isRunning) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function startGame() {
            gameState.isRunning = true;
            gameState.score = 0;
            obstacles = [];
            particles = [];
            player.y = canvas.height - 80;
            player.velocity = 0;
            player.jumping = false;
            
            updateMessage('games.geom_dash.playing');
            document.getElementById('startBtn').textContent = getTranslation('games.geom_dash.restart');
            
            // Add start particles
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    particles.push({
                        x: canvas.width / 2,
                        y: canvas.height / 2,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        life: 1,
                        color: '#00ffff',
                        size: Math.random() * 4 + 2
                    });
                }, i * 50);
            }
            
            gameLoop();
        }

        function endGame() {
            gameState.isRunning = false;
            gameState.deaths += 1;
            
            if (gameState.score > gameState.bestScore) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('geom_dash_bestScore', gameState.bestScore);
                
                // Add celebration particles
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        particles.push({
                            x: canvas.width / 2,
                            y: canvas.height / 2,
                            vx: (Math.random() - 0.5) * 8,
                            vy: (Math.random() - 0.5) * 8 - 2,
                            life: 1,
                            color: '#00ffff',
                            size: Math.random() * 6 + 3
                        });
                    }, i * 30);
                }
            }
            
            localStorage.setItem('geom_dash_deaths', gameState.deaths);
            updateMessage('games.geom_dash.gameOver');
            updateStats();
        }

        function startJump() {
            if (!gameState.isRunning) return;
            
            const groundY = canvas.height - 50;
            // Check if on ground (with small tolerance)
            if (player.y + player.height >= groundY - 5) {
                player.velocity = -18; // Higher initial velocity for faster jump
                player.jumping = true;
            }
        }

        function endJump() {
            // If moving up fast (holding jump), and released, cut velocity
            if (player.velocity < -6) {
                player.velocity = -6;
            }
        }

        function resetStats() {
            if (confirm(getTranslation('games.geom_dash.confirmReset'))) {
                gameState.bestScore = 0;
                gameState.deaths = 0;
                localStorage.removeItem('geom_dash_bestScore');
                localStorage.removeItem('geom_dash_deaths');
                updateStats();
            }
        }

        function getTranslation(key) {
            const lang = localStorage.getItem('language') || 'en';
            const translations = window.i18nData?.[lang] || window.i18nData?.en || {};

            const keys = key.split('.');
            let value = translations;
            for (const k of keys) {
                value = value?.[k];
            }
            return value || key;
        }

        // i18n initialization
        let currentLang = localStorage.getItem('language') || 'en';

        async function loadI18n() {
            try {
                const response = await fetch(`./i18n/${currentLang}.json`);
                window.i18nData = await response.json();
                applyTranslations();
            } catch (error) {
                console.error('Failed to load i18n:', error);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                const text = getTranslation(key);
                if (text && text !== key) {
                    el.textContent = text;
                }
            });
        }

        // Event listeners
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('language', currentLang);
            loadI18n();
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resetStatsBtn').addEventListener('click', resetStats);

        // Mouse tracking for eye following
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        // Input handling for variable jump height
        const handleStart = (e) => {
            if (e.type === 'keydown' && !(e.key === ' ' || e.key === 'ArrowUp')) return;
            // Prevent default for touch/keys to avoid scrolling
            if (e.cancelable && (e.type === 'touchstart' || e.type === 'keydown')) e.preventDefault();
            startJump();
        };

        const handleEnd = (e) => {
            if (e.type === 'keyup' && !(e.key === ' ' || e.key === 'ArrowUp')) return;
            endJump();
        };

        // Mouse
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        // Keyboard
        document.addEventListener('keydown', handleStart);
        document.addEventListener('keyup', handleEnd);

        // Touch
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchend', handleEnd, { passive: false });

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setDifficulty(btn.dataset.difficulty);
            });
        });

        // Initialize
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.getElementById('langSelect').value = currentLang;
        loadI18n();
        updateStats();
        setDifficulty('easy');
    </script>
</body>
</html>
