<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geometry Dash — Fast-paced platformer game — Luca Gandolfi's Portfolio">
    <meta name="keywords" content="geometry, dash, platformer, game">
    <meta name="author" content="Luca Gandolfi">
    <title>Geometry Dash — Luca Gandolfi</title>
    
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Default dark theme */
        body { background: #0b1220; color: #e6eef8; }

        .geom-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .geom-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .geom-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00ffff, #00bfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .geom-subtitle {
            color: #a0c0e0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #a0c0e0;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00ffff, #00bfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-panel {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(0, 191, 255, 0.05));
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        #gameCanvas {
            width: 100%;
            height: auto;
            background: linear-gradient(180deg, #0a1428 0%, #1a2940 100%);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            display: block;
            margin-bottom: 20px;
        }

        .game-message {
            text-align: center;
            padding: 15px;
            background: rgba(0, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffff;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .game-message.game-over {
            background: rgba(255, 100, 100, 0.1);
            border-color: rgba(255, 100, 100, 0.3);
            color: #ff6464;
        }

        .difficulty-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .difficulty-label {
            color: #a0c0e0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ffff, #00bfff);
            border-color: #00ffff;
            color: #0a1428;
        }

        .difficulty-btn:hover {
            border-color: rgba(0, 255, 255, 0.5);
        }

        .controls-info {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #a0c0e0;
            font-size: 0.95rem;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-item:last-child {
            margin-bottom: 0;
        }

        .game-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-game {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-game-primary {
            background: linear-gradient(135deg, #00ffff, #00bfff);
            color: #0a1428;
        }

        .btn-game-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 255, 0.3);
        }

        .btn-game-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-game-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0c0e0;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            color: #00ffff;
            transform: translateX(-4px);
        }

        @media (max-width: 600px) {
            .geom-container {
                padding: 20px 15px;
            }

            .geom-title {
                font-size: 1.8rem;
            }

            .game-stats {
                gap: 20px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .controls-info {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="lang-top-left" aria-hidden="false">
        <label for="langSelect" class="visually-hidden">Select language</label>
        <select id="langSelect" aria-label="Select language" title="Change language">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 中</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 日本</option>
            <option value="sv">🇸🇪 SV</option>
            <option value="ar">🇸🇦 AR</option>
            <option value="he">🇮🇱 HE</option>
        </select>
    </div>

    <div class="particles" id="particles"></div>

    <div class="geom-container">
        <a href="index.html#games" class="back-button">← <span data-i18n="games.geom_dash.back">Back to Games</span></a>

        <div class="geom-header">
            <h1 class="geom-title">📐 <span data-i18n="games.geom_dash.gameTitle">Geometry Dash</span></h1>
            <p class="geom-subtitle" data-i18n="games.geom_dash.gameSubtitle">Jump through obstacles and reach the end!</p>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.geom_dash.score">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.geom_dash.best">Best Score</div>
                <div class="stat-value" id="bestScore">—</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" data-i18n="games.geom_dash.deaths">Deaths</div>
                <div class="stat-value" id="deaths">0</div>
            </div>
        </div>

        <div class="game-panel">
            <div class="difficulty-selector">
                <div class="difficulty-label" data-i18n="games.geom_dash.difficulty">Difficulty</div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn active" data-difficulty="easy" data-i18n="games.geom_dash.easy">Easy</button>
                    <button class="difficulty-btn" data-difficulty="medium" data-i18n="games.geom_dash.medium">Medium</button>
                    <button class="difficulty-btn" data-difficulty="hard" data-i18n="games.geom_dash.hard">Hard</button>
                </div>
            </div>

            <div class="game-message" id="gameMessage" data-i18n="games.geom_dash.startMessage">Click or press SPACE/UP ARROW to jump!</div>

            <canvas id="gameCanvas" width="800" height="400"></canvas>

            <div class="controls-info">
                <div class="control-item">
                    <strong data-i18n="games.geom_dash.controls">Controls:</strong>
                </div>
                <div class="control-item">
                    <span>🖱️</span>
                    <span data-i18n="games.geom_dash.clickControl">Click or press SPACE / ⬆️ to jump</span>
                </div>
                <div class="control-item">
                    <span>📱</span>
                    <span data-i18n="games.geom_dash.touchControl">Tap screen on mobile</span>
                </div>
            </div>

            <div class="game-buttons">
                <button class="btn-game btn-game-primary" id="startBtn" data-i18n="games.geom_dash.play">Play</button>
                <button class="btn-game btn-game-secondary" id="resetStatsBtn" data-i18n="games.geom_dash.resetStats">Reset Stats</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            isRunning: false,
            isPaused: false,
            score: 0,
            bestScore: parseInt(localStorage.getItem('geom_dash_bestScore')) || 0,
            deaths: parseInt(localStorage.getItem('geom_dash_deaths')) || 0,
            difficulty: 'easy',
            gameSpeed: 5,
            obstacleGap: 120
        };

        const player = {
            x: 80,
            y: 0,
            width: 30,
            height: 30,
            velocity: 0,
            jumping: false,
            color: '#00ffff'
        };

        let obstacles = [];
        let platforms = [];
        let animationId = null;

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = Math.min(800, rect.width - 40);
            canvas.height = 400;
        }

        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('bestScore').textContent = gameState.bestScore || '—';
            document.getElementById('deaths').textContent = gameState.deaths;
        }

        function updateMessage(key) {
            const msgEl = document.getElementById('gameMessage');
            msgEl.textContent = getTranslation(key);
            if (key.includes('gameOver')) {
                msgEl.classList.add('game-over');
            } else {
                msgEl.classList.remove('game-over');
            }
        }

        function setDifficulty(difficulty) {
            gameState.difficulty = difficulty;
            
            if (difficulty === 'easy') {
                gameState.gameSpeed = 4;
                gameState.obstacleGap = 250; // Increased gap
            } else if (difficulty === 'medium') {
                gameState.gameSpeed = 6;
                gameState.obstacleGap = 200; // Increased gap
            } else if (difficulty === 'hard') {
                gameState.gameSpeed = 8;
                gameState.obstacleGap = 180; // Increased gap
            }
        }

        function generateObstacle() {
            const obstacleHeight = 40 + Math.random() * 60;
            const obstacleWidth = 30 + Math.random() * 40; // Random width
            const spawnX = canvas.width + 20;
            
            // Randomly decide if obstacle is on floor or ceiling
            const isCeiling = Math.random() > 0.5;
            const y = isCeiling ? 0 : canvas.height - obstacleHeight - 50;
            
            obstacles.push({
                x: spawnX,
                y: y,
                width: obstacleWidth,
                height: obstacleHeight,
                color: '#ff6b6b'
            });
        }

        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Player eyes
            ctx.fillStyle = '#0a1428';
            ctx.fillRect(player.x + 8, player.y + 8, 5, 5);
            ctx.fillRect(player.x + 17, player.y + 8, 5, 5);
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                // Add pattern
                ctx.strokeStyle = 'rgba(255, 107, 107, 0.5)';
                ctx.lineWidth = 2;
                for (let i = 0; i < obs.height; i += 10) {
                    ctx.strokeRect(obs.x, obs.y + i, obs.width, 5);
                }
            });
        }

        function drawGround() {
            ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // Ground pattern
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.strokeRect(i, canvas.height - 50, 40, 50);
            }
        }

        function drawScore() {
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 20px Inter';
            ctx.fillText(`Score: ${gameState.score}`, 20, 30);
        }

        function checkCollisions() {
            const groundY = canvas.height - 50;
            
            // Ground collision
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.jumping = false;
                player.velocity = 0;
            }

            // Obstacle collision
            obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    
                    endGame();
                }
            });
        }

        function update() {
            if (!gameState.isRunning) return;

            // Gravity (Increased for faster fall)
            player.velocity += 0.9;
            player.y += player.velocity;

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameState.gameSpeed;
                
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    gameState.score += 1;
                }
            }

            // Generate new obstacles
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - gameState.obstacleGap) {
                generateObstacle();
            }

            checkCollisions();

            // Ceiling check
            if (player.y < 0) {
                player.y = 0;
                player.velocity = 0;
            }

            updateStats();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawGround();
            drawObstacles();
            drawPlayer();
            drawScore();
        }

        function gameLoop() {
            update();
            draw();
            
            if (gameState.isRunning) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function startGame() {
            gameState.isRunning = true;
            gameState.score = 0;
            obstacles = [];
            player.y = canvas.height - 80;
            player.velocity = 0;
            player.jumping = false;
            
            updateMessage('games.geom_dash.playing');
            document.getElementById('startBtn').textContent = getTranslation('games.geom_dash.restart');
            
            gameLoop();
        }

        function endGame() {
            gameState.isRunning = false;
            gameState.deaths += 1;
            
            if (gameState.score > gameState.bestScore) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('geom_dash_bestScore', gameState.bestScore);
            }
            
            localStorage.setItem('geom_dash_deaths', gameState.deaths);
            updateMessage('games.geom_dash.gameOver');
            updateStats();
        }

        function startJump() {
            if (!gameState.isRunning) return;
            
            const groundY = canvas.height - 50;
            // Check if on ground (with small tolerance)
            if (player.y + player.height >= groundY - 5) {
                player.velocity = -18; // Higher initial velocity for faster jump
                player.jumping = true;
            }
        }

        function endJump() {
            // If moving up fast (holding jump), and released, cut velocity
            if (player.velocity < -6) {
                player.velocity = -6;
            }
        }

        function resetStats() {
            if (confirm(getTranslation('games.geom_dash.confirmReset'))) {
                gameState.bestScore = 0;
                gameState.deaths = 0;
                localStorage.removeItem('geom_dash_bestScore');
                localStorage.removeItem('geom_dash_deaths');
                updateStats();
            }
        }

        function getTranslation(key) {
            const lang = localStorage.getItem('language') || 'en';
            const translations = window.i18nData?.[lang] || window.i18nData?.en || {};

            const keys = key.split('.');
            let value = translations;
            for (const k of keys) {
                value = value?.[k];
            }
            return value || key;
        }

        // i18n initialization
        let currentLang = localStorage.getItem('language') || 'en';

        async function loadI18n() {
            try {
                const response = await fetch(`./i18n/${currentLang}.json`);
                window.i18nData = await response.json();
                applyTranslations();
            } catch (error) {
                console.error('Failed to load i18n:', error);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                const text = getTranslation(key);
                if (text && text !== key) {
                    el.textContent = text;
                }
            });
        }

        // Event listeners
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('language', currentLang);
            loadI18n();
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resetStatsBtn').addEventListener('click', resetStats);

        // Input handling for variable jump height
        const handleStart = (e) => {
            if (e.type === 'keydown' && !(e.key === ' ' || e.key === 'ArrowUp')) return;
            // Prevent default for touch/keys to avoid scrolling
            if (e.cancelable && (e.type === 'touchstart' || e.type === 'keydown')) e.preventDefault();
            startJump();
        };

        const handleEnd = (e) => {
            if (e.type === 'keyup' && !(e.key === ' ' || e.key === 'ArrowUp')) return;
            endJump();
        };

        // Mouse
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        // Keyboard
        document.addEventListener('keydown', handleStart);
        document.addEventListener('keyup', handleEnd);

        // Touch
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchend', handleEnd, { passive: false });

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setDifficulty(btn.dataset.difficulty);
            });
        });

        // Initialize
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.getElementById('langSelect').value = currentLang;
        loadI18n();
        updateStats();
        setDifficulty('easy');
    </script>
</body>
</html>
