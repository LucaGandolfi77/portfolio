<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#2a1f14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Esposta"/>
<meta name="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="description" content="Esposta: fotografia, social media e marketing — impara attraverso l'archivio di Nonna Olga. PWA installabile.">
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<title>ESPONI 📸</title>
<style>
:root{
  --bg:#1a1208; --bg2:#2a1f14; --card:#3d2b1a; --card2:#4a3728; --line:#5a4738;
  --txt:#e8dcc8; --dim:#9e8e78; --gold:#d4a853; --gold-light:#e8c878;
  --sepia:#8B7355; --cream:#faf3e8; --red:#c0392b; --green:#5a8a5a; --blue:#5a7a9e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:Georgia,'Palatino Linotype','Book Antiqua',serif;background:var(--bg);color:var(--txt);user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:calc(6px+var(--safe-t)) 8px calc(6px+var(--safe-b));overflow:hidden}
.hdr{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--card);border-radius:12px;border:1px solid var(--line);margin-bottom:4px}
.hdr .logo{font-size:20px;flex-shrink:0}
.hdr .title{font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold)}
.hdr .back{font-size:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.chbar{display:flex;gap:3px;overflow-x:auto;padding:2px 0;margin-bottom:4px;scrollbar-width:none}
.chbar::-webkit-scrollbar{display:none}
.chap{flex:none;padding:4px 7px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:9px;font-weight:700;cursor:pointer;text-align:center;min-width:36px;transition:all .15s;color:var(--dim)}
.chap.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.chap.done{background:var(--green);color:#fff;border-color:var(--green)}
.chap.locked{opacity:.25;pointer-events:none}
.chap .emoji{font-size:13px;display:block;line-height:1}
.prog-wrap{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sepia),var(--gold));border-radius:3px;transition:width .5s}
.prog-pct{font-size:10px;font-weight:700;color:var(--gold);min-width:24px;text-align:right}

/* STORY */
#story-overlay{position:fixed;inset:0;z-index:100;display:none;background:rgba(26,18,8,.94);padding:12px;align-items:center;justify-content:center}
#story-overlay.on{display:flex}
.story-box{max-width:440px;width:100%;background:var(--card);border-radius:16px;padding:18px 16px;text-align:center;border:2px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.story-box .speaker{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;color:var(--gold)}
.story-box .speaker.zio{color:var(--sepia)}
.story-box .speaker.nonna{color:var(--gold)}
.story-box .speaker.filtro{color:var(--blue)}
.story-box .speaker.narratore{color:var(--dim)}
.story-box .portrait{font-size:40px;margin-bottom:4px}
.story-box .txt{font-size:13px;line-height:1.7;min-height:60px;color:var(--cream);white-space:pre-wrap}
.story-box .acts{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}

/* CONCEPTS */
#concept-overlay{position:fixed;inset:0;z-index:110;display:none;background:rgba(26,18,8,.95);padding:12px;align-items:center;justify-content:center}
#concept-overlay.on{display:flex}
.concept-box{max-width:460px;width:100%;background:var(--card);border-radius:14px;padding:16px;text-align:left;border:2px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:82vh;overflow-y:auto;scrollbar-width:none}
.concept-box::-webkit-scrollbar{display:none}
.concept-box .c-title{font-size:14px;font-weight:700;text-align:center;margin-bottom:8px;color:var(--gold)}
.concept-box .c-body{font-size:12px;line-height:1.7;color:var(--cream)}
.concept-box .c-body b{color:var(--gold)}
.concept-box .c-body .c-term{background:var(--card2);padding:1px 6px;border-radius:4px;font-weight:700;color:var(--gold)}
.concept-box .c-body .c-paper{color:var(--sepia);font-style:italic;font-size:11px}
.concept-box .c-body .c-formula{background:var(--bg);padding:6px 10px;border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--gold);display:block;margin:6px 0;text-align:center}
.concept-box .c-body .c-quote{border-left:3px solid var(--gold);padding-left:10px;margin:8px 0;font-style:italic;color:var(--dim)}
.concept-box .c-case{background:var(--bg2);padding:10px;border-radius:10px;margin:8px 0;border:1px solid var(--line)}
.concept-box .c-case .c-case-title{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px}

/* BUTTONS */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:all .12s;min-height:40px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.small{padding:6px 12px;font-size:11px;min-height:32px;border-radius:8px}
.btn[disabled]{opacity:.3;pointer-events:none}

/* MINIGAME */
#game-area{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:6px}
#game-area::-webkit-scrollbar{display:none}
.mg-title{font-size:15px;font-weight:700;text-align:center;margin:2px 0;color:var(--gold)}
.mg-sub{font-size:11px;color:var(--dim);text-align:center;margin-bottom:2px;font-style:italic}
.mg-card{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:12px;margin-bottom:2px}
.mg-score{text-align:center;font-size:12px;font-weight:700;margin:4px 0;color:var(--gold)}
.mg-timer{text-align:center;font-size:24px;font-weight:800;color:var(--gold);font-family:ui-monospace,Menlo,monospace}
.mg-grid{display:grid;gap:6px}
.mg-btn{appearance:none;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:left;transition:all .12s;font-family:inherit;color:var(--txt)}
.mg-btn:active{transform:scale(.97)}
.mg-btn.correct{border-color:var(--green);background:#3a4a2a;color:#a0c8a0}
.mg-btn.wrong{border-color:var(--red);background:#4a2a2a;color:#c8a0a0}

/* SLIDER */
.slider-wrap{display:flex;align-items:center;gap:6px;margin:4px 0}
.slider-wrap label{font-size:11px;font-weight:600;min-width:70px}
.slider-wrap input[type=range]{flex:1;accent-color:var(--gold)}
.slider-wrap .val{font-size:12px;font-weight:700;color:var(--gold);min-width:36px;text-align:right}

/* EXPOSURE */
.exp-preview{width:100%;aspect-ratio:3/2;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:48px;transition:filter .3s,background .3s}
.exp-label{font-size:11px;font-weight:700;text-align:center;margin-top:4px}

/* COMPOSITION */
.comp-canvas{position:relative;width:100%;aspect-ratio:3/2;border-radius:10px;border:2px solid var(--line);background:var(--bg);overflow:hidden}
.comp-grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;pointer-events:none}
.comp-grid div{border:1px solid rgba(212,168,83,.15)}
.comp-subject{position:absolute;font-size:28px;cursor:grab;touch-action:none;z-index:2;transition:transform .1s}
.comp-subject:active{transform:scale(1.15)}

/* LIGHT SCENARIOS */
.light-card{padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);cursor:pointer;transition:all .15s;text-align:center}
.light-card:active{transform:scale(.96)}
.light-card.selected{border-color:var(--gold);background:var(--card2)}
.light-card .lc-emoji{font-size:28px}
.light-card .lc-name{font-size:11px;font-weight:700;margin-top:2px}

/* TIMING GAME */
.timing-zone{position:relative;width:100%;height:120px;background:linear-gradient(90deg,var(--bg),var(--card2),var(--bg));border-radius:10px;border:1px solid var(--line);overflow:hidden}
.timing-target{position:absolute;top:0;bottom:0;width:40px;background:rgba(212,168,83,.25);border:2px solid var(--gold);border-radius:8px}
.timing-cursor{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--red);border-radius:2px;transition:left .015s linear}

/* POST BUILDER */
.post-preview{background:var(--bg);border-radius:12px;border:1px solid var(--line);padding:12px;margin-bottom:6px}
.post-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.post-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
.post-handle{font-size:12px;font-weight:700;color:var(--gold)}
.post-text{font-size:13px;line-height:1.5;margin-bottom:8px}
.post-img{width:100%;aspect-ratio:16/9;background:var(--card2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:8px}
.post-actions{display:flex;gap:16px;font-size:12px;color:var(--dim)}

/* FUNNEL */
.funnel-stage{padding:10px;border-radius:10px;border:2px dashed var(--line);min-height:60px;position:relative}
.funnel-stage .fs-label{position:absolute;top:-10px;left:10px;background:var(--bg);padding:0 6px;font-size:10px;font-weight:700;color:var(--gold)}
.funnel-item{display:inline-block;padding:5px 10px;margin:3px;border-radius:8px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--line);cursor:pointer}

/* PERCEPTUAL MAP */
.perceptual-map{position:relative;width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--bg);overflow:hidden}
.pm-axis-x,.pm-axis-y{position:absolute;font-size:9px;font-weight:700;color:var(--dim)}
.pm-dot{position:absolute;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:grab;border:2px solid var(--gold);background:var(--card)}

/* RESULT BOX */
.result-box{padding:12px;background:var(--bg);border-radius:10px;border:1px solid var(--gold);font-size:13px;line-height:1.6;color:var(--cream);font-style:italic}

/* AGENCY */
.ag-header{text-align:center;padding:6px}
.ag-money{font-size:22px;font-weight:700;color:var(--gold);font-family:ui-monospace,Menlo,monospace}
.ag-rate{font-size:11px;color:var(--dim)}
.ag-brief{padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
.ag-brief .ab-title{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:4px}
.ag-brief .ab-client{font-size:12px;color:var(--dim);margin-bottom:6px}
.ag-param{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.ag-param .ap-btn{flex:1;min-width:80px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-size:10px;font-weight:600;cursor:pointer;text-align:center;color:var(--txt)}
.ag-param .ap-btn:active{transform:scale(.95)}
.ag-param .ap-btn.selected{border-color:var(--gold);background:var(--card)}

/* MODAL */
#modal{position:fixed;inset:0;z-index:200;display:none;background:rgba(26,18,8,.88);align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
.modal-box{max-width:400px;width:100%;background:var(--card);border-radius:16px;padding:20px;text-align:center;border:2px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal-box .modal-icon{font-size:44px;margin-bottom:6px}
.modal-box .modal-title{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--gold)}
.modal-box .modal-txt{font-size:12px;color:var(--cream);line-height:1.5;margin-bottom:12px}

/* MENU */
#menu-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px 0}
#menu-view .menu-art{font-size:64px;line-height:1}
#menu-view h1{font-size:28px;font-weight:700;line-height:1.2;color:var(--gold)}
#menu-view h1 span{color:var(--sepia);font-style:italic}
#menu-view .menu-sub{font-size:12px;color:var(--dim);max-width:300px;line-height:1.6;font-style:italic}
#menu-view .menu-actions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}

.continue-banner{background:var(--card2);border:1px solid var(--gold);border-radius:12px;padding:10px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.continue-banner .cb-text{flex:1;text-align:left;font-size:12px;font-weight:600;color:var(--txt)}
.continue-banner .cb-text small{display:block;font-size:10px;color:var(--dim);font-weight:400;margin-top:2px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease}
@keyframes grain{0%,100%{transform:translate(0,0)}10%{transform:translate(-2%,-2%)}30%{transform:translate(1%,3%)}50%{transform:translate(-3%,1%)}70%{transform:translate(2%,-1%)}90%{transform:translate(-1%,2%)}}
.grain::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-conic-gradient(rgba(200,180,140,.03) 0% 25%, transparent 0% 50%) 0 0/3px 3px;animation:grain 4s steps(8) infinite;opacity:.4}

@media(min-width:600px){#app{max-width:520px}}
@media(max-width:360px){.chap{min-width:30px;padding:3px 5px}.mg-card{padding:8px}}
</style>
</head>
<body>
<div id="app">
  <div id="menu-view">
    <div class="menu-art">📸</div>
    <h1>ESPONI</h1>
    <p class="menu-sub">Dalla camera oscura all'agenzia digitale. L'archivio di Nonna Olga ti insegna l'arte completa.</p>
    <div class="menu-actions" id="menu-actions"></div>
  </div>
  <div id="game-view" style="display:none">
    <div class="hdr">
      <button class="back" id="btn-menu" title="Menu">🏠</button>
      <div class="logo">📸</div>
      <div class="title" id="chapter-title"></div>
    </div>
    <div class="chbar" id="chbar"></div>
    <div class="prog-wrap">
      <div class="prog"><i id="prog-bar" style="width:0%"></i></div>
      <div class="prog-pct" id="prog-pct">0%</div>
    </div>
    <div id="game-area"></div>
  </div>
</div>
<div id="story-overlay">
  <div class="story-box">
    <div class="portrait" id="story-portrait">📸</div>
    <div class="speaker" id="story-speaker"></div>
    <div class="txt" id="story-text"></div>
    <div class="acts" id="story-acts"></div>
  </div>
</div>
<div id="concept-overlay">
  <div class="concept-box">
    <div class="c-title" id="concept-title"></div>
    <div class="c-body" id="concept-body"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn small" id="concept-close">Chiudi ✕</button></div>
  </div>
</div>
<div id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="modal-icon"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-txt" id="modal-txt"></div>
    <div class="acts" id="modal-acts"></div>
  </div>
</div>
<script src="js/story.js"></script>
<script src="js/concepts.js"></script>
<script src="js/cases.js"></script>
<script src="js/minigames.js"></script>
<script src="js/agency.js"></script>
<script src="js/main.js"></script>
</body>
</html>
