<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bdc3c7"/>
      <stop offset="50%" stop-color="#ecf0f1"/>
      <stop offset="100%" stop-color="#95a5a6"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Cross -->
  <rect x="216" y="80" width="80" height="352" rx="16" fill="#27ae60" opacity="0.25"/>
  <rect x="80" y="216" width="352" height="80" rx="16" fill="#27ae60" opacity="0.25"/>
  <!-- Scalpel handle -->
  <rect x="140" y="300" width="200" height="28" rx="8" fill="#7f8c8d" transform="rotate(-45 240 314)"/>
  <rect x="148" y="304" width="184" height="20" rx="6" fill="#95a5a6" transform="rotate(-45 240 314)"/>
  <!-- Scalpel blade -->
  <polygon points="310,170 380,100 390,110 320,180" fill="url(#blade)"/>
  <polygon points="310,170 320,180 290,210 280,200" fill="url(#blade)" opacity="0.8"/>
  <!-- Heart rate line -->
  <polyline points="60,400 140,400 160,370 180,430 200,380 220,400 300,400 320,360 340,440 360,390 380,400 460,400" 
    fill="none" stroke="#e74c3c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pulse dot -->
  <circle cx="340" cy="440" r="8" fill="#e74c3c"/>
  <circle cx="340" cy="440" r="14" fill="#e74c3c" opacity="0.3"/>
</svg>
