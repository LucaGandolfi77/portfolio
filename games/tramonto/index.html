<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a14"/>
<meta name="color-scheme" content="dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Sunset"/>
<meta name="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="description" content="Sunset Compass — GPS, bussola e realtà aumentata per seguire il sole fino all'orizzonte."/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<link rel="stylesheet" href="styles.css"/>
<title>Sunset Compass 🌅</title>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="sky-glow"></div>
  <div class="sun-orb"></div>
  <div class="horizon"></div>
  <div class="grain"></div>
</div>
<div id="stars" class="stars" aria-hidden="true"></div>

<div id="app">

  <!-- PERMISSIONS -->
  <section id="view-perm" class="perm-view">
    <div class="perm-card">
      <div class="perm-orbit"><span>🌅</span></div>
      <h1 data-sa-i18n="permTitle">Sunset Compass</h1>
      <p class="perm-desc" data-sa-i18n="permDesc"></p>
      <button class="btn primary large" id="btn-start" type="button">
        <span data-sa-i18n="start">Inizia</span> <span class="arrow">→</span>
      </button>
      <p class="perm-private" id="perm-private"></p>
      <div class="feature-row">
        <span>🛰️ GPS</span><span>🧭 Compass</span><span>📷 AR</span>
      </div>
    </div>
  </section>

  <!-- MAIN -->
  <section id="view-main" style="display:none">

    <nav class="nav" aria-label="Views">
      <button class="nav-btn on" id="nav-compass" data-mode="compass" type="button">🧭 <span data-sa-i18n="navCompass">Bussola</span></button>
      <button class="nav-btn" id="nav-camera" data-mode="camera" type="button">📷 <span data-sa-i18n="navCamera">Camera</span></button>
      <button class="nav-btn" id="nav-tracker" data-mode="tracker" type="button">👻 <span data-sa-i18n="navTracker">Timeline</span></button>
      <span class="nav-pill"></span>
    </nav>

    <header class="status">
      <span class="status-loc"><i>📍</i><span id="loc-text">—</span></span>
      <span class="status-right">
        <span class="phase-chip" id="phase-chip" data-sa-i18n="phase">Fase</span>
        <span class="clock" id="clock">--:--:--</span>
        <button class="lang-btn" id="btn-lang" type="button" aria-label="Language">IT</button>
      </span>
    </header>

    <div class="countdown" id="countdown-box">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="54"/>
          <circle class="ring-fg" id="cd-ring" cx="60" cy="60" r="54"/>
        </svg>
        <div class="ring-core">
          <span class="cd-label" id="cd-label" data-sa-i18n="nextSunset">Prossimo tramonto</span>
          <span class="cd-time" id="cd-time">--:--:--</span>
        </div>
      </div>
      <span class="cd-sub" id="cd-sub">…</span>
    </div>

    <!-- COMPASS -->
    <div id="view-compass" class="compass-view">
      <div class="compass-frame">
        <svg class="compass-svg" id="compass-svg" viewBox="0 0 400 400" aria-label="Sun compass"></svg>
      </div>
      <div class="sun-readout" id="sun-readout">☀ —</div>
    </div>

    <!-- TRACKER -->
    <div id="view-tracker" class="tracker-view" style="display:none">
      <div class="trail-scroll" id="trail-scroll"></div>
    </div>

    <!-- CAMERA -->
    <div id="view-camera" class="camera-view" style="display:none">
      <video class="ar-video" id="ar-video" playsinline autoplay muted></video>
      <svg class="ar-svg" id="ar-svg" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="ar-tap" id="ar-tap" aria-label="Mark obstacle"></div>
      <div class="ar-top">
        <span class="ar-badge sun" id="ar-sun-info">☀ —</span>
        <button class="ar-badge clear" id="btn-clear-obs" type="button">🧹 <span data-sa-i18n="clearObstacles">Cancella</span></button>
        <span class="ar-badge obs" id="ar-obs-info">🏔 0</span>
      </div>
      <div class="ar-hint" data-sa-i18n="tapHint">Tocca l’orizzonte per segnare un ostacolo</div>
      <div class="ar-fallback hidden" id="ar-fallback">
        <div class="ar-fallback-icon">📷</div>
        <b id="ar-fallback-title">Camera non disponibile</b>
        <small id="ar-fallback-text">Abilita i permessi</small>
      </div>
    </div>

  </section>
</div>

<div id="toast"></div>

<div id="modal">
  <div class="modal-box">
    <button class="modal-x" id="modal-close" type="button" aria-label="Close">✕</button>
    <div class="modal-icon" id="modal-icon"></div>
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="modal-text" id="modal-text"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../top_buttons.js"></script>
</body>
</html>
