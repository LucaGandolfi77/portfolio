<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b16">
<title>Drinking Game — Sfide alcoliche</title>
<style>
:root{
  --bg:#080b16;--panel:rgba(16,24,44,.76);--panel2:rgba(20,30,54,.95);
  --line:rgba(150,190,255,.13);--line2:rgba(150,190,255,.26);
  --txt:#eef3ff;--dim:#8b9cbb;--pink:#ff5d9e;--violet:#a98bff;--cyan:#4de8ff;
  --gold:#ffd166;--green:#5ef0a8;--red:#ff5f6d;
  --top:var(--site-top-bar-height,0px);
}
body[data-theme="light"]{
  --bg:#f3f5fb;--panel:rgba(255,255,255,.8);--panel2:#ffffff;
  --line:rgba(30,60,110,.12);--line2:rgba(30,60,110,.24);
  --txt:#1c2b44;--dim:#6b7e9c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--txt);
  background:
    radial-gradient(760px 440px at 10% -10%,rgba(169,139,255,.16),transparent 62%),
    radial-gradient(700px 420px at 95% 8%,rgba(77,232,255,.12),transparent 60%),
    radial-gradient(700px 460px at 50% 110%,rgba(255,93,158,.08),transparent 60%),
    var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
  padding-top:calc(var(--top) + env(safe-area-inset-top,0px));
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(150,190,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(150,190,255,.025) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(circle at 50% 20%,#000,transparent 80%);-webkit-mask-image:radial-gradient(circle at 50% 20%,#000,transparent 80%)}
.orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;opacity:.45;animation:drift 12s ease-in-out infinite}
.orb.a{width:300px;height:300px;background:rgba(169,139,255,.14);top:-90px;left:-60px}
.orb.b{width:280px;height:280px;background:rgba(77,232,255,.12);bottom:-80px;right:-50px;animation-delay:-6s}
@keyframes drift{50%{transform:translate(28px,-22px) scale(1.14)}}
.shell{position:relative;z-index:1;max-width:900px;margin:0 auto;height:calc(100dvh - var(--top) - env(safe-area-inset-top,0px));
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px}
.hidden{display:none!important}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:900;letter-spacing:-.01em}
.logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;
  background:linear-gradient(140deg,rgba(169,139,255,.24),rgba(255,93,158,.18));border:1px solid var(--line2)}
.logo b{background:linear-gradient(95deg,var(--violet),var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 12px;
  border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);
  font:inherit;font-size:.75rem;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap}
.tb:hover{color:var(--txt);border-color:var(--line2)}
.tb.on{color:var(--green);border-color:rgba(94,240,168,.4);background:rgba(94,240,168,.1)}
.tb.danger{color:var(--red);border-color:rgba(255,95,109,.3)}
select,.inp{background:rgba(4,10,20,.4);border:1px solid var(--line2);border-radius:10px;color:var(--txt);
  font:inherit;font-size:.8rem;padding:9px 10px;outline:none;min-height:38px}
body[data-theme=light] select,body[data-theme=light] .inp{background:rgba(30,60,110,.05)}
select:focus,.inp:focus{border-color:var(--cyan)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 44px rgba(0,0,0,.3)}
.card h2{font-size:1rem;font-weight:800;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-size:.68rem;color:var(--dim);font-weight:600}
.sub{font-size:.8rem;color:var(--dim);line-height:1.6;margin-bottom:12px}

/* setup */
.players{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.pchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:700}
.pchip .del{border:none;background:none;color:var(--dim);cursor:pointer;font-size:.9rem}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .inp{flex:1;min-width:150px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 18px;
  border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);
  font:inherit;font-size:.85rem;font-weight:800;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(120deg,var(--violet),var(--pink));color:#fff;border:none;box-shadow:0 8px 22px rgba(169,139,255,.24)}
.btn.ghost:hover{border-color:var(--line2)}

/* categories */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;overflow-y:auto;flex:1;align-content:start;padding-right:3px}
.cat{position:relative;border-radius:17px;padding:14px;cursor:pointer;text-align:left;border:1px solid var(--line);
  background:linear-gradient(140deg,rgba(255,255,255,.05),rgba(255,255,255,.02));color:var(--txt);
  font:inherit;transition:transform .18s,border-color .18s;overflow:hidden;min-height:100px}
.cat:hover{transform:translateY(-3px);border-color:var(--line2)}
.cat::after{content:'';position:absolute;inset:auto -30px -60px auto;width:110px;height:110px;border-radius:50%;
  background:var(--cc);opacity:.14;filter:blur(18px)}
.cat .ico{font-size:1.7rem;display:block;margin-bottom:7px}
.cat b{display:block;font-size:.9rem;font-weight:800}
.cat small{display:block;font-size:.66rem;color:var(--dim);margin-top:3px}

/* game */
.game{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0}
.ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gtitle{font-size:1.05rem;font-weight:900}
.timer{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--gold);font-weight:700}
.stage{position:relative;flex:1;min-height:180px;border-radius:22px;overflow:hidden;
  background:linear-gradient(145deg,rgba(169,139,255,.16),rgba(77,232,255,.07));
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}
.stage::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.09),transparent 60%);pointer-events:none}
.chal{position:relative;font-size:clamp(1.05rem,3.6vw,1.6rem);font-weight:800;line-height:1.45;max-width:640px}
.chal .meta{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.lvl{font-size:.6rem;font-weight:900;letter-spacing:.1em;padding:4px 9px;border-radius:99px;text-transform:uppercase}
.lvl1{background:rgba(94,240,168,.15);color:var(--green)}
.lvl2{background:rgba(255,209,102,.15);color:var(--gold)}
.lvl3{background:rgba(255,95,109,.15);color:var(--red)}
.card-in{animation:cin .35s cubic-bezier(.22,1,.36,1)}
@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.card-out-l{animation:col .25s ease forwards}
.card-out-r{animation:cor .25s ease forwards}
@keyframes col{to{opacity:0;transform:translateX(-45%) rotate(-8deg)}}
@keyframes cor{to{opacity:0;transform:translateX(45%) rotate(8deg)}}
.confetti{position:absolute;width:9px;height:12px;top:-20px;pointer-events:none;animation:cf 1.1s ease-in forwards;z-index:5}
@keyframes cf{to{transform:translateY(420px) rotate(720deg);opacity:0}}
.stage.shake{animation:shk .4s ease}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.players-bar{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.players-bar::-webkit-scrollbar{display:none}
.pbtn{flex:none;display:flex;align-items:center;gap:7px;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);padding:8px 11px;cursor:pointer;color:var(--txt);font:inherit;font-size:.76rem;font-weight:700}
.pbtn:hover{border-color:var(--cyan)}
.pbtn b{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:.9rem}
.dots{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:3px 0}
.dots::-webkit-scrollbar{display:none}
.dot{width:6px;height:6px;min-width:6px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:.2s}
.dot.on{background:var(--pink);width:18px;min-width:18px;border-radius:4px}
.ctrls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.foot{text-align:center;font-size:.66rem;color:var(--dim);opacity:.75}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(12px);
  z-index:100;background:var(--panel2);border:1px solid var(--line2);border-radius:30px;padding:11px 18px;
  font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){.catgrid{grid-template-columns:1fr 1fr}.logo span{display:none}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="shell">
  <div class="top">
    <div class="logo"><i>🍹</i><b>DRINKING GAME</b></div>
    <div class="spacer"></div>
    <button class="tb" id="safeBtn" title="Safe mode">🛡️ Safe</button>
    <button class="tb" id="themeBtn" title="Tema">🌙</button>
    <select id="langSel" aria-label="Lingua"><option value="it">🇮🇹</option><option value="en">🇬🇧</option></select>
  </div>

  <!-- SETUP -->
  <section id="setupView" class="card">
    <h2 id="setupTitle">🍺 Setup</h2>
    <p class="sub" id="setupSub">Aggiungi i giocatori. Poi scegli una categoria e inizia a bere in modo responsabile.</p>
    <div class="players" id="players"></div>
    <div class="addrow"><input class="inp" id="newPlayer" placeholder="Nome giocatore" maxlength="18">
      <button class="btn" id="addPlayer">＋</button><button class="btn pri" id="startBtn">Inizia →</button></div>
  </section>

  <!-- CATEGORIE -->
  <section id="catView" class="hidden" style="display:flex;flex-direction:column;gap:10px;min-height:0;flex:1">
    <div class="card" style="padding:12px 16px"><h2 id="catTitle">🎲 Scegli una categoria <small id="catCount"></small></h2>
      <div class="sub" id="catSub">Modalità Safe: le sfide più audaci vengono nascoste.</div></div>
    <div class="catgrid" id="catGrid"></div>
  </section>

  <!-- GIOCO -->
  <section id="gameView" class="game hidden">
    <div class="ghead"><button class="tb" id="backBtn">←</button><span class="gtitle" id="gTitle"></span>
      <span class="spacer"></span><span class="timer" id="timer">05:00</span>
      <button class="tb" id="timerBtn">⏱</button></div>
    <div class="stage" id="stage"><div class="chal" id="chal"></div></div>
    <div class="dots" id="dots"></div>
    <div class="players-bar" id="playersBar"></div>
    <div class="ctrls">
      <button class="btn ghost" id="prevBtn">←</button>
      <button class="btn pri" id="nextBtn">Succ →</button>
      <button class="btn ghost" id="randBtn">🎲 Random</button>
      <button class="btn ghost" id="favBtn">☆</button>
      <button class="btn ghost" id="shuffleBtn">🔀</button>
      <button class="btn ghost" id="undoBtn">↶</button>
    </div>
    <div class="foot" id="foot">Space=avanti · ←/→=naviga · R=random · F=preferiti · U=undo</div>
  </section>
</div>
<div id="toast" role="status"></div>

const CAT_META={
  party:{icon:'🎉',color:'#ff5d9e'},bar:{icon:'🍺',color:'#4de8ff'},hot:{icon:'🔥',color:'#ff8a5c'},
  sexy:{icon:'😈',color:'#a98bff'},madness:{icon:'🤪',color:'#ffd166'},chaos:{icon:'🌀',color:'#ff5f6d'},
  movie:{icon:'🎬',color:'#8fa3ff'},music:{icon:'🎵',color:'#5ef0a8'},food:{icon:'🍕',color:'#ffb347'},
  travel:{icon:'✈️',color:'#64d2ff'},memes:{icon:'🤡',color:'#c58bff'},stem:{icon:'🔬',color:'#5ef0a8'}
};
const L={it:{setup:'🍺 Setup',setupSub:'Aggiungi i giocatori, poi scegli una categoria. Bevi in modo responsabile.',
  add:'Nome giocatore',start:'Inizia →',cat:'Scegli una categoria',catSub:'Tocca una categoria per iniziare.',
  safeOn:'Safe: attiva',safeOff:'Safe',challenge:'Sfida',fav:'Preferiti',prev:'←',next:'Succ →',
  random:'🎲 Random',shuffle:'🔀',undo:'↶',foot:'Space=avanti · ←/→=naviga · R=random · F=preferiti · U=undo',
  done:'Fatto!',added:'Giocatore aggiunto',removed:'Rimosso',need:'Serve almeno un giocatore',
  favAdded:'Aggiunto ai preferiti',favRemoved:'Rimosso dai preferiti',shuffled:'Sfide mescolate',
  undone:'Annullato',noUndo:'Niente da annullare',safeHintSafe:'Le sfide audaci sono nascoste',
  safeHintAll:'Tutte le sfide visibili'},
 en:{setup:'🍺 Setup',setupSub:'Add players, then pick a category. Drink responsibly.',
  add:'Player name',start:'Start →',cat:'Pick a category',catSub:'Tap a category to begin.',
  safeOn:'Safe: on',safeOff:'Safe',challenge:'Challenge',fav:'Favourites',prev:'←',next:'Next →',
  random:'🎲 Random',shuffle:'🔀',undo:'↶',foot:'Space=next · ←/→=navigate · R=random · F=fav · U=undo',
  done:'Done!',added:'Player added',removed:'Removed',need:'Add at least one player',
  favAdded:'Added to favourites',favRemoved:'Removed from favourites',shuffled:'Challenges shuffled',
  undone:'Undone',noUndo:'Nothing to undo',safeHintSafe:'Bold challenges hidden',
  safeHintAll:'All challenges visible'}};
const KEY='drinking-game-v2';
let S={players:[],cat:null,index:0,order:{},safe:false,lang:'it',theme:'dark',favs:[],history:[],timerOn:false,seconds:300};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function t(k){return (L[S.lang]||L.it)[k]||k}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast._t);
  toast._t=setTimeout(()=>e.classList.remove('on'),1900)}
function beep(f=520,d=.07){if(S.theme==='silent')return;try{const ac=new(window.AudioContext||window.webkitAudioContext)(),
  o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}}
function buzz(ms=40){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function confetti(n=22){const st=$('stage');const cols=['#ff5d9e','#a98bff','#4de8ff','#ffd166','#5ef0a8'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti';
    d.style.background=cols[i%cols.length];d.style.left=(Math.random()*100)+'%';
    d.style.animationDelay=(Math.random()*.25)+'s';st.appendChild(d);
    setTimeout(()=>d.remove(),1400)}}

/* ------------- viste ------------- */
function show(v){['setupView','catView','gameView'].forEach(id=>$(id).classList.toggle('hidden',id!==v))}
function renderSetup(){const box=$('players');box.innerHTML='';
  S.players.forEach((p,i)=>{const c=document.createElement('div');c.className='pchip';
    c.innerHTML='<span>'+escapeHtml(p.name)+'</span><span class="del">✕</span>';
    c.querySelector('.del').onclick=()=>{S.players.splice(i,1);save();renderSetup()};box.appendChild(c)});
  $('setupTitle').textContent=t('setup');$('setupSub').textContent=t('setupSub');
  $('newPlayer').placeholder=t('add');$('startBtn').textContent=t('start')}
function renderCats(){const g=$('catGrid');g.innerHTML='';
  Object.keys(DATA).forEach(k=>{const m=CAT_META[k],list=visible(k);
    const b=document.createElement('button');b.className='cat';b.style.setProperty('--cc',m.color);
    b.innerHTML='<span class="ico">'+m.icon+'</span><b>'+k.toUpperCase()+'</b><small>'+list.length+' '+t('challenge').toLowerCase()+'</small>';
    b.onclick=()=>openCat(k);g.appendChild(b)});
  $('catTitle').firstChild.textContent=t('cat')+' ';
  $('catCount').textContent=Object.keys(DATA).length;
  $('catSub').textContent=S.safe?t('safeHintSafe'):t('safeHintAll')}
function visible(k){return DATA[k].map((c,i)=>({c,i})).filter(x=>!S.safe||x.c.s)}
function currentList(){return S.cat?visible(S.cat):[]}
function orderFor(k){if(!S.order[k]||S.order[k].length!==DATA[k].length)
  S.order[k]=DATA[k].map((_,i)=>i);return S.order[k]}
function renderGame(){if(!S.cat)return;const list=currentList();if(!list.length)return;
  orderFor(S.cat);
  const l=list.map(x=>x.i);
  if(l.indexOf(S.index)<0)S.index=l[0];
  const pos=l.indexOf(S.index);
  const ch=DATA[S.cat][S.index];
  $('gTitle').textContent=CAT_META[S.cat].icon+' '+S.cat.toUpperCase();
  const el=$('chal');el.className='chal card-in';
  el.innerHTML='<div class="meta"><span class="lvl lvl'+ch.i+'">'+['','🟢','🟡','🔴'][ch.i]+'</span>'+
    (S.favs.includes(S.cat+':'+S.index)?'<span class="lvl lvl2">☆</span>':'')+'</div>'+
    escapeHtml(ch[S.lang]||ch.it);
  $('favBtn').textContent=S.favs.includes(S.cat+':'+S.index)?'★':'\u2606';
  const dots=$('dots');dots.innerHTML='';
  l.forEach((idx,j)=>{const d=document.createElement('div');d.className='dot'+(j===pos?' on':'');
    d.onclick=()=>{S.index=idx;save();renderGame()};dots.appendChild(d)});
  const pb=$('playersBar');pb.innerHTML='';
  S.players.forEach((p,i)=>{const b=document.createElement('button');b.className='pbtn';
    b.innerHTML='<span>'+escapeHtml(p.name)+'</span><b>'+(p.drinks||0)+'</b>';
    b.onclick=()=>{p.drinks=(p.drinks||0)+1;save();renderGame();beep(700);buzz()};pb.appendChild(b)});
  $('timer').textContent=fmtTime(S.seconds)}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ------------- azioni ------------- */
function openCat(k){S.cat=k;const ord=orderFor(k);
  const list=visible(k).map(x=>x.i);S.index=list.length?list[0]:ord[0];
  S.history=[];save();show('gameView');renderGame();beep(620);confetti(14)}
function go(dir){const list=currentList();if(!list.length)return;
  const ord=orderFor(S.cat);let pos=ord.indexOf(S.index);
  const l=list.map(x=>x.i);let p=l.indexOf(S.index);
  p=(p+dir+l.length)%l.length;S.index=l[p];save();renderGame();beep(560);buzz(20)}
function step(dir){const el=$('chal');el.className='chal '+(dir>0?'card-out-l':'card-out-r');
  setTimeout(()=>go(dir),180)}
function randomChallenge(){const l=currentList();if(!l.length)return;
  S.history.push(S.index);S.index=l[Math.floor(Math.random()*l.length)].i;
  save();renderGame();beep(880);buzz(35);confetti(10)}
function toggleFav(){const key=S.cat+':'+S.index,i=S.favs.indexOf(key);
  if(i>=0){S.favs.splice(i,1);toast(t('favRemoved'))}else{S.favs.push(key);toast(t('favAdded'))}
  save();renderGame();beep(i>=0?420:760)}
function shuffle(){const ord=orderFor(S.cat);for(let i=ord.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}
  S.index=ord[0];save();renderGame();toast(t('shuffled'));confetti(16)}
function undo(){if(!S.history.length){toast(t('noUndo'));return}
  S.index=S.history.pop();save();renderGame();beep(480);toast(t('undone'))}
function back(){S.cat=null;S.index=0;save();show('catView');renderCats()}

/* ------------- eventi ------------- */
$('addPlayer').onclick=()=>{const v=$('newPlayer').value.trim();if(!v)return;
  S.players.push({name:v.slice(0,18),drinks:0});$('newPlayer').value='';save();renderSetup();toast(t('added'))};
$('newPlayer').onkeydown=e=>{if(e.key==='Enter')$('addPlayer').click()};
$('startBtn').onclick=()=>{if(!S.players.length){toast(t('need'));return}show('catView');renderCats()};
$('backBtn').onclick=back;
$('nextBtn').onclick=()=>step(1);$('prevBtn').onclick=()=>step(-1);
$('randBtn').onclick=randomChallenge;$('favBtn').onclick=toggleFav;
$('shuffleBtn').onclick=shuffle;$('undoBtn').onclick=undo;
$('safeBtn').onclick=()=>{S.safe=!S.safe;$('safeBtn').classList.toggle('on',S.safe);
  $('safeBtn').textContent=S.safe?t('safeOn'):t('safeOff');save();renderCats();
  if(S.cat)renderGame();toast(S.safe?t('safeHintSafe'):t('safeHintAll'))};
$('themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';
  document.body.dataset.theme=S.theme;$('themeBtn').textContent=S.theme==='dark'?'🌙':'☀️';save()};
$('langSel').onchange=e=>{S.lang=e.target.value;save();renderSetup();renderCats();renderGame()};
$('timerBtn').onclick=()=>{S.timerOn=!S.timerOn;$('timerBtn').classList.toggle('on',S.timerOn);
  if(!S.timerOn)S.seconds=300;save()};
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(S.cat){if(e.code==='Space'){e.preventDefault();step(1)}
    if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);
    if(e.key.toLowerCase()==='r')randomChallenge();if(e.key.toLowerCase()==='f')toggleFav();
    if(e.key.toLowerCase()==='u')undo();if(e.key==='Escape')back()}});
setInterval(()=>{if(S.timerOn&&S.cat){S.seconds--;if(S.seconds<=0){S.seconds=300;
  beep(1000,.2);confetti(24);toast(t('done'))}$('timer').textContent=fmtTime(S.seconds)}},1000);
let tsx=0;
$('stage').addEventListener('pointerdown',e=>{tsx=e.clientX});
$('stage').addEventListener('pointerup',e=>{const d=tsx-e.clientX;if(Math.abs(d)>50)step(d>0?1:-1)});

/* init */
document.body.dataset.theme=S.theme;$('themeBtn').textContent=S.theme==='dark'?'🌙':'☀️';
$('langSel').value=S.lang;$('safeBtn').classList.toggle('on',S.safe);
$('safeBtn').textContent=S.safe?t('safeOn'):t('safeOff');
renderSetup();renderCats();show(S.players.length?'catView':'setupView');
window.__dg={S:DATA,state:S,openCat,randomChallenge,shuffle,toggleFav,undo,back,visible};
})();
</script>
