<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agente Zero</title>
<meta name="description" content="Agente Zero: tira a canestro scorrendo il dito. Numero 0, maglia rossa e bianca. Carriera in sei posti, 60 secondi, gara da tre, Z-E-R-O, sfida del giorno e la modalità satirica 18+ Bomba Zero. PWA offline, italiano e inglese.">
<meta name="theme-color" content="#14101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agente Zero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../_kit/a11y.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <canvas id="court" role="img" tabindex="0"></canvas>

  <header id="hud" hidden>
    <div class="hud-top">
      <span id="hud-mode"></span>
      <button id="btn-pause" type="button">❚❚</button>
    </div>
    <div id="hud-stats"></div>
    <div id="hud-chips"></div>
  </header>

  <div id="flash" role="status" hidden></div>
  <p id="bubble" aria-live="polite" hidden></p>
  <div id="aim" aria-hidden="true" hidden>▲</div>
  <div id="meter" aria-hidden="true" hidden><i class="zone"></i><i class="needle"></i></div>
  <p id="hint" hidden></p>
  <div id="spots" hidden></div>

  <section id="screen" hidden></section>
</main>
<noscript><p style="color:#fff;padding:24px">Agente Zero richiede JavaScript. / Agente Zero needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
