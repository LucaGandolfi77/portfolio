<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="60%" stop-color="#10212e"/>
      <stop offset="100%" stop-color="#0b151e"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#d84716"/>
    </linearGradient>
    <radialGradient id="visor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="70%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#006d8f"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Glowing Holo-Visor ring -->
  <circle cx="64" cy="64" r="49.2" fill="none" stroke="#48e5ff" stroke-width="2.8" stroke-dasharray="7.7 3.8" opacity="0.65"/>
  <!-- Top 2 brick connector pips -->
  <rect x="38.9" y="37.3" width="16.8" height="10.7" rx="3.2" fill="#ff9f5a" stroke="#9e2f0a" stroke-width="1.8"/>
  <rect x="72.4" y="37.3" width="16.8" height="10.7" rx="3.2" fill="#ff9f5a" stroke="#9e2f0a" stroke-width="1.8"/>
  <!-- Main orange snap-block body -->
  <rect x="29.1" y="45.0" width="69.8" height="44.4" rx="5.8" fill="url(#brick)" stroke="#8c2706" stroke-width="2.3"/>
  <!-- Gloss highlight -->
  <rect x="34.0" y="48.5" width="60.1" height="7.1" rx="2.6" fill="#ffffff" opacity="0.26"/>
  <!-- Synth-Beast glowing cyclops optic -->
  <circle cx="64" cy="69.8" r="12.0" fill="#0e1a24" stroke="#ffd166" stroke-width="2.0"/>
  <circle cx="64" cy="69.8" r="7.1" fill="url(#visor)"/>
</svg>