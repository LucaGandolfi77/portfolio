<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0f1923">
	<title>Aviator Clone</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #0f1923;
			--panel: #1a2733;
			--line: #2c3e50;
			--green: #2ecc71;
			--orange: #e67e22;
			--red: #e74c3c;
			--dim: #bdc3c7;
		}
		body {
			margin: 0;
			background: var(--bg);
			color: white;
			font-family: 'Inter', sans-serif;
			display: flex;
			flex-direction: column;
			height: 100vh;
			height: 100dvh;
			overflow: hidden;
			overscroll-behavior: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-touch-callout: none;
			user-select: none;
			-webkit-user-select: none;
		}
		.header {
			padding: 10px 16px;
			padding-top: max(10px, env(safe-area-inset-top));
			background: var(--panel);
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 10px;
			border-bottom: 1px solid var(--line);
		}
		.balance {
			font-size: 1.05rem;
			font-weight: bold;
			color: var(--green);
			white-space: nowrap;
		}
		.sound-btn {
			background: none;
			border: 1px solid var(--line);
			border-radius: 8px;
			width: 38px;
			height: 38px;
			min-width: 38px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--dim);
			cursor: pointer;
			touch-action: manipulation;
		}
		.sound-btn:active { background: var(--line); }
		.sound-btn svg { width: 20px; height: 20px; fill: currentColor; }
		.sound-btn .slash { display: none; }
		.sound-btn.muted .wave { display: none; }
		.sound-btn.muted .slash { display: block; }
		.game-area {
			flex: 1;
			position: relative;
			background: var(--bg);
			overflow: hidden;
			touch-action: none;
		}
		canvas { display: block; width: 100%; height: 100%; }
		.multiplier-display {
			position: absolute;
			top: 38%;
			left: 50%;
			transform: translate(-50%, -50%);
			font-size: clamp(2.8rem, 13vw, 5.2rem);
			font-weight: 800;
			color: white;
			text-shadow: 0 0 20px rgba(0,0,0,0.5);
			pointer-events: none;
			z-index: 2;
		}
		.multiplier-display.pulse { animation: mpulse 0.7s ease-in-out infinite; }
		@keyframes mpulse {
			0%, 100% { transform: translate(-50%, -50%) scale(1); }
			50% { transform: translate(-50%, -50%) scale(1.07); }
		}
		.crashed { color: var(--red); }
		.controls {
			padding: 14px 16px;
			padding-bottom: max(14px, env(safe-area-inset-bottom));
			background: var(--panel);
			display: flex;
			gap: 18px;
			align-items: center;
			justify-content: center;
			border-top: 1px solid var(--line);
		}
		.bet-box {
			display: flex;
			flex-direction: column;
			gap: 6px;
			width: 220px;
		}
		.bet-box label { font-size: 0.78rem; color: var(--dim); }
		.bet-input {
			background: var(--bg);
			border: 1px solid var(--line);
			color: white;
			padding: 9px 10px;
			border-radius: 6px;
			font-size: 17px;
			font-family: inherit;
			width: 100%;
			box-sizing: border-box;
			text-align: center;
			user-select: text;
			-webkit-user-select: text;
			touch-action: manipulation;
		}
		.chips {
			display: grid;
			grid-template-columns: repeat(6, 1fr);
			gap: 4px;
		}
		.chip {
			background: var(--bg);
			border: 1px solid var(--line);
			color: white;
			padding: 7px 0;
			font-size: 0.82rem;
			font-family: inherit;
			font-weight: 600;
			border-radius: 5px;
			cursor: pointer;
			touch-action: manipulation;
		}
		.chip:active { background: var(--line); }
		.btn {
			padding: 15px 36px;
			border: none;
			border-radius: 8px;
			font-size: 1.15rem;
			font-family: inherit;
			font-weight: bold;
			cursor: pointer;
			text-transform: uppercase;
			transition: transform 0.1s, filter 0.15s;
			min-width: 200px;
			touch-action: manipulation;
		}
		.btn:active { transform: scale(0.97); filter: brightness(1.1); }
		.btn-bet { background: var(--green); color: #0f1923; }
		.btn-cashout { background: var(--orange); color: white; }
		.btn-waiting { background: #95a5a6; color: #2c3e50; cursor: not-allowed; }
		.history {
			height: 38px;
			background: #0a1016;
			display: flex;
			align-items: center;
			padding: 0 10px;
			gap: 8px;
			overflow-x: auto;
			scrollbar-width: none;
		}
		.history::-webkit-scrollbar { display: none; }
		.history-item {
			padding: 2px 8px;
			border-radius: 10px;
			font-size: 0.78rem;
			background: var(--line);
			color: var(--dim);
			white-space: nowrap;
		}
		.history-item.high { color: #9b59b6; border: 1px solid #9b59b6; background: rgba(155,89,182,0.1); }
		.history-item.medium { color: #3498db; border: 1px solid #3498db; background: rgba(52,152,219,0.1); }
		.history-item.low { color: #95a5a6; }
		.back-btn {
			color: var(--dim);
			text-decoration: none;
			font-weight: 600;
			display: flex;
			align-items: center;
			gap: 5px;
			touch-action: manipulation;
		}
		.toast {
			position: absolute;
			left: 50%;
			bottom: 20px;
			transform: translate(-50%, 10px);
			background: rgba(231,76,60,0.95);
			padding: 10px 18px;
			border-radius: 8px;
			font-weight: 600;
			font-size: 0.95rem;
			opacity: 0;
			transition: opacity 0.25s, transform 0.25s;
			pointer-events: none;
			z-index: 5;
		}
		.toast.show { opacity: 1; transform: translate(-50%, 0); }
		.win-toast {
			position: absolute;
			top: 55%;
			left: 50%;
			color: var(--green);
			font-weight: 800;
			font-size: 2rem;
			text-shadow: 0 0 18px rgba(46,204,113,0.6);
			pointer-events: none;
			animation: winUp 1.4s ease-out forwards;
			z-index: 4;
		}
		@keyframes winUp {
			0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
			20% { opacity: 1; }
			100% { opacity: 0; transform: translate(-50%, -140%) scale(1.15); }
		}
		@media (max-width: 540px) {
			.controls { flex-direction: column; gap: 12px; }
			.btn { min-width: 0; width: 100%; max-width: 340px; }
			.bet-box { width: 100%; max-width: 340px; }
		}
	</style>
</head>
<body>
	<div class="header">
		<a href="../index.html#games" class="back-btn">&#8592; Back</a>
		<div class="balance">Balance: $<span id="balance">1000.00</span></div>
		<button id="soundBtn" class="sound-btn" aria-label="Toggle sound">
			<svg viewBox="0 0 24 24">
				<path d="M3 9v6h4l5 5V4L7 9H3z"/>
				<path class="wave" d="M16 8a4.5 4.5 0 010 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
				<line class="slash" x1="4" y1="4" x2="21" y2="21" stroke="#e74c3c" stroke-width="2.4" stroke-linecap="round"/>
			</svg>
		</button>
	</div>

	<div class="history" id="history"></div>

	<div class="game-area">
		<canvas id="gameCanvas"></canvas>
		<div class="multiplier-display" id="multiplier">1.00x</div>
		<div class="toast" id="toast"></div>
	</div>

	<div class="controls">
		<div class="bet-box">
			<label for="betAmount">Bet Amount</label>
			<input type="number" id="betAmount" class="bet-input" value="10" min="1" step="1" inputmode="decimal">
			<div class="chips">
				<button type="button" class="chip" data-chip="-">&minus;</button>
				<button type="button" class="chip" data-chip="+">+</button>
				<button type="button" class="chip" data-chip="10">10</button>
				<button type="button" class="chip" data-chip="50">50</button>
				<button type="button" class="chip" data-chip="100">100</button>
				<button type="button" class="chip" data-chip="max">MAX</button>
			</div>
		</div>
		<button id="actionBtn" class="btn btn-bet">BET</button>
	</div>

	<script>
		(function () {
			'use strict';

			var canvas = document.getElementById('gameCanvas');
			var ctx = canvas.getContext('2d');
			var multiplierEl = document.getElementById('multiplier');
			var actionBtn = document.getElementById('actionBtn');
			var balanceEl = document.getElementById('balance');
			var betInput = document.getElementById('betAmount');
			var historyEl = document.getElementById('history');
			var toastEl = document.getElementById('toast');
			var soundBtn = document.getElementById('soundBtn');

			var width = 0, height = 0, skyGrad = null;

			var balance = 1000, currentBet = 0, multiplier = 1;
			var gameState = 'IDLE';
			var startTime = 0, crashPoint = 0, crashT = 0;
			var planeX = 0, planeY = 0;
			var trail = [], particles = [], emitAcc = 0;
			var shakeAmt = 0, flashA = 0;
			var stars = [], clouds = [];
			var muted = false;

			try {
				var saved = parseFloat(localStorage.getItem('av_balance'));
				if (!isNaN(saved) && saved >= 0) balance = saved;
				muted = localStorage.getItem('av_muted') === '1';
			} catch (e) {}

			function rnd(a, b) { return a + Math.random() * (b - a); }
			function fmt(n) { return n.toFixed(2); }

			var actx = null, engineOsc = null, engineGain = null;
			function ensureAudio() {
				try {
					if (!actx) {
						var AC = window.AudioContext || window.webkitAudioContext;
						if (!AC) return;
						actx = new AC();
					}
					if (actx.state === 'suspended') actx.resume();
				} catch (e) {}
			}
			function tone(freq, dur, type, vol, delay, freqEnd) {
				if (!actx || muted) return;
				try {
					var t0 = actx.currentTime + (delay || 0);
					var o = actx.createOscillator(), g = actx.createGain();
					o.type = type || 'sine';
					o.frequency.setValueAtTime(freq, t0);
					if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
					g.gain.setValueAtTime(vol, t0);
					g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
					o.connect(g); g.connect(actx.destination);
					o.start(t0); o.stop(t0 + dur + 0.05);
				} catch (e) {}
			}
			function startEngine() {
				stopEngine();
				if (!actx || muted) return;
				try {
					engineOsc = actx.createOscillator();
					engineGain = actx.createGain();
					var f = actx.createBiquadFilter();
					f.type = 'lowpass';
					f.frequency.value = 420;
					engineOsc.type = 'sawtooth';
					engineOsc.frequency.value = 70;
					engineGain.gain.value = 0;
					engineOsc.connect(f); f.connect(engineGain); engineGain.connect(actx.destination);
					engineOsc.start();
					engineGain.gain.linearRampToValueAtTime(0.05, actx.currentTime + 0.4);
				} catch (e) { engineOsc = null; }
			}
			function updateEngine() {
				if (!engineOsc || !actx) return;
				try {
					var fq = Math.min(70 + (multiplier - 1) * 26, 320);
					engineOsc.frequency.setTargetAtTime(fq, actx.currentTime, 0.1);
				} catch (e) {}
			}
			function stopEngine() {
				if (!engineOsc) return;
				try {
					engineGain.gain.setTargetAtTime(0.0001, actx.currentTime, 0.08);
					engineOsc.stop(actx.currentTime + 0.4);
				} catch (e) {}
				engineOsc = null; engineGain = null;
			}
			function sfxCash() { tone(660, 0.12, 'sine', 0.14, 0); tone(990, 0.2, 'sine', 0.14, 0.11); }
			function sfxCrash() { tone(180, 0.4, 'triangle', 0.3, 0, 40); tone(90, 0.5, 'sawtooth', 0.12, 0.02, 30); }
			function sfxClick() { tone(340, 0.06, 'square', 0.05); }

			function resize() {
				var ow = width, oh = height;
				var dpr = Math.min(window.devicePixelRatio || 1, 2);
				var el = canvas.parentElement;
				width = el.clientWidth;
				height = el.clientHeight;
				canvas.width = Math.max(1, Math.round(width * dpr));
				canvas.height = Math.max(1, Math.round(height * dpr));
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				skyGrad = ctx.createLinearGradient(0, 0, 0, height);
				skyGrad.addColorStop(0, '#152433');
				skyGrad.addColorStop(1, '#0a121a');
				if (ow > 0 && oh > 0 && (ow !== width || oh !== height)) {
					var rx = width / ow, ry = height / oh;
					for (var i = 0; i < trail.length; i++) {
						trail[i].ax *= rx;
						trail[i].ay *= ry;
					}
				}
				initBg();
			}

			function makeCloud(anyX) {
				var s = rnd(0.6, 1.5);
				return {
					x: anyX ? Math.random() * width : width + rnd(80, 300),
					y: rnd(height * 0.08, height * 0.55),
					v: rnd(5, 12) * s,
					a: rnd(0.04, 0.09),
					puffs: [
						{ dx: -34 * s, dy: 6 * s, r: 22 * s },
						{ dx: 0, dy: 0, r: 30 * s },
						{ dx: 32 * s, dy: 8 * s, r: 20 * s }
					]
				};
			}
			function initBg() {
				stars = [];
				clouds = [];
				var n = Math.min(90, Math.floor(width * height / 14000));
				for (var i = 0; i < n; i++) {
					stars.push({
						x: Math.random() * width,
						y: Math.random() * height * 0.85,
						s: rnd(0.8, 2.2),
						v: rnd(6, 22),
						p: Math.random() * 6.28
					});
				}
				var c = Math.max(3, Math.min(6, Math.floor(width / 220)));
				for (var j = 0; j < c; j++) clouds.push(makeCloud(true));
			}

			window.addEventListener('resize', resize);
			window.addEventListener('orientationchange', function () { setTimeout(resize, 150); });
			if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

			function planeSize() {
				return Math.max(26, Math.min(46, Math.min(width, height) * 0.085));
			}

			function drawPlane(x, y, rot, u, glow) {
				ctx.save();
				ctx.translate(x, y);
				ctx.rotate(rot);

				if (glow > 0) {
					var fg = ctx.createRadialGradient(-u * 1.15, 0, 0, -u * 1.15, 0, u * 0.55);
					fg.addColorStop(0, 'rgba(255,190,90,' + (0.85 * glow).toFixed(2) + ')');
					fg.addColorStop(1, 'rgba(255,120,40,0)');
					ctx.fillStyle = fg;
					ctx.beginPath();
					ctx.arc(-u * 1.15, 0, u * 0.55, 0, 6.29);
					ctx.fill();
				}

				ctx.fillStyle = '#b03a2e';
				ctx.beginPath();
				ctx.moveTo(-u * 0.62, -u * 0.12);
				ctx.lineTo(-u * 1.0, -u * 0.74);
				ctx.lineTo(-u * 1.16, -u * 0.68);
				ctx.lineTo(-u * 1.0, -u * 0.06);
				ctx.closePath();
				ctx.fill();

				ctx.beginPath();
				ctx.moveTo(-u * 0.66, u * 0.10);
				ctx.lineTo(-u * 0.94, u * 0.36);
				ctx.lineTo(-u * 0.76, u * 0.36);
				ctx.lineTo(-u * 0.54, u * 0.12);
				ctx.closePath();
				ctx.fill();

				var bg = ctx.createLinearGradient(0, -u * 0.35, 0, u * 0.35);
				bg.addColorStop(0, '#ff8a7a');
				bg.addColorStop(0.5, '#e74c3c');
				bg.addColorStop(1, '#b71540');
				ctx.fillStyle = bg;
				ctx.beginPath();
				ctx.moveTo(u * 1.14, -u * 0.02);
				ctx.quadraticCurveTo(u * 0.55, -u * 0.32, -u * 0.55, -u * 0.27);
				ctx.quadraticCurveTo(-u * 1.02, -u * 0.25, -u * 1.1, -u * 0.16);
				ctx.lineTo(-u * 1.1, u * 0.17);
				ctx.quadraticCurveTo(-u * 0.5, u * 0.33, u * 0.18, u * 0.25);
				ctx.quadraticCurveTo(u * 0.78, u * 0.16, u * 1.14, -u * 0.02);
				ctx.closePath();
				ctx.fill();

				var cg = ctx.createLinearGradient(u * 0.15, 0, u * 0.72, 0);
				cg.addColorStop(0, 'rgba(214,240,255,0.95)');
				cg.addColorStop(1, 'rgba(52,110,160,0.95)');
				ctx.fillStyle = cg;
				ctx.beginPath();
				ctx.ellipse(u * 0.42, -u * 0.145, u * 0.3, u * 0.115, -0.09, 0, 6.29);
				ctx.fill();
				ctx.strokeStyle = 'rgba(255,255,255,0.35)';
				ctx.lineWidth = 1;
				ctx.stroke();

				ctx.fillStyle = '#a93226';
				ctx.beginPath();
				ctx.moveTo(u * 0.3, u * 0.04);
				ctx.lineTo(-u * 0.34, u * 0.64);
				ctx.lineTo(-u * 0.64, u * 0.58);
				ctx.lineTo(-u * 0.14, u * 0.02);
				ctx.closePath();
				ctx.fill();
				ctx.strokeStyle = 'rgba(255,255,255,0.18)';
				ctx.lineWidth = 1;
				ctx.stroke();

				ctx.restore();
			}

			function spawnParticle() {
				if (particles.length > 80) return;
				var cols = ['255,209,102', '255,140,66', '255,107,94'];
				var life = rnd(0.3, 0.65);
				particles.push({
					x: planeX - planeSize() * 1.05,
					y: planeY + rnd(-2, 4),
					vx: rnd(-150, -60),
					vy: rnd(5, 45),
					life: life,
					m: life,
					s: rnd(1.5, 3.5),
					c: cols[(Math.random() * cols.length) | 0]
				});
			}

			function updateMulColor() {
				var c;
				var pulse = false;
				if (multiplier >= 5) { c = '#e74c3c'; pulse = true; }
				else if (multiplier >= 2) c = '#e67e22';
				else c = '#2ecc71';
				if (multiplierEl.dataset.c !== c) {
					multiplierEl.style.color = c;
					multiplierEl.style.textShadow = '0 0 26px ' + c + '66';
					multiplierEl.dataset.c = c;
				}
				multiplierEl.classList.toggle('pulse', pulse);
			}

			function update(dt, now) {
				var i, p;
				for (i = 0; i < stars.length; i++) {
					var s = stars[i];
					s.x -= s.v * dt;
					if (s.x < -3) { s.x = width + 3; s.y = Math.random() * height * 0.85; }
				}
				for (i = 0; i < clouds.length; i++) {
					var cl = clouds[i];
					cl.x -= cl.v * dt;
					if (cl.x < -160) clouds[i] = makeCloud(false);
				}
				shakeAmt *= Math.pow(0.001, dt);
				if (shakeAmt < 0.1) shakeAmt = 0;
				flashA = Math.max(0, flashA - dt * 1.4);
				for (i = particles.length - 1; i >= 0; i--) {
					p = particles[i];
					p.x += p.vx * dt;
					p.y += p.vy * dt;
					p.vy += 70 * dt;
					p.life -= dt;
					if (p.life <= 0) particles.splice(i, 1);
				}

				if (gameState === 'FLYING') {
					var e = (now - startTime) / 1000;
					multiplier = 1 + 0.1 * e * e + 0.1 * e;
					if (multiplier >= crashPoint) {
						doCrash();
						return;
					}
					multiplierEl.textContent = multiplier.toFixed(2) + 'x';
					updateMulColor();
					updateEngine();

					var pr = Math.min(e / 6, 1);
					var u = planeSize();
					var pad = u * 1.6;
					planeX = pad + (width * 0.68 - pad) * pr;
					planeY = height - pad - (height - pad * 2.4) * Math.pow(pr, 0.55);

					emitAcc += dt;
					while (emitAcc > 0.028) {
						emitAcc -= 0.028;
						spawnParticle();
					}
					var lt = trail[trail.length - 1];
					if (!lt || Math.abs(planeX - lt.ax) > 4 || Math.abs(planeY - lt.ay) > 4) {
						trail.push({ ax: planeX, ay: planeY });
						if (trail.length > 700) trail.shift();
					}
				} else if (gameState === 'CRASHED') {
					crashT += dt;
					var sp = 260 + crashT * 1500;
					var a = -0.38;
					planeX += Math.cos(a) * sp * dt;
					planeY += Math.sin(a) * sp * dt;
				}
			}

			function draw(now) {
				ctx.clearRect(0, 0, width, height);
				ctx.save();
				if (shakeAmt > 0) ctx.translate(rnd(-1, 1) * shakeAmt, rnd(-1, 1) * shakeAmt);

				ctx.fillStyle = skyGrad;
				ctx.fillRect(-20, -20, width + 40, height + 40);

				ctx.fillStyle = '#9fb3c8';
				for (var i = 0; i < stars.length; i++) {
					var st = stars[i];
					ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now / 500 + st.p);
					ctx.fillRect(st.x, st.y, st.s, st.s);
				}
				ctx.globalAlpha = 1;

				ctx.fillStyle = '#78909c';
				for (var j = 0; j < clouds.length; j++) {
					var cl = clouds[j];
					ctx.globalAlpha = cl.a;
					for (var k = 0; k < cl.puffs.length; k++) {
						var q = cl.puffs[k];
						ctx.beginPath();
						ctx.arc(cl.x + q.dx, cl.y + q.dy, q.r, 0, 6.29);
						ctx.fill();
					}
				}
				ctx.globalAlpha = 1;

				ctx.strokeStyle = 'rgba(44,62,80,0.55)';
				ctx.lineWidth = 1;
				ctx.beginPath();
				var off = (now * 0.035) % 50;
				for (var gx = -off; gx < width; gx += 50) { ctx.moveTo(gx, 0); ctx.lineTo(gx, height); }
				for (var gy = 0; gy < height; gy += 50) { ctx.moveTo(0, gy); ctx.lineTo(width, gy); }
				ctx.stroke();

				if ((gameState === 'FLYING' || gameState === 'CRASHED') && trail.length > 1) {
					ctx.beginPath();
					ctx.moveTo(trail[0].ax, trail[0].ay);
					for (var t = 1; t < trail.length; t++) ctx.lineTo(trail[t].ax, trail[t].ay);
					ctx.lineTo(planeX, height);
					ctx.lineTo(trail[0].ax, height);
					ctx.closePath();
					var fg2 = ctx.createLinearGradient(0, height * 0.2, 0, height);
					fg2.addColorStop(0, 'rgba(231,76,60,0.28)');
					fg2.addColorStop(1, 'rgba(231,76,60,0.02)');
					ctx.fillStyle = fg2;
					ctx.fill();

					ctx.beginPath();
					ctx.moveTo(trail[0].ax, trail[0].ay);
					for (t = 1; t < trail.length; t++) ctx.lineTo(trail[t].ax, trail[t].ay);
					var tg = ctx.createLinearGradient(trail[0].ax, 0, planeX, 0);
					tg.addColorStop(0, 'rgba(231,76,60,0.25)');
					tg.addColorStop(1, '#ff6b5e');
					ctx.strokeStyle = tg;
					ctx.lineJoin = 'round';
					ctx.lineWidth = 7;
					ctx.globalAlpha = 0.25;
					ctx.stroke();
					ctx.lineWidth = 3;
					ctx.globalAlpha = 1;
					ctx.stroke();
				}

				var p;
				for (i = 0; i < particles.length; i++) {
					p = particles[i];
					var r = Math.max(0, p.life / p.m);
					ctx.globalAlpha = r;
					ctx.fillStyle = 'rgba(' + p.c + ',0.9)';
					ctx.beginPath();
					ctx.arc(p.x, p.y, p.s * Math.max(0.3, r), 0, 6.29);
					ctx.fill();
				}
				ctx.globalAlpha = 1;

				var u = planeSize();
				if (gameState === 'FLYING') {
					var pr = Math.min((now - startTime) / 6000, 1);
					var bobAmp = pr < 1 ? 3.5 : 6;
					var bobSpd = pr < 1 ? 260 : 480;
					var bob = Math.sin(now / bobSpd) * bobAmp;
					var rot = -(0.34 * (1 - pr)) - 0.06 + Math.sin(now / 300) * 0.04;
					drawPlane(planeX, planeY + bob, rot, u, 0.7 + 0.3 * Math.sin(now / 40));
				} else if (gameState === 'CRASHED' && crashT < 1.4) {
					drawPlane(planeX, planeY, -0.38 + Math.sin(now / 90) * 0.08, u, 1);
				} else if (gameState === 'IDLE' || gameState === 'BETTING') {
					var pad = u * 1.6;
					drawPlane(pad, height - pad + Math.sin(now / 600) * 5, -0.06 + Math.sin(now / 900) * 0.03, u, 0.5 + 0.25 * Math.sin(now / 300));
				}

				ctx.restore();

				if (flashA > 0) {
					ctx.fillStyle = 'rgba(231,76,60,' + flashA.toFixed(3) + ')';
					ctx.fillRect(0, 0, width, height);
				}
			}

			var lastT = performance.now();
			function frame(now) {
				var dt = Math.min((now - lastT) / 1000, 0.05);
				lastT = now;
				update(dt, now);
				draw(now);
				requestAnimationFrame(frame);
			}

			function setBtn(text, cls, dis) {
				actionBtn.textContent = text;
				actionBtn.className = cls;
				actionBtn.disabled = dis;
			}
			function showToast(msg) {
				toastEl.textContent = msg;
				toastEl.classList.add('show');
				clearTimeout(showToast.t);
				showToast.t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
			}
			function saveBalance() {
				try { localStorage.setItem('av_balance', String(balance)); } catch (e) {}
			}
			function updateBalance() {
				balanceEl.textContent = fmt(balance);
				saveBalance();
			}
			function addHistory(val) {
				var div = document.createElement('div');
				div.className = 'history-item';
				div.textContent = val.toFixed(2) + 'x';
				if (val >= 10) div.classList.add('high');
				else if (val >= 2) div.classList.add('medium');
				else div.classList.add('low');
				historyEl.prepend(div);
				while (historyEl.children.length > 20) historyEl.lastChild.remove();
			}

			function getBet() {
				var b = Math.floor(parseFloat(betInput.value));
				if (isNaN(b) || b < 1) { showToast('Enter a valid bet'); return 0; }
				if (b > balance) { showToast('Insufficient funds'); return 0; }
				return b;
			}

			function startGame() {
				ensureAudio();
				var b = getBet();
				if (!b) return;
				balance -= b;
				currentBet = b;
				updateBalance();
				startRound();
			}

			function startRound() {
				gameState = 'FLYING';
				startTime = performance.now();
				multiplier = 1;
				crashT = 0;
				trail = [];
				particles = [];
				emitAcc = 0;
				shakeAmt = 0;
				flashA = 0;
				var u = planeSize();
				var pad = u * 1.6;
				planeX = pad;
				planeY = height - pad;
				trail.push({ ax: planeX, ay: planeY });

				var r = Math.random();
				crashPoint = Math.max(1, Math.floor(100 / (1 - r)) / 100);

				multiplierEl.classList.remove('crashed');
				multiplierEl.dataset.c = '';
				multiplierEl.textContent = '1.00x';
				updateMulColor();
				setBtn('CASH OUT', 'btn btn-cashout', false);
				actionBtn.onclick = cashOut;
				startEngine();
			}

			function cashOut() {
				if (gameState !== 'FLYING') return;
				var win = currentBet * multiplier;
				balance += win;
				currentBet = 0;
				updateBalance();
				setBtn('WON $' + fmt(win), 'btn btn-waiting', true);
				sfxCash();
				var w = document.createElement('div');
				w.className = 'win-toast';
				w.textContent = '+$' + fmt(win);
				document.querySelector('.game-area').appendChild(w);
				setTimeout(function () { w.remove(); }, 1400);
			}

			function doCrash() {
				gameState = 'CRASHED';
				crashT = 0;
				multiplier = crashPoint;
				multiplierEl.textContent = 'FLEW AWAY! ' + fmt(crashPoint) + 'x';
				multiplierEl.classList.add('crashed');
				multiplierEl.classList.remove('pulse');
				addHistory(crashPoint);
				shakeAmt = Math.min(14, width * 0.02);
				flashA = 0.4;
				stopEngine();
				sfxCrash();
				setBtn(currentBet > 0 ? 'LOST' : actionBtn.textContent, 'btn btn-waiting', true);
				currentBet = 0;
				setTimeout(resetUI, 1400);
			}

			function resetUI() {
				gameState = 'IDLE';
				trail = [];
				particles = [];
				shakeAmt = 0;
				flashA = 0;
				multiplierEl.textContent = '1.00x';
				multiplierEl.classList.remove('crashed', 'pulse');
				multiplierEl.dataset.c = '';
				multiplierEl.style.color = '';
				multiplierEl.style.textShadow = '';
				setBtn('BET', 'btn btn-bet', false);
				actionBtn.onclick = startGame;
			}

			Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (ch) {
				ch.addEventListener('click', function () {
					ensureAudio();
					sfxClick();
					var v = ch.dataset.chip;
					var cur = Math.floor(parseFloat(betInput.value)) || 0;
					if (v === 'max') cur = Math.max(1, Math.floor(balance));
					else if (v === '+') cur = cur + 10;
					else if (v === '-') cur = Math.max(1, cur - 10);
					else cur = parseInt(v, 10);
					betInput.value = cur;
				});
			});

			soundBtn.addEventListener('click', function () {
				muted = !muted;
				try { localStorage.setItem('av_muted', muted ? '1' : '0'); } catch (e) {}
				soundBtn.classList.toggle('muted', muted);
				if (!muted) { ensureAudio(); sfxClick(); }
				else stopEngine();
			});

			document.addEventListener('pointerdown', ensureAudio, { once: true });

			soundBtn.classList.toggle('muted', muted);
			resize();
			updateBalance();
			actionBtn.onclick = startGame;
			requestAnimationFrame(frame);
		})();
	</script>
</body>
</html>
