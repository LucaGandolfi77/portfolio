<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aviator Clone</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
	<style>
		body {
			margin: 0;
			background: #0f1923;
			color: white;
			font-family: 'Inter', sans-serif;
			display: flex;
			flex-direction: column;
			height: 100vh;
			overflow: hidden;
		}
		.header {
			padding: 15px 20px;
			background: #1a2733;
			display: flex;
			justify-content: space-between;
			align-items: center;
			border-bottom: 1px solid #2c3e50;
		}
		.balance {
			font-size: 1.2rem;
			font-weight: bold;
			color: #2ecc71;
		}
		.game-area {
			flex: 1;
			position: relative;
			background: #0f1923;
			overflow: hidden;
		}
		canvas {
			display: block;
			width: 100%;
			height: 100%;
		}
		.controls {
			padding: 20px;
			background: #1a2733;
			display: flex;
			gap: 20px;
			align-items: center;
			justify-content: center;
			border-top: 1px solid #2c3e50;
		}
		.bet-input {
			background: #0f1923;
			border: 1px solid #2c3e50;
			color: white;
			padding: 10px;
			border-radius: 5px;
			font-size: 1.1rem;
			width: 100px;
			text-align: center;
		}
		.btn {
			padding: 15px 40px;
			border: none;
			border-radius: 5px;
			font-size: 1.2rem;
			font-weight: bold;
			cursor: pointer;
			text-transform: uppercase;
			transition: transform 0.1s;
			min-width: 200px;
		}
		.btn:active { transform: scale(0.98); }
		.btn-bet { background: #2ecc71; color: #0f1923; }
		.btn-cashout { background: #e67e22; color: white; }
		.btn-waiting { background: #95a5a6; color: #2c3e50; cursor: not-allowed; }
        
		.multiplier-display {
			position: absolute;
			top: 40%;
			left: 50%;
			transform: translate(-50%, -50%);
			font-size: 5rem;
			font-weight: 800;
			color: white;
			text-shadow: 0 0 20px rgba(0,0,0,0.5);
			pointer-events: none;
		}
		.crashed { color: #e74c3c; }
        
		.history {
			height: 40px;
			background: #0a1016;
			display: flex;
			align-items: center;
			padding: 0 10px;
			gap: 10px;
			overflow-x: auto;
		}
		.history-item {
			padding: 2px 8px;
			border-radius: 10px;
			font-size: 0.8rem;
			background: #2c3e50;
			color: #bdc3c7;
			white-space: nowrap;
		}
		.history-item.high { color: #9b59b6; border: 1px solid #9b59b6; background: rgba(155, 89, 182, 0.1); }
		.history-item.medium { color: #3498db; border: 1px solid #3498db; background: rgba(52, 152, 219, 0.1); }
		.history-item.low { color: #95a5a6; }

		.back-btn {
			color: #bdc3c7;
			text-decoration: none;
			font-weight: 600;
			display: flex;
			align-items: center;
			gap: 5px;
		}
	</style>
</head>
<body>
	<div class="header">
		<a href="index.html#games" class="back-btn">← Back</a>
		<div class="balance">Balance: $<span id="balance">1000.00</span></div>
	</div>
    
	<div class="history" id="history">
		<!-- History items -->
	</div>

	<div class="game-area">
		<canvas id="gameCanvas"></canvas>
		<div class="multiplier-display" id="multiplier">1.00x</div>
	</div>

	<div class="controls">
		<div style="display:flex; flex-direction:column; gap:5px;">
			<label style="font-size:0.8rem; color:#bdc3c7;">Bet Amount</label>
			<input type="number" id="betAmount" class="bet-input" value="10" min="1" max="1000">
		</div>
		<button id="actionBtn" class="btn btn-bet">BET</button>
	</div>

	<script>
		// Game Logic
		const canvas = document.getElementById('gameCanvas');
		const ctx = canvas.getContext('2d');
		const multiplierEl = document.getElementById('multiplier');
		const actionBtn = document.getElementById('actionBtn');
		const balanceEl = document.getElementById('balance');
		const betInput = document.getElementById('betAmount');
		const historyEl = document.getElementById('history');

		let width, height;
		let balance = 1000;
		let currentBet = 0;
		let multiplier = 1.00;
		let gameState = 'IDLE'; // IDLE, BETTING, FLYING, CRASHED
		let startTime = 0;
		let crashPoint = 0;
		let animationId;
		let planeX = 0;
		let planeY = 0;
		let trail = [];

		// Resize
		function resize() {
			width = canvas.width = canvas.parentElement.clientWidth;
			height = canvas.height = canvas.parentElement.clientHeight;
		}
		window.addEventListener('resize', resize);
		resize();

		// Plane Image (Simple shape for now)
		function drawPlane(x, y) {
			ctx.save();
			ctx.translate(x, y);
			ctx.rotate(-0.2); // Slight tilt up
            
			// Body
			ctx.fillStyle = '#e74c3c';
			ctx.beginPath();
			ctx.moveTo(0, 0);
			ctx.lineTo(-40, 10);
			ctx.lineTo(-40, -10);
			ctx.fill();
            
			// Wings
			ctx.fillStyle = '#c0392b';
			ctx.beginPath();
			ctx.moveTo(-20, 0);
			ctx.lineTo(-30, -25);
			ctx.lineTo(-10, 0);
			ctx.fill();

			ctx.restore();
		}

		function updateGame() {
			if (gameState === 'FLYING') {
				const now = Date.now();
				const elapsed = (now - startTime) / 1000; // seconds
                
				// Exponential growth function
				// 1.00 -> ...
				multiplier = 1.0 + (0.1 * Math.pow(elapsed, 2)) + (0.1 * elapsed);
                
				// Check Crash
				if (multiplier >= crashPoint) {
					crash();
				} else {
					multiplierEl.textContent = multiplier.toFixed(2) + 'x';
                    
					// Move Plane
					// Curve: x linear, y exponential inverse
					const progress = Math.min(elapsed / 5, 1); // 5 seconds to reach "cruise" visual
					planeX = 50 + (width - 100) * progress;
					planeY = height - 50 - (height - 100) * Math.pow(progress, 0.5);
                    
					trail.push({x: planeX, y: planeY});
					if (trail.length > 100) trail.shift();
				}
			}
            
			draw();
			if (gameState === 'FLYING') {
				animationId = requestAnimationFrame(updateGame);
			}
		}

		function draw() {
			ctx.clearRect(0, 0, width, height);
            
			// Grid / Background
			ctx.strokeStyle = '#2c3e50';
			ctx.lineWidth = 1;
			ctx.beginPath();
			for(let i=0; i<width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,height); }
			for(let i=0; i<height; i+=50) { ctx.moveTo(0,i); ctx.lineTo(width,i); }
			ctx.stroke();

			if (gameState === 'FLYING' || gameState === 'CRASHED') {
				// Draw Curve
				if (trail.length > 1) {
					ctx.beginPath();
					ctx.strokeStyle = '#e74c3c';
					ctx.lineWidth = 3;
					ctx.moveTo(trail[0].x, trail[0].y);
					for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
					ctx.stroke();
                    
					// Fill area under curve
					ctx.lineTo(trail[trail.length-1].x, height);
					ctx.lineTo(trail[0].x, height);
					ctx.fillStyle = 'rgba(231, 76, 60, 0.1)';
					ctx.fill();
				}

				if (gameState === 'FLYING') {
					drawPlane(planeX, planeY);
				}
			}
		}

		function startGame() {
			const bet = parseFloat(betInput.value);
			if (isNaN(bet) || bet <= 0) { alert("Invalid bet"); return; }
			if (bet > balance) { alert("Insufficient funds"); return; }

			balance -= bet;
			currentBet = bet;
			updateBalance();

			gameState = 'BETTING';
			actionBtn.textContent = "WAITING...";
			actionBtn.className = "btn btn-waiting";
			actionBtn.disabled = true;

			// Simulate "Waiting for next round"
			setTimeout(() => {
				startRound();
			}, 1000);
		}

		function startRound() {
			gameState = 'FLYING';
			startTime = Date.now();
			multiplier = 1.00;
			trail = [{x: 50, y: height-50}];
			planeX = 50;
			planeY = height-50;
            
			// Determine Crash Point
			const r = Math.random();
			crashPoint = Math.floor(100 / (1 - r) * 0.01 * 100) / 100;
			if (crashPoint < 1.00) crashPoint = 1.00;

			multiplierEl.classList.remove('crashed');
			multiplierEl.textContent = "1.00x";
            
			actionBtn.textContent = "CASH OUT";
			actionBtn.className = "btn btn-cashout";
			actionBtn.disabled = false;
			actionBtn.onclick = cashOut;

			updateGame();
		}

		function cashOut() {
			if (gameState !== 'FLYING') return;
            
			const win = currentBet * multiplier;
			balance += win;
			updateBalance();
            
			currentBet = 0; // Cashed out
			actionBtn.textContent = `WON $${win.toFixed(2)}`;
			actionBtn.className = "btn btn-waiting";
			actionBtn.disabled = true;
		}

		function crash() {
			gameState = 'CRASHED';
			multiplierEl.textContent = `FLEW AWAY! ${crashPoint.toFixed(2)}x`;
			multiplierEl.classList.add('crashed');
            
			// Add to history
			addHistory(crashPoint);

			if (currentBet > 0) {
				// Lost
				actionBtn.textContent = "LOST";
			}
            
			actionBtn.className = "btn btn-waiting";
			actionBtn.disabled = true;

			setTimeout(() => {
				resetUI();
			}, 3000);
		}

		function resetUI() {
			gameState = 'IDLE';
			multiplierEl.textContent = "1.00x";
			multiplierEl.classList.remove('crashed');
			ctx.clearRect(0, 0, width, height);
            
			actionBtn.textContent = "BET";
			actionBtn.className = "btn btn-bet";
			actionBtn.disabled = false;
			actionBtn.onclick = startGame;
			currentBet = 0;
		}

		function updateBalance() {
			balanceEl.textContent = balance.toFixed(2);
		}

		function addHistory(val) {
			const div = document.createElement('div');
			div.className = 'history-item';
			div.textContent = val.toFixed(2) + 'x';
            
			if (val >= 10) div.classList.add('high');
			else if (val >= 2) div.classList.add('medium');
			else div.classList.add('low');
            
			historyEl.prepend(div);
			if (historyEl.children.length > 20) historyEl.lastChild.remove();
		}

		// Init
		actionBtn.onclick = startGame;

	</script>
</body>
</html>
