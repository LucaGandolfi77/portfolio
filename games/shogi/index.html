<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a1020">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shogi">
  <meta name="description" content="A modern shogi PWA: complete rules, a real search AI, kifu replay, clocks, daily puzzles and full offline support.">
  <title>Shogi — Luca Gandolfi</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="wood">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../games/index.html" aria-label="Games">
        <span class="brand-mark">将</span>
        <span class="brand-text">SHOGI<span>PWA</span></span>
      </a>
      <div class="top-actions">
        <button class="tb" id="menuBtn" type="button" data-i18n="action.menu">Menu</button>
        <button class="tb" id="rulesBtn" type="button" data-i18n="action.rules">Regole</button>
        <button class="tb" id="tutorialBtn" type="button" data-i18n="action.tutorial">Tutorial</button>
        <button class="tb" id="settingsBtn" type="button" data-i18n="action.settings">Impostazioni</button>
        <button class="tb icon" id="langBtn" type="button" aria-label="Lingua">IT / EN</button>
        <button class="tb accent hidden" id="installBtn" type="button" data-i18n="msg.install">Installa</button>
      </div>
    </header>

    <main class="stage">
      <div class="layout">
        <section class="board-area">
          <div class="player-row opponent" id="playerGote">
            <div class="avatar">後</div>
            <div class="player-meta"><strong id="playerGoteName">Gote</strong><span id="playerGoteLevel"></span></div>
            <div class="clock" id="playerGoteClock">--:--</div>
          </div>

          <div class="hand-row" id="handGote" aria-label="Mano di Gote"></div>

          <div class="board-wrap" id="boardWrap">
            <div class="board" id="board" role="grid" aria-label="Shogi board"></div>
            <div class="board-overlay hidden" id="boardOverlay"><span id="boardOverlayText"></span></div>
          </div>

          <div class="hand-row" id="handSente" aria-label="Mano di Sente"></div>

          <div class="player-row" id="playerSente">
            <div class="avatar">先</div>
            <div class="player-meta"><strong id="playerSenteName">Sente</strong><span id="playerSenteLevel"></span></div>
            <div class="clock" id="playerSenteClock">--:--</div>
          </div>

          <div class="status" id="status">—</div>
          <div class="eval-track" title="Valutazione"><div class="eval-fill" id="evalFill"></div></div>
        </section>

        <aside class="side">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="kifu" type="button" data-i18n="panel.kifu">KIFU</button>
            <button class="tab" data-tab="tools" type="button" data-i18n="panel.tools">STRUMENTI</button>
            <button class="tab" data-tab="stats" type="button" data-i18n="panel.stats">STATISTICHE</button>
          </div>

          <div class="panel active" id="panelKifu">
            <ol class="kifu-list" id="kifuList"></ol>
            <div class="panel-actions">
              <button class="mini-btn" id="copyKifuBtn" type="button" data-i18n="action.share">Condividi</button>
              <button class="mini-btn" id="replayBtn" type="button" data-i18n="action.replay">Rivedi</button>
            </div>
          </div>

          <div class="panel" id="panelTools">
            <div class="tool-grid">
              <button class="tool-btn" id="hintBtn" type="button">💡 <span data-i18n="action.hint">Suggerimento</span></button>
              <button class="tool-btn" id="shareBtn" type="button">📤 <span data-i18n="action.share">Condividi</span></button>
              <button class="tool-btn" id="undoBtn" type="button">↶ <span data-i18n="action.undo">Annulla</span></button>
              <button class="tool-btn" id="redoBtn" type="button">↷ <span data-i18n="action.redo">Ripeti</span></button>
              <button class="tool-btn" id="flipBtn" type="button">🔄 <span data-i18n="action.flip">Gira</span></button>
              <button class="tool-btn" id="pauseBtn" type="button">⏸ <span data-i18n="hud.paused">Pausa</span></button>
              <button class="tool-btn danger" id="resignBtn" type="button">🏳 <span data-i18n="action.resign">Arrenditi</span></button>
            </div>
          </div>

          <div class="panel" id="panelStats">
            <h3 data-i18n="panel.stats">STATISTICHE</h3>
            <div class="stats-grid" id="statsGrid"></div>
            <h3 data-i18n="panel.achievements">OBIETTIVI</h3>
            <div class="achievements" id="achievementsGrid"></div>
            <div class="daily-card" id="dailyCard">
              <strong data-i18n="panel.daily">TESUJI DEL GIORNO</strong>
              <p id="dailyDesc" data-i18n="panel.daily.desc"></p>
              <span class="streak" id="dailyStreak"></span>
              <button class="mini-btn" id="dailyBtn" type="button" data-i18n="menu.start">INIZIA</button>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <!-- MENU -->
  <div class="overlay" id="menuOverlay">
    <div class="modal menu-modal">
      <p class="eyebrow">LUCA GANDOLFI — ARCADE LAB</p>
      <h1 data-i18n="menu.title">SHOGI</h1>
      <p class="tagline" data-i18n="menu.tagline"></p>
      <p class="subtitle" data-i18n="menu.subtitle"></p>
      <h2 data-i18n="menu.mode">MODALITÀ</h2>
      <div class="choice-grid" id="modeGrid"></div>
      <h2 data-i18n="menu.level">LIVELLO AI</h2>
      <div class="choice-grid four" id="levelGrid"></div>
      <h2 data-i18n="menu.time">OROLOGIO</h2>
      <div class="choice-grid four" id="timeGrid"></div>
      <h2 data-i18n="menu.theme">TEMA</h2>
      <div class="choice-grid three" id="themeGrid"></div>
      <div class="menu-foot">
        <span id="menuBest"></span>
        <button class="btn primary" id="startBtn" type="button" data-i18n="menu.start">INIZIA PARTITA</button>
      </div>
    </div>
  </div>

  <!-- PROMOZIONE -->
  <div class="overlay hidden" id="promotionOverlay">
    <div class="modal small-modal sheet">
      <div class="sheet-piece" id="promotePiece">歩 → と</div>
      <h2 data-i18n="msg.promote">Promuovere?</h2>
      <p data-i18n="msg.promote.hint"></p>
      <div class="row-btns">
        <button class="btn primary" id="promoteYes" type="button" data-i18n="action.yes">Sì</button>
        <button class="btn ghost" id="promoteNo" type="button" data-i18n="action.no">No</button>
      </div>
    </div>
  </div>

  <!-- REGOLE -->
  <div class="overlay hidden" id="rulesOverlay">
    <div class="modal rules-modal" id="rulesContent"></div>
  </div>

  <!-- TUTORIAL -->
  <div class="overlay hidden" id="tutorialOverlay">
    <div class="modal small-modal">
      <div class="tutorial-art" id="tutorialArt">將</div>
      <h2 id="tutorialTitle"></h2>
      <p id="tutorialBody"></p>
      <div class="dots" id="tutorialDots"></div>
      <div class="row-btns">
        <button class="btn ghost" id="tutorialSkip" type="button" data-i18n="tutorial.skip">Salta</button>
        <button class="btn primary" id="tutorialNext" type="button" data-i18n="tutorial.next">Avanti</button>
      </div>
    </div>
  </div>

  <!-- RISULTATO -->
  <div class="overlay hidden" id="resultOverlay">
    <div class="modal small-modal">
      <div class="result-icon" id="resultIcon">🏆</div>
      <h2 id="resultTitle"></h2>
      <p id="resultReason"></p>
      <div class="result-stats" id="resultStats"></div>
      <div class="row-btns">
        <button class="btn primary" id="resultAgain" type="button" data-i18n="action.retry">Riprova</button>
        <button class="btn ghost" id="resultMenu" type="button" data-i18n="action.menu">Menu</button>
      </div>
    </div>
  </div>

  <!-- IMPOSTAZIONI -->
  <div class="overlay hidden" id="settingsOverlay">
    <div class="modal small-modal">
      <h2 data-i18n="action.settings">Impostazioni</h2>
      <button class="setting-row" id="soundToggle" type="button"></button>
      <button class="setting-row" id="hapticToggle" type="button"></button>
      <div class="row-btns">
        <button class="btn primary" id="closeSettings" type="button" data-i18n="action.close">Chiudi</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="status-chip hidden" id="offlineChip">⚡ <span data-i18n="msg.offline">Offline</span></div>
  <div class="update-bar hidden" id="updateBar">
    <span data-i18n="msg.update">Nuova versione disponibile</span>
    <button type="button" id="updateBtn" data-i18n="msg.updateBtn">Aggiorna</button>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
