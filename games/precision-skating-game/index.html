<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Precision Skating</title>
<meta name="description" content="Coach a 16-skater precision roller skating team through choreographed routines. Rhythm gameplay, tap drifting skaters, build formations to music."/>
<meta name="theme-color" content="#1a0f1e"/>
<meta name="color-scheme" content="dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Precision Skating"/>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#1a0f1e;color:#fce4f0;
  user-select:none;-webkit-user-select:none;
  --safe-top:env(safe-area-inset-top,12px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
#c{
  display:block;position:fixed;inset:0;width:100vw;height:100vh;
  touch-action:none;
}

/* ── overlays ── */
.overlay{
  position:fixed;inset:0;z-index:400;
  background:rgba(26,15,30,0.88);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.overlay.hidden{display:none}
.panel{
  background:linear-gradient(160deg,#2a1530,#1a0f1e);
  border:1px solid rgba(212,160,192,0.3);
  border-radius:20px;padding:28px 24px;
  max-width:420px;width:100%;
  text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
  max-height:88vh;overflow-y:auto;
}
.panel h1{
  font-size:28px;font-weight:900;letter-spacing:1px;
  color:#ff6b9d;margin-bottom:4px;
  text-shadow:0 2px 12px rgba(255,107,157,0.4);
}
.panel .sub{
  font-size:13px;color:rgba(252,228,240,0.6);
  margin-bottom:24px;line-height:1.4;
}
.mbtn{
  display:block;width:100%;padding:14px;
  margin:8px 0;border:none;border-radius:14px;
  font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
  transition:transform .1s;
}
.mbtn:active{transform:scale(0.95)}
.mbtn.primary{
  background:linear-gradient(135deg,#ff6b9d,#c084fc);
  color:#fff;box-shadow:0 6px 20px rgba(255,107,157,0.4);
}
.mbtn.ghost{
  background:rgba(255,255,255,0.06);color:#fce4f0;
  border:1px solid rgba(212,160,192,0.25);
}
.mbtn.ghost:hover{background:rgba(255,255,255,0.1)}

/* ── results ── */
.res-line{
  display:flex;justify-content:space-between;
  padding:8px 0;font-size:14px;
  border-bottom:1px solid rgba(212,160,192,0.15);
}
.res-line.total{
  border-top:2px solid #ff6b9d;border-bottom:none;
  font-size:20px;font-weight:900;color:#ff6b9d;
  padding-top:14px;margin-top:6px;
}

/* ── pause title ── */
.panel h2{
  font-size:24px;font-weight:900;color:#c084fc;margin-bottom:20px;
}

/* ── sound toggle ── */
.sound-toggle{
  position:fixed;top:calc(var(--safe-top) + 8px);right:16px;
  z-index:60;
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(30,15,30,0.85);
  border:1.5px solid rgba(212,160,192,0.3);
  color:#fce4f0;font-size:16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  cursor:pointer;
}
.sound-toggle:active{transform:scale(0.9)}

/* ── desktop hint ── */
@media (hover:hover) and (pointer:fine){
  .desktop-hint{display:block}
}
.desktop-hint{display:none}

/* ── safe-area padding ── */
@supports(padding:env(safe-area-inset-top)){
  .panel{padding-top:calc(28px + env(safe-area-inset-top))}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- sound toggle -->
<button class="sound-toggle" id="soundBtn" title="Sound">♪</button>

<!-- ════════ START OVERLAY ════════ -->
<div id="startOverlay" class="overlay">
  <div class="panel">
    <h1 id="titleText">⛸️ PRECISION SKATING</h1>
    <div class="sub" id="subtitleText">Coach a 16-skater roller team through choreographed routines</div>
    <button class="mbtn primary" id="btnPlay"><span id="btnPlayText">PLAY</span></button>
    <button class="mbtn ghost" id="btnLang"><span id="btnLangText">IT / EN</span></button>
    <div class="desktop-hint" style="margin-top:16px;font-size:11px;color:rgba(252,228,240,0.4)">
      SPACE = tap &nbsp;·&nbsp; ESC = pause
    </div>
  </div>
</div>

<!-- ════════ PAUSE OVERLAY ════════ -->
<div id="pauseOverlay" class="overlay hidden">
  <div class="panel">
    <h2 id="pauseTitle">PAUSE</h2>
    <button class="mbtn primary" id="btnResume"><span id="btnResumeText">RESUME</span></button>
    <button class="mbtn ghost" id="btnRestart"><span id="btnRestartText">RESTART</span></button>
    <button class="mbtn ghost" id="btnQuit"><span id="btnQuitText">QUIT</span></button>
  </div>
</div>

<!-- ════════ RESULTS OVERLAY ════════ -->
<div id="resultsOverlay" class="overlay hidden">
  <div class="panel">
    <h1>⛸️ <span id="routineDoneText">ROUTINE COMPLETE</span></h1>
    <div class="sub" style="margin-bottom:16px"></div>
    <div class="res-line"><span id="resTechnical">Technical: 0</span></div>
    <div class="res-line"><span id="resExecution">Execution: 0</span></div>
    <div class="res-line"><span id="resPenalties">Penalties: 0</span></div>
    <div class="res-line"><span id="resCombo">Combo Bonus: 0</span></div>
    <div class="res-line total"><span id="resTotal">TOTAL: 0</span></div>
    <button class="mbtn primary" id="btnRestartResults" style="margin-top:20px">PLAY AGAIN</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
