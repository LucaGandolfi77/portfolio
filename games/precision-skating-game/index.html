<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#080b1f"/>
<meta name="color-scheme" content="dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Precision Skating"/>
<meta name="description" content="Coach a 16-skater precision roller team. Neon rhythm gameplay, 4-round championship and formations to music."/>
<title>Precision Skating — Velocity Edition</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<canvas id="game"></canvas>
<button class="sound-toggle" id="soundBtn" type="button" aria-label="Sound">♪</button>

<div class="overlay" id="startOverlay">
  <div class="panel start-panel">
    <div class="logo-mark">⛸️</div>
    <h1 id="titleText" data-i18n="title">PRECISION SKATING</h1>
    <p class="sub" id="subtitleText" data-i18n="subtitle">Coach a 16-skater roller team through choreographed routines</p>
    <button class="mbtn primary" id="btnChampionship" type="button">🏆 <span data-i18n="championship">CHAMPIONSHIP</span></button>
    <button class="mbtn ghost" id="btnPlay" type="button">▶ <span data-i18n="practice">PRACTICE ROUTINE</span></button>
    <div class="row-btns">
      <button class="mbtn small" id="btnPreview" type="button">◇ <span data-i18n="preview">FORMATION PREVIEW</span></button>
      <button class="mbtn small" id="btnTutorial" type="button">? <span data-i18n="tutorial">TUTORIAL</span></button>
    </div>
    <div class="difficulty">
      <span data-i18n="difficulty">DIFFICULTY</span>
      <div class="diff-row">
        <button type="button" data-difficulty="easy" data-i18n="easy">EASY</button>
        <button type="button" data-difficulty="medium" class="active" data-i18n="medium">MEDIUM</button>
        <button type="button" data-difficulty="hard" data-i18n="hard">HARD</button>
      </div>
    </div>
    <button class="mbtn lang" id="btnLang" type="button"><span id="btnLangText">IT / EN</span></button>
    <p class="hint" data-i18n="controls">SPACE / CLICK = tap · P = pause</p>
  </div>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <div class="panel small-panel">
    <div class="logo-mark">⏸</div>
    <h2 id="pauseTitle" data-i18n="pause">PAUSE</h2>
    <button class="mbtn primary" id="btnResume" type="button"><span id="btnResumeText" data-i18n="resume">RESUME</span></button>
    <button class="mbtn ghost" id="btnRestart" type="button"><span id="btnRestartText" data-i18n="restart">RESTART</span></button>
    <button class="mbtn ghost" id="btnQuit" type="button"><span id="btnQuitText" data-i18n="quit">QUIT</span></button>
  </div>
</div>

<div class="overlay hidden" id="resultsOverlay">
  <div class="panel small-panel">
    <div class="logo-mark">🏁</div>
    <h1 id="routineDoneText" data-i18n="routineDone">ROUTINE COMPLETE</h1>
    <p class="result-note" id="resultNote"></p>
    <div class="res-line"><span id="resTechnical">Technical: 0</span></div>
    <div class="res-line"><span id="resExecution">Execution: 0</span></div>
    <div class="res-line"><span id="resArtistic">Artistic: 0</span></div>
    <div class="res-line"><span id="resPenalties">Penalties: 0</span></div>
    <div class="res-line"><span id="resCombo">Combo Bonus: 0</span></div>
    <div class="res-line total"><span id="resTotal">TOTAL: 0</span></div>
    <button class="mbtn primary" id="btnNextRound" type="button" data-i18n="nextRound">NEXT ROUND</button>
    <button class="mbtn ghost" id="btnRestartResults" type="button" data-i18n="restart">RESTART</button>
    <button class="mbtn ghost" id="btnMenuResults" type="button" data-i18n="backMenu">BACK TO MENU</button>
  </div>
</div>

<div class="overlay hidden" id="standingsOverlay">
  <div class="panel small-panel">
    <h2>🏆 <span data-i18n="standings">STANDINGS</span></h2>
    <p class="result-note" id="standingsRound"></p>
    <div id="standingsList" class="standings-list"></div>
    <button class="mbtn ghost" id="btnStandingsBack" type="button" data-i18n="backMenu">BACK TO MENU</button>
  </div>
</div>

<div class="overlay hidden" id="previewOverlay">
  <div class="panel">
    <h2>◇ <span data-i18n="preview">FORMATION PREVIEW</span></h2>
    <div id="formationList" class="formation-list"></div>
    <button class="mbtn ghost" id="btnPreviewBack" type="button" data-i18n="backMenu">BACK TO MENU</button>
  </div>
</div>

<div class="overlay hidden" id="tutorialOverlay">
  <div class="panel small-panel">
    <h2>? <span data-i18n="tutorial">TUTORIAL</span></h2>
    <div id="tutorialBody"></div>
    <button class="mbtn primary" id="btnTutorialBack" type="button" data-i18n="ok">OK</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script src="../../top_buttons.js"></script>
</body>
</html>
