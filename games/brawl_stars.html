<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Brawl Arena</title>
	<style>
		body { margin:0; overflow:hidden; background:#2c3e50; font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif; touch-action:none; }
		#gameCanvas{ display:block }
		.ui-layer{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none }
		.joystick-zone{ position:absolute; bottom:20px; width:150px; height:150px; pointer-events:auto }
		#stick-left{ left:20px } #stick-right{ right:20px }
		.score-board{ position:absolute; top:20px; left:50%; transform:translateX(-50%); color:white; font-size:24px; font-weight:bold; text-shadow:2px 2px 4px rgba(0,0,0,0.5); pointer-events:none }
		.hp-container{ position:absolute; top:70px; left:50%; transform:translateX(-50%); width:300px; height:20px; background:rgba(0,0,0,0.5); border-radius:10px; border:2px solid rgba(255,255,255,0.3); overflow:hidden }
		.shield-container{ position:absolute; top:45px; left:50%; transform:translateX(-50%); width:300px; height:15px; background:rgba(0,0,0,0.5); border-radius:10px; border:2px solid rgba(255,255,255,0.3); overflow:hidden; display:none }
		#hp-bar{ width:100%; height:100%; background:#e74c3c; transition:width 0.2s }
		#shield-bar{ width:100%; height:100%; background:#3498db; transition:width 0.2s }
		#startScreen{ position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(44,62,80,1); color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:3000 }
		.mode-btn{ width:200px; margin:10px; padding:20px; font-size:24px; background:#3498db; border:none; border-radius:10px; color:white; cursor:pointer }
		.mode-desc{ font-size:14px; color:#bdc3c7; margin-bottom:20px; max-width:300px; text-align:center }
		#gameOverScreen{ display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); color:white; flex-direction:column; justify-content:center; align-items:center; pointer-events:auto; z-index:2000 }
		button{ padding:15px 30px; font-size:20px; background:#e74c3c; color:white; border:none; border-radius:8px; cursor:pointer; margin-top:20px; pointer-events:auto }
		button:hover{ background:#c0392b }
		.tutorial{ position:absolute; bottom:180px; width:100%; text-align:center; color:rgba(255,255,255,0.6); font-size:14px; pointer-events:none }
	</style>
</head>
<body>
	<canvas id="gameCanvas"></canvas>
	<div class="ui-layer">
		<div class="score-board">Score: <span id="scoreVal">0</span></div>
		<div class="shield-container" id="shield-container"><div id="shield-bar"></div></div>
		<div class="hp-container"><div id="hp-bar"></div></div>
		<div class="tutorial"><span>Left Stick: Move</span> &nbsp;&nbsp;&nbsp;&nbsp; <span>Right Stick: Shoot</span></div>
		<div id="stick-left" class="joystick-zone"></div>
		<div id="stick-right" class="joystick-zone"></div>
	</div>
	<div id="startScreen">
		<h1>BRAWL ARENA</h1>
		<button class="mode-btn" onclick="startGame('npc')">VS NPC</button>
		<div class="mode-desc">Survive waves of zombies and tanks!</div>
		<button class="mode-btn" style="background:#8e44ad;" onclick="startGame('bot')">VS BOT</button>
		<div class="mode-desc">Battle Royale: 20 Bots, Looting, Zone Damage. Be the last one standing!</div>
	</div>
	<div id="gameOverScreen">
		<h1>GAME OVER</h1>
		<p>Score: <span id="finalScore">0</span></p>
		<button id="btn-retry">Play Again</button>
		<button id="btn-exit" style="background:#34495e; margin-top:10px;">Exit</button>
	</div>
	<script>
		// Simplified gameplay script
		const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); function fit(){ canvas.width=innerWidth; canvas.height=innerHeight; } addEventListener('resize',fit); fit();
		let running=false; let score=0; document.getElementById('btn-retry').onclick=()=>location.reload(); document.getElementById('btn-exit').onclick=()=>location.href='index.html';
		function startGame(mode){ document.getElementById('startScreen').style.display='none'; running=true; score=0; loop(); }
		function loop(){ if(!running) return; ctx.fillStyle='#2c3e50'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='white'; ctx.fillText('Brawl Arena — Demo',20,40); requestAnimationFrame(loop); }
	</script>
</body>
</html>
