<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6ead8">
<meta name="description" content="Cozy Coloring Book — oltre 80 disegni in bianco e nero da colorare in relax, con strumenti semplici e galleria.">
<title>Cozy Coloring Book</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <a class="back" href="../index.html#games">← <span data-i18n="back">Portfolio</span></a>
    <div class="brand"><span class="brand-ico">🎨</span><div><h1 data-i18n="appTitle">Cozy Coloring Book</h1>
      <small data-i18n="tagline">Un momento di calma, un colore alla volta</small></div></div>
    <div class="top-actions">
      <button class="chip-btn" id="langBtn" type="button" aria-label="Language">🇮🇹 IT</button>
      <button class="chip-btn" id="muteBtn" type="button" aria-label="Sound">🔊</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" type="button" data-view="draw" data-i18n="tabDraw" aria-selected="true">Disegna</button>
    <button class="tab" type="button" data-view="library" data-i18n="tabLibrary" aria-selected="false">Libreria</button>
    <button class="tab" type="button" data-view="gallery" data-i18n="tabGallery" aria-selected="false">Galleria</button>
  </nav>

  <main>
    <section class="view active" id="viewDraw">
      <div class="draw-layout">
        <aside class="toolbar">
          <div class="tool-section">
            <span class="tool-label" data-i18n="tools">Strumenti</span>
            <div class="tool-grid">
              <button class="tool active" type="button" data-tool="fill" title="Fill">🪣 <span data-i18n="toolFill">Riempi</span></button>
              <button class="tool" type="button" data-tool="pen" title="Pen">✏️ <span data-i18n="toolPen">Pennello</span></button>
              <button class="tool" type="button" data-tool="eraser" title="Eraser">🧽 <span data-i18n="toolEraser">Gomma</span></button>
              <button class="tool" type="button" data-tool="picker" title="Eyedropper">💧 <span data-i18n="toolPicker">Contagocce</span></button>
              <button class="tool" type="button" data-tool="pan" title="Pan">✋ <span data-i18n="toolPan">Sposta</span></button>
            </div>
          </div>

          <div class="tool-section">
            <span class="tool-label" data-i18n="colors">Colori</span>
            <div class="palette" id="palette"></div>
            <label class="custom-color"><input type="color" id="customColor" value="#e88b6a"> <span data-i18n="customColor">Colore personalizzato</span></label>
          </div>

          <div class="tool-section">
            <label class="range-label"><span data-i18n="brushSize">Spessello</span><b id="brushVal">6</b></label>
            <input type="range" id="brushSize" min="1" max="40" value="6">
            <label class="range-label"><span data-i18n="opacity">Opacità</span><b id="opacityVal">100%</b></label>
            <input type="range" id="opacity" min="10" max="100" value="100">
            <label class="range-label"><span data-i18n="tolerance">Tolleranza</span><b id="toleranceVal">40</b></label>
            <input type="range" id="tolerance" min="5" max="90" value="40">
          </div>

          <div class="tool-section">
            <span class="tool-label" data-i18n="actions">Azioni</span>
            <div class="action-grid">
              <button class="action" id="undoBtn" type="button">↩️ <span data-i18n="undo">Annulla</span></button>
              <button class="action" id="redoBtn" type="button">↪️ <span data-i18n="redo">Ripeti</span></button>
              <button class="action" id="resetColorBtn" type="button">🩶 <span data-i18n="resetColors">Ricolora</span></button>
              <button class="action" id="zoomInBtn" type="button">➕</button>
              <button class="action" id="zoomOutBtn" type="button">➖</button>
              <button class="action" id="zoomResetBtn" type="button">⤢</button>
              <button class="action wide" id="saveGalleryBtn" type="button">💾 <span data-i18n="saveGallery">Salva in galleria</span></button>
              <button class="action wide" id="downloadBtn" type="button">⬇️ <span data-i18n="download">Scarica PNG</span></button>
              <button class="action wide" id="printBtn" type="button">🖨️ <span data-i18n="print">Stampa</span></button>
            </div>
          </div>
          <p class="figure-caption"><span data-i18n="currentFigure">Disegno attuale</span>: <b id="figureName">—</b></p>
        </aside>

        <div class="paper-viewport" id="viewport">
          <div class="paper" id="paper"><canvas id="art" aria-label="Coloring canvas"></canvas></div>
          <div class="zoom-badge" id="zoomBadge">100%</div>
        </div>
      </div>
    </section>

    <section class="view" id="viewLibrary">
      <div class="panel">
        <div class="panel-head">
          <div><h2 data-i18n="libraryTitle">Scegli un disegno</h2><p class="muted" id="figureCount"></p></div>
          <button class="soft-btn" type="button" id="randomBtn">🎲 <span data-i18n="random">Sorprendimi</span></button>
        </div>
        <div class="daily-banner" id="dailyBanner"></div>
        <input type="search" id="searchInput" data-i18n-ph="search" placeholder="Cerca un disegno…">
        <div class="category-row" id="categories"></div>
        <div class="figure-grid" id="figureGrid"></div>
      </div>
    </section>

    <section class="view" id="viewGallery">
      <div class="panel">
        <div class="panel-head"><div><h2 data-i18n="galleryTitle">La tua galleria</h2>
          <p class="muted" data-i18n="galleryHint">I disegni salvati restano in questo browser.</p></div></div>
        <div class="figure-grid gallery-grid" id="galleryGrid"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./js/main.js"></script>
<script src="../../top_buttons.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(/\/(?:coloring_book)(?:-sw|_sw)\.js$/.test(r.scriptURL))r.unregister()}))</script></body>
</html>
