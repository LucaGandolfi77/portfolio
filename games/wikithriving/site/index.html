<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WikiThriving">
<meta name="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="description" content="The Field Guide to Your Life — learn how to thrive at every age">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<title>WikiThriving 📖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#faf6ee;--cream2:#f0ebe0;--cream3:#e6dfd0;
  --ink:#1f2430;--ink2:#3a4255;--ink3:#5a6275;
  --gold:#d4a54a;--gold2:#c49540;--gold-light:#f5e6c8;
  --paper:#fffdf8;--border:#d4c9b0;
  --shadow:0 2px 12px rgba(31,36,48,.08);
  --shadow-lg:0 8px 32px rgba(31,36,48,.12);
  --radius:12px;--radius-sm:8px;
  --font-serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --realm-character:#c0764a;--realm-learning:#4a7ec0;
  --realm-math:#7c4ac0;--realm-money:#4ac07c;
  --realm-health:#c04a5a;--realm-comm:#c0a84a;
  --realm-work:#6b8a6b;--realm-world:#4a8ac0;
  --realm-practical:#8b6b4a;--realm-purpose:#a04ac0;
}
html,body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh}
body{padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,h4{font-family:var(--font-serif);font-weight:700;line-height:1.2}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none}
input,select{font-family:var(--font-sans)}
.screen{display:none;min-height:100vh;min-height:100dvh;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.screen.active{display:flex;flex-direction:column}
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-lg{padding:28px}
.gold-rule{border:none;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px 0}
.realm-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.progress-ring{width:48px;height:48px}
.progress-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.progress-ring .bg{stroke:var(--cream3)}
.progress-ring .fg{transition:stroke-dashoffset .6s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);font-weight:600;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--gold);color:#fff}
.btn-primary:active{background:var(--gold2);transform:scale(.97)}
.btn-outline{border:2px solid var(--border);color:var(--ink)}
.btn-outline:active{background:var(--cream2)}
.btn-sm{padding:8px 16px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600;background:var(--cream2);color:var(--ink2)}
.chip-gold{background:var(--gold-light);color:var(--gold2)}
.streak-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:linear-gradient(135deg,#fff3e0,#ffe0b2);font-weight:700;color:#e65100;font-size:.9rem}
.xp-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);font-weight:700;color:#2e7d32;font-size:.9rem}
.stage-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;background:var(--gold-light);font-weight:700;color:var(--gold2);font-size:.85rem}
.flag-badge{font-size:1.1rem;vertical-align:middle}
.lesson-node{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:2px solid var(--border);color:var(--ink3);background:var(--paper);position:relative;transition:all .3s}
.lesson-node.done{background:var(--gold);color:#fff;border-color:var(--gold)}
.lesson-node.current{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-light)}
.lesson-node.locked{opacity:.4;cursor:not-allowed}
.lesson-node.locked::after{content:'🔒';position:absolute;font-size:.65rem;bottom:-2px;right:-2px}
.path-line{position:absolute;left:50%;width:2px;height:100%;background:var(--cream3);transform:translateX(-50%)}
@media(max-width:400px){
  .card{padding:14px}
  .card-lg{padding:18px}
  h1{font-size:1.5rem}
  h2{font-size:1.25rem}
}
</style>
</head>
<body>

<!-- ========== ONBOARDING ========== -->
<div id="screen-onboarding" class="screen active" style="justify-content:center;align-items:center;text-align:center;padding:24px">
  <div id="onboard-content"></div>
</div>

<!-- ========== HOME ========== -->
<div id="screen-home" class="screen">
  <div id="home-header" style="margin-bottom:16px"></div>
  <div id="home-wisdom" style="margin-bottom:16px"></div>
  <div id="home-quest" style="margin-bottom:20px"></div>
  <h2 style="font-size:1.1rem;color:var(--ink2);margin-bottom:14px">Your Life Map</h2>
  <div id="home-realms" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px"></div>
  <button class="btn btn-outline" style="width:100%;margin-bottom:10px" onclick="showScreen('journey')">🗺️ Your Journey</button>
  <button class="btn btn-outline" style="width:100%;margin-bottom:10px" onclick="showScreen('wisdom')">📚 Wisdom Library</button>
  <button class="btn btn-outline" style="width:100%;margin-bottom:10px" onclick="showScreen('math')">🔢 Math Hub</button>
  <button class="btn btn-outline" style="width:100%;margin-bottom:30px" onclick="showScreen('profile')">⚙️ Profile & Settings</button>
</div>

<!-- ========== REALM ========== -->
<div id="screen-realm" class="screen">
  <button onclick="showScreen('home')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Map</button>
  <div id="realm-content"></div>
</div>

<!-- ========== LESSON ========== -->
<div id="screen-lesson" class="screen">
  <button onclick="showScreen('realm')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Realm</button>
  <div id="lesson-content"></div>
</div>

<!-- ========== WISDOM ========== -->
<div id="screen-wisdom" class="screen">
  <button onclick="showScreen('home')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Map</button>
  <h2 style="margin-bottom:16px">📚 Wisdom Library</h2>
  <div id="wisdom-content"></div>
</div>

<!-- ========== MATH ========== -->
<div id="screen-math" class="screen">
  <button onclick="showScreen('home')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Map</button>
  <h2 style="margin-bottom:16px">🔢 Math Hub</h2>
  <div id="math-content"></div>
</div>

<!-- ========== JOURNEY ========== -->
<div id="screen-journey" class="screen">
  <button onclick="showScreen('home')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Map</button>
  <h2 style="margin-bottom:16px">🗺️ Your Journey</h2>
  <div id="journey-content"></div>
</div>

<!-- ========== PROFILE ========== -->
<div id="screen-profile" class="screen">
  <button onclick="showScreen('home')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Map</button>
  <h2 style="margin-bottom:16px">⚙️ Profile & Settings</h2>
  <div id="profile-content"></div>
</div>

<!-- ========== READING ROOM ========== -->
<div id="screen-reading" class="screen">
  <button onclick="showScreen('home')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Map</button>
  <div id="reading-content"></div>
</div>

<!-- ========== POEM READER ========== -->
<div id="screen-poem" class="screen" style="background:linear-gradient(180deg,#faf6ee,#f5e6c8)">
  <button onclick="showScreen('reading')" style="align-self:flex-start;margin-bottom:12px;font-size:.9rem;color:var(--ink2)">← Back to Reading Room</button>
  <div id="poem-content" style="max-width:600px;margin:0 auto;width:100%"></div>
</div>

<script src="./js/data/realms.js"></script>
<script src="./js/data/countries.js"></script>
<script src="./js/data/quotes.js"></script>
<script src="./js/data/lessons.js"></script>
<script src="./js/data/quests.js"></script>
<script src="./js/data/books.js"></script>
<script src="./js/data/poems.js"></script>
<script src="./js/engine/profile.js"></script>
<script src="./js/engine/unlock.js"></script>
<script src="./js/engine/progress.js"></script>
<script src="./js/engine/daily.js"></script>
<script src="./js/tools/calculators.js"></script>
<script src="./js/tools/mathtrainers.js"></script>
<script src="./js/ui/onboarding.js"></script>
<script src="./js/ui/home.js"></script>
<script src="./js/ui/realm.js"></script>
<script src="./js/ui/lesson.js"></script>
<script src="./js/ui/wisdom.js"></script>
<script src="./js/ui/math.js"></script>
<script src="./js/ui/journey.js"></script>
<script src="./js/ui/profile.js"></script>
<script src="./js/ui/reading.js"></script>
<script src="./js/ui/poem.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
