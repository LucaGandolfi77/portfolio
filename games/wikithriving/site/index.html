<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#faf6ee;--cream2:#f0ebe0;--cream3:#e6dfd0;
  --ink:#1f2430;--ink2:#3a4255;--ink3:#5a6275;
  --gold:#d4a54a;--gold2:#c49540;--gold-light:#f5e6c8;
  --paper:#fffdf8;--border:#d4c9b0;
  --shadow:0 2px 12px rgba(31,36,48,.08);
  --shadow-lg:0 8px 32px rgba(31,36,48,.12);
  --radius:12px;--radius-sm:8px;
  --font-serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --realm-character:#c0764a;--realm-learning:#4a7ec0;
  --realm-math:#7c4ac0;--realm-money:#4ac07c;
  --realm-health:#c04a5a;--realm-comm:#c0a84a;
  --realm-work:#6b8a6b;--realm-world:#4a8ac0;
  --realm-practical:#8b6b4a;--realm-purpose:#a04ac0;
  --nav-height:64px;
}
html,body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh}
body{padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:var(--font-serif);font-weight:700;line-height:1.2}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none}
input,select{font-family:var(--font-sans)}
.screen{display:none;min-height:100vh;min-height:100dvh;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:calc(var(--nav-height) + 32px)}
.screen.active{display:flex;flex-direction:column}
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-lg{padding:28px}
.gold-rule{border:none;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px 0}
.realm-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.progress-ring{width:48px;height:48px}
.progress-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.progress-ring .bg{stroke:var(--cream3)}
.progress-ring .fg{transition:stroke-dashoffset .6s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);font-weight:600;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--gold);color:#fff}
.btn-primary:active{background:var(--gold2);transform:scale(.97)}
.btn-outline{border:2px solid var(--border);color:var(--ink)}
.btn-outline:active{background:var(--cream2)}
.btn-sm{padding:8px 16px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600;background:var(--cream2);color:var(--ink2)}
.chip-gold{background:var(--gold-light);color:var(--gold2)}
.streak-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:linear-gradient(135deg,#fff3e0,#ffe0b2);font-weight:700;color:#e65100;font-size:.9rem}
.xp-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);font-weight:700;color:#2e7d32;font-size:.9rem}
.stage-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;background:var(--gold-light);font-weight:700;color:var(--gold2);font-size:.85rem}
.flag-badge{font-size:1.1rem;vertical-align:middle}
.lesson-node{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:2px solid var(--border);color:var(--ink3);background:var(--paper);position:relative;transition:all .3s}
.lesson-node.done{background:var(--gold);color:#fff;border-color:var(--gold)}
.lesson-node.current{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-light)}
.lesson-node.locked{opacity:.4;cursor:not-allowed}
.lesson-node.locked::after{content:'🔒';position:absolute;font-size:.65rem;bottom:-2px;right:-2px}
.path-line{position:absolute;left:50%;width:2px;height:100%;background:var(--cream3);transform:translateX(-50%)}
.quiz-option{padding:14px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:left;transition:all .2s;cursor:pointer}
.quiz-option:active{transform:scale(.98);background:var(--cream2)}
.plant-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s}
.plant-cell:active{transform:scale(.97)}
.plant-cell.due{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-light)}
.league-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--paper);transition:all .2s}
.league-row.you{border-color:var(--gold);background:var(--gold-light)}
.journal-input{width:100%;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:.9rem;resize:vertical}
.capsule-sealed{opacity:.6;text-align:center;padding:14px;border:1px dashed var(--border);border-radius:var(--radius-sm)}
.capsule-open{border-left:4px solid var(--gold);padding:14px;border-radius:var(--radius-sm);background:var(--paper)}
.card-flip{perspective:600px}
.card-flip-inner{position:relative;transition:transform .6s;transform-style:preserve-3d}
.card-flip:hover .card-flip-inner{transform:rotateY(180deg)}
.card-flip-front,.card-flip-back{backface-visibility:hidden;border-radius:var(--radius-sm);padding:14px;text-align:center}
.card-flip-back{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotateY(180deg)}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.wiggle{animation:wiggle .5s ease-in-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* Bottom Navigation */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;height:var(--nav-height);padding-bottom:env(safe-area-inset-bottom);z-index:100;box-shadow:0 -2px 12px rgba(31,36,48,.08)}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;color:var(--ink3);font-size:.65rem;transition:all .2s;position:relative}
.bottom-nav button.active{color:var(--gold)}
.bottom-nav button .nav-icon{font-size:1.4rem;transition:transform .2s}
.bottom-nav button.active .nav-icon{transform:scale(1.1)}
.bottom-nav button .nav-label{font-weight:600}
.bottom-nav button .nav-dot{position:absolute;top:4px;right:8px;width:6px;height:6px;border-radius:50%;background:#ef5350}

/* Splash Screen */
.splash{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10001;transition:opacity .5s ease}
.splash.hidden{opacity:0;pointer-events:none}
.splash-logo{font-size:5rem;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}
.splash-title{font-family:var(--font-serif);font-size:2rem;color:var(--gold);margin-bottom:8px}
.splash-sub{color:var(--ink3);font-size:1rem;margin-bottom:24px}
.splash-loader{width:120px;height:3px;background:var(--cream3);border-radius:2px;overflow:hidden}
.splash-loader-bar{width:0;height:100%;background:var(--gold);border-radius:2px;transition:width .3s ease}

/* Dark Mode */
.dark{--cream:#1a1d23;--cream2:#252830;--cream3:#353840;--ink:#e8e6e3;--ink2:#b8b5b0;--ink3:#8a8780;--paper:#202328;--border:#3a3d45;--shadow:0 2px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 32px rgba(0,0,0,.4)}
.dark .bottom-nav{background:var(--paper);border-color:var(--border)}

/* Rate Prompt */
.rate-prompt{position:fixed;bottom:80px;left:16px;right:16px;background:var(--paper);border:1px solid var(--gold);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-lg);z-index:9999;animation:slideUp .3s ease}
.rate-prompt .stars{font-size:2rem;text-align:center;margin-bottom:8px}
.rate-prompt .actions{display:flex;gap:8px;margin-top:12px}

/* Continue CTA */
.continue-card{background:linear-gradient(135deg,var(--gold-light),#fffdf8);border:2px solid var(--gold);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;margin-bottom:16px}
.continue-card:active{transform:scale(.98)}
.continue-card .realm-tag{font-size:.7rem;color:var(--gold2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.continue-card .lesson-title{font-weight:700;font-size:1rem;margin-bottom:2px}
.continue-card .lesson-hint{font-size:.8rem;color:var(--ink3)}

/* Responsive */
@media(max-width:400px){
  .card{padding:14px}
  .card-lg{padding:18px}
  h1{font-size:1.5rem}
  h2{font-size:1.25rem}
  .bottom-nav button{padding:6px 8px}
}
</style>
</head>
