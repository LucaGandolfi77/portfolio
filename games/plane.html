<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Ace</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 1px 1px 2px black; font-weight: bold; }
        .modal-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); color: white; padding: 40px; text-align: center;
            display: none; border-radius: 15px; pointer-events: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            min-width: 300px;
        }
        button { 
            padding: 12px 24px; font-size: 1.2rem; cursor: pointer; 
            background: #ff9800; border: none; border-radius: 5px; color: white; font-weight: bold;
            transition: transform 0.1s;
            margin-top: 20px;
        }
        button:hover { transform: scale(1.05); background: #f57c00; }
        #controls-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.9); font-size: 1rem; pointer-events: none;
            background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 20px;
        }
        #back-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.3); padding: 10px 20px;
            border-radius: 8px; color: white; text-decoration: none;
            font-size: 0.9rem; pointer-events: auto; border: 1px solid rgba(255,255,255,0.2);
        }
        #back-btn:hover { background: rgba(0,0,0,0.5); }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .btn-area {
            position: absolute;
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
            border: 2px solid rgba(255,255,255,0.4);
            font-size: 0.8rem;
        }
        /* D-Pad style on left */
        #btn-up { left: 80px; bottom: 100px; }
        #btn-down { left: 80px; bottom: 20px; }
        #btn-left { left: 20px; bottom: 60px; }
        #btn-right { left: 140px; bottom: 60px; }
        
        /* Actions on right */
        #btn-fire { right: 30px; bottom: 40px; background: rgba(255,50,50,0.3); border-color: rgba(255,100,100,0.5); width: 80px; height: 80px; font-size: 1rem; }

        @media (max-width: 768px) {
            .mobile-controls { display: block; }
            #controls-hint { display: none; }
        }
    </style>
</head>
<body>
    <a href="index.html" id="back-btn">Exit Game</a>
    
    <div id="ui">
        <h2 style="margin:0 0 10px 0">Sky Ace</h2>
        <div style="font-size: 1.2rem;">Level: <span id="level-display">1</span></div>
        <div style="font-size: 1rem;">Enemies: <span id="enemies-left">0</span></div>
        <div style="font-size: 1rem; margin-top:5px;">Health: <span id="health" style="color:#4caf50">100</span>%</div>
    </div>

    <div id="controls-hint">ARROWS to Fly • SPACE to Shoot</div>

    <div id="game-over" class="modal-screen">
        <h2 style="font-size: 2.5rem; margin-bottom: 10px; color: #ff4d4d;">MISSION FAILED</h2>
        <p style="font-size: 1.2rem;">You were shot down.</p>
        <button onclick="location.reload()">Retry Mission</button>
    </div>

    <div id="level-complete" class="modal-screen">
        <h2 style="font-size: 2.5rem; margin-bottom: 10px; color: #4caf50;">MISSION ACCOMPLISHED</h2>
        <p style="font-size: 1.2rem;">Area Cleared!</p>
        <button onclick="nextLevel()">Start Next Mission</button>
    </div>
    
    <div id="game-win" class="modal-screen">
        <h2 style="font-size: 2.5rem; margin-bottom: 10px; color: #ffd700;">VICTORY!</h2>
        <p style="font-size: 1.2rem;">You are the Sky Ace!</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <div class="mobile-controls">
        <div id="btn-up" class="btn-area">UP</div>
        <div id="btn-down" class="btn-area">DOWN</div>
        <div id="btn-left" class="btn-area">LEFT</div>
        <div id="btn-right" class="btn-area">RIGHT</div>
        <div id="btn-fire" class="btn-area">FIRE</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let level = 1;
        let worldWidth = 0;
        let cameraX = 0;
        let gameOver = false;
        let gamePaused = false;
        
        // Entities
        const player = {
            x: 100,
            y: 200,
            width: 50,
            height: 20,
            vx: 0,
            vy: 0,
            speed: 6,
            angle: 0,
            health: 100,
            reload: 0
        };

        let enemies = [];
        let projectiles = [];
        let particles = [];
        let clouds = [];

        // Input
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, s: false, a: false, d: false,
            " ": false
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Listeners
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Mobile Input
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
            }
        };
        bindTouch('btn-up', 'ArrowUp');
        bindTouch('btn-down', 'ArrowDown');
        bindTouch('btn-left', 'ArrowLeft');
        bindTouch('btn-right', 'ArrowRight');
        bindTouch('btn-fire', ' ');

        function initLevel(lvl) {
            level = lvl;
            gameOver = false;
            gamePaused = false;
            
            // Level Config
            worldWidth = 3000 + (lvl * 2000); // Lvl 1: 5000, Lvl 2: 7000
            const enemyCount = 10 + (lvl * 10);
            
            // Reset Player
            player.x = 100;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            player.health = 100;
            player.angle = 0;
            
            // Reset Entities
            enemies = [];
            projectiles = [];
            particles = [];
            cameraX = 0;
            
            // Spawn Enemies
            for(let i=0; i<enemyCount; i++) {
                spawnEnemy(i, enemyCount);
            }
            
            // Init Clouds
            clouds = [];
            for(let i=0; i<30; i++) {
                clouds.push({
                    x: Math.random() * worldWidth,
                    y: Math.random() * (canvas.height/2),
                    w: 60 + Math.random() * 100,
                    speed: 0.2 + Math.random() * 0.5
                });
            }

            // UI
            document.querySelectorAll('.modal-screen').forEach(el => el.style.display = 'none');
            updateUI();
        }

        function spawnEnemy(index, total) {
            const type = Math.random() > 0.6 ? 'air' : 'ground';
            // Spread enemies across the map, starting from x=800
            const minX = 800;
            const maxX = worldWidth - 200;
            const x = minX + Math.random() * (maxX - minX);
            
            let enemy = {
                x: x,
                y: 0,
                w: 40,
                h: 30,
                hp: level === 1 ? 2 : 4, // Harder in lvl 2
                type: type,
                color: type === 'ground' ? '#556b2f' : '#8b0000',
                reload: Math.random() * 200,
                fireRate: level === 1 ? 150 : 100
            };

            if (type === 'ground') {
                enemy.y = canvas.height - 60;
                enemy.w = 50;
                enemy.h = 30;
            } else {
                enemy.y = 50 + Math.random() * (canvas.height - 200);
                enemy.w = 40;
                enemy.h = 20;
            }
            enemies.push(enemy);
        }

        function nextLevel() {
            if (level < 2) {
                initLevel(level + 1);
            } else {
                // Game Win
                document.getElementById('game-win').style.display = 'block';
            }
        }

        function updateUI() {
            document.getElementById('level-display').innerText = level;
            document.getElementById('enemies-left').innerText = enemies.length;
            document.getElementById('health').innerText = Math.floor(player.health);
        }

        function update() {
            if (gameOver || gamePaused) return;

            // --- Player Movement ---
            let targetVx = 0;
            let targetVy = 0;
            let targetAngle = 0;

            if (keys.ArrowUp || keys.w) targetVy = -player.speed;
            if (keys.ArrowDown || keys.s) targetVy = player.speed;
            if (keys.ArrowLeft || keys.a) targetVx = -player.speed;
            if (keys.ArrowRight || keys.d) targetVx = player.speed;

            // Physics
            player.vx += (targetVx - player.vx) * 0.1;
            player.vy += (targetVy - player.vy) * 0.1;
            
            player.x += player.vx;
            player.y += player.vy;

            // Angle based on velocity
            targetAngle = player.vy * 0.05;
            player.angle += (targetAngle - player.angle) * 0.1;

            // Bounds
            if (player.y < 20) player.y = 20; // Ceiling
            if (player.y > canvas.height - 60) { // Floor
                player.y = canvas.height - 60;
                if (player.vy > 4) damagePlayer(10); // Crash
            }
            if (player.x < 50) player.x = 50;
            if (player.x > worldWidth - 50) player.x = worldWidth - 50;

            // Camera Follow
            // Center camera on player, but clamp to world bounds
            let targetCamX = player.x - canvas.width / 3;
            if (targetCamX < 0) targetCamX = 0;
            if (targetCamX > worldWidth - canvas.width) targetCamX = worldWidth - canvas.width;
            
            // Smooth camera
            cameraX += (targetCamX - cameraX) * 0.1;

            // Shooting
            if (player.reload > 0) player.reload--;
            if (keys[" "] && player.reload <= 0) {
                projectiles.push({
                    x: player.x + 20,
                    y: player.y + 5,
                    vx: Math.cos(player.angle) * 15 + player.vx,
                    vy: Math.sin(player.angle) * 15 + player.vy,
                    owner: 'player',
                    life: 100,
                    color: '#fff'
                });
                player.reload = 10;
            }

            // --- Enemies ---
            enemies.forEach(e => {
                // AI: Air enemies move slightly
                if (e.type === 'air') {
                    // Bobbing
                    e.y += Math.sin(Date.now() / 500) * 0.5;
                    
                    // Move towards player if close
                    const dist = Math.abs(player.x - e.x);
                    if (dist < 600) {
                        if (e.x > player.x + 200) e.x -= 1;
                        if (e.x < player.x - 200) e.x += 1;
                    }
                }

                // Shooting
                const dist = Math.sqrt((player.x - e.x)**2 + (player.y - e.y)**2);
                if (dist < 800) { // Range
                    e.reload--;
                    if (e.reload <= 0) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        projectiles.push({
                            x: e.x,
                            y: e.y,
                            vx: Math.cos(angle) * 6,
                            vy: Math.sin(angle) * 6,
                            owner: 'enemy',
                            life: 200,
                            color: '#ff0'
                        });
                        e.reload = e.fireRate;
                    }
                }
            });

            // --- Projectiles ---
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                let hit = false;
                
                // Ground collision
                if (p.y > canvas.height - 40) {
                    createExplosion(p.x, p.y, '#8b4513');
                    hit = true;
                }

                if (!hit) {
                    if (p.owner === 'player') {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let e = enemies[j];
                            if (checkRectCollide(p.x, p.y, 5, 5, e.x, e.y, e.w, e.h)) {
                                hit = true;
                                e.hp--;
                                createExplosion(p.x, p.y, '#ffaa00', 5);
                                if (e.hp <= 0) {
                                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#ff4400', 20);
                                    enemies.splice(j, 1);
                                    updateUI();
                                    checkWin();
                                }
                                break;
                            }
                        }
                    } else {
                        // Enemy bullet hitting player
                        if (checkRectCollide(p.x, p.y, 5, 5, player.x - 20, player.y - 10, 40, 20)) {
                            hit = true;
                            damagePlayer(10);
                            createExplosion(p.x, p.y, '#ff0000', 5);
                        }
                    }
                }

                if (hit || p.life <= 0) {
                    projectiles.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function checkWin() {
            if (enemies.length === 0) {
                gamePaused = true;
                if (level === 1) {
                    document.getElementById('level-complete').style.display = 'block';
                } else {
                    document.getElementById('game-win').style.display = 'block';
                }
            }
        }

        function damagePlayer(amount) {
            player.health -= amount;
            updateUI();
            if (player.health <= 0) {
                gameOver = true;
                document.getElementById('game-over').style.display = 'block';
            }
        }

        function checkRectCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function createExplosion(x, y, color, count=10) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 20 + Math.random() * 10,
                    color: color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        function draw() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Clouds (Parallax)
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.w/2, 0, Math.PI*2);
                ctx.arc(c.x + c.w*0.4, c.y - c.w*0.2, c.w*0.4, 0, Math.PI*2);
                ctx.arc(c.x - c.w*0.4, c.y - c.w*0.2, c.w*0.4, 0, Math.PI*2);
                ctx.fill();
            });

            // Ground
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 40, worldWidth, 40);
            
            // Ground details
            ctx.fillStyle = '#006400';
            for(let i=0; i<worldWidth; i+=100) {
                ctx.fillRect(i, canvas.height - 40, 20, 40);
            }
            
            // World Borders
            ctx.fillStyle = 'rgba(255,0,0,0.3)';
            ctx.fillRect(-10, 0, 10, canvas.height); // Left wall
            ctx.fillRect(worldWidth, 0, 10, canvas.height); // Right wall

            // Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                if (e.type === 'ground') {
                    // Tank
                    ctx.fillRect(e.x, e.y, e.w, e.h);
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y, 10, 0, Math.PI, true); ctx.fill();
                    // Turret
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(e.x + e.w/2, e.y); 
                    ctx.lineTo(e.x + e.w/2 + Math.cos(angle)*20, e.y + Math.sin(angle)*20);
                    ctx.stroke();
                } else {
                    // Plane
                    ctx.beginPath();
                    ctx.moveTo(e.x, e.y);
                    ctx.lineTo(e.x + e.w, e.y + e.h/2);
                    ctx.lineTo(e.x, e.y + e.h);
                    ctx.fill();
                }
            });

            // Player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Flip if moving left?
            if (player.vx < -0.1) ctx.scale(-1, 1);

            // Body
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(-20, -10);
            ctx.lineTo(-20, 10);
            ctx.fill();
            
            // Wings
            ctx.fillStyle = '#ccc';
            ctx.fillRect(-10, -20, 10, 40);
            
            // Cockpit
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();

            // Engine flame
            if (Math.abs(player.vx) > 2) {
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(-20, 0);
                ctx.lineTo(-30 - Math.random()*10, 0);
                ctx.stroke();
            }

            ctx.restore();

            // Projectiles
            projectiles.forEach(p => {
                ctx.fillStyle = p.color || '#fff';
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 20;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start Game
        initLevel(1);
        loop();

    </script>
</body>
</html>
