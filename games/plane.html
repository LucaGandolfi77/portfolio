<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Ace</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 1px 1px 2px black; font-weight: bold; }
        .modal-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); color: white; padding: 40px; text-align: center;
            display: none; border-radius: 15px; pointer-events: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            min-width: 300px;
        }
        button { 
            padding: 12px 24px; font-size: 1.2rem; cursor: pointer; 
            background: #ff9800; border: none; border-radius: 5px; color: white; font-weight: bold;
            transition: transform 0.1s;
            margin-top: 20px;
        }
        button:hover { transform: scale(1.05); background: #f57c00; }
        #controls-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.9); font-size: 1rem; pointer-events: none;
            background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 20px;
        }
        #back-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.3); padding: 10px 20px;
            border-radius: 8px; color: white; text-decoration: none;
            font-size: 0.9rem; pointer-events: auto; border: 1px solid rgba(255,255,255,0.2);
        }
        #back-btn:hover { background: rgba(0,0,0,0.5); }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .btn-area {
            position: absolute;
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
            border: 2px solid rgba(255,255,255,0.4);
            font-size: 0.8rem;
        }
        /* D-Pad style on left */
        #btn-up { left: 80px; bottom: 100px; }
        #btn-down { left: 80px; bottom: 20px; }
        #btn-left { left: 20px; bottom: 60px; }
        #btn-right { left: 140px; bottom: 60px; }
        
        /* Actions on right */
        #btn-fire { right: 30px; bottom: 40px; background: rgba(255,50,50,0.3); border-color: rgba(255,100,100,0.5); width: 80px; height: 80px; font-size: 1rem; }
        /* Bomb button shown to the left of FIRE on touch devices */
        #btn-bomb { right: 120px; bottom: 40px; background: rgba(255,200,50,0.25); border-color: rgba(255,200,50,0.5); width: 80px; height: 80px; font-size: 1rem; }

        @media (max-width: 768px) {
            .mobile-controls { display: block; }
            #controls-hint { display: none; }
        }
        /* Also show mobile controls on touch-capable devices (iPhone, Android) */
        @media (pointer: coarse) {
            .mobile-controls { display: block; }
            #controls-hint { display: none; }
        }
    </style>
</head>
<body>
    <a href="index.html" id="back-btn">Exit Game</a>
    
    <div id="ui">
        <h2 style="margin:0 0 10px 0">Sky Ace</h2>
        <div style="font-size: 1.2rem;">Level: <span id="level-display">1</span></div>
        <div style="font-size: 1rem;">Enemies: <span id="enemies-left">0</span></div>
        <div style="font-size: 1rem; margin-top:5px;">Health: <span id="health" style="color:#4caf50">100</span>%</div>
    </div>

    <div id="controls-hint">ARROWS to Fly • SPACE to Shoot</div>

    <div id="game-over" class="modal-screen">
        <h2 style="font-size: 2.5rem; margin-bottom: 10px; color: #ff4d4d;">MISSION FAILED</h2>
        <p style="font-size: 1.2rem;">You were shot down.</p>
        <button onclick="location.reload()">Retry Mission</button>
    </div>

    <div id="level-complete" class="modal-screen">
        <h2 style="font-size: 2.5rem; margin-bottom: 10px; color: #4caf50;">MISSION ACCOMPLISHED</h2>
        <p style="font-size: 1.2rem;">Area Cleared!</p>
        <button onclick="nextLevel()">Start Next Mission</button>
    </div>
    
    <div id="game-win" class="modal-screen">
        <h2 style="font-size: 2.5rem; margin-bottom: 10px; color: #ffd700;">VICTORY!</h2>
        <p style="font-size: 1.2rem;">You are the Sky Ace!</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <div class="mobile-controls">
        <div id="btn-up" class="btn-area">UP</div>
        <div id="btn-down" class="btn-area">DOWN</div>
        <div id="btn-left" class="btn-area">LEFT</div>
        <div id="btn-right" class="btn-area">RIGHT</div>
        <div id="btn-fire" class="btn-area">FIRE</div>
        <div id="btn-bomb" class="btn-area">BOMB</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let level = 1;
        let worldWidth = 0;
        let cameraX = 0;
        let gameOver = false;
        let gamePaused = false;
        
        // Entities
        const player = {
            x: 100,
            y: 200,
            width: 50,
            height: 20,
            vx: 6,
            vy: 0,
            speed: 6,
            angle: 0, // radians: 0 = right
            targetAngle: 0,
            health: 100,
            reload: 0
        };

        let enemies = [];
        let projectiles = [];
        let bombs = [];
        let particles = [];
        let clouds = [];

        // Input
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, s: false, a: false, d: false,
            " ": false
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Listeners
        window.addEventListener('keydown', e => {
            // single-key actions
            if (e.key === 'b' || e.key === 'B') { dropBomb(); }
            else keys[e.key] = true;
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Mobile Input
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
            }
        };
        bindTouch('btn-up', 'ArrowUp');
        bindTouch('btn-down', 'ArrowDown');
        bindTouch('btn-left', 'ArrowLeft');
        bindTouch('btn-right', 'ArrowRight');
        bindTouch('btn-fire', ' ');
        // Add mouse/touch handlers for FIRE and BOMB UI buttons
        const fireEl = document.getElementById('btn-fire');
        if (fireEl) {
            // touch handlers already bound via bindTouch, add mouse support
            fireEl.addEventListener('mousedown', e => { e.preventDefault(); keys[' '] = true; });
            fireEl.addEventListener('mouseup', e => { e.preventDefault(); keys[' '] = false; });
            fireEl.addEventListener('mouseleave', e => { keys[' '] = false; });
        }

        const bombEl = document.getElementById('btn-bomb');
        if (bombEl) {
            bombEl.addEventListener('touchstart', e => { e.preventDefault(); dropBomb(); }, { passive: false });
            bombEl.addEventListener('mousedown', e => { e.preventDefault(); dropBomb(); });
            bombEl.addEventListener('click', e => { e.preventDefault(); dropBomb(); });
        }

        // iPhone / touch controls: joystick on left half, fire on right half, long-press or two-finger for bomb
        (function setupTouchControls(){
            let longPressTimer = null;
            const LONGPRESS_MS = 600;
            const MAX_PITCH = 0.9; // radians max pitch for touch

            function handleTouchStart(e){
                // prevent default scrolling/zooming
                e.preventDefault();
                const touches = e.touches;
                // two-finger tap/drop bomb immediately
                if (touches.length >= 2) {
                    dropBomb();
                    return;
                }
                const t = touches[0];
                const x = t.clientX;
                const y = t.clientY;

                if (x < window.innerWidth / 2) {
                    // left half: set target angle based on vertical touch position
                    const norm = 1 - (y / canvas.height); // 0..1 top..bottom
                    player.targetAngle = (norm - 0.5) * 2 * MAX_PITCH;
                } else {
                    // right half: start firing and set up long-press to drop bomb
                    keys[' '] = true;
                    longPressTimer = setTimeout(() => { dropBomb(); longPressTimer = null; }, LONGPRESS_MS);
                }
            }

            function handleTouchMove(e){
                e.preventDefault();
                const touches = e.touches;
                if (touches.length === 0) return;
                const t = touches[0];
                const x = t.clientX;
                const y = t.clientY;
                if (x < window.innerWidth / 2) {
                    const norm = 1 - (y / canvas.height);
                    player.targetAngle = (norm - 0.5) * 2 * MAX_PITCH;
                }
            }

            function handleTouchEnd(e){
                e.preventDefault();
                // stop firing and cancel longpress
                keys[' '] = false;
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            }

            // Use non-passive listeners so we can preventDefault on iPhone
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });
        })();

        function initLevel(lvl) {
            level = lvl;
            gameOver = false;
            gamePaused = false;
            
            // Level Config
            worldWidth = 3000 + (lvl * 2000); // Lvl 1: 5000, Lvl 2: 7000
            const enemyCount = 10 + (lvl * 10);
            
            // Reset Player
            player.x = 100;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            player.health = 100;
            player.angle = 0;
            player.targetAngle = 0;
            
            // Reset Entities
            enemies = [];
            projectiles = [];
            particles = [];
            cameraX = 0;
            
            // Spawn Enemies
            for(let i=0; i<enemyCount; i++) {
                spawnEnemy(i, enemyCount);
            }
            
            // Init Clouds
            clouds = [];
            for(let i=0; i<30; i++) {
                clouds.push({
                    x: Math.random() * worldWidth,
                    y: Math.random() * (canvas.height/2),
                    w: 60 + Math.random() * 100,
                    speed: 0.2 + Math.random() * 0.5
                });
            }

            // UI
            document.querySelectorAll('.modal-screen').forEach(el => el.style.display = 'none');
            updateUI();
        }

        function spawnEnemy(index, total) {
            const type = Math.random() > 0.6 ? 'air' : 'ground';
            // Spread enemies across the map, starting from x=800
            const minX = 800;
            const maxX = worldWidth - 200;
            const x = minX + Math.random() * (maxX - minX);
            
            let enemy = {
                x: x,
                y: 0,
                w: 40,
                h: 30,
                hp: level === 1 ? 2 : 4, // Harder in lvl 2
                type: type,
                color: type === 'ground' ? '#556b2f' : '#8b0000',
                reload: Math.random() * 200,
                fireRate: level === 1 ? 150 : 100
            };

            if (type === 'ground') {
                enemy.y = canvas.height - 60;
                enemy.w = 50;
                enemy.h = 30;
            } else {
                enemy.y = 50 + Math.random() * (canvas.height - 200);
                enemy.w = 40;
                enemy.h = 20;
            }
            enemies.push(enemy);
        }

        function nextLevel() {
            if (level < 2) {
                initLevel(level + 1);
            } else {
                // Game Win
                document.getElementById('game-win').style.display = 'block';
            }
        }

        function updateUI() {
            document.getElementById('level-display').innerText = level;
            document.getElementById('enemies-left').innerText = enemies.length;
            document.getElementById('health').innerText = Math.floor(player.health);
        }

        function update() {
            if (gameOver || gamePaused) return;
            // --- Player Movement (forward flight with pitch control) ---
            // Controls: up/down change pitch (targetAngle). Plane always moves forward along its angle.
            const pitchSpeed = 0.035; // radians per frame when holding up/down
            if (keys.ArrowUp || keys.w) player.targetAngle -= pitchSpeed;
            if (keys.ArrowDown || keys.s) player.targetAngle += pitchSpeed;

            // Smooth angle change
            player.angle += (player.targetAngle - player.angle) * 0.08;

            // Compute forward velocity from angle
            player.vx = Math.cos(player.angle) * player.speed;
            player.vy = Math.sin(player.angle) * player.speed;

            // Move
            player.x += player.vx;
            player.y += player.vy;

            // Bounds
            if (player.y < 20) player.y = 20; // Ceiling
            if (player.y > canvas.height - 60) { // Floor
                player.y = canvas.height - 60;
                if (player.vy > 4) damagePlayer(10); // Crash
            }
            if (player.x < 50) player.x = 50;
            if (player.x > worldWidth - 50) player.x = worldWidth - 50;

            // Camera Follow
            // Center camera on player, but clamp to world bounds
            let targetCamX = player.x - canvas.width / 3;
            if (targetCamX < 0) targetCamX = 0;
            if (targetCamX > worldWidth - canvas.width) targetCamX = worldWidth - canvas.width;
            
            // Smooth camera
            cameraX += (targetCamX - cameraX) * 0.1;

            // Shooting (fires from plane's nose along angle)
            if (player.reload > 0) player.reload--;
            if (keys[" "] && player.reload <= 0) {
                const muzzleSpeed = 15;
                const noseX = player.x + Math.cos(player.angle) * 30;
                const noseY = player.y + Math.sin(player.angle) * 30;
                projectiles.push({
                    x: noseX,
                    y: noseY,
                    vx: Math.cos(player.angle) * muzzleSpeed + player.vx,
                    vy: Math.sin(player.angle) * muzzleSpeed + player.vy,
                    owner: 'player',
                    life: 100,
                    color: '#fff'
                });
                player.reload = 10;
            }

            // Bombs update
            for (let bi = bombs.length - 1; bi >= 0; bi--) {
                const b = bombs[bi];
                // gravity
                b.vy += b.g;
                    b.x += b.vx;
                    b.y += b.vy;

                    // trail particles (smoke + ember)
                    // small semi-transparent smoke
                    particles.push({ x: b.x, y: b.y, vx: -b.vx*0.15 + (Math.random()-0.5), vy: -0.5 + (Math.random()-0.5)*0.5, life: 18 + Math.random()*12, color: 'rgba(120,120,120,0.5)', size: 3 + Math.random()*3 });
                    // occasional ember
                    if (Math.random() < 0.3) particles.push({ x: b.x, y: b.y, vx: -b.vx*0.2 + (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: 8+Math.random()*8, color: 'rgba(255,150,60,0.9)', size: 2 });

                // simple ground collision
                    if (b.y > canvas.height - 40) {
                            // explosion that also damages enemies within radius (colorful)
                            createExplosion(b.x, canvas.height - 60, '#ff6600', 60, { radius: 140, damage: 120, colorful: true });
                        bombs.splice(bi, 1);
                    }
            }

            // --- Enemies ---
            enemies.forEach(e => {
                // AI: Air enemies move slightly
                if (e.type === 'air') {
                    // Bobbing
                    e.y += Math.sin(Date.now() / 500) * 0.5;
                    
                    // Move towards player if close
                    const dist = Math.abs(player.x - e.x);
                    if (dist < 600) {
                        if (e.x > player.x + 200) e.x -= 1;
                        if (e.x < player.x - 200) e.x += 1;
                    }
                }

                // Shooting
                const dist = Math.sqrt((player.x - e.x)**2 + (player.y - e.y)**2);
                if (dist < 800) { // Range
                    e.reload--;
                    if (e.reload <= 0) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        projectiles.push({
                            x: e.x,
                            y: e.y,
                            vx: Math.cos(angle) * 6,
                            vy: Math.sin(angle) * 6,
                            owner: 'enemy',
                            life: 200,
                            color: '#ff0'
                        });
                        e.reload = e.fireRate;
                    }
                }
            });

            // --- Projectiles ---
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                let hit = false;
                
                // Ground collision
                if (p.y > canvas.height - 40) {
                    createExplosion(p.x, p.y, '#8b4513');
                    hit = true;
                }

                if (!hit) {
                    if (p.owner === 'player') {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let e = enemies[j];
                            if (checkRectCollide(p.x, p.y, 5, 5, e.x, e.y, e.w, e.h)) {
                                hit = true;
                                e.hp--;
                                createExplosion(p.x, p.y, '#ffaa00', 5);
                                if (e.hp <= 0) {
                                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#ff4400', 20);
                                    enemies.splice(j, 1);
                                    updateUI();
                                    checkWin();
                                }
                                break;
                            }
                        }
                    } else {
                        // Enemy bullet hitting player
                        if (checkRectCollide(p.x, p.y, 5, 5, player.x - 20, player.y - 10, 40, 20)) {
                            hit = true;
                            damagePlayer(10);
                            createExplosion(p.x, p.y, '#ff0000', 5);
                        }
                    }
                }

                if (hit || p.life <= 0) {
                    projectiles.splice(i, 1);
                }
            }


            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

                // Bombs drawing handled in draw()
        }

        function checkWin() {
            if (enemies.length === 0) {
                gamePaused = true;
                if (level === 1) {
                    document.getElementById('level-complete').style.display = 'block';
                } else {
                    document.getElementById('game-win').style.display = 'block';
                }
            }
        }

        function damagePlayer(amount) {
            player.health -= amount;
            updateUI();
            if (player.health <= 0) {
                gameOver = true;
                document.getElementById('game-over').style.display = 'block';
            }
        }

        function checkRectCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function createExplosion(x, y, color, count=10, options = {}) {
            // spawn visual particles
            // flash + colorful burst for bomb explosions when requested
            const colorful = options.colorful || false;
            for(let i=0; i<count; i++) {
                if (colorful) {
                    // generate hues around orange/red
                    const t = Math.random();
                    const r = 200 + Math.floor(Math.random()*55);
                    const g = 80 + Math.floor(Math.random()*120);
                    const b = Math.floor(Math.random()*40);
                    const col = `rgba(${r},${g},${b},${0.9 - Math.random()*0.5})`;
                    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 20 + Math.random() * 30, color: col, size: 3 + Math.random() * 6 });
                } else {
                    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 20 + Math.random() * 10, color: color, size: 2 + Math.random() * 3 });
                }
            }

            // add a bright flash particle (short-lived, large)
            particles.push({ x: x, y: y, vx: 0, vy: 0, life: 8, color: 'rgba(255,240,200,0.95)', size: 18 });

            // optional damage to enemies within radius
            const radius = options.radius || 0;
            const damage = options.damage || 0;
            if (radius > 0 && damage > 0) {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    // approximate enemy center
                    const ex = e.x + (e.w || 0) / 2;
                    const ey = e.y + (e.h || 0) / 2;
                    const dx = ex - x;
                    const dy = ey - y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist <= radius) {
                        // scale damage by proximity (closer -> more damage)
                        const frac = 1 - (dist / radius);
                        const dealt = Math.max(1, Math.round(damage * frac));
                        e.hp -= dealt;
                        // small hit particle burst on enemy
                        for (let p = 0; p < 6; p++) {
                            particles.push({ x: ex, y: ey, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 10+Math.random()*10, color: '#ffcc66', size: 2 });
                        }
                        if (e.hp <= 0) {
                            // remove enemy and create bigger explosion
                            createExplosion(ex, ey, '#ff4400', 12);
                            enemies.splice(i, 1);
                            updateUI();
                            checkWin();
                        }
                    }
                }
            }
        }

        // Drop a bomb from the plane
        function dropBomb() {
            // spawn bomb at plane nose, initial horizontal speed similar to plane
            const noseX = player.x + Math.cos(player.angle) * 30;
            const noseY = player.y + Math.sin(player.angle) * 30;
            bombs.push({
                x: noseX,
                y: noseY + 10,
                vx: player.vx * 0.9 + Math.cos(player.angle) * 1.5,
                vy: player.vy + 2,
                g: 0.35
            });

            // initial launch flare + a few ember particles
            createExplosion(noseX, noseY, '#ffcc33', 8, { colorful: false });
            for (let i=0;i<6;i++) particles.push({ x: noseX, y: noseY, vx: -player.vx*0.2 + (Math.random()-0.5)*3, vy: (Math.random()-0.5)*2, life: 10+Math.random()*10, color: 'rgba(255,180,60,0.95)', size: 2+Math.random()*3 });
        }

        function draw() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Clouds (Parallax)
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.w/2, 0, Math.PI*2);
                ctx.arc(c.x + c.w*0.4, c.y - c.w*0.2, c.w*0.4, 0, Math.PI*2);
                ctx.arc(c.x - c.w*0.4, c.y - c.w*0.2, c.w*0.4, 0, Math.PI*2);
                ctx.fill();
            });

            // Ground
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 40, worldWidth, 40);
            
            // Ground details
            ctx.fillStyle = '#006400';
            for(let i=0; i<worldWidth; i+=100) {
                ctx.fillRect(i, canvas.height - 40, 20, 40);
            }
            
            // World Borders
            ctx.fillStyle = 'rgba(255,0,0,0.3)';
            ctx.fillRect(-10, 0, 10, canvas.height); // Left wall
            ctx.fillRect(worldWidth, 0, 10, canvas.height); // Right wall

            // Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                if (e.type === 'ground') {
                    // Tank
                    ctx.fillRect(e.x, e.y, e.w, e.h);
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y, 10, 0, Math.PI, true); ctx.fill();
                    // Turret
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(e.x + e.w/2, e.y); 
                    ctx.lineTo(e.x + e.w/2 + Math.cos(angle)*20, e.y + Math.sin(angle)*20);
                    ctx.stroke();
                } else {
                    // Plane
                    ctx.beginPath();
                    ctx.moveTo(e.x, e.y);
                    ctx.lineTo(e.x + e.w, e.y + e.h/2);
                    ctx.lineTo(e.x, e.y + e.h);
                    ctx.fill();
                }
            });

            // Player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Flip if moving left?
            if (player.vx < -0.1) ctx.scale(-1, 1);

            // Body
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(-20, -10);
            ctx.lineTo(-20, 10);
            ctx.fill();
            
            // Wings
            ctx.fillStyle = '#ccc';
            ctx.fillRect(-10, -20, 10, 40);
            
            // Cockpit
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();

            // Engine flame
            if (Math.abs(player.vx) > 2) {
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(-20, 0);
                ctx.lineTo(-30 - Math.random()*10, 0);
                ctx.stroke();
            }

            ctx.restore();

            // Projectiles
            projectiles.forEach(p => {
                ctx.fillStyle = p.color || '#fff';
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            });

                // Bombs
                bombs.forEach(b => {
                    ctx.save();
                    ctx.fillStyle = '#aa3300';
                    ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
                    // trail
                    ctx.fillStyle = 'rgba(255,160,60,0.6)';
                    ctx.beginPath(); ctx.ellipse(b.x - b.vx*2, b.y - b.vy*2, 6, 3, 0, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 20;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start Game
        initLevel(1);
        loop();

    </script>
</body>
</html>
