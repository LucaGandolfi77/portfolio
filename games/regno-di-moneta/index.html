<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#FFF8E7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Regno di Moneta"/>
<meta name="description" content="Impara educazione finanziaria salvando il Regno di Soldania — storia, minigiochi e un impero incrementale infinito!"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<title>Il Regno di Moneta 💰</title>
<style>
:root {
  --bg:#FFF8E7; --card:#FFFFFF; --card2:#FFF3D6; --line:#E8DCC8;
  --txt:#2D2013; --dim:#9E8E78; --gold:#FF9500; --gold-light:#FFE0A0;
  --green:#4CAF50; --green-dark:#2E7D32; --red:#E53935; --red-light:#FFCDD2;
  --blue:#2196F3; --purple:#9C27B0; --cyan:#00BCD4;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);user-select:none;-webkit-user-select:none}

/* === SHELL === */
#app{width:100%;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:calc(8px+var(--safe-t)) 10px calc(8px+var(--safe-b));overflow:hidden}

/* === HEADER === */
.hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-radius:16px;border:2px solid var(--line);margin-bottom:8px}
.hdr .logo{font-size:22px;flex-shrink:0}
.hdr .title{font-size:15px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .money{font-size:14px;font-weight:800;color:var(--green-dark);background:var(--green);background:linear-gradient(135deg,#A5D6A7,#66BB6A);color:#fff;padding:4px 10px;border-radius:10px;white-space:nowrap}
.hdr .money.broke{background:linear-gradient(135deg,#EF9A9A,#E53935)}
.hdr .back{font-size:18px;width:36px;height:36px;border-radius:10px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}

/* === CHAPTER BAR === */
.chbar{display:flex;gap:4px;overflow-x:auto;padding:4px 0;margin-bottom:8px;scrollbar-width:none}
.chbar::-webkit-scrollbar{display:none}
.chap{flex:none;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:11px;font-weight:700;cursor:pointer;text-align:center;min-width:44px;transition:all .15s}
.chap.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chap.done{background:var(--green);color:#fff;border-color:var(--green)}
.chap.locked{opacity:.35;pointer-events:none}
.chap .emoji{font-size:16px;display:block;line-height:1}

/* === PROGRESS === */
.prog-wrap{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prog{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:5px;transition:width .5s}
.prog-pct{font-size:12px;font-weight:800;color:var(--gold);min-width:32px;text-align:right}

/* === STORY OVERLAY === */
#story-overlay{position:fixed;inset:0;z-index:100;display:none;background:rgba(45,32,19,.92);padding:16px;align-items:center;justify-content:center}
#story-overlay.on{display:flex}
.story-box{max-width:440px;width:100%;background:var(--card);border-radius:20px;padding:24px 20px;text-align:center;border:3px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.story-box .speaker{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.story-box .speaker.lia{color:var(--green)}
.story-box .speaker.bartolo{color:var(--blue)}
.story-box .speaker.contabilia{color:var(--purple)}
.story-box .speaker.inflazion{color:var(--red)}
.story-box .speaker.tizio{color:#FF6F00}
.story-box .portrait{font-size:48px;margin-bottom:8px}
.story-box .txt{font-size:15px;line-height:1.6;min-height:80px;color:#555;white-space:pre-wrap}
.story-box .acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.story-box .lesson{margin-top:12px;padding:10px 14px;background:var(--card2);border-radius:12px;border:2px dashed var(--gold);font-size:13px;color:#6D5A2A;text-align:left;line-height:1.5}

/* === BUTTONS === */
.btn{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--txt);padding:12px 20px;border-radius:14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .12s;min-height:44px}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.small{padding:8px 14px;font-size:12px;min-height:36px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* === MINIGAME AREA === */
#game-area{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:8px}
#game-area::-webkit-scrollbar{display:none}
.mg-title{font-size:18px;font-weight:800;text-align:center;margin:4px 0}
.mg-sub{font-size:13px;color:var(--dim);text-align:center;margin-bottom:4px}
.mg-card{background:var(--card);border-radius:16px;border:2px solid var(--line);padding:16px;margin-bottom:4px}
.mg-score{text-align:center;font-size:14px;font-weight:700;margin:8px 0}
.mg-timer{text-align:center;font-size:28px;font-weight:800;color:var(--gold);font-family:ui-monospace,Menlo,monospace}
.mg-grid{display:grid;gap:8px}
.mg-btn{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:all .12s}
.mg-btn:active{transform:scale(.97)}
.mg-btn.correct{border-color:var(--green);background:#E8F5E9;color:var(--green-dark)}
.mg-btn.wrong{border-color:var(--red);background:var(--red-light);color:var(--red)}

/* === COIN INPUT === */
.coin-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.coin{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:3px solid var(--gold);background:linear-gradient(135deg,#FFE082,#FFD54F);color:#5D4037;cursor:pointer;transition:all .12s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.coin:active{transform:scale(.9)}
.coin.selected{border-color:var(--green);background:linear-gradient(135deg,#A5D6A7,#66BB6A);color:#fff;box-shadow:0 0 0 3px rgba(76,175,80,.3)}
.coin.b500{width:56px;height:56px;background:linear-gradient(135deg,#FFCC80,#FF9800);border-color:#E65100;font-size:12px}
.coin.b200{width:52px;height:52px;background:linear-gradient(135deg,#CE93D8,#AB47BC);border-color:#6A1B9A;font-size:12px;color:#fff}

/* === MARKET === */
.market-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--card2);margin-bottom:6px}
.market-row .item-icon{font-size:28px}
.market-row .item-name{flex:1;font-weight:700;font-size:14px}
.market-row .item-price{font-size:16px;font-weight:800;color:var(--gold);min-width:60px;text-align:right}
.market-row .item-price.low{color:var(--green)}
.market-row .item-price.high{color:var(--red)}
.market-row .item-stock{font-size:11px;color:var(--dim)}

/* === TREE (compound interest) === */
.tree-wrap{position:relative;height:220px;background:linear-gradient(180deg,#87CEEB 0%,#87CEEB 60%,#8BC34A 60%,#689F38 100%);border-radius:16px;overflow:hidden}
.tree-trunk{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:20px;background:#795548;border-radius:4px}
.tree-fruit{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;animation:fruitBounce .6s ease infinite alternate}
@keyframes fruitBounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.tree-controls{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0;flex-wrap:wrap}
.tree-controls label{font-size:12px;font-weight:600}
.tree-controls input[type=range]{width:100px;accent-color:var(--gold)}
.tree-controls .val{font-size:13px;font-weight:800;color:var(--gold);min-width:40px}
.tree-result{text-align:center;font-size:14px;font-weight:700;color:var(--green-dark);padding:8px;background:#E8F5E9;border-radius:10px}

/* === RUNNER === */
.runner-wrap{position:relative;height:180px;background:linear-gradient(180deg,#E3F2FD 0%,#BBDEFB 70%,#8D6E63 70%,#6D4C41 100%);border-radius:16px;overflow:hidden}
.runner-char{position:absolute;bottom:30px;width:32px;height:32px;font-size:28px;transition:left .1s}
.runner-obj{position:absolute;bottom:30px;font-size:24px;transition:left .08s linear}
.runner-score{position:absolute;top:8px;right:12px;font-size:14px;font-weight:800;color:var(--gold);background:rgba(255,255,255,.8);padding:4px 10px;border-radius:8px}
.runner-hp{position:absolute;top:8px;left:12px;font-size:14px;font-weight:800;color:var(--red);background:rgba(255,255,255,.8);padding:4px 10px;border-radius:8px}
.runner-jump{appearance:none;border:2px solid var(--gold);background:rgba(255,255,255,.9);font-size:22px;width:100%;padding:14px;border-radius:14px;font-weight:800;cursor:pointer;margin-top:8px}

/* === THREE BASKETS === */
.basket-row{display:flex;gap:8px;margin:8px 0}
.basket{flex:1;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:var(--card);cursor:pointer;transition:all .15s}
.basket:active{transform:scale(.97)}
.basket.selected{border-color:var(--gold);background:var(--card2)}
.basket .b-icon{font-size:32px}
.basket .b-name{font-size:12px;font-weight:700;margin:4px 0}
.basket .b-desc{font-size:10px;color:var(--dim)}
.basket .b-alloc{font-size:18px;font-weight:800;color:var(--gold)}
.allocation-bar{height:16px;display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--line)}
.allocation-bar div{height:100%;transition:width .3s}

/* === BOSS === */
.boss-wrap{text-align:center}
.boss-dragon{font-size:64px;animation:dragonBounce 1s ease infinite}
@keyframes dragonBounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-3deg)}}
.boss-hp-bar{height:20px;background:var(--line);border-radius:10px;margin:8px 0;overflow:hidden;border:2px solid var(--red)}
.boss-hp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#FF7043);border-radius:10px;transition:width .4s}
.boss-timer{font-size:14px;font-weight:700;color:var(--red)}
.boss-q{font-size:16px;font-weight:700;margin:12px 0;min-height:60px;line-height:1.4}
.boss-answers{display:grid;gap:8px}

/* === EMPIRE === */
.emp-hdr{text-align:center;padding:8px}
.emp-hdr .emp-money{font-size:28px;font-weight:800;color:var(--green-dark);font-family:ui-monospace,Menlo,monospace}
.emp-hdr .emp-rate{font-size:12px;color:var(--dim)}
.emp-nav{display:flex;gap:4px;margin:8px 0;overflow-x:auto;scrollbar-width:none}
.emp-nav::-webkit-scrollbar{display:none}
.emp-tab{flex:none;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.emp-tab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.emp-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:8px}
.emp-scroll::-webkit-scrollbar{display:none}
.emp-bld{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line);margin-bottom:8px}
.emp-bld .bld-icon{font-size:36px;flex-shrink:0}
.emp-bld .bld-info{flex:1;min-width:0}
.emp-bld .bld-name{font-size:14px;font-weight:700}
.emp-bld .bld-desc{font-size:11px;color:var(--dim);margin:2px 0}
.emp-bld .bld-level{font-size:11px;color:var(--gold);font-weight:700}
.emp-bld .bld-btn{appearance:none;border:2px solid var(--gold);background:var(--card2);color:var(--txt);padding:8px 14px;border-radius:10px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.emp-bld .bld-btn:active{transform:scale(.96)}
.emp-bld .bld-btn[disabled]{opacity:.35;pointer-events:none}
.emp-event{padding:12px;border-radius:14px;border:2px solid var(--gold);background:var(--card2);margin-bottom:8px;text-align:center}
.emp-event .ev-title{font-size:14px;font-weight:700;margin-bottom:4px}
.emp-event .ev-desc{font-size:12px;color:#6D5A2A;line-height:1.4;margin-bottom:8px}
.emp-prestige{text-align:center;padding:16px}
.emp-prestige .prestige-btn{appearance:none;border:3px solid var(--purple);background:linear-gradient(135deg,#CE93D8,#9C27B0);color:#fff;padding:14px 24px;border-radius:16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;width:100%}
.emp-prestige .prestige-info{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.4}
.emp-stats{padding:8px}
.emp-stats .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.emp-stats .stat-row .stat-val{font-weight:700;color:var(--gold)}

/* === MODAL === */
#modal{position:fixed;inset:0;z-index:200;display:none;background:rgba(45,32,19,.85);align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.modal-box{max-width:400px;width:100%;background:var(--card);border-radius:20px;padding:24px;text-align:center;border:3px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.modal-box .modal-icon{font-size:48px;margin-bottom:8px}
.modal-box .modal-title{font-size:20px;font-weight:800;margin-bottom:8px}
.modal-box .modal-txt{font-size:14px;color:#555;line-height:1.5;margin-bottom:16px}

/* === MENU === */
#menu-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px 0}
#menu-view .menu-dragon{font-size:80px;animation:dragonBounce 1.5s ease infinite}
#menu-view h1{font-size:28px;font-weight:800;line-height:1.2}
#menu-view h1 span{color:var(--gold)}
#menu-view .menu-sub{font-size:14px;color:var(--dim);max-width:300px;line-height:1.5}
#menu-view .menu-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}

/* === CONTINUE BANNER === */
.continue-banner{background:var(--card2);border:2px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.continue-banner .cb-text{flex:1;text-align:left;font-size:13px;font-weight:600}
.continue-banner .cb-text small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}

/* === ANIMATIONS === */
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes coinFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.pop{animation:pop .3s ease}
.shake{animation:shake .3s ease}
.coin-float{position:fixed;font-size:20px;font-weight:800;color:var(--gold);pointer-events:none;z-index:300;animation:coinFloat .8s ease forwards}

/* === RESPONSIVE === */
@media(min-width:600px){
  #app{max-width:520px}
  .story-box,.modal-box{max-width:480px}
}
@media(max-width:360px){
  .hdr .money{font-size:12px;padding:3px 8px}
  .coin{width:42px;height:42px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
  <!-- MENU -->
  <div id="menu-view">
    <div class="menu-dragon">🐉</div>
    <h1>Il Regno di<br><span>Moneta</span> 💰</h1>
    <p class="menu-sub">Salva Soldania dal drago Inflazion imparando a gestire i soldi!</p>
    <div class="menu-actions" id="menu-actions"></div>
  </div>

  <!-- GAME (hidden until chapter selected) -->
  <div id="game-view" style="display:none">
    <div class="hdr">
      <button class="back" id="btn-menu" title="Menu">🏠</button>
      <div class="logo">💰</div>
      <div class="title" id="chapter-title">Capitolo 1</div>
      <div class="money" id="hdr-money">€0</div>
    </div>
    <div class="chbar" id="chbar"></div>
    <div class="prog-wrap">
      <div class="prog"><i id="prog-bar" style="width:0%"></i></div>
      <div class="prog-pct" id="prog-pct">0%</div>
    </div>
    <div id="game-area"></div>
  </div>
</div>

<!-- STORY OVERLAY -->
<div id="story-overlay">
  <div class="story-box">
    <div class="portrait" id="story-portrait">🧑‍🌾</div>
    <div class="speaker" id="story-speaker">Lia</div>
    <div class="txt" id="story-text"></div>
    <div class="lesson" id="story-lesson" style="display:none"></div>
    <div class="acts" id="story-acts"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="modal-icon">🏆</div>
    <div class="modal-title" id="modal-title">Titolo</div>
    <div class="modal-txt" id="modal-txt">Testo</div>
    <div class="acts" id="modal-acts"></div>
  </div>
</div>

<script src="js/story.js"></script>
<script src="js/save.js"></script>
<script src="js/minigames.js"></script>
<script src="js/empire.js"></script>
<script src="js/main.js"></script>
</body>
</html>
