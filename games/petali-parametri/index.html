<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#e8a0b4"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Petali & Parametri"/>
<meta name="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="description" content="Una storia d'amore tra una gatta e un fiore che esplora l'anima umana attraverso la filosofia e gli LLM. PWA installabile.">
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<title>Petali & Parametri 🌸</title>
<style>
:root {
  --bg:#fdf6ec; --card:#ffffff; --card2:#fff5f7; --line:#f0dde3;
  --txt:#3d2b2b; --dim:#9e8888; --pink:#e8a0b4; --pink-light:#fce4ec;
  --pink-dark:#c2185b; --sage:#a8b5a0; --sage-dark:#6b8e5a;
  --gold:#d4a853; --cream:#faf3e8; --lavender:#d5c4e0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:Georgia,'Palatino Linotype','Book Antiqua',serif;background:var(--bg);color:var(--txt);user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:calc(8px+var(--safe-t)) 10px calc(8px+var(--safe-b));overflow:hidden}

/* HEADER */
.hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-radius:16px;border:2px solid var(--line);margin-bottom:6px}
.hdr .logo{font-size:22px;flex-shrink:0}
.hdr .title{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.hdr .back{font-size:18px;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdr .money{font-size:13px;font-weight:700;color:var(--pink-dark);background:var(--pink-light);padding:4px 10px;border-radius:10px;white-space:nowrap}

/* CHAPTER BAR */
.chbar{display:flex;gap:4px;overflow-x:auto;padding:3px 0;margin-bottom:4px;scrollbar-width:none}
.chbar::-webkit-scrollbar{display:none}
.chap{flex:none;padding:5px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:10px;font-weight:700;cursor:pointer;text-align:center;min-width:40px;transition:all .15s}
.chap.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.chap.done{background:var(--sage);color:#fff;border-color:var(--sage)}
.chap.locked{opacity:.3;pointer-events:none}
.chap .emoji{font-size:14px;display:block;line-height:1}

/* PROGRESS */
.prog-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--sage));border-radius:4px;transition:width .5s}
.prog-pct{font-size:11px;font-weight:700;color:var(--pink-dark);min-width:28px;text-align:right}

/* STORY OVERLAY */
#story-overlay{position:fixed;inset:0;z-index:100;display:none;background:rgba(61,43,43,.88);padding:16px;align-items:center;justify-content:center}
#story-overlay.on{display:flex}
.story-box{max-width:440px;width:100%;background:var(--card);border-radius:24px;padding:24px 20px;text-align:center;border:3px solid var(--pink);box-shadow:0 16px 50px rgba(0,0,0,.3)}
.story-box .speaker{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.story-box .speaker.musa{color:var(--gold)}
.story-box .speaker.primo{color:var(--sage-dark)}
.story-box .speaker.aurelio{color:#7b5ea7}
.story-box .speaker.narratore{color:var(--dim)}
.story-box .portrait{font-size:44px;margin-bottom:6px}
.story-box .txt{font-size:14px;line-height:1.7;min-height:70px;color:#555;white-space:pre-wrap;font-style:italic}
.story-box .acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.story-box .lesson{margin-top:10px;padding:10px 14px;background:var(--cream);border-radius:12px;border:2px dashed var(--pink);font-size:12px;color:#6D4A3A;text-align:left;line-height:1.5}

/* CONCEPT CARD (Scheda del Sapere) */
#concept-overlay{position:fixed;inset:0;z-index:110;display:none;background:rgba(61,43,43,.92);padding:16px;align-items:center;justify-content:center}
#concept-overlay.on{display:flex}
.concept-box{max-width:460px;width:100%;background:var(--card);border-radius:20px;padding:20px;text-align:left;border:3px solid var(--lavender);box-shadow:0 16px 50px rgba(0,0,0,.4);max-height:80vh;overflow-y:auto;scrollbar-width:none}
.concept-box::-webkit-scrollbar{display:none}
.concept-box .c-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:8px;color:#7b5ea7}
.concept-box .c-body{font-size:13px;line-height:1.7;color:#444}
.concept-box .c-body b{color:var(--pink-dark)}
.concept-box .c-body .c-term{background:var(--pink-light);padding:1px 6px;border-radius:6px;font-weight:700}
.concept-box .c-body .c-paper{color:#7b5ea7;font-style:italic;font-size:12px}

/* BUTTONS */
.btn{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--txt);padding:12px 20px;border-radius:16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .12s;min-height:44px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.green{background:var(--sage);color:#fff;border-color:var(--sage)}
.btn.red{background:#e57373;color:#fff;border-color:#e57373}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.small{padding:8px 14px;font-size:12px;min-height:36px;border-radius:12px}
.btn[disabled]{opacity:.35;pointer-events:none}

/* MINIGAME AREA */
#game-area{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:8px}
#game-area::-webkit-scrollbar{display:none}
.mg-title{font-size:17px;font-weight:700;text-align:center;margin:4px 0;font-style:italic}
.mg-sub{font-size:12px;color:var(--dim);text-align:center;margin-bottom:4px;font-style:italic}
.mg-card{background:var(--card);border-radius:16px;border:2px solid var(--line);padding:14px;margin-bottom:4px}
.mg-score{text-align:center;font-size:13px;font-weight:700;margin:6px 0}
.mg-timer{text-align:center;font-size:26px;font-weight:800;color:var(--pink-dark);font-family:ui-monospace,Menlo,monospace}
.mg-grid{display:grid;gap:8px}
.mg-btn{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:all .12s;font-family:inherit}
.mg-btn:active{transform:scale(.97)}
.mg-btn.correct{border-color:var(--sage);background:#e8f5e9;color:var(--sage-dark)}
.mg-btn.wrong{border-color:#e57373;background:#ffebee;color:#c62828}

/* TOKEN GAME */
.token-text{font-size:16px;line-height:2;padding:12px;background:var(--cream);border-radius:12px;text-align:center;min-height:60px}
.token-word{display:inline-block;padding:4px 8px;margin:3px;border-radius:8px;cursor:pointer;transition:all .15s;border:2px solid transparent}
.token-word:hover{border-color:var(--pink)}
.token-word.tok{background:var(--pink-light);border-color:var(--pink);font-weight:700}
.token-word.space{background:transparent;border-color:transparent;color:var(--dim)}

/* PROBABILITY BARS */
.prob-bar{display:flex;align-items:center;gap:8px;padding:6px 0}
.prob-bar .p-label{min-width:80px;font-size:13px;font-weight:600;text-align:right}
.prob-bar .p-track{flex:1;height:24px;background:var(--cream);border-radius:12px;overflow:hidden;position:relative}
.prob-bar .p-fill{height:100%;border-radius:12px;transition:width .4s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:700;color:#fff}
.prob-bar .p-val{min-width:40px;font-size:12px;font-weight:700;color:var(--pink-dark)}

/* ATTENTION GRID */
.att-grid{display:grid;gap:2px}
.att-cell{width:100%;aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;border:2px solid transparent}
.att-cell:hover{border-color:var(--pink)}
.att-label{font-size:11px;font-weight:700;text-align:center;padding:4px;color:var(--dim)}

/* SLIDER */
.slider-wrap{display:flex;align-items:center;gap:8px;margin:6px 0}
.slider-wrap label{font-size:12px;font-weight:600;min-width:80px}
.slider-wrap input[type=range]{flex:1;accent-color:var(--pink)}
.slider-wrap .val{font-size:13px;font-weight:700;color:var(--pink-dark);min-width:40px;text-align:right}

/* CONTEXT WINDOW */
.ctx-tokens{display:flex;gap:4px;flex-wrap:wrap;padding:8px;background:var(--cream);border-radius:12px;min-height:50px;border:2px solid var(--line)}
.ctx-token{padding:6px 10px;border-radius:10px;font-size:12px;font-weight:600;background:var(--card);border:2px solid var(--line);cursor:pointer;transition:all .2s}
.ctx-token.keep{border-color:var(--sage);background:#e8f5e9}
.ctx-token.discard{border-color:#e57373;background:#ffebee;opacity:.5}
.ctx-token.entering{animation:tokenEnter .4s ease;border-color:var(--gold);background:#fff8e1}
@keyframes tokenEnter{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.ctx-window{border:3px dashed var(--pink);border-radius:12px;padding:8px;min-height:80px;position:relative}
.ctx-window .ctx-label{position:absolute;top:-10px;left:12px;background:var(--bg);padding:0 6px;font-size:10px;color:var(--pink-dark);font-weight:700}

/* PROMPT BUILDER */
.prompt-zone{min-height:80px;padding:12px;background:var(--cream);border-radius:12px;border:2px dashed var(--line);font-size:13px;line-height:1.6;color:#555;white-space:pre-wrap}
.prompt-block{display:inline-block;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:600;margin:3px;cursor:pointer;border:2px solid var(--line);transition:all .15s}
.prompt-block:active{transform:scale(.95)}
.prompt-block.role{background:#e8eaf6;border-color:#7986cb}
.prompt-block.task{background:#fff3e0;border-color:#ffb74d}
.prompt-block.example{background:#e8f5e9;border-color:#81c784}
.prompt-block.cot{background:#f3e5f5;border-color:#ba68c8}
.prompt-block.used{opacity:.4;pointer-events:none;border-style:dashed}

/* RESULT DISPLAY */
.result-box{padding:14px;background:var(--cream);border-radius:14px;border:2px solid var(--pink);font-size:14px;line-height:1.7;color:#444;font-style:italic;min-height:60px}
.result-box .r-quality{font-size:12px;font-weight:700;margin-top:8px;text-align:center;padding:4px 10px;border-radius:8px;display:inline-block}
.result-box .r-quality.good{background:#e8f5e9;color:var(--sage-dark)}
.result-box .r-quality.medium{background:#fff8e1;color:#f57f17}
.result-box .r-quality.bad{background:#ffebee;color:#c62828}

/* GARDEN */
.garden-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;padding:8px}
.garden-flower{text-align:center;padding:8px;border-radius:12px;background:var(--card);border:2px solid var(--line);cursor:pointer;transition:all .15s}
.garden-flower:active{transform:scale(.95)}
.garden-flower .gf-emoji{font-size:28px}
.garden-flower .gf-name{font-size:9px;font-weight:600;color:var(--dim);margin-top:2px}
.garden-flower .gf-rarity{font-size:8px;font-weight:700;margin-top:2px;padding:2px 6px;border-radius:6px}
.garden-flower .gf-rarity.comune{background:#e8f5e9;color:var(--sage-dark)}
.garden-flower .gf-rarity.raro{background:#e3f2fd;color:#1565c0}
.garden-flower .gf-rarity.epico{background:#f3e5f5;color:#7b1fa2}
.garden-flower .gf-rarity.mitico{background:#fff8e1;color:#f57f17}

/* MODAL */
#modal{position:fixed;inset:0;z-index:200;display:none;background:rgba(61,43,43,.85);align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.modal-box{max-width:400px;width:100%;background:var(--card);border-radius:24px;padding:24px;text-align:center;border:3px solid var(--pink);box-shadow:0 16px 50px rgba(0,0,0,.4)}
.modal-box .modal-icon{font-size:48px;margin-bottom:8px}
.modal-box .modal-title{font-size:18px;font-weight:700;margin-bottom:8px}
.modal-box .modal-txt{font-size:13px;color:#555;line-height:1.5;margin-bottom:16px}

/* MENU */
#menu-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px 0}
#menu-view .menu-art{font-size:72px;line-height:1}
#menu-view h1{font-size:26px;font-weight:700;line-height:1.2;font-style:italic}
#menu-view h1 span{color:var(--pink-dark)}
#menu-view .menu-sub{font-size:13px;color:var(--dim);max-width:300px;line-height:1.6;font-style:italic}
#menu-view .menu-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}

/* FLOATING PETALS */
@keyframes petalFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
.petal{position:fixed;font-size:16px;pointer-events:none;z-index:0;animation:petalFall linear infinite;color:var(--pink)}

/* ANIMATIONS */
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .3s ease}
.fade-in{animation:fadeIn .4s ease}

/* CONTINUE */
.continue-banner{background:var(--pink-light);border:2px solid var(--pink);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.continue-banner .cb-text{flex:1;text-align:left;font-size:13px;font-weight:600}
.continue-banner .cb-text small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}

/* RESPONSIVE */
@media(min-width:600px){#app{max-width:520px}.story-box,.concept-box,.modal-box{max-width:480px}}
@media(max-width:360px){.hdr .money{font-size:11px;padding:3px 8px}.mg-card{padding:10px}}
</style>
</head>
<body>
<div id="app">
  <!-- MENU -->
  <div id="menu-view">
    <div class="menu-art">🐱🌸</div>
    <h1>Petali &<br><span>Parametri</span></h1>
    <p class="menu-sub">Una gatta, un fiore, e l'anima di un poeta che vive nei numeri.</p>
    <div class="menu-actions" id="menu-actions"></div>
  </div>
  <!-- GAME -->
  <div id="game-view" style="display:none">
    <div class="hdr">
      <button class="back" id="btn-menu" title="Menu">🏠</button>
      <div class="logo">🌸</div>
      <div class="title" id="chapter-title"></div>
    </div>
    <div class="chbar" id="chbar"></div>
    <div class="prog-wrap">
      <div class="prog"><i id="prog-bar" style="width:0%"></i></div>
      <div class="prog-pct" id="prog-pct">0%</div>
    </div>
    <div id="game-area"></div>
  </div>
</div>
<div id="story-overlay">
  <div class="story-box">
    <div class="portrait" id="story-portrait">🐱</div>
    <div class="speaker" id="story-speaker">Musa</div>
    <div class="txt" id="story-text"></div>
    <div class="acts" id="story-acts"></div>
  </div>
</div>
<div id="concept-overlay">
  <div class="concept-box">
    <div class="c-title" id="concept-title">Scheda del Sapere</div>
    <div class="c-body" id="concept-body"></div>
    <div style="text-align:center;margin-top:12px"><button class="btn small" id="concept-close">Chiudi ✕</button></div>
  </div>
</div>
<div id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="modal-icon"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-txt" id="modal-txt"></div>
    <div class="acts" id="modal-acts"></div>
  </div>
</div>
<script src="js/story.js"></script>
<script src="js/concepts.js"></script>
<script src="js/minigames.js"></script>
<script src="js/garden.js"></script>
<script src="js/main.js"></script>
</body>
</html>
