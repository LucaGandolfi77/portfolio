<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Life — Comic Biography</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg-900:#0a1628;--bg-800:#1a2940;--accent:#00d4ff;--muted:#64c8ff;--card-bg:rgba(26,41,64,0.6);--glass:rgba(10,22,40,0.95);}
    html,body{height:100%;margin:0;font-family:'Inter',system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,var(--bg-900),var(--bg-800));color:#fff}
    .container{max-width:1100px;margin:36px auto;padding:20px}
    .hero{background:var(--card-bg);padding:30px;border-radius:14px;border:1px solid rgba(100,200,255,0.06);}
    .hero h1{font-size:1.9rem;color:var(--accent);margin:0 0 8px}
    .hero p{color:#a0c0e0}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}
    .page-card{background:rgba(255,255,255,0.03);border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.03);min-height:180px;display:flex;align-items:center;justify-content:center}
    .page-card img{max-width:100%;height:auto;border-radius:6px;display:block}
    .back{display:inline-block;margin-top:18px;padding:10px 14px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);text-decoration:none}
    .note{font-size:0.95rem;color:#cbefff;margin-top:10px}
    .lang-top-left{position:fixed;top:12px;left:12px;z-index:1002}
    .lang-top-left select{background:transparent;border:none;color:white;font-weight:600;cursor:pointer;font-size:0.95rem;padding:6px 8px;border-radius:6px}
    @media (max-width:600px){.hero h1{font-size:1.4rem}.lang-top-left select{min-height:44px;min-width:100px;padding:8px 12px;font-size:0.9rem}}
    
    /* Lightbox styles */
    .lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 2000;
      display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .lightbox.active { display: flex; opacity: 1; }
    .lightbox-content { position: relative; max-width: 95vw; max-height: 95vh; display: flex; align-items: center; justify-content: center; }
    .lightbox-img { max-width: 100%; max-height: 90vh; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    .lightbox-close {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.1); border: none; color: white;
      font-size: 2rem; width: 50px; height: 50px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; z-index: 2001;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.2); }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none; color: white;
      font-size: 2rem; width: 60px; height: 60px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; z-index: 2001;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    @media (max-width: 768px) {
      .lightbox-nav { width: 44px; height: 44px; font-size: 1.5rem; }
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
      .lightbox-close { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Previous">‹</button>
    <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Next">›</button>
    <div class="lightbox-content">
      <img src="" alt="Comic page" class="lightbox-img" id="lbImg">
    </div>
  </div>

  <div class="lang-top-left">
    <label for="langSelect" class="visually-hidden">Select language</label>
    <select id="langSelect" aria-label="Select language" title="Change language">
      <option value="en">English</option>
      <option value="it">Italiano</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
      <option value="ru">Русский</option>
      <option value="ar">العربية</option>
      <option value="he">עברית</option>
      <option value="sv">Svenska</option>
    </select>
  </div>
  <div class="container">
    <div class="hero">
      <h1 data-i18n="life.page.heading">My Life in Comics</h1>
      <p data-i18n="life.page.lead">A playful illustrated timeline of my life. Images will appear here — I will upload them to the assets/life_comic/ folder.</p>
      <div class="note" data-i18n="life.instructions.upload">Place your comic images in the folder: assets/life_comic/ as page1.jpg, page2.jpg, ...</div>
      <a href="index.html" class="back" data-i18n="life.back">Back to portfolio</a>
    </div>

    <div class="gallery" id="gallery">
      <!-- Gallery will be populated from assets/life_comic/index.json (generated by the helper script) or fall back to placeholders -->
    </div>
  </div>

  <script>
    // Minimal embedded translations (English + Italian) with same localStorage key used by main site
    const translations = {
      en: {
        life: {
          page: { heading: 'My Life in Comics', lead: 'A playful illustrated timeline of my life. Images will appear here — I will upload them to the assets/life_comic/ folder.' },
          instructions: { upload: 'Place your comic images in the folder: assets/life_comic/ as page1.jpg, page2.jpg, ...' },
          back: 'Back to portfolio'
        }
      },
      it: {
        life: {
          page: { heading: 'La mia vita a fumetti', lead: 'Una timeline illustrata e giocosa della mia vita. Le immagini compariranno qui — le caricherò nella cartella assets/life_comic/.' },
          instructions: { upload: 'Posiziona le immagini del fumetto nella cartella: assets/life_comic/ come page1.jpg, page2.jpg, ...' },
          back: 'Torna al portfolio'
        }
      }
    };

    function getNested(o, path){ return path.split('.').reduce((a,k)=> (a && a[k]!==undefined) ? a[k] : undefined, o); }
    function applyTranslations(lang){ if(!lang) lang='en'; const t = translations[lang]||translations['en']; document.querySelectorAll('[data-i18n]').forEach(el=>{ const key=el.getAttribute('data-i18n'); const v=getNested(t,key); if(v!==undefined) el.innerText=v; }); }
    const savedLang = localStorage.getItem('lang') || 'en';
    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations(savedLang);
      const langSelect = document.getElementById('langSelect');
      if (langSelect) {
        langSelect.value = savedLang;
        langSelect.addEventListener('change', (e) => {
          const v = e.target.value || 'en';
          applyTranslations(v);
          localStorage.setItem('lang', v);
        });
      }
    });

    // Populate gallery dynamically using assets/life_comic/index.json (if present).
    let galleryImages = [];
    let currentIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');

    function openLightbox(index) {
      if (index < 0 || index >= galleryImages.length) return;
      currentIndex = index;
      lbImg.src = `assets/life_comic/${galleryImages[currentIndex]}`;
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function showNext(e) {
      if(e) e.stopPropagation();
      currentIndex = (currentIndex + 1) % galleryImages.length;
      lbImg.src = `assets/life_comic/${galleryImages[currentIndex]}`;
    }

    function showPrev(e) {
      if(e) e.stopPropagation();
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
      lbImg.src = `assets/life_comic/${galleryImages[currentIndex]}`;
    }

    // Event listeners for lightbox
    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbNext').addEventListener('click', showNext);
    document.getElementById('lbPrev').addEventListener('click', showPrev);
    
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });

    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      let images = null;
      try {
        const res = await fetch('./assets/life_comic/index.json', {cache: 'no-cache'});
        if (res.ok) {
          const obj = await res.json();
          if (obj && Array.isArray(obj.images)) images = obj.images;
        }
      } catch (e) {
        // ignore
      }

      if (!images) {
        // fallback: try page1..page8
        images = [];
        for (let i = 1; i <= 8; i++) images.push(`page${i}.jpg`);
      }
      
      galleryImages = images; // Store for lightbox

      gallery.innerHTML = '';
      images.forEach((name, index) => {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.style.cursor = 'pointer';
        card.onclick = () => openLightbox(index);
        
        const img = document.createElement('img');
        img.src = `assets/life_comic/${name}`;
        img.alt = name;
        img.loading = 'lazy';
        img.onload = () => {};
        img.onerror = function(){ this.parentElement.innerHTML = `<div style='color:#9fcfff;opacity:0.6'>Placeholder for ${name}</div>` };
        card.appendChild(img);
        gallery.appendChild(card);
      });
    }

    // kick off
    loadGallery();
  </script>
</body>
</html>
