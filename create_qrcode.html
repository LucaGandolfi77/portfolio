<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>QR Code Generator — Luca Gandolfi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- QR Code Generator Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        :root{--bg:#07101b;--card:#0b1220;--accent:#00d4ff}
        html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#07101b,#0f1724);color:#e8f6ff}
        .wrap{max-width:800px;margin:36px auto;padding:28px;text-align:center;}
        .lang-top-left{position:fixed;top:12px;left:12px;z-index:1002}
        .lang-top-left select{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:white;padding:6px 8px;border-radius:6px}
        a.back{color:var(--accent);text-decoration:none;font-weight:600;display:inline-block;margin-bottom:20px;}
        
        .input-container {
            margin-bottom: 24px;
        }
        
        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            border-color: var(--accent);
        }

        #qrcode-container {
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            display: inline-block;
            min-width: 200px;
            min-height: 200px;
        }
        
        canvas {
            display: block;
        }

        .btn {
            background: var(--accent);
            color: #002;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s, opacity 0.2s;
            text-decoration: none;
            display: inline-block;
            margin-top: 16px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        h1 {
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #a0c0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle {
            color: #88a0b8;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <div class="lang-top-left">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">EN</option>
            <option value="it">IT</option>
        </select>
    </div>

    <div class="wrap">
        <a href="index.html" class="back">← Back to Portfolio</a>
        
        <h1>QR Code Generator</h1>
        <p class="subtitle">Create custom QR codes instantly</p>

        <div class="input-container">
            <input type="text" id="qr-text" placeholder="Enter text or URL here..." autocomplete="off">
        </div>

        <div id="qrcode-container">
            <canvas id="qr-canvas"></canvas>
        </div>

        <div>
            <button id="download-btn" class="btn" disabled>Download JPG</button>
        </div>
    </div>

    <script>
        const qrText = document.getElementById('qr-text');
        const canvas = document.getElementById('qr-canvas');
        const downloadBtn = document.getElementById('download-btn');
        const container = document.getElementById('qrcode-container');

        // Initial placeholder
        QRCode.toCanvas(canvas, 'https://lucagandolfi.dev', { 
            width: 256,
            margin: 2,
            color: {
                dark: '#000000',
                light: '#ffffff'
            }
        }, function (error) {
            if (error) console.error(error);
        });

        function generateQR() {
            const text = qrText.value.trim();
            if (!text) {
                downloadBtn.disabled = true;
                return;
            }

            QRCode.toCanvas(canvas, text, { 
                width: 256,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            }, function (error) {
                if (error) console.error(error);
                else downloadBtn.disabled = false;
            });
        }

        qrText.addEventListener('input', generateQR);

        downloadBtn.addEventListener('click', function() {
            // Create a temporary link to download
            const link = document.createElement('a');
            link.download = 'qrcode.jpg';
            // Convert canvas to JPG (image/jpeg)
            link.href = canvas.toDataURL('image/jpeg', 0.8); // 0.8 quality compressed
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Translations
        const translations = {
            en: {
                title: "QR Code Generator",
                subtitle: "Create custom QR codes instantly",
                placeholder: "Enter text or URL here...",
                download: "Download JPG",
                back: "← Back to Portfolio"
            },
            it: {
                title: "Generatore QR Code",
                subtitle: "Crea codici QR personalizzati istantaneamente",
                placeholder: "Inserisci testo o URL qui...",
                download: "Scarica JPG",
                back: "← Torna al Portfolio"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.querySelector('h1').textContent = t.title;
            document.querySelector('.subtitle').textContent = t.subtitle;
            document.querySelector('.back').textContent = t.back;
            qrText.placeholder = t.placeholder;
            downloadBtn.textContent = t.download;
        }
        
        // Check URL param for lang
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'en';
        document.getElementById('langSelect').value = lang;
        changeLanguage(lang);

    </script>
</body>
</html>
