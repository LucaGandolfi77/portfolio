<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title data-i18n="movies.page.title">Movies — Luca Gandolfi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#07101b,#0f1724);color:white}
        .wrap{max-width:1000px;margin:36px auto;padding:28px}
        a.back{color:#00d4ff;text-decoration:none;font-weight:600}
        .movies-grid{display:flex;flex-direction:column;gap:18px;margin-top:18px}
        .trailers-list{background:rgba(255,255,255,0.02);padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);max-height:560px;overflow:auto;scrollbar-gutter:stable}
        .trailers-list input{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:rgba(0,0,0,0.12);color:inherit;margin-bottom:8px;box-sizing:border-box}
        .trailer-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:8px}
        .trailer-item:hover{background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.03)}
        .trailer-item.active{background:linear-gradient(90deg,rgba(0,212,255,0.06),rgba(0,212,255,0.02));border-color:rgba(0,212,255,0.18)}
        .trailer-thumb{width:120px;height:68px;flex:0 0 120px;border-radius:6px;object-fit:cover;background:#000;border:1px solid rgba(255,255,255,0.04)}
        .trailer-thumb.thumb-loading{filter:blur(4px) brightness(0.8) saturate(0.9);transform:scale(1.02);transition:filter 220ms ease, transform 220ms ease}
        .trailer-thumb.thumb-loaded{filter:none;transform:none}
        .trailer-meta{display:flex;flex-direction:column;gap:4px}
        .trailer-title{font-weight:700;font-size:0.95rem}
        .trailer-sub{font-size:0.85rem;color:#9fbcd8}
        .player-wrap{background:rgba(255,255,255,0.02);padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04)}
        .player-iframe{width:100%;height:420px;border:0;border-radius:8px;background:#000}
        @media(max-width:880px){.player-iframe{height:260px}}
        @media(max-width:768px){.player-iframe{height:240px}.wrap{padding:20px;margin:24px auto}.movies-grid{gap:12px}}
        @media(max-width:480px){.player-iframe{height:200px}.wrap{padding:16px;margin:20px auto}.movies-grid{gap:8px}}
    </style>
</head>
<body>

    <div class="wrap">
        <a class="back" href="index.html">← <span data-i18n="page.back">Back to portfolio</span></a>
        <h1 data-i18n="movies.page.heading">Movies</h1>
        <p data-i18n="movies.page.lead">Favorites, short reviews and influences.</p>

                <div>
                        <p>Example short review: classic film and notes.</p>
                </div>

                <h2 data-i18n="movies.trailers.heading">Trailers</h2>
                <p data-i18n="movies.trailers.lead">Pick a trailer from the list and it will play in the player.</p>

                <div class="movies-grid">
                    <div class="player-wrap">
                        <div id="playerTitle" style="font-weight:700;margin-bottom:8px">Select a trailer</div>
                        <div id="playerHolder">
                            <iframe id="ytPlayer" class="player-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen title="YouTube player"></iframe>
                        </div>
                    </div>
                    <div class="trailers-list">
                        <input id="trailerSearch" type="search" placeholder="Search trailers..." aria-label="Search trailers" data-i18n-placeholder="movies.trailers.search" />
                        <div id="trailersContainer">
                            <!-- trailer items inserted here -->
                        </div>
                    </div>
                </div>
    </div>

    <script>
        // Placeholder handling (since top_buttons doesn't handle data-i18n-placeholder)
        function updatePlaceholders() {
            const t = window.translations || {};
            function getNested(o,p){return p.split('.').reduce((a,k)=> (a && a[k]!==undefined)? a[k]: undefined, o);}
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ 
                const k=el.getAttribute('data-i18n-placeholder'); 
                const v=getNested(t,k); 
                if(v!==undefined) el.placeholder = v; 
            });
        }

        const checkInterval = setInterval(() => {
            const sel = document.getElementById('siteLangSelect');
            if (sel && window.translations) {
                clearInterval(checkInterval);
                updatePlaceholders();
                sel.addEventListener('change', () => setTimeout(updatePlaceholders, 100)); // wait for fetch
            }
        }, 100);

        document.addEventListener('DOMContentLoaded', async ()=>{
            // Trailer list & player wiring
            // ...
        });
    </script>
        <script>
            // Trailer list & player wiring (separate script)
            // The trailers are loaded from /assets/trailers.json at runtime.
            let TRAILERS = [];

            function createTrailerItem(t){
                const el = document.createElement('div');
                el.className = 'trailer-item';
                el.tabIndex = 0;
                el.dataset.id = t.id;

                const thumb = document.createElement('img');
                thumb.className = 'trailer-thumb';
                thumb.alt = t.title + ' thumbnail';
                // lazy-load: keep real URL in data-src and show lightweight SVG placeholder in src
                thumb.dataset.src = `https://img.youtube.com/vi/${t.id}/hqdefault.jpg`;
                const placeholder = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="68"><rect width="100%" height="100%" fill="%2307110b"/></svg>';
                thumb.src = placeholder;
                thumb.classList.add('thumb-loading');

                const meta = document.createElement('div');
                meta.className = 'trailer-meta';

                const title = document.createElement('div');
                title.className = 'trailer-title';
                title.textContent = t.title;

                const sub = document.createElement('div');
                sub.className = 'trailer-sub';
                const y = t.year || '';
                sub.textContent = (y ? y + ' · ' : '') + (t.desc || '');

                meta.appendChild(title);
                meta.appendChild(sub);

                el.appendChild(thumb);
                el.appendChild(meta);

                return el;
            }

            // Lazy loader for thumbnails
            function initLazyThumbs(){
                if (!('IntersectionObserver' in window)){
                    // Fallback: load all
                    document.querySelectorAll('.trailer-thumb[data-src]').forEach(img=>{
                        img.src = img.dataset.src; img.classList.remove('thumb-loading'); img.classList.add('thumb-loaded');
                    });
                    return;
                }

                const io = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            const real = img.dataset.src;
                            if (real) {
                                img.onload = () => { img.classList.remove('thumb-loading'); img.classList.add('thumb-loaded'); };
                                img.onerror = () => { img.classList.remove('thumb-loading'); };
                                img.src = real;
                                img.removeAttribute('data-src');
                            }
                            obs.unobserve(img);
                        }
                    });
                }, { root: document.querySelector('.trailers-list'), rootMargin: '100px', threshold: 0.01 });

                document.querySelectorAll('.trailer-thumb[data-src]').forEach(img=> io.observe(img));
            }
            function renderTrailers(filter=''){ const container = document.getElementById('trailersContainer'); if(!container) return; container.innerHTML=''; const q=(filter||'').toLowerCase().trim(); const list=TRAILERS.filter(t=>t.title.toLowerCase().includes(q)); if(list.length===0){ container.innerHTML='<div style="color:#9fbcd8">No trailers</div>'; return; } list.forEach(t=>{ const item=createTrailerItem(t); item.addEventListener('click', ()=> selectTrailer(t,item,true)); item.addEventListener('keydown', e=>{ if(e.key==='Enter') selectTrailer(t,item,true); }); container.appendChild(item); }); }
            function selectTrailer(t, el, autoplay){ document.querySelectorAll('.trailer-item').forEach(x=>x.classList.remove('active')); if(el) el.classList.add('active'); const player=document.getElementById('ytPlayer'); const title=document.getElementById('playerTitle'); if(title) title.textContent = t.title; if(player) player.src = `https://www.youtube.com/embed/${t.id}?rel=0&autoplay=${autoplay?1:0}`; }

                        document.addEventListener('DOMContentLoaded', async ()=>{
                                // attempt to load trailers from JSON file
                                try{
                                    const resp = await fetch('./assets/trailers.json');
                                    if(resp.ok){ TRAILERS = await resp.json(); }
                                }catch(err){ console.warn('Could not load /assets/trailers.json', err); }

                                renderTrailers();
                                // initialize lazy loading for thumbnails after rendering
                                initLazyThumbs();
                                // select first without autoplay if available
                                if(TRAILERS.length){ const firstItem = document.querySelector('.trailer-item'); if(firstItem){ selectTrailer(TRAILERS[0], firstItem, false); } }
                                const search = document.getElementById('trailerSearch'); if(search){ search.addEventListener('input', e=> renderTrailers(e.target.value)); }
                        });
        </script>
    <script src="top_buttons.js"></script>
</body>
</html>
