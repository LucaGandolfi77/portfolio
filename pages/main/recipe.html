<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca's Recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        body {
            background-color: #0a1628;
            color: #e6f1ff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 40px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .recipe-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: rgba(0, 212, 255, 0.3);
        }
        .recipe-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1a2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        .recipe-content {
            padding: 20px;
        }
        .recipe-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #00d4ff;
        }
        .recipe-desc {
            font-size: 14px;
            color: #a0c0e0;
            line-height: 1.5;
        }
        .tags {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #0f1c2e;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-header {
            height: 200px;
            background: #1a2a3a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: #ff4757;
        }
        .modal-body {
            padding: 30px;
        }
        .modal-title {
            font-size: 32px;
            color: #00d4ff;
            margin: 0 0 20px;
        }
        .section-head {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 25px 0 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .ingredient-list, .step-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .ingredient-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #a0c0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ingredient-list li:before {
            content: "•";
            color: #00d4ff;
        }
        .step-list li {
            margin-bottom: 20px;
            color: #e6f1ff;
            line-height: 1.6;
            position: relative;
            padding-left: 30px;
        }
        .step-list li:before {
            content: counter(step);
            counter-increment: step;
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .step-list {
            counter-reset: step;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 style="margin:0; font-size:24px;">Luca's Kitchen 👨‍🍳</h1>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search for recipes (e.g., Pasta, Cake)...">
        </div>

        <div class="recipe-grid" id="recipeGrid">
            <!-- Recipes will be injected here -->
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">×</button>
            <div class="modal-header" id="modalHeader">
                🥘
            </div>
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle">Recipe Title</h2>
                <p id="modalDesc" style="color:#a0c0e0; font-style:italic;">Description</p>
                
                <div class="section-head">Ingredients</div>
                <ul class="ingredient-list" id="modalIngredients"></ul>

                <div class="section-head">Instructions</div>
                <ul class="step-list" id="modalSteps"></ul>
            </div>
        </div>
    </div>

    <script>
        const recipes = [
            {
                id: 1,
                title: "Classic Carbonara",
                icon: "🍝",
                desc: "Authentic Roman pasta dish with eggs, cheese, pancetta, and pepper. No cream allowed!",
                tags: ["Italian", "Pasta", "Dinner"],
                ingredients: [
                    "320g Spaghetti",
                    "150g Guanciale (or Pancetta)",
                    "6 Egg Yolks",
                    "50g Pecorino Romano cheese",
                    "Black Pepper (lots of it)"
                ],
                steps: [
                    "Cut the guanciale into strips and cook in a pan until crispy. Save the fat.",
                    "In a bowl, whisk egg yolks with grated Pecorino and plenty of black pepper.",
                    "Cook spaghetti in boiling salted water until al dente.",
                    "Drain pasta (save some water) and toss it in the pan with the guanciale fat (heat off).",
                    "Pour the egg mixture over the pasta and mix quickly to create a creamy sauce. Add pasta water if needed.",
                    "Serve immediately with extra Pecorino and pepper."
                ]
            },
            {
                id: 2,
                title: "Fluffy Pancakes",
                icon: "🥞",
                desc: "Thick, fluffy pancakes perfect for a Sunday breakfast. Best served with maple syrup.",
                tags: ["Breakfast", "Sweet", "Easy"],
                ingredients: [
                    "200g All-purpose Flour",
                    "2 Eggs",
                    "250ml Milk",
                    "50g Butter (melted)",
                    "2 tsp Baking Powder",
                    "2 tbsp Sugar",
                    "Pinch of Salt"
                ],
                steps: [
                    "Mix flour, sugar, baking powder, and salt in a large bowl.",
                    "In another bowl, whisk eggs, milk, and melted butter.",
                    "Pour wet ingredients into dry ingredients and mix gently. Do not overmix (lumps are fine).",
                    "Heat a non-stick pan over medium heat. Pour a ladle of batter.",
                    "Flip when bubbles appear on the surface.",
                    "Cook until golden brown on both sides."
                ]
            },
            {
                id: 3,
                title: "Fresh Guacamole",
                icon: "🥑",
                desc: "Creamy, zesty, and fresh dip made from ripe avocados. The perfect party snack.",
                tags: ["Dip", "Mexican", "Vegan"],
                ingredients: [
                    "3 Ripe Avocados",
                    "1 Lime (juice)",
                    "1/2 Red Onion (finely chopped)",
                    "1 Tomato (diced)",
                    "Fresh Cilantro",
                    "Salt & Chili flakes"
                ],
                steps: [
                    "Cut avocados in half, remove the pit, and scoop out the flesh.",
                    "Mash the avocado with a fork (keep it slightly chunky).",
                    "Stir in the lime juice, onion, tomato, and cilantro.",
                    "Season with salt and chili flakes to taste.",
                    "Serve with tortilla chips."
                ]
            },
            {
                id: 4,
                title: "Tiramisù",
                icon: "🍰",
                desc: "The world-famous Italian dessert. Coffee-soaked ladyfingers layered with mascarpone cream.",
                tags: ["Dessert", "Italian", "Coffee"],
                ingredients: [
                    "500g Mascarpone",
                    "4 Eggs (separated)",
                    "100g Sugar",
                    "300g Ladyfingers (Savoiardi)",
                    "300ml Strong Espresso (cooled)",
                    "Cocoa Powder"
                ],
                steps: [
                    "Whisk egg yolks with sugar until pale and creamy. Mix in mascarpone.",
                    "Whip egg whites until stiff peaks form. Gently fold into the mascarpone mixture.",
                    "Dip ladyfingers quickly into the cold espresso.",
                    "Layer dipped ladyfingers in a dish, followed by a layer of cream.",
                    "Repeat layers, finishing with cream.",
                    "Dust with cocoa powder and refrigerate for at least 4 hours."
                ]
            },
            {
                id: 5,
                title: "Pizza Margherita",
                icon: "🍕",
                desc: "Simple homemade pizza with tomato sauce, mozzarella, and fresh basil.",
                tags: ["Italian", "Dinner", "Baking"],
                ingredients: [
                    "500g Pizza Dough",
                    "200g Tomato Sauce (Passata)",
                    "250g Fresh Mozzarella",
                    "Fresh Basil leaves",
                    "Olive Oil"
                ],
                steps: [
                    "Preheat oven to max temperature (250°C+).",
                    "Stretch the dough into a circle.",
                    "Spread tomato sauce evenly, leaving the crust clear.",
                    "Add torn mozzarella pieces and a drizzle of olive oil.",
                    "Bake for 10-15 minutes until crust is golden and cheese is bubbly.",
                    "Top with fresh basil before serving."
                ]
            }
        ];

        const grid = document.getElementById('recipeGrid');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('modalOverlay');
        const closeModal = document.getElementById('closeModal');

        function renderRecipes(filter = "") {
            grid.innerHTML = "";
            const filtered = recipes.filter(r => 
                r.title.toLowerCase().includes(filter.toLowerCase()) || 
                r.tags.some(t => t.toLowerCase().includes(filter.toLowerCase()))
            );

            filtered.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.onclick = () => openModal(recipe);
                
                let tagsHtml = recipe.tags.map(t => `<span class="tag">${t}</span>`).join('');

                card.innerHTML = `
                    <div class="recipe-img">${recipe.icon}</div>
                    <div class="recipe-content">
                        <h3 class="recipe-title">${recipe.title}</h3>
                        <p class="recipe-desc">${recipe.desc}</p>
                        <div class="tags">${tagsHtml}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(recipe) {
            document.getElementById('modalTitle').innerText = recipe.title;
            document.getElementById('modalDesc').innerText = recipe.desc;
            document.getElementById('modalHeader').innerText = recipe.icon;
            
            const ingList = document.getElementById('modalIngredients');
            ingList.innerHTML = recipe.ingredients.map(i => `<li>${i}</li>`).join('');
            
            const stepList = document.getElementById('modalSteps');
            stepList.innerHTML = recipe.steps.map(s => `<li>${s}</li>`).join('');

            modal.style.display = 'flex';
        }

        closeModal.onclick = () => {
            modal.style.display = 'none';
        };

        window.onclick = (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        };

        searchInput.addEventListener('input', (e) => {
            renderRecipes(e.target.value);
        });

        // Initial Render
        renderRecipes();

    </script>
    <script src="../../top_buttons.js"></script>
</body>
</html>
