  <style>
    :root {
      --bg-900: #0a1628;
      --bg-800: #111d33;
      --bg-700: #1a2940;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,0.15);
      --muted: #64c8ff;
      --card-bg: rgba(26,41,64,0.55);
      --glass: rgba(10,22,40,0.92);
      --border: rgba(100,200,255,0.08);
      --text-primary: #e8f4ff;
      --text-secondary: #8fcaff;
      --text-dim: #5a8ab5;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      background: var(--bg-900);
      color: var(--text-primary);
      line-height: 1.6;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(0,212,255,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(ellipse, rgba(100,100,255,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 16px calc(40px + var(--safe-bottom));
    }

    /* Language selector */
    .lang-bar {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: calc(12px + var(--safe-left));
      z-index: 1002;
    }
    .lang-bar select {
      background: var(--glass);
      border: 1px solid var(--border);
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      -webkit-appearance: none;
      appearance: none;
    }

    /* Hero */
    .hero {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 28px 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      margin-bottom: 28px;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #7c5cff, var(--accent));
      background-size: 200% 100%;
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .hero h1 {
      color: var(--accent);
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .hero p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .hero .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      text-decoration: none;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
      min-height: 44px;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg-900);
    }
    .btn-primary:hover { background: #33ddff; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,255,0.3); }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }

    /* Filter tabs */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-tag {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
      min-height: 40px;
    }
    .filter-tag:hover, .filter-tag.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(0,212,255,0.25);
    }

    /* Posts grid */
    .posts { display: grid; grid-template-columns: 1fr; gap: 16px; }

    /* Featured post */
    .post-card.featured {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(100,100,255,0.05));
      border: 1px solid rgba(0,212,255,0.15);
      padding: 24px;
    }
    .post-card.featured .post-badge {
      display: inline-block;
    }

    /* Post card */
    .post-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    .post-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .post-card:hover, .post-card:active {
      transform: translateY(-4px);
      border-color: rgba(0,212,255,0.2);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,212,255,0.08);
    }
    .post-card:hover::after, .post-card:active::after { opacity: 1; }

    .post-badge {
      display: none;
      background: var(--accent);
      color: var(--bg-900);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .post-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .post-title {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .post-arrow {
      color: var(--accent);
      font-size: 1.2rem;
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-4px);
      transition: all var(--transition);
    }
    .post-card:hover .post-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .post-meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .post-excerpt {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .post-tags {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .post-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* Empty state */
    .empty {
      color: var(--text-dim);
      padding: 32px 24px;
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.06);
      text-align: center;
      font-size: 0.95rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2000;
      padding: 0;
    }
    .modal-overlay.active { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 700px;
      max-height: 88vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg-800);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px calc(24px + var(--safe-bottom));
      border: 1px solid var(--border);
      border-bottom: none;
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      margin: 0 auto 18px;
    }

    .modal-close-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-close-bar .btn { font-size: 0.85rem; }

    .modal-panel h2 {
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .modal-panel .post-meta { margin-bottom: 18px; }

    .modal-content {
      color: var(--text-secondary);
      line-height: 1.75;
      font-size: 0.95rem;
    }
    .modal-content p { margin-bottom: 14px; }
    .modal-content h3 {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 20px 0 8px;
    }
    .modal-content code {
      background: rgba(0,212,255,0.1);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.88em;
    }
    .modal-content pre {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      margin: 14px 0;
      border: 1px solid var(--border);
    }
    .modal-content pre code {
      background: none;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .modal-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      margin: 14px 0;
      background: rgba(0,212,255,0.04);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--text-secondary);
    }

    /* Desktop layout */
    @media (min-width: 640px) {
      .container { padding: 32px 24px 60px; }
      .hero { padding: 36px 32px; }
      .hero h1 { font-size: 2.2rem; }
      .posts { grid-template-columns: repeat(2, 1fr); gap: 18px; }
      .post-card.featured { grid-column: 1 / -1; }
      .modal-overlay { align-items: center; padding: 20px; }
      .modal-panel {
        border-radius: 20px;
        border: 1px solid var(--border);
        padding: 32px;
        max-height: 80vh;
      }
      .modal-handle { display: none; }
    }

    /* iPhone notch / dynamic island safety */
    @supports (padding: env(safe-area-inset-top)) {
      .lang-bar { top: calc(8px + env(safe-area-inset-top)); }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  </style>
</head>
<body>

    <select id="langSelect" aria-label="Select language" title="Change language">
      <option value="en">EN</option>

  <div class="container">

      <div class="modal-handle"></div>

  <script>
    const translations = {
      en: {
        blog: {
          heading: 'Blog & Articles',
          lead: 'Thoughts on code, music, AI, and the things that keep me up at night.',
          back: '\u2190 Portfolio',
          howto: '+ Add post',
          empty: 'No posts found.',
          readTime: 'min read',
          all: 'All'
        }
      },
      it: {
        blog: {
          heading: 'Blog & Articoli',
          lead: 'Pensieri su codice, musica, AI e le cose che mi tengono sveglio di notte.',
          back: '\u2190 Portfolio',
          howto: '+ Aggiungi post',
          empty: 'Nessun post trovato.',
          readTime: 'min di lettura',
          all: 'Tutti'
        }
      }
    };

    function getNested(o, path) { return path.split('.').reduce((a, k) => (a && a[k] !== undefined) ? a[k] : undefined, o); }
    function applyTranslations(lang) {
      if (!lang) lang = 'en';
      const t = translations[lang] || translations['en'];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const v = getNested(t, key);
        if (v !== undefined) el.innerText = v;
      });
    }

    const savedLang = localStorage.getItem('lang') || 'en';

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations(savedLang);
      const langSelect = document.getElementById('langSelect');
      if (langSelect) {
        langSelect.value = savedLang;
        langSelect.addEventListener('change', e => {
          const v = e.target.value || 'en';
          localStorage.setItem('lang', v);
          applyTranslations(v);
        });
      }
    });

    // Embedded posts data
    const embeddedPosts = [
      {
        title: "Why I Rewrote My Portfolio 7 Times",
        date: "2026-08-15",
        excerpt: "A deep dive into perfectionism, diminishing returns, and why the 7th version finally felt right.",
        slug: "portfolio-rewrite",
        category: "Dev Life",
        readTime: 5,
        featured: true,
        tags: ["webdev", "css", "meta"],
        content: `<p>Every developer has that one project they can't stop revisiting. For me, it's this portfolio. What started as a simple HTML page has gone through seven complete rewrites — from raw CSS to Tailwind, from React back to vanilla, from dark mode to light mode and back again.</p>
<h3>The Trap</h3>
<p>The problem isn't that each version was bad. The problem is that <strong>the bar keeps moving</strong>. You learn a new CSS trick, see a cooler animation on Dribbble, or discover that your Lighthouse score could be 2 points higher. So you rewrite. Again.</p>
<h3>What Version 7 Got Right</h3>
<p>The breakthrough was accepting that a portfolio isn't a product — it's a living document. I stopped chasing perfection and started chasing <em>honesty</em>. The current version uses:</p>
<ul>
<li>Vanilla HTML/CSS/JS — no build step, no framework overhead</li>
<li>CSS custom properties for theming</li>
<li>Progressive enhancement (works without JS)</li>
<li>~15KB total CSS (compressed)</li>
</ul>
<blockquote>The best version of your portfolio is the one you actually ship.</blockquote>
<p>Version 8 will probably happen next month. But for now, this one tells the truth about who I am as a developer — and that's enough.</p>`
      },
      {
        title: "Building a Face Tracker with MediaPipe in 200 Lines",
        date: "2026-07-22",
        excerpt: "How I added real-time face mesh tracking to a web page using nothing but JavaScript and a webcam.",
        slug: "facetracker-mediapipe",
        category: "Tutorial",
        readTime: 7,
        tags: ["AI", "javascript", "mediapipe"],
        content: `<p>I've always been fascinated by computer vision, but the barrier to entry used to be massive. You needed OpenCV, Python, CUDA, and a GPU that could render the heat death of the universe. Then Google released MediaPipe, and suddenly face tracking runs in a browser tab.</p>
<h3>The Setup</h3>
<p>The entire face tracker fits in about 200 lines of JavaScript. Here's the core idea:</p>
<pre><code>import { FaceMesh } from '@mediapipe/face_mesh';
const faceMesh = new FaceMesh({
  locateFile: (file) => \`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/\${file}\`
});
faceMesh.onResults(onResults);
</code></pre>
<h3>What It Can Do</h3>
<p>The 468-point face mesh gives you precise landmark positions for every feature — eyes, nose, mouth, jawline. I used this to build:</p>
<ul>
<li>A "warhol filter" that changes background color based on face position</li>
<li>Eye-tracking cursor control (yes, really)</li>
<li>A meme generator that overlays hats on detected faces</li>
</ul>
<blockquote>When the camera first tracked my eyes perfectly, I felt like a kid again. The magic hasn't faded.</blockquote>
<p>The full source code is in my <code>projects/</code> folder. Fork it, break it, make it yours.</p>`
      },
      {
        title: "The Hidden Complexity of a Login Button",
        date: "2026-06-30",
        excerpt: "That simple 'Sign In' button hides more engineering decisions than you think.",
        slug: "login-button-complexity",
        category: "Deep Dive",
        readTime: 6,
        tags: ["security", "UX", "backend"],
        content: `<p>A login button looks simple. It's a rectangle with text. You click it, you're in. But behind that rectangle lies a cascade of decisions that can make or break your application.</p>
<h3>Layer 1: The Frontend</h3>
<p>First, there's the button itself. What happens on tap? Does it disable immediately to prevent double-submits? Does it show a loading spinner? What if the user's connection is slow — do you show a skeleton state or a progress bar?</p>
<h3>Layer 2: The Transport</h3>
<p>The credentials travel over HTTPS. But what version of TLS? Are you using HSTS? What about certificate pinning for mobile apps? And the password — is it transmitted in the body, or via a more secure channel?</p>
<h3>Layer 3: The Backend</h3>
<p>Now the server receives the request. It hashes the password with bcrypt (right?). It checks rate limiting. It logs the attempt. It generates a JWT or session token. Each of these steps has its own failure modes.</p>
<h3>Layer 4: The Human</h3>
<p>And then there's the user who types their password into the username field. Or copies their password from a sticky note. Or uses "password123" because they have 47 other accounts to remember.</p>
<blockquote>Engineering is the art of making simple things complicated — and complicated things simple.</blockquote>
<p>The next time you see a login button, remember: someone spent weeks making it feel effortless.</p>`
      },
      {
        title: "My Desk Setup for 2026",
        date: "2026-05-18",
        excerpt: "The tools, gadgets, and questionable ergonomic choices that power my daily workflow.",

    let touchStartY = 0;
    document.getElementById('modal').addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.getElementById('modal').addEventListener('touchend', e => {
      const delta = e.changedTouches[0].clientY - touchStartY;
      if (delta > 80) closeModal();
    }, { passive: true });

    document.getElementById('newPostBtn').addEventListener('click', () => {
      alert('To add posts: create /assets/blog/posts.json with structure: { "posts": [{ "title":"...","date":"YYYY-MM-DD","excerpt":"...","slug":"...","category":"...","tags":["..."],"content":"<p>HTML</p>" }] }');
    });

    // Init
    (async () => {
      allPosts = await loadPosts();
      renderFilters(getCategories(allPosts));
      renderPosts(allPosts);
    })();
  </script>
</body>
</html>
