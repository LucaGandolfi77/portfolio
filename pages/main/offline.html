<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Luca Gandolfi Portfolio</title>
    <link rel="canonical" href="https://lucagandolfi77.github.io/portfolio/pages/main/offline.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Offline - Luca Gandolfi Portfolio">
    <meta property="og:description" content="Offline - Luca Gandolfi Portfolio - Explore this page on the Luca Gandolfi portfolio.">
    <meta property="og:url" content="https://lucagandolfi77.github.io/portfolio/pages/main/offline.html">

    <meta name="description" content="You are offline. Cached pages may still be available." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
        :root {
            --bg: #0a1628;
            --text: #eef6ff;
            --muted: #a5bfd8;
            --accent: #00d4ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 20% 20%, #17365f 0%, var(--bg) 60%);
            color: var(--text);
            font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            text-align: center;
            padding: 24px;
        }

        main {
            max-width: 560px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            background: rgba(11, 21, 41, 0.84);
            backdrop-filter: blur(6px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
            color: var(--accent);
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a,
        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            color: #001425;
            background: var(--accent);
        }

        .secondary {
            color: var(--text);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
    </style>
</head>
<body>
    <main>
        <h1>You Are Offline</h1>
        <p>
            The requested page is not available without a network connection. If it was previously cached,
            it should still open from the browser history.
        </p>
        <div class="actions">
            <button type="button" onclick="window.location.reload()">Try Again</button>
            <a class="secondary" href="../../index.html">Go To Home</a>
        </div>
    </main>
</body>
</html>
