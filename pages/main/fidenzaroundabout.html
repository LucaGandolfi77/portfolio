<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>Fidenza's Roundabout — L'Uscita Mai Presa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fredoka:wght@500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#efeaf7; --dim:#a79fc0; --gold:#f0c987; --rose:#e8929c; --teal:#7ad0c0;
  --panel:rgba(14,12,24,0.86); --line:rgba(255,255,255,0.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Lora',Georgia,serif;
  background:#07070d;color:var(--ink);
  overflow:hidden;height:100vh;height:100dvh;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
#game{position:fixed;inset:0;overflow:hidden}

/* ---------- SFONDI ---------- */
.bg{position:absolute;inset:0;z-index:1;transition:opacity .9s ease;background:#000}
.bg .layer{position:absolute;inset:0;transition:opacity 1.2s ease}
.scene{opacity:0}.scene.on{opacity:1}
.sc-car{background:
 radial-gradient(120% 80% at 50% 110%, #10131c 0%, #05060b 65%),
 linear-gradient(180deg,#1b2340 0%,#0d1120 55%,#05060b 100%)}
.sc-car::before{content:'';position:absolute;left:-10%;right:-10%;bottom:0;height:34%;
 background:linear-gradient(180deg,transparent, rgba(120,140,220,.06));
 box-shadow:inset 0 40px 60px -20px rgba(0,0,0,.8)}
.sc-car .wiper{position:absolute;bottom:26%;left:30%;width:44%;height:3px;border-radius:3px;
 background:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);opacity:.5;
 transform-origin:right center;animation:wiper 2.6s ease-in-out infinite}
@keyframes wiper{0%,100%{transform:rotate(-16deg)}45%{transform:rotate(14deg)}55%{transform:rotate(14deg)}}
.sc-round-sunset{background:
 radial-gradient(75% 55% at 78% 78%, #ff9d5c22 0%, transparent 60%),
 radial-gradient(100% 70% at 50% 118%, #351f33 0%, #191225 58%, #0c0a15 100%),
 linear-gradient(200deg,#3c2a52 0%,#6b3a54 38%,#c96a4a 66%,#f2b25c 82%,#ffd9a0 94%)}
.sc-round-sunset::before{content:'';position:absolute;left:0;right:0;top:71%;height:3px;
 background:linear-gradient(90deg,transparent,rgba(255,220,170,.85),transparent);
 filter:blur(1px)}
.sc-round-night{background:
 radial-gradient(60% 42% at 50% 84%, #232c47 0%, transparent 62%),
 radial-gradient(120% 90% at 50% 115%, #131a2e 0%, #0a0d18 60%, #06070f 100%),
 linear-gradient(180deg,#0a0d1c 0%,#11172c 48%,#182036 100%)}
.sc-round-night::before{content:'';position:absolute;left:0;right:0;top:69%;height:2px;
 background:linear-gradient(90deg,transparent,rgba(150,190,255,.5),transparent)}
.sc-round-dawn{background:
 radial-gradient(80% 55% at 50% 108%, #ffd9b04d 0%, transparent 55%),
 radial-gradient(110% 80% at 50% 112%, #27334f 0%, #17203a 55%, #0d1224 100%),
 linear-gradient(185deg,#141a33 0%,#28345c 45%,#5a5f8f 74%,#d99a7a 92%,#ffe3bb 100%)}
.sc-hospital{background:
 repeating-linear-gradient(180deg, rgba(190,210,235,.05) 0 2px, transparent 2px 46px),
 linear-gradient(180deg,#20303f 0%,#16222e 40%,#0c141d 100%)}
.sc-hospital::before{content:'';position:absolute;left:0;right:0;top:0;height:100%;
 background:repeating-linear-gradient(90deg, transparent 0 120px, rgba(160,200,240,.07) 120px 124px)}
.sc-room{background:
 radial-gradient(70% 50% at 76% 30%, rgba(255,214,166,.16) 0%, transparent 55%),
 linear-gradient(180deg,#1d2430 0%,#12161f 55%,#0a0d13 100%)}
.sc-home{background:
 radial-gradient(60% 44% at 24% 36%, rgba(255,196,130,.14) 0%, transparent 60%),
 linear-gradient(180deg,#241d2e 0%,#181320 52%,#0c0912 100%)}
.sc-wheat{background:
 radial-gradient(90% 60% at 50% 112%, #f4c96b66 0%, transparent 60%),
 linear-gradient(188deg,#20263f 0%,#3c3f63 34%,#8a6a5e 58%,#cf9a56 78%,#efd08c 95%)}
.sc-island{background:
 radial-gradient(70% 50% at 50% 88%, rgba(122,208,192,.14) 0%, transparent 60%),
 linear-gradient(186deg,#101625 0%,#1b2742 44%,#2b4a52 74%,#4f7a72 100%)}
.horizon-lamp{position:absolute;width:3px;border-radius:3px;
 background:linear-gradient(180deg,#ffd9a0,#574a33 70%,transparent);
 box-shadow:0 -8px 22px 4px rgba(255,214,160,.35)}

/* ---------- PIOGGIA ---------- */
#rain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.2s}
#rain.on{opacity:1}

/* ---------- VIGNETTA ---------- */
.vignette{position:absolute;inset:0;z-index:4;pointer-events:none;
 background:radial-gradient(115% 90% at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;z-index:9;pointer-events:none;background:#000;opacity:0;transition:opacity .8s ease}
.shakeit{animation:shk .5s linear}
@keyframes shk{15%{transform:translate(-9px,4px)}35%{transform:translate(7px,-5px)}55%{transform:translate(-5px,-2px)}75%{transform:translate(4px,3px)}}

/* ---------- PERSONAGGI ---------- */
#chars{position:absolute;inset:0;z-index:5;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;gap:2vw;padding-bottom:17vh}
.puppet{width:min(30vw,240px);aspect-ratio:.62;filter:drop-shadow(0 12px 26px rgba(0,0,0,.55));
 transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1), filter .4s;}
.puppet.enter{animation:pIn .8s cubic-bezier(.2,.9,.25,1.15)}
@keyframes pIn{from{opacity:0;transform:translateY(26px)}to{opacity:1}}
.puppet svg{width:100%;height:100%;display:block}
.puppet .breath{transform-origin:50% 100%;animation:brth 4.2s ease-in-out infinite}
@keyframes brth{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}
.puppet.dim{opacity:.55;filter:grayscale(.35) brightness(.75)}
.puppet.gone{opacity:0;transform:translateY(18px)}

/* ---------- CAPITOLO ---------- */
#chapter{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:10px;
 align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.1s ease;text-align:center;padding:0 6vw}
#chapter.show{opacity:1}
#ch-num{font-family:'Fredoka';font-size:.8rem;letter-spacing:6px;color:var(--dim);text-transform:uppercase}
#ch-title{font-family:'Fredoka';font-size:clamp(1.6rem,6vw,2.7rem);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.8)}

/* ---------- DIALOGO ---------- */
#dlg-wrap{position:fixed;left:50%;transform:translateX(-50%);z-index:20;width:min(94vw,860px);
 bottom:calc(env(safe-area-inset-bottom) + 12px)}
#nameplate{display:inline-flex;align-items:center;gap:8px;margin-left:18px;padding:6px 18px;border-radius:16px 16px 0 0;
 font-family:'Fredoka';font-weight:600;font-size:clamp(.9rem,3.4vw,1.06rem);letter-spacing:.4px;
 background:linear-gradient(180deg, rgba(40,32,64,.95), rgba(24,18,40,.95));border:1px solid var(--line);border-bottom:none;
 color:var(--gold);min-height:20px}
#dialogue{
 background:var(--panel);border:1px solid var(--line);border-radius:20px;
 padding:18px 22px 46px;min-height:132px;max-height:44dvh;overflow-y:auto;
 cursor:pointer;box-shadow:0 18px 50px rgba(0,0,0,.5);
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 scrollbar-width:none}#dialogue::-webkit-scrollbar{display:none}
#dtext{font-size:clamp(1rem,3.9vw,1.16rem);line-height:1.72;white-space:pre-wrap;color:var(--ink)}
#caret{display:inline-block;width:9px;height:1.05em;vertical-align:-3px;background:var(--gold);
 animation:crt 1s steps(2) infinite;margin-left:2px}
@keyframes crt{50%{opacity:0}}
#quick{position:absolute;right:14px;bottom:10px;display:flex;gap:4px}
.qbtn{background:none;border:none;color:var(--dim);font-family:'Inter';font-size:.72rem;font-weight:700;
 letter-spacing:.5px;padding:6px 8px;border-radius:8px;cursor:pointer;touch-action:manipulation;text-transform:uppercase}
.qbtn:hover,.qbtn:active{color:#fff;background:rgba(255,255,255,.07)}
.qbtn.toggled{color:var(--teal)}

/* ---------- SCELTE ---------- */
#choices{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
 gap:12px;background:linear-gradient(180deg,rgba(5,4,10,.35),rgba(5,4,10,.72));padding:20px}
#choices.open{display:flex}
.choice{
 width:min(88vw,560px);text-align:left;
 background:linear-gradient(160deg, rgba(38,30,62,.94), rgba(20,16,34,.94));
 border:1px solid var(--line);border-radius:16px;
 color:var(--ink);font-family:'Lora';font-size:clamp(.98rem,3.9vw,1.08rem);
 padding:15px 20px;cursor:pointer;touch-action:manipulation;
 transition:transform .12s,border-color .2s,background .2s;line-height:1.5;
 display:flex;gap:12px;align-items:flex-start;
}
.choice .key{font-family:'Inter';font-weight:800;font-size:.7rem;color:var(--dim);
 border:1px solid var(--line);border-radius:6px;padding:3px 7px;margin-top:2px;flex:none}
.choice:not(.locked):active{transform:scale(.98);border-color:var(--gold)}
.choice.locked{opacity:.45;cursor:not-allowed}
.choice.locked .why{display:block;font-family:'Inter';font-size:.68rem;color:var(--rose);letter-spacing:.4px;margin-top:4px}

/* ---------- PANNELLI (journal / save / endings / modal) ---------- */
.panel{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
 background:rgba(4,3,9,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:18px}
.panel.open{display:flex}
.card{width:min(92vw,520px);max-height:82dvh;overflow-y:auto;background:linear-gradient(170deg,rgba(30,25,48,.97),rgba(15,12,26,.97));
 border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 26px 70px rgba(0,0,0,.6)}
.card h3{font-family:'Fredoka';font-weight:600;font-size:1.15rem;margin-bottom:12px;color:#fff}
.slot{width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
 padding:12px 16px;margin-bottom:9px;color:var(--ink);font-family:'Inter';font-size:.85rem;cursor:pointer;touch-action:manipulation}
.slot b{color:var(--gold)} .slot small{display:block;color:var(--dim);margin-top:3px;font-size:.7rem}
.slot.empty{opacity:.55}
.mrow{display:flex;gap:8px;margin-top:14px}
.mbtn{flex:1;min-height:46px;border-radius:14px;border:none;font-family:'Inter';font-weight:800;font-size:.88rem;cursor:pointer;touch-action:manipulation}
.mb-p{background:linear-gradient(140deg,#8e6bff,#b892ff);color:#171129}
.mb-g{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink)}
.jentry{background:rgba(255,255,255,.045);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:11px 14px;margin-bottom:10px}
.jentry b{font-family:'Fredoka';color:var(--gold);font-weight:600;font-size:.95rem}
.jentry p{font-size:.86rem;line-height:1.6;color:#d8d2ea;margin-top:3px}
.jempty{text-align:center;color:var(--dim);padding:22px 8px;font-style:italic}

/* ---------- ENDING SCREEN ---------- */
#end-screen{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;
 gap:14px;background:radial-gradient(90% 70% at 50% 20%, #1c1530 0%, #07060d 70%);padding:24px;text-align:center;overflow-y:auto}
#end-screen.open{display:flex}
#end-kicker{font-family:'Fredoka';letter-spacing:6px;font-size:.72rem;color:var(--dim);text-transform:uppercase}
#end-title{font-family:'Fredoka';font-weight:600;font-size:clamp(1.7rem,7vw,2.9rem);
 background:linear-gradient(92deg,var(--gold),#ffb3c1 60%,var(--teal));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#end-sub{font-style:italic;color:var(--dim);font-size:.95rem;max-width:560px;line-height:1.7}
#end-stats{font-family:'Inter';font-size:.75rem;color:var(--dim);letter-spacing:.5px}
#end-gallery{display:flex;gap:8px}
.edot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12)}
.edot.seen{background:linear-gradient(135deg,var(--gold),var(--rose));box-shadow:0 0 8px rgba(240,201,135,.5)}
#end-btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center}

/* ---------- HEADER / TOAST ---------- */
.back-btn{position:fixed;top:calc(var(--site-top-bar-height, 36px) + env(safe-area-inset-top) + 8px);
 left:calc(env(safe-area-inset-left) + 12px);z-index:70;color:var(--dim);text-decoration:none;font-family:'Inter';
 font-weight:600;font-size:.8rem;padding:9px 13px;border-radius:12px;background:rgba(10,8,18,.55);
 border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:manipulation}
.back-btn:active{color:#fff}
#toast{position:fixed;top:calc(var(--site-top-bar-height,36px) + env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right)+12px);
 z-index:200;background:rgba(24,18,40,.95);border:1px solid var(--line);color:var(--ink);font-family:'Inter';
 font-size:.8rem;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:70vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<script src="../../games/top_buttons.js"></script>

<div id="game">
  <div class="bg" id="bg"></div>
  <canvas id="rain"></canvas>
  <div class="vignette"></div>
  <div id="flash"></div>
  <div id="chars"></div>
  <div id="chapter"><div id="ch-num"></div><div id="ch-title"></div></div>

  <a class="back-btn" href="./visualnovels.html">&#8592; Indice</a>

  <div id="dlg-wrap">
    <div id="nameplate"></div>
    <div id="dialogue"><span id="dtext"></span><span id="caret" style="display:none"></span>
      <div id="quick">
        <button class="qbtn" id="qAuto">Auto</button>
        <button class="qbtn" id="qJournal">Ricordi</button>
        <button class="qbtn" id="qSave">Salva</button>
        <button class="qbtn" id="qLoad">Carica</button>
        <button class="qbtn" id="qMusic">Musica</button>
        <a class="qbtn" href="./visualnovels.html" id="qExit">Esci</a>
      </div>
    </div>
  </div>

  <div id="choices"></div>
</div>

<div class="panel" id="journalPanel"><div class="card">
  <h3>Ricordi raccolti</h3><div id="jlist"></div>
  <div class="mrow"><button class="mbtn mb-g" id="jClose">Chiudi</button></div>
</div></div>

<div class="panel" id="savePanel"><div class="card">
  <h3>Salva partita</h3><div id="saveSlots"></div>
  <div class="mrow"><button class="mbtn mb-g" id="saveClose">Annulla</button></div>
</div></div>

<div class="panel" id="loadPanel"><div class="card">
  <h3>Carica partita</h3><div id="loadSlots"></div>
  <div class="mrow"><button class="mbtn mb-g" id="loadClose">Annulla</button></div>
</div></div>

<div class="panel" id="modal"><div class="card">
  <h3 id="mTitle"></h3><p id="mBody" style="color:var(--dim);font-size:.9rem;line-height:1.6;margin-bottom:6px"></p>
  <div class="mrow" id="mBtns"></div>
</div></div>

<div id="end-screen">
  <div id="end-kicker">Fine del capitolo</div>
  <div id="end-title"></div>
  <div id="end-sub"></div>
  <div id="end-stats"></div>
  <div id="end-gallery"></div>
  <div id="end-btns">
    <button class="mbtn mb-p" style="flex:none;padding:0 26px" id="endReplay">Ricomincia</button>
    <button class="mbtn mb-g" style="flex:none;padding:0 26px" id="endIndex">Indice VN</button>
  </div>
</div>

<div id="toastEl" style="display:none"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ============ UTIL ============ */
var $=function(id){return document.getElementById(id);};
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[(Math.random()*a.length)|0];}
function esc(s){return s;}

var bgEl=$('bg'),charsEl=$('chars'),nameEl=$('nameplate'),dText=$('dtext'),
    dlg=$('dialogue'),caret=$('caret'),choicesEl=$('choices'),rainCv=$('rain'),
    flashEl=$('flash'),chapEl=$('chapter');

/* ============ AUDIO ============ */
var actx=null,gMusic=null,gRain=null,gSfx=null,rainSrc=null,musicTimer=null,nextBar=0,barI=0;
var musicOn=true,sfxOn=true;
try{musicOn=localStorage.getItem('fid_music')!=='0';sfxOn=localStorage.getItem('fid_sfx')!=='0';}catch(e){}
function ensureAudio(){
  try{
    if(!actx){
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      actx=new AC();
      gMusic=actx.createGain();gMusic.gain.value=musicOn?0.42:0;gMusic.connect(actx.destination);
      gRain=actx.createGain();gRain.gain.value=0;gRain.connect(actx.destination);
      gSfx=actx.createGain();gSfx.gain.value=sfxOn?0.9:0;gSfx.connect(actx.destination);
      startRainNoise();
    }
    if(actx.state==='suspended')actx.resume();
    return true;
  }catch(e){return false;}
}
function tone(f,d,type,v,when,fEnd){
  if(!ensureAudio())return;
  try{
    var t0=actx.currentTime+(when||0);
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    if(fEnd)o.frequency.exponentialRampToValueAtTime(Math.max(1,fEnd),t0+d);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+Math.min(.03,d*.3));
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(gSfx);
    o.start(t0);o.stop(t0+d+.05);
  }catch(e){}
}
function padNote(f,when,dur,v){
  try{
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle';o.frequency.value=f;o.detune.value=rnd(-7,7);
    g.gain.setValueAtTime(.0001,when);
    g.gain.linearRampToValueAtTime(v,when+dur*.45);
    g.gain.linearRampToValueAtTime(.0001,when+dur);
    o.connect(g);g.connect(gMusic);o.start(when);o.stop(when+dur+.1);
  }catch(e){}
}
var CHORDS=[[110,164.81,220,261.63],[87.31,174.61,261.63,329.63],[130.81,196,261.63,329.63],[98,146.83,196,293.66]];
var BAR=6.6,PENTA=[329.63,392,440,523.25,587.33];
function scheduleBar(){
  if(!actx||!musicOn)return;
  var t=Math.max(nextBar,actx.currentTime+.05);
  var c=CHORDS[barI%CHORDS.length];
  for(var i=0;i<c.length;i++)padNote(c[i],t,BAR+1,i===0?.05:.038);
  if(Math.random()<.5)padNote(PENTA[(Math.random()*PENTA.length)|0],t+rnd(1,BAR-1.4),2.2,.02);
  nextBar=t+BAR;barI++;
}
function musicLoop(){if(!actx||!musicOn)return;while(nextBar<actx.currentTime+1.4)scheduleBar();}
function startMusic(){if(!ensureAudio()||musicTimer)return;nextBar=actx.currentTime+.1;barI=0;musicLoop();musicTimer=setInterval(musicLoop,500);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
function startRainNoise(){
  try{
    var len=actx.sampleRate*2,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    rainSrc=actx.createBufferSource();rainSrc.buffer=buf;rainSrc.loop=true;
    var f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.45;
    rainSrc.connect(f);f.connect(gRain);rainSrc.start();
  }catch(e){}
}
function setRainAudio(on){if(!ensureAudio())return;try{gRain.gain.setTargetAtTime(on?.05:0,actx.currentTime,1.2);}catch(e){}}
function sfxBell(){tone(660,2.4,'sine',.14);tone(1319,1.8,'sine',.05,.01);}
function sfxEngine(){tone(52,.9,'sawtooth',.12,0,38);tone(104,.7,'triangle',.06,.05,70);}
function sfxDoor(){noiseHit(.12,.1,300);}
function sfxPaper(){noiseHit(.18,.05,4200);}
function noiseHit(dur,v,freq){
  if(!ensureAudio())return;
  try{
    var len=(actx.sampleRate*dur)|0,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var s=actx.createBufferSource();s.buffer=buf;
    var f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;
    var g=actx.createGain();g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    s.connect(f);f.connect(g);g.connect(gSfx);s.start();
  }catch(e){}
}
function endingJingle(sweet){
  var seq=sweet?[392,493.88,587.33]:[440,392,329.63,261.63];
  seq.forEach(function(f,i){tone(f,.5,'sine',.12,i*.34);});
}

/* ============ PIOGGIA CANVAS ============ */
var rctx=rainCv.getContext('2d');
var drops=[],rainOn=false,rainIntensity=1,lastRainT=0;
function resizeRain(){
  rainCv.width=innerWidth;rainCv.height=innerHeight;
  drops=[];
  var n=Math.floor(innerWidth/6*rainIntensity*2);
  for(var i=0;i<n;i++)drops.push(newDrop(true));
}
function newDrop(anywhere){
  return {x:rnd(-40,innerWidth+40),y:anywhere?rnd(-innerHeight,innerHeight):rnd(-140,-10),
          l:rnd(9,22),v:rnd(9,16)};
}
function setRain(on,inten){
  rainOn=on;rainIntensity=inten||1;
  rainCv.classList.toggle('on',on);
  setRainAudio(on);
  resizeRain();
}
function rainLoop(t){
  requestAnimationFrame(rainLoop);
  var dt=clamp((t-lastRainT)/1000,0,.05);lastRainT=t;
  if(!rainOn){rctx.clearRect(0,0,rainCv.width,rainCv.height);return;}
  rctx.clearRect(0,0,rainCv.width,rainCv.height);
  rctx.strokeStyle='rgba(174,196,255,0.34)';
  rctx.lineWidth=1;
  rctx.beginPath();
  for(var i=0;i<drops.length;i++){
    var d=drops[i];
    d.y+=d.v*dt*60;d.x-=d.v*dt*8;
    rctx.moveTo(d.x,d.y);rctx.lineTo(d.x+d.l*.12,d.y+d.l);
    if(d.y>innerHeight+30){drops[i]=newDrop(false);}
  }
  rctx.stroke();
}
requestAnimationFrame(rainLoop);
addEventListener('resize',resizeRain);

 {type:'say',n:'Io',t:'Sul tavolo, la grafia da maestro: \u201cOre 18:00 \u2014 rotondo. Ore 18:40 \u2014 rotondo. Ore 19:20 \u2014 casa.\u201d Venticinque anni di timbrini invisibili.'},
 {type:'say',n:'Io',t:'Nel vano guanti della Panda: tagliandi in ordine cronologico, e una busta senza francobollo. A me. Dal 1998. Piegate in otto come una preghiera tasca-size.'},
 {type:'sub',to:'choice_open_letter'}
],

cap3_bar:[
 {type:'chapter',num:'Capitolo III',title:'Le verit\u00e0'},
 {type:'scene',id:'home'},
 {type:'rain',on:true},
 {type:'say',n:'',t:'Alle 3, la madre mi manda a casa per \u201cil pigiamino grigio e le ciabatte, quelle buone\u201d. La casa sa di cipolla e di carta vecchia. L\u2019orologio a pendolo ha tre minuti di ritardo, fedele al suo mestiere.'},
 {type:'say',n:'Io',t:'Calendario fermo a marzo. Foglio sul tavolo: \u201cOre 18:00 \u2014 rotondo. Ore 18:40 \u2014 rotondo. Ore 19:20 \u2014 casa.\u201d La routine di un uomo che pregava senza sapere pregare.'},
 {type:'say',n:'Io',t:'Nel vano guanti della Panda, sotto i tagliandi: una busta senza francobollo, a me, dal 1998. La prendo con due dita, come si prendono le cose che mordono.'},
 {type:'sub',to:'choice_open_letter'}
],

choice_open_letter:[
 {type:'say',n:'Io',t:'Ventotto anni chiusa. La carta \u00e8 gialla ai bordi. Il suo timbro a matita sull\u2019angolo: \u201crileggere\u201d.'},
 {type:'menu',choices:[
   {text:'Aprirla adesso, sotto la pioggia del vano guanti.',jump:'letter_partial'},
   {text:'Ripiegarla. Prima pap\u00e0, poi le carte. In ordine.',jump:'letter_later'}
 ]}
],

letter_partial:[
 {type:'sfx',fn:'paper'},
 {type:'say',n:'',t:'La busta si apre con un sospiro di colla vecchia. Due righe e poi una strappo. La calligrafia corre, come se avesse paura di non fare in tempo.'},
 {type:'letter',t:'\u201cMatteo. Ho cominciato questa lettera quaranta volte. Ogni volta che la butto, il giorno dopo la riglio. Tu ed io siamo uguali: parliamo bene solo coi silenzi. Per\u00f2 un silenzio lungo vent\u2019anni non \u00e8 pi\u00f9 un silenzio: \u00e8 un muro. Io vorrei dirti che il rotondo... \u201d'},
 {type:'say',n:'',t:'Il resto \u00e8 strappato. Manca il pezzo centrale. La frase si interrompe esattamente dove avrebbe dovuto iniziare tutto.'},
 {type:'flag',name:'partial_letter'},
 {type:'journal',id:'r_letter_parz'},
 {type:'say',n:'Io',t:'Cerca il pezzo mancante tra i sedili con il telefono come torcia. Trovo briciole, una moneta svizzera del \u201996, il coperchio della borraccia. Nessuna frase.'},
 {type:'fade'},
 {type:'goto',then:'dawn_drive'}
],

letter_later:[
 {type:'say',n:'Io',t:'La ripiego lungo le pieghe gi\u00e0 fatte. La metto nel taschino interno, quello della giacca buono, dove si mettevano le cose vere prima dei cellulari.'},
 {type:'say',n:'Io',t:'\u201cPrima pap\u00e0.\u201d La lettera mi scalda il petto dal taschino come un mattone piccolo. Cammino verso la porta con la sensazione di portare in consegna me stesso.'},
 {type:'fade'},
 {type:'goto',then:'dawn_drive'}
],

dawn_drive:[
 {type:'scene',id:'car'},
 {type:'say',n:'',t:'Rientro all\u2019ospedale alle 4:40 con il pigiamino grigio e le ciabatte buone. Nel parcheggio, resto un minuto con le mani sul volante. Il vano autoradio attende, con la sua cassetta scritta a matita.'},
 {type:'menu',choices:[
   {text:'Inserire la cassetta. Adesso, qui, da sola.',jump:'tape_listen',needFlag:'r_cassetta',lockWhy:'Serve aver visto l\u2019autoradio in stanza 12'},
   {text:'Lasciare la cassetta dov\u2019\u00e8. Alcune porte si aprono una volta sola.',jump:'tape_skip'}
 ]}
],

tape_listen:[
 {type:'sfx',fn:'paper'},
 {type:'say',n:'',t:'L\u2019autoradio mangia la cassetta con un rantolo meccanico. Fruscio. Lungo fruscio di nastro che scorre. Poi la sua voce.'},
 {type:'letter',t:'\u201cEhm. Prova. Prova, diciamo. Uno, due. ...Mah. Matteo. Se senti questa vuol dire che sei tornato con la Panda, quindi o sei un buon figlio o l\u2019hai rubata, nel caso ti avviso che i freni fanno le bizze sul bagnato.\u201d'},
 {type:'letter',t:'\u201cVorrei dirti una cosa sola e non ci riesco neanche registrando, figurati davanti. La faccio facile. Sai perch\u00e9 giro il rotondo tre volte la sera?\u201d'},
 {type:'shake'},
 {type:'letter',t:'\u201cPerch\u00e9 tuo nonno se n\u2019andato l\u00ec. Non in ospedale, non in casa. L\u00ec, sull\u2019isola, col trattore, per la strada ghiacciata del febbraio del \u201997. Fuori dai conti. E io... io non ho mai preso la terza uscita senza pensarlo. Girare quei tre giri era il mio buongiorno e la mia buonanotte. Era la mia maniera di dirgli: ci sono ancora, vecchio. E la tua maniera, adesso, sar\u00e0 dirmelo tu. A me.\u201d'},
 {type:'letter',t:'\u201cNon ti chiedo scusa per il silenzio. Le scuse servono quando puoi fare diversamente. Ti chiedo una cosa pi\u00f9 difficile: quando non ci sar\u00f2, passa dal rotondo. Una volta basta. Salutalo tu, che la voce ce l\u2019hai, te l\u2019ho dato io.\u201d'},
 {type:'letter',t:'\u201cE se per caso trovi anche la lettera del vano guanti \u2014 s\u00ec, lo so che c\u2019\u00e8 \u2014 non leggerla da solo. Portala al rotondo. Le cose grandi si leggono al rotondo.\u201d'},
 {type:'flag',name:'heard_tape'},
 {type:'say',n:'',t:'Il nastro continua: tre minuti di silenzio registrato, con la pioggia di un\u2019altra sera. Poi la sua voce, piccola: \u201cFine. Anzi no. Matteo. Scusa per tutto. Fine.\u201d'},
 {type:'say',n:'Io',t:'Spengo con due dita, piano, come si spengono i bambini. Resto fermo. La pioggia batte sul tetto metallico una musica che stavolta capisco.'},
 {type:'fade'},
 {type:'goto',then:'final_roundabout'}
],

tape_skip:[
 {type:'say',n:'Io',t:'La lascio l\u00ec, nel suo alloggio polveroso. \u201cPer quando torner\u00e0.\u201d Sono tornato. Per\u00f2 certe cassette si ascoltano con dentro abbastanza coraggio, e stanotte ne ho gi\u00e1 speso tutto per le ciabatte buone.'},
 {type:'say',n:'Io',t:'Spengo la radio. La pioggia fa da banda sonora. Guido piano verso l\u2019ospedale con la sensazione di aver perso l\u2019ultimo autobus della mia vita per controllare i biglietti.'},
 {type:'fade'},
 {type:'goto',then:'final_roundabout'}
],

final_roundabout:[
 {type:'chapter',num:'Capitolo IV',title:'L\u2019uscita'},
 {type:'scene',id:'round_dawn'},
 {type:'rain',on:false},
 {type:'say',n:'',t:'Alba. La pioggia si \u00e8 ritirata lasciando l\u2019asfalto lucido come una pista da pattinaggio. Il rotondo \u00e8 vuoto: un anello d\u2019oro spento nell\u2019azzurro freddo del primo mattino.'},
 {type:'say',n:'Io',t:'Mi fermo sul ciglio, motorino acceso, tergi fermi. Sull\u2019isola, i cespugli a spicchi hanno dei bottoni bianchi che non c\u2019erano ieri: le farfalle dell\u2019uomo dei rotondi, nuove di zecca, bagnate.'},
 {type:'say',n:'Io',t:'L\u2019ospedale \u00e8 a cinque minuti. La madre ha detto \u201cprima dell\u2019alba\u201d. L\u2019alba \u00e8 adesso, ed \u00e8 gi\u00e0 quasi finita. Il tempo fa cos\u00ec: non passa, cade.'},
 {type:'if',needFlag:'followed_enzo',then:'final_enzo_appears'},
 {type:'menu_final'}
],

final_enzo_appears:[
 {type:'say',n:'',t:'Tra i cespugli, un movimento. Enzo. Seduto su una panchina di pietra che giurerei ieri non c\u2019era, col cappello in mano e i capelli asciutti, come se la pioggia lo rispettasse.'},
 {type:'show',char:'enzo',pos:'center'},
 {type:'say',n:'Enzo',t:'Ah, il figliolo del panda! Mi sa che stanotte ho fatto confusione, eh. Ho fatto confusione con gli anni. Mi scuserai. Quando piove mi torna il 1974 e il maestro Bruni che piantava il palo col mio badile.'},
 {type:'say',n:'Io',t:'\u201cEnzo. Quella casa col pioppo... chi c\u2019abitava adesso?\u201d'},
 {type:'say',n:'Enzo',t:'Nessuno, figliolo. L\u2019hanno buttata gi\u00f9 per fare questa rotonda gigante. Proprio qua. Il pioppo era pi\u00f9 o meno dove stanno le tue farfalle bianche. Che te pare, eh? Il mondo gira, ma gira attorno alle stesse radici.'},
 {type:'say',n:'Io',t:'Mi tremano le mani sul volante. Il vecchio si alza, si mette il cappello, e prima di voltarmi le sparme mi guarda come si guardano i figli quando dormono.'},
 {type:'say',n:'Enzo',t:'Corri, giovane. Chi deve sentirlo sta aspettando da stanotte. E se lo trovi ancora con gli occhi aperti, non dirgli niente di complicato: tienigli la mano. Le mani ricordano pi\u00f9 delle teste.'},
 {type:'hide',char:'enzo'},
 {type:'menu_final'}
],

secret_letter:[
 {type:'say',n:'',t:'Il taschino interno mi brucia. Tre ricordi stanotte, e la lettera piegata in otto che pesa come un mattone di casa.'},
 {type:'say',n:'Io',t:'\u201cLe cose grandi si leggono al rotondo.\u201d Bene. Allora adesso.'},
 {type:'sfx',fn:'paper'},
 {type:'letter',t:'\u201cMatteo. Marzo 1998. Stamani ti ho visto partire allo specchio del bagno, perch\u00e9 non ho avuto il fegato di guardarti in faccia al cancello. Hai la mia schiena. Me ne dispiace: te l\u2019avrei risparmiata volentieri, insieme a questo paese e alle sue strisce pedonali.\u201d'},
 {type:'letter',t:'\u201cTu e io non ci parliamo da quando \u00e8 morto tuo nonno, e io lo so perch\u00e9: somigliavo troppo al dolore, e tu ti guardavi da me come ci si guarda allo specchio dopo una brutta notizia. Non era te che evitavo, figliolo. Erano io stesso, riflesso.\u201d'},
 {type:'letter',t:'\u201cTre giri la sera. Li faccio dal funerale. Tre giri e poi casa, perch\u00e9 il rotondo \u00e8 costruito dove c\u2019era il campo del maestro Bruni, e l\u2019isolotto \u00e8 dove c\u2019era il pioppo della tua nascita. Tu lo dimentichi, io lo so. I paesi cancellano, i padri archiviano. Ma un uomo ha diritto di salutare suo padre ogni sera, no? Anche in silenzio. Soprattutto in silenzio.\u201d'},
 {type:'shake'},
 {type:'letter',t:'\u201cUltima cosa, e poi ti lascio stare. Se verr\u00e0 il giorno che non posso parlare \u2014 e viene, viene a tutti \u2014 non cercare le parole grandi. Prendimi la mano e stringi. Tre volte. Una per mio padre. Una per me. Una per te. Le mani ricordano pi\u00f9 delle teste, me lo insegn\u00f2 Enzo Zanetti col suo badile.\u201d'},
 {type:'letter',t:'\u201cPrendi la terza uscita. E non guardare indietro se non per salutare. Tuo pap\u00e0, Aldo. P.S.: la Panda va tenuta. Non discutere.\u201d'},
 {type:'flag',name:'read_letter_full'},
 {type:'say',n:'Io',t:'Resto con la lettera aperta sulle ginocchia e la pioggia finita nelle ciglia. Non piove. Sono io. Da quarantasette anni non piangevo da... be'},
 {type:'say',n:'Io',t:'Da sempre.'},
 {type:'goto',then:'ending_e6'}
],

ending_e1:[
 {type:'scene',id:'hospital_room'},
 {type:'say',n:'',t:'Corridoio. Ascensore. Corridoio. Stanza 12. La porta \u00e8 aperta e dentro c\u2019\u00e8 un silenzio diverso: non il silenzio di chi dorme. Quello di chi \u00e8 andato oltre il sonno, dove nemmeno i monitor arrivano.'},
 {type:'say',n:'Madre',t:'(piano) ...Alle 5:10. Piano piano. Come spegne lui le luci.'},
 {type:'say',n:'Io',t:'Sul comodino, gli occhiali da notte piegati. La mano fuori dalle coperte \u00e8 ancora tiepida. La prendo. Non stringo tre volte: non lo sapevo ancora. La tengo. Solo tenerla, per quanto possibile, che \u00e8 sempre troppo poco e \u00e8 tutto quello che c\u2019\u00e8.'},
 {type:'say',n:'',t:'Fuori inizia l\u2019alba vera. Giulia, in fondo al corridoio, abbassa la testa. La madre appoggia la fronte sulla mia spalla e per la prima volta da dodici anni piango davanti a qualcuno. Piango per due, per tre.'},
 {type:'say',n:'Io',t:'Pap\u00e0. Ho perso l\u2019uscita. Ma giuro che il prossimo giro lo faccio per due.'}
],
ending_e3:[
 {type:'scene',id:'hospital_room'},
 {type:'say',n:'',t:'Stanza 12. \u00c8 ancora l\u00e0. Gli occhi aperti puntati sul soffitto che elenca, e quando entro si volta piano, piano, come i ponti levatoi si alzano: un movimento antico, lento, inevitabile.'},
 {type:'say',n:'Padre',t:'...Il ragazzo. \u00c8 venuto il ragazzo.'},
 {type:'say',n:'Io',t:'\u201cSono qui, pap\u00e0.\u201d Mi avvicino. La sua mano fuori dalle coperte \u00e8 piccola adesso, e freddolina, e con le vene che raccontano. La prendo. Stringo. Una. Due. Tre.'},
 {type:'say',n:'Padre',t:'(sorriso stanco) ...Tre giri. Bravo. ...Hai preso la patente, eh.'},
 {type:'say',n:'',t:'Ride piano, senza fiato, una risata di bollicine. Poi si riaddormenta cos\u00ec, con la mano dentro la mia. Il medico dice giorni. Giulia, alle 7, porta due caff\u00e8 e non chiede nulla. La madre dorme finalmente in piedi sulla poltrona.'},
 {type:'say',n:'Io',t:'Non ci saranno discorsi epici. Non li abbiamo mai fatti e non iniziamo ora. Ci sar\u00e0 la mano, ogni giorno, finch\u00e9 ce n\u2019\u00e8. E poi, dopo, il rotondo. Una volta basta: me l\u2019ha chiesto lui, per iscritto, come i maestri.'}
],
ending_e2:[
 {type:'scene',id:'round_night'},
 {type:'rain',on:true},
 {type:'say',n:'',t:'Non entro. Giro. Primo giro: la radio parla del traffico in MIR. Secondo giro: le farfalle bianche nell\u2019isolotto. Terzo giro: lo specchio mi mostra un uomo che assomiglia sempre di pi\u00f9 a suo padre.'},
 {type:'say',n:'Io',t:'Al quarto giro smetto di contare e lascio che la Panda faccia quello che vuole lei, che \u00e8 girare. Il telefonino illumina il cruscotto: 7 missed calls, mamma. Non \u00e8 ancora l\u2019alba che basta. Non sar\u00e0 mai un\u2019alba che basta.'},
 {type:'say',n:'',t:'Anni dopo \u2014 e gli anni qui corrono come sull\u2019autostrada \u2014 c\u2019\u00e8 chi mi vede ancora, ogni sera, tre giri lenti al rotondo della mia infanzia, finestra abbassata anche a dicembre. Dicono che sono matto. Forse. Oppure sto salutando, come sanno fare poche persone e tutti i padri.'},
 {type:'say',n:'Io',t:'Pap\u00e0. La prossima volta scrivermi, ti prego. Io non so arrivare se non mi scrivi.'}
],
ending_e4:[
 {type:'scene',id:'round_sunset'},
 {type:'say',n:'',t:'Chiamo Giulia alle 5:30. Risponde al primo squillo, come se fosse sveglia da un anno ad aspettare quella chiamata. \u201cSto arrivando al rotondo\u201d, le dico. \u201cPortaci la lettera\u201d, dice lei. Io non le ho detto della lettera.'},
 {type:'say',n:'',t:'La leggiamo insieme seduti sul cordolo dell\u2019isolotto, tra le farfalle bagnate, alternandoci le pagine come si alterna una coperta. Lei piange alla seconda riga. Io alla penultima. Alla firma piangiamo a due voci, che \u00e8 quasi un coro.'},
 {type:'time',t:'Un anno dopo'},
 {type:'say',n:'',t:'Sono rimasto. Casa paterna ha una stanza in affitto a una studentessa di Parma che porta rispetto e una pianta. Giulia e io ci vediamo il marted\u00ec. Non \u00e8 il \u201998, non sar\u00e0 mai il \u201998: sono i marted\u00ec, e a volte i marted\u00ec bastano.'},
 {type:'say',n:'Io',t:'Ogni sera, prima di entrare, giro il rotondo tre volte. Non \u00e8 superstizione: \u00e8 posta. Tre giri, tre saluti, e poi le luci di casa. Pap\u00e0 ha insegnato lui per primo; noi abbiamo solo imparato l\u2019orario.'}
],
ending_e5:[
 {type:'scene',id:'wheat'},
 {type:'rain',on:false},
 {type:'say',n:'',t:'Non vado subito all\u2019ospedale. Seguo Enzo oltre il bivio, nel grano bagnato dell\u2019alba, fino a uno spiazzo dove il fango custodisce ancora la sagoma di un ceppo enorme.'},
 {type:'say',n:'Enzo',t:'Eccolo! Tagliato nel \u201974, lo vedi? Roba da far piangere un sarto. E l\u00ecc\u2019era la casa... no, aspetta. La casa era l\u00e0 dove oggi ci sono i pannelli. Mah. Comunque bella gente, i Bruni. Il maestro, il fratello camionista... e il nipotino. Come ti chiami, giovanotto?'},
 {type:'say',n:'Io',t:'\u201cMatteo.\u201d'},
 {type:'say',n:'Enzo',t:'Matteo! Come il nipotino del maestro! Quello che scappava col triciclo rosso sotto il pioppo! Uguale. Stessi occhi da spaventato e stessa testardaggine. Salutalo tu che lui non sente pi\u00f9 nessuno, poveretto. \u00c8 dal \u201997 che aspetta qualcuno di casa.'},
 {type:'say',n:'Io',t:'Mi piego sul ceppo. Il grano, mosso dal vento, fa il rumore che faceva il telo della culla. E per la prima volta da ventotto anni dico ad alta voce: \u201cCiao nonno. Sono di passaggio. Ma torno.\u201d'},
 {type:'say',n:'',t:'Enzo applaude piano, due battiti da teatro di paese. Poi mi indica l\u2019ospedale che si vede lontano, bianco tra i campi: \u201cOra corri da tuo babbo, che sta aspettando da stanotte. E digli che Enzo ha rivisto il pioppo. Diglielo, che a noi vecchi queste cose ci rimettono l\u2019anima a posto.\u201d'},
 {type:'say',n:'Io',t:'Corro. Attraverso il grano, con le ciabatte buone in mano e le scarpe piene di mattina. Corro come il nipotino del triciclo rosso. Arrivo in tempo. Questa volta arrivo in tempo.'}
],
ending_e6:[
 {type:'scene',id:'island'},
 {type:'say',n:'',t:'Attraverso la strada a piedi, con la lettera nel taschino e il cuore in gola. Sull\u2019isolotto le farfalle bianche dell\u2019uomo dei rotondi brillano di rugiada. Qui. \u201cLe cose grandi si leggono al rotondo.\u201d Qui c\u2019era il pioppo di Matteo-bambino. Qui \u00e8 morto Aldo-nonno. Questo cerchio d\u2019asfalto \u00e8 la nostra cattedrale: piccolo, umido, illuminato a spese del comune.'},
 {type:'say',n:'Io',t:'Leggo la lettera ad alta voce. Tutta. Le mie stesse parole suonano diverse all\u2019aperto: pi\u00f9 piccole e pi\u00f9 vere. A un certo punto una macchina rallenta, vede un uomo in piedi su un isolotto che legge una lettera del 1998 alla luce dell\u2019alba, e decide che oggi la citt\u00e0 ha altro a cui pensare. Grazie, signore.'},
 {type:'say',n:'',t:'Alla fine, faccio quello che chiede l\u2019ultima riga. Mi piego verso i cespugli, verso il punto esatto, e stringo il pugno tre volte nell\u2019aria. Una per nonno Aldo. Una per pap\u00e0. Una per me. Tre clacson lontani sembrano rispondermi, ma \u00e8 solo il turno di notte che entra nel rotondo. O forse no. Da oggi scelgo: forse no.'},
 {type:'say',n:'Io',t:'Poi prendo la terza uscita. Senza guardare indietro se non per salutare. Come da istruzioni. La Panda va tenuta: non discuto.'}
]

};

var curLabel='start',curIdx=0,typing=false,typeTimer=null,autoOn=false,autoTimer=null,
    busy=false,currentCharColor='#f0c987';

var NAME_COLORS={'':'#a79fc0','Io':'#7ad0c0','Matteo':'#7ad0c0','Enzo':'#f0c987',
 'Padre':'#8fa7ff','Giulia':'#e8929c','Madre':'#b9a5f5','???':'#b9a5f5'};

var SCENES={
 car:'sc-car',round_sunset:'sc-round-sunset',round_night:'sc-round-night',
 round_dawn:'sc-round-dawn',hospital:'sc-hospital',room:'sc-room',
 home:'sc-home',wheat:'sc-wheat',island:'sc-island'
};

function setScene(id){
  if(state.sceneId===id&&$('bg').dataset.ready==='1'){return;}
  state.sceneId=id;
  var cls=SCENES[id]||'sc-car';
  bgEl.innerHTML='';
  var layer=document.createElement('div');
  layer.className='layer scene '+cls;
  bgEl.appendChild(layer);
  if(id==='round_sunset'||id==='round_night'||id==='round_dawn'){
    [[12,'#ffd9a0'],[37,'#ffd9a0'],[68,'#ffd9a0']].forEach(function(pos){
      var lamp=document.createElement('div');lamp.className='horizon-lamp';
      lamp.style.left=pos[0]+'%';lamp.style.top='58%';lamp.style.height='16%';
      layer.appendChild(lamp);
      var lamp2=document.createElement('div');lamp2.className='horizon-lamp';
      lamp2.style.left=pos[1]+'%';lamp2.style.top='58%';lamp2.style.height='16%';
      layer.appendChild(lamp2);
    });
  }
  requestAnimationFrame(function(){layer.classList.add('on');});
  $('bg').dataset.ready='1';
}

function showChar(id,pos){
  hideChar(id);
  var el=document.createElement('div');
  el.className='puppet enter';
  el.id='char-'+id;
  var colors={enzo:'#f0c987',father:'#8fa7ff',giulia:'#e8929c',mother:'#b9a5f5',nurse:'#7ad0c0'};
  el.innerHTML=charSVG(id,colors[id]||'#f0c987');
  el.style.alignSelf='flex-end';
  if(pos==='left'){el.style.marginRight='auto';el.style.marginLeft='4vw';}
  else if(pos==='right'){el.style.marginLeft='auto';el.style.marginRight='4vw';}
  charsEl.appendChild(el);
  setTimeout(function(){el.classList.remove('enter');},850);
}
function hideChar(id){
  var el=document.getElementById('char-'+id);
  if(el){el.classList.add('gone');setTimeout(function(){if(el.parentElement)el.parentElement.removeChild(el);},720);}
}
function dimOthers(activeIdx){
  Array.prototype.forEach.call(charsEl.children,function(c,i){
    c.classList.toggle('dim',i!==activeIdx);
  });
}

function chapterShow(num,title){
  $('ch-num').textContent=num||'';$('ch-title').textContent=title||'';
  chapEl.classList.add('show');
  setTimeout(function(){chapEl.classList.remove('show');},2600);
}

function addMemory(id){
  if(state.mem.indexOf(id)>=0)return false;
  state.mem.push(id);
  toast('Ricordo: '+MEM_META[id].t);
  tone(880,.3,'sine',.07);tone(1174,.4,'sine',.06,.12);
  return true;
}
function memCount(){return state.mem.length;}

function toast(msg){
  var el=$('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show');},2200);
}
function shake(){document.getElementById('game').classList.remove('shakeit');void document.getElementById('game').offsetWidth;document.getElementById('game').classList.add('shakeit');}
function fadeBlack(){
  flashEl.style.opacity='1';
  setTimeout(function(){flashEl.style.opacity='0';},650);
}
function showLetter(text){
  nameEl.textContent='—';nameEl.style.color='#cbb8f7';
  typeText(text);
}

/* typewriter */
var fullText='',typePos=0,typeSpeed=22;
function typeText(text){
  fullText=text;typePos=0;typing=true;
  caret.style.display='inline-block';
  dText.textContent='';
  clearInterval(typeTimer);
  typeTimer=setInterval(function(){
    typePos++;
    dText.textContent=fullText.slice(0,typePos);
    dlg.scrollTop=dlg.scrollHeight;
    if(typePos>=fullText.length)finishType();
  },typeSpeed);
}
function finishType(){
  clearInterval(typeTimer);typing=false;
  typePos=fullText.length;dText.textContent=fullText;
  caret.style.display='none';
  if(autoOn)queueAuto();
}
function queueAuto(){clearTimeout(autoTimer);autoTimer=setTimeout(function(){if(autoOn&&!busy)advance();},1500);}

function sayLine(name,text){
  nameEl.textContent=name||'';
  currentCharColor=NAME_COLORS[name]||'#f0c987';
  nameEl.style.color=currentCharColor;
  typeText(text);
  var idx=-1;
  Array.prototype.forEach.call(charsEl.children,function(c,i){
    if(c.classList.contains('dim'))c.classList.remove('dim');
    if(i===0)idx=i;
  });
  dimOthers(-1);
}

/* menu con condizioni */
function renderChoices(list){
  choicesEl.innerHTML='';
  choicesEl.classList.add('open');
  var k=1;
  list.forEach(function(c){
    var locked=false,why='';
    if(c.needFlag&&!state.flags[c.needFlag]){locked=true;why=c.lockWhy||'\u2014 serve un ricordo ancora chiuso \u2014';}
    if(c.needMem&&memCount()<c.needMem){locked=true;why='\u2014 servono '+(c.needMem-memCount())+' ricordi ancora chiusi \u2014';}
    var btn=document.createElement('button');
    btn.className='choice'+(locked?' locked':'');
    btn.innerHTML='<span class="key">'+(k<=9?k:'\u00b7')+'</span><span>'+esc(c.text)+(locked?'<span class="why">'+esc(why)+'</span>':'')+'</span>';
    if(!locked){
      (function(cc){
        btn.addEventListener('click',function(ev){
          ev.stopPropagation();
          ensureAudio();
          choicesEl.classList.remove('open');
          chooseOption(cc);
        });
      })(c);
    }else{
      btn.addEventListener('click',function(ev){ev.stopPropagation();toast('Questo percorso \u00e8 ancora chiuso.');});
    }
    choicesEl.appendChild(btn);
    k++;
  });
}
function chooseOption(c){
  if(c.flag)state.flags[c.flag]=true;
  if(c.action==='exit'){location.href='./visualnovels.html';return;}
  if(c.action==='restart'){resetRun();return;}
  gotoLabel(c.jump);
}

/* esecuzione linee */
var processRunning=false,pendingGoto=null;
function requestGoto(lb){pendingGoto=lb;}
function processLine(){
  if(processRunning){return;}
  processRunning=true;
  var guard=0;
  try{
    for(;;){
      if(pendingGoto){curLabel=pendingGoto;curIdx=0;pendingGoto=null;}
      var block=SCRIPT[curLabel];
      if(!block||curIdx>=block.length)return;
      var line=block[curIdx];
      var t=line.type;
      if(t==='scene'){setScene(line.id);curIdx++;continue;}
      if(t==='rain'){setRain(line.on,line.intensity);curIdx++;continue;}
      if(t==='music'){line.on?startMusic():stopMusic();curIdx++;continue;}
      if(t==='sfx'){({engine:sfxEngine,bell:sfxBell,paper:sfxPaper,door:sfxDoor})[line.fn]&&({engine:sfxEngine,bell:sfxBell,paper:sfxPaper,door:sfxDoor})[line.fn]();curIdx++;continue;}
      if(t==='shake'){shake();curIdx++;continue;}
      if(t==='fade'){fadeBlack();curIdx++;continue;}
      if(t==='chapter'){chapterShow(line.num,line.title);curIdx++;continue;}
      if(t==='flag'){state.flags[line.name]=true;curIdx++;continue;}
      if(t==='journal'){
        state.flags[line.id]=true;
        addMemory(line.id);
        curIdx++;continue;
      }
      if(t==='time'){curIdx++;continue;}
      if(t==='phone'){
        tone(880,.18,'sine',.08);tone(880,.18,'sine',.08,.3);
        curIdx++;continue;
      }
      if(t==='radio'||t==='letter'){
        nameEl.textContent=t==='letter'?'La lettera':'La radio';
        nameEl.style.color=t==='letter'?'#cbb8f7':'#f0c987';
        typeText(line.t);return;
      }
      if(t==='sub'){requestGoto(line.to);continue;}
      if(t==='goto'){requestGoto(line.then);continue;}
      if(t==='if'){
        var ok=line.needFlag?!!state.flags[line.needFlag]:true;
        if(ok&&line.countMem)ok=memCount()>=line.countMem;
        if(ok){requestGoto(line.then);}else{curIdx++;}
        continue;
      }
      if(t==='menu'){renderChoices(filterChoices(line.choices));return;}
      if(t==='menu_final'){renderChoices(buildFinalChoices());return;}
      if(t==='ending'){openEnding(line);return;}
      if(t==='say'){
        sayLine(line.n,line.t);return;
      }
      if(t==='show'){showChar(line.char,line.pos);curIdx++;continue;}
      if(t==='hide'){hideChar(line.char);curIdx++;continue;}
      curIdx++;
    }
  }finally{processRunning=false;}
}
function killType(){
  clearInterval(typeTimer);typing=false;
  typePos=String(fullText).length;
  caret.style.display='none';
}
function gotoLabel(lb){
  if(!SCRIPT[lb])return;
  killType();clearTimeout(autoTimer);
  curLabel=lb;curIdx=0;processLine();
}
function filterChoices(list){
  return list.filter(function(c){return !(c.hideIfFlag&&state.flags[c.hideIfFlag]);});
}
function buildFinalChoices(){
  var list=[
    {text:'Accorrere all\u2019ospedale. Adesso.',jump:'run_hospital'},
    {text:'Fare ancora un giro. Un ultimo giro.',jump:'loop_forever'}
  ];
  if(state.flags['r_promessa'])list.push({text:'Chiamare Giulia. Restare, stavolta.',jump:'stay_giulia'});
  if(state.flags['followed_enzo'])list.push({text:'Seguire Enzo oltre il bivio, nel grano.',jump:'follow_grain'});
  if(memCount()>=3&&!state.flags['read_letter_full'])list.push({text:'Aprire la lettera fino in fondo, sull\u2019isolotto.',jump:'read_at_island'});
  list.push({text:'Ripartire. Non \u00e8 ancora ora.',action:'exit_soft'});
  return list;
}

/* percorsi finali */
SCRIPT.run_hospital=[
 {type:'if',countMem:2,then:'ending_e3'},
 {type:'goto',then:'ending_e1'}
];
SCRIPT.loop_forever=[
 {type:'goto',then:'ending_e2'}
];
SCRIPT.stay_giulia=[
 {type:'goto',then:'ending_e4'}
];
SCRIPT.follow_grain=[
 {type:'goto',then:'ending_e5'}
];
SCRIPT.read_at_island=[
 {type:'goto',then:'ending_e6'}
];

/* ============ ENDING SCREEN ============ */
function openEnding(line){
  stopMusic();setRain(false);
  var seen=[];
  try{seen=JSON.parse(localStorage.getItem('fid_seen')||'[]');}catch(e){}
  if(seen.indexOf(line.id)<0)seen.push(line.id);
  try{localStorage.setItem('fid_seen',JSON.stringify(seen));}catch(e){}
  endingJingle(!(line.id==='ending_e2'||line.id==='ending_e1'));
  $('end-title').textContent=line.title;
  $('end-kicker').textContent='Finale '+line.num+' di 6';
  var subs={
   ending_e1:'Alcune uscite non si riprendono. Si attraversano.',
   ending_e2:'Ci sono giri che durano una vita, e vite che durano un giro.',
   ending_e3:'Tre giri, tre strette di mano. La terza era per te.',
   ending_e4:'Restare \u00e8 anch\u2019esso un modo di partire, ogni sera.',
   ending_e5:'Il grano ricorda le voci, anche quando i nomi svaniscono.',
   ending_e6:'\u201cPrendi la terza uscita. E non guardare indietro se non per salutare.\u201d'
  };
  $('end-sub').textContent=subs[line.id]||'';
  var epLines=[];
  var block=SCRIPT[curLabel];
  for(var i=0;i<block.length;i++){if(block[i].type==='say'&&block[i].n==='')epLines.push(block[i].t);}
  $('end-sub').textContent=(epLines.slice(-1)[0]||subs[line.id]);
  $('end-stats').textContent='Ricordi raccolti: '+memCount()+' / 5 \u00b7 Finali scoperti: '+seen.length+' / 6';
  var gal=$('end-gallery');gal.innerHTML='';
  ['ending_e1','ending_e2','ending_e3','ending_e4','ending_e5','ending_e6'].forEach(function(id){
    var dot=document.createElement('span');dot.className='edot'+(seen.indexOf(id)>=0?' seen':'');
    gal.appendChild(dot);
  });
  $('endReplay').onclick=function(){resetRun();$('end-screen').classList.remove('open');};
  $('endIndex').onclick=function(){location.href='./visualnovels.html';};
  $('end-screen').classList.add('open');
}

/* numeri finali */
var TITLES={ending_e1:'L\u2019uscita mai presa',ending_e2:'Giri infiniti',ending_e3:'L\u2019ultima uscita insieme',ending_e4:'Chi resta',ending_e5:'La casa nel grano',ending_e6:'La lettera'};
(function(){
  var nums={ending_e1:1,ending_e2:2,ending_e3:3,ending_e4:4,ending_e5:5,ending_e6:6};
  Object.keys(nums).forEach(function(k){
    SCRIPT[k]=SCRIPT[k].concat([{type:'ending',id:k,num:nums[k],title:TITLES[k]}]);
  });
})();

function resetRun(){
  killType();clearTimeout(autoTimer);
  state.flags={};state.mem=[];state.sceneId='';
  curLabel='start';curIdx=0;
  charsEl.innerHTML='';
  $('bg').dataset.ready='';
  setRain(false);startMusic();
  processLine();
}

/* ============ INPUT ============ */
function advance(){
  if(busy)return;
  if(choicesEl.classList.contains('open'))return;
  if(typing){finishType();return;}
  curIdx++;
  processLine();
}
dlg.addEventListener('click',advance);
document.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();advance();return;}
  if(choicesEl.classList.contains('open')&&/^[1-9]$/.test(e.key)){
    var btns=choicesEl.querySelectorAll('.choice:not(.locked)');
    var idx=parseInt(e.key,10)-1;
    if(btns[idx])btns[idx].click();
  }
});
document.addEventListener('pointerdown',function(){ensureAudio();},{once:true});

/* ============ JOURNAL / SAVE ============ */
function openJournal(){
  var list=$('jlist');list.innerHTML='';
  if(!state.mem.length){list.innerHTML='<div class="jempty">Ancora nessun ricordo. La notte \u00e8 giovane e crudele.</div>';}
  state.mem.forEach(function(id){
    var m=MEM_META[id];if(!m)return;
    var div=document.createElement('div');div.className='jentry';
    div.innerHTML='<b>'+esc(m.t)+'</b><p>'+esc(m.d)+'</p>';
    list.appendChild(div);
  });
  $('journalPanel').classList.add('open');
}
$('qJournal').addEventListener('click',function(e){e.stopPropagation();openJournal();});
$('jClose').addEventListener('click',function(){$('journalPanel').classList.remove('open');});

var SLOT_KEY='fid_slots_v1';
function getSlots(){try{return JSON.parse(localStorage.getItem(SLOT_KEY))||[null,null,null];}catch(e){return [null,null,null];}}
function setSlots(s){try{localStorage.setItem(SLOT_KEY,JSON.stringify(s));}catch(e){}}
function snapshot(){
  return {label:curLabel,idx:curIdx,flags:state.flags,mem:state.mem,
    sceneId:state.sceneId,rain:rainOn,when:new Date().toLocaleString('it-IT')};
}
function restoreSnap(sn){
  killType();clearTimeout(autoTimer);
  state.flags=sn.flags||{};state.mem=sn.mem||[];
  state.sceneId='';
  curLabel=sn.label;curIdx=sn.idx;
  setScene(sn.sceneId||'car');
  setRain(!!sn.rain,1);
  processLine();
}
function openSave(){
  var slots=getSlots(),box=$('saveSlots');box.innerHTML='';
  slots.forEach(function(sl,i){
    var b=document.createElement('button');b.className='slot';
    b.innerHTML='<b>Slot '+(i+1)+'</b>'+(sl?'<small>'+esc(sl.when)+' \u2014 '+esc(slotChapter(sl))+'</small>':'<small>vuoto</small>');
    b.addEventListener('click',function(){
      slots[i]=snapshot();setSlots(slots);toast('Partita salvata \u2014 slot '+(i+1));closePanels();
    });
    box.appendChild(b);
  });
  $('savePanel').classList.add('open');
}
function slotChapter(sl){
  var map= {start:'Prologo',hospital_common:'Cap II \u00b7 Corridoio',cap3_entered:'Cap III',cap3_waited:'Cap III',cap3_bar:'Cap III',final_roundabout:'Cap IV'};
  return map[sl.label]||'In viaggio';
}
function openLoad(){
  var slots=getSlots(),box=$('loadSlots');box.innerHTML='';
  var any=false;
  slots.forEach(function(sl,i){
    if(sl)any=true;
    var b=document.createElement('button');b.className='slot'+(sl?'':' empty');
    b.innerHTML='<b>Slot '+(i+1)+'</b>'+(sl?'<small>'+esc(sl.when)+' \u2014 '+esc(slotChapter(sl))+'</small>':'<small>vuoto</small>');
    if(sl)b.addEventListener('click',function(){
      restoreSnap(JSON.parse(JSON.stringify(sl)));toast('Ricaricato \u2014 slot '+(i+1));closePanels();
    });
    box.appendChild(b);
  });
  if(!any){var e=document.createElement('div');e.className='jempty';e.textContent='Nessun salvataggio.';box.appendChild(e);}
  $('loadPanel').classList.add('open');
}
$('qSave').addEventListener('click',function(e){e.stopPropagation();ensureAudio();openSave();});
$('qLoad').addEventListener('click',function(e){e.stopPropagation();ensureAudio();openLoad();});
$('saveClose').addEventListener('click',closePanels);
$('loadClose').addEventListener('click',closePanels);
function closePanels(){['savePanel','loadPanel','journalPanel'].forEach(function(p){$(p).classList.remove('open');});}

$('qAuto').addEventListener('click',function(e){
  e.stopPropagation();autoOn=!autoOn;
  this.classList.toggle('toggled',autoOn);
  if(autoOn)queueAuto();else clearTimeout(autoTimer);
});
$('qMusic').addEventListener('click',function(e){
  e.stopPropagation();ensureAudio();
  musicOn=!musicOn;this.classList.toggle('toggled',!musicOn);
  try{localStorage.setItem('fid_music',musicOn?'1':'0');}catch(err){}
  if(gMusic)gMusic.gain.value=musicOn?0.42:0;
  if(musicOn)startMusic();else stopMusic();
});
$('qExit').addEventListener('click',function(){try{localStorage.setItem('fid_autosave',JSON.stringify(snapshot()));}catch(e){}});
