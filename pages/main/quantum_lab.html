<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Lab - Luca Gandolfi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a1628;
            color: #fff;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            z-index: 10;
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            color: #a0c0e0;
        }
        #spawner {
            top: 20px;
            left: 20px;
            width: 220px;
            max-height: 80vh;
            overflow-y: auto;
        }
        #achievements {
            top: 20px;
            right: 20px;
            width: 250px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .spawner-section {
            margin-bottom: 15px;
        }
        .spawner-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .spawner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .spawner-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            color: #fff;
            font-size: 0.85rem;
        }
        .spawner-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
        }
        .particle-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }
        .achievement-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            border-left: 3px solid #444;
            opacity: 0.6;
        }
        .achievement-item.unlocked {
            border-left-color: #00d4ff;
            opacity: 1;
            background: rgba(0, 212, 255, 0.05);
        }
        .achievement-title {
            font-weight: bold;
            color: #fff;
            font-size: 0.9rem;
        }
        .achievement-desc {
            font-size: 0.8rem;
        }
        .back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 212, 255, 0.9);
            color: #000;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }
        .recipe-hint {
            font-size: 0.8rem;
            margin-top: 10px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-panel" id="spawner">
        <h3 style="margin-top:0;color:#00d4ff">Quantum Spawner</h3>
        
        <div class="spawner-section">
            <div class="spawner-title">Quarks</div>
            <div class="spawner-grid">
                <div class="spawner-btn" onclick="spawn('u')"><div class="particle-icon" style="background:#ff4444">u</div>Up</div>
                <div class="spawner-btn" onclick="spawn('d')"><div class="particle-icon" style="background:#4444ff">d</div>Down</div>
                <div class="spawner-btn" onclick="spawn('c')"><div class="particle-icon" style="background:#ff88ff">c</div>Charm</div>
                <div class="spawner-btn" onclick="spawn('s')"><div class="particle-icon" style="background:#44ff44">s</div>Strange</div>
                <div class="spawner-btn" onclick="spawn('t')"><div class="particle-icon" style="background:#ffaa44">t</div>Top</div>
                <div class="spawner-btn" onclick="spawn('b')"><div class="particle-icon" style="background:#aa44ff">b</div>Bottom</div>
            </div>
        </div>

        <div class="spawner-section">
            <div class="spawner-title">Leptons</div>
            <div class="spawner-grid">
                <div class="spawner-btn" onclick="spawn('e')"><div class="particle-icon" style="background:#ffff44">e</div>Electron</div>
                <div class="spawner-btn" onclick="spawn('mu')"><div class="particle-icon" style="background:#ffff88">μ</div>Muon</div>
                <div class="spawner-btn" onclick="spawn('tau')"><div class="particle-icon" style="background:#ffffcc">τ</div>Tau</div>
            </div>
        </div>

        <div class="spawner-section">
            <div class="spawner-title">Bosons</div>
            <div class="spawner-grid">
                <div class="spawner-btn" onclick="spawn('g')"><div class="particle-icon" style="background:#888888">g</div>Gluon</div>
                <div class="spawner-btn" onclick="spawn('y')"><div class="particle-icon" style="background:#ffffff">γ</div>Photon</div>
                <div class="spawner-btn" onclick="spawn('Z')"><div class="particle-icon" style="background:#cccccc">Z</div>Z Boson</div>
                <div class="spawner-btn" onclick="spawn('W')"><div class="particle-icon" style="background:#bbbbbb">W</div>W Boson</div>
                <div class="spawner-btn" onclick="spawn('H0')"><div class="particle-icon" style="background:#ffd700">H</div>Higgs</div>
            </div>
        </div>

        <div class="spawner-section" id="discovered-section" style="display: none;">
            <div class="spawner-title">Discovered</div>
            <div class="spawner-grid" id="discovered-grid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <div style="margin-top:15px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;">
            <button class="spawner-btn" onclick="clearCanvas()" style="justify-content:center;background:rgba(255,50,50,0.2)">Clear All</button>
        </div>
        <div class="recipe-hint">
            Hint: Combine quarks to form Baryons. Combine Baryons to form Nuclei.
        </div>
    </div>

    <div class="ui-panel" id="achievements">
        <h3 style="margin-top:0;color:#00d4ff">Achievements</h3>
        <div id="achievementsList"></div>
    </div>

    <a href="../../index.html" class="back-btn">← Back to Portfolio</a>
    
    <div id="notification" class="notification">New Element Discovered!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let draggedParticle = null;
        
        // Game State
        const unlocked = new Set();
        
        // Definitions
        // Definitions
        const TYPES = {
            // Quarks
            'u': { color: '#ff4444', radius: 10, label: 'u', mass: 1, desc: "Up Quark: The lightest constituent of matter." },
            'd': { color: '#4444ff', radius: 10, label: 'd', mass: 1, desc: "Down Quark: Fundamental constituent of protons/neutrons." },
            'c': { color: '#ff88ff', radius: 12, label: 'c', mass: 2, desc: "Charm Quark: Second generation quark, heavier than up/down." },
            's': { color: '#44ff44', radius: 12, label: 's', mass: 2, desc: "Strange Quark: Third lightest quark found in strange matter." },
            't': { color: '#ffaa44', radius: 14, label: 't', mass: 3, desc: "Top Quark: The most massive elementary particle." },
            'b': { color: '#aa44ff', radius: 14, label: 'b', mass: 3, desc: "Bottom Quark: Also known as beauty, heavy and unstable." },
            
            // Leptons
            'e': { color: '#ffff44', radius: 6, label: 'e-', mass: 0.5, desc: "Electron: Stable particle with negative charge." },
            'mu': { color: '#ffff88', radius: 8, label: 'μ', mass: 1, desc: "Muon: A heavier, unstable cousin of the electron." },
            'tau': { color: '#ffffcc', radius: 10, label: 'τ', mass: 1.5, desc: "Tau: Heavy lepton, very short-lived." },

            // Bosons
            'g': { color: '#888888', radius: 8, label: 'g', mass: 0, desc: "Gluon: Mediator of the strong nuclear force." },
            'y': { color: '#ffffff', radius: 8, label: 'γ', mass: 0, glow: true, desc: "Photon: Quantum of light and electromagnetic force." },
            'Z': { color: '#cccccc', radius: 15, label: 'Z', mass: 4, desc: "Z Boson: Mediator of weak interaction (neutral)." },
            'W': { color: '#bbbbbb', radius: 15, label: 'W', mass: 4, desc: "W Boson: Mediator of weak interaction (charged)." },
            'H0': { color: '#ffd700', radius: 18, label: 'H', mass: 5, glow: true, desc: "Higgs Boson: Gives mass to other particles." },

            // Baryons
            'p': { color: '#ff8800', radius: 20, label: 'p+', mass: 5, glow: true, desc: "Proton: Stable baryon (uud), nucleus of Hydrogen." },
            'n': { color: '#8888ff', radius: 20, label: 'n', mass: 5, desc: "Neutron: Neutral baryon (udd), essential for nuclei." },
            'L': { color: '#00ffaa', radius: 22, label: 'Λ', mass: 6, desc: "Lambda: Strange baryon (uds) with no charge." }, 
            'Om': { color: '#aa00ff', radius: 24, label: 'Ω', mass: 7, desc: "Omega: Baryon with three strange quarks (sss)." },
            'D++': { color: '#ff0000', radius: 22, label: 'Δ++', mass: 6, desc: "Delta++: Short-lived baryon with charge +2 (uuu)." },
            'D-': { color: '#0000ff', radius: 22, label: 'Δ-', mass: 6, desc: "Delta-: Short-lived baryon with charge -1 (ddd)." },
            
            // Mesons
            'J': { color: '#ff00ff', radius: 18, label: 'J/ψ', mass: 4, glow: true, desc: "J/Psi: Charmonium state (c + anti-c)." }, 
            'Up': { color: '#aa00aa', radius: 20, label: 'Υ', mass: 6, glow: true, desc: "Upsilon: Bottomonium state (b + anti-b)." },

            // Nuclei / Atoms
            'H': { color: '#ffffff', radius: 30, label: 'H', mass: 10, glow: true, desc: "Hydrogen: Proton + Electron. The simplest atom." },
            'He': { color: '#ffccff', radius: 35, label: 'He', mass: 15, glow: true, desc: "Helium: Noble gas created by fusion (H+H in this sim)." },
            'C': { color: '#aaaaaa', radius: 40, label: 'C', mass: 20, desc: "Carbon: Building block of life (He+He+He)." },
            'O': { color: '#88ccff', radius: 40, label: 'O', mass: 20, desc: "Oxygen: Essential for respiration (C+He)." },
            'H2O': { color: '#00d4ff', radius: 50, label: 'H₂O', mass: 30, glow: true, desc: "Water: Life's solvent (H+H+O)." }
        };

        const UNLOCKABLE_IDS = [
            'p', 'n', 'L', 'Om', 'D++', 'D-', 'J', 'Up', 'H', 'He', 'C', 'O', 'H2O'
        ];
        const BASIC_IDS = [
            'u', 'd', 'c', 's', 't', 'b', 'e', 'mu', 'tau', 'g', 'y', 'Z', 'W', 'H0'
        ];

        // Recipes: Array of inputs (sorted) -> Output
        const RECIPES = [
            // Baryons
            { inputs: ['d', 'u', 'u'], output: 'p' },
            { inputs: ['d', 'd', 'u'], output: 'n' },
            { inputs: ['d', 's', 'u'], output: 'L' }, // Lambda
            { inputs: ['s', 's', 's'], output: 'Om' }, // Omega
            { inputs: ['u', 'u', 'u'], output: 'D++' }, // Delta++
            { inputs: ['d', 'd', 'd'], output: 'D-' }, // Delta-
            
            // Mesons (Simplified 2-body for game purposes)
            { inputs: ['c', 'c'], output: 'J' }, // J/Psi
            { inputs: ['b', 'b'], output: 'Up' }, // Upsilon

            // Atoms
            { inputs: ['e', 'p'], output: 'H' },
            { inputs: ['H', 'H'], output: 'He' }, // Simplified Fusion
            { inputs: ['He', 'He', 'He'], output: 'C' },
            { inputs: ['C', 'He'], output: 'O' },
            { inputs: ['H', 'H', 'O'], output: 'H2O' },
            
            // Boson Interactions (Fun extras)
            { inputs: ['e', 'e'], output: 'y' }, // Annihilation simulation (e+e -> photon) - simplified
            { inputs: ['W', 'Z'], output: 'H0' } // Higgs production simulation
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.props = TYPES[type];
                this.id = Math.random();
            }

            update() {
                if (this === draggedParticle) return;

                this.x += this.vx;
                this.y += this.vy;

                // Bounce
                if (this.x < this.props.radius || this.x > width - this.props.radius) this.vx *= -1;
                if (this.y < this.props.radius || this.y > height - this.props.radius) this.vy *= -1;

                // Friction
                this.vx *= 0.99;
                this.vy *= 0.99;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.props.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.props.color;
                
                if (this.props.glow) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.props.color;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.props.label, this.x, this.y);
            }
        }

        function spawn(type) {
            const p = new Particle(type, width/2 + (Math.random()-0.5)*50, height/2 + (Math.random()-0.5)*50);
            particles.push(p);
        }

        function clearCanvas() {
            particles = [];
        }

        function checkCollisions() {
            const MERGE_DIST = 40;
            let used = new Set();

            for (let i = 0; i < particles.length; i++) {
                if (used.has(i)) continue;
                if (particles[i] === draggedParticle) continue;

                let group = [i];
                let groupTypes = [particles[i].type];
                let cx = particles[i].x;
                let cy = particles[i].y;

                // Find neighbors
                for (let j = i + 1; j < particles.length; j++) {
                    if (used.has(j)) continue;
                    if (particles[j] === draggedParticle) continue;

                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < MERGE_DIST + particles[i].props.radius + particles[j].props.radius) {
                        group.push(j);
                        groupTypes.push(particles[j].type);
                        cx += particles[j].x;
                        cy += particles[j].y;
                    }
                }

                if (group.length > 1) {
                    // Check recipes
                    groupTypes.sort();
                    const recipe = RECIPES.find(r => {
                        const rInputs = [...r.inputs].sort();
                        return JSON.stringify(rInputs) === JSON.stringify(groupTypes);
                    });

                    if (recipe) {
                        // Merge!
                        cx /= group.length;
                        cy /= group.length;
                        
                        // Remove old particles
                        group.forEach(idx => used.add(idx));
                        
                        // Create new particle
                        const newP = new Particle(recipe.output, cx, cy);
                        particles.push(newP);
                        
                        // Effects
                        createExplosion(cx, cy, TYPES[recipe.output].color);
                        unlockAchievement(recipe.output);
                    }
                }
            }

            // Remove used particles
            if (used.size > 0) {
                particles = particles.filter((_, idx) => !used.has(idx));
            }
        }

        let explosions = [];
        function createExplosion(x, y, color) {
            for(let i=0; i<20; i++) {
                explosions.push({
                    x, y,
                    vx: (Math.random()-0.5)*10,
                    vy: (Math.random()-0.5)*10,
                    life: 1.0,
                    color
                });
            }
        }

        function unlockAchievement(id) {
            if (!unlocked.has(id) && UNLOCKABLE_IDS.includes(id)) {
                unlocked.add(id);
                addToSpawner(id);
                renderAchievements();
                showNotification(`Discovered: ${TYPES[id].label}`);
            }
        }

        function addToSpawner(id) {
            const section = document.getElementById('discovered-section');
            const grid = document.getElementById('discovered-grid');
            
            if (section.style.display === 'none') {
                section.style.display = 'block';
            }
            
            // Check if already exists to avoid duplicates
            if (document.getElementById(`btn-${id}`)) return;

            const btn = document.createElement('div');
            btn.id = `btn-${id}`;
            btn.className = 'spawner-btn';
            btn.onclick = () => spawn(id);
            btn.style.animation = "fadeIn 0.5s";
            
            const type = TYPES[id];
            // Use simplified name for button
            let name = type.desc.split(':')[0]; 
            if (name.length > 10) name = type.label;

            btn.innerHTML = `<div class="particle-icon" style="background:${type.color};box-shadow: 0 0 5px ${type.color}">${type.label}</div>${name}`;
            
            grid.appendChild(btn);
        }

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.textContent = text;
            el.style.opacity = 1;
            el.style.top = '40%';
            setTimeout(() => {
                el.style.opacity = 0;
                el.style.top = '50%';
            }, 2000);
        }

        function renderAchievements() {
            const list = document.getElementById('achievementsList');
            list.innerHTML = '';
            
            // Standard Model Section
            const title1 = document.createElement('div');
            title1.className = 'spawner-title';
            title1.style.color = '#fff'; 
            title1.style.marginTop = '10px';
            title1.textContent = 'Fundamental Particles';
            list.appendChild(title1);

            BASIC_IDS.forEach(id => {
                const item = createAchievementItem(id, true);
                list.appendChild(item);
            });

            // Discoveries Section
            const title2 = document.createElement('div');
            title2.className = 'spawner-title';
            title2.style.color = '#fff';
            title2.style.marginTop = '20px';
            title2.textContent = 'Composite Particles (Discoveries)';
            list.appendChild(title2);

            UNLOCKABLE_IDS.forEach(id => {
                const isUnlocked = unlocked.has(id);
                const item = createAchievementItem(id, isUnlocked);
                list.appendChild(item);
            });
        } // End renderAchievements

        function createAchievementItem(id, isUnlocked) {
            const div = document.createElement('div');
            div.className = `achievement-item ${isUnlocked ? 'unlocked' : ''}`;
            const type = TYPES[id];

            if (isUnlocked) {
                div.innerHTML = `
                    <div class="achievement-title" style="display:flex;align-items:center;gap:10px;">
                        <div class="particle-icon" style="background:${type.color};width:15px;height:15px;font-size:8px;">${type.label}</div>
                        ${type.desc.split(':')[0]}
                    </div>
                    <div class="achievement-desc">${type.desc.split(':')[1] || type.desc}</div>
                `;
            } else {
                div.innerHTML = `
                    <div class="achievement-title">???</div>
                    <div class="achievement-desc">Undiscovered Particle</div>
                `;
            }
            return div;
        }

        // Input Handling
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Find clicked particle (reverse order for top-most)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                const dx = x - p.x;
                const dy = y - p.y;
                if (dx*dx + dy*dy < p.props.radius * p.props.radius * 2) { // Generous hit area
                    draggedParticle = p;
                    break;
                }
            }
        });

        window.addEventListener('mousemove', e => {
            if (draggedParticle) {
                draggedParticle.x = e.clientX;
                draggedParticle.y = e.clientY;
                draggedParticle.vx = 0;
                draggedParticle.vy = 0;
            }
        });

        window.addEventListener('mouseup', () => {
            draggedParticle = null;
        });

        function loop() {
            ctx.fillStyle = '#0a1628';
            ctx.fillRect(0, 0, width, height);

            // Draw Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,height); ctx.stroke(); }
            for(let i=0; i<height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(width,i); ctx.stroke(); }

            checkCollisions();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Draw Explosions
            for(let i=explosions.length-1; i>=0; i--) {
                const e = explosions[i];
                e.x += e.vx;
                e.y += e.vy;
                e.life -= 0.05;
                ctx.globalAlpha = e.life;
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
                if(e.life <= 0) explosions.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }

        renderAchievements();
        loop();

    </script>
</body>
</html>
