<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5ead8">
<title>Mondo del Tè — Cozy Tea Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf3e7;--paper:#fffaf2;--card:#f6ecdd;--card2:#efe0cb;
  --brown:#8b7355;--brown-d:#6d5d4a;--dim:#a8917d;
  --line:rgba(139,115,85,.22);--ok:#4de3c0;--gold:#e9b95c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',Georgia,serif;color:var(--brown);
  background:
    radial-gradient(70% 50% at 15% 0%, rgba(255,214,165,.35) 0%, transparent 60%),
    radial-gradient(60% 45% at 90% 6%, rgba(255,183,197,.20) 0%, transparent 55%),
    linear-gradient(160deg,#fdf8ef 0%,#f3e6d2 55%,#ecdcc4 100%);
  min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:flex-start;
  padding:calc(var(--site-top-bar-height,36px) + env(safe-area-inset-top) + 14px)
          calc(env(safe-area-inset-right) + 14px)
          calc(env(safe-area-inset-bottom) + 24px)
          calc(env(safe-area-inset-left) + 14px);
  overflow-x:hidden;
}
.topbar{
  position:fixed;top:calc(var(--site-top-bar-height,36px) + env(safe-area-inset-top) + 8px);
  left:calc(env(safe-area-inset-left) + 12px);right:calc(env(safe-area-inset-right) + 12px);
  z-index:80;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.flags{display:flex;gap:5px;background:rgba(255,250,242,.85);border:1px solid var(--line);
  border-radius:30px;padding:5px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.flag{border:none;background:none;font-size:1.05rem;cursor:pointer;padding:5px 6px;border-radius:10px;
  opacity:.45;transition:.15s;touch-action:manipulation;line-height:1}
.flag.on{opacity:1;background:rgba(139,115,85,.16)}
.sndrow{display:flex;gap:5px;margin-left:auto;background:rgba(255,250,242,.85);
  border:1px solid var(--line);border-radius:30px;padding:5px 8px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sbtn{border:none;background:none;font-size:.95rem;cursor:pointer;padding:5px 7px;border-radius:10px;
  opacity:.45;transition:.15s;touch-action:manipulation;line-height:1}
.sbtn.on{opacity:1}

.container{
  width:100%;max-width:820px;
  background:rgba(255,251,244,.94);border-radius:28px;
  box-shadow:0 22px 60px rgba(139,115,85,.18);
  padding:clamp(26px,5vw,54px) clamp(18px,4vw,42px);
  text-align:center;position:relative;
  animation:fadeIn .8s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1}}

h1{font-family:'Fredoka';color:var(--brown);font-size:clamp(2rem,7vw,3em);
  margin-bottom:12px;font-weight:500;letter-spacing:2px}
.subtitle{color:var(--dim);font-size:1.08em;margin-bottom:38px;font-style:italic}

.cupwrap{position:relative;width:120px;height:110px;margin:0 auto 26px}
.cupsvg{width:100%;height:100%}
.puff{position:absolute;bottom:78px;width:14px;height:14px;border-radius:50%;
  background:rgba(180,160,140,.35);filter:blur(3px);
  animation:puffUp 3.4s ease-in-out infinite;opacity:0}
.puff.p1{left:44%;animation-delay:0s}
.puff.p2{left:52%;animation-delay:1.1s;width:11px;height:11px}
.puff.p3{left:38%;animation-delay:2.2s;width:9px;height:9px}
@keyframes puffUp{
  0%{transform:translateY(0) scale(.6);opacity:0}
  25%{opacity:.8}
  100%{transform:translateY(-52px) scale(1.5);opacity:0}
}

.menu-buttons{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.menu-btn{
  background:linear-gradient(135deg,#dccdbd 0%,#bda48f 100%);
  color:#fff;border:none;padding:26px 40px;min-width:190px;min-height:96px;
  font-size:1.15em;border-radius:20px;cursor:pointer;
  transition:all .3s ease;box-shadow:0 10px 30px rgba(139,115,85,.22);
  font-family:'Fredoka';position:relative;overflow:hidden;touch-action:manipulation;
}
.menu-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transition:left .5s}
.menu-btn:hover::before{left:100%}
.menu-btn:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(139,115,85,.32)}
.menu-btn .icon{display:block;font-size:2em;margin-bottom:8px}

.screen{display:none;animation:fadeIn .5s ease}
.screen.on{display:block}
.back-btn2{
  background:var(--card2);color:var(--brown-d);border:none;
  padding:11px 20px;font-size:.92rem;border-radius:12px;cursor:pointer;
  transition:.25s;font-family:'Nunito';font-weight:700;touch-action:manipulation;
  display:inline-flex;align-items:center;gap:6px;min-height:44px;
}
.back-btn2:hover{background:#e3d2ba}
h2.sec-title{font-family:'Fredoka';color:var(--brown);font-size:clamp(1.5rem,5vw,2.1em);
  margin:18px 0 22px;font-weight:500}

.question{margin:30px 0}
.qemoji{font-size:3.6em;margin-bottom:16px}
.question h2{font-family:'Fredoka';color:var(--brown);font-size:clamp(1.4rem,5vw,1.9em);margin-bottom:26px;font-weight:500}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.option-btn{
  background:var(--card);border:3px solid transparent;padding:22px 18px;
  border-radius:16px;cursor:pointer;transition:all .25s ease;
  font-size:1.02em;color:var(--brown);font-family:'Nunito';min-height:64px;
}
.option-btn:hover{background:var(--card2);border-color:#c4ad97;transform:scale(1.03)}
.option-btn.selected{background:#dccdbd;border-color:var(--brown);transform:scale(1.03)}

.progress{width:100%;height:8px;background:var(--card);border-radius:10px;margin-bottom:26px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#c4ad97,var(--brown));border-radius:10px;transition:width .5s ease;width:0}

.next-btn,.action-btn,.share-btn{
  background:var(--brown);color:#fff;border:none;padding:15px 38px;
  font-size:1.02em;border-radius:14px;cursor:pointer;margin:8px;
  transition:all .25s ease;font-family:'Nunito';font-weight:700;touch-action:manipulation;
}
.next-btn:hover,.action-btn:hover,.share-btn:hover{background:var(--brown-d);transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(139,115,85,.3)}
.next-btn:disabled{background:#ccc7bd;cursor:not-allowed;transform:none}

.result-card{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
  padding:34px;border-radius:22px;margin:26px 0;box-shadow:0 12px 34px rgba(139,115,85,.2)}
.result-card h2{font-family:'Fredoka';color:var(--brown);font-size:2.1em;margin-bottom:14px;font-weight:500}
.result-icon{font-size:4.4em;margin:14px 0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.result-card p{color:#96806b;font-size:1.08em;line-height:1.8;margin:14px 0}
.trait{display:inline-block;background:rgba(255,255,255,.75);padding:8px 16px;margin:4px;border-radius:20px;
  color:var(--brown-d);font-weight:700;font-size:.86rem}

.tea-selection{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin:24px 0}
.tea-type{background:var(--card);padding:22px 14px;border-radius:16px;cursor:pointer;
  transition:all .25s ease;border:3px solid transparent;touch-action:manipulation}
.tea-type:hover{background:var(--card2);transform:scale(1.04)}
.tea-type.selected{border-color:var(--brown);background:#dccdbd}
.tea-type .emoji{font-size:2.6em;display:block;margin-bottom:8px}
.tea-type small{display:block;color:var(--dim);margin-top:6px;font-weight:700}

.thermometer{width:56px;height:280px;background:var(--card);border-radius:30px;
  margin:24px auto;position:relative;border:3px solid #c4ad97;overflow:hidden}
.mercury{position:absolute;bottom:0;left:0;width:100%;height:0%;
  background:linear-gradient(to top,#ff8a7a,#ffb84d);border-radius:30px;transition:height .12s linear}
.temp-display{font-family:'Fredoka';font-size:2.6em;color:var(--brown);margin:14px 0;font-weight:500}
.hint{color:var(--dim);font-size:.95rem;margin:14px 0;line-height:1.65}
.inline-msg{min-height:34px;font-weight:800;color:var(--brown-d);margin:8px 0}

.teacup{width:190px;height:170px;margin:20px auto 6px;position:relative}
.cupbody{width:100%;height:150px;background:linear-gradient(to bottom,transparent 26%,#e8dbc8 26%);
  border-radius:0 0 54px 54px;border:5px solid var(--brown);border-top:none;
  position:relative;overflow:hidden}
.water{position:absolute;bottom:0;left:0;width:100%;height:0%;opacity:0;transition:all .3s ease}
.steamline{position:absolute;top:-26px;width:10px;height:26px;border-radius:8px;
  background:rgba(180,160,140,.4);filter:blur(3px);animation:puffUp 3s infinite;opacity:0}
.saucer{width:230px;height:16px;background:var(--card2);border-radius:50%;margin:-4px auto 0;
  box-shadow:0 6px 14px rgba(139,115,85,.25)}

.timer-ring-wrap{position:relative;width:min(62vw,270px);height:min(62vw,270px);margin:18px auto}
.timer-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card2);stroke-width:13}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:13;stroke-linecap:round;
  transition:stroke-dashoffset .2s linear}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-time{font-family:'Fredoka';font-size:clamp(2.2rem,9vw,3.1rem);color:var(--brown);font-weight:500}
.timer-temp{font-size:.82rem;color:var(--dim);font-weight:700;letter-spacing:1px}
.timer-done{animation:donePop .5s cubic-bezier(.175,.885,.32,1.4)}
@keyframes donePop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.tbtn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

.hist-list{max-width:420px;margin:14px auto;text-align:left}
.hist-item{display:flex;justify-content:space-between;background:var(--card);
  border-radius:12px;padding:10px 16px;margin-bottom:7px;font-size:.88rem;font-weight:700}
.hist-item small{color:var(--dim);font-weight:400}
.jempty{text-align:center;color:var(--dim);font-style:italic;padding:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%) translateY(10px);z-index:300;
  background:rgba(60,50,40,.95);color:#fff7ee;font-family:'Nunito';font-weight:700;
  font-size:.88rem;padding:12px 22px;border-radius:16px;opacity:0;transition:.3s;
  pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:640px){
  .brand-hide-sm{display:none}
  .menu-btn{min-width:150px;padding:22px 28px;min-height:84px}
}
</style>
</head>

  <div id="gameScreen" class="screen">
    <button class="back-btn2" onclick="backToMenu()">&#8592; <span data-i18n="back"></span></button>

    <h2 class="sec-title" data-i18n="b_timer"></h2>
    <div id="timerContent"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

/* ============ AUDIO ============ */
var actx=null,gMusic=null,gRain=null,gSfx=null,rainSrc=null,musicTimer=null,nextBar=0,barI=0;
var musicOn=true,sfxOn=true,rainOn=false;
try{
  musicOn=localStorage.getItem('the_music')!=='0';
  sfxOn=localStorage.getItem('the_sfx')!=='0';
  rainOn=localStorage.getItem('the_rain')==='1';
}catch(e){}
function ensureAudio(){
  try{
    if(!actx){
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      actx=new AC();
      gMusic=actx.createGain();gMusic.gain.value=musicOn?0.4:0;gMusic.connect(actx.destination);
      gRain=actx.createGain();gRain.gain.value=rainOn?0.045:0;gRain.connect(actx.destination);
      gSfx=actx.createGain();gSfx.gain.value=sfxOn?0.9:0;gSfx.connect(actx.destination);
      startRainNoise();
    }
    if(actx.state==='suspended')actx.resume();
    return true;
  }catch(e){return false;}
}
function padNote(f,when,dur,v){
  try{
    var o=actx.createOscillator(),gn=actx.createGain();
    o.type='triangle';o.frequency.value=f;o.detune.value=rnd(-7,7);
    gn.gain.setValueAtTime(.0001,when);
    gn.gain.linearRampToValueAtTime(v,when+dur*.45);
    gn.gain.linearRampToValueAtTime(.0001,when+dur);
    o.connect(gn);gn.connect(gMusic);o.start(when);o.stop(when+dur+.1);
  }catch(e){}
}
var CHORDS=[[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66],[164.81,220,261.63]];
var BAR=7,PENTA=[523.25,587.33,659.25,783.99];
function scheduleBar(){
  if(!actx||!musicOn)return;
  var t=Math.max(nextBar,actx.currentTime+.05);
  var c=CHORDS[barI%CHORDS.length];
  for(var i=0;i<c.length;i++)padNote(c[i],t,BAR+1,i===0?.045:.032);
  if(Math.random()<.45)padNote(PENTA[(Math.random()*PENTA.length)|0],t+rnd(1,BAR-1.5),2.4,.018);
  nextBar=t+BAR;barI++;
}
function musicLoop(){if(!actx||!musicOn)return;while(nextBar<actx.currentTime+1.4)scheduleBar();}
function startMusic(){if(!ensureAudio()||musicTimer)return;nextBar=actx.currentTime+.1;barI=0;scheduleBar();musicTimer=setInterval(musicLoop,500);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
function startRainNoise(){
  try{
    var len=Math.floor(actx.sampleRate*2),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    rainSrc=actx.createBufferSource();rainSrc.buffer=buf;rainSrc.loop=true;
    var f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1300;f.Q.value=.4;
    rainSrc.connect(f);f.connect(gRain);rainSrc.start();
  }catch(e){}
}
function tone(f,d,type,v,when,fEnd){
  if(!ensureAudio())return;
  try{
    var t0=actx.currentTime+(when||0);
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    if(fEnd)o.frequency.exponentialRampToValueAtTime(Math.max(1,fEnd),t0+d);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(gSfx);
    o.start(t0);o.stop(t0+d+.05);
  }catch(e){}
}
function noiseHit(dur,v,fFrom,fTo){
  if(!ensureAudio())return;
  try{
    var len=(actx.sampleRate*dur)|0,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var s=actx.createBufferSource();s.buffer=buf;
    var flt=actx.createBiquadFilter();flt.type='bandpass';
    flt.frequency.setValueAtTime(fFrom,actx.currentTime);
    flt.frequency.exponentialRampToValueAtTime(fTo,actx.currentTime+dur);
    var g=actx.createGain();g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    s.connect(flt);flt.connect(g);g.connect(gSfx);s.start();
  }catch(e){}
}
function sfxPour(){noiseHit(.6,.09,900,260);}
function sfxBell(){
  tone(660,2.2,'sine',.16);tone(1319,1.6,'sine',.05,.01);
  setTimeout(function(){tone(880,1.8,'sine',.1);},260);
}
function sfxTick(){tone(720,.05,'square',.045);}
function sfxBoing(){tone(200,.18,'triangle',.12,0,380);}

function refreshDynamicScreens(){

    if(gameStage==='select')renderSelect();

  }

function showQuestion(){
  var Q=I18N[lang].q[currentQuestion];
  $('progressBar').style.width=((currentQuestion+1)/I18N[lang].q.length*100)+'%';
  var html='<div class="question"><div class="qemoji">'+Q.e+'</div>'+
    '<h2>'+Q.q+'</h2><div class="options">';
  Q.o.forEach(function(opt,idx){
    html+='<button class="option-btn" data-i="'+idx+'" data-v="'+VALS[currentQuestion][idx]+'">'+opt+'</button>';
  });
  html+='</div></div><button class="next-btn" id="nextBtn" disabled>'+
    (currentQuestion<I18N[lang].q.length-1?'\u2192':'\u2728')+'</button>';
  $('quizContent').innerHTML=html;
  Array.prototype.forEach.call($('quizContent').querySelectorAll('.option-btn'),function(b){
    b.addEventListener('click',function(){
      answers[currentQuestion]=b.dataset.v;
      Array.prototype.forEach.call($('quizContent').querySelectorAll('.option-btn'),function(x){x.classList.remove('selected');});
      b.classList.add('selected');
      $('nextBtn').disabled=false;
    });
  });
  $('nextBtn').addEventListener('click',function(){
    if(currentQuestion<I18N[lang].q.length-1){currentQuestion++;showQuestion();}
    else{D_resultMode=true;showResult();}
  });

function calculateResult(){
  var cnt={};answers.forEach(function(a){cnt[a]=(cnt[a]||0)+1;});
  if((cnt.energetic||0)>=2||(cnt.boost||0)>=1)return 'matcha';
  if((cnt.intellectual||0)>=2||(cnt.thoughtful||0)>=2)return 'earl';
  if((cnt.peaceful||0)>=2||(cnt.relaxation||0)>=1)return 'cham';
  if((cnt.fresh||0)>=2||(cnt.active||0)>=1)return 'mint';
  if((cnt.artistic||0)>=2||(cnt.creative||0)>=2)return 'jas';
  return 'oo';
}

}

/* ============ PERFECT STEEP ============ */
function startGame(){ensureAudio();showScreen('gameScreen');gameStage='select';renderSelect();}
function renderSelect(){
  var html='<div class="tea-selection">';
  TEAS.forEach(function(t){
    html+='<button class="tea-type" data-k="'+t.k+'">'+
      '<span class="emoji">'+t.icon+'</span><strong>'+teaName(t.k)+'</strong>'+
      '<small>'+t.temp+'\u00b0C</small></button>';
  });
  html+='</div><p class="hint">'+T('choose_tea')+'</p>';
  $('gameContent').innerHTML=html;
  Array.prototype.forEach.call($('gameContent').querySelectorAll('.tea-type'),function(b){
    b.addEventListener('click',function(){
      selectedTea=TEAS.find(function(t){return t.k===b.dataset.k;});
      Array.prototype.forEach.call($('gameContent').querySelectorAll('.tea-type'),function(x){x.classList.toggle('selected',x===b);});
      sfxBoing();
      setTimeout(function(){gameStage='heat';renderHeat();},420);
    });
  });
}
function renderHeat(){
  $('gameContent').innerHTML=
   '<div style="margin:26px 0"><strong>'+I18N[lang].heat_ph+'</strong></div>'+
   '<p class="hint">'+I18N[lang].target_t+': <strong style="color:var(--gold)">'+selectedTea.temp+'\u00b0C</strong><br>'+I18N[lang].tap_heat+'</p>'+
   '<div class="thermometer"><div class="mercury" id="mercury"></div></div>'+
   '<div class="temp-display" id="tempDisplay">20\u00b0C</div>'+
   '<div class="inline-msg" id="heatMsg"></div>'+
   '<button class="action-btn" id="heatBtn">\ud83d\udd25 '+I18N[lang].heat_b+'</button> '+
   '<button class="action-btn" id="stopBtn" style="display:none">\ud83d\uded1 '+I18N[lang].stop_b+'</button>';
  currentTemp=20;heating=false;
  $('heatBtn').addEventListener('click',function(){
    ensureAudio();
    if(!heating){
      heating=true;$('stopBtn').style.display='inline-block';
      heatInterval=setInterval(function(){
        currentTemp+=rnd(1,3.6);
        if(currentTemp>=100){currentTemp=100;heating=false;}
        $('mercury').style.height=(currentTemp)+'%';
        $('tempDisplay').textContent=Math.round(currentTemp)+'\u00b0C';
        if(currentTemp>=100)$('stopBtn').style.display='inline-block';
      },100);
    }
  });
  $('stopBtn').addEventListener('click',function(){
    heating=false;clearInterval(heatInterval);
    var diff=Math.abs(currentTemp-selectedTea.temp);
    var msg,key;
    if(diff<=3){msg=I18N[lang].fb_perfect;key='good';}
    else if(diff<=8){msg=I18N[lang].fb_good;key='ok';}
    else{msg=I18N[lang].fb_poor;}
    $('heatMsg').textContent=msg;
    if(key==='good'){tone(660,.2,'sine',.12);}
    else{sfxBoing();}
    setTimeout(function(){gameStage='steep';renderSteep();},650);
  });
}
function renderSteep(){
  $('gameContent').innerHTML=
   '<div style="margin:22px 0"><strong>'+I18N[lang].steep_ph+'</strong></div>'+
   '<p class="hint">'+I18N[lang].ideal_t+': <strong style="color:var(--gold)">'+(selectedTea.secs/60).toFixed(0).replace('.0','')+':'+String(selectedTea.secs%60).padStart(2,'0')+'</strong></p>'+
   '<div class="teacup">'+
    '<span class="streamline" style="left:44%"></span>'+
    '<span class="streamline" style="left:52%;animation-delay:1.2s"></span>'+
    '<div class="cupbody"><div class="water" id="water"></div></div>'+
    '<div class="saucer"></div>'+
   '</div>'+
   '<div class="progress" style="margin:18px auto;max-width:360px"><div class="progress-bar" id="steepBar"></div></div>'+
   '<button class="action-btn" id="startSteepBtn">\ud83e\uddd6 '+I18N[lang].start_steep+'</button> '+
   '<button class="action-btn" id="extractBtn" style="display:none">\u270b '+I18N[lang].extract_b+'</button>';
  $('startSteepBtn').addEventListener('click',function(){
    ensureAudio();this.style.display='none';
    $('extractBtn').style.display='inline-block';
    sfxPour();
    steepStart=Date.now();
    steepInterval=setInterval(function(){
      var dur=Date.now()-steepStart;
      var pct=clamp(dur/(selectedTea.secs*1000*1.6)*100,0,100);
      $('steepBar').style.width=pct+'%';
      var w=$('water');
      w.style.height='68%';w.style.background=selectedTea.color;
      w.style.opacity=clamp(dur/(selectedTea.secs*1000),.08,1);
    },60);
  });
  $('extractBtn').addEventListener('click',extractTeabag);
}
function extractTeabag(){
  clearInterval(steepInterval);
  var dur=Date.now()-steepStart;
  var diff=Math.abs(dur-selectedTea.secs*1000);
  var rating,score;
  if(diff<=500){rating='\ud83c\udf1f '+I18N[lang].done_short+'!';score=100;}
  else if(diff<=1000){rating='\ud83c\udfaf';score=90;}
  else if(diff<=2000){rating='\ud83d\udc4d';score=75;}
  else{rating='\ud83d\ude05';score=50;}
  gameStage='result';
  $('gameContent').innerHTML=
   '<div class="result-card"><h2 style="font-size:1.6em">'+rating+'</h2>'+
   '<div class="result-icon">'+selectedTea.icon+'</div>'+
   '<div class="score-display" style="background:var(--card);border-radius:14px;padding:14px;font-family:\'Fredoka\';font-size:1.3em">'+
   I18N[lang].score+': '+score+'/100</div>'+
   '<p style="color:#96806b;line-height:1.8">'+
   I18N[lang].ideal_t+': '+(selectedTea.secs/60).toFixed(1)+' min<br>'+
   I18N[lang].target_t+': '+selectedTea.temp+'\u00b0C</p></div>'+
   '<button class="action-btn" onclick="__teaDebug.replay()">'+I18N[lang].again+'</button> '+
   '<button class="back-btn2" onclick="__teaDebug.goMenu()">'+I18N[lang].back+'</button>';
}

/* ============ TEA TIMER ============ */
var notifOn=false;
function startTimer(){ensureAudio();showScreen('timerScreen');renderTimerScreen();}
function renderTimerScreen(){
  var html='<p class="hint">'+I18N[lang].choose+'</p><div class="tea-selection" id="timerPresets">';
  TEAS.forEach(function(t){
    html+='<button class="tea-type'+(timer.teaKey===t.k?' selected':'')+'" data-k="'+t.k+'">'+
     '<span class="emoji">'+t.icon+'</span><strong>'+teaName(t.k)+'</strong>'+
     '<small>'+t.temp+'\u00b0C \u00b7 '+fmtMS(t.secs*1000)+'</small></button>';
  });
  html+='</div>';
  html+='<div class="timer-ring-wrap" id="ringWrap" style="display:none">'+
   '<svg class="timer-svg" viewBox="0 0 260 260">'+
    '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#b388ff"/></linearGradient></defs>'+
    '<circle class="ring-bg" cx="130" cy="130" r="118"/>'+
    '<circle class="ring-fg" id="ringFg" cx="130" cy="130" r="118"/>'+
   '</svg>'+
   '<div class="timer-center"><div class="timer-time" id="timerTime">0:00</div>'+
   '<div class="timer-temp" id="timerTemp"></div></div></div>'+
   '<div class="tbtn-row" id="timerBtns" style="display:none">'+
    '<button class="action-btn" id="tPause"></button>'+
    '<button class="action-btn" id="tAdd30">+30 s</button>'+
    '<button class="action-btn" id="tReset">'+I18N[lang].reset_r+'</button>'+
   '</div>'+
   '<div class="tgl-row" style="justify-content:center;margin-top:12px">'+
    '<button class="tgl" id="notifBtn"><span class="led"></span>'+I18N[lang].notify_on+'</button>'+
   '</div>'+
   '<div style="margin-top:18px"><h3 style="font-family:\'Fredoka\';font-size:.8rem;color:var(--dim);letter-spacing:1px">'+I18N[lang].hist+'</h3>'+
   '<div class="hist-list" id="histList"></div></div>';
  $('timerContent').innerHTML=html;
  renderHistory();
  Array.prototype.forEach.call($('timerPresets').children,function(b){
    b.addEventListener('click',function(){
      ensureAudio();
      selectedTea=TEAS.find(function(t){return t.k===b.dataset.k;});
      Array.prototype.forEach.call($('timerPresets').children,function(x){x.classList.toggle('selected',x===b);});
      sfxBoing();
      startCountdown(selectedTea.secs*1000);
    });
  });
  $('tPause').addEventListener('click',togglePause);
  $('tAdd30').addEventListener('click',addThirty);
  $('tReset').addEventListener('click',function(){stopTimerLoop();hideRing();renderTimerScreen();});
  $('notifBtn').addEventListener('click',function(){
    if(!('Notification' in window)){toast('Not supported');return;}
    if(notifOn){notifOn=false;this.classList.remove('on');return;}
    Notification.requestPermission().then(function(p){
      if(p==='granted'){notifOn=true;$('notifBtn').classList.add('on');toast('OK!');}
      else toast('Permission denied');
    });
  });
  if(timer.left>0&&timer.total>0)showRing();
  updatePauseLabel();
  paintRing();
}
function fmtMS(ms){
  var s=Math.ceil(ms/1000);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function startCountdown(ms){
  timer.total=ms;timer.left=ms;timer.running=true;
  timer.lastReal=Date.now();
  stopTimerLoop();
  timer.interval=setInterval(timerTick,200);
  showRing();
}
function showRing(){
  $('ringWrap').style.display='block';
  $('timerBtns').style.display='flex';
  var C=2*Math.PI*118;
  $('ringFg').style.strokeDasharray=C;
  paintRing();
}
function hideRing(){$('ringWrap').style.display='none';$('timerBtns').style.display='none';}
function paintRing(){
  var C=2*Math.PI*118;
  var frac=timer.total>0?timer.left/timer.total:0;
  $('ringFg').style.strokeDashoffset=C*(1-clamp(frac,0,1));
  $('timerTime').textContent=fmtMS(timer.left);
  if(selectedTea)$('timerTemp').textContent=selectedTea.temp+'\u00b0C \u00b7 '+I18N[lang].temp_ideal;
}
function timerTick(){
  if(!timer.running)return;
  var now=Date.now();
  var delta=now-(timer.lastReal||now);
  timer.lastReal=now;
  timer.left-=delta;
  if(timer.left<=5200&&timer.left>0&&Math.floor(timer.left/1000)!==Math.floor((timer.left+delta)/1000))sfxTick();
  if(timer.left<=0){
    timer.left=0;timer.running=false;stopTimerLoop();
    finishTimer();
  }
  paintRing();
}
function finishTimer(){
  sfxBell();
  toast(T('done_msg'));
  pushHistory(selectedTea?selectedTea.k:'green',timer.total);
  if(notifOn&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification('Mondo del T\u00e8',{body:T('done_msg')});}catch(e){}
  }
  var tw=$('timerTime');
  tw.classList.add('timer-done');
  setTimeout(function(){tw.classList.remove('timer-done');},600);
  renderHistory();
}
function togglePause(){
  if(!timer.total)return;
  if(timer.running){
    timer.running=false;stopTimerLoop();
  }else{
    timer.lastReal=Date.now();timer.running=true;
    startTimerLoop();
  }
  updatePauseLabel();
}
function startTimerLoop(){stopTimerLoop();timer.interval=setInterval(timerTick,200);}
function stopTimerLoop(){if(timer.interval){clearInterval(timer.interval);timer.interval=null;}}
function updatePauseLabel(){
  var b=$('tPause');
  if(b)b.textContent=timer.running?I18N[lang].pause:I18N[lang].resume;
}
function addThirty(){
  if(timer.total<=0)return;
  timer.left+=30000;timer.total+=30000;
  paintRing();updatePauseLabel();
  if(!timer.running){timer.running=true;timer.lastReal=Date.now();startTimerLoop();updatePauseLabel();}
}
function pushHistory(teaKey,totalMs){
  history.unshift({k:teaKey,ms:totalMs,at:Date.now()});
  if(history.length>5)history.length=5;
  try{localStorage.setItem('the_history',JSON.stringify(history));}catch(e){}
}
function renderHistory(){
  var list=$('histList');
  if(!list)return;
  list.innerHTML='';
  if(!history.length){list.innerHTML='<div class="jempty">'+T('none_yet')+'</div>';return;}
  history.forEach(function(h){
    var div=document.createElement('div');div.className='hist-item';
    div.innerHTML='<span>'+teaName(h.k)+'</span><small>'+fmtMS(h.ms)+' \u00b7 '+new Date(h.at).toLocaleTimeString().slice(0,5)+'</small>';
    list.appendChild(div);
  });
}

/* ============ AUDIO TOGGLES ============ */
$('musicBtn').addEventListener('click',function(){
  musicOn=!musicOn;
  this.classList.toggle('on',musicOn);
  try{localStorage.setItem('the_music',musicOn?'1':'0');}catch(e){}
  if(musicOn){ensureAudio();startMusic();}else stopMusic();
});
$('rainBtn').addEventListener('click',function(){
  rainOn=!rainOn;
  this.classList.toggle('on',rainOn);
  try{localStorage.setItem('the_rain',rainOn?'1':'0');}catch(e){}
  ensureAudio();
  if(gRain)gRain.gain.setTargetAtTime(rainOn?.05:0,actx.currentTime,.8);
});
$('sfxBtn').addEventListener('click',function(){
  sfxOn=!sfxOn;
  this.classList.toggle('on',sfxOn);
  try{localStorage.setItem('the_sfx',sfxOn?'1':'0');}catch(e){}
  if(gSfx)gSfx.gain.value=sfxOn?0.9:0;
  if(sfxOn)sfxBell();
});

document.addEventListener('pointerdown',function(){ensureAudio();if(musicOn)startMusic();},{once:true});

/* ============ DEBUG HOOK ============ */
window.__teaDebug={
  get state(){return {lang:lang,timer:Object.assign({},timer),
    history:history,stage:gameStage,audio:{music:musicOn,sfx:sfxOn,rain:rainOn}};},
  get resultMode(){return D_resultMode;},
    setLang:setLang,
    startQuiz:startQuiz,
    startGame:startGame,
    pickOption:function(sub){
      const kids=byId('quizContent').children.filter(c=>String(c.className).includes('option-btn'));
      for(const k of kids){if(k.textContent.includes(sub)){k.click();return true;}}
      return false;
    },
    next:function(){const n=byId('nextBtn');if(n)n.click();},
    clickId:function(id){const b=byId(id);if(b)b.click();},
    tempNow:function(){return currentTemp;},
  goMenu:function(){backToMenu();},
  replay:function(){startGame();},
    startTimer:function(ms){showScreen('timerScreen');renderTimerScreen();startCountdown(ms||60000);},
    selectTeaKey:function(k){var t=TEAS.find(function(x){return x.k===k;});if(t)selectedTea=t;},
    forceLeft:function(ms){timer.total=ms;timer.left=ms;paintRing();},
  tickForce:tick,
  tickAsync:async function(ms){await flush(ms);}
};

/* ============ AVVIO ============ */
buildFlags();
applyLang();
$('rainBtn').classList.toggle('on',rainOn);
$('musicBtn').classList.toggle('on',musicOn);
$('sfxBtn').classList.toggle('on',sfxOn);
if(musicOn){/* parte al primo gesto */}

window.startQuiz=startQuiz;
window.startGame=startGame;
window.startTimer=startTimer;
window.backToMenu=backToMenu;

})();
</script>
