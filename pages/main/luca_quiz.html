<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="quiz.luca.title">Quanto conosci Luca Gandolfi?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-900: #0a1628;
            --bg-800: #1a2940;
            --accent: #00d4ff;
            --text-main: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-900), var(--bg-800));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            color: var(--accent);
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-number {
            text-align: center;
            margin-bottom: 15px;
            color: #a0c0e0;
            font-size: 0.9rem;
        }
        .question {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
        }
        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .answer-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            text-align: left;
            font-family: inherit;
        }
        .answer-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            transform: translateX(5px);
        }
        .answer-btn.correct {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4caf50;
        }
        .answer-btn.wrong {
            background: rgba(244, 67, 54, 0.3);
            border-color: #f44336;
        }
        
        .result-view {
            text-align: center;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
            color: var(--accent);
            background: rgba(0, 212, 255, 0.1);
        }
        .level-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
        }
        .level-desc {
            font-size: 1.1rem;
            color: #a0c0e0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-restart {
            background: var(--accent);
            color: #0a1628;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-restart:hover {
            transform: scale(1.05);
        }
        .hidden { display: none; }
    </style>
    <link rel="stylesheet" href="../../assets/css/quiz-theme.css">
</head>
