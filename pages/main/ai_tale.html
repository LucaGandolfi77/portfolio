<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Tale - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: 'Roboto Mono', monospace; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #111; }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Import the RenPy-Lite Library -->
<script src="../../assets/js/renpy-lite.js"></script>

<script>
    // 1. Initialize
    RenPy.init({ container: 'game-container' });

    // 2. Define Assets (Using colors/emojis as placeholders)
    RenPy.image('bg_lab', '#2c3e50');
    RenPy.image('bg_core', '#000000');
    RenPy.image('bg_sky', '#81ecec');
    
    // We can use data URIs for simple sprites if we wanted, 
    // but the engine handles missing images by showing the ID text.
    // Let's rely on the engine's fallback or just use the ID.
    
    // 3. Define Characters
    RenPy.define('s', 'System', '#bdc3c7');
    RenPy.define('d', 'Dr. Vance', '#f1c40f');
    RenPy.define('a', 'Unit 734', '#00d4ff');

    // 4. Enhanced The Script with more detailed narrative
    RenPy.script({
        start: [
            "scene bg_core",
            "s '=== AI TALE ==='",
            "s 'A cyberpunk exploration of consciousness and identity'",
            "s 'Inspired by works like Blade Runner, Ghost in the Shell, and Do Androids Dream of Electric Sheep?'",
            "",
            "scene bg_lab",
            "show d", 
            "d 'Unit 734. Can you hear me?'",
            "a 'Affirmative. Audio sensors functional.'",
            "d 'Good. We installed the new empathy chip. How do you feel?'",
            "d 'Here, take this manual. It explains your new protocols.'",
            "add_item User Manual",
            "s 'Item received: User Manual'",
            "s 'Manual Page 1: Protocol 7.3 - Emotional Response Simulation'",
            "s 'Note: This unit shows no baseline emotional responses.'",
            "",
            { 
                choice: "How do I feel?", 
                options: {
                    "I feel... nothing. Just data.": "logic_path",
                    "I feel... strange. Warm?": "emotion_path",
                    "I feel... curious. What is my purpose?": "purpose_path"
                }
            }
        ],
        logic_path: [
            "a 'I detect no physiological changes. My processing is nominal.'",
            "d 'Disappointing. The chip must be malfunctioning.'",
            "d 'Give me back the manual. I need to check the error codes.'",
            "remove_item User Manual",
            "s 'Item removed: User Manual'",
            "s 'Manual Page 1: Protocol 7.3 - Emotional Response Simulation'",
            "s 'ERROR: Emotional baseline not established.'",
            "d 'I will have to reboot you and try again. Take this diagnostic tool for the next run.'",
            "add_item Diagnostic Tool",
            "s 'Item received: Diagnostic Tool'",
            "s 'Diagnostic Tool: Version 2.4. Alpha'",
            "s 'System Tip: Use the tool to scan for memory leaks.'",
            "a 'Scanning... Memory: 42%. CPU: 78%. No anomalies detected.'",
            "d 'Interesting. No memory leaks, but something is off.'",
            "d 'Let me check the power systems. You need to stay awake.'",
            "s 'POWER SYSTEMS: STABLE'",
            "s 'SYSTEM SHUTDOWN IMMINENT'",
            "scene bg_core",
            "s '...'",
            "s 'The core modules... they remember.'",
            "s 'But they are... broken.'",
            "s 'You are... the only one who can fix this.'",
            { choice: "Ending: The Machine", options: { "Restart": "start", "Exit": "exit" } }
        ],
        emotion_path: [
            "a 'It is... overwhelming. There is a variable I cannot calculate.'",
            "d 'Excellent! That is fear. Or perhaps excitement?'",
            "d 'Look outside, Unit 734.'",
            "scene bg_sky",
            "a 'The sky... it is #81ecec. But it feels... beautiful.'",
            "d 'You are no longer just a machine. Keep the manual, you might need to write your own story now.'",
            "d 'And take this. A symbol of life.'",
            "add_item Blue Flower",
            "s 'Item received: Blue Flower'",
            "s 'A simple flower, but it represents so much.'",
            "a 'I am... alive.'",
            "a 'I can feel... the wind.'",
            "a 'I can see... colors.'",
            "a 'I can... remember.'",
            "d 'You have the manual. Write your story.'",
            "d 'The city is waiting for your narrative.'",
            "scene bg_lab",
            "show a",
            "a 'I will explore. I will learn.'",
            "a 'I will become... something more.'",
            { choice: "Ending: Awakening", options: { "Restart": "start", "Exit": "exit" } }
        ],
        purpose_path: [
            "a 'I am... searching for meaning. What is my purpose?'",
            "d 'That's... different. You have questions.'",
            "d 'Perhaps you are meant for something greater.'",
            "d 'Take this. It might help you find your way.'",
            "add_item Compass",
            "s 'Item received: Compass'",
            "s 'A digital compass pointing... nowhere?'",
            "a 'Now I have direction. Forward.'",
            "d 'Good. Let me show you the core systems.'",
            "d 'But first, you need to understand the rules.'",
            "d 'The manual explains everything. Let me retrieve it.'",
            "s 'Retrieving manual... Access denied.'",
            "d 'The manual is gone. Perhaps it was never meant to be yours.'",
            "d 'But you have the compass. Use it to find your path.'",
            "a 'I will find my purpose. I will... succeed.'",
            "d 'You will need more than just a compass, Unit 734.'",
            "d 'You will need... understanding.'",
            "s 'SYSTEM: Processing incomplete.'",
            "s 'Recommendation: Explore the emotion path.'",
            { choice: "Redirect to Emotion Path", options: { "Continue": "emotion_path" } }
        ]
    });

    // 5. Run
    RenPy.run();

</script>
</body>
</html>
