<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Browse Luca Gandolfi's browser tools, AI experiments, audio projects, visual experiments, and engineering demos.">
  <meta name="theme-color" content="#0a1628">
  <title>Projects Archive | Luca Gandolfi</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/catalog.css">
  <title>Projects Archive | Luca Gandolfi</title>
  <style>
    /* Room for the fixed site top bar injected by top_buttons.js */
    body.catalog-page { padding-top: 50px; padding-top: calc(var(--site-top-bar-height, 36px) + 14px); }
  </style>
</head>
<body class="catalog-page">
  <main class="container">
    <header class="header">
      <p class="eyebrow">Project archive</p>
      <h1 class="title">The project index</h1>
      <p class="subtitle">Tools, experiments, visual systems, browser AI, audio, computer vision, and useful side quests.</p>
      <div class="catalog-hero-actions"><a class="btn btn-primary" href="../../lab/index.html">Open Browser Lab</a></div>
    </header>
    <section data-catalog="projects" data-site-root="../../" aria-labelledby="projects-title">
      <h2 class="section-title" id="projects-title">Browse projects</h2>
      <div class="catalog-toolbar">
        <div class="catalog-field"><label for="project-search">Search projects</label><input class="catalog-input" id="project-search" data-catalog-search type="search" placeholder="Try AI, camera, audio, canvas..." autocomplete="off"></div>
        <div class="catalog-field"><label for="project-sort">Sort</label><select class="catalog-select" id="project-sort" data-catalog-sort><option value="featured">Featured first</option><option value="alpha">Alphabetical</option></select></div>
        <div class="catalog-actions"><button class="catalog-action" data-catalog-favorites aria-pressed="false" type="button">Favorites only</button><button class="catalog-action" data-catalog-clear type="button">Clear filters</button></div>
      </div>
      <div class="catalog-filters" data-catalog-filters aria-label="Project categories"></div>
      <div class="catalog-status" data-catalog-status role="status" aria-live="polite"></div>
      <div class="catalog-grid" data-catalog-grid></div>
    </section>
  </main>
  <script src="../../assets/js/projects-data.js"></script>
  <script src="../../assets/js/catalog-data.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../top_buttons.js"></script>
</body>
</html>
