<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proust - A Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: 'Cormorant Garamond', serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #111; }
        
        /* Override some RenPy-Lite styles for a more "book-like" feel if possible via CSS */
        /* Note: Since renpy-lite.js injects styles, we might need !important or specific selectors if we want to customize heavily. 
           For now, we'll stick to the default engine look but maybe the font will help. */
        .renpy-dialogue-box {
            font-family: 'Cormorant Garamond', serif !important;
            background: rgba(20, 20, 20, 0.9) !important;
            border-top: 2px solid #d4af37 !important; /* Gold border */
        }
        .renpy-name-label {
            font-family: 'Cormorant Garamond', serif !important;
            color: #d4af37 !important;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Import the RenPy-Lite Library -->
<script src="../../assets/js/renpy-lite.js"></script>

<script>
    // 1. Initialize
    RenPy.init({ container: 'game-container' });

    // 2. Define Assets
    // Using colors to represent moods/scenes since we don't have specific assets yet
    RenPy.image('bg_bedroom', '#1a1a2e'); // Dark blue night
    RenPy.image('bg_tea', '#5d4037'); // Warm brown/tea color
    RenPy.image('bg_combray', '#388e3c'); // Green garden
    RenPy.image('bg_salon', '#4a148c'); // Purple/Velvet salon
    RenPy.image('bg_verdurin', '#880e4f'); // Deep purple/red for salon
    RenPy.image('bg_bois', '#2e7d32'); // Bois de Boulogne

    // 3. Define Characters
    RenPy.define('m', 'Marcel', '#d4af37'); // Gold
    RenPy.define('mom', 'Maman', '#e91e63'); // Pink
    RenPy.define('sw', 'Swann', '#9e9e9e'); // Grey
    RenPy.define('o', 'Odette', '#ff4081'); // Pink accent
    RenPy.define('l', 'Aunt Léonie', '#795548'); // Brown
    RenPy.define('f', 'Françoise', '#607d8b'); // Blue grey

    // 4. The Script
    RenPy.script({
        start: [
            "scene bg_bedroom",
            "m 'For a long time I used to go to bed early.'",
            "m 'Sometimes, when I had put out my candle, my eyes would close so quickly that I had not even time to say \"I am going to sleep.\"'",
            "m 'And half an hour later the thought that it was time to go to sleep would awaken me.'",
            "m 'I would ask myself what o'clock it could be; I could hear the whistling of trains, which, now nearer and now farther off, punctuating the distance like the note of a bird in a forest.'",
            "m 'The magic lantern, which used to be set on top of my lamp while we waited for dinner time to finish...'",
            "m '...substituted for the opaqueness of my walls an impalpable iridescence, supernatural phenomena of many colours, in which legends were depicted as on a shifting and transitory window.'",
            "show mom",
            "mom 'My little Marcel. It is time to rest. The magic lantern must be put away.'",
            { 
                choice: "What do I desire?", 
                options: {
                    "I want a kiss goodnight.": "kiss_path",
                    "I will try to sleep without bothering her.": "sleep_path"
                }
            }
        ],
        kiss_path: [
            "m 'I could not sleep without her kiss. It was the only thing that gave me peace.'",
            "m 'My father would say: \"Come along, come along, go to bed.\"'",
            "m 'But I needed that viaticum, that sign of grace.'",
            "mom 'Just one kiss, then. You must be strong. You look so pale.'",
            "m 'The touch of her lips was a wafer of communion, a sign of peace.'",
            "m 'I would kiss her, and then I would have to undress, to crawl into bed, to dig my grave in the bedclothes.'",
            "jump madeleine_scene"
        ],
        sleep_path: [
            "m 'I turned away, my heart heavy. To grow up is to learn to sleep alone.'",
            "m 'I heard my father's footsteps on the stairs. The heavy tread of authority.'",
            "m 'I buried my head in the pillow, trying to stifle the sobs that rose in my throat.'",
            "m 'But the anxiety of the night was a heavy blanket, suffocating and cold.'",
            "jump madeleine_scene"
        ],
        madeleine_scene: [
            "scene bg_tea",
            "m 'Many years later...'",
            "m 'The day was dull and the prospect of the morrow depressing.'",
            "m 'I raised to my lips a spoonful of the tea in which I had soaked a morsel of the cake.'",
            "m 'No sooner had the warm liquid mixed with the crumbs touched my palate than a shudder ran through me and I stopped, intent upon the extraordinary thing that was happening to me.'",
            "m 'An exquisite pleasure had invaded my senses, something isolated, detached, with no suggestion of its origin.'",
            "m 'And at once the vicissitudes of life had become indifferent to me, its disasters innocuous, its brevity illusory.'",
            {
                choice: "What is this memory?",
                options: {
                    "Focus on the taste": "combray_path",
                    "Let the feeling fade": "fade_path"
                }
            }
        ],
        combray_path: [
            "m 'And suddenly the memory revealed itself.'",
            "scene bg_combray",
            "m 'The taste was that of the little piece of madeleine which on Sunday mornings at Combray...'",
            "m '...my aunt Léonie used to give me, dipping it first in her own cup of tea or lime-flower tea.'",
            "m 'The sight of the little madeleine had recalled nothing to my mind before I tasted it.'",
            "m 'But when from a long-distant past nothing subsists, after the people are dead, after the things are broken and scattered...'",
            "m '...taste and smell alone, more fragile but more enduring, more unsubstantial, more persistent, more faithful, remain poised a long time, like souls.'",
            "m 'The whole of Combray and its surroundings, taking shape and solidity, sprang into being, town and gardens alike, from my cup of tea.'",
            "add_item Madeleine",
            "m 'I have recovered the lost time.'",
            "jump swann_intro"
        ],
        swann_intro: [
            "scene bg_combray",
            "m 'But Combray was not just my aunt and the church. It was also where we received visits from M. Swann.'",
            "m 'We would hear the bell at the garden gate ring, a double peal, timid and oval.'",
            "show sw",
            "sw 'Good evening, my friends. The weather is delightful.'",
            "m 'Charles Swann. A man of high society, though my family knew him only as the son of the stockbroker.'",
            "m 'He had a life in Paris that we could scarcely imagine. A life of art, salons, and... love.'",
            {
                choice: "Ask about his life",
                options: {
                    "Ask about Paris": "swann_paris",
                    "Ask about Love": "swann_love"
                }
            }
        ],
        swann_paris: [
            "sw 'Paris? It is a city of masks, Marcel. Everyone plays a role.'",
            "sw 'I dine with the Prince of Wales, I visit the Jockey Club... but these are just distractions.'",
            "sw 'But there are moments of truth. Usually found in art, or music.'",
            "jump swann_love_story"
        ],
        swann_love: [
            "sw 'Love? Ah, that is a malady, my boy. A sweet, tormenting malady.'",
            "sw 'It begins with a look, a word, a shared moment. And then it consumes you.'",
            "sw 'To love is to suffer, but to not love is to not live.'",
            "jump swann_love_story"
        ],
        swann_love_story: [
            "scene bg_verdurin",
            "m 'Swann's story takes us to the Verdurin salon. A place of \"the faithful\".'",
            "m 'It was a little clan, a sect, where Mme Verdurin ruled as a tyrant.'",
            "m 'It was there he met Odette de Crécy.'",
            "show o",
            "o 'M. Swann! You are late. The pianist has already started.'",
            "sw 'Forgive me, Odette. I was detained.'",
            "m 'She was not his type. In fact, he found her beauty somewhat sharp, her profile too imperfect.'",
            "m 'And yet, when she looked at him with those large, languid eyes...'",
            "jump cattleya_scene"
        ],
        cattleya_scene: [
            "scene bg_bois",
            "m 'One evening, in a carriage, she held a bunch of cattleyas in her hand.'",
            "o 'Here, let me fix your cattleya. It is crooked.'",
            "sw 'You are too kind.'",
            "m 'The movement brought her close to him. The scent of the flowers mingled with her perfume.'",
            "m 'To \"do a cattleya\" became their secret code. A metaphor for intimacy.'",
            "m 'But love is never simple. Jealousy soon followed.'",
            "jump vinteuil_sonata"
        ],
        vinteuil_sonata: [
            "scene bg_salon",
            "m 'And then, the music played. The Vinteuil Sonata.'",
            "m 'A little phrase, five notes that captured the essence of their love.'",
            "m 'It was the national anthem of their love.'",
            "sw 'Listen, Odette. Do you hear it? It speaks of things we cannot say.'",
            "o 'It is pretty, Charles. But I prefer the waltz.'",
            "m 'Swann realized then that we do not love people for who they are, but for the image we create of them.'",
            "m 'To leave her would be to leave the only part of himself that was truly alive.'",
            { choice: "Fin", options: { "Restart": "start", "Return to Portfolio": "exit" } }
        ],
        fade_path: [
            "m 'I tried to grasp it, but it slipped away like water through fingers.'",
            "m 'The past is hidden somewhere outside the realm, beyond the reach of intellect.'",
            "m 'Perhaps another time.'",
            { choice: "Try again?", options: { "Restart": "start" } }
        ],
        exit: [
            // This is a special label that the engine might handle, or we can redirect
            "m 'Adieu.'",
            function() { window.location.href = '../../pages/main/visualnovels.html'; }
        ]
    });

    // 5. Run
    RenPy.run();

</script>
</body>
</html>
