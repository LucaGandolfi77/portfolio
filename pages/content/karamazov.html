<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Fratelli Karamazov - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: 'Merriweather', serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #111; }
        
        /* Stile Dostoevskiano - Override classi RenPy-Lite */
        .rp-box {
            font-family: 'Merriweather', serif !important;
            background: rgba(10, 10, 10, 0.95) !important;
            border-top: 2px solid #8b0000 !important; /* Rosso scuro */
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8) !important;
            /* Parametri base */
            min-height: 160px !important;
        }
        .rp-name {
            font-family: 'Merriweather', serif !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
        }
        .rp-text {
            font-family: 'Merriweather', serif !important;
            line-height: 1.6 !important;
        }

        /* Fix per iPhone/Mobile: Aumenta spazio e gestisce safe area */
        @media (max-width: 768px) {
            .rp-box {
                min-height: 220px !important; /* Aumentato per mostrare 3+ righe */
                padding: 20px !important;
                padding-bottom: calc(30px + env(safe-area-inset-bottom)) !important;
                width: 95% !important;
                bottom: 10px !important;
            }
            .rp-text {
                font-size: 1.05rem !important;
            }
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Import the RenPy-Lite Library -->
<script src="../../assets/js/renpy-lite.js"></script>

<script>
    // 1. Inizializzazione
    RenPy.init({ container: 'game-container' });

    // 2. Definizione Assets (Immagini Placeholder)
    RenPy.image('bg_monastery', 'https://placehold.co/800x600/2c3e50/ffffff?text=Monastero+di+Optina');
    RenPy.image('bg_house', 'https://placehold.co/800x600/3e2723/ffffff?text=Casa+Karamazov');
    RenPy.image('bg_tavern', 'https://placehold.co/800x600/d35400/ffffff?text=Taverna+Mokroe');
    RenPy.image('bg_night', 'https://placehold.co/800x600/000000/ffffff?text=Notte+Oscura');
    RenPy.image('bg_stone', 'https://placehold.co/800x600/7f8c8d/ffffff?text=La+Grande+Pietra');
    RenPy.image('bg_snow', 'https://placehold.co/800x600/ecf0f1/2c3e50?text=Neve+e+Gelo');
    RenPy.image('bg_school', 'https://placehold.co/800x600/8e44ad/ffffff?text=Scuola+e+Ragazzi');
    RenPy.image('bg_court', 'https://placehold.co/800x600/34495e/ffffff?text=Tribunale');

    // 3. Definizione Personaggi
    RenPy.define('n', '📜 Narratore', '#bdc3c7');
    RenPy.define('f', 'Fëdor P. ⚔️', '#e74c3c'); // Rosso, passione sregolata
    RenPy.define('d', 'Dmitri 🔥', '#c0392b'); // Rosso scuro, impulsivo
    RenPy.define('i', 'Ivan 🧠', '#2980b9'); // Blu freddo, intellettuale
    RenPy.define('a', 'Alëša ✨', '#f1c40f'); // Oro, spirituale
    RenPy.define('z', 'Zosima 🙏', '#ecf0f1'); // Bianco, santo

    // 4. Lo Script
    RenPy.script({
        start: [
            "scene bg_house",
            "n 'Alexèj Fëdorovic Karamazov era il terzo figlio di un proprietario terriero del nostro distretto, Fëdor Pavlovic Karamazov... 📜'",
            "n 'Un uomo noto per la sua fine tragica e oscura, avvenuta tredici anni fa, e che tutti ricordano ancora. ⚰️'",
            "n 'Ma questa è la storia dei suoi figli. E della la battaglia tra Dio e il Diavolo nei loro cuori. ⚔️'",
            "show f",
            "f 'Sono un buffone, signori! Un vecchio buffone, lo ammetto! Ma c\'è voluttà anche nella degradazione. 🤡'",
            "f 'Ditemi, figli miei, esiste Dio o no? 🤔'",
            {
                choice: "Chi risponderà?",
                options: {
                    "Ivan (L'intellettuale) 🧠": "ivan_intro",
                    "Alëša (Il novizio) ✨": "alyosha_intro"
                }
            }
        ],

        ivan_intro: [
            "show i",
            "i 'No, non esiste Dio. 🚫'",
            "f 'E l'immortalità? Esiste?'",
            "i 'Non esiste neppure l'immortalità. ⏳'",
            "f 'Allora tutto è permesso?'",
            "i 'Se Dio non esiste, tutto è permesso. 🔓'",
            "n 'Questa frase risuonerà come una condanna per l'anima di Ivan. ⚖️'",
            "jump monastery_scene"
        ],

        alyosha_intro: [
            "show a",
            "a 'Dio esiste. E l'immortalità esiste. ✝️'",
            "f 'Ah, Alëša! Tu sei un angelo. Ma anche gli angeli possono cadere. 👼'",
            "a 'Pregherò per voi, padre. 🙏'",
            "jump monastery_scene"
        ],

        monastery_scene: [
            "scene bg_monastery",
            "n 'La famiglia si riunisce nella cella dello Starets Zosima, sperando di risolvere una disputa ereditaria tra Fëdor e Dmitri. ⛪'",
            "show z",
            "z 'L'amore in azione è una cosa terribile e dura, paragonato all'amore nei sogni. 💭'",
            "show d",
            "d 'Perché vive un uomo simile?! 😡'",
            "n 'Dmitri esplode contro suo padre. La tensione è palpabile. ⚡'",
            "f 'Mi sfida! Vuole uccidermi per quella donna, Grushenka! 💃'",
            "d 'State attento, vecchio! Non vi garantisco nulla! 👊'",
            "n 'Improvvisamente, lo Starets si alza e si inchina fino a terra davanti a Dmitri.'",
            "z 'Mi inchino davanti alla grande sofferenza che ti attende. 🙏'",
            { 
                choice: "Dopo la discussione", 
                options: { 
                    "Segui Dmitri nella notte 🌙": "dmitri_confession", 
                    "Rimanere e parlare con Grushenka ❤️": "grushenka_path",
                    "Seguire Alëša e i ragazzi 👦": "boys_story_start",
                    "Visitare la signora Khokhlakov e Lise 💌": "lise_scene"
                } 
            }
        ],

        lise_scene: [
            "scene bg_house",
            "n 'Alëša visita la signora Khokhlakov e sua figlia Lise, che è sulla sedia a rotelle. ♿'",
            "n 'Lise è capricciosa ma innamorata di Alëša. Gli consegna una lettera. ✉️'",
            "n 'Lise: \"Voglio che qualcuno mi torturi, voglio sposarvi e poi mangiare composta di ananas mentre la casa brucia.\" 🔥🍍'",
            "n 'È un anima tormentata, specchio femminile dei dubbi di Ivan.'",
            "a 'Lise, non dite queste cose. Voi avete un cuore buono.'",
            "n 'Alëša promette di tornare, ma il destino incalza.'",
            "jump dmitri_confession"
        ],

        boys_story_start: [
            "scene bg_school",
            "n 'Alëša vede un gruppo di scolari che tirano sassi a un bambino solo. 🪨'",
            "show a",
            "a 'Perché lo colpite? Siete in tanti contro uno! ✋'",
            "n 'Il bambino è Iljuša. I suoi occhi sono pieni di rabbia e lacrime.'",
            "n 'Uno dei ragazzi, Smurov, risponde.'",
            "n 'Smurov: \"Ha pugnalato Krasotkin con un temperino! È un mostro!\"'",
            {
                choice: "Cosa farà Alëša?",
                options: {
                    "Difendere Iljuša 🛡️": "defend_ilyusha",
                    "Cercare di capire la causa ❓": "investigate_insult"
                }
            }
        ],

        defend_ilyusha: [
            "a 'Basta! Non vedete che è disperato? ✨'",
            "n 'Iljuša, però, non accetta la pietà. Si scaglia contro Alëša e gli morde un dito. 🦷'",
            "a 'Ah! ... Non importa. Se ti fa sentire meglio, mordi pure.'",
            "n 'Iljuša rimane stupito dalla non-violenza di Alëša.'",
            "jump ilyusha_home"
        ],

        investigate_insult: [
            "a 'Cosa è successo prima? Perché tanto odio?'",
            "n 'I ragazzi raccontano che il padre di Iljuša, il capitano Snegirëv, è stato umiliato pubblicamente da Dmitri Karamazov. 😞'",
            "a 'Mio fratello... Dmitri ha fatto questo? Devo rimediare.'",
            "jump ilyusha_home"
        ],

        ilyusha_home: [
            "scene bg_house",
            "n 'Alëša va a casa del capitano Snegirëv per offrire aiuto e scuse. 🏠'",
            "n 'La casa è povera, la famiglia è in rovina.'",
            "n 'Il capitano rifiuta i soldi offerti da Alëša, calpestandoli con orgoglio e disperazione. 🦶💵'",
            "n 'Capitano: \"Cosa direi al mio ragazzo se accettassi i soldi di chi mi ha picchiato?\"'",
            "jump kolya_krasotkin"
        ],

        kolya_krasotkin: [
            "scene bg_snow",
            "n 'Entra in scena Kolya Krasotkin, un ragazzo precoce e leader del gruppo. 🐕'",
            "n 'Kolya ha un cane, Perezvon, e teorie socialiste.'",
            "show a",
            "a 'Kolya, Iljuša sta morendo. Dobbiamo portargli gioia, non rancore.'",
            "n 'Kolya, che in fondo ha un cuore nobile, decide di riconciliarsi.'",
            "jump ilyusha_deathbed"
        ],

        ilyusha_deathbed: [
            "scene bg_house",
            "n 'Al capezzale di Iljuša, tutti i ragazzi si riuniscono. 🛌'",
            "n 'Iljuša è felice di vedere Kolya e il cane.'",
            "n 'Ma la malattia è inesorabile.'",
            "n 'Iljuša: \"Papà, non piangere... quando sarò morto, prendi un altro bambino buono...\"'",
            "n 'Il piccolo muore circondato da amore, sanando con la sua sofferenza le divisioni dei grandi.'",
            "jump epilogue"
        ],

        grushenka_path: [
            "scene bg_tavern",
            "n 'Grushenka passa la notte in ozio; la sua storia si incrocia con il destino della famiglia. 🍷'",
            "show f",
            "f 'Oh, Grushenka... tu accendi il cuore degli uomini come un fuoco. 🔥'",
            "n 'Una scelta presenta due possibili sviluppi. 🛤️'",
            { 
                choice: "Come gestire Grushenka?", 
                options: { 
                    "Cercare di conquistarla 💘": "grushenka_conquest", 
                    "Ascoltare la favola della Cipolla 🧅": "onion_parable",
                    "Difenderla dalle calunnie 🛡️": "katerina_path" 
                } 
            }
        ],

        onion_parable: [
            "scene bg_tavern",
            "n 'Grushenka racconta una vecchia favola contadina. 👵'",
            "n 'Cera una volta una donna cattiva che morì e fu gettata nel lago di fuoco. 🔥'",
            "n 'Il suo angelo custode cercò una buona azione e ricordò: \"Ha dato una cipollina a una mendicante\". 🧅'",
            "n 'Dio disse: \"Prendi quella cipolla e tirala fuori\".'",
            "n 'Langelo tese la cipolla, ma altri peccatori si aggrapparono alla donna per salvarsi anche loro. 👥'",
            "n 'Lei li scalciò via gridando: \"È la MIA cipolla, non la vostra!\". E la cipolla si spezzò. 💔'",
            "n 'Grushenka piange. \"Sono io quella donna cattiva, Alëša. Ma tu mi hai dato una cipolla oggi.\" 😢'",
            "jump the_tragedy"
        ],

        grushenka_conquest: [
            "n 'Fëdor si avvicina a Grushenka con falsa tenerezza. 🐍'",
            "f 'Tu sei la domanda e la risposta, mia cara. 🌹'",
            "n 'Ma i pettegolezzi e i sospetti si intensificano. 🗣️'",
            "jump the_tragedy"
        ],

        katerina_path: [
            "scene bg_house",
            "n 'Katerina Ivanovna, offesa e desolata, cerca la verità e la reputazione. 💎'",
            "show i",
            "i 'Non posso condannare chi ama, ma la legge è cieca. ⚖️'",
            "n 'Katerina si trova intrappolata tra orgoglio e dignità. 🦁'",
            "jump trial_scene"
        ],

        dmitri_confession: [
            "scene bg_night",
            "n 'Dmitri vaga nella notte, tormentato. 🌑'",
            "show d",
            "d 'La bellezza è una cosa terribile. È lì che il Diavolo lotta con Dio, e il campo di battaglia è il cuore degli uomini. ⚔️'",
            "d 'Io sono un insetto, Alëša. Un insetto sensuale. Ma amo la vita! 🐞'",
            "d 'Posso cadere nell'abisso, ma anche dal fondo dell'abisso canterò un inno a Dio. 🎶'",
            {
                choice: "Il destino di Dmitri",
                options: {
                    "Cedere alla passione 💥": "passion_path",
                    "Cercare redenzione 🙏": "redemption_path"
                }
            }
        ],

        passion_path: [
            "d 'Ho bisogno di tremila rubli. Per lei. Per Grushenka. Se non li trovo... 💸'",
            "n 'Il pensiero oscuro si fa strada. Il pestello di ottone nella tasca. 🔨'",
            "jump rebellion_scene"
        ],

        redemption_path: [
            "d 'Se solo potessi restituire quei soldi a Katerina Ivanovna... sarei libero. 🕊️'",
            "d 'Ma sono debole. Prega per me, fratello. 📿'",
            "jump rebellion_scene"
        ],

        rebellion_scene: [
            "scene bg_tavern",
            "n 'Ivan e Alëša discutono. Ivan parla della sofferenza dei bambini. 👶'",
            "show i",
            "i 'Non è Dio che non accetto, Alëša, ma il mondo che ha creato. 🌍'",
            "i 'Immagina un bambino tremante di freddo e terrore, che si batte il petto con il pugno...'",
            "i 'Se la sofferenza dei bambini serve a comprare l armonia eterna, allora io non voglio quell armonia. 🚫'",
            "i 'È un prezzo troppo alto. Restituisco il biglietto d ingresso. 🎫'",
            "a 'Questa è ribellione.'",
            "jump grand_inquisitor"
        ],

        grand_inquisitor: [
            "scene bg_tavern",
            "i 'Se Dio non esiste, tutto è permesso. Io sono il mandante morale. 🧠'",
            "n 'Ivan sprofonda nella follia, vedendo il Diavolo nella sua stanza. 👿'",
            { 
                choice: "Azione successiva", 
                options: { 
                    "Affrontare l'incubo di Ivan 👹": "ivan_nightmare",
                    "Prepararsi al processo ⚖️": "trial_scene", 
                    "Indagare Smerdyakov 🔍": "smerdyakov_investigation" 
                } 
            }
        ],

        ivan_nightmare: [
            "scene bg_house",
            "n 'Nella stanza di Ivan appare un gentiluomo russo, un po decaduto. È il Diavolo. 🎩'",
            "show i",
            "i 'Sei una mia allucinazione! Non esisti! 😵'",
            "n 'Diavolo: \"Je pense, donc je suis. Ma io sono l x nell equazione indeterminata.\" 😈'",
            "n 'Diavolo: \"Io voglio il bene, ma faccio il male. Senza di me non ci sarebbero eventi, solo un noioso osanna.\" '",
            "i 'Taci! Stupido fantasma!'",
            "n 'Alëša bussa alla porta, scacciando l incubo. Ma il dubbio rimane.'",
            "jump trial_scene"
        ],

        smerdyakov_investigation: [
            "scene bg_house",
            "n 'Ivan visita Smerdyakov tre volte. L ultima visita è la decisiva. 🚪'",
            "show i",
            "i 'Tu hai ucciso mio padre! Dimmi la verità! 😠'",
            "n 'Smerdyakov, malato e pallido, sorride beffardo.'",
            "n 'Smerdyakov: \"Voi siete il vero assassino. Io sono stato solo il vostro strumento. Voi avete detto che tutto è permesso.\" 🐍'",
            "n 'Smerdyakov tira fuori dalla calza tremila rubli. \"Ecco i soldi. Prendeteli.\" 💵'",
            "i 'Domani confesserò tutto in tribunale!'",
            "n 'Quella notte, Smerdyakov si impicca. Ivan rimane solo con la sua colpa. 💀'",
            "jump trial_scene"
        ],

        trial_scene: [
            "scene bg_court",
            "n 'Il processo di Dmitri si apre fra clamore e commozione. Tutta la città è presente. 📢'",
            "show d",
            "d 'Io ho amato. Ho sofferto. Ma non ho ucciso. 🙅‍♂️'",
            { 
                choice: "Fasi del Processo", 
                options: { 
                    "Ascoltare i Testimoni 👥": "trial_witnesses", 
                    "Ascoltare l'Accusa e la Difesa ⚖️": "trial_lawyers" 
                } 
            }
        ],

        trial_witnesses: [
            "n 'Chiamano i testimoni. Il primo è Rakitin, il seminarista liberale. 👓'",
            "n 'Rakitin dipinge Dmitri come un prodotto della decadenza sociale, cercando di farsi bello agli occhi del pubblico.'",
            "n 'Poi tocca ai medici. È una commedia degli errori. ⚕️'",
            {
                choice: "Ascoltare i medici?",
                options: {
                    "Sì, sentiamo gli esperti 🩺": "witness_doctors",
                    "No, passiamo ai protagonisti ⏩": "witness_katerina_drama"
                }
            }
        ],

        witness_doctors: [
            "n 'Il dottor Herzenstube, vecchio e gentile, dice che Dmitri è anormale perché... non ama il caffè! ☕'",
            "n 'Il dottor Varvinsky, giovane e moderno, sostiene che è una mania passionale.'",
            "n 'La corte ride. La scienza non sembra spiegare l anima russa. 😂'",
            "jump witness_katerina_drama"
        ],

        witness_katerina_drama: [
            "scene bg_court",
            "n 'L atmosfera cambia. Entra Katerina Ivanovna. È pallida. ❄️'",
            "n 'Inizialmente difende Dmitri, ma poi Ivan ha un crollo nervoso in aula.'",
            "n 'Ivan urla: \"Io sono l assassino! Lui è innocente!\". Ma nessuno gli crede, pensano sia pazzo. 🤪'",
            "n 'Katerina, terrorizzata per Ivan, cambia tutto. Tira fuori una lettera. ✉️'",
            "n 'Katerina: \"Ecco la prova! Dmitri mi scrisse: 'Ucciderò mio padre se non trovo i soldi'!\"'",
            "n 'La sala sussulta. È il colpo di grazia per Dmitri. 💔'",
            "jump trial_lawyers"
        ],

        trial_lawyers: [
            "scene bg_court",
            "n 'Il Procuratore Ippolit Kirillovich prende la parola. 👨‍⚖️'",
            "n 'Procuratore: \"Guardate questa famiglia! I Karamazov sono la Russia sfrenata, capace di abissi e di vette, ma incapace di misura.\" 🇷🇺'",
            "n 'Procuratore: \"Il parricidio è il crimine supremo. La psicologia è un arma a doppio taglio, ma qui i fatti parlano.\" 🔪'",
            "n 'Poi si alza Fetyukovich, il celebre avvocato difensore. 🛡️'",
            "n 'Fetyukovich: \"Un padre deve essere degno di questo nome per pretendere amore. Fëdor Pavlovic non era un padre, ma una sciagura.\" 🥀'",
            "n 'Fetyukovich: \"Meglio assolvere dieci colpevoli che condannare un innocente!\"'",
            "n 'La folla applaude la difesa. Le signore agitano i fazzoletti. Le opinioni sono divise. 🗣️'",
            {
                choice: "Cosa pensa il pubblico?",
                options: {
                    "Le signore sono per l'assoluzione 👩": "public_ladies",
                    "I contadini nella giuria sono scuri in volto 👨‍🌾": "public_peasants"
                }
            }
        ],

        public_ladies: [
            "n 'Le signore dell alta società sono affascinate da Dmitri e dall eloquenza dell avvocato.'",
            "n '\"Povero ragazzo! È così romantico! E l avvocato... che oratore!\" 😍'",
            "jump verdict_moment"
        ],

        public_peasants: [
            "n 'I giurati sono semplici contadini, mercanti, gente del popolo.'",
            "n 'Non si lasciano incantare dalle belle parole. Per loro, uccidere il padre è un peccato mortale senza scuse. ✝️'",
            "jump verdict_moment"
        ],

        verdict_moment: [
             "n 'La giuria si ritira. L attesa è snervante. ⏳'",
             "jump dmitri_prison"
        ],

        dmitri_prison: [
            "scene bg_stone",
            "n 'Il verdetto è: COLPEVOLE. Dmitri è condannato ai lavori forzati in Siberia. 🔨'",
            "n 'Dmitri è in prigione, ma la sua anima cerca redenzione. ⛓️'",
            "show d",
            "d 'Se soffro per l'amore che ho dato, allora non potrò mai rimpiangere di aver amato. ❤️'",
            { 
                choice: "Cosa farà Dmitri?", 
                options: { 
                    "Sognare il 'Bimbo' (Il sogno profetico) 👶": "dmitri_dream",
                    "Pianificare la fuga con Ivan 🏃": "escape_plan",
                    "Accettare la pena e cercare la pace ☮️": "redemption_end"
                } 
            }
        ],

        dmitri_dream: [
            "scene bg_snow",
            "n 'Dmitri si addormenta e sogna la steppa bruciata. Vede una donna magra con un bimbo che piange. ❄️'",
            "d 'Perché piange il bimbo? Perché è nudo? Perché non lo nutrono?'",
            "n 'Una voce risponde: \"È il bimbo, il povero bimbo\".'",
            "d 'Sento una pietà immensa... voglio fare qualcosa per tutti i bimbi, per tutti gli uomini.'",
            "d 'Voglio soffrire affinché non ci siano più lacrime.'",
            "n 'Dmitri si sveglia con una nuova forza: l inno alla gioia anche dalle profondità.'",
            "jump redemption_end"
        ],

        escape_plan: [
            "scene bg_night",
            "show i",
            "i 'Ho corrotto le guardie. Puoi scappare in America con Grushenka. 🇺🇸'",
            "d 'L America... terra di macchine e non di spirito. Ma per lei lo farò.'",
            "n 'Dmitri accetta la fuga, ma il suo cuore rimarrà sempre in Russia.'",
            "jump epilogue"
        ],

        final_revolt: [
            "n 'La rabbia di Dmitri lo porta a un ultimo atto di disperazione. 🌋'",
            "d 'Meglio morire libero che vivere come un prigioniero dell'anima. 🦅'",
            "jump epilogue"
        ],

        redemption_end: [
            "scene bg_monastery",
            "n 'Con l'aiuto di Alëša e della comunità, Dmitri trova un raro sentiero di pace. 🛤️'",
            "show a",
            "a 'La preghiera non cancella il passato, ma rende possibile un domani diverso. 🌅'",
            "n 'Il perdono non è scontato, ma la possibilità di rinsavire è un dono. 🎁'",
            "jump epilogue"
        ],
