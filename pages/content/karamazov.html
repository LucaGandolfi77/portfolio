<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Fratelli Karamazov - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: 'Merriweather', serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #111; }

        /* Stile Dostoevskiano - Override classi RenPy-Lite */
        .rp-box {
            font-family: 'Merriweather', serif !important;
            background: rgba(10, 10, 10, 0.95) !important;
            border-top: 2px solid #8b0000 !important; /* Rosso scuro */
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8) !important;
            min-height: 160px !important;
        }
        .rp-name {
            font-family: 'Merriweather', serif !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
        }
        .rp-text {
            font-family: 'Merriweather', serif !important;
            line-height: 1.6 !important;
        }

        /* Fix per iPhone/Mobile: Aumenta spazio e gestisce safe area */
        @media (max-width: 768px) {
            .rp-box {
                min-height: 220px !important;
                padding: 20px !important;
                padding-bottom: calc(30px + env(safe-area-inset-bottom)) !important;
                width: 95% !important;
                bottom: 10px !important;
            }
            .rp-text {
                font-size: 1.05rem !important;
            }
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Import the RenPy-Lite Library -->
<script src="../../assets/js/renpy-lite.js"></script>

<script>
    // ════════════════════════════════════════════════════════════
    //  I FRATELLI KARAMAZOV — Visual Novel (edizione espansa)
    //  Fedele al romanzo di Dostoevskij: sottotrame Zosima/Cana,
    //  Grande Inquisitore, caccia ai tremila rubli, notte del
    //  delitto, interrogatorio, processo ed epilogo ampliati.
    // ════════════════════════════════════════════════════════════

    // 1. Inizializzazione
    RenPy.init({ container: 'game-container' });

    // 2. Sfondi
    RenPy.image('bg_monastery', 'https://placehold.co/800x600/2c3e50/ffffff?text=Monastero+di+Optina');
    RenPy.image('bg_house',     'https://placehold.co/800x600/3e2723/ffffff?text=Casa+Karamazov');
    RenPy.image('bg_tavern',    'https://placehold.co/800x600/d35400/ffffff?text=Taverna+Mokroe');
    RenPy.image('bg_night',     'https://placehold.co/800x600/000000/ffffff?text=Notte+Oscura');
    RenPy.image('bg_stone',     'https://placehold.co/800x600/7f8c8d/ffffff?text=La+Grande+Pietra');
    RenPy.image('bg_snow',      'https://placehold.co/800x600/ecf0f1/2c3e50?text=Neve+e+Gelo');
    RenPy.image('bg_school',    'https://placehold.co/800x600/8e44ad/ffffff?text=Scuola+e+Ragazzi');
    RenPy.image('bg_court',     'https://placehold.co/800x600/34495e/ffffff?text=Tribunale');
    RenPy.image('bg_garden',    'https://placehold.co/800x600/27ae60/ffffff?text=Giardino+del+Monastero');
    RenPy.image('bg_ivanroom',  'https://placehold.co/800x600/1a1a2e/e0e0e0?text=Stanza+di+Ivan');
    RenPy.image('bg_hospital',  'https://placehold.co/800x600/16a085/ffffff?text=Ospedale+di+Carcere');
    RenPy.image('bg_street',    'https://placehold.co/800x600/57606f/ffffff?text=Strade+Cittadine');

    // 3. Ritratti dei personaggi (il motore li mostra con "show")
    RenPy.image('n',  'https://placehold.co/400x600/bdc3c7/2c3e50?text=%F0%9F%93%9C');
    RenPy.image('f',  'https://placehold.co/400x600/e74c3c/ffffff?text=F%C3%ABdor');
    RenPy.image('d',  'https://placehold.co/400x600/c0392b/ffffff?text=Dmitri');
    RenPy.image('i',  'https://placehold.co/400x600/2980b9/ffffff?text=Ivan');
    RenPy.image('a',  'https://placehold.co/400x600/f1c40f/2c3e50?text=Al%C3%AB%C5%A1a');
    RenPy.image('z',  'https://placehold.co/400x600/ecf0f1/2c3e50?text=Zosima');
    RenPy.image('g',  'https://placehold.co/400x600/e84393/ffffff?text=Grushenka');
    RenPy.image('k',  'https://placehold.co/400x600/fd79a8/ffffff?text=Katerina');
    RenPy.image('s',  'https://placehold.co/400x600/636e72/ffffff?text=Smerdyakov');
    RenPy.image('l',  'https://placehold.co/400x600/81ecec/2c3e50?text=Lise');
    RenPy.image('ko', 'https://placehold.co/400x600/00b894/ffffff?text=Kolya');
    RenPy.image('sn', 'https://placehold.co/400x600/b2bec3/2d3436?text=Snegir%C3%ABv');
    RenPy.image('dv', 'https://placehold.co/400x600/6c5ce7/ffffff?text=%3F%3F%3F');
    RenPy.image('ra', 'https://placehold.co/400x600/7f8c8d/ffffff?text=Rakitin');
    RenPy.image('fe', 'https://placehold.co/400x600/0984e3/ffffff?text=Fetyukovich');
    RenPy.image('pr', 'https://placehold.co/400x600/d35400/ffffff?text=Procuratore');

    // 4. Definizione Personaggi (nome + colore nel box dialogo)
    RenPy.define('n',  '📜 Narratore', '#bdc3c7');
    RenPy.define('f',  'Fëdor P. ⚔️', '#e74c3c');
    RenPy.define('d',  'Dmitri 🔥', '#ff7675');
    RenPy.define('i',  'Ivan 🧠', '#74b9ff');
    RenPy.define('a',  'Alëša ✨', '#ffeaa7');
    RenPy.define('z',  'Zosima 🙏', '#ecf0f1');
    RenPy.define('g',  'Grushenka 💃', '#fd79a8');
    RenPy.define('k',  'Katerina 💎', '#ffb8b8');
    RenPy.define('s',  'Smerdyakov 🐍', '#a4b0be');
    RenPy.define('l',  'Lise 💌', '#81ecec');
    RenPy.define('ko', 'Kolya ⚽', '#55efc4');
    RenPy.define('sn', 'Cap. Snegirëv 🎖️', '#dfe6e9');
    RenPy.define('dv', 'Il Gentiluomo 😈', '#a29bfe');
    RenPy.define('ra', 'Rakitin 👓', '#95a5a6');
    RenPy.define('fe', 'Fetyukovich 🛡️', '#74c7ec');
    RenPy.define('pr', 'Procuratore ⚖️', '#fab1a0');

    // 5. Lo Script
    RenPy.script({

        /* ══════════ PROLOGO ══════════ */

        start: [
            "scene bg_house",
            "add_item 📖 Il romanzo di Dostoevskij",
            "n 'Alexèj Fëdorovic Karamazov era il terzo figlio di un proprietario terriero del nostro distretto, Fëdor Pavlovic Karamazov...'",
            "n 'Un uomo noto per la sua fine tragica e oscura, avvenuta tredici anni fa, e che tutti ricordano ancora.'",
            "n 'Ma questa è la storia dei suoi figli. E della battaglia tra Dio e il Diavolo nei loro cuori.'",
            "show f",
            "f 'Sono un buffone, signori! Un vecchio buffone, lo ammetto! Ma c\'è voluttà anche nella degradazione.'",
            "f 'Ditemi, figli miei, esiste Dio o no?'",
            {
                choice: "Chi risponderà?",
                options: {
                    "Ivan (L'intellettuale) 🧠": "ivan_intro",
                    "Alëša (Il novizio) ✨": "alyosha_intro"
                }
            }
        ],

        ivan_intro: [
            "show i",
            "i 'No, non esiste Dio.'",
            "f 'E l'immortalità? Esiste?'",
            "i 'Non esiste neppure l'immortalità.'",
            "f 'Allora tutto è permesso?'",
            "i 'Se Dio non esiste, tutto è permesso.'",
            "n 'Nell'angolo, Smerdyakov il cuoco sorride appena, come se avesse aspettato quella frase tutta la vita.'",
            "show s",
            "s 'È come aver detto una parola d'ordine, padrone Ivan. Se tutto è permesso... allora qualcuno dovrà pur agire.'",
            "n 'Questa frase risuonerà come una condanna per l'anima di Ivan.'",
            "jump monastery_scene"
        ],

        alyosha_intro: [
            "show a",
            "a 'Dio esiste. E l'immortalità esiste.'",
            "f 'Ah, Alëša! Tu sei un angelo. Ma anche gli angeli possono cadere.'",
            "a 'Pregherò per voi, padre.'",
            "n 'Anche stavolta Smerdyakov, in silenzio nell'angolo, fissa Ivan più che il padre.'",
            "jump monastery_scene"
        ],

        /* ══════════ LA CELLA DI ZOSIMA ══════════ */

        monastery_scene: [
            "scene bg_monastery",
            "n 'La famiglia si riunisce nella cella dello Starets Zosima, sperando di risolvere una disputa ereditaria tra Fëdor e Dmitri.'",
            "show z",
            "z 'L'amore in azione è una cosa terribile e dura, paragonato all'amore nei sogni.'",
            "show d",
            "d 'Perché vive un uomo simile?!'",
            "n 'Dmitri esplode contro suo padre. La tensione è palpabile.'",
            "f 'Mi sfida! Vuole uccidermi per quella donna, Grushenka!'",
            "d 'State attento, vecchio! Non vi garantisco nulla!'",
            "n 'Improvvisamente, lo Starets si alza e si inchina fino a terra davanti a Dmitri.'",
            "z 'Mi inchino davanti alla grande sofferenza che ti attende.'",
            "n 'Dmitri trema. Nessuno capisce — ma quello sguardo vedrà presto ogni abisso.'",
            {
                choice: "Dopo la discussione",
                options: {
                    "Segui Dmitri nella notte 🌙": "dmitri_confession",
                    "Rimanere e parlare con Grushenka ❤️": "grushenka_path",
                    "Seguire Alëša e i ragazzi 👦": "boys_story_start",
                    "Visitare la signora Khokhlakov e Lise 💌": "lise_scene",
                    "Restare nel giardino con Zosima 🌿": "zosima_teachings"
                }
            }
        ],

        /* ══════════ LISE E LA MADRE ══════════ */

        lise_scene: [
            "scene bg_house",
            "n 'Alëša visita la signora Khokhlakov e sua figlia Lise, che è sulla sedia a rotelle.'",
            "show l",
            "l 'Alëša! Finalmente! Ho una lettera per voi. No, non guardate così, ve la do dopo... o forse adesso.'",
            "l 'Voglio che qualcuno mi torturi, voglio sposarvi e poi mangiare composta di ananas mentre la casa brucia.'",
            "show a",
            "a 'Lise, non dite queste cose. Voi avete un cuore buono.'",
            "l 'È proprio questo il terribile! Il mio cuore è buono e insieme voglio il caos. Come vostro fratello Ivan, ma in gonnella.'",
            "n 'È un'anima tormentata, specchio femminile dei dubbi di Ivan.'",
            {
                choice: "Come risponde Alëša?",
                options: {
                    "Leggere subito la lettera ✉️": "lise_letter",
                    "Salutare e correre dallo Starets 🏃": "zosima_teachings"
                }
            }
        ],

        lise_letter: [
            "n 'La lettera dice soltanto: «Alëša Karamazov, vi amo. Volete sposarmi? Lise.»'",
            "show a",
            "a 'Che follia tenera... Sposerò, no, non posso. Ma non potrò nemmeno rifiutarla del tutto.'",
            "n 'Alëša bacia la mano della madre e fugge, con il cuore diviso tra due mondi.'",
            "jump zosima_teachings"
        ],

        /* ══════════ ZOSIMA: INSEGNAMENTI, MORTE, CANA ══════════ */

        zosima_teachings: [
            "scene bg_garden",
            "show z",
            "z 'Siediti, Alëša. Ti racconto di mio fratello Markel, morto a diciassette anni.'",
            "z 'Da malato diceva: «La vita è paradiso, ma noi non vogliamo vederlo». E poi: «Ognuno è colpevole davanti a tutti, per tutto».'",
            "a 'Padre, come può un malato dire cose così grandi?'",
            "z 'Perché nella malattia vede chiaro ciò che i sani nascondono. Servi gli altri, bacia la terra, ama senza misura.'",
            "z 'Ricorda soprattutto questo: nessuno può giudicare uno schiavo, tantomeno un fratello. Chiedi perdono invece di accusare.'",
            "n 'Quella sera Zosima chiede a Alëša di uscire dalla cella: «Il mondo ha bisogno di te fuori da queste mura».'",
            "jump zosima_death"
        ],

        zosima_death: [
            "scene bg_garden",
            "n 'Due giorni dopo, lo Starets muore serenamente, come una candela che si spegne senza fumo.'",
            "n 'Tutti si aspettano il miracolo: il corpo dei santi non putrefae. Le stanze sono piene di fiori e di attesa.'",
            "show a",
            "a 'Il padre sarà incorrotto. Lo sento. Dio non ci tradirà.'",
            "jump odor_scene"
        ],

        odor_scene: [
            "scene bg_monastery",
            "n 'Ma già la prima notte sale un odore. Al secondo giorno è inequivocabile: il corpo di Zosima decade.'",
            "n 'Lo scandalo esplode. I monaci mormorano. Alcuni parlano apertamente di punizione divina.'",
            "show ra",
            "ra 'Hai visto, Alëša? Il tuo santo puzza come un peccatore qualunque. La natura non fa eccezioni per i creduli.'",
            "n 'E dal suo angolo oscuro, il padre Feraponte digiuna trionfante: «Non ho mai dubitato, io!».'",
            "show a",
            "a 'Signore, perché mi prendi tutto in ventiquattro ore? Prima lui... ora anche la tua verità.'",
            "n 'La fede di Alëša vacilla come una fiamma al vento. È la sua notte oscura.'",
            {
                choice: "Cosa fa Alëša nella crisi?",
                options: {
                    "Pregare nella cella nonostante lo scandalo 🙏": "feraponte_scene",
                    "Fuggire nel chiostro a piangere la fede 😢": "cana_dream",
                    "Correre in città da Grushenka 💃": "onion_parable"
                }
            }
        ],

        feraponte_scene: [
            "scene bg_monastery",
            "n 'Alëša entra nella cella del padre Feraponte, l'asceta estremista rivale di Zosima.'",
            "n 'Feraponte digiuna da anni, vede demoni in ogni angolo e parla con gli spiriti immondi.'",
            "n 'Feraponte: «Il tuo starets era orgoglioso! Io invece... io sto con la Madre di Dio! Ha visitato me in persona!»'",
            "show a",
            "a 'Questo non è spirito, padre. È veleno vestito a sacro.'",
            "n 'Alëša esce barcollando. Il fanatismo e il dubbio, scopre, sono fratelli gemelli.'",
            "jump cana_dream"
        ],

        cana_dream: [
            "scene bg_garden",
            "n 'Sfinuto, Alëša si addormenta mentre si legge il Vangelo: le nozze di Cana di Galilea.'",
            "n 'E sogna lo Starets, vivo e rididente, tra gli invitati di quel matrimonio poverissimo.'",
            "show z",
            "z 'Che cosa cerchi qui, Alëša? Non hai vergogna a venire a noi?'",
            "a 'Padre, ho paura. Il tuo corpo... la gente ride... la mia fede...' ",
            "z 'Stupido! Ma carino stupido. Hai visto il miracolo vero? È l'uomo nuovo che nasce in te adesso.'",
            "z 'Vai, servi pure il vino a questi ospiti umili. L'acqua diventerà vino, sempre, per chi ama.'",
            "n 'Alëša si sveglia con le lacrime sul viso. Esce nel giardino freddo.'",
            "n 'Cadde in ginocchio, debole e giovane, e baciò la terra nera, baciandola e amandola senza misura.'",
            "n '«Bagna la terra con le tue lacrime», cantava dentro di lui, «e rallegrati di questa tua gioia».'",
            "n 'Cadde forte, forte sulla terra, e non sapeva perché l'abbracciasse, né poteva spiegarne la gioia.'",
            "show a",
            "a 'Qualcuno ha visitato la mia anima in quell'ora. Non piango più. Sono risorto.'",
            "jump rebellion_scene"
        ],

        /* ══════════ I RAGAZZI: ILJUŠA E KOLYA ══════════ */

        boys_story_start: [
            "scene bg_school",
            "n 'Alëša vede un gruppo di scolari che tirano sassi a un bambino solo.'",
            "show a",
            "a 'Perché lo colpite? Siete in tanti contro uno!'",
            "n 'Il bambino è Iljuša. I suoi occhi sono pieni di rabbia e lacrime.'",
            "n 'Uno dei ragazzi, Smurov, risponde.'",
            "n 'Smurov: «Ha morso la mano di Krasotkin! E prima aveva pugnalato col temperino! È un mostro!»'",
            {
                choice: "Cosa farà Alëša?",
                options: {
                    "Difendere Iljuša 🛡️": "defend_ilyusha",
                    "Cercare di capire la causa ❓": "investigate_insult",
                    "Parlare con Kolya Krasotkin ⚽": "kolya_krasotkin"
                }
            }
        ],

        defend_ilyusha: [
            "a 'Basta! Non vedete che è disperato?'",
            "n 'Iljuša, però, non accetta la pietà. Si scaglia contro Alëša e gli morde un dito.'",
            "a 'Ah! ... Non importa. Se ti fa sentire meglio, mordi pure.'",
            "n 'Iljuša rimane stupito dalla non-violenza di Alëša.'",
            "n '«Lo farò ancora, se serve», dice Alëša sorridendo. «Ma un giorno capirete perché mio fratello vi ha offeso».'",
            "jump ilyusha_home"
        ],

        investigate_insult: [
            "a 'Cosa è successo prima? Perché tanto odio?'",
            "n 'I ragazzi raccontano che il padre di Iljuša, il capitano Snegirëv, è stato umiliato pubblicamente da Dmitri Karamazov.'",
            "n 'Dmitri lo prese per la barba e lo trascinò per la strada. Il vecchio non si difese nemmeno.'",
            "a 'Mio fratello... Dmitri ha fatto questo? Devo rimediare.'",
            "jump ilyusha_home"
        ],

        kolya_krasotkin: [
            "scene bg_snow",
            "n 'Entra in scena Kolya Krasotkin, tredici anni audacissimi, leader dei ragazzi e autoproclamato ateo socialista.'",
            "show ko",
            "ko 'Io non credo a Dio, signor Karamazov, e nemmeno alla immortalità dell'anima. È scienza, non capriccio!'",
            "n 'Ha un cane, Perezvon, addestrato a trucchi straordinari. E sotto l'armatura, un cuore immensamente tenero.'",
            "show a",
            "a 'Kolya, Iljuša sta morendo. Dobbiamo portargli gioia, non rancore.'",
            "ko 'Lo so... È per questo che soffro in silenzio da settimane. Non dirlo a nessuno, giuro?'",
            "n 'Kolya, che in fondo ha un cuore nobile, decide di riconciliarsi.'",
            "jump ilyusha_deathbed"
        ],

        ilyusha_home: [
            "scene bg_house",
            "n 'Alëša va a casa del capitano Snegirëv per offrire aiuto e scuse.'",
            "n 'La casa è povera, la famiglia in rovina. Sul letto giace la piccola Nina; nell'angolo, un uccello in gabbia.'",
            "show sn",
            "sn 'Offrirsi denaro a me? A un ufficiale? Signor Karamazov, la prego... io sono un uomo perduto, ma non fino a questo punto.'",
            {
                choice: "Come gestisce Alëša l'orgoglio del capitano?",
                options: {
                    "Insistere coi duecento rubli 💵": "snegiryov_refusal",
                    "Proporre solo scuse e rispetto 🤝": "snegiryov_dignity"
                }
            }
        ],

        snegiryov_refusal: [
            "n 'Il capitano prende i duemila rubli che Dmitri gli aveva mandato tramite Alëša.'",
            "n 'Li stringe, li conta con mani tremanti... poi li calpesta uno a uno, calpestandoli con il tacco.'",
            "sn 'Cosa direi al mio ragazzo se accettassi i soldi di chi mi ha picchiato? Che il papà vende l'onore per il pane?'",
            "sn 'No, signore. Calpesto i SUOI soldi, e con loro la mia vergogna. Addio!'",
            "n 'Uscendo, però, li raccoglie di nascosto dall'altro lato della porta. La fame è più forte dell'orgoglio.'",
            "n 'Alëša finge di non vedere. Anche questo, pensa, è misericordia.'",
            "jump kolya_krasotkin"
        ],

        snegiryov_dignity: [
            "a 'Capitano, non porto denaro. Porto solo le scuse di un fratello che non sa cosa ha fatto.'",
            "show sn",
            "sn 'Scuse... Nessuno, in vent'anni, mi aveva più chiamato per nome con rispetto.'",
            "sn 'Il mio Iljuša difende il mio onore come un leoncino. Ma un leoncino contro tutta la scuola... muore.'",
            "a 'Allò lasciate che sia io a dirglielo: suo padre è un galantuomo. E i galantuomi perdonano.'",
            "n 'Il capitano piange nella manica del vecchio uniforme. Per la prima volta da mesi, la casa respira.'",
            "jump kolya_krasotkin"
        ],

        ilyusha_deathbed: [
            "scene bg_house",
            "n 'Al capezzale di Iljuša, tutti i ragazzi si riuniscono. Perezvon fa i suoi trick e il piccolo ride per l'ultima volta.'",
            "show ko",
            "ko 'Iljuša, guarda! Perezvon fa il morto! Su, dai, non fare il malato anche tu!'",
            "n 'Iljuša sorride, ma la malattia è inesorabile. La pancia gonfia, gli occhi lucidi di febbre.'",
            "n 'Iljuša: «Papà, non piangere... quando sarò morto, prendi un altro bambino buono... sceglietene uno solo, il migliore di tutti... e chiamatelo Iljuša».'",
            "n 'Il piccolo muore circondato da amore, sanando con la sua sofferenza le divisioni dei grandi.'",
            "jump epilogue"
        ],

        /* ══════════ GRUSHENKA E KATERINA ══════════ */

        grushenka_path: [
            "scene bg_tavern",
            "show g",
            "g 'Passa la notte in ozio la gente come me, Alëša. Ma stasera il cuore mi batte strano.'",
            "g 'Ho due torturatori: il vecchio che offre tremila rubli, e il figlio che offre la sua vita intera. Divertente, no?'",
            "n 'Una scelta presenta tre possibili sviluppi.'",
            {
                choice: "Come gestire Grushenka?",
                options: {
                    "Cercare di conquistarla 💘": "grushenka_conquest",
                    "Ascoltare la favola della Cipolla 🧅": "onion_parable",
                    "Difenderla dalle calunnie 🛡️": "katerina_path"
                }
            }
        ],

        grushenka_conquest: [
            "show f",
            "f 'Tu sei la domanda e la risposta, mia cara. Tremila rubli e una casa tua, per sempre.'",
            "show g",
            "g 'Vecchio ridicolo. Con i tuoi soldi compri il mio tempo, non il mio cuore.'",
