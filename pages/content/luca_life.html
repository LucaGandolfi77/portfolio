<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca: A Study in Ego - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: 'Inter', sans-serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #111; }
        
        /* Custom overrides for this specific VN style */
        .vn-dialogue-box {
            background: rgba(0, 0, 0, 0.85) !important;
            border-top: 2px solid #ff3333 !important;
        }
        .vn-name {
            color: #ff3333 !important;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Import the RenPy-Lite Library -->
<script src="../../assets/js/renpy-lite.js"></script>

<script>
    // 1. Initialize
    RenPy.init({ container: 'game-container' });

    // 2. Define Assets
    RenPy.image('bg_mirror', '#1a1a1a');
    RenPy.image('bg_childhood', '#ffeb3b'); // Bright but harsh yellow
    RenPy.image('bg_youth', '#2196f3'); // Cold blue
    RenPy.image('bg_chaos', '#e91e63'); // Manic pink/red
    RenPy.image('bg_void', '#000000');

    // 3. Define Characters
    RenPy.define('l', 'Luca', '#ffffff');
    RenPy.define('m', 'Il Riflesso', '#ff3333');
    RenPy.define('w', 'Il Mondo', '#888888');

    // 4. The Script
    RenPy.script({
        start: [
            "scene bg_mirror",
            "l 'Chi sei tu?'",
            "m 'Sono te. O meglio, sono quello che ami di più.'",
            "l 'Non capisco.'",
            "m 'Oh, capisci benissimo. Ripercorriamo i passi della tua... grandezza.'",
            "m 'Ti ricordi quando tutto è iniziato?'",
            { 
                choice: "Dove andiamo?", 
                options: {
                    "All'infanzia": "childhood",
                    "Alla follia": "madness"
                }
            }
        ],
        childhood: [
            "scene bg_childhood",
            "m 'Eravamo piccoli. Il mondo era un buffet e tu eri l'unico ospite.'",
            "w 'Luca, condividi i tuoi giocattoli!'",
            "l 'NO! Sono MIEI. Tutto è MIO.'",
            "m 'Esatto. Perché dovresti condividere la tua luce con le ombre?'",
            "l 'Gli altri non capivano. Erano solo comparse.'",
            "m 'E tu eri il regista. Il protagonista. Il Dio del tuo piccolo universo.'",
            "jump youth"
        ],
        youth: [
            "scene bg_youth",
            "m 'Poi sei cresciuto. E il tuo ego è cresciuto con te.'",
            "l 'Volevo essere il migliore. In tutto.'",
            "m 'Non il migliore. L'UNICO.'",
            "w 'Luca, ci stai ferendo. Non ti importa di nessuno?'",
            "l 'Mi importa della perfezione. E voi siete imperfetti.'",
            "m 'La solitudine è il prezzo dell'eccellenza, dicevi.'",
            "m 'Ma era solitudine? O era solo che non c'era spazio per nessun altro nella stanza?'",
            "jump madness"
        ],
        madness: [
            "scene bg_chaos",
            "m 'Ed eccoci qui. La follia.'",
            "l 'Sento le voci. O sono solo i miei pensieri che rimbalzano troppo forte?'",
            "m 'È il suono del tuo genio che collassa su se stesso.'",
            "l 'Ho costruito castelli in aria.'",
            "m 'E hai bruciato i ponti per arrivarci.'",
            "l 'Sono solo?'",
            "m 'Sei con me. E io sono te. Siamo una folla di uno.'",
            "m 'Il mondo là fuori... esiste davvero? O è solo una proiezione della tua mente?'",
            {
                choice: "La Verità",
                options: {
                    "Il mondo è reale, io sono il mostro": "redemption",
                    "Io sono l'unica realtà": "solipsism"
                }
            }
        ],
        redemption: [
            "scene bg_mirror",
            "l 'No. Loro esistono. Ho fatto del male.'",
            "m 'Debolezza! Sentimentalismo!'",
            "l 'Umanità. Forse è tardi, ma posso ancora rompere questo specchio.'",
            "scene bg_void",
            "l 'CRASH.'",
            "w 'Luca?'",
            "l 'Sono qui. Scusate.'",
            "scene bg_youth",
            "l 'Forse non è la fine della storia.'",
            { choice: "Fine", options: { "Ricomincia": "start", "Esci": "exit" } }
        ],
        solipsism: [
            "scene bg_chaos",
            "l 'Hanno senso solo se io li osservo.'",
            "m 'Sì! SÌ! Tu sei il Sole e loro i pianeti morti!'",
            "l 'Non ho bisogno di nessuno.'",
            "m 'Bruciamo tutto. Che la tua luce sia l'unica cosa che rimane.'",
            "scene bg_void",
            "l '...'",
            "m '...'",
            "l 'È buio.'",
            "m 'Ma almeno è tutto tuo.'",
            { choice: "Fine dell'Ego", options: { "Ricomincia": "start", "Esci": "exit" } }
        ],
        exit: [
            "scene bg_mirror",
            "m 'Non puoi scappare da te stesso.'",
            "l 'Guardami.'",
        ]
    });

    // 5. Run
    RenPy.run();

</script>
</body>
</html>
