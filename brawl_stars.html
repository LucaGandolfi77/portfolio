<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Arena</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent browser zooming/scrolling */
        }
        #gameCanvas {
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .joystick-zone {
            position: absolute;
            bottom: 20px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
            /* border: 1px dashed rgba(255,255,255,0.1); */
        }
        #stick-left { left: 20px; }
        #stick-right { right: 20px; }
        
        .score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .tutorial {
            position: absolute;
            bottom: 180px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="score-board">Score: <span id="scoreVal">0</span></div>
        
        <div class="tutorial">
            <span>Left Stick: Move</span> &nbsp;&nbsp;&nbsp;&nbsp; <span>Right Stick: Shoot</span>
        </div>

        <!-- Touch Zones for Joysticks -->
        <div id="stick-left" class="joystick-zone"></div>
        <div id="stick-right" class="joystick-zone"></div>
    </div>

    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Play Again</button>
        <button onclick="window.location.href='index.html'" style="background:#34495e; margin-top:10px;">Exit</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game State
    let width, height;
    let gameRunning = true;
    let score = 0;
    let lastTime = 0;

    // Entities
    const player = { x: 0, y: 0, radius: 20, speed: 300, color: '#3498db', hp: 100, maxHp: 100 };
    let bullets = [];
    let enemies = [];
    let particles = [];
    
    // Input State
    const input = {
        move: { x: 0, y: 0, active: false, id: null, originX: 0, originY: 0 },
        aim: { x: 0, y: 0, active: false, id: null, originX: 0, originY: 0 },
        shootTimer: 0
    };

    // Config
    const SHOOT_DELAY = 0.2; // Seconds
    const BULLET_SPEED = 600;
    const ENEMY_SPAWN_RATE = 1.5;
    let enemySpawnTimer = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        // Reset player pos if out of bounds or init
        if (player.x === 0 && player.y === 0) {
            player.x = width / 2;
            player.y = height / 2;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling (Touch & Mouse) ---
    const leftZone = document.getElementById('stick-left');
    const rightZone = document.getElementById('stick-right');

    function handleTouchStart(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const x = t.clientX;
            const y = t.clientY;

            // Check Left Zone (Move)
            if (x < width / 2 && !input.move.active) {
                input.move.active = true;
                input.move.id = t.identifier;
                input.move.originX = x;
                input.move.originY = y;
                input.move.x = 0;
                input.move.y = 0;
            }
            // Check Right Zone (Aim)
            else if (x > width / 2 && !input.aim.active) {
                input.aim.active = true;
                input.aim.id = t.identifier;
                input.aim.originX = x;
                input.aim.originY = y;
                input.aim.x = 0;
                input.aim.y = 0;
            }
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            
            if (t.identifier === input.move.id) {
                const dx = t.clientX - input.move.originX;
                const dy = t.clientY - input.move.originY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxDist = 50;
                const angle = Math.atan2(dy, dx);
                
                const clampDist = Math.min(dist, maxDist);
                input.move.x = (Math.cos(angle) * clampDist) / maxDist;
                input.move.y = (Math.sin(angle) * clampDist) / maxDist;
            }
            else if (t.identifier === input.aim.id) {
                const dx = t.clientX - input.aim.originX;
                const dy = t.clientY - input.aim.originY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxDist = 50;
                const angle = Math.atan2(dy, dx);
                
                const clampDist = Math.min(dist, maxDist);
                input.aim.x = (Math.cos(angle) * clampDist) / maxDist;
                input.aim.y = (Math.sin(angle) * clampDist) / maxDist;
            }
        }
    }

    function handleTouchEnd(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (t.identifier === input.move.id) {
                input.move.active = false;
                input.move.x = 0;
                input.move.y = 0;
            }
            if (t.identifier === input.aim.id) {
                input.aim.active = false;
                input.aim.x = 0;
                input.aim.y = 0;
            }
        }
    }

    // Mouse fallback for desktop testing
    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        // Treat as aim stick
        input.aim.active = true;
        input.aim.originX = width / 2; // Center relative for mouse? No, let's just aim towards mouse
    });
    window.addEventListener('mousemove', (e) => {
        if (!('ontouchstart' in window)) {
            // Desktop Mode: WASD to move, Mouse to aim
            const dx = e.clientX - player.x;
            const dy = e.clientY - player.y;
            const angle = Math.atan2(dy, dx);
            input.aim.x = Math.cos(angle);
            input.aim.y = Math.sin(angle);
            input.aim.active = true; // Always aiming with mouse
        }
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    
    // Keyboard
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('touchstart', handleTouchStart, {passive: false});
    window.addEventListener('touchmove', handleTouchMove, {passive: false});
    window.addEventListener('touchend', handleTouchEnd, {passive: false});

    // --- Game Logic ---

    function spawnEnemy() {
        const side = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
        let x, y;
        const buffer = 50;
        
        if (side === 0) { x = Math.random() * width; y = -buffer; }
        else if (side === 1) { x = width + buffer; y = Math.random() * height; }
        else if (side === 2) { x = Math.random() * width; y = height + buffer; }
        else { x = -buffer; y = Math.random() * height; }

        enemies.push({
            x: x,
            y: y,
            radius: 15,
            speed: 100 + Math.random() * 50 + (score * 2), // Get faster
            hp: 30 + (score * 5),
            color: '#e74c3c'
        });
    }

    function update(dt) {
        if (!gameRunning) return;

        // Player Movement (Touch)
        if (input.move.active) {
            player.x += input.move.x * player.speed * dt;
            player.y += input.move.y * player.speed * dt;
        }
        
        // Player Movement (Keyboard Fallback)
        if (!input.move.active) {
            let dx = 0, dy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) dy = -1;
            if (keys['KeyS'] || keys['ArrowDown']) dy = 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx = -1;
            if (keys['KeyD'] || keys['ArrowRight']) dx = 1;
            
            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx*dx + dy*dy);
                player.x += (dx/len) * player.speed * dt;
                player.y += (dy/len) * player.speed * dt;
            }
        }

        // Clamp Player
        player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

        // Shooting
        input.shootTimer -= dt;
        // Auto shoot if aiming stick is pushed
        const isAiming = input.aim.active && (Math.abs(input.aim.x) > 0.1 || Math.abs(input.aim.y) > 0.1);
        // Or mouse click
        const isMouseShooting = isMouseDown && !('ontouchstart' in window);

        if ((isAiming || isMouseShooting) && input.shootTimer <= 0) {
            bullets.push({
                x: player.x,
                y: player.y,
                vx: input.aim.x * BULLET_SPEED,
                vy: input.aim.y * BULLET_SPEED,
                radius: 5,
                life: 2
            });
            input.shootTimer = SHOOT_DELAY;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.life -= dt;
            if (b.life <= 0) bullets.splice(i, 1);
        }

        // Spawn Enemies
        enemySpawnTimer -= dt;
        if (enemySpawnTimer <= 0) {
            spawnEnemy();
            enemySpawnTimer = ENEMY_SPAWN_RATE;
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // Move towards player
            e.x += (dx / dist) * e.speed * dt;
            e.y += (dy / dist) * e.speed * dt;

            // Collision with Player
            if (dist < player.radius + e.radius) {
                gameOver();
            }

            // Collision with Bullets
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                const bdx = b.x - e.x;
                const bdy = b.y - e.y;
                const bdist = Math.sqrt(bdx*bdx + bdy*bdy);
                
                if (bdist < e.radius + b.radius) {
                    // Hit
                    e.hp -= 20;
                    bullets.splice(j, 1);
                    createParticles(e.x, e.y, '#fff');
                    
                    if (e.hp <= 0) {
                        enemies.splice(i, 1);
                        score++;
                        document.getElementById('scoreVal').textContent = score;
                        createParticles(e.x, e.y, e.color);
                    }
                    break;
                }
            }
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            p.alpha = p.life / 0.5;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 5; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 100 + 50;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5,
                color: color,
                alpha: 1
            });
        }
    }

    function draw() {
        // Clear
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, 0, width, height);

        // Grid
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        const gridSize = 50;
        for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }

        // Draw Player
        ctx.save();
        ctx.translate(player.x, player.y);
        // Body
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();
        // Aim Indicator
        if (input.aim.active) {
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(input.aim.x * 50, input.aim.y * 50);
            ctx.stroke();
        }
        ctx.restore();

        // Draw Enemies
        enemies.forEach(e => {
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fill();
            // HP Bar
            ctx.fillStyle = 'red';
            ctx.fillRect(e.x - 10, e.y - 25, 20, 4);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(e.x - 10, e.y - 25, 20 * (e.hp / (30 + score*5)), 4);
        });

        // Draw Bullets
        ctx.fillStyle = '#f1c40f';
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Draw Joysticks (Visual Feedback)
        drawJoystick(input.move, 'left');
        drawJoystick(input.aim, 'right');
    }

    function drawJoystick(stick, side) {
        if (!stick.active) {
            // Draw faint outline where it would be
            const x = side === 'left' ? 95 : width - 95;
            const y = height - 95;
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2);
            ctx.stroke();
            return;
        }

        // Draw active stick
        const baseX = stick.originX;
        const baseY = stick.originY;
        const knobX = baseX + stick.x * 50;
        const knobY = baseY + stick.y * 50;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.beginPath();
        ctx.arc(baseX, baseY, 50, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(knobX, knobY, 20, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop(timestamp) {
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(loop);
    }

    function gameOver() {
        gameRunning = false;
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('finalScore').textContent = score;
    }

    function resetGame() {
        score = 0;
        document.getElementById('scoreVal').textContent = '0';
        player.x = width / 2;
        player.y = height / 2;
        enemies = [];
        bullets = [];
        particles = [];
        gameRunning = true;
        document.getElementById('gameOverScreen').style.display = 'none';
        lastTime = performance.now();
    }

    // Start
    requestAnimationFrame(loop);

</script>
</body>
</html>
