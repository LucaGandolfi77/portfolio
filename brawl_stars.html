<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Arena</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent browser zooming/scrolling */
        }
        #gameCanvas {
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .joystick-zone {
            position: absolute;
            bottom: 20px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
            /* border: 1px dashed rgba(255,255,255,0.1); */
        }
        #stick-left { left: 20px; }
        #stick-right { right: 20px; }
        
        .score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .hp-container {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
        }
        .shield-container {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
            display: none; /* Hidden initially */
        }
        #hp-bar {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.2s;
        }
        #shield-bar {
            width: 100%;
            height: 100%;
            background: #3498db;
            transition: width 0.2s;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 1);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .mode-btn {
            width: 200px;
            margin: 10px;
            padding: 20px;
            font-size: 24px;
            background: #3498db;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .mode-btn:active {
            transform: scale(0.95);
        }
        .mode-desc {
            font-size: 14px;
            color: #bdc3c7;
            margin-bottom: 20px;
            max-width: 300px;
            text-align: center;
        }

        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 2000; /* High z-index to ensure clickable */
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            pointer-events: auto;
        }
        button:hover {
            background: #c0392b;
        }
        .tutorial {
            position: absolute;
            bottom: 180px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="score-board">Score: <span id="scoreVal">0</span></div>
        <div class="shield-container" id="shield-container">
            <div id="shield-bar"></div>
        </div>
        <div class="hp-container">
            <div id="hp-bar"></div>
        </div>
        
        <div class="tutorial">
            <span>Left Stick: Move</span> &nbsp;&nbsp;&nbsp;&nbsp; <span>Right Stick: Shoot</span>
        </div>

        <!-- Touch Zones for Joysticks -->
        <div id="stick-left" class="joystick-zone"></div>
        <div id="stick-right" class="joystick-zone"></div>
    </div>

    <div id="startScreen">
        <h1>BRAWL ARENA</h1>
        
        <button class="mode-btn" onclick="startGame('npc')">VS NPC</button>
        <div class="mode-desc">Survive waves of zombies and tanks!</div>

        <button class="mode-btn" style="background: #8e44ad;" onclick="startGame('bot')">VS BOT</button>
        <div class="mode-desc">Battle Royale: 20 Bots, Looting, Zone Damage. Be the last one standing!</div>
    </div>

    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <button id="btn-retry">Play Again</button>
        <button id="btn-exit" style="background:#34495e; margin-top:10px;">Exit</button>
    </div>

<script src="brawl_map.js"></script>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game State
    let width, height;
    let gameRunning = true;
    let score = 0;
    let lastTime = 0;
    let gameMode = 'npc';

    // Config
    const ZOOM = 0.6;
    let camera = { x: 0, y: 0 };

    function checkCollision(x, y, radius) {
        // Check 4 points around the circle
        if (isSolid(x + radius, y)) return true;
        if (isSolid(x - radius, y)) return true;
        if (isSolid(x, y + radius)) return true;
        if (isSolid(x, y - radius)) return true;
        return false;
    }

    // Weapon Definitions
    const WEAPONS = {
        Fists: { name: 'Fists', damage: 15, delay: 0.3, range: 100, ammo: Infinity, count: 1, spread: 0, speed: 0, color: '#f1c40f', type: 'melee' },
        Peacemaker: { name: 'Peacemaker', damage: 7, delay: 0.5, range: 400, ammo: 30, count: 1, spread: 0.05, speed: 600, color: '#bdc3c7', type: 'gun' },
        AssaultRifle: { name: 'Assault Rifle', damage: 8, delay: 0.2, range: 500, ammo: 30, count: 1, spread: 0.1, speed: 700, color: '#7f8c8d', type: 'gun' },
        SMG: { name: 'SMG', damage: 6, delay: 0.15, range: 450, ammo: 40, count: 1, spread: 0.25, speed: 700, color: '#95a5a6', type: 'gun' },
        Shotgun: { name: 'Shotgun', damage: 8, delay: 1.4, range: 250, ammo: 8, count: 4, spread: 0.4, speed: 550, color: '#34495e', type: 'gun' },
        Sniper: { name: 'Sniper', damage: 25, delay: 0.83, range: 800, ammo: 5, count: 1, spread: 0, speed: 1000, color: '#2c3e50', type: 'gun' },
        DoubleBarrel: { name: 'Double-Barrel', damage: 10, delay: 0.66, range: 350, ammo: 10, count: 2, spread: 0.15, speed: 600, color: '#5d6d7e', type: 'gun' },
        Scar: { name: 'Scar', damage: 12, delay: 0.35, range: 500, ammo: 25, count: 1, spread: 0.05, speed: 750, color: '#d35400', type: 'gun' },
        Kar99: { name: 'Kar99', damage: 40, delay: 1.77, range: 800, ammo: 5, count: 1, spread: 0, speed: 1000, color: '#8e44ad', type: 'gun' },
        Minigun: { name: 'Minigun', damage: 12, delay: 0.08, range: 500, ammo: 100, count: 1, spread: 0.3, speed: 700, color: '#c0392b', type: 'gun' },
        Bazooka: { name: 'Bazooka', damage: 75, delay: 2.0, range: 600, ammo: 3, count: 1, spread: 0, speed: 400, radius: 10, explosive: true, color: '#27ae60', type: 'gun' },
        Quadzooka: { name: 'Quadzooka', damage: 22, delay: 0.5, range: 500, ammo: 12, count: 1, spread: 0.1, speed: 450, radius: 8, explosive: true, color: '#16a085', type: 'gun' }
    };

    // Entities
    const player = { 
        x: MAP_WIDTH / 2, y: MAP_HEIGHT / 2, radius: 15, speed: 300, color: '#3498db', 
        hp: 100, maxHp: 100, shield: 0, maxShield: 100, invulnTimer: 0,
        weapon: { ...WEAPONS.Fists, currentAmmo: Infinity },
        frame: 0,
        frameTimer: 0,
        isMoving: false
    };
    
    // Sprites
    const playerSprite = new Image();
    playerSprite.src = 'assets/sprites/player_sheet.png';
    const enemySprite = new Image();
    enemySprite.src = 'assets/sprites/enemy_sheet.png';
    
    const SPRITE_SIZE = 64; // Source size
    const DRAW_SIZE = 48;   // Destination size

    let bullets = [];
    let enemies = [];
    let particles = [];
    let groundWeapons = [];
    let powerups = [];

    // Timers & Rates
    const ENEMY_SPAWN_RATE = 2.0;
    let enemySpawnTimer = 0;
    
    const WEAPON_SPAWN_RATE = 10.0;
    let weaponSpawnTimer = 0;
    
    const POWERUP_SPAWN_RATE = 15.0;
    let powerupSpawnTimer = 0;

    // Zone Logic
    let zone = {
        x: 0, y: 0, radius: 0,
        targetX: 0, targetY: 0,
        startRadius: 0,
        timer: 0,
        duration: 180 // 3 minutes to shrink
    };

    function spawnPlayerRandomly() {
        let x, y, attempts = 0;
        do {
            x = Math.random() * MAP_WIDTH;
            y = Math.random() * MAP_HEIGHT;
            attempts++;
        } while (isSolid(x, y) && attempts < 100);
        player.x = x;
        player.y = y;
    }

    function initZone() {
        zone.startRadius = Math.max(MAP_WIDTH, MAP_HEIGHT) * 0.8;
        zone.radius = zone.startRadius;
        zone.x = MAP_WIDTH / 2;
        zone.y = MAP_HEIGHT / 2;
        
        // Pick a random safe spot for the final zone
        let tx, ty, attempts = 0;
        do {
            tx = Math.random() * MAP_WIDTH;
            ty = Math.random() * MAP_HEIGHT;
            attempts++;
        } while (isSolid(tx, ty) && attempts < 100);
        
        zone.targetX = tx;
        zone.targetY = ty;
        zone.timer = 0;
    }

    function updateZone(dt) {
        if (!gameRunning) return;
        
        zone.timer += dt;
        const progress = Math.min(zone.timer / zone.duration, 1);
        
        // Shrink radius to 0
        zone.radius = zone.startRadius * (1 - progress);
        
        // Move center towards target
        zone.x = (MAP_WIDTH / 2) + (zone.targetX - (MAP_WIDTH / 2)) * progress;
        zone.y = (MAP_HEIGHT / 2) + (zone.targetY - (MAP_HEIGHT / 2)) * progress;

        // Check Player Damage
        const dx = player.x - zone.x;
        const dy = player.y - zone.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > zone.radius) {
            // Outside Zone - Take Damage
            takeDamage(10 * dt); // Continuous damage
            if (Math.random() < 0.2) createParticles(player.x, player.y, '#e74c3c');
        }
    }

    function spawnPowerup() {
        let x, y, attempts = 0;
        do {
            x = Math.random() * MAP_WIDTH;
            y = Math.random() * MAP_HEIGHT;
            attempts++;
        } while (isSolid(x, y) && attempts < 10);
        
        if (attempts >= 10) return;

        const type = Math.random() < 0.5 ? 'health' : 'shield';
        powerups.push({ x, y, type, radius: 20, floatOffset: 0 });
    }

    function checkPowerupCollisions() {
        for (let i = powerups.length - 1; i >= 0; i--) {
            const p = powerups[i];
            p.floatOffset = Math.sin(Date.now() / 200) * 5;
            
            const dx = player.x - p.x;
            const dy = player.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < player.radius + p.radius) {
                // Collect
                if (p.type === 'health') {
                    player.hp = Math.min(player.hp + 50, player.maxHp);
                    updateHealthUI();
                    createParticles(player.x, player.y, '#2ecc71');
                } else if (p.type === 'shield') {
                    player.shield = 100;
                    updateHealthUI();
                    createParticles(player.x, player.y, '#3498db');
                }
                powerups.splice(i, 1);
            }
        }
    }

    function takeDamage(amount) {
        if (player.shield > 0) {
            player.shield -= amount;
            if (player.shield < 0) {
                player.hp += player.shield; // Apply overflow damage to HP
                player.shield = 0;
            }
        } else {
            player.hp -= amount;
        }
        
        updateHealthUI();
        
        if (player.hp <= 0) {
            gameOver();
        }
    }

    function updateHealthUI() {
        document.getElementById('hp-bar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
        
        const shieldContainer = document.getElementById('shield-container');
        if (player.shield > 0) {
            shieldContainer.style.display = 'block';
            document.getElementById('shield-bar').style.width = Math.max(0, (player.shield / player.maxShield) * 100) + '%';
        } else {
            shieldContainer.style.display = 'none';
        }
    }
    
    // --- Input Handling (Touch & Mouse) ---
    
    class Joystick {
        constructor(maxRadius = 70) {
            this.active = false;
            this.id = null;
            this.origin = { x: 0, y: 0 };
            this.current = { x: 0, y: 0 };
            this.vector = { x: 0, y: 0 };
            this.maxRadius = maxRadius;
        }

        start(id, x, y) {
            this.active = true;
            this.id = id;
            this.origin = { x, y };
            this.current = { x, y };
            this.vector = { x: 0, y: 0 };
        }

        move(x, y) {
            if (!this.active) return;
            this.current = { x, y };
            const dx = x - this.origin.x;
            const dy = y - this.origin.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 0) {
                // Allow pulling beyond maxRadius, but clamp vector to 1.0
                const cappedDist = Math.min(dist, this.maxRadius);
                this.vector = {
                    x: (dx / dist) * (cappedDist / this.maxRadius),
                    y: (dy / dist) * (cappedDist / this.maxRadius)
                };
            } else {
                this.vector = { x: 0, y: 0 };
            }
        }

        end() {
            this.active = false;
            this.id = null;
            this.vector = { x: 0, y: 0 };
        }
    }

    const leftStick = new Joystick(70);
    const rightStick = new Joystick(70);
    let shootTimer = 0;

    function handleTouchStart(e) {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const x = t.clientX;
            const y = t.clientY;

            // Left half for movement
            if (x < width / 2) {
                if (!leftStick.active) leftStick.start(t.identifier, x, y);
            }
            // Right half for aiming
            else {
                if (!rightStick.active) rightStick.start(t.identifier, x, y);
            }
        }
    }

    function handleTouchMove(e) {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (leftStick.active && leftStick.id === t.identifier) {
                leftStick.move(t.clientX, t.clientY);
            }
            if (rightStick.active && rightStick.id === t.identifier) {
                rightStick.move(t.clientX, t.clientY);
            }
        }
    }

    function handleTouchEnd(e) {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (leftStick.active && leftStick.id === t.identifier) leftStick.end();
            if (rightStick.active && rightStick.id === t.identifier) rightStick.end();
        }
    }

    // Mouse fallback for desktop testing
    let isMouseDown = false;
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
    });
    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    
    // Keyboard
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('touchstart', handleTouchStart, {passive: false});
    window.addEventListener('touchmove', handleTouchMove, {passive: false});
    window.addEventListener('touchend', handleTouchEnd, {passive: false});
    window.addEventListener('touchcancel', handleTouchEnd, {passive: false});

    // --- Game Logic ---

    function spawnEnemy() {
        const side = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
        let x, y;
        const buffer = 100;
        
        // Spawn relative to camera view, but outside
        const viewW = width / ZOOM;
        const viewH = height / ZOOM;
        const viewX = camera.x;
        const viewY = camera.y;

        if (side === 0) { x = viewX + Math.random() * viewW; y = viewY - buffer; }
        else if (side === 1) { x = viewX + viewW + buffer; y = viewY + Math.random() * viewH; }
        else if (side === 2) { x = viewX + Math.random() * viewW; y = viewY + viewH + buffer; }
        else { x = viewX - buffer; y = viewY + Math.random() * viewH; }

        // Ensure valid spawn (not in wall)
        if (isSolid(x, y)) return; // Skip if invalid

        // Ensure not too close to player (Safety check)
        const distToPlayer = Math.sqrt((x - player.x) ** 2 + (y - player.y) ** 2);
        if (distToPlayer < 500) return;

        // Determine Type
        const isTank = Math.random() < 0.25; // 25% chance for Tank
        
        let type, speed, hp, radius, row;
        
        if (isTank) {
            type = 'tank';
            speed = 60 + Math.random() * 20; // Slow
            hp = 60 + (score * 5);           // Reduced HP
            radius = 20;
            row = 1; // 2nd row in sprite sheet
        } else {
            type = 'normal';
            speed = 120 + Math.random() * 40 + (score * 2); // Fast
            hp = 20 + (score * 2);                          // Reduced HP
            radius = 15;
            row = 0; // 1st row
        }

        enemies.push({
            x: x,
            y: y,
            radius: radius,
            speed: speed,
            hp: hp,
            maxHp: hp,
            type: type,
            row: row,
            frame: 0,
            frameTimer: 0,
            state: 'chase',
            attackTimer: 0
        });
    }

    function spawnBot() {
        let x, y, attempts = 0;
        do {
            x = Math.random() * MAP_WIDTH;
            y = Math.random() * MAP_HEIGHT;
            attempts++;
        } while (isSolid(x, y) && attempts < 100);
        
        if (attempts >= 100) return;

        // Give bot a random weapon
        const keys = Object.keys(WEAPONS);
        const spawnableKeys = keys.filter(k => k !== 'Fists');
        const randomKey = spawnableKeys[Math.floor(Math.random() * spawnableKeys.length)];
        const weapon = { ...WEAPONS[randomKey], currentAmmo: Infinity };

        enemies.push({
            x: x,
            y: y,
            radius: 15,
            speed: 280,
            hp: 100,
            maxHp: 100,
            type: 'bot',
            row: 0,
            frame: 0,
            frameTimer: 0,
            state: 'wander',
            weapon: weapon,
            shootTimer: 0,
            targetX: x,
            targetY: y,
            changeDirTimer: 0
        });
    }

    function updateBotAI(bot, dt) {
        // 1. Zone Logic
        const dxZone = bot.x - zone.x;
        const dyZone = bot.y - zone.y;
        const distZone = Math.sqrt(dxZone*dxZone + dyZone*dyZone);
        
        let moveX = 0, moveY = 0;

        if (distZone > zone.radius * 0.8) {
            // Move to center
            moveX = -dxZone;
            moveY = -dyZone;
        } else {
            // Wander or Chase
            let nearest = null;
            let minDst = Infinity;

            // Check player
            const dPlayer = Math.sqrt((player.x - bot.x)**2 + (player.y - bot.y)**2);
            if (dPlayer < 600) {
                nearest = player;
                minDst = dPlayer;
            }
            
            if (nearest) {
                moveX = nearest.x - bot.x;
                moveY = nearest.y - bot.y;
                
                // Shoot
                if (bot.shootTimer <= 0) {
                    fireWeapon(bot, moveX/minDst, moveY/minDst);
                }
            } else {
                // Wander
                bot.changeDirTimer -= dt;
                if (bot.changeDirTimer <= 0) {
                    bot.targetX = bot.x + (Math.random() - 0.5) * 400;
                    bot.targetY = bot.y + (Math.random() - 0.5) * 400;
                    bot.changeDirTimer = 2.0;
                }
                moveX = bot.targetX - bot.x;
                moveY = bot.targetY - bot.y;
            }
        }
        
        // Normalize and Move
        const len = Math.sqrt(moveX*moveX + moveY*moveY);
        if (len > 0) {
            moveX /= len;
            moveY /= len;
            
            let nextX = bot.x + moveX * bot.speed * dt;
            if (!checkCollision(nextX, bot.y, bot.radius)) bot.x = nextX;
            
            let nextY = bot.y + moveY * bot.speed * dt;
            if (!checkCollision(bot.x, nextY, bot.radius)) bot.y = nextY;
        }
        
        if (bot.shootTimer > 0) bot.shootTimer -= dt;
    }

    function spawnWeapon() {
        const keys = Object.keys(WEAPONS);
        const spawnableKeys = keys.filter(k => k !== 'Fists');
        const randomKey = spawnableKeys[Math.floor(Math.random() * spawnableKeys.length)];
        const template = WEAPONS[randomKey];
        
        let x, y;
        let attempts = 0;
        do {
            x = Math.random() * MAP_WIDTH;
            y = Math.random() * MAP_HEIGHT;
            attempts++;
        } while (isSolid(x, y) && attempts < 10);

        if (attempts >= 10) return;

        groundWeapons.push({
            x: x,
            y: y,
            radius: 15,
            data: template,
            floatOffset: 0
        });
    }

    function update(dt) {
        if (!gameRunning) return;

        updateZone(dt);
        checkPowerupCollisions();

        // Powerup Spawning
        powerupSpawnTimer -= dt;
        if (powerupSpawnTimer <= 0) {
            spawnPowerup();
            powerupSpawnTimer = POWERUP_SPAWN_RATE;
        }

        // Player Invulnerability
        if (player.invulnTimer > 0) {
            player.invulnTimer -= dt;
        }

        // Player Movement (Touch)
        let dx = 0, dy = 0;
        if (leftStick.active) {
            dx = leftStick.vector.x * player.speed * dt;
            dy = leftStick.vector.y * player.speed * dt;
        } else {
            // Keyboard
            let kx = 0, ky = 0;
            if (keys['KeyW'] || keys['ArrowUp']) ky = -1;
            if (keys['KeyS'] || keys['ArrowDown']) ky = 1;
            if (keys['KeyA'] || keys['ArrowLeft']) kx = -1;
            if (keys['KeyD'] || keys['ArrowRight']) kx = 1;
            
            if (kx !== 0 || ky !== 0) {
                const len = Math.sqrt(kx*kx + ky*ky);
                dx = (kx/len) * player.speed * dt;
                dy = (ky/len) * player.speed * dt;
            }
        }

        // Apply Movement with Collision (X axis)
        let nextX = player.x + dx;
        if (!checkCollision(nextX, player.y, player.radius)) {
            player.x = nextX;
        }

        // Apply Movement with Collision (Y axis)
        let nextY = player.y + dy;
        if (!checkCollision(player.x, nextY, player.radius)) {
            player.y = nextY;
        }

        // Animation State
        player.isMoving = (dx !== 0 || dy !== 0);
        if (player.isMoving) {
            player.frameTimer += dt;
            if (player.frameTimer > 0.1) { // 100ms per frame
                player.frame = (player.frame + 1) % 4;
                player.frameTimer = 0;
            }
        } else {
            player.frame = 0; // Idle
        }

        // Clamp Player to Map
        player.x = Math.max(player.radius, Math.min(MAP_WIDTH - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(MAP_HEIGHT - player.radius, player.y));

        // Update Camera (Zoomed)
        const viewW = width / ZOOM;
        const viewH = height / ZOOM;
        camera.x = player.x - viewW / 2;
        camera.y = player.y - viewH / 2;
        camera.x = Math.max(0, Math.min(camera.x, MAP_WIDTH - viewW));
        camera.y = Math.max(0, Math.min(camera.y, MAP_HEIGHT - viewH));

        // Weapon Spawning
        weaponSpawnTimer -= dt;
        if (weaponSpawnTimer <= 0) {
            spawnWeapon();
            weaponSpawnTimer = WEAPON_SPAWN_RATE + Math.random() * 2;
        }

        // Weapon Pickup
        for (let i = groundWeapons.length - 1; i >= 0; i--) {
            const w = groundWeapons[i];
            w.floatOffset = Math.sin(Date.now() / 200) * 5;
            
            const dx = player.x - w.x;
            const dy = player.y - w.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < player.radius + w.radius) {
                player.weapon = { ...w.data, currentAmmo: w.data.ammo };
                groundWeapons.splice(i, 1);
                createParticles(player.x, player.y, '#fff');
            }
        }

        // Shooting
        shootTimer -= dt;
        const isAiming = rightStick.active && (Math.abs(rightStick.vector.x) > 0.1 || Math.abs(rightStick.vector.y) > 0.1);
        const isMouseShooting = isMouseDown;

        if ((isAiming || isMouseShooting) && shootTimer <= 0) {
            let aimX = 0, aimY = 0;
            if (isAiming) {
                aimX = rightStick.vector.x;
                aimY = rightStick.vector.y;
            } else {
                // Mouse Aim
                const screenX = (player.x - camera.x) * ZOOM;
                const screenY = (player.y - camera.y) * ZOOM;
                const mdx = mouseX - screenX;
                const mdy = mouseY - screenY;
                const len = Math.sqrt(mdx*mdx + mdy*mdy);
                aimX = mdx/len;
                aimY = mdy/len;
            }
            fireWeapon(player, aimX, aimY);
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.life -= dt;
            
            // Bullet Wall Collision
            if (isSolid(b.x, b.y)) {
                b.life = 0;
                createParticles(b.x, b.y, '#bdc3c7');
            }

            // Bullet Player Collision
            if (b.owner !== player) {
                const dx = player.x - b.x;
                const dy = player.y - b.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < player.radius + b.radius) {
                    takeDamage(b.damage);
                    createParticles(player.x, player.y, '#e74c3c');
                    if (!b.explosive && !b.isMelee) b.life = 0;
                }
            }

            if (b.life <= 0) bullets.splice(i, 1);
        }

        // Spawn Enemies (NPC Mode)
        if (gameMode === 'npc') {
            enemySpawnTimer -= dt;
            if (enemySpawnTimer <= 0) {
                spawnEnemy();
                enemySpawnTimer = ENEMY_SPAWN_RATE;
            }
        } else if (gameMode === 'bot') {
            // Check Win Condition
            if (enemies.length === 0) {
                // Win!
                gameRunning = false;
                document.getElementById('gameOverScreen').style.display = 'flex';
                document.querySelector('#gameOverScreen h1').textContent = 'VICTORY!';
                document.getElementById('finalScore').textContent = 'Last Man Standing';
            }
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            
            if (e.type === 'bot') {
                updateBotAI(e, dt);
            } else {
                // Existing NPC Logic
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // AI Logic
                if (e.state === 'chase') {
                    if (dist < 40) { // Close enough to attack
                        e.state = 'attack';
                        e.attackTimer = 0.5; // Windup
                    } else {
                        let ex = (dx / dist) * e.speed * dt;
                        let ey = (dy / dist) * e.speed * dt;
                        if (!checkCollision(e.x + ex, e.y, e.radius)) e.x += ex;
                        if (!checkCollision(e.x, e.y + ey, e.radius)) e.y += ey;
                    }
                } else if (e.state === 'attack') {
                    e.attackTimer -= dt;
                    if (e.attackTimer <= 0) {
                        // Lunge!
                        const lungeSpeed = 400;
                        e.x += (dx / dist) * lungeSpeed * dt * 5; // Burst move
                        e.y += (dy / dist) * lungeSpeed * dt * 5;
                        e.state = 'cooldown';
                        e.attackTimer = 1.0;
                    }
                } else if (e.state === 'cooldown') {
                    e.attackTimer -= dt;
                    if (e.attackTimer <= 0) e.state = 'chase';
                }

                // Collision with Player (Damage)
                if (dist < player.radius + e.radius) {
                    if (player.invulnTimer <= 0) {
                        takeDamage(20);
                        player.invulnTimer = 1.0; // 1 sec invuln
                        createParticles(player.x, player.y, '#e74c3c');
                    }
                }
            }

            // Animation
            e.frameTimer += dt;
            if (e.frameTimer > 0.15) {
                e.frame = (e.frame + 1) % 4;
                e.frameTimer = 0;
            }

            // Collision with Bullets
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (b.owner === e) continue; // Don't hit self

                const bdx = b.x - e.x;
                const bdy = b.y - e.y;
                const bdist = Math.sqrt(bdx*bdx + bdy*bdy);
                
                if (bdist < e.radius + b.radius) {
                    // Hit
                    e.hp -= b.damage;
                    
                    if (!b.explosive && !b.isMelee) {
                        bullets.splice(j, 1);
                    }
                    
                    createParticles(e.x, e.y, '#fff');
                    
                    if (e.hp <= 0) {
                        enemies.splice(i, 1);
                        if (gameMode === 'npc') {
                            score++;
                            document.getElementById('scoreVal').textContent = score;
                        }
                        // Color based on type for particles
                        const pColor = e.type === 'tank' ? '#8e44ad' : '#e74c3c';
                        createParticles(e.x, e.y, pColor);
                    }
                    break;
                }
            }
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            p.alpha = p.life / 0.5;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function fireWeapon(entity, aimX, aimY) {
        const w = entity.weapon;
        
        if (w.currentAmmo <= 0 && w.name !== 'Fists') {
            entity.weapon = { ...WEAPONS.Fists, currentAmmo: Infinity };
            return;
        }

        if (w.name !== 'Fists') {
            w.currentAmmo--;
        }

        if (entity === player) {
            shootTimer = w.delay;
        } else {
            entity.shootTimer = w.delay;
        }

        let aimAngle = Math.atan2(aimY, aimX);
        
        // Melee Logic
        if (w.type === 'melee') {
            bullets.push({
                x: entity.x,
                y: entity.y,
                vx: aimX * 300,
                vy: aimY * 300,
                radius: 15,
                life: 0.15,
                damage: w.damage,
                color: 'transparent',
                isMelee: true,
                owner: entity
            });
            createParticles(entity.x + aimX * 30, entity.y + aimY * 30, '#f1c40f');
            return;
        }

        // Gun Logic
        for (let i = 0; i < w.count; i++) {
            const spread = (Math.random() - 0.5) * w.spread;
            const angle = aimAngle + spread;
            const vx = Math.cos(angle) * w.speed;
            const vy = Math.sin(angle) * w.speed;
            
            bullets.push({
                x: entity.x,
                y: entity.y,
                vx: vx,
                vy: vy,
                radius: w.radius || 5,
                life: w.range / w.speed,
                damage: w.damage,
                explosive: w.explosive || false,
                color: w.color,
                owner: entity
            });
        }
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 5; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 100 + 50;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5,
                color: color,
                alpha: 1
            });
        }
    }

    let patterns = {};

    function initPatterns() {
        // Grass Pattern
        const grassCanvas = document.createElement('canvas');
        grassCanvas.width = 64;
        grassCanvas.height = 64;
        const gCtx = grassCanvas.getContext('2d');
        gCtx.fillStyle = '#2ecc71'; // Base
        gCtx.fillRect(0, 0, 64, 64);
        gCtx.fillStyle = '#27ae60'; // Darker
        gCtx.fillRect(0, 0, 32, 32);
        gCtx.fillRect(32, 32, 32, 32);
        patterns.grass = ctx.createPattern(grassCanvas, 'repeat');

        // Sand Pattern
        const sandCanvas = document.createElement('canvas');
        sandCanvas.width = 64;
        sandCanvas.height = 64;
        const sCtx = sandCanvas.getContext('2d');
        sCtx.fillStyle = '#f1c40f'; // Base
        sCtx.fillRect(0, 0, 64, 64);
        sCtx.fillStyle = '#f39c12'; // Darker
        sCtx.beginPath();
        sCtx.arc(32, 32, 8, 0, Math.PI*2);
        sCtx.fill();
        patterns.sand = ctx.createPattern(sandCanvas, 'repeat');

        // Snow Pattern
        const snowCanvas = document.createElement('canvas');
        snowCanvas.width = 64;
        snowCanvas.height = 64;
        const snCtx = snowCanvas.getContext('2d');
        snCtx.fillStyle = '#ecf0f1'; // Base
        snCtx.fillRect(0, 0, 64, 64);
        snCtx.fillStyle = '#bdc3c7'; // Darker
        snCtx.fillRect(16, 16, 8, 8);
        snCtx.fillRect(48, 48, 8, 8);
        patterns.snow = ctx.createPattern(snowCanvas, 'repeat');

        // Dark Pattern
        const darkCanvas = document.createElement('canvas');
        darkCanvas.width = 64;
        darkCanvas.height = 64;
        const dCtx = darkCanvas.getContext('2d');
        dCtx.fillStyle = '#34495e'; // Base
        dCtx.fillRect(0, 0, 64, 64);
        dCtx.fillStyle = '#2c3e50'; // Darker
        dCtx.beginPath();
        dCtx.moveTo(0, 64);
        dCtx.lineTo(64, 0);
        dCtx.stroke();
        patterns.dark = ctx.createPattern(darkCanvas, 'repeat');
    }

    function draw() {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        
        // Apply Zoom
        ctx.scale(ZOOM, ZOOM);
        ctx.translate(-camera.x, -camera.y);

        // Draw Map
        const viewW = width / ZOOM;
        const viewH = height / ZOOM;
        const startCol = Math.floor(camera.x / TILE_SIZE);
        const endCol = startCol + (viewW / TILE_SIZE) + 1;
        const startRow = Math.floor(camera.y / TILE_SIZE);
        const endRow = startRow + (viewH / TILE_SIZE) + 1;

        for (let r = startRow; r <= endRow; r++) {
            for (let c = startCol; c <= endCol; c++) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
                const tile = map[r * COLS + c];
                const x = c * TILE_SIZE;
                const y = r * TILE_SIZE;

                if (tile === TILES.GRASS || tile === TILES.WALL_GRASS) ctx.fillStyle = patterns.grass || '#27ae60';
                else if (tile === TILES.SAND || tile === TILES.WALL_SAND) ctx.fillStyle = patterns.sand || '#f1c40f';
                else if (tile === TILES.SNOW || tile === TILES.WALL_SNOW) ctx.fillStyle = patterns.snow || '#ecf0f1';
                else if (tile === TILES.DARK || tile === TILES.WALL_DARK) ctx.fillStyle = patterns.dark || '#34495e';
                
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                // ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                // ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                // Draw Wall
                if (tile % 2 !== 0) {
                    if (tile === TILES.WALL_GRASS) {
                        ctx.fillStyle = '#145A32'; // Dark Green
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#27ae60'; // Lighter Top
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE - 15);
                    } else if (tile === TILES.WALL_SAND) {
                        ctx.fillStyle = '#A04000'; // Dark Orange
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#f1c40f'; // Lighter Top
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE - 15);
                    } else if (tile === TILES.WALL_SNOW) {
                        ctx.fillStyle = '#7F8C8D'; // Dark Grey
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#ecf0f1'; // Lighter Top
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE - 15);
                    } else if (tile === TILES.WALL_DARK) {
                        ctx.fillStyle = '#17202A'; // Very Dark
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#34495e'; // Lighter Top
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE - 15);
                    }
                }
            }
        }

        // Zone (Fire Wall)
        ctx.save();
        ctx.beginPath();
        // Outer huge rectangle
        ctx.rect(camera.x - 100, camera.y - 100, width/ZOOM + 200, height/ZOOM + 200);
        // Inner circle (hole)
        ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
        ctx.fill();
        
        // Zone Border
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#e74c3c';
        ctx.stroke();
        ctx.restore();

        // Powerups
        powerups.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y + p.floatOffset);
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.type === 'health' ? '#2ecc71' : '#3498db';
            
            ctx.fillStyle = p.type === 'health' ? '#2ecc71' : '#3498db';
            ctx.fillRect(-15, -15, 30, 30);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(-15, -15, 30, 30);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.type === 'health' ? '+' : 'S', 0, 1);
            ctx.restore();
        });

        // Ground Weapons
        groundWeapons.forEach(w => {
            ctx.save();
            ctx.translate(w.x, w.y + w.floatOffset);
            ctx.shadowBlur = 15;
            ctx.shadowColor = w.data.color;
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(0, 0, w.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = w.data.color;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(w.data.name, 0, w.radius + 18);
            ctx.restore();
        });

        // Player
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Invulnerability Blink
        if (player.invulnTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }

        let angle = 0;
        if (rightStick.active && (Math.abs(rightStick.vector.x) > 0.1 || Math.abs(rightStick.vector.y) > 0.1)) {
            angle = Math.atan2(rightStick.vector.y, rightStick.vector.x);
        } else if (player.isMoving) {
            if (leftStick.active) angle = Math.atan2(leftStick.vector.y, leftStick.vector.x);
            else {
                let kx = 0, ky = 0;
                if (keys['KeyW'] || keys['ArrowUp']) ky = -1;
                if (keys['KeyS'] || keys['ArrowDown']) ky = 1;
                if (keys['KeyA'] || keys['ArrowLeft']) kx = -1;
                if (keys['KeyD'] || keys['ArrowRight']) kx = 1;
                if (kx !== 0 || ky !== 0) angle = Math.atan2(ky, kx);
            }
        }
        
        ctx.rotate(angle);
        ctx.drawImage(playerSprite, player.frame * SPRITE_SIZE, 0, SPRITE_SIZE, SPRITE_SIZE, -DRAW_SIZE/2, -DRAW_SIZE/2, DRAW_SIZE, DRAW_SIZE);
        ctx.restore();

        // Enemies
        enemies.forEach(e => {
            ctx.save();
            ctx.translate(e.x, e.y);
            
            // HP Bar
            ctx.fillStyle = 'red';
            ctx.fillRect(-15, -e.radius - 10, 30, 4);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(-15, -e.radius - 10, 30 * (e.hp / e.maxHp), 4);

            // Attack Windup Indicator
            if (e.state === 'attack') {
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, e.radius + 5, 0, Math.PI*2);
                ctx.stroke();
            }

            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            ctx.rotate(angle);
            ctx.drawImage(enemySprite, e.frame * SPRITE_SIZE, e.row * SPRITE_SIZE, SPRITE_SIZE, SPRITE_SIZE, -e.radius * 1.5, -e.radius * 1.5, e.radius * 3, e.radius * 3);
            ctx.restore();
        });

        // Bullets
        ctx.fillStyle = '#f1c40f';
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        ctx.restore(); // End Zoom/Camera

        // Damage Overlay (Fire Effect)
        const zdx = player.x - zone.x;
        const zdy = player.y - zone.y;
        const zdist = Math.sqrt(zdx*zdx + zdy*zdy);
        if (zdist > zone.radius) {
             ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
             ctx.fillRect(0, 0, width, height);
        }

        // UI
        drawJoystick(leftStick, 'left');
        drawJoystick(rightStick, 'right');

        ctx.fillStyle = 'white';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'left';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText(`Weapon: ${player.weapon.name}`, 20, 40);
        const ammoText = player.weapon.currentAmmo === Infinity ? '∞' : player.weapon.currentAmmo;
        ctx.fillText(`Ammo: ${ammoText}`, 20, 65);
        ctx.shadowBlur = 0;
    }

    function drawJoystick(stick, side) {
        if (!stick.active) {
            // Draw faint outline where it would be
            const x = side === 'left' ? 95 : width - 95;
            const y = height - 95;
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2);
            ctx.stroke();
            return;
        }

        // Draw active stick
        const baseX = stick.origin.x;
        const baseY = stick.origin.y;
        const knobX = stick.current.x;
        const knobY = stick.current.y;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.beginPath();
        ctx.arc(baseX, baseY, stick.maxRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(knobX, knobY, 20, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop(timestamp) {
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(loop);
    }

    function startGame(mode) {
        gameMode = mode;
        document.getElementById('startScreen').style.display = 'none';
        resetGame();
    }

    function gameOver() {
        gameRunning = false;
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('finalScore').textContent = score;
    }

    function resetGame() {
        score = 0;
        document.getElementById('scoreVal').textContent = '0';
        spawnPlayerRandomly();
        initZone();
        player.hp = 100;
        player.shield = 0;
        updateHealthUI();
        player.invulnTimer = 0;
        player.weapon = { ...WEAPONS.Fists, currentAmmo: Infinity };
        enemies = [];
        bullets = [];
        particles = [];
        groundWeapons = [];
        powerups = [];
        gameRunning = true;
        document.getElementById('gameOverScreen').style.display = 'none';
        lastTime = performance.now();

        if (gameMode === 'bot') {
            for (let i = 0; i < 20; i++) spawnBot();
            // Spawn extra weapons for bots
            for (let i = 0; i < 30; i++) spawnWeapon();
        }
    }

    // Button Listeners
    document.getElementById('btn-retry').addEventListener('click', resetGame);
    document.getElementById('btn-exit').addEventListener('click', () => {
        window.location.href = 'index.html';
    });

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Start
    initPatterns();
    spawnPlayerRandomly();
    initZone();
    gameRunning = false; // Wait for start screen
    requestAnimationFrame(loop);

</script>
